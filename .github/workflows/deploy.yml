name: CI gate

# This workflow validates every push to main. It does NOT deploy.
#
# Production deploys to marlbridge.com are handled by Cloudflare's own Git
# integration on the `mb` Worker, which builds from this repository on push.
# See docs/decision-log.md, D-103, for why the wrangler-action deploy step
# that used to live at the end of this job was removed rather than repaired.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (also runs validate:academic as part of the build chain)
        run: npm run build

      - name: Run full audit gate (needs the built dist/ above)
        run: npm run audit:all

      - name: Negative-fixture validation suite
        run: node scripts/test-negative-validation-suite.mjs

      - name: Cross-board regression check
        run: node scripts/test-cross-board-regression.mjs

      - name: Enquiry validation unit tests
        run: npm run test:api

      - name: Revision-tools and tier unit tests
        run: npm run test:tools

      # D-396: the study-resource journeys (D-395) in a real browser against
      # the built site: course finder, course pages, resource pages, course
      # memory, course-only search, keyboard use, phone width, JavaScript off.
      # Playwright is installed for this step only (not a project dependency).
      - name: Browser journeys (study resources)
        run: |
          npm i --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          (cd dist && python3 -m http.server 4402 > /dev/null 2>&1 &)
          sleep 2
          node scripts/e2e-navigation-journeys.mjs http://localhost:4402
