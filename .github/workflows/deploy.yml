name: CI gate

# This workflow validates every push to main. It does NOT deploy.
#
# Production deploys to marlbridge.com are handled by Cloudflare's own Git
# integration on the `mb` Worker, which builds from this repository on push.
# See docs/decision-log.md, D-103, for why the wrangler-action deploy step
# that used to live at the end of this job was removed rather than repaired.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (also runs validate:academic as part of the build chain)
        run: npm run build

      - name: Run full audit gate (needs the built dist/ above)
        run: npm run audit:all

      - name: Negative-fixture validation suite
        run: node scripts/test-negative-validation-suite.mjs

      - name: Cross-board regression check
        run: node scripts/test-cross-board-regression.mjs

      - name: Enquiry validation unit tests
        run: node --experimental-strip-types --test functions/api/__tests__/enquiry-validation.test.mjs
