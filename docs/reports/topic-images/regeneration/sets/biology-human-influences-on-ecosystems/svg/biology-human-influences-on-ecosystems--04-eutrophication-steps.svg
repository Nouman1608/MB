<rect width="900" height="1160" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eutrophication in six steps</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic</text>
<rect x="30" y="120" width="370" height="150" rx="14" fill="#d3e5ec" stroke="#1e2a44" stroke-width="2.5"/>
<line x1="215" y1="272" x2="215" y2="290" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/>
<circle cx="432" cy="162" r="19" fill="#1e2a44"/><text x="432" y="169" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="468" y="169" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">More nitrate and other ions</text>
<text x="468" y="209" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">from fertiliser or sewage</text>
<rect x="30" y="292" width="370" height="150" rx="14" fill="#d3e5ec" stroke="#1e2a44" stroke-width="2.5"/>
<line x1="215" y1="444" x2="215" y2="462" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/>
<circle cx="432" cy="334" r="19" fill="#1e2a44"/><text x="432" y="341" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="468" y="341" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Producers (algae) grow fast</text>
<rect x="30" y="464" width="370" height="150" rx="14" fill="#d3e5ec" stroke="#1e2a44" stroke-width="2.5"/>
<line x1="215" y1="616" x2="215" y2="634" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/>
<circle cx="432" cy="506" r="19" fill="#1e2a44"/><text x="432" y="513" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="468" y="513" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Producers die:</text>
<text x="468" y="553" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">more decomposition</text>
<rect x="30" y="636" width="370" height="150" rx="14" fill="#d3e5ec" stroke="#1e2a44" stroke-width="2.5"/>
<line x1="215" y1="788" x2="215" y2="806" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/>
<circle cx="432" cy="678" r="19" fill="#b5602e"/><text x="432" y="685" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="468" y="685" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Decomposers respire aerobically</text>
<text x="468" y="725" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Key link: they use up the oxygen</text>
<rect x="30" y="808" width="370" height="150" rx="14" fill="#d3e5ec" stroke="#1e2a44" stroke-width="2.5"/>
<line x1="215" y1="960" x2="215" y2="978" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/>
<circle cx="432" cy="850" r="19" fill="#1e2a44"/><text x="432" y="857" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="468" y="857" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Dissolved oxygen falls</text>
<text x="468" y="897" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">9.0 to 2.7 mg/dm³</text>
<text x="468" y="929" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">= 70 % decrease</text>
<rect x="30" y="980" width="370" height="150" rx="14" fill="#d3e5ec" stroke="#1e2a44" stroke-width="2.5"/>
<circle cx="432" cy="1022" r="19" fill="#1e2a44"/><text x="432" y="1029" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="468" y="1029" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Fish and other animals die</text>
<text x="468" y="1069" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">they need dissolved oxygen</text>
<text x="112" y="154" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">NO<tspan baseline-shift="sub" font-size="70%">3</tspan><tspan baseline-shift="super" font-size="68%">−</tspan></text>
