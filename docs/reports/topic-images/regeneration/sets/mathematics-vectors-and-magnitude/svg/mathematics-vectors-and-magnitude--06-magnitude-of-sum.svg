<circle cx="470" cy="630" r="7.5" fill="#1e2a44" stroke="#ffffff" stroke-width="2.5"/>
<circle cx="270" cy="230" r="7.5" fill="#8a6d0d" stroke="#ffffff" stroke-width="2.5"/>
<text x="120" y="380" font-size="25" font-weight="700" fill="#8a6d0d" text-anchor="middle">a + b</text>
<text x="400" y="405" font-size="25" font-weight="700" fill="#2e6b62" text-anchor="middle">b</text>
<text x="320" y="630" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text>
<text x="610" y="218" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">Detour a then b:</text>
<text x="610" y="262" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="start">3.16 + 4.47</text>
<text x="610" y="304" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="start">= 7.63</text>
<text x="610" y="398" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">Shortcut a + b:</text>
<text x="610" y="442" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="start">|(1, 3)| = √10</text>
<text x="610" y="484" font-size="23" font-weight="700" fill="#8a6d0d" text-anchor="start">= 3.16</text>
<text x="610" y="580" font-size="29" font-weight="700" fill="#c0643a" text-anchor="start">7.63 ≠ 3.16</text>
