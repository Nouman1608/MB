<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Add the vectors first</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">|a + b| is not |a| + |b|</text>
<defs><marker id="vN" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker><marker id="vT" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker><marker id="vO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker><marker id="vR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0643a"/></marker></defs><rect x="70" y="130" width="500" height="600" fill="#ffffff"/><line x1="70" y1="130" x2="70" y2="730" stroke="#cfdcda" stroke-width="1.5"/><line x1="170" y1="130" x2="170" y2="730" stroke="#cfdcda" stroke-width="1.5"/><line x1="270" y1="130" x2="270" y2="730" stroke="#cfdcda" stroke-width="1.5"/><line x1="370" y1="130" x2="370" y2="730" stroke="#cfdcda" stroke-width="1.5"/><line x1="470" y1="130" x2="470" y2="730" stroke="#cfdcda" stroke-width="1.5"/><line x1="570" y1="130" x2="570" y2="730" stroke="#cfdcda" stroke-width="1.5"/><line x1="70" y1="730" x2="570" y2="730" stroke="#cfdcda" stroke-width="1.5"/><line x1="70" y1="630" x2="570" y2="630" stroke="#cfdcda" stroke-width="1.5"/><line x1="70" y1="530" x2="570" y2="530" stroke="#cfdcda" stroke-width="1.5"/><line x1="70" y1="430" x2="570" y2="430" stroke="#cfdcda" stroke-width="1.5"/><line x1="70" y1="330" x2="570" y2="330" stroke="#cfdcda" stroke-width="1.5"/><line x1="70" y1="230" x2="570" y2="230" stroke="#cfdcda" stroke-width="1.5"/><line x1="70" y1="130" x2="570" y2="130" stroke="#cfdcda" stroke-width="1.5"/><rect x="70" y="130" width="500" height="600" fill="none" stroke="#cfdcda" stroke-width="2"/><line x1="70" y1="530" x2="570" y2="530" stroke="#4a5a78" stroke-width="2.5"/><line x1="170" y1="130" x2="170" y2="730" stroke="#4a5a78" stroke-width="2.5"/><text x="70" y="760" font-size="19" font-weight="400" fill="#4a5a78" text-anchor="middle">−1</text><text x="270" y="760" font-size="19" font-weight="400" fill="#4a5a78" text-anchor="middle">1</text><text x="370" y="760" font-size="19" font-weight="400" fill="#4a5a78" text-anchor="middle">2</text><text x="470" y="760" font-size="19" font-weight="400" fill="#4a5a78" text-anchor="middle">3</text><text x="570" y="760" font-size="19" font-weight="400" fill="#4a5a78" text-anchor="middle">4</text><text x="58" y="737" font-size="19" font-weight="400" fill="#4a5a78" text-anchor="end">−2</text><text x="58" y="637" font-size="19" font-weight="400" fill="#4a5a78" text-anchor="end">−1</text><text x="58" y="437" font-size="19" font-weight="400" fill="#4a5a78" text-anchor="end">1</text><text x="58" y="337" font-size="19" font-weight="400" fill="#4a5a78" text-anchor="end">2</text><text x="58" y="237" font-size="19" font-weight="400" fill="#4a5a78" text-anchor="end">3</text><text x="58" y="137" font-size="19" font-weight="400" fill="#4a5a78" text-anchor="end">4</text>
<line x1="170" y1="530" x2="268.1" y2="235.7" stroke="#8a6d0d" stroke-width="5" marker-end="url(#vO)"/>
<line x1="470" y1="630" x2="272.7" y2="235.4" stroke="#2e6b62" stroke-width="4.5" marker-end="url(#vT)"/>
<line x1="170" y1="530" x2="464.3" y2="628.1" stroke="#1e2a44" stroke-width="4.5" marker-end="url(#vN)"/>
