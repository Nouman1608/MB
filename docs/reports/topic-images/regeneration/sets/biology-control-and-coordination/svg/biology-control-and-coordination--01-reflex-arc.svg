<text x="726" y="727" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Grey matter</text>
<rect x="30" y="1080" width="840" height="86" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/>
<text x="450" y="1114" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">Reflex time: 0.90 m ÷ 50 m/s = 18 ms, plus 2 synapses × 1.0 ms</text>
<text x="450" y="1149" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="middle">= 20 ms in total</text>
