<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a red cell carries CO₂ away</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">In a respiring tissue</text>
<circle cx="450" cy="440" r="255" fill="#f5dcd8" stroke="#b5352e" stroke-width="4"/>
<text x="450" y="228" font-size="21" font-weight="700" fill="#b5352e" text-anchor="middle">Red blood cell</text>
<text x="30" y="240" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">CO₂ from</text><text x="30" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">respiring cells</text>
<line x1="30" y1="296" x2="292" y2="296" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
<text x="450" y="288" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">CO₂ + H₂O</text>
<line x1="450" y1="306" x2="450" y2="364" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
<text x="466" y="328" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">carbonic</text><text x="466" y="353" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">anhydrase</text>
<text x="450" y="398" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">H₂CO₃</text>
<line x1="450" y1="414" x2="450" y2="468" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
<text x="450" y="502" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">H⁺ + HCO₃⁻</text>
<line x1="540" y1="506" x2="740" y2="506" stroke="#2a7090" stroke-width="3.5" marker-end="url(#ah)"/>
<text x="812" y="486" font-size="21" font-weight="700" fill="#2a7090" text-anchor="middle">HCO₃⁻</text>
<text x="812" y="515" font-size="19" font-weight="400" fill="#2a7090" text-anchor="middle">to plasma</text>
<line x1="742" y1="590" x2="598" y2="590" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/>
<text x="812" y="576" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Cl⁻ in</text>
<text x="812" y="606" font-size="19" font-weight="400" fill="#2e6b62" text-anchor="middle">chloride</text><text x="812" y="632" font-size="19" font-weight="400" fill="#2e6b62" text-anchor="middle">shift</text>
<line x1="410" y1="524" x2="395" y2="566" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
<text x="380" y="600" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">HHb</text>
<text x="380" y="628" font-size="19" font-weight="400" fill="#2e6b62" text-anchor="middle">haemoglobinic</text><text x="380" y="652" font-size="19" font-weight="400" fill="#2e6b62" text-anchor="middle">acid</text>
<line x1="338" y1="598" x2="236" y2="668" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/>
<text x="22" y="702" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">O₂ released</text><text x="22" y="730" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">to tissue</text>
<text x="30" y="398" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">CO₂ binds Hb</text>
<line x1="30" y1="428" x2="262" y2="428" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
<text x="282" y="438" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="start">HbCO₂</text>
<text x="316" y="468" font-size="19" font-weight="400" fill="#2e6b62" text-anchor="middle">carbamino-Hb</text>
<circle cx="216" cy="332" r="16" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><text x="216" y="339" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<circle cx="412" cy="332" r="16" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><text x="412" y="339" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<circle cx="520" cy="438" r="16" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><text x="520" y="445" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<circle cx="324" cy="552" r="16" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><text x="324" y="559" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<circle cx="666" cy="548" r="16" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><text x="666" y="555" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<circle cx="60" cy="470" r="16" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><text x="60" y="477" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="450" y="772" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">1 enters  2 enzyme  3 splits  4 H⁺ mops up  5 HCO₃⁻ out, Cl⁻ in  6 on Hb</text>
</svg>