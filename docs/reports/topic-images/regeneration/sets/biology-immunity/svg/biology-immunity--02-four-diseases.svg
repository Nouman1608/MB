<rect width="900" height="1140" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four diseases, four routes</text>

<rect x="30" y="100" width="405" height="490" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/>
<text x="232" y="150" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">Cholera</text>
<text x="232" y="188" font-size="20" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Vibrio cholerae</text>
<rect x="158" y="208" width="148" height="36" rx="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/>
<text x="232" y="233" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Bacterium</text>
<text x="232" y="510" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Contaminated water</text><text x="232" y="546" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">or food (faecal-oral)</text>
<rect x="465" y="100" width="405" height="490" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/>
<text x="667" y="150" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">Malaria</text>
<text x="667" y="188" font-size="20" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Plasmodium</text>
<rect x="587" y="208" width="160" height="36" rx="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/>
<text x="667" y="233" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Protoctist</text>
<text x="667" y="510" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Bite of a female</text><text x="667" y="546" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Anopheles mosquito (vector)</text>
<rect x="30" y="620" width="405" height="490" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/>
<text x="232" y="670" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">Tuberculosis (TB)</text>
<text x="232" y="708" font-size="20" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Mycobacterium tuberculosis</text>
<rect x="158" y="728" width="148" height="36" rx="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/>
<text x="232" y="753" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Bacterium</text>
<text x="232" y="1030" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Droplets breathed in</text><text x="232" y="1066" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">from coughs and sneezes</text>
<rect x="465" y="620" width="405" height="490" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/>
<text x="667" y="670" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">HIV/AIDS</text>
<text x="667" y="708" font-size="20" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Human immunodeficiency virus</text>
<rect x="617" y="728" width="100" height="36" rx="18" fill="#ead1c4" stroke="#1e2a44" stroke-width="2"/>
<text x="667" y="753" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Virus</text>
<text x="667" y="1030" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Body fluids: sex, blood,</text><text x="667" y="1066" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">mother to child</text>
