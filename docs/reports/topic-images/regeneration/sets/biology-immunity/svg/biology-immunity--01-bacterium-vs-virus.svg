<text x="40" y="1000" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">HIV is about 120 nm across; the bacterium is about 17 times longer.</text>
<text x="40" y="1030" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">Not to scale.</text>
