<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bacterium or virus?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Both can cause disease. Only one is a cell.</text>
<text x="40" y="150" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="start">Bacterium: a living cell</text>
