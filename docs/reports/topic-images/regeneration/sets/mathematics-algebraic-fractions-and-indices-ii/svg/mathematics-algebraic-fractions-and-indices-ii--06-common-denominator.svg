<text x="150" y="472" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1/6</text>
<rect x="210" y="392" width="120" height="54" rx="4" fill="none" stroke="#1e2a44" stroke-width="3"/>
<text x="270" y="472" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1/6</text>
<rect x="330" y="392" width="120" height="54" rx="4" fill="none" stroke="#1e2a44" stroke-width="3"/>
<text x="390" y="472" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1/6</text>
<rect x="450" y="392" width="120" height="54" rx="4" fill="none" stroke="#1e2a44" stroke-width="3"/>
<text x="510" y="472" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1/6</text>
<rect x="570" y="392" width="120" height="54" rx="4" fill="none" stroke="#1e2a44" stroke-width="3"/>
<text x="630" y="472" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1/6</text>
<rect x="690" y="392" width="120" height="54" rx="4" fill="none" stroke="#1e2a44" stroke-width="3"/>
<text x="750" y="472" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1/6</text>
<text x="450" y="520" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Lowest common denominator: 12</text>
<rect x="30" y="560" width="840" height="390" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/>
<text x="60" y="602" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Then combine the numerators</text>
<text x="60" y="674" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="start">3(2x + 1) − 2(x − 3)</text>
<text x="60" y="736" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="start">= 6x + 3 − 2x + 6</text>
<text x="480" y="736" font-size="21" font-weight="700" fill="#c0643a" text-anchor="start">(−2) × (−3) = +6</text>
<text x="60" y="798" font-size="28" font-weight="700" fill="#2e6b62" text-anchor="start">= 4x + 9</text>
<text x="60" y="880" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Answer:</text>
<text x="250" y="862" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">4x + 9</text><line x1="180" y1="876" x2="320" y2="876" stroke="#1e2a44" stroke-width="3"/><text x="250" y="910.5" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">12</text>
</svg>