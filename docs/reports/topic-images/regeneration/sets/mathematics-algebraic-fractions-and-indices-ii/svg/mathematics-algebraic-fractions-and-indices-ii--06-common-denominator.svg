<rect width="900" height="980" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Add and subtract: common denominator</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">(2x + 1)/4 − (x − 3)/6</text>
<rect x="30" y="130" width="840" height="410" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/>
<text x="60" y="174" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Cut both into twelfths</text>
<text x="90" y="230" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">One quarter = 3 twelfths</text>
<rect x="90" y="242" width="60" height="54" fill="#b5d3cf" stroke="#5f7f7b" stroke-width="1.5"/>
<rect x="150" y="242" width="60" height="54" fill="#b5d3cf" stroke="#5f7f7b" stroke-width="1.5"/>
