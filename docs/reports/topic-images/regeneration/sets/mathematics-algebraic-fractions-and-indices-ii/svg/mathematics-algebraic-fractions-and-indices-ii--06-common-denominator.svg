<rect x="330" y="242" width="60" height="54" fill="#dfeceb" stroke="#5f7f7b" stroke-width="1.5"/>
<rect x="390" y="242" width="60" height="54" fill="#dfeceb" stroke="#5f7f7b" stroke-width="1.5"/>
<rect x="450" y="242" width="60" height="54" fill="#b5d3cf" stroke="#5f7f7b" stroke-width="1.5"/>
<rect x="510" y="242" width="60" height="54" fill="#b5d3cf" stroke="#5f7f7b" stroke-width="1.5"/>
<rect x="570" y="242" width="60" height="54" fill="#b5d3cf" stroke="#5f7f7b" stroke-width="1.5"/>
<rect x="630" y="242" width="60" height="54" fill="#dfeceb" stroke="#5f7f7b" stroke-width="1.5"/>
<rect x="690" y="242" width="60" height="54" fill="#dfeceb" stroke="#5f7f7b" stroke-width="1.5"/>
<rect x="750" y="242" width="60" height="54" fill="#dfeceb" stroke="#5f7f7b" stroke-width="1.5"/>
<rect x="90" y="242" width="180" height="54" rx="4" fill="none" stroke="#1e2a44" stroke-width="3"/>
<text x="180" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1/4</text>
<rect x="270" y="242" width="180" height="54" rx="4" fill="none" stroke="#1e2a44" stroke-width="3"/>
<text x="360" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1/4</text>
<rect x="450" y="242" width="180" height="54" rx="4" fill="none" stroke="#1e2a44" stroke-width="3"/>
<text x="540" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1/4</text>
<rect x="630" y="242" width="180" height="54" rx="4" fill="none" stroke="#1e2a44" stroke-width="3"/>
<text x="720" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1/4</text>
<text x="90" y="380" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">One sixth = 2 twelfths</text>
<rect x="90" y="392" width="60" height="54" fill="#f2e7b8" stroke="#a89a5c" stroke-width="1.5"/>
<rect x="150" y="392" width="60" height="54" fill="#f2e7b8" stroke="#a89a5c" stroke-width="1.5"/>
<rect x="210" y="392" width="60" height="54" fill="#fbf5dc" stroke="#a89a5c" stroke-width="1.5"/>
<rect x="270" y="392" width="60" height="54" fill="#fbf5dc" stroke="#a89a5c" stroke-width="1.5"/>
<rect x="330" y="392" width="60" height="54" fill="#f2e7b8" stroke="#a89a5c" stroke-width="1.5"/>
<rect x="390" y="392" width="60" height="54" fill="#f2e7b8" stroke="#a89a5c" stroke-width="1.5"/>
<rect x="450" y="392" width="60" height="54" fill="#fbf5dc" stroke="#a89a5c" stroke-width="1.5"/>
<rect x="510" y="392" width="60" height="54" fill="#fbf5dc" stroke="#a89a5c" stroke-width="1.5"/>
<rect x="570" y="392" width="60" height="54" fill="#f2e7b8" stroke="#a89a5c" stroke-width="1.5"/>
<rect x="630" y="392" width="60" height="54" fill="#f2e7b8" stroke="#a89a5c" stroke-width="1.5"/>
<rect x="690" y="392" width="60" height="54" fill="#fbf5dc" stroke="#a89a5c" stroke-width="1.5"/>
