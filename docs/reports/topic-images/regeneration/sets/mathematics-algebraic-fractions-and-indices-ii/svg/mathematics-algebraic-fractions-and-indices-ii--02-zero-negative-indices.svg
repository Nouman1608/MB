<rect width="900" height="938" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Zero and negative indices</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each step down: ÷ 2</text>
