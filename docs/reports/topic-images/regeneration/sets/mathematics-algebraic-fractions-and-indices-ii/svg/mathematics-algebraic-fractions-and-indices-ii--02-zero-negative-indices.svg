<text x="272" y="696" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">÷ 2</text>
<text x="60" y="748" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="start">2<tspan font-size="65%" dy="-0.6em">−3</tspan></text>
<rect x="360" y="714" width="6" height="48" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/>
<text x="380" y="748" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">= 1/8</text>
<text x="60" y="854" font-size="34" font-weight="700" fill="#8a6d0d" text-anchor="start">x<tspan font-size="65%" dy="-0.6em">0</tspan><tspan dy="0.39em" dx="0.28em">= 1</tspan></text>
<text x="380" y="854" font-size="34" font-weight="700" fill="#2e6b62" text-anchor="start">x<tspan font-size="65%" dy="-0.6em">−n</tspan><tspan dy="0.39em" dx="0.28em">= 1 / x</tspan><tspan font-size="65%" dy="-0.6em">n</tspan></text>
<text x="60" y="904" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">Negative index: "one over", not a negative number</text>
</svg>