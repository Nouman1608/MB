<text x="392" y="556" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">= 1/2</text>
<line x1="250" y1="582" x2="250" y2="604" stroke="#2e6b62" stroke-width="3.5"/><path d="M239 594 L250 606 L261 594" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linecap="round"/>
<text x="272" y="600" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">÷ 2</text>
<text x="60" y="652" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="start">2<tspan font-size="65%" dy="-0.6em">−2</tspan></text>
