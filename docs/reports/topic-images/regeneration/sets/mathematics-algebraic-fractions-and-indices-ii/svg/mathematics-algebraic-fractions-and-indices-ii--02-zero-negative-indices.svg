<text x="272" y="312" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">÷ 2</text>
<text x="60" y="364" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="start">2<tspan font-size="65%" dy="-0.6em">1</tspan></text>
