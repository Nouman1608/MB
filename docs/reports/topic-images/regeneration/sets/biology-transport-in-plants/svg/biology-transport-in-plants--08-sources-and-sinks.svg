<text x="30" y="330" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Mature leaf</text>
<text x="30" y="360" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">releases sucrose</text>
<rect x="580" y="190" width="78" height="38" rx="19" fill="#5fb3a8" stroke="#2e6b62" stroke-width="2.5"/><text x="619" y="216" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">SINK</text>
<text x="580" y="262" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Shoot tip</text>
<text x="580" y="292" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">uses sucrose</text>
<text x="590" y="638" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Fruit</text>
<text x="590" y="668" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">uses or stores it</text>
<text x="600" y="872" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Roots</text>
<text x="600" y="902" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">use or store it</text>
<text x="70" y="786" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Phloem carries sucrose</text><text x="70" y="814" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">and amino acids</text>
