<text x="616" y="844" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">no cross walls: one long</text><text x="616" y="872" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">tube from root to leaf</text>
