<text x="460" y="830" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">no net movement:</text>
<text x="460" y="854" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">mass does not change</text>
<rect x="608" y="736" width="252" height="138" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/>
