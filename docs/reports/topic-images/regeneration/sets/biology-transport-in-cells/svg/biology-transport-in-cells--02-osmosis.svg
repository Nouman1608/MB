<text x="734" y="830" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">cells lose water:</text>
<text x="734" y="854" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">tissue loses mass</text>
