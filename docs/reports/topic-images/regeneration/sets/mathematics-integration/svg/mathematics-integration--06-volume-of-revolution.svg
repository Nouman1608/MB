<text x="260" y="186.66666666666663" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">thin disc, width δx</text>
<text x="545" y="186.66666666666663" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">y = 3/(x + 1)</text>
<text x="545" y="513.3333333333334" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">its reflection</text>
<text x="450" y="640" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Disc volume = π y² δx → V = π ∫₀² y² dx</text>
<text x="450" y="680" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">= 9π ∫₀² (x + 1)⁻² dx = 9π(1 − 1/3) = 6π</text>
