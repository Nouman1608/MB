<text x="636" y="988" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">a</text>
<text x="40" y="738" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">7 kg: 7g − T = 7a</text>
<text x="40" y="776" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">4 kg: T − 4g = 4a</text>
<text x="860" y="738" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="end">a = 3g/11</text>
<text x="860" y="776" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="end">= 2.67 m s⁻²</text>
<text x="860" y="828" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="end">T = 49.9 N</text>
