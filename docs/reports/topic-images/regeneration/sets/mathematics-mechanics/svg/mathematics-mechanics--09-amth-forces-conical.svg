<rect width="900" height="930" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Conical pendulum: horizontal circle</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Bob 0.4 kg, string 1.2 m, ω = 5 rad s⁻¹, g = 9.8 m s⁻²</text>
