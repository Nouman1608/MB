<circle cx="779.1092485581512" cy="324.26" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/>
<text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" stroke-linejoin="round" x="610" y="246" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">L = 1.2 m</text>
<text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" stroke-linejoin="round" x="490" y="310.26" font-size="19" font-weight="700" fill="#4a5568" text-anchor="start">r = 1.13 m</text>
<text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" stroke-linejoin="round" x="650" y="344.26" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">T = 12 N</text>
<text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" stroke-linejoin="round" x="709.1092485581512" y="419.26" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">mg = 3.92 N</text>
<text x="190" y="540" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">From above</text>
<circle cx="190" cy="690" r="100" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-dasharray="8 7"/>
<circle cx="190" cy="690" r="6" fill="#1e2a44"/>
