<line x1="290" y1="690" x2="230" y2="690" stroke="#2e6b62" stroke-width="5" stroke-linecap="round"/><polygon points="200,690 230,671.4 230,708.6" fill="#2e6b62"/>
<circle cx="290" cy="690" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/>
<text x="316" y="620" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">v = 5.67</text>
<text x="316" y="644" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">m s⁻¹</text>
<text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" stroke-linejoin="round" x="200" y="736" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">a = 28.3 m s⁻²</text>
<text x="700" y="540" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Forces add to a resultant</text>
