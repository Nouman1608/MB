<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" width="900" height="1010" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1010" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Moments: a plank on two supports</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Plank 5 m, 22 kg; person 55 kg; g = 9.8 m s⁻²</text>
<rect x="75" y="350" width="750" height="20" rx="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/>
<text x="75" y="338" font-size="20" font-weight="700" fill="#4a5568" text-anchor="start">A</text>
<text x="825" y="338" font-size="20" font-weight="700" fill="#4a5568" text-anchor="end">B</text>
<polygon points="150,370 126,415 174,415" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/>
<text x="150" y="448" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text>
<polygon points="600,370 576,415 624,415" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/>
<text x="600" y="448" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text>
<rect x="207" y="292" width="36" height="56" rx="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/>
<text x="255" y="332" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">55 kg</text>
<line x1="150" y1="350" x2="150" y2="225" stroke="#2e6b62" stroke-width="5" stroke-linecap="round"/><polygon points="150,185 174.8,225 125.2,225" fill="#2e6b62"/>
<text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" stroke-linejoin="round" x="164" y="280" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">R<tspan dy="5" font-size="70%">C</tspan><tspan dy="-5" dx="5">= 521.0 N</tspan></text>
<line x1="600" y1="350" x2="600" y2="310" stroke="#2e6b62" stroke-width="5" stroke-linecap="round"/><polygon points="600,270 624.8,310 575.2,310" fill="#2e6b62"/>
<text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" stroke-linejoin="round" x="630" y="320" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">R<tspan dy="5" font-size="70%">D</tspan><tspan dy="-5" dx="5">= 233.6 N</tspan></text>
<line x1="225" y1="370" x2="225" y2="500" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><polygon points="225,540 200.2,500 249.8,500" fill="#1e2a44"/>
<text x="241" y="460" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">539 N</text>
<line x1="450" y1="370" x2="450" y2="402" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><polygon points="450,442 425.2,402 474.8,402" fill="#1e2a44"/>
<text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" stroke-linejoin="round" x="476" y="410" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">215.6 N</text>
<line x1="150" y1="590" x2="600" y2="590" stroke="#4a5568" stroke-width="2.5"/>
<line x1="150" y1="580" x2="150" y2="600" stroke="#4a5568" stroke-width="2.5"/>
<text x="150" y="628" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">0</text>
<line x1="225" y1="580" x2="225" y2="600" stroke="#4a5568" stroke-width="2.5"/>
<text x="225" y="628" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">0.5</text>
<line x1="450" y1="580" x2="450" y2="600" stroke="#4a5568" stroke-width="2.5"/>
<text x="450" y="628" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">2.0</text>
<line x1="600" y1="580" x2="600" y2="600" stroke="#4a5568" stroke-width="2.5"/>
<text x="600" y="628" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">3.0</text>
<text x="640" y="597" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">m from C</text>
<text x="450" y="700" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Moments about C balance</text>
<text x="100" y="746" font-size="19" font-weight="700" fill="#4a5568" text-anchor="start">Clockwise</text>
<rect x="100" y="760" width="269.2307692307692" height="50" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/>
<rect x="369.2307692307692" y="760" width="430.7692307692308" height="50" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/>
<text x="234.6153846153846" y="792" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">55g × 0.5 = 269.5</text>
<text x="584.6153846153846" y="792" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">22g × 2.0 = 431.2</text>
<text x="100" y="856" font-size="19" font-weight="700" fill="#4a5568" text-anchor="start">Anticlockwise</text>
<rect x="100" y="870" width="700" height="50" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/>
<text x="450" y="902" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">R<tspan dy="5" font-size="70%">D</tspan><tspan dy="-5" dx="5">× 3.0 = 700.7</tspan></text>
<text x="450" y="978" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">Then R<tspan dy="5" font-size="70%">C</tspan><tspan dy="-5" dx="5">= 754.6 − 233.6 = 521.0 N</tspan></text>
</svg>