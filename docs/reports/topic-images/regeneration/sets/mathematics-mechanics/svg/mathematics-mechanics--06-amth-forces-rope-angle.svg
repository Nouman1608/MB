<text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" stroke-linejoin="round" x="308.2901705283029" y="474.7568475314766" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">T = 43.7</text>
<text x="225" y="788" font-size="20" font-weight="400" fill="#4a5568" text-anchor="middle">R + T sin25° = 117.6</text>
<text x="225" y="826" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">R = 99.1: less than W</text>
