<circle cx="225" cy="510" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/>
<text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" stroke-linejoin="round" x="207" y="424.81" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="end">R = 99.1</text>
<text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" stroke-linejoin="round" x="195" y="544" font-size="20" font-weight="700" fill="#b5602e" text-anchor="end">F = 39.6</text>
