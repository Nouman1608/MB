<text x="675" y="788" font-size="20" font-weight="400" fill="#4a5568" text-anchor="middle">R = 117.6 + P sin25°</text>
<text x="675" y="826" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">R = 144.6: more than W</text>
<text x="450" y="890" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Same box, same μ: pulling needs 43.7 N, pushing 63.8 N</text>
<text x="450" y="926" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">Limiting: horizontal component = μR</text>
