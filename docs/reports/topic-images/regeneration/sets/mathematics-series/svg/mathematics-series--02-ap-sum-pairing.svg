<rect x="110" y="880" width="680" height="64" rx="32" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="921" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">2S = 7 × 30 = 210, so S = 105</text>
<rect x="110" y="966" width="680" height="64" rx="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="1006.28" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">S<tspan baseline-shift="sub" font-size="70%">n</tspan> = ½n(a + l) = ½ × 7 × (3 + 27)</text>
