<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Adding an arithmetic series</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Write it forwards and backwards</text>
<text x="72" y="214" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text>
<text x="72" y="282" font-size="58" font-weight="700" fill="#1e2a44" text-anchor="middle">∑</text>
<text x="72" y="322" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">r = 1</text>
<text x="122" y="266" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="start">(4r − 1) = 3 + 7 + 11 + … + 27</text>
<text x="450" y="368" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="middle">every column adds up to a + l = 30</text>
