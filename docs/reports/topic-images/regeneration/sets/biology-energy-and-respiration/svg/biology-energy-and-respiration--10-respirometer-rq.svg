<text x="70" y="726" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">KOH absorbs CO<tspan dy="5" font-size="70%">2</tspan><tspan dy="-5">:</tspan></text><text x="70" y="756" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">drop = O<tspan dy="5" font-size="70%">2</tspan><tspan dy="-5" dx="5">in</tspan></text>
<text x="500" y="726" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">no absorber:</text><text x="500" y="756" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">drop = O<tspan dy="5" font-size="70%">2</tspan><tspan dy="-5" dx="5">in − CO</tspan><tspan dy="5" font-size="70%">2</tspan><tspan dy="-5" dx="5">out</tspan></text>
<rect x="30" y="800" width="840" height="330" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/>
<text x="56" y="848" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">Capillary radius r = 0.50 mm</text>
<text x="56" y="896" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">O<tspan dy="5" font-size="70%">2</tspan><tspan dy="-5" dx="5">in = πr² × 36 = 28.3 mm³</tspan></text>
<text x="56" y="946" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">O<tspan dy="5" font-size="70%">2</tspan><tspan dy="-5" dx="5">in − CO</tspan><tspan dy="5" font-size="70%">2</tspan><tspan dy="-5" dx="5">out = πr² × 9 = 7.07 mm³</tspan></text>
<text x="56" y="996" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">CO<tspan dy="5" font-size="70%">2</tspan><tspan dy="-5" dx="5">out = 28.3 − 7.07 = 21.2 mm³</tspan></text>
<text x="56" y="1058" font-size="28" font-weight="700" fill="#2e6b62" text-anchor="start">RQ = CO<tspan dy="5" font-size="70%">2</tspan><tspan dy="-5" dx="5">÷ O</tspan><tspan dy="5" font-size="70%">2</tspan><tspan dy="-5" dx="5">= 21.2 ÷ 28.3 = 0.75</tspan></text>
<text x="56" y="1102" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">between 0.7 and 1.0: a mixture of lipid and carbohydrate</text>
