<text x="660" y="456" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">CO<tspan dy="5" font-size="70%">2</tspan><tspan dy="-5" dx="5">out</tspan></text>
<rect x="560" y="590" width="266" height="38" rx="19" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="693" y="616" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">reduced NAD → NAD</text>
<text x="665" y="692" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">cannot be reversed</text>
