<text x="450" y="900" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="middle">NAD is regenerated, so glycolysis can continue</text>
<text x="450" y="942" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Only the net 2 ATP from glycolysis; none from this step</text>
