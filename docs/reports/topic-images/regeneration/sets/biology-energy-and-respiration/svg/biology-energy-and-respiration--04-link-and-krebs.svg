<text x="450" y="1040" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">×2 turns per glucose: 4 CO<tspan dy="5" font-size="70%">2</tspan><tspan dy="-5">, 6 reduced NAD, 2 reduced FAD, 2 ATP</tspan></text>
