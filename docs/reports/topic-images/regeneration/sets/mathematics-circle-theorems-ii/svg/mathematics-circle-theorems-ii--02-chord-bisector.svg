 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="820" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Perpendicular to a chord</text>

<circle cx="450" cy="390" r="280" fill="#dce9e7" stroke="#1e2a44" stroke-width="4"/>
<polygon points="450,390 226,558 450,558" fill="#f2e7b8"/>
<line x1="226" y1="558" x2="674" y2="558" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/>
<line x1="450" y1="390" x2="450" y2="558" stroke="#2e6b62" stroke-width="4.5" stroke-linecap="round"/>
<line x1="450" y1="390" x2="226" y2="558" stroke="#b5602e" stroke-width="4.5" stroke-linecap="round"/>
<path d="M450 536 L428 536 L428 558" fill="none" stroke="#b5602e" stroke-width="2.5"/>
<line x1="338" y1="546" x2="338" y2="570" stroke="#b5602e" stroke-width="3" stroke-linecap="round"/>
<line x1="562" y1="546" x2="562" y2="570" stroke="#b5602e" stroke-width="3" stroke-linecap="round"/>
<circle cx="450" cy="390" r="9" fill="#1e2a44"/>
<circle cx="674" cy="558" r="9" fill="#1e2a44"/>
<circle cx="226" cy="558" r="9" fill="#1e2a44"/>
<circle cx="450" cy="558" r="8" fill="#2e6b62"/>
<text x="422" y="372" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">O</text>
<text x="450" y="602" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">M</text>
<text x="206" y="566" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="end">B</text>
<text x="694" y="566" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">A</text>
<text x="300" y="460" font-size="27" font-weight="700" fill="#b5602e" text-anchor="middle">10</text>
<text x="416" y="492" font-size="27" font-weight="700" fill="#2e6b62" text-anchor="middle">6</text>
<text x="338" y="526" font-size="27" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text>
<text x="450" y="742" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">OM ⊥ AB, so AM = MB</text>
<text x="450" y="788" font-size="21" font-weight="400" fill="#4a5568" text-anchor="middle">AB = 16, radius 10: 6² + 8² = 10²</text>
