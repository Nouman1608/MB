<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Given French: use only French</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">40 students. One studies French. Spanish too?</text>
<rect x="100" y="120" width="700" height="410" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3.5"/>
<defs><clipPath id="clF"><circle cx="345" cy="320" r="150"/></clipPath></defs>
<circle cx="345" cy="320" r="150" fill="#b5d3cf"/>
<circle cx="545" cy="320" r="150" fill="#d4b02e" clip-path="url(#clF)"/>
<circle cx="545" cy="320" r="150" fill="none" stroke="#4a5568" stroke-width="3" stroke-dasharray="8 7"/>
<circle cx="345" cy="320" r="150" fill="none" stroke="#2e6b62" stroke-width="5"/>
<text x="235" y="156" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">French</text>
<text x="665" y="156" font-size="22" font-weight="700" fill="#4a5568" text-anchor="middle">Spanish</text>
<text x="265" y="332" font-size="36" font-weight="700" fill="#1e2a44" text-anchor="middle">12</text>
<text x="445" y="332" font-size="36" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
<text x="625" y="332" font-size="36" font-weight="700" fill="#4a5568" text-anchor="middle">8</text>
<text x="770" y="510" font-size="30" font-weight="700" fill="#4a5568" text-anchor="end">14</text>
<rect x="300" y="556" width="300" height="40" rx="20" fill="#2e6b62"/><text x="450" y="584" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">All French: 18 students</text>
<rect x="295" y="606" width="310" height="40" rx="20" fill="#8a6d0d"/><text x="450" y="634" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Spanish too: 6 of the 18</text>
<text x="450" y="692" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">Chance = 6/18 = 1/3</text>
<text x="450" y="730" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Not 6 out of 40</text>
</svg>