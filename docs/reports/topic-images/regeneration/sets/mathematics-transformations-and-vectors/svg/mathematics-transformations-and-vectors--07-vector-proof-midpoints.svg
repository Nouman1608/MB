<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 906" width="900" height="906" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="906" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Vector proof</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">M and N are midpoints</text>
<polygon points="110,620 710,470 260,170" fill="#dce9e7" stroke="none"/>
<line x1="110" y1="620" x2="704" y2="472" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/>
<line x1="110" y1="620" x2="258" y2="176" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/>
<line x1="710" y1="470" x2="266" y2="174" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/>
<line x1="410" y1="545" x2="191" y2="399" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/>
<circle cx="110" cy="620" r="7" fill="#1e2a44" stroke="#fff" stroke-width="2"/>
<circle cx="710" cy="470" r="7" fill="#1e2a44" stroke="#fff" stroke-width="2"/>
<circle cx="260" cy="170" r="7" fill="#1e2a44" stroke="#fff" stroke-width="2"/>
<circle cx="410" cy="545" r="7" fill="#1e2a44" stroke="#fff" stroke-width="2"/>
<circle cx="185" cy="395" r="7" fill="#1e2a44" stroke="#fff" stroke-width="2"/>
<text x="92" y="628" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="end">O</text>
<text x="728" y="478" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">A</text>
<text x="260" y="152" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text>
<text x="410" y="585" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">M</text>
<text x="165" y="401" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="end">N</text>
<text x="410" y="617" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text>
<text x="133.5" y="500" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="end">b</text>
<text x="525" y="302" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">b − a</text>
<text x="307.5" y="440" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">½(b − a)</text>
<text x="60" y="720" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">OM = ½a, ON = ½b</text>
<text x="60" y="766" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">MN = ON − OM = ½b − ½a = ½(b − a)</text>
<text x="60" y="812" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">AB = b − a</text>
<text x="60" y="866" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">So MN = ½AB: parallel, half the length.</text>
</svg>