<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Area from two sides and an angle</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Area = ½ ab sin C</text>
<polygon points="108,438 610,438 415.6,179.9" fill="#dfeceb"/>
<line x1="415.6" y1="179.9" x2="610.0" y2="438.0" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/>
<line x1="108.0" y1="438.0" x2="610.0" y2="438.0" stroke="#2e6b62" stroke-width="6" stroke-linecap="round"/>
<line x1="108.0" y1="438.0" x2="415.6" y2="179.9" stroke="#2e6b62" stroke-width="6" stroke-linecap="round"/>
<line x1="415.6" y1="179.9" x2="415.6" y2="438.0" stroke="#8a6d0d" stroke-width="3.5" stroke-dasharray="9 6" stroke-linecap="round"/>
<path d="M393.6 438 v-22 h22" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
<path d="M180.0 438.0 A72 72 0 0 0 163.2 391.7" fill="none" stroke="#1e2a44" stroke-width="4"/>
<text stroke="#ffffff" stroke-width="5" paint-order="stroke" x="415.6434483565816" y="155.8564959498858" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text>
<text stroke="#ffffff" stroke-width="5" paint-order="stroke" x="80" y="456" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text>
<text stroke="#ffffff" stroke-width="5" paint-order="stroke" x="638" y="460" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text>
<text x="202" y="406" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">40°</text>
<text stroke="#ffffff" stroke-width="5" paint-order="stroke" x="208" y="308" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">a = 8</text>
<text stroke="#ffffff" stroke-width="5" paint-order="stroke" x="353" y="490" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">b = 10</text>
<text x="429.6434483565816" y="318" font-size="23" font-weight="700" fill="#8a6d0d" text-anchor="start">h</text>
<text x="450" y="569" font-size="25" font-weight="700" fill="#8a6d0d" text-anchor="middle">h = 8 × sin 40° = 5.14 cm</text>
<text x="450" y="621" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">Area = ½ × 10 × 5.14</text>
<text x="450" y="674" font-size="25" font-weight="700" fill="#2e6b62" text-anchor="middle">½ ab sin C = ½ × 8 × 10 × sin 40° = 25.7 cm<tspan font-size="65%" dy="-0.6em">2</tspan></text>
<text x="450" y="725" font-size="21" font-weight="400" fill="#4a5568" text-anchor="middle">C is the angle between sides a and b</text>
</svg>