<rect width="900" height="880" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which rod conducts best?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Wax holds a pin on the far end of each rod</text>
<rect x="150" y="130" width="60" height="570" rx="8" fill="#efb26b" stroke="#b5602e" stroke-width="3"/>
<text x="180" y="730" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">heat</text>
<text x="740" y="140" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">pin falls</text>
<rect x="210" y="170" width="410" height="40" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/>
<text x="415" y="198" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Copper</text>
<text x="740" y="200" font-size="25" font-weight="700" fill="#2e6b62" text-anchor="start">1st</text>
<line x1="628" y1="216" x2="628" y2="254" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/>
<line x1="628" y1="264" x2="628" y2="298" stroke="#1e2a44" stroke-width="4"/><circle cx="628" cy="264" r="8" fill="#c8ccd2" stroke="#1e2a44" stroke-width="2"/>
<rect x="210" y="320" width="410" height="40" rx="0" fill="#8e99a6" stroke="#1e2a44" stroke-width="3"/>
<text x="415" y="348" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Iron</text>
<text x="740" y="350" font-size="25" font-weight="700" fill="#2e6b62" text-anchor="start">2nd</text>
<line x1="628" y1="366" x2="628" y2="404" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/>
<line x1="628" y1="414" x2="628" y2="448" stroke="#1e2a44" stroke-width="4"/><circle cx="628" cy="414" r="8" fill="#c8ccd2" stroke="#1e2a44" stroke-width="2"/>
<rect x="210" y="470" width="410" height="40" rx="0" fill="#c2e1e6" stroke="#1e2a44" stroke-width="3"/>
<text x="415" y="498" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Glass</text>
<text x="740" y="500" font-size="25" font-weight="700" fill="#4a5568" text-anchor="start">stays</text>
<ellipse cx="628" cy="490" rx="9" ry="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><line x1="636" y1="490" x2="674" y2="490" stroke="#1e2a44" stroke-width="4"/><circle cx="678" cy="490" r="8" fill="#c8ccd2" stroke="#1e2a44" stroke-width="2"/>
<rect x="210" y="620" width="410" height="40" rx="0" fill="#b98b5a" stroke="#1e2a44" stroke-width="3"/>
<text x="415" y="648" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Wood</text>
<text x="740" y="650" font-size="25" font-weight="700" fill="#4a5568" text-anchor="start">stays</text>
<ellipse cx="628" cy="640" rx="9" ry="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><line x1="636" y1="640" x2="674" y2="640" stroke="#1e2a44" stroke-width="4"/><circle cx="678" cy="640" r="8" fill="#c8ccd2" stroke="#1e2a44" stroke-width="2"/>
<text x="450" y="850" font-size="25" font-weight="700" fill="#2e6b62" text-anchor="middle">Pin falls first on the best conductor</text>
