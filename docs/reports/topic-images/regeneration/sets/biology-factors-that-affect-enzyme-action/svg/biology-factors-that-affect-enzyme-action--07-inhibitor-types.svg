<rect width="900" height="930" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two kinds of reversible inhibitor</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Where does the inhibitor bind?</text>
<rect x="40" y="120" width="820" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/>
<text x="64" y="158" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">No inhibitor</text>
<path d="M192.2715558937703 244.86666666666667 A58 58 0 1 0 192.2715558937703 295.1333333333333 L178.66666666666666 295.1333333333333 L178.66666666666666 280.6333333333333 L163.2 280.6333333333333 L163.2 259.3666666666667 L178.66666666666666 259.3666666666667 L178.66666666666666 244.86666666666667 Z" fill="#dde9e6" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round"/>
<rect x="162" y="260" width="16" height="20" fill="#f2c9b0" stroke="#b5602e" stroke-width="2"/><rect x="178" y="248" width="44" height="44" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/>
<text x="430" y="256" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Substrate fits the</text><text x="430" y="284" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">active site: product made</text>
<rect x="40" y="390" width="820" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/>
<text x="64" y="428" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">Competitive</text>
<path d="M192.2715558937703 514.8666666666667 A58 58 0 1 0 192.2715558937703 565.1333333333333 L178.66666666666666 565.1333333333333 L178.66666666666666 550.6333333333333 L163.2 550.6333333333333 L163.2 529.3666666666667 L178.66666666666666 529.3666666666667 L178.66666666666666 514.8666666666667 Z" fill="#dde9e6" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round"/>
<rect x="162" y="530" width="16" height="20" fill="#f2c9b0" stroke="#b5602e" stroke-width="2"/><rect x="178" y="518" width="44" height="44" fill="#f2c9b0" stroke="#b5602e" stroke-width="2.5"/><text x="200" y="547" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">I</text>
