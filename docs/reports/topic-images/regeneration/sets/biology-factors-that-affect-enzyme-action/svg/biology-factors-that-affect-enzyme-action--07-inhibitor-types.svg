<text x="430" y="526" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Inhibitor sits in the</text><text x="430" y="554" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">active site; more substrate wins</text>
<rect x="40" y="660" width="820" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/>
<text x="64" y="698" font-size="22" font-weight="700" fill="#2f6f8f" text-anchor="start">Non-competitive</text>
<path d="M192.2715558937703 784.8666666666667 A58 58 0 1 0 192.2715558937703 835.1333333333333 L186.39999999999998 833.1333333333333 L169 821.6 L176.73333333333332 811.9333333333333 L163.2 800.3333333333334 L184.46666666666667 786.8666666666667 Z" fill="#dde9e6" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round"/>
<circle cx="140" cy="746" r="19" fill="#f2c9b0" stroke="#b5602e" stroke-width="2.5"/>
<text x="140" y="753" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">I</text>
<rect x="290" y="788" width="44" height="44" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="5 4"/><path d="M296 794 l32 32 M328 794 l-32 32" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round"/>
<text x="430" y="782" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Binds elsewhere, reshapes</text><text x="430" y="810" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">the site; more substrate</text><text x="430" y="838" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">does not help</text>
