<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The product rule as an area</text>

<rect x="90" y="180" width="270" height="340" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/>
<rect x="90" y="105" width="270" height="75" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/>
<rect x="360" y="180" width="88" height="340" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/>
<rect x="360" y="105" width="88" height="75" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/>
<text x="225" y="150.5" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">u dv</text>
<text x="225" y="360" font-size="32" font-weight="700" fill="#2e6b62" text-anchor="middle">u v</text>
<line x1="80" y1="180" x2="80" y2="520" stroke="#1e2a44" stroke-width="2.5"/>
<text x="64" y="358" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">v</text>
<line x1="90" y1="540" x2="360" y2="540" stroke="#1e2a44" stroke-width="2.5"/>
<text x="225" y="572" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">u</text>
<line x1="448" y1="154.5" x2="488" y2="125" stroke="#4f5f7f" stroke-width="2.5"/>
<text x="492" y="109" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">du dv (tiny)</text>
<line x1="448" y1="300" x2="482" y2="300" stroke="#4f5f7f" stroke-width="2.5"/>
<text x="488" y="307" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">v du</text>
<text x="560" y="190" font-size="22" font-weight="400" fill="#4a5568" text-anchor="start">extra area =</text>
<text x="560" y="236" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">v du + u dv + du dv</text>
<text x="560" y="300" font-size="22" font-weight="400" fill="#4a5568" text-anchor="start">divide by dx, let</text>
<text x="560" y="340" font-size="22" font-weight="400" fill="#4a5568" text-anchor="start">dx → 0:</text>
<rect x="576" y="384" width="266" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="709" y="414.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">(uv)′ = u′v + uv′</text>
<text x="560" y="480" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">y = x<tspan baseline-shift="super" font-size="70%">3</tspan>e<tspan baseline-shift="super" font-size="70%">2x</tspan> at x = 1</text>
<text x="560" y="520" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">u′v = 3e<tspan baseline-shift="super" font-size="70%">2</tspan></text>
<text x="560" y="558" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">uv′ = 2e<tspan baseline-shift="super" font-size="70%">2</tspan></text>
<text x="560" y="604" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">(uv)′ = 5e<tspan baseline-shift="super" font-size="70%">2</tspan> = 36.9</text>
</svg>