<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 945" width="900" height="945" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="945" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Base percentages in DNA</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example: 34% of the bases are C</text>
<circle cx="60" cy="138" r="18" fill="#1e2a44"/><text x="60" y="145" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="92" y="147" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">C = 34% (given)</text>
<rect x="40" y="172" width="278.79999999999995" height="70" fill="#f2c9b0" stroke="#1e2a44" stroke-width="2.5"/><text x="179.39999999999998" y="217" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">C 34%</text>
<rect x="318.79999999999995" y="172" width="541.1999999999999" height="70" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="9 6"/><text x="589.3999999999999" y="217" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">G, A, T = ?</text>
<circle cx="60" cy="316" r="18" fill="#1e2a44"/><text x="60" y="323" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="92" y="325" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">C pairs with G, so G = 34%</text>
<rect x="40" y="350" width="278.79999999999995" height="70" fill="#f2c9b0" stroke="#1e2a44" stroke-width="2.5"/><text x="179.39999999999998" y="395" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">C 34%</text>
<rect x="318.79999999999995" y="350" width="278.79999999999995" height="70" fill="#c9d3ee" stroke="#1e2a44" stroke-width="2.5"/><text x="458.19999999999993" y="395" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">G 34%</text>
<rect x="597.5999999999999" y="350" width="262.4" height="70" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="9 6"/><text x="728.8" y="395" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">A, T = ?</text>
<circle cx="60" cy="494" r="18" fill="#1e2a44"/><text x="60" y="501" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="92" y="503" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">A + T = 100 − 34 − 34 = 32%</text>
<rect x="40" y="528" width="278.79999999999995" height="70" fill="#f2c9b0" stroke="#1e2a44" stroke-width="2.5"/><text x="179.39999999999998" y="573" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">C 34%</text>
<rect x="318.79999999999995" y="528" width="278.79999999999995" height="70" fill="#c9d3ee" stroke="#1e2a44" stroke-width="2.5"/><text x="458.19999999999993" y="573" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">G 34%</text>
<rect x="597.5999999999999" y="528" width="262.4" height="70" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="728.8" y="573" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">A + T 32%</text>
<circle cx="60" cy="672" r="18" fill="#1e2a44"/><text x="60" y="679" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="92" y="681" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">A pairs with T, so A = T = 32 ÷ 2 = 16%</text>
<rect x="40" y="706" width="278.79999999999995" height="70" fill="#f2c9b0" stroke="#1e2a44" stroke-width="2.5"/><text x="179.39999999999998" y="751" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">C 34%</text>
<rect x="318.79999999999995" y="706" width="278.79999999999995" height="70" fill="#c9d3ee" stroke="#1e2a44" stroke-width="2.5"/><text x="458.19999999999993" y="751" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">G 34%</text>
<rect x="597.5999999999999" y="706" width="131.2" height="70" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="663.1999999999999" y="751" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">A 16%</text>
<rect x="728.8" y="706" width="131.2" height="70" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="794.4" y="751" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">T 16%</text>
<rect x="30" y="852" width="840" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/>
<text x="450" y="895" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">Check: 34 + 34 + 16 + 16 = 100</text>
</svg>