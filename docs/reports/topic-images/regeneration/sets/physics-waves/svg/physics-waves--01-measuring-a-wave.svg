<text x="70" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Wave speed</text>
<text x="70" y="582" font-size="32" font-weight="700" fill="#2e6b62" text-anchor="start">v = f × λ</text>
<text x="70" y="646" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">= 5 × 0.40</text>
<text x="70" y="702" font-size="28" font-weight="700" fill="#8a6d0d" text-anchor="start">= 2.0 m/s</text>
<text x="490" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Frequency</text>
<text x="490" y="570" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="start">f = 5 Hz</text>
<text x="490" y="604" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">5 waves each second</text>
<text x="490" y="660" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Period</text>
<text x="490" y="706" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="start">T = 1 ÷ 5 = 0.2 s</text>
