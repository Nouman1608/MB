<text x="574" y="374" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">identical tails</text>
<line x1="40" y1="420" x2="860" y2="420" stroke="#1e2a44" stroke-width="2.5"/>
<text x="40" y="490" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="start">100x − x = 36</text>
<text x="480" y="490" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">tails cancel</text>
<line x1="120" y1="516" x2="120" y2="568" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/>
<text x="40" y="630" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="start">99x = 36</text>
<line x1="120" y1="656" x2="120" y2="708" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/>
<text x="40" y="770" font-size="38" font-weight="700" fill="#2e6b62" text-anchor="start">x = 36/99 = 4/11</text>
<text x="560" y="768" font-size="21" font-weight="400" fill="#4a5568" text-anchor="start">÷ 9 top and bottom</text>
<text x="40" y="830" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">Check: 4 ÷ 11 = 0.363636…</text>
