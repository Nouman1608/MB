<text x="104" y="216" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Primary</text>
<text x="104" y="244" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">920 turns</text>
<text x="104" y="300" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">230 V</text>
<text x="104" y="330" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">a.c. in</text>
<text x="818" y="216" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">Secondary</text>
<text x="818" y="244" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">48 turns</text>
<text x="818" y="300" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">12 V</text>
<text x="818" y="330" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">a.c. out</text>
<rect x="30" y="420" width="840" height="140" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/>
<text x="450" y="474" font-size="32" font-weight="700" fill="#2e6b62" text-anchor="middle">V<tspan dy="5" font-size="70%">s</tspan><tspan dy="-5" dx="5">= 230 × 48 ÷ 920 = 12 V</tspan></text>
<text x="450" y="510" font-size="21" font-weight="400" fill="#4a5568" text-anchor="middle">V<tspan dy="5" font-size="70%">p</tspan><tspan dy="-5" dx="4">/ V</tspan><tspan dy="5" font-size="70%">s</tspan><tspan dy="-5" dx="4">= N</tspan><tspan dy="5" font-size="70%">p</tspan><tspan dy="-5" dx="4">/ N</tspan><tspan dy="5" font-size="70%">s</tspan></text>
<text x="450" y="542" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">1 loop drawn ≈ 48 turns</text>
<rect x="30" y="578" width="840" height="120" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/>
<text x="450" y="626" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Power in = power out</text>
<text x="450" y="672" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="middle">230 V × 0.078 A = 12 V × 1.5 A = 18 W</text>
