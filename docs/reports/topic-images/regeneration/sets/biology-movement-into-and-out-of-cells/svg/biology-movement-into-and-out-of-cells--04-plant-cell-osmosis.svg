<rect x="546" y="164" width="248" height="102" rx="10" fill="#cfe3ea" stroke="#1e2a44" stroke-width="2"/>
<text x="670" y="222" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">turgor pressure</text>
