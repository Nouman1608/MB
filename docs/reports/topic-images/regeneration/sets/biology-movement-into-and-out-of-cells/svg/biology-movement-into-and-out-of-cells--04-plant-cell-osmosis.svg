<text x="50" y="220" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Dilute solution outside</text><text x="50" y="248" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Water moves in</text><text x="50" y="276" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Cell is firm</text>
