<line x1="516" y1="472" x2="470" y2="472" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/>
<text x="50" y="420" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Flaccid</text>
<text x="50" y="460" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Same concentration</text><text x="50" y="488" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">No net water movement</text><text x="50" y="516" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Cell is limp</text>
