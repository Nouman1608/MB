<text x="50" y="660" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Plasmolysed</text>
<text x="50" y="700" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Concentrated solution</text><text x="50" y="728" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Water moves out</text><text x="50" y="756" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Membrane leaves wall</text>
