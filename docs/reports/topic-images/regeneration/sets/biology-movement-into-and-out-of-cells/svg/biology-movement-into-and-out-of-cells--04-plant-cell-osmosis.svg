<text x="348" y="891" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">cytoplasm, membrane</text>
<rect x="620" y="870" width="36" height="28" rx="8" fill="#cfe3ea" stroke="#1e2a44" stroke-width="2"/>
<text x="668" y="891" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">vacuole</text>
