<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" width="900" height="1050" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1050" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why water resists heating</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Same energy, two different effects</text>
<rect x="30" y="140" width="840" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/>
<text x="56" y="186" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="start">High specific heat capacity</text>
<text x="56" y="218" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">500 kJ absorbed by 42 kg of liquid</text>
<line x1="250" y1="245" x2="250" y2="422" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="300" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Water</text>
<rect x="250" y="262" width="208.59788359788362" height="60" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/>
<text x="472.59788359788365" y="302" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">2.85 °C</text>
<text x="56" y="390" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Other liquid*</text>
<rect x="250" y="350" width="415.00000000000006" height="60" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/>
<text x="679" y="390" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">5.67 °C</text>
<text x="56" y="462" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">*half water’s specific heat capacity</text>
<text x="56" y="500" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Smaller rise: steadier body temperature</text>
<rect x="30" y="550" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/>
<text x="56" y="596" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="start">High latent heat of vaporisation</text>
<text x="56" y="628" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Remove 90 kJ from the body</text>
<text x="56" y="684" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evaporate water</text>
<rect x="100" y="708" width="5" height="46" rx="2" fill="#2e6b62"/>
<text x="122" y="742" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="start">37.5 g</text>
<text x="56" y="814" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Warm water by 1 °C instead</text>
<rect x="100" y="838" width="700" height="46" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/>
<text x="784" y="870" font-size="24" font-weight="700" fill="#8a6d0d" text-anchor="end">21.5 kg</text>
<text x="56" y="960" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Same scale: the evaporation bar is a sliver</text>
</svg>