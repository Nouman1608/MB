<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 934" width="900" height="934" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="934" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Monopoly welfare loss</text>

<line x1="120" y1="660" x2="830" y2="660" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="120" y1="660" x2="120" y2="98" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="826" y="694" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Quantity</text><text x="106" y="92" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Price, cost</text>
<text x="108" y="438" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">6</text>
<text x="108" y="362" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">8</text>
<text x="108" y="286" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">10</text>
<text x="460" y="690" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">40</text>
<text x="630" y="690" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">60</text>
<text x="108" y="666" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">0</text>
<polygon points="460,280 460,432 630,356" fill="#d4b02e" fill-opacity="0.55" stroke="#8a6d0d" stroke-width="2.5"/>
<path d="M120 128 L800 432" fill="none" stroke="#2b5a9a" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
<path d="M120 128 L630 584" fill="none" stroke="#2b5a9a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/>
<path d="M120 584 L800 280" fill="none" stroke="#b5602e" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
<text x="810" y="438" font-size="20" font-weight="700" fill="#2b5a9a" text-anchor="start">D</text>
<text x="640" y="590" font-size="20" font-weight="700" fill="#2b5a9a" text-anchor="start">MR</text>
<text x="810" y="286" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">MC</text>
<line x1="120" y1="280" x2="460" y2="280" stroke="#1e2a44" stroke-width="1.8" stroke-dasharray="5 6"/>
<line x1="460" y1="280" x2="460" y2="660" stroke="#1e2a44" stroke-width="1.8" stroke-dasharray="5 6"/>
<line x1="120" y1="432" x2="460" y2="432" stroke="#1e2a44" stroke-width="1.8" stroke-dasharray="5 6"/>
<line x1="120" y1="356" x2="630" y2="356" stroke="#1e2a44" stroke-width="1.8" stroke-dasharray="5 6"/>
<line x1="630" y1="356" x2="630" y2="660" stroke="#1e2a44" stroke-width="1.8" stroke-dasharray="5 6"/>
<circle cx="460" cy="280" r="7" fill="#1e2a44"/>
<circle cx="460" cy="432" r="7" fill="#1e2a44"/>
<circle cx="630" cy="356" r="7" fill="#1e2a44"/>
<text x="474" y="260" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">monopoly</text>
<text x="646" y="424" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">P = MC</text>
<rect x="60" y="712" width="780" height="166" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/>
<text x="80" y="746" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Monopoly: MR = MC at output 40, price 10, where MC = 6.</text>
<text x="80" y="772" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Allocative efficiency: P = MC = 8 at output 60.</text>
<text x="80" y="808" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Welfare loss = ½ × (10 − 6) × (60 − 40) = ½ × 4 × 20 = 40</text>
<text x="80" y="836" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Units 40 to 60 are worth more to buyers than they cost to make,</text>
<text x="80" y="860" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">but the monopolist does not produce them.</text>
<text x="450" y="910" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Illustrative numbers; straight lines drawn through the worked-check values</text>
</svg>