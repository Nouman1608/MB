<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" width="900" height="1080" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1080" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two triangles, five angles</text>

<text x="60" y="140" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">Half a square</text>
<path d="M90 170 L90 400 L320 400 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3.5"/>
<rect x="90" y="366" width="34" height="34" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
<text x="70" y="292" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="end">1</text>
<text x="205" y="436" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text>
<text x="222" y="272" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">√2</text>
<text x="102" y="282" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">45°</text>
<text x="224" y="386" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">45°</text>
<text x="470" y="228" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="start">sin 45°</text>
<text x="620" y="228" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="start">= 1/√2 = √2/2</text>
<text x="470" y="298" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="start">cos 45°</text>
<text x="620" y="298" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="start">= 1/√2 = √2/2</text>
<text x="470" y="368" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="start">tan 45°</text>
<text x="620" y="368" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="start">= 1/1 = 1</text>
<text x="60" y="570" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">Half an equilateral triangle</text>
<path d="M90 900 L420 900 L420 710 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3.5"/>
<rect x="386" y="866" width="34" height="34" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
<text x="232" y="778" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text>
<text x="442" y="812" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">1</text>
<text x="255" y="940" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">√3</text>
<text x="196" y="888" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">30°</text>
<text x="356" y="820" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">60°</text>
<text x="560" y="630" font-size="23" font-weight="700" fill="#8a6d0d" text-anchor="start">30°</text>
<text x="560" y="684" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="start">sin 30° = 1/2</text><text x="560" y="738" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="start">cos 30° = √3/2</text><text x="560" y="792" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="start">tan 30° = 1/√3</text>
<text x="560" y="870" font-size="23" font-weight="700" fill="#8a6d0d" text-anchor="start">60°</text>
<text x="560" y="924" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="start">sin 60° = √3/2</text><text x="560" y="978" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="start">cos 60° = 1/2</text><text x="560" y="1032" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="start">tan 60° = √3</text>
</svg>