<text x="400" y="446" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="start">Phagocytosis, antibodies</text><text x="400" y="480" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="start">Each has a nucleus</text>
<text x="400" y="544" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="start">Lymphocytes: make antibodies</text><text x="400" y="578" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="start">Phagocytes: engulf pathogens</text>
