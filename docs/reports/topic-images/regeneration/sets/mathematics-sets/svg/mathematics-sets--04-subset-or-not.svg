<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 990" width="900" height="990" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="990" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Subset or not?</text>

<rect x="20" y="100" width="860" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/>
<text x="50" y="222" font-size="34" font-weight="700" fill="#2e6b62" text-anchor="start">A ⊆ B</text>
<text x="50" y="276" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">every A is in B</text>
<circle cx="600" cy="235" r="116" fill="none" stroke="#2e6b62" stroke-width="3.5"/>
<circle cx="600" cy="235" r="60" fill="none" stroke="#8a6d0d" stroke-width="3.5"/>
<text x="500" y="147" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">B</text>
<text x="530" y="194" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">A</text>
<text x="580" y="244" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text>
<text x="622" y="244" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
<text x="560" y="319" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text>
<text x="650" y="315" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
<rect x="20" y="390" width="860" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/>
<text x="50" y="512" font-size="34" font-weight="700" fill="#2e6b62" text-anchor="start">A ⊈ B</text>
<text x="50" y="566" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">one A is not in B</text>
<text x="50" y="616" font-size="20" font-weight="700" fill="#c0643a" text-anchor="start">6 ∈ A, but 6 ∉ B</text>
<circle cx="490" cy="525" r="100" fill="none" stroke="#8a6d0d" stroke-width="3.5"/>
<circle cx="650" cy="525" r="100" fill="none" stroke="#2e6b62" stroke-width="3.5"/>
<text x="440" y="414" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">A</text>
<text x="700" y="414" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">B</text>
<circle cx="430" cy="525" r="26" fill="none" stroke="#c0643a" stroke-width="3.5"/>
<text x="430" y="534" font-size="25" font-weight="700" fill="#c0643a" text-anchor="middle">6</text>
<text x="570" y="534" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text>
<text x="690" y="504" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
<text x="700" y="574" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
<text x="660" y="614" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text>
<rect x="20" y="680" width="860" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/>
<text x="50" y="822" font-size="34" font-weight="700" fill="#2e6b62" text-anchor="start">A ∩ B = ∅</text>
<text x="50" y="876" font-size="20" font-weight="400" fill="#4a5568" text-anchor="start">no shared elements</text>
<circle cx="520" cy="815" r="95" fill="none" stroke="#8a6d0d" stroke-width="3.5"/>
<circle cx="740" cy="815" r="95" fill="none" stroke="#2e6b62" stroke-width="3.5"/>
<text x="520" y="704" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">A</text>
<text x="740" y="704" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">B</text>
<text x="490" y="824" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text>
<text x="550" y="824" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
<text x="710" y="824" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text>
<text x="770" y="824" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>