<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="860" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reversing the condition</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Factory: 4% faulty, test flags 95% / 3%</text>
<g transform="translate(0 -40)"><text x="50" y="232" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Test 10 000 components</text>
<rect x="50" y="252" width="32" height="64" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/>
<rect x="82" y="252" width="768" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/>
<text x="466" y="294" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">good 9 600</text>
<line x1="66" y1="316" x2="66" y2="346" stroke="#8a6d0d" stroke-width="3"/>
<text x="50" y="374" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">faulty 400</text>
<line x1="66" y1="400" x2="66" y2="432" stroke="#8a6d0d" stroke-width="5"/><polygon points="66,458 49,424 83,424" fill="#8a6d0d"/>
<text x="90" y="428" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">flag 95%: 380</text>
<line x1="570" y1="400" x2="570" y2="432" stroke="#2e6b62" stroke-width="5"/><polygon points="570,458 553,424 587,424" fill="#2e6b62"/>
<text x="594" y="428" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">flag 3%: 288</text>
<text x="50" y="560" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Flagged: 380 + 288 = 668</text>
<rect x="50" y="580" width="455.0898203592814" height="64" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/>
<rect x="505.0898203592814" y="580" width="344.9101796407186" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/>
<text x="277.54491017964074" y="622" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">faulty 380</text>
<text x="677.5449101796407" y="622" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">good 288</text>
<rect x="186" y="690" width="528" height="44" rx="22" fill="#1e2a44"/><text x="450" y="720" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">P(faulty | flagged) = 380/668 = 0.569</text>
<rect x="180" y="746" width="540" height="44" rx="22" fill="#2e6b62"/><text x="450" y="776" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">or 0.04 × 0.95 / 0.0668 = 0.038/0.0668</text>
<text x="450" y="832" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Only about 57% of flagged parts are faulty:</text>
<text x="450" y="866" font-size="22" font-weight="700" fill="#4a5568" text-anchor="middle">good parts are so common that 3% of them is a lot.</text></g>
</svg>