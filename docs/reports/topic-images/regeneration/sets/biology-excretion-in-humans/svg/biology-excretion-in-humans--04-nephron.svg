<text x="360" y="165" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Glomerulus</text>
<line x1="360" y1="176" x2="360" y2="260" stroke="#1e2a44" stroke-width="2.5"/>
<text x="40" y="185" font-size="22" font-weight="700" fill="#c0643a" text-anchor="start">Blood in</text>
<text x="40" y="310" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Capsule</text>
<line x1="160" y1="303" x2="264" y2="303" stroke="#1e2a44" stroke-width="2.5"/>
<text x="40" y="470" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Tubule</text>
<line x1="150" y1="462" x2="322" y2="462" stroke="#1e2a44" stroke-width="2.5"/>
<circle cx="60" cy="375" r="19" fill="#1e2a44"/><text x="60" y="382" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="96" y="370" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Filtration</text>
<text x="96" y="402" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">at glomerulus</text>
<text x="590" y="390" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">Blood cells and</text>
<text x="590" y="418" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">protein stay in</text>
<text x="590" y="446" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">the blood</text>
<text x="490" y="672" font-size="22" font-weight="700" fill="#c0643a" text-anchor="start">Blood out</text>
<circle cx="60" cy="750" r="19" fill="#1e2a44"/><text x="60" y="757" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="96" y="745" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Reabsorption</text>
<text x="96" y="780" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">all glucose</text>
<text x="96" y="808" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">most water</text>
<text x="96" y="836" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">some ions</text>
<text x="700" y="910" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="end">Collecting</text>
<text x="700" y="941" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="end">duct</text>
<text x="700" y="972" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="end">to the ureter</text>
<circle cx="60" cy="1105" r="19" fill="#1e2a44"/><text x="60" y="1112" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="96" y="1100" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Urine: urea, excess water,</text>
<text x="96" y="1131" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">excess ions. No glucose.</text>
<circle cx="80" cy="1191" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/>
<text x="100" y="1198" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">glucose</text>
<rect x="243" y="1184" width="14" height="14" fill="#1e2a44" stroke="#ffffff" stroke-width="1.5"/>
<text x="268" y="1198" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">urea</text>
<circle cx="360" cy="1191" r="10" fill="#a8392a" stroke="#ffffff" stroke-width="1.5"/>
<text x="380" y="1198" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">blood cell</text>
<line x1="530" y1="1191" x2="584" y2="1191" stroke="#c0643a" stroke-width="8"/>
<text x="594" y="1198" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">blood vessel</text>
