<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Public patriarchy at work: a care home</text>

<rect x="200" y="112" width="260" height="96" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Regional director</text><text x="330" y="170" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">a man</text><circle cx="330" cy="192" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="130" y="228" width="400" height="96" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="262" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Female manager</text><text x="330" y="286" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">holds power over the care assistants</text><circle cx="330" cy="308" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="50" y="344" width="560" height="96" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="378" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Care assistants</text><text x="330" y="402" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">mostly women: low-paid, low-status work</text><circle cx="194" cy="424" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="228" cy="424" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="262" cy="424" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="296" cy="424" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="330" cy="424" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="364" cy="424" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="398" cy="424" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="432" cy="424" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="466" cy="424" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="640" y="112" width="230" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="656" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Walby</text><text x="656" y="166" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Public patriarchy: women</text><text x="656" y="186" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">in paid work, held below</text><text x="656" y="206" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">senior posts</text><rect x="640" y="248" width="230" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="656" y="276" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Critics</text><text x="656" y="302" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Class divides women too: a</text><text x="656" y="322" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">female manager has power</text><text x="656" y="342" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">over other women</text><line x1="636" y1="196" x2="566" y2="340" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="636" y1="308" x2="536" y2="286" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="120" cy="472" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="136" y="478" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">man</text><circle cx="200" cy="472" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="216" y="478" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">woman</text>
</svg>