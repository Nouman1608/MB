<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 742" width="900" height="742" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="742" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven factors that shape power</text>

<rect x="218" y="104" width="322" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="379" y="130.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Who has less power, and how</text><rect x="548" y="104" width="322" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="709" y="130.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Balancing forces</text><rect x="30" y="156" width="180" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="197.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Social class</text><rect x="218" y="156" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Owners and managers decide pay and</text><text x="232" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">jobs; wealth buys influence</text><rect x="548" y="156" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Trade unions; industrial disputes</text><text x="562" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such as strikes</text><rect x="30" y="236" width="180" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="277.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gender</text><rect x="218" y="236" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Men held most formal power; glass</text><text x="232" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ceiling; unequal domestic labour</text><rect x="548" y="236" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women’s entry into paid work and</text><text x="562" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public life</text><rect x="30" y="316" width="180" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="357.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sexuality</text><rect x="218" y="316" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Heterosexuality treated as the norm;</text><text x="232" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prejudice limits openness</text><rect x="548" y="316" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Civil Partnership Act 2004; same-sex</text><text x="562" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marriage Act 2013</text><rect x="30" y="396" width="180" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="437.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Race</text><rect x="218" y="396" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="426.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Institutional racism;</text><text x="232" y="447.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">under-represented in senior posts</text><rect x="548" y="396" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="426.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Race Relations Acts; Equality Act</text><text x="562" y="447.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2010</text><rect x="30" y="476" width="180" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="517.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Age</text><rect x="218" y="476" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="506.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children have little formal power;</text><text x="232" y="527.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ageism at work</text><rect x="548" y="476" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="506.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Older people more likely to vote</text><rect x="30" y="556" width="180" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="597.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Disability</text><rect x="218" y="556" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="586.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Barriers; decisions made FOR, not</text><text x="232" y="607.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">WITH, disabled people</text><rect x="548" y="556" width="322" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="586.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Campaigns led to the 1995 Act</text><rect x="30" y="636" width="180" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="667.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Religion and</text><text x="42" y="689.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">beliefs</text><rect x="218" y="636" width="322" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="666.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Moral authority over members;</text><text x="232" y="687.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">minorities have less influence</text><rect x="548" y="636" width="322" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="562" y="666.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Links to gender where leadership is</text><text x="562" y="687.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reserved for men</text>
</svg>