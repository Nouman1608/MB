<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="516" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which power relationship is fundamental?</text>

<rect x="30" y="104" width="269.3333333333333" height="271" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,176 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,176 Z" fill="#f2e7b8"/><line x1="31.25" y1="176" x2="298.0833333333333" y2="176" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="145.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist: gender</text><circle cx="51" cy="203.92" r="4.5" fill="#2e6b62"/><text x="64" y="209.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Walby’s six structures show</text><text x="64" y="230.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">male domination in public</text><text x="64" y="251.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and private life</text><circle cx="51" cy="274.92" r="4.5" fill="#2e6b62"/><text x="64" y="280.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists differ: laws and</text><text x="64" y="301.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">education; male violence</text><text x="64" y="322.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and sexuality; links to</text><text x="64" y="343.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">capitalism</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="271" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,176 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,176 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="176" x2="583.4166666666666" y2="176" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="145.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist: class</text><circle cx="336.3333333333333" cy="203.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="209.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rooted in ownership of the</text><text x="349.3333333333333" y="230.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">means of production</text><circle cx="336.3333333333333" cy="253.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="259.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Racism and sexism divide</text><text x="349.3333333333333" y="280.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">workers and hide shared</text><text x="349.3333333333333" y="301.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">class interests, which</text><text x="349.3333333333333" y="322.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">benefits the ruling class</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="271" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,176 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,176 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="176" x2="868.75" y2="176" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="133.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist:</text><text x="735.3333333333333" y="158.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">complementary roles</text><circle cx="621.6666666666666" cy="203.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="209.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Roles complement each other</text><text x="634.6666666666666" y="230.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rather than dominate</text><circle cx="621.6666666666666" cy="253.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="259.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parsons: instrumental and</text><text x="634.6666666666666" y="280.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expressive roles are</text><text x="634.6666666666666" y="301.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">functional</text><circle cx="621.6666666666666" cy="324.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Power used legitimately for</text><text x="634.6666666666666" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shared goals</text><rect x="30" y="391" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="427" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Comparing them</text><text x="56" y="456" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists and Marxists both see unequal power and conflict but disagree about which division</text><text x="56" y="478" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is fundamental; functionalists see consensus.</text>
</svg>