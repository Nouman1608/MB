<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" width="900" height="535" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="535" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating Walby</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Theorizing Patriarchy (1990)</text>
<rect x="30" y="120" width="404" height="282" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L419.75,121.25 Q432.75,121.25 432.75,134.25 L432.75,170 Z" fill="#b5d3cf"/><line x1="31.25" y1="170" x2="432.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="150.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Strengths</text><circle cx="53" cy="200.79" r="4.5" fill="#2e6b62"/><text x="66" y="206.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Patriarchy works through <tspan font-weight="700">several</tspan></text><text x="66" y="228.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">connected structures</tspan>, not a single cause</text><circle cx="53" cy="252.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="258.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The <tspan font-weight="700">private to public</tspan> shift explains why</text><text x="66" y="280.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">inequality persists as women enter paid</text><text x="66" y="302.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">work</text><circle cx="53" cy="326.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="332.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Links across the course: unpaid domestic</text><text x="66" y="354.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">labour, gendered subject choice, the</text><text x="66" y="376.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">glass ceiling</text><rect x="466" y="120" width="404" height="282" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,170 L467.25,134.25 Q467.25,121.25 480.25,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#f2e7b8"/><line x1="467.25" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="150.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Limitations</text><circle cx="489" cy="200.79" r="4.5" fill="#8a6d0d"/><text x="502" y="206.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Less weight on differences between women</text><text x="502" y="228.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">by <tspan font-weight="700">class and ethnicity</tspan></text><circle cx="489" cy="252.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="258.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Women’s gains in education and</text><text x="502" y="280.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">professions may mean the structures are</text><text x="502" y="302.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weakening faster</text><circle cx="489" cy="326.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="332.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">About <tspan font-weight="700">Western society</tspan>; may not apply</text><text x="502" y="354.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">elsewhere in the same way</text><circle cx="450" cy="261" r="24" fill="#1e2a44"/><text x="450" y="268" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="420" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="456" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Memory hook for the six structures</text><text x="56" y="485" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pay, Production, Culture, Sex, Violence, State.</text>
</svg>