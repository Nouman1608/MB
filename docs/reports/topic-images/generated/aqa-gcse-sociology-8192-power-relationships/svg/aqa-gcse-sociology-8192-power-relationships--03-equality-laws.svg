<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 639" width="900" height="639" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="639" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The law as a factor</text>

<rect x="30" y="112" width="470" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="50" y="142" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">1970</text><text x="120" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Equal Pay Act</text><text x="120" y="168" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Equal pay for equal work</text><path d="M504,148 L560,148 L560,277 L590,277" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="198" width="470" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="50" y="228" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">1975</text><text x="120" y="228" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sex Discrimination Act</text><text x="120" y="254" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sex, in employment and other areas</text><path d="M504,234 L560,234 L560,277 L590,277" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="284" width="470" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="50" y="314" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">1976</text><text x="120" y="314" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Race Relations Act</text><text x="120" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Race</text><path d="M504,320 L560,320 L560,277 L590,277" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="370" width="470" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="50" y="400" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">1995</text><text x="120" y="400" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Disability Discrimination Act</text><text x="120" y="426" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Disabled people</text><path d="M504,406 L560,406 L560,277 L590,277" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="590" y1="277" x2="600" y2="277" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="604" y="155" width="266" height="210" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="737" y="195" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">2010</text><text x="737" y="223" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Equality Act</text><text x="737" y="255" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Brought earlier laws together:</text><text x="737" y="275" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">age, disability, race,</text><text x="737" y="295" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">religion or belief, sex,</text><text x="737" y="315" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">sexual orientation</text><rect x="30" y="466" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="502" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use laws carefully</text><circle cx="61" cy="525.39" r="4.5" fill="#8a6d0d"/><text x="74" y="531" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Laws change <tspan font-weight="700">formal</tspan> power, but informal prejudice can persist</text><circle cx="61" cy="555.39" r="4.5" fill="#8a6d0d"/><text x="74" y="561" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Walby: equal opportunities laws are <tspan font-weight="700">seldom enforced</tspan></text><circle cx="61" cy="585.39" r="4.5" fill="#8a6d0d"/><text x="74" y="591" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Do not treat equality laws as proof that inequality has ended</text>
</svg>