<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a power relationship is</text>

<text x="450" y="96" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">One person or group shapes the choices, opportunities or behaviour of another</text><rect x="30" y="122" width="230" height="64" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="145" y="161" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Families</text><rect x="276" y="122" width="594" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="296" y="161" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Partners; parents and children</text><rect x="30" y="200" width="230" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="145" y="239" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Workplaces</text><rect x="276" y="200" width="594" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="296" y="239" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Employers and employees</text><rect x="30" y="278" width="230" height="64" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="145" y="317" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Schools</text><rect x="276" y="278" width="594" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="296" y="317" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Teachers and pupils</text><rect x="30" y="356" width="230" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="145" y="395" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Politics</text><rect x="276" y="356" width="594" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="296" y="395" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Government and citizens</text><rect x="30" y="434" width="230" height="64" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="145" y="473" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Criminal justice</text><rect x="276" y="434" width="594" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="296" y="473" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Police and suspects</text><rect x="30" y="518" width="400" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,568 L31.25,532.25 Q31.25,519.25 44.25,519.25 L415.75,519.25 Q428.75,519.25 428.75,532.25 L428.75,568 Z" fill="#ffffff"/><line x1="31.25" y1="568" x2="428.75" y2="568" stroke="#c9d6d4" stroke-width="2"/><text x="230" y="548.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3.6.5 Power and authority</text><text x="44" y="600.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What <tspan font-weight="700">kinds</tspan> of power and authority exist?</text><rect x="470" y="518" width="400" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M471.25,568 L471.25,532.25 Q471.25,519.25 484.25,519.25 L855.75,519.25 Q868.75,519.25 868.75,532.25 L868.75,568 Z" fill="#d4b02e"/><line x1="471.25" y1="568" x2="868.75" y2="568" stroke="#c9d6d4" stroke-width="2"/><text x="670" y="548.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3.6.6 Power relationships</text><text x="484" y="600.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Which <tspan font-weight="700">social factors</tspan> make some groups more</text><text x="484" y="622.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">powerful?</text>
</svg>