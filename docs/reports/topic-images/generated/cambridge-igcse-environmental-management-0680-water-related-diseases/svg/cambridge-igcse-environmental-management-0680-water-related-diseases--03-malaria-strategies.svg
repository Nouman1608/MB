<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Breaking the malaria cycle</text>

<rect x="30" y="110" width="220" height="116" rx="12" fill="#8a6d0d"/><text x="140" y="164" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Stop the bite</text><text x="140" y="188" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">personal protection</text><rect x="262" y="110" width="608" height="116" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="282" y="142" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="298" y="142" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Insecticide-treated bed nets: stop night-time bites and kill</text><text x="298" y="162" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mosquitoes that land</text><text x="282" y="192" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="298" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Insect repellent on skin or clothing</text><rect x="30" y="242" width="220" height="156" rx="12" fill="#2e6b62"/><text x="140" y="316" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Fewer mosquitoes</text><text x="140" y="340" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">vector control</text><rect x="262" y="242" width="608" height="156" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="282" y="274" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="298" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cover or drain breeding areas: puddles, drains, containers</text><text x="282" y="304" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="298" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Spray insecticides over large areas</text><text x="282" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="298" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Release sterilised males: no offspring</text><text x="282" y="364" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="298" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Biological control: fish eat larvae</text><rect x="30" y="414" width="220" height="116" rx="12" fill="#2b5a9a"/><text x="140" y="468" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Less infection in people</text><text x="140" y="492" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">personal protection</text><rect x="262" y="414" width="608" height="116" rx="12" fill="#e9eef6" stroke="#2b5a9a" stroke-width="2.5"/><text x="282" y="446" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="298" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Vaccination for young children: less severe illness, not complete</text><text x="282" y="476" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="298" y="476" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Antimalarial drugs: prevent, or treat so people stop being a</text><text x="298" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">source of parasites</text><text x="450" y="562" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Every control strategy breaks one link in the transmission cycle.</text>
</svg>