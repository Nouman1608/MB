<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How malaria spreads</text>

<circle cx="220" cy="400" r="85" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><circle cx="220" cy="370" r="14" fill="#1e2a44"/><path d="M202,438 L202,406 Q202,388 220,388 Q238,388 238,406 L238,438 Z" fill="#1e2a44"/><text x="220" y="512" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">human</text><circle cx="680" cy="230" r="65" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><ellipse cx="670" cy="230" rx="32" ry="10" fill="#1e2a44"/><circle cx="706" cy="226" r="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><line x1="712" y1="226" x2="738" y2="238" stroke="#1e2a44" stroke-width="3.2"/><ellipse cx="666" cy="212" rx="24" ry="10" fill="#ffffff" stroke="#1e2a44" stroke-width="1.4" transform="rotate(-20 670 212)"/><line x1="654" y1="238" x2="642" y2="262" stroke="#1e2a44" stroke-width="2.8"/><line x1="670" y1="238" x2="658" y2="262" stroke="#1e2a44" stroke-width="2.8"/><line x1="686" y1="238" x2="674" y2="262" stroke="#1e2a44" stroke-width="2.8"/><text x="680" y="150" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">non-infected mosquito</text><circle cx="680" cy="540" r="65" fill="#fbf1ea" stroke="#b5602e" stroke-width="3"/><ellipse cx="670" cy="540" rx="32" ry="10" fill="#b5602e"/><circle cx="706" cy="536" r="8" fill="#b5602e" stroke="#b5602e" stroke-width="1"/><line x1="712" y1="536" x2="738" y2="548" stroke="#b5602e" stroke-width="3.2"/><ellipse cx="666" cy="522" rx="24" ry="10" fill="#ffffff" stroke="#b5602e" stroke-width="1.4" transform="rotate(-20 670 522)"/><line x1="654" y1="548" x2="642" y2="572" stroke="#b5602e" stroke-width="2.8"/><line x1="670" y1="548" x2="658" y2="572" stroke="#b5602e" stroke-width="2.8"/><line x1="686" y1="548" x2="674" y2="572" stroke="#b5602e" stroke-width="2.8"/><text x="680" y="630" font-size="16.5" font-weight="700" fill="#b5602e" text-anchor="middle">infected mosquito</text><path d="M290,345 Q470,200 608,222" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="376" cy="180" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="376" y="185.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="398" y="176" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">feeds on an infected human:</text><text x="398" y="195" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">picks up the parasite</text><path d="M680,300 L680,468" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="696" y="380" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">parasite develops</text><text x="696" y="399" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">inside the mosquito</text><path d="M612,560 Q430,610 290,455" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><circle cx="300" cy="560" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="300" y="565.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="322" y="586" font-size="15.5" font-weight="600" fill="#b5602e" text-anchor="start">bite passes Plasmodium</text><text x="322" y="605" font-size="15.5" font-weight="600" fill="#b5602e" text-anchor="start">to the human</text><rect x="40" y="110" width="300" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="140" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="145.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="146" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Vector: female Anopheles</text><text x="90" y="166" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">mosquito. Only females bite:</text><text x="90" y="186" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">they need blood to make eggs.</text><rect x="30" y="660" width="840" height="90" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><rect x="50" y="690" width="170" height="40" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><path d="M66,712 q6,-6 12,0 q6,6 12,0" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M104,712 q6,-6 12,0 q6,6 12,0" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M142,712 q6,-6 12,0 q6,6 12,0" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M180,712 q6,-6 12,0 q6,6 12,0" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="698" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">Link to water: females lay eggs on still water (ponds, puddles, drains,</text><text x="240" y="720" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">uncovered containers); larvae live in it until they become adults.</text><text x="450" y="785" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">In people the parasite multiplies in the liver, then in red blood cells, causing fever and illness.</text>
</svg>