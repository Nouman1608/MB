<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing cholera strategies</text>

<text x="345" y="132" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Benefit</text><text x="690" y="132" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Limitation</text><rect x="30" y="148" width="190" height="68" rx="10" fill="#2b5a9a"/><text x="125" y="188" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Handwashing</text><rect x="230" y="148" width="230" height="68" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="178" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">very cheap; also</text><text x="244" y="197" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">prevents other diseases</text><rect x="470" y="148" width="400" height="68" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="484" y="188" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">needs soap, clean water and behaviour change</text><rect x="30" y="226" width="190" height="68" rx="10" fill="#2b5a9a"/><text x="125" y="256" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Sanitation and</text><text x="125" y="275" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">sewage treatment</text><rect x="230" y="226" width="230" height="68" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="256" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">removes the cause</text><text x="244" y="275" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">permanently</text><rect x="470" y="226" width="400" height="68" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="484" y="266" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">very high cost and long building time</text><rect x="30" y="304" width="190" height="68" rx="10" fill="#2b5a9a"/><text x="125" y="344" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Boiling</text><rect x="230" y="304" width="230" height="68" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="344" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">simple; kills bacteria</text><rect x="470" y="304" width="400" height="68" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="484" y="334" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">needs fuel; burning wood adds to</text><text x="484" y="353" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">deforestation and indoor smoke</text><rect x="30" y="382" width="190" height="68" rx="10" fill="#2b5a9a"/><text x="125" y="422" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Chlorination</text><rect x="230" y="382" width="230" height="68" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="412" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">treats large volumes;</text><text x="244" y="431" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">protects water in pipes</text><rect x="470" y="382" width="400" height="68" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="484" y="422" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">needs chemicals, trained staff and monitoring</text><rect x="30" y="460" width="190" height="68" rx="10" fill="#2b5a9a"/><text x="125" y="490" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Cholera</text><text x="125" y="509" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">vaccination</text><rect x="230" y="460" width="230" height="68" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="490" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">rapid protection during</text><text x="244" y="509" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">outbreaks</text><rect x="470" y="460" width="400" height="68" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="484" y="500" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">not lifelong; does not fix the water supply</text>
</svg>