<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two diseases, two routes</text>

<rect x="230" y="110" width="310" height="56" rx="12" fill="#8a6d0d"/><text x="385" y="146" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Malaria</text><rect x="560" y="110" width="310" height="56" rx="12" fill="#2b5a9a"/><text x="715" y="146" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Cholera</text><rect x="30" y="180" width="190" height="88" rx="12" fill="#1e2a44"/><text x="125" y="230" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Cause</text><rect x="230" y="180" width="310" height="88" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="385" y="220" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Plasmodium, a single-celled</text><text x="385" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">parasite</text><rect x="560" y="180" width="310" height="88" rx="12" fill="#e9eef6" stroke="#2b5a9a" stroke-width="2.5"/><text x="715" y="230" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a bacterium</text><rect x="30" y="280" width="190" height="88" rx="12" fill="#1e2a44"/><text x="125" y="318" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">How it reaches</text><text x="125" y="339" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">people</text><rect x="230" y="280" width="310" height="88" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="385" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">bite of an infected female</text><text x="385" y="340" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Anopheles mosquito (the vector)</text><rect x="560" y="280" width="310" height="88" rx="12" fill="#e9eef6" stroke="#2b5a9a" stroke-width="2.5"/><text x="715" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">drinking water or eating food</text><text x="715" y="340" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">contaminated with faeces</text><rect x="30" y="380" width="190" height="88" rx="12" fill="#1e2a44"/><text x="125" y="430" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Link to water</text><rect x="230" y="380" width="310" height="88" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="385" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">mosquito larvae develop in still</text><text x="385" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">or slow-moving water</text><rect x="560" y="380" width="310" height="88" rx="12" fill="#e9eef6" stroke="#2b5a9a" stroke-width="2.5"/><text x="715" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">untreated sewage contaminates</text><text x="715" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">water sources</text><rect x="30" y="480" width="190" height="88" rx="12" fill="#1e2a44"/><text x="125" y="530" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Control aims</text><rect x="230" y="480" width="310" height="88" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="385" y="520" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">stop bites, kill the vector,</text><text x="385" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">treat or prevent infection</text><rect x="560" y="480" width="310" height="88" rx="12" fill="#e9eef6" stroke="#2b5a9a" stroke-width="2.5"/><text x="715" y="520" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">keep faeces out of water, make</text><text x="715" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">water safe, prevent infection</text><rect x="30" y="590" width="840" height="70" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="632" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">No mosquito nets for cholera; no chlorination for malaria.</text>
</svg>