<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Blocking the cholera route</text>

<rect x="40" y="150" width="240" height="80" rx="12" fill="#fbf1ea" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="184" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Infected person’s</text><text x="160" y="206" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="middle">faeces</text><rect x="330" y="150" width="240" height="80" rx="12" fill="#e9eef6" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="196" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Water source or food</text><rect x="620" y="150" width="240" height="80" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="184" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Another person drinks</text><text x="740" y="206" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="middle">or eats</text><line x1="284" y1="190" x2="326" y2="190" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><line x1="574" y1="190" x2="616" y2="190" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="128" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">the faeces-to-mouth route</text><rect x="297" y="132" width="16" height="116" rx="4" fill="#2e6b62"/><rect x="587" y="132" width="16" height="116" rx="4" fill="#2e6b62"/><text x="305" y="270" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">A</text><text x="595" y="270" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">B</text><text x="740" y="270" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">C</text><rect x="30" y="290" width="270" height="310" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><circle cx="60" cy="326" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="332.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="86" y="333" font-size="17.5" font-weight="700" fill="#2e6b62" text-anchor="start">Keep faeces out</text><text x="50" y="372" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Handwashing</text><text x="50" y="396" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">with soap after the toilet</text><text x="50" y="416" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">and before handling food</text><text x="50" y="458" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sanitation and sewage</text><text x="50" y="479" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">treatment</text><text x="50" y="503" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">keeps human waste away from</text><text x="50" y="523" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">drinking water; removes or</text><text x="50" y="543" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">kills bacteria</text><rect x="315" y="290" width="270" height="310" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><circle cx="345" cy="326" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="345" y="332.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="371" y="333" font-size="17.5" font-weight="700" fill="#2e6b62" text-anchor="start">Make water safe</text><text x="335" y="372" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Boiling</text><text x="335" y="396" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">kills bacteria</text><text x="335" y="438" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Chlorination</text><text x="335" y="462" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">kills bacteria in treated</text><text x="335" y="482" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">supplies and keeps</text><text x="335" y="502" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">protecting water in pipes</text><rect x="600" y="290" width="270" height="310" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><circle cx="630" cy="326" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="630" y="332.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="656" y="333" font-size="17.5" font-weight="700" fill="#2e6b62" text-anchor="start">Protect the person</text><text x="620" y="372" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Vaccination</text><text x="620" y="396" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">oral cholera vaccine, often</text><text x="620" y="416" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">in outbreaks or high-risk</text><text x="620" y="436" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">areas such as camps for</text><text x="620" y="456" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">displaced people</text><text x="450" y="632" font-size="16.5" font-weight="600" fill="#b5602e" text-anchor="middle">Cholera has no vector, so vector control does not apply.</text>
</svg>