<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing malaria strategies</text>

<text x="370" y="132" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Benefit</text><text x="695" y="132" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Limitation</text><rect x="30" y="148" width="190" height="62" rx="10" fill="#8a6d0d"/><text x="125" y="185" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Treated nets</text><rect x="230" y="148" width="280" height="62" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="175" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cheap, simple, protects while</text><text x="244" y="193" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sleeping</text><rect x="520" y="148" width="350" height="62" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="534" y="175" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">only at night in bed; nets tear;</text><text x="534" y="193" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">insecticide wears off; resistance</text><rect x="30" y="218" width="190" height="62" rx="10" fill="#8a6d0d"/><text x="125" y="255" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Repellent</text><rect x="230" y="218" width="280" height="62" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="245" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">protects outdoors in the</text><text x="244" y="263" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">evening</text><rect x="520" y="218" width="350" height="62" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="534" y="255" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">must be reapplied; cost adds up</text><rect x="30" y="288" width="190" height="62" rx="10" fill="#8a6d0d"/><text x="125" y="325" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Vaccination</text><rect x="230" y="288" width="280" height="62" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="315" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reduces severe illness in</text><text x="244" y="333" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">children</text><rect x="520" y="288" width="350" height="62" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="534" y="315" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">partial; several doses and a supply</text><text x="534" y="333" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">chain</text><rect x="30" y="358" width="190" height="62" rx="10" fill="#8a6d0d"/><text x="125" y="395" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Antimalarial drugs</text><rect x="230" y="358" width="280" height="62" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="385" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">treat and cure; fewer parasites</text><text x="244" y="403" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">in the community</text><rect x="520" y="358" width="350" height="62" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="534" y="395" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cost; side effects; resistance</text><rect x="30" y="428" width="190" height="62" rx="10" fill="#2e6b62"/><text x="125" y="455" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Drain or cover</text><text x="125" y="474" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">sites</text><rect x="230" y="428" width="280" height="62" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="455" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">removes mosquitoes at source;</text><text x="244" y="473" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">no chemicals</text><rect x="520" y="428" width="350" height="62" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="534" y="455" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">impossible over huge wetlands; destroys</text><text x="534" y="473" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">habitats</text><rect x="30" y="498" width="190" height="62" rx="10" fill="#2e6b62"/><text x="125" y="525" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Insecticide</text><text x="125" y="544" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">spraying</text><rect x="230" y="498" width="280" height="62" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="535" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">kills large numbers quickly</text><rect x="520" y="498" width="350" height="62" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="534" y="525" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">harms pollinators; resistance; repeated</text><text x="534" y="543" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cost</text><rect x="30" y="568" width="190" height="62" rx="10" fill="#2e6b62"/><text x="125" y="605" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Sterile males</text><rect x="230" y="568" width="280" height="62" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="595" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">targets only the mosquito</text><text x="244" y="613" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">species</text><rect x="520" y="568" width="350" height="62" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="534" y="605" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">expensive; slow to take effect</text><rect x="30" y="638" width="190" height="62" rx="10" fill="#2e6b62"/><text x="125" y="675" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Biological control</text><rect x="230" y="638" width="280" height="62" rx="10" fill="#eef5f4" stroke="#2e6b62" stroke-width="2"/><text x="244" y="675" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">long-lasting, no chemicals</text><rect x="520" y="638" width="350" height="62" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="534" y="665" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">introduced predators may harm native</text><text x="534" y="683" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">species</text><rect x="30" y="722" width="18" height="18" rx="3" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><text x="56" y="737" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">personal protection</text><rect x="230" y="722" width="18" height="18" rx="3" fill="#2e6b62" stroke="#2e6b62" stroke-width="1"/><text x="256" y="737" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">vector control</text><text x="870" y="737" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="end">Link each point to the scenario: ponds, poverty, climate.</text>
</svg>