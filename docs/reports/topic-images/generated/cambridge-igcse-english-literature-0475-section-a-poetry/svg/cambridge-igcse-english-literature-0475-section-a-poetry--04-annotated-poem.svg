<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 782" width="900" height="782" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="782" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Annotating a poem for the question</text>

<rect x="30" y="110" width="450" height="574" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Night Shift</text><text x="176" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">(original poem)</text><text x="52" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">My mother comes home as the street wakes up,</text><text x="52" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">her coat still holding the hospital’s cold.</text><text x="52" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">She sets her keys down softly, like a cup</text><text x="52" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">too full to carry. Nothing she is told</text><text x="52" y="448" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">at work comes home with her. She only smiles,</text><text x="52" y="504" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">asks if I’ve eaten, if I’ve done my sums,</text><text x="52" y="560" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">then sleeps the daylight through, while traffic files</text><text x="52" y="616" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">past our thin curtains and the kettle hums.</text><line x1="468" y1="190" x2="508" y2="190" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="5 4"/><circle cx="468" cy="190" r="4" fill="#8a6d0d"/><rect x="508" y="160" width="362" height="60" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="524" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Her day ends as everyone else’s begins:</text><text x="524" y="205" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">she lives out of step with the world.</text><line x1="468" y1="246" x2="508" y2="269.5" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="5 4"/><circle cx="468" cy="246" r="4" fill="#8a6d0d"/><rect x="508" y="230" width="362" height="79" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="524" y="256" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">“holding”: the coat is given the action,</text><text x="524" y="275" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">as if her work clings to her; hard “c”</text><text x="524" y="294" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sounds make the cold sharp.</text><line x1="468" y1="330" x2="508" y2="368" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="5 4"/><circle cx="468" cy="330" r="4" fill="#8a6d0d"/><rect x="508" y="319" width="362" height="98" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="524" y="345" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The cup simile: she handles her keys as</text><text x="524" y="364" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">if they could spill; she is “too full”</text><text x="524" y="383" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">herself, of tiredness or what she has</text><text x="524" y="402" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">seen.</text><line x1="468" y1="400" x2="508" y2="476" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="5 4"/><circle cx="468" cy="400" r="4" fill="#8a6d0d"/><rect x="508" y="427" width="362" height="98" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="524" y="453" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Enjambment across the stanza break</text><text x="524" y="472" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">carries the sentence over the gap, as</text><text x="524" y="491" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">she carries work home but will not speak</text><text x="524" y="510" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of it.</text><line x1="468" y1="498" x2="508" y2="565" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="5 4"/><circle cx="468" cy="498" r="4" fill="#8a6d0d"/><rect x="508" y="535" width="362" height="60" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="524" y="561" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Her questions are all about the child:</text><text x="524" y="580" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">care that puts her own needs last.</text><line x1="468" y1="582" x2="508" y2="644.5" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="5 4"/><circle cx="468" cy="582" r="4" fill="#8a6d0d"/><rect x="508" y="605" width="362" height="79" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="524" y="631" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">“thin” suggests how little protects her</text><text x="524" y="650" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sleep; “hums” closes on quiet domestic</text><text x="524" y="669" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">love.</text><rect x="30" y="702" width="840" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="737" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Question: How does the poet movingly present the mother in this poem?</text>
</svg>