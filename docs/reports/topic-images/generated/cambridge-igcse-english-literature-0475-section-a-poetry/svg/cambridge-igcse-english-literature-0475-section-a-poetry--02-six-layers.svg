<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the printed poem in layers</text>

<rect x="30" y="110" width="840" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="68" cy="150" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="68" y="157.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="102" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The question’s key words</text><text x="102" y="170" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">underline them; every note should serve them</text><rect x="44" y="202" width="812" height="80" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="82" cy="242" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="82" y="249.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="116" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Voice and situation</text><text x="116" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">who speaks, to whom, where, when? Call them “the speaker”</text><rect x="58" y="294" width="784" height="80" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="96" cy="334" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="96" y="341.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="130" y="328" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The shape of the poem</text><text x="130" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">where it begins and ends emotionally; find the turn</text><rect x="72" y="386" width="756" height="80" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="110" cy="426" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="110" y="433.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="144" y="420" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Imagery</text><text x="144" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">metaphor, simile, personification: what does each make the reader feel?</text><rect x="86" y="478" width="728" height="80" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="124" cy="518" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="124" y="525.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="158" y="512" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sound and rhythm</text><text x="158" y="538" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alliteration, assonance, rhyme, line length: pace and mood</text><rect x="100" y="570" width="700" height="80" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="138" cy="610" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="138" y="617.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="172" y="604" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Form and structure</text><text x="172" y="630" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stanzas, line breaks, enjambment, caesura, repetition, the title</text><text x="450" y="680" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Read again in the exam with the question beside you; note answers in the margin.</text>
</svg>