<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Feature-spotting versus analysis</text>

<rect x="30" y="110" width="270" height="110" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="66" cy="150" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="66" y="157.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="157" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Name the method</text><text x="52" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">only if it helps</text><line x1="301" y1="165" x2="314" y2="165" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="110" width="270" height="110" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="351" cy="150" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="351" y="157.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="381" y="157" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Quote precisely</text><text x="337" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the exact words</text><line x1="586" y1="165" x2="599" y2="165" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="110" width="270" height="110" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="636" cy="150" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="636" y="157.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="666" y="157" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the effect</text><text x="622" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in the context of the question</text><rect x="30" y="246" width="840" height="120" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="280" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Feature-spotting</text><text x="848" y="280" font-size="15" font-weight="400" fill="#b5602e" text-anchor="end" font-style="italic">earns little on its own</text><text x="52" y="320" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The poet uses alliteration in ‘soft and slow’.”</text><rect x="52" y="330" width="150" height="28" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="127" y="349.4" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">name + quote only</text><rect x="30" y="386" width="840" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="420" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Analysis</text><text x="848" y="420" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">what the examiner rewards</text><text x="52" y="458" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The soft, slow sounds of ‘soft and slow’ make the line itself linger,</text><text x="52" y="483" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">so the reader feels the speaker’s reluctance to let the moment end.”</text><rect x="52" y="506" width="210" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="157" y="526.4" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">quote + effect on the reader</text><rect x="30" y="576" width="840" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="610" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Often the best analysis focuses on a single word:</text><text x="450" y="642" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">why “files” and not “drives”? why “thin” curtains?</text>
</svg>