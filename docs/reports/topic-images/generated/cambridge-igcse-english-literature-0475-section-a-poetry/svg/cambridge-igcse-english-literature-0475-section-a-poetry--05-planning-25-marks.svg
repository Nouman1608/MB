<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a 25-mark poetry answer</text>

<rect x="30" y="110" width="520" height="96" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Opening</text><text x="52" y="168" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">answer the question in two sentences: the main</text><text x="52" y="187" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">impression and how the poem creates it</text><rect x="30" y="218" width="520" height="190" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="250" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Three or four paragraphs</text><text x="52" y="276" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">each on a stage or aspect of the poem, following its</text><text x="52" y="295" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">movement; two or three short quotations analysed</text><text x="52" y="314" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">closely in each</text><rect x="60" y="328" width="140" height="60" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="354" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">stage 1</text><text x="130" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2–3 quotations</text><rect x="220" y="328" width="140" height="60" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="290" y="354" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">stage 2</text><text x="290" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2–3 quotations</text><rect x="380" y="328" width="140" height="60" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="354" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">stage 3</text><text x="450" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2–3 quotations</text><rect x="30" y="420" width="520" height="80" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="452" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The ending or overall structure</text><text x="52" y="478" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">how the poem leaves the reader</text><rect x="30" y="512" width="520" height="96" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="544" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="52" y="570" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">brief; return to the question’s key word with your</text><text x="52" y="589" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">considered view</text><text x="710" y="132" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Where your view goes</text><rect x="574" y="152" width="296" height="188" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="594" y="184" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Direct question</text><text x="594" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“What do you think…?”</text><text x="594" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“What are your feelings about…?”</text><text x="594" y="270" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Make your view explicit from</text><text x="594" y="291" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">the first paragraph.</text><rect x="574" y="356" width="296" height="188" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="594" y="388" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Implied question</text><text x="594" y="414" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Explore the ways in which…”</text><text x="594" y="450" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Let your view emerge through</text><text x="594" y="471" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">precise analysis.</text><rect x="30" y="626" width="840" height="56" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="661" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Follow the poem’s movement, not a list of techniques.</text>
</svg>