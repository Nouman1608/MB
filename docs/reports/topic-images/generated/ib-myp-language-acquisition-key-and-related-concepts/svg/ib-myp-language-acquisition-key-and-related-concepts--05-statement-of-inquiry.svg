<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a statement of inquiry</text>

<text x="450" y="132" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Unit: social media and friendship</text><rect x="30" y="150" width="270" height="170" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="60" cy="180" r="16" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="60" y="185.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="86" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key concept</text><text x="165" y="222" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">communication</text><text x="165" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the unit is about how people</text><text x="165" y="303" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">talk online</text><line x1="165" y1="324" x2="390" y2="356" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="315" y="150" width="270" height="170" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="345" cy="180" r="16" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="345" y="185.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="371" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Related concepts</text><text x="450" y="222" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">conventions, word choice</text><text x="450" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">online messages have their own</text><text x="450" y="303" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">rules and short forms</text><line x1="450" y1="324" x2="450" y2="356" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="150" width="270" height="170" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="630" cy="180" r="16" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="630" y="185.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="656" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Global context</text><text x="735" y="222" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">identities and</text><text x="735" y="244" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">relationships</text><text x="735" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">friendship: who we are and how</text><text x="735" y="303" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">we relate</text><line x1="735" y1="324" x2="510" y2="356" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="362" width="840" height="96" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="394" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">4  General claim</text><text x="450" y="434" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“The conventions of online communication shape how we build and keep friendships.”</text><rect x="30" y="476" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="510" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">5  Test it</text><rect x="52" y="522" width="256" height="40" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="180" y="547.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">works in another language ✓</text><rect x="324" y="522" width="256" height="40" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="452" y="547.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">a claim, not a question ✓</text><rect x="596" y="522" width="256" height="40" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="724" y="547.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">names no single app ✓</text><rect x="30" y="594" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="626" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">6  Add inquiry questions</text><rect x="52" y="640" width="256" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="666" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Factual</text><text x="66" y="690" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">common text-message</text><text x="66" y="708" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">abbreviations?</text><rect x="324" y="640" width="256" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="338" y="666" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Conceptual</text><text x="338" y="690" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">how does a short message</text><text x="338" y="708" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">change tone?</text><rect x="596" y="640" width="256" height="80" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="610" y="666" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Debatable</text><text x="610" y="690" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">is online friendship as real?</text>
</svg>