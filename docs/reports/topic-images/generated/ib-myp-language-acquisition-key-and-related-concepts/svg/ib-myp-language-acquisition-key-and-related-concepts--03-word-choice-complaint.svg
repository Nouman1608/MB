<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Word choice: rewriting a complaint</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Original</text><text x="52" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Hey! Your room was rubbish and I want my cash back.”</text><text x="55" y="238" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Audience: a hotel manager, a stranger in a formal role. Purpose: complain and get a refund.</text><rect x="30" y="258" width="230" height="56" rx="10" fill="#fbeee6" stroke="#b5602e" stroke-width="2"/><text x="145" y="293" font-size="17" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">Hey!</text><line x1="264" y1="286" x2="300" y2="286" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="305" y="258" width="565" height="56" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="323" y="293" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Dear Sir or Madam</text><rect x="30" y="328" width="230" height="56" rx="10" fill="#fbeee6" stroke="#b5602e" stroke-width="2"/><text x="145" y="363" font-size="17" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">rubbish</text><line x1="264" y1="356" x2="300" y2="356" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="305" y="328" width="565" height="56" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="323" y="363" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">not of the standard advertised</text><rect x="30" y="398" width="230" height="56" rx="10" fill="#fbeee6" stroke="#b5602e" stroke-width="2"/><text x="145" y="433" font-size="17" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">cash back</text><line x1="264" y1="426" x2="300" y2="426" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="305" y="398" width="565" height="56" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="323" y="433" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a refund</text><rect x="30" y="468" width="230" height="56" rx="10" fill="#fbeee6" stroke="#b5602e" stroke-width="2"/><text x="145" y="503" font-size="17" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">(no detail)</text><line x1="264" y1="496" x2="300" y2="496" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="305" y="468" width="565" height="56" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="323" y="492" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the shower did not work for the whole of my three-night</text><text x="323" y="512" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">stay</text><rect x="30" y="548" width="840" height="120" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="582" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Result</text><text x="52" y="612" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Dear Sir or Madam, I am writing to request a refund. The room was not of the standard</text><text x="52" y="634" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">advertised: the shower did not work for the whole of my three-night stay.”</text><text x="450" y="698" font-size="15.5" font-weight="600" fill="#4a5568" text-anchor="middle">Check register, connotation and precision; add the formal “you” if your language has one.</text>
</svg>