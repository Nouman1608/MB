onventions</text><rect x="455" y="352" width="185" height="60" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="547.5" y="388.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">idiom</text><text x="700" y="388" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">+ more in the full guide</text><rect x="30" y="460" width="840" height="110" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="496" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">explored through six global contexts</text><text x="55" y="526" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">identities and relationships · orientation in space and time · personal and cultural expression ·</text><text x="55" y="547" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">scientific and technical innovation · globalization and sustainability · fairness and development</text><rect x="30" y="590" width="410" height="100" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="626" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Topic</text><text x="52" y="656" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“food”, “holidays”</text><rect x="460" y="590" width="410" height="100" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="626" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Concept</text><text x="482" y="656" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“culture”: applies to food, festivals, slang</text>
