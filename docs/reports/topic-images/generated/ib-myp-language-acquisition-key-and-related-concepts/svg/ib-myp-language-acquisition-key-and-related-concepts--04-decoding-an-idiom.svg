<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Idiom: match the meaning, not the words</text>

<text x="450" y="132" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">A French blog post uses an idiom (shown here in English)</text><rect x="30" y="150" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="200" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="209.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="130" y="188" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Notice</text><text x="130" y="218" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the literal meaning makes no sense in context</text><text x="845" y="206" font-size="16.5" font-weight="600" fill="#2e6b62" text-anchor="end" font-style="italic">word for word: “he put a rabbit on me”</text><line x1="80" y1="228" x2="80" y2="264" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="266" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="316" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="325.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="130" y="304" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Use the context</text><text x="130" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what is happening around it</text><text x="845" y="322" font-size="16.5" font-weight="600" fill="#2e6b62" text-anchor="end" font-style="italic">the writer waited an hour at a café</text><line x1="80" y1="344" x2="80" y2="380" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="382" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="432" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="441.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="130" y="420" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Infer the meaning</text><text x="130" y="450" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">match the meaning, not the words</text><text x="845" y="438" font-size="16.5" font-weight="600" fill="#2e6b62" text-anchor="end" font-style="italic">“he stood me up”</text><line x1="80" y1="460" x2="80" y2="496" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="498" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="548" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="557.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="130" y="536" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Record it</text><text x="130" y="566" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">idiom + meaning + an example sentence</text><text x="845" y="554" font-size="16.5" font-weight="600" fill="#2e6b62" text-anchor="end" font-style="italic">not a literal translation</text><rect x="30" y="625" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="671" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Use idioms sparingly: one correct idiom shows range; a literal one confuses.</text>
</svg>