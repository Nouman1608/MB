<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Communication: audience, purpose, mode</text>

<rect x="30" y="110" width="270" height="84" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Audience</text><text x="165" y="173" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">who receives it</text><rect x="315" y="110" width="270" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Purpose</text><text x="450" y="173" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">what it is for</text><rect x="600" y="110" width="270" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Mode</text><text x="735" y="173" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">spoken, written or visual</text><text x="450" y="232" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Task: cancel a meeting, same message, two audiences</text><rect x="30" y="250" width="410" height="260" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="286" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Voicemail to a friend</text><text x="52" y="326" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">audience</text><text x="160" y="326" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a friend</text><text x="52" y="376" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">purpose</text><text x="160" y="376" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cancel the meeting</text><text x="52" y="426" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">mode</text><text x="160" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">spoken</text><text x="52" y="476" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">register</text><text x="160" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">informal</text><rect x="460" y="250" width="410" height="260" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="286" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Email to a teacher</text><text x="482" y="326" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">audience</text><text x="590" y="326" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a teacher</text><text x="482" y="376" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">purpose</text><text x="590" y="376" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cancel the meeting</text><text x="482" y="426" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">mode</text><text x="590" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">written</text><text x="482" y="476" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">register</text><text x="590" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">formal</text><rect x="30" y="530" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="566" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Statement of inquiry</text><text x="55" y="596" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The way we adapt our words to an audience shapes whether a message is understood and accepted.”</text>
</svg>