<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Factual, conceptual and debatable questions</text>

<rect x="30" y="110" width="230" height="112" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="160" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Factual</text><text x="145" y="190" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">has a checkable answer</text><rect x="274" y="110" width="596" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="296" y="172" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“How do you open a formal letter in Spanish?”</text><rect x="30" y="240" width="230" height="112" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="290" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Conceptual</text><text x="145" y="320" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">how or why an idea works</text><rect x="274" y="240" width="596" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="296" y="302" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Why do languages have different levels of politeness?”</text><rect x="30" y="370" width="230" height="112" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="420" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Debatable</text><text x="145" y="450" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">reasonable people disagree</text><rect x="274" y="370" width="596" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="296" y="432" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Should young people use slang in a job interview?”</text><rect x="30" y="510" width="840" height="92" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="546" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Not a statement of inquiry</text><text x="52" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“How do people make friends online?” is an inquiry question.</text>
</svg>