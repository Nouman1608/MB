<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 409" width="900" height="409" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="409" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why growing trade is hard for Pakistan</text>

<rect x="30" y="112" width="410" height="267" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Hinder trade</text><text x="48" y="176.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="176.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exports concentrated in a few products,</text><text x="64" y="197.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">especially textiles</text><text x="48" y="221.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="221.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Competition from other low-cost textile and</text><text x="64" y="242.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rice producers</text><text x="48" y="266.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="266.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tariffs, quotas and quality standards in richer</text><text x="64" y="287.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">markets</text><text x="48" y="311.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="311.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Energy shortages and high costs raise</text><text x="64" y="332.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">production costs</text><text x="48" y="356.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="356.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A weak rupee makes imports dearer</text><rect x="460" y="112" width="410" height="267" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Promote trade</text><text x="478" y="176.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="176.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Trading blocs and agreements: SAARC, ECO</text><text x="478" y="200.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="200.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">EU GSP+ scheme lowers tariffs on many</text><text x="494" y="221.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pakistani exports</text><text x="478" y="245.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A falling rupee can make exports cheaper</text><text x="494" y="266.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">abroad</text>
</svg>