<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 562" width="900" height="562" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="562" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">GDP, GNP and the balance of trade</text>

<rect x="30" y="112" width="500" height="230" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="148" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">GNP</text><text x="50" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">GDP + income from abroad − income sent out</text><rect x="60" y="196" width="300" height="126" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="230" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">GDP</text><text x="80" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">value of goods and services</text><text x="80" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">produced within Pakistan</text><text x="80" y="298" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in a year</text><rect x="378" y="196" width="136" height="126" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="446" y="230" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">+ income</text><text x="446" y="250" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">earned</text><text x="446" y="270" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">abroad, e.g.</text><text x="446" y="290" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">remittances</text><rect x="550" y="112" width="320" height="123" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="568" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why GNP &gt; GDP</text><text x="568" y="172.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Remittances from Pakistanis working</text><text x="568" y="192.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">overseas help make GNP larger than</text><text x="568" y="212.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">GDP.</text><rect x="550" y="245" width="320" height="97" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="568" y="278" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Minus</text><text x="568" y="305.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Income sent out of Pakistan by foreign</text><text x="568" y="325.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">firms.</text><text x="30" y="382" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">BALANCE OF TRADE = value of exports − value of imports</text><rect x="30" y="412" width="340" height="44" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="42" y="441" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">exports earn</text><rect x="30" y="468" width="500" height="44" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="42" y="497" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">imports cost</text><rect x="370" y="412" width="160" height="44" fill="none" stroke="#b5602e" stroke-width="3" stroke-dasharray="7 5"/><text x="450" y="441" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">deficit</text><text x="30" y="540" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">bar lengths are schematic</text><rect x="600" y="404" width="270" height="38" rx="19" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="735" y="429" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Borrowing</text><rect x="600" y="450" width="270" height="38" rx="19" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="735" y="475" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pressure on the rupee</text><rect x="600" y="496" width="270" height="38" rx="19" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="735" y="521" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Less money for development</text><line x1="540" y1="462" x2="592" y2="462" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="735" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a persistent deficit means</text>
</svg>