<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 773" width="900" height="773" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="773" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pakistan’s links with its neighbours</text>

<rect x="30" y="112" width="840" height="560" rx="12" fill="#e6eef0" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">directions are approximate; schematic, not a map</text><rect x="340" y="340" width="220" height="120" rx="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="408" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan</text><rect x="640" y="170" width="220" height="102" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="658" y="202.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">China</text><text x="658" y="229.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Road: Khunjerab Pass</text><text x="658" y="249.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(Karakoram Highway)</text><line x1="520" y1="338" x2="636" y2="221" stroke="#1e2a44" stroke-width="3" stroke-dasharray="8 6"/><rect x="60" y="170" width="220" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="78" y="202.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Afghanistan</text><text x="78" y="229.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Roads: Khyber Pass</text><text x="78" y="249.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(Torkham); Chaman near</text><text x="78" y="269.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Quetta</text><line x1="370" y1="338" x2="284" y2="231" stroke="#1e2a44" stroke-width="3" stroke-dasharray="8 6"/><rect x="60" y="360" width="220" height="102" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="78" y="392.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Iran</text><text x="78" y="419.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Road and rail (from</text><text x="78" y="439.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Quetta) via Taftan</text><line x1="338" y1="400" x2="284" y2="411" stroke="#1e2a44" stroke-width="3" stroke-dasharray="8 6"/><rect x="640" y="340" width="220" height="142" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="658" y="372.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">India</text><text x="658" y="399.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Road at Wagah near</text><text x="658" y="419.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Lahore; rail line exists but</text><text x="658" y="439.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">passenger services</text><text x="658" y="459.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">suspended since 2019</text><line x1="562" y1="400" x2="636" y2="411" stroke="#1e2a44" stroke-width="3" stroke-dasharray="8 6"/><rect x="32" y="560" width="836" height="110" fill="#b5d3cf"/><text x="450" y="590" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">ARABIAN SEA</text><rect x="120" y="610" width="210" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="225" y="637" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Keamari (Karachi Port)</text><rect x="360" y="610" width="210" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="465" y="637" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Port Qasim</text><rect x="600" y="610" width="210" height="42" rx="21" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="637" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Gwadar</text><line x1="450" y1="462" x2="450" y2="556" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="462" y="510" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">seaports</text><rect x="30" y="690" width="840" height="53" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="720.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">International airports include Karachi, Lahore, Islamabad, Peshawar, Quetta and Multan.</text>
</svg>