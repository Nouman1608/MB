<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" width="900" height="535" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="535" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What Pakistan sells and buys</text>

<rect x="30" y="112" width="300" height="222" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Main exports</text><text x="48" y="173.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cotton yarn, cloth, garments,</text><text x="64" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bed linen, towels</text><text x="48" y="218.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="218.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rice</text><text x="48" y="242.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="242.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Leather and leather goods</text><text x="48" y="266.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="266.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sports goods, surgical</text><text x="64" y="287.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">instruments</text><text x="48" y="311.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="311.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fruit, vegetables, fish</text><rect x="570" y="112" width="300" height="222" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="588" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Main imports</text><text x="588" y="173.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="604" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crude oil and petroleum</text><text x="604" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">products</text><text x="588" y="218.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="604" y="218.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Machinery and transport</text><text x="604" y="239.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">equipment</text><text x="588" y="263.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="604" y="263.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Chemicals, fertilisers, medicines</text><text x="588" y="287.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="604" y="287.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Edible oil (palm oil)</text><text x="588" y="311.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="604" y="311.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Iron and steel; tea</text><circle cx="450" cy="223" r="72" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="230" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan</text><line x1="388" y1="183" x2="338" y2="183" stroke="#8a6d0d" stroke-width="6" marker-end="url(#ahO)"/><line x1="562" y1="263" x2="512" y2="263" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="450" y="131" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">goods out</text><text x="450" y="327" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">goods in</text><rect x="30" y="358" width="410" height="147" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="391" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Long-term change in exports</text><text x="48" y="419.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From raw materials such as raw cotton towards</text><text x="48" y="440.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">processed and manufactured goods such as yarn,</text><text x="48" y="461.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cloth and garments, which earn more</text><text x="48" y="482.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">value-added.</text><rect x="460" y="358" width="410" height="147" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="391" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why the import bill swings</text><text x="478" y="419.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Imports are dominated by fuel and machinery, so</text><text x="478" y="440.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the bill rises sharply when world oil prices rise.</text>
</svg>