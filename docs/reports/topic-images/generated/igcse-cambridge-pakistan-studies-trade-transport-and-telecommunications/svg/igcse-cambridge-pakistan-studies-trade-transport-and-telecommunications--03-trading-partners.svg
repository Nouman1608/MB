<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 657" width="900" height="657" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="657" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pakistan’s main trading partners</text>

<text x="180" y="132" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">BUY FROM PAKISTAN</text><text x="720" y="132" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">SELL TO PAKISTAN</text><rect x="30" y="148" width="300" height="126" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="181" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">USA</text><text x="48" y="209.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A leading market for textiles</text><line x1="380" y1="321" x2="336" y2="211" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="30" y="288" width="300" height="126" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="321" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">UK and EU countries</text><text x="48" y="349.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Buy textiles, rice and leather</text><line x1="380" y1="351" x2="336" y2="351" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="30" y="428" width="300" height="126" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="461" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Afghanistan</text><text x="48" y="489.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Land neighbour: buys food and</text><text x="48" y="510.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">manufactured goods</text><line x1="380" y1="381" x2="336" y2="491" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="570" y="218" width="300" height="126" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="588" y="251" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">China</text><text x="588" y="279.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Leading source of machinery and</text><text x="588" y="300.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">manufactured goods; growing</text><text x="588" y="321.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">partner through CPEC</text><line x1="564" y1="281" x2="522" y2="321" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="570" y="358" width="300" height="126" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="588" y="391" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">UAE and Saudi Arabia</text><text x="588" y="419.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Supply oil</text><line x1="564" y1="421" x2="522" y2="381" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><circle cx="450" cy="351" r="66" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="358" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan</text><rect x="30" y="574" width="840" height="53" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="604.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Learn current partners from your course statistics; the overall pattern is stable.</text>
</svg>