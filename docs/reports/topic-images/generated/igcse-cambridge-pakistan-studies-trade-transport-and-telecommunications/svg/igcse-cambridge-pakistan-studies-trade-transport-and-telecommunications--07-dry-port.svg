<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" width="900" height="405" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="405" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a dry port works</text>

<rect x="30" y="140" width="190" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="171.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inland factory</text><text x="48" y="198.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. in Lahore or</text><text x="48" y="218.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Faisalabad</text><line x1="223" y1="202.5" x2="244" y2="202.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="246.7" y="140" width="190" height="125" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="264.7" y="171.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dry port</text><text x="264.7" y="198.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Customs clearance;</text><text x="264.7" y="218.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">goods loaded into</text><text x="264.7" y="238.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">containers</text><line x1="439.7" y1="202.5" x2="460.7" y2="202.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="463.4" y="140" width="190" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="481.4" y="171.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sealed by rail or</text><text x="481.4" y="195.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">road</text><text x="481.4" y="222.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Containers travel</text><text x="481.4" y="242.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">unopened</text><line x1="656.4" y1="202.5" x2="677.4" y2="202.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="680.0999999999999" y="140" width="190" height="125" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="698.0999999999999" y="171.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Seaport</text><text x="698.0999999999999" y="198.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. Karachi</text><text x="450" y="130" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">exports (imports follow the same route in reverse)</text><rect x="30" y="311" width="270" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165" y="339" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Saves time</text><rect x="315" y="311" width="270" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="339" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Reduces congestion at</text><text x="450" y="360" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Karachi</text><rect x="600" y="311" width="270" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="735" y="339" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Helps exporters in inland</text><text x="735" y="360" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">industrial cities</text><text x="30" y="301" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WHY THEY HAVE BEEN DEVELOPED</text>
</svg>