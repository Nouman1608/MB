<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A play is a script for performance</text>

<rect x="30" y="108" width="840" height="380" rx="14" fill="#1e2a44"/><rect x="100" y="142" width="700" height="250" fill="#dce9e7"/><path d="M100,392 L800,392 L862,452 L38,452 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M38,116 L112,116 Q96,268 120,438 L38,452 Z" fill="#b5602e" opacity="0.9"/><path d="M862,116 L788,116 Q804,268 780,438 L862,452 Z" fill="#b5602e" opacity="0.9"/><rect x="38" y="116" width="824" height="30" rx="6" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="150" y="248" width="76" height="144" fill="#1e2a44" opacity="0.85"/><path d="M226,248 L258,260 L258,404 L226,392 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M188,408 L193,356 Q205,346 217,356 L222,408 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="205" cy="336" r="13" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><line x1="240" y1="424" x2="300" y2="424" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="450" cy="200" r="34" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="200" x2="450" y2="176" stroke="#1e2a44" stroke-width="3.5"/><line x1="450" y1="200" x2="468" y2="208" stroke="#1e2a44" stroke-width="3.5"/><rect x="395" y="370" width="120" height="14" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><line x1="408" y1="384" x2="408" y2="420" stroke="#1e2a44" stroke-width="5"/><line x1="502" y1="384" x2="502" y2="420" stroke="#1e2a44" stroke-width="5"/><path d="M343,426 L348,374 Q360,364 372,374 L377,426 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="360" cy="354" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M535,426 L540,374 Q552,364 564,374 L569,426 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="552" cy="354" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="300" y="278" width="116" height="40" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M324,317 l8,16 l12,-16" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="325" y1="317" x2="343" y2="317" stroke="#ffffff" stroke-width="4"/><text x="358" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">…</text><rect x="500" y="278" width="116" height="40" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M576,317 l8,16 l12,-16" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="577" y1="317" x2="595" y2="317" stroke="#ffffff" stroke-width="4"/><text x="558" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">…</text><text x="360" y="263" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle" font-style="italic">(Pause.)</text><path d="M665.55,424 L669.8,379.8 Q680,371.3 690.2,379.8 L694.45,424 Z" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="680" cy="362.8" r="11.049999999999999" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2.5"/><path d="M707.55,420 L711.8,375.8 Q722,367.3 732.2,375.8 L736.45,420 Z" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="722" cy="358.8" r="11.049999999999999" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2.5"/><path d="M749.55,424 L753.8,379.8 Q764,371.3 774.2,379.8 L778.45,424 Z" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="764" cy="362.8" r="11.049999999999999" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2.5"/><path d="M70,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M128,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M186,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M244,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M302,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M360,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M418,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M476,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M534,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M592,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M650,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M708,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M766,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><path d="M824,488 a22,22 0 0 1 44,0 Z" fill="#4a5568"/><circle cx="188" cy="224" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="188" y="230.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="508" cy="180" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="508" y="186.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><circle cx="302" cy="263" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="302" y="269.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="458" cy="298" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="458" y="304.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><circle cx="455" cy="348" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="455" y="354.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="722" cy="308" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="722" y="314.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="450" cy="474" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="480.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="30" y="452" width="840" height="44" fill="none"/><rect x="30" y="520" width="411" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="80" y="551.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Stage directions</text><text x="46" y="579.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What does the playwright insist on? Silences,</text><text x="46" y="600.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pauses, movement, sound.</text><rect x="459" y="520" width="411" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="509" y="551.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Entrances and exits</text><text x="475" y="579.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who arrives at the worst moment? Who is left</text><text x="475" y="600.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">alone on stage?</text><circle cx="60" cy="550" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="555.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="489" cy="550" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="489" y="555.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="30" y="635" width="411" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="80" y="666.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Space and set</text><text x="46" y="694.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Realistic or symbolic? What stays visible</text><text x="46" y="715.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">throughout?</text><rect x="459" y="635" width="411" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="509" y="666.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Doubling and ensemble</text><text x="475" y="694.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One actor in several roles? An ensemble as</text><text x="475" y="715.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">objects or crowds?</text><circle cx="60" cy="665" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="670.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="489" cy="665" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="489" y="670.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="750" width="411" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="80" y="781.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Time</text><text x="46" y="809.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A straight line, jumps between past and</text><text x="46" y="830.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">present, or a narrator’s frame?</text><rect x="459" y="750" width="411" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="509" y="781.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Dialogue</text><text x="475" y="809.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who speaks most, interrupts, changes</text><text x="475" y="830.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">register, is silent?</text><circle cx="60" cy="780" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="785.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><circle cx="489" cy="780" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="489" y="785.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="30" y="865" width="411" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="80" y="896.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Audience position</text><text x="46" y="924.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does the audience know more than the</text><text x="46" y="945.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">characters (dramatic irony), or less?</text><rect x="459" y="865" width="411" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="475" y="895.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Write “the audience sees…”</text><text x="475" y="924.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not just “the reader”. Productions can make</text><text x="475" y="945.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">different choices.</text><circle cx="60" cy="895" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="900.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text>
</svg>