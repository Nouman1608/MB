<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 781" width="900" height="781" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="781" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The coursework process, step by step</text>

<line x1="62" y1="136" x2="62" y2="737" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="116" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="151.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Understand the task</text><text x="128" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Underline the focus and the command words.</text><circle cx="62" cy="160" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="168.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="214" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="249.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gather evidence</text><text x="128" y="277.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A handful of moments from across the play: short quotations or precise references to</text><text x="128" y="298.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stage directions.</text><circle cx="62" cy="268.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="277.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="333" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="368.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plan an argument</text><text x="128" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not a sequence of scenes.</text><circle cx="62" cy="377" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="385.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="431" width="762" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="466.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Draft</text><text x="128" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Your teacher may give general feedback on how to improve, but may not correct or</text><text x="128" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rewrite your work.</text><circle cx="62" cy="485.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="494.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="550" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="585.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Revise and submit</text><text x="128" y="613.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Once the work has been marked it cannot be rewritten.</text><circle cx="62" cy="594" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="602.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="108" y="648" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="683.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Authenticate</text><text x="128" y="711.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">You and your teacher sign to confirm the work is your own. Acknowledge any sources you</text><text x="128" y="732.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">used.</text><circle cx="62" cy="702.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="711.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>