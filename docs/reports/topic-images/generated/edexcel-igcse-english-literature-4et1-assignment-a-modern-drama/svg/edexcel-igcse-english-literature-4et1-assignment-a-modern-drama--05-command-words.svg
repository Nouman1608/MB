<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the command words ask for</text>

<rect x="30" y="112" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="132" width="300" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="70" y="189.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explore the ways in</text><text x="70" y="214.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">which…</text><text x="380" y="158" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Range</text><text x="380" y="188" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Several methods and</text><text x="380" y="209" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">several parts of the play.</text><line x1="380" y1="252" x2="840" y2="252" stroke="#1e2a44" stroke-width="3"/><circle cx="400" cy="252" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="520" cy="252" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="640" cy="252" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="760" cy="252" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="830" cy="252" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="298" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="318" width="300" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="70" y="375.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How does [playwright]</text><text x="70" y="400.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">present…</text><text x="380" y="344" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Method</text><text x="380" y="374" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Keeps the playwright’s</text><text x="380" y="395" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">choices at the centre.</text><circle cx="760" cy="383" r="56" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="760" y="378" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">playwright’s</text><text x="760" y="397" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">choices</text><rect x="30" y="484" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="504" width="300" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="70" y="573.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To what extent…</text><text x="380" y="530" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Weigh a view</text><text x="380" y="560" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Agree in part, then</text><text x="380" y="581" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reach a judgement.</text><path d="M770,546 L752,616 L788,616 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="710" y1="536.4" x2="830" y2="555.6" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><line x1="710" y1="536.4" x2="686" y2="570.4" stroke="#1e2a44" stroke-width="2"/><line x1="710" y1="536.4" x2="734" y2="570.4" stroke="#1e2a44" stroke-width="2"/><path d="M678,570.4 L742,570.4 Q710,588.4 678,570.4 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="830" y1="555.6" x2="806" y2="589.6" stroke="#1e2a44" stroke-width="2"/><line x1="830" y1="555.6" x2="854" y2="589.6" stroke="#1e2a44" stroke-width="2"/><path d="M798,589.6 L862,589.6 Q830,607.6 798,589.6 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="770" cy="546" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/>
