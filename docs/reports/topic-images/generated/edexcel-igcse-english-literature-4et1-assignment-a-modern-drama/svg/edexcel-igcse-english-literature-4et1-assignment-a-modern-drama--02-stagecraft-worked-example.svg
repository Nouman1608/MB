<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three stage methods, one argument</text>

<text x="30" y="122" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Original scene, written for this guide</text><rect x="30" y="138" width="250" height="99" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text font-style="italic" x="50" y="192.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The clock is loud.</text><rect x="330" y="138" width="220" height="99" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="181.1" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Sound in a stage</text><text x="350" y="203.1" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">direction</text><rect x="600" y="138" width="270" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="170.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The audience feels time</text><text x="620" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pressing on Mara while she</text><text x="620" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">refuses to act.</text><line x1="284" y1="187.5" x2="324" y2="187.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="554" y1="187.5" x2="594" y2="187.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="253" width="250" height="99" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text font-style="italic" x="50" y="296.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">MARA puts her hand flat</text><text font-style="italic" x="50" y="318.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">on it.</text><rect x="330" y="253" width="220" height="99" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="296.1" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">An action instead</text><text x="350" y="318.1" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">of words</text><rect x="600" y="253" width="270" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Her silence shows she is</text><text x="620" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">still guarding her father’s</text><text x="620" y="327.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">place in the family.</text><line x1="284" y1="302.5" x2="324" y2="302.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="554" y1="302.5" x2="594" y2="302.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="368" width="250" height="102" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text font-style="italic" x="50" y="401.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The clock stops.</text><text font-style="italic" x="50" y="423.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Neither of them</text><text font-style="italic" x="50" y="445.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">notices.</text><rect x="330" y="368" width="220" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="401.6" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">The audience knows</text><text x="350" y="423.6" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">more than the</text><text x="350" y="445.6" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">characters</text><rect x="600" y="368" width="270" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="402.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Time in this house has</text><text x="620" y="423.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">frozen around the father’s</text><text x="620" y="444.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">absence.</text><line x1="284" y1="419" x2="324" y2="419" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="554" y1="419" x2="594" y2="419" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="155" y="490" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">stage direction</text><text x="440" y="490" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">method</text><text x="735" y="490" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">effect on the audience</text><line x1="450" y1="508" x2="450" y2="542" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><rect x="30" y="550" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="583" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">THE ESSAY’S ARGUMENT</text><text x="450" y="610.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The scene presents grief as a refusal to let the past move on.</text>
</svg>