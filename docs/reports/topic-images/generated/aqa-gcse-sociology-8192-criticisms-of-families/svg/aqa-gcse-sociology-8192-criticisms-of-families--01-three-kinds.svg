<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three kinds of criticism</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Critics think the functionalist picture of the family is too rosy</text>
<rect x="30" y="122" width="269.3333333333333" height="283" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,173 L31.25,136.25 Q31.25,123.25 44.25,123.25 L285.0833333333333,123.25 Q298.0833333333333,123.25 298.0833333333333,136.25 L298.0833333333333,173 Z" fill="#dce9e7"/><line x1="31.25" y1="173" x2="298.0833333333333" y2="173" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="153.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Structure</text><text x="44" y="205.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">The family is too small</text><text x="44" y="227.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">and cut off</text><circle cx="49" cy="249.54" r="4.5" fill="#2e6b62"/><text x="62" y="255.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Isolation and unrealistic</text><text x="62" y="277.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">idealisation</text><circle cx="49" cy="301.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="307.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Loss of traditional</text><text x="62" y="329.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">functions</text><circle cx="49" cy="353.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="359.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lack of contact with wider</text><text x="62" y="381.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">kin</text><rect x="315.3333333333333" y="122" width="269.3333333333333" height="283" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,173 L316.5833333333333,136.25 Q316.5833333333333,123.25 329.5833333333333,123.25 L570.4166666666666,123.25 Q583.4166666666666,123.25 583.4166666666666,136.25 L583.4166666666666,173 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="173" x2="583.4166666666666" y2="173" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="153.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Power</text><text x="329.3333333333333" y="205.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">It benefits some members</text><text x="329.3333333333333" y="227.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">more than others</text><circle cx="334.3333333333333" cy="249.54" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="255.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The status and role of</text><text x="347.3333333333333" y="277.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">women</text><circle cx="334.3333333333333" cy="301.53999999999996" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="307.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Zaretsky: capitalism</text><text x="347.3333333333333" y="329.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">benefits</text><circle cx="334.3333333333333" cy="353.53999999999996" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="359.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Delphy and Leonard: men</text><text x="347.3333333333333" y="381.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">benefit</text><rect x="600.6666666666666" y="122" width="269.3333333333333" height="283" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,173 L601.9166666666666,136.25 Q601.9166666666666,123.25 614.9166666666666,123.25 L855.75,123.25 Q868.75,123.25 868.75,136.25 L868.75,173 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="173" x2="868.75" y2="173" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="153.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Harm</text><text x="614.6666666666666" y="205.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">It can damage the people</text><text x="614.6666666666666" y="227.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">in it</text><circle cx="619.6666666666666" cy="249.54" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="255.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marital breakdown</text><circle cx="619.6666666666666" cy="279.53999999999996" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="285.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Dysfunctional families:</text><text x="632.6666666666666" y="307.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">abuse, neglect, constant</text><text x="632.6666666666666" y="329.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">conflict</text><rect x="30" y="425" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="461" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">In the exam</text><text x="56" y="490" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Say which kind of criticism you are making, and which perspective makes it.</text>
</svg>