<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 765" width="900" height="765" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="765" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Zaretsky: how the family props up capitalism</text>

<line x1="289" y1="200" x2="326" y2="200" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="574" y1="200" x2="611" y2="200" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="720" y1="252" x2="620" y2="408" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="466" y1="460" x2="434" y2="460" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="280" y1="408" x2="180" y2="252" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="45" y="154" width="240" height="92" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Dull, insecure job</text><text x="165" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">alienation at work</text><rect x="330" y="154" width="240" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Home to the family</text><text x="450" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">which cushions the worker</text><rect x="615" y="154" width="240" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Job feels bearable</text><text x="735" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">so the worker does not</text><text x="735" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">challenge the system</text><rect x="470" y="414" width="240" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="590" y="446" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Spends wages on goods</text><text x="590" y="472" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the family as a unit of</text><text x="590" y="492" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">consumption</text><rect x="190" y="414" width="240" height="92" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="310" y="446" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Profit to capitalists</text><text x="310" y="472" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">capitalism is perpetuated</text><text x="450" y="324" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">The family is a</text><text x="450" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">prop to capitalism</text><rect x="30" y="540" width="840" height="201" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="576" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Zaretsky (1976): the family cannot win</text><circle cx="61" cy="599.39" r="4.5" fill="#8a6d0d"/><text x="74" y="605" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The separate “private life” of the family is an illusion</text><circle cx="61" cy="629.39" r="4.5" fill="#8a6d0d"/><text x="74" y="635" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It cannot make up for the lack of meaning at work, or meet all psychological and social</text><text x="74" y="657" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">needs</text><circle cx="61" cy="681.39" r="4.5" fill="#8a6d0d"/><text x="74" y="687" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It relies on housewives’ unpaid domestic labour to reproduce future workers</text><circle cx="61" cy="711.39" r="4.5" fill="#8a6d0d"/><text x="74" y="717" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Only <tspan font-weight="700">socialism</tspan> would end the separation of family and public life</text>
</svg>