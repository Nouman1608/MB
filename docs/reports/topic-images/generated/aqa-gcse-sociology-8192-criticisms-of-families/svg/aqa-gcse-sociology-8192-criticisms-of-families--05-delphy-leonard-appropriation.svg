<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 793" width="900" height="793" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="793" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Delphy and Leonard: whose work, whose benefit?</text>

<rect x="30" y="108" width="404" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,158 Z" fill="#f2e7b8"/><line x1="31.25" y1="158" x2="432.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Woman</text><rect x="70" y="186" width="324" height="90" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="232" y="237" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Full-time paid job</text><rect x="70" y="286" width="324" height="56" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="232" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cooking</text><rect x="70" y="352" width="324" height="56" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="232" y="386" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cleaning</text><rect x="70" y="418" width="324" height="56" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="232" y="452" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Organising the children</text><text x="232" y="508" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">her work is appropriated</text><rect x="466" y="108" width="404" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,158 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#b5d3cf"/><line x1="467.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Man</text><rect x="506" y="186" width="324" height="90" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="668" y="237" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Full-time paid job</text><rect x="506" y="286" width="324" height="132" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="668" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Free time and comfort</text><text x="668" y="508" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">he benefits from her labour</text><line x1="410" y1="340" x2="494" y2="340" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><rect x="30" y="546" width="840" height="223" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="582" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Familiar Exploitation (1992)</text><circle cx="61" cy="605.39" r="4.5" fill="#8a6d0d"/><text x="74" y="611" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The family is an <tspan font-weight="700">economic system</tspan> of labour relations, not an accident or a hangover from</text><text x="74" y="633" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the past</text><circle cx="61" cy="657.39" r="4.5" fill="#8a6d0d"/><text x="74" y="663" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It is <tspan font-weight="700">men, rather than capitalists</tspan>, who mainly benefit</text><circle cx="61" cy="687.39" r="4.5" fill="#8a6d0d"/><text x="74" y="693" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The family has a central role in maintaining <tspan font-weight="700">patriarchy</tspan></text><circle cx="61" cy="717.39" r="4.5" fill="#8a6d0d"/><text x="74" y="723" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Criticism:</tspan> underplays change; not all women experience the family as oppressive; patterns</text><text x="74" y="745" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">differ by class and ethnicity</text>
</svg>