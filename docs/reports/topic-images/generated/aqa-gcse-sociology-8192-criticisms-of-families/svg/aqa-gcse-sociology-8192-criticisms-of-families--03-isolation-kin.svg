<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Losing contact with wider kin</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Young and Willmott (1957)</text>
<rect x="30" y="122" width="404" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,172 L31.25,136.25 Q31.25,123.25 44.25,123.25 L419.75,123.25 Q432.75,123.25 432.75,136.25 L432.75,172 Z" fill="#f2e7b8"/><line x1="31.25" y1="172" x2="432.75" y2="172" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Close to kin</text><rect x="466" y="122" width="404" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,172 L467.25,136.25 Q467.25,123.25 480.25,123.25 L855.75,123.25 Q868.75,123.25 868.75,136.25 L868.75,172 Z" fill="#b5d3cf"/><line x1="467.25" y1="172" x2="868.75" y2="172" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cut off from kin</text><text x="232" y="200" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Bethnal Green, east London</text><text x="668" y="200" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">A new estate outside London</text><line x1="232" y1="350" x2="140" y2="274" stroke="#2e6b62" stroke-width="3"/><line x1="232" y1="350" x2="232" y2="256" stroke="#2e6b62" stroke-width="3"/><line x1="232" y1="350" x2="320" y2="279" stroke="#2e6b62" stroke-width="3"/><line x1="232" y1="350" x2="170" y2="354" stroke="#2e6b62" stroke-width="3"/><line x1="232" y1="350" x2="300" y2="354" stroke="#2e6b62" stroke-width="3"/><rect x="120" y="258" width="40" height="32" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M116,258 L140,236 L164,258 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="212" y="240" width="40" height="32" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M208,240 L232,218 L256,240 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="300" y="263" width="40" height="32" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M296,263 L320,241 L344,263 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="150" y="338" width="40" height="32" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M146,338 L170,316 L194,338 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="280" y="338" width="40" height="32" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M276,338 L300,316 L324,338 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="204" y="321" width="56" height="44" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M200,321 L232,293 L264,321 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="232" y="395" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">family</text><circle cx="57" cy="434.39" r="4.5" fill="#2e6b62"/><text x="70" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Day-to-day contact with relatives</text><circle cx="57" cy="464.39" r="4.5" fill="#2e6b62"/><text x="70" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Practical help with childcare</text><rect x="572" y="321" width="56" height="44" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M568,321 L600,293 L632,321 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="600" y="395" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">family</text><rect x="770" y="248" width="40" height="32" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M766,248 L790,226 L814,248 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="630" y1="340" x2="768" y2="266" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 6"/><rect x="810" y="308" width="40" height="32" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M806,308 L830,286 L854,308 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="630" y1="340" x2="808" y2="326" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 6"/><text x="815" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">kin far away</text><circle cx="493" cy="434.39" r="4.5" fill="#2e6b62"/><text x="506" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More home-centred and isolated</text><circle cx="493" cy="464.39" r="4.5" fill="#2e6b62"/><text x="506" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Emotional needs fall on a few people</text><circle cx="493" cy="494.39" r="4.5" fill="#2e6b62"/><text x="506" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Older people may be more isolated</text><line x1="400" y1="320" x2="520" y2="320" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="460" y="306" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">moved</text><rect x="30" y="560" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="596" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Counter-argument: the modified extended family</text><text x="56" y="625" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Relatives keep in contact through phone calls, video calls, visits and money, even when they</text><text x="56" y="647" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">live apart.</text>
