<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 809" width="900" height="809" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="809" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The six criticisms in the specification</text>

<rect x="268" y="104" width="297" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="416.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The problem</text><rect x="573" y="104" width="297" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="721.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who says so</text><rect x="30" y="156" width="230" height="135" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="206.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1. Isolation and</text><text x="42" y="228.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">unrealistic</text><text x="42" y="250.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">idealisation</text><rect x="268" y="156" width="297" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="282" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cut off from kin and neighbours,</text><text x="282" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so all emotional needs fall on a</text><text x="282" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">few people; the “cereal packet”</text><text x="282" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">image makes real families feel</text><text x="282" y="270.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they have failed</text><rect x="573" y="156" width="297" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="587" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Leach (1967): the family’s</text><text x="587" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“narrow privacy and tawdry</text><text x="587" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">secrets”; Oakley</text><rect x="30" y="299" width="230" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="339.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">2. Loss of traditional</text><text x="42" y="361.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">functions</text><rect x="268" y="299" width="297" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="282" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Functions passed to schools,</text><text x="282" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hospitals and the welfare state,</text><text x="282" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so the family may be weaker</text><rect x="573" y="299" width="297" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="587" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics, building on Parsons;</text><text x="587" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reply: core functions such as</text><text x="587" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">primary socialisation are kept</text><rect x="30" y="400" width="230" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="440.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">3. Lack of contact</text><text x="42" y="462.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">with wider kin</text><rect x="268" y="400" width="297" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="282" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less practical help with</text><text x="282" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">childcare; older people more</text><text x="282" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">isolated</text><rect x="573" y="400" width="297" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="587" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Young and Willmott (1957); reply:</text><text x="587" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the modified extended family</text><rect x="30" y="501" width="230" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="541.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">4. Status and role of</text><text x="42" y="563.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">women</text><rect x="268" y="501" width="297" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="282" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Patriarchal: dual burden, lower</text><text x="282" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lifetime earnings, less power</text><text x="282" y="573.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">over money and decisions</text><rect x="573" y="501" width="297" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="587" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists; Delphy and Leonard</text><rect x="30" y="602" width="230" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="653.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">5. Marital breakdown</text><rect x="268" y="602" width="297" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="282" y="632.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Divorce, separation and empty</text><text x="282" y="653.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shell marriages suggest</text><text x="282" y="674.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unrealistic demands on couples</text><rect x="573" y="602" width="297" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="587" y="632.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics of the nuclear family</text><rect x="30" y="703" width="230" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="734.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">6. Dysfunctional</text><text x="42" y="756.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">families</text><rect x="268" y="703" width="297" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="282" y="733.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Abuse, neglect and constant</text><text x="282" y="754.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conflict, hidden by privacy</text><rect x="573" y="703" width="297" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="587" y="733.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Radical feminists; Dobash and</text><text x="587" y="754.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dobash (1979)</text>
</svg>