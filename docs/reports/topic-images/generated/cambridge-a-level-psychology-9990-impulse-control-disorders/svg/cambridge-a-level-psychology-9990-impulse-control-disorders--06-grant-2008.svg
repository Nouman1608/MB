<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 919" width="900" height="919" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="919" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Grant et al. (2008)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Who responds to opiate antagonists for pathological gambling?</text>
<rect x="30" y="124" width="350" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="205" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TRIAL 1</text><text x="205" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Nalmefene</text><text x="205" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">16 weeks</text><rect x="520" y="124" width="350" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="695" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TRIAL 2</text><text x="695" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Naltrexone</text><text x="695" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">18 weeks</text><line x1="233" y1="242" x2="380" y2="284" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="667" y1="242" x2="520" y2="284" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="170" y="304" width="560" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="339.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Pooled data: 284 people</text><text x="450" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">both double-blind and placebo-controlled</text><rect x="30" y="415" width="413" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="447" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEASURE</text><text x="50" y="478.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Yale-Brown scale adapted for gambling.</text><rect x="457" y="415" width="413" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="447" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESPONSE MEANT</text><text x="477" y="478.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A reduction of <tspan font-weight="700" fill="#1e2a44">at</tspan> <tspan font-weight="700" fill="#1e2a44">least</tspan> <tspan font-weight="700" fill="#1e2a44">35%</tspan>, sustained for <tspan font-weight="700" fill="#1e2a44">at</tspan></text><text x="477" y="499.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">least</tspan> <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">month</tspan>.</text><clipPath id="tc546"><rect x="30" y="546" width="840" height="210" rx="14"/></clipPath><g clip-path="url(#tc546)"><rect x="30" y="546" width="262.5" height="48" fill="#b5d3cf"/><text x="44" y="573.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Group</text><rect x="292.5" y="546" width="577.5" height="48" fill="#b5d3cf"/><text x="306.5" y="573.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Predictor of a better outcome</text><rect x="30" y="594" width="262.5" height="68" fill="#dce9e7"/><text x="44" y="620.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Drug</text><rect x="292.5" y="594" width="577.5" height="68" fill="#ffffff"/><text x="306.5" y="620.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A <tspan font-weight="700">family</tspan> <tspan font-weight="700">history</tspan> <tspan font-weight="700">of</tspan> <tspan font-weight="700">alcoholism</tspan>: the strongest association with good</text><text x="306.5" y="641.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">response</text><line x1="30" y1="662" x2="870" y2="662" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="662" width="262.5" height="47" fill="#dce9e7"/><text x="44" y="688.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Higher doses</text><rect x="292.5" y="662" width="577.5" height="47" fill="#f8faf9"/><text x="306.5" y="688.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stronger gambling urges at the start</text><line x1="30" y1="709" x2="870" y2="709" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="709" width="262.5" height="47" fill="#dce9e7"/><text x="44" y="735.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Placebo</text><rect x="292.5" y="709" width="577.5" height="47" fill="#ffffff"/><text x="306.5" y="735.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Younger age</text></g><line x1="292.5" y1="546" x2="292.5" y2="756" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="546" width="840" height="210" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="778" width="317.6923076923077" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="810" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="841.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Double-blind placebo control; large</text><text x="50" y="862.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pooled sample.</text><rect x="361.6923076923077" y="778" width="508.3076923076923" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="381.6923076923077" y="810" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="381.6923076923077" y="841.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pooling trials with different drugs and durations adds</text><text x="381.6923076923077" y="862.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">variability; family history mixes genes and environment.</text>
</svg>