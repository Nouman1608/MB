<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 633" width="900" height="633" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="633" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Miller's feeling-state theory</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How one behaviour gets linked to one feeling</text>
<line x1="60" y1="144" x2="60" y2="448" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A past experience</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. a big early win, or a theft</text><circle cx="60" cy="166" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="174.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="220" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="252.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">An intense positive feeling becomes fixed to the behaviour</text><text x="122" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"I am a winner" fixed to gambling; a feeling of power linked to theft: a <tspan font-weight="700" fill="#1e2a44">feeling-state</tspan></text><circle cx="60" cy="262" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="270.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="316" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="348.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Later, an event triggers a need for that feeling</text><text x="122" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">often linked to underlying negative beliefs about oneself</text><circle cx="60" cy="358" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="366.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="412" width="766" height="56" rx="14" fill="#f6e3d8" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="444.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The urge to repeat the behaviour is activated</text><circle cx="60" cy="440" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="448.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="490" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="524.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Treatment: the Feeling-State Addiction Protocol</text><text x="50" y="554.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Identify the feeling-state and process it, so the <tspan font-weight="700" fill="#1e2a44">link</tspan> <tspan font-weight="700" fill="#1e2a44">between</tspan> <tspan font-weight="700" fill="#1e2a44">feeling</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">behaviour</tspan> <tspan font-weight="700" fill="#1e2a44">is</tspan> <tspan font-weight="700" fill="#1e2a44">broken</tspan>: it</text><text x="50" y="576.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">treats the cause, not just the behaviour.</text>
</svg>