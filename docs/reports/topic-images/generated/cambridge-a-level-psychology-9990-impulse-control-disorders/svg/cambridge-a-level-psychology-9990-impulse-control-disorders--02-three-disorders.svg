<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three impulse control disorders</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Key features in ICD-11 and what rules a diagnosis out</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="357" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="175.8139534883721" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Disorder</text><rect x="205.8139534883721" y="124" width="390.69767441860466" height="48" fill="#b5d3cf"/><text x="219.8139534883721" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key features</text><rect x="596.5116279069767" y="124" width="273.48837209302326" height="48" fill="#f2e7b8"/><text x="610.5116279069767" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Not this disorder if...</text><rect x="30" y="172" width="175.8139534883721" height="110" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Kleptomania</text><rect x="205.8139534883721" y="172" width="390.69767441860466" height="110" fill="#ffffff"/><text x="219.8139534883721" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Strong impulses to steal objects <tspan font-weight="700">not</tspan> <tspan font-weight="700">needed</tspan> for</text><text x="219.8139534883721" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personal use or their monetary value; tension</text><text x="219.8139534883721" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">before, pleasure or relief during and after.</text><text x="219.8139534883721" y="261.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Items often discarded, hoarded or returned.</text><rect x="596.5116279069767" y="172" width="273.48837209302326" height="110" fill="#fbf6e2"/><text x="610.5116279069767" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">motivated by anger or revenge,</text><text x="610.5116279069767" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or better explained by another</text><text x="610.5116279069767" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">condition such as a manic</text><text x="610.5116279069767" y="261.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">episode</text><line x1="30" y1="282" x2="870" y2="282" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="282" width="175.8139534883721" height="89" fill="#dce9e7"/><text x="44" y="308.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Pyromania</text><rect x="205.8139534883721" y="282" width="390.69767441860466" height="89" fill="#f8faf9"/><text x="219.8139534883721" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repeated fire-setting; tension before;</text><text x="219.8139534883721" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">persistent</tspan> <tspan font-weight="700">fascination</tspan> with fire and related</text><text x="219.8139534883721" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">things; pleasure or relief during and after.</text><rect x="596.5116279069767" y="282" width="273.48837209302326" height="89" fill="#fbf6e2"/><text x="610.5116279069767" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">there is an obvious motive:</text><text x="610.5116279069767" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">money, revenge, sabotage or a</text><text x="610.5116279069767" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">political statement</text><line x1="30" y1="371" x2="870" y2="371" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="371" width="175.8139534883721" height="110" fill="#dce9e7"/><text x="44" y="397.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Gambling disorder</text><rect x="205.8139534883721" y="371" width="390.69767441860466" height="110" fill="#ffffff"/><text x="219.8139534883721" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Impaired</tspan> <tspan font-weight="700">control</tspan> (when to start, how much,</text><text x="219.8139534883721" y="418.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">when to stop); gambling given increasing</text><text x="219.8139534883721" y="439.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">priority; continued despite harm; online or</text><text x="219.8139534883721" y="460.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offline.</text><rect x="596.5116279069767" y="371" width="273.48837209302326" height="110" fill="#fbf6e2"/><text x="610.5116279069767" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the pattern is normally evident</text><text x="610.5116279069767" y="418.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">over at least <tspan font-weight="700">12</tspan> <tspan font-weight="700">months</tspan></text></g><line x1="205.8139534883721" y1="124" x2="205.8139534883721" y2="481" stroke="#c9d6d4" stroke-width="1.5"/><line x1="596.5116279069767" y1="124" x2="596.5116279069767" y2="481" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="357" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">ICD-11 classifies gambling disorder with disorders due to addictive behaviours; the syllabus groups it here.</text>
</svg>