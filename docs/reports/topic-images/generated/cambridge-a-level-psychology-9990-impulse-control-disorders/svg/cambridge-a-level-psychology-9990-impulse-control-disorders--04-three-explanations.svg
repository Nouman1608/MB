<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three explanations compared</text>

<rect x="30" y="100" width="270.6666666666667" height="271" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BIOLOGICAL</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Dopamine</text><text x="50" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the urge and the "high" are</text><text x="65.2" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">driven by dopamine in the</text><text x="65.2" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">brain's <tspan font-weight="700" fill="#1e2a44">reward</tspan> <tspan font-weight="700" fill="#1e2a44">pathway</tspan></text><text x="50" y="256.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">support: some Parkinson's</text><text x="65.2" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">patients on</text><text x="65.2" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dopamine-boosting</text><text x="65.2" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">medication developed</text><text x="65.2" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">problem gambling</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="271" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BEHAVIOURAL</text><text x="334.6666666666667" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Positive reinforcement</text><text x="334.6666666666667" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wins, excitement or a</text><text x="349.8666666666667" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">successful theft reinforce</text><text x="349.8666666666667" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the act</text><text x="334.6666666666667" y="256.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">variable-ratio</tspan> wins resist</text><text x="349.8666666666667" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">extinction; near misses feel</text><text x="349.8666666666667" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">like wins</text><text x="334.6666666666667" y="325.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="325.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relief of tension adds</text><text x="349.8666666666667" y="346.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">negative</tspan> reinforcement</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="271" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COGNITIVE</text><text x="619.3333333333334" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feeling-state (Miller)</text><text x="619.3333333333334" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an intense positive feeling</text><text x="634.5333333333334" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">becomes <tspan font-weight="700" fill="#1e2a44">fixed</tspan> to a</text><text x="634.5333333333334" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">behaviour during a past</text><text x="634.5333333333334" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">experience</text><text x="619.3333333333334" y="277.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">later needs for that feeling</text><text x="634.5333333333334" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trigger the urge</text><rect x="30" y="393" width="270.6666666666667" height="172" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="425" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EVALUATION</text><text x="50" y="456.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explains the reward, but</text><text x="50" y="477.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reductionist: cannot say why</text><text x="50" y="498.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one person steals and another</text><text x="50" y="519.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gambles; deterministic.</text><rect x="314.6666666666667" y="393" width="270.6666666666667" height="172" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="425" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EVALUATION</text><text x="334.6666666666667" y="456.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explains maintenance and</text><text x="334.6666666666667" y="477.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leads to treatment, but not</text><text x="334.6666666666667" y="498.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">everyone who wins develops</text><text x="334.6666666666667" y="519.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a disorder: nature matters too.</text><rect x="599.3333333333334" y="393" width="270.6666666666667" height="172" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="425" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EVALUATION</text><text x="619.3333333333334" y="456.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explains why the urge is</text><text x="619.3333333333334" y="477.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">specific to one behaviour;</text><text x="619.3333333333334" y="498.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evidence mainly from case</text><text x="619.3333333333334" y="519.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reports, so lacks nomothetic</text><text x="619.3333333333334" y="540.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">support.</text>
</svg>