<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 561" width="900" height="561" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="561" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Kleptomania Symptom Assessment Scale</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">K-SAS: a self-report questionnaire about the past week</text>
<rect x="30" y="124" width="270.6666666666667" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Urges</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">intensity and frequency of</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">urges to steal</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Thoughts</text><text x="334.6666666666667" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time spent thinking about</text><text x="334.6666666666667" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stealing</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="169.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Control</text><text x="619.3333333333334" y="198.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ability to control the urges</text><rect x="30" y="247" width="270.6666666666667" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="281.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Distress</text><text x="50" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">caused by the urges and</text><text x="50" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">behaviour</text><rect x="314.6666666666667" y="247" width="270.6666666666667" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="281.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Behaviour</text><text x="334.6666666666667" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how often stealing actually</text><text x="334.6666666666667" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">occurred</text><rect x="599.3333333333334" y="247" width="270.6666666666667" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="281.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Higher total</text><text x="619.3333333333334" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">= more severe; compare</text><text x="619.3333333333334" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">before and after treatment</text><rect x="30" y="378" width="413" height="151" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quantitative, comparable data; the past-week</text><text x="50" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">focus makes it sensitive to change during</text><text x="50" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treatment.</text><rect x="457" y="378" width="413" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="410" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Subjective report of illegal, embarrassing</text><text x="477" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">behaviour, so under-reporting is likely; no</text><text x="477" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">qualitative detail about why. A case study adds</text><text x="477" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">idiographic detail.</text>
</svg>