<rect width="900" height="586" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The impulse control cycle</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A repeated failure to resist an urge that is rewarding in the short term</text>
<path d="M520,195 Q730,199 720,302" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M720,406 Q730,509 595,515" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M305,515 Q170,509 180,406" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M180,302 Q170,199 305,195" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)" stroke-dasharray="9 7"/><rect x="310" y="143" width="280" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="180.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Rising tension</text><text x="450" y="209.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">or arousal before the act</text><rect x="580" y="308" width="280" height="92" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="345.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The act</text><text x="720" y="374.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">steal · set a fire · gamble</text><rect x="310" y="473" width="280" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="510.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Pleasure or relief</text><text x="450" y="539.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">during and just after</text><rect x="40" y="308" width="280" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="345.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Guilt or regret</text><text x="180" y="374.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">often, afterwards</text><text x="450" y="360" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">short-term reward,</text><text x="450" y="384" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">longer-term harm</text>
</svg>