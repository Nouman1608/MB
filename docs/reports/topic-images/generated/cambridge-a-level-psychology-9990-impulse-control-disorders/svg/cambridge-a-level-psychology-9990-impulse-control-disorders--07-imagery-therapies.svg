<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two imagery-based therapies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">One adds aversion, the other adds relaxation</text>
<rect x="30" y="124" width="410" height="154" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">COVERT SENSITISATION</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Imagined urge + imagined aversion</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. nausea, being caught, public humiliation, so</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the act becomes associated with something</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unpleasant.</text><rect x="460" y="124" width="410" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMAGINAL DESENSITISATION</text><text x="480" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Relaxation + imagined triggers</text><text x="480" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. passing a betting shop, feeling the urge, and</text><text x="480" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">imagining leaving without acting, while staying</text><text x="480" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relaxed.</text><rect x="30" y="300" width="410" height="131" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="334.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">→ behaviour linked to something</text><text x="50" y="357.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">unpleasant</text><text x="50" y="385.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Avoids the ethics of real aversive stimuli. Glover</text><text x="50" y="406.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1985): case of a woman with kleptomania.</text><rect x="460" y="300" width="410" height="131" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="334.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">→ relaxation replaces arousal, weakening</text><text x="480" y="357.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the urge</text><text x="480" y="385.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Blaszczynski and Nower (2003) describe it for</text><text x="480" y="406.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">problem gambling.</text><rect x="30" y="453" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="487.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Both therapies</text><text x="50" y="516.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Short, tailored to the client's own triggers (idiographic) and teach self-control, but depend on vivid</text><text x="50" y="537.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">imagery and motivation. Drugs need little effort, but response varies and they do not address learned</text><text x="50" y="558.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">habits.</text>
</svg>