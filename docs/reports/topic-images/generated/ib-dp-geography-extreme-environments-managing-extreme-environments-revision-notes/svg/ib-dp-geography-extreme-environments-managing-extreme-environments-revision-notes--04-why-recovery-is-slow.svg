<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why extreme environments recover slowly</text>

<rect x="30" y="115" width="260" height="100" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="157" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Low productivity</text><text x="160" y="186" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and harsh conditions</text><line x1="292" y1="165" x2="318" y2="165" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="115" width="260" height="100" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="157" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Slow regrowth</text><text x="450" y="186" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of vegetation and soils</text><line x1="582" y1="165" x2="608" y2="165" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="115" width="260" height="100" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="157" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Damage lasts</text><text x="740" y="186" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">for many years</text><rect x="30" y="245" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="285" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Example: tyre tracks across tundra</text><path d="M40,360 L250,360 Q275,394 300,360 L380,360 Q405,394 430,360 L860,360 L860,560 L40,560 Z" fill="#cbbf9f"/><path d="M40,440 L235,440 Q275,530 315,440 L365,440 Q405,530 445,440 L860,440 L860,560 L40,560 Z" fill="#dce9e7"/><path d="M40,360 L250,360 Q275,394 300,360 L380,360 Q405,394 430,360 L860,360" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M40,440 L235,440 Q275,530 315,440 L365,440 Q405,530 445,440 L860,440" fill="none" stroke="#2b5a9a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 6"/><path d="M70,360 l-6,-18 M70,360 l2,-22 M70,360 l8,-16" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M110,360 l-6,-18 M110,360 l2,-22 M110,360 l8,-16" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M150,360 l-6,-18 M150,360 l2,-22 M150,360 l8,-16" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M190,360 l-6,-18 M190,360 l2,-22 M190,360 l8,-16" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M480,360 l-6,-18 M480,360 l2,-22 M480,360 l8,-16" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M530,360 l-6,-18 M530,360 l2,-22 M530,360 l8,-16" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M580,360 l-6,-18 M580,360 l2,-22 M580,360 l8,-16" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M630,360 l-6,-18 M630,360 l2,-22 M630,360 l8,-16" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M680,360 l-6,-18 M680,360 l2,-22 M680,360 l8,-16" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M730,360 l-6,-18 M730,360 l2,-22 M730,360 l8,-16" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M780,360 l-6,-18 M780,360 l2,-22 M780,360 l8,-16" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M830,360 l-6,-18 M830,360 l2,-22 M830,360 l8,-16" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="340" y="320" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">ruts stay bare</text><line x1="310" y1="326" x2="280" y2="368" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="370" y1="326" x2="400" y2="368" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><text x="560" y="420" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">thawed ground (active layer)</text><text x="560" y="495" font-size="16" font-weight="600" fill="#2b5a9a" text-anchor="start">frozen ground</text><text x="475" y="532" font-size="16" font-weight="400" fill="#2b5a9a" text-anchor="start">disturbed ground thaws more deeply</text><text x="475" y="552" font-size="16" font-weight="400" fill="#2b5a9a" text-anchor="start">under the ruts</text><rect x="30" y="595" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="638" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The short growing season limits regrowth, so tracks stay visible for many years.</text>
</svg>