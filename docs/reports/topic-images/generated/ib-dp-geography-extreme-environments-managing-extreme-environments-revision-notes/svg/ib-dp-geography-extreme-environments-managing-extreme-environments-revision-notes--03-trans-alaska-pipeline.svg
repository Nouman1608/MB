heat pipes (thermosyphons) on each support</text><line x1="522" y1="580" x2="522" y2="300" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="8 6"/><text x="538" y="380" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="start">heat out</text><text x="538" y="398" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="start">in winter</text><text x="320" y="458" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">caribou pass under</text><text x="46" y="494" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">active layer</text><text x="330" y="645" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">ice-rich permafrost kept frozen</text><rect x="650" y="110" width="220" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="760" y="145" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Plan view</text><path d="M700,170 l26,40 l-26,40 l26,40 l-26,40 l26,40 l-26,40 l26,40 l-26,40 l26,40" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="700" cy="170" r="8" fill="#1e2a44"/><circle cx="726" cy="530" r="8" fill="#1e2a44"/><text x="742" y="176" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Prudhoe Bay</text><text x="742" y="194" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">(Arctic coast)</text><text x="752" y="535" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Valdez</text><text x="752" y="553" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">(port)</text><text x="760" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">zigzag flexes</text><text x="760" y="609" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">with temperature and</text><text x="760" y="628" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">ground movement</text><rect x="30" y="690" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="726" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Problem: hot oil would thaw the permafrost and the ground would subside.</text><text x="55" y="756" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Works, but at high cost; the oil it carries adds to warming that threatens permafrost.</text>
