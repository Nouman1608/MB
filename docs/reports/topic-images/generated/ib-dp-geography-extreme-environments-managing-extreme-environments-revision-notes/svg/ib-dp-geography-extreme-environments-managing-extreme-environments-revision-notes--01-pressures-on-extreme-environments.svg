<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why pressure builds on extreme places</text>

<rect x="30" y="110" width="410" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Valuable resources</text><text x="50" y="168" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">oil and gas in the Arctic; copper and</text><text x="50" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lithium in the Atacama; sunshine for solar</text><rect x="460" y="110" width="410" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Remoteness and scenery</text><text x="480" y="168" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">attract tourists and scientists</text><text x="165" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Activities</text><rect x="30" y="285" width="270" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="321" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Resource extraction</text><line x1="302" y1="314" x2="378" y2="470" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="357" width="270" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="393" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Tourism</text><line x1="302" y1="386" x2="378" y2="470" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="429" width="270" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="465" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Irrigation agriculture</text><line x1="302" y1="458" x2="378" y2="470" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="501" width="270" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="537" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Infrastructure</text><line x1="302" y1="530" x2="378" y2="470" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="573" width="270" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="609" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Research stations</text><line x1="302" y1="602" x2="378" y2="470" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="235" y1="210" x2="235" y2="248" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="560" y1="210" x2="300" y2="260" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="385" y="380" width="210" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="415" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Each brings</text><text x="490" y="455" font-size="19" font-weight="600" fill="#b5602e" text-anchor="middle">people</text><text x="490" y="485" font-size="19" font-weight="600" fill="#b5602e" text-anchor="middle">roads</text><text x="490" y="515" font-size="19" font-weight="600" fill="#b5602e" text-anchor="middle">waste</text><text x="490" y="545" font-size="19" font-weight="600" fill="#b5602e" text-anchor="middle">water demand</text><line x1="597" y1="480" x2="640" y2="480" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="645" y="340" width="225" height="270" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="757" y="378" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Fragile system</text><text x="757" y="414" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">cannot absorb</text><text x="757" y="437" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">much disturbance</text><text x="757" y="490" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">low productivity</text><text x="757" y="512" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and harsh</text><text x="757" y="534" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">conditions mean</text><text x="757" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">damage can last</text>
</svg>