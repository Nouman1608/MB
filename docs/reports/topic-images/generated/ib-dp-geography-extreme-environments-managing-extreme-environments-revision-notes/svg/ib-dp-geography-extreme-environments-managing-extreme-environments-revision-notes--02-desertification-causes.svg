<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Desertification: people and climate together</text>

<rect x="30" y="150" width="330" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="195" y="204" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Climate variability</text><rect x="30" y="300" width="330" height="300" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="336" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Human activity</text><text x="52" y="382" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="72" y="382" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">overgrazing</text><text x="52" y="422" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="72" y="422" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">over-cultivation</text><text x="52" y="462" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="72" y="462" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">removing woody</text><text x="72" y="486" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">vegetation for fuel</text><text x="52" y="526" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="72" y="526" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">poor irrigation that</text><text x="72" y="550" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">salinises soil</text><circle cx="450" cy="360" r="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="370" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="450" y="430" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">interact</text><line x1="362" y1="200" x2="418" y2="335" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="362" y1="450" x2="418" y2="385" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="492" y1="360" x2="548" y2="360" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="555" y="230" width="315" height="260" rx="14" fill="#cbbf9f" stroke="#9c8f6e" stroke-width="2.5"/><text x="712" y="275" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Desertification</text><text x="712" y="315" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">land degradation</text><text x="712" y="341" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">in drylands</text><path d="M600,420 q30,-18 60,0 t60,0 t60,0 t60,0" fill="none" stroke="#9c8f6e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M600,450 q30,-18 60,0 t60,0 t60,0 t60,0" fill="none" stroke="#9c8f6e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="555" y="515" width="315" height="85" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><text x="712" y="550" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Not: a desert advancing</text><text x="712" y="576" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">on its own</text>
</svg>