<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" width="900" height="662" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Challenges for London and New York</text>

<rect x="30" y="112" width="840" height="520" rx="12" fill="#ffffff"/><path d="M30,156 L30,124 Q30,112 42,112 L858,112 Q870,112 870,124 L870,156 Z" fill="#b5d3cf"/><rect x="30" y="156" width="840" height="62" fill="#ffffff"/><text x="42" y="181.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Inequality</text><text x="212" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Child poverty in Tower Hamlets and</text><text x="212" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Newham near Canary Wharf’s wealth</text><text x="547" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parts of the Bronx among the poorest;</text><text x="547" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">much of Manhattan very wealthy</text><line x1="30" y1="156" x2="870" y2="156" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="218" width="840" height="62" fill="#dce9e7"/><text x="42" y="243.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Housing</text><text x="212" y="243.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High prices and rents; gentrification in</text><text x="212" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hackney</text><text x="547" y="243.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High prices and rents; gentrification in</text><text x="547" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Harlem</text><line x1="30" y1="218" x2="870" y2="218" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="280" width="840" height="62" fill="#ffffff"/><text x="42" y="305.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Land</text><text x="212" y="305.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Green Belt limits greenfield building, so</text><text x="212" y="326.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing goes on costly brownfield sites</text><text x="547" y="305.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Urban sprawl: suburbs across a large</text><text x="547" y="326.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">region, more car commuting</text><line x1="30" y1="280" x2="870" y2="280" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="342" width="840" height="62" fill="#dce9e7"/><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Traffic</text><text x="212" y="367.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Congestion Charge (2003); Ultra Low</text><text x="212" y="388.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Emission Zone (2019)</text><text x="547" y="367.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Congestion pricing south of 60th Street</text><text x="547" y="388.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(January 2025)</text><line x1="30" y1="342" x2="870" y2="342" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="404" width="840" height="83" fill="#ffffff"/><text x="42" y="429.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Water and waste</text><text x="212" y="429.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Victorian sewers overflow; Thames</text><text x="212" y="450.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tideway Tunnel built to capture sewage</text><text x="547" y="429.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Water from Catskill and Delaware</text><text x="547" y="450.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reservoirs; rubbish exported since Fresh</text><text x="547" y="471.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kills closed (2001)</text><line x1="30" y1="404" x2="870" y2="404" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="487" width="840" height="83" fill="#dce9e7"/><text x="42" y="512.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Energy and</text><text x="42" y="533.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">flooding</text><text x="212" y="512.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">—</text><text x="547" y="512.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hurricane Sandy (2012) flooded parts of</text><text x="547" y="533.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the city and cut power to lower</text><text x="547" y="554.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Manhattan</text><line x1="30" y1="487" x2="870" y2="487" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="570" width="840" height="62" fill="#ffffff"/><text x="42" y="595.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Food supply</text><text x="212" y="595.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Imported; New Covent Garden market</text><text x="547" y="595.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Imported; Hunts Point market in the</text><text x="547" y="616.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bronx</text><line x1="30" y1="570" x2="870" y2="570" stroke="#c9d6d4" stroke-width="1.5"/><line x1="200" y1="112" x2="200" y2="632" stroke="#c9d6d4" stroke-width="1.5"/><line x1="535" y1="112" x2="535" y2="632" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Challenge</text><text x="212" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">London</text><text x="547" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">New York</text><rect x="30" y="112" width="840" height="520" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>