<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 599" width="900" height="599" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="599" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">London and New York at a glance</text>

<rect x="30" y="112" width="840" height="457" rx="12" fill="#ffffff"/><path d="M30,156 L30,124 Q30,112 42,112 L858,112 Q870,112 870,124 L870,156 Z" fill="#b5d3cf"/><rect x="30" y="156" width="840" height="83" fill="#ffffff"/><text x="42" y="181.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Location</text><text x="212" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Capital of the UK; south-east England on</text><text x="212" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the River Thames</text><text x="547" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Largest US city; Atlantic coast at the</text><text x="547" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mouth of the Hudson; large natural</text><text x="547" y="223.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">harbour; five boroughs</text><line x1="30" y1="156" x2="870" y2="156" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="239" width="840" height="41" fill="#dce9e7"/><text x="42" y="264.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Population</text><text x="212" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">About 8.8 million (2021 census)</text><text x="547" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">About 8.8 million (2020 census)</text><line x1="30" y1="239" x2="870" y2="239" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="280" width="840" height="41" fill="#ffffff"/><text x="42" y="305.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Born abroad</text><text x="212" y="305.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Around four in ten Londoners</text><text x="547" y="305.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More than a third of New Yorkers</text><line x1="30" y1="280" x2="870" y2="280" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="321" width="840" height="62" fill="#dce9e7"/><text x="42" y="346.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Finance</text><text x="212" y="346.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">City of London and Canary Wharf; Bank</text><text x="212" y="367.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of England; London Stock Exchange</text><text x="547" y="346.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wall Street; New York Stock Exchange;</text><text x="547" y="367.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nasdaq</text><line x1="30" y1="321" x2="870" y2="321" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="383" width="840" height="62" fill="#ffffff"/><text x="42" y="408.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Trade</text><text x="212" y="408.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">International airports; port facilities on</text><text x="212" y="429.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Thames estuary</text><text x="547" y="408.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Port of New York and New Jersey; JFK</text><text x="547" y="429.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Airport</text><line x1="30" y1="383" x2="870" y2="383" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="445" width="840" height="41" fill="#dce9e7"/><text x="42" y="470.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Culture</text><text x="212" y="470.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">West End, British Museum, Tate Modern</text><text x="547" y="470.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Broadway, Metropolitan Museum of Art</text><line x1="30" y1="445" x2="870" y2="445" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="486" width="840" height="83" fill="#ffffff"/><text x="42" y="511.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Politics</text><text x="212" y="511.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UK government at Westminster;</text><text x="212" y="532.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Commonwealth Secretariat; International</text><text x="212" y="553.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Maritime Organization</text><text x="547" y="511.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">United Nations headquarters, though not</text><text x="547" y="532.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the national capital</text><line x1="30" y1="486" x2="870" y2="486" stroke="#c9d6d4" stroke-width="1.5"/><line x1="200" y1="112" x2="200" y2="569" stroke="#c9d6d4" stroke-width="1.5"/><line x1="535" y1="112" x2="535" y2="569" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><text x="212" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">London</text><text x="547" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">New York</text><rect x="30" y="112" width="840" height="457" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>