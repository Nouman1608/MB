<rect width="900" height="501" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why London’s location suits global business</text>

<text x="60" y="126" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Schematic of one London working day (not a clock scale)</text><rect x="220" y="140" width="220" height="198" fill="#f2e7b8" opacity="0.6"/><rect x="460" y="140" width="220" height="198" fill="#dce9e7" opacity="0.8"/><rect x="60" y="146" width="380" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="250" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Asian markets still open</text><rect x="220" y="212" width="460" height="54" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="246" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">London working day</text><rect x="460" y="278" width="380" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="650" y="312" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">North American markets open</text><text x="330" y="366" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">morning overlap</text><text x="570" y="366" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">afternoon overlap</text><rect x="30" y="396" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="426.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">London lies on the Greenwich Meridian (0° longitude). Heathrow is one of the world’s busiest</text><text x="48" y="448.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">international airports, and Eurostar links London to mainland Europe through the Channel Tunnel.</text>
</svg>