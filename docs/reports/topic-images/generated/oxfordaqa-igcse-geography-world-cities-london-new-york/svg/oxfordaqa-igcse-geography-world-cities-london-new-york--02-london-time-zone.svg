<rect width="900" height="541" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why London’s location suits global business</text>

<text x="60" y="166" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Schematic of one London working day (not a clock scale)</text><rect x="60" y="186" width="400" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="260" y="220" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Asian markets still open</text><rect x="220" y="252" width="460" height="54" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="286" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">London working day</text><rect x="440" y="318" width="400" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640" y="352" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">North American markets open</text><rect x="220" y="180" width="240" height="198" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-dasharray="8 6"/><rect x="440" y="180" width="240" height="198" fill="none" stroke="#2e6b62" stroke-width="3" stroke-dasharray="8 6"/><text x="340" y="406" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">morning overlap</text><text x="560" y="406" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">afternoon overlap</text><rect x="30" y="436" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="466.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">London lies on the Greenwich Meridian (0° longitude). Heathrow is one of the world’s busiest</text><text x="48" y="488.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">international airports, and Eurostar links London to mainland Europe through the Channel Tunnel.</text>
</svg>