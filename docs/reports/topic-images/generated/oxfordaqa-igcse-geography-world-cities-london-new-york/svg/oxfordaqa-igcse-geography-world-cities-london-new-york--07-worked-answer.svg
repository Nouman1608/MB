<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="510" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A 4-mark answer on migration and character</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Point, Development, Effect, Link</text>
<rect x="30" y="112" width="140" height="75" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="100" y="156.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Point</text><rect x="190" y="112" width="680" height="75" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="208" y="142.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">London has received migrants from the Caribbean after 1948, South Asia and,</text><text x="208" y="164.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">after 2004, Eastern Europe.</text><line x1="100" y1="189" x2="100" y2="207" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="209" width="140" height="75" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="100" y="253.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Development</text><rect x="190" y="209" width="680" height="75" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="208" y="239.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Around four in ten Londoners were born outside the UK, so the city is highly</text><text x="208" y="261.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">multicultural.</text><line x1="100" y1="286" x2="100" y2="304" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="306" width="140" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="100" y="350.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Effect</text><rect x="190" y="306" width="680" height="75" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="208" y="336.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Distinct neighbourhoods such as Brick Lane’s Bangladeshi community, and</text><text x="208" y="358.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">events like the Notting Hill Carnival.</text><line x1="100" y1="383" x2="100" y2="401" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="403" width="140" height="75" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="100" y="447.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Link</text><rect x="190" y="403" width="680" height="75" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="208" y="433.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Migration has shaped London’s food, culture and labour force, making it more</text><text x="208" y="455.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">attractive as a global city.</text>
</svg>