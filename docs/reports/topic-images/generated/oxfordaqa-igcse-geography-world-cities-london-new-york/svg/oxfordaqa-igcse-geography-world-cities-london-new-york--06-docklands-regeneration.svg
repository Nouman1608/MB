<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 782" width="900" height="782" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="782" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Flagship regeneration: London Docklands</text>

<rect x="30" y="112" width="840" height="126" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why it was needed</text><text x="48" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">From the 1960s ships grew too large for the docks and container trade moved downstream to Tilbury. The</text><text x="48" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">docks closed between the late 1960s and 1981, leaving derelict land, high unemployment and poor</text><text x="48" y="215.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing.</text><line x1="450" y1="242" x2="450" y2="274" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="30" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MAIN FEATURES</text><rect x="30" y="282" width="197" height="141" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="313.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1981–1998</text><text x="48" y="340.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">London Docklands</text><text x="48" y="360.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Development</text><text x="48" y="380.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Corporation attracts</text><text x="48" y="400.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">private investment</text><rect x="244.3" y="282" width="197" height="141" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="262.3" y="313.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1987</text><text x="262.3" y="340.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Docklands Light</text><text x="262.3" y="360.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Railway; London City</text><text x="262.3" y="380.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Airport</text><rect x="458.6" y="282" width="197" height="141" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476.6" y="313.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1999</text><text x="476.6" y="340.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Jubilee line extension</text><rect x="672.9000000000001" y="282" width="197" height="141" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690.9000000000001" y="313.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Also</text><text x="690.9000000000001" y="340.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Canary Wharf financial</text><text x="690.9000000000001" y="360.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">district; new housing,</text><text x="690.9000000000001" y="380.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">shops, ExCeL</text><text x="30" y="449" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">IMPACTS</text><rect x="30" y="463" width="270" height="164" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="494.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economic</text><text x="48" y="521.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">+ Many thousands of new office</text><text x="48" y="541.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">jobs</text><text x="48" y="564.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">− Many taken by commuters;</text><text x="48" y="584.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">local former dock workers lacked</text><text x="48" y="604.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the skills</text><rect x="315" y="463" width="270" height="164" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="333" y="494.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Social</text><text x="333" y="521.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">+ Better transport and services</text><text x="333" y="544.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">− New housing too expensive for</text><text x="333" y="564.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">existing residents</text><rect x="600" y="463" width="270" height="164" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="494.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Environmental</text><text x="618" y="521.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">+ Derelict land and docks</text><text x="618" y="541.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cleaned up; waterside improved</text><text x="618" y="564.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">− Densely built up</text><rect x="30" y="647" width="840" height="105" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="680" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="48" y="708.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The project transformed the area economically, but the benefits were unevenly shared with the original</text><text x="48" y="729.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">community.</text>
</svg>