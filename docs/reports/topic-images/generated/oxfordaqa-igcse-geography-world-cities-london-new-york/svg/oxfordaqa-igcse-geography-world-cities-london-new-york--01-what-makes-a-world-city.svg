<rect width="900" height="689" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes a world city?</text>

<line x1="290" y1="164.5" x2="450" y2="300" stroke="#c9d6d4" stroke-width="4"/><rect x="30" y="112" width="260" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Finance and business</text><text x="48" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A centre of finance and</text><text x="48" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">business</text><line x1="610" y1="164.5" x2="450" y2="300" stroke="#c9d6d4" stroke-width="4"/><rect x="610" y="112" width="260" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="628" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">TNC headquarters</text><text x="628" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Head offices of transnational</text><text x="628" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">corporations</text><line x1="290" y1="435.5" x2="450" y2="300" stroke="#c9d6d4" stroke-width="4"/><rect x="30" y="383" width="260" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="416" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Transport hub</text><text x="48" y="444.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A hub for international</text><text x="48" y="465.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transport</text><line x1="610" y1="435.5" x2="450" y2="300" stroke="#c9d6d4" stroke-width="4"/><rect x="610" y="383" width="260" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="628" y="416" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Culture and politics</text><text x="628" y="444.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Global cultural and political</text><text x="628" y="465.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">importance</text><circle cx="450" cy="300" r="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="296" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">World city</text><text x="450" y="322" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">influence far beyond</text><text x="450" y="340" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">its own country</text><rect x="30" y="512" width="840" height="147" rx="12" fill="#ffffff"/><path d="M30,556 L30,524 Q30,512 42,512 L858,512 Q870,512 870,524 L870,556 Z" fill="#b5d3cf"/><rect x="30" y="556" width="840" height="62" fill="#ffffff"/><text x="42" y="581.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Mostly North America, Europe and East Asia</text><text x="462" y="581.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">London, New York and Tokyo, usually ranked at the</text><text x="462" y="602.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">top</text><line x1="30" y1="556" x2="870" y2="556" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="618" width="840" height="41" fill="#dce9e7"/><text x="42" y="643.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">A growing number in newly-emerging economies</text><text x="462" y="643.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shanghai, Mumbai, São Paulo</text><line x1="30" y1="618" x2="870" y2="618" stroke="#c9d6d4" stroke-width="1.5"/><line x1="450" y1="512" x2="450" y2="659" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="541.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Where world cities are found</text><text x="462" y="541.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Examples</text><rect x="30" y="512" width="840" height="147" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>