<rect width="900" height="673" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Waves of migration that shaped both cities</text>

<rect x="30" y="112" width="840" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="139" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">London</text><rect x="30" y="166" width="197" height="139" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="196.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">After 1948</text><text x="48" y="222.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The Windrush</text><text x="48" y="242.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">generation from the</text><text x="48" y="262.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Caribbean</text><line x1="229" y1="235.5" x2="242.3" y2="235.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="244.3" y="166" width="197" height="139" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262.3" y="196.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Then</text><text x="262.3" y="222.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Large numbers from</text><text x="262.3" y="242.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">South Asia and Africa</text><line x1="443.3" y1="235.5" x2="456.6" y2="235.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="458.6" y="166" width="197" height="139" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476.6" y="196.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">After 2004</text><text x="476.6" y="222.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Eastern Europe, after</text><text x="476.6" y="242.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the EU expanded</text><rect x="672.9000000000001" y="166" width="197" height="139" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="690.9000000000001" y="196.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">National</text><text x="690.9000000000001" y="222.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Young adults arrive for</text><text x="690.9000000000001" y="242.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">study and work; some</text><text x="690.9000000000001" y="262.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">older people and</text><text x="690.9000000000001" y="282.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">families move out</text><rect x="30" y="335" width="840" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="362" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">New York</text><rect x="30" y="389" width="197" height="159" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="419.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1892–1954</text><text x="48" y="445.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Millions of Europeans</text><text x="48" y="465.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">enter through Ellis</text><text x="48" y="485.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Island</text><line x1="229" y1="468.5" x2="242.3" y2="468.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="244.3" y="389" width="197" height="159" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262.3" y="419.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Later</text><text x="262.3" y="445.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Arrivals from the</text><text x="262.3" y="465.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Caribbean, Latin</text><text x="262.3" y="485.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">America and Asia</text><line x1="443.3" y1="468.5" x2="456.6" y2="468.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="458.6" y="389" width="197" height="159" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476.6" y="419.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">20th century</text><text x="476.6" y="445.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Great Migration of</text><text x="476.6" y="465.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">African Americans</text><text x="476.6" y="485.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from the South;</text><text x="476.6" y="505.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Harlem a cultural</text><text x="476.6" y="525.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">centre</text><rect x="672.9000000000001" y="389" width="197" height="159" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="690.9000000000001" y="419.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Character</text><text x="690.9000000000001" y="445.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Chinatown and Little</text><text x="690.9000000000001" y="465.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Italy reflect migration</text><text x="690.9000000000001" y="485.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">waves</text><rect x="30" y="568" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="598.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">London’s character: hundreds of languages, Brick Lane (Bangladeshi community) and the Notting</text><text x="48" y="620.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hill Carnival, which grew from the Caribbean community.</text>
