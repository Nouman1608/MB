<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Revise 1.3 and 1.4 as one timeline</text>

<line x1="170" y1="142" x2="170" y2="612" stroke="#1e2a44" stroke-width="4"/><rect x="220" y="112" width="650" height="60" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="244" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">First revelation</text><text x="130" y="151" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="end">610</text><rect x="220" y="186" width="650" height="80" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="244" y="220" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Hijra to Madinah</text><text x="244" y="248" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">start of the Islamic calendar</text><text x="130" y="235" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="end">622</text><rect x="220" y="280" width="650" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="244" y="314" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Constitution of Madinah</text><text x="244" y="342" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Muslims, Jews and other groups as one community under the Prophet's</text><text x="244" y="364" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">arbitration</text><rect x="220" y="394" width="650" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="244" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Muhajirun paired with the Ansar</text><text x="244" y="456" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a practical response to the migrants' destitution</text><rect x="220" y="488" width="650" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="244" y="526" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Battles of Badr, Uhud and the Trench</text><rect x="220" y="562" width="650" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="244" y="596" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Farewell Sermon</text><text x="244" y="624" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">equality, sanctity of life and property, abolition of usury and blood</text><text x="244" y="646" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">feuds</text><circle cx="170" cy="142" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="182" y1="142" x2="218" y2="142" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="226" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="182" y1="226" x2="218" y2="226" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="330" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="182" y1="330" x2="218" y2="330" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="434" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="182" y1="434" x2="218" y2="434" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="518" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="182" y1="518" x2="218" y2="518" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="612" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="182" y1="612" x2="218" y2="612" stroke="#1e2a44" stroke-width="2.5"/>
</svg>