<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two stages in the Qur'an's history</text>

<rect x="30" y="112" width="390" height="300" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="3"/><rect x="30" y="112" width="390" height="84" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><circle cx="70" cy="154" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="161.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="148" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Abu Bakr</text><text x="110" y="178" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">COMPILED</text><text x="54" y="232" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Why</text><text x="54" y="258" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Battle of Yamama killed many who had</text><text x="54" y="281" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">memorised it.</text><text x="54" y="330" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">What happened</text><text x="54" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Qur'an was compiled under his rule.</text><rect x="480" y="112" width="390" height="300" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="3"/><rect x="480" y="112" width="390" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><circle cx="520" cy="154" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="520" y="161.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="560" y="148" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Uthman</text><text x="560" y="178" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">STANDARDISED</text><text x="504" y="232" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">What happened</text><text x="504" y="258" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Qur'an was standardised: official</text><text x="504" y="281" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">copies were distributed and variant</text><text x="504" y="304" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">texts destroyed.</text><line x1="424" y1="262" x2="474" y2="262" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="296" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">later</text><rect x="30" y="432" width="840" height="64" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="472" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Two distinct stages: never conflate them into one event.</text>
</svg>