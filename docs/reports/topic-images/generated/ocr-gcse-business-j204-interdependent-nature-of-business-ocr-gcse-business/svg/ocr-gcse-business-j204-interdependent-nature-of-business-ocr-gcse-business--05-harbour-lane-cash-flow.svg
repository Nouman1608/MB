<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 749" width="900" height="749" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="749" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Harbour Lane Bakery: the cash squeeze</text>

<rect x="30" y="110" width="840" height="480" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bank balance: first three months of the new shop</text><line x1="130" y1="520" x2="850" y2="520" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">£0</text><line x1="130" y1="440" x2="850" y2="440" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">£2,500</text><line x1="130" y1="360" x2="850" y2="360" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">£5,000</text><line x1="130" y1="280" x2="850" y2="280" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">£7,500</text><line x1="130" y1="200" x2="850" y2="200" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">£10,000</text><rect x="170" y="264" width="120" height="256" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="254" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">£8,000</text><text x="230" y="546" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Opening</text><rect x="345" y="382.4" width="120" height="137.6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="405" y="372.4" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">£4,300</text><text x="405" y="546" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Month 1</text><text x="405" y="570" font-size="14" font-weight="600" fill="#b5602e" text-anchor="middle">7,500 − 11,200 = −3,700</text><rect x="520" y="404.8" width="120" height="115.2" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="580" y="394.8" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">£3,600</text><text x="580" y="546" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Month 2</text><text x="580" y="570" font-size="14" font-weight="600" fill="#b5602e" text-anchor="middle">8,400 − 9,100 = −700</text><rect x="695" y="385.6" width="120" height="134.4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="755" y="375.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">£4,200</text><text x="755" y="546" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Month 3</text><text x="755" y="570" font-size="14" font-weight="600" fill="#2e6b62" text-anchor="middle">9,600 − 9,000 = +600</text><text x="580" y="434.8" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">low point</text><line x1="130" y1="520" x2="850" y2="520" stroke="#1e2a44" stroke-width="2.5"/><text x="56" y="578" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Net cash flow = inflows − outflows; closing balance = opening balance + net cash flow.</text><rect x="30" y="610" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="650" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Little room for a surprise cost in month 2.</text><text x="56" y="677" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Training new staff before opening adds outflows before any inflows arrive. An overdraft</text><text x="56" y="700" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">would protect the thin balance.</text>
</svg>