<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The structure of a synoptic decision</text>

<circle cx="58" cy="148" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="155.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="96" y="110" width="500" height="76" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="116" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Objective</text><text x="116" y="168" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Growth, profit or survival?</text><line x1="58" y1="172" x2="58" y2="218" stroke="#1e2a44" stroke-width="3"/><circle cx="58" cy="240" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="247.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="96" y="202" width="500" height="76" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="234" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Marketing</text><text x="116" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Enough demand? At what price? How will customers find out?</text><line x1="58" y1="264" x2="58" y2="310" stroke="#1e2a44" stroke-width="3"/><circle cx="58" cy="332" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="339.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="96" y="294" width="500" height="76" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="116" y="326" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Operations</text><text x="116" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Capacity, process, suppliers and quality control?</text><line x1="58" y1="356" x2="58" y2="402" stroke="#1e2a44" stroke-width="3"/><circle cx="58" cy="424" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="431.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="96" y="386" width="500" height="76" rx="10" fill="#ffffff" stroke="#2b5a9a" stroke-width="2.5"/><text x="116" y="418" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Human resources</text><text x="116" y="444" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Enough staff with the right skills? Training?</text><line x1="58" y1="448" x2="58" y2="494" stroke="#1e2a44" stroke-width="3"/><circle cx="58" cy="516" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="523.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="96" y="478" width="500" height="76" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="116" y="510" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Finance</text><text x="116" y="536" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Affordable? How funded? What return?</text><line x1="58" y1="540" x2="58" y2="586" stroke="#1e2a44" stroke-width="3"/><circle cx="58" cy="608" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="615.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="96" y="570" width="500" height="76" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="602" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Risk and reward</text><text x="116" y="628" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What could go wrong, what is gained, can risk be reduced?</text><rect x="620" y="110" width="250" height="536" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Weakest link</text><rect x="660" y="176" width="170" height="80" rx="40" fill="#dce9e7" stroke="#2e6b62" stroke-width="5"/><text x="745" y="222" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Marketing plan</text><rect x="660" y="296" width="170" height="80" rx="40" fill="#ffffff" stroke="#b5602e" stroke-width="5" stroke-dasharray="14 8"/><text x="745" y="332" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Operations</text><text x="745" y="352" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">capacity</text><rect x="660" y="416" width="170" height="80" rx="40" fill="#ffffff" stroke="#b5602e" stroke-width="5" stroke-dasharray="14 8"/><text x="745" y="452" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Cash before</text><text x="745" y="472" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">customers pay</text><text x="640" y="560" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">A strong marketing plan</text><text x="640" y="581" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">can still fail if</text><text x="640" y="602" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">operations or cash cannot</text><text x="640" y="623" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">keep up.</text>
</svg>