<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 806" width="900" height="806" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="806" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Second shop or refit?</text>

<rect x="330" y="110" width="280" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="470" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Second shop</text><rect x="600" y="110" width="270" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Refit existing shop</text><rect x="30" y="196" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="239" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cost</text><text x="470" y="239" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">£60,000</text><text x="730" y="239" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">£20,000</text><rect x="30" y="276" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="319" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Profit a year</text><text x="470" y="319" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">£9,000 to £17,000</text><text x="730" y="319" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">£5,000</text><rect x="30" y="356" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="399" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ARR</text><text x="470" y="399" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">14,000 ÷ 60,000 = 23.3%</text><text x="730" y="399" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">5,000 ÷ 20,000 = 25%</text><rect x="30" y="436" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="479" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Total profit (4 years)</text><text x="470" y="479" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">£56,000</text><text x="730" y="479" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">£20,000</text><rect x="30" y="516" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="559" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Risk</text><text x="470" y="559" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">Higher</text><text x="730" y="559" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Lower</text><rect x="30" y="596" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="639" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Growth</text><text x="470" y="639" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Yes</text><text x="730" y="639" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">Limited</text><rect x="30" y="690" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="730" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Which is better depends on the owner’s objective and attitude to risk.</text><text x="56" y="757" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The refit wins on ARR and risk; the second shop wins on total profit and growth.</text>
</svg>