<text x="450" y="128" font-size="19" font-weight="700" fill="#4a5568" text-anchor="middle">Analyse: build chains that cross functions</text><rect x="30" y="150" width="150" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="105" y="180" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">Marketing</text><text x="105" y="226" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Promotion</text><text x="105" y="249" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">succeeds</text><line x1="182" y1="235" x2="198" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="200" y="150" width="150" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="275" y="180" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">Marketing</text><text x="275" y="226" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Demand rises</text><line x1="352" y1="235" x2="368" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="370" y="150" width="150" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="445" y="180" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Operations</text><text x="445" y="226" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Needs more</text><text x="445" y="249" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">stock</text><line x1="522" y1="235" x2="538" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="540" y="150" width="150" height="170" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="615" y="180" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">Finance</text><text x="615" y="226" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Must pay</text><text x="615" y="249" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">suppliers</text><text x="615" y="272" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">before</text><text x="615" y="295" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">customers pay</text><line x1="692" y1="235" x2="708" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="710" y="150" width="150" height="170" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="785" y="180" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">Finance</text><text x="785" y="226" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Cash falls</text><rect x="30" y="350" width="840" height="210" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="386" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Synoptic checklist</text><rect x="56" y="404" width="30" height="30" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><path d="M62,420 l7,7 l12,-14" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="100" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Underline the function in the question; name at least one other it affects</text><rect x="56" y="454" width="30" height="30" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><path d="M62,470 l7,7 l12,-14" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="100" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use figures from the case and say what each one means</text><rect x="56" y="504" width="30" height="30" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><path d="M62,520 l7,7 l12,-14" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="100" y="526" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Evaluate or recommend: weigh reward against risk and say what it depends on</text>
