<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 726" width="900" height="726" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="726" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Harbour Lane Bakery: average rate of return</text>

<rect x="30" y="110" width="540" height="480" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Forecast net profit from the new shop</text><line x1="120" y1="520" x2="545" y2="520" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">£0</text><line x1="120" y1="440" x2="545" y2="440" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">£5,000</text><line x1="120" y1="360" x2="545" y2="360" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">£10,000</text><line x1="120" y1="280" x2="545" y2="280" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">£15,000</text><line x1="120" y1="200" x2="545" y2="200" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">£20,000</text><rect x="150" y="376" width="70" height="144" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="366" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">£9,000</text><text x="185" y="546" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Year 1</text><rect x="250" y="296" width="70" height="224" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="285" y="286" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">£14,000</text><text x="285" y="546" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Year 2</text><rect x="350" y="264" width="70" height="256" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="385" y="254" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">£16,000</text><text x="385" y="546" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Year 3</text><rect x="450" y="248" width="70" height="272" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="485" y="238" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">£17,000</text><text x="485" y="546" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Year 4</text><line x1="120" y1="296" x2="545" y2="296" stroke="#b5602e" stroke-width="3" stroke-dasharray="10 6"/><text x="128" y="286" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">average £14,000</text><line x1="120" y1="520" x2="545" y2="520" stroke="#1e2a44" stroke-width="2.5"/><rect x="590" y="110" width="280" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="142" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Total profit</text><text x="608" y="170" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">9,000 + 14,000 + 16,000</text><text x="608" y="195" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ 17,000 = £56,000</text><rect x="590" y="250" width="280" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="282" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Average annual profit</text><text x="608" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">56,000 ÷ 4 = £14,000</text><rect x="590" y="365" width="280" height="125" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="608" y="397" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">ARR</text><text x="608" y="425" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">14,000 ÷ 60,000 × 100</text><text x="608" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">= 23.3%</text><rect x="590" y="505" width="280" height="85" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="537" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Cost of fitting out</text><text x="608" y="565" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">£60,000</text><rect x="30" y="610" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="650" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">23.3% looks attractive, but it rests on forecasts.</text><text x="56" y="677" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Say what the figure means for the decision, not just the number.</text>
</svg>