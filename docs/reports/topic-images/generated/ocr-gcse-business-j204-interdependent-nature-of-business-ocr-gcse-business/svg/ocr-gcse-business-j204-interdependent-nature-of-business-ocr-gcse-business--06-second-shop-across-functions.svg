<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 916" width="900" height="916" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="916" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One decision, four functions</text>

<circle cx="450" cy="400" r="92" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="396" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Second</text><text x="450" y="426" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">shop?</text><rect x="30" y="110" width="340" height="190" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="150" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Finance</text><text x="48" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ARR 23.3% rests on forecasts;</text><text x="48" y="207" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">balance falls to £3,600 in month 2</text><line x1="370" y1="300" x2="384" y2="334" stroke="#b5602e" stroke-width="3"/><rect x="530" y="110" width="340" height="190" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="548" y="150" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Marketing</text><text x="548" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Must sell 2,572 items a month to</text><text x="548" y="207" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">break even, about 86 a day; opening</text><text x="548" y="230" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">offers cost money</text><line x1="530" y1="300" x2="516" y2="334" stroke="#8a6d0d" stroke-width="3"/><rect x="30" y="500" width="340" height="190" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="540" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Operations</text><text x="48" y="574" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Can the ovens supply two shops?</text><text x="48" y="597" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Quality must match across both</text><text x="48" y="620" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sites</text><line x1="370" y1="500" x2="384" y2="466" stroke="#2e6b62" stroke-width="3"/><rect x="530" y="500" width="340" height="190" rx="12" fill="#ffffff" stroke="#2b5a9a" stroke-width="2.5"/><text x="548" y="540" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="start">Human resources</text><text x="548" y="574" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Recruit and train staff before</text><text x="548" y="597" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">opening: outflows before inflows</text><line x1="530" y1="500" x2="516" y2="466" stroke="#2b5a9a" stroke-width="3"/><rect x="30" y="710" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="744" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Break-even: 3,600 ÷ (2.50 − 1.10) = 3,600 ÷ 1.40 = 2,571.4, so 2,572 items</text><text x="56" y="768" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Round up: 2,571 items would leave a small loss.</text><rect x="30" y="800" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="840" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement: open if research confirms demand well over 2,572 items a month,</text><text x="56" y="867" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and arrange an overdraft to protect the thin cash balance in the first two months.</text>
</svg>