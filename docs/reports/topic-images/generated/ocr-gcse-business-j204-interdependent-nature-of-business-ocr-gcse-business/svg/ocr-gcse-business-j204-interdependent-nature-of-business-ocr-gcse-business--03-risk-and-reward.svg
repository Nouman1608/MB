<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 799" width="900" height="799" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="799" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Risk and reward across the business</text>

<rect x="30" y="110" width="400" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="80" y1="400" x2="80" y2="150" stroke="#1e2a44" stroke-width="3"/><line x1="80" y1="400" x2="400" y2="400" stroke="#1e2a44" stroke-width="3"/><text x="70" y="160" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Reward</text><text x="400" y="428" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Risk</text><line x1="100" y1="380" x2="380" y2="170" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="410" y="340" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="end">higher reward usually</text><text x="410" y="360" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="end">means higher risk</text><rect x="450" y="110" width="420" height="330" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Risk exists in every function</text><rect x="470" y="166" width="380" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="486" y="200" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Marketing</text><text x="834" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Demand lower than forecast</text><rect x="470" y="232" width="380" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="486" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Operations</text><text x="834" y="266" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Equipment fails</text><rect x="470" y="298" width="380" height="54" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="486" y="332" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Finance</text><text x="834" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Costs rise or cash runs short</text><rect x="470" y="364" width="380" height="54" rx="10" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><text x="486" y="398" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Human resources</text><text x="834" y="398" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Key staff leave</text><rect x="30" y="460" width="840" height="180" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="496" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Reduce risk by</text><rect x="56" y="512" width="252" height="48" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="182" y="542" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Researching the market</text><rect x="328" y="512" width="252" height="48" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="454" y="542" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Testing on a small scale</text><rect x="600" y="512" width="252" height="48" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="726" y="542" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Keeping a cash reserve</text><rect x="56" y="572" width="252" height="48" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="182" y="602" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Using several suppliers</text><rect x="328" y="572" width="252" height="48" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="454" y="602" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Training staff</text><rect x="600" y="572" width="252" height="48" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="726" y="602" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Cash flow forecasts</text><rect x="30" y="660" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="700" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How much risk is acceptable depends on the business.</text><text x="56" y="727" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A start-up with little cash can survive fewer mistakes than an established business with</text><text x="56" y="750" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reserves.</text>
</svg>