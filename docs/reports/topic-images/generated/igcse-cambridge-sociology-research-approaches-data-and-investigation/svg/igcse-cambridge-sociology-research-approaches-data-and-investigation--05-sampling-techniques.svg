<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 970" width="900" height="970" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="970" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five ways to pick a sample</text>

<rect x="30" y="110" width="840" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="144.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sampling frame = the list. Technique = how people are picked from it.</text><text x="450" y="172.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. a school register or electoral roll is a sampling frame. Do not confuse the two.</text><rect x="30" y="220" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="252" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Random</text><text x="50" y="274" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Everyone has an equal chance</text><text x="50" y="297" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">+ avoids researcher bias</text><text x="50" y="317" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">− may miss small groups</text><circle cx="400" cy="254" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="444" cy="254" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="488" cy="254" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="532" cy="254" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="576" cy="254" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="620" cy="254" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="664" cy="254" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="708" cy="254" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="752" cy="254" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="796" cy="254" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="400" cy="294" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="444" cy="294" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="488" cy="294" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="532" cy="294" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="576" cy="294" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="620" cy="294" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="664" cy="294" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="708" cy="294" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="752" cy="294" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="796" cy="294" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="598" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">picked by chance</text><rect x="30" y="360" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="392" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Systematic</text><text x="50" y="414" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Every nth name on the list</text><text x="50" y="437" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">+ simple</text><text x="50" y="457" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">− hidden patterns in the list</text><circle cx="400" cy="394" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="444" cy="394" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="488" cy="394" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="532" cy="394" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="576" cy="394" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="620" cy="394" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="664" cy="394" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="708" cy="394" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="752" cy="394" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="796" cy="394" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="400" cy="434" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="444" cy="434" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="488" cy="434" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="532" cy="434" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="576" cy="434" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="620" cy="434" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="664" cy="434" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="708" cy="434" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="752" cy="434" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="796" cy="434" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><text x="598" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">every 4th</text><rect x="30" y="500" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="532" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Stratified</text><text x="50" y="554" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Divide by key characteristics, then</text><text x="50" y="573" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sample in proportion</text><text x="50" y="596" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">+ representative</text><text x="50" y="616" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">− needs a detailed frame</text><circle cx="400" cy="534" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="444" cy="534" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="488" cy="534" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="532" cy="534" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="576" cy="534" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="620" cy="534" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="664" cy="534" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="708" cy="534" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="752" cy="534" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="796" cy="534" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="400" cy="574" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="444" cy="574" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="488" cy="574" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="532" cy="574" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="576" cy="574" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="620" cy="574" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="664" cy="574" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="708" cy="574" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="752" cy="574" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="796" cy="574" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="598" y="620" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">same 3 : 2 mix as the population</text><rect x="30" y="640" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="672" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Snowball</text><text x="50" y="694" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Participants recruit others</text><text x="50" y="717" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">+ reaches hidden groups</text><text x="50" y="737" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">− unrepresentative</text><circle cx="400" cy="674" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="444" cy="674" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="488" cy="674" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="532" cy="674" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="576" cy="674" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="620" cy="674" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="664" cy="674" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="708" cy="674" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="752" cy="674" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="796" cy="674" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="400" cy="714" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="444" cy="714" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="488" cy="714" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="532" cy="714" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="576" cy="714" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="620" cy="714" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="664" cy="714" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="708" cy="714" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="752" cy="714" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="796" cy="714" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><line x1="458.5658636394017" y1="680.6208471088189" x2="515.6134034056731" y2="706.5515470025787" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="546.5658636394016" y1="707.3791528911811" x2="603.6134034056731" y2="681.4484529974213" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="634.5658636394016" y1="680.6208471088189" x2="691.6134034056731" y2="706.5515470025787" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="722.5658636394016" y1="707.3791528911811" x2="779.6134034056731" y2="681.4484529974213" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="598" y="760" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">each person recruits the next</text><rect x="30" y="780" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="812" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Quota</text><text x="50" y="834" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Interviewer fills set numbers of each</text><text x="50" y="853" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">type</text><text x="50" y="876" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">+ quick</text><text x="50" y="896" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">− interviewer chooses who: bias</text><circle cx="400" cy="814" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="444" cy="814" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="488" cy="814" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="532" cy="814" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="576" cy="814" r="14" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="620" cy="814" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="664" cy="814" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="708" cy="814" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="752" cy="814" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="796" cy="814" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="400" cy="854" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="444" cy="854" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="488" cy="854" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="532" cy="854" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="576" cy="854" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="620" cy="854" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="664" cy="854" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="708" cy="854" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><circle cx="752" cy="854" r="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="796" cy="854" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="598" y="900" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">quota filled with the first people found</text><circle cx="300" cy="936" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><circle cx="326" cy="936" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="346" y="942" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chosen for the sample (two groups shown by colour)</text>
</svg>