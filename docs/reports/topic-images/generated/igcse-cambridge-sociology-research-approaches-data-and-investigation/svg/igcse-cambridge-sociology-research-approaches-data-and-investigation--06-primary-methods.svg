<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 666" width="900" height="666" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="666" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Primary methods and their types</text>

<rect x="30" y="110" width="410" height="256" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SURVEYS AND QUESTIONNAIRES</text><text x="50" y="169.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Types of question</text><text x="50" y="197.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="197.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Open</text><text x="50" y="223.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Closed</text><text x="50" y="249.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Multiple choice</text><text x="50" y="275.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Scaled (“strongly agree” to “strongly</text><text x="65.2" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">disagree”)</text><rect x="460" y="110" width="410" height="256" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INTERVIEWS</text><text x="480" y="168" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">From fixed to free</text><line x1="500" y1="220" x2="830" y2="220" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)" marker-start="url(#ah)"/><circle cx="510" cy="220" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="510" y="253" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Structured</text><text x="510" y="273" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fixed questions</text><circle cx="665" cy="220" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="253" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Semi-</text><text x="665" y="273" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">structured</text><circle cx="820" cy="220" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="820" y="253" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Unstructured</text><text x="820" y="273" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">conversational</text><text x="480" y="302" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">+ group interviews</text><text x="480" y="324" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Venkatesh, Gang Leader for a Day (2008):</text><text x="480" y="343" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">depth from conversation and observation</text><rect x="30" y="386" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="419" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OBSERVATIONS</text><text x="50" y="444" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two choices: take part or not? Open or hidden?</text><text x="435" y="480" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Overt (people know)</text><text x="705" y="480" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Covert (hidden)</text><text x="286" y="534" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Participant</text><text x="286" y="604" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Non-participant</text><rect x="300" y="494" width="262" height="62" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="431" y="532" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">joins in openly</text><rect x="570" y="494" width="262" height="62" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="701" y="532" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">joins in secretly</text><rect x="300" y="564" width="262" height="62" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="431" y="602" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">watches openly</text><rect x="570" y="564" width="262" height="62" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="701" y="602" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">watches unseen</text>
</svg>