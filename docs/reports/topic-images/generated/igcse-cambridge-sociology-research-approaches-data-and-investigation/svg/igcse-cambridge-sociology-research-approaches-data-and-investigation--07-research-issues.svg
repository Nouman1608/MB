<rect width="900" height="476" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What affects research choices?</text>

<rect x="30" y="104" width="269.3333333333333" height="237" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEORETICAL</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Researcher</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">perspective</text><text x="50" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Positivist or</text><text x="50" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interpretivist</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="237" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335.3333333333333" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PRACTICAL</text><text x="335.3333333333333" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Can it be done?</text><text x="335.3333333333333" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Access to the sample</text><text x="335.3333333333333" y="217.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Response rate</text><text x="335.3333333333333" y="243.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="243.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Funding and cost</text><text x="335.3333333333333" y="269.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Time</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="237" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="620.6666666666666" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ETHICAL</text><text x="620.6666666666666" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Is it right?</text><text x="620.6666666666666" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Informed consent</text><text x="620.6666666666666" y="217.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Privacy and</text><text x="635.8666666666667" y="238.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">confidentiality</text><text x="620.6666666666666" y="264.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="264.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Deception</text><text x="620.6666666666666" y="290.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prevention of harm</text><text x="620.6666666666666" y="316.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="316.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Legality</text><rect x="30" y="359" width="410" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="393.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Covert observation</text><text x="50" y="421.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Raises deception and consent issues</text><rect x="460" y="359" width="410" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="393.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Researching young people</text><text x="480" y="421.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Needs parental consent</text>
</svg>