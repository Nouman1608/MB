<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two ways to combine and extend research</text>

<rect x="30" y="110" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Triangulation</text><text x="55" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">More than one method cross-checks findings</text><rect x="70" y="210" width="330" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="243" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">STEP 1</text><text x="235" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Questionnaire</text><text x="235" y="298.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">many respondents</text><line x1="235" y1="310" x2="235" y2="342" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="70" y="350" width="330" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="383" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">STEP 2</text><text x="235" y="410" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interviews</text><text x="235" y="438.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">with some of those respondents</text><text x="485" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Longitudinal study</text><text x="485" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The same group studied repeatedly over time</text><line x1="490" y1="360" x2="850" y2="360" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="850" y="346" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">time</text><g opacity="1"><circle cx="518" cy="286" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="508" y="296" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="1"><circle cx="562" cy="286" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="552" y="296" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><circle cx="540" cy="360" r="7" fill="#1e2a44"/><g opacity="1"><circle cx="638" cy="275.8" r="10.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="625" y="288.8" width="26" height="28.6" rx="9.1" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="1"><circle cx="682" cy="275.8" r="10.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="669" y="288.8" width="26" height="28.6" rx="9.1" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><circle cx="660" cy="360" r="7" fill="#1e2a44"/><g opacity="1"><circle cx="758" cy="265.6" r="12.8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="742" y="281.6" width="32" height="35.2" rx="11.200000000000001" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><circle cx="780" cy="360" r="7" fill="#1e2a44"/><circle cx="802" cy="276" r="22" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="4 3"/><text x="802" y="242" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">attrition</text><text x="485" y="218" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">+ shows change and sequence</text><text x="485" y="396" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">− expensive; people drop out</text><text x="485" y="426" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">British birth cohort studies: people born in</text><text x="485" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">a single week (e.g. 1958, 1970), followed for life</text>
</svg>