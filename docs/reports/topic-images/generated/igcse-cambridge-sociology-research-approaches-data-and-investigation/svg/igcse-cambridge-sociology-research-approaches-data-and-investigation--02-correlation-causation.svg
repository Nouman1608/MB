<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Correlation is not causation</text>

<rect x="30" y="110" width="410" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Correlation</text><text x="235" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">two things vary together</text><rect x="50" y="220" width="140" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="120" y="260" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Poverty</text><rect x="280" y="220" width="140" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="350" y="253.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Low exam</text><text x="350" y="275.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">results</text><line x1="196" y1="255" x2="274" y2="255" stroke="#2e6b62" stroke-width="4" stroke-dasharray="8 6"/><text x="235" y="340" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">found together</text><rect x="460" y="110" width="410" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Causation</text><text x="665" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one produces the other</text><rect x="480" y="220" width="140" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="550" y="260" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Poverty</text><rect x="710" y="220" width="140" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="780" y="253.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Low exam</text><text x="780" y="275.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">results</text><line x1="626" y1="255" x2="704" y2="255" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="665" y="240" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">?</text><text x="665" y="340" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">not proved by correlation alone</text><rect x="30" y="390" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="423.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A correlation between poverty and low exam results does not on its own prove that poverty</text><text x="50" y="445.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">causes them.</text>
</svg>