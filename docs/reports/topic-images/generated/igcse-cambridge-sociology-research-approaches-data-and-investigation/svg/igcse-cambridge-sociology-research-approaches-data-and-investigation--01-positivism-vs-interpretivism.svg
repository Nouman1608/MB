<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two approaches to studying society</text>

<text x="195" y="126" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Positivist</text><text x="705" y="126" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Interpretivist</text><rect x="30" y="144" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Macro: social facts shape</text><text x="195" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">individuals</text><rect x="540" y="144" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Micro: built from interactions and</text><text x="705" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">meanings</text><rect x="378" y="159" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">View</text><line x1="360" y1="178" x2="378" y2="178" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="178" x2="540" y2="178" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="224" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="251.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Patterns, trends, causation and</text><text x="195" y="273.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">correlation</text><rect x="540" y="224" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="262.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Meanings and motivations in depth</text><rect x="378" y="239" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="264" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Aim</text><line x1="360" y1="258" x2="378" y2="258" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="258" x2="540" y2="258" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="304" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="331.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Scientific method: hypothesis,</text><text x="195" y="353.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">measurement, testing</text><rect x="540" y="304" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="331.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Verstehen: empathetic</text><text x="705" y="353.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">understanding (Weber)</text><rect x="378" y="319" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="344" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Model</text><line x1="360" y1="338" x2="378" y2="338" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="338" x2="540" y2="338" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="384" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="411.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Quantitative</text><rect x="540" y="384" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="411.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Qualitative</text><rect x="378" y="388" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="413" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Data</text><line x1="360" y1="407" x2="378" y2="407" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="407" x2="540" y2="407" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="442" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="469.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Objectivity and reliability</text><rect x="540" y="442" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="469.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Validity</text><rect x="378" y="446" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="471" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Values</text><line x1="360" y1="465" x2="378" y2="465" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="465" x2="540" y2="465" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="500" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="527.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Misses meaning; imposes the</text><text x="195" y="549.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">researcher’s categories</text><rect x="540" y="500" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="527.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Subjective; hard to repeat or</text><text x="705" y="549.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">generalise</text><rect x="378" y="515" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="540" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Weakness</text><line x1="360" y1="534" x2="378" y2="534" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="534" x2="540" y2="534" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="586" width="840" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="619" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CLASSIC POSITIVIST STUDY</text><text x="50" y="645.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Durkheim, Suicide (1897)</text><text x="50" y="673.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Compared official suicide rates across countries and religious groups; social integration and</text><text x="50" y="694.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">regulation explained the differences. Interpretivists reply that the statistics depend on how</text><text x="50" y="715.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">officials interpret deaths.</text>
</svg>