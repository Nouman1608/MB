<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structure: tracking the text as a sequence</text>

<rect x="60" y="100" width="150" height="478" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="78" y1="128" x2="192" y2="128" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="144" x2="192" y2="144" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="160" x2="150" y2="160" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="206" x2="192" y2="206" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="222" x2="192" y2="222" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="238" x2="150" y2="238" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="284" x2="192" y2="284" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="300" x2="192" y2="300" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="316" x2="150" y2="316" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="362" x2="192" y2="362" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="378" x2="192" y2="378" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="394" x2="150" y2="394" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="440" x2="150" y2="440" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="518" x2="192" y2="518" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="534" x2="192" y2="534" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="550" x2="150" y2="550" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><path d="M60,548 C20,548 20,140 56,140" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#ahO)"/><line x1="214" y1="144" x2="262" y2="144" stroke="#1e2a44" stroke-width="2.5"/><circle cx="214" cy="144" r="5" fill="#1e2a44"/><rect x="262" y="112" width="608" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="282" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Opening</text><text x="282" y="164" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what the reader is shown first, and why</text><line x1="214" y1="222" x2="262" y2="222" stroke="#1e2a44" stroke-width="2.5"/><circle cx="214" cy="222" r="5" fill="#1e2a44"/><rect x="262" y="190" width="608" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="282" y="218" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Shifts in focus</text><text x="282" y="242" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wide setting to a single detail; outside to inside; one character to another</text><line x1="214" y1="300" x2="262" y2="300" stroke="#1e2a44" stroke-width="2.5"/><circle cx="214" cy="300" r="5" fill="#1e2a44"/><rect x="262" y="268" width="608" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="282" y="296" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Time</text><text x="282" y="320" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">flashback, flash-forward, slowing pace at a key moment</text><line x1="214" y1="378" x2="262" y2="378" stroke="#1e2a44" stroke-width="2.5"/><circle cx="214" cy="378" r="5" fill="#1e2a44"/><rect x="262" y="346" width="608" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="282" y="374" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Repetition and patterning</text><text x="282" y="398" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a returning motif, or a cyclical shape</text><line x1="214" y1="456" x2="262" y2="456" stroke="#1e2a44" stroke-width="2.5"/><circle cx="214" cy="456" r="5" fill="#1e2a44"/><rect x="262" y="424" width="608" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="282" y="452" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paragraphing</text><text x="282" y="476" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a one-line paragraph after long ones: a pause or a turn</text><line x1="214" y1="534" x2="262" y2="534" stroke="#1e2a44" stroke-width="2.5"/><circle cx="214" cy="534" r="5" fill="#1e2a44"/><rect x="262" y="502" width="608" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="282" y="530" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ending</text><text x="282" y="554" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resolution, cliffhanger or an unanswered question</text><text x="450" y="622" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">Track the whole extract with words such as</text><rect x="168" y="638" width="180" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="258" y="660.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">initially</text><rect x="360" y="638" width="180" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="660.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">then shifts</text><rect x="552" y="638" width="180" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="642" y="660.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">by the end</text>
</svg>