<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: structure in the Ellis passage</text>

<rect x="320" y="100" width="260" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="132" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Doorway</text><text x="450" y="158" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Ellis listens</text><line x1="450" y1="183" x2="450" y2="205" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="208" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="240" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Outward</text><text x="450" y="266" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">sounds “below” and “above”: ordinary life all around the flat</text><line x1="450" y1="291" x2="450" y2="313" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="316" width="600" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="348" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Inward: zoom</text><text x="450" y="374" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the table and the absence of post: one concrete detail confirms</text><text x="450" y="396" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the unease</text><line x1="450" y1="421" x2="450" y2="443" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="220" y="446" width="460" height="102" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="478" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ending</text><text x="450" y="504" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">final separate paragraph withholds “she had</text><text x="450" y="526" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">gone” until the last clause</text><rect x="30" y="570" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="603.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The ending relates to the opening.</text><text x="450" y="632.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">The passage ends on a certainty that has been building since the second sentence.</text>
</svg>