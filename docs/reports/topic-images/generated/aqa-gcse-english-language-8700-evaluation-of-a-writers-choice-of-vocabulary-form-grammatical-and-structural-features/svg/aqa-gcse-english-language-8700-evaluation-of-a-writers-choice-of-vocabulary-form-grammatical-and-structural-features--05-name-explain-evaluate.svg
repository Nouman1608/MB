<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 838" width="900" height="838" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="838" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From naming a technique to evaluating it</text>

<rect x="30" y="100" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">ACCURATE BUT INERT</text><text x="50" y="159.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“The writer uses a verb.”</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">names a term, goes nowhere</text><path d="M60,212 L60,234 L94,234" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="100" y="238" width="770" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="120" y="271" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPLAIN AND ILLUSTRATE</text><text x="120" y="297.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“The verb ‘clawed’ gives the wind the violence of an animal.”</text><text x="120" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the term opens up an effect</text><path d="M130,350 L130,372 L164,372" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="170" y="376" width="700" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="190" y="409" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ANALYSE AND EVALUATE</text><text x="190" y="435.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it is the right choice at this moment, or how it shapes</text><text x="190" y="460.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">the response to the whole passage</text><text x="190" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">judges how well it works</text><text x="450" y="555" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluative phrases</text><rect x="289.5" y="571" width="321" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="593.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">particularly effective because</text><rect x="202.5" y="617" width="495" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="639.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">this is the turning point of the passage because</text><rect x="294.5" y="663" width="311" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="685.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">the impact is strengthened by</text><rect x="30" y="723" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="756.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Never name a technique you cannot explain, and never mislabel.</text><text x="48" y="785.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Calling a simile a metaphor weakens an otherwise sound point.</text>
</svg>