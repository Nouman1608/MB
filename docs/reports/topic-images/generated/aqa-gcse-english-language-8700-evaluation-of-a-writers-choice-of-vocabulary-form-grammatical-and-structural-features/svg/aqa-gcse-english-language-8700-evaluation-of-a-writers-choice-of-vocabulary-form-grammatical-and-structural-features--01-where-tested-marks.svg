<text x="234" y="130" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Paper 1, Question 2</text><rect x="250" y="106" width="192" height="38" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="454" y="132" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">8 marks</text><text x="250" y="172" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Analyse language in a short section</text><text x="234" y="222" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Paper 1, Question 3</text><rect x="250" y="198" width="192" height="38" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="454" y="224" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">8 marks</text><text x="250" y="264" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Analyse how the whole extract is structured</text><text x="234" y="314" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Paper 1, Question 4</text><rect x="250" y="290" width="480" height="38" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="742" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">20 marks</text><text x="250" y="356" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Evaluate, using language and structure as evidence</text><text x="234" y="406" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Paper 2, Question 3</text><rect x="250" y="382" width="288" height="38" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="550" y="408" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">12 marks</text><text x="250" y="448" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Analyse language in one non-fiction source</text><rect x="30" y="480" width="411" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="513" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AO2</text><text x="50" y="540" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Explain, comment on and analyse</text><text x="50" y="569.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">how writers use language and structure to</text><text x="50" y="591.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">achieve effects, using relevant subject</text><text x="50" y="613.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">terminology</text><rect x="459" y="480" width="411" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="513" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AO4</text><text x="479" y="540" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judge</text><text x="479" y="569.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">takes the step from explaining to</text><text x="479" y="591.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">evaluating</text>
