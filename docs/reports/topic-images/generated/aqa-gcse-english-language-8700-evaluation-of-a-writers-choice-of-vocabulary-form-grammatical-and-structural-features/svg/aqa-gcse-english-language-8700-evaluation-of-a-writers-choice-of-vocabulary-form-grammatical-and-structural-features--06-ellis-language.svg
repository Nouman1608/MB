<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 611" width="900" height="611" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: language in the Ellis passage</text>

<rect x="30" y="100" width="840" height="150" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="54" y="138" font-size="18" font-style="italic" fill="#1e2a44" xml:space="preserve"><tspan>The flat was quiet. </tspan><tspan font-weight="700" fill="#8a6d0d" font-style="normal">Too quiet.</tspan><tspan> Ellis stood in the doorway with his key still in the lock</tspan></text><text x="54" y="167" font-size="18" font-style="italic" fill="#1e2a44" xml:space="preserve"><tspan>and listened to the </tspan><tspan font-weight="700" fill="#2e6b62" font-style="normal">refrigerator hum its one low note</tspan><tspan>. Somewhere below, a car door</tspan></text><text x="54" y="196" font-size="18" font-style="italic" fill="#1e2a44" xml:space="preserve"><tspan>slammed; somewhere above, a child laughed and was hushed. On the table, where his</tspan></text><text x="54" y="225" font-size="18" font-style="italic" fill="#1e2a44" xml:space="preserve"><tspan>sister always left the post, there was nothing at all.</tspan></text><rect x="30" y="272" width="411" height="180" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="305" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ACCURATE TERM + EFFECT</text><text x="50" y="332" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Minor sentence “Too quiet”</text><text x="50" y="361.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Straight after the plain “The flat was</text><text x="50" y="383.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">quiet”, it turns a neutral observation</text><text x="50" y="405.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">into a warning, as if Ellis is correcting</text><text x="50" y="427.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">himself.</text><rect x="459" y="272" width="411" height="180" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="305" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPLAINS IMAGERY</text><text x="479" y="332" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Personified refrigerator</text><text x="479" y="361.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The only voice in the flat belongs to a</text><text x="479" y="383.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">machine, so the absence of human sound is</text><text x="479" y="405.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">made audible.</text><rect x="30" y="474" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="507.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluates impact</text><text x="48" y="536.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Particularly effective because the reader senses that something is wrong before Ellis</text><text x="48" y="558.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">admits it.”</text>
</svg>