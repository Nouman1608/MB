<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 669" width="900" height="669" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="669" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four areas of a writer’s choice</text>

<rect x="30" y="100" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="140" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Vocabulary</text><text x="54" y="168" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">single words</text><text x="300" y="138" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">word class, connotation, semantic field, register, imagery</text><rect x="30" y="206" width="840" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="246" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Grammar</text><text x="54" y="274" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">how words are arranged</text><text x="300" y="244" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sentence length, type and function, tense, pronouns, modal</text><text x="300" y="266" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">verbs, voice, word order</text><rect x="30" y="312" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="352" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Form</text><text x="54" y="380" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">the kind of text</text><text x="300" y="350" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">diary, letter, newspaper article, first-person narrative:</text><text x="300" y="372" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">their conventions</text><rect x="30" y="418" width="840" height="92" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="458" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><text x="54" y="486" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">the whole text as a sequence</text><text x="300" y="456" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">openings, shifts in focus, time, patterning, paragraphing,</text><text x="300" y="478" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">endings</text><rect x="30" y="532" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="565.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Language or structure?</text><text x="48" y="594.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A comment that could be made about a single sentence in isolation is usually a language</text><text x="48" y="616.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">point, not a structural one.</text>
</svg>