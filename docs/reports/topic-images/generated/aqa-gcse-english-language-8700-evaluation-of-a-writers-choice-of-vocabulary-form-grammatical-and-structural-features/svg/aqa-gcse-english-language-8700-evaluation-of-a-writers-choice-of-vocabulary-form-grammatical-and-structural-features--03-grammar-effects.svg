<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 649" width="900" height="649" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="649" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Grammar choices and their effects</text>

<rect x="30" y="100" width="250" height="47" fill="#1e2a44"/><text x="155" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Choice</text><rect x="280" y="100" width="590" height="47" fill="#1e2a44"/><text x="575" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Effect it can create</text><rect x="30" y="147" width="250" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="173.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Simple sentence after</text><text x="44" y="195.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">complex ones</text><rect x="280" y="147" width="590" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="184.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Isolates and emphasises an idea</text><rect x="30" y="217" width="250" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="243.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Long sentence of many</text><text x="44" y="265.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">clauses</text><rect x="280" y="217" width="590" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="254.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mimics breathlessness or a rush of thought</text><rect x="30" y="287" width="250" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="313.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Questions, commands,</text><text x="44" y="335.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">exclamations</text><rect x="280" y="287" width="590" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="324.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Change the reader’s role</text><rect x="30" y="357" width="250" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="394.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tense</text><rect x="280" y="357" width="590" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="383.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Present tense creates immediacy; a sudden shift can signal</text><text x="294" y="405.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">memory</text><rect x="30" y="427" width="250" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="453.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pronouns</text><rect x="280" y="427" width="590" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="453.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“we” builds community; “you” makes demands of the reader</text><rect x="30" y="475" width="250" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="501.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Modal verbs</text><rect x="280" y="475" width="590" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="501.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“must”, “should” sound certain; “might”, “could” sound tentative</text><rect x="30" y="523" width="250" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="549.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Passive voice</text><rect x="280" y="523" width="590" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="549.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“the window was broken” can hide who acted</text><rect x="30" y="571" width="250" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="597.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Word order</text><rect x="280" y="571" width="590" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="597.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A key word at the end of a sentence gains emphasis</text><rect x="30" y="100" width="840" height="519" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>