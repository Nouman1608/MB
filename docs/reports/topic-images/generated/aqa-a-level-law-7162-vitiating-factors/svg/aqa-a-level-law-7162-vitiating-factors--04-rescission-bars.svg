<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 671" width="900" height="671" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="671" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rescission and the four bars</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">An equitable, discretionary remedy for all three types</text>
<rect x="30" y="124" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="160" width="250" height="56" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="195" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Contract made</text><rect x="580" y="160" width="250" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Original positions</text><path d="M330,188 L570,188" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="450" y="178" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">rescission sets it aside</text><text x="450" y="282" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">RESCISSION IS LOST (BARRED) BY</text><rect x="30" y="296" width="412" height="100" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="326.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1 Affirmation</text><text x="46" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Long</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lloyd</tspan> (1958): kept using the lorry after</text><text x="46" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">finding faults</text><rect x="458" y="296" width="412" height="100" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="474" y="326.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2 Lapse of time</text><text x="474" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Leaf</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">International</tspan> <tspan font-style="italic">Galleries</tspan> (1950): five years</text><text x="474" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">after buying a “Constable”</text><rect x="30" y="408" width="412" height="100" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="438.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">3 Third-party rights</text><text x="46" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Act quickly: <tspan font-style="italic">Car</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Universal</tspan> <tspan font-style="italic">Finance</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Caldwell</tspan></text><text x="46" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1965), telling the police and the AA was enough</text><rect x="458" y="408" width="412" height="100" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="474" y="438.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">4 Restitution impossible</text><text x="474" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The parties cannot be put back in their original</text><text x="474" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">positions</text><rect x="30" y="530" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="564.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Damages instead: s2(2)</text><text x="450" y="593.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">For a non-fraudulent misrepresentation the court may refuse rescission and award damages where more</text><text x="450" y="614.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">equitable, for example a minor misrepresentation.</text>
</svg>