<rect width="900" height="548" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Economic duress: the elements</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">DSND Subsea v Petroleum Geo-Services (2000), Dyson J</text>
<rect x="30" y="124" width="257.3333333333333" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="158.66666666666666" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Pressure</text><text x="158.66666666666666" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Practical effect: compulsion,</text><text x="158.66666666666666" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">or no practical choice</text><line x1="293.3333333333333" y1="176.5" x2="315.3333333333333" y2="176.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="124" width="257.3333333333333" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Illegitimate</text><text x="450" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Not ordinary commercial</text><text x="450" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">bargaining</text><line x1="584.6666666666666" y1="176.5" x2="606.6666666666666" y2="176.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="124" width="257.3333333333333" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="741.3333333333333" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Significant cause</text><text x="741.3333333333333" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Induced the victim to enter</text><text x="741.3333333333333" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the contract</text><text x="450" y="267" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">WAS THERE A PRACTICAL CHOICE? PAO ON v LAU YIU LONG (1980)</text><rect x="30" y="281" width="201" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130.5" y="307.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Did the victim</text><text x="130.5" y="327.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">protest?</text><rect x="243" y="281" width="201" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.5" y="307.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Was an alternative</text><text x="343.5" y="327.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">course open?</text><rect x="456" y="281" width="201" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.5" y="317.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Independent advice?</text><rect x="669" y="281" width="201" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769.5" y="307.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Steps to avoid the</text><text x="769.5" y="327.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">contract after?</text><rect x="30" y="367" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="397" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REMEDY</text><text x="48" y="423.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Voidable: rescission</text><text x="48" y="451.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Return of money paid; the bars apply, especially</text><text x="48" y="472.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">affirmation. No separate damages for duress.</text><rect x="458" y="367" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="397" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LINK TO CONSIDERATION</text><text x="476" y="423.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Williams v Roffey (1991)</text><text x="476" y="451.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Practical benefit enforces a promise to pay more,</text><text x="476" y="472.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">provided there was no duress: duress is the</text><text x="476" y="493.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safeguard.</text>
</svg>