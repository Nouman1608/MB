<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 659" width="900" height="659" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="659" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three types of misrepresentation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Which type decides the damages</text>
<rect x="30" y="124" width="270" height="147" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FRAUDULENT</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Knowingly, without belief,</text><text x="46" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">or reckless</text><text x="46" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Derry</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Peek</tspan> (1889)</text><line x1="165" y1="275" x2="165" y2="307" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="311" width="270" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="339" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DAMAGES</text><text x="46" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tort of deceit: all direct losses,</text><text x="46" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foreseeable or not (<tspan font-style="italic">Doyle</tspan> <tspan font-style="italic">v</tspan></text><text x="46" y="412.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Olby</tspan>, 1969)</text><rect x="315" y="124" width="270" height="147" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="331" y="152" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">NEGLIGENT</text><text x="331" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No reasonable grounds to</text><text x="331" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">believe it true</text><text x="331" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Misrepresentation Act 1967</text><text x="331" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s2(1)</text><line x1="450" y1="275" x2="450" y2="307" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="311" width="270" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="331" y="339" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DAMAGES</text><text x="331" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Statutory: assessed as if</text><text x="331" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fraudulent (<tspan font-style="italic">Royscot</tspan> <tspan font-style="italic">Trust</tspan> <tspan font-style="italic">v</tspan></text><text x="331" y="412.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Rogerson</tspan>, 1991)</text><rect x="600" y="124" width="270" height="147" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="616" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INNOCENT</text><text x="616" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reasonable grounds for</text><text x="616" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the belief</text><text x="616" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Honest and careful</text><line x1="735" y1="275" x2="735" y2="307" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="311" width="270" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="339" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DAMAGES</text><text x="616" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">None as of right; damages</text><text x="616" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">instead of rescission under</text><text x="616" y="412.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s2(2)</text><rect x="30" y="455" width="840" height="172" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="485" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY s2(1) IS ATTRACTIVE: THE BURDEN OF PROOF</text><text x="48" y="511.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The maker must prove reasonable grounds; the claimant need not prove fraud or a duty of</text><text x="48" y="534.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">care</text><text x="48" y="562.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Howard</tspan> <tspan font-style="italic">Marine</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ogden</tspan> (1978): barge capacity given from memory of a register; the correct figure was in</text><text x="48" y="583.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the company’s own documents, so it was liable. <tspan font-style="italic">Hedley</tspan> <tspan font-style="italic">Byrne</tspan> (1964) is possible but usually less</text><text x="48" y="604.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">attractive.</text>
</svg>