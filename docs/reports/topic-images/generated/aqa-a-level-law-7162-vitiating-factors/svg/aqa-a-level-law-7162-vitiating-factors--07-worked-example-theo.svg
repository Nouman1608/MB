<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 583" width="900" height="583" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="583" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Theo buys Mel’s café</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Discovers the truth three weeks after taking over</text>
<rect x="30" y="124" width="412" height="175" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">“ABOUT £1,000 PROFIT A WEEK”</text><text x="48" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">True a year ago; now £300</text><text x="48" y="208.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not corrected: misrepresentation (<tspan font-style="italic">With</tspan> <tspan font-style="italic">v</tspan></text><text x="63.2" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">O’Flanagan</tspan>)</text><text x="48" y="255.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="255.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">At least negligent under s2(1): no reasonable</text><text x="63.2" y="276.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grounds to believe it still true</text><rect x="458" y="124" width="412" height="175" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="476" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">“PLANNING TO RENEW THE LEASE”</text><text x="476" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mel knows it is false</text><text x="476" y="208.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An intention not held misstates a present fact</text><text x="491.2" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Edgington</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Fitzmaurice</tspan>)</text><text x="476" y="255.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="255.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fraudulent (<tspan font-style="italic">Derry</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Peek</tspan>)</text><rect x="30" y="321" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="349" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDUCEMENT</text><text x="46" y="380.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Both material to buying a business; Theo relied on them.</text><rect x="30" y="423" width="840" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="453" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REMEDIES</text><text x="48" y="479.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rescission, plus damages on the fraud measure</text><text x="48" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Acted within three weeks: no lapse of time; must not affirm by continuing to trade. Damages in deceit or</text><text x="48" y="528.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">under s2(1) (<tspan font-style="italic">Royscot</tspan>).</text>
</svg>