<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" width="900" height="578" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="578" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Statement of fact, or not?</text>

<text x="450" y="116" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">WHEN SILENCE BECOMES A STATEMENT</text><rect x="30" y="130" width="270.6666666666667" height="121" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="160.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Half-truths</text><text x="46" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Dimmock</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hallett</tspan> (1866):</text><text x="46" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">farms “let”, but tenants had</text><text x="46" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">given notice</text><rect x="314.6666666666667" y="130" width="270.6666666666667" height="121" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="160.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Change of circumstances</text><text x="330.6666666666667" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">With</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">O’Flanagan</tspan> (1936):</text><text x="330.6666666666667" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">practice since collapsed; not</text><text x="330.6666666666667" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">corrected</text><rect x="599.3333333333334" y="130" width="270.6666666666667" height="121" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="160.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Utmost good faith</text><text x="615.3333333333334" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Such as insurance: a duty to</text><text x="615.3333333333334" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disclose</text><rect x="30" y="273" width="840" height="57" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="305.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Otherwise silence is not a misrepresentation: the buyer must ask.</text><text x="450" y="368" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">OPINION AND INTENTION</text><rect x="30" y="382" width="270.6666666666667" height="164" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="410" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OPINION: NOT FACT</text><text x="46" y="435.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Bisset v Wilkinson (1927)</text><text x="46" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2,000 sheep: an honest</text><text x="46" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">opinion; neither knew the land</text><text x="46" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was never used for sheep</text><rect x="314.6666666666667" y="382" width="270.6666666666667" height="164" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OPINION IMPLYING FACT</text><text x="330.6666666666667" y="435.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Smith v Land and House</text><text x="330.6666666666667" y="456.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(1884)</text><text x="330.6666666666667" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Superior knowledge: “most</text><text x="330.6666666666667" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">desirable” tenant who was in</text><text x="330.6666666666667" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">arrears</text><rect x="599.3333333333334" y="382" width="270.6666666666667" height="164" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTENTION NOT HELD</text><text x="615.3333333333334" y="435.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Edgington v Fitzmaurice</text><text x="615.3333333333334" y="456.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(1885)</text><text x="615.3333333333334" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“The state of a man’s mind is</text><text x="615.3333333333334" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as much a fact as the state of</text><text x="615.3333333333334" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">his digestion”</text>
</svg>