<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 821" width="900" height="821" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="821" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is there a misrepresentation?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each element can decide a problem question</text>
<line x1="60" y1="144" x2="60" y2="534" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A STATEMENT</text><text x="122" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Words or conduct</text><text x="122" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Silence only in exceptions: half-truths, changed circumstances, utmost good faith</text><circle cx="60" cy="177.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="186.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="241" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="271" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNTRUE, OF FACT</text><text x="122" y="297.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Not opinion, intention or law</text><text x="122" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unless superior knowledge, or an intention not actually held</text><circle cx="60" cy="294.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="303.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="358" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="388" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BEFORE OR AT THE TIME OF CONTRACTING</text><text x="122" y="414.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Made by one party to the other</text><circle cx="60" cy="397.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="406.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="447" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="477" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDUCEMENT</text><text x="122" y="503.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Material, and actually induced the contract</text><text x="122" y="531.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Need not be the only reason; must have played a real part (<tspan font-style="italic">JEB</tspan> <tspan font-style="italic">Fasteners</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Marks</tspan> <tspan font-style="italic">Bloom</tspan>, 1983)</text><circle cx="60" cy="500.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="509.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="576" width="412" height="103" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="604" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT INDUCED</text><text x="46" y="630.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Attwood v Small (1838)</text><text x="46" y="658.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Buyers relied on their own report on a mine</text><rect x="458" y="576" width="412" height="103" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="604" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STILL INDUCED</text><text x="474" y="630.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Redgrave v Hurd (1881)</text><text x="474" y="658.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Could have discovered the truth but did not</text><rect x="30" y="701" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="735.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Result if all are met</text><text x="450" y="764.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The contract is <tspan font-weight="700" fill="#1e2a44">voidable</tspan>: valid until the innocent party chooses to set it aside.</text>
</svg>