<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Economic duress in the cases</text>

<rect x="30" y="100" width="412" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURESS: NOT BINDING</text><text x="48" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Atlas Express v Kafco (1989)</text><text x="48" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Carrier threatened not to deliver to a major</text><text x="48" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">retailer unless paid more; no other carrier in time</text><rect x="458" y="100" width="412" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURESS: NOT BINDING</text><text x="476" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">B and S Contracts v Victor Green (1984)</text><text x="476" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Threat not to erect exhibition stands unless paid</text><text x="476" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">extra; no time to find others</text><rect x="30" y="242" width="412" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="272" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURESS, BUT AFFIRMED</text><text x="48" y="298.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Atlantic Baron (1979)</text><text x="48" y="326.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Buyers waited eight months after the pressure</text><text x="48" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ended before protesting: right to avoid lost</text><rect x="458" y="242" width="412" height="151" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="476" y="272" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LAWFUL ACT: NO DURESS</text><text x="476" y="298.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pakistan International Airline v Times</text><text x="476" y="321.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Travel (2021)</text><text x="476" y="349.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A lawful act is duress only in very narrow</text><text x="476" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">circumstances; none here</text><rect x="30" y="415" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> calling any commercial pressure economic duress. It must be illegitimate and leave no</text><text x="450" y="468.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">practical choice.</text>
</svg>