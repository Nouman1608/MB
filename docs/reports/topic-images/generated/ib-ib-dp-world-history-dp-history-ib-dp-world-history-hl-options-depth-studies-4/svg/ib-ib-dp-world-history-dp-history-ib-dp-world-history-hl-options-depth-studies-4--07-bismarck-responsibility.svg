<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two kinds of responsibility</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"To what extent was Bismarck responsible for the unification of Germany?"</text>
<polygon points="450,120 110,192 790,192" fill="none"/><rect x="130" y="124" width="640" height="136" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">BISMARCK'S DIPLOMACY: FORM AND TIMING</text><text x="450" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Isolated Austria (1866) and France (1870)</text><text x="450" y="213.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Unification under Prussian leadership and without liberal control,</text><text x="450" y="235.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">1864-1871</text><line x1="450" y1="312" x2="450" y2="270" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="470" y="300" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">made possible by</text><rect x="30" y="334" width="201" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130.5" y="373.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Zollverein</text><text x="130.5" y="401.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Prussia's economic</text><text x="130.5" y="421.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">leadership</text><rect x="243" y="334" width="201" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.5" y="362.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Industry and</text><text x="343.5" y="385.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">railways</text><text x="343.5" y="413" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Industrial and railway</text><text x="343.5" y="433" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">growth</text><rect x="456" y="334" width="201" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.5" y="383.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Army reforms</text><text x="556.5" y="411.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Of Roon and Moltke</text><rect x="669" y="334" width="201" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769.5" y="373.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">European balance</text><text x="769.5" y="401.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Russia and Britain stood</text><text x="769.5" y="421.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">aside</text><rect x="30" y="461" width="840" height="34" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="484" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">UNDERLYING CAUSES: predated or lay outside his control</text><rect x="30" y="517" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="551.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Thesis</text><text x="450" y="581.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Bismarck was responsible for the <tspan font-weight="700" fill="#1e2a44">form</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">timing</tspan> of unification; its <tspan font-weight="700" fill="#1e2a44">underlying</tspan> <tspan font-weight="700" fill="#1e2a44">causes</tspan> lay in</text><text x="450" y="603.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Prussian power and the European balance.</text>
</svg>