<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 771" width="900" height="771" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="771" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From reform to revolution, 1789-1792</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Gold: steps that radicalized the Revolution</text>
<line x1="170" y1="134" x2="170" y2="729" stroke="#1e2a44" stroke-width="4"/><rect x="204" y="124" width="666" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="217" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">National Assembly; Tennis Court Oath</text><text x="217" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Third Estate claims sovereignty</text><line x1="170" y1="158.5" x2="204" y2="158.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="158.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="164.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">17-20 Jun 1789</text><rect x="204" y="202" width="666" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="217" y="229.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fall of the Bastille</text><text x="217" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Popular intervention protects the Assembly</text><line x1="170" y1="236.5" x2="204" y2="236.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="236.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="242.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">14 Jul 1789</text><rect x="204" y="280" width="666" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="217" y="307.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">August Decrees abolish feudal privileges</text><text x="217" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">End of the old social order in law</text><line x1="170" y1="314.5" x2="204" y2="314.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="314.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="320.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">4 Aug 1789</text><rect x="204" y="358" width="666" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="217" y="385.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Declaration of the Rights of Man and of the Citizen</text><text x="217" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Principles of the new order</text><line x1="170" y1="392.5" x2="204" y2="392.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="392.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="398.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">26 Aug 1789</text><rect x="204" y="436" width="666" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="217" y="463.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Civil Constitution of the Clergy</text><text x="217" y="487.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Divides the Church and the country</text><line x1="170" y1="470.5" x2="204" y2="470.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="470.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="476.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jul 1790</text><rect x="204" y="514" width="666" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="217" y="541.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Flight to Varennes</text><text x="217" y="565.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Destroys trust in the king</text><line x1="170" y1="548.5" x2="204" y2="548.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="548.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="554.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jun 1791</text><rect x="204" y="592" width="666" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="217" y="619.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">War with Austria</text><text x="217" y="643.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Radicalizes the Revolution</text><line x1="170" y1="626.5" x2="204" y2="626.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="626.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="632.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Apr 1792</text><rect x="204" y="670" width="666" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="217" y="697.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Monarchy abolished; Republic proclaimed</text><text x="217" y="721.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Louis executed in January 1793</text><line x1="170" y1="704.5" x2="204" y2="704.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="704.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="710.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Sep 1792</text>
</svg>