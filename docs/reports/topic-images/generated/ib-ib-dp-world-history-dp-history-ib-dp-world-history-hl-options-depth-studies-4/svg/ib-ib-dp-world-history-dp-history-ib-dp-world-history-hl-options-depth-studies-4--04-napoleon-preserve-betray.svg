0" fill="#8a6d0d" text-anchor="end">Collapse after the Peninsular War, Russia and Leipzig</text><rect x="30" y="230" width="410" height="174" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="265.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reform: preserved?</text><text x="50" y="295.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="295.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Concordat with the papacy (1801)</text><text x="50" y="323.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="323.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Civil Code (1804)</text><text x="50" y="351.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="351.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The prefects</text><text x="50" y="379.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="379.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The Bank of France</text><rect x="460" y="230" width="410" height="174" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="265.6" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Authoritarian rule: betrayed?</text><text x="480" y="295.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="295.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Censorship</text><text x="480" y="323.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="323.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Police</text><text x="480" y="351.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="351.6" font-size="17" font-w