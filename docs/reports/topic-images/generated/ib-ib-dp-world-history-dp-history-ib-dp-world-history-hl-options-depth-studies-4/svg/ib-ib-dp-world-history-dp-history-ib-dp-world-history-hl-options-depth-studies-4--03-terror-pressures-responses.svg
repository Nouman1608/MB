<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Terror, 1793-94</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Pressures, responses, and the question to weigh</text>
<rect x="30" y="124" width="269.3333333333333" height="52" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="164.66666666666666" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Foreign war</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="52" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Vendée rising</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="52" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="735.3333333333333" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic crisis</text><line x1="170" y1="180" x2="330" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="180" x2="450" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="730" y1="180" x2="570" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="180" y="250" width="540" height="90" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="285.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Committee of Public Safety</text><text x="450" y="315.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Dominated by Robespierre from July 1793</text><line x1="330" y1="344" x2="170" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="344" x2="450" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="344" x2="730" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="414" width="269.3333333333333" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164.66666666666666" y="444.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Levée en masse</text><text x="164.66666666666666" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">August 1793</text><rect x="315.3333333333333" y="414" width="269.3333333333333" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="458.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Price controls</text><rect x="600.6666666666666" y="414" width="269.3333333333333" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735.3333333333333" y="458.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Law of Suspects</text><rect x="30" y="516" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="548" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">9 THERMIDOR (27 JULY 1794)</text><text x="450" y="574.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Robespierre falls</text><rect x="30" y="622" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="656.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Response to circumstances or product of revolutionary ideology?</text><text x="450" y="686.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Historians divide; the best essays weigh both.</text>
