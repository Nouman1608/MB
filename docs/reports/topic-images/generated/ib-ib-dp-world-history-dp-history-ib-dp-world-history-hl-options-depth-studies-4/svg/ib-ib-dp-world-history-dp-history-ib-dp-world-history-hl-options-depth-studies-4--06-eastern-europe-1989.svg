<rect width="900" height="764" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why did Soviet control collapse in 1989?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">It survived earlier revolts, so explain what was different</text>
<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">SOVIET CONTROL SURVIVED</text><rect x="30" y="150" width="201" height="158" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="206" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUNE 1953</text><text x="44" y="232.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">East Germany</text><text x="44" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Revolt</text><rect x="243" y="150" width="201" height="158" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="257" y="176" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOV 1956</text><text x="257" y="202.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hungary</text><text x="257" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Nagy announces</text><text x="257" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">leaving the Warsaw</text><text x="257" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Pact; Soviet forces</text><text x="257" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">crush the revolution</text><rect x="456" y="150" width="201" height="158" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="470" y="186" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1956</text><text x="470" y="212.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Poland</text><text x="470" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gomułka's return:</text><text x="470" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">limited concessions, no</text><text x="470" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">invasion</text><rect x="669" y="150" width="201" height="158" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="683" y="196" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">20-21 AUG 1968</text><text x="683" y="222.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prague Spring</text><text x="683" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ended by Warsaw Pact</text><text x="683" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">invasion</text><text x="30" y="346" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">POLAND: THE BRIDGE</text><rect x="30" y="358" width="250.66666666666666" height="118" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="384" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AUG 1980</text><text x="44" y="410.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Solidarity</text><text x="44" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">From the Gdańsk shipyard</text><text x="44" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">strikes</text><line x1="286.66666666666663" y1="417" x2="318.66666666666663" y2="417" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="358" width="250.66666666666666" height="118" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="338.66666666666663" y="394" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEC 1981</text><text x="338.66666666666663" y="420.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Martial law</text><text x="338.66666666666663" y="448" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Imposed by Jaruzelski</text><line x1="581.3333333333333" y1="417" x2="613.3333333333333" y2="417" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="358" width="250.66666666666666" height="118" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="633.3333333333333" y="394" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUN 1989</text><text x="633.3333333333333" y="420.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Partly free elections</text><text x="633.3333333333333" y="448" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Solidarity-led government</text><text x="30" y="514" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1989: COLLAPSE</text><rect x="30" y="526" width="840" height="80" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="559.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Hungary opens its border with Austria · Berlin Wall opens (9 November) · Velvet Revolution in</text><text x="450" y="581.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Czechoslovakia · Ceaușescu executed (25 December)</text><text x="30" y="644" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">FACTORS TO WEIGH</text><rect x="94.18399999999997" y="656" width="280.496" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="234.43199999999996" y="676.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Gorbachev's refusal to use force</text><rect x="384.67999999999995" y="656" width="155.024" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="462.19199999999995" y="676.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">economic failure</text><rect x="549.704" y="656" width="59.552" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="579.4799999999999" y="676.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">debt</text><rect x="619.256" y="656" width="186.56" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="712.536" y="676.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the Church in Poland</text><rect x="273.824" y="696" width="352.352" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="450" y="716.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the example of each revolution to the next</text>
</svg>