<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 938" width="900" height="938" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="938" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Italian and German unification side by side</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Year by year, 1834-1871</text>
<text x="225" y="142" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">ITALY</text><text x="675" y="142" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">GERMANY</text><line x1="450" y1="158" x2="450" y2="906" stroke="#1e2a44" stroke-width="4"/><rect x="408" y="164" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="187" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1834</text><rect x="502" y="158" width="368" height="46" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="514" y="187" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Zollverein under Prussian leadership</text><rect x="408" y="218" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="241" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1848-49</text><rect x="30" y="212" width="368" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="42" y="241" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Revolutions fail; Piedmont keeps the Statuto</text><rect x="502" y="212" width="368" height="46" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="514" y="241" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Frankfurt Parliament; crown refused</text><rect x="408" y="272" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="295" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1852</text><rect x="30" y="266" width="368" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="42" y="295" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cavour prime minister of Piedmont</text><rect x="408" y="326" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="349" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1855</text><rect x="30" y="320" width="368" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="42" y="349" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Piedmont joins the Crimean War</text><rect x="408" y="380" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="403" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1858</text><rect x="30" y="374" width="368" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="42" y="403" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Plombières agreement with Napoleon III</text><rect x="408" y="434" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="457" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1859</text><rect x="30" y="428" width="368" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="42" y="457" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">War with Austria; Lombardy gained</text><rect x="408" y="488" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="511" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1860</text><rect x="30" y="482" width="368" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="42" y="502" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Central states join; Garibaldi takes Sicily and</text><text x="42" y="520" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Naples</text><rect x="408" y="542" width="84" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="565" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1861</text><rect x="30" y="536" width="368" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="42" y="565" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Kingdom of Italy proclaimed (March)</text><rect x="408" y="596" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="619" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1862</text><rect x="502" y="590" width="368" height="46" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="514" y="619" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Bismarck minister-president; "blood and iron"</text><rect x="408" y="650" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="673" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1864</text><rect x="502" y="644" width="368" height="46" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="514" y="673" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">War with Denmark over Schleswig-Holstein</text><rect x="408" y="704" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="727" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1866</text><rect x="30" y="698" width="368" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="42" y="727" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Venetia gained after Prussia defeats Austria</text><rect x="502" y="698" width="368" height="46" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="514" y="727" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Austro-Prussian War; Königgrätz</text><rect x="408" y="758" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="781" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1867</text><rect x="502" y="752" width="368" height="46" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="514" y="781" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">North German Confederation</text><rect x="408" y="812" width="84" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="835" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1870</text><rect x="30" y="806" width="368" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="42" y="835" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Rome taken after French troops withdraw</text><rect x="502" y="806" width="368" height="46" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="514" y="835" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Ems Telegram; Franco-Prussian War; Sedan</text><rect x="408" y="866" width="84" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="889" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1871</text><rect x="502" y="860" width="368" height="46" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="514" y="889" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">German Empire proclaimed, 18 January</text>
</svg>