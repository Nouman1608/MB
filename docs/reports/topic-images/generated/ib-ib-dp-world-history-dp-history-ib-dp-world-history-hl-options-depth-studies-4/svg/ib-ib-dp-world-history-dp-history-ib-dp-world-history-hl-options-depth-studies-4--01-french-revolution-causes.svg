<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Long-term causes of the French Revolution</text>

<line x1="320" y1="158" x2="409" y2="254.6" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="296" x2="409" y2="296" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="434" x2="409" y2="337.4" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="237.5" x2="491" y2="278.45" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="354.5" x2="491" y2="313.55" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="296" r="82" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="290.54" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Crisis</text><text x="450" y="316.16" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">of 1789</text><rect x="30" y="96" width="290" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="124" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FINANCE</text><text x="46" y="150.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Royal debt</text><text x="46" y="178.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Made worse by support for the</text><text x="46" y="199.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">American War of Independence</text><rect x="30" y="234" width="290" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="262" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FINANCE</text><text x="46" y="288.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unfair taxation</text><text x="46" y="316.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Much of the nobility and clergy</text><text x="46" y="337.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">exempt</text><rect x="30" y="372" width="290" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="400" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IDEAS</text><text x="46" y="426.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Enlightenment criticism</text><text x="46" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Of absolute monarchy and</text><text x="46" y="475.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">privilege</text><rect x="580" y="186" width="290" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="596" y="214" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOCIETY</text><text x="596" y="240.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The bourgeoisie</text><text x="596" y="268.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Growing wealth and frustration</text><rect x="580" y="303" width="290" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="331" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ECONOMY</text><text x="596" y="357.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bad harvests, 1788-89</text><text x="596" y="385.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">High bread prices</text><rect x="200" y="518" width="500" height="114" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="550" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5 MAY 1789</text><text x="450" y="577.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Estates-General meets</text><text x="450" y="607.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">First meeting since 1614</text>
</svg>