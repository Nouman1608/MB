<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Moving in a circle</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="430" height="510" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="250" cy="360" r="170" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="8 6"/><circle cx="250" cy="360" r="6" fill="#1e2a44"/><text x="250" y="388" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">centre</text><line x1="355.67369460601293" y1="226.83442536332782" x2="308.1205320333071" y2="286.7589339498303" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="355.67369460601293" y1="226.83442536332782" x2="293.00754183581427" y2="177.10562790167467" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><circle cx="355.67369460601293" cy="226.83442536332782" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="390.3070545346453" y1="455.989220477156" x2="327.1688799940549" y2="412.7940712624358" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="390.3070545346453" y1="455.989220477156" x2="435.47845240624815" y2="389.96237128438173" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><circle cx="390.3070545346453" cy="455.989220477156" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="124.64306835798827" y1="474.82874069369564" x2="181.05368759689355" y2="423.1558073815326" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="124.64306835798827" y1="474.82874069369564" x2="178.68012280208035" y2="533.8202379369952" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><circle cx="124.64306835798827" cy="474.82874069369564" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="600" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">force (towards the centre)</text><text x="300" y="600" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">velocity</text><rect x="470" y="110" width="400" height="510" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="150" width="370" height="100" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="500" y="188" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">mass, radius same</text><text x="500" y="222" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">larger force → larger speed</text><rect x="480" y="270" width="370" height="100" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="500" y="308" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">mass, speed same</text><text x="500" y="342" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">larger force → smaller radius</text><rect x="480" y="390" width="370" height="100" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="500" y="428" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">speed, radius same</text><text x="500" y="462" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">larger mass → needs larger force</text><text x="665" y="535" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Examples: string tension, tyre</text><text x="665" y="558" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">friction on a roundabout,</text><text x="665" y="581" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">gravity on a satellite</text>
</svg>