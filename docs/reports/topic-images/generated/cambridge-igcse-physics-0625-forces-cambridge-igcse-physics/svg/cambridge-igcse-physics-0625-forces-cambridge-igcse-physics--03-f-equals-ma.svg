<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Resultant force = mass × acceleration</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">1200 kg car speeding up</text><path d="M330,260 l0,-30 l40,0 l25,-28 l80,0 l30,28 l35,0 l0,30 z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="375" cy="260" r="16" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><circle cx="495" cy="260" r="16" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><line x1="560" y1="230" x2="720" y2="230" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="640" y="210" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">3000 N</text><line x1="320" y1="230" x2="260" y2="230" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="290" y="210" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">600 N</text><text x="60" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">resultant = 3000 − 600 = 2400 N forwards</text><text x="840" y="310" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">a = 2400 / 1200 = 2.0 m/s² forwards</text><line x1="600" y1="285" x2="680" y2="285" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="690" y="291" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">moving</text><rect x="30" y="345" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="383" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Braking</text><path d="M330,495 l0,-30 l40,0 l25,-28 l80,0 l30,28 l35,0 l0,30 z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="375" cy="495" r="16" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><circle cx="495" cy="495" r="16" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><line x1="320" y1="465" x2="100" y2="465" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="210" y="445" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">resultant 4800 N</text><text x="60" y="545" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">a = 4800 / 1200 = 4.0 m/s² backwards</text><text x="840" y="545" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">decelerating, still moving forwards</text><line x1="600" y1="520" x2="680" y2="520" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="690" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">moving</text>
</svg>