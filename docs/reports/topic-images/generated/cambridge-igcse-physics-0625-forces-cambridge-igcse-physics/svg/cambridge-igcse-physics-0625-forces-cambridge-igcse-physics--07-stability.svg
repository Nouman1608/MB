<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stability: where does the weight line fall?</text>

<rect x="30" y="110" width="410" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Short, wide: tips back</text><line x1="60" y1="520" x2="410" y2="520" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><polygon points="132.0614758428183,451.59597133486625 320,520 364.46261863233696,397.8399592978319 176.52409447515524,329.43593063269816" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="248.26204723757763" cy="424.7179653163491" r="7" fill="#b5602e"/><line x1="248.26204723757763" y1="424.7179653163491" x2="248.26204723757763" y2="494.7179653163491" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="248.26204723757763" y1="424.7179653163491" x2="248.26204723757763" y2="520" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 5"/><circle cx="320" cy="520" r="6" fill="#1e2a44"/><text x="60" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">line through centre of gravity</text><text x="60" y="592" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stays inside the base: weight's</text><text x="60" y="614" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">moment turns it back</text><rect x="460" y="110" width="410" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="150" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Tall, narrow: tips over</text><line x1="490" y1="520" x2="840" y2="520" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><polygon points="644.8245903371273,492.6383885339465 720,520 815.7656401311872,256.88606617994566 740.5902304683145,229.52445471389217" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="730.2951152341573" cy="374.762227356946" r="7" fill="#b5602e"/><line x1="730.2951152341573" y1="374.762227356946" x2="730.2951152341573" y2="444.762227356946" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="730.2951152341573" y1="374.762227356946" x2="730.2951152341573" y2="520" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 5"/><circle cx="720" cy="520" r="6" fill="#1e2a44"/><text x="490" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">line falls outside the base: weight's</text><text x="490" y="592" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">moment turns it further over</text><text x="450" y="92" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">Same tilt. Low centre of gravity and wide base = more stable.</text>
</svg>