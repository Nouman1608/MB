<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Resultant force along a line</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Tug of war</text><rect x="330" y="214" width="240" height="10" rx="0" fill="#c9a36b" stroke="#1e2a44" stroke-width="2"/><line x1="330" y1="219" x2="120" y2="219" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="225" y="200" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">850 N</text><line x1="570" y1="219" x2="760" y2="219" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="665" y="200" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">780 N</text><rect x="250" y="255" width="400" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="291.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">resultant = 850 − 780 = 70 N to the left</text><rect x="30" y="360" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="398" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Car at a steady 25 m/s on a straight road</text><path d="M340,520 l0,-30 l40,0 l25,-28 l80,0 l30,28 l35,0 l0,30 z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="385" cy="520" r="16" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><circle cx="505" cy="520" r="16" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><line x1="560" y1="490" x2="720" y2="490" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="640" y="470" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">driving force</text><line x1="330" y1="490" x2="170" y2="490" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="250" y="470" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">resistive forces</text><text x="450" y="585" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">equal and opposite: resultant zero, so constant velocity (not "not moving")</text>
</svg>