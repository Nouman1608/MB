<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="820" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Moment = force × perpendicular distance</text>

<rect x="30" y="110" width="840" height="335" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pushing a door (seen from above)</text><rect x="90" y="220" width="330" height="22" rx="3" fill="#d9b27a" stroke="#1e2a44" stroke-width="2.5"/><circle cx="90" cy="231" r="8" fill="#1e2a44"/><text x="76" y="237" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">hinge</text><line x1="410" y1="160" x2="410" y2="216" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="410" y="174" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle"></text><text x="420" y="180" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">15 N</text><line x1="90" y1="260" x2="410" y2="260" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="250" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0.80 m</text><text x="440" y="238" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">15 × 0.80 = 12 N m</text><rect x="90" y="350" width="330" height="22" rx="3" fill="#d9b27a" stroke="#1e2a44" stroke-width="2.5"/><circle cx="90" cy="361" r="8" fill="#1e2a44"/><text x="76" y="367" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">hinge</text><line x1="170" y1="290" x2="170" y2="346" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="170" y="304" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle"></text><text x="180" y="310" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">15 N</text><line x1="90" y1="390" x2="170" y2="390" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="130" y="420" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0.20 m</text><text x="440" y="368" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">15 × 0.20 = 3.0 N m</text><rect x="30" y="460" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="498" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Balancing a see-saw (principle of moments)</text><path d="M425,685 L450,635 L475,685 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><rect x="120" y="623" width="660" height="12" rx="3" fill="#d9b27a" stroke="#1e2a44" stroke-width="2.5"/><line x1="150" y1="555" x2="150" y2="619" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="150" y="573" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle"></text><text x="150" y="545" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">300 N</text><line x1="650" y1="555" x2="650" y2="619" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="650" y="573" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle"></text><text x="650" y="545" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">450 N</text><line x1="150" y1="659" x2="450" y2="659" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="300" y="687" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1.5 m</text><line x1="450" y1="659" x2="650" y2="659" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="550" y="687" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">d = 1.0 m</text><text x="450" y="768" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">anticlockwise 300 × 1.5 = 450 N m = clockwise 450 × d, so d = 1.0 m</text>
</svg>