<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="668" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the structured approach helps</text>

<rect x="30" y="146" width="250" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="155" y="186" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Modules with one job</text><rect x="30" y="326" width="250" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="155" y="366" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Documented interfaces</text><rect x="30" y="506" width="250" height="68" rx="14" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2.5"/><text x="155" y="546" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="middle">Local variables</text><rect x="440" y="120" width="430" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="458" y="150" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Easier to understand</text><text x="458" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">short modules; main program reads like an outline</text><path d="M282,180 C360,180 360,157 434,157" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="440" y="208" width="430" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="458" y="238" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Easier to test and debug</text><text x="458" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">test modules alone; trace an error to one module</text><path d="M282,180 C360,180 360,245 434,245" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="440" y="296" width="430" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="458" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Easier to maintain</text><text x="458" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">change one module; same interface, rest unaffected</text><path d="M282,360 C360,360 360,333 434,333" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="440" y="384" width="430" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="458" y="414" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reuse</text><text x="458" y="440" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">use a module again in this or other programs</text><path d="M282,360 C360,360 360,421 434,421" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="440" y="472" width="430" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="458" y="502" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Team development</text><text x="458" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">write different modules at the same time</text><path d="M282,180 C360,180 360,509 434,509" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M282,360 C360,360 360,509 434,509" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="440" y="560" width="430" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="458" y="590" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fewer side effects</text><text x="458" y="616" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">one module cannot change another’s data</text><path d="M282,540 C360,540 360,597 434,597" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/>
</svg>