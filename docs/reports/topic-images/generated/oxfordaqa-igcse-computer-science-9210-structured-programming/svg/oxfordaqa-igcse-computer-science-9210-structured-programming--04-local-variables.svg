<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Local variables keep modules independent</text>

<rect x="30" y="110" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two variables called total, no interference</text><rect x="54" y="170" width="360" height="186" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="74" y="200" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Main program</text><rect x="74" y="220" width="150" height="58" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="149" y="256" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">total</text><text x="74" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">its own variable</text><rect x="486" y="170" width="360" height="186" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="8 6"/><text x="506" y="200" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">SumArray(values)</text><rect x="506" y="220" width="150" height="58" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="581" y="256" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">total</text><rect x="676" y="220" width="90" height="58" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="721" y="256" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">i</text><text x="506" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">local: exist only while SumArray runs, then</text><text x="506" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">discarded</text><text x="450" y="268" font-size="34" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text><rect x="30" y="400" width="840" height="250" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="436" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Without locals: one program-wide counter i</text><rect x="54" y="460" width="300" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="74" y="490" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Subroutine A</text><text x="74" y="524" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">loop using i</text><text x="94" y="552" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">call B</text><rect x="546" y="460" width="300" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="566" y="490" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Subroutine B</text><text x="566" y="524" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">loop using i</text><text x="566" y="556" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">changes i</text><rect x="390" y="500" width="120" height="60" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="538" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">i</text><line x1="356" y1="530" x2="384" y2="530" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="544" y1="530" x2="516" y2="530" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="450" y="616" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">B breaks A’s loop: hard to find by reading either one alone</text>
</svg>