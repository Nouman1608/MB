<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Decomposing a library program</text>

<rect x="300" y="120" width="300" height="66" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="148" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Main program</text><text x="450" y="172" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">show a menu, call the option</text><path d="M450,186 L450,216 L175,216 L175,250" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="250" width="290" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="175" y="278" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">LoanBook(memberID, bookID)</text><text x="175" y="302" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">record a loan</text><path d="M450,186 L450,216 L470,216 L470,250" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="345" y="250" width="250" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="278" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">ReturnBook(bookID)</text><text x="470" y="302" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">record a return</text><path d="M450,186 L450,216 L745,216 L745,250" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="630" y="250" width="230" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="278" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">ShowOverdue()</text><text x="745" y="302" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">list overdue books</text><path d="M175,314 L175,334 L46,334 L46,488" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M46,400 L60,400" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="60" y="368" width="260" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="190" y="396" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">IsMemberValid(memberID)</text><text x="190" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">returns True/False</text><path d="M46,488 L60,488" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="60" y="456" width="260" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="190" y="484" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">IsBookAvailable(bookID)</text><text x="190" y="508" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">returns True/False</text><path d="M470,314 L470,334 L356,334 L356,488" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M356,400 L370,400" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="370" y="368" width="240" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="396" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">DaysLate(dueDate, today)</text><text x="490" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">returns an integer</text><path d="M356,488 L370,488" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="370" y="456" width="240" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="484" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Fine(daysLate)</text><text x="490" y="508" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">returns a real</text><rect x="640" y="370" width="220" height="100" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="658" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Each module is small</text><text x="658" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">enough to understand</text><text x="658" y="440" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">completely.</text>
</svg>