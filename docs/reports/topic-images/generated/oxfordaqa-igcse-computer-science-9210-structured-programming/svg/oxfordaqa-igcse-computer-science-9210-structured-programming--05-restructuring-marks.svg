<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: restructuring a program</text>

<rect x="30" y="110" width="330" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Before: one block</text><text x="46" y="184" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">total ← 0</text><text x="46" y="210" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">FOR i ← 1 TO 5</text><text x="64" y="236" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">OUTPUT "Enter mark"</text><text x="64" y="262" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">m ← STRING_TO_INT(USERINPUT)</text><text x="64" y="288" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">WHILE m &lt; 0 OR m > 100</text><text x="82" y="314" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">OUTPUT "Enter mark"</text><text x="82" y="340" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">m ← STRING_TO_INT(USERINPUT)</text><text x="64" y="366" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ENDWHILE</text><text x="64" y="392" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">total ← total + m</text><text x="46" y="418" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ENDFOR</text><text x="46" y="444" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">OUTPUT total / 5</text><text x="46" y="486" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">checking, adding and averaging all in one</text><text x="46" y="506" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">block</text><line x1="366" y1="320" x2="400" y2="320" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="410" y="110" width="460" height="420" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="434" y="146" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">After: main program reads as a plan</text><rect x="430" y="164" width="420" height="180" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="446" y="190" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">CONSTANT NumMarks ← 5</text><text x="446" y="216" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">sum ← 0</text><text x="446" y="242" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">FOR i ← 1 TO NumMarks</text><text x="464" y="268" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#d4b02e" text-anchor="start">sum ← sum + GetMark()</text><text x="446" y="294" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">ENDFOR</text><text x="446" y="320" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#d4b02e" text-anchor="start">OUTPUT Mean(sum, NumMarks)</text><rect x="430" y="364" width="200" height="130" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="446" y="394" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">GetMark()</text><text x="446" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">asks until 0 to 100;</text><text x="446" y="440" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">returns an integer; mark</text><text x="446" y="460" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">is local</text><rect x="650" y="364" width="200" height="130" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="666" y="394" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Mean(total, count)</text><text x="666" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">returns total / count</text><text x="666" y="440" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(real); count must be</text><text x="666" y="460" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">greater than 0</text><rect x="30" y="550" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="586" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Test GetMark on its own</text><rect x="300" y="570" width="120" height="50" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="360" y="603" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">−1</text><text x="360" y="644" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">asks again</text><rect x="440" y="570" width="120" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="500" y="603" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><text x="500" y="644" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">accepted</text><rect x="580" y="570" width="120" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640" y="603" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">100</text><text x="640" y="644" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">accepted</text><rect x="720" y="570" width="120" height="50" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="780" y="603" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">101</text><text x="780" y="644" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">asks again</text><text x="54" y="620" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and reuse it anywhere</text><text x="54" y="644" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a mark is needed</text>
</svg>