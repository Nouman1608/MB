<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The structured approach</text>

<rect x="250" y="140" width="400" height="290" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="450" y="176" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Module (subroutine)</text><text x="450" y="202" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one clearly defined task</text><rect x="290" y="226" width="320" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="8 6"/><text x="450" y="256" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Local variables</text><text x="310" y="284" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">exist only while it runs; no other part of</text><text x="310" y="304" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the program can see or change them</text><rect x="290" y="360" width="320" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="392" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Documented interface</text><line x1="70" y1="250" x2="244" y2="250" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="60" y="224" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Parameters</text><text x="60" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">data in</text><line x1="656" y1="250" x2="830" y2="250" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="840" y="224" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="end">Return value</text><text x="840" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">result out</text><rect x="30" y="470" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="506" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Main program: a short sequence of calls</text><rect x="70" y="532" width="220" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="567" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">call Module A</text><line x1="294" y1="560" x2="336" y2="560" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="340" y="532" width="220" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="567" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">call Module B</text><line x1="564" y1="560" x2="606" y2="560" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="532" width="220" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="720" y="567" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">call Module C</text>
</svg>