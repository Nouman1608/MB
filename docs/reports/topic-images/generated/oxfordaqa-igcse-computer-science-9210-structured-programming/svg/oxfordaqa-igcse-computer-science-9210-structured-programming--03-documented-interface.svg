<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A documented interface</text>

<rect x="30" y="110" width="840" height="194" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">-- Fine</text><text x="48" y="168" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">-- Calculates the fine for a book returned late.</text><text x="48" y="196" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">-- Parameter: daysLate (integer), number of days after the due date</text><text x="48" y="224" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">-- Returns: real, the fine in dollars (0.0 if not late)</text><text x="48" y="252" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">SUBROUTINE Fine(daysLate)</text><text x="67.2" y="280" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">…</text><text x="150" y="414" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">Fine(8)</text><line x1="230" y1="406" x2="320" y2="406" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="330" y="354" width="240" height="104" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="400" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Fine</text><text x="450" y="432" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">code not needed</text><line x1="580" y1="406" x2="670" y2="406" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="750" y="414" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="30" font-weight="700" fill="#8a6d0d" text-anchor="middle">2.0</text><text x="150" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">daysLate = 8</text><text x="750" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a real</text><rect x="30" y="490" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="526" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">A clear interface: all data in through parameters, all results out through the return value,</text><text x="54" y="554" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">not by reading or changing variables elsewhere in the program.</text>
</svg>