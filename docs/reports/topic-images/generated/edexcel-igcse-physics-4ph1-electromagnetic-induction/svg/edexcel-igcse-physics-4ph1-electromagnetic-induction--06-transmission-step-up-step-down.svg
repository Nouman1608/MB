<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the grid uses high voltage</text>

<rect x="30" y="140" width="140" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="100" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Power</text><text x="100" y="207" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">station</text><text x="100" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tens of kV</text><rect x="205" y="140" width="140" height="120" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="275" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Step-up</text><text x="275" y="207" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">transformer</text><text x="275" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">raises V</text><rect x="380" y="140" width="140" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Transmission</text><text x="450" y="207" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">lines</text><text x="450" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">hundreds of kV</text><rect x="555" y="140" width="140" height="120" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="625" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Step-down</text><text x="625" y="207" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">transformer</text><text x="625" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lowers V</text><rect x="730" y="140" width="140" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="800" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Homes</text><text x="800" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">safer voltage</text><line x1="173" y1="200" x2="202" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="348" y1="200" x2="377" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="523" y1="200" x2="552" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="698" y1="200" x2="727" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="290" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="326" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example 3 (illustrative): sending 100 MW</text><text x="55" y="380" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">at 25 kV:</text><text x="170" y="380" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">I = 100 000 000 / 25 000 = 4000 A</text><rect x="170" y="394" width="640" height="26" rx="4" fill="#b5602e" stroke="#1e2a44" stroke-width="0" /><text x="55" y="460" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">at 400 kV:</text><text x="170" y="460" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">I = 100 000 000 / 400 000 = 250 A</text><rect x="170" y="474" width="40" height="26" rx="4" fill="#2e6b62" stroke="#1e2a44" stroke-width="0" /><text x="225" y="493" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">sixteen times smaller (turns ratio 1 : 16)</text><text x="55" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bar length = current</text><rect x="30" y="570" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="612" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Higher voltage → lower current for the same power → less heating of cables → less energy wasted</text>
</svg>