<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Generating electricity by rotation</text>

<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A magnet rotating</text><text x="235" y="172" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">inside a coil</text><ellipse cx="155" cy="330" rx="8" ry="75" fill="none" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="168" cy="330" rx="8" ry="75" fill="none" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="181" cy="330" rx="8" ry="75" fill="none" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="194" cy="330" rx="8" ry="75" fill="none" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="207" cy="330" rx="8" ry="75" fill="none" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="220" cy="330" rx="8" ry="75" fill="none" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="233" cy="330" rx="8" ry="75" fill="none" stroke="#8a6d0d" stroke-width="3"/><ellipse cx="246" cy="330" rx="8" ry="75" fill="none" stroke="#8a6d0d" stroke-width="3"/><g transform="rotate(-30 200 330)"><rect x="140" y="315" width="60" height="30" rx="0" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5" /><rect x="200" y="315" width="60" height="30" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5" /><text x="170" y="337" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><text x="230" y="337" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">N</text></g><path d="M120,215 A95,95 0 0 1 260,210" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="190" y="202" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">rotates</text><polyline points="246,405 246,460 370,460 370,310 246,310" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="370" cy="385" r="19" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="370" y="392" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">V</text><text x="155" y="435" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">coil</text><text x="55" y="505" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Each pole sweeps past the coil, so the field</text><text x="55" y="525" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">keeps rising, falling and reversing. Bicycle</text><text x="55" y="545" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">dynamos and power stations.</text><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A coil rotating in a field</text><text x="665" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(seen end-on, axle at the dot)</text><rect x="498" y="200" width="34" height="100" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5" /><text x="515" y="257" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><rect x="798" y="200" width="34" height="100" rx="0" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5" /><text x="815" y="257" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><line x1="536" y1="215" x2="792" y2="215" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><line x1="536" y1="250" x2="792" y2="250" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><line x1="536" y1="285" x2="792" y2="285" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><line x1="605" y1="250" x2="725" y2="250" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round"/><circle cx="605" cy="250" r="9" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><circle cx="725" cy="250" r="9" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><line x1="605" y1="238" x2="605" y2="204" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="725" y1="262" x2="725" y2="296" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><circle cx="665" cy="250" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="665" y="330" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Coil horizontal: sides move at right</text><text x="665" y="350" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">angles to the field: MAXIMUM voltage</text><rect x="498" y="390" width="34" height="100" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5" /><text x="515" y="447" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><rect x="798" y="390" width="34" height="100" rx="0" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5" /><text x="815" y="447" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><line x1="536" y1="405" x2="792" y2="405" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><line x1="536" y1="440" x2="792" y2="440" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><line x1="536" y1="475" x2="792" y2="475" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/><line x1="665" y1="395" x2="665" y2="485" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round"/><circle cx="665" cy="395" r="9" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><circle cx="665" cy="485" r="9" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><line x1="677" y1="395" x2="715" y2="395" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="653" y1="485" x2="615" y2="485" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><circle cx="665" cy="440" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="665" y="520" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Coil vertical: sides move along</text><text x="665" y="540" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">the field: ZERO voltage (for an instant)</text>
</svg>