<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Inside a transformer</text>

<rect x="290" y="140" width="320" height="280" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" /><rect x="360" y="210" width="180" height="140" rx="2" fill="#f4f6f6" stroke="#1e2a44" stroke-width="3" /><line x1="296" y1="150" x2="354" y2="150" stroke="#9c8f6e" stroke-width="1.5" stroke-linecap="round"/><line x1="296" y1="196" x2="354" y2="196" stroke="#9c8f6e" stroke-width="1.5" stroke-linecap="round"/><line x1="296" y1="242" x2="354" y2="242" stroke="#9c8f6e" stroke-width="1.5" stroke-linecap="round"/><line x1="296" y1="288" x2="354" y2="288" stroke="#9c8f6e" stroke-width="1.5" stroke-linecap="round"/><line x1="296" y1="334" x2="354" y2="334" stroke="#9c8f6e" stroke-width="1.5" stroke-linecap="round"/><line x1="296" y1="380" x2="354" y2="380" stroke="#9c8f6e" stroke-width="1.5" stroke-linecap="round"/><ellipse cx="325" cy="225" rx="44" ry="7" fill="none" stroke="#2e6b62" stroke-width="3.5"/><ellipse cx="325" cy="247" rx="44" ry="7" fill="none" stroke="#2e6b62" stroke-width="3.5"/><ellipse cx="325" cy="269" rx="44" ry="7" fill="none" stroke="#2e6b62" stroke-width="3.5"/><ellipse cx="325" cy="291" rx="44" ry="7" fill="none" stroke="#2e6b62" stroke-width="3.5"/><ellipse cx="325" cy="313" rx="44" ry="7" fill="none" stroke="#2e6b62" stroke-width="3.5"/><ellipse cx="325" cy="335" rx="44" ry="7" fill="none" stroke="#2e6b62" stroke-width="3.5"/><ellipse cx="575" cy="200" rx="44" ry="7" fill="none" stroke="#8a6d0d" stroke-width="3.5"/><ellipse cx="575" cy="216" rx="44" ry="7" fill="none" stroke="#8a6d0d" stroke-width="3.5"/><ellipse cx="575" cy="232" rx="44" ry="7" fill="none" stroke="#8a6d0d" stroke-width="3.5"/><ellipse cx="575" cy="248" rx="44" ry="7" fill="none" stroke="#8a6d0d" stroke-width="3.5"/><ellipse cx="575" cy="264" rx="44" ry="7" fill="none" stroke="#8a6d0d" stroke-width="3.5"/><ellipse cx="575" cy="280" rx="44" ry="7" fill="none" stroke="#8a6d0d" stroke-width="3.5"/><ellipse cx="575" cy="296" rx="44" ry="7" fill="none" stroke="#8a6d0d" stroke-width="3.5"/><ellipse cx="575" cy="312" rx="44" ry="7" fill="none" stroke="#8a6d0d" stroke-width="3.5"/><ellipse cx="575" cy="328" rx="44" ry="7" fill="none" stroke="#8a6d0d" stroke-width="3.5"/><ellipse cx="575" cy="344" rx="44" ry="7" fill="none" stroke="#8a6d0d" stroke-width="3.5"/><ellipse cx="575" cy="360" rx="44" ry="7" fill="none" stroke="#8a6d0d" stroke-width="3.5"/><polyline points="281,225 200,225 200,260" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><polyline points="281,335 200,335 200,300" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="200" cy="280" r="20" fill="#f4f6f6" stroke="#1e2a44" stroke-width="3"/><path d="M189,280 q5.5,-11 11,0 q5.5,11 11,0" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><polyline points="619,200 700,200 700,262" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><polyline points="619,360 700,360 700,298" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><g transform="rotate(90 700 280)"><circle cx="700" cy="280" r="18" fill="#f4f6f6" stroke="#1e2a44" stroke-width="3"/><line x1="687.3" y1="267.3" x2="712.7" y2="292.7" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="687.3" y1="292.7" x2="712.7" y2="267.3" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/></g><text x="130" y="250" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a.c.</text><text x="130" y="272" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">supply</text><text x="770" y="285" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">load</text><text x="325" y="450" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">primary (input) coil</text><text x="575" y="450" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">secondary (output) coil</text><text x="450" y="132" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">soft iron core (laminated)</text><text x="450" y="285" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">changing</text><text x="450" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">magnetic field</text><rect x="30" y="480" width="410" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="518.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Step-up</text><text x="52" y="545.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More turns on the secondary than the</text><text x="52" y="567.59" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">primary: larger output voltage, smaller</text><text x="52" y="590.03" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">current.</text><rect x="460" y="480" width="410" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="518.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Step-down</text><text x="482" y="545.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer turns on the secondary: smaller</text><text x="482" y="567.59" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">output voltage, larger current.</text><rect x="30" y="650" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="690" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The coils are not electrically connected: the core carries the changing field.</text><text x="450" y="722" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">d.c. gives a steady field, which induces no voltage, so a transformer needs a.c.</text>
</svg>