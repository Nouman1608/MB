<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Transformer calculations</text>

<rect x="30" y="110" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="240" y="155" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Vp / Vs = Np / Ns</text><text x="660" y="155" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Vp × Ip = Vs × Is</text><rect x="30" y="200" width="410" height="243.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="241.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Example 1: secondary turns</text><text x="54" y="283.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Np = 2000, Vp = 230 V, Vs = 11.5 V</text><text x="54" y="325.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">230 / 11.5 = 2000 / Ns</text><text x="54" y="367.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Ns = 2000 × 11.5 / 230</text><text x="92" y="409.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">= 100 turns</text><rect x="460" y="200" width="410" height="243.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="241.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Example 2: primary current</text><text x="484" y="283.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Vp = 230 V, Vs = 12 V, Is = 2.0 A</text><text x="484" y="325.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">230 × Ip = 12 × 2.0 = 24 W</text><text x="484" y="367.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Ip = 24 / 230</text><text x="506" y="409.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">= 0.10 A (2 s.f.)</text><text x="450" y="470" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Check: the larger voltage is on the side with more turns.</text><text x="450" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Stepping voltage down steps current up by the same factor: power in = power out (100% efficient).</text>
</svg>