<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Moderator and control rods: opposite jobs</text>

<rect x="30" y="110" width="410" height="330" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Moderator</text><text x="235" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">graphite or water</text><circle cx="70" cy="240" r="10" fill="#9aa8c0" stroke="#1e2a44" stroke-width="2"/><line x1="84" y1="240" x2="150" y2="240" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="110" y="222" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">fast</text><path d="M160,240 l20,-18 l20,30 l20,-26 l20,22 l20,-14" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="300" cy="244" r="10" fill="#9aa8c0" stroke="#1e2a44" stroke-width="2"/><line x1="312" y1="244" x2="340" y2="244" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="315" y="222" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">slow</text><circle cx="385" cy="244" r="32" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="396.2606958551736" cy="247.5498168796748" r="8" fill="#9aa8c0" stroke="#1e2a44" stroke-width="1.5"/><circle cx="384.790071927165" cy="255.59715483791396" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="379.75602371356723" cy="230.58364752873356" r="8" fill="#9aa8c0" stroke="#1e2a44" stroke-width="1.5"/><circle cx="362.68825420286646" cy="246.0368297028845" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="389.65857528225547" cy="236.105901526548" r="8" fill="#9aa8c0" stroke="#1e2a44" stroke-width="1.5"/><circle cx="362.95179154050453" cy="250.44064376449424" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="378.406125352631" cy="227.05468945479" r="8" fill="#9aa8c0" stroke="#1e2a44" stroke-width="1.5"/><circle cx="380.3274493260357" cy="259.5525043568514" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><text x="55" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">SLOWS neutrons down, so they are more</text><text x="55" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">likely to be absorbed by U-235 and cause</text><text x="55" y="374" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fission.</text><text x="235" y="415" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">more fissions likely</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Control rods</text><text x="665" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">boron or cadmium</text><rect x="720" y="190" width="34" height="110" rx="3" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><circle cx="520" cy="240" r="10" fill="#9aa8c0" stroke="#1e2a44" stroke-width="2"/><line x1="534" y1="240" x2="712" y2="240" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="620" y="225" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">neutron absorbed</text><line x1="800" y1="290" x2="800" y2="210" stroke="#4a5568" stroke-width="3" marker-end="url(#ah)"/><line x1="830" y1="210" x2="830" y2="290" stroke="#4a5568" stroke-width="3" marker-end="url(#ah)"/><text x="815" y="318" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">raise / lower</text><text x="485" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ABSORB neutrons: lower them to slow the</text><text x="485" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reaction, raise them to speed it up,</text><text x="485" y="374" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fully in to shut down.</text><text x="665" y="415" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">fewer fissions happen</text><rect x="30" y="460" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="495" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shielding (thick steel and concrete)</text><text x="55" y="523" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">absorbs the radiation that escapes from the core, especially neutrons and gamma rays,</text><text x="55" y="547" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protecting workers and the environment.</text>
</svg>