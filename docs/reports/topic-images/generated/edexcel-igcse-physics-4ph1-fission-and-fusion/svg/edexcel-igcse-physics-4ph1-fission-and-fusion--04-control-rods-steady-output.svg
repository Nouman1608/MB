<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="400" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How control rods keep the power steady</text>

<rect x="30" y="115" width="260" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="149" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Rate of fission rises</text><line x1="292" y1="160" x2="318" y2="160" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="115" width="260" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="149" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Control rods lowered</text><text x="340" y="172" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">further into the core</text><line x1="582" y1="160" x2="608" y2="160" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="115" width="260" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="149" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">More neutrons absorbed:</text><text x="630" y="172" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">fewer fissions</text><line x1="740" y1="208" x2="740" y2="238" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="242" width="550" height="95" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="340" y="276" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Adjusted so on average ONE neutron from each fission</text><text x="340" y="299" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">causes another fission</text><line x1="318" y1="290" x2="292" y2="290" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="242" width="260" height="95" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="276" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Rate of fission and</text><text x="50" y="299" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">power output stay</text><text x="50" y="322" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">steady</text><text x="450" y="375" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Average of 1: steady.   More than 1: the number of fissions grows rapidly (1, 2 or 3, perhaps 9, 27 ...).</text>
</svg>