dth="40" height="26" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="83" y1="570" x2="117" y2="570" stroke="#2e6b62" stroke-width="2"/><line x1="83" y1="577" x2="117" y2="577" stroke="#2e6b62" stroke-width="2"/><line x1="83" y1="584" x2="117" y2="584" stroke="#2e6b62" stroke-width="2"/><rect x="150" y="564" width="40" height="26" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="153" y1="570" x2="187" y2="570" stroke="#2e6b62" stroke-width="2"/><line x1="153" y1="577" x2="187" y2="577" stroke="#2e6b62" stroke-width="2"/><line x1="153" y1="584" x2="187" y2="584" stroke="#2e6b62" stroke-width="2"/><rect x="220" y="564" width="40" height="26" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="223" y1="570" x2="257" y2="570" stroke="#2e6b62" stroke-width="2"/><line x1="223" y1="577" x2="257" y2="577" stroke="#2e6b62" stroke-width="2"/><line x1="223" y1="584" x2="257" y2="584" stroke="#2e6b62" stroke-width="2"/><rect x="40" y="590" width="500" height="50" fill="#cbbf9f"/><line x1="40" y1="590" x2="540" y2="590" stroke="#1e2a44" stroke-width="3"/><line x1="150" y1="620" x2="70" y2="620" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="350" y1="620" x2="430" y2="620" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="250" y="626" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">ground shaking</text><line x1="115" y1="197.5" x2="330" y2="134" stroke="#1e2a44" stroke-width="2"/><circle cx="115" cy="197.5" r="4" fill="#1e2a44"/><text x="336" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cross-bracing</text><text x="336" y="161" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">spreads energy so</text><text x="336" y="179" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the frame flexes</text><line x1="247" y1="312.5" x2="330" y2="244" stroke="#1e2a44" stroke-width="2"/><circle cx="247" cy="312.5" r="4" fill="#1e2a44"/><text x="336" y="250" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dampers</text><text x="336" y="271" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">absorb energy</text><line x1="280" y1="417" x2="330" y2="344" stroke="#1e2a44" stroke-width="2"/><circle cx="280" cy="417" r="4" fill="#1e2a44"/><text x="336" y="350" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Retrofitting</text><text x="336" y="371" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">e.g. wrapping</text><text x="336" y="389" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">concrete columns</text><line x1="240" y1="576" x2="330" y2="474" stroke="#1e2a44" stroke-width="2"/><circle cx="240" cy="576" r="4" fill="#1e2a44"/><text x="336" y="480" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Base isolation</text><text x="336" y="501" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">flexible bearings</text><text x="336" y="519" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">absorb movement</text><rect x="570" y="110" width="300" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="720" y="145" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Tsunami defences</text><text x="588" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sea walls block waves;</text><text x="588" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">towers give refuge where</text><text x="588" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">high ground is far away</text><rect x="600" y="340" width="250" height="40" fill="#b5d3cf"/><path d="M600,340 q20,-40 50,-30 q-14,8 -8,30 z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="740" y="250" width="70" height="130" fill="#fff