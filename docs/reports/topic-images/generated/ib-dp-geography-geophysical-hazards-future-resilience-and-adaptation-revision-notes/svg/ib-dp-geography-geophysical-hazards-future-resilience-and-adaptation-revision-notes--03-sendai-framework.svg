<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Sendai Framework 2015–2030</text>

<rect x="30" y="120" width="250" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155" y="152" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Hyogo Framework</text><text x="155" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(earlier)</text><line x1="282" y1="158" x2="330" y2="158" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="335" y="120" width="535" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="602" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sendai Framework 2015–2030</text><text x="602" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">adopted by UN member states in 2015; voluntary</text><rect x="30" y="225" width="200" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="130" cy="265" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="130" y="272.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="130" y="321" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Understanding</text><text x="130" y="347" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">disaster risk</text><rect x="242" y="225" width="200" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="342" cy="265" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="342" y="272.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="342" y="321" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Strengthening</text><text x="342" y="347" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">disaster risk</text><text x="342" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">governance</text><rect x="454" y="225" width="200" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="554" cy="265" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="554" y="272.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="554" y="321" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Investing in DRR</text><text x="554" y="347" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">for resilience</text><rect x="666" y="225" width="200" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="766" cy="265" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="766" y="272.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="766" y="321" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Enhancing</text><text x="766" y="343" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">preparedness</text><text x="766" y="367" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and "build back</text><text x="766" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">better"</text><text x="450" y="440" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The shift it asks for</text><line x1="60" y1="510" x2="840" y2="510" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="485" x2="450" y2="535" stroke="#b5602e" stroke-width="5"/><text x="450" y="560" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">disaster</text><rect x="60" y="575" width="370" height="64" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="245" y="602" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reduce risk before</text><text x="245" y="626" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">attention shifts here</text><rect x="470" y="575" width="370" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="655" y="602" font-size="19" font-weight="700" fill="#4a5568" text-anchor="middle">Manage the disaster after</text><text x="655" y="626" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the earlier focus</text><rect x="30" y="670" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="709" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Voluntary: progress depends on national action and funding.</text>
</svg>