<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Parametric insurance: paying out on a trigger</text>

<rect x="30" y="130" width="250" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="168" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="175.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="175" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Trigger</text><text x="52" y="218" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a measured value is reached,</text><text x="52" y="240" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. a given magnitude</text><text x="52" y="262" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">near a city</text><rect x="325" y="130" width="250" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="359" cy="168" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="359" y="175.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="391" y="175" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Automatic</text><text x="347" y="218" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the policy pays out</text><text x="347" y="240" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">automatically</text><rect x="620" y="130" width="250" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="654" cy="168" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="654" y="175.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="686" y="175" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Fast cash</text><text x="642" y="218" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">money for recovery</text><text x="642" y="240" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">arrives quickly</text><line x1="282" y1="215" x2="320" y2="215" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="577" y1="215" x2="615" y2="215" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="330" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="368" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pooling risk between governments</text><text x="60" y="394" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. the Caribbean Catastrophe Risk Insurance Facility</text><circle cx="450" cy="490" r="62" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="484" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">shared</text><text x="450" y="506" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">pool</text><circle cx="200" cy="470" r="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="200" y="476" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Gov A</text><line x1="235.8853500273005" y1="472.87082800218406" x2="384.21019161661576" y2="484.73681532932926" stroke="#1e2a44" stroke-width="3" stroke-dasharray="7 5"/><circle cx="300" cy="560" r="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="300" y="566" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Gov B</text><line x1="332.62259303982955" y1="544.7761232480796" x2="390.1919127603125" y2="517.9104407118542" stroke="#1e2a44" stroke-width="3" stroke-dasharray="7 5"/><circle cx="600" cy="560" r="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="600" y="566" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Gov C</text><line x1="567.3774069601704" y1="544.7761232480796" x2="509.8080872396875" y2="517.9104407118542" stroke="#1e2a44" stroke-width="3" stroke-dasharray="7 5"/><circle cx="700" cy="470" r="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="700" y="476" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Gov D</text><line x1="664.1146499726995" y1="472.87082800218406" x2="515.7898083833843" y2="484.73681532932926" stroke="#1e2a44" stroke-width="3" stroke-dasharray="7 5"/><text x="60" y="450" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">risk shared</text><text x="60" y="469" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">between</text><text x="60" y="488" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">governments</text><rect x="30" y="640" width="840" height="76" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="55" y="672" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Limits: insurance helps recovery but does not reduce physical damage,</text><text x="55" y="698" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">and it is often unaffordable for the poorest.</text>
</svg>