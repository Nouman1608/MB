<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Indian Ocean warnings and the last mile</text>

<text x="270" y="140" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Detection: much better since 2004</text><rect x="60" y="160" width="420" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="270" y="218" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Seismic sensors</text><line x1="270" y1="262" x2="270" y2="286" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="290" width="420" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="270" y="348" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sea-level gauges</text><line x1="270" y1="392" x2="270" y2="416" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="420" width="420" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="270" y="478" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">National warning centres</text><line x1="482" y1="470" x2="560" y2="470" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><rect x="565" y="200" width="305" height="360" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="3" stroke-dasharray="10 7"/><text x="717" y="240" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">The "last mile"</text><text x="717" y="275" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">warnings still have to</text><text x="717" y="298" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">reach remote coastal</text><text x="717" y="321" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">villages in time</text><text x="717" y="375" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">depends on</text><rect x="590" y="392" width="255" height="56" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="717" y="427" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">local communication</text><rect x="590" y="460" width="255" height="56" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="717" y="495" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">education</text><rect x="30" y="590" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="628" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2004: no regional warning system; the tsunami killed people</text><text x="55" y="656" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in many countries hours after the earthquake. A regional system was set up afterwards.</text>
</svg>