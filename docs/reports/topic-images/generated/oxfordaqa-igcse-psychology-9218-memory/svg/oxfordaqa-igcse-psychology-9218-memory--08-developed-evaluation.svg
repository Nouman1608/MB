<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a developed evaluation point</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Evaluate the working memory model</text>
<line x1="60" y1="144" x2="60" y2="431" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Name the evidence</text><text x="122" y="186.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"A strength of the model is support from dual processing tasks."</text><circle cx="60" cy="166.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="175.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="223" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="255.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the evidence</text><text x="122" y="285.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"Two tasks using the same component interfered with each other, but tasks using</text><text x="122" y="307.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">different components did not."</text><circle cx="60" cy="276.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="285.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="344" width="766" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="376.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Link it back to the model</text><text x="122" y="406.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"This supports the idea that short-term memory has separate parts rather than being one</text><text x="122" y="428.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">store."</text><circle cx="60" cy="397.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="406.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="473" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="507.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Name it, explain it, link it back: one comment becomes a developed evaluation.</text>
