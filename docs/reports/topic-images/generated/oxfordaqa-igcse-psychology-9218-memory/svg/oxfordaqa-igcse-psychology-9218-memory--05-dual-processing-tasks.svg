<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 619" width="900" height="619" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="619" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Baddeley and Hitch: dual processing tasks</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two tasks carried out at the same time</text>
<rect x="30" y="124" width="405" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="160" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">SAME COMPONENT</text><text x="54" y="188" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">e.g. two spoken tasks</text><rect x="54" y="214" width="110.544" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="109.27199999999999" y="234.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">verbal task</text><rect x="54" y="260" width="110.544" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="109.27199999999999" y="280.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">verbal task</text><text x="54" y="330" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both compete for <tspan font-weight="700">one</tspan> <tspan font-weight="700">component</tspan> with one</text><text x="54" y="352" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">limit</text><rect x="50" y="376" width="365" height="60" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="232.5" y="410.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Performance falls sharply</text><rect x="465" y="124" width="405" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="160" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DIFFERENT COMPONENTS</text><text x="489" y="188" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">e.g. verbal + visual</text><rect x="489" y="214" width="110.544" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="544.272" y="234.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">verbal task</text><rect x="489" y="260" width="107.68" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="542.84" y="280.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">visual task</text><text x="489" y="330" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each uses a <tspan font-weight="700">different</tspan> <tspan font-weight="700">component</tspan> with its</text><text x="489" y="352" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">own limit</text><rect x="485" y="376" width="365" height="60" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="667.5" y="410.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Both done almost as well</text><rect x="30" y="476" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="510.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="540.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hard to explain if short-term memory is one store; easy to explain if it has <tspan font-weight="700" fill="#1e2a44">separate</tspan> <tspan font-weight="700" fill="#1e2a44">parts</tspan> <tspan font-weight="700" fill="#1e2a44">with</tspan></text><text x="50" y="562.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">separate</tspan> <tspan font-weight="700" fill="#1e2a44">limits</tspan>.</text>
</svg>