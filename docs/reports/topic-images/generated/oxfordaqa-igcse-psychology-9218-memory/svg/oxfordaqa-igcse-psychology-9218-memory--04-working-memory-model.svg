<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 639" width="900" height="639" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="639" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The working memory model</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Baddeley and Hitch: an active workspace that replaces the short-term store</text>
<rect x="190" y="124" width="520" height="115" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="160.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Central executive</text><text x="210" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Coding:</tspan> modality-free, handles any kind of information</text><text x="210" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Capacity:</tspan> very limited; directs attention rather than storing</text><path d="M330,239 L164.66666666666666,305" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M450,239 L450,305" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M570,239 L735.3333333333333,305" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/><rect x="30" y="309" width="269.3333333333333" height="178" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="343.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Phonological loop</text><text x="50" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Coding:</tspan> acoustic</text><text x="50" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(sound-based)</text><text x="50" y="420.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Capacity:</tspan> about as much as</text><text x="50" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">you can say in roughly two</text><text x="50" y="462.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seconds</text><rect x="315.3333333333333" y="309" width="269.3333333333333" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="343.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Episodic buffer</text><text x="335.3333333333333" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Coding:</tspan> combines</text><text x="335.3333333333333" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">information from all</text><text x="335.3333333333333" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">components</text><text x="335.3333333333333" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Capacity:</tspan> limited; links to</text><text x="335.3333333333333" y="462.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">long-term memory</text><rect x="600.6666666666666" y="309" width="269.3333333333333" height="178" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="620.6666666666666" y="343.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Visuo-spatial sketchpad</text><text x="620.6666666666666" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Coding:</tspan> visual and spatial</text><text x="620.6666666666666" y="399.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Capacity:</tspan> a small number of</text><text x="620.6666666666666" y="420.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">objects or locations</text><path d="M450,491 L450,543" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/><rect x="240" y="547" width="420" height="60" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="581.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Long-term memory</text>
</svg>