<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 962" width="900" height="962" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="962" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bartlett's War of the Ghosts</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">English participants reproduced an unfamiliar Native American folk story several times</text>
<rect x="60" y="134" width="200" height="230" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="80" y1="160" x2="240" y2="160" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="182" x2="203" y2="182" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="204" x2="216" y2="204" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="226" x2="229" y2="226" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="248" x2="192" y2="248" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="270" x2="205" y2="270" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="292" x2="218" y2="292" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="314" x2="231" y2="314" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="336" x2="194" y2="336" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><text x="160" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Original story</text><text x="160" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">unfamiliar style and content</text><line x1="268" y1="304" x2="320" y2="304" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="184" width="200" height="180" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="350" y1="210" x2="510" y2="210" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="350" y1="232" x2="473" y2="232" stroke="#d4b02e" stroke-width="7" stroke-linecap="round"/><line x1="350" y1="254" x2="486" y2="254" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="350" y1="276" x2="499" y2="276" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="350" y1="298" x2="462" y2="298" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="350" y1="320" x2="475" y2="320" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><text x="430" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reproduction</text><text x="430" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">details lost</text><line x1="538" y1="304" x2="570" y2="304" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="580" y="234" width="200" height="130" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="260" x2="760" y2="260" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="600" y1="282" x2="723" y2="282" stroke="#d4b02e" stroke-width="7" stroke-linecap="round"/><line x1="600" y1="304" x2="736" y2="304" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="600" y1="326" x2="749" y2="326" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><text x="680" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Later reproduction</text><text x="680" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">shorter, fits English culture</text><rect x="30" y="446" width="270.6666666666667" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="513" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CHANGE 1</text><text x="165.33333333333334" y="539.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Shorter</text><rect x="314.6666666666667" y="446" width="270.6666666666667" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="478" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CHANGE 2</text><text x="450" y="504.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Lost details</text><text x="450" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">that made no sense to them,</text><text x="450" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">such as the supernatural</text><text x="450" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">elements</text><rect x="599.3333333333334" y="446" width="270.6666666666667" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="734.6666666666667" y="487" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CHANGE 3</text><text x="734.6666666666667" y="513.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Changed to fit English</text><text x="734.6666666666667" y="537.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">culture</text><text x="734.6666666666667" y="566.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">canoes became boats</text><rect x="30" y="622" width="413" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="654" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SCHEMAS</text><text x="50" y="680.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rebuild from fragments</text><text x="50" y="709.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mental frameworks of knowledge built from</text><text x="50" y="730.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">experience fill in the rest.</text><rect x="457" y="622" width="413" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="654" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EFFORT AFTER MEANING</text><text x="477" y="680.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Make it fit</text><text x="477" y="709.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unfamiliar or confusing details are changed or</text><text x="477" y="730.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dropped to fit what we understand.</text><rect x="30" y="777" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="819.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="845.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Clear qualitative examples</text><text x="50" y="874.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Influenced later research on eyewitness</text><text x="50" y="895.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">memory.</text><rect x="457" y="777" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="809" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="835.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Not standardised</text><text x="477" y="863.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No strict instructions or set intervals; changes</text><text x="477" y="884.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may be guesses. The story was deliberately</text><text x="477" y="905.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">strange.</text>
</svg>