<rect width="900" height="731" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Murdock's serial position curve</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Free recall of a list of words. Illustrative shape, not real data</text>
<line x1="110" y1="424" x2="820" y2="424" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="424" x2="110" y2="154" stroke="#1e2a44" stroke-width="3"/><text x="465" y="458" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Position of the word in the list →</text><text x="96" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">first</text><text x="820" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">last</text><text x="86" y="289" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 86 289)">Recall →</text><rect x="114" y="154" width="150" height="270" fill="#f2e7b8" opacity="0.7"/><rect x="670" y="154" width="150" height="270" fill="#dce9e7" opacity="0.8"/><path d="M130,184 C230,214 270,354 370,354 L570,354 C670,354 710,204 810,164" fill="none" stroke="#1e2a44" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="190" y="404" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">PRIMACY</text><text x="745" y="404" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">RECENCY</text><text x="465" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">middle words recalled worst</text><rect x="30" y="496" width="272" height="123" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="538.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRIMACY: EARLY WORDS</text><text x="50" y="563.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Time to rehearse them into</text><text x="50" y="584.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">long-term memory</text><rect x="314" y="496" width="272" height="123" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="528" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MIDDLE WORDS</text><text x="334" y="553.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pushed out of short-term</text><text x="334" y="574.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">memory without enough</text><text x="334" y="595.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">rehearsal</text><rect x="598" y="496" width="272" height="123" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="538.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RECENCY: LAST WORDS</text><text x="618" y="563.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Still in short-term memory</text><text x="618" y="584.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">at the moment of recall</text><rect x="30" y="641" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="674.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Two distinct effects explained by two stores: the main evidence for the multi-store model.</text>
</svg>