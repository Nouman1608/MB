<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 749" width="900" height="749" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="749" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Processes and types of memory</text>

<rect x="30" y="100" width="249.33333333333334" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="154.66666666666669" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="154.66666666666669" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Encoding</text><text x="154.66666666666669" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Changing information into a</text><text x="154.66666666666669" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">form the brain can hold</text><line x1="285.33333333333337" y1="167" x2="319.33333333333337" y2="167" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="100" width="249.33333333333334" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="450.00000000000006" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Storage</text><text x="450.00000000000006" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Holding the information</text><text x="450.00000000000006" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">over time</text><line x1="580.6666666666667" y1="167" x2="614.6666666666667" y2="167" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="100" width="249.33333333333334" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745.3333333333334" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="745.3333333333334" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Retrieval</text><text x="745.3333333333334" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Finding it and bringing it</text><text x="745.3333333333334" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">back when needed</text><text x="30" y="277" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Encoding can be:</text><rect x="200" y="256" width="172.464" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="286.23199999999997" y="276.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">acoustic: by sound</text><rect x="382.464" y="256" width="151.024" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="457.976" y="276.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">visual: by image</text><rect x="543.488" y="256" width="196.432" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="641.7040000000001" y="276.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">semantic: by meaning</text><rect x="30" y="308" width="840" height="58" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="341.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A failure at <tspan font-weight="700" fill="#1e2a44">any</tspan> <tspan font-weight="700" fill="#1e2a44">one</tspan> <tspan font-weight="700" fill="#1e2a44">stage</tspan> produces forgetting, so name the stage that went wrong.</text><text x="450" y="414" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">THREE TYPES OF LONG-TERM MEMORY</text><rect x="30" y="436" width="270.6666666666667" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="471.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Episodic</text><text x="50" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Personal experiences tied to a</text><text x="50" y="521.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time and place</text><text x="50" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">your</tspan> <tspan font-style="italic">first</tspan> <tspan font-style="italic">day</tspan> <tspan font-style="italic">at</tspan></text><text x="50" y="571.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">secondary</tspan> <tspan font-style="italic">school</tspan></text><rect x="314.6666666666667" y="436" width="270.6666666666667" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="471.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Semantic</text><text x="334.6666666666667" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Facts and meanings, no</text><text x="334.6666666666667" y="521.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">longer linked to when you</text><text x="334.6666666666667" y="542.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">learned them</text><text x="334.6666666666667" y="571.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">Paris</tspan> <tspan font-style="italic">is</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">capital</tspan> <tspan font-style="italic">of</tspan></text><text x="334.6666666666667" y="592.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">France</tspan></text><rect x="599.3333333333334" y="436" width="270.6666666666667" height="181" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="471.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Procedural</text><text x="619.3333333333334" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Skills and how to do things</text><text x="619.3333333333334" y="529.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">riding</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">bicycle</tspan></text><rect x="30" y="639" width="548" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="304" y="671.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Episodic and semantic: can be put into words; recalled</text><text x="304" y="692.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">consciously</tspan></text><rect x="592" y="639" width="278" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="731" y="671.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Procedural: hard to describe;</text><text x="731" y="692.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">used <tspan font-weight="700" fill="#1e2a44">without</tspan> <tspan font-weight="700" fill="#1e2a44">conscious</tspan> <tspan font-weight="700" fill="#1e2a44">effort</tspan></text>
</svg>