<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 689" width="900" height="689" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="689" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why memory can be inaccurate</text>

<rect x="30" y="100" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="136" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">PROACTIVE: old affects new</text><rect x="54" y="156" width="220" height="60" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="190.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Older learning</text><rect x="384" y="156" width="200" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="190.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Newer learning</text><line x1="282" y1="186" x2="376" y2="186" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="329" y="174" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">disrupts</text><text x="600" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Calling</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">new</tspan> <tspan font-style="italic">teacher</tspan> <tspan font-style="italic">by</tspan> <tspan font-style="italic">your</tspan></text><text x="600" y="197" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">old</tspan> <tspan font-style="italic">teacher's</tspan> <tspan font-style="italic">name</tspan></text><rect x="30" y="266" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="302" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">RETROACTIVE: new affects old</text><rect x="54" y="322" width="220" height="60" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="356.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Older learning</text><rect x="384" y="322" width="200" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="356.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Newer learning</text><line x1="376" y1="352" x2="282" y2="352" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="329" y="340" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">disrupts</text><text x="600" y="342" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">A</tspan> <tspan font-style="italic">new</tspan> <tspan font-style="italic">phone</tspan> <tspan font-style="italic">number</tspan> <tspan font-style="italic">makes</tspan> <tspan font-style="italic">the</tspan></text><text x="600" y="363" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">old</tspan> <tspan font-style="italic">one</tspan> <tspan font-style="italic">hard</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">recall</tspan></text><text x="450" y="451.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Interference is greatest when the two sets of information are <tspan font-weight="700">similar</tspan>.</text><rect x="30" y="482" width="412" height="175" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="514" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTEXT</text><text x="50" y="540.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cues from the setting</text><text x="50" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Recall is better when the context at retrieval</text><text x="50" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">matches the context at encoding. Revising in a</text><text x="50" y="611.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quiet room but sitting the exam in a noisy hall</text><text x="50" y="632.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">removes the cues.</text><rect x="458" y="482" width="412" height="175" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="514" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FALSE MEMORIES</text><text x="478" y="540.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Confident but wrong</text><text x="478" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Remembering an event or detail that did not</text><text x="478" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">happen. Caused by misleading questions,</text><text x="478" y="611.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">suggestion by others and schemas.</text>
</svg>