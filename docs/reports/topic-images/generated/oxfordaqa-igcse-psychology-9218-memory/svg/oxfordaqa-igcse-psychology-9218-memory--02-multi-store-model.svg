<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 526" width="900" height="526" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="526" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The multi-store model</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Atkinson and Shiffrin: three separate stores</text>
<rect x="30" y="124" width="210" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="135" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sensory register</text><text x="48" y="198" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CODING</text><text x="48" y="220" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in the form of the</text><text x="48" y="241" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sense that received it</text><text x="48" y="270" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">HOLDS</text><text x="48" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a brief, unprocessed</text><text x="48" y="313" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trace</text><line x1="246" y1="234" x2="339" y2="234" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="292.5" y="220" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">attention</text><rect x="345" y="124" width="210" height="270" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Short-term memory</text><text x="363" y="198" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CODING</text><text x="363" y="220" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mainly acoustic</text><text x="363" y="249" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CAPACITY</text><text x="363" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">small (around 5-9</text><text x="363" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">items)</text><text x="363" y="321" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">DURATION</text><text x="363" y="343" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">brief: seconds</text><line x1="561" y1="234" x2="654" y2="234" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="607.5" y="220" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">rehearsal</text><rect x="660" y="124" width="210" height="270" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="765" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Long-term memory</text><text x="678" y="198" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CODING</text><text x="678" y="220" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mainly semantic</text><text x="678" y="249" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CAPACITY</text><text x="678" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no known limit</text><line x1="135" y1="400" x2="135" y2="444" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="135" y="468" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">decays</text><text x="135" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">if not attended to</text><line x1="450" y1="400" x2="450" y2="444" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="450" y="468" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">displaced or decays</text><text x="450" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">if not rehearsed</text>
</svg>