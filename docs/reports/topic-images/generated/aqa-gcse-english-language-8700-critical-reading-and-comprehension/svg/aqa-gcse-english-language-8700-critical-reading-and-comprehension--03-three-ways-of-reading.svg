<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Read in different ways for different purposes</text>

<rect x="30" y="100" width="268" height="338" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="94" y1="130" x2="234" y2="130" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="94" y1="150" x2="234" y2="150" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="94" y1="170" x2="234" y2="170" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="94" y1="190" x2="234" y2="190" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="94" y1="210" x2="234" y2="210" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="94" y1="230" x2="234" y2="230" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><rect x="86" y="162" width="156" height="36" rx="6" fill="none" stroke="#b5602e" stroke-width="3"/><line x1="94" y1="180" x2="234" y2="180" stroke="#b5602e" stroke-width="6" stroke-linecap="round"/><text x="50" y="275" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Scanning</text><text x="50" y="305" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">For a short question</text><text x="50" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">confined to particular</text><text x="50" y="347" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lines: stay inside those</text><text x="50" y="368" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lines and pick out exactly</text><text x="50" y="389" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what is asked for.</text><rect x="316" y="100" width="268" height="338" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="380" y1="130" x2="520" y2="130" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="380" y1="150" x2="520" y2="150" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="380" y1="170" x2="520" y2="170" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="380" y1="190" x2="520" y2="190" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="380" y1="210" x2="520" y2="210" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="380" y1="230" x2="520" y2="230" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><path d="M380,130 L510,150 L390,170 L510,190 L390,210 L520,230" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="336" y="275" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Skimming</text><text x="336" y="305" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">For overall sense on a</text><text x="336" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">first read, so you know the</text><text x="336" y="347" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shape of the whole text</text><text x="336" y="368" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">before any question.</text><rect x="602" y="100" width="268" height="338" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="666" y1="130" x2="806" y2="130" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="666" y1="150" x2="806" y2="150" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="666" y1="170" x2="806" y2="170" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="666" y1="190" x2="806" y2="190" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="666" y1="210" x2="806" y2="210" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="666" y1="230" x2="806" y2="230" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><line x1="666" y1="150" x2="806" y2="150" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round"/><line x1="666" y1="170" x2="806" y2="170" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round"/><line x1="666" y1="190" x2="806" y2="190" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round"/><text x="622" y="275" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Close reading</text><text x="622" y="305" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">For evaluation: slow,</text><text x="622" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">line-by-line attention to</text><text x="622" y="347" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one section, asking what</text><text x="622" y="368" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">each choice does to the</text><text x="622" y="389" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reader.</text><rect x="30" y="460" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="493.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judge usefulness, relevance and presentation</text><text x="48" y="522.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A 19th-century travel letter may be vivid but tell a modern reader little that is reliable;</text><text x="48" y="544.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a report may be accurate but so dry that it fails to persuade.</text>
</svg>