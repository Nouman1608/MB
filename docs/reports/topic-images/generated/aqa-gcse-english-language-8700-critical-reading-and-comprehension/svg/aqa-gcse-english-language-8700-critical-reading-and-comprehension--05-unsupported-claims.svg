<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five signs of a claim without support</text>

<rect x="30" y="100" width="300" height="47" fill="#1e2a44"/><text x="180" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Warning sign</text><rect x="330" y="100" width="540" height="47" fill="#1e2a44"/><text x="600" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">What it looks like</text><rect x="30" y="147" width="300" height="74" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="186.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Generalisation</text><rect x="330" y="147" width="540" height="74" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="174.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">From one example: “every teenager I meet is glued to a</text><text x="344" y="198.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">screen”</text><rect x="30" y="221" width="300" height="58" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="252.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Anecdote as proof</text><rect x="330" y="221" width="540" height="58" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="252.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">One story standing in for a pattern</text><rect x="30" y="279" width="300" height="58" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="310.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Loaded language</text><rect x="330" y="279" width="540" height="58" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="310.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Judges before it informs: “so-called experts”</text><rect x="30" y="337" width="300" height="58" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="368.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Selective evidence</text><rect x="330" y="337" width="540" height="58" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="368.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Only the facts that help the writer’s case are given</text><rect x="30" y="395" width="300" height="58" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="426.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Opinion as fact</text><rect x="330" y="395" width="540" height="58" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="426.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">No source or reason is given</text><rect x="30" y="100" width="840" height="353" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="475" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="508.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ask of every claim: what supports it?</text><text x="48" y="537.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Spotting bias is not dismissing the writer. Saying why a writer selected or slanted</text><text x="48" y="559.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">evidence is a strong critical point.</text>
</svg>