<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 769" width="900" height="769" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="769" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where critical reading is tested</text>

<rect x="30" y="100" width="250" height="47" fill="#1e2a44"/><text x="155" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Question</text><rect x="280" y="100" width="120" height="47" fill="#1e2a44"/><text x="340" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Marks</text><rect x="400" y="100" width="470" height="47" fill="#1e2a44"/><text x="635" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">What critical reading looks like there</text><rect x="30" y="147" width="250" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="184.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 1, Question 1</text><rect x="280" y="147" width="120" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="340" y="184.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="400" y="147" width="470" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="414" y="173.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Finding information in a named section of a</text><text x="414" y="195.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fiction extract, precisely</text><rect x="30" y="217" width="250" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="254.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 1, Question 4</text><rect x="280" y="217" width="120" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="340" y="254.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">20</text><rect x="400" y="217" width="470" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="414" y="243.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Testing a statement about the extract and reaching</text><text x="414" y="265.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">your own supported judgement (AO4)</text><rect x="30" y="287" width="250" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="324.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 2, Question 1</text><rect x="280" y="287" width="120" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="340" y="324.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="400" y="287" width="470" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="414" y="313.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Deciding which statements about a non-fiction</text><text x="414" y="335.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">source are true</text><rect x="30" y="357" width="250" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="394.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 2, Question 2</text><rect x="280" y="357" width="120" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="340" y="394.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><rect x="400" y="357" width="470" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="414" y="383.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Inferring from both sources to summarise a</text><text x="414" y="405.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">difference or similarity</text><rect x="30" y="100" width="840" height="327" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="469" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1 Question 4 weighs as much as the other three Paper 1 reading questions together</text><text x="216" y="515" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Question 4</text><rect x="230" y="491" width="520" height="36" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="490" y="515" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">20 marks</text><text x="216" y="565" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Questions 1–3</text><rect x="230" y="541" width="104" height="36" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="282" y="565" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Q1: 4</text><rect x="334" y="541" width="416" height="36" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="542" y="565" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Q2 + Q3</text><rect x="30" y="603" width="411" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="636" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AO1</text><text x="50" y="663" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Identify and interpret</text><text x="50" y="692.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">explicit and implicit information and</text><text x="50" y="714.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">ideas</text><rect x="459" y="603" width="411" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="636" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AO4</text><text x="479" y="663" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate critically</text><text x="479" y="692.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and support this with appropriate textual</text><text x="479" y="714.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">references</text>
</svg>