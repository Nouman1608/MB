<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluate a statement by splitting it</text>

<rect x="30" y="100" width="411" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANALYSIS ASKS</text><text x="50" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">How?</text><text x="50" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How a method creates an effect</text><rect x="459" y="100" width="411" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="133" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EVALUATION ASKS</text><text x="479" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">How well? Is it fair?</text><text x="479" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How well the writer achieves what the</text><text x="479" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">statement claims</text><rect x="30" y="258" width="840" height="74" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="304" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Statement: the character is presented as “lonely and frightened”</text><line x1="330" y1="334" x2="330" y2="358" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="570" y1="334" x2="570" y2="358" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="250" y="389" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Claim 1: lonely</text><rect x="270" y="368" width="420" height="30" rx="6" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="270" y="368" width="378" height="30" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="705" y="390" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">strong evidence</text><text x="250" y="445" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Claim 2: frightened</text><rect x="270" y="424" width="420" height="30" rx="6" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="270" y="424" width="189" height="30" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="705" y="446" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="start">weaker evidence</text><text x="250" y="501" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Another reading</text><rect x="270" y="480" width="420" height="30" rx="6" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="270" y="480" width="105" height="30" rx="6" fill="#efdfa8" stroke="#b5602e" stroke-width="2"/><text x="705" y="502" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">a hint of defiance</text><rect x="30" y="552" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="585.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement with a shape: mostly agree, with a qualification.</text><text x="450" y="614.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Test each part of the statement, then weigh the evidence you found for each.</text>
</svg>