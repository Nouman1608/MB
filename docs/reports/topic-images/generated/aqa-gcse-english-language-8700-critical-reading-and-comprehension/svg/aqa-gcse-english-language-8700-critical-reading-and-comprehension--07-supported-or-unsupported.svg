<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 479" width="900" height="479" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="479" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Supported or unsupported?</text>

<rect x="30" y="100" width="330" height="47" fill="#1e2a44"/><text x="195" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Claim in the extract</text><rect x="360" y="100" width="180" height="47" fill="#1e2a44"/><text x="450" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Verdict</text><rect x="540" y="100" width="330" height="47" fill="#1e2a44"/><text x="705" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Why</text><rect x="30" y="147" width="330" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="184.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Three shops… closed last year”</text><rect x="360" y="147" width="180" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="184.94" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Supported</text><rect x="540" y="147" width="330" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="554" y="173.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A factual claim that could be</text><text x="554" y="195.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">checked</text><rect x="30" y="217" width="330" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="243.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The council’s own survey found</text><text x="44" y="265.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">that footfall fell”</text><rect x="360" y="217" width="180" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="254.94" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Supported</text><rect x="540" y="217" width="330" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="554" y="254.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Supported by a named source</text><rect x="30" y="287" width="330" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="313.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Nobody under thirty shops locally</text><text x="44" y="335.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">any more”</text><rect x="360" y="287" width="180" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="324.94" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Unsupported</text><rect x="540" y="287" width="330" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="554" y="313.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A sweeping generalisation with no</text><text x="554" y="335.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evidence</text><rect x="30" y="357" width="330" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="405.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Our town centre is dying”</text><rect x="360" y="357" width="180" height="92" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="405.94" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Unsupported</text><rect x="540" y="357" width="330" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="554" y="383.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A conclusion from limited</text><text x="554" y="405.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evidence; the metaphor sounds more</text><text x="554" y="427.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">certain than the facts allow</text><rect x="30" y="100" width="840" height="349" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>