<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 769" width="900" height="769" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="769" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explicit, implicit and the inference chain</text>

<rect x="30" y="100" width="411" height="144" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPLICIT: STATED</text><text x="50" y="160.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">“The kitchen was empty.”</text><text x="50" y="191.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The text says it outright.</text><rect x="459" y="100" width="411" height="144" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMPLICIT: SUGGESTED</text><text x="479" y="160.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">A kettle “still ticking as it</text><text x="479" y="188.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">cooled”</text><text x="479" y="219.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Implies someone left in a hurry.</text><text x="450" y="286" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Build every inference as a chain</text><rect x="30" y="302" width="246.66666666666666" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="153.33333333333331" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">STEP 1</text><text x="153.33333333333331" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Detail</text><text x="153.33333333333331" y="391.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">a short quotation</text><line x1="282.66666666666663" y1="370" x2="320.66666666666663" y2="370" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="302" width="246.66666666666666" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="449.99999999999994" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">STEP 2</text><text x="449.99999999999994" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">What it suggests</text><text x="449.99999999999994" y="391.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">the inference</text><line x1="579.3333333333333" y1="370" x2="617.3333333333333" y2="370" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="302" width="246.66666666666666" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="746.6666666666666" y="335" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">STEP 3</text><text x="746.6666666666666" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Why it matters</text><text x="746.6666666666666" y="391.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">to the focus of the</text><text x="746.6666666666666" y="413.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">question</text><rect x="30" y="460" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#d4b02e"/></linearGradient></defs><rect x="60" y="522" width="780" height="26" rx="13" fill="url(#gr)" stroke="#1e2a44" stroke-width="2"/><text x="60" y="500" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">weaker evidence: tentative verbs</text><text x="840" y="500" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">stated outright</text><rect x="60" y="562" width="108" height="33" rx="16.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="114" y="584.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">suggests</text><rect x="178" y="562" width="98" height="33" rx="16.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="227" y="584.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">implies</text><rect x="286" y="562" width="78" height="33" rx="16.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="325" y="584.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">hints</text><rect x="374" y="562" width="98" height="33" rx="16.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="423" y="584.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">perhaps</text><rect x="752" y="562" width="88" height="33" rx="16.5" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="796" y="584.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">proves</text><rect x="664" y="562" width="78" height="33" rx="16.5" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="703" y="584.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">shows</text><rect x="30" y="632" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="665.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One detail can carry two readings.</text><text x="48" y="694.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Offering two possible readings of the same detail is one of the clearest signs of critical</text><text x="48" y="716.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rather than literal reading.</text>
</svg>