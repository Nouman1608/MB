<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 647" width="900" height="647" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="647" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing “Mara is presented as helpless”</text>

<line x1="62" y1="120" x2="62" y2="597" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="100" width="762" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="133.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement first: “I partly agree.”</text><text x="126" y="162.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A clear position in the first words.</text><circle cx="62" cy="142.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="151.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="197" width="762" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="230.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Inference from evidence</text><text x="126" y="259.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">She waits “long after the last bus had gone”: she has no other way home.</text><circle cx="62" cy="239.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="248.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="294" width="762" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="327.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A second reading of one detail</text><text x="126" y="356.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Checking a timetable she “knew by heart” implies anxiety, but is also a small act</text><text x="126" y="378.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">of control.</text><circle cx="62" cy="347.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="356.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="413" width="762" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="446.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate method and effect</text><text x="126" y="475.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The dead phone is withheld until the end of the sentence: the reader sees a</text><text x="126" y="497.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">confident gesture, then realises it is a bluff.</text><circle cx="62" cy="466.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="475.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="532" width="762" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="126" y="565.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sustained, qualified judgement</text><text x="126" y="594.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Vulnerable but resourceful: frightened rather than helpless.</text><circle cx="62" cy="574.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="583.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>