<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who really holds power?</text>

<rect x="30" y="104" width="412" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist: society</text><circle cx="51" cy="181.92" r="4.5" fill="#2e6b62"/><text x="64" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Power is used for collective goals: defence,</text><text x="64" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">order, welfare</text><circle cx="51" cy="231.92" r="4.5" fill="#2e6b62"/><text x="64" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Legitimate because of a <tspan font-weight="700">value consensus</tspan></text><circle cx="51" cy="260.92" r="4.5" fill="#2e6b62"/><text x="64" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">But:</tspan> ignores conflict and self-interest</text><rect x="458" y="104" width="412" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist: the ruling class</text><circle cx="479" cy="181.92" r="4.5" fill="#2e6b62"/><text x="492" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Power follows ownership; the state serves</text><text x="492" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">owners</text><circle cx="479" cy="231.92" r="4.5" fill="#2e6b62"/><text x="492" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Authority produced by <tspan font-weight="700">ruling class ideology</tspan>,</text><text x="492" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. property laws</text><circle cx="479" cy="281.92" r="4.5" fill="#2e6b62"/><text x="492" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">But:</tspan> Weber rejected this; governments passed</text><text x="492" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">minimum wage and safety laws</text><rect x="30" y="348" width="412" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,398 L31.25,362.25 Q31.25,349.25 44.25,349.25 L427.75,349.25 Q440.75,349.25 440.75,362.25 L440.75,398 Z" fill="#f2e7b8"/><line x1="31.25" y1="398" x2="440.75" y2="398" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="379" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist: men</text><circle cx="51" cy="425.92" r="4.5" fill="#2e6b62"/><text x="64" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Men hold most formal posts in Parliament,</text><text x="64" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">business and religion</text><circle cx="51" cy="475.92" r="4.5" fill="#2e6b62"/><text x="64" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Traditional authority in families; threat of</text><text x="64" y="502.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">male violence (Walby)</text><circle cx="51" cy="525.9200000000001" r="4.5" fill="#2e6b62"/><text x="64" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">But:</tspan> women’s share of posts has grown;</text><text x="64" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">liberal feminists stress progress</text><rect x="458" y="348" width="412" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,398 L459.25,362.25 Q459.25,349.25 472.25,349.25 L855.75,349.25 Q868.75,349.25 868.75,362.25 L868.75,398 Z" fill="#dce9e7"/><line x1="459.25" y1="398" x2="868.75" y2="398" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="379" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Pluralist: many groups</text><circle cx="479" cy="425.92" r="4.5" fill="#2e6b62"/><text x="492" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parties, <tspan font-weight="700">pressure groups</tspan>, unions and</text><text x="492" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">businesses compete</text><circle cx="479" cy="475.92" r="4.5" fill="#2e6b62"/><text x="492" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No single group dominates; elections remove</text><text x="492" y="502.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">governments</text><circle cx="479" cy="525.9200000000001" r="4.5" fill="#2e6b62"/><text x="492" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">But:</tspan> large businesses have far more resources</text>
</svg>