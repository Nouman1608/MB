<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="428" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How charisma is made to last</text>

<rect x="30" y="118" width="184.5" height="151" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="122.25" y="150.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Charismatic</text><text x="122.25" y="174.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">leader</text><text x="122.25" y="204.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Followers devoted to</text><text x="122.25" y="225.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">exceptional</text><text x="122.25" y="246.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">qualities</text><line x1="218.5" y1="193.5" x2="244.5" y2="193.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="118" width="184.5" height="151" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="340.75" y="172.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Crisis</text><text x="340.75" y="202.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The leader fails or</text><text x="340.75" y="223.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">dies</text><line x1="437" y1="193.5" x2="463" y2="193.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="118" width="184.5" height="151" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="559.25" y="150.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Followers</text><text x="559.25" y="174.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">organise</text><text x="559.25" y="204.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">An organisation,</text><text x="559.25" y="225.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">rules or a line of</text><text x="559.25" y="246.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">succession</text><line x1="655.5" y1="193.5" x2="681.5" y2="193.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="118" width="184.5" height="151" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="777.75" y="160.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Lasting</text><text x="777.75" y="184.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">authority</text><text x="777.75" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Turned into rules or</text><text x="777.75" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">traditions</text><rect x="30" y="293" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="329" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The routinisation of charisma</text><text x="56" y="358" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weber’s term for turning charismatic authority into lasting rules, traditions or</text><text x="56" y="380" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">organisations, often when the leader dies.</text>
</svg>