<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 537" width="900" height="537" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="537" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Power, authority and coercion</text>

<rect x="250" y="108" width="400" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="142" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Power (Weber)</text><text x="450" y="170" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">getting your own way, even against resistance</text><line x1="370" y1="202" x2="240" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="530" y1="202" x2="660" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="252" width="400" height="261" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,303 L31.25,266.25 Q31.25,253.25 44.25,253.25 L415.75,253.25 Q428.75,253.25 428.75,266.25 L428.75,303 Z" fill="#b5d3cf"/><line x1="31.25" y1="303" x2="428.75" y2="303" stroke="#c9d6d4" stroke-width="2"/><text x="230" y="283.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Authority</text><text x="44" y="335.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Accepted as legitimate</text><circle cx="49" cy="357.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="363.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">People obey because they believe they</text><text x="62" y="385.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">ought to</tspan></text><circle cx="49" cy="409.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="415.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">e.g.</tspan> a teacher asks a class to be quiet;</text><text x="62" y="437.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pupils accept the right to ask</text><circle cx="49" cy="461.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="467.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Stable:</tspan> gains willing obedience</text><rect x="470" y="252" width="400" height="261" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M471.25,303 L471.25,266.25 Q471.25,253.25 484.25,253.25 L855.75,253.25 Q868.75,253.25 868.75,266.25 L868.75,303 Z" fill="#f2e7b8"/><line x1="471.25" y1="303" x2="868.75" y2="303" stroke="#c9d6d4" stroke-width="2"/><text x="670" y="283.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Coercion</text><text x="484" y="335.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Force or the threat of force</text><circle cx="489" cy="357.53999999999996" r="4.5" fill="#2e6b62"/><text x="502" y="363.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">People obey because they <tspan font-weight="700">fear the</tspan></text><text x="502" y="385.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">consequences</tspan></text><circle cx="489" cy="409.53999999999996" r="4.5" fill="#2e6b62"/><text x="502" y="415.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">e.g.</tspan> a bully takes another pupil’s phone:</text><text x="502" y="437.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">no accepted right, only fear</text><circle cx="489" cy="461.53999999999996" r="4.5" fill="#2e6b62"/><text x="502" y="467.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Costly:</tspan> a ruler must keep spending</text><text x="502" y="489.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">resources on force</text>
</svg>