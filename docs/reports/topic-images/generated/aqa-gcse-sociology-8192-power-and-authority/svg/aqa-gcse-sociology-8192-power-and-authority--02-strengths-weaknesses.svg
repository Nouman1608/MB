<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How each type of authority holds up</text>

<rect x="188" y="104" width="222" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="299" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Traditional</text><rect x="418" y="104" width="222" height="44" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="529" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Charismatic</text><rect x="648" y="104" width="222" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="759" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rational-legal</text><rect x="30" y="156" width="150" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="187.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">People obey</text><text x="42" y="209.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">because…</text><rect x="188" y="156" width="222" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“It has always been done</text><text x="202" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">this way”</text><rect x="418" y="156" width="222" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="432" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Of who the leader is</text><rect x="648" y="156" width="222" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="662" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Of the position, not the</text><text x="662" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">person</text><rect x="30" y="238" width="150" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="300.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Examples</text><rect x="188" y="238" width="222" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hereditary monarch;</text><text x="202" y="289.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tribal chief or village</text><text x="202" y="310.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">elder</text><rect x="418" y="238" width="222" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="432" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Religious prophet;</text><text x="432" y="289.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">revolutionary leader;</text><text x="432" y="310.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leader of a new social</text><text x="432" y="331.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">movement</text><rect x="648" y="238" width="222" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="662" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Police officer, judge,</text><text x="662" y="289.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">head teacher, tax</text><text x="662" y="310.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inspector, MP</text><rect x="30" y="360" width="150" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="411.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strengths</text><rect x="188" y="360" width="222" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="390.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stable over generations;</text><text x="202" y="411.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">does not depend on</text><text x="202" y="432.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personal qualities</text><rect x="418" y="360" width="222" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="432" y="390.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inspires rapid change</text><text x="432" y="411.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and great loyalty</text><rect x="648" y="360" width="222" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="662" y="390.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Predictable and fair in</text><text x="662" y="411.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">principle; power passes</text><text x="662" y="432.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">smoothly</text><rect x="30" y="461" width="150" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="512.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Weaknesses</text><rect x="188" y="461" width="222" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="491.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Challenged when customs</text><text x="202" y="512.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change; can resist</text><text x="202" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">useful change</text><rect x="418" y="461" width="222" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="432" y="491.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unstable: depends on one</text><text x="432" y="512.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">person; crisis when the</text><text x="432" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leader dies</text><rect x="648" y="461" width="222" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="662" y="491.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rigid “red tape”;</text><text x="662" y="512.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">questioned if rules seem</text><text x="662" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unfair or are broken</text><rect x="30" y="570" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="606" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ideal types</text><text x="56" y="635" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weber’s types are pure models for comparison. He argued rational-legal authority becomes the</text><text x="56" y="657" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">main type in modern societies.</text>
</svg>