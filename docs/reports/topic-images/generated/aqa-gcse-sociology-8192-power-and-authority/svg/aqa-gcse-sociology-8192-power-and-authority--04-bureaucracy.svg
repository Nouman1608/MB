ext-anchor="middle" font-style="italic">each office supervised by the one above</text><rect x="560" y="120" width="310" height="280" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="580" y="152" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Features</text><circle cx="585" cy="182.72" r="4.5" fill="#2e6b62"/><text x="598" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hierarchy</tspan> of offices</text><circle cx="585" cy="211.72" r="4.5" fill="#2e6b62"/><text x="598" y="217" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Written rules</tspan> and procedures</text><circle cx="585" cy="240.72" r="4.5" fill="#2e6b62"/><text x="598" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Specialisation</tspan>: defined areas of</text><text x="598" y="267" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work</text><circle cx="585" cy="290.72" r="4.5" fill="#2e6b62"/><text x="598" y="296" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Impersonality</tspan>: rules, not</text><text x="598" y="317" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">feelings</text><circle cx="585" cy="340.72" r="4.5" fill="#2e6b62"/><text x="598" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Appointment and promotion on</text><text x="598" y="367" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">qualifications and merit</tspan></text><rect x="30" y="420" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="456" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The organisational form of rational-legal authority</text><text x="56" y="485" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Examples: government departments, large companies, hospitals and schools.</text>
