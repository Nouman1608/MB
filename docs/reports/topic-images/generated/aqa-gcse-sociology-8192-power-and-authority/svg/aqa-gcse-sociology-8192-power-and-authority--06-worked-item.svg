<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 571" width="900" height="571" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="571" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Applying Weber to an item</text>

<rect x="30" y="108" width="840" height="96" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="136" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Item (fictional): Ashgrove Mosque</text><text x="48" y="164" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The imam is respected for his knowledge and personal kindness. The finance committee follows a</text><text x="48" y="186" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">written constitution and elects its treasurer every three years.</text><line x1="240" y1="208" x2="240" y2="240" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="660" y1="208" x2="660" y2="240" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="246" width="412" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,296 L31.25,260.25 Q31.25,247.25 44.25,247.25 L427.75,247.25 Q440.75,247.25 440.75,260.25 L440.75,296 Z" fill="#d4b02e"/><line x1="31.25" y1="296" x2="440.75" y2="296" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="276.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The imam</text><text x="44" y="328.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Charismatic authority; informal power</text><circle cx="49" cy="350.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="356.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">People follow him for his <tspan font-weight="700">personal</tspan></text><text x="62" y="378.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">qualities</tspan></text><circle cx="49" cy="402.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="408.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No rule obliges anyone to follow his advice</text><rect x="458" y="246" width="412" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,296 L459.25,260.25 Q459.25,247.25 472.25,247.25 L855.75,247.25 Q868.75,247.25 868.75,260.25 L868.75,296 Z" fill="#b5d3cf"/><line x1="459.25" y1="296" x2="868.75" y2="296" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="276.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The treasurer</text><text x="472" y="328.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Rational-legal authority; formal power</text><circle cx="477" cy="350.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="356.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Elected under a <tspan font-weight="700">written constitution</tspan></text><circle cx="477" cy="380.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="386.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Members obey the role, not the person</text><circle cx="477" cy="410.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="416.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A new treasurer inherits the same authority</text><rect x="30" y="458" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="494" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What makes the answer work</text><text x="56" y="523" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Name the type, link it to a detail in the item, and explain why it fits.</text>
</svg>