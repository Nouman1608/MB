<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How urban land use changes</text>

<rect x="30" y="110" width="410" height="284" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Deindustrialisation and redevelopment</text><rect x="50" y="166" width="370" height="120" rx="8" fill="#dce9e7"/><path d="M90,271 L90,241 L110,229 L110,241 L130,229 L130,241 L150,229 L150,271 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2" stroke-linejoin="round"/><rect x="135" y="205" width="9" height="30" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><line x1="190" y1="231" x2="260" y2="231" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="290" y="181" width="36" height="90" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="340" y="211" width="50" height="60" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="50" y="316" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Old factories and docks close; brownfield</text><text x="50" y="336" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">sites become offices, flats, leisure (e.g.</text><text x="50" y="356" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">London Docklands, Canary Wharf).</text><rect x="460" y="110" width="410" height="284" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gentrification</text><rect x="480" y="166" width="370" height="120" rx="8" fill="#dce9e7"/><rect x="530" y="243" width="36" height="28.799999999999997" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M526.4,243 L548,227.4 L569.6,243 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="580" y="243" width="36" height="28.799999999999997" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M576.4,243 L598,227.4 L619.6,243 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><line x1="640" y1="241" x2="700" y2="241" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="730" y="243" width="36" height="28.799999999999997" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M726.4,243 L748,227.4 L769.6,243 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="780" y="243" width="36" height="28.799999999999997" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M776.4,243 L798,227.4 L819.6,243 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="780" y="213" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">prices ↑</text><text x="480" y="316" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Wealthier people renovate older inner-city</text><text x="480" y="336" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">housing; prices rise and lower-income</text><text x="480" y="356" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">residents may be pushed out.</text><rect x="30" y="410" width="410" height="284" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="446" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Decentralisation</text><rect x="50" y="466" width="370" height="120" rx="8" fill="#dce9e7"/><rect x="70" y="501" width="70" height="70" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="105" y="541" font-size="13.5" font-weight="400" fill="#1e2a44" text-anchor="middle">centre</text><line x1="150" y1="536" x2="250" y2="536" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="260" y="531" width="130" height="40" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="325" y="556" font-size="13.5" font-weight="400" fill="#1e2a44" text-anchor="middle">retail park</text><rect x="260" y="501" width="130" height="22" fill="#d8e3c6" stroke="#1e2a44" stroke-width="1.5"/><text x="325" y="517" font-size="12.5" font-weight="400" fill="#1e2a44" text-anchor="middle">parking</text><text x="50" y="616" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Shops and offices move to retail and business</text><text x="50" y="636" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">parks on the fringe: cheaper land, easier</text><text x="50" y="656" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">parking.</text><rect x="460" y="410" width="410" height="284" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="446" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Urban sprawl</text><rect x="480" y="466" width="370" height="120" rx="8" fill="#dce9e7"/><rect x="495" y="501" width="110" height="70" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="550" y="541" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">city</text><rect x="625" y="545" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M622.6,545 L637,534.6 L651.4,545 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="675" y="545" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M672.6,545 L687,534.6 L701.4,545 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="725" y="545" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M722.6,545 L737,534.6 L751.4,545 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="775" y="545" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M772.6,545 L787,534.6 L801.4,545 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="610" y1="516" x2="820" y2="516" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="8 6"/><rect x="780" y="551" width="60" height="20" fill="#a9c48f"/><text x="480" y="616" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">The built-up area spreads onto greenfield</text><text x="480" y="636" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">land, often low-density housing and roads.</text>
</svg>