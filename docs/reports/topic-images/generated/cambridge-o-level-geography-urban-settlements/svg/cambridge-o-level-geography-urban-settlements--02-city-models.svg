<rect x="30" y="110" width="410" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Typical high-income city</text><circle cx="235" cy="370" r="175" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2"/><circle cx="235" cy="370" r="130" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="235" cy="370" r="80" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><circle cx="235" cy="370" r="38" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M60,430 L410,310" stroke="#2b5a9a" stroke-width="7"/><path d="M175,300 L215,340 L165,360 Z" fill="#b5602e" opacity="0.8"/><text x="235" y="376" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">CBD</text><rect x="184" y="417.75" width="102" height="20.25" rx="5" fill="#cbbf9f" opacity="1"/><text x="235" y="432" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">inner city</text><rect x="197.5" y="467.75" width="75" height="20.25" rx="5" fill="#dce9e7" opacity="1"/><text x="235" y="482" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">suburbs</text><rect x="148" y="513.75" width="174" height="20.25" rx="5" fill="#d8e3c6" opacity="1"/><text x="235" y="528" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">rural–urban fringe</text><rect x="64" y="285.75" width="147" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="70" y="300" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">old industry by</text><rect x="64" y="303.75" width="127.50000000000001" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="70" y="318" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">river and rail</text><rect x="355" y="440" width="40" height="30" fill="#b5602e" opacity="0.8"/><rect x="289" y="497.75" width="129" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="295" y="512" font-size="1