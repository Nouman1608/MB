<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Case-study plan: traffic congestion in London</text>

<rect x="30" y="115" width="260" height="320" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="150" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Causes</text><text x="50" y="182" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large commuting</text><text x="66" y="203" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">workforce into central</text><text x="66" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">London</text><text x="50" y="257" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="257" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Street pattern laid out</text><text x="66" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">long before cars</text><text x="50" y="311" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deliveries, taxis and</text><text x="66" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">buses compete for space</text><line x1="294" y1="275" x2="316" y2="275" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="115" width="260" height="320" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="338" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Attempts</text><text x="340" y="182" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="356" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Congestion Charge</text><text x="356" y="203" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2003): pay to enter the</text><text x="356" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">zone</text><text x="340" y="257" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="356" y="257" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Underground, bus and</text><text x="356" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rail network</text><text x="340" y="311" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="356" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Docklands Light Railway</text><text x="340" y="344" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="356" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cycle lanes</text><line x1="584" y1="275" x2="606" y2="275" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="115" width="260" height="320" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="628" y="150" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Evaluation</text><text x="630" y="182" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="646" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less traffic inside the</text><text x="646" y="203" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">zone</text><text x="630" y="236" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="646" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics: hits small</text><text x="646" y="257" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">businesses and</text><text x="646" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lower-income drivers</text><text x="630" y="311" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="646" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Public transport is</text><text x="646" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">costly and slow to build</text><rect x="30" y="455" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="497" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Learn every urban problem as: problem → cause → solution → limitation.</text>
</svg>