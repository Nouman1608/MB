<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Urban sprawl: effects and responses</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic plan, not to scale</text>
<rect x="30" y="110" width="540" height="580" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="45" y="125" width="510" height="550" rx="10" fill="#d8e3c6"/><circle cx="300" cy="400" r="230" fill="#a9c48f" opacity="0.5" stroke="#6f9a52" stroke-width="3" stroke-dasharray="10 7"/><path d="M180,370 Q170,280 260,270 Q360,240 420,310 Q470,380 410,470 Q360,540 270,520 Q170,500 180,370 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M410,470 Q470,510 475,550 L440,570 Q390,540 360,520 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 4"/><line x1="190" y1="411" x2="110" y2="419" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="399" y1="367" x2="471" y2="343" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="377" y1="499" x2="433" y2="571" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="300" y="400" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">CITY</text><rect x="476" y="489.75" width="66" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="482" y="504" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">sprawl</text><rect x="154.5" y="140.75" width="291" height="20.25" rx="5" fill="#d8e3c6" opacity="1"/><text x="300" y="155" font-size="15" font-weight="700" fill="#6f9a52" text-anchor="middle">green belt: building restricted</text><rect x="110" y="250" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M107.6,250 L122,239.6 L136.4,250 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="140" y="262" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M137.6,262 L152,251.6 L166.4,262 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="89" y="275.75" width="156" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="95" y="290" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">commuter village</text><circle cx="470" cy="600" r="34" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="428" y="640.75" width="84" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="470" y="655" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">new town</text><text x="590" y="140" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Effects of sprawl</text><rect x="590" y="156" width="280" height="86" rx="10" fill="#f6e6dc" stroke="#b5602e" stroke-width="2"/><text x="606" y="182" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Environment</text><text x="606" y="204" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">loss of farmland, woodland,</text><text x="606" y="221" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">habitats; faster runoff, flood</text><text x="606" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">risk</text><rect x="590" y="250" width="280" height="86" rx="10" fill="#f6e6dc" stroke="#b5602e" stroke-width="2"/><text x="606" y="276" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Transport</text><text x="606" y="298" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">longer journeys, car</text><text x="606" y="315" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dependence, congestion, air</text><text x="606" y="332" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pollution</text><rect x="590" y="344" width="280" height="86" rx="10" fill="#f6e6dc" stroke="#b5602e" stroke-width="2"/><text x="606" y="370" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rural settlements</text><text x="606" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">commuter villages; house prices</text><text x="606" y="409" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rise; village services close</text><rect x="590" y="438" width="280" height="86" rx="10" fill="#f6e6dc" stroke="#b5602e" stroke-width="2"/><text x="606" y="464" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The city</text><text x="606" y="486" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cost of extending water,</text><text x="606" y="503" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sewers, power and roads</text><rect x="590" y="536" width="280" height="154" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="606" y="564" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Responses</text><text x="606" y="592" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="622" y="592" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Green belts</text><text x="606" y="616" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="622" y="616" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Brownfield sites first</text><text x="606" y="640" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="622" y="640" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Higher-density housing</text><text x="606" y="664" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="622" y="664" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">New towns, e.g. Navi Mumbai</text>
</svg>