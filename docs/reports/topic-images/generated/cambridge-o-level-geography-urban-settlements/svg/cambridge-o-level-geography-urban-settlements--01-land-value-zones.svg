<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why land use changes with distance</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic, not to scale</text>
<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="420" x2="850" y2="420" stroke="#1e2a44" stroke-width="2.5"/><line x1="110" y1="140" x2="110" y2="420" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="150" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">high</text><text x="98" y="420" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">low</text><text x="62" y="280" font-size="15" fill="#1e2a44" font-weight="700" text-anchor="middle" transform="rotate(-90 62 280)">land value and rent</text><text x="850" y="448" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">distance from the city centre →</text><rect x="110" y="456" width="110" height="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><text x="165" y="482" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">CBD</text><rect x="220" y="456" width="180" height="40" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6"/><text x="310" y="482" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Inner city</text><rect x="400" y="456" width="240" height="40" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.6"/><text x="520" y="482" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Suburbs</text><rect x="640" y="456" width="210" height="40" fill="#d8e3c6" stroke="#1e2a44" stroke-width="1.6"/><text x="745" y="482" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Rural–urban fringe</text><path d="M110,145 Q170,300 260,340 Q450,380 850,402" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="144" y="150.75" width="264" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="150" y="165" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">most accessible: routes meet</text><rect x="494" y="285.75" width="228" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="500" y="300" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">cheaper land, more space</text><rect x="30" y="530" width="410" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="563.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">High-profit users pay most</text><text x="48" y="587.3249999999999" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Shops, offices, banks compete for the centre</text><text x="48" y="607.785" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">and build upwards.</text><rect x="460" y="530" width="410" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="563.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Space-hungry users move out</text><text x="478" y="587.3249999999999" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Housing with gardens, industrial estates,</text><text x="478" y="607.785" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">retail parks, airports.</text>
</svg>