<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: suggest reasons from a map</text>

<rect x="30" y="110" width="840" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="45" y="125" width="570" height="530" rx="10" fill="#d8e3c6"/><circle cx="330" cy="400" r="210" fill="none" stroke="#1e2a44" stroke-width="5" stroke-dasharray="1 0"/><text x="480" y="225" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">ring road</text><circle cx="330" cy="400" r="150" fill="#cbbf9f" opacity="0.45"/><circle cx="330" cy="400" r="34" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="330" y="405" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">centre</text><path d="M45,360 Q200,380 330,450 Q450,510 615,480" fill="none" stroke="#2b5a9a" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" /><text x="80" y="345" font-size="14.5" font-weight="700" fill="#2b5a9a" text-anchor="start">river</text><line x1="45" y1="520" x2="615" y2="270" stroke="#1e2a44" stroke-width="4" stroke-dasharray="14 6"/><text x="80" y="540" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">railway</text><rect x="215" y="410" width="80" height="54" fill="#b5602e" opacity="0.8" stroke="#1e2a44" stroke-width="2"/><circle cx="255" cy="437" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="255" y="442.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="500" y="520" width="90" height="60" fill="#b5602e" opacity="0.8" stroke="#1e2a44" stroke-width="2"/><circle cx="545" cy="550" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="545" y="555.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="330" y="645" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic sketch map, not to scale</text><rect x="635" y="125" width="220" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="653" y="157.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">A: old, near</text><text x="653" y="179.75" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">centre</text><text x="653" y="203.775" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Heavy goods moved by</text><text x="653" y="224.235" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">river and rail when it</text><text x="653" y="244.695" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">was built; workers</text><text x="653" y="265.15500000000003" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">walked to work.</text><rect x="635" y="390" width="220" height="265" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="653" y="422.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">B: new estate,</text><text x="653" y="444.75" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">edge</text><text x="653" y="468.775" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Goods move by lorry,</text><text x="653" y="489.23499999999996" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">so fast ring-road</text><text x="653" y="509.695" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">access; cheaper land</text><text x="653" y="530.155" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">in large plots, room</text><text x="653" y="550.615" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">to expand and park.</text>
</svg>