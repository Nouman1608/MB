<rect width="900" height="1080" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The road to Pakistan, 1905–47</text>

<line x1="190" y1="124" x2="190" y2="986" stroke="#1e2a44" stroke-width="4"/><text x="168" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1905</text><circle cx="190" cy="140" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="214" y="146" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Partition of Bengal; Hindu agitation against it</text><text x="168" y="178" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1906</text><circle cx="190" cy="172" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="214" y="178" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Simla Deputation (1 Oct) asks for separate electorates</text><rect x="204" y="184" width="666" height="30" rx="8" fill="#f2e7b8"/><text x="168" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1906</text><circle cx="190" cy="204" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="214" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">All-India Muslim League founded at Dhaka (Dec)</text><text x="168" y="242" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1909</text><circle cx="190" cy="236" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="214" y="242" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Morley–Minto Reforms: separate electorates</text><text x="168" y="274" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1916</text><circle cx="190" cy="268" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="214" y="274" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Lucknow Pact: Congress accepts separate electorates</text><text x="168" y="306" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1919</text><circle cx="190" cy="300" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="214" y="306" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Rowlatt Act; Amritsar Massacre; Montagu–Chelmsford Reforms</text><text x="168" y="338" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1920</text><circle cx="190" cy="332" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="214" y="338" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Hijrat to Afghanistan ends in hardship</text><text x="168" y="370" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1922</text><circle cx="190" cy="364" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="214" y="370" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Chauri Chaura: Gandhi suspends Non-Cooperation</text><text x="168" y="402" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1924</text><circle cx="190" cy="396" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="214" y="402" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Turkey abolishes the caliphate</text><text x="168" y="434" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1927</text><circle cx="190" cy="428" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="214" y="434" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Delhi Proposals</text><text x="168" y="466" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1928</text><circle cx="190" cy="460" r="8" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="214" y="466" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Nehru Report</text><text x="168" y="498" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1929</text><circle cx="190" cy="492" r="8" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="214" y="498" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Jinnah’s 14 Points (March)</text><text x="168" y="530" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1930</text><circle cx="190" cy="524" r="8" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="214" y="530" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">First Round Table Conference; Iqbal’s idea of a Muslim homeland</text><text x="168" y="562" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1931</text><circle cx="190" cy="556" r="8" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="214" y="562" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Second Round Table Conference</text><text x="168" y="594" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1932</text><circle cx="190" cy="588" r="8" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="214" y="594" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Third Round Table Conference; Communal Award</text><text x="168" y="626" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1933</text><circle cx="190" cy="620" r="8" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><text x="214" y="626" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Rahmat Ali’s pamphlet: the name “Pakistan”</text><text x="168" y="658" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1935</text><circle cx="190" cy="652" r="8" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="214" y="658" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Government of India Act</text><text x="168" y="690" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1937</text><circle cx="190" cy="684" r="8" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="214" y="690" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Elections: Congress ministries in most provinces</text><text x="168" y="722" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1939</text><circle cx="190" cy="716" r="8" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="214" y="722" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Congress ministries resign: Day of Deliverance</text><rect x="204" y="728" width="666" height="30" rx="8" fill="#f2e7b8"/><text x="168" y="754" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1940</text><circle cx="190" cy="748" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="214" y="754" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pakistan Resolution (23 March)</text><text x="168" y="786" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1942</text><circle cx="190" cy="780" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="214" y="786" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Cripps Mission</text><text x="168" y="818" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end"></text><circle cx="190" cy="812" r="7" fill="#f4f6f6" stroke="#b5602e" stroke-width="3"/><text x="214" y="818" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Quit India: Congress leaders arrested</text><text x="168" y="850" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1944</text><circle cx="190" cy="844" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="214" y="850" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Gandhi–Jinnah talks</text><text x="168" y="882" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1945</text><circle cx="190" cy="876" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="214" y="882" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Simla Conference</text><text x="168" y="914" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1945–46</text><circle cx="190" cy="908" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="214" y="914" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Elections: League wins every Muslim seat in the central assembly</text><text x="168" y="946" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1946</text><circle cx="190" cy="940" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="214" y="946" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Cabinet Mission; Direct Action Day (16 August)</text><rect x="204" y="952" width="666" height="30" rx="8" fill="#f2e7b8"/><text x="168" y="978" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">1947</text><circle cx="190" cy="972" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="214" y="978" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">3 June Plan; Indian Independence Act (July)</text><circle cx="48" cy="1020" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="62" y="1026" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">KQ6 Early development</text><circle cx="257.6" cy="1020" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="271.6" y="1026" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">KQ7 Khilafat</text><circle cx="398.79999999999995" cy="1020" r="8" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="412.79999999999995" y="1026" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">KQ8 1927–39</text><circle cx="532.4" cy="1020" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="546.4" y="1026" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">KQ9 1940–47</text><circle cx="666" cy="1020" r="8" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><text x="680" y="1026" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">KQ10 Leaders</text><text x="450" y="1056" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Events in order; spacing is not to scale. Hollow dot: no date given in the lesson.</text>
</svg>