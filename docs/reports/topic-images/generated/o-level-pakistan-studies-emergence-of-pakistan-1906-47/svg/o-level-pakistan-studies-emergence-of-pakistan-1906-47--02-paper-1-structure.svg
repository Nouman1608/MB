ize="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation essay</text><rect x="30" y="610" width="840" height="210" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="648" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Building the 14-mark answer</text><rect x="60" y="670" width="170" height="80" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="145" y="702" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Factor named in</text><text x="145" y="724" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the question</text><line x1="233" y1="710" x2="256" y2="710" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="260" y="670" width="170" height="80" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="345" y="702" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Second factor</text><line x1="433" y1="710" x2="456" y2="710" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="670" width="170" height="80" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="545" y="702" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Third factor</text><line x1="633" y1="710" x2="656" y2="710" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="660" y="670" width="170" height="80" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="745" y="702" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reasoned</text><text x="745" y="724" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">judgement</text><text x="60" y="790" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Explain at least three factors with accurate detail, then finish with a judgement.</text>
