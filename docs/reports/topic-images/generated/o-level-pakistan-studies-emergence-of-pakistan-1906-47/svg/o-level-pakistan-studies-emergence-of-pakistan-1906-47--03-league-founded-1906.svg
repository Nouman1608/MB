<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 778" width="900" height="778" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="778" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Muslim League was founded</text>

<text x="450" y="132" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">CAUSES</text><rect x="30" y="148" width="270" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="46" y="176" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sir Syed’s advice</text><text x="46" y="202" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Muslims should stay out of</text><text x="46" y="224.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Congress</text><line x1="165" y1="282" x2="390" y2="352" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="315" y="148" width="270" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="331" y="176" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Partition of Bengal</text><text x="331" y="202" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Hindu agitation against the</text><text x="331" y="224.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">1905 partition</text><line x1="450" y1="282" x2="450" y2="352" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="600" y="148" width="270" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="616" y="176" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Simla Deputation</text><text x="616" y="202" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">1 October 1906: the Aga Khan</text><text x="616" y="224.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">asks Lord Minto for separate</text><text x="616" y="246.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">electorates, with success</text><line x1="735" y1="282" x2="510" y2="352" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="220" y="360" width="460" height="96" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" /><text x="450" y="398" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">All-India Muslim League founded</text><text x="450" y="428" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Dhaka, December 1906</text><line x1="450" y1="460" x2="450" y2="498" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="522" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">AIMS</text><rect x="30" y="538" width="270" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="568" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Protect Muslim political</text><text x="46" y="591.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">rights</text><rect x="315" y="538" width="270" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="331" y="568" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Encourage loyalty to the</text><text x="331" y="591.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">British</text><rect x="600" y="538" width="270" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="616" y="568" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Promote good relations</text><text x="616" y="591.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">with other communities</text><rect x="30" y="646" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="682" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="60" y="710" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Bengal was the trigger, but the deeper cause was the need to protect Muslim</text><text x="60" y="733" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">interests as elected councils expanded.</text>
</svg>