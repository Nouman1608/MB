<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From the Nehru Report to the 14 Points</text>

<rect x="30" y="116" width="195" height="96" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="127.5" y="148" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Simon Commission</text><text x="127.5" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">no Indian members</text><line x1="227" y1="164" x2="243" y2="164" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="245" y="116" width="195" height="96" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="342.5" y="148" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Nehru Report</text><text x="342.5" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1928</text><line x1="442" y1="164" x2="458" y2="164" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="116" width="195" height="96" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="557.5" y="148" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Jinnah’s amendments</text><text x="557.5" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rejected at the</text><text x="557.5" y="193" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">All-Parties Convention</text><line x1="657" y1="164" x2="673" y2="164" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="675" y="116" width="195" height="96" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="772.5" y="148" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">14 Points</text><text x="772.5" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">March 1929</text><rect x="260" y="250" width="295" height="46" rx="10" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5" /><text x="407.5" y="280" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Nehru Report (1928)</text><rect x="565" y="250" width="305" height="46" rx="10" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5" /><text x="717.5" y="280" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">14 Points (1929)</text><rect x="30" y="308" width="220" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="44" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Electorates</text><rect x="260" y="308" width="295" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="274" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rejected separate electorates</text><rect x="565" y="308" width="305" height="52" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2" /><text x="579" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Separate electorates</text><rect x="30" y="370" width="220" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="44" y="398" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Muslim share of</text><text x="44" y="420" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">central seats</text><rect x="260" y="370" width="295" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="274" y="398" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rejected the one-third Muslim</text><text x="274" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">share</text><rect x="565" y="370" width="305" height="74" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2" /><text x="579" y="398" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One-third Muslim representation</text><text x="579" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">in the central legislature</text><rect x="30" y="454" width="220" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="44" y="482" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Power</text><rect x="260" y="454" width="295" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="274" y="482" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A strong centre</text><rect x="565" y="454" width="305" height="74" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2" /><text x="579" y="482" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Federal system; residual powers</text><text x="579" y="504" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">for the provinces</text><rect x="30" y="538" width="220" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="44" y="566" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Muslim culture</text><rect x="260" y="538" width="295" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="407.5" y="566" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">–</text><rect x="565" y="538" width="305" height="74" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2" /><text x="579" y="566" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Protection of Muslim culture,</text><text x="579" y="588" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">religion and personal law</text>
</svg>