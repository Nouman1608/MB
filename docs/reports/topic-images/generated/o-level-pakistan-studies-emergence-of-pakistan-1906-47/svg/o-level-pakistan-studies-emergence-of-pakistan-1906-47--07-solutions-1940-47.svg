<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 892" width="900" height="892" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="892" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From the Pakistan Resolution to partition</text>

<rect x="40" y="478" width="136" height="122" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="108" y="506" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1940</text><text x="108" y="532" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan</text><text x="108" y="552" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Resolution</text><text x="108" y="576" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">23 March</text><rect x="178" y="416" width="136" height="184" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="246" y="444" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1942</text><text x="246" y="470" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Cripps Mission</text><text x="246" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rejected by both</text><text x="246" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">parties</text><rect x="316" y="354" width="136" height="246" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="384" y="382" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="384" y="408" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Quit India</text><text x="384" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Congress leaders</text><text x="384" y="451" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">arrested; League</text><text x="384" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">grows</text><rect x="454" y="292" width="136" height="308" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="522" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1944</text><text x="522" y="346" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Gandhi–Jinnah</text><text x="522" y="366" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">talks</text><text x="522" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">failed</text><rect x="592" y="230" width="136" height="370" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="660" y="258" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1945</text><text x="660" y="284" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Simla</text><text x="660" y="304" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Conference</text><text x="660" y="328" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">failed</text><rect x="730" y="168" width="136" height="432" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="798" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1945–46</text><text x="798" y="222" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Elections</text><text x="798" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">League wins</text><text x="798" y="265" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">every Muslim</text><text x="798" y="284" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">seat in the</text><text x="798" y="303" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">central assembly</text><text x="40" y="150" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">League strength</text><text x="40" y="174" font-size="17" font-weight="400" fill="#8a6d0d" text-anchor="start">grows with each failure</text><line x1="40" y1="622" x2="860" y2="622" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="650" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Each failed solution strengthened the League’s position (heights are schematic)</text><text x="450" y="694" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">British policy changes: the League can no longer be treated as one party among many</text><rect x="30" y="710" width="200" height="162" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="738" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">1946</text><text x="44" y="764" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cabinet Mission</text><text x="44" y="791" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Three-tier federation;</text><text x="44" y="810" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">broke down when the</text><text x="44" y="829" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">League withdrew</text><line x1="231" y1="785" x2="242" y2="785" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="243" y="710" width="200" height="162" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="257" y="738" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">16 Aug 1946</text><text x="257" y="764" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Direct Action Day</text><text x="257" y="791" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Violence followed</text><line x1="444" y1="785" x2="455" y2="785" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="456" y="710" width="200" height="162" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="470" y="738" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">1947</text><text x="470" y="764" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">3 June Plan</text><text x="470" y="791" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Mountbatten accepts</text><text x="470" y="810" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">partition</text><line x1="657" y1="785" x2="668" y2="785" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="669" y="710" width="200" height="162" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="683" y="738" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">July 1947</text><text x="683" y="764" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Indian Independence</text><text x="683" y="785" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Act</text><text x="683" y="812" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Boundaries drawn by</text><text x="683" y="831" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the Radcliffe</text><text x="683" y="850" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Commission</text>
</svg>