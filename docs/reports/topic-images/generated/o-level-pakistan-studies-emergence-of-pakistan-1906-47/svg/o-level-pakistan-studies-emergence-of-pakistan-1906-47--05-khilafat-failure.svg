<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 870" width="900" height="870" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="870" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Khilafat Movement failed</text>

<rect x="30" y="110" width="840" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Aim</text><text x="120" y="148" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Ottoman caliph should keep control of the holy places after Turkey’s defeat in</text><text x="120" y="171" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the First World War.</text><text x="60" y="214" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Led by Maulana Muhammad Ali Jauhar and Maulana Shaukat Ali</text><line x1="120" y1="270" x2="120" y2="678" stroke="#1e2a44" stroke-width="4"/><circle cx="120" cy="306" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="120" y="313.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="70" y="312" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end"></text><rect x="160" y="270" width="710" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="180" y="302" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Delegations to Britain rejected</text><text x="180" y="330" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Britain rejected the appeal.</text><circle cx="120" cy="398" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="120" y="405.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="70" y="404" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1920</text><rect x="160" y="362" width="710" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="180" y="394" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hijrat to Afghanistan</text><text x="180" y="422" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ended in hardship when Afghanistan closed its border.</text><circle cx="120" cy="490" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="497.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="70" y="496" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1922</text><rect x="160" y="454" width="710" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="180" y="486" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Chauri Chaura</text><text x="180" y="514" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Gandhi suspended Non-Cooperation, breaking the joint campaign.</text><circle cx="120" cy="582" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="120" y="589.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="70" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end"></text><rect x="160" y="546" width="710" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="180" y="578" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Moplah uprising</text><text x="180" y="606" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Soured Muslim–Hindu relations.</text><circle cx="120" cy="674" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="681.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="70" y="680" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1924</text><rect x="160" y="638" width="710" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="180" y="670" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Turkey abolished the caliphate</text><text x="180" y="698" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The cause itself was gone.</text><rect x="30" y="740" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="778" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Weighing the causes</text><text x="60" y="808" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Turkey’s decision ended the cause itself, but Gandhi’s withdrawal had already broken the</text><text x="60" y="831" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">movement’s strength.</text>
</svg>