<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three contributors to the Pakistan Movement</text>

<rect x="30" y="110" width="270" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="270" height="56" rx="14" fill="#2e6b62"/><rect x="30" y="150" width="270" height="16" fill="#2e6b62"/><text x="165" y="147" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Jinnah</text><circle cx="52" cy="194" r="5" fill="#2e6b62"/><text x="66" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reorganised the League</text><text x="66" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">after 1934</text><circle cx="52" cy="252" r="5" fill="#2e6b62"/><text x="66" y="258" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The 14 Points</text><circle cx="52" cy="288" r="5" fill="#2e6b62"/><text x="66" y="294" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The 1940 Resolution</text><circle cx="52" cy="324" r="5" fill="#2e6b62"/><text x="66" y="330" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Leadership in the 1945–46</text><text x="66" y="352" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">elections</text><circle cx="52" cy="382" r="5" fill="#2e6b62"/><text x="66" y="388" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Negotiations of 1946–47</text><rect x="46" y="430" width="238" height="62" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="165" y="468" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Made it a political reality</text><rect x="315" y="110" width="270" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="315" y="110" width="270" height="56" rx="14" fill="#2b5a9a"/><rect x="315" y="150" width="270" height="16" fill="#2b5a9a"/><text x="450" y="147" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Allama Iqbal</text><circle cx="337" cy="194" r="5" fill="#2b5a9a"/><text x="351" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The idea of a Muslim</text><text x="351" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">homeland in 1930</text><circle cx="337" cy="252" r="5" fill="#2b5a9a"/><text x="351" y="258" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Letters urging Jinnah to</text><text x="351" y="280" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lead</text><rect x="331" y="430" width="238" height="62" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="450" y="468" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Shaped the idea</text><rect x="600" y="110" width="270" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="600" y="110" width="270" height="56" rx="14" fill="#8a6d0d"/><rect x="600" y="150" width="270" height="16" fill="#8a6d0d"/><text x="735" y="147" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Rahmat Ali</text><circle cx="622" cy="194" r="5" fill="#8a6d0d"/><text x="636" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The name “Pakistan”</text><circle cx="622" cy="230" r="5" fill="#8a6d0d"/><text x="636" y="236" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The 1933 pamphlet</text><circle cx="622" cy="266" r="5" fill="#8a6d0d"/><text x="636" y="272" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">But little political</text><text x="636" y="294" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">influence</text><rect x="616" y="430" width="238" height="62" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="735" y="468" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Shaped the idea</text><rect x="30" y="530" width="840" height="74" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="575" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Iqbal and Rahmat Ali shaped the idea; Jinnah made it a political reality.</text>
</svg>