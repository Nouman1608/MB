<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Muslim–Hindu relations, 1916–27</text>

<rect x="30" y="110" width="840" height="490" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="160" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">closer</text><text x="54" y="548" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">further</text><text x="54" y="568" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">apart</text><line x1="76" y1="528" x2="76" y2="176" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/><path d="M170,230 L390,262 L600,470 L800,400" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round"/><circle cx="170" cy="230" r="10" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><circle cx="390" cy="262" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="600" cy="470" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="800" cy="400" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="286" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">1916</text><text x="140" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lucknow Pact</text><text x="140" y="330" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Congress accepts</text><text x="140" y="352" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">separate electorates</text><text x="390" y="196" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Khilafat and Non-Cooperation</text><text x="390" y="218" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">co-operation continues</text><text x="600" y="512" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">After 1922: breakdown</text><text x="600" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">communal riots; shuddhi and sangathan;</text><text x="600" y="556" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">tabligh and tanzim responses</text><text x="850" y="296" font-size="16" font-weight="700" fill="#4a5568" text-anchor="end">1927</text><text x="850" y="318" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Delhi Proposals</text><text x="850" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">final Muslim offer: joint</text><text x="850" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">electorates for safeguards</text><text x="450" y="626" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic: the line shows the direction of change, not a measured value.</text>
</svg>