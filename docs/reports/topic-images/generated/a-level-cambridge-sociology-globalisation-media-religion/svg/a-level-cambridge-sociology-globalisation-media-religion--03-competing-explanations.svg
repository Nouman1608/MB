<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 673" width="900" height="673" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="673" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Debates to weigh in each section</text>

<text x="317" y="132" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">One view</text><text x="675" y="132" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Competing view</text><rect x="30" y="150" width="145" height="78" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="102" y="195" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalisation</text><rect x="185" y="150" width="265" height="78" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="317" y="194" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Global cultural influences</text><rect x="550" y="150" width="320" height="78" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="710" y="183" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Persistence or revival of local</text><text x="710" y="205" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and national identities</text><path d="M462,189 L538,189" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)" marker-start="url(#ahO)"/><text x="500" y="179" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">weigh</text><rect x="30" y="240" width="145" height="100" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="102" y="296" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Media</text><rect x="185" y="240" width="265" height="100" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="317" y="273" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Media shape audience</text><text x="317" y="295" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">attitudes and behaviour</text><text x="317" y="317" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">directly</text><rect x="550" y="240" width="320" height="100" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="710" y="284" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Audiences actively select and</text><text x="710" y="306" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">interpret media content</text><path d="M462,290 L538,290" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)" marker-start="url(#ahO)"/><text x="500" y="280" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">weigh</text><rect x="30" y="352" width="145" height="78" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="102" y="397" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Religion</text><rect x="185" y="352" width="265" height="78" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="317" y="385" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Religion maintains social</text><text x="317" y="407" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">cohesion</text><rect x="550" y="352" width="320" height="78" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="710" y="385" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Religion is a source of social</text><text x="710" y="407" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">change and conflict</text><path d="M462,391 L538,391" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)" marker-start="url(#ahO)"/><text x="500" y="381" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">weigh</text><rect x="30" y="442" width="145" height="78" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="102" y="487" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Secularisation</text><rect x="185" y="442" width="265" height="78" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="317" y="475" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Religion’s social influence</text><text x="317" y="497" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">has declined</text><rect x="550" y="442" width="320" height="78" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="710" y="475" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Evidence and counter-evidence: a</text><text x="710" y="497" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">debated question</text><path d="M462,481 L538,481" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)" marker-start="url(#ahO)"/><text x="500" y="471" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">weigh</text><rect x="30" y="538" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="574" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">In every section</text><text x="56" y="603" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weigh competing explanations against each other instead of describing one view as</text><text x="56" y="625" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">uncontested, and apply them to a specific, named, contemporary example.</text>
</svg>