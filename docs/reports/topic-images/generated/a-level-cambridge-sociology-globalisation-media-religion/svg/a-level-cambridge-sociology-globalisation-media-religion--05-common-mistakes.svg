<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="546" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Common mistakes and how to fix them</text>

<rect x="30" y="104" width="416" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="238" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Mistake</text><rect x="454" y="104" width="416" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="662" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Do this instead</text><rect x="30" y="156" width="416" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Globalisation treated as purely economic</text><rect x="454" y="156" width="416" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Discuss its cultural and identity</text><text x="468" y="209.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">consequences</text><rect x="30" y="238" width="416" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One theory of media influence presented as</text><text x="44" y="291.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">simply true</text><rect x="454" y="238" width="416" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weigh it as one of several competing</text><text x="468" y="291.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">explanations</text><rect x="30" y="320" width="416" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Secularisation treated as a settled fact</text><rect x="454" y="320" width="416" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Debate it with evidence on more than one side</text><rect x="30" y="380" width="416" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="411.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No reference to research methods</text><rect x="454" y="380" width="416" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="411.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Show how a claim could actually be studied</text><rect x="30" y="440" width="416" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="471.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Only textbook cases from decades past</text><rect x="454" y="440" width="416" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="471.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Add a specific, plausible contemporary</text><text x="468" y="493.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">example</text>
</svg>