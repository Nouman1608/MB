<text x="40" y="168" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">AS Level</text><rect x="200" y="130" width="158" height="76" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="279" y="175" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1</text><rect x="370" y="130" width="158" height="76" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="449" y="175" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2</text><text x="40" y="278" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Full A Level</text><rect x="200" y="240" width="158" height="76" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="279" y="285" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1</text><rect x="370" y="240" width="158" height="76" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="449" y="285" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2</text><rect x="540" y="240" width="158" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="619" y="285" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 3</text><rect x="710" y="240" width="158" height="76" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3.5"/><text x="789" y="273" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 4</text><text x="789" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">A Level only</text><line x1="789" y1="330" x2="789" y2="370" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="380" width="268" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="422" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">1 h 45 min</text><text x="164" y="452" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">duration</text><rect x="316" y="380" width="268" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="422" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">70 marks</text><text x="450" y="452" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">two 35-mark essays</text><rect x="602" y="380" width="268" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="422" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">29%</text><text x="736" y="452" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of the full A Level</text><rect x="30" y="496" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="532" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Answer 2 essays, each from a different section</text><text x="56" y="561" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each section carries two essay questions. Every essay needs AO1, AO2 and AO3 and should</text><text x="56" y="583" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">explore contrasting views or evidence.</text>
