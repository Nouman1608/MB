<rect width="900" height="484" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Linking a claim to a research method</text>

<text x="450" y="124" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Question: the influence of social media on young people’s identities</text><rect x="30" y="150" width="184.5" height="169" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="122.25" y="213.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Perspective</text><text x="122.25" y="243.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Select a named view</text><text x="122.25" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">of media influence</text><line x1="218.5" y1="234.5" x2="244.5" y2="234.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="150" width="184.5" height="169" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="340.75" y="182.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Apply</text><text x="340.75" y="212.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Curated</text><text x="340.75" y="233.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">self-presentation</text><text x="340.75" y="254.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">may reshape a</text><text x="340.75" y="275.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">stable, singular</text><text x="340.75" y="296.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">identity</text><line x1="437" y1="234.5" x2="463" y2="234.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="150" width="184.5" height="169" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="559.25" y="203.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Method</text><text x="559.25" y="233.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Suggest how a</text><text x="559.25" y="254.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">sociologist could</text><text x="559.25" y="275.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">research it</text><line x1="655.5" y1="234.5" x2="681.5" y2="234.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="150" width="184.5" height="169" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="777.75" y="203.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Limitation</text><text x="777.75" y="233.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Social media use is</text><text x="777.75" y="254.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">private and</text><text x="777.75" y="275.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">platform-dependent</text><rect x="30" y="349" width="840" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="56" y="385" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Weak answer</text><text x="56" y="414" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Describes social media’s features and asserts it “has a big influence”, with no perspective</text><text x="56" y="436" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and no method.</text>
</svg>