<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 4: three sections, six headings</text>

<rect x="30" y="110" width="268" height="88" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="164" y="146" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Section A</text><text x="164" y="178" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalisation</text><line x1="164" y1="200" x2="164" y2="238" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="238" width="268" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="290" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="297.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="96" y="274" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Key debates,</text><text x="96" y="296" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">concepts and</text><text x="96" y="318" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">perspectives</text><line x1="164" y1="342" x2="164" y2="366" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="366" width="268" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="418" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="425.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="96" y="424" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Contemporary issues</text><rect x="316" y="110" width="268" height="88" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="146" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Section B</text><text x="450" y="178" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Media</text><line x1="450" y1="200" x2="450" y2="238" stroke="#1e2a44" stroke-width="2.5"/><rect x="316" y="238" width="268" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="350" cy="290" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="350" y="297.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text><text x="382" y="285" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Ownership and</text><text x="382" y="307" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">control of media</text><line x1="450" y1="342" x2="450" y2="366" stroke="#1e2a44" stroke-width="2.5"/><rect x="316" y="366" width="268" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="350" cy="418" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="350" y="425.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">10</text><text x="382" y="402" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Media</text><text x="382" y="424" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">representation and</text><text x="382" y="446" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">effects</text><rect x="602" y="110" width="268" height="88" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="736" y="146" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Section C</text><text x="736" y="178" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Religion</text><line x1="736" y1="200" x2="736" y2="238" stroke="#1e2a44" stroke-width="2.5"/><rect x="602" y="238" width="268" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="636" cy="290" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="636" y="297.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">11</text><text x="668" y="285" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Religion and social</text><text x="668" y="307" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">order</text><line x1="736" y1="342" x2="736" y2="366" stroke="#1e2a44" stroke-width="2.5"/><rect x="602" y="366" width="268" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="636" cy="418" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="636" y="425.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">12</text><text x="668" y="413" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">The influence of</text><text x="668" y="435" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">religion</text><rect x="30" y="500" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="536" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Lettered sections</tspan> (A, B, C) are how the paper is structured; <tspan font-weight="700">numbered headings</tspan> (7–12) are</text><text x="56" y="558" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">how the syllabus numbers its content. Do not conflate the two systems.</text>
</svg>