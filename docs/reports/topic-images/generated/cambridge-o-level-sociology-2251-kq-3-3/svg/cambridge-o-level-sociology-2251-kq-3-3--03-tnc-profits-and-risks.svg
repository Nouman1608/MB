<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 522" width="900" height="522" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="522" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Transnational companies: who gains, who pays?</text>

<rect x="340" y="134" width="220" height="100" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="174.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Transnational</text><text x="450" y="202.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">company</text><rect x="650" y="110" width="220" height="148" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RICHER COUNTRIES</text><text x="670" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Shareholders</text><text x="670" y="198.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Profits flow here</text><rect x="30" y="110" width="220" height="181" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">POORER COUNTRIES</text><text x="50" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Local</text><text x="50" y="196" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">communities</text><text x="50" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Low wages, weak</text><text x="50" y="245.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">regulation: risks</text><text x="50" y="266.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fall here</text><line x1="564" y1="184" x2="642" y2="184" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="603" y="172" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">profits</text><line x1="336" y1="184" x2="258" y2="184" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="297" y="172" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">costs</text><text x="450" y="260" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">brings jobs, investment, technology</text><text x="450" y="310" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">but environmental and human costs are left behind</text><rect x="30" y="336" width="411" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="369" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BHOPAL, INDIA, DECEMBER 1984</text><text x="50" y="394.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gas leak at the Union Carbide</text><text x="50" y="418.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">pesticide plant</text><text x="50" y="446.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Killed thousands; many more left with</text><text x="50" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">long-term illness.</text><rect x="459" y="336" width="411" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="369" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NIGER DELTA, NIGERIA</text><text x="479" y="394.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Oil spills linked to companies</text><text x="479" y="418.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">including Shell</text><text x="479" y="446.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Damaged farmland and fishing for local</text><text x="479" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">communities.</text>
</svg>