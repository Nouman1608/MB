<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 438" width="900" height="438" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="438" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two more explanations</text>

<rect x="30" y="104" width="408" height="304" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COLONIALISM</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Patterns that outlast</text><text x="50" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">independence</text><text x="50" y="218.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="218.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">European states seized colonies from the</text><text x="65.2" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">16th to 20th centuries; Berlin, 1884–1885,</text><text x="65.2" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">settled the carving up of Africa</text><text x="50" y="287.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economies built to export raw materials</text><text x="65.2" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and cash crops</text><text x="50" y="335.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Local industries undermined; borders drawn</text><text x="65.2" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with little regard for people</text><text x="50" y="383.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Debts and trade relationships continue</text><rect x="462" y="104" width="408" height="304" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FEMINISM</text><text x="482" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Patriarchy between societies</text><text x="482" y="192.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women do much unpaid farming and domestic</text><text x="497.2" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work but own a small share of land</text><text x="482" y="240.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Export factories employ young women at low</text><text x="497.2" y="261.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wages</text><text x="482" y="288.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hochschild (2000): global care chains,</text><text x="497.2" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women migrate to care for children in</text><text x="497.2" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">richer countries while their own are cared</text><text x="497.2" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for by others</text>
</svg>