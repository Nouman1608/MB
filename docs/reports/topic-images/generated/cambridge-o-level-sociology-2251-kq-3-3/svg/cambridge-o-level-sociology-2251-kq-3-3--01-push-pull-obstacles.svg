<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" width="900" height="524" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="524" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why people migrate: push, pull and obstacles</text>

<rect x="30" y="110" width="275" height="254" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PLACE OF ORIGIN</text><text x="50" y="170" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Push factors</text><text x="50" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unemployment and low wages</text><text x="50" y="224.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conflict and persecution</text><text x="50" y="250.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Environmental disaster,</text><text x="65.2" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drought, rising seas</text><text x="50" y="297.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="297.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lack of education and</text><text x="65.2" y="318.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">opportunity</text><rect x="595" y="110" width="275" height="254" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DESTINATION</text><text x="615" y="170" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Pull factors</text><text x="615" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="630.2" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jobs and higher wages</text><text x="615" y="224.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="630.2" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Safety and political</text><text x="630.2" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">freedom</text><text x="615" y="271.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="630.2" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Better services,</text><text x="630.2" y="292.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">healthcare, education</text><text x="615" y="318.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="630.2" y="318.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family and community</text><text x="630.2" y="339.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">already settled</text><rect x="360" y="130" width="180" height="214" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="309" y1="237" x2="354" y2="237" stroke="#1e2a44" stroke-width="6" marker-end="url(#ah)"/><line x1="546" y1="237" x2="589" y2="237" stroke="#1e2a44" stroke-width="6" marker-end="url(#ah)"/><text x="450" y="187" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Obstacles</text><text x="450" y="223" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">cost</text><text x="450" y="247" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">distance</text><text x="450" y="271" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">visas</text><text x="450" y="295" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">family ties</text><rect x="30" y="382" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="418" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Lee (1966): intervening obstacles</text><text x="50" y="447.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Obstacles explain why the poorest often cannot migrate at all: it takes money, documents</text><text x="50" y="469.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and contacts. So migration can widen inequality within sending societies.</text>
</svg>