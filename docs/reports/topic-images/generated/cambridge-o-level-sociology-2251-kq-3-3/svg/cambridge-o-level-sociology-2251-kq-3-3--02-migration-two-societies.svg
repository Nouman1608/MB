<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 518" width="900" height="518" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="518" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One move, two societies affected</text>

<rect x="30" y="104" width="408" height="286" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RECEIVING SOCIETY</text><text x="50" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Immigration</text><text x="50" y="194.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ Fills labour shortages: construction,</text><text x="50" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">care, health, agriculture</text><text x="50" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ Migrants pay taxes and start businesses</text><text x="50" y="269.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ Cultural diversity and hybrid identities</text><text x="50" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Migrants concentrated in low-paid,</text><text x="50" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">insecure work</text><text x="50" y="344.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Negative perceptions and scapegoating feed</text><text x="50" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">discrimination</text><rect x="462" y="104" width="408" height="286" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SENDING SOCIETY</text><text x="482" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Emigration</text><text x="482" y="194.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ Remittances support family consumption,</text><text x="482" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">education and housing</text><text x="482" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ An important income source for some</text><text x="482" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">countries</text><text x="482" y="290.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Brain drain: doctors, nurses and engineers</text><text x="482" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leave</text><text x="482" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Weakens services in societies that paid</text><text x="482" y="359.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for their training</text><rect x="30" y="408" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="441.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Example: Britain recruited workers from the Caribbean and South Asia after the Second World</text><text x="50" y="463.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">War; the Empire Windrush (1948) symbolises this period.</text>
</svg>