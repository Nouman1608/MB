<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="632" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why ecological problems fall unequally</text>

<text x="154.66666666666669" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Issue</text><text x="450.00000000000006" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Why it is unequal</text><text x="745.3333333333334" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Example</text><rect x="30" y="140" width="249.33333333333334" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Climate change</text><line x1="285.33333333333337" y1="206.5" x2="319.33333333333337" y2="206.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="140" width="249.33333333333334" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Industrialised countries</text><text x="341.33333333333337" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">emitted most, but poorer</text><text x="341.33333333333337" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ones can least afford sea</text><text x="341.33333333333337" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">walls, irrigation or</text><text x="341.33333333333337" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relocation</text><line x1="580.6666666666667" y1="206.5" x2="614.6666666666667" y2="206.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="140" width="249.33333333333334" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rising seas threaten</text><text x="636.6666666666667" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tuvalu and the Maldives</text><rect x="30" y="287" width="249.33333333333334" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pollution</text><line x1="285.33333333333337" y1="343" x2="319.33333333333337" y2="343" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="287" width="249.33333333333334" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Concentrated where</text><text x="341.33333333333337" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regulation is weakest;</text><text x="341.33333333333337" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">poorer residents cannot</text><text x="341.33333333333337" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">move away</text><line x1="580.6666666666667" y1="343" x2="614.6666666666667" y2="343" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="287" width="249.33333333333334" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">E-waste burned at</text><text x="636.6666666666667" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Agbogbloshie, Accra, Ghana</text><rect x="30" y="413" width="249.33333333333334" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Urbanisation</text><line x1="285.33333333333337" y1="458.5" x2="319.33333333333337" y2="458.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="413" width="249.33333333333334" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fastest in lower-income</text><text x="341.33333333333337" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">countries; growth outpaces</text><text x="341.33333333333337" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing and services</text><line x1="580.6666666666667" y1="458.5" x2="614.6666666666667" y2="458.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="413" width="249.33333333333334" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dharavi, Mumbai: crowded,</text><text x="636.6666666666667" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">limited sanitation</text><rect x="30" y="522" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="555.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Climate justice: those who caused least harm often suffer most. Climate change can also</text><text x="50" y="577.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">become a push factor for migration.</text>
</svg>