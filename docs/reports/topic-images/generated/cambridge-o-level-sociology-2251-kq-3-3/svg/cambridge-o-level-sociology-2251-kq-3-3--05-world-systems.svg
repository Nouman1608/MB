<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Marxist views: wealth flows to the core</text>

<circle cx="250" cy="340" r="215" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="250" cy="340" r="140" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="250" cy="340" r="68" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="347" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Core</text><text x="250" y="242" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Semi-periphery</text><text x="250" y="168" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Periphery</text><line x1="250" y1="540" x2="250" y2="416" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="262" y="490" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">wealth</text><rect x="490" y="110" width="380" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="510" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WALLERSTEIN: WORLD-SYSTEMS</text><text x="510" y="169.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Core, semi-periphery, periphery</text><text x="510" y="197.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The periphery supplies cheap labour and</text><text x="510" y="218.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">raw materials; wealth flows to the core</text><text x="510" y="239.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">through trade and TNC profits.</text><rect x="490" y="280" width="380" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="510" y="313" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FRANK: DEPENDENCY THEORY</text><text x="510" y="339.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Metropolis and satellite</text><text x="510" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rich nations developed by exploiting poor</text><text x="510" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ones: the “development of</text><text x="510" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">underdevelopment”.</text>
</svg>