<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 701" width="900" height="701" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="701" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Do TNCs increase inequality between societies?</text>

<line x1="215" y1="165" x2="685" y2="143" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,154 L420,246 L480,246 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="154" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="165" x2="160" y2="220" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="165" x2="270" y2="220" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,220 L290,220 Q275,247 215,247 Q155,247 140,220 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="143" x2="630" y2="198" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="143" x2="740" y2="198" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,198 L760,198 Q745,225 685,225 Q625,225 610,198 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="269" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">FOR</text><text x="685" y="247" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">AGAINST</text><rect x="30" y="282" width="405" height="259" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="318" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">For</text><text x="50" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Profits flow to shareholders in richer</text><text x="66.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">countries</text><text x="50" y="396.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="396.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Low wages and weak safety standards;</text><text x="66.15" y="418.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Bhopal</text><text x="50" y="445.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="445.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Marxists: TNCs are the main channel of</text><text x="66.15" y="467.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">exploitation</text><text x="50" y="494.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="494.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Feminists: reliance on low-paid women’s</text><text x="66.15" y="516.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">labour</text><rect x="465" y="282" width="405" height="259" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="318" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Against</text><text x="485" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Create jobs, pay taxes, transfer skills</text><text x="501.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and technology</text><text x="485" y="396.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="396.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Some poorer countries grew through</text><text x="501.15" y="418.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">export manufacturing</text><text x="485" y="445.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="445.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Other causes: colonial history,</text><text x="501.15" y="467.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">conflict, climate</text><rect x="30" y="559" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="595" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="624.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">TNCs bring benefits, but the terms they operate on tend to favour richer societies, so they</text><text x="50" y="646.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">more often widen than narrow global gaps.</text>
</svg>