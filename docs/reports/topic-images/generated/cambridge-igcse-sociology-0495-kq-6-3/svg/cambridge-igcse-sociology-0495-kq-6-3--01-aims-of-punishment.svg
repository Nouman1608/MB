<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 653" width="900" height="653" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="653" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five aims of punishment</text>

<line x1="60" y1="130" x2="850" y2="130" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="275" cy="130" r="9" fill="#1e2a44"/><text x="275" y="160" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the crime</text><text x="70" y="160" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LOOKS TO THE PAST</text><text x="845" y="160" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">LOOKS TO THE FUTURE</text><rect x="290" y="180" width="280" height="178" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="310" y="215.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Protection of</text><text x="310" y="240.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">citizens</text><text x="310" y="268.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Keeping the public safe</text><text x="310" y="295.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. restraining order</text><rect x="585" y="180" width="280" height="178" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="605" y="215.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Deterrence</text><text x="605" y="243.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fear of punishment:</text><text x="605" y="264.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">individual (the offender) and</text><text x="605" y="285.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">general (everyone else)</text><text x="605" y="312.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. heavy drink-driving</text><text x="605" y="333.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fines</text><rect x="290" y="370" width="280" height="157" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="310" y="405.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Incapacitation</text><text x="310" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Removing the ability to</text><text x="310" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">offend</text><text x="310" y="481.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. prison; driving ban</text><rect x="585" y="370" width="280" height="157" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="605" y="405.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Rehabilitation</text><text x="605" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Changing the offender so they</text><text x="605" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stop</text><text x="605" y="481.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. education and therapy in</text><text x="605" y="502.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prison</text><rect x="30" y="180" width="230" height="347" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="216" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Retribution</text><text x="50" y="244.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Deserved payback, in</text><text x="50" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">proportion to the crime</text><text x="50" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. a long sentence</text><text x="50" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for serious violence</text><rect x="30" y="545" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="578.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Aims can conflict: a long sentence may satisfy retribution and incapacitation but undermine</text><text x="50" y="600.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rehabilitation by weakening family ties and job prospects.</text>
</svg>