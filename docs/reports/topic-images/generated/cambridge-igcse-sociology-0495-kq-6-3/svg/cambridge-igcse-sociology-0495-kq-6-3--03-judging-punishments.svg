<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 698" width="900" height="698" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="698" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judging punishments: three tests</text>

<rect x="30" y="104" width="272" height="108" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="166" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1 Does it meet its</text><text x="166" y="174.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">aim?</text><rect x="314" y="104" width="272" height="108" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2 What are the side</text><text x="450" y="174.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">effects?</text><rect x="598" y="104" width="272" height="108" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="734" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3 Is it fair and</text><text x="734" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">consistent with human</text><text x="734" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">rights?</text><rect x="30" y="230" width="220" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="260" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Punishment</text><rect x="250" y="230" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="262" y="260" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strengths</text><rect x="540" y="230" width="330" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="552" y="260" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitations</text><rect x="30" y="276" width="220" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="300.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Prison</text><rect x="250" y="276" width="290" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="300.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Incapacitates while inside;</text><text x="262" y="320.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">expresses retribution</text><rect x="540" y="276" width="330" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="300.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Expensive; often fails to rehabilitate;</text><text x="552" y="320.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“school for crime”</text><rect x="30" y="338" width="220" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="362.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Community sentence,</text><text x="42" y="382.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">probation</text><rect x="250" y="338" width="290" height="62" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="262" y="362.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Cheaper; keeps family and work</text><text x="262" y="382.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ties, supporting rehabilitation</text><rect x="540" y="338" width="330" height="62" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="552" y="362.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Seen as soft, so deterrence may be</text><text x="552" y="382.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">limited</text><rect x="30" y="400" width="220" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="424.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Fines</text><rect x="250" y="400" width="290" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="424.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Quick, cheap; can deter minor</text><text x="262" y="444.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">offending</text><rect x="540" y="400" width="330" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="424.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Heavier for the poor (some countries</text><text x="552" y="444.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">scale to income); unpaid fines bring</text><text x="552" y="464.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">more sanctions</text><rect x="30" y="482" width="220" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="506.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Tagging, curfews,</text><text x="42" y="526.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">restraining orders</text><rect x="250" y="482" width="290" height="62" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="262" y="506.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Restrict movement without prison;</text><text x="262" y="526.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">protect victims</text><rect x="540" y="482" width="330" height="62" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="552" y="506.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Depend on monitoring; breaches may go</text><text x="552" y="526.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">unnoticed</text><rect x="30" y="544" width="220" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="568.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Capital punishment</text><rect x="250" y="544" width="290" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="262" y="568.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Supporters cite retribution and</text><text x="262" y="588.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">deterrence</text><rect x="540" y="544" width="330" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="568.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Irreversible; weak deterrence evidence;</text><text x="552" y="588.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">applied unequally</text><rect x="30" y="606" width="220" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="630.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Social media,</text><text x="42" y="650.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">vigilantes</text><rect x="250" y="606" width="290" height="62" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="262" y="630.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">May expose wrongdoing police</text><text x="262" y="650.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ignore</text><rect x="540" y="606" width="330" height="62" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="552" y="630.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Bypass due process; wrong targets;</text><text x="552" y="650.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">harassment or violence</text>
</svg>