<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Policing strategies compared</text>

<line x1="70" y1="258" x2="830" y2="258" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="60" y="300" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Community style</text><text x="840" y="300" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">Military style</text><circle cx="114" cy="258" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><line x1="114" y1="247" x2="114" y2="234" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,106)"><rect x="30" y="0" width="270" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Community policing</text><text x="165" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Local officers build</text><text x="165" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">relationships and solve</text><text x="165" y="92" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">problems; more trust and</text><text x="165" y="112" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">information</text></g><circle cx="450" cy="258" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="269" x2="450" y2="328" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,328)"><rect x="315" y="0" width="270" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Targeting, stop and</text><text x="450" y="47.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">search</text><text x="450" y="74" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Detects crime, removes weapons;</text><text x="450" y="94" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">risks stereotyping and lost</text><text x="450" y="114" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">trust</text></g><circle cx="786" cy="258" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><line x1="786" y1="247" x2="786" y2="234" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,126)"><rect x="600" y="0" width="270" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Military style</text><text x="735" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Armed units, armoured vehicles,</text><text x="735" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">force; quick order but</text><text x="735" y="92" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">alienates and escalates</text></g><rect x="30" y="476" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="509" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ZERO TOLERANCE</text><text x="50" y="534.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wilson and Kelling’s “broken windows”: New York, 1990s</text><text x="50" y="562.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Crime fell, but it also fell in many cities with different approaches, so the cause is debated.</text><rect x="30" y="605" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="638.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Societies balance these differently, and the same society may use both community and</text><text x="50" y="660.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">military style policing.</text>
</svg>