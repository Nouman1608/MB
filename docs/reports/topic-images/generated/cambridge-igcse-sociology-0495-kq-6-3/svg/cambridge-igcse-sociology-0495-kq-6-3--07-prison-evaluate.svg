<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 679" width="900" height="679" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="679" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is prison the most effective way of dealing with crime?</text>

<line x1="215" y1="154" x2="685" y2="154" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,154 L420,246 L480,246 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="154" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="154" x2="160" y2="209" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="154" x2="270" y2="209" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,209 L290,209 Q275,236 215,236 Q155,236 140,209 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="154" x2="630" y2="209" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="154" x2="740" y2="209" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,209 L760,209 Q745,236 685,236 Q625,236 610,209 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="258" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">FOR PRISON</text><text x="685" y="258" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">ALTERNATIVES</text><rect x="30" y="282" width="405" height="237" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="318" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">For the view</text><text x="50" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Incapacitation protects citizens during</text><text x="66.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the sentence</text><text x="50" y="396.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="396.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Retribution satisfies victims and the</text><text x="66.15" y="418.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">public</text><text x="50" y="445.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="445.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">May deter some potential offenders</text><rect x="465" y="282" width="405" height="237" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="318" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Against the view</text><text x="485" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Reoffending after release is common</text><text x="485" y="374.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="374.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Far more expensive than community</text><text x="501.15" y="396.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sentences</text><text x="485" y="423.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="423.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">School for crime; breaks family and job</text><text x="501.15" y="445.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">ties</text><text x="485" y="472.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="472.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Alternatives may cut reoffending more</text><text x="501.15" y="494.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">for less serious offenders</text><rect x="30" y="537" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="573" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="602.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Effective for incapacitating dangerous offenders, less effective than alternatives for</text><text x="50" y="624.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rehabilitation: it depends on the aim and the offence.</text>
</svg>