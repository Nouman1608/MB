<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="616" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Preventing crime and watching for it</text>

<rect x="30" y="104" width="410" height="188" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SITUATIONAL (CLARKE)</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reduce opportunities</text><text x="50" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Locks, alarms, street lighting, design</text><text x="50" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ Cheap; works for opportunistic property</text><text x="50" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crime</text><text x="50" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Displaces crime; ignores root causes</text><rect x="460" y="104" width="410" height="188" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SOCIAL</text><text x="480" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Tackle causes</text><text x="480" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Youth clubs, education, employment schemes</text><text x="480" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ Addresses causes such as poverty</text><text x="480" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Takes longer to show results</text><rect x="30" y="310" width="840" height="138" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="343" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">SURVEILLANCE</text><text x="50" y="368.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">CCTV, number plate and facial recognition, phone and online data</text><text x="50" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ Deters and detects; Foucault: people change behaviour when they think they are watched</text><text x="50" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Privacy and civil liberties; bias in automated systems; displacement</text><rect x="30" y="466" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="491" width="260" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="200" y="520" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Watched area</text><text x="200" y="544" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">crime falls</text><rect x="570" y="491" width="260" height="70" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="700" y="520" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Unwatched area</text><text x="700" y="544" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">crime moves here</text><line x1="340" y1="526" x2="560" y2="526" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="450" y="514" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">displacement</text>
</svg>