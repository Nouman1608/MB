<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 501" width="900" height="501" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="501" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How punishment has changed: two theories</text>

<rect x="30" y="104" width="395" height="136" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DURKHEIM: SIMPLE SOCIETIES</text><text x="50" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Retributive</text><text x="50" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Harsh punishment expresses collective</text><text x="50" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">outrage</text><line x1="431" y1="172" x2="469" y2="172" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="104" width="395" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURKHEIM: COMPLEX SOCIETIES</text><text x="495" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Restitutive</text><text x="495" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Justice that aims to repair harm</text><rect x="30" y="258" width="395" height="115" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="291" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FOUCAULT: SOVEREIGN POWER</text><text x="50" y="318.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Public and bodily</text><text x="50" y="348.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. public execution</text><line x1="431" y1="315.5" x2="469" y2="315.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="258" width="395" height="115" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="291" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOUCAULT: DISCIPLINARY POWER</text><text x="495" y="318.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Watching and reforming</text><text x="495" y="348.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prisons, records and surveillance</text><rect x="30" y="391" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="424.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Durkheim: punishment reaffirms shared values. Marxists add that punishment falls most</text><text x="50" y="446.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">heavily on the working class.</text>
</svg>