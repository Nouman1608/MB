<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 499" width="900" height="499" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="499" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Punishments that remove, hurt or warn</text>

<rect x="30" y="104" width="410" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="140" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Exile</text><text x="50" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Forces the offender to leave</text><text x="50" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. British transportation to Australia,</text><text x="50" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1788–1868</text><rect x="460" y="104" width="410" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="140" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Ostracism</text><text x="480" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Excludes them while they stay</text><text x="480" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. shunning in some close-knit religious</text><text x="480" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">communities</text><text x="450" y="279" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Both protect the group and express disapproval, but remove rather than reform</text><rect x="30" y="305" width="410" height="164" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="341" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Corporal punishment</text><text x="50" y="369.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. judicial caning in Singapore</text><text x="50" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intended to deter and punish</text><text x="50" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most societies see it as a human rights</text><text x="50" y="444.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">violation; no rehabilitation</text><rect x="460" y="305" width="410" height="164" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="341" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Police cautions</text><text x="480" y="369.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A formal warning for minor offences</text><text x="480" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Avoids a court record and labelling</text><text x="480" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics: repeated cautions signal leniency</text>
</svg>