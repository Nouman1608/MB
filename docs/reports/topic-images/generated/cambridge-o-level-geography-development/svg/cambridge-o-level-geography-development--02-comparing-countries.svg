<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Compare with calculations, not lists</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Illustrative countries P, Q and R from the worked example</text>
<text x="40" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">GNP per capita (US$)</text><text x="70" y="178" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">P</text><rect x="95" y="156" width="520" height="30" rx="4" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="625" y="177" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">45,000</text><text x="70" y="218" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Q</text><rect x="95" y="196" width="138.66666666666666" height="30" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="243.66666666666666" y="217" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">12,000</text><text x="70" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">R</text><rect x="95" y="236" width="17.333333333333332" height="30" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="122.33333333333333" y="257" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">1,500</text><text x="40" y="315" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Life expectancy (years)</text><text x="70" y="353" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">P</text><rect x="95" y="331" width="473.77777777777777" height="30" rx="4" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="578.7777777777778" y="352" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">82</text><text x="70" y="393" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Q</text><rect x="95" y="371" width="439.1111111111111" height="30" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="544.1111111111111" y="392" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">76</text><text x="70" y="433" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">R</text><rect x="95" y="411" width="358.22222222222223" height="30" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="463.22222222222223" y="432" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">62</text><text x="40" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Adult literacy (%)</text><text x="70" y="528" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">P</text><rect x="95" y="506" width="514.8" height="30" rx="4" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="619.8" y="527" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">99</text><text x="70" y="568" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Q</text><rect x="95" y="546" width="488.8" height="30" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="593.8" y="567" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">94</text><text x="70" y="608" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">R</text><rect x="95" y="586" width="286" height="30" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="391" y="607" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">55</text><rect x="640" y="175" width="230" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="658" y="208.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">P is 30 times R</text><text x="658" y="233.525" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">45,000 vs 1,500 US$</text><rect x="700" y="345" width="170" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="718" y="378.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">20 years</text><text x="718" y="403.52500000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">longer life in</text><text x="718" y="424.64500000000004" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">P than R (82 vs</text><text x="718" y="445.76500000000004" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">62)</text><rect x="30" y="650" width="840" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="688" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Q earns about a quarter of P’s income …</text><text x="55" y="718" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">… yet its life expectancy is only 6 years lower. Health care can improve</text><text x="55" y="742" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">faster than income at middle levels of development.</text>
</svg>