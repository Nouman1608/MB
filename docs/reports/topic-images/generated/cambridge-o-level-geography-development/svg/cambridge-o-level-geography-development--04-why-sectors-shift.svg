<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="572" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why jobs move from sector to sector</text>

<rect x="30" y="115" width="260" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="115" width="260" height="14" rx="7" fill="#d4b02e"/><circle cx="66" cy="168" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="175.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Low development</text><text x="96" y="186" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start">Primary dominates</text><line x1="50" y1="210" x2="270" y2="210" stroke="#c9d6d4" stroke-width="2"/><text x="52" y="244" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="68" y="244" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Most people farm,</text><text x="68" y="265" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">largely for subsistence</text><text x="52" y="298" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="68" y="298" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Little capital or</text><text x="68" y="319" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">technology</text><line x1="294" y1="285" x2="316" y2="285" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="115" width="260" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="320" y="115" width="260" height="14" rx="7" fill="#b5d3cf"/><circle cx="356" cy="168" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="356" y="175.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="386" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Industrialising</text><text x="386" y="186" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start">Secondary grows</text><line x1="340" y1="210" x2="560" y2="210" stroke="#c9d6d4" stroke-width="2"/><text x="342" y="244" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="358" y="244" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Machines on farms</text><text x="358" y="265" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">release labour</text><text x="342" y="298" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="358" y="298" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Factory jobs pay more,</text><text x="358" y="319" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">so workers move</text><text x="342" y="352" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="358" y="352" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Investment, often from</text><text x="358" y="373" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">TNCs, builds factories</text><line x1="584" y1="285" x2="606" y2="285" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="115" width="260" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="610" y="115" width="260" height="14" rx="7" fill="#2e6b62"/><circle cx="646" cy="168" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="646" y="175.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="676" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">High development</text><text x="676" y="186" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start">Tertiary and quaternary</text><line x1="630" y1="210" x2="850" y2="210" stroke="#c9d6d4" stroke-width="2"/><text x="632" y="244" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="648" y="244" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Rising incomes create</text><text x="648" y="265" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">demand for services</text><text x="632" y="298" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="648" y="298" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Manufacturing automated</text><text x="648" y="319" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">or moved abroad</text><text x="648" y="340" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">(deindustrialisation)</text><rect x="30" y="475" width="840" height="72" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="518" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain = the cause of the change + its effect on employment</text>
</svg>