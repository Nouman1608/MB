<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A TNC case study in one picture: Toyota</text>

<rect x="270" y="118" width="360" height="92" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="152" font-size="18" font-weight="700" fill="#f2e7b8" text-anchor="middle">Headquarters and research</text><text x="450" y="182" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle">Toyota City, Aichi Prefecture, Japan</text><rect x="30" y="262" width="560" height="140" rx="14" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="7 6"/><text x="44" y="284" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">UK</text><rect x="610" y="262" width="260" height="140" rx="14" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="7 6"/><text x="624" y="284" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">USA</text><rect x="45" y="296" width="255" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="63" y="328.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Burnaston, near Derby</text><text x="63" y="353.675" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">car plant</text><line x1="450" y1="212" x2="172" y2="292" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="296" width="255" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="338" y="328.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Deeside, North Wales</text><text x="338" y="353.675" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">engine plant</text><line x1="450" y1="212" x2="447" y2="292" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="625" y="296" width="255" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="643" y="328.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Georgetown, Kentucky</text><text x="643" y="353.675" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">large car plant</text><line x1="450" y1="212" x2="752" y2="292" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="438" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Why locate abroad?</text><rect x="30" y="456" width="201" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130.5" y="485.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Inside major markets</text><rect x="243" y="456" width="201" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="343.5" y="485.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Avoid import tariffs</text><rect x="456" y="456" width="201" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="556.5" y="485.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower transport costs</text><rect x="669" y="456" width="201" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="769.5" y="485.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Skilled local workers</text><rect x="30" y="530" width="410" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="565" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+ For the host country</text><text x="48" y="590.575" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Direct jobs, and many more in component</text><text x="48" y="612.355" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">suppliers (a multiplier effect); training;</text><text x="48" y="634.135" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">export earnings.</text><rect x="460" y="530" width="410" height="132" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="565" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">– For the host country</text><text x="478" y="590.575" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Decisions are made in Japan and profits</text><text x="478" y="612.355" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">return there; the host is exposed if</text><text x="478" y="634.135" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">production is cut.</text>
</svg>