<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One number or three? The HDI</text>

<rect x="40" y="130" width="290" height="66" rx="33" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Life expectancy</text><text x="185" y="183" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">health</text><line x1="336" y1="163" x2="488" y2="248" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="40" y="216" width="290" height="66" rx="33" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="246" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Education</text><text x="185" y="269" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">knowledge</text><line x1="336" y1="249" x2="488" y2="248" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="40" y="302" width="290" height="66" rx="33" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="332" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Income</text><text x="185" y="355" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">standard of living</text><line x1="336" y1="335" x2="488" y2="248" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="495" y="200" width="220" height="96" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="605" y="240" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">HDI</text><text x="605" y="272" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">composite index</text><line x1="500" y1="352" x2="840" y2="352" stroke="#1e2a44" stroke-width="4"/><line x1="500" y1="340" x2="500" y2="364" stroke="#1e2a44" stroke-width="3"/><line x1="840" y1="340" x2="840" y2="364" stroke="#1e2a44" stroke-width="3"/><text x="500" y="392" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><text x="840" y="392" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="670" y="392" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a value from 0 to 1</text><line x1="605" y1="300" x2="605" y2="340" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="460" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Why no single indicator is enough</text><rect x="30" y="480" width="410" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="514.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rich from oil exports</text><text x="48" y="539.725" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">High GNP per capita, yet literacy among</text><text x="48" y="561.505" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">women can be low.</text><rect x="460" y="480" width="410" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="514.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Modest income</text><text x="478" y="539.725" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Yet high life expectancy, thanks to good</text><text x="478" y="561.505" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">primary health care.</text><text x="450" y="625" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Still national averages, and leaves out factors such as political freedom.</text>
</svg>