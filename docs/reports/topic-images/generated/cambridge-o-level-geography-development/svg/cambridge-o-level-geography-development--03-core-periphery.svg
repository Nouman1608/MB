<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why wealth gathers in a core region</text>

<rect x="30" y="110" width="510" height="480" rx="14" fill="#b5d3cf"/><path d="M60,210 Q70,135 190,132 L410,138 Q478,146 488,230 L492,470 Q486,560 380,568 L150,566 Q66,560 60,460 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><ellipse cx="410" cy="345" rx="78" ry="110" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3" stroke-dasharray="9 6"/><text x="410" y="285" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">CORE</text><path d="M395,318 l6,14 l15,1 l-12,9 l4,15 l-13,-8 l-13,8 l4,-15 l-12,-9 l15,-1 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="410" y="378" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">capital</text><rect x="470" y="395" width="50" height="22" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="495" y="440" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">port</text><path d="M375,425 L375,407 L387,399.8 L387,407 L399,399.8 L399,407 L411,399.8 L411,425 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2" stroke-linejoin="round"/><rect x="402" y="385.4" width="5.3999999999999995" height="18" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="420" y="405" width="21" height="16.799999999999997" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M417.9,405 L430.5,395.9 L443.1,405 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="170" y="330" font-size="20" font-weight="700" fill="#4a5568" text-anchor="middle">PERIPHERY</text><rect x="110" y="230" width="30" height="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M107,230 L125,217 L143,230 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="220" y="470" width="30" height="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M217,470 L235,457 L253,470 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="140" y="420" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M137.6,420 L152,409.6 L166.4,420 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="250" y="210" width="24" height="19.200000000000003" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M247.6,210 L262,199.6 L276.4,210 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="200" y1="255" x2="322" y2="315" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="200" y1="400" x2="322" y2="370" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><rect x="174" y="360.75" width="129" height="20.25" rx="5" fill="#d8e3c6" opacity="1"/><text x="180" y="375" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">young workers</text><rect x="174" y="379.75" width="94.5" height="20.25" rx="5" fill="#d8e3c6" opacity="1"/><text x="180" y="394" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">migrate in</text><text x="285" y="615" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic country, not to scale</text><rect x="565" y="130" width="270" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="162" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Markets and ports</text><text x="700" y="184" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">already exist</text><line x1="700" y1="209" x2="700" y2="238" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="565" y="242" width="270" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="274" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Investment and</text><text x="700" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">infrastructure go there</text><line x1="700" y1="321" x2="700" y2="350" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="565" y="354" width="270" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="386" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Jobs draw young workers</text><text x="700" y="408" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">in</text><line x1="700" y1="433" x2="700" y2="462" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="565" y="466" width="270" height="76" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="498" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The core grows; the</text><text x="700" y="520" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">periphery lags</text><path d="M835,504 Q862,504 862,470 L862,200 Q862,168 840,168" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#ahT)"/><text x="700" y="600" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">the cycle reinforces itself</text><rect x="30" y="640" width="272" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="673.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Brazil</text><text x="48" y="697.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">south-east (São Paulo, Rio)</text><text x="48" y="718.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">ahead of the north-east</text><rect x="313" y="640" width="272" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="331" y="673.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">China</text><text x="331" y="697.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">eastern coastal provinces</text><text x="331" y="718.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">grew faster than the</text><text x="331" y="738.67" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">interior</text><rect x="596" y="640" width="272" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="673.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Urban–rural gap</text><text x="614" y="697.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">also an inequality within</text><text x="614" y="718.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">one country</text>
</svg>