<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Globalisation: what drives it, what it does</text>

<text x="30" y="136" font-size="19" font-weight="700" fill="#4a5568" text-anchor="start">Drivers</text><rect x="30" y="150" width="201" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="183.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Transport</text><text x="48" y="207.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">container ships,</text><text x="48" y="228.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">cheaper air freight</text><line x1="130" y1="278" x2="338" y2="308" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="243" y="150" width="201" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="261" y="183.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">ICT</text><text x="261" y="207.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">internet runs firms</text><text x="261" y="228.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">worldwide</text><line x1="343" y1="278" x2="412.55" y2="308" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="456" y="150" width="201" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="183.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">TNCs</text><text x="474" y="207.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">lower costs, new</text><text x="474" y="228.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">markets</text><line x1="556" y1="278" x2="487.1" y2="308" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="669" y="150" width="201" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="687" y="183.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Trade</text><text x="687" y="206.85" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">agreements</text><text x="687" y="230.875" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">tax incentives for</text><text x="687" y="251.335" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">investors</text><line x1="769" y1="278" x2="561.65" y2="308" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="150" y="310" width="600" height="80" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="342" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Globalisation</text><text x="450" y="371" font-size="15.5" font-weight="400" fill="#ffffff" text-anchor="middle">connection and interdependence: trade, investment, migration, information</text><line x1="330" y1="390" x2="240" y2="428" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="390" x2="660" y2="428" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="432" width="410" height="262" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="470" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">+ Positives</text><text x="55" y="506" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="506" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Jobs and investment</text><text x="55" y="536" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="536" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Skills and technology transferred</text><text x="55" y="566" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="566" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cheaper goods</text><text x="55" y="596" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="596" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Export earnings</text><rect x="460" y="432" width="410" height="262" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="485" y="470" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">– Negatives</text><text x="485" y="506" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="506" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Low wages, poor conditions in some</text><text x="501" y="528" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">factories</text><text x="485" y="558" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="558" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Profits leave the host country</text><text x="485" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="588" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Local firms out-competed</text><text x="485" y="618" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="618" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Job losses when factories relocate</text><text x="485" y="648" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="648" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Environmental damage</text><text x="450" y="728" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Weigh them: who gains, who loses, and at what scale?</text>
</svg>