<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 795" width="900" height="795" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="795" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criterion D: compare, evaluate, conclude</text>

<text x="450" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Evaluating the causes of a historical event</text><rect x="60" y="165" width="340" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="230" y="214.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Account 1</text><text x="230" y="241.17000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one interpretation of the event</text><rect x="500" y="165" width="340" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="670" y="214.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Account 2</text><text x="670" y="241.17000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a different interpretation</text><line x1="230" y1="280" x2="360" y2="336" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="670" y1="280" x2="540" y2="336" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="342" width="600" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="396.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluate each</text><text x="450" y="423.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">strengths and weaknesses of both interpretations</text><line x1="450" y1="466" x2="450" y2="510" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="516" width="600" height="110" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="565.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Substantiated conclusion</text><text x="450" y="592.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">which interpretation the available evidence best supports</text><rect x="30" y="660" width="410" height="105" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="696.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weaker</text><text x="48" y="723.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Presents one interpretation as simply correct,</text><text x="48" y="744.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">without comparison.</text><rect x="460" y="660" width="410" height="105" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="696.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Stronger</text><text x="478" y="723.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Compares at least two perspectives before</text><text x="478" y="744.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">judging between them.</text>
</svg>