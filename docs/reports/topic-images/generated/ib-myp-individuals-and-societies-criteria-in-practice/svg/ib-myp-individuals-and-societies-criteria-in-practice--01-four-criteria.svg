<rect width="900" height="728" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four MYP Individuals and Societies criteria</text>

<rect x="30" y="110" width="840" height="117.92000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="168.96" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="179.04000000000002" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="136" y="150.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Knowing and understanding</text><text x="136" y="177.73999999999998" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Apply factual and conceptual knowledge accurately to unfamiliar contexts, with</text><text x="136" y="200.17999999999998" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">precise terminology.</text><rect x="30" y="241.92000000000002" width="840" height="117.92000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="300.88" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="310.96" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="136" y="282.62" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Investigating</text><text x="136" y="309.66" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Develop a systematic research question and process, working independently and</text><text x="136" y="332.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">collaboratively.</text><rect x="30" y="373.84000000000003" width="840" height="117.92000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="432.80000000000007" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="442.88000000000005" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="136" y="414.54" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Communicating</text><text x="136" y="441.58000000000004" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Organise, document and communicate learning in a suitable format, with correct</text><text x="136" y="464.02000000000004" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">referencing.</text><rect x="30" y="505.76000000000005" width="840" height="117.92000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="564.72" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="574.8000000000001" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="136" y="546.4600000000002" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Thinking critically</text><text x="136" y="573.5000000000001" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Analyse and evaluate the process and findings, weigh perspectives, reach</text><text x="136" y="595.9400000000002" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">substantiated conclusions.</text><rect x="30" y="643.6800000000001" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="675.7800000000001" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One set of criteria for history, geography, economics and the other disciplines.</text>
</svg>