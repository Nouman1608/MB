<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criterion B: a systematic investigation</text>

<text x="30" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Investigating a local environmental issue</text><rect x="30" y="158" width="410" height="126" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="194.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weaker</text><text x="48" y="221.17000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Uses one or two easily found sources, with no</text><text x="48" y="242.29000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">comment on their reliability.</text><rect x="460" y="158" width="410" height="126" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="194.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Stronger</text><text x="478" y="221.17000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Poses a clear, specific question, consults a</text><text x="478" y="242.29000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">range of source types and evaluates each one</text><text x="478" y="263.41" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">before concluding.</text><text x="30" y="318" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">The stronger process</text><rect x="30" y="336" width="840" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="374.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Clear, specific research question</text><line x1="450" y1="398" x2="160" y2="435" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="441" width="260" height="72" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="160" y="484.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Government report</text><line x1="160" y1="517" x2="160" y2="541" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="398" x2="450" y2="435" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="441" width="260" height="72" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="484.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">News article</text><line x1="450" y1="517" x2="450" y2="541" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="398" x2="740" y2="435" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="441" width="260" height="72" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="740" y="473.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Firsthand community</text><text x="740" y="496.86" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">account</text><line x1="740" y1="517" x2="740" y2="541" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="547" width="840" height="66" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="588.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluate each: reliable? relevant to this question?</text><line x1="450" y1="617" x2="450" y2="655" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="661" width="400" height="58" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="698.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Draw conclusions</text>
