<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One unit, evidence for all four criteria</text>

<text x="450" y="132" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">A local-issue investigation combining history and geography</text><rect x="30" y="150" width="183" height="170" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="121.5" y="210.2" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="121.5" y="237.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">conceptual</text><text x="121.5" y="258.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">knowledge to frame</text><text x="121.5" y="279.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the issue</text><line x1="216" y1="235" x2="244" y2="235" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="249" y="150" width="183" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="340.5" y="220.7" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="340.5" y="247.82" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">researching the</text><text x="340.5" y="268.94" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">issue</text><line x1="435" y1="235" x2="463" y2="235" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="468" y="150" width="183" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="559.5" y="220.7" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="559.5" y="247.82" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">structured,</text><text x="559.5" y="268.94" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">referenced write-up</text><line x1="654" y1="235" x2="682" y2="235" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="687" y="150" width="183" height="170" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="778.5" y="210.2" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="778.5" y="237.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">critical evaluation</text><text x="778.5" y="258.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">weighing</text><text x="778.5" y="279.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">perspectives</text><path d="M340.5,330 C340.5,400 778.5,400 778.5,330" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)" stroke-dasharray="9 7"/><text x="559.5" y="425" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">D needs the perspectives that B gathered</text><rect x="30" y="455" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="486.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Revise the criteria as connected stages of one investigation, not four separate skills.</text>
