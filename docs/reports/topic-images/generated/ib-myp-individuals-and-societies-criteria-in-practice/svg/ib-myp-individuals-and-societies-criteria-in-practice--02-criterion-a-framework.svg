<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criterion A: connect facts with a concept</text>

<rect x="30" y="110" width="840" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Task: explain why a historical trade route developed where it did</text><rect x="50" y="165" width="210" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="155" y="201.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Climate</text><line x1="264" y1="193" x2="334" y2="230" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="50" y="237" width="210" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="155" y="273.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Terrain</text><line x1="264" y1="265" x2="334" y2="260" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="50" y="309" width="210" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="155" y="345.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Resources</text><line x1="264" y1="337" x2="334" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="340" y="175" width="240" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="460" y="220.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conceptual</text><text x="460" y="245.63000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">framework</text><text x="460" y="272.75" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. supply and demand,</text><text x="460" y="293.87" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">or geographic</text><text x="460" y="314.99" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">accessibility</text><line x1="584" y1="260" x2="640" y2="260" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="650" y="175" width="220" height="170" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="760" y="231.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reasoned</text><text x="760" y="256.13" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">explanation</text><text x="760" y="283.25" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">facts connected into an</text><text x="760" y="304.37" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">argument</text><rect x="50" y="380" width="820" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="460" y="411.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Transfer test: the same framework should explain a trade route you have never studied.</text><rect x="30" y="470" width="410" height="105" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="506.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weaker</text><text x="48" y="533.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">States the relevant facts (climate, terrain,</text><text x="48" y="554.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">resources) and stops: recall only.</text><rect x="460" y="470" width="410" height="105" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="506.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Stronger</text><text x="478" y="533.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Connects the facts through a conceptual</text><text x="478" y="554.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">framework to build a reasoned explanation.</text>
</svg>