<rect width="900" height="681" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What must the defendant intend or foresee?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The gap between the harm caused and the fault required</text>
<text x="325" y="142" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">force or apprehension</text><text x="475" y="142" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">some harm</text><text x="625" y="142" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">ABH</text><text x="775" y="142" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">GBH / wound</text><line x1="325" y1="152" x2="325" y2="212" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><line x1="475" y1="152" x2="475" y2="212" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><line x1="625" y1="152" x2="625" y2="212" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><line x1="775" y1="152" x2="775" y2="212" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><line x1="325" y1="276" x2="325" y2="320" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><line x1="475" y1="276" x2="475" y2="320" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><line x1="625" y1="276" x2="625" y2="320" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><line x1="775" y1="276" x2="775" y2="320" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><line x1="325" y1="384" x2="325" y2="428" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><line x1="475" y1="384" x2="475" y2="428" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><line x1="625" y1="384" x2="625" y2="428" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><line x1="775" y1="384" x2="775" y2="428" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><rect x="30" y="168" width="200" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="222" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">s47</text><rect x="311" y="178" width="328" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><circle cx="325" cy="193" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="625" cy="193" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="475" y="199" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">gap</text><text x="250" y="234" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mens rea of the assault or battery only (<tspan font-style="italic">Roberts</tspan>; <tspan font-style="italic">Savage</tspan>)</text><rect x="30" y="276" width="200" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="330" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">s20</text><rect x="461" y="286" width="328" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><circle cx="475" cy="301" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="775" cy="301" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="625" y="307" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">gap</text><text x="250" y="342" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Intention or recklessness as to <tspan font-weight="700">some</tspan> harm (<tspan font-style="italic">Mowatt</tspan>; <tspan font-style="italic">Parmenter</tspan>)</text><rect x="30" y="384" width="200" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="438" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">s18</text><rect x="761" y="394" width="28" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="775" cy="409" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="775" cy="409" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="751" y="415" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">match</text><text x="250" y="450" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Intention to cause GBH; recklessness not enough (<tspan font-style="italic">Belfon</tspan>)</text><circle cx="262" cy="508" r="9" fill="#2e6b62"/><text x="278" y="514" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">fault required</text><circle cx="432" cy="508" r="9" fill="#b5602e"/><text x="448" y="514" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">harm caused</text><rect x="30" y="540" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="574.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reform</text><text x="50" y="603.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The gaps breach <tspan font-weight="700" fill="#1e2a44">correspondence</tspan>; s47 and s20 share a five-year maximum (<tspan font-weight="700" fill="#1e2a44">fair</tspan> <tspan font-weight="700" fill="#1e2a44">labelling</tspan>). The Law</text><text x="50" y="624.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Commission’s 2015 report proposed a modern statute; not enacted.</text>
</svg>