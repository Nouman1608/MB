<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Battery: five ways force is applied</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Application of unlawful force; no injury needed</text>
<rect x="30" y="124" width="206" height="66" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="133" y="164" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Direct touch</text><rect x="250" y="124" width="620" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="150.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Any touching: <tspan font-style="italic">Collins</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Wilcock</tspan> (1984). Everyday jostling is impliedly</text><text x="264" y="171.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consented to</text><rect x="30" y="200" width="206" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="133" y="238" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Through clothing</text><rect x="250" y="200" width="620" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="235.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Touching clothes is touching the person: <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Thomas</tspan> (1985)</text><rect x="30" y="272" width="206" height="66" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="133" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Indirect force</text><rect x="250" y="272" width="620" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Haystead</tspan> (2000): baby dropped after the mother was punched. <tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">K</tspan></text><text x="264" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1990): acid in a hand dryer</text><rect x="30" y="348" width="206" height="62" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="133" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Continuing act</text><rect x="250" y="348" width="620" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="383.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Fagan</tspan> (1969): drove onto an officer’s foot and refused to move</text><rect x="30" y="420" width="206" height="62" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="133" y="458" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Omission</text><rect x="250" y="420" width="620" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="455.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Santana-Bermudez</tspan> (2003): failed to reveal a needle before a search</text><rect x="30" y="500" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="534.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mens rea</text><text x="50" y="563.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intention or subjective recklessness as to applying force (<tspan font-style="italic">Savage;</tspan> <tspan font-style="italic">Parmenter</tspan>, 1991; <tspan font-style="italic">Cunningham</tspan>, 1957).</text>
</svg>