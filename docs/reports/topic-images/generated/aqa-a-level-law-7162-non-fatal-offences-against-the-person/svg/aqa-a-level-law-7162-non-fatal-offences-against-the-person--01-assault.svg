<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" width="900" height="504" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="504" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Assault: apprehension of immediate unlawful force</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Actus reus. Mens rea: intention or subjective recklessness as to that apprehension</text>
<rect x="30" y="124" width="413" height="101" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APPREHENSION, NOT FEAR</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The victim must expect force. ✗ <tspan font-style="italic">Lamb</tspan> (1967):</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">victim did not see the threat</text><rect x="457" y="124" width="413" height="101" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMMEDIATE = IMMINENT</text><text x="473" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Smith</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Woking</tspan> (1983): looking through a bedsit</text><text x="473" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">window at night. <tspan font-style="italic">Constanza</tspan> (1997): letters</text><rect x="30" y="237" width="413" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="265" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WORDS AND SILENCE</text><text x="46" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ireland</tspan> (1997): silent telephone calls. <tspan font-style="italic">Read</tspan> <tspan font-style="italic">v</tspan></text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Coker</tspan> (1853): a conditional threat still counts</text><rect x="457" y="237" width="413" height="101" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="473" y="265" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WORDS CAN CANCEL</text><text x="473" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">✗ <tspan font-style="italic">Tuberville</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Savage</tspan> (1669): “If it were not</text><text x="473" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assize-time …”</text><rect x="30" y="350" width="413" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="378" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FAKE WEAPONS</text><text x="46" y="409.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Logdon</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">DPP</tspan> (1976): imitation gun, if the victim</text><text x="46" y="430.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">believes it real</text><rect x="457" y="350" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="378" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PENALTY</text><text x="473" y="409.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Common law offence, charged under s39</text><text x="473" y="430.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Criminal Justice Act 1988: summary, six months</text><text x="473" y="451.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">maximum</text>
</svg>