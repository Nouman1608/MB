<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="628" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Zara’s push</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Yusuf cuts his hand on a broken bottle (stitches) and sprains his wrist</text>
<rect x="30" y="124" width="840" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CLASSIFY THE HARM</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cut needing stitches: both skin layers broken = a wound (<tspan font-style="italic">Eisenhower</tspan>)</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">So s18 and s20 are possible</text><line x1="450" y1="229" x2="450" y2="249" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="267" width="86" height="66" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="73" y="308" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">s18</text><rect x="130" y="267" width="560" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="144" y="304.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intention to cause GBH? A push: no</text><rect x="706" y="267" width="164" height="66" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="788" y="307" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Fails</text><rect x="30" y="343" width="86" height="66" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="73" y="384" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">s20</text><rect x="130" y="343" width="560" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="144" y="369.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wound: yes. Inflict: yes. Foresaw some harm (<tspan font-style="italic">Mowatt</tspan>)? Near broken</text><text x="144" y="390.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">glass, possibly: for the jury</text><rect x="706" y="343" width="164" height="66" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="788" y="383" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Possible</text><rect x="30" y="419" width="86" height="66" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="73" y="460" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">s47</text><rect x="130" y="419" width="560" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="144" y="456.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Battery (the push) occasioning ABH (<tspan font-style="italic">Miller</tspan>); she intended to push</text><rect x="706" y="419" width="164" height="66" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="788" y="459" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Satisfied</text><rect x="30" y="505" width="840" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="539.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="570.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">s20 if foresight of some harm is proved; otherwise s47.</text>
</svg>