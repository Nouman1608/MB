<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Start with the injury: ABH, wound or GBH?</text>

<rect x="30" y="100" width="270" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="130" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">ABH</text><text x="165" y="152" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">s47</text><rect x="30" y="172" width="270" height="248" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">More than transient or trifling: any</text><text x="44" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hurt interfering with health or</text><text x="44" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">comfort (<tspan font-style="italic">Miller</tspan>, 1954)</text><text x="44" y="274" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="58.25" y="274" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Psychiatric injury, not mere fear</text><text x="58.25" y="294" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">or panic (<tspan font-style="italic">Chan-Fook</tspan>)</text><text x="44" y="318" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="58.25" y="318" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cutting off a substantial amount</text><text x="58.25" y="338" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of hair (<tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Smith</tspan>, 2006)</text><text x="44" y="362" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="58.25" y="362" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Brief loss of consciousness (<tspan font-style="italic">T</tspan> <tspan font-style="italic">v</tspan></text><text x="58.25" y="382" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">DPP</tspan>)</text><rect x="315" y="100" width="270" height="62" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="130" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">WOUND</text><text x="450" y="152" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">s20 / s18</text><rect x="315" y="172" width="270" height="248" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="329" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A break in <tspan font-weight="700" fill="#1e2a44">both</tspan> <tspan font-weight="700" fill="#1e2a44">layers</tspan> of the skin</text><text x="329" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">JCC</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Eisenhower</tspan>, 1984)</text><text x="329" y="254" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="343.25" y="254" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Not an internal rupture of blood</text><text x="343.25" y="274" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">vessels</text><text x="329" y="298" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="343.25" y="298" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Not a bruise</text><rect x="600" y="100" width="270" height="62" rx="12" fill="#f3d9c9" stroke="#b5602e" stroke-width="2.5"/><text x="735" y="130" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">GBH</text><text x="735" y="152" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">s20 / s18</text><rect x="600" y="172" width="270" height="248" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Really</tspan> <tspan font-weight="700" fill="#1e2a44">serious</tspan> <tspan font-weight="700" fill="#1e2a44">harm</tspan> (<tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan></text><text x="614" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Smith</tspan>, 1961); “serious harm”</text><text x="614" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">acceptable (<tspan font-style="italic">Saunders</tspan>)</text><text x="614" y="274" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="628.25" y="274" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Judged against the actual</text><text x="628.25" y="294" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">victim (<tspan font-style="italic">Bollom</tspan>)</text><text x="614" y="318" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="628.25" y="318" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Several injuries together</text><text x="628.25" y="338" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Brown</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Stratton</tspan>)</text><text x="614" y="362" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="628.25" y="362" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Serious psychiatric injury</text><text x="628.25" y="382" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Burstow</tspan>)</text><text x="614" y="406" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="628.25" y="406" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Reckless HIV infection (<tspan font-style="italic">Dica</tspan>)</text><rect x="30" y="466" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="499.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Test from the top of the ladder down: classify the harm, then try s18, s20 and s47 in turn.</text>
</svg>