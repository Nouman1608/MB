<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six components, one situation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each component answers a question, and each presses on the others</text>
<line x1="320" y1="186.86" x2="450" y2="338.58000000000004" stroke="#b5d3cf" stroke-width="4"/><line x1="320" y1="338.58000000000004" x2="450" y2="338.58000000000004" stroke="#b5d3cf" stroke-width="4"/><line x1="320" y1="490.30000000000007" x2="450" y2="338.58000000000004" stroke="#b5d3cf" stroke-width="4"/><line x1="580" y1="186.86" x2="450" y2="338.58000000000004" stroke="#b5d3cf" stroke-width="4"/><line x1="580" y1="338.58000000000004" x2="450" y2="338.58000000000004" stroke="#b5d3cf" stroke-width="4"/><line x1="580" y1="490.30000000000007" x2="450" y2="338.58000000000004" stroke="#b5d3cf" stroke-width="4"/><line x1="320" y1="186.86" x2="580" y2="186.86" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><line x1="320" y1="338.58000000000004" x2="580" y2="338.58000000000004" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><line x1="320" y1="490.30000000000007" x2="580" y2="490.30000000000007" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="30" y="122" width="290" height="129.72000000000003" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="156" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Exigence</text><text x="48" y="184.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Why</tspan> <tspan font-weight="700">now?</tspan> The event,</text><text x="48" y="207.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">problem or need that prompts</text><text x="48" y="229.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the writing.</text><rect x="30" y="273.72" width="290" height="129.72000000000003" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="307.72" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Writer</text><text x="48" y="336.57" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Who</tspan> <tspan font-weight="700">is</tspan> <tspan font-weight="700">speaking?</tspan> The person</text><text x="48" y="359.01" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">or group, with experience, role</text><text x="48" y="381.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and credibility.</text><rect x="30" y="425.44000000000005" width="290" height="129.72000000000003" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="459.44000000000005" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Audience</text><text x="48" y="488.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Who</tspan> <tspan font-weight="700">is</tspan> <tspan font-weight="700">listening?</tspan> Readers or</text><text x="48" y="510.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">listeners, with their beliefs,</text><text x="48" y="533.1700000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">values and needs.</text><rect x="580" y="122" width="290" height="129.72000000000003" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="598" y="156" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Purpose</text><text x="598" y="184.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">What</tspan> <tspan font-weight="700">should</tspan> <tspan font-weight="700">it</tspan> <tspan font-weight="700">achieve?</tspan></text><text x="598" y="207.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Persuade, inform, honour,</text><text x="598" y="229.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">warn, move to action.</text><rect x="580" y="273.72" width="290" height="129.72000000000003" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="598" y="307.72" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Context</text><text x="598" y="336.57" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Where</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">when?</tspan> The time,</text><text x="598" y="359.01" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">place and occasion of writing</text><text x="598" y="381.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and reception.</text><rect x="580" y="425.44000000000005" width="290" height="129.72000000000003" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="598" y="459.44000000000005" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Message</text><text x="598" y="488.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">What</tspan> <tspan font-weight="700">is</tspan> <tspan font-weight="700">being</tspan> <tspan font-weight="700">said?</tspan> The main</text><text x="598" y="510.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">idea or position the text</text><text x="598" y="533.1700000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">communicates.</text><circle cx="450" cy="338.58000000000004" r="92" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="320.58000000000004" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Rhetorical</text><text x="450" y="345.66" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">situation</text><text x="450" y="372.58000000000004" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic" xml:space="preserve">a web, not a list</text>
</svg>