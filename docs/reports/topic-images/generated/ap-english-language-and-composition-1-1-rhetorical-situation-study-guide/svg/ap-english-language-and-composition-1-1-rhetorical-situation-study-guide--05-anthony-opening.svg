<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Linking a choice to the situation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Susan B. Anthony, 1873</text>
<rect x="30" y="122" width="840" height="115.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="52" y="160.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“<tspan font-style="italic">Friends</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">fellow</tspan> <tspan font-style="italic">citizens</tspan>: I stand before you tonight under indictment for <tspan font-style="italic">the</tspan></text><text x="52" y="185.23000000000002" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">alleged</tspan> <tspan font-style="italic">crime</tspan> of having voted at the last presidential election, without having a lawful</text><text x="52" y="210.31" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">right to vote.”</text><rect x="30" y="267.24" width="199.5" height="137.56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="296.44" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Exigence</text><text x="44" y="323.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Indicted after voting</text><text x="44" y="345.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">in the 1872 election;</text><text x="44" y="366.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the coming trial.</text><rect x="243.5" y="267.24" width="199.5" height="137.56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="257.5" y="296.44" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Writer</text><text x="257.5" y="323.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Suffrage campaigner</text><text x="257.5" y="345.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and defendant:</text><text x="257.5" y="366.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">authority plus a</text><text x="257.5" y="387.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">personal stake.</text><rect x="457" y="267.24" width="199.5" height="137.56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="471" y="296.44" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Audience</text><text x="471" y="323.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Local citizens, a</text><text x="471" y="345.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">future jury pool,</text><text x="471" y="366.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">newspaper readers.</text><rect x="670.5" y="267.24" width="199.5" height="137.56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="684.5" y="296.44" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Context</text><text x="684.5" y="323.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">1873: women could</text><text x="684.5" y="345.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">not lawfully vote in</text><text x="684.5" y="366.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">federal elections.</text><circle cx="207.5" cy="289.24" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="207.5" y="295" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="421" cy="289.24" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="421" y="295" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="634.5" cy="289.24" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="634.5" y="295" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="848" cy="289.24" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="848" y="295" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="52" cy="470.8" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="52" y="478" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="84" y="477.8" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Link choice to situation</text><rect x="30" y="504.8" width="408" height="129.72000000000003" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="538.8" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Fellow citizens”</text><text x="48" y="567.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Assumes the very point in dispute: that she</text><text x="48" y="590.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and the women present are citizens in the</text><text x="48" y="612.53" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">full sense.</text><rect x="462" y="504.8" width="408" height="129.72000000000003" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="480" y="538.8" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The alleged crime”</text><text x="480" y="567.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Neutral legal language that sets up the</text><text x="480" y="590.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">argument that the law, not her, is on trial.</text>
</svg>