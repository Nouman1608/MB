<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Effects of deforestation</text>

<rect x="40" y="120" width="440" height="92" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="3" /><circle cx="80" cy="166" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="173.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="120" y="160" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Deforestation</text><text x="120" y="188" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">trees cleared for agriculture or fuel</text><line x1="150" y1="214" x2="200" y2="238" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="90" y="240" width="440" height="92" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="3" /><circle cx="130" cy="286" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="130" y="293.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="170" y="280" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Soil erosion</text><text x="170" y="308" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">bare ground loses its soil</text><line x1="200" y1="334" x2="250" y2="358" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="140" y="360" width="440" height="92" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="3" /><circle cx="180" cy="406" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="180" y="413.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="220" y="400" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Silting</text><text x="220" y="428" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">eroded soil builds up in rivers</text><line x1="250" y1="454" x2="300" y2="478" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="190" y="480" width="440" height="92" rx="14" fill="#ffffff" stroke="#2b5a9a" stroke-width="3" /><circle cx="230" cy="526" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="230" y="533.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="270" y="520" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="start">Flooding</text><text x="270" y="548" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the result downstream</text><rect x="650" y="140" width="220" height="320" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="760" y="176" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Possible solutions</text><circle cx="674" cy="210.39" r="5" fill="#2e6b62"/><text x="690" y="216" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Afforestation on</text><text x="690" y="238.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mountain slopes</text><text x="690" y="260.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and plateaux</text><circle cx="674" cy="290.69" r="5" fill="#2e6b62"/><text x="690" y="296.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sustainable use of</text><text x="690" y="318.40000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">forests as a</text><text x="690" y="340.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">development</text><text x="690" y="362.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">resource</text><text x="450" y="604" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Each effect causes the next: explain the links, not just the list.</text>
</svg>