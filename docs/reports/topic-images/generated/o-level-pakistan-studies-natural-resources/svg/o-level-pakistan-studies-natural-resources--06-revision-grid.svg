<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One grid for all four resources</text>

<rect x="32" y="110" width="146" height="44" rx="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><text x="44" y="139" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Resource</text><rect x="182" y="110" width="216" height="44" rx="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><text x="194" y="139" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Location</text><rect x="402" y="110" width="216" height="44" rx="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><text x="414" y="139" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Use</text><rect x="622" y="110" width="246" height="44" rx="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><text x="634" y="139" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Sustainability issue</text><rect x="32" y="162" width="146" height="68" rx="8" fill="#ffffff" stroke="#2b5a9a" stroke-width="3" /><text x="44" y="189" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="start">Water</text><rect x="182" y="162" width="216" height="68" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="194" y="189" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mangla, Tarbela and</text><text x="194" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Warsak dams; barrages</text><rect x="402" y="162" width="216" height="68" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="414" y="189" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Agricultural, industrial</text><text x="414" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and domestic</text><rect x="622" y="162" width="246" height="68" rx="8" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2" /><text x="634" y="189" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pollution, over-extraction;</text><text x="634" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conflict over supply</text><rect x="32" y="238" width="146" height="89" rx="8" fill="#ffffff" stroke="#6f9a52" stroke-width="3" /><text x="44" y="265" font-size="18" font-weight="700" fill="#6f9a52" text-anchor="start">Forests</text><rect x="182" y="238" width="216" height="89" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="194" y="265" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Plantations on the Indus</text><text x="194" y="286" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Plain; afforestation on</text><text x="194" y="307" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">slopes and plateaux</text><rect x="402" y="238" width="216" height="89" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="414" y="265" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Development resource</text><rect x="622" y="238" width="246" height="89" rx="8" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2" /><text x="634" y="265" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deforestation: soil</text><text x="634" y="286" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">erosion, silting, flooding</text><rect x="32" y="335" width="146" height="68" rx="8" fill="#ffffff" stroke="#9c8f6e" stroke-width="3" /><text x="44" y="362" font-size="18" font-weight="700" fill="#9c8f6e" text-anchor="start">Minerals</text><rect x="182" y="335" width="216" height="68" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="194" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limestone, gypsum and</text><text x="194" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rock salt sites</text><rect x="402" y="335" width="216" height="68" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="414" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Export revenue;</text><text x="414" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">industrial input</text><rect x="622" y="335" width="246" height="68" rx="8" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2" /><text x="634" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Environmental damage from</text><text x="634" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">extraction</text><rect x="32" y="411" width="146" height="89" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="3" /><text x="44" y="438" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Fish</text><rect x="182" y="411" width="216" height="89" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="194" y="438" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Balochistan and Sindh</text><text x="194" y="459" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">coasts; rivers, lakes,</text><text x="194" y="480" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fish farms</text><rect x="402" y="411" width="216" height="89" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="414" y="438" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Uses of the catch</text><rect x="622" y="411" width="246" height="89" rx="8" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2" /><text x="634" y="438" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Problems facing the</text><text x="634" y="459" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">industry</text><text x="450" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Extend each row with your own named examples and figures.</text>
</svg>