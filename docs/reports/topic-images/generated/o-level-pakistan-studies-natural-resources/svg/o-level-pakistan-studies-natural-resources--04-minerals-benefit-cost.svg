<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Minerals: benefits against costs</text>

<line x1="450" y1="170" x2="450" y2="400" stroke="#1e2a44" stroke-width="6"/><path d="M410,410 L490,410 L470,390 L430,390 Z" fill="#1e2a44"/><line x1="170" y1="180" x2="730" y2="180" stroke="#1e2a44" stroke-width="6"/><circle cx="450" cy="172" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="200" y1="180" x2="200" y2="230" stroke="#1e2a44" stroke-width="2.5"/><line x1="700" y1="180" x2="700" y2="230" stroke="#1e2a44" stroke-width="2.5"/><rect x="40" y="230" width="320" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="200" y="266" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Named benefit</text><circle cx="70" cy="298.06" r="5" fill="#2e6b62"/><text x="86" y="304" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Export revenue</text><circle cx="70" cy="331.46" r="5" fill="#2e6b62"/><text x="86" y="337.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Input for industry</text><rect x="540" y="230" width="320" height="160" rx="14" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="700" y="266" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Named environmental cost</text><text x="564" y="304" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A specific problem tied to a</text><text x="564" y="327" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">specific resource, not</text><text x="564" y="350" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“pollution is bad”</text><text x="450" y="140" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Weigh one against the other</text><rect x="30" y="436" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="472" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Know the specifics</text><rect x="54" y="490" width="136" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="122" y="516" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Limestone</text><rect x="204" y="490" width="136" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="272" y="516" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Gypsum</text><rect x="354" y="490" width="136" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="422" y="516" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Rock salt</text><text x="520" y="516" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">where each is extracted</text><text x="54" y="566" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Also: metallic vs non-metallic minerals, quantities, reserves and imports</text>
</svg>