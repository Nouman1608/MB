<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Fishing: marine and inland</text>

<rect x="30" y="110" width="410" height="240" rx="14" fill="#dfe7f2" stroke="#2b5a9a" stroke-width="2.5"/><text x="235" y="150" font-size="22" font-weight="700" fill="#2b5a9a" text-anchor="middle">Marine fishing</text><circle cx="70" cy="214.06" r="5" fill="#2b5a9a"/><text x="86" y="220" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Balochistan coast</text><circle cx="70" cy="247.46" r="5" fill="#2b5a9a"/><text x="86" y="253.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Sindh coast</text><circle cx="70" cy="280.86" r="5" fill="#2b5a9a"/><text x="86" y="286.8" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Fishing ports on both coasts</text><rect x="460" y="110" width="410" height="240" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="150" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Inland fishing</text><circle cx="500" cy="214.06" r="5" fill="#2e6b62"/><text x="516" y="220" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Rivers</text><circle cx="500" cy="247.46" r="5" fill="#2e6b62"/><text x="516" y="253.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Lakes</text><circle cx="500" cy="280.86" r="5" fill="#2e6b62"/><text x="516" y="286.8" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Fish farms</text><text x="450" y="392" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The syllabus pairs these two: answer both sides</text><rect x="30" y="410" width="380" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="220" y="456" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Improvements</text><text x="220" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">in fishing methods and processing</text><rect x="490" y="410" width="380" height="120" rx="14" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="680" y="456" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Problems</text><text x="680" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">facing the fishing industry</text><path d="M412,470 L488,470" stroke="#1e2a44" stroke-width="3.5" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="450" y1="536" x2="450" y2="570" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="576" width="400" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" /><text x="450" y="618" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sustainability and development</text>
