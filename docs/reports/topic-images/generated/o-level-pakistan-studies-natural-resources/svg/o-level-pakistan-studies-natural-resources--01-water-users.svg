<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Water: one supply, many users</text>

<rect x="30" y="130" width="250" height="300" rx="14" fill="#dfe7f2" stroke="#2b5a9a" stroke-width="2.5" /><text x="155" y="168" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="middle">Water supply</text><text x="155" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">obtained, maintained</text><text x="155" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and controlled</text><text x="155" y="262" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">e.g. dams</text><rect x="70" y="276" width="170" height="32" rx="16" fill="#ffffff" stroke="#2b5a9a" stroke-width="2" /><text x="155" y="298" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Mangla</text><rect x="70" y="316" width="170" height="32" rx="16" fill="#ffffff" stroke="#2b5a9a" stroke-width="2" /><text x="155" y="338" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Tarbela</text><rect x="70" y="356" width="170" height="32" rx="16" fill="#ffffff" stroke="#2b5a9a" stroke-width="2" /><text x="155" y="378" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Warsak</text><text x="155" y="410" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">plus barrages</text><line x1="284" y1="280" x2="486" y2="150" stroke="#2b5a9a" stroke-width="4" marker-end="url(#ah)"/><rect x="492" y="116" width="220" height="68" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="602" y="157" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Agriculture</text><line x1="284" y1="280" x2="486" y2="260" stroke="#2b5a9a" stroke-width="4" marker-end="url(#ah)"/><rect x="492" y="226" width="220" height="68" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="602" y="267" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Industry</text><line x1="284" y1="280" x2="486" y2="370" stroke="#2b5a9a" stroke-width="4" marker-end="url(#ah)"/><rect x="492" y="336" width="220" height="68" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="602" y="377" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Domestic use</text><path d="M725,130 Q765,280 725,430" fill="none" stroke="#b5602e" stroke-width="4"/><text x="772" y="262" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">compete</text><text x="772" y="284" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">for the</text><text x="772" y="304" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">same supply</text><rect x="30" y="460" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="498" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Building a water answer</text><rect x="54" y="520" width="250" height="166" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><circle cx="86" cy="558" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="86" y="565.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="116" y="552" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Name a specific</text><text x="116" y="574" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">cause</text><text x="72" y="620" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. industrial pollution</text><text x="72" y="641" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or over-extraction</text><line x1="306" y1="603" x2="324" y2="603" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="326" y="520" width="250" height="166" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><circle cx="358" cy="558" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="358" y="565.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="388" y="552" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pair it with a</text><text x="388" y="574" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">specific solution</text><text x="344" y="620" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one that fixes that cause</text><line x1="578" y1="603" x2="596" y2="603" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="598" y="520" width="250" height="166" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><circle cx="630" cy="558" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="630" y="565.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="660" y="552" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the</text><text x="660" y="574" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">conflict</text><text x="616" y="620" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between regions or user</text><text x="616" y="641" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">groups competing for the</text><text x="616" y="662" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">same supply</text>
</svg>