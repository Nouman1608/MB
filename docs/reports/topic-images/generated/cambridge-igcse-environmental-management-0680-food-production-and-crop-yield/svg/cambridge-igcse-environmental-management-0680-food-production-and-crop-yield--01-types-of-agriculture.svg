<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Classifying a farm</text>

<rect x="30" y="110" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="200" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="167.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What is</text><text x="130" y="191.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">produced?</text><rect x="250" y="126" width="190.66666666666666" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="345.3333333333333" y="165.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Arable</text><text x="345.3333333333333" y="196.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">crops</text><rect x="454.66666666666663" y="126" width="190.66666666666666" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="550" y="165.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pastoral</text><text x="550" y="196.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">livestock</text><rect x="659.3333333333333" y="126" width="190.66666666666666" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="754.6666666666666" y="165.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mixed</text><text x="754.6666666666666" y="196.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">both</text><rect x="30" y="256" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="256" width="200" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="325.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who is it for?</text><rect x="250" y="272" width="293" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="396.5" y="311.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Subsistence</text><text x="396.5" y="342.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the farmer’s family</text><rect x="557" y="272" width="293" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="703.5" y="311.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Commercial</text><text x="703.5" y="342.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">sale for profit</text><rect x="30" y="402" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="402" width="200" height="130" rx="14" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="459.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">How is it</text><text x="130" y="483.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">farmed?</text><rect x="250" y="418" width="293" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="396.5" y="447.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Intensive</text><text x="396.5" y="478.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">high inputs per small area, high</text><text x="396.5" y="498.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">output per hectare</text><rect x="557" y="418" width="293" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="703.5" y="447.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Monoculture</text><text x="703.5" y="478.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">one crop over a large area, often</text><text x="703.5" y="498.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">year after year</text><rect x="30" y="552" width="840" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="583.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The categories overlap: a large commercial farm can be intensive, arable and a</text><text x="48" y="605.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">monoculture at once; a subsistence farm is often mixed.</text>
</svg>