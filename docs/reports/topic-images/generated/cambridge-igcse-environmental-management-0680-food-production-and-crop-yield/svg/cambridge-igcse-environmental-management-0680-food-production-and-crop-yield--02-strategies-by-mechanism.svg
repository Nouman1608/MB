<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How each strategy raises yield</text>

<rect x="330" y="110" width="240" height="76" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="138.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Higher crop yield</text><text x="450" y="171.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">more food per hectare</text><polyline points="110,226 110,206 450,206 450,190" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round"/><rect x="30" y="230" width="160" height="300" rx="12" fill="#ffffff" stroke="#2b5a9a" stroke-width="2.5"/><rect x="30" y="230" width="160" height="62" rx="12" fill="#2b5a9a"/><rect x="30" y="276" width="160" height="16" rx="0" fill="#2b5a9a"/><text x="110" y="256" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Water</text><text x="42" y="322" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Trickle</text><text x="42" y="341" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">  irrigation</text><text x="42" y="374" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Rainwater</text><text x="42" y="393" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">  harvesting</text><text x="42" y="426" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Automated</text><text x="42" y="445" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">  watering</text><polyline points="282,226 282,206 450,206 450,190" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round"/><rect x="202" y="230" width="160" height="300" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><rect x="202" y="230" width="160" height="62" rx="12" fill="#8a6d0d"/><rect x="202" y="276" width="160" height="16" rx="0" fill="#8a6d0d"/><text x="282" y="256" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Nutrients</text><text x="214" y="322" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Crop rotation</text><text x="214" y="341" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">  with legumes</text><text x="214" y="374" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• NPK fertilisers</text><text x="214" y="407" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Organic</text><text x="214" y="426" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">  fertilisers</text><text x="214" y="459" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Agroforestry</text><polyline points="454,226 454,206 450,206 450,190" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round"/><rect x="374" y="230" width="160" height="300" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><rect x="374" y="230" width="160" height="62" rx="12" fill="#b5602e"/><rect x="374" y="276" width="160" height="16" rx="0" fill="#b5602e"/><text x="454" y="256" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Pests, weeds</text><text x="454" y="276" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">and disease</text><text x="386" y="322" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Mixed cropping,</text><text x="386" y="341" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">  intercropping</text><text x="386" y="374" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Pesticides</text><text x="386" y="407" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Biological</text><text x="386" y="426" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">  control</text><text x="386" y="459" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• GMOs (pest</text><text x="386" y="478" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">  resistance)</text><polyline points="626,226 626,206 450,206 450,190" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round"/><rect x="546" y="230" width="160" height="300" rx="12" fill="#ffffff" stroke="#6f9a52" stroke-width="2.5"/><rect x="546" y="230" width="160" height="62" rx="12" fill="#6f9a52"/><rect x="546" y="276" width="160" height="16" rx="0" fill="#6f9a52"/><text x="626" y="256" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Protect the</text><text x="626" y="276" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">soil</text><text x="558" y="322" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Livestock</text><text x="558" y="341" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">  rotation</text><text x="558" y="374" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Agroforestry</text><polyline points="798,226 798,206 450,206 450,190" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round"/><rect x="718" y="230" width="160" height="300" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="718" y="230" width="160" height="62" rx="12" fill="#2e6b62"/><rect x="718" y="276" width="160" height="16" rx="0" fill="#2e6b62"/><text x="798" y="256" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">More land, time</text><text x="798" y="276" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">or control</text><text x="730" y="322" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Mechanisation</text><text x="730" y="355" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Greenhouses</text><text x="730" y="388" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Hydroponics,</text><text x="730" y="407" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">  aeroponics</text><text x="730" y="440" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">• Urban farming</text><line x1="450" y1="206" x2="450" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Some strategies work in more than one way: agroforestry adds organic matter and binds the soil.</text>
</svg>