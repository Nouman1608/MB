<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The eutrophication chain</text>

<rect x="30" y="110" width="270" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="56" cy="142" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="56" y="147.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="88" y="150.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fertiliser leaches</text><text x="88" y="179.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">into a river or lake</text><line x1="302" y1="160" x2="312" y2="160" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="110" width="270" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="341" cy="142" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="341" y="147.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="373" y="140.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nutrients enrich the</text><text x="373" y="161.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">water</text><text x="373" y="190.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">nitrate and phosphate</text><line x1="587" y1="160" x2="597" y2="160" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="110" width="270" height="100" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="626" cy="142" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="626" y="147.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="658" y="150.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Algae grow rapidly</text><text x="658" y="179.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and cover the surface</text><line x1="735" y1="212" x2="735" y2="247" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="250" width="270" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="626" cy="282" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="626" y="287.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="658" y="290.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Light is blocked</text><text x="658" y="319.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">plants below die</text><line x1="598" y1="300" x2="588" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="250" width="270" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="341" cy="282" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="341" y="287.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="373" y="280.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Bacteria decompose</text><text x="373" y="309.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the dead material, using</text><text x="373" y="329.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">up oxygen</text><line x1="313" y1="300" x2="303" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="250" width="270" height="100" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><circle cx="56" cy="282" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="56" y="287.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="88" y="290.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fish and animals die</text><text x="88" y="319.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from lack of oxygen</text><rect x="30" y="380" width="840" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M60,450 Q450,600 840,450 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="150" y="446" width="600" height="14" rx="6" fill="#6f9a52"/><text x="450" y="430" font-size="16" font-weight="700" fill="#6f9a52" text-anchor="middle">algae cover the surface</text><path d="M300,530 l-12,6 m12,-6 l-4,-12" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M420,526 l-12,6 m12,-6 l-4,-12" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M560,522 l-12,6 m12,-6 l-4,-12" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M640,508 l-20,-8 0,16 z" fill="#4a5568"/><ellipse cx="660" cy="508" rx="22" ry="9" fill="#4a5568"/><text x="700" y="520" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">dead fish</text><text x="330" y="500" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">little light, low oxygen</text><path d="M30,470 L150,470" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="40" y="500" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">fertiliser</text>
</svg>