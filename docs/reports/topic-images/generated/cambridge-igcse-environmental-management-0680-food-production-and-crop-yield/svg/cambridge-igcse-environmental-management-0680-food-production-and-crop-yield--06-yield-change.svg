<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Calculating a change in yield</text>

<rect x="170" y="140" width="380" height="360" fill="#ffffff"/><line x1="170" y1="500" x2="550" y2="500" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="500" x2="170" y2="500" stroke="#1e2a44" stroke-width="2"/><text x="158" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">0.0</text><line x1="170" y1="448.57142857142856" x2="550" y2="448.57142857142856" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="448.57142857142856" x2="170" y2="448.57142857142856" stroke="#1e2a44" stroke-width="2"/><text x="158" y="454.57142857142856" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">0.5</text><line x1="170" y1="397.14285714285717" x2="550" y2="397.14285714285717" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="397.14285714285717" x2="170" y2="397.14285714285717" stroke="#1e2a44" stroke-width="2"/><text x="158" y="403.14285714285717" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">1.0</text><line x1="170" y1="345.7142857142857" x2="550" y2="345.7142857142857" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="345.7142857142857" x2="170" y2="345.7142857142857" stroke="#1e2a44" stroke-width="2"/><text x="158" y="351.7142857142857" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">1.5</text><line x1="170" y1="294.28571428571433" x2="550" y2="294.28571428571433" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="294.28571428571433" x2="170" y2="294.28571428571433" stroke="#1e2a44" stroke-width="2"/><text x="158" y="300.28571428571433" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">2.0</text><line x1="170" y1="242.85714285714283" x2="550" y2="242.85714285714283" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="242.85714285714283" x2="170" y2="242.85714285714283" stroke="#1e2a44" stroke-width="2"/><text x="158" y="248.85714285714283" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">2.5</text><line x1="170" y1="191.42857142857144" x2="550" y2="191.42857142857144" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="191.42857142857144" x2="170" y2="191.42857142857144" stroke="#1e2a44" stroke-width="2"/><text x="158" y="197.42857142857144" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">3.0</text><line x1="170" y1="140" x2="550" y2="140" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="140" x2="170" y2="140" stroke="#1e2a44" stroke-width="2"/><text x="158" y="146" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">3.5</text><path d="M170,140 L170,500 L550,500" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="0" y="0" transform="translate(108,320) rotate(-90)" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Yield (tonnes per hectare)</text><rect x="210" y="253.14285714285714" width="120" height="246.85714285714286" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="390" y="191.42857142857144" width="120" height="308.57142857142856" rx="0" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><text x="270" y="241.14285714285714" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2.4</text><text x="450" y="179.42857142857144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3.0</text><text x="270" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Before</text><text x="270" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">96 t ÷ 40 ha</text><text x="450" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">After</text><text x="450" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">120 t ÷ 40 ha</text><rect x="590" y="150" width="280" height="350" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="610" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">% increase</text><text x="610" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(3.0 − 2.4) ÷ 2.4 × 100</text><text x="610" y="246" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">= 25%</text><text x="610" y="300" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why?</text><text x="610" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Beans add nitrogen through</text><text x="610" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">their root nodules; drip</text><text x="610" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">irrigation supplies water to</text><text x="610" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">roots in dry spells. No extra</text><text x="610" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">land needed.</text><text x="450" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Invented figures: 40 ha farm, intercropping with beans plus drip irrigation.</text>
</svg>