<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="486" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Proportionality: the four Bank Mellat questions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Bank Mellat v HM Treasury (No 2) (2013), Lord Reed</text>
<line x1="60" y1="144" x2="60" y2="434" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="55" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Is the objective sufficiently important to justify limiting a fundamental right?</text><circle cx="60" cy="151.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="160.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="191" width="766" height="55" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="223.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Is the measure rationally connected to the objective?</text><circle cx="60" cy="218.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="227.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="258" width="766" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="290.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Could a less intrusive measure have been used without unacceptably</text><text x="122" y="313.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">compromising the objective?</text><text x="122" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Often where a ban fails: conditions, a warning or a narrower order may achieve the same aim.</text><circle cx="60" cy="311" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="319.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="376" width="766" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Balancing the severity of the effects on the persons affected against the</text><text x="122" y="431.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">importance of the objective, does the measure strike a fair balance?</text><circle cx="60" cy="415" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="423.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>