<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The three second paragraphs compared</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="290" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="148.23529411764707" height="49" fill="#b5d3cf"/><rect x="178.23529411764707" y="100" width="217.41176470588238" height="49" fill="#b5d3cf"/><text x="192.23529411764707" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Article 8.2</text><rect x="395.64705882352945" y="100" width="256.94117647058823" height="49" fill="#b5d3cf"/><text x="409.64705882352945" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Article 10.2</text><rect x="652.5882352941177" y="100" width="217.41176470588238" height="49" fill="#b5d3cf"/><text x="666.5882352941177" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Article 11.2</text><rect x="30" y="149" width="148.23529411764707" height="110" fill="#dce9e7"/><text x="44" y="175.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Opening words</text><rect x="178.23529411764707" y="149" width="217.41176470588238" height="110" fill="#ffffff"/><text x="192.23529411764707" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“There shall be no</text><text x="192.23529411764707" y="196.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interference by a public</text><text x="192.23529411764707" y="217.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">authority ... except”</text><rect x="395.64705882352945" y="149" width="256.94117647058823" height="110" fill="#ffffff"/><text x="409.64705882352945" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Carries with it “duties and</text><text x="409.64705882352945" y="196.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">responsibilities”; “formalities,</text><text x="409.64705882352945" y="217.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conditions, restrictions or</text><text x="409.64705882352945" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">penalties”</text><rect x="652.5882352941177" y="149" width="217.41176470588238" height="110" fill="#ffffff"/><text x="666.5882352941177" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“No restrictions shall be</text><text x="666.5882352941177" y="196.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">placed ... other than”</text><line x1="30" y1="259" x2="870" y2="259" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="259" width="148.23529411764707" height="131" fill="#dce9e7"/><text x="44" y="285.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Extra aims</text><rect x="178.23529411764707" y="259" width="217.41176470588238" height="131" fill="#f8faf9"/><text x="192.23529411764707" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economic well-being of</text><text x="192.23529411764707" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the country</text><rect x="395.64705882352945" y="259" width="256.94117647058823" height="131" fill="#f8faf9"/><text x="409.64705882352945" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Territorial integrity;</text><text x="409.64705882352945" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">information received in</text><text x="409.64705882352945" y="327.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">confidence; authority and</text><text x="409.64705882352945" y="348.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">impartiality of the judiciary</text><rect x="652.5882352941177" y="259" width="217.41176470588238" height="131" fill="#f8faf9"/><text x="666.5882352941177" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">None, but lawful</text><text x="666.5882352941177" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">restrictions on the armed</text><text x="666.5882352941177" y="327.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">forces, police or</text><text x="666.5882352941177" y="348.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">administration of the</text><text x="666.5882352941177" y="369.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">state</text></g><line x1="178.23529411764707" y1="100" x2="178.23529411764707" y2="390" stroke="#c9d6d4" stroke-width="1.5"/><line x1="395.64705882352945" y1="100" x2="395.64705882352945" y2="390" stroke="#c9d6d4" stroke-width="1.5"/><line x1="652.5882352941177" y1="100" x2="652.5882352941177" y2="390" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="290" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="412" width="840" height="177" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="444" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">AIMS SHARED BY ALL THREE</text><rect x="167.736" y="464" width="155.072" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="245.272" y="484.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">National security</text><rect x="332.808" y="464" width="124.544" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="395.08" y="484.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Public safety</text><rect x="467.352" y="464" width="264.91200000000003" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="599.808" y="484.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Prevention of disorder or crime</text><rect x="124.83999999999997" y="504" width="253.136" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="251.40799999999996" y="524.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Protection of health or morals</text><rect x="387.97599999999994" y="504" width="387.184" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="581.568" y="524.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Protection of the rights and freedoms of others</text><text x="450" y="564" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">10.2 phrases the last as protection of the reputation or rights of others</text><rect x="30" y="611" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="644.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The list of aims is <tspan font-weight="700" fill="#1e2a44">exhaustive</tspan>. Article 18: restrictions only for the purposes for which they are</text><text x="450" y="666.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">prescribed.</text>
</svg>