<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 619" width="900" height="619" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="619" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The margin of appreciation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How much room the European Court leaves the state</text>
<rect x="30" y="124" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><polygon points="170,178 170,238 715,208" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="55" y="216" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">WIDE</text><text x="845" y="216" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="end">NARROW</text><text x="450" y="152" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">national authorities are often better placed to judge local needs</text><rect x="30" y="276" width="412" height="180" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="306" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WIDE WHERE</text><text x="48" y="332.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No European consensus; moral, social or</text><text x="48" y="355.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">economic issues</text><text x="48" y="383.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Handyside</tspan> (morals)</text><text x="48" y="408.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="408.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">A,</tspan> <tspan font-style="italic">B</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">C</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ireland</tspan> (2010): abortion law</text><text x="48" y="433.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hatton</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (2003): night flights</text><rect x="458" y="276" width="412" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="306" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NARROW WHERE</text><text x="476" y="332.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An important aspect of identity or</text><text x="476" y="355.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">existence; political speech</text><text x="476" y="383.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Dudgeon</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (1981): intimate private life</text><text x="476" y="408.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="408.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Restrictions on political speech</text><rect x="30" y="478" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="512.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">An international doctrine</text><text x="450" y="541.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">English courts do not apply it as such, but give weight to Parliament’s judgment in social policy: a</text><text x="450" y="562.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">discretionary</tspan> <tspan font-weight="700" fill="#1e2a44">area</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">judgment</tspan>.</text>
</svg>