<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="546" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What does “necessary” mean?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Handyside v United Kingdom (1976)</text>
<rect x="30" y="124" width="840" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="90" y1="234" x2="810" y2="234" stroke="#1e2a44" stroke-width="4"/><text x="90" y="288" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stricter</text><text x="810" y="288" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">looser</text><circle cx="170" cy="234" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="170" y="202" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">“Indispensable”</text><text x="170" y="241" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><circle cx="450" cy="234" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="202" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“Necessary”</text><text x="450" y="241" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><circle cx="730" cy="234" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="730" y="202" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">“Reasonable” / “useful”</text><text x="730" y="241" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="450" y="284" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">implies a pressing social need</text><rect x="30" y="356" width="270.6666666666667" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="399.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pressing social need</text><rect x="314.6666666666667" y="356" width="270.6666666666667" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="388.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reasons relevant and</text><text x="450" y="411.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">sufficient</text><rect x="599.3333333333334" y="356" width="270.6666666666667" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="388.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Proportionate to the</text><text x="734.6666666666667" y="411.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">legitimate aim</text><rect x="30" y="456" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="489.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> using “necessary” to mean merely “useful” or “sensible”.</text>
</svg>