<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When Article 8 meets Article 10</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Re S (A Child) (2004), Lord Steyn’s four propositions</text>
<rect x="30" y="124" width="840" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><polygon points="450,204 416,314 484,314" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="160" y1="204" x2="740" y2="204" stroke="#1e2a44" stroke-width="5"/><path d="M200,204 L130,264 M200,204 L270,264" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M105,264 L295,264 Q200,344 105,264 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="200" y="172" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 8</text><text x="200" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">privacy</text><path d="M700,204 L630,264 M700,204 L770,264" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M605,264 L795,264 Q700,344 605,264 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="700" y="172" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 10</text><text x="700" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the press</text><text x="450" y="158" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Neither has automatic priority</text><rect x="30" y="356" width="412" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="395.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1 Neither Article has precedence</text><rect x="458" y="356" width="412" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="385.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">2 Intense focus on the comparative</text><text x="474" y="406.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">importance of the specific rights claimed</text><rect x="30" y="440" width="412" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="469.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">3 Consider the justifications for interfering</text><text x="46" y="490.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">with each</text><rect x="458" y="440" width="412" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="479.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">4 Apply the proportionality test to each</text><rect x="30" y="532" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="565.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Campbell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">MGN</tspan> (2004) applied this balancing.</text>
</svg>