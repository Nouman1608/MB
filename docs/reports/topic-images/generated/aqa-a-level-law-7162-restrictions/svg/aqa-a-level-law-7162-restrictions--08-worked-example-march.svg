<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 757" width="900" height="757" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="757" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: the banned march</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A council bans a march against an incinerator because the route passes a hospital</text>
<line x1="60" y1="144" x2="60" y2="705" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RIGHT</text><text x="122" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Article 11.1 (and 10.1)</text><text x="122" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Peaceful assembly and expression</text><circle cx="60" cy="178" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="186.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="242" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="272" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRESCRIBED BY LAW?</text><text x="122" y="298.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Likely satisfied</text><text x="122" y="327.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A statutory power under a local Act that is published and clear (<tspan font-style="italic">Sunday</tspan> <tspan font-style="italic">Times</tspan> test)</text><circle cx="60" cy="296" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="304.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="360" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="390" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEGITIMATE AIM?</text><text x="122" y="416.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Yes</text><text x="122" y="445.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Public safety; protection of the rights of others (patients)</text><circle cx="60" cy="414" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="422.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="478" width="766" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="508" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NECESSARY?</text><text x="122" y="534.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fails Bank Mellat question 3</text><text x="122" y="563.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pressing social need: some disruption near a hospital, yes. Less intrusive means: re-routing was</text><text x="122" y="584.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">offered, so a total ban fails</text><circle cx="60" cy="542.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="551.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="617" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="647" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUSION</text><text x="122" y="673.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Likely breach of Article 11</text><text x="122" y="702.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The ban was disproportionate when a condition would have met the aim</text><circle cx="60" cy="671" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="679.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>