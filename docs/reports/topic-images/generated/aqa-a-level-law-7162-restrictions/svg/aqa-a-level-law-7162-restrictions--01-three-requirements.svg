<rect width="900" height="703" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Can the state justify the interference?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Articles 8.2, 10.2 and 11.2: the burden is on the state</text>
<rect x="250" y="124" width="400" height="51" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Interference with a right in 8.1, 10.1 or 11.1</text><line x1="450" y1="179" x2="450" y2="195" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="100" y="199" width="490" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="235.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">In accordance with the law / prescribed by law</text><text x="116" y="264.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Basis in domestic law, of sufficient quality</text><circle cx="60" cy="245" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="253.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="596" y1="245" x2="676" y2="245" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="640" y="235" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><line x1="60" y1="271" x2="60" y2="335" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="74" y="319" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><rect x="100" y="337" width="490" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="373.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pursues a legitimate aim</text><text x="116" y="402.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One of the aims listed in that paragraph</text><circle cx="60" cy="383" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="391.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="596" y1="383" x2="676" y2="383" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="640" y="373" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><line x1="60" y1="409" x2="60" y2="473" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="74" y="457" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><rect x="100" y="475" width="490" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="511.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Necessary in a democratic society</text><text x="116" y="540.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pressing social need; proportionate to the aim</text><circle cx="60" cy="521" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="529.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="596" y1="521" x2="676" y2="521" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="640" y="511" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><rect x="684" y="199" width="186" height="368" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="777" y="377" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">Right</text><text x="777" y="405" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">breached</text><line x1="60" y1="573" x2="60" y2="595" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="74" y="587" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><rect x="30" y="619" width="560" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="310" y="649.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interference justified: no breach</text>
</svg>