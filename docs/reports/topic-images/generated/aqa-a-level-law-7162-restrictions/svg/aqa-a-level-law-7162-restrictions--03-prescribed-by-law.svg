<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Requirement 1: prescribed by law</text>

<rect x="30" y="100" width="840" height="189" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUNDAY TIMES v UNITED KINGDOM (1979)</text><text x="48" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A basis in domestic law, of a certain quality</text><text x="850" y="134" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">common law can satisfy it</text><rect x="50" y="175" width="392" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="246" y="227.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Adequately accessible</text><rect x="458" y="175" width="392" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="654" y="203.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sufficiently precise</text><text x="654" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">so a citizen can regulate their conduct, if need</text><text x="654" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">be with advice</text><text x="450" y="329" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">WHEN IT FAILS</text><rect x="30" y="343" width="329.6" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="373" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NO LEGAL BASIS</text><text x="48" y="399.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Malone v UK (1984)</text><text x="48" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Telephone tapping</text><rect x="375.6" y="343" width="494.4" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="393.6" y="373" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TOO BROAD</text><text x="393.6" y="399.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gillan and Quinton v UK (2010)</text><text x="393.6" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stop and search under ss44–47 Terrorism Act 2000 with no</text><text x="393.6" y="448.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasonable suspicion: insufficiently circumscribed, no</text><text x="393.6" y="469.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adequate safeguards against abuse</text><line x1="622.8" y1="500" x2="622.8" y2="546" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="375.6" y="550" width="494.4" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="391.6" y="578.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Power repealed; replaced by a narrower one under the</text><text x="391.6" y="599.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Protection</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">Freedoms</tspan> <tspan font-weight="700" fill="#1e2a44">Act</tspan> <tspan font-weight="700" fill="#1e2a44">2012</tspan></text>
</svg>