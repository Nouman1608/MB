<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why insolation falls with latitude</text>

<rect x="30" y="110" width="840" height="670" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="390" cy="440" r="214" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" stroke-dasharray="7 6"/><circle cx="390" cy="440" r="190" fill="#cfe0c0" stroke="#1e2a44" stroke-width="3"/><line x1="200" y1="440" x2="580" y2="440" stroke="#1e2a44" stroke-width="2" stroke-dasharray="8 6"/><text x="420" y="430" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">equator</text><path d="M40,415 L201.7,415 L201.7,465 L40,465 Z" fill="#d4b02e" opacity="0.55"/><line x1="40" y1="415" x2="201.65191798162638" y2="415" stroke="#8a6d0d" stroke-width="2"/><line x1="40" y1="465" x2="201.65191798162638" y2="465" stroke="#8a6d0d" stroke-width="2"/><path d="M40,265 L316.0,265 L246.9,315 L40,315 Z" fill="#d4b02e" opacity="0.55"/><line x1="40" y1="265" x2="316.0067570652563" y2="265" stroke="#8a6d0d" stroke-width="2"/><line x1="40" y1="315" x2="246.90911978745817" y2="315" stroke="#8a6d0d" stroke-width="2"/><path d="M201.7,415 A190,190 0 0 0 201.7,465" fill="none" stroke="#b5602e" stroke-width="9" stroke-linecap="round"/><path d="M316.0,265 A190,190 0 0 0 246.9,315" fill="none" stroke="#b5602e" stroke-width="9" stroke-linecap="round"/><line x1="60" y1="500" x2="160" y2="500" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="60" y="530" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Sun’s rays (same width)</text><circle cx="205" cy="240" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="205" y="247.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="160" cy="390" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="160" y="397.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="640" cy="175" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="640" y="182.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="672" y="182" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">High latitude</text><text x="625" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Low-angle rays: the same</text><text x="625" y="238" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">energy is spread over a</text><text x="625" y="260" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">larger area of ground.</text><text x="625" y="282" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Longer path through the</text><text x="625" y="304" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">atmosphere: more energy</text><text x="625" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">absorbed, scattered or</text><text x="625" y="348" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reflected. Ice and snow</text><text x="625" y="370" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reflect more (high albedo).</text><circle cx="640" cy="420" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="640" y="427.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="672" y="427" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Near the equator</text><text x="625" y="461" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">High-angle rays: energy</text><text x="625" y="483" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">concentrated on a small</text><text x="625" y="505" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">area; short path through</text><text x="625" y="527" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the atmosphere.</text><text x="390" y="684" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">atmosphere (not to scale)</text><text x="450" y="750" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Same width of beam, different area of ground: insolation falls towards the poles.</text>
</svg>