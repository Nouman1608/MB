<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why insolation falls with latitude</text>

<rect x="30" y="110" width="840" height="670" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="470" cy="440" r="238" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" stroke-dasharray="7 6"/><circle cx="470" cy="440" r="210" fill="#cfe0c0" stroke="#1e2a44" stroke-width="3"/><path d="M375,253 A210,210 0 0 1 565,253 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="260" y1="440" x2="680" y2="440" stroke="#1e2a44" stroke-width="2" stroke-dasharray="8 6"/><text x="500" y="430" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">equator</text><path d="M40,415 L261.5,415 L261.5,465 L40,465 Z" fill="#d4b02e" opacity="0.55"/><line x1="40" y1="415" x2="261.4934053800696" y2="415" stroke="#8a6d0d" stroke-width="2"/><line x1="40" y1="465" x2="261.4934053800696" y2="465" stroke="#8a6d0d" stroke-width="2"/><path d="M40,245 L392.1,245 L318.1,295 L40,295 Z" fill="#d4b02e" opacity="0.55"/><line x1="40" y1="245" x2="392.0577136594005" y2="245" stroke="#8a6d0d" stroke-width="2"/><line x1="40" y1="295" x2="318.0954246903669" y2="295" stroke="#8a6d0d" stroke-width="2"/><path d="M261.5,415 A210,210 0 0 0 261.5,465" fill="none" stroke="#b5602e" stroke-width="9" stroke-linecap="round"/><path d="M392.1,245 A210,210 0 0 0 318.1,295" fill="none" stroke="#b5602e" stroke-width="9" stroke-linecap="round"/><line x1="60" y1="400" x2="160" y2="400" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="60" y="388" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Sun’s rays</text><text x="470" y="244" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">ice and snow</text><line x1="338.71171994062047" y1="270" x2="700" y2="200" stroke="#1e2a44" stroke-width="2"/><circle cx="346.71171994062047" cy="270" r="5" fill="#1e2a44"/><line x1="268" y1="440" x2="700" y2="520" stroke="#1e2a44" stroke-width="2"/><circle cx="260" cy="440" r="5" fill="#1e2a44"/><text x="708" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">High latitude</text><text x="708" y="188" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Low-angle rays: the same</text><text x="708" y="209" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">energy is spread over a</text><text x="708" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">larger area</text><text x="708" y="251" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Longer path through the</text><text x="708" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">atmosphere: more absorbed,</text><text x="708" y="293" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scattered or reflected</text><text x="708" y="520" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Near the equator</text><text x="708" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">High-angle rays: energy</text><text x="708" y="569" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">concentrated on a small</text><text x="708" y="590" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">area; short path through</text><text x="708" y="611" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the atmosphere</text><text x="470" y="712" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">atmosphere (not to scale)</text><text x="450" y="755" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Same width of beam, different area of ground: insolation falls towards the poles.</text>
</svg>