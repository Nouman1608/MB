<rect width="900" height="880" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A sere: from bare rock to climax</text>

<rect x="34" y="150" width="160" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="36" y="380" width="156" height="68" fill="#cbbf9f"/><line x1="36" y1="380" x2="192" y2="380" stroke="#1e2a44" stroke-width="2.5"/><text x="114" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Bare rock</text><text x="114" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">no soil</text><line x1="184" y1="425" x2="212" y2="425" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="202" y="150" width="160" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="204" y="380" width="156" height="68" fill="#cbbf9f"/><rect x="204" y="374" width="156" height="6" fill="#9c8f6e"/><line x1="204" y1="374" x2="360" y2="374" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="237" cy="370" rx="16" ry="6" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><ellipse cx="272" cy="370" rx="16" ry="6" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><ellipse cx="312" cy="370" rx="16" ry="6" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><ellipse cx="337" cy="369" rx="10" ry="7" fill="#6f9a52"/><text x="282" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pioneers</text><text x="282" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lichens, mosses</text><line x1="352" y1="425" x2="380" y2="425" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="370" y="150" width="160" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="372" y="380" width="156" height="68" fill="#cbbf9f"/><rect x="372" y="362" width="156" height="18" fill="#9c8f6e"/><line x1="372" y1="362" x2="528" y2="362" stroke="#1e2a44" stroke-width="2.5"/><path d="M400,362 l-6,-22 M400,362 l0,-28 M400,362 l6,-22" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M425,362 l-6,-22 M425,362 l0,-28 M425,362 l6,-22" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M450,362 l-6,-22 M450,362 l0,-28 M450,362 l6,-22" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M475,362 l-6,-22 M475,362 l0,-28 M475,362 l6,-22" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M500,362 l-6,-22 M500,362 l0,-28 M500,362 l6,-22" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Seral stage</text><text x="450" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">more species</text><line x1="520" y1="425" x2="548" y2="425" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="538" y="150" width="160" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="540" y="380" width="156" height="68" fill="#cbbf9f"/><rect x="540" y="348" width="156" height="32" fill="#9c8f6e"/><line x1="540" y1="348" x2="696" y2="348" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="578" cy="316" rx="30" ry="30" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><ellipse cx="653" cy="316" rx="30" ry="30" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><path d="M618,348 l-6,-20 M618,348 l6,-20" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="618" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Seral stage</text><text x="618" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">larger plants</text><line x1="688" y1="425" x2="716" y2="425" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="706" y="150" width="160" height="300" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="708" y="380" width="156" height="68" fill="#cbbf9f"/><rect x="708" y="332" width="156" height="48" fill="#9c8f6e"/><line x1="708" y1="332" x2="864" y2="332" stroke="#1e2a44" stroke-width="2.5"/><rect x="743" y="252" width="10" height="80" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="748" cy="220" r="40" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="819" y="252" width="10" height="80" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="824" cy="220" r="40" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="786" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Climax</text><text x="786" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stable community</text><line x1="114" y1="470" x2="114" y2="452" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="40" y="496" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Primary succession starts</text><text x="40" y="516" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">on bare ground, no soil</text><line x1="450" y1="470" x2="450" y2="452" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="380" y="496" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Secondary succession starts</text><text x="380" y="516" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">where soil exists: fire, flood,</text><text x="380" y="534" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">abandoned farmland; faster</text><rect x="30" y="560" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M260,601 L840,579 L840,623 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="60" y="607" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soil depth</text><text x="270" y="639" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">thin, little organic matter</text><text x="840" y="639" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">deep, organic-rich</text><path d="M260,676 L840,654 L840,698 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="60" y="682" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Biomass</text><text x="270" y="714" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">low but rising</text><text x="840" y="714" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">high</text><path d="M260,751 L840,729 L840,773 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="60" y="757" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Food webs</text><text x="270" y="789" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">simple chains</text><text x="840" y="789" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">complex webs</text><text x="60" y="836" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Species: r-strategists (many small offspring) → K-strategists (fewer, larger, long-lived)</text>
</svg>