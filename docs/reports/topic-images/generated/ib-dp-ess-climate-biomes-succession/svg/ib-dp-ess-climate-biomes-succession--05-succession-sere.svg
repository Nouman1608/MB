<rect width="900" height="910" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A sere: from bare rock to climax</text>

<rect x="38" y="115" width="152" height="280" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="40" y="330" width="148" height="63" fill="#cbbf9f"/><line x1="40" y1="330" x2="188" y2="330" stroke="#1e2a44" stroke-width="2.5"/><text x="114" y="425" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Bare rock</text><text x="114" y="447" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">no soil</text><rect x="206" y="115" width="152" height="280" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="208" y="330" width="148" height="63" fill="#cbbf9f"/><rect x="208" y="324" width="148" height="6" fill="#9c8f6e"/><line x1="208" y1="324" x2="356" y2="324" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="237" cy="320" rx="16" ry="6" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><ellipse cx="272" cy="320" rx="16" ry="6" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><ellipse cx="312" cy="320" rx="16" ry="6" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.5"/><ellipse cx="337" cy="319" rx="10" ry="7" fill="#6f9a52"/><text x="282" y="425" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pioneers</text><text x="282" y="447" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lichens, mosses</text><rect x="374" y="115" width="152" height="280" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="376" y="330" width="148" height="63" fill="#cbbf9f"/><rect x="376" y="312" width="148" height="18" fill="#9c8f6e"/><line x1="376" y1="312" x2="524" y2="312" stroke="#1e2a44" stroke-width="2.5"/><path d="M400,312 l-6,-22 M400,312 l0,-28 M400,312 l6,-22" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M425,312 l-6,-22 M425,312 l0,-28 M425,312 l6,-22" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M450,312 l-6,-22 M450,312 l0,-28 M450,312 l6,-22" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M475,312 l-6,-22 M475,312 l0,-28 M475,312 l6,-22" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M500,312 l-6,-22 M500,312 l0,-28 M500,312 l6,-22" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="425" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Seral stage</text><text x="450" y="447" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">more species</text><rect x="542" y="115" width="152" height="280" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="544" y="330" width="148" height="63" fill="#cbbf9f"/><rect x="544" y="298" width="148" height="32" fill="#9c8f6e"/><line x1="544" y1="298" x2="692" y2="298" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="582" cy="266" rx="30" ry="30" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><ellipse cx="652" cy="266" rx="30" ry="30" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><path d="M618,298 l-6,-20 M618,298 l6,-20" fill="none" stroke="#6f9a52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="618" y="425" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Seral stage</text><text x="618" y="447" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">larger plants</text><rect x="710" y="115" width="152" height="280" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="712" y="330" width="148" height="63" fill="#cbbf9f"/><rect x="712" y="282" width="148" height="48" fill="#9c8f6e"/><line x1="712" y1="282" x2="860" y2="282" stroke="#1e2a44" stroke-width="2.5"/><rect x="751" y="212" width="10" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="756" cy="182" r="34" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="821" y="212" width="10" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="826" cy="182" r="34" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="786" y="425" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Climax</text><text x="786" y="447" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stable community</text><line x1="172" y1="200" x2="210" y2="200" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="340" y1="200" x2="378" y2="200" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="508" y1="200" x2="546" y2="200" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="676" y1="200" x2="714" y2="200" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="114" y1="500" x2="114" y2="462" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="40" y="524" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Primary succession starts</text><text x="40" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">on bare ground, no soil</text><line x1="450" y1="500" x2="450" y2="462" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="380" y="524" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Secondary succession starts</text><text x="380" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">where soil exists: fire, flood,</text><text x="380" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">abandoned farmland; faster</text><rect x="30" y="590" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M260,631 L840,609 L840,653 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="60" y="637" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soil depth</text><text x="270" y="669" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">thin, little organic matter</text><text x="840" y="669" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">deep, organic-rich</text><path d="M260,706 L840,684 L840,728 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="60" y="712" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Biomass</text><text x="270" y="744" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">low but rising</text><text x="840" y="744" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">high</text><path d="M260,781 L840,759 L840,803 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="60" y="787" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Food webs</text><text x="270" y="819" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">simple chains</text><text x="840" y="819" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">complex webs</text><text x="60" y="866" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Species: r-strategists (many small offspring) → K-strategists (fewer, larger, long-lived)</text>
</svg>