<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Productivity changes during succession</text>

<rect x="30" y="110" width="840" height="640" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="520" x2="840" y2="520" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">0</text><line x1="120" y1="437.5" x2="840" y2="437.5" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="443.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">5,000</text><line x1="120" y1="355" x2="840" y2="355" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="361" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">10,000</text><line x1="120" y1="272.5" x2="840" y2="272.5" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="278.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">15,000</text><line x1="120" y1="190" x2="840" y2="190" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">20,000</text><text x="50" y="160" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">kJ m⁻² yr⁻¹</text><rect x="145" y="470.5" width="60" height="49.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="209" y="500.2" width="60" height="19.8" fill="#b5602e" opacity="0.85" stroke="#1e2a44" stroke-width="2"/><text x="207" y="548" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pioneer</text><text x="207" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">NPP 1,800</text><rect x="157" y="592" width="100" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="207" y="615" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">P:R 2.5</text><rect x="320" y="371.5" width="60" height="148.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="384" y="445.75" width="60" height="74.25" fill="#b5602e" opacity="0.85" stroke="#1e2a44" stroke-width="2"/><text x="382" y="548" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Early</text><text x="382" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">NPP 4,500</text><rect x="332" y="592" width="100" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="382" y="615" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">P:R 2.0</text><rect x="495" y="272.5" width="60" height="247.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="559" y="355" width="60" height="165" fill="#b5602e" opacity="0.85" stroke="#1e2a44" stroke-width="2"/><text x="557" y="548" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mid</text><text x="557" y="578" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">NPP 5,000</text><rect x="507" y="592" width="100" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="557" y="615" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">P:R 1.5</text><rect x="670" y="190" width="60" height="330" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="734" y="206.5" width="60" height="313.5" fill="#b5602e" opacity="0.85" stroke="#1e2a44" stroke-width="2"/><text x="732" y="548" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Climax</text><text x="732" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">NPP 1,000</text><rect x="682" y="592" width="100" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="732" y="615" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">P:R 1.05</text><line x1="120" y1="520" x2="840" y2="520" stroke="#1e2a44" stroke-width="3"/><rect x="560" y="140" width="22" height="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="590" y="155" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">GPP (P)</text><rect x="690" y="140" width="22" height="18" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="720" y="155" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">R</text><text x="60" y="680" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">GPP rises throughout as leaf area grows. NPP = GPP − R peaks mid-succession,</text><text x="60" y="704" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">then falls as respiration catches up. P:R falls towards 1 at climax.</text>
</svg>