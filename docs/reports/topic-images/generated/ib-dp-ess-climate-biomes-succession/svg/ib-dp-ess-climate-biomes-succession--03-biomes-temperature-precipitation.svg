<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Biomes sorted by temperature and rainfall</text>

<rect x="30" y="110" width="840" height="640" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="640" x2="840" y2="640" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="640" x2="120" y2="160" stroke="#1e2a44" stroke-width="3"/><line x1="320" y1="678" x2="640" y2="678" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="300" y="684" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">colder</text><text x="660" y="684" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">warmer</text><text x="480" y="716" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mean annual temperature</text><text x="70" y="400" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 70 400)">Annual precipitation</text><text x="110" y="630" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">dry</text><text x="110" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">wet</text><ellipse cx="210" cy="585" rx="80" ry="38" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="581" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Tundra</text><text x="210" y="603" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">very low NPP</text><ellipse cx="300" cy="470" rx="95" ry="50" fill="#cfe0c0" stroke="#1e2a44" stroke-width="2.5"/><text x="300" y="466" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Boreal forest</text><text x="300" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">low NPP</text><ellipse cx="470" cy="545" rx="95" ry="42" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="470" y="541" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Temperate</text><text x="470" y="563" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">grassland</text><ellipse cx="500" cy="400" rx="110" ry="54" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="396" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Temperate</text><text x="500" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">deciduous forest</text><ellipse cx="730" cy="595" rx="90" ry="34" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="591" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Hot desert</text><text x="730" y="613" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">very low NPP</text><ellipse cx="720" cy="455" rx="92" ry="50" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="451" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Savanna</text><text x="720" y="473" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">wet + dry seasons</text><ellipse cx="730" cy="250" rx="105" ry="64" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="246" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Tropical</text><text x="730" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">rainforest</text><text x="730" y="340" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">highest land NPP</text><rect x="150" y="180" width="330" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="212" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Warm and wet: photosynthesis all</text><text x="170" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">year, high NPP. Water (desert) or</text><text x="170" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cold and light (tundra) limit NPP.</text>
</svg>