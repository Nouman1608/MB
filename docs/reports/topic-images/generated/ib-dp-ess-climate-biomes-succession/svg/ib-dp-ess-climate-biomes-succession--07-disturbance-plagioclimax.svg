<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Disturbance and plagioclimax</text>

<rect x="30" y="110" width="840" height="600" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="560" x2="840" y2="560" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="560" x2="110" y2="150" stroke="#1e2a44" stroke-width="3"/><text x="475" y="594" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Time →</text><text x="66" y="355" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 66 355)">Biomass / stage</text><line x1="110" y1="200" x2="840" y2="200" stroke="#2e6b62" stroke-width="2" stroke-dasharray="8 6"/><text x="834" y="190" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">climax</text><path d="M110,550 C200,520 240,240 360,214 L470,206" fill="none" stroke="#6f9a52" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M470,206 L478,470" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><path d="M478,470 C540,420 560,240 640,212 L830,204" fill="none" stroke="#6f9a52" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="488" y="498" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">disturbance</text><text x="488" y="518" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">removes biomass</text><text x="560" y="330" font-size="16" font-weight="700" fill="#6f9a52" text-anchor="start">secondary succession</text><text x="560" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">is faster</text><path d="M200,490 C220,440 250,380 300,375 L410,375" fill="none" stroke="#8a6d0d" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6"/><rect x="150" y="395" width="270" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="285" y="425" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Plagioclimax</text><text x="285" y="448" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">held by human activity:</text><text x="285" y="467" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">pasture, lawns, moorland</text><path d="M410,375 Q440,370 450,300" fill="none" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahO)" stroke-dasharray="6 5"/><text x="446" y="290" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="end">grazing stops:</text><text x="232" y="255" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">primary or</text><text x="232" y="274" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">secondary succession</text><text x="60" y="610" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Natural disturbance: fire, storms, floods, landslides, eruptions.</text><text x="60" y="636" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Human disturbance: clearing, ploughing, grazing, burning.</text><text x="60" y="662" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Resilience depends on diversity, storage size and how fast species reproduce.</text>
</svg>