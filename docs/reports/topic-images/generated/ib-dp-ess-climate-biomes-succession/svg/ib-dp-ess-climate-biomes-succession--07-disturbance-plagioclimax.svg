<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Disturbance and plagioclimax</text>

<rect x="30" y="110" width="410" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Disturbance resets succession</text><line x1="80" y1="200" x2="420" y2="200" stroke="#2e6b62" stroke-width="2" stroke-dasharray="8 6"/><text x="420" y="190" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">climax</text><line x1="80" y1="470" x2="420" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="80" y1="470" x2="80" y2="170" stroke="#1e2a44" stroke-width="3"/><text x="250" y="498" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">time →</text><text x="60" y="330" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle" transform="rotate(-90 60 330)">biomass</text><path d="M82,462 C140,455 150,215 220,204 L265,202" fill="none" stroke="#6f9a52" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M265,202 L270,430" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><path d="M270,430 C300,400 315,215 360,205 L415,202" fill="none" stroke="#6f9a52" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="292" cy="440" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="292" y="445.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="342" cy="300" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="342" y="305.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="70" cy="545" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="550.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="541" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Disturbance removes biomass</text><text x="96" y="561" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fire, storm, flood, clearing</text><circle cx="70" cy="601" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="606.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="597" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary succession</text><text x="96" y="617" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">faster: soil and seeds remain</text><rect x="460" y="110" width="410" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Plagioclimax holds it back</text><line x1="510" y1="200" x2="850" y2="200" stroke="#2e6b62" stroke-width="2" stroke-dasharray="8 6"/><text x="850" y="190" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">climax</text><line x1="510" y1="470" x2="850" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="510" y1="470" x2="510" y2="170" stroke="#1e2a44" stroke-width="3"/><text x="680" y="498" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">time →</text><text x="490" y="330" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle" transform="rotate(-90 490 330)">biomass</text><path d="M512,462 C550,455 560,350 610,345 L710,345" fill="none" stroke="#6f9a52" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="610" y="335" width="100" height="20" fill="#d4b02e" opacity="0.35"/><path d="M710,345 C750,340 760,212 800,205 L845,202" fill="none" stroke="#6f9a52" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6"/><circle cx="660" cy="310" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="660" y="315.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="756" cy="250" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="756" y="255.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="500" cy="545" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="500" y="550.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="526" y="541" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Plagioclimax</text><text x="526" y="561" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">held by grazing or burning</text><circle cx="500" cy="601" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="500" y="606.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="526" y="597" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Grazing or burning stops</text><text x="526" y="617" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">secondary succession resumes</text><text x="450" y="690" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Plagioclimax examples: grazed pasture, lawns, heather moorland burned in rotation.</text>
</svg>