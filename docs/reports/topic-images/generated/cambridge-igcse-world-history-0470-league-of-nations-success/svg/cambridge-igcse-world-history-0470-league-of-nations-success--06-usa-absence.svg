<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Did the League fail because the USA was absent?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Test the factor in both 1930s crises</text>
<polygon points="450,164 416,234 484,234" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="210" y1="130" x2="690" y2="198" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="164" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="210" y1="130" x2="210" y2="170" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="170" width="360" height="168" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="200.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Yes: Manchuria</text><text x="46" y="229.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sanctions on Japan meant little while the</text><text x="61.2" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">USA, its major trading partner, could</text><text x="61.2" y="271.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">carry on trading</text><text x="46" y="296.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">So Britain and France saw no point in</text><text x="61.2" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">acting</text><line x1="690" y1="198" x2="690" y2="238" stroke="#1e2a44" stroke-width="3"/><rect x="510" y="238" width="360" height="147" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="526" y="268.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">No: Abyssinia</text><text x="526" y="297.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain and France chose not to ban oil or</text><text x="541.2" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">close Suez</text><text x="526" y="343.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="343.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">They feared war and hoped to keep</text><text x="541.2" y="364.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mussolini against Hitler (Hoare-Laval)</text><rect x="30" y="407" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="441.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="471.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The USA's absence made sanctions harder, but the League failed mainly because its leading</text><text x="50" y="493.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">members put <tspan font-weight="700" fill="#1e2a44">their</tspan> <tspan font-weight="700" fill="#1e2a44">own</tspan> <tspan font-weight="700" fill="#1e2a44">interests</tspan> first.</text>
</svg>