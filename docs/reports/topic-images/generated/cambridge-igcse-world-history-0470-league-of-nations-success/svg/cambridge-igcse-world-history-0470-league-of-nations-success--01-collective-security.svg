<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 557" width="900" height="557" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="557" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How collective security was meant to work</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three steps, and no army of its own</text>
<rect x="100" y="308" width="770" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="116" y="338.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Moral condemnation</text><text x="116" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The aggressor is named and shamed</text><circle cx="60" cy="350" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="358.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="170" y="216" width="700" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="186" y="246.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Economic sanctions</text><text x="186" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Members stop trading with the aggressor</text><circle cx="130" cy="258" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="130" y="266.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="240" y="124" width="630" height="84" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="256" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Military action</text><text x="256" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A last resort, using members' own forces</text><circle cx="200" cy="166" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="200" y="174.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="414" width="840" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="446" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">THE WEAK POINT</text><text x="50" y="472.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Each step depended on members willing to act</text><text x="50" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No army of its own; Assembly decisions had to be unanimous</text>
</svg>