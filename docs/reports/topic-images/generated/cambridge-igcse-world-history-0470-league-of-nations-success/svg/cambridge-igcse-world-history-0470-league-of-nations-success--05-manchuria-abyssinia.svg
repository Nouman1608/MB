<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Manchuria and Abyssinia compared</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two permanent Council members defy the League</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="378" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="157.5" height="48" fill="#b5d3cf"/><rect x="187.5" y="124" width="341.25" height="48" fill="#b5d3cf"/><text x="201.5" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Manchuria, 1931-33</text><rect x="528.75" y="124" width="341.25" height="48" fill="#f2e7b8"/><text x="542.75" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Abyssinia, 1935-36</text><rect x="30" y="172" width="157.5" height="66" fill="#dce9e7"/><text x="44" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Causes</text><rect x="187.5" y="172" width="341.25" height="66" fill="#ffffff"/><text x="201.5" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Depression; raw materials and land; army</text><text x="201.5" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">influence</text><rect x="528.75" y="172" width="341.25" height="66" fill="#ffffff"/><text x="542.75" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Empire, revenge for Adowa (1896), prestige</text><line x1="30" y1="238" x2="870" y2="238" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="238" width="157.5" height="66" fill="#dce9e7"/><text x="44" y="264" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Trigger</text><rect x="187.5" y="238" width="341.25" height="66" fill="#f8faf9"/><text x="201.5" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mukden explosion, September 1931</text><rect x="528.75" y="238" width="341.25" height="66" fill="#f8faf9"/><text x="542.75" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Wal Wal clash, December 1934; invasion</text><text x="542.75" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">October 1935</text><line x1="30" y1="304" x2="870" y2="304" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="304" width="157.5" height="66" fill="#dce9e7"/><text x="44" y="330" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">League action</text><rect x="187.5" y="304" width="341.25" height="66" fill="#ffffff"/><text x="201.5" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Lytton Commission condemns Japan</text><text x="201.5" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1932); no sanctions</text><rect x="528.75" y="304" width="341.25" height="66" fill="#ffffff"/><text x="542.75" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sanctions, but no oil; Suez left open;</text><text x="542.75" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Hoare-Laval leaked</text><line x1="30" y1="370" x2="870" y2="370" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="370" width="157.5" height="66" fill="#dce9e7"/><text x="44" y="396" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Outcome</text><rect x="187.5" y="370" width="341.25" height="66" fill="#f8faf9"/><text x="201.5" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Japan leaves (1933) and keeps Manchukuo</text><rect x="528.75" y="370" width="341.25" height="66" fill="#f8faf9"/><text x="542.75" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Addis Ababa taken (May 1936); sanctions</text><text x="542.75" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dropped (July)</text><line x1="30" y1="436" x2="870" y2="436" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="436" width="157.5" height="66" fill="#dce9e7"/><text x="44" y="462" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Wider effect</text><rect x="187.5" y="436" width="341.25" height="66" fill="#ffffff"/><text x="201.5" y="462" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A permanent Council member defied the</text><text x="201.5" y="482" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">League</text><rect x="528.75" y="436" width="341.25" height="66" fill="#ffffff"/><text x="542.75" y="462" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Rome-Berlin Axis; Rhineland (March 1936);</text><text x="542.75" y="482" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Italy leaves (1937)</text></g><line x1="187.5" y1="124" x2="187.5" y2="502" stroke="#c9d6d4" stroke-width="1.5"/><line x1="528.75" y1="124" x2="528.75" y2="502" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="378" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="524" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="558.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Behind both</text><text x="450" y="588.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The Depression made members reluctant to use trade sanctions that hurt their own exporters.</text>
</svg>