<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" width="900" height="592" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="592" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Humanitarian work</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Help for millions, continuing through the 1930s</text>
<rect x="30" y="124" width="412" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REFUGEES</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nansen</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hundreds of thousands of prisoners of war</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">returned home; "Nansen passports" for the</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stateless</text><rect x="458" y="124" width="412" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="177" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HEALTH</text><text x="478" y="203.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Health Organisation</text><text x="478" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Typhus, malaria, leprosy; forerunner of the WHO</text><rect x="30" y="294" width="412" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="326" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WORK</text><text x="50" y="352.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">ILO</text><text x="50" y="381.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Limits on hours and child labour proposed; many</text><text x="50" y="402.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">members did not adopt them</text><rect x="458" y="294" width="412" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="336.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SLAVERY</text><text x="478" y="363.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Slavery Commission</text><text x="478" y="392.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Slavery Convention of 1926</text><rect x="30" y="449" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="483.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">But not the main aim</text><text x="50" y="513.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Its agencies passed to the United Nations; yet the League's main aim was to prevent war, so this</text><text x="50" y="535.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cannot alone make it a success.</text>
</svg>