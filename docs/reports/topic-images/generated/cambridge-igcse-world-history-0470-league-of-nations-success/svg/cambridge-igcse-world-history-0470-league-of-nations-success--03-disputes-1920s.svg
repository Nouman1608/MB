<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four disputes of the 1920s</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">When did the League succeed?</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="320" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="172.94117647058826" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dispute</text><rect x="202.94117647058826" y="124" width="469.41176470588243" height="48" fill="#b5d3cf"/><text x="216.94117647058826" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What happened</text><rect x="672.3529411764707" y="124" width="197.64705882352945" height="48" fill="#b5d3cf"/><text x="686.3529411764707" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Verdict</text><rect x="30" y="172" width="172.94117647058826" height="68" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Vilna, 1920</text><rect x="202.94117647058826" y="172" width="469.41176470588243" height="68" fill="#ffffff"/><text x="216.94117647058826" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Poland seizes Lithuania's capital and refuses to withdraw;</text><text x="216.94117647058826" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">France sees Poland as an ally</text><rect x="672.3529411764707" y="172" width="197.64705882352945" height="68" fill="#f3dccd"/><text x="686.3529411764707" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Failure</text><line x1="30" y1="240" x2="870" y2="240" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="240" width="172.94117647058826" height="68" fill="#dce9e7"/><text x="44" y="266.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Aaland Islands,</text><text x="44" y="287.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1920-21</text><rect x="202.94117647058826" y="240" width="469.41176470588243" height="68" fill="#f8faf9"/><text x="216.94117647058826" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Islands stay with Finland, demilitarised, Swedish kept;</text><text x="216.94117647058826" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sweden accepts</text><rect x="672.3529411764707" y="240" width="197.64705882352945" height="68" fill="#b5d3cf"/><text x="686.3529411764707" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Success</text><line x1="30" y1="308" x2="870" y2="308" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="308" width="172.94117647058826" height="68" fill="#dce9e7"/><text x="44" y="334.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Corfu, 1923</text><rect x="202.94117647058826" y="308" width="469.41176470588243" height="68" fill="#ffffff"/><text x="216.94117647058826" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mussolini bombards and occupies Corfu; Conference of</text><text x="216.94117647058826" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ambassadors makes Greece pay</text><rect x="672.3529411764707" y="308" width="197.64705882352945" height="68" fill="#f3dccd"/><text x="686.3529411764707" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Failure</text><line x1="30" y1="376" x2="870" y2="376" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="376" width="172.94117647058826" height="68" fill="#dce9e7"/><text x="44" y="402.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Bulgaria, 1925</text><rect x="202.94117647058826" y="376" width="469.41176470588243" height="68" fill="#f8faf9"/><text x="216.94117647058826" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">League orders ceasefire and withdrawal; Greece obeys</text><text x="216.94117647058826" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and pays compensation</text><rect x="672.3529411764707" y="376" width="197.64705882352945" height="68" fill="#b5d3cf"/><text x="686.3529411764707" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Success</text></g><line x1="202.94117647058826" y1="124" x2="202.94117647058826" y2="444" stroke="#c9d6d4" stroke-width="1.5"/><line x1="672.3529411764707" y1="124" x2="672.3529411764707" y2="444" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="320" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="466" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="500.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The pattern</text><text x="50" y="530.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Success with <tspan font-weight="700" fill="#1e2a44">smaller</tspan> <tspan font-weight="700" fill="#1e2a44">states</tspan> when the great powers agreed; failure when a <tspan font-weight="700" fill="#1e2a44">great</tspan> <tspan font-weight="700" fill="#1e2a44">power</tspan> was</text><text x="50" y="552.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">involved or Britain and France had a reason not to act.</text>
