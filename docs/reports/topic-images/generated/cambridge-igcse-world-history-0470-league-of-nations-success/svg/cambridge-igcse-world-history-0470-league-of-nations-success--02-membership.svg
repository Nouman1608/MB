<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 651" width="900" height="651" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="651" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who was in the League, and when?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale, 1920-1940</text>
<line x1="230" y1="148" x2="230" y2="504" stroke="#c9d6d4" stroke-width="1.5"/><text x="230" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1920</text><line x1="385" y1="148" x2="385" y2="504" stroke="#c9d6d4" stroke-width="1.5"/><text x="385" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1925</text><line x1="540" y1="148" x2="540" y2="504" stroke="#c9d6d4" stroke-width="1.5"/><text x="540" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1930</text><line x1="695" y1="148" x2="695" y2="504" stroke="#c9d6d4" stroke-width="1.5"/><text x="695" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1935</text><line x1="850" y1="148" x2="850" y2="504" stroke="#c9d6d4" stroke-width="1.5"/><text x="850" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1940</text><text x="30" y="182" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Britain</text><rect x="230" y="158" width="620" height="34" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="30" y="232" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">France</text><rect x="230" y="208" width="620" height="34" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="30" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Italy</text><rect x="230" y="258" width="527" height="34" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="767" y="281" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">left 1937</text><text x="30" y="332" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Japan</text><rect x="230" y="308" width="403" height="34" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="643" y="331" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">left 1933</text><text x="30" y="382" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Germany</text><rect x="416" y="358" width="217" height="34" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="643" y="381" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">joined 1926, left 1933</text><text x="30" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">USSR</text><rect x="664" y="408" width="155" height="34" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="654" y="431" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">joined 1934, expelled 1939</text><text x="30" y="482" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">USA</text><text x="230" y="481" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">never joined: the Senate rejected Versailles</text><rect x="30" y="530" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="564.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">So the League depended on Britain and France</text><text x="450" y="594.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Two powers with their own interests and limited appetite for action.</text>
</svg>