<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Government or governance?</text>

<rect x="30" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Government</text><rect x="150" y="175" width="170" height="56" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="235" y="210.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">authority</text><line x1="235" y1="231" x2="90" y2="300" stroke="#1e2a44" stroke-width="2.5"/><rect x="50" y="300" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="107.5" y="331.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">parliament</text><line x1="235" y1="231" x2="235" y2="300" stroke="#1e2a44" stroke-width="2.5"/><rect x="175" y="300" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="232.5" y="331.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">police</text><line x1="235" y1="231" x2="380" y2="300" stroke="#1e2a44" stroke-width="2.5"/><rect x="300" y="300" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="357.5" y="331.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">courts</text><text x="235" y="400" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">formal institutions make, apply and enforce</text><text x="235" y="421" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">binding rules over a territory</text><rect x="460" y="110" width="410" height="420" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="148" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Global governance</text><line x1="560" y1="210" x2="770" y2="210" stroke="#2e6b62" stroke-width="2"/><line x1="560" y1="210" x2="665" y2="270" stroke="#2e6b62" stroke-width="2"/><line x1="770" y1="210" x2="665" y2="270" stroke="#2e6b62" stroke-width="2"/><line x1="520" y1="300" x2="665" y2="270" stroke="#2e6b62" stroke-width="2"/><line x1="665" y1="270" x2="810" y2="300" stroke="#2e6b62" stroke-width="2"/><line x1="665" y1="270" x2="665" y2="350" stroke="#2e6b62" stroke-width="2"/><line x1="520" y1="300" x2="665" y2="350" stroke="#2e6b62" stroke-width="2"/><line x1="810" y1="300" x2="665" y2="350" stroke="#2e6b62" stroke-width="2"/><line x1="560" y1="210" x2="520" y2="300" stroke="#2e6b62" stroke-width="2"/><line x1="770" y1="210" x2="810" y2="300" stroke="#2e6b62" stroke-width="2"/><rect x="510" y="188" width="100" height="44" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="560" y="216.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">states</text><rect x="720" y="188" width="100" height="44" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="770" y="216.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">IGOs</text><rect x="470" y="278" width="100" height="44" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="520" y="306.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">companies</text><rect x="590" y="248" width="150" height="44" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="665" y="276.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">rules and norms</text><rect x="760" y="278" width="100" height="44" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="810" y="306.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">NGOs</text><rect x="615" y="328" width="100" height="44" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="665" y="356.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">experts</text><text x="665" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">steers behaviour through rules, norms,</text><text x="665" y="441" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">agreements and networks, with no single</text><text x="665" y="462" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">authority at the top</text><text x="30" y="565" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Global governance in practice</text><rect x="30" y="580" width="270" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="165" y="603.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">UNSC resolutions (binding under</text><text x="165" y="623.55" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Ch. VII)</text><rect x="315" y="580" width="270" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="450" y="613.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Paris Agreement (2015)</text><rect x="600" y="580" width="270" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="735" y="613.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Basel Accords: not a treaty</text><rect x="30" y="646" width="270" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="165" y="679.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">WTO agreements</text><rect x="315" y="646" width="270" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="450" y="669.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">EU; AU Peace and Security</text><text x="450" y="689.55" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Council</text>
</svg>