<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Forms of cooperation</text>

<rect x="30" y="110" width="840" height="51.760000000000005" rx="12" fill="#2e6b62"/><text x="42" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Form</text><text x="252" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">What it is</text><text x="522" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Example</text><rect x="30" y="157.76" width="840" height="62.24000000000001" fill="#ffffff"/><text x="42" y="183.35999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Treaty</text><text x="252" y="183.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">binding written agreement</text><text x="522" y="183.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">NPT (in force 1970); Montreal Protocol</text><text x="522" y="204.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1987)</text><rect x="30" y="220" width="840" height="62.24000000000001" fill="#f7f9f9"/><text x="42" y="245.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Collective security</text><text x="252" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">members commit to respond</text><text x="252" y="266.71999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">together to a threat</text><text x="522" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">NATO (1949), Article 5 invoked once, after</text><text x="522" y="266.71999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">9/11; OAS (1948)</text><line x1="30" y1="220" x2="870" y2="220" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="282.24" width="840" height="83.36" fill="#ffffff"/><text x="42" y="307.84000000000003" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Strategic alliance</text><text x="252" y="307.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">partnership for shared</text><text x="252" y="328.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strategic aims, often less</text><text x="252" y="350.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">formal</text><text x="522" y="307.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">USA and Israel; China’s links in Africa</text><text x="522" y="328.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and Latin America</text><line x1="30" y1="282.24" x2="870" y2="282.24" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="365.6" width="840" height="62.24000000000001" fill="#f7f9f9"/><text x="42" y="391.20000000000005" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Economic cooperation</text><text x="252" y="391.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trade agreements, integration</text><text x="522" y="391.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">WTO agreements; African Continental Free</text><text x="522" y="412.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Trade Area</text><line x1="30" y1="365.6" x2="870" y2="365.6" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="427.84000000000003" width="840" height="62.24000000000001" fill="#ffffff"/><text x="42" y="453.44000000000005" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Informal cooperation</text><text x="252" y="453.44000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">coordination without a formal</text><text x="252" y="474.56000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treaty</text><text x="522" y="453.44000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">technology harmonisation; cultural</text><text x="522" y="474.56000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exchange</text><line x1="30" y1="427.84000000000003" x2="870" y2="427.84000000000003" stroke="#c9d6d4" stroke-width="1.5"/><line x1="240" y1="157.76" x2="240" y2="490.08000000000004" stroke="#c9d6d4" stroke-width="1.5"/><line x1="510" y1="157.76" x2="510" y2="490.08000000000004" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="110" width="840" height="380.08000000000004" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/><rect x="30" y="514.08" width="410" height="127" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="549.1800000000001" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Montreal Protocol: cooperation driven</text><text x="48" y="572.94" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">by interdependence</text><text x="48" y="600.0600000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ratified by every UN member state; no state</text><text x="48" y="621.1800000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">can protect the ozone layer alone</text><rect x="460" y="514.08" width="410" height="127" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="478" y="549.1800000000001" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">NPT: competition inside cooperation</text><text x="478" y="576.3000000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">five recognised nuclear-weapon states; India,</text><text x="478" y="597.4200000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pakistan and Israel never joined; North Korea</text><text x="478" y="618.5400000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">announced withdrawal in 2003</text>
</svg>