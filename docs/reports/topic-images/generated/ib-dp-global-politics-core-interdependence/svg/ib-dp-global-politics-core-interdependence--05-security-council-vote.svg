<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the Security Council decides</text>

<rect x="30" y="110" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="85" cy="175" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="85" y="181" font-size="13.5" font-weight="700" fill="#1e2a44" text-anchor="middle">CN</text><circle cx="137" cy="175" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="137" y="181" font-size="13.5" font-weight="700" fill="#1e2a44" text-anchor="middle">FR</text><circle cx="189" cy="175" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="189" y="181" font-size="13.5" font-weight="700" fill="#1e2a44" text-anchor="middle">RU</text><circle cx="241" cy="175" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="241" y="181" font-size="13.5" font-weight="700" fill="#1e2a44" text-anchor="middle">UK</text><circle cx="293" cy="175" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="293" y="181" font-size="13.5" font-weight="700" fill="#1e2a44" text-anchor="middle">US</text><circle cx="345" cy="175" r="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="397" cy="175" r="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="449" cy="175" r="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="501" cy="175" r="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="553" cy="175" r="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="605" cy="175" r="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="657" cy="175" r="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="709" cy="175" r="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="761" cy="175" r="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="813" cy="175" r="21" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="205" y="228" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">5 permanent members: veto</text><text x="600" y="228" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">10 elected by the GA for two years</text><text x="450" y="280" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Substantive decision = 9 of 15 votes AND no permanent-member veto (an abstention is not a veto)</text><rect x="30" y="330" width="410" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="366.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Libya, 2011: Resolution 1973</text><text x="48" y="393.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">China and Russia abstained rather than</text><text x="48" y="414.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vetoing, so measures to protect civilians</text><text x="48" y="435.41" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passed</text><rect x="460" y="330" width="410" height="150" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="478" y="366.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Ukraine, February 2022</text><text x="478" y="393.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Russia, a party to the conflict, vetoed the</text><text x="478" y="414.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">draft resolution; the Council could not act</text><line x1="665" y1="484" x2="665" y2="516" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="520" width="410" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="478" y="556.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Workaround: GA Uniting for Peace</text><text x="478" y="583.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resolution deploring the invasion: wide</text><text x="478" y="604.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">agreement, not binding</text><rect x="30" y="520" width="410" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="556.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="48" y="583.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the Council acts when P5 interests do not</text><text x="48" y="604.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">clash; its 1945 structure fuels the legitimacy</text><text x="48" y="625.41" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">debate</text>
</svg>