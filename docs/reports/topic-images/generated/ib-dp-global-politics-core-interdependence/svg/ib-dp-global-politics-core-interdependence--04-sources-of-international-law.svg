<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five sources of international law</text>

<rect x="30" y="110" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="157.07999999999998" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="165.71999999999997" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="128" y="149.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Treaties</text><text x="128" y="175.57" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">written agreements binding the states that ratify them</text><rect x="30" y="214.16" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="261.24" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="269.88" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="128" y="254.01" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">International custom</text><text x="128" y="279.73" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">consistent state practice followed out of a sense of legal obligation</text><rect x="30" y="318.32" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="365.4" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="374.03999999999996" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="128" y="358.17" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">General principles of law</text><text x="128" y="383.89000000000004" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">widely recognised across legal systems, such as good faith</text><rect x="30" y="422.48" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="469.56" r="24" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="80" y="478.2" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="128" y="462.33000000000004" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Decisions of courts</text><text x="128" y="488.05000000000007" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">international, regional and national</text><rect x="30" y="526.64" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="573.72" r="24" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="80" y="582.36" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="128" y="566.49" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Scholarly writings</text><text x="128" y="592.21" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">by leading legal experts</text><rect x="30" y="640.8" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="672.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sources 1–3 create law. Sources 4–5 are mainly used to identify what the law is.</text>
</svg>