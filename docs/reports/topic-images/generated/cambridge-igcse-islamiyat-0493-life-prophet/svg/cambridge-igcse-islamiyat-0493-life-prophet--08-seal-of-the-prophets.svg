<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Seal of the Prophets</text>

<rect x="150" y="110" width="600" height="96" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"the Messenger of God and</text><text x="450" y="180" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">the Seal of the Prophets" (Sura 33.40)</text><rect x="30" y="236" width="410" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="273" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Final</text><text x="50" y="301.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No prophet will come after him: his message</text><text x="50" y="323.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is final and complete.</text><rect x="460" y="236" width="410" height="140" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="273" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Universal</text><text x="480" y="301.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Earlier prophets were sent to particular</text><text x="480" y="323.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">peoples; he was sent to all humanity.</text><text x="850" y="270" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="end">Sura 34.28</text><rect x="30" y="392" width="410" height="140" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="429" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The model</text><text x="50" y="457.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">His Sunnah, preserved in the Hadiths, is the</text><text x="50" y="479.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">model Muslims follow.</text><text x="420" y="426" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="end">Sura 33.21</text><rect x="460" y="392" width="410" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="429" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Part of faith</text><text x="480" y="457.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Belief in the finality of his prophethood is</text><text x="480" y="479.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">part of faith; claims to new prophethood are</text><text x="480" y="501.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rejected.</text><text x="450" y="572" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">A named syllabus point: do not leave it out.</text>
</svg>