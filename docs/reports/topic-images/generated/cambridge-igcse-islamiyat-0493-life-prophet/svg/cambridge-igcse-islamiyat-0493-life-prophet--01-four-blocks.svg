" fill="#1e2a44" text-anchor="start">Badr, Uhud, the</text><text x="701" y="352" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Trench</text><circle cx="688" cy="375" r="4" fill="#1e2a44"/><text x="701" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Hudaybiyya</text><circle cx="688" cy="403" r="4" fill="#1e2a44"/><text x="701" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Letters to rulers</text><circle cx="688" cy="431" r="4" fill="#1e2a44"/><text x="701" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Conquest of Makkah</text><circle cx="688" cy="459" r="4" fill="#1e2a44"/><text x="701" y="464" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Farewell</text><text x="701" y="483" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Pilgrimage; death</text><rect x="30" y="532" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="572" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">A 10-mark answer: about five developed points, in order, with names and places.</text>
