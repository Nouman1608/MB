<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 954" width="900" height="954" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="954" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Opposition in Makkah</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why the Quraysh opposed the message</text><rect x="30" y="142" width="268" height="108" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="178.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Economic</text><text x="50" y="206.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it attacked the idols that</text><text x="50" y="228.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">brought pilgrims and trade</text><rect x="316" y="142" width="268" height="108" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="336" y="178.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Social</text><text x="336" y="206.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">all people equal before God</text><rect x="602" y="142" width="268" height="108" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="622" y="178.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Political</text><text x="622" y="206.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a threat to the clan</text><text x="622" y="228.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">leaders' authority</text><text x="450" y="290" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">How the response grew</text><rect x="30" y="308" width="630" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="342" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mockery</text><text x="278" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">called a poet, a sorcerer, a madman</text><rect x="30" y="372" width="660" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="406" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Offers</text><text x="278" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">wealth, leadership, kingship, through Utba ibn Rabi'a</text><rect x="30" y="436" width="690" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pressure on Abu Talib</text><text x="278" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">to withdraw his protection</text><rect x="30" y="500" width="720" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="48" y="534" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Persecution of the weak</text><text x="278" y="534" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Bilal tortured; Sumayya the first martyr</text><rect x="30" y="564" width="750" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="48" y="598" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Abyssinia (615)</text><text x="278" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ja'far's speech wins the Negus's protection</text><rect x="30" y="628" width="780" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="48" y="662" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Boycott</text><text x="278" y="662" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">clan of Hashim confined for about three years</text><rect x="30" y="692" width="810" height="54" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="48" y="726" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Year of Sorrow (619)</text><text x="278" y="726" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Khadija and Abu Talib die</text><rect x="30" y="756" width="840" height="54" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="48" y="790" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ta'if</text><text x="278" y="790" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stoned out; he prayed for them</text><rect x="30" y="830" width="840" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="868" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Then hope returned</text><text x="54" y="900" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Isra and Mi'raj: five daily prayers made obligatory. Pledges of Aqaba: people of Yathrib promise protection.</text>
</svg>