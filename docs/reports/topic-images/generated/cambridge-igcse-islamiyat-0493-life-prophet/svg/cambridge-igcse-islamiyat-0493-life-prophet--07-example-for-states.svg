<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 778" width="900" height="778" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="778" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">His example for communities and states</text>

<rect x="30" y="110" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="152" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="159.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="108" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Treaties</text><text x="108" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">At Hudaybiyya he accepted hard terms to gain peace, and kept them, returning Abu Jandal.</text><rect x="30" y="206" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="248" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="255.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="108" y="242" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Diplomacy</text><text x="108" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Letters to rulers, including Heraclius, the Persian emperor, the Negus and the ruler of Egypt.</text><rect x="30" y="302" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="344" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="351.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="108" y="338" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rules of war</text><text x="108" y="366" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He forbade killing women, children and non-combatants.</text><rect x="30" y="398" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="70" cy="440" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="447.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="108" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mercy in victory</text><text x="108" y="462" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The general amnesty at Makkah: a strong state should not take revenge.</text><rect x="30" y="494" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="536" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="543.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="108" y="530" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Minorities</text><text x="108" y="558" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Constitution of Madinah: citizens of different faiths under one set of laws.</text><rect x="30" y="594" width="840" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="630" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Worked part (b): lessons from the conquest of Makkah</text><circle cx="59" cy="661" r="4" fill="#1e2a44"/><text x="72" y="666" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Forgiveness of former persecutors: aim for reconciliation, not revenge.</text><circle cx="59" cy="692" r="4" fill="#1e2a44"/><text x="72" y="697" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protection for those in their homes or in Abu Sufyan's house: protect civilians and give</text><text x="72" y="718" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">former opponents security.</text>
</svg>