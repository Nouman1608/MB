<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Character shown through actions</text>

<text x="220" y="116" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Quality</text><text x="640" y="116" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">The action that shows it</text><rect x="30" y="132" width="340" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="200" y="185" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Trustworthiness</text><line x1="374" y1="178" x2="402" y2="178" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="410" y="132" width="460" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="430" y="168" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Called al-Amin; on the night of the Hijra he left</text><text x="430" y="189" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ali to return goods his enemies had left with him.</text><rect x="30" y="236" width="340" height="92" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="200" y="289" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Patience and forgiveness</text><line x1="374" y1="282" x2="402" y2="282" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="410" y="236" width="460" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="430" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prayed for his attackers at Ta'if; forgave the</text><text x="430" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quraysh at the conquest of Makkah.</text><rect x="30" y="340" width="340" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="200" y="393" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Humility</text><line x1="374" y1="386" x2="402" y2="386" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="410" y="340" width="460" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="430" y="376" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mended his own clothes, helped at home, dug in the</text><text x="430" y="397" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trench with the Companions.</text><rect x="30" y="444" width="340" height="92" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="200" y="497" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Consultation</text><line x1="374" y1="490" x2="402" y2="490" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="410" y="444" width="460" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="430" y="480" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Followed Salman al-Farsi's advice on the trench;</text><text x="430" y="501" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consulted the Companions before Uhud.</text><rect x="30" y="548" width="340" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="200" y="601" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Justice</text><line x1="374" y1="594" x2="402" y2="594" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="410" y="548" width="460" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="430" y="584" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Said the same punishment would apply even to his</text><text x="430" y="605" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">own daughter Fatima.</text><text x="450" y="674" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Examiners reward character shown through specific actions.</text>
</svg>