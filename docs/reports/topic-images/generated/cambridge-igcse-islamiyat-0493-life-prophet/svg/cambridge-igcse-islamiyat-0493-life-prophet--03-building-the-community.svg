<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building the community in Madinah</text>

<rect x="30" y="150" width="410" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="184" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOUNDATION 1</text><text x="50" y="213" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The mosque</text><text x="50" y="241.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a place of worship, teaching, meeting and</text><text x="50" y="263.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decision-making</text><rect x="460" y="150" width="410" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="184" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOUNDATION 2</text><text x="480" y="213" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Brotherhood (mu'akhat)</text><text x="480" y="241.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">each Emigrant paired with a Helper, who</text><text x="480" y="263.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shared his home and wealth</text><rect x="30" y="330" width="410" height="166" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="364" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOUNDATION 3</text><text x="50" y="393" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Constitution of Madinah</text><text x="50" y="421.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rights and duties of Muslims, Jewish tribes</text><text x="50" y="443.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and others as one community; disputes</text><text x="50" y="465.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">referred to the Prophet (pbuh)</text><rect x="460" y="330" width="410" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="364" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOUNDATION 4</text><text x="480" y="393" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Change of qibla</text><text x="480" y="421.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from Jerusalem to the Ka'ba in 2 AH (624)</text><rect x="30" y="104" width="840" height="34" rx="8" fill="#f2e7b8"/><text x="450" y="127" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">After the Hijra in 622</text>
</svg>