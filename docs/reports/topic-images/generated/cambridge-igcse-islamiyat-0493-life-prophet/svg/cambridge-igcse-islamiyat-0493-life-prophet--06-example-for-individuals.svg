<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 478" width="900" height="478" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="478" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">His example for individuals</text>

<rect x="30" y="110" width="268" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Personal conduct</text><circle cx="53" cy="187" r="4" fill="#1e2a44"/><text x="66" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">honesty in trade</text><circle cx="53" cy="222" r="4" fill="#1e2a44"/><text x="66" y="227" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">keeping promises</text><circle cx="53" cy="257" r="4" fill="#1e2a44"/><text x="66" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">simple living</text><circle cx="53" cy="292" r="4" fill="#1e2a44"/><text x="66" y="297" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prayer and fasting beyond</text><text x="66" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what is obligatory</text><rect x="316" y="110" width="268" height="340" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="336" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">With women</text><circle cx="339" cy="187" r="4" fill="#1e2a44"/><text x="352" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trust in Khadija as wife</text><text x="352" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and adviser</text><circle cx="339" cy="243" r="4" fill="#1e2a44"/><text x="352" y="248" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">followed Umm Salama's</text><text x="352" y="269" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advice at Hudaybiyya</text><circle cx="339" cy="299" r="4" fill="#1e2a44"/><text x="352" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Farewell Sermon: rights</text><text x="352" y="325" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of men and women over</text><text x="352" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each other</text><circle cx="339" cy="376" r="4" fill="#1e2a44"/><text x="352" y="381" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the best are those best</text><text x="352" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to their families</text><rect x="602" y="110" width="268" height="340" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">With non-Muslims</text><circle cx="625" cy="187" r="4" fill="#1e2a44"/><text x="638" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Constitution of Madinah</text><text x="638" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protected Jewish tribes</text><circle cx="625" cy="243" r="4" fill="#1e2a44"/><text x="638" y="248" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stood for a Jewish</text><text x="638" y="269" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">funeral: "Was it not a</text><text x="638" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">soul?"</text><circle cx="625" cy="320" r="4" fill="#1e2a44"/><text x="638" y="325" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accepted the protection</text><text x="638" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of the Christian Negus</text><circle cx="625" cy="376" r="4" fill="#1e2a44"/><text x="638" y="381" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">honoured treaties with</text><text x="638" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Quraysh</text>
</svg>