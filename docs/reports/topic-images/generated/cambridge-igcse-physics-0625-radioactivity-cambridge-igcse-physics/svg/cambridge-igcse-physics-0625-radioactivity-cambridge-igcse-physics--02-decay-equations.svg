<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Balancing decay equations</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">α decay: radon-222</text><text x="186" y="194.32" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">222</text><text x="186" y="216.08" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">86</text><text x="190" y="212" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="start">Rn</text><text x="305" y="212" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">→</text><text x="416" y="194.32" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">218</text><text x="416" y="216.08" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">84</text><text x="420" y="212" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="start">Po</text><text x="560" y="212" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="636" y="194.32" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">4</text><text x="636" y="216.08" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">2</text><text x="640" y="212" font-size="34" font-weight="700" fill="#b5602e" text-anchor="start">He</text><text x="450" y="260" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">top: 222 = 218 + 4;  bottom: 86 = 84 + 2;  so A − 4, Z − 2</text><rect x="30" y="295" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="333" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">β decay: strontium-90</text><text x="186" y="379.32" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">90</text><text x="186" y="401.08" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">38</text><text x="190" y="397" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="start">Sr</text><text x="305" y="397" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">→</text><text x="416" y="379.32" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">90</text><text x="416" y="401.08" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">39</text><text x="420" y="397" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="start">Y</text><text x="560" y="397" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="646" y="379.32" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">0</text><text x="646" y="401.08" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">−1</text><text x="650" y="397" font-size="34" font-weight="700" fill="#b5602e" text-anchor="start">e</text><text x="450" y="445" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">top: 90 = 90 + 0;  bottom: 38 = 39 + (−1);  so A same, Z + 1</text><rect x="30" y="480" width="840" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="518" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">In β decay a neutron in the nucleus changes:</text><text x="450" y="570" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">neutron  →  proton  +  electron (emitted)</text>
</svg>