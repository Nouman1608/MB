<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Background radiation and count rate</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="145" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Main sources of background radiation</text><rect x="50" y="160" width="190" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="145" y="193" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">radon gas in the</text><text x="145" y="215" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">air</text><rect x="255" y="160" width="190" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="350" y="193" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">rocks and</text><text x="350" y="215" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">buildings</text><rect x="460" y="160" width="190" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="555" y="193" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">food and drink</text><rect x="665" y="160" width="190" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="760" y="193" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">cosmic rays from</text><text x="760" y="215" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">space</text><rect x="30" y="275" width="455" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="330" width="130" height="50" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="145" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">detector</text><line x1="210" y1="355" x2="300" y2="355" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="300" y="320" width="170" height="70" rx="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="385" y="365" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1350</text><text x="385" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">counter</text><rect x="500" y="290" width="370" height="154" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="520" y="326" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Count rate</text><text x="520" y="360" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">1350 counts in 5.0 minutes</text><text x="520" y="392" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">= 270 counts/minute</text><text x="520" y="424" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">= 4.5 counts/s</text><rect x="30" y="455" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="476" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="495" width="840" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="477" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">measure the background with the source removed and subtract it from every reading</text><text x="450" y="524" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">corrected count rate = measured count rate − background count rate</text>
</svg>