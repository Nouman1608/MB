<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Handling radioactive sources safely</text>

<rect x="30" y="110" width="270" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="150" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Time</text><circle cx="165" cy="260" r="60" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="165" y1="260" x2="165" y2="215" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><line x1="165" y1="260" x2="200" y2="260" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><path d="M165,200 A60,60 0 0 1 217,230" fill="none" stroke="#b5602e" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><text x="165" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">use the source for the</text><text x="165" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">shortest time possible</text><rect x="315" y="110" width="270" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="150" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Distance</text><rect x="340" y="280" width="36" height="26" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="376" y1="293" x2="470" y2="270" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><line x1="470" y1="270" x2="490" y2="262" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><line x1="470" y1="270" x2="492" y2="280" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="440" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">tongs</text><circle cx="540" cy="250" r="20" fill="#e8c9a8" stroke="#1e2a44" stroke-width="2"/><line x1="360" y1="340" x2="540" y2="340" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="450" y="368" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">arm's length</text><text x="450" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">tongs, held away from the body,</text><text x="450" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">pointed away from people</text><rect x="600" y="110" width="270" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="150" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Shielding</text><rect x="680" y="220" width="140" height="120" rx="6" fill="#6b7280" stroke="#1e2a44" stroke-width="3"/><rect x="700" y="240" width="100" height="80" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="732" y="266" width="36" height="26" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lead-lined box</text><text x="735" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">stored in lead-lined containers,</text><text x="735" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">locked, labelled cupboard</text><rect x="30" y="488" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="509" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="525" width="840" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="559.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Every precaution reduces the time, increases the distance, or adds shielding.</text>
</svg>