<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 474" width="900" height="474" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="474" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 5: two ways lives changed</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How were young people affected by Nazi control?</text>
<rect x="30" y="124" width="411" height="185" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WAY 1</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Free time controlled</text><text x="50" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Hitler Youth and League of German</text><text x="66.15" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Maidens became compulsory</text><text x="50" y="262.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="262.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Camping and sport became training: boys</text><text x="66.15" y="284.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">for war, girls for motherhood</text><rect x="459" y="124" width="411" height="185" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WAY 2</text><text x="479" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Nonconformists repressed</text><text x="479" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Swing Youth: 1942, Himmler ordered</text><text x="495.15" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">leaders sent to camps</text><text x="479" y="262.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="262.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Edelweiss Pirates: some linked to them</text><text x="495.15" y="284.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">hanged, November 1944</text><rect x="30" y="331" width="840" height="111" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="365.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain how lives were affected</text><text x="50" y="395.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Most young people were drawn into organised Nazi activities; a minority who rejected them were</text><text x="50" y="417.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">treated as enemies of the state.</text>
</svg>