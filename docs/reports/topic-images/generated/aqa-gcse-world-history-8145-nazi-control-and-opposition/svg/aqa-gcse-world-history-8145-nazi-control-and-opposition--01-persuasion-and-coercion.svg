<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two methods of control</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each made the other work</text>
<circle cx="230" cy="319" r="115" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><circle cx="670" cy="319" r="115" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="230" y="311" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">PERSUASION</text><text x="230" y="339" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">propaganda, censorship,</text><text x="230" y="359" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">culture</text><text x="670" y="311" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">COERCION</text><text x="670" y="339" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">police state, camps,</text><text x="670" y="359" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">fear</text><path d="M290,218 Q450,144 600,214" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M610,420 Q450,494 300,424" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="450" y="147" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Popularity: many Germans</text><text x="450" y="168" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">co-operated with the police</text><text x="450" y="484" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Fear: people were reluctant</text><text x="450" y="505" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">to question the propaganda</text><rect x="30" y="546" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="580.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">In exam answers</text><text x="450" y="610.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A judgement about which mattered more needs evidence of both.</text>
</svg>