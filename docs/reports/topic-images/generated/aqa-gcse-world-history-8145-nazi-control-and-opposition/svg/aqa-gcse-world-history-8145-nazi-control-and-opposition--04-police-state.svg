<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The police state</text>

<path d="M450,197 L450,222 L230,222 L230,247" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M450,197 L450,222 L670,222 L670,247" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M230,365 L230,390 L230,390 L230,415" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M670,344 L670,379.5 L670,379.5 L670,415" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="290" y="100" width="320" height="97" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="128.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Heinrich Himmler</text><text x="450" y="157.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Led the SS from 1929; chief of all</text><text x="450" y="178.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">German police from 1936</text><rect x="40" y="247" width="380" height="118" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="275.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">SS</text><text x="230" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Hitler's bodyguard, grew into the main</text><text x="230" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">instrument of terror; ran the concentration and</text><text x="230" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">extermination camps</text><rect x="480" y="247" width="380" height="97" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="670" y="275.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Gestapo (1933)</text><text x="670" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Secret state police: arrest without trial, send</text><text x="670" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">to camps. Relatively few officers.</text><rect x="40" y="415" width="380" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="455.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Concentration camps</text><text x="230" y="484.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Dachau, March 1933: political prisoners first,</text><text x="230" y="505.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">then many other persecuted groups</text><rect x="480" y="415" width="380" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="670" y="455.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Informers</text><text x="670" y="484.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Denunciations by ordinary Germans; block</text><text x="670" y="505.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">wardens reported on households</text><rect x="30" y="565" width="840" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="599.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The legal system</text><text x="50" y="628.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Judges had to join the Nazi lawyers' organisation; the People's Court (1934) tried "political" crimes.</text>
</svg>