<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 915" width="900" height="915" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="915" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The range of opposition</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From everyday dissent to an attempt to kill Hitler</text>
<rect x="110" y="124" width="760" height="123" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="125" y="151" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ATTEMPT TO KILL HITLER</text><text x="125" y="177.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">July 1944 bomb plot</text><text x="125" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Army officers and conservatives. Stauffenberg's briefcase bomb, 20 July 1944. Hitler survived;</text><text x="125" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">thousands arrested.</text><rect x="110" y="257" width="760" height="123" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="125" y="284" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LEAFLET CAMPAIGN</text><text x="125" y="310.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">White Rose, 1942-43</text><text x="125" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Munich students incl. Hans and Sophie Scholl condemned Nazi crimes. Caught February 1943;</text><text x="125" y="360.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">executed within days.</text><rect x="110" y="390" width="760" height="123" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="125" y="417" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">YOUTH MOVEMENT</text><text x="125" y="443.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Edelweiss Pirates</text><text x="125" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Working-class teenagers, western cities such as Cologne. Avoided the Hitler Youth; in wartime</text><text x="125" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">some attacked Nazi targets. Group linked to them hanged, Nov 1944.</text><rect x="110" y="523" width="760" height="123" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="125" y="550" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CULTURAL REBELLION</text><text x="125" y="576.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Swing Youth</text><text x="125" y="605.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Middle-class young people, cities such as Hamburg; swing and jazz. Himmler's crackdown,</text><text x="125" y="626.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1942.</text><rect x="110" y="656" width="760" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="125" y="683" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVERYDAY DISSENT</text><text x="125" y="709.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Most opposition</text><text x="125" y="738.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Grumbling, refusing the Hitler salute, listening to foreign radio.</text><line x1="60" y1="752" x2="60" y2="134" stroke="#1e2a44" stroke-width="6" marker-end="url(#ah)"/><text transform="translate(44,441) rotate(-90)" text-anchor="middle" font-size="17" font-weight="700" fill="#1e2a44">more direct challenge to the regime</text><rect x="30" y="774" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="808.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Also</text><text x="50" y="837.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some churchmen, such as Pastor Martin Niemöller of the Confessing Church, sent to concentration</text><text x="50" y="858.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">camps from 1938.</text>
</svg>