<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nazi culture: promoted and condemned</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Culture to express race, nation and the "people's community"</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="302" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="178.1818181818182" height="51" fill="#b5d3cf"/><rect x="208.1818181818182" y="124" width="330.90909090909093" height="51" fill="#b5d3cf"/><text x="222.1818181818182" y="153.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Promoted</text><rect x="539.0909090909091" y="124" width="330.90909090909093" height="51" fill="#f2e7b8"/><text x="553.0909090909091" y="153.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Condemned</text><rect x="30" y="175" width="178.1818181818182" height="68" fill="#dce9e7"/><text x="44" y="201.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Art</text><rect x="208.1818181818182" y="175" width="330.90909090909093" height="68" fill="#ffffff"/><text x="222.1818181818182" y="201.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Heroic workers, soldiers and peasant</text><text x="222.1818181818182" y="222.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">families</text><rect x="539.0909090909091" y="175" width="330.90909090909093" height="68" fill="#ffffff"/><text x="553.0909090909091" y="201.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Modern art, mocked in the Degenerate</text><text x="553.0909090909091" y="222.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Art exhibition (Munich, 1937)</text><line x1="30" y1="243" x2="870" y2="243" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="243" width="178.1818181818182" height="47" fill="#dce9e7"/><text x="44" y="269.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Music</text><rect x="208.1818181818182" y="243" width="330.90909090909093" height="47" fill="#f8faf9"/><rect x="539.0909090909091" y="243" width="330.90909090909093" height="47" fill="#f8faf9"/><text x="553.0909090909091" y="269.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jazz, attacked as "un-German"</text><line x1="30" y1="290" x2="870" y2="290" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="290" width="178.1818181818182" height="68" fill="#dce9e7"/><text x="44" y="316.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Architecture</text><rect x="208.1818181818182" y="290" width="330.90909090909093" height="68" fill="#ffffff"/><text x="222.1818181818182" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Huge neoclassical buildings; Albert</text><text x="222.1818181818182" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Speer as Hitler's architect</text><rect x="539.0909090909091" y="290" width="330.90909090909093" height="68" fill="#ffffff"/><line x1="30" y1="358" x2="870" y2="358" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="358" width="178.1818181818182" height="68" fill="#dce9e7"/><text x="44" y="384.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Leisure</text><rect x="208.1818181818182" y="358" width="330.90909090909093" height="68" fill="#f8faf9"/><text x="222.1818181818182" y="384.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Strength through Joy: concerts, theatre</text><text x="222.1818181818182" y="405.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trips, holidays</text><rect x="539.0909090909091" y="358" width="330.90909090909093" height="68" fill="#f8faf9"/></g><line x1="208.1818181818182" y1="124" x2="208.1818181818182" y2="426" stroke="#c9d6d4" stroke-width="1.5"/><line x1="539.0909090909091" y1="124" x2="539.0909090909091" y2="426" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="302" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="448" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="482.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The aim</text><text x="50" y="512.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not only to entertain, but to make Germans feel part of a single national community with shared</text><text x="50" y="534.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">values.</text>
</svg>