<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 481" width="900" height="481" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="481" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why was opposition so limited?</text>

<line x1="330" y1="160.5" x2="407" y2="240.3" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="285" x2="407" y2="277.65" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="399" x2="407" y2="311.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="207" x2="493" y2="254.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="342" x2="493" y2="294.75" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="274.5" r="86" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="269.04" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Limited</text><text x="450" y="294.66" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">opposition</text><rect x="30" y="100" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="130.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Terror</text><text x="46" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gestapo, informers and camps</text><text x="46" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">made resistance extremely</text><text x="46" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dangerous.</text><rect x="30" y="235" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="265.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Popularity</text><text x="46" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Falling unemployment and</text><text x="46" y="314.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">foreign-policy gains in the 1930s.</text><rect x="30" y="349" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="379.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Loyalty oaths</text><text x="46" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The army swore personal loyalty to</text><text x="46" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hitler in 1934.</text><rect x="570" y="146.5" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="176.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No organisations</text><text x="586" y="205.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parties and trade unions banned in</text><text x="586" y="226.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1933: no legal structure to oppose</text><text x="586" y="247.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">through.</text><rect x="570" y="281.5" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="311.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Division</text><text x="586" y="340.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Communists, socialists, churches</text><text x="586" y="361.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and conservatives distrusted one</text><text x="586" y="382.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">another.</text>
</svg>