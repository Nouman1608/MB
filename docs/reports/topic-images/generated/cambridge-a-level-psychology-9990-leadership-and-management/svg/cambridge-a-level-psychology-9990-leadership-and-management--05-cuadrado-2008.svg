<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 863" width="900" height="863" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="863" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Cuadrado et al. (2008)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">136 psychology students, Spain's distance-learning university (53% women)</text>
<rect x="30" y="124" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Prediction from role congruity theory (Eagly and Karau, 2002)</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women leaders would be judged less favourably, especially when using stereotypically masculine styles.</text><text x="450" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A story set in a hospital emergency service (gender-neutral). Participants rated the leader's competence,</text><text x="450" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">efficacy and traits.</text><text x="455" y="314" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">MASCULINE STYLE</text><text x="455" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">autocratic, task-oriented</text><text x="735" y="314" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">FEMININE STYLE</text><text x="735" y="334" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">democratic, relationship-oriented</text><text x="300" y="402" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Man leader</text><text x="300" y="502" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Woman leader</text><rect x="320" y="354" width="270" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="455" y="406" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">rated lower</text><rect x="600" y="354" width="270" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="735" y="406" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">rated higher</text><rect x="320" y="454" width="270" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="455" y="506" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">rated lower</text><rect x="600" y="454" width="270" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="735" y="506" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">rated higher</text><text x="60" y="428" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="start">2 × 2</text><text x="60" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">experiment</text><rect x="30" y="570" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="604.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Prediction not supported</text><text x="50" y="633.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Leaders of <tspan font-weight="700" fill="#1e2a44">both</tspan> <tspan font-weight="700" fill="#1e2a44">sexes</tspan> were rated more competent, effective and favourable with the feminine styles. No</text><text x="50" y="654.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">differences between male and female leaders, or between male and female evaluators.</text><rect x="30" y="701" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="733" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="764.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fictional scenario controls extraneous variables,</text><text x="50" y="785.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">allowing cause and effect.</text><rect x="457" y="701" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="733" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="764.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reading about a leader is not working for one;</text><text x="477" y="785.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">students lack real experience of managers; one</text><text x="477" y="806.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gender-neutral setting.</text>
</svg>