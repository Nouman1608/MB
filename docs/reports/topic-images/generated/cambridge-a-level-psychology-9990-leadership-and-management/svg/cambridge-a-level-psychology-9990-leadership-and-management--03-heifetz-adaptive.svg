<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 697" width="900" height="697" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="697" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Heifetz: adaptive leadership</text>

<rect x="30" y="100" width="410" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TECHNICAL PROBLEM</text><text x="50" y="180.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Experts solve it</text><text x="50" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with existing knowledge</text><rect x="460" y="100" width="410" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADAPTIVE CHALLENGE</text><text x="480" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">People must change</text><text x="480" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">their values, beliefs or ways of working; the</text><text x="480" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leader mobilises people rather than giving the</text><text x="480" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">answer</text><text x="450" y="291" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">SIX PRINCIPLES</text><rect x="30" y="317" width="270.6666666666667" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="356.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="46" y="382.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Get on the balcony</text><text x="46" y="410.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">step back to see the whole</text><text x="46" y="430.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pattern, not just the dance floor</text><rect x="314.6666666666667" y="317" width="270.6666666666667" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="345" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="330.6666666666667" y="371.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Identify the adaptive</text><text x="330.6666666666667" y="394.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">challenge</text><text x="330.6666666666667" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">diagnose what really needs to</text><text x="330.6666666666667" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">change</text><rect x="599.3333333333334" y="317" width="270.6666666666667" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="356.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="615.3333333333334" y="382.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Regulate distress</text><text x="615.3333333333334" y="410.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pressure high enough to</text><text x="615.3333333333334" y="430.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">motivate, not overwhelm</text><rect x="30" y="476" width="270.6666666666667" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="504" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4</text><text x="46" y="530.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Maintain disciplined</text><text x="46" y="553.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">attention</text><text x="46" y="581" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">keep focus on the hard issues</text><rect x="314.6666666666667" y="476" width="270.6666666666667" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="505.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">5</text><text x="330.6666666666667" y="531.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Give the work back</text><text x="330.6666666666667" y="559.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">those affected take responsibility</text><text x="330.6666666666667" y="579.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for solutions</text><rect x="599.3333333333334" y="476" width="270.6666666666667" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="505.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">6</text><text x="615.3333333333334" y="531.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Protect voices from below</text><text x="615.3333333333334" y="559.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">listen to people raising difficult</text><text x="615.3333333333334" y="579.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">issues, even if junior</text><text x="450" y="635.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A situational approach suited to change, such as a merger or a shift to remote working; harder to test</text><text x="450" y="656.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">experimentally.</text>
</svg>