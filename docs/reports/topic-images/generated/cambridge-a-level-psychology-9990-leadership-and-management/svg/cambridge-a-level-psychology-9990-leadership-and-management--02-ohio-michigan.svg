<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ohio and Michigan: what leaders do</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Behavioural theories: leadership can be learned</text>
<rect x="30" y="124" width="410" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="158" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OHIO: TWO SEPARATE DIMENSIONS</text><rect x="110" y="194" width="290" height="240" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><rect x="255" y="194" width="145" height="120" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="327.5" y="248" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">high on both:</text><text x="327.5" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">often most</text><text x="327.5" y="286" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">effective</text><line x1="110" y1="434" x2="414" y2="434" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="110" y1="434" x2="110" y2="180" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="255" y="464" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Initiating structure</text><text x="255" y="484" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tasks, roles, deadlines</text><text x="80" y="314" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 80 314)">Consideration</text><text x="98" y="314" font-size="15" fill="#4a5568" text-anchor="middle" transform="rotate(-90 98 314)">trust, respect, concern</text><text x="235" y="512" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">method: questionnaires describing leader behaviour</text><rect x="460" y="124" width="410" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="158" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MICHIGAN: ONE DIMENSION (ORIGINALLY)</text><line x1="500" y1="294" x2="830" y2="294" stroke="#1e2a44" stroke-width="4"/><circle cx="500" cy="294" r="9" fill="#1e2a44"/><circle cx="830" cy="294" r="9" fill="#1e2a44"/><rect x="478" y="324" width="182" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="569" y="346.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Job-centred</text><text x="569" y="373" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tasks and output</text><rect x="670" y="324" width="182" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="761" y="346.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Employee-centred</text><text x="761" y="373" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">people, relationships</text><text x="665" y="264" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">opposite ends of one line</text><text x="480" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Employee-centred leaders were associated with</text><text x="480" y="456" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">more</tspan> <tspan font-weight="700">productive</tspan> <tspan font-weight="700">groups</tspan>.</text><text x="665" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">method: compared leaders of more</text><text x="665" y="512" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and less productive groups</text><rect x="30" y="546" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="578.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Ohio's dimensions are <tspan font-weight="700" fill="#1e2a44">independent</tspan>, not opposites. Both approaches suggest leaders can be trained, but</text><text x="450" y="599.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">rely on questionnaires and do not show which behaviour suits a given situation.</text>
</svg>