<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Scouller's three levels of leadership</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The inner level underpins the other two</text>
<circle cx="300" cy="334" r="200" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><circle cx="300" cy="374" r="135" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><circle cx="300" cy="419" r="70" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="300" y="194" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">PUBLIC</text><text x="300" y="284" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">PRIVATE</text><text x="300" y="426" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">PERSONAL</text><rect x="540" y="134" width="330" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="560" y="166" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">PUBLIC</text><text x="560" y="192.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Towards a group</text><text x="560" y="220.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">setting a shared vision, running</text><text x="560" y="241.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">meetings</text><rect x="540" y="269" width="330" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="560" y="301" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">PRIVATE</text><text x="560" y="327.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One-to-one</text><text x="560" y="355.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">coaching and giving feedback to</text><text x="560" y="376.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">individuals</text><rect x="540" y="404" width="330" height="132" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="560" y="436" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">PERSONAL</text><text x="560" y="462.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The inner level</text><text x="560" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">self-awareness, technical know-how</text><text x="560" y="511.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and attitudes</text><text x="450" y="579.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Do not confuse <tspan font-weight="700">private</tspan> (one-to-one) with <tspan font-weight="700">personal</tspan> (the inner self).</text>
</svg>