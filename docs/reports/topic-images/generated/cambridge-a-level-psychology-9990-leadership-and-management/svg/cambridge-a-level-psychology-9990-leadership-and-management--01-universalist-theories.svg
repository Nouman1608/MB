<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Universalist theories of leadership</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The qualities of a good leader are the same in every situation</text>
<rect x="30" y="124" width="270.6666666666667" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GREAT PERSON</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Born with special traits</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">intelligence, confidence,</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">determination; based on</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">famous historical leaders</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHARISMATIC</text><text x="334.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Personal appeal</text><text x="334.6666666666667" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">confidence and a compelling</text><text x="334.6666666666667" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">vision; followers identify with</text><text x="334.6666666666667" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the leader</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRANSFORMATIONAL</text><text x="619.3333333333334" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Beyond expectations</text><text x="619.3333333333334" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">followers put the group's</text><text x="619.3333333333334" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">goals above their own</text><text x="619.3333333333334" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interests</text><text x="450" y="314" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">TRANSFORMATIONAL LEADERSHIP: FOUR COMPONENTS</text><rect x="30" y="340" width="413" height="87" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="374.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Idealised influence</text><text x="50" y="402.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">acting as a role model</text><rect x="457" y="340" width="413" height="87" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="374.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inspirational motivation</text><text x="477" y="402.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">communicating a vision</text><rect x="30" y="439" width="413" height="87" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="473.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Intellectual stimulation</text><text x="50" y="501.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">encouraging new ideas</text><rect x="457" y="439" width="413" height="87" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="473.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Individualised consideration</text><text x="477" y="501.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">attending to each follower's needs</text><rect x="30" y="548" width="275.3333333333333" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="580" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTRAST</text><text x="50" y="611.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Transactional</tspan> leadership</text><text x="50" y="632.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exchanges rewards for</text><text x="50" y="653.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">performance.</text><rect x="319.3333333333333" y="548" width="550.6666666666666" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="339.3333333333333" y="580" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVALUATION</text><text x="339.3333333333333" y="611.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Great person theory is deterministic (nature) and cannot explain</text><text x="339.3333333333333" y="632.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">success in one situation and failure in another; charisma can be</text><text x="339.3333333333333" y="653.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">misused, and organisations may struggle when the leader leaves.</text>
</svg>