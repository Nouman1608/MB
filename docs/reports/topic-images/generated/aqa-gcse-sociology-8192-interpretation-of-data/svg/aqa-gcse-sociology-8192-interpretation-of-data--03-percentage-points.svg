<rect width="900" height="608" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Percentage points or percentage change?</text>

<text x="450" y="92" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">Fictional Westbridge household survey</text><line x1="90" y1="470" x2="510" y2="470" stroke="#1e2a44" stroke-width="2.5"/><line x1="90" y1="470" x2="90" y2="140" stroke="#1e2a44" stroke-width="2.5"/><line x1="84" y1="470" x2="90" y2="470" stroke="#1e2a44" stroke-width="2"/><text x="78" y="475" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">0%</text><line x1="84" y1="387.5" x2="90" y2="387.5" stroke="#1e2a44" stroke-width="2"/><text x="78" y="392.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">10%</text><line x1="90" y1="387.5" x2="510" y2="387.5" stroke="#c9d6d4" stroke-width="1.5"/><line x1="84" y1="305" x2="90" y2="305" stroke="#1e2a44" stroke-width="2"/><text x="78" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">20%</text><line x1="90" y1="305" x2="510" y2="305" stroke="#c9d6d4" stroke-width="1.5"/><line x1="84" y1="222.5" x2="90" y2="222.5" stroke="#1e2a44" stroke-width="2"/><text x="78" y="227.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">30%</text><line x1="90" y1="222.5" x2="510" y2="222.5" stroke="#c9d6d4" stroke-width="1.5"/><line x1="84" y1="140" x2="90" y2="140" stroke="#1e2a44" stroke-width="2"/><text x="78" y="145" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">40%</text><line x1="90" y1="140" x2="510" y2="140" stroke="#c9d6d4" stroke-width="1.5"/><text x="150" y="496" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">2005</text><text x="300" y="496" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">2015</text><text x="450" y="496" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">2025</text><path d="M150,156.5 L300,189.5 L450,222.5" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="150" cy="156.5" r="6" fill="#2e6b62"/><circle cx="300" cy="189.5" r="6" fill="#2e6b62"/><circle cx="450" cy="222.5" r="6" fill="#2e6b62"/><path d="M150,239.00000000000003 L300,222.5 L450,214.25" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="150" cy="239.00000000000003" r="6" fill="#8a6d0d"/><circle cx="300" cy="222.5" r="6" fill="#8a6d0d"/><circle cx="450" cy="214.25" r="6" fill="#8a6d0d"/><path d="M150,263.75 L300,263.75 L450,247.24999999999997" fill="none" stroke="#4a5568" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="150" cy="263.75" r="6" fill="#4a5568"/><circle cx="300" cy="263.75" r="6" fill="#4a5568"/><circle cx="450" cy="247.24999999999997" r="6" fill="#4a5568"/><path d="M150,395.75 L300,379.25 L450,371" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="150" cy="395.75" r="6" fill="#b5602e"/><circle cx="300" cy="379.25" r="6" fill="#b5602e"/><circle cx="450" cy="371" r="6" fill="#b5602e"/><text x="138" y="146.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">38%</text><text x="462" y="242.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">30%</text><text x="138" y="400.75" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">9%</text><text x="462" y="376" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">12%</text><text x="560" y="130" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Household type</text><line x1="560" y1="158" x2="590" y2="158" stroke="#2e6b62" stroke-width="5"/><text x="600" y="164" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Couple with dependent children</text><line x1="560" y1="202" x2="590" y2="202" stroke="#8a6d0d" stroke-width="5"/><text x="600" y="208" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">One person</text><line x1="560" y1="246" x2="590" y2="246" stroke="#4a5568" stroke-width="5"/><text x="600" y="252" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Other</text><line x1="560" y1="290" x2="590" y2="290" stroke="#b5602e" stroke-width="5"/><text x="600" y="296" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Lone parent with dependent children</text><rect x="560" y="330" width="310" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="576" y="358" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Lone parent: 9% → 12%</text><text x="576" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">12 − 9 = <tspan font-weight="700">3 percentage points</tspan></text><text x="576" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">3 ÷ 9 × 100 = <tspan font-weight="700">33% increase</tspan></text><text x="576" y="436" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(to the nearest whole number)</text><rect x="30" y="520" width="840" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="548" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Couples with dependent children: 38% → 30% = a fall of 8 percentage points</text><text x="450" y="572" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Never call a fall in percentage points a percentage fall</text>
</svg>