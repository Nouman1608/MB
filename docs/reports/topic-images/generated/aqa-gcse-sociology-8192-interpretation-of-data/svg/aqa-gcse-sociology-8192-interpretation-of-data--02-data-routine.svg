<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 518" width="900" height="518" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="518" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A routine for any data item</text>

<rect x="30" y="108" width="410" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="66" cy="151" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="158.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="100" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Read the title</text><text x="100" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What is measured, where and when?</text><rect x="30" y="208" width="410" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="66" cy="251" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="258.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="100" y="244" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Check the units</text><text x="100" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Numbers, %, rates per 1,000, thousands?</text><rect x="30" y="308" width="410" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="66" cy="351" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="358.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="100" y="344" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Check source and sample</text><text x="100" y="372" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who produced it? How many people?</text><rect x="30" y="408" width="410" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="66" cy="451" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="458.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="100" y="444" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Find the overall pattern or trend</text><text x="100" y="472" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Describe it in one sentence</text><rect x="460" y="108" width="410" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="496" cy="151" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="496" y="158.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="530" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Quote figures</text><text x="530" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Highest, lowest, first and last values</text><rect x="460" y="208" width="410" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="496" cy="251" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="496" y="258.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="530" y="244" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Note exceptions</text><text x="530" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A year or group that does not fit</text><rect x="460" y="308" width="410" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><circle cx="496" cy="351" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="496" y="358.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="530" y="344" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ask what it cannot show</text><text x="530" y="372" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Causes, meanings, groups not included</text><rect x="460" y="408" width="410" height="86" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="476" y="444" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Steps 1–3 before you describe; step 7</text><text x="476" y="466" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">before you conclude.</text>
</svg>