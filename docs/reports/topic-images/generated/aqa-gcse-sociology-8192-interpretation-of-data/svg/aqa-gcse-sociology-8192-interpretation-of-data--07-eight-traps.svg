<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 694" width="900" height="694" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="694" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eight traps when reading data</text>

<rect x="30" y="104" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Numbers vs rates</text><circle cx="64" cy="129" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="135.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="46" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A larger town may have more crimes simply</text><text x="46" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">because it has more people</text><rect x="458" y="104" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Percentage vs points</text><circle cx="492" cy="129" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="135.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="474" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">20% to 30% is 10 percentage points, a 50%</text><text x="474" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">increase</text><rect x="30" y="248" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,298 L31.25,262.25 Q31.25,249.25 44.25,249.25 L427.75,249.25 Q440.75,249.25 440.75,262.25 L440.75,298 Z" fill="#dce9e7"/><line x1="31.25" y1="298" x2="440.75" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="278.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Truncated axes</text><circle cx="64" cy="273" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="279.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="46" y="331.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An axis starting at 40, not 0, makes small</text><text x="46" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">differences look large</text><rect x="458" y="248" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,298 L459.25,262.25 Q459.25,249.25 472.25,249.25 L855.75,249.25 Q868.75,249.25 868.75,262.25 L868.75,298 Z" fill="#dce9e7"/><line x1="459.25" y1="298" x2="868.75" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="278.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Missing years</text><circle cx="492" cy="273" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="279.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="474" y="331.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Data for 2000, 2010 and 2025 cannot show what</text><text x="474" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">happened in between</text><rect x="30" y="392" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,442 L31.25,406.25 Q31.25,393.25 44.25,393.25 L427.75,393.25 Q440.75,393.25 440.75,406.25 L440.75,442 Z" fill="#f2e7b8"/><line x1="31.25" y1="442" x2="440.75" y2="442" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="422.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Correlation is not cause</text><circle cx="64" cy="417" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="423.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="46" y="475.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More police may mean more crime is detected,</text><text x="46" y="496.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not committed</text><rect x="458" y="392" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,442 L459.25,406.25 Q459.25,393.25 472.25,393.25 L855.75,393.25 Q868.75,393.25 868.75,406.25 L868.75,442 Z" fill="#f2e7b8"/><line x1="459.25" y1="442" x2="868.75" y2="442" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="422.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Small samples</text><circle cx="492" cy="417" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="423.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="474" y="475.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A percentage based on 20 people can swing with</text><text x="474" y="496.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one or two answers</text><rect x="30" y="536" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,586 L31.25,550.25 Q31.25,537.25 44.25,537.25 L427.75,537.25 Q440.75,537.25 440.75,550.25 L440.75,586 Z" fill="#dce9e7"/><line x1="31.25" y1="586" x2="440.75" y2="586" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="566.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Definitions</text><circle cx="64" cy="561" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="567.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="46" y="619.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">If “poverty” or “crime” is defined differently,</text><text x="46" y="640.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a trend may be false</text><rect x="458" y="536" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,586 L459.25,550.25 Q459.25,537.25 472.25,537.25 L855.75,537.25 Q868.75,537.25 868.75,550.25 L868.75,586 Z" fill="#dce9e7"/><line x1="459.25" y1="586" x2="868.75" y2="586" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="566.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who is missing</text><circle cx="492" cy="561" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="567.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="474" y="619.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A survey of pupils says nothing about young</text><text x="474" y="640.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people not in school</text>
</svg>