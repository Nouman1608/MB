<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 464" width="900" height="464" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="464" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From reading to writing across the paper</text>

<rect x="30" y="120" width="260" height="200" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Ex. 1-3</text><text x="50" y="183" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reading of</text><text x="50" y="209" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">increasing depth</text><text x="50" y="237.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gist → matching → detailed</text><text x="50" y="259.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">notes</text><line x1="292" y1="220" x2="318" y2="220" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="120" width="260" height="200" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="340" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Ex. 4</text><text x="340" y="183" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Summary</text><text x="340" y="211.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">own words, not copying:</text><text x="340" y="233.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">practise paraphrase as its</text><text x="340" y="255.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">own skill</text><line x1="582" y1="220" x2="608" y2="220" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="120" width="260" height="200" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="630" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Ex. 5-6</text><text x="630" y="183" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose-driven</text><text x="630" y="209" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">writing</text><text x="630" y="237.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">24 of 60 marks: purpose,</text><text x="630" y="259.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">format and audience must</text><text x="630" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">show</text><rect x="30" y="344" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="380" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Practise each skill on its own first,</text><text x="54" y="410" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">then combine them under timed exam conditions.</text>
</svg>