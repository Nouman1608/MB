<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: answering a "why" question</text>

<rect x="30" y="110" width="840" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Question: Why did the writer decide to leave the village?</text><text x="54" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The passage: he found no work, and his children's school had closed.</text><rect x="30" y="230" width="410" height="190" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="267" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Weak answer</text><text x="50" y="295.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Copies the two sentences verbatim.</text><text x="50" y="327.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shows where the answer is, not</text><text x="50" y="349.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">understanding.</text><rect x="460" y="230" width="410" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="267" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Strong answer</text><text x="480" y="295.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gives the reason in your own Urdu: economic</text><text x="480" y="317.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">necessity (no employment) combined with</text><text x="480" y="339.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">concern for the children's education.</text><text x="450" y="470" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Then check</text><rect x="30" y="490" width="268" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="531" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Does it answer WHY, not WHAT?</text><rect x="316" y="490" width="268" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="531" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Is it in your own words?</text><rect x="602" y="490" width="268" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="531" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Is the length right for the marks?</text>
</svg>