<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" width="900" height="644" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="644" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where accuracy marks are lost</text>

<rect x="30" y="110" width="840" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="12" height="74" rx="4" fill="#d4b02e"/><text x="62" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gender agreement</text><text x="62" y="168" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nouns carry gender; adjectives and verbs must agree</text><rect x="30" y="196" width="840" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="196" width="12" height="74" rx="4" fill="#b5d3cf"/><text x="62" y="228" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Verb tense and person</text><text x="62" y="254" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">consistent across a narrative; correct forms for respect levels</text><rect x="30" y="282" width="840" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="282" width="12" height="74" rx="4" fill="#d4b02e"/><text x="62" y="314" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Postpositions</text><text x="62" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ne, ko, se, mein, par; the ergative ne with transitive perfective verbs</text><rect x="30" y="368" width="840" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="368" width="12" height="74" rx="4" fill="#b5d3cf"/><text x="62" y="400" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Izafat and compounds</text><text x="62" y="426" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in more formal registers</text><rect x="30" y="454" width="840" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="454" width="12" height="74" rx="4" fill="#b5d3cf"/><text x="62" y="486" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Script accuracy</text><text x="62" y="512" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dots and diacritics: a misplaced dot changes the word</text><rect x="30" y="546" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="589" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Reserve five minutes to reread: it catches most agreement errors.</text>
</svg>