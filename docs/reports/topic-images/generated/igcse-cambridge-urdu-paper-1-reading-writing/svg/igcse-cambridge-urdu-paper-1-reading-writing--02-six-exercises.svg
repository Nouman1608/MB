<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 1: six exercises, 60 marks</text>

<rect x="30" y="110" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="150" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="66" y="157.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="100" y="144" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Short answer questions</text><text x="100" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">skim a short text; single words or short phrases</text><rect x="500" y="132" width="136" height="36" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="646" y="157" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">8 marks</text><rect x="30" y="202" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="242" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="66" y="249.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="100" y="236" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Multiple matching</text><text x="100" y="262" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">match sentences to short paragraphs</text><rect x="500" y="224" width="153" height="36" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="663" y="249" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">9 marks</text><rect x="30" y="294" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="334" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="66" y="341.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="100" y="328" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Note-making</text><text x="100" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">brief notes under supplied headings</text><rect x="500" y="316" width="153" height="36" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="663" y="341" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">9 marks</text><rect x="30" y="386" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="426" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="66" y="433.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="100" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Summary</text><text x="100" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">up to 100 words, own words as far as possible</text><rect x="500" y="408" width="170" height="36" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="680" y="433" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">10 marks</text><rect x="30" y="478" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="518" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="66" y="525.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="100" y="512" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Writing exercise</text><text x="100" y="538" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">about 120 words of functional prose, e.g. an email</text><rect x="500" y="500" width="136" height="36" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="646" y="525" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">8 marks</text><rect x="30" y="570" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="610" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="66" y="617.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="100" y="604" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Extended writing</text><text x="100" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">about 200 words of continuous prose</text><rect x="500" y="592" width="272" height="36" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="782" y="617" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">16 marks</text><rect x="60" y="668" width="28" height="22" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="98" y="685" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reading</text><rect x="320" y="668" width="28" height="22" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="358" y="685" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reading + writing</text><rect x="580" y="668" width="28" height="22" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="618" y="685" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">writing</text><text x="840" y="685" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">total 60</text>
</svg>