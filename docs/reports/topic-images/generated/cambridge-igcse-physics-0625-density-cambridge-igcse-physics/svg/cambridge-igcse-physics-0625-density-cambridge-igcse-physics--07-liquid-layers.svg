 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Liquids that do not mix form layers</text>

<text x="450" y="92" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Extended only</text><rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="113" y="210" width="254" height="110" fill="#f2e7b8"/><text x="240" y="272" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Y  0.86 g/cm³</text><rect x="113" y="320" width="254" height="110" fill="#dce9e7"/><text x="240" y="382" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">water  1.00 g/cm³</text><rect x="113" y="430" width="254" height="117" fill="#d9a37a"/><text x="240" y="495.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">X  1.26 g/cm³</text><path d="M110,160 L110,550 L370,550 L370,160" fill="none" stroke="#1e2a44" stroke-width="3.5"/><line x1="110" y1="320" x2="370" y2="320" stroke="#1e2a44" stroke-width="1.5" stroke-linecap="round"/><line x1="110" y1="430" x2="370" y2="430" stroke="#1e2a44" stroke-width="1.5" stroke-linecap="round"/><circle cx="315" cy="322" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><line x1="410" y1="280" x2="332" y2="304" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="400" y="270" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">bead 0.95</text><text x="240" y="582" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">densest at the bottom</text><line x1="560" y1="170" x2="560" y2="580" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="560" y="155" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">density / g/cm³ (increasing downwards)</text><line x1="552" y1="243.19999999999996" x2="568" y2="243.19999999999996" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="544" y="249.19999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">0.86</text><text x="578" y="249.19999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Y</text><line x1="552" y1="344" x2="568" y2="344" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="544" y="350" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">1.00</text><text x="578" y="350" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">water</text><line x1="552" y1="531.2" x2="568" y2="531.2" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="544" y="537.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">1.26</text><text x="578" y="537.2" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">X</text><circle cx="560" cy="307.99999999999994" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="578" y="313.99999999999994" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">bead 0.95</text><rect x="600" y="440" width="250" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="725" y="467.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">bead: denser than Y,</text><text x="725" y="489.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">so sinks through Y;</text><text x="725" y="511.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">less dense than water,</text><text x="725" y="533.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">so floats on it</text>
</svg>