<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Density: mass per unit volume</text>

<rect x="30" y="110" width="410" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M230,140 L380,390 L80,390 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round"/><line x1="154" y1="267" x2="306" y2="267" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="230" y1="267" x2="230" y2="390" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="230" y="245" font-size="46" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">m</text><text x="170" y="350" font-size="46" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">ρ</text><text x="290" y="350" font-size="46" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">V</text><rect x="460" y="110" width="410" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Keep the units matched</text><rect x="480" y="170" width="380" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="500" y="209" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">kg and m³</text><line x1="655" y1="202" x2="710" y2="202" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="725" y="210" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">kg/m³</text><rect x="480" y="245" width="380" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="500" y="284" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">g and cm³</text><line x1="655" y1="277" x2="710" y2="277" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="725" y="285" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">g/cm³</text><text x="490" y="360" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Converting g/cm³ to kg/m³</text><text x="490" y="398" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">1 g = 0.001 kg</text><text x="490" y="428" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">1 cm³ = 0.000 001 m³</text><text x="490" y="466" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">1 g/cm³ = 0.001 ÷ 0.000 001</text><text x="568" y="496" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">= 1000 kg/m³</text><rect x="480" y="528" width="380" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="670" y="562.15" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Water: about 1.0 g/cm³</text><text x="670" y="587.15" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">= 1000 kg/m³</text><text x="60" y="470" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">ρ = m / V</text><text x="200" y="470" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">density = mass ÷ volume</text><text x="60" y="522" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">m = ρ V</text><text x="200" y="522" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">mass = density × volume</text><text x="60" y="574" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">V = m / ρ</text><text x="200" y="574" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">volume = mass ÷ density</text>
</svg>