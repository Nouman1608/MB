="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="44" rx="12" fill="#b5d3cf"/><rect x="460" y="140" width="410" height="14" fill="#b5d3cf"/><text x="665" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">B: displacement (overflow) can</text><path d="M490,230 L490,430 L620,430 L620,230" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="492" y="260" width="126" height="168" fill="#b5d3cf"/><path d="M620,260 L690,290 L690,302 L620,274" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="555" y1="160" x2="555" y2="350" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><path d="M533,370 l10,-16 l22,-2 l14,14 l-6,18 l-26,4 z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M692,304 q4,30 0,70" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="660" y="350" width="64" height="150" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="662" y="447.5" width="60" height="50.5" fill="#b5d3cf"/><path d="M662,443.5 Q692,453.5 722,443.5" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="660" y1="485" x2="672" y2="485" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="660" y1="470" x2="680" y2="470" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="660" y1="455" x2="672" y2="455" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="660" y1="440" x2="680" y2="440" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="660" y1="425" x2="672" y2="425" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="660" y1="410" x2="680" y2="410" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="660" y1="395" x2="672" y2="395" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="660" y1="380" x2="680" y