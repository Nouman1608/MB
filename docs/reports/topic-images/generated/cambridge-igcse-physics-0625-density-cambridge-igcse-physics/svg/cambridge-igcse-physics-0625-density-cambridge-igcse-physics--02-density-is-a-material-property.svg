<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cut the block: the density stays the same</text>

<rect x="30" y="110" width="840" height="480" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M80,230 L130,190 L350,190 L300,230 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M300,230 L350,190 L350,340 L300,380 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="80" y="230" width="220" height="150" rx="0" fill="#e3b98f" stroke="#1e2a44" stroke-width="3"/><text x="190" y="430" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">whole copper block</text><text x="190" y="460" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">mass m, volume V</text><text x="190" y="490" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">density m / V</text><line x1="395" y1="300" x2="470" y2="300" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="432" y="280" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">cut</text><path d="M510,230 L560,190 L660,190 L610,230 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M610,230 L660,190 L660,340 L610,380 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="510" y="230" width="100" height="150" rx="0" fill="#e3b98f" stroke="#1e2a44" stroke-width="3"/><text x="560" y="430" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">each half</text><text x="560" y="460" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">m/2 and V/2</text><text x="560" y="490" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle"></text><path d="M680,230 L730,190 L830,190 L780,230 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M780,230 L830,190 L830,340 L780,380 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="680" y="230" width="100" height="150" rx="0" fill="#e3b98f" stroke="#1e2a44" stroke-width="3"/><text x="730" y="430" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="730" y="460" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle"></text><text x="730" y="490" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle"></text><text x="680" y="490" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">density = (m/2) ÷ (V/2) = m / V</text><rect x="80" y="515" width="740" height="52" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="547.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Density belongs to the material, so it can help identify the material.</text>
</svg>