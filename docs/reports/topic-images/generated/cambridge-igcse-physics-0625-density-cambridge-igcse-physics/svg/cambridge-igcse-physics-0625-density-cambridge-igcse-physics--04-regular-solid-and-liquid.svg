<rect x="30" y="110" width="410" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="410" height="44" rx="12" fill="#b5d3cf"/><rect x="30" y="140" width="410" height="14" fill="#b5d3cf"/><text x="235" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Brass cuboid</text><path d="M140,310 L190,270 L340,270 L290,310 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M290,310 L340,270 L340,340 L290,380 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="140" y="310" width="150" height="70" rx="0" fill="#e3b98f" stroke="#1e2a44" stroke-width="3"/><text x="215" y="302" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5.0 cm</text><text x="348" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">3.0 cm</text><text x="130" y="352" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">2.0 cm</text><text x="235" y="200" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">ruler gives the sides</text><rect x="115" y="380" width="240" height="18" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><rect x="105" y="398" width="260" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="175" y="410" width="120" height="34" rx="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="235" y="436" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">255 g</text><rect x="50" y="470" width="370" height="154" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="70" y="506" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Calculation</text><text x="70" y="540" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">V = 5.0 × 3.0 × 2.0 = 30 cm³</text><text x="70" y="572" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">ρ = 255 / 30</text><text x="100" y="604" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">= 8.5 g/cm³ = 8500 kg/m³</text><rect x="460" y="110" width="410" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="44" rx="12" fill="#b5d3cf"/><rect x="460" y="140" width="410" height="14" fill="#b5d3cf"/><text x="665" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A liquid</text><rect x="530" y="200" width="70" height="170" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="532" y="370" width="66" height="-2" fill="#b5d3cf"/><path d="M532,366 Q565,376 598,366" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="530" y1="353" x2="542" y2="353" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="530" y1="336" x2="550" y2="336" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="530" y1="319" x2="542" y2="319" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="530" y1="302" x2="550" y2="302" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="530" y1="285" x2="542" y2="285" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="530" y1="268" x2="550" y2="268" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="530" y1="251" x2="542" y2="251" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="530" y1="234" x2="550" y2="234" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="530" y1="217" x2="542" y2="217" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><rect x="516" y="370" width="98" height="10" rx="3" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="485" y="390" width="160" height="18" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><rect x="475" y="408" width="180" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="505" y="420" width="120" height="34" rx="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="565" y="446" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">86.4 g</text><rect x="730" y="200" width="70" height="170" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="732" y="264.6" width="66" height="103.39999999999998" fill="#b5d3cf"/><path d="M732,260.6 Q765,270.6 798,260.6" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="730" y1="353" x2="742" y2="353" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="730" y1="336" x2="750" y2="336" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="730" y1="319" x2="742" y2="319" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="730" y1="302" x2="750" y2="302" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="730" y1="285" x2="742" y2="285" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="730" y1="268" x2="750" y2="268" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="730" y1="251" x2="742" y2="251" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="730" y1="234" x2="750" y2="234" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="730" y1="217" x2="742" y2="217" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><rect x="716" y="370" width="98" height="10" rx="3" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="685" y="390" width="160" height="18" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><rect x="675" y="408" width="180" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="705" y="420" width="120" height="34" rx="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="765" y="446" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">126.4 g</text><text x="565" y="190" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">empty</text><text x="765" y="190" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">50.0 cm³ liquid</text><rect x="480" y="470" width="370" height="154" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="500" y="506" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Calculation</text><text x="500" y="540" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">mass = 126.4 − 86.4 = 40.0 g</text><text x="500" y="572" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">ρ = 40.0 / 50.0</text><text x="530" y="604" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">= 0.800 g/cm³</text>
