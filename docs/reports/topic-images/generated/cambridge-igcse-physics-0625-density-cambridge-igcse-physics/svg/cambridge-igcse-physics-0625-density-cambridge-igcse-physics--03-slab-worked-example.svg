<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mass and weight of a concrete slab</text>

<rect x="30" y="110" width="420" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M100,260 L180,190 L420,190 L340,260 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M340,260 L420,190 L420,230 L340,300 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="100" y="260" width="240" height="40" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><line x1="100" y1="330" x2="340" y2="330" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="220" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0.60 m</text><line x1="354" y1="302" x2="425" y2="240" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="384" y="305" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">0.40 m</text><line x1="80" y1="262" x2="80" y2="298" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="36" y="230" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">0.050 m</text><text x="240" y="165" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">concrete: ρ = 2400 kg/m³</text><text x="240" y="420" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">g = 9.8 N/kg</text><text x="240" y="455" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">metres → m³ → pairs with kg/m³</text><rect x="470" y="140" width="400" height="262" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="176" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 1</text><text x="490" y="210" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">V = 0.60 × 0.40 × 0.050</text><text x="520" y="244" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">= 0.012 m³</text><text x="490" y="278" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">m = ρ V = 2400 × 0.012</text><text x="520" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">= 28.8 kg</text><text x="490" y="346" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">W = m g = 28.8 × 9.8</text><text x="520" y="380" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">= 282 N  (about 280 N)</text>
</svg>