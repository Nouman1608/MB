ht="600" fill="#1e2a44" text-anchor="middle">the liquid</text><text x="730" y="276.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">→ FLOATS</text><rect x="610" y="340" width="240" height="150" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="730" y="396.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">denser than</text><text x="730" y="421.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">the liquid</text><text x="730" y="446.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">→ SINKS</text><text x="450" y="545" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Given mass and volume? Work out ρ = m/V first, then compare.</text>
