<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" width="900" height="505" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="505" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How important was Italy for Europe?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each power gained or lost</text>
<line x1="320" y1="184.5" x2="409" y2="264.3" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="309" x2="409" y2="301.65" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="423" x2="409" y2="335.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="241.5" x2="491" y2="281.4" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="355.5" x2="491" y2="315.6" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="298.5" r="82" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="293.56" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Italian</text><text x="450" y="316.74" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">unification</text><rect x="30" y="124" width="290" height="121" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Austria</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lost Lombardy (1859) and</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Venetia (1866); weakened against</text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prussia</text><rect x="30" y="259" width="290" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="289.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">France</text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gained Nice and Savoy; angered</text><text x="46" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nationalists and Catholics</text><rect x="30" y="373" width="290" height="100" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="403.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Papacy</text><text x="46" y="431.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lost its lands: the "Roman</text><text x="46" y="452.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Question"</text><rect x="580" y="191.5" width="290" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="596" y="221.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prussia</text><text x="596" y="250.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An ally in 1866; an example of</text><text x="596" y="271.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unifying by war</text><rect x="580" y="305.5" width="290" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="596" y="335.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Britain</text><text x="596" y="364.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Welcomed a liberal cause that</text><text x="596" y="385.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">weakened France and Austria</text>
</svg>