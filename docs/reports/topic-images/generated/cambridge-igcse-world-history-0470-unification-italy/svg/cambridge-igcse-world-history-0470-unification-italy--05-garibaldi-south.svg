<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Garibaldi, Cavour and the South, 1860</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Labelled schematic, not to scale: two forces head for Naples</text>
<rect x="30" y="124" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M290,184 C380,184 420,244 440,294 S640,299 715,338" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="70" y="154" width="220" height="68" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="179.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Piedmont</text><text x="180" y="206" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Cavour, Victor Emmanuel</text><rect x="330" y="264" width="220" height="88" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="440" y="289.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Papal States</text><text x="440" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Rome avoided: French</text><text x="440" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">garrison</text><rect x="600" y="344" width="230" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="715" y="369.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Naples</text><text x="715" y="396" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Entered September 1860</text><rect x="330" y="424" width="220" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="440" y="449.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sicily</text><text x="440" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Marsala; Calatafimi;</text><text x="440" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Palermo</text><path d="M180,222 L180,454 L324,464" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 8" marker-end="url(#ahR)"/><text x="170" y="354" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">The Thousand,</text><text x="170" y="374" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">from near Genoa</text><text x="170" y="394" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">(May)</text><path d="M556,464 Q600,454 650,420" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 8" marker-end="url(#ahR)"/><text x="640" y="484" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">crosses (August)</text><text x="600" y="214" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Piedmontese army,</text><text x="600" y="234" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">through the Papal States</text><rect x="30" y="546" width="411" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="578" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAVOUR'S FEARS</text><text x="50" y="604.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A march on Rome</text><text x="50" y="632.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">War with France, or a separate republic in the</text><text x="50" y="653.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">south</text><rect x="459" y="546" width="411" height="132" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="479" y="578" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OCTOBER 1860</text><text x="479" y="604.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Teano</text><text x="479" y="632.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Garibaldi hands his conquests to Victor</text><text x="479" y="653.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Emmanuel; plebiscites approve union</text>
</svg>