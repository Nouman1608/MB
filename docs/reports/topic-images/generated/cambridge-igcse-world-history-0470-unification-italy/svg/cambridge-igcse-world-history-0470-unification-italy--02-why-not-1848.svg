<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 459" width="900" height="459" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="459" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Italy could not "do it by herself", 1848-49</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Five reasons, one lesson</text>
<rect x="30" y="124" width="155.2" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="148.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Austria</text><text x="42" y="168.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">recovered</text><text x="42" y="194.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">Radetzky: Custoza</text><text x="42" y="213.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">(1848), Novara</text><text x="42" y="232.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">(1849)</text><rect x="201.2" y="124" width="155.2" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="213.2" y="158.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Divided leaders</text><text x="213.2" y="184.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">Charles Albert</text><text x="213.2" y="203.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">against Mazzini's</text><text x="213.2" y="222.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">republicans</text><rect x="372.4" y="124" width="155.2" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="384.4" y="158.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Pius IX refused</text><text x="384.4" y="184.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">No war on Catholic</text><text x="384.4" y="203.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">Austria (April</text><text x="384.4" y="222.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">1848)</text><rect x="543.5999999999999" y="124" width="155.2" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="555.5999999999999" y="157.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Naples</text><text x="555.5999999999999" y="177.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">withdrew</text><text x="555.5999999999999" y="204.1" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">Its troops left the</text><text x="555.5999999999999" y="223.1" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">war</text><rect x="714.8" y="124" width="155.2" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="726.8" y="157.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">France</text><text x="726.8" y="177.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">intervened</text><text x="726.8" y="204.1" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">Restored the Pope</text><text x="726.8" y="223.1" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">(1849)</text><rect x="150" y="312" width="600" height="115" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="344" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">THE LESSON</text><text x="450" y="372.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A strong foreign ally was needed to defeat Austria</text><text x="450" y="402.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Piedmont, with its Statuto and Victor Emmanuel II, the obvious leader</text><line x1="107.6" y1="254" x2="300" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="278.79999999999995" y1="254" x2="375" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="254" x2="450" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="621.1999999999999" y1="254" x2="525" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="792.4" y1="254" x2="600" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>