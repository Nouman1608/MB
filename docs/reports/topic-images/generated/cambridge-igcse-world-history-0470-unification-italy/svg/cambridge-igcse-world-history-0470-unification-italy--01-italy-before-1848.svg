<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" width="900" height="586" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="586" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Italy before 1848: who ruled what</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Labelled schematic, not to scale and not a map</text>
<rect x="30" y="124" width="840" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="154" width="250" height="92" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="182" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Piedmont-Sardinia</text><text x="185" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">House of Savoy: the only state</text><text x="185" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">independent of Austria</text><rect x="330" y="154" width="250" height="92" rx="12" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="455" y="182" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lombardy and Venetia</text><text x="455" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Ruled directly by Austria</text><rect x="250" y="274" width="250" height="92" rx="12" fill="#f9eee6" stroke="#b5602e" stroke-width="2.5"/><text x="375" y="302" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Tuscany, Modena, Parma</text><text x="375" y="324" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Habsburg relatives or allies</text><rect x="330" y="374" width="250" height="72" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="455" y="402" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Papal States</text><text x="455" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Ruled by the Pope</text><rect x="470" y="464" width="300" height="72" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="620" y="492" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Kingdom of the Two Sicilies</text><text x="620" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Naples and Sicily: a Bourbon king</text><rect x="620" y="154" width="230" height="115" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="634" y="180" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AUSTRIAN INFLUENCE</text><text x="634" y="211" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Troops crushed risings in</text><text x="634" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1821 and 1831; Metternich:</text><text x="634" y="251" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"a geographical expression"</text><rect x="60" y="394" width="240" height="115" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="74" y="420" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEEPER OBSTACLES</text><text x="74" y="451" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Dialects, poor roads,</text><text x="74" y="471" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">separate currencies and</text><text x="74" y="491" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">customs, a peasant majority</text>
</svg>