<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" width="900" height="495" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="495" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plombières promised, Villafranca delivered</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Cavour's French alliance, 1858-60</text>
<rect x="30" y="124" width="395" height="185" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PLOMBIÈRES, JULY 1858</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The secret deal</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">France fights Austria if Austria looks the</text><text x="65.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">aggressor</text><text x="50" y="258.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Piedmont gets Lombardy and Venetia</text><text x="50" y="284.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">France gets Nice and Savoy</text><line x1="431" y1="216.5" x2="469" y2="216.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="124" width="395" height="185" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="495" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VILLAFRANCA, JULY 1859</text><text x="495" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What happened</text><text x="495" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="510.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Napoleon III makes an armistice without</text><text x="510.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cavour</text><text x="495" y="258.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="510.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Piedmont gets Lombardy only</text><text x="495" y="284.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="510.2" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cavour resigns (returns January 1860)</text><rect x="30" y="331" width="411" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="363" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY NAPOLEON STOPPED</text><text x="50" y="389.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Losses, Prussia, Catholics</text><text x="50" y="417.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Heavy losses; Prussian mobilisation on the</text><text x="50" y="438.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rhine; French Catholic anger</text><rect x="459" y="331" width="411" height="132" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="479" y="363" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARCH 1860</text><text x="479" y="389.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Central Italy joins</text><text x="479" y="417.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Plebiscites in Tuscany, Modena, Parma, the</text><text x="479" y="438.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Romagna; Nice and Savoy ceded</text>
</svg>