<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" width="900" height="578" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="578" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Did Cavour help or hinder?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Build a two-column plan before you judge</text>
<polygon points="450,164 416,234 484,234" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="210" y1="198" x2="690" y2="130" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="164" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="210" y1="198" x2="210" y2="238" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="238" width="360" height="197" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="268.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Helped</text><text x="46" y="297.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">French alliance defeated Austria (1859)</text><text x="46" y="322.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Modernised economy and army</text><text x="46" y="347.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="347.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Revolts turned into annexation by</text><text x="61.2" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">plebiscite</text><text x="46" y="393.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Took the south in 1860, avoiding war</text><text x="61.2" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with France</text><line x1="690" y1="130" x2="690" y2="170" stroke="#1e2a44" stroke-width="3"/><rect x="510" y="170" width="360" height="155" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="526" y="200.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hindered</text><text x="526" y="229.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">First aim only a northern kingdom</text><text x="526" y="254.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gave away Nice and Savoy</text><text x="526" y="279.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Distrusted Garibaldi and Mazzini</text><text x="526" y="304.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Piedmontese laws resented in the south</text><rect x="30" y="457" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="491.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A practical politician</text><text x="450" y="521.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Not a nationalist dreamer: Cavour <tspan font-weight="700" fill="#1e2a44">widened</tspan> <tspan font-weight="700" fill="#1e2a44">his</tspan> <tspan font-weight="700" fill="#1e2a44">aims</tspan> as events allowed.</text>
</svg>