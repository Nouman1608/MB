<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Italy was unified, 1852-70</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The decisive years, 1859-61, drawn to scale by month</text>
<rect x="30" y="124" width="257.3333333333333" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1852</text><text x="44" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cavour prime minister</text><text x="44" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Railways, trade, banking</text><line x1="293.3333333333333" y1="172" x2="315.3333333333333" y2="172" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="124" width="257.3333333333333" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1855-56</text><text x="335.3333333333333" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Crimean War</text><text x="335.3333333333333" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A seat at the Congress of Paris</text><line x1="584.6666666666666" y1="172" x2="606.6666666666666" y2="172" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="124" width="257.3333333333333" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="626.6666666666666" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JULY 1858</text><text x="626.6666666666666" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Plombières</text><text x="626.6666666666666" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Secret deal with Napoleon III</text><line x1="116" y1="286" x2="870" y2="286" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="292" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jan 1859</text><line x1="116" y1="401" x2="870" y2="401" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="407" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jul</text><line x1="116" y1="516" x2="870" y2="516" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="522" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jan 1860</text><line x1="116" y1="631" x2="870" y2="631" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="637" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jul</text><line x1="116" y1="746" x2="870" y2="746" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="752" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jan 1861</text><line x1="470" y1="286" x2="470" y2="803.5" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="430" y="256" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">CAVOUR AND DIPLOMACY</text><text x="510" y="256" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WAR, GARIBALDI, PLEBISCITES</text><path d="M470,343.5 L486,343.5 L504,343.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="328.9" width="304.864" height="46" fill="#f4f6f6"/><text x="510" y="347.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1859</text><text x="510" y="368.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cavour mobilises; Austria declares war</text><path d="M470,390.6311475410016 L486,390.6311475410016 L504,395.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="380.9" width="181.424" height="46" fill="#f4f6f6"/><text x="510" y="399.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">June 1859</text><text x="510" y="420.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Magenta and Solferino</text><path d="M470,409.79781420765084 L454,409.79781420765084 L436,409.79781420765084" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="159.01600000000002" y="395.1978142076508" width="275.984" height="67" fill="#f4f6f6"/><text x="430" y="413.99781420765083" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">July 1859</text><text x="430" y="434.99781420765083" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Villafranca: Lombardy only; Cavour</text><text x="430" y="455.99781420765083" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">resigns</text><path d="M470,524.7978142076508 L454,524.7978142076508 L436,524.7978142076508" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="244.21599999999998" y="510.1978142076508" width="190.78400000000002" height="46" fill="#f4f6f6"/><text x="430" y="528.9978142076508" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">January 1860</text><text x="430" y="549.9978142076508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Cavour returns to office</text><path d="M470,563.1311475410016 L486,563.1311475410016 L504,563.1311475410016" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="548.5311475410016" width="330.816" height="67" fill="#f4f6f6"/><text x="510" y="567.3311475410015" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">March 1860</text><text x="510" y="588.3311475410015" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Central states vote to join; Nice and Savoy</text><text x="510" y="609.3311475410015" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to France</text><path d="M470,601.4644808743001 L486,601.4644808743001 L504,636.1311475410016" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="621.5311475410016" width="310.11199999999997" height="67" fill="#f4f6f6"/><text x="510" y="640.3311475410015" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">May 1860</text><text x="510" y="661.3311475410015" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Thousand land at Marsala; Palermo</text><text x="510" y="682.3311475410015" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">taken</text><path d="M470,678.1311475410016 L486,678.1311475410016 L504,709.1311475410016" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="694.5311475410016" width="186.416" height="46" fill="#f4f6f6"/><text x="510" y="713.3311475410015" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">September 1860</text><text x="510" y="734.3311475410015" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Garibaldi enters Naples</text><path d="M470,697.2978142076508 L454,697.2978142076508 L436,697.2978142076508" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="189.54399999999995" y="682.6978142076508" width="245.45600000000005" height="46" fill="#f4f6f6"/><text x="430" y="701.4978142076508" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">October 1860</text><text x="430" y="722.4978142076508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Teano: conquests handed over</text><path d="M470,793.1311475410016 L454,793.1311475410016 L436,793.1311475410016" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="212.888" y="778.5311475410016" width="222.112" height="46" fill="#f4f6f6"/><text x="430" y="797.3311475410015" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">March 1861</text><text x="430" y="818.3311475410015" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Kingdom of Italy proclaimed</text><circle cx="470" cy="343.5" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="390.6311475410016" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="409.79781420765084" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="524.7978142076508" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="563.1311475410016" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="601.4644808743001" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="678.1311475410016" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="697.2978142076508" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="793.1311475410016" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="852.5311475410016" width="411" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="884.5311475410016" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1866</text><text x="50" y="910.5711475410016" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Venetia</text><text x="50" y="939.3311475410015" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Through Prussia's victory over Austria</text><rect x="459" y="852.5311475410016" width="411" height="111" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="479" y="884.5311475410016" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEPTEMBER 1870</text><text x="479" y="910.5711475410016" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rome</text><text x="479" y="939.3311475410015" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">French garrison withdrawn; Rome the capital</text>
