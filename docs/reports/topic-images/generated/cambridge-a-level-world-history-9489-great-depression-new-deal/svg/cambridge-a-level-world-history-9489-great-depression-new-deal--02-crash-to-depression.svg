<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 708" width="900" height="708" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="708" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why a crash became a depression</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The Crash destroyed confidence; deeper problems set the depth</text>
<text x="30" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">PROBLEM 1: The First World War and trade</text><line x1="530.15625" y1="254.5" x2="663.46875" y2="333.5" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)" stroke-dasharray="12 8"/><circle cx="596.8125" cy="294" r="17" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M588.8125,286 L604.8125,302 M604.8125,286 L588.8125,302" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="580" y1="367" x2="320" y2="367" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="236.53125" y1="333.5" x2="369.84375" y2="254.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="300" y="169.5" width="300" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="197.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">USA</text><text x="450" y="226.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The world's creditor</text><rect x="590" y="343.5" width="260" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="720" y="371.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Germany</text><rect x="50" y="343.5" width="260" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="371.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Britain and France</text><rect x="636" y="241" width="135.12" height="21" fill="#f4f6f6"/><text x="640" y="257" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">American loans:</text><rect x="636" y="262" width="153.584" height="21" fill="#f4f6f6"/><text x="640" y="278" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">stop after 1928-29</text><rect x="400.92" y="385" width="98.16" height="21" fill="#f4f6f6"/><text x="450" y="401" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">reparations</text><rect x="168.288" y="251" width="85.712" height="21" fill="#f4f6f6"/><text x="250" y="267" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">war debts</text><rect x="30" y="408.5" width="840" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="435.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Then the <tspan font-weight="700" fill="#1e2a44">Hawley-Smoot</tspan> <tspan font-weight="700" fill="#1e2a44">Tariff</tspan> (1930) provoked retaliation and world trade shrank.</text><rect x="30" y="471.5" width="411" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="503.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROBLEM 2</text><text x="50" y="530.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Banks and the Federal Reserve</text><text x="50" y="559.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="559.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Thousands of small banks with weak reserves</text><text x="50" y="584.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="584.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fed tightened credit in 1928-29, then failed to</text><text x="65.2" y="605.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">act as lender of last resort</text><text x="50" y="630.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="630.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Banks collapsed in waves from 1930</text><text x="65.2" y="651.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Friedman and Schwartz)</text><rect x="459" y="471.5" width="411" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="516" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROBLEM 3</text><text x="479" y="542.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Overproduction and underconsumption</text><text x="479" y="571.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="571.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Factories and farms produced more than</text><text x="494.2" y="592.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">indebted consumers could buy</text><text x="479" y="617.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="617.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">New industries had saturated their markets by</text><text x="494.2" y="638.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the late 1920s</text>
</svg>