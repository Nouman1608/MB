<rect width="900" height="817" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why a second New Deal?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four pressures by 1935, and what they produced</text>
<rect x="30" y="124" width="198" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="153.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pressure from the</text><text x="46" y="174.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Left</text><text x="46" y="201" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Long, Coughlin,</text><text x="46" y="221" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Townsend</text><rect x="244" y="124" width="198" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="163.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Court defeats</text><text x="260" y="190.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">NIRA and AAA struck</text><text x="260" y="210.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">down</text><rect x="458" y="124" width="198" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="173.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">An election coming</text><text x="474" y="200.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1936</text><rect x="672" y="124" width="198" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="688" y="163.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lasting reform</text><text x="688" y="190.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Changes that would</text><text x="688" y="210.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">outlast the crisis</text><rect x="150" y="305" width="600" height="86" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="337" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">SECOND NEW DEAL, 1935-37</text><text x="450" y="365.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Longer-term reform</text><line x1="129" y1="247" x2="300" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="343" y1="247" x2="400" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="557" y1="247" x2="500" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="771" y1="247" x2="600" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><clipPath id="tc413"><rect x="30" y="413" width="840" height="372" rx="14"/></clipPath><g clip-path="url(#tc413)"><rect x="30" y="413" width="262.5" height="48" fill="#b5d3cf"/><text x="44" y="440.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Measure</text><rect x="292.5" y="413" width="577.5" height="48" fill="#b5d3cf"/><text x="306.5" y="440.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it did</text><rect x="30" y="461" width="262.5" height="68" fill="#dce9e7"/><text x="44" y="487.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Works Progress</text><text x="44" y="508.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Administration</text><rect x="292.5" y="461" width="577.5" height="68" fill="#ffffff"/><text x="306.5" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Employed millions on public works and arts projects</text><line x1="30" y1="529" x2="870" y2="529" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="529" width="262.5" height="47" fill="#dce9e7"/><text x="44" y="555.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Social Security Act</text><rect x="292.5" y="529" width="577.5" height="47" fill="#f8faf9"/><text x="306.5" y="555.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Old-age pensions and unemployment insurance</text><line x1="30" y1="576" x2="870" y2="576" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="576" width="262.5" height="47" fill="#dce9e7"/><text x="44" y="602.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Wagner Act</text><rect x="292.5" y="576" width="577.5" height="47" fill="#ffffff"/><text x="306.5" y="602.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Right to join unions and bargain collectively</text><line x1="30" y1="623" x2="870" y2="623" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="623" width="262.5" height="47" fill="#dce9e7"/><text x="44" y="649.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Revenue Act</text><rect x="292.5" y="623" width="577.5" height="47" fill="#f8faf9"/><text x="306.5" y="649.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Higher taxes on the wealthy</text><line x1="30" y1="670" x2="870" y2="670" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="670" width="262.5" height="47" fill="#dce9e7"/><text x="44" y="696.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rural Electrification Admin.</text><rect x="292.5" y="670" width="577.5" height="47" fill="#ffffff"/><text x="306.5" y="696.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Power to the countryside</text><line x1="30" y1="717" x2="870" y2="717" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="717" width="262.5" height="68" fill="#dce9e7"/><text x="44" y="743.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Fair Labor Standards Act</text><text x="44" y="764.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(1938)</text><rect x="292.5" y="717" width="577.5" height="68" fill="#f8faf9"/><text x="306.5" y="743.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Minimum wage and maximum hours</text></g><line x1="292.5" y1="413" x2="292.5" y2="785" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="413" width="840" height="372" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>