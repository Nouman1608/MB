<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The recession of 1937-38</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Cutting too soon, and how recovery finally came</text>
<rect x="30" y="124" width="270.6666666666667" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165.33333333333334" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Spending cut</text><text x="165.33333333333334" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Roosevelt tries to balance the</text><text x="165.33333333333334" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">budget</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="168.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Credit tightened</text><text x="450" y="197.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">By the Federal Reserve</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="734.6666666666667" y="168.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social Security taxes</text><text x="734.6666666666667" y="197.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Reduce purchasing power</text><line x1="165" y1="238" x2="380" y2="270" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="238" x2="450" y2="270" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735" y1="238" x2="520" y2="270" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="180" y="294" width="540" height="88" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="328.82" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Output falls, unemployment rises sharply</text><text x="450" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Business and families hurt</text><line x1="450" y1="388" x2="450" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="444" width="253.33333333333334" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156.66666666666669" y="489.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1938</text><text x="156.66666666666669" y="517.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Renewed spending</text><line x1="289.33333333333337" y1="500" x2="317.33333333333337" y2="500" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="444" width="253.33333333333334" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="489.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1939-41</text><text x="450.00000000000006" y="517.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Rearmament</text><line x1="582.6666666666667" y1="500" x2="610.6666666666667" y2="500" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="444" width="253.33333333333334" height="112" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="479.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Recovery</text><text x="743.3333333333334" y="509.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Full recovery only with</text><text x="743.3333333333334" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">war production</text>
</svg>