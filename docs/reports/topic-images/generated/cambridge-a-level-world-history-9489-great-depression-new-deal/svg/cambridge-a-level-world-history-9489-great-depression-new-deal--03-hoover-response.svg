<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hoover did more than his reputation suggests</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale, 1929-1933</text>
