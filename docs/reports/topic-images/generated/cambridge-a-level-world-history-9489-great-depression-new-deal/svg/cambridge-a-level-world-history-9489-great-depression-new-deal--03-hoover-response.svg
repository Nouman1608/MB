"M416.36363636362944,264 L416.36363636362944,248 L416.36363636362944,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="354.96363636362946" y="150" width="122.8" height="64" fill="#f4f6f6"/><text x="416.36363636362944" y="165" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1931</text><text x="416.36363636362944" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Moratorium on</text><text x="416.36363636362944" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">war debts</text><path d="M668.6363636363515,264 L668.6363636363515,248 L668.6363636363515,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="582.7243636363514" y="150" width="171.824" height="64" fill="#f4f6f6"/><text x="668.6363636363515" y="165" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">July 1932</text><text x="668.6363636363515" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Emergency Relief</text><text x="668.6363636363515" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and Construction Act</text><path d="M781.3181818181796,264 L781.3181818181796,248 L813.0763636363515,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="762.5483636363515" y="150" width="101.056" height="64" fill="#f4f6f6"/><text x="813.0763636363515" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">4 Mar 1933</text><text x="813.0763636363515" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Roosevelt</text><text x="813.0763636363515" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">takes office</text><path d="M216.22727272726073,264 L216.22727272726073,280 L216.22727272726073,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="171.1232727272607" y="314" width="90.208" height="44" fill="#f4f6f6"/><text x="216.22727272726073" y="329" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Oct 1929</text><text x="216.22727272726073" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The Crash</text><path d="M584.545454545444,264 L584.545454545444,280 L584.545454545444,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="521.4094545454441" y="314" width="126.272" height="64" fill="#f4f6f6"/><text x="584.545454545444" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Jan 1932</text><text x="584.545454545444" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Reconstruction</text><text x="584.545454545444" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Finance Corp.</text><path d="M675.363636363618,264 L675.363636363618,280 L723.561454545444,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="655.681454545444" y="314" width="135.76" height="64" fill="#f4f6f6"/><text x="723.561454545444" y="329" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">July 1932</text><text x="723.561454545444" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Bonus Marchers</text><text x="723.561454545444" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">driven out</text><circle cx="80" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="216.22727272726073" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="416.36363636362944" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="584.545454545444" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="668.6363636363515" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="675.363636363618" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="781.3181818181796" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="456" width="411" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="490.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">His limits</text><text x="50" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Belief in voluntary co-operation; fear that federal</text><text x="50" y="540.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">relief would destroy self-reliance</text><rect x="459" y="456" width="411" height="109" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="490.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">His critics</text><text x="479" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The RFC helped big institutions while ordinary</text><text x="479" y="540.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people waited</text>
