<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Attacked from both sides</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Critics of the New Deal, and the Supreme Court</text>
<text x="40" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">CRITICS ON THE LEFT</text><text x="860" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">CRITICS ON THE RIGHT</text><defs><linearGradient id="sg124" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="169" width="780" height="26" rx="13" fill="url(#sg124)" stroke="#1e2a44" stroke-width="2.5"/><path d="M106.8,195 L106.8,218 L129.75,232 L129.75,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="106.8" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M216,195 L216,218 L343.25,232 L343.25,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="216" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M450,195 L450,218 L556.75,232 L556.75,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="450" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M746.4,195 L746.4,218 L770.25,232 L770.25,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="746.4" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="252" width="199.5" height="161" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="129.75" y="301.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Socialists and</text><text x="129.75" y="324.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">communists</text><text x="129.75" y="352.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The New Deal saved</text><text x="129.75" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">capitalism</text><rect x="243.5" y="252" width="199.5" height="161" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.25" y="290.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Townsend,</text><text x="343.25" y="313.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Coughlin, Long</text><text x="343.25" y="342.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Generous pensions;</text><text x="343.25" y="363.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">attacks on bankers;</text><text x="343.25" y="384.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">"Share Our Wealth"</text><rect x="457" y="252" width="199.5" height="161" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="556.75" y="325.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Roosevelt's New</text><text x="556.75" y="348.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Deal</text><rect x="670.5" y="252" width="199.5" height="161" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="770.25" y="280.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Republicans,</text><text x="770.25" y="303.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Liberty League</text><text x="770.25" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Newspapers, some</text><text x="770.25" y="352.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Southern Democrats:</text><text x="770.25" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">attacked spending</text><text x="770.25" y="394.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and federal power</text><text x="30" y="451" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">THE SUPREME COURT</text><rect x="30" y="475" width="184.5" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="510.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1935</text><text x="43" y="535.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Schechter</text><text x="43" y="562.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Strikes down the</text><text x="43" y="582.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">NIRA</text><line x1="220.5" y1="542.5" x2="242.5" y2="542.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="475" width="184.5" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="261.5" y="520.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1936</text><text x="261.5" y="545.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Butler</text><text x="261.5" y="572.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Strikes down the AAA</text><line x1="439" y1="542.5" x2="461" y2="542.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="475" width="184.5" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="500" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1937</text><text x="480" y="525.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Court-packing</text><text x="480" y="546.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">plan</text><text x="480" y="573" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Up to six justices;</text><text x="480" y="593" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Congress rejects it</text><line x1="657.5" y1="542.5" x2="679.5" y2="542.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="475" width="184.5" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="698.5" y="523.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The Court shifts</text><text x="698.5" y="550.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Upholds New Deal</text><text x="698.5" y="570.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">laws; retirements</text>
</svg>