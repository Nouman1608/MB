<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 816" width="900" height="816" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="816" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Hundred Days, 1933</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Banks first, then relief, recovery and reform</text>
<rect x="30" y="124" width="840" height="112" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BANKS FIRST</text><text x="450" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Emergency Banking Act + the first fireside chat</text><text x="450" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Sound banks reopen under federal supervision; confidence and deposits return</text><line x1="165" y1="244" x2="165" y2="274" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="244" x2="450" y2="274" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735" y1="244" x2="735" y2="274" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="284" width="270" height="45" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="311.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Relief</text><rect x="30" y="340" width="270" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="43" y="366.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">CCC</text><text x="43" y="393" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Young men on conservation work</text><rect x="30" y="420" width="270" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="43" y="446.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">FERA</text><text x="43" y="473" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Money to states for relief</text><rect x="315" y="284" width="270" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="311.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Recovery</text><rect x="315" y="340" width="270" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="366.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">AAA</text><text x="328" y="393" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Paid farmers to cut production</text><rect x="315" y="420" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="446.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">NIRA</text><text x="328" y="473" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">NRA codes on prices, wages,</text><text x="328" y="493" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hours; Public Works</text><text x="328" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Administration</text><rect x="315" y="540" width="270" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="566.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">TVA</text><text x="328" y="593" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Dams and power stations in a</text><text x="328" y="613" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">poor region</text><rect x="600" y="284" width="270" height="45" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="311.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Reform</text><rect x="600" y="340" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613" y="366.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Glass-Steagall Act</text><text x="613" y="393" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Commercial and investment</text><text x="613" y="413" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">banking separated; deposit</text><text x="613" y="433" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">insurance</text><rect x="600" y="460" width="270" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613" y="486.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Securities Act; SEC (1934)</text><text x="613" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Wall Street regulated</text><rect x="30" y="654" width="411" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="699.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Worked</text><text x="50" y="728.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Banks and confidence recovered quickly;</text><text x="50" y="749.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">millions got relief or work; farm incomes rose</text><rect x="459" y="654" width="411" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="688.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fell short</text><text x="479" y="717.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">NRA codes complex, often written by large</text><text x="479" y="738.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">firms; AAA helped landowners more than</text><text x="479" y="759.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tenants; unemployment stayed high</text>
</svg>