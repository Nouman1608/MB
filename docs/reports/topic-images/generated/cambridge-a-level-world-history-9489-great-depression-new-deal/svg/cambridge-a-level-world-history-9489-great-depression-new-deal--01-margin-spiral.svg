<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 732" width="900" height="732" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="732" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How buying on the margin became a crash</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Borrowed money turned a fall into a collapse</text>
<rect x="30" y="124" width="840" height="138" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE BUILD-UP</text><text x="50" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From 1927 share prices rose far faster than company profits</text><text x="50" y="212.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Investors borrowed most of the price from brokers; investment trusts multiplied the risk</text><text x="50" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Almost no regulation of share issues or trading</text><line x1="592.5694444444445" y1="359.5" x2="678.6111111111111" y2="448" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="590" y1="506" x2="530" y2="506" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="441.3888888888889" y1="448" x2="527.4305555555555" y2="359.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="430" y="302.5" width="260" height="47" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="560" y="330.54" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Share prices fall</text><rect x="600" y="458" width="270" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="486.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Margin calls</text><text x="735" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Brokers demand the borrowed</text><text x="735" y="535.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">money back</text><rect x="250" y="458" width="270" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="385" y="486.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Forced sales</text><text x="385" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Investors must sell shares to</text><text x="385" y="535.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">pay</text><rect x="30" y="286" width="200" height="99" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="312" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TRIGGER</text><text x="130" y="338.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Confidence falters</text><text x="130" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Autumn 1929</text><line x1="236" y1="335.5" x2="420" y2="326" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="560" y="446" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle" font-style="italic">a self-feeding spiral</text><rect x="30" y="578" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="615.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">24 OCTOBER 1929</text><text x="165.33333333333334" y="641.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">"Black Thursday"</text><text x="165.33333333333334" y="670.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Prices fall</text><rect x="314.6666666666667" y="578" width="270.6666666666667" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="615.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">29 OCTOBER 1929</text><text x="450" y="641.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">"Black Tuesday"</text><text x="450" y="670.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Prices collapse</text><rect x="599.3333333333334" y="578" width="270.6666666666667" height="122" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="734.6666666666667" y="605" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BY MID-1932</text><text x="734.6666666666667" y="631.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Almost 90 per cent</text><text x="734.6666666666667" y="659.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">lost from the Dow Jones 1929</text><text x="734.6666666666667" y="680.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">peak</text>
</svg>