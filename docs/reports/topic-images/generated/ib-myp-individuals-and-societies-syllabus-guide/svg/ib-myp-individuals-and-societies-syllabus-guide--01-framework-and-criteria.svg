">independently and</text><text x="259" y="690" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">collaboratively</text><rect x="456" y="522" width="198" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="490" cy="556" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="490" y="563.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="520" y="562" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Criterion C</text><text x="472" y="604" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Communicating</text><text x="472" y="633" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">organise, document</text><text x="472" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and communicate</text><text x="472" y="671" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">learning in varied</text><text x="472" y="690" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">media and formats</text><rect x="669" y="522" width="198" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="703" cy="556" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="703" y="563.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="733" y="562" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Criterion D</text><text x="685" y="604" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Thinking</text><text x="685" y="625" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">critically</text><text x="685" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">develop and apply</text><text x="685" y="673" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">understanding of</text><text x="685" y="692" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">societies and of</text><text x="685" y="711" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">investigation</text><rect x="30" y="754" width="840" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="52" y="772" width="28" height="38" rx="5" fill="#fff" stroke="#1e2a44" stroke-width="1.5"/><text x="66" y="797" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><rect x="86" y="772" width="28" height="38" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="100" y="797" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="120" y="772" width="28" height="38" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><text x="134" y="797" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="154" y="772" width="28" height="38" rx="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="168" y="797" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="188" y="772" width="28" height="38" rx="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="202" y="797" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="222" y="772" width="28" height="38" rx="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="236" y="797" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="256" y="772" width="28" height="38" rx="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="270" y="797" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="290" y="772" width="28" height="38" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="304" y="797" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="324" y="772" width="28" height="38" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="338" y="797" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="376" y="788" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">each criterion: levels 0 to 8</text><text x="376" y="812" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1 to 8 in four bands; 0 below level 1</text><rect x="685.11" y="770" width="166.89" height="44" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="768.5550000000001" y="798" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">total 0 to 32</text>
