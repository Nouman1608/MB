<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The MYP Individuals and Societies framework</text>

<rect x="30" y="112" width="410" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Key concepts</text><rect x="50" y="160" width="91.67" height="38" rx="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="95.83500000000001" y="185.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">change</text><rect x="151.67000000000002" y="160" width="220.955" height="38" rx="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="262.14750000000004" y="185.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">global interactions</text><rect x="50" y="206" width="240.845" height="38" rx="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="170.4225" y="231.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">time, place and space</text><rect x="300.845" y="206" width="101.61500000000001" height="38" rx="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="351.65250000000003" y="231.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">systems</text><rect x="460" y="112" width="410" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Related concepts, for example</text><rect x="480" y="160" width="121.505" height="38" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="540.7525" y="185.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">causality</text><rect x="611.505" y="160" width="161.285" height="38" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="692.1475" y="185.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">globalization</text><rect x="480" y="206" width="101.61500000000001" height="38" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="530.8075" y="231.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">culture</text><rect x="591.615" y="206" width="171.23000000000002" height="38" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="677.23" y="231.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">sustainability</text><rect x="30" y="278" width="840" height="192" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="310" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explored through the same six global contexts as every MYP subject</text><rect x="50" y="328" width="390" height="38" rx="9" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="245" y="352.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">identities and relationships</text><rect x="460" y="328" width="390" height="38" rx="9" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="655" y="352.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">orientation in space and time</text><rect x="50" y="374" width="390" height="38" rx="9" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="245" y="398.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">personal and cultural expression</text><rect x="460" y="374" width="390" height="38" rx="9" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="655" y="398.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">scientific and technical innovation</text><rect x="50" y="420" width="390" height="38" rx="9" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="245" y="444.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">globalization and sustainability</text><rect x="460" y="420" width="390" height="38" rx="9" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="655" y="444.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">fairness and development</text><