<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 717" width="900" height="717" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="717" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Becker: the “ideal pupil”</text>

<circle cx="300" cy="330" r="200" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="300" cy="330" r="140" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="300" cy="330" r="80" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="300" y="324" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the</text><text x="300" y="348" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“ideal pupil”</text><circle cx="350" cy="240" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="230" cy="230" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="405" cy="360" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="140" cy="410" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="450" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="330" cy="505" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="540" y="150" width="330" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="566" cy="186" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="590" y="192" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Middle-class pupils</text><text x="560" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Closest to the ideal in behaviour and</text><text x="560" y="243" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">appearance</text><rect x="540" y="280" width="330" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="566" cy="316" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="590" y="322" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Working-class pupils</text><text x="560" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Further from the ideal; more likely</text><text x="560" y="373" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to be seen as badly behaved</text><rect x="540" y="420" width="330" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="556" y="450" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Becker interviewed teachers in</text><text x="556" y="471" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Chicago</tspan>; also named for his work on</text><text x="556" y="492" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deviance</text><rect x="30" y="560" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="596" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bonus evidence, not a key study</text><text x="56" y="625" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rosenthal and Jacobson, Pygmalion in the Classroom (1968): randomly chosen pupils whom</text><text x="56" y="647" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">teachers expected to progress made greater gains, suggesting expectations alone can change</text><text x="56" y="669" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">outcomes.</text>
</svg>