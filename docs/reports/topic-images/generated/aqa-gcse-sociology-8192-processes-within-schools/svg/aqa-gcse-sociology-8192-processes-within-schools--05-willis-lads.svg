<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 865" width="900" height="865" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="865" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Willis: a counter school culture</text>

<text x="450" y="92" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Learning to Labour (1977): twelve working-class boys at a Midlands school</text><rect x="30" y="112" width="404" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,162 L31.25,126.25 Q31.25,113.25 44.25,113.25 L419.75,113.25 Q432.75,113.25 432.75,126.25 L432.75,162 Z" fill="#d4b02e"/><line x1="31.25" y1="162" x2="432.75" y2="162" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="142.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">“The lads”</text><rect x="466" y="112" width="404" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,162 L467.25,126.25 Q467.25,113.25 480.25,113.25 L855.75,113.25 Q868.75,113.25 868.75,126.25 L868.75,162 Z" fill="#dce9e7"/><line x1="467.25" y1="162" x2="868.75" y2="162" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="142.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">“Ear’oles”</text><circle cx="57" cy="190.39" r="4.5" fill="#2e6b62"/><text x="70" y="196" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A <tspan font-weight="700">counter school culture</tspan> opposed to</text><text x="70" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">school values</text><circle cx="57" cy="244.39" r="4.5" fill="#2e6b62"/><text x="70" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Felt superior to teachers and to</text><text x="70" y="272" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">conformist pupils</text><circle cx="57" cy="298.39" r="4.5" fill="#2e6b62"/><text x="70" y="304" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Aimed to avoid lessons and “have a laff”</text><circle cx="57" cy="330.39" r="4.5" fill="#2e6b62"/><text x="70" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Resented the school’s control of their</text><text x="70" y="358" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">time</text><circle cx="493" cy="190.39" r="4.5" fill="#2e6b62"/><text x="506" y="196" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Conformist pupils</text><circle cx="493" cy="222.39" r="4.5" fill="#2e6b62"/><text x="506" y="228" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Looked down on by the lads</text><circle cx="450" cy="262" r="22" fill="#1e2a44"/><text x="450" y="269" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="434" width="390" height="108" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="477.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rejecting school</text><text x="225" y="507.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">An identity the lads actively chose</text><line x1="424" y1="488" x2="476" y2="488" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="434" width="390" height="108" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="466.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Manual work</text><text x="675" y="496.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Suited to male-dominated, unskilled or</text><text x="675" y="518.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">semi-skilled jobs</text><text x="450" y="568" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Such work was relatively easy to get in the 1970s</text><rect x="30" y="588" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,638 L31.25,602.25 Q31.25,589.25 44.25,589.25 L427.75,589.25 Q440.75,589.25 440.75,602.25 L440.75,638 Z" fill="#ffffff"/><line x1="31.25" y1="638" x2="440.75" y2="638" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="618.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ball: the institution shapes pupils</text><text x="44" y="669.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Banding labels pupils and their attitudes follow</text><rect x="458" y="588" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,638 L459.25,602.25 Q459.25,589.25 472.25,589.25 L855.75,589.25 Q868.75,589.25 868.75,602.25 L868.75,638 Z" fill="#ffffff"/><line x1="459.25" y1="638" x2="868.75" y2="638" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="618.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Willis: pupils are not passive</text><text x="472" y="669.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The lads chose to resist; they were not simply</text><text x="472" y="690.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labelled into failure</text><rect x="30" y="730" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="766" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Methods</text><text x="56" y="795" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Observation and participant observation, group discussions, informal interviews and diaries,</text><text x="56" y="817" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to see school from the pupils’ point of view.</text>
</svg>