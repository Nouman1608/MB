<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 765" width="900" height="765" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="765" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ball: teacher expectations at Beachside</text>

<text x="450" y="92" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Beachside Comprehensive (1981): three years of participant observation, two cohorts</text><rect x="30" y="112" width="404" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,162 L31.25,126.25 Q31.25,113.25 44.25,113.25 L419.75,113.25 Q432.75,113.25 432.75,126.25 L432.75,162 Z" fill="#b5d3cf"/><line x1="31.25" y1="162" x2="432.75" y2="162" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="142.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Banded cohort</text><rect x="466" y="112" width="404" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,162 L467.25,126.25 Q467.25,113.25 480.25,113.25 L855.75,113.25 Q868.75,113.25 868.75,126.25 L868.75,162 Z" fill="#f2e7b8"/><line x1="467.25" y1="162" x2="868.75" y2="162" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="142.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Mixed ability cohort</text><rect x="50" y="182" width="364" height="114" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="232" y="210" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Band 1</text><text x="232" y="238" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">More middle-class pupils (of similar</text><text x="232" y="258" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">ability); expected to be academic;</text><text x="232" y="278" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">higher-status exams</text><rect x="50" y="306" width="364" height="104" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="232" y="334" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Band 2</text><text x="232" y="360" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Steered to lower-status courses; most</text><text x="232" y="380" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">likely to develop anti-school attitudes</text><line x1="232" y1="296" x2="232" y2="306" stroke="#1e2a44" stroke-width="2"/><rect x="50" y="428" width="364" height="132" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="232" y="458" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Polarisation</text><text x="232" y="486" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">A split between pro-school and anti-school</text><text x="232" y="506" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">pupils (concepts from Lacey, Hightown</text><text x="232" y="526" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Grammar)</text><circle cx="493" cy="190.39" r="4.5" fill="#2e6b62"/><text x="506" y="196" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Polarisation between pupils became <tspan font-weight="700">less</tspan></text><text x="506" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">marked</tspan></text><circle cx="493" cy="248.39" r="4.5" fill="#2e6b62"/><text x="506" y="254" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">But teachers <tspan font-weight="700">still held different</tspan></text><text x="506" y="276" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">expectations</tspan></text><circle cx="493" cy="306.39" r="4.5" fill="#2e6b62"/><text x="506" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">These still <tspan font-weight="700">favoured middle-class pupils</tspan></text><rect x="486" y="428" width="364" height="132" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="668" y="458" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Why it matters</text><text x="668" y="486" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Banding acted as an institutional label:</text><text x="668" y="506" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">expectations shaped work, exams and</text><text x="668" y="526" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">attitudes</text><rect x="30" y="600" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="636" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="659.39" r="4.5" fill="#8a6d0d"/><text x="74" y="665" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Three years of participant observation give rich, valid data on everyday school life</text><circle cx="61" cy="689.39" r="4.5" fill="#8a6d0d"/><text x="74" y="695" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A single school may not be representative; the researcher’s presence may have changed</text><text x="74" y="717" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">behaviour</text>
</svg>