<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 683" width="900" height="683" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="683" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The self-fulfilling prophecy</text>

<line x1="590" y1="196" x2="690" y2="258" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="690" y1="384" x2="590" y2="446" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="310" y1="446" x2="210" y2="384" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="210" y1="258" x2="310" y2="196" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)" stroke-dasharray="9 7"/><rect x="305" y="123" width="290" height="104" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="157" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1. Label</text><text x="450" y="185" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Teacher labels the pupil “not</text><text x="450" y="205" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">academic”</text><rect x="595" y="268" width="290" height="104" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="302" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2. Treatment</text><text x="740" y="330" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Easier work, less praise, less</text><text x="740" y="350" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">attention</text><rect x="305" y="413" width="290" height="104" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="447" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3. Self-image</text><text x="450" y="475" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Pupil sees themselves through the</text><text x="450" y="495" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">label; loses confidence or effort</text><rect x="15" y="268" width="290" height="104" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="302" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">4. Outcome</text><text x="160" y="330" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Achievement falls, which seems to</text><text x="160" y="350" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">confirm the label</text><text x="450" y="312" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">the label</text><text x="450" y="338" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">comes true</text><text x="170" y="232" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle" font-style="italic">confirms</text><rect x="30" y="540" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="576" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Labelling is not yet a prophecy</text><circle cx="61" cy="599.39" r="4.5" fill="#8a6d0d"/><text x="74" y="605" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Labels are often based on appearance, behaviour, accent or set, not careful assessment</text><circle cx="61" cy="629.39" r="4.5" fill="#8a6d0d"/><text x="74" y="635" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The self-fulfilling prophecy needs the <tspan font-weight="700">outcome</tspan>: the label must come true</text>
</svg>