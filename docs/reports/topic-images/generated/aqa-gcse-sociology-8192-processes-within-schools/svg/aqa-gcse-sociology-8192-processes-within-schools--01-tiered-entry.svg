<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When placement limits the grade</text>

<rect x="30" y="118" width="246.66666666666666" height="108" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="150.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Low set</text><text x="153.33333333333331" y="180.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Pupil placed in a low set</text><text x="153.33333333333331" y="202.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">at GCSE</text><line x1="280.66666666666663" y1="172" x2="322.66666666666663" y2="172" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="118" width="246.66666666666666" height="108" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="150.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Foundation tier</text><text x="449.99999999999994" y="180.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Entered for the lower-tier</text><text x="449.99999999999994" y="202.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">paper</text><line x1="577.3333333333333" y1="172" x2="619.3333333333333" y2="172" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="118" width="246.66666666666666" height="108" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="150.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Grade capped</text><text x="746.6666666666666" y="180.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The highest grade</text><text x="746.6666666666666" y="202.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">available is limited</text><rect x="30" y="256" width="269.3333333333333" height="218" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,306 L31.25,270.25 Q31.25,257.25 44.25,257.25 L285.0833333333333,257.25 Q298.0833333333333,257.25 298.0833333333333,270.25 L298.0833333333333,306 Z" fill="#ffffff"/><line x1="31.25" y1="306" x2="298.0833333333333" y2="306" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="286.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Streaming</text><circle cx="49" cy="331.92" r="4.5" fill="#2e6b62"/><text x="62" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">For:</tspan> teaching matched to the</text><text x="62" y="358.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">group’s pace</text><circle cx="49" cy="381.92" r="4.5" fill="#2e6b62"/><text x="62" y="387.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Against:</tspan> strong in one</text><text x="62" y="408.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">subject, held back in</text><text x="62" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">another; low streams</text><text x="62" y="450.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labelled failures</text><rect x="315.3333333333333" y="256" width="269.3333333333333" height="218" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,306 L316.5833333333333,270.25 Q316.5833333333333,257.25 329.5833333333333,257.25 L570.4166666666666,257.25 Q583.4166666666666,257.25 583.4166666666666,270.25 L583.4166666666666,306 Z" fill="#ffffff"/><line x1="316.5833333333333" y1="306" x2="583.4166666666666" y2="306" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="286.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Setting</text><circle cx="334.3333333333333" cy="331.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">For:</tspan> flexible; reflects</text><text x="347.3333333333333" y="358.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different strengths</text><circle cx="334.3333333333333" cy="381.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="387.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Against:</tspan> placement can</text><text x="347.3333333333333" y="408.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">follow class, gender or</text><text x="347.3333333333333" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ethnicity</text><rect x="600.6666666666666" y="256" width="269.3333333333333" height="218" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,306 L601.9166666666666,270.25 Q601.9166666666666,257.25 614.9166666666666,257.25 L855.75,257.25 Q868.75,257.25 868.75,270.25 L868.75,306 Z" fill="#ffffff"/><line x1="601.9166666666666" y1="306" x2="868.75" y2="306" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="286.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Mixed ability</text><circle cx="619.6666666666666" cy="331.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">For:</tspan> avoids fixed labels;</text><text x="632.6666666666666" y="358.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less polarisation</text><circle cx="619.6666666666666" cy="381.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="387.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Against:</tspan> harder to stretch</text><text x="632.6666666666666" y="408.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the most able and support</text><text x="632.6666666666666" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the least able</text>
</svg>