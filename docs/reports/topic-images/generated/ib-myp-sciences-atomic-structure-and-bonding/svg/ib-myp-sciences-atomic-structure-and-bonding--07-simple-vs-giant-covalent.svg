<rect width="900" height="820" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Covalent structures and their properties</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Flat sketches of three-dimensional structures</text>
<rect x="30" y="110" width="840" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="72" y1="170" x2="108" y2="170" stroke="#1e2a44" stroke-width="4"/><circle cx="72" cy="170" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="108" cy="170" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="192" y1="160" x2="228" y2="160" stroke="#1e2a44" stroke-width="4"/><circle cx="192" cy="160" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="228" cy="160" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="112" y1="260" x2="148" y2="260" stroke="#1e2a44" stroke-width="4"/><circle cx="112" cy="260" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="148" cy="260" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="252" y1="250" x2="288" y2="250" stroke="#1e2a44" stroke-width="4"/><circle cx="252" cy="250" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="288" cy="250" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="312" y1="180" x2="348" y2="180" stroke="#1e2a44" stroke-width="4"/><circle cx="312" cy="180" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="348" cy="180" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="123.88255578032592" y1="168.00690848351024" x2="176.1174442196741" y2="161.99309151648976" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 5"/><line x1="103.80870784581722" y1="191.93147716688617" x2="116.19129215418278" y2="238.06852283311383" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 5"/><line x1="228.8598066716578" y1="179.96920706410825" x2="251.1401933283422" y2="230.03079293589175" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 5"/><line x1="163.913595794245" y1="258.29007080029015" x2="236.086404205755" y2="251.70992919970982" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 5"/><line x1="243.5373934102929" y1="163.94557569532859" x2="296.4626065897071" y2="176.05442430467141" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 5"/><line x1="292.12690669750293" y1="231.77784154323288" x2="307.87309330249707" y2="198.22215845676712" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 5"/><text x="400" y="154" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Simple molecular</text><text x="400" y="182" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">e.g. water, carbon dioxide, methane</text><text x="400" y="218" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Strong covalent bonds inside each molecule;</text><text x="400" y="242" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">weak forces between molecules. Melting only</text><text x="400" y="266" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">overcomes the weak forces: low melting point.</text><text x="400" y="290" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No ions or free electrons: no conduction.</text><rect x="30" y="334" width="840" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="60" y1="379" x2="120" y2="379" stroke="#1e2a44" stroke-width="4"/><line x1="90" y1="349" x2="90" y2="409" stroke="#1e2a44" stroke-width="4"/><line x1="120" y1="379" x2="180" y2="379" stroke="#1e2a44" stroke-width="4"/><line x1="150" y1="349" x2="150" y2="409" stroke="#1e2a44" stroke-width="4"/><line x1="180" y1="379" x2="240" y2="379" stroke="#1e2a44" stroke-width="4"/><line x1="210" y1="349" x2="210" y2="409" stroke="#1e2a44" stroke-width="4"/><line x1="240" y1="379" x2="300" y2="379" stroke="#1e2a44" stroke-width="4"/><line x1="270" y1="349" x2="270" y2="409" stroke="#1e2a44" stroke-width="4"/><line x1="300" y1="379" x2="360" y2="379" stroke="#1e2a44" stroke-width="4"/><line x1="330" y1="349" x2="330" y2="409" stroke="#1e2a44" stroke-width="4"/><line x1="60" y1="439" x2="120" y2="439" stroke="#1e2a44" stroke-width="4"/><line x1="90" y1="409" x2="90" y2="469" stroke="#1e2a44" stroke-width="4"/><line x1="120" y1="439" x2="180" y2="439" stroke="#1e2a44" stroke-width="4"/><line x1="150" y1="409" x2="150" y2="469" stroke="#1e2a44" stroke-width="4"/><line x1="180" y1="439" x2="240" y2="439" stroke="#1e2a44" stroke-width="4"/><line x1="210" y1="409" x2="210" y2="469" stroke="#1e2a44" stroke-width="4"/><line x1="240" y1="439" x2="300" y2="439" stroke="#1e2a44" stroke-width="4"/><line x1="270" y1="409" x2="270" y2="469" stroke="#1e2a44" stroke-width="4"/><line x1="300" y1="439" x2="360" y2="439" stroke="#1e2a44" stroke-width="4"/><line x1="330" y1="409" x2="330" y2="469" stroke="#1e2a44" stroke-width="4"/><line x1="60" y1="499" x2="120" y2="499" stroke="#1e2a44" stroke-width="4"/><line x1="90" y1="469" x2="90" y2="529" stroke="#1e2a44" stroke-width="4"/><line x1="120" y1="499" x2="180" y2="499" stroke="#1e2a44" stroke-width="4"/><line x1="150" y1="469" x2="150" y2="529" stroke="#1e2a44" stroke-width="4"/><line x1="180" y1="499" x2="240" y2="499" stroke="#1e2a44" stroke-width="4"/><line x1="210" y1="469" x2="210" y2="529" stroke="#1e2a44" stroke-width="4"/><line x1="240" y1="499" x2="300" y2="499" stroke="#1e2a44" stroke-width="4"/><line x1="270" y1="469" x2="270" y2="529" stroke="#1e2a44" stroke-width="4"/><line x1="300" y1="499" x2="360" y2="499" stroke="#1e2a44" stroke-width="4"/><line x1="330" y1="469" x2="330" y2="529" stroke="#1e2a44" stroke-width="4"/><circle cx="90" cy="379" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="150" cy="379" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="210" cy="379" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="379" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="330" cy="379" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="90" cy="439" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="150" cy="439" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="210" cy="439" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="439" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="330" cy="439" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="90" cy="499" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="150" cy="499" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="210" cy="499" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="499" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="330" cy="499" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="400" y="378" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Diamond (giant covalent)</text><text x="400" y="406" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">each carbon forms 4 covalent bonds</text><text x="400" y="442" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Every atom joined by strong covalent bonds.</text><text x="400" y="466" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Very hard, very high melting point.</text><text x="400" y="490" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No free electrons: does not conduct.</text><text x="400" y="514" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Used in cutting tools.</text><rect x="30" y="558" width="840" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="70" y1="613" x2="108" y2="593" stroke="#1e2a44" stroke-width="4"/><line x1="108" y1="593" x2="146" y2="613" stroke="#1e2a44" stroke-width="4"/><line x1="146" y1="613" x2="184" y2="593" stroke="#1e2a44" stroke-width="4"/><line x1="184" y1="593" x2="222" y2="613" stroke="#1e2a44" stroke-width="4"/><line x1="222" y1="613" x2="260" y2="593" stroke="#1e2a44" stroke-width="4"/><line x1="260" y1="593" x2="298" y2="613" stroke="#1e2a44" stroke-width="4"/><line x1="298" y1="613" x2="336" y2="593" stroke="#1e2a44" stroke-width="4"/><circle cx="70" cy="613" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="108" cy="593" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="146" cy="613" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="184" cy="593" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="222" cy="613" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="260" cy="593" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="298" cy="613" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="336" cy="593" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="89" y1="683" x2="127" y2="663" stroke="#1e2a44" stroke-width="4"/><line x1="127" y1="663" x2="165" y2="683" stroke="#1e2a44" stroke-width="4"/><line x1="165" y1="683" x2="203" y2="663" stroke="#1e2a44" stroke-width="4"/><line x1="203" y1="663" x2="241" y2="683" stroke="#1e2a44" stroke-width="4"/><line x1="241" y1="683" x2="279" y2="663" stroke="#1e2a44" stroke-width="4"/><line x1="279" y1="663" x2="317" y2="683" stroke="#1e2a44" stroke-width="4"/><line x1="317" y1="683" x2="355" y2="663" stroke="#1e2a44" stroke-width="4"/><circle cx="89" cy="683" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="127" cy="663" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="165" cy="683" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="203" cy="663" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="241" cy="683" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="279" cy="663" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="317" cy="683" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="355" cy="663" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="70" y1="743" x2="108" y2="723" stroke="#1e2a44" stroke-width="4"/><line x1="108" y1="723" x2="146" y2="743" stroke="#1e2a44" stroke-width="4"/><line x1="146" y1="743" x2="184" y2="723" stroke="#1e2a44" stroke-width="4"/><line x1="184" y1="723" x2="222" y2="743" stroke="#1e2a44" stroke-width="4"/><line x1="222" y1="743" x2="260" y2="723" stroke="#1e2a44" stroke-width="4"/><line x1="260" y1="723" x2="298" y2="743" stroke="#1e2a44" stroke-width="4"/><line x1="298" y1="743" x2="336" y2="723" stroke="#1e2a44" stroke-width="4"/><circle cx="70" cy="743" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="108" cy="723" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="146" cy="743" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="184" cy="723" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="222" cy="743" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="260" cy="723" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="298" cy="743" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="336" cy="723" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="70" y1="640" x2="370" y2="640" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 5"/><line x1="70" y1="705" x2="370" y2="705" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 5"/><text x="400" y="602" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Graphite (giant covalent)</text><text x="400" y="630" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">each carbon forms 3 bonds, in flat layers</text><text x="400" y="666" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Weak forces between layers: layers slide,</text><text x="400" y="690" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">so graphite is soft and slippery.</text><text x="400" y="714" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The fourth electron on each carbon is</text><text x="400" y="738" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">delocalised, so graphite conducts.</text><line x1="60" y1="802" x2="110" y2="802" stroke="#1e2a44" stroke-width="4"/><text x="120" y="808" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">strong covalent bond</text><line x1="380" y1="802" x2="430" y2="802" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 5"/><text x="440" y="808" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weak force between molecules or layers</text>
</svg>