<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the model of the atom changed</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="185" r="58" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="120" cy="160" r="9" fill="#1e2a44"/><line x1="115" y1="160" x2="125" y2="160" stroke="#fff" stroke-width="2.5"/><circle cx="170" cy="150" r="9" fill="#1e2a44"/><line x1="165" y1="150" x2="175" y2="150" stroke="#fff" stroke-width="2.5"/><circle cx="185" cy="195" r="9" fill="#1e2a44"/><line x1="180" y1="195" x2="190" y2="195" stroke="#fff" stroke-width="2.5"/><circle cx="140" cy="215" r="9" fill="#1e2a44"/><line x1="135" y1="215" x2="145" y2="215" stroke="#fff" stroke-width="2.5"/><circle cx="110" cy="200" r="9" fill="#1e2a44"/><line x1="105" y1="200" x2="115" y2="200" stroke="#fff" stroke-width="2.5"/><circle cx="155" cy="180" r="9" fill="#1e2a44"/><line x1="150" y1="180" x2="160" y2="180" stroke="#fff" stroke-width="2.5"/><text x="140" y="153" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">+</text><text x="180" y="179" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">+</text><text x="122" y="189" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">+</text><text x="168" y="225" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">+</text><text x="112" y="229" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">+</text><rect x="255" y="163" width="86" height="44" rx="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="298" y="192" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1897</text><text x="370" y="162" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Thomson: plum pudding</text><text x="370" y="196" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Discovered the electron. Negative electrons</text><text x="370" y="221" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">spread through a ball of positive charge.</text><rect x="30" y="272" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="347" r="58" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 6"/><circle cx="150" cy="347" r="6" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="110.0" cy="317.0" r="5.5" fill="#1e2a44"/><circle cx="188.0" cy="319.0" r="5.5" fill="#1e2a44"/><circle cx="198.0" cy="351.0" r="5.5" fill="#1e2a44"/><circle cx="130.0" cy="391.0" r="5.5" fill="#1e2a44"/><circle cx="102.0" cy="361.0" r="5.5" fill="#1e2a44"/><text x="150" y="373" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">nucleus</text><rect x="255" y="325" width="86" height="44" rx="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="298" y="354" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1911</text><text x="370" y="324" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Rutherford: nuclear model</text><text x="370" y="358" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Gold-foil evidence: a tiny, dense, positive</text><text x="370" y="383" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">nucleus; the atom is mostly empty space.</text><rect x="30" y="434" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="509" r="32" fill="none" stroke="#4a5568" stroke-width="2"/><circle cx="150" cy="509" r="58" fill="none" stroke="#4a5568" stroke-width="2"/><circle cx="150" cy="509" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="515.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><circle cx="150.0" cy="477.0" r="5.5" fill="#1e2a44"/><circle cx="150.0" cy="541.0" r="5.5" fill="#1e2a44"/><circle cx="141.0" cy="451.7" r="5.5" fill="#1e2a44"/><circle cx="159.0" cy="566.3" r="5.5" fill="#1e2a44"/><circle cx="207.3" cy="500.0" r="5.5" fill="#1e2a44"/><circle cx="92.7" cy="518.0" r="5.5" fill="#1e2a44"/><circle cx="159.0" cy="451.7" r="5.5" fill="#1e2a44"/><circle cx="141.0" cy="566.3" r="5.5" fill="#1e2a44"/><circle cx="207.3" cy="518.0" r="5.5" fill="#1e2a44"/><circle cx="92.7" cy="500.0" r="5.5" fill="#1e2a44"/><rect x="255" y="487" width="86" height="44" rx="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="298" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1913</text><text x="370" y="486" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Bohr: energy levels</text><text x="370" y="520" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Electrons sit in fixed energy levels</text><text x="370" y="545" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">(shells) around the nucleus.</text><rect x="30" y="596" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="671" r="58" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 6"/><circle cx="136" cy="657" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="136" y="662" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><circle cx="158" cy="655" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="132" cy="679" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="154" cy="675" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="154" y="680" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><circle cx="170" cy="677" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="170" y="682" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><circle cx="146" cy="693" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="166" cy="695" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="126" cy="665" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="126" y="670" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="255" y="649" width="86" height="44" rx="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="298" y="678" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1932</text><text x="370" y="648" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Chadwick: the neutron</text><text x="370" y="682" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">The neutron is identified, so the nucleus</text><text x="370" y="707" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">holds protons and neutrons.</text><line x1="298" y1="209" x2="298" y2="321" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="298" y1="371" x2="298" y2="483" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="298" y1="533" x2="298" y2="645" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="780" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle">Each change was forced by new evidence.</text>
</svg>