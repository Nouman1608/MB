<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Isotopes of chlorine</text>

<rect x="30" y="110" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="175.6" font-size="33.6" font-weight="700" fill="#2e6b62" text-anchor="end">35</text><text x="130" y="214.8" font-size="33.6" font-weight="700" fill="#b5602e" text-anchor="end">17</text><text x="136" y="205" font-size="70" font-weight="700" fill="#1e2a44" text-anchor="start">Cl</text><text x="270" y="160" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">chlorine-35</text><text x="270" y="196" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">17 protons</text><text x="270" y="222" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">18 neutrons</text><text x="270" y="248" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">17 electrons</text><text x="270" y="274" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">arrangement 2,8,7</text><rect x="60" y="300" width="350" height="40" rx="10" fill="#dce9e7"/><text x="235" y="327" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle">abundance in sample: 75%</text><rect x="460" y="110" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="175.6" font-size="33.6" font-weight="700" fill="#2e6b62" text-anchor="end">37</text><text x="560" y="214.8" font-size="33.6" font-weight="700" fill="#b5602e" text-anchor="end">17</text><text x="566" y="205" font-size="70" font-weight="700" fill="#1e2a44" text-anchor="start">Cl</text><text x="700" y="160" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">chlorine-37</text><text x="700" y="196" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">17 protons</text><text x="700" y="222" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">20 neutrons</text><text x="700" y="248" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">17 electrons</text><text x="700" y="274" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">arrangement 2,8,7</text><rect x="490" y="300" width="350" height="40" rx="10" fill="#dce9e7"/><text x="665" y="327" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle">abundance in sample: 25%</text><rect x="30" y="380" width="840" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="130" y1="630" x2="770" y2="630" stroke="#1e2a44" stroke-width="3"/><line x1="170" y1="630" x2="170" y2="640" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="664" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">35</text><line x1="310" y1="630" x2="310" y2="640" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="630" x2="450" y2="640" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="664" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">36</text><line x1="590" y1="630" x2="590" y2="640" stroke="#1e2a44" stroke-width="2.5"/><line x1="730" y1="630" x2="730" y2="640" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="664" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">37</text><rect x="136" y="510" width="68" height="120" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="500" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">75%</text><rect x="696" y="590" width="68" height="40" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="580" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">25%</text><path d="M294,660 L326,660 L310,636 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="310" y="686" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Aᵣ = 35.5</text><text x="60" y="420" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Relative atomic mass is a weighted mean</text><text x="440" y="470" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">Aᵣ = (35 × 75 + 37 × 25) ÷ 100</text><text x="440" y="500" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">= 3550 ÷ 100 = 35.5</text><text x="440" y="535" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Closer to 35, the more</text><text x="440" y="557" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">abundant isotope.</text><text x="450" y="705" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">mass number</text>
</svg>