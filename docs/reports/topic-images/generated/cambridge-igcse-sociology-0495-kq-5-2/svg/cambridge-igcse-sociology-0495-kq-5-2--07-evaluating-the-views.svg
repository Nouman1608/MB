<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" width="900" height="426" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="426" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Strengths and limitations of the three views</text>

<rect x="30" y="104" width="270.6666666666667" height="292" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTIONALISM</text><text x="50" y="161.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">+ Explains why</text><text x="50" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">societies invest in</text><text x="50" y="205.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">schooling and why</text><text x="50" y="227.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">qualifications matter</text><text x="50" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Class, ethnic and gender</text><text x="50" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gaps persist</text><text x="50" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Ignores conflict and</text><text x="50" y="323.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pupil resistance</text><text x="50" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Assumes values are shared</text><text x="50" y="371.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by all</text><rect x="314.6666666666667" y="104" width="270.6666666666667" height="292" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MARXISM</text><text x="334.6666666666667" y="161.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">+ Explains why class</text><text x="334.6666666666667" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">gaps persist despite</text><text x="334.6666666666667" y="205.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">free schooling</text><text x="334.6666666666667" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Willis: pupils resist</text><text x="334.6666666666667" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Neglects gender and</text><text x="334.6666666666667" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ethnicity</text><text x="334.6666666666667" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Underplays real social</text><text x="334.6666666666667" y="328.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mobility</text><rect x="599.3333333333334" y="104" width="270.6666666666667" height="292" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="619.3333333333334" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FEMINISM</text><text x="619.3333333333334" y="161.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">+ Exposes inequalities</text><text x="619.3333333333334" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">others ignore; widened</text><text x="619.3333333333334" y="205.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">girls’ access and</text><text x="619.3333333333334" y="227.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">choice</text><text x="619.3333333333334" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Girls now outperform boys</text><text x="619.3333333333334" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in many countries</text><text x="619.3333333333334" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Underplays class and</text><text x="619.3333333333334" y="323.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ethnic differences</text><text x="619.3333333333334" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Can overlook boys’</text><text x="619.3333333333334" y="371.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">problems</text>
</svg>