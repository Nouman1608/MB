<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="616" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Meritocracy, or the myth of meritocracy?</text>

<text x="450" y="124" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">The functionalist chain (Davis and Moore, 1945)</text><rect x="30" y="150" width="183" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121.5" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ability and</text><text x="121.5" y="205.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">effort</text><line x1="219" y1="224" x2="243" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="249" y="150" width="183" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340.5" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Standardised</text><text x="340.5" y="205.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">tests and</text><text x="340.5" y="227.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">setting</text><text x="340.5" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">same measure for</text><text x="340.5" y="274" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">all</text><line x1="438" y1="224" x2="462" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="468" y="150" width="183" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="559.5" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Role</text><text x="559.5" y="205.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">allocation</text><text x="559.5" y="232" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">talent matched to</text><text x="559.5" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">jobs</text><line x1="657" y1="224" x2="681" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="687" y="150" width="183" height="148" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="778.5" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Social</text><text x="778.5" y="205.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">mobility</text><text x="450" y="336" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">The Marxist reply (Bowles and Gintis)</text><rect x="30" y="362" width="183" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121.5" y="395.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><text x="121.5" y="417.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">background</text><text x="121.5" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">strongly predicts</text><text x="121.5" y="464" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">outcomes</text><line x1="219" y1="425" x2="243" y2="425" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="249" y="362" width="183" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340.5" y="395.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Belief in</text><text x="340.5" y="417.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">merit</text><text x="340.5" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">disguises this</text><line x1="438" y1="425" x2="462" y2="425" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="468" y="362" width="183" height="126" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="559.5" y="395.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Those who fail</text><text x="559.5" y="417.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">blame</text><text x="559.5" y="439.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">themselves</text><line x1="657" y1="425" x2="681" y2="425" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="687" y="362" width="183" height="126" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="778.5" y="395.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Inequality</text><text x="778.5" y="417.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">looks fair</text><rect x="30" y="506" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="539.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Evidence of lasting class, ethnic and gender gaps in achievement suggests education is not</text><text x="50" y="561.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fully meritocratic.</text>
</svg>