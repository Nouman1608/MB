<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The correspondence principle</text>

<text x="235" y="130" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">School (hidden curriculum)</text><text x="665" y="130" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Workplace</text><rect x="30" y="150" width="380" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="220" y="194.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Obeying teachers</text><rect x="490" y="150" width="380" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="680" y="194.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Obeying bosses</text><line x1="416" y1="196" x2="484" y2="196" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="450" y="180" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">mirrors</text><rect x="30" y="250" width="380" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="220" y="282.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Working for grades rather than</text><text x="220" y="307.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">interest</text><rect x="490" y="250" width="380" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="680" y="294.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Working for wages</text><line x1="416" y1="296" x2="484" y2="296" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="450" y="280" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">mirrors</text><rect x="30" y="360" width="410" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="393" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BOWLES AND GINTIS (1976)</text><text x="50" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The correspondence principle: the hidden</text><text x="50" y="443.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">curriculum prepares working-class pupils for</text><text x="50" y="464.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">obedient work. Althusser: education is an</text><text x="50" y="485.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ideological state apparatus.</text><rect x="460" y="360" width="410" height="150" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="393" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BUT: WILLIS (1977)</text><text x="480" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Working-class “lads” actively resisted</text><text x="480" y="443.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">school rather than passively accepting it,</text><text x="480" y="464.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">challenging simple correspondence.</text>
</svg>