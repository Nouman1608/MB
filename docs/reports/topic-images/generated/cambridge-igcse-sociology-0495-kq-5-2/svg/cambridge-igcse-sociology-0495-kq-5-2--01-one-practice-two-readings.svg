<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One school practice, two readings</text>

<text x="195" y="126" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Functionalist reading</text><text x="705" y="126" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Marxist reading</text><rect x="30" y="144" width="330" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Groups matched to ability, so</text><text x="195" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">teaching can be pitched</text><text x="195" y="215.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">appropriately</text><rect x="540" y="144" width="330" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Working-class pupils more often in</text><text x="705" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">lower sets, with lower</text><text x="705" y="215.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">expectations and exam entry</text><rect x="378" y="170" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="195" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Setting</text><line x1="360" y1="189" x2="378" y2="189" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="189" x2="540" y2="189" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="246" width="330" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="273.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Hidden curriculum: rules, rewards</text><text x="195" y="295.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and sanctions teach conformity to</text><text x="195" y="317.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">shared norms</text><rect x="540" y="246" width="330" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="273.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Hidden curriculum: obeying</text><text x="705" y="295.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">teachers prepares pupils to obey</text><text x="705" y="317.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">bosses (correspondence principle)</text><rect x="378" y="272" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="297" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">School rules</text><line x1="360" y1="291" x2="378" y2="291" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="291" x2="540" y2="291" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="348" width="330" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="386.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Same measure for everyone, so it</text><text x="195" y="408.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">appears fair</text><rect x="540" y="348" width="330" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="375.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The myth of meritocracy: class</text><text x="705" y="397.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">background strongly predicts</text><text x="705" y="419.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">outcomes</text><rect x="378" y="374" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="399" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Testing</text><line x1="360" y1="393" x2="378" y2="393" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="393" x2="540" y2="393" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="456" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="489.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Showing how each perspective reads the same practice differently is an effective way to</text><text x="50" y="511.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evaluate.</text>
</svg>