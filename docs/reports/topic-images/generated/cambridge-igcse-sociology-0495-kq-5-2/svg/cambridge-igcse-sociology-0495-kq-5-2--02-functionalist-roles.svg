<rect width="900" height="515" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Functionalism: school as a bridge</text>

<rect x="30" y="110" width="230" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="145" y="145.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Family</text><text x="145" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">particularistic: judged</text><text x="145" y="196.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">as an individual</text><rect x="335" y="110" width="230" height="110" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="156.3" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">School</text><text x="450" y="186.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the bridge (Parsons)</text><rect x="640" y="110" width="230" height="118" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="755" y="137.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Wider society and</text><text x="755" y="162.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">work</text><text x="755" y="190.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">universalistic: same</text><text x="755" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">standards for all</text><line x1="264" y1="165" x2="329" y2="165" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><line x1="569" y1="165" x2="634" y2="165" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="258" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Status is achieved through effort and ability</text><text x="450" y="300" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Four positive roles of education</text><rect x="30" y="316" width="201" height="171" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="350.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Socialisation</text><text x="50" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Durkheim: shared</text><text x="50" y="399.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">culture and social</text><text x="50" y="420.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">solidarity; a</text><text x="50" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“society in</text><text x="50" y="462.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">miniature”</text><rect x="243" y="316" width="201" height="171" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="263" y="350.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Social control</text><text x="263" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rules, rewards and</text><text x="263" y="399.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sanctions teach</text><text x="263" y="420.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conformity</text><rect x="456" y="316" width="201" height="171" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="350.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economic</text><text x="476" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Knowledge and</text><text x="476" y="399.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">skills an</text><text x="476" y="420.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">industrial economy</text><text x="476" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">needs</text><rect x="669" y="316" width="201" height="171" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="689" y="350.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Selective</text><text x="689" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Exams sort pupils</text><text x="689" y="399.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">so the most able</text><text x="689" y="420.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reach the most</text><text x="689" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">important jobs</text>
</svg>