<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="496" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How class advantage passes through school</text>

<rect x="30" y="104" width="249.33333333333334" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AT HOME</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Middle-class</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">cultural capital</text><text x="50" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Language, tastes and</text><text x="50" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">knowledge learned at home</text><line x1="285.33333333333337" y1="183" x2="319.33333333333337" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="104" width="249.33333333333334" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="345.33333333333337" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AT SCHOOL</text><text x="345.33333333333337" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">School rewards it</text><text x="345.33333333333337" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pupils arrive “speaking</text><text x="345.33333333333337" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the school’s language”</text><text x="345.33333333333337" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Bourdieu)</text><line x1="580.6666666666667" y1="183" x2="614.6666666666667" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="104" width="249.33333333333334" height="158" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="640.6666666666667" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RESULT</text><text x="640.6666666666667" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Success looks like</text><text x="640.6666666666667" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">merit</text><text x="640.6666666666667" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Class advantage is</text><text x="640.6666666666667" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disguised</text><text x="450" y="300" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Material factors: poorer families have less of</text><rect x="70.75" y="326" width="209.95" height="42" rx="21" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="175.725" y="353.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">digital technology</text><rect x="292.7" y="326" width="200.17499999999998" height="42" rx="21" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="392.78749999999997" y="353.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">quiet study space</text><rect x="504.875" y="326" width="112.19999999999999" height="42" rx="21" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="560.975" y="353.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">tutoring</text><rect x="629.075" y="326" width="200.17499999999998" height="42" rx="21" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="729.1625" y="353.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">educational trips</text><rect x="30" y="386" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="419.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">When learning moves online, the digital divide widens gaps. Setting can add to this:</text><text x="50" y="441.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">working-class pupils are more often placed in lower sets.</text>
</svg>