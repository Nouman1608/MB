<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="628" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Feminism: education and gender inequality</text>

<rect x="30" y="110" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="148" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Gender hierarchy in the staffroom</text><circle cx="160" cy="185.8" r="14.3" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><rect x="142.4" y="203.4" width="35.2" height="44" rx="12.100000000000001" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">senior leaders:</text><text x="160" y="294" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">more likely men</text><circle cx="320" cy="211.3" r="11.049999999999999" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="306.4" y="224.9" width="27.2" height="34" rx="9.35" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="370" cy="211.3" r="11.049999999999999" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="356.4" y="224.9" width="27.2" height="34" rx="9.35" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="420" cy="211.3" r="11.049999999999999" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="406.4" y="224.9" width="27.2" height="34" rx="9.35" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="211.3" r="11.049999999999999" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="456.4" y="224.9" width="27.2" height="34" rx="9.35" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="520" cy="211.3" r="11.049999999999999" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="506.4" y="224.9" width="27.2" height="34" rx="9.35" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="420" y="286" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">most teachers, especially primary: women</text><text x="735" y="200" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Pupils learn that men</text><text x="735" y="224" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">lead and women care</text><rect x="30" y="330" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="364.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Role models</text><text x="50" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Few women in science and</text><text x="50" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">engineering; few men in</text><text x="50" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">primary teaching</text><rect x="314" y="330" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="364.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Subject choice</text><text x="334" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Boys: physics, computing.</text><text x="334" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Girls: e.g. health and</text><text x="334" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">social care</text><rect x="598" y="330" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="364.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Teacher expectations</text><text x="618" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Spender (1982): boys</text><text x="618" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dominated talk and got more</text><text x="618" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">attention</text><rect x="30" y="471" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="505.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peer groups</text><text x="50" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Teasing and labels police</text><text x="50" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gender norms</text><rect x="314" y="471" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="505.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Access</text><text x="334" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Poverty, early marriage,</text><text x="334" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">duties, unsafe journeys;</text><text x="334" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sons may be prioritised</text><rect x="598" y="471" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="505.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gendered curriculum</text><text x="618" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Textbooks may show men as</text><text x="618" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the main actors</text>
</svg>