<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 553" width="900" height="553" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="553" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One developed point on the Marxist view</text>

<rect x="30" y="104" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUESTION</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Discuss the Marxist view of the role of education.</text><rect x="30" y="207" width="170" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="239" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">State the view</text><rect x="214" y="207" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="236.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marxists argue that education reproduces class inequality.</text><rect x="30" y="269" width="170" height="72" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence</text><rect x="214" y="269" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="298.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Bowles and Gintis: following school rules mirrors following a boss’s</text><text x="230" y="320.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">orders, preparing working-class pupils for obedient work.</text><rect x="30" y="353" width="170" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluate</text><rect x="214" y="353" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="382.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Willis found the “lads” rejected school rules, so pupils are not simply</text><text x="230" y="404.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shaped by schooling.</text><rect x="30" y="443" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="476.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Add two more points, such as cultural capital and the myth of meritocracy, for the three</text><text x="50" y="498.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">required.</text>
</svg>