<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When it is set, written and read</text>

<rect x="30" y="130" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="168" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">The Scarlet Letter</text><line x1="70" y1="240" x2="840" y2="240" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="180" cy="240" r="13" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="180" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Set</text><text x="180" y="274" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">seventeenth-century Boston</text><circle cx="500" cy="240" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="500" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Published</text><text x="500" y="274" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">1850</text><circle cx="770" cy="240" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="770" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Read</text><text x="770" y="274" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">now</text><text x="54" y="312" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">Why did Hawthorne look back to his ancestors’ society?</text><path d="M200,230 Q340,190 480,230" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-start="url(#ahO)"/><rect x="30" y="350" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="388" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Great Expectations</text><line x1="70" y1="460" x2="840" y2="460" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="180" cy="460" r="13" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="180" y="434" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Looks back to</text><text x="180" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the earlier part of the century</text><circle cx="500" cy="460" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="500" y="434" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Published</text><text x="500" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">1860–61</text><circle cx="770" cy="460" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="770" y="434" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Read</text><text x="770" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">now</text><text x="54" y="532" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">Why did Dickens look backwards?</text><path d="M200,450 Q340,410 480,450" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-start="url(#ahO)"/><rect x="30" y="570" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="603.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Noticing the gap between setting and writing lets you ask why a writer looked backwards:</text><text x="50" y="625.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">often the most interesting AO4 point available.</text>
</svg>