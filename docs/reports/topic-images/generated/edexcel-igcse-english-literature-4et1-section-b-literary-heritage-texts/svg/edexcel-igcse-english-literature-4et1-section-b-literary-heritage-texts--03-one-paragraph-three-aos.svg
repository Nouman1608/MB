<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" width="900" height="644" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="644" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One paragraph, three objectives</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Attitudes to marriage in Pride and Prejudice: Charlotte Lucas</text>
<rect x="150" y="140" width="670" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="173" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">POINT</text><text x="170" y="203.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marriage could be a practical bargain rather than a romantic choice; we</text><text x="170" y="225.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">understand Charlotte even while Elizabeth is shocked.</text><circle cx="80" cy="195" r="38" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="202" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><rect x="150" y="264" width="670" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="170" y="297" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">METHOD</text><text x="170" y="327.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Calm, reasonable statements and a narrator who does not mock her; the</text><text x="170" y="349.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">two friends placed side by side make the reader weigh love against</text><text x="170" y="371.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">security.</text><circle cx="80" cy="330" r="38" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="80" y="337" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><rect x="150" y="410" width="670" height="110" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="443" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">CONTEXT</text><text x="170" y="473.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">For a woman of Charlotte’s class, with little money and no profession</text><text x="170" y="495.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">open to her, marriage was close to the only route to a home of her own.</text><circle cx="80" cy="465" r="38" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="472" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4</text><path d="M820,465 C852,465 852,330 824,330" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><g transform="translate(866,397.5) rotate(-90)"><text x="0" y="0" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">explains why</text></g><rect x="30" y="540" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="573.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The context sentence explains why Charlotte’s speech is so measured. It does not start a</text><text x="50" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">new paragraph about the Regency period.</text>
</svg>