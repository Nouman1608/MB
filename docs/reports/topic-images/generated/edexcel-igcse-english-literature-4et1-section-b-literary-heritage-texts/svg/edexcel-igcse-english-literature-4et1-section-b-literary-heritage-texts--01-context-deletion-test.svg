<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="900" height="492" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="492" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Context is a lens, not a topic</text>

<rect x="250" y="116" width="400" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="149" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THE TEST</text><text x="450" y="176.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Delete the context sentence</text><line x1="450" y1="208" x2="450" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="200" y="234" width="500" height="62" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Is your reading of the quotation weaker?</text><path d="M330,296 C330,326 230,326 230,350" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M570,296 C570,326 670,326 670,350" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="262" y="326" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">yes</text><text x="638" y="326" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">no</text><rect x="30" y="356" width="400" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="392" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">A lens: keep it</text><text x="50" y="421.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It explains a choice the writer made, or</text><text x="50" y="443.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">changes what a moment means.</text><rect x="470" y="356" width="400" height="112" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="490" y="403" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Decoration: cut it</text><text x="490" y="432.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Examiners are not testing history.</text>
</svg>