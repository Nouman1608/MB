<rect width="900" height="827" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a Section B answer</text>

<text x="30" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Minutes (total 45)</text><rect x="30" y="140" width="37.333333333333336" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="48.66666666666667" y="175" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="67.33333333333334" y="140" width="93.33333333333333" height="56" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="114" y="175" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="160.66666666666669" y="140" width="56" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="188.66666666666669" y="175" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="216.66666666666669" y="140" width="597.3333333333334" height="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="291.33333333333337" y="175" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">32</text><rect x="814" y="140" width="56" height="56" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="842" y="175" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="366" y1="146" x2="366" y2="190" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="4 4"/><line x1="515.3333333333334" y1="146" x2="515.3333333333334" y2="190" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="4 4"/><line x1="664.6666666666667" y1="146" x2="664.6666666666667" y2="190" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="4 4"/><text x="515.3333333333334" y="220" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">roughly eight minutes per paragraph</text><line x1="62" y1="260" x2="62" y2="687" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="240" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="274.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Choose · 2</text><text x="128" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pick the question where you can name three moments and two contexts at once.</text><circle cx="62" cy="283.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="292.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="335" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="369.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Plan · 5</text><text x="128" y="397.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A one-line argument, then three or four headings, each with a moment and a context.</text><circle cx="62" cy="378.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="387.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="430" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="464.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Locate · 3</text><text x="128" y="492.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Find the passages in your unmarked copy; note page numbers on the plan.</text><circle cx="62" cy="473.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="482.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="525" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="559.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Write · 32</text><text x="128" y="587.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A short introduction, the paragraphs, a short conclusion.</text><circle cx="62" cy="568.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="577.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="620" width="762" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="654.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Check · 3</text><text x="128" y="682.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Every paragraph contains at least one context link.</text><circle cx="62" cy="663.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="672.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="723" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="756.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">If Section A overran, shorten the plan rather than drop the context. AO4 is a third of this</text><text x="50" y="778.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">essay.</text>
</svg>