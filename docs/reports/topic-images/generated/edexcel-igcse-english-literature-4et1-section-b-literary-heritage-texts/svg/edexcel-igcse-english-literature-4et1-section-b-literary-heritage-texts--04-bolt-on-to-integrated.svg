<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From bolt-on to integrated context</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Macbeth</text>
<rect x="30" y="116" width="840" height="196" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><circle cx="64" cy="150" r="15" fill="#b5602e"/><path d="M58,144 l12,12 m0,-12 l-12,12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="92" y="157" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Bolt-on: two sentences that never meet</text><rect x="54" y="182" width="360" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="74" y="215" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMAGERY</text><text x="74" y="244.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shakespeare uses dark imagery when</text><text x="74" y="265.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Macbeth first thinks of murder.</text><rect x="486" y="182" width="360" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="506" y="215" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTEXT</text><text x="506" y="244.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">In Jacobean times people believed in</text><text x="506" y="265.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the divine right of kings.</text><line x1="420" y1="235" x2="480" y2="235" stroke="#b5602e" stroke-width="3" stroke-dasharray="5 5"/><rect x="30" y="332" width="840" height="250" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><circle cx="64" cy="366" r="15" fill="#2e6b62"/><path d="M57.25,366.3 l4.8,5.1000000000000005 l9,-9.9" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="92" y="373" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Integrated: context explains the image</text><rect x="50" y="398" width="240" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="70" y="451" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMAGE (AO2)</text><text x="70" y="481.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Macbeth asks the stars</text><text x="70" y="503.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to hide their light.</text><line x1="296" y1="473" x2="324" y2="473" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="398" width="240" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="350" y="440" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONTEXT (AO4)</text><text x="350" y="470.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An audience who</text><text x="350" y="492.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">believed a king was</text><text x="350" y="514.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">chosen by God.</text><line x1="576" y1="473" x2="604" y2="473" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="398" width="240" height="150" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="630" y="451" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">ARGUMENT (AO1)</text><text x="630" y="481.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">He already knows the</text><text x="630" y="503.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">murder is sacrilege.</text>
</svg>