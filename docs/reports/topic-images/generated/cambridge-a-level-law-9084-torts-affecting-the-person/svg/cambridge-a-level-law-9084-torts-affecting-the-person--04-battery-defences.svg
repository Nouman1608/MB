<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="436" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Defences to battery</text>

<rect x="30" y="100" width="270.6666666666667" height="304" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSENT</text><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Express or implied</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Medical:</tspan> real if informed in</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">broad terms (<tspan font-style="italic">Chatterton</tspan> <tspan font-style="italic">v</tspan></text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Gerson</tspan>, 1981); failure to explain</text><text x="46" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">risks is negligence</text><text x="46" y="272.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A competent adult may refuse</text><text x="46" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treatment, even if fatal (<tspan font-style="italic">Re</tspan> <tspan font-style="italic">T</tspan>,</text><text x="46" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1992)</text><text x="46" y="341.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Sport:</tspan> contact within the rules</text><text x="46" y="362.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and spirit, not deliberate foul</text><text x="46" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">play</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="304" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SELF-DEFENCE</text><text x="330.6666666666667" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Honest and reasonable</text><text x="330.6666666666667" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">belief; reasonable,</text><text x="330.6666666666667" y="200.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">proportionate force</text><text x="330.6666666666667" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Lane</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Holloway</tspan> (1968):</text><text x="330.6666666666667" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serious eye injury for a minor</text><text x="330.6666666666667" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">blow was excessive</text><text x="330.6666666666667" y="297.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ashley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">CC</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Sussex</tspan> (2008):</text><text x="330.6666666666667" y="318.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a mistaken belief must be</text><text x="330.6666666666667" y="339.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasonable in a civil claim</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="304" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NECESSITY</text><text x="615.3333333333334" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">To prevent greater harm</text><text x="615.3333333333334" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Leigh</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Gladstone</tspan> (1909):</text><text x="615.3333333333334" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">force-feeding a hunger striker;</text><text x="615.3333333333334" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">now doubted</text><text x="615.3333333333334" y="251.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">F</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">West</tspan> <tspan font-style="italic">Berkshire</tspan>: sterilisation</text><text x="615.3333333333334" y="272.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in the best interests of a</text><text x="615.3333333333334" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">patient unable to consent</text>
</svg>