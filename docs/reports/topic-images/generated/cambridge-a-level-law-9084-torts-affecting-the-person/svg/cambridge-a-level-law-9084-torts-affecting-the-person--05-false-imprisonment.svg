<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">False imprisonment: total restraint</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Unlawful total restraint of liberty, for any time, however short</text>
<rect x="30" y="124" width="410" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="124" width="410" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Total restraint: imprisoned</text><rect x="90" y="184" width="290" height="120" fill="#ffffff" stroke="#1e2a44" stroke-width="5"/><circle cx="235" cy="216" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M235,225 L235,248 M223,233 L247,233 M235,248 L225,264 M235,248 L245,264" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="370" y="224" width="10" height="44" fill="#b5602e"/><text x="360" y="296" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">locked</text><text x="480" y="156" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Partial obstruction: Bird v Jones (1845)</text><rect x="490" y="214" width="350" height="60" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><rect x="700" y="208" width="12" height="72" fill="#b5602e"/><text x="706" y="200" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">blocked</text><circle cx="640" cy="196" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M640,205 L640,228 M628,213 L652,213 M640,228 L630,244 M640,228 L650,244" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="610" y1="259" x2="510" y2="259" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="620" y="306" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">could go back the other way</text><rect x="30" y="356" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="384" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEANS OF ESCAPE</text><text x="46" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Must be reasonable: a dangerous route such as a</text><text x="46" y="436.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">high window does not count</text><rect x="457" y="356" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="384" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REASONABLE CONDITIONS</text><text x="473" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Robinson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Balmain</tspan> <tspan font-style="italic">Ferry</tspan> (1910): small turnstile</text><text x="473" y="436.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">charge. <tspan font-style="italic">Herd</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Weardale</tspan> (1915): miners not</text><text x="473" y="457.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">brought up before the end of the shift</text><rect x="30" y="492" width="413" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="520" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">KNOWLEDGE NOT NEEDED</text><text x="46" y="551.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Meering</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Grahame-White</tspan> (1920). <tspan font-style="italic">Murray</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">MoD</tspan></text><text x="46" y="572.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1988): but damages may be nominal if unaware</text><text x="46" y="593.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and unharmed</text><rect x="457" y="492" width="413" height="143" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="473" y="520" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LAWFUL RESTRAINT</text><text x="473" y="551.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lawful arrest (PACE 1984) or sentence. Unlawful</text><text x="473" y="572.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">once authority ends: <tspan font-style="italic">ex</tspan> <tspan font-style="italic">parte</tspan> <tspan font-style="italic">Evans</tspan> (2001). <tspan font-style="italic">Austin</tspan></text><text x="473" y="593.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">MPC</tspan> (2009): containment not contrary to Article</text><text x="473" y="614.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">5</text>
</svg>