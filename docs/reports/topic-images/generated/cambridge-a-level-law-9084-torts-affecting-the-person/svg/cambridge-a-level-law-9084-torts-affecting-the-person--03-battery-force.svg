<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Battery: what counts as force?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The intentional and direct application of unlawful force</text>
<rect x="30" y="124" width="270.6666666666667" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANY TOUCHING</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“The least touching of another</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in anger”: <tspan font-style="italic">Cole</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Turner</tspan> (1704).</text><text x="46" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No injury needed</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THROUGH AN OBJECT</text><text x="330.6666666666667" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Such as throwing water</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTINUING ACT</text><text x="615.3333333333334" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Fagan</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">MPC</tspan> (1969): car left</text><text x="615.3333333333334" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on an officer’s foot</text><rect x="30" y="268" width="840" height="128" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="298" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOT A BATTERY: EVERYDAY CONTACT</text><text x="48" y="324.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Collins v Wilcock (1984)</text><text x="48" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Taken to consent to ordinary contacts of daily life: jostling in a crowd, a tap on the shoulder. But an officer</text><text x="48" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">who held a woman’s arm to detain her, without arresting her, committed a battery.</text><text x="450" y="432" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">MUST THE TOUCHING BE HOSTILE?</text><rect x="30" y="446" width="395" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="474" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">YES</text><text x="46" y="500.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wilson v Pringle (1987)</text><text x="46" y="528.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An unlawful interference the claimant would</text><text x="46" y="549.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">object to</text><line x1="431" y1="508" x2="469" y2="508" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="446" width="395" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="491" y="474" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NO</text><text x="491" y="500.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">F v West Berkshire HA (1989)</text><text x="491" y="528.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lord Goff: a well-meant but unwanted touching,</text><text x="491" y="549.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such as surgery without consent, is a battery</text><text x="450" y="598" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Better view: is the touching outside the generally accepted conduct of everyday life?</text>
</svg>