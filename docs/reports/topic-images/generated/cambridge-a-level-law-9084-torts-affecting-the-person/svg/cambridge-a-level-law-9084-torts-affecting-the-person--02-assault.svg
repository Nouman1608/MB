<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Assault: apprehending immediate force</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">No contact is needed</text>
<rect x="30" y="124" width="270.6666666666667" height="164" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APPREHENSION, NOT FEAR</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The claimant must expect</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">force; someone asleep,</text><text x="46" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unaware of the threat, is not</text><text x="46" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assaulted</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="164" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMMEDIACY AND MEANS</text><text x="330.6666666666667" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Stephens</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Myers</tspan> (1830): fist</text><text x="330.6666666666667" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">raised, stopped before</text><text x="330.6666666666667" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reaching him: liable. <tspan font-style="italic">Thomas</tspan> <tspan font-style="italic">v</tspan></text><text x="330.6666666666667" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">NUM</tspan> (1985): pickets held back</text><text x="330.6666666666667" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by police: no</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="164" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REASONABLENESS</text><text x="615.3333333333334" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Read</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Coker</tspan> (1853): workmen</text><text x="615.3333333333334" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surrounded him, threatening to</text><text x="615.3333333333334" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">break his neck</text><text x="450" y="322" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">WORDS AND SILENCE</text><rect x="30" y="344" width="270.6666666666667" height="166" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="372" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WORDS CAN CREATE</text><text x="46" y="398.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An assault</text><text x="46" y="426.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Where they lead the claimant</text><text x="46" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to expect immediate force</text><rect x="314.6666666666667" y="344" width="270.6666666666667" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="372" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WORDS CAN NEGATE</text><text x="330.6666666666667" y="398.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An assault</text><text x="330.6666666666667" y="426.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Tuberville</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Savage</tspan> (1669):</text><text x="330.6666666666667" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hand on sword, but “If it were</text><text x="330.6666666666667" y="468.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not assize-time, I would not</text><text x="330.6666666666667" y="489.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">take such language from you”</text><rect x="599.3333333333334" y="344" width="270.6666666666667" height="166" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="372" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SILENCE CAN BE ENOUGH</text><text x="615.3333333333334" y="398.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Silent telephone calls</text><text x="615.3333333333334" y="426.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ireland</tspan> (1998), a criminal</text><text x="615.3333333333334" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">case usually cited on this point</text>
</svg>