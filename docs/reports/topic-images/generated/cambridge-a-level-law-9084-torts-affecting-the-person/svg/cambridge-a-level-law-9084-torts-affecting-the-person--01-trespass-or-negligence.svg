<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Trespass to the person or negligence?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Assault, battery and false imprisonment share four features</text>
<rect x="250" y="124" width="400" height="51" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Did the harm follow directly from the act?</text><rect x="250" y="219" width="400" height="51" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="249.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Was the act intentional or reckless?</text><rect x="30" y="314" width="400" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="346" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRESPASS TO THE PERSON</text><text x="50" y="372.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Actionable per se</text><text x="50" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No damage need be proved: nominal damages</text><text x="50" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">even without injury; aggravated or exemplary</text><text x="50" y="443.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in serious cases</text><rect x="470" y="314" width="400" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="346" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NEGLIGENCE (THE ALTERNATIVE ACTION)</text><text x="490" y="372.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Damage must be proved</text><text x="490" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Letang</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Cooper</tspan> (1965): an unintentional act</text><text x="490" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lies in negligence, not trespass</text><line x1="450" y1="179" x2="450" y2="215" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="462" y="203" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><line x1="380" y1="274" x2="230" y2="310" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="290" y="292" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">yes</text><line x1="520" y1="274" x2="670" y2="310" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="610" y="292" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">no</text><path d="M650,149.5 L800,149.5" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="800" y1="149.5" x2="800" y2="310" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="812" y="139.5" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">no</text><text x="788" y="199.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">indirect:</text><text x="788" y="217.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">negligence</text><text x="788" y="235.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">or other torts</text><rect x="30" y="494" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="527.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Standard</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">proof:</tspan> the balance of probabilities, even where the same facts are also crimes.</text>
</svg>