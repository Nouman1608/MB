<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Model answer: Nora and the security guard</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Nora had not stolen anything</text>
<line x1="60" y1="194" x2="840" y2="194" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="165.33333333333334" cy="194" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="165.33333333333334" y="201.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="165.33333333333334" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">“Stop or I’ll make you!”</text><circle cx="450" cy="194" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="201.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="450" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Grabs her arm</text><circle cx="734.6666666666667" cy="194" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="734.6666666666667" y="201.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="734.6666666666667" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Locked in a room, 40 minutes</text><line x1="165.33333333333334" y1="218" x2="165.33333333333334" y2="244" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="450" y1="218" x2="450" y2="244" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="734.6666666666667" y1="218" x2="734.6666666666667" y2="244" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 4"/><rect x="30" y="244" width="270.6666666666667" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="272" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ASSAULT</text><text x="46" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shout plus approach:</text><text x="46" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasonable apprehension of</text><text x="46" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">immediate force (<tspan font-style="italic">Stephens</tspan> <tspan font-style="italic">v</tspan></text><text x="46" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Myers</tspan>)</text><rect x="314.6666666666667" y="244" width="270.6666666666667" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="272" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BATTERY</text><text x="330.6666666666667" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Direct, intentional force beyond</text><text x="330.6666666666667" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">everyday contact (<tspan font-style="italic">Collins</tspan> <tspan font-style="italic">v</tspan></text><text x="330.6666666666667" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Wilcock</tspan>); no consent</text><rect x="599.3333333333334" y="244" width="270.6666666666667" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="272" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FALSE IMPRISONMENT</text><text x="615.3333333333334" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Locked room. An unknown,</text><text x="615.3333333333334" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unlocked fire exit does not</text><text x="615.3333333333334" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prevent total restraint</text><rect x="30" y="409" width="481.8333333333333" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="437" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LAWFUL RESTRAINT?</text><text x="46" y="468.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A citizen’s arrest under s24A PACE 1984 has strict</text><text x="46" y="489.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conditions, including that a constable could not reasonably</text><text x="46" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">make it. Locking her in for 40 minutes instead of calling the</text><text x="46" y="531.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">police likely exceeds any authority.</text><rect x="525.8333333333333" y="409" width="344.1666666666667" height="143" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="541.8333333333333" y="437" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUSION</text><text x="541.8333333333333" y="468.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nora can sue for all three torts without</text><text x="541.8333333333333" y="489.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proving damage; damages may include</text><text x="541.8333333333333" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compensation for humiliation.</text>
</svg>