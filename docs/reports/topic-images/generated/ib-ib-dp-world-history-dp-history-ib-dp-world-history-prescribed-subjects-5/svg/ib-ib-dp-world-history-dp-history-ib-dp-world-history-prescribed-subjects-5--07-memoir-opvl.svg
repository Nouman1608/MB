<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 2: value and limitation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A UN force commander's memoir, published nine years after the genocide</text>
<rect x="30" y="124" width="370" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="160.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ORIGIN</text><text x="44" y="185.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Commander of the UN force</text><rect x="470" y="124" width="400" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VALUE</text><text x="484" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Took part in the decisions and saw their</text><text x="484" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">effects directly</text><line x1="406" y1="169" x2="464" y2="169" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="230" width="370" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="256" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PURPOSE</text><text x="44" y="281.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">To explain and perhaps justify his</text><text x="44" y="302.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">conduct; to indict those who refused</text><text x="44" y="323.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">support</text><rect x="470" y="230" width="400" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="484" y="266.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="484" y="291.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">May stress his warnings and others' faults</text><text x="484" y="312.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">more than his own choices</text><line x1="406" y1="285.5" x2="464" y2="285.5" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="30" y="357" width="370" height="192" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="444.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DATE</text><text x="44" y="469.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nine years later</text><rect x="470" y="357" width="400" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="393.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VALUE</text><text x="484" y="418.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Benefits from documents released since</text><line x1="406" y1="402" x2="464" y2="402" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="470" y="459" width="400" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="484" y="485" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="484" y="510.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Memory may have been reshaped by later</text><text x="484" y="531.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">debate</text><line x1="406" y1="504" x2="464" y2="504" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="30" y="571" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="605.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Tie every point to the stated topic</text><text x="450" y="635.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Here, the failure of intervention.</text>
</svg>