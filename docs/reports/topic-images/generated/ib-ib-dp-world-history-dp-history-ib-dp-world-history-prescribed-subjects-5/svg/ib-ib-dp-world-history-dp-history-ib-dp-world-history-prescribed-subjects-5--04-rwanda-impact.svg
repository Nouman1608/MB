<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 539" width="900" height="539" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="539" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rwanda: impact to 1998</text>

<text x="235" y="108" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">REFUGEES AND REGIONAL WAR</text><text x="665" y="108" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">INTERNATIONAL JUSTICE</text><rect x="30" y="116" width="410" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="150.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Around two million Hutu flee</text><text x="50" y="178.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many to camps in Zaire run by former soldiers</text><text x="50" y="199.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and militias</text><line x1="235" y1="229" x2="235" y2="259" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="264" width="410" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="296" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1996-1997</text><text x="50" y="322.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First Congo War</text><text x="50" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Attacks from the camps; Rwandan-backed</text><text x="50" y="371.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">forces overthrow Mobutu</text><rect x="460" y="116" width="410" height="83" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOV 1994</text><text x="480" y="174.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ICTR created at Arusha</text><line x1="665" y1="204" x2="665" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="239" width="410" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="271" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1998</text><text x="480" y="297.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Akayesu judgment</text><text x="480" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">First conviction for genocide by an international</text><text x="480" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">court; rape recognised as an act of genocide</text><rect x="30" y="418" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="452.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1998</text><text x="450" y="482.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">President Clinton, visiting Kigali, acknowledged the international failure.</text>
</svg>