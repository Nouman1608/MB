<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rwanda: from colonial categories to 1994</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Not "ancient tribal hatred": colonial and political causes</text>
<line x1="150" y1="134" x2="150" y2="633" stroke="#1e2a44" stroke-width="4"/><rect x="184" y="124" width="686" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="197" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Belgian rule hardens Hutu and Tutsi into fixed racial categories</text><text x="197" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Identity cards from the 1930s; the Tutsi minority favoured for education and office</text><line x1="150" y1="158.5" x2="184" y2="158.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="158.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="164.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">after 1918</text><rect x="184" y="203" width="686" height="45" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="197" y="230.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Belgium switches support to the Hutu majority</text><line x1="150" y1="225.5" x2="184" y2="225.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="225.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="231.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">end of rule</text><rect x="184" y="258" width="686" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="285.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hutu revolution</text><text x="197" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many Tutsi driven into exile in neighbouring countries</text><line x1="150" y1="292.5" x2="184" y2="292.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="292.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="298.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1959-1962</text><rect x="184" y="337" width="686" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="364.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">RPF invades from Uganda</text><text x="197" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Habyarimana's government portrays all Tutsi as enemies</text><line x1="150" y1="371.5" x2="184" y2="371.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="371.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="377.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Oct 1990</text><rect x="184" y="416" width="686" height="69" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="197" y="443.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hutu Power organises</text><text x="197" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Interahamwe militias; propaganda on the radio station RTLM</text><line x1="150" y1="450.5" x2="184" y2="450.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="450.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="456.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1990-1994</text><rect x="184" y="495" width="686" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="522.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Arusha Accords</text><text x="197" y="546.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Power-sharing and RPF integration; extremists see betrayal</text><line x1="150" y1="529.5" x2="184" y2="529.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="529.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="535.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Aug 1993</text><rect x="184" y="574" width="686" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="197" y="601.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Habyarimana's plane shot down over Kigali</text><text x="197" y="625.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Organised killing begins within hours</text><line x1="150" y1="608.5" x2="184" y2="608.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="608.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="614.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">6 Apr 1994</text>
</svg>