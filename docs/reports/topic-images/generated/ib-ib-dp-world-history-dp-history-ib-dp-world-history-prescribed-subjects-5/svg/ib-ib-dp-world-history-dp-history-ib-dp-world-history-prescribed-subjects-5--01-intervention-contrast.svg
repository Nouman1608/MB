<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 447" width="900" height="447" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="447" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Failure to intervene, and intervention without the UN</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Intervention is a decision taken by states with interests</text>
<rect x="30" y="124" width="410" height="209" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RWANDA, 1990-1998</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The world did not intervene against</text><text x="50" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">genocide</text><text x="50" y="235.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">UNAMIR present, with a limited mandate</text><text x="50" y="261.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="261.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reduced to a small force on 21 April 1994</text><text x="50" y="287.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="287.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Genocide ended by RPF military victory (July</text><text x="65.2" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1994)</text><rect x="460" y="124" width="410" height="209" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">KOSOVO, 1989-2002</text><text x="480" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">NATO intervened by force</text><text x="480" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bombing, 24 March to 10 June 1999</text><text x="480" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No UN Security Council authorisation: Russia</text><text x="495.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and China opposed</text><text x="480" y="284.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Then UN administration (UNMIK) with KFOR</text><text x="450" y="365" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Criteria for evaluating any intervention</text><rect x="36.120000000000005" y="385" width="154.656" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="113.44800000000001" y="405.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Did it save lives?</text><rect x="200.776" y="385" width="198.72" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="300.136" y="405.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Did it end the conflict?</text><rect x="409.496" y="385" width="270.48" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="544.736" y="405.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Did it respect international law?</text><rect x="689.976" y="385" width="173.904" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="776.928" y="405.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Did it bring justice?</text>
</svg>