<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Interpretations of intervention</text>

<text x="30" y="110" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">KOSOVO: WHAT WAS NATO'S ACTION?</text><text x="40" y="142" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Humanitarian rescue</text><text x="860" y="142" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">Breach of international law</text><defs><linearGradient id="sg126" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="171" width="780" height="26" rx="13" fill="url(#sg126)" stroke="#1e2a44" stroke-width="2.5"/><path d="M122.4,197 L122.4,220 L165.33333333333334,234 L165.33333333333334,254" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="122.4" cy="184" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M450,197 L450,220 L450,234 L450,254" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="450" cy="184" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M777.6,197 L777.6,220 L734.6666666666667,234 L734.6666666666667,254" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="777.6" cy="184" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="254" width="270.6666666666667" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="292.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A valuable precedent</text><text x="165.33333333333334" y="321.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A humanitarian rescue</text><rect x="314.6666666666667" y="254" width="270.6666666666667" height="96" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="292.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Independent commission</text><text x="450" y="321.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">"Illegal but legitimate"</text><rect x="599.3333333333334" y="254" width="270.6666666666667" height="96" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="734.6666666666667" y="282.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A weakened UN</text><text x="734.6666666666667" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Action without Security Council</text><text x="734.6666666666667" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">authorisation</text><text x="30" y="392" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">RWANDA</text><rect x="30" y="408" width="412" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="442.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Samantha Power (2002)</text><text x="50" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">US officials had enough information to recognise</text><text x="50" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">genocide and chose not to act, partly for lack of</text><text x="50" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">domestic pressure</text><rect x="458" y="408" width="412" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="452.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">France's role</text><text x="478" y="481.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Debated: both before 1994 and in Operation</text><text x="478" y="502.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Turquoise</text>
</svg>