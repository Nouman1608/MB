<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rwanda, 1994: events and the outside world</text>

<text x="212.5" y="116" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">IN RWANDA</text><text x="687.5" y="116" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">OUTSIDE RESPONSE</text><line x1="450" y1="130" x2="450" y2="670" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="130" width="365" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="156.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dallaire warns UN headquarters</text><text x="43" y="183" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Plans for extermination; arms caches</text><line x1="395" y1="165" x2="396" y2="165" stroke="#1e2a44" stroke-width="2"/><rect x="505" y="130" width="365" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="169.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Told not to raid them</text><line x1="504" y1="165" x2="505" y2="165" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="148" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="171" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Jan 1994</text><rect x="30" y="212" width="365" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="238.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Plane shot down; killing begins</text><text x="43" y="265" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Prime Minister and ten Belgian peacekeepers</text><text x="43" y="285" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">killed</text><line x1="395" y1="257" x2="396" y2="257" stroke="#1e2a44" stroke-width="2"/><rect x="505" y="212" width="365" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="248.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Belgium withdraws its contingent</text><text x="518" y="275" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Western states evacuate their nationals</text><line x1="504" y1="257" x2="505" y2="257" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="240" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="263" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">6-7 Apr</text><rect x="505" y="314" width="365" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="340.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Security Council reduces UNAMIR</text><text x="518" y="367" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">To a small force</text><line x1="504" y1="349" x2="505" y2="349" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="332" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="355" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">21 Apr</text><rect x="30" y="396" width="365" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="432.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Roughly 800,000 killed</text><text x="43" y="459" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Tutsi and moderate Hutu</text><line x1="395" y1="441" x2="396" y2="441" stroke="#1e2a44" stroke-width="2"/><rect x="505" y="396" width="365" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="422.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">US resists the word "genocide"</text><text x="518" y="449" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Shaped by deaths of US soldiers in Somalia</text><text x="518" y="469" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1993)</text><line x1="504" y1="441" x2="505" y2="441" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="424" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="447" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">~100 days</text><rect x="505" y="498" width="365" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="524.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Operation Turquoise (France)</text><text x="518" y="551" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">UN-authorised safe zone; critics: génocidaires</text><text x="518" y="571" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">escaped</text><line x1="504" y1="543" x2="505" y2="543" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="526" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="549" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Jun 1994</text><rect x="30" y="600" width="365" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="626.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">RPF takes Kigali</text><text x="43" y="653" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Genocide ended by military victory</text><line x1="395" y1="635" x2="396" y2="635" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="618" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="641" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Jul 1994</text>
</svg>