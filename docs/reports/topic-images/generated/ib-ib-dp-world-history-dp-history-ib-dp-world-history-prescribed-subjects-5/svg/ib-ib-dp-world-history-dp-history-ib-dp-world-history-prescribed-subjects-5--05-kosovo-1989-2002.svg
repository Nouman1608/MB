<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 801" width="900" height="801" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="801" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Kosovo, 1989-2002</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Gold: steps that led to and ended NATO intervention</text>
<line x1="170" y1="134" x2="170" y2="759" stroke="#1e2a44" stroke-width="4"/><rect x="204" y="124" width="666" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="217" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Autonomy removed by Milošević</text><text x="217" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Albanians dismissed from public jobs</text><line x1="170" y1="158.5" x2="204" y2="158.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="158.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="164.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1989</text><rect x="204" y="202" width="666" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="217" y="229.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Non-violent resistance under Rugova</text><text x="217" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parallel schools and institutions</text><line x1="170" y1="236.5" x2="204" y2="236.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="236.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="242.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">after 1989</text><rect x="204" y="280" width="666" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="217" y="307.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dayton Agreement ignores Kosovo</text><text x="217" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many Albanians conclude non-violence has failed; KLA attacks begin</text><line x1="170" y1="314.5" x2="204" y2="314.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="314.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="320.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1995</text><rect x="204" y="358" width="666" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="217" y="385.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Weapons from Albania; Serbian offensives</text><text x="217" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Jashari family killed in Drenica; OSCE verifiers from October 1998</text><line x1="170" y1="392.5" x2="204" y2="392.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="392.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="398.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1997-1998</text><rect x="204" y="436" width="666" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="217" y="463.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Račak: 45 bodies found</text><line x1="170" y1="458.5" x2="204" y2="458.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="458.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="464.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jan 1999</text><rect x="204" y="490" width="666" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="217" y="517.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rambouillet talks fail</text><line x1="170" y1="512.5" x2="204" y2="512.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="512.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="518.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Feb-Mar 1999</text><rect x="204" y="544" width="666" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="217" y="571.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">NATO bombing: Operation Allied Force</text><text x="217" y="595.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Serbian forces expel hundreds of thousands of Albanians</text><line x1="170" y1="578.5" x2="204" y2="578.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="578.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="584.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">24 Mar - 10 Jun</text><rect x="204" y="622" width="666" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="217" y="649.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Resolution 1244</text><text x="217" y="673.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">UN administration (UNMIK) with KFOR</text><line x1="170" y1="656.5" x2="204" y2="656.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="656.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="662.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jun 1999</text><rect x="204" y="700" width="666" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="217" y="727.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Milošević indicted (May 1999)</text><text x="217" y="751.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Loses power 2000; sent to The Hague 2001; trial opens 2002</text><line x1="170" y1="734.5" x2="204" y2="734.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="170" cy="734.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="150" y="740.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1999-2002</text>
</svg>