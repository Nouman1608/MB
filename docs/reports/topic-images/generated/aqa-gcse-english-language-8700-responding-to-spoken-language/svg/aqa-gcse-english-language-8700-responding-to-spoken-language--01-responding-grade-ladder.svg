<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 784" width="900" height="784" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="784" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the responding criterion steps up</text>

<rect x="30" y="180" width="270.6666666666667" height="269" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="217.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Pass</text><text x="50" y="248.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Listens and gives an</text><text x="50" y="270.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">appropriate response in a</text><text x="50" y="292.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">straightforward manner</text><rect x="50" y="391" width="167" height="32" rx="16" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="133.5" y="412.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">straightforward</text><rect x="314.6666666666667" y="140" width="270.6666666666667" height="309" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="177.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Merit</text><text x="334.6666666666667" y="208.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Listens and responds</text><text x="334.6666666666667" y="230.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">formally and in some</text><text x="334.6666666666667" y="252.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">detail</text><rect x="334.6666666666667" y="351" width="103" height="32" rx="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="386.1666666666667" y="372.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">formally</text><rect x="334.6666666666667" y="391" width="158" height="32" rx="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="413.6666666666667" y="412.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">in some detail</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="349" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="137.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Distinction</text><text x="619.3333333333334" y="168.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Listens, responds</text><text x="619.3333333333334" y="190.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">perceptively and, if</text><text x="619.3333333333334" y="212.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">appropriate, elaborates</text><text x="619.3333333333334" y="234.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">with further ideas and</text><text x="619.3333333333334" y="256.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">information</text><rect x="619.3333333333334" y="351" width="139" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="688.8333333333334" y="372.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">perceptively</text><rect x="619.3333333333334" y="391" width="121" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="679.8333333333334" y="412.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">elaborates</text><rect x="30" y="471" width="220" height="47" fill="#1e2a44"/><text x="140" y="500.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Key word</text><rect x="250" y="471" width="620" height="47" fill="#1e2a44"/><text x="560" y="500.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">What it means</text><rect x="30" y="518" width="220" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="555.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Formally</text><rect x="250" y="518" width="620" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="544.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Keep the register of the presentation, even when it feels like a</text><text x="264" y="566.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">conversation</text><rect x="30" y="588" width="220" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="614.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">In some detail</text><rect x="250" y="588" width="620" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="614.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More than a one-line answer: a reason or an example</text><rect x="30" y="636" width="220" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="673.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Perceptively</text><rect x="250" y="636" width="620" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="662.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">See what lies behind a question, such as the doubt or assumption</text><text x="264" y="684.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">that prompted it, and answer that</text><rect x="30" y="706" width="220" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="732.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Elaborates</text><rect x="250" y="706" width="620" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="732.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Add new ideas or information that the presentation did not include</text><rect x="30" y="471" width="840" height="283" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>