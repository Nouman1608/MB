<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three answers to one challenge</text>

<rect x="30" y="100" width="840" height="74" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="131" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">“Isn’t a car ban unfair on disabled people who need</text><text x="450" y="157" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">to park close to the shops?”</text><rect x="110" y="196" width="760" height="120" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="126" y="225" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRAIGHTFORWARD</text><text x="126" y="250.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Yes, that’s a fair point. They could still come on other days.”</text><rect x="126" y="268" width="192" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="222" y="288.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">relevant and polite</text><rect x="326" y="268" width="184" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="418" y="288.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">brief, undeveloped</text><circle cx="60" cy="256" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="60" y="265.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="110" y="330" width="760" height="144" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="126" y="359" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FORMAL, IN SOME DETAIL</text><text x="126" y="384.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“…the ban should include an exemption for blue-badge holders… Other</text><text x="126" y="408.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">towns have done something similar.”</text><rect x="126" y="426" width="81" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="166.5" y="446.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">formal</text><rect x="215" y="426" width="98" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="264" y="446.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">a reason</text><rect x="321" y="426" width="192" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="417" y="446.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">a proposed solution</text><circle cx="60" cy="402" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="411.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="110" y="488" width="760" height="182" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="126" y="517" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PERCEPTIVE, WITH ELABORATION</text><text x="126" y="542.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“…the question isn’t only access by car, but access for everyone once</text><text x="126" y="566.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">they arrive.”</text><rect x="126" y="584" width="389" height="31" rx="15.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="320.5" y="604.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">sees the principle: fairness and inclusion</text><rect x="523" y="584" width="175" height="31" rx="15.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="610.5" y="604.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">concedes honestly</text><rect x="126" y="622" width="201" height="31" rx="15.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="226.5" y="642.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">adds new information</text><rect x="335" y="622" width="184" height="31" rx="15.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="427" y="642.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">reframes the issue</text><circle cx="60" cy="579" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="588.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text>
</svg>