<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 639" width="900" height="639" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="639" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Active listening, step by step</text>

<line x1="62" y1="120" x2="62" y2="482" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="100" width="762" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="134" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Hear the whole question</text><text x="126" y="163.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">before you start planning an answer</text><circle cx="62" cy="143" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="151.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="198" width="762" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="232" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Identify its core</text><text x="126" y="261.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">often one key word: “unfair”, “cost”, “evidence”</text><circle cx="62" cy="241" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="249.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="296" width="762" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="126" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Check if it is unclear</text><text x="126" y="359.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ask your own question to elicit clarification: “Do you mean the cost to shops or</text><text x="126" y="381.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">to the council?”</text><circle cx="62" cy="350" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="358.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="416" width="762" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="450" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Watch the questioner</text><text x="126" y="479.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">so you can tell whether your answer has satisfied them</text><circle cx="62" cy="459" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="467.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="524" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="557.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Asking for clarification shows control, not weakness.</text><text x="450" y="586.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">It is exactly what the specification describes.</text>
</svg>