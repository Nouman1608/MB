<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three shapes for a good answer</text>

<text x="30" y="122" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Straightforward or extension question</text><rect x="30" y="136" width="187.5" height="92" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="123.75" y="187" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Direct answer</text><line x1="220.5" y1="182" x2="244.5" y2="182" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="247.5" y="136" width="187.5" height="92" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="341.25" y="176" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Reason or</text><text x="341.25" y="198" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">explanation</text><line x1="438" y1="182" x2="462" y2="182" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="465" y="136" width="187.5" height="92" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="558.75" y="187" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Example</text><line x1="655.5" y1="182" x2="679.5" y2="182" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="682.5" y="136" width="187.5" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="776.25" y="165" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Link back to the</text><text x="776.25" y="187" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">presentation’s</text><text x="776.25" y="209" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">point</text><text x="30" y="276" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Challenge</text><rect x="30" y="290" width="187.5" height="92" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="123.75" y="330" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Acknowledge the</text><text x="123.75" y="352" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">point fairly</text><line x1="220.5" y1="336" x2="244.5" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="247.5" y="290" width="187.5" height="92" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.25" y="330" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Concede what is</text><text x="341.25" y="352" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">true</text><line x1="438" y1="336" x2="462" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="465" y="290" width="187.5" height="92" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="558.75" y="319" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Respond with</text><text x="558.75" y="341" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">reasoning or</text><text x="558.75" y="363" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">evidence</text><line x1="655.5" y1="336" x2="679.5" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="682.5" y="290" width="187.5" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="776.25" y="330" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Restate your</text><text x="776.25" y="352" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">position</text><text x="30" y="430" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Feedback</text><rect x="30" y="444" width="260" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="484" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Thank the speaker</text><line x1="293" y1="479" x2="317" y2="479" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="444" width="260" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="473" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Show you understand the</text><text x="450" y="495" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">comment</text><line x1="583" y1="479" x2="607" y2="479" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="444" width="260" height="70" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="473" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Respond: explain, accept</text><text x="740" y="495" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">or offer an improvement</text><rect x="30" y="540" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="573.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">No one-word answers, no wandering speeches.</text><text x="450" y="602.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">A shape keeps every answer developed and to the point.</text>
</svg>