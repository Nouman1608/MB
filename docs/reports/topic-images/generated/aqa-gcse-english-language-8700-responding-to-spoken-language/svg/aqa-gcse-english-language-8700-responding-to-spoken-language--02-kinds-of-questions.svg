<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="900" height="598" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="598" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six kinds of question, six kinds of answer</text>

<rect x="30" y="100" width="170" height="70" fill="#1e2a44"/><text x="115" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Type</text><rect x="200" y="100" width="370" height="70" fill="#1e2a44"/><text x="385" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Example (after a talk on a car</text><text x="385" y="152.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">ban)</text><rect x="570" y="100" width="300" height="70" fill="#1e2a44"/><text x="720" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">What it needs</text><rect x="30" y="170" width="170" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="207.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Clarification</text><rect x="200" y="170" width="370" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="196.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“What did you mean by a ‘trial</text><text x="214" y="218.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">period’?”</text><rect x="570" y="170" width="300" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="584" y="207.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A clear, concise explanation</text><rect x="30" y="240" width="170" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="266.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Extension</text><rect x="200" y="240" width="370" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="266.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“How would deliveries work?”</text><rect x="570" y="240" width="300" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="584" y="266.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">New detail beyond the talk</text><rect x="30" y="288" width="170" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="325.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Challenge</text><rect x="200" y="288" width="370" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="314.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Isn’t this unfair on people who can’t</text><text x="214" y="336.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">walk far?”</text><rect x="570" y="288" width="300" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="584" y="314.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Acknowledgement, then a</text><text x="584" y="336.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reasoned reply</text><rect x="30" y="358" width="170" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="395.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hypothetical</text><rect x="200" y="358" width="370" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="384.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“What if shops lost money during the</text><text x="214" y="406.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">trial?”</text><rect x="570" y="358" width="300" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="584" y="395.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A considered “if… then” answer</text><rect x="30" y="428" width="170" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="465.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Personal</text><rect x="200" y="428" width="370" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="465.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Would you shop there more yourself?”</text><rect x="570" y="428" width="300" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="584" y="454.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An honest answer linked back to</text><text x="584" y="476.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the argument</text><rect x="30" y="498" width="170" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="535.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feedback</text><rect x="200" y="498" width="370" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="524.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Your second section was hard to</text><text x="214" y="546.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">follow.”</text><rect x="570" y="498" width="300" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="584" y="524.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Thanks, reflection and a</text><text x="584" y="546.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">constructive response</text><rect x="30" y="100" width="840" height="468" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>