<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading comprehension question types</text>

<rect x="30" y="110" width="266" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="163" y="156" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">What ...?</text><line x1="163" y1="172" x2="163" y2="204" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="163" y="236" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">located detail</text><text x="163" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">find it in the text</text><rect x="317" y="110" width="266" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="156" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Why ...?</text><line x1="450" y1="172" x2="450" y2="204" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="236" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">inference</text><text x="450" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">read between the lines</text><rect x="604" y="110" width="266" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="737" y="156" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Writer’s attitude?</text><line x1="737" y1="172" x2="737" y2="204" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="737" y="236" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">tone</text><text x="737" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">word choice, irony, emphasis</text><rect x="30" y="320" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="356" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M59,356 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="94" y="362" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Answer in your own words where required, not copied from the passage</text><circle cx="66" cy="396" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M59,396 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="94" y="402" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Match the length of the answer to the marks</text><circle cx="66" cy="436" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M59,436 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="94" y="442" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Meaning of a phrase in context: the clue is in the surrounding sentences</text>
