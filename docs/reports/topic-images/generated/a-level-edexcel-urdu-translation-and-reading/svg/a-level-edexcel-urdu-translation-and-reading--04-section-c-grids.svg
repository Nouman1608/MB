<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the research essay is marked</text>

<rect x="30" y="110" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Section C: writing in Urdu</text><text x="846" y="150" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="end">40 marks  ·  approx. 320–370 words</text><rect x="30" y="196" width="414" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="237" y="226" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4</text><text x="237" y="252" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">20 marks</text><rect x="450" y="196" width="204" height="70" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="552" y="226" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><text x="552" y="252" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">10 marks</text><rect x="660" y="196" width="210" height="70" rx="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="765" y="226" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><text x="765" y="252" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">10 marks</text><text x="54" y="300" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">AO4: knowledge and understanding of society and culture via your research (20)</text><text x="54" y="324" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">AO2: use of the unseen text (10)</text><text x="54" y="348" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">AO3: accuracy and range of language (10)</text><rect x="30" y="384" width="410" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="420" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Research rules</text><text x="52" y="452" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cover all three aspects of one</text><text x="52" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">research subject</text><text x="52" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one country or area only:</text><text x="52" y="518" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pakistan for Themes 1, 3 and 4;</text><text x="52" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pakistan or one Urdu-official</text><text x="52" y="562" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">area of India for Theme 2</text><rect x="460" y="384" width="410" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="420" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plan the structure</text><rect x="482" y="440" width="366" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="665" y="467" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Introduction</text><rect x="482" y="492" width="366" height="42" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="665" y="519" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">3–4 paragraphs, one idea each</text><rect x="482" y="544" width="366" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="665" y="571" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Conclusion</text>
</svg>