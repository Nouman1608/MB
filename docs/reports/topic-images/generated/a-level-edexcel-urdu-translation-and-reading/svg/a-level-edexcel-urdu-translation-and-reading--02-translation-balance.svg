<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Translating into natural English</text>

<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Urdu sentence whose literal English is "On him anger came"</text><rect x="30" y="150" width="266" height="170" rx="14" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="163" y="190" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Literal</text><text x="163" y="236" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"On him anger came"</text><text x="163" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">unnatural English</text><rect x="317" y="150" width="266" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="450" y="190" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Balanced</text><text x="450" y="236" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"He became angry"</text><text x="450" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">accurate and natural</text><rect x="604" y="150" width="266" height="170" rx="14" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="737" y="190" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Too free</text><text x="737" y="236" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"He lost his temper"</text><text x="737" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">idiomatic but loses register</text><line x1="60" y1="352" x2="840" y2="352" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="60" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">faithful to the words</text><text x="840" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">free with the meaning</text><rect x="30" y="400" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="436" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Check every sentence</text><circle cx="70" cy="470" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M63,470 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="98" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Is every element present? Omission costs more than awkwardness.</text><circle cx="70" cy="504" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M63,504 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="98" y="510" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Does it read as English a native speaker would write?</text><circle cx="70" cy="538" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M63,538 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="98" y="544" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Is the register (formal or informal) preserved from the source?</text>
</svg>