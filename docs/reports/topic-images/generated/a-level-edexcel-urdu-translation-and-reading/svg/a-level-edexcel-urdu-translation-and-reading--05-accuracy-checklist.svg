<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five accuracy checks</text>

<rect x="30" y="110" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="145" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="151.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="152" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gender agreement</text><text x="320" y="152" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">across noun, adjective and verb</text><rect x="30" y="192" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="227" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="233.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="234" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Tense and person</text><text x="320" y="234" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">consistent throughout</text><rect x="30" y="274" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="309" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="315.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Postpositions</text><text x="320" y="316" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">especially the ergative with transitive perfective verbs</text><rect x="30" y="356" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="391" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="397.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="398" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Izafat</text><text x="320" y="398" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in formal register</text><rect x="30" y="438" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="473" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="479.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="480" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Script</text><text x="320" y="480" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a misplaced dot changes the word</text><rect x="30" y="528" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="570" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Range matters, but an ambitious word used wrongly scores below a simple word used correctly</text>
</svg>