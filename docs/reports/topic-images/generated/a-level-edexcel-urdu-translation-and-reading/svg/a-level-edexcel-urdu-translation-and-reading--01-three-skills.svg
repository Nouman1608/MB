<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 1: three skills in one paper</text>

<rect x="250" y="108" width="400" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="146" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1 (9UR0/01)</text><path d="M450,168 V190 H163 V208" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="214" width="266" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="250" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Translation</text><text x="50" y="276" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">into English</text><text x="50" y="312" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">translate a passage from</text><text x="50" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Urdu into accurate,</text><text x="50" y="356" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fluent English</text><text x="50" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">rewards precision and</text><text x="50" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">register</text><path d="M450,168 V190 H450 V208" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="317" y="214" width="266" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="337" y="250" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Reading</text><text x="337" y="276" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">comprehension in Urdu</text><text x="337" y="312" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">answer questions in Urdu</text><text x="337" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on an Urdu source text</text><text x="337" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">rewards close, detailed</text><text x="337" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">understanding</text><path d="M450,168 V190 H737 V208" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="604" y="214" width="266" height="250" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="624" y="250" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Writing</text><text x="624" y="276" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">research question</text><text x="624" y="312" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">extended response in Urdu</text><text x="624" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from independent research</text><text x="624" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">rewards depth of knowledge</text><text x="624" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">and argument</text><rect x="30" y="484" width="840" height="92" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="520" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Commonest strategic error: treating it as one "language paper"</text><text x="54" y="550" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">translation demands fidelity to a source; free writing demands independent expression</text><text x="450" y="612" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Revise them as separate strands; prepare the research well before the exam</text>
</svg>