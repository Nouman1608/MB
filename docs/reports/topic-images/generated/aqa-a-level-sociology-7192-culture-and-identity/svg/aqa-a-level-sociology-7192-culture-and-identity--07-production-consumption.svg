<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="482" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From production to consumption</text>

<rect x="30" y="104" width="246.66666666666666" height="154" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="136.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Identity from</text><text x="153.33333333333331" y="160.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">production</text><text x="153.33333333333331" y="190.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">tied to work and</text><text x="153.33333333333331" y="212.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">community; Coal is Our</text><text x="153.33333333333331" y="234.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Life (1956)</text><line x1="280.66666666666663" y1="181" x2="322.66666666666663" y2="181" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="104" width="246.66666666666666" height="154" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="170.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">De-industrialisation</text><text x="449.99999999999994" y="200.3" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">weakened such identities</text><line x1="577.3333333333333" y1="181" x2="619.3333333333333" y2="181" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="104" width="246.66666666666666" height="154" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="136.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Identity from</text><text x="746.6666666666666" y="160.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">consumption</text><text x="746.6666666666666" y="190.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">chosen through brands,</text><text x="746.6666666666666" y="212.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">styles and leisure</text><text x="746.6666666666666" y="234.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">(postmodernists)</text><rect x="30" y="280" width="412" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,330 L31.25,294.25 Q31.25,281.25 44.25,281.25 L427.75,281.25 Q440.75,281.25 440.75,294.25 L440.75,330 Z" fill="#dce9e7"/><line x1="31.25" y1="330" x2="440.75" y2="330" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="310.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Supporting ideas</text><circle cx="49" cy="355.92" r="4.5" fill="#2e6b62"/><text x="62" y="361.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Veblen (1899):</tspan> conspicuous consumption</text><text x="62" y="382.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">displays status</text><circle cx="49" cy="405.92" r="4.5" fill="#2e6b62"/><text x="62" y="411.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Pakulski and Waters:</tspan> consumption replaces</text><text x="62" y="432.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">production as the basis of identity</text><rect x="458" y="280" width="412" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,330 L459.25,294.25 Q459.25,281.25 472.25,281.25 L855.75,281.25 Q868.75,281.25 868.75,294.25 L868.75,330 Z" fill="#f2e7b8"/><line x1="459.25" y1="330" x2="868.75" y2="330" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="310.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Limits</text><circle cx="477" cy="355.92" r="4.5" fill="#2e6b62"/><text x="490" y="361.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bauman (1998):</tspan> "flawed consumers" who</text><text x="490" y="382.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cannot afford to take part are excluded</text><circle cx="477" cy="405.92" r="4.5" fill="#2e6b62"/><text x="490" y="411.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Choice is shaped by advertising and income</text>
</svg>