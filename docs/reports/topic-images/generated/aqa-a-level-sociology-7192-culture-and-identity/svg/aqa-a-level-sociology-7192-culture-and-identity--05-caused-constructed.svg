<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 579" width="900" height="579" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="579" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Identity: caused or constructed?</text>

<rect x="30" y="104" width="404" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Socially caused</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">structural view: functionalists, Marxists</text><circle cx="53" cy="215.79" r="4.5" fill="#2e6b62"/><text x="66" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Identity is shaped by social structures</text><text x="66" y="243.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">such as class, the economy and the</text><text x="66" y="265.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">family</text><circle cx="53" cy="289.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="295.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Strength:</tspan> explains patterns, such as</text><text x="66" y="317.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">class still predicting life chances</text><circle cx="53" cy="341.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="347.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Limit:</tspan> can make people seem passive</text><rect x="466" y="104" width="404" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Socially constructed</text><text x="484" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">action view: interactionists,</text><text x="484" y="211.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">postmodernists</text><circle cx="489" cy="236.79" r="4.5" fill="#8a6d0d"/><text x="502" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Goffman:</tspan> front stage and backstage;</text><text x="502" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">managing a "spoiled identity"</text><circle cx="489" cy="288.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Giddens:</tspan> identity as a reflexive</text><text x="502" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">project</text><circle cx="489" cy="340.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="346.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hall:</tspan> "becoming" as well as "being"</text><circle cx="489" cy="370.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="376.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Limit:</tspan> can ignore money, discrimination</text><text x="502" y="398.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and power</text><circle cx="450" cy="264" r="24" fill="#1e2a44"/><text x="450" y="271" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="442" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="478" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Combining both</text><text x="56" y="507" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Jenkins: identity has an internal side (how we see ourselves) and an external side (how</text><text x="56" y="529" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">others label us), and each shapes the other.</text>
</svg>