<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three outcomes for national identity</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Hall (1992)</text>
<rect x="200" y="120" width="500" height="60" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="158" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalisation</text><line x1="310" y1="184" x2="164.66666666666666" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="184" x2="450" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="590" y1="184" x2="735.3333333333333" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="242" width="269.3333333333333" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,292 L31.25,256.25 Q31.25,243.25 44.25,243.25 L285.0833333333333,243.25 Q298.0833333333333,243.25 298.0833333333333,256.25 L298.0833333333333,292 Z" fill="#f2e7b8"/><line x1="31.25" y1="292" x2="298.0833333333333" y2="292" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="272.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Erosion</text><text x="44" y="324.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Through cultural</text><text x="44" y="346.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">homogenisation, e.g.</text><text x="44" y="368.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ritzer’s McDonaldisation</text><text x="44" y="390.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(1993).</text><rect x="315.3333333333333" y="242" width="269.3333333333333" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,292 L316.5833333333333,256.25 Q316.5833333333333,243.25 329.5833333333333,243.25 L570.4166666666666,243.25 Q583.4166666666666,243.25 583.4166666666666,256.25 L583.4166666666666,292 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="292" x2="583.4166666666666" y2="292" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="272.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Strengthening</text><text x="329.3333333333333" y="324.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">National identity is</text><text x="329.3333333333333" y="346.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reasserted as a form of</text><text x="329.3333333333333" y="368.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">resistance.</text><rect x="600.6666666666666" y="242" width="269.3333333333333" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,292 L601.9166666666666,256.25 Q601.9166666666666,243.25 614.9166666666666,243.25 L855.75,243.25 Q868.75,243.25 868.75,256.25 L868.75,292 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="292" x2="868.75" y2="292" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="272.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">New hybrid identities</text><text x="614.6666666666666" y="324.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Global media and migration</text><text x="614.6666666666666" y="346.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">can also create diasporic</text><text x="614.6666666666666" y="368.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">identities across borders.</text><rect x="30" y="432" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="468" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Glocalisation</text><text x="56" y="497" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Global products adapted to local tastes.</text>
</svg>