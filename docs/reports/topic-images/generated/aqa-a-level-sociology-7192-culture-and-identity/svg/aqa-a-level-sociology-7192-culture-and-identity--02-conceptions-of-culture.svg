<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" width="900" height="662" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven conceptions of culture</text>

<rect x="30" y="104" width="158" height="168" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="109" y="170" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Judged by</text><text x="109" y="192" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">artistic</text><text x="109" y="214" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">value</text><rect x="200" y="104" width="329" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M201.25,154 L201.25,118.25 Q201.25,105.25 214.25,105.25 L514.75,105.25 Q527.75,105.25 527.75,118.25 L527.75,154 Z" fill="#b5d3cf"/><line x1="201.25" y1="154" x2="527.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="364.5" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">High culture</text><text x="214" y="185.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Works seen as having lasting</text><text x="214" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">artistic value; Arnold’s "the best</text><text x="214" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">which has been thought and said";</text><text x="214" y="248.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">linked to elites.</text><rect x="541" y="104" width="329" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M542.25,154 L542.25,118.25 Q542.25,105.25 555.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="542.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="705.5" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Low culture</text><text x="555" y="185.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Entertainment seen as having less</text><text x="555" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">artistic worth. The label itself is</text><text x="555" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a value judgement.</text><rect x="30" y="286" width="158" height="189" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="109" y="373.5" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Who makes it,</text><text x="109" y="395.5" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">and for whom</text><rect x="200" y="286" width="215.33333333333334" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M201.25,336 L201.25,300.25 Q201.25,287.25 214.25,287.25 L401.08333333333337,287.25 Q414.08333333333337,287.25 414.08333333333337,300.25 L414.08333333333337,336 Z" fill="#f2e7b8"/><line x1="201.25" y1="336" x2="414.08333333333337" y2="336" stroke="#c9d6d4" stroke-width="2"/><text x="307.6666666666667" y="316.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Folk culture</text><text x="214" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Made by ordinary</text><text x="214" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people in</text><text x="214" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pre-industrial</text><text x="214" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">communities; passed on</text><text x="214" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by word of mouth.</text><rect x="427.33333333333337" y="286" width="215.33333333333334" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M428.58333333333337,336 L428.58333333333337,300.25 Q428.58333333333337,287.25 441.58333333333337,287.25 L628.4166666666667,287.25 Q641.4166666666667,287.25 641.4166666666667,300.25 L641.4166666666667,336 Z" fill="#f2e7b8"/><line x1="428.58333333333337" y1="336" x2="641.4166666666667" y2="336" stroke="#c9d6d4" stroke-width="2"/><text x="535" y="316.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mass culture</text><text x="441.33333333333337" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Standardised,</text><text x="441.33333333333337" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">commercial, for large</text><text x="441.33333333333337" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">audiences in</text><text x="441.33333333333337" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">industrial societies.</text><rect x="654.6666666666667" y="286" width="215.33333333333334" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M655.9166666666667,336 L655.9166666666667,300.25 Q655.9166666666667,287.25 668.9166666666667,287.25 L855.7500000000001,287.25 Q868.7500000000001,287.25 868.7500000000001,300.25 L868.7500000000001,336 Z" fill="#f2e7b8"/><line x1="655.9166666666667" y1="336" x2="868.7500000000001" y2="336" stroke="#c9d6d4" stroke-width="2"/><text x="762.3333333333334" y="316.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Popular culture</text><text x="668.6666666666667" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What most people</text><text x="668.6666666666667" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enjoy; need not imply</text><text x="668.6666666666667" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passive audiences.</text><rect x="30" y="489" width="158" height="147" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="109" y="555.5" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Group and</text><text x="109" y="577.5" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">scale</text><rect x="200" y="489" width="329" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M201.25,539 L201.25,503.25 Q201.25,490.25 214.25,490.25 L514.75,490.25 Q527.75,490.25 527.75,503.25 L527.75,539 Z" fill="#dce9e7"/><line x1="201.25" y1="539" x2="527.75" y2="539" stroke="#c9d6d4" stroke-width="2"/><text x="364.5" y="519.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Subculture</text><text x="214" y="570.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A group sharing some norms and</text><text x="214" y="591.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">values that differ from the wider</text><text x="214" y="612.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">culture, such as a youth style.</text><rect x="541" y="489" width="329" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M542.25,539 L542.25,503.25 Q542.25,490.25 555.25,490.25 L855.75,490.25 Q868.75,490.25 868.75,503.25 L868.75,539 Z" fill="#dce9e7"/><line x1="542.25" y1="539" x2="868.75" y2="539" stroke="#c9d6d4" stroke-width="2"/><text x="705.5" y="519.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Global culture</text><text x="555" y="570.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Products, brands, images and styles</text><text x="555" y="591.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">circulating across many societies.</text>
</svg>