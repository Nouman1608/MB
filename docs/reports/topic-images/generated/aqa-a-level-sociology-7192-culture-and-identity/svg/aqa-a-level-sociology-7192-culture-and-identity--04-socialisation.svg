<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 719" width="900" height="719" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="719" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Socialisation: four perspectives</text>

<rect x="30" y="104" width="390" height="108" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="147.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary socialisation</text><text x="225" y="177.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">early childhood, mainly in the family</text><line x1="424" y1="158" x2="476" y2="158" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="104" width="390" height="108" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="136.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary socialisation</text><text x="675" y="166.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">education, peer groups, the media,</text><text x="675" y="188.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">religion, the workplace</text><text x="450" y="240" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">a lifelong process; agencies use rewards and sanctions to encourage conformity</text><rect x="30" y="258" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,308 L31.25,272.25 Q31.25,259.25 44.25,259.25 L427.75,259.25 Q440.75,259.25 440.75,272.25 L440.75,308 Z" fill="#b5d3cf"/><line x1="31.25" y1="308" x2="440.75" y2="308" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="288.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist</text><text x="44" y="339.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Passes on a value consensus. <tspan font-weight="700">Parsons:</tspan> the</text><text x="44" y="360.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">family is the main agency of primary</text><text x="44" y="381.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">socialisation.</text><rect x="458" y="258" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,308 L459.25,272.25 Q459.25,259.25 472.25,259.25 L855.75,259.25 Q868.75,259.25 868.75,272.25 L868.75,308 Z" fill="#b5d3cf"/><line x1="459.25" y1="308" x2="868.75" y2="308" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="288.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><text x="472" y="339.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Agencies, especially education and the media,</text><text x="472" y="360.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pass on ruling-class ideology.</text><rect x="30" y="419" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,469 L31.25,433.25 Q31.25,420.25 44.25,420.25 L427.75,420.25 Q440.75,420.25 440.75,433.25 L440.75,469 Z" fill="#f2e7b8"/><line x1="31.25" y1="469" x2="440.75" y2="469" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="449.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><text x="44" y="500.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Oakley:</tspan> manipulation and canalisation.</text><text x="44" y="521.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Sharpe:</tspan> girls’ priorities shifted from love</text><text x="44" y="542.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and marriage (1970s) to careers (1990s).</text><rect x="458" y="419" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,469 L459.25,433.25 Q459.25,420.25 472.25,420.25 L855.75,420.25 Q868.75,420.25 868.75,433.25 L868.75,469 Z" fill="#f2e7b8"/><line x1="459.25" y1="469" x2="868.75" y2="469" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="449.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactionist</text><text x="472" y="500.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Socialisation is active. <tspan font-weight="700">Mead:</tspan> play, then</text><text x="472" y="521.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">games, then the "generalised other". <tspan font-weight="700">Cooley:</tspan></text><text x="472" y="542.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the looking-glass self.</text><rect x="30" y="582" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="618" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="56" y="647" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Wrong (1961) criticised the "oversocialised" view of people. Postmodernists say media</text><text x="56" y="669" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and peers now compete with the family.</text>
</svg>