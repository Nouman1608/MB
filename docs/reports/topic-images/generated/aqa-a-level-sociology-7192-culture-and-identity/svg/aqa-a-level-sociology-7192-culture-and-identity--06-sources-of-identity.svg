<rect width="900" height="757" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven sources of identity</text>

<rect x="30" y="104" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Age</text><text x="46" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Age stages carry different meanings in</text><text x="46" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different societies. <tspan font-weight="700">Featherstone and</tspan></text><text x="46" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hepworth:</tspan> the "mask of ageing".</text><rect x="458" y="104" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Disability</text><text x="474" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Medical model vs social model (<tspan font-weight="700">Oliver, 1990</tspan>):</text><text x="474" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disabled by social barriers. <tspan font-weight="700">Shakespeare</tspan></text><text x="474" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">(2006):</tspan> impairment still matters.</text><rect x="30" y="269" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,319 L31.25,283.25 Q31.25,270.25 44.25,270.25 L427.75,270.25 Q440.75,270.25 440.75,283.25 L440.75,319 Z" fill="#f2e7b8"/><line x1="31.25" y1="319" x2="440.75" y2="319" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="299.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnicity</text><text x="46" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Modood (1997):</tspan> diversity between groups.</text><text x="46" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Gilroy:</tspan> the "Black Atlantic". <tspan font-weight="700">Back (1996):</tspan></text><text x="46" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hybrid identities.</text><rect x="458" y="269" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,319 L459.25,283.25 Q459.25,270.25 472.25,270.25 L855.75,270.25 Q868.75,270.25 868.75,283.25 L868.75,319 Z" fill="#f2e7b8"/><line x1="459.25" y1="319" x2="868.75" y2="319" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="299.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><text x="474" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Connell:</tspan> hegemonic masculinity. <tspan font-weight="700">Mac an</tspan></text><text x="474" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ghaill:</tspan> crisis of masculinity. <tspan font-weight="700">Butler:</tspan> gender</text><text x="474" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is performative.</text><rect x="30" y="434" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,484 L31.25,448.25 Q31.25,435.25 44.25,435.25 L427.75,435.25 Q440.75,435.25 440.75,448.25 L440.75,484 Z" fill="#dce9e7"/><line x1="31.25" y1="484" x2="440.75" y2="484" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="464.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Nationality</text><text x="46" y="517.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Anderson:</tspan> nations as "imagined communities".</text><text x="46" y="538.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Billig:</tspan> banal nationalism.</text><rect x="458" y="434" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,484 L459.25,448.25 Q459.25,435.25 472.25,435.25 L855.75,435.25 Q868.75,435.25 868.75,448.25 L868.75,484 Z" fill="#dce9e7"/><line x1="459.25" y1="484" x2="868.75" y2="484" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="464.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sexuality</text><text x="474" y="517.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Weeks:</tspan> sexual identities are historically</text><text x="474" y="538.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">specific. <tspan font-weight="700">Foucault</tspan>; heteronormativity.</text><rect x="30" y="578" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,628 L31.25,592.25 Q31.25,579.25 44.25,579.25 L427.75,579.25 Q440.75,579.25 440.75,592.25 L440.75,628 Z" fill="#ffffff"/><line x1="31.25" y1="628" x2="440.75" y2="628" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="608.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social class</text><text x="46" y="661.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bourdieu:</tspan> tastes mark class. <tspan font-weight="700">Skeggs:</tspan></text><text x="46" y="682.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">respectability. <tspan font-weight="700">Pakulski and Waters:</tspan> class</text><text x="46" y="703.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identity has faded.</text><rect x="458" y="578" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,628 L459.25,592.25 Q459.25,579.25 472.25,579.25 L855.75,579.25 Q868.75,579.25 868.75,592.25 L868.75,628 Z" fill="#d4b02e"/><line x1="459.25" y1="628" x2="868.75" y2="628" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="608.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Exam tip</text><text x="474" y="661.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Answer on the source of identity the question</text><text x="474" y="682.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">names, and test postmodern claims of free</text><text x="474" y="703.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">choice against class, income or disability.</text>
</svg>