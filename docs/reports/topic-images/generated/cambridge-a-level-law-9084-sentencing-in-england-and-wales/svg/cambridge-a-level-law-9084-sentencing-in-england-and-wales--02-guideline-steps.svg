<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 863" width="900" height="863" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="863" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a sentencing guideline works</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Sentencing Council guidelines, followed unless contrary to the interests of justice</text>
<line x1="60" y1="144" x2="60" y2="619" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Seriousness: culpability and harm</text><text x="122" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Planning, a weapon, a leading role; harm caused, intended or foreseeable. Gives a category,</text><text x="122" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">starting point and range.</text><circle cx="60" cy="177" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="185.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="242" width="766" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="275.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Aggravating factors</text><text x="122" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Previous convictions, offending on bail, hostility based on a protected characteristic, targeting a</text><text x="122" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">vulnerable victim.</text><circle cx="60" cy="295" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="303.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="360" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="393.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Mitigating factors</text><text x="122" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No previous convictions, genuine remorse, youth or lack of maturity, a minor role, mental illness.</text><circle cx="60" cy="402.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="411.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="457" width="766" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="490.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reduction for a guilty plea</text><text x="122" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">See the scale below.</text><circle cx="60" cy="499.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="508.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="554" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="587.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Totality, ancillary orders and reasons</text><text x="122" y="616.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Just overall; compensation or disqualification; the court explains its sentence.</text><circle cx="60" cy="596.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="605.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="30" y="677" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">MAXIMUM PLEA REDUCTION, to scale</text><text x="230" y="719" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">First opportunity</text><rect x="245" y="697" width="500" height="32" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="755" y="720" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">up to one-third</text><text x="230" y="765" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">After that</text><rect x="245" y="743" width="375" height="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="630" y="766" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">one-quarter</text><text x="230" y="811" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">First day of trial</text><rect x="245" y="789" width="150" height="32" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="405" y="812" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">towards one-tenth</text>
</svg>