<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Aims of sentencing: adults and young offenders</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="388" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="222.35294117647058" height="48" fill="#b5d3cf"/><text x="44" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Aim (adults, 18+)</text><rect x="252.35294117647058" y="100" width="308.8235294117647" height="48" fill="#b5d3cf"/><text x="266.3529411764706" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Meaning</text><rect x="561.1764705882352" y="100" width="308.8235294117647" height="48" fill="#b5d3cf"/><text x="575.1764705882352" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sentences that serve it</text><rect x="30" y="148" width="222.35294117647058" height="68" fill="#dce9e7"/><text x="44" y="174.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Punishment (retribution)</text><rect x="252.35294117647058" y="148" width="308.8235294117647" height="68" fill="#ffffff"/><text x="266.3529411764706" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Just deserts proportionate to</text><text x="266.3529411764706" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">seriousness</text><rect x="561.1764705882352" y="148" width="308.8235294117647" height="68" fill="#ffffff"/><text x="575.1764705882352" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Custody; guideline categories;</text><text x="575.1764705882352" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unpaid work</text><line x1="30" y1="216" x2="870" y2="216" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="216" width="222.35294117647058" height="68" fill="#dce9e7"/><text x="44" y="242.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Reduction of crime, incl.</text><text x="44" y="263.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">deterrence</text><rect x="252.35294117647058" y="216" width="308.8235294117647" height="68" fill="#f8faf9"/><text x="266.3529411764706" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Individual: this offender; general:</text><text x="266.3529411764706" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">warns others (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Blackshaw</tspan>, 2011)</text><rect x="561.1764705882352" y="216" width="308.8235294117647" height="68" fill="#f8faf9"/><text x="575.1764705882352" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Suspended sentences; exemplary</text><text x="575.1764705882352" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">custodial terms</text><line x1="30" y1="284" x2="870" y2="284" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="284" width="222.35294117647058" height="68" fill="#dce9e7"/><text x="44" y="310.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Reform and</text><text x="44" y="331.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">rehabilitation</text><rect x="252.35294117647058" y="284" width="308.8235294117647" height="68" fill="#ffffff"/><text x="266.3529411764706" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Changing behaviour so the offender</text><text x="266.3529411764706" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stops offending</text><rect x="561.1764705882352" y="284" width="308.8235294117647" height="68" fill="#ffffff"/><text x="575.1764705882352" y="310.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Drug, alcohol and mental health</text><text x="575.1764705882352" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">requirements</text><line x1="30" y1="352" x2="870" y2="352" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="352" width="222.35294117647058" height="68" fill="#dce9e7"/><text x="44" y="378.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Protection of the public</text><rect x="252.35294117647058" y="352" width="308.8235294117647" height="68" fill="#f8faf9"/><text x="266.3529411764706" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Preventing the offender causing</text><text x="266.3529411764706" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">harm</text><rect x="561.1764705882352" y="352" width="308.8235294117647" height="68" fill="#f8faf9"/><text x="575.1764705882352" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Life and extended sentences;</text><text x="575.1764705882352" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">curfews; disqualification</text><line x1="30" y1="420" x2="870" y2="420" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="420" width="222.35294117647058" height="68" fill="#dce9e7"/><text x="44" y="446.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Reparation</text><rect x="252.35294117647058" y="420" width="308.8235294117647" height="68" fill="#ffffff"/><text x="266.3529411764706" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Making amends to victim or</text><text x="266.3529411764706" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">community</text><rect x="561.1764705882352" y="420" width="308.8235294117647" height="68" fill="#ffffff"/><text x="575.1764705882352" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Compensation orders; unpaid work;</text><text x="575.1764705882352" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">restorative justice</text></g><line x1="252.35294117647058" y1="100" x2="252.35294117647058" y2="488" stroke="#c9d6d4" stroke-width="1.5"/><line x1="561.1764705882352" y1="100" x2="561.1764705882352" y2="488" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="388" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="510" width="840" height="128" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="540" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">YOUNG OFFENDERS</text><text x="48" y="566.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Principal aim: to prevent offending (s37 Crime and Disorder Act 1998)</text><text x="48" y="594.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">With regard to the child’s welfare (Children and Young Persons Act 1933): rehabilitation and reparation</text><text x="48" y="615.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weigh more than punishment; avoid unnecessary criminalisation.</text><rect x="30" y="660" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="693.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> listing sentences without linking them to an aim.</text>
</svg>