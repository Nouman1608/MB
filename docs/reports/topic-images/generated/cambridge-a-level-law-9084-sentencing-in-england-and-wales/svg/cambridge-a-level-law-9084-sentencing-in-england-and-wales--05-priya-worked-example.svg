<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="604" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: sentencing Priya</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Theft of £400 from her employer; guilty plea at first appearance</text>
<rect x="30" y="124" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">AGGRAVATING</text><text x="46" y="183.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Abuse of a position of trust</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MITIGATING</text><text x="330.6666666666667" y="183.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No previous convictions</text><text x="330.6666666666667" y="208.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Remorse</text><text x="330.6666666666667" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repaid the money</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PLEA</text><text x="615.3333333333334" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First opportunity: up to</text><text x="615.3333333333334" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one-third reduction</text><rect x="30" y="276" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="304" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SERIOUSNESS</text><text x="46" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Breach of trust raises culpability; harm relatively low and repaired</text><line x1="450" y1="364" x2="450" y2="384" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="390" width="270.6666666666667" height="102" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="165.33333333333334" y="420.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Community order with</text><text x="165.33333333333334" y="443.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">unpaid work</text><text x="165.33333333333334" y="471.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Punishment and reparation</text><rect x="314.6666666666667" y="390" width="270.6666666666667" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="431.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Or a fine</text><text x="450" y="460.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Rather than custody</text><rect x="599.3333333333334" y="390" width="270.6666666666667" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="420.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conditional discharge</text><text x="734.6666666666667" y="443.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">possible</text><text x="734.6666666666667" y="471.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">If little need for punishment</text><rect x="30" y="514" width="840" height="58" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="547.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">No custody supports <tspan font-weight="700" fill="#1e2a44">rehabilitation</tspan>: she keeps her family life and can find new work.</text>
</svg>