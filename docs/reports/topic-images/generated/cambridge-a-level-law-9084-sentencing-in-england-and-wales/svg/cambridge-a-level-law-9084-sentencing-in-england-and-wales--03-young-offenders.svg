<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sentencing young offenders (10–17)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Usually in the youth court; custody is a last resort</text>
<rect x="30" y="124" width="413" height="145" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMUNITY</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Referral order</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most first-time offenders who plead guilty;</text><text x="46" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contract with a youth offender panel for three to</text><text x="46" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">twelve months; spent once completed</text><rect x="457" y="124" width="413" height="145" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMUNITY</text><text x="473" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Youth rehabilitation order</text><text x="473" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">CJIA 2008; up to three years; supervision,</text><text x="473" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">activity, curfew, exclusion, unpaid work (16–17),</text><text x="473" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intensive supervision and surveillance</text><rect x="30" y="291" width="270.6666666666667" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="319" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CUSTODY</text><text x="46" y="345.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Detention and training</text><text x="46" y="368.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">order</text><text x="46" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ages 12–17; four months to two</text><text x="46" y="417.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">years, half in custody;</text><text x="46" y="438.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">under-15s only if persistent</text><rect x="314.6666666666667" y="291" width="270.6666666666667" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="319" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CUSTODY</text><text x="330.6666666666667" y="345.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Long-term detention</text><text x="330.6666666666667" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Grave crimes” carrying at</text><text x="330.6666666666667" y="394.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">least fourteen years for an</text><text x="330.6666666666667" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adult</text><rect x="599.3333333333334" y="291" width="270.6666666666667" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="319" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CUSTODY</text><text x="615.3333333333334" y="345.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">At His Majesty’s pleasure</text><text x="615.3333333333334" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mandatory for murder</text><text x="615.3333333333334" y="394.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">committed under 18, with a</text><text x="615.3333333333334" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">minimum term</text><rect x="30" y="481" width="840" height="159" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="511" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARENTAL RESPONSIBILITY</text><text x="48" y="542.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="542.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Attendance:</tspan> parents of under-16s must normally attend court</text><text x="48" y="567.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="567.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Fines,</tspan> <tspan font-weight="700" fill="#1e2a44">costs,</tspan> <tspan font-weight="700" fill="#1e2a44">compensation:</tspan> parent must normally pay for under-16s; may for 16–17</text><text x="48" y="592.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="592.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Parenting</tspan> <tspan font-weight="700" fill="#1e2a44">order</tspan> (Crime and Disorder Act 1998): counselling or guidance; e.g. ensure school attendance</text><text x="48" y="617.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="617.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Binding</tspan> <tspan font-weight="700" fill="#1e2a44">over</tspan> to take proper care and control</text>
</svg>