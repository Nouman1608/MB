<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 671" width="900" height="671" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="671" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Adult sentences, from least to most severe</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Sentencing Act 2020 (the Sentencing Code)</text>
<rect x="30" y="124" width="840" height="101" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">DISCHARGES</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Absolute: no penalty, barely blameworthy. Conditional: no penalty unless a further offence within up to</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">three years</text><rect x="70" y="235" width="800" height="101" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="86" y="263" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">FINES</text><text x="86" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The most common sentence. Reflect seriousness and means; standard scale levels 1 to 5, top level</text><text x="86" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unlimited since 2015. A compensation order takes priority if both cannot be afforded</text><rect x="110" y="376" width="760" height="101" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="126" y="404" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">COMMUNITY ORDER</text><text x="126" y="435.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Up to three years with one or more requirements, normally at least one for punishment (or</text><text x="126" y="456.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">combined with a fine)</text><rect x="150" y="517" width="720" height="122" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="166" y="545" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">CUSTODY</text><text x="166" y="576.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Suspended sentence order (up to two years, suspended six months to two years);</text><text x="166" y="597.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">determinate; life (mandatory for murder); extended; minimum sentences for some repeat</text><text x="166" y="618.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offences</text><line x1="30" y1="356" x2="870" y2="356" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="202.344" y="341" width="495.312" height="30" rx="15" fill="#f4f6f6" stroke="#b5602e" stroke-width="2"/><text x="450" y="362" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">threshold: serious enough to warrant a community sentence</text><line x1="30" y1="497" x2="870" y2="497" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="136.736" y="482" width="626.528" height="30" rx="15" fill="#f4f6f6" stroke="#b5602e" stroke-width="2"/><text x="450" y="503" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">threshold: so serious that neither a fine nor a community sentence is justified</text>
</svg>