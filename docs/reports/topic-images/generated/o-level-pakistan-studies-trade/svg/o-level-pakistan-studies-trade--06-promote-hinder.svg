<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 629" width="900" height="629" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="629" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What helps and what holds back trade</text>

<rect x="30" y="110" width="410" height="359" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="152" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">Promotes trade</text><circle cx="60" cy="184.39" r="5" fill="#2e6b62"/><text x="76" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Trade agreements: EU GSP+ (from 2014),</text><text x="76" y="212.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">China–Pakistan FTA (from 2007), SAFTA,</text><text x="76" y="234.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ECO</text><circle cx="60" cy="262.69" r="5" fill="#2e6b62"/><text x="76" y="268.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Location: Karachi, Port Qasim and Gwadar</text><text x="76" y="290.40000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">close to Gulf markets; land routes to</text><text x="76" y="312.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">China and Afghanistan</text><circle cx="60" cy="340.99" r="5" fill="#2e6b62"/><text x="76" y="346.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A weaker rupee makes exports cheaper</text><text x="76" y="368.70000000000005" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">abroad</text><rect x="460" y="110" width="410" height="359" rx="14" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5"/><text x="484" y="152" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">Hinders trade</text><circle cx="490" cy="184.39" r="5" fill="#b5602e"/><text x="506" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Narrow export base: textiles and rice</text><circle cx="490" cy="214.48999999999998" r="5" fill="#b5602e"/><text x="506" y="220.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Competition from Bangladesh, Vietnam,</text><text x="506" y="242.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">India, China</text><circle cx="490" cy="266.69" r="5" fill="#b5602e"/><text x="506" y="272.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tariffs, quotas and strict standards in</text><text x="506" y="294.40000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rich markets</text><circle cx="490" cy="318.89" r="5" fill="#b5602e"/><text x="506" y="324.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">High costs: power, gas, slow port</text><text x="506" y="346.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">clearance</text><circle cx="490" cy="371.09" r="5" fill="#b5602e"/><text x="506" y="376.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Exchange-rate swings (about Rs 160 to Rs</text><text x="506" y="398.8" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">280 per US$, 2021–24)</text><circle cx="490" cy="423.28999999999996" r="5" fill="#b5602e"/><text x="506" y="428.9" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Political tension, especially with India</text><rect x="30" y="489" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="525" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why the share stays under one per cent</text><text x="54" y="555" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pakistan sells low-to-medium value goods at world prices and buys high-value fuel and</text><text x="54" y="577" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">machinery; small firms lack capital, technology and branding.</text>
</svg>