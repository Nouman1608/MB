<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What Pakistan sells and buys</text>

<text x="60" y="132" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">US$ billion, fiscal year 2023–24 (Pakistan Bureau of Statistics, rounded)</text><line x1="60" y1="148" x2="60" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><text x="60" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><line x1="186.66666666666666" y1="148" x2="186.66666666666666" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><text x="186.66666666666666" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10</text><line x1="313.3333333333333" y1="148" x2="313.3333333333333" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><text x="313.3333333333333" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">20</text><line x1="440" y1="148" x2="440" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><text x="440" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">30</text><line x1="566.6666666666666" y1="148" x2="566.6666666666666" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><text x="566.6666666666666" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">40</text><line x1="693.3333333333333" y1="148" x2="693.3333333333333" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><text x="693.3333333333333" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">50</text><line x1="820" y1="148" x2="820" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><text x="820" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">60</text><rect x="60" y="160" width="387.6" height="60" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="76" y="198" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Exports  30.6</text><rect x="60" y="236" width="692.8666666666667" height="60" rx="6" fill="#b5602e" stroke="#1e2a44" stroke-width="2" /><text x="76" y="274" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">Imports  54.7</text><rect x="447.6" y="160" width="305.26666666666665" height="60" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><text x="599.6" y="198" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">deficit 24.1</text><rect x="30" y="380" width="410" height="282" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="416" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Main exports</text><circle cx="60" cy="446.39" r="5" fill="#2e6b62"/><text x="76" y="452" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Textile group (a little over half):</text><text x="76" y="474.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">knitwear, bed linen, garments, cloth,</text><text x="76" y="496.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">yarn, towels</text><circle cx="60" cy="520.6899999999999" r="5" fill="#2e6b62"/><text x="76" y="526.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rice (record of nearly US$4 billion)</text><circle cx="60" cy="550.79" r="5" fill="#2e6b62"/><text x="76" y="556.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Leather goods; surgical instruments and</text><text x="76" y="578.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sports goods</text><circle cx="60" cy="602.99" r="5" fill="#2e6b62"/><text x="76" y="608.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fruit and vegetables, fish, cement,</text><text x="76" y="630.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">chemicals</text><rect x="460" y="380" width="410" height="282" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="484" y="416" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Main imports</text><circle cx="490" cy="446.39" r="5" fill="#b5602e"/><text x="506" y="452" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Petroleum products, crude oil and LNG</text><circle cx="490" cy="476.49" r="5" fill="#b5602e"/><text x="506" y="482.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Machinery and electrical goods</text><circle cx="490" cy="506.59000000000003" r="5" fill="#b5602e"/><text x="506" y="512.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Palm oil; chemicals and plastics; iron</text><text x="506" y="534.3000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and steel</text><circle cx="490" cy="558.7900000000001" r="5" fill="#b5602e"/><text x="506" y="564.4000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Medicines; vehicles and parts; tea;</text><text x="506" y="586.5000000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pulses</text>
