<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">GDP and GNP</text>

<rect x="60" y="150" width="360" height="90" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="240" y="190" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">GDP</text><text x="240" y="220" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">all output inside Pakistan</text><text x="450" y="204" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="480" y="150" width="180" height="90" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="570" y="184" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">income earned</text><text x="570" y="203" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">abroad by</text><text x="570" y="222" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Pakistanis</text><text x="690" y="204" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">−</text><rect x="720" y="150" width="150" height="90" rx="10" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="795" y="184" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">income paid</text><text x="795" y="203" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">to foreign</text><text x="795" y="222" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">owners</text><path d="M480,254 L480,270 L870,270 L870,254" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="675" y="294" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">net income from abroad</text><line x1="450" y1="310" x2="450" y2="340" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="346" width="810" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" /><text x="465" y="380" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">GNP</text><text x="465" y="408" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">output of Pakistan’s residents and companies, wherever they are</text><rect x="30" y="450" width="410" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="478" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Examples of income abroad</text><text x="46" y="504" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Profits and interest earned overseas by</text><text x="46" y="526.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pakistanis.</text><rect x="460" y="450" width="410" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="476" y="478" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Examples paid out</text><text x="476" y="504" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Profits sent home by foreign firms operating</text><text x="476" y="526.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in Pakistan.</text><text x="450" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Divide either by population to compare living standards per person.</text>
</svg>