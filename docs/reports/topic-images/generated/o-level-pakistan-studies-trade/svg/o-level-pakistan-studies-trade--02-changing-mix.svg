<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Pakistan’s trade has changed</text>

<rect x="30" y="120" width="250" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="155" y="156" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">1950s exports</text><text x="155" y="196" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Raw cotton</text><text x="155" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Jute (from</text><text x="155" y="244" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">East Pakistan)</text><line x1="286" y1="195" x2="344" y2="195" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="352" y="200" width="160" height="70" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="432" y="241" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Yarn</text><rect x="527" y="165" width="160" height="105" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="607" y="223.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cloth</text><rect x="702" y="125" width="160" height="145" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="782" y="193.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Finished</text><text x="782" y="213.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">garments</text><text x="612" y="300" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Today: cotton leaves as processed goods that add value</text><rect x="30" y="330" width="270" height="200" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="366" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Rice has grown</text><text x="48" y="398" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Record value in 2023–24</text><text x="48" y="419" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">after India restricted some</text><text x="48" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of its own rice exports: a</text><text x="48" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">competitor’s policy changed</text><text x="48" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pakistan’s earnings.</text><rect x="315" y="330" width="270" height="200" rx="14" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5"/><text x="333" y="366" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Fuel dominates imports</text><text x="333" y="398" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The bill swings with world</text><text x="333" y="419" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">oil and gas prices: up in</text><text x="333" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2021–22, down in 2022–23</text><text x="333" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">when imports were restricted</text><text x="333" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to protect reserves.</text><rect x="600" y="330" width="270" height="200" rx="14" fill="#dfe7f2" stroke="#2b5a9a" stroke-width="2.5"/><text x="618" y="366" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="start">New growth areas</text><text x="618" y="398" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">IT services (about US$3</text><text x="618" y="419" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">billion, in services trade),</text><text x="618" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surgical instruments,</text><text x="618" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pharmaceuticals, seafood.</text>
</svg>