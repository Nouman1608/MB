<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pakistan’s main trading partners</text>

<line x1="450" y1="420" x2="340" y2="190" stroke="#c9d6d4" stroke-width="5"/><line x1="450" y1="420" x2="560" y2="190" stroke="#c9d6d4" stroke-width="5"/><line x1="450" y1="420" x2="340" y2="350" stroke="#c9d6d4" stroke-width="5"/><line x1="450" y1="420" x2="560" y2="350" stroke="#c9d6d4" stroke-width="5"/><line x1="450" y1="420" x2="340" y2="510" stroke="#c9d6d4" stroke-width="5"/><line x1="450" y1="420" x2="560" y2="510" stroke="#c9d6d4" stroke-width="5"/><rect x="30" y="120" width="310" height="140" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="148" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">United States</text><text x="44" y="172" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">▲ out</text><text x="104" y="172" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Knitwear, bed linen, garments</text><text x="44" y="196" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">▼ in</text><text x="104" y="196" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cotton, soybeans, machinery</text><rect x="560" y="120" width="310" height="140" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="574" y="148" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">China</text><text x="574" y="172" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">▲ out</text><text x="634" y="172" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cotton yarn, copper, rice,</text><text x="634" y="190" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">seafood</text><text x="574" y="214" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">▼ in</text><text x="634" y="214" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Machinery, electrical goods,</text><text x="634" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">solar panels</text><rect x="30" y="280" width="310" height="140" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="308" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">UK and EU</text><text x="44" y="332" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">▲ out</text><text x="104" y="332" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Garments, bed linen, leather,</text><text x="104" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sports goods</text><text x="44" y="374" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">▼ in</text><text x="104" y="374" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Machinery, vehicles,</text><text x="104" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">chemicals</text><rect x="560" y="280" width="310" height="140" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="574" y="308" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gulf: Saudi Arabia, Kuwait,</text><text x="574" y="328" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Qatar, UAE</text><text x="574" y="352" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">▲ out</text><text x="634" y="352" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Rice, textiles, food, meat</text><text x="574" y="376" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">▼ in</text><text x="634" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Crude oil, petroleum</text><text x="634" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">products, LNG</text><rect x="30" y="440" width="310" height="140" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="468" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Indonesia and Malaysia</text><text x="44" y="492" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">▲ out</text><text x="104" y="492" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Rice, textiles</text><text x="44" y="516" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">▼ in</text><text x="104" y="516" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Palm oil</text><rect x="560" y="440" width="310" height="140" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="574" y="468" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Afghanistan</text><text x="574" y="492" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">▲ out</text><text x="634" y="492" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Food, cement, medicines</text><text x="574" y="516" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">▼ in</text><text x="634" y="516" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Coal, fruit, vegetables,</text><text x="634" y="534" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cotton</text><ellipse cx="450" cy="420" rx="80" ry="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="428" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan</text><text x="450" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic, not a map. ▲ out = what Pakistan exports; ▼ in = what Pakistan imports.</text><rect x="30" y="636" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="670" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The United States is generally the largest export market;</text><text x="450" y="698" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">China is the largest source of imports.</text>
</svg>