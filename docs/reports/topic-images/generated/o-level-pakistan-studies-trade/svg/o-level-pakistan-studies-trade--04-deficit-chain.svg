<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 786" width="900" height="786" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="786" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why a trade deficit matters</text>

<rect x="140" y="116" width="620" height="94" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><circle cx="100" cy="163" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="100" y="170.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="164" y="150" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Widening trade deficit</text><text x="164" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">imports exceed exports</text><line x1="450" y1="212" x2="450" y2="226" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="140" y="228" width="620" height="94" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><circle cx="100" cy="275" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="100" y="282.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="164" y="262" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Reserves fall</text><text x="164" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">more foreign currency needed than exports earn</text><line x1="450" y1="324" x2="450" y2="338" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="140" y="340" width="620" height="94" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><circle cx="100" cy="387" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="100" y="394.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="164" y="374" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Gap filled</text><text x="164" y="402" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">remittances (about US$30 billion in 2023–24), loans, IMF or friendly</text><text x="164" y="422" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">countries</text><line x1="450" y1="436" x2="450" y2="450" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="140" y="452" width="620" height="94" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><circle cx="100" cy="499" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="100" y="506.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="164" y="486" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Rupee weakens</text><text x="164" y="514" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fuel and machinery imports dearer; inflation rises</text><line x1="450" y1="548" x2="450" y2="562" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="140" y="564" width="620" height="94" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><circle cx="100" cy="611" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="100" y="618.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="164" y="598" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Loan repayments</text><text x="164" y="626" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">take money from schools, health and development</text><rect x="30" y="682" width="840" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="716" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">The way out</text><text x="54" y="744" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rising exports of higher value-added goods narrow the gap, create jobs and pay for machinery.</text>
</svg>