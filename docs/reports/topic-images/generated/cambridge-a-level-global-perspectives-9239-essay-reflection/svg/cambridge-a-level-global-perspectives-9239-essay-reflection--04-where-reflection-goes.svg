<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" width="900" height="596" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="596" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where reflection goes in the essay</text>

<text x="450" y="140" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">The essay, start to finish</text><rect x="60" y="158" width="166.05882352941177" height="54" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="143.02941176470588" y="192" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Introduction</text><circle cx="143.02941176470588" cy="236" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="232.05882352941177" y="158" width="372.52941176470586" height="54" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="418.3235294117647" y="192" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Within the evaluation</text><circle cx="325.19117647058823" cy="236" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="436.95000000000005" cy="236" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="548.7088235294118" cy="236" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="610.5882352941176" y="158" width="223.41176470588235" height="54" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="722.2941176470588" y="192" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><circle cx="722.2941176470588" cy="236" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="90" cy="268" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="108" y="274" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">= a reflective moment</text><rect x="30" y="300" width="266" height="169" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="337" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Introduction</text><text x="48" y="364.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One sentence stating your</text><text x="48" y="385.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">starting view: a baseline</text><text x="48" y="406.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for later reflection.</text><rect x="317" y="300" width="266" height="169" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="335" y="337" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Within the evaluation</text><text x="335" y="364.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A brief reflective sentence</text><text x="335" y="385.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">after you weigh a</text><text x="335" y="406.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">perspective: “This was the</text><text x="335" y="427.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">argument that made me</text><text x="335" y="448.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reconsider …”</text><rect x="604" y="300" width="266" height="169" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="622" y="337" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="622" y="364.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Your personal, supported</text><text x="622" y="385.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">view, the main reason your</text><text x="622" y="406.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">view moved or held, and the</text><text x="622" y="427.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">limits of your research.</text><rect x="30" y="493" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="524.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Use the first person here: the syllabus asks about “the learner’s own standpoint”. Never leave</text><text x="450" y="546.59" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">reflection only to the last line.</text>
</svg>