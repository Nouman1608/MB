<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 673" width="900" height="673" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="673" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reflecting on the limits of your research</text>

<rect x="30" y="110" width="400" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="146.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Coverage</text><text x="48" y="173.17000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">regions or groups your sources did not</text><text x="48" y="194.29000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">represent</text><path d="M434,158 C540,158 540,338 590,338" fill="none" stroke="#2e6b62" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="30" y="222" width="400" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="258.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Type of evidence</text><text x="48" y="285.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">plenty of opinion but little data, or data</text><text x="48" y="306.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from only one period</text><path d="M434,270 C540,270 540,338 590,338" fill="none" stroke="#2e6b62" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="30" y="334" width="400" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="370.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Your own standpoint</text><text x="48" y="397.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a starting view that may have shaped which</text><text x="48" y="418.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sources you found persuasive</text><path d="M434,382 C540,382 540,338 590,338" fill="none" stroke="#2e6b62" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="30" y="446" width="400" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="482.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unresolved disagreement</text><text x="48" y="509.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">two credible sources that conflict, which</text><text x="48" y="530.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">your research could not decide between</text><path d="M434,494 C540,494 540,338 590,338" fill="none" stroke="#2e6b62" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="600" y="250" width="270" height="180" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="735" y="298.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Each limit ends with</text><text x="735" y="323.63" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">its consequence</text><text x="735" y="352.07" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">“so my conclusion applies</text><text x="735" y="374.51" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">more confidently to … than</text><text x="735" y="396.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">to …”</text><rect x="30" y="570" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="601.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Weak: “I did not have enough time.” Useful limits are ones that affect how confident you can</text><text x="450" y="623.59" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">be in your conclusion.</text>
</svg>