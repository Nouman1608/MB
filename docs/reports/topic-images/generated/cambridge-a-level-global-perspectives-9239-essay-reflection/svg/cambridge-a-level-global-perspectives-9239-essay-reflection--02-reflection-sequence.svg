<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The five-step reflection sequence</text>

<rect x="30" y="110" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="151" r="25" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="160" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="130" y="158" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Starting point</text><text x="330" y="157" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Your initial view, stated briefly and honestly</text><line x1="80" y1="194" x2="80" y2="216" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="218" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="259" r="25" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="268" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="130" y="266" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Encounter</text><text x="330" y="265" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Which perspective challenged or confirmed it</text><line x1="80" y1="302" x2="80" y2="324" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="326" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="367" r="25" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="376" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="130" y="374" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Effect</text><text x="330" y="373" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Whether your view was strengthened, qualified or reversed</text><line x1="80" y1="410" x2="80" y2="432" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="434" width="840" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="80" cy="486" r="25" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="495" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="130" y="493" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Reason</text><text x="330" y="480.78" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">The specific argument or evidence that caused the change.</text><text x="330" y="503.21999999999997" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">This step earns most credit.</text><line x1="80" y1="540" x2="80" y2="562" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="564" width="840" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="605" r="25" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="614" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="130" y="612" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Next step</text><text x="330" y="611" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What would test your new view further</text><rect x="30" y="668" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="700.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“My view changed” is a claim. “My view changed because …” is reflection.</text>
</svg>