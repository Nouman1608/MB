<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A relevant further-research suggestion</text>

<rect x="30" y="110" width="840" height="102.64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="161.32" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="169.95999999999998" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What</text><text x="122" y="169.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a specific kind of evidence or</text><text x="122" y="190.52" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a specific perspective</text><rect x="400" y="122" width="455" height="78.64" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="416" y="156.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“household surveys from rural areas of countries that</text><text x="416" y="177.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">have introduced the policy”</text><rect x="30" y="226.64" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="274.64" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="283.28" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="268.88" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why</text><text x="122" y="293.28" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the gap it fills</text><rect x="400" y="238.64" width="455" height="72" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="416" y="280.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“my sources are mostly from cities”</text><rect x="30" y="336.64" width="840" height="129.04000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="401.15999999999997" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="409.79999999999995" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="371.64" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">How it could change the</text><text x="122" y="398.03999999999996" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">judgement</text><text x="122" y="422.44" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what a result would do to your</text><text x="122" y="443.56" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conclusion</text><rect x="400" y="348.64" width="455" height="105.04000000000002" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="416" y="386.03999999999996" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“if rural households report higher costs, my conclusion</text><text x="416" y="407.15999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">that the policy is fair would need to be limited to</text><text x="416" y="428.28" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">cities”</text><rect x="30" y="485.68" width="840" height="70" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="450" y="520.78" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">✗ “More research is needed” / “I would like to interview experts”</text><text x="450" y="547.9" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">fails all three parts</text>
</svg>