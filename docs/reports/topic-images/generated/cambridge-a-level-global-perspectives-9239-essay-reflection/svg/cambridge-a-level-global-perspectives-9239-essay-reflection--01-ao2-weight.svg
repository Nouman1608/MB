<rect x="30" y="110" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Weight of AO2 Reflection</text><text x="270" y="199" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">Component 2: Essay</text><rect x="290" y="173" width="560" height="40" rx="8" fill="#eef2f2" stroke="#c9d6d4" stroke-width="2.2"/><rect x="290" y="173" width="123.2" height="40" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="427.2" y="200" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">AO2 = 22%</text><text x="270" y="259" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">Written Exam</text><rect x="290" y="233" width="560" height="40" rx="8" fill="#eef2f2" stroke="#c9d6d4" stroke-width="2.2"/><text x="304" y="260" font-size="19" font-weight="700" fill="#4a5568" text-anchor="start">AO2 = 0%</text><text x="450" y="345" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The Critical Path questions behind every piece of reflection</text><rect x="30" y="370" width="156" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="108" y="430.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Viewpoint</text><text x="108" y="451.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">before</text><text x="108" y="472.94" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">research?</text><circle cx="108" cy="370" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="108" y="376.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="187" y1="445" x2="200" y2="445" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="201" y="370" width="156" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="279" y="420.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">How does my</text><text x="279" y="441.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">view relate to</text><text x="279" y="462.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the</text><text x="279" y="483.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">perspectives?</text><circle cx="279" cy="370" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="279" y="376.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="358" y1="445" x2="371" y2="445" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="372" y="370" width="156" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="430.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">What impact has</text><text x="450" y="451.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the research</text><text x="450" y="472.94" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">had?</text><circle cx="450" cy="370" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="376.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="529" y1="445" x2="542" y2="445" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="543" y="370" width="156" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="621" y="441.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Why has it had</text><text x="621" y="462.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">that effect?</text><circle cx="621" cy="370" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="621" y="376.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="700" y1="445" x2="713" y2="445" stroke="#1e2a44" stroke-