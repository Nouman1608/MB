<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 591" width="900" height="591" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways a view can move</text>

<rect x="300" y="110" width="300" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Starting view</text><text x="450" y="174.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">meets the strongest opposing case</text><path d="M450,194 C450,222 163,210 163,244" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="250" width="266" height="214" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="288.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Strengthened</text><text x="48" y="316.02" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Your view survived the</text><text x="48" y="337.14" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">opposing case.</text><text x="48" y="358.26" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="48" y="379.38" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explain why the opposing</text><text x="48" y="400.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">argument did not persuade</text><text x="48" y="421.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">you, not just repeat your</text><text x="48" y="442.74" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conclusion.</text><path d="M450,194 C450,222 450,210 450,244" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="317" y="250" width="266" height="214" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="335" y="288.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Qualified</text><text x="335" y="316.02" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Your view now holds only in</text><text x="335" y="337.14" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">some conditions.</text><text x="335" y="358.26" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="335" y="379.38" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“I still think X, but only</text><text x="335" y="400.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">where Y.” The most common</text><text x="335" y="421.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">honest outcome, and often</text><text x="335" y="442.74" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the most impressive.</text><path d="M450,194 C450,222 737,210 737,244" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="604" y="250" width="266" height="214" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="622" y="288.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Reversed</text><text x="622" y="316.02" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The research changed your</text><text x="622" y="337.14" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mind.</text><text x="622" y="358.26" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="622" y="379.38" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Name the argument or</text><text x="622" y="400.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evidence that did it, and</text><text x="622" y="421.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">say whether any part of your</text><text x="622" y="442.74" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">original view survives.</text><rect x="30" y="488" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="519.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Do not invent a change of mind: an honest, reasoned “strengthened” or “qualified” beats an</text><text x="450" y="541.59" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">unexplained reversal.</text>
</svg>