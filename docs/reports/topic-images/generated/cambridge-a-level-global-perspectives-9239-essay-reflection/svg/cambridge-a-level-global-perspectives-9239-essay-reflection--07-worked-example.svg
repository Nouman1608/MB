<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 759" width="900" height="759" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="759" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weak and strong reflection compared</text>

<text x="450" y="100" font-size="19" font-weight="600" fill="#4a5568" text-anchor="middle" font-style="italic">Question: “Should countries make voting compulsory?”</text><rect x="30" y="120" width="840" height="106.24000000000001" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="156.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weak reflection</text><text x="48" y="183.17000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Before this essay I thought voting should be compulsory. After researching, I can see both sides.</text><text x="48" y="204.29000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">In future I would research this more.”</text><text x="30" y="256.24" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Strong reflection, step by step</text><rect x="30" y="272.24" width="840" height="68.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="306.36" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="313.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="100" y="313.36" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Starting point</text><text x="280" y="301.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">began convinced compulsory voting simply made democracy more</text><text x="280" y="322.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">representative</text><rect x="30" y="350.48" width="840" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="378.48" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="385.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="100" y="385.48" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Encounter</text><text x="280" y="384.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the liberty-based argument: a right includes the right not to use it</text><rect x="30" y="416.48" width="840" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="444.48" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="451.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="100" y="451.48" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Effect</text><text x="280" y="450.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">view qualified rather than reversed</text><rect x="30" y="482.48" width="840" height="89.36" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="66" cy="527.16" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="534" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="100" y="534.16" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reason</text><text x="280" y="512.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evidence that compulsion raises turnout among groups who vote least</text><text x="280" y="533.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">still persuades, but only justifies compulsion where a genuine “none</text><text x="280" y="554.28" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of the above” option exists</text><rect x="30" y="581.84" width="840" height="68.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="615.96" r="19" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="66" y="621.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">!</text><text x="100" y="622.96" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Limit</text><text x="280" y="611.4000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relied on a small number of countries already using it, so cannot say</text><text x="280" y="632.5200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">how it works where trust in government is low</text><rect x="30" y="660.08" width="840" height="68.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="694.2" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="701.0400000000001" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="100" y="701.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Next step</text><text x="280" y="689.6400000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">comparative research on countries that introduced and later abolished</text><text x="280" y="710.7600000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compulsory voting</text>
</svg>