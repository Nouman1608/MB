<rect width="900" height="653" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The unseen: what the syllabus says</text>

<text x="30" y="126" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two passages, from two of three categories (you will not know which)</text><rect x="30" y="142" width="268" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="70" y1="174" x2="130" y2="174" stroke="#1e2a44" stroke-width="4" stroke-linecap="round" opacity="0.6"/><line x1="70" y1="186" x2="130" y2="186" stroke="#1e2a44" stroke-width="4" stroke-linecap="round" opacity="0.6"/><line x1="70" y1="198" x2="130" y2="198" stroke="#1e2a44" stroke-width="4" stroke-linecap="round" opacity="0.6"/><line x1="70" y1="210" x2="106" y2="210" stroke="#1e2a44" stroke-width="4" stroke-linecap="round" opacity="0.6"/><text x="160" y="200" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">prose</text><rect x="316" y="142" width="268" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="356" y1="174" x2="400" y2="174" stroke="#1e2a44" stroke-width="4" stroke-linecap="round" opacity="0.6"/><line x1="356" y1="186" x2="388" y2="186" stroke="#1e2a44" stroke-width="4" stroke-linecap="round" opacity="0.6"/><line x1="356" y1="198" x2="404" y2="198" stroke="#1e2a44" stroke-width="4" stroke-linecap="round" opacity="0.6"/><line x1="356" y1="210" x2="382" y2="210" stroke="#1e2a44" stroke-width="4" stroke-linecap="round" opacity="0.6"/><text x="446" y="200" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">poetry</text><rect x="602" y="142" width="268" height="100" rx="12" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M647.5,218 L650,192 Q656,187 662,192 L664.5,218 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="656" cy="182" r="6.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M681.5,218 L684,192 Q690,187 696,192 L698.5,218 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="690" cy="182" r="6.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="732" y="200" font-size="21" font-weight="700" fill="#4a5568" text-anchor="start">drama</text><text x="870" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">one possible pairing shown; the third form is left out</text><rect x="30" y="278" width="840" height="56" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="314" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Answer one question from the choice of two · 25 marks · AO1 to AO4</text><rect x="30" y="354" width="270.6666666666667" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="397.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Written in English</text><text x="46" y="426.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">All passages come from works</text><text x="46" y="447.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">originally written in</text><text x="46" y="468.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">English.</text><rect x="314.6666666666667" y="354" width="270.6666666666667" height="147" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="408.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">No authors or dates</text><text x="330.6666666666667" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Background knowledge is not</text><text x="330.6666666666667" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expected.</text><rect x="599.3333333333334" y="354" width="270.6666666666667" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="385.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Language, form,</text><text x="615.3333333333334" y="410.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">structure</text><text x="615.3333333333334" y="438.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How meaning is expressed</text><text x="615.3333333333334" y="459.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">through the writer’s</text><text x="615.3333333333334" y="480.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">choices.</text><rect x="30" y="517" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="553" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What “knowledge” means</text><text x="50" y="582.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">AO1 here credits knowledge and understanding of the text type: how a poem, a scene or a</text><text x="50" y="604.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">piece of narrative prose works. That is why form-specific reading matters.</text>
</svg>