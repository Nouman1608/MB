<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Technique, then effect, then meaning</text>

<rect x="30" y="120" width="253.33333333333334" height="138" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="147" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TECHNIQUE</text><text x="44" y="176.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Polysyndeton in the list</text><text x="44" y="197.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“the gas bill and the water</text><text x="44" y="218.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bill and a leaflet about</text><text x="44" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">windows”</text><line x1="289.33333333333337" y1="189" x2="317.33333333333337" y2="189" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="120" width="253.33333333333334" height="138" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="337.33333333333337" y="157.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EFFECT</text><text x="337.33333333333337" y="187.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mimics a pile growing as</text><text x="337.33333333333337" y="208.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">she tries to hide the</text><text x="337.33333333333337" y="229.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">letter</text><line x1="582.6666666666667" y1="189" x2="610.6666666666667" y2="189" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="120" width="253.33333333333334" height="138" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="630.6666666666667" y="168" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MEANING</text><text x="630.6666666666667" y="197.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dread shown through delay,</text><text x="630.6666666666667" y="218.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">beneath ordinary life</text><rect x="30" y="274" width="253.33333333333334" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="301" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TECHNIQUE</text><text x="44" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Long second sentence of</text><text x="44" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">small actions joined by</text><text x="44" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“and”</text><line x1="289.33333333333337" y1="332.5" x2="317.33333333333337" y2="332.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="274" width="253.33333333333334" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="337.33333333333337" y="311.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EFFECT</text><text x="337.33333333333337" y="341.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The reader experiences</text><text x="337.33333333333337" y="362.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tea-making as a ritual</text><line x1="582.6666666666667" y1="332.5" x2="610.6666666666667" y2="332.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="274" width="253.33333333333334" height="117" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="630.6666666666667" y="311.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MEANING</text><text x="630.6666666666667" y="341.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A way of postponing the</text><text x="630.6666666666667" y="362.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">letter</text><rect x="30" y="407" width="253.33333333333334" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="434" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TECHNIQUE</text><text x="44" y="463.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Short final sentence: “Then</text><text x="44" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">she went back into the</text><text x="44" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hall”</text><line x1="289.33333333333337" y1="465.5" x2="317.33333333333337" y2="465.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="407" width="253.33333333333334" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="337.33333333333337" y="455" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EFFECT</text><text x="337.33333333333337" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Abrupt and decisive</text><line x1="582.6666666666667" y1="465.5" x2="610.6666666666667" y2="465.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="407" width="253.33333333333334" height="117" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="630.6666666666667" y="434" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MEANING</text><text x="630.6666666666667" y="463.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The avoidance is over;</text><text x="630.6666666666667" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suspense sharpens as the</text><text x="630.6666666666667" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passage ends unopened</text><rect x="30" y="542" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="575.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The paragraph treats the unknown contents of the letter as a deliberate choice, not a gap</text><text x="50" y="597.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to fill with guesses.</text>
</svg>