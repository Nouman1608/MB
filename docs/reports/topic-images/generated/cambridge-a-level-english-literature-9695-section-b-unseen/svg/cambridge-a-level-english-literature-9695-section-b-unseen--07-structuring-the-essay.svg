<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 709" width="900" height="709" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="709" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structuring the unseen essay</text>

<text x="30" y="124" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Introductions for the Asha passage</text><rect x="90" y="140" width="780" height="88" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="110" y="173" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAK: GUESSES BACKGROUND</text><text x="110" y="203.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“This is probably from a novel about a family in the 1970s”</text><circle cx="52" cy="184" r="17" fill="#b5602e"/><path d="M45.2,177.2 l13.600000000000001,13.600000000000001 m0,-13.600000000000001 l-13.600000000000001,13.600000000000001" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="90" y="240" width="780" height="88" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="110" y="273" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAK: ANNOUNCES A LIST</text><text x="110" y="303.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“The writer uses lists, long sentences and short sentences”</text><circle cx="52" cy="284" r="17" fill="#b5602e"/><path d="M45.2,277.2 l13.600000000000001,13.600000000000001 m0,-13.600000000000001 l-13.600000000000001,13.600000000000001" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="90" y="340" width="780" height="110" rx="14" fill="#f2e7b8" stroke="#2e6b62" stroke-width="2.5"/><text x="110" y="373" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRONG: SITUATION AND ARGUMENT</text><text x="110" y="403.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“In this passage a woman delays opening a letter, and the writer turns ordinary</text><text x="110" y="425.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">household routine into a means of postponing a crisis the reader is never shown.”</text><circle cx="52" cy="395" r="17" fill="#2e6b62"/><path d="M44.35,395.34 l5.44,5.78 l10.2,-11.22" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="30" y="484" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The essay’s shape</text><rect x="30" y="500" width="253.33333333333334" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="552.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Introduction</text><text x="46" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two or three sentences:</text><text x="46" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the situation and your</text><text x="46" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">thesis. No speculation</text><text x="46" y="643.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about author or period.</text><line x1="289.33333333333337" y1="592.5" x2="317.33333333333337" y2="592.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="500" width="253.33333333333334" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="339.33333333333337" y="531.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Body</text><text x="339.33333333333337" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Follow the passage’s</text><text x="339.33333333333337" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">movement (opening,</text><text x="339.33333333333337" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">development, turn, ending)</text><text x="339.33333333333337" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or organise by argument;</text><text x="339.33333333333337" y="643.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tie each paragraph to the</text><text x="339.33333333333337" y="664.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">question.</text><line x1="582.6666666666667" y1="592.5" x2="610.6666666666667" y2="592.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="500" width="253.33333333333334" height="185" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="632.6666666666667" y="552.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="632.6666666666667" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A judgement on the whole</text><text x="632.6666666666667" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">passage, such as how its</text><text x="632.6666666666667" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ending changes the way we</text><text x="632.6666666666667" y="643.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">read its beginning.</text>
</svg>