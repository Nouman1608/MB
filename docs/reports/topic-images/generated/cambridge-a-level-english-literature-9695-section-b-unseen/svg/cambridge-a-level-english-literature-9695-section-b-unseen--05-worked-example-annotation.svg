<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 557" width="900" height="557" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="557" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From passage to annotation</text>

<rect x="30" y="118" width="840" height="240" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="148" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Original passage, written for the guide</text><text x="96" y="188" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">The letter came on a Tuesday, which was the day for bills.</text><circle cx="64" cy="181" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="186.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="224" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Asha left it on the hall table under the gas bill and the water bill</text><circle cx="64" cy="217" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="222.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="260" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">and a leaflet about windows, and she made tea, and she drank the tea</text><circle cx="64" cy="253" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="258.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="296" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">standing at the sink, and then she washed the cup, dried it, and put</text><text x="96" y="332" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">it away. Then she went back into the hall.</text><circle cx="64" cy="325" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="330.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="392" width="158.4" height="141" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="417.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“the day for</text><text x="42" y="439.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">bills”</text><text x="42" y="466.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Routine,</text><text x="42" y="487.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expectation.</text><circle cx="109.2" cy="390" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="109.2" y="395.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="200.4" y="392" width="158.4" height="141" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="212.4" y="417.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Letter buried</text><text x="212.4" y="439.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">under bills</text><text x="212.4" y="466.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Avoidance.</text><circle cx="279.6" cy="390" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="279.6" y="395.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="370.8" y="392" width="158.4" height="141" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="382.8" y="417.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Long</text><text x="382.8" y="439.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">sentence,</text><text x="382.8" y="461.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">repeated</text><text x="382.8" y="483.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“and”</text><text x="382.8" y="510.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Delay, ritual.</text><circle cx="450" cy="390" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="395.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="541.2" y="392" width="158.4" height="141" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="553.2" y="417.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Short final</text><text x="553.2" y="439.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">sentence</text><text x="553.2" y="466.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Return,</text><text x="553.2" y="487.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decision.</text><circle cx="620.4000000000001" cy="390" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="620.4000000000001" y="395.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="711.6" y="392" width="158.4" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="723.6" y="417.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Contents</text><text x="723.6" y="439.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">never stated</text><text x="723.6" y="466.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Suspense.</text><circle cx="790.8000000000001" cy="390" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="790.8000000000001" y="395.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">?</text>
</svg>