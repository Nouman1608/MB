<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 559" width="900" height="559" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="559" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing between the two passages</text>

<path d="M80,120 L208,120 L230,142 L230,300 L80,300 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M208,120 L208,142 L230,142" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><line x1="92" y1="150" x2="189.92000000000002" y2="150" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="92" y1="164" x2="207.92000000000002" y2="164" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="92" y1="178" x2="186.5" y2="178" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="92" y1="192" x2="207.92000000000002" y2="192" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="92" y1="206" x2="207.92000000000002" y2="206" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="92" y1="220" x2="186.5" y2="220" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="92" y1="234" x2="207.92000000000002" y2="234" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="92" y1="248" x2="207.92000000000002" y2="248" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="92" y1="262" x2="186.5" y2="262" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><text x="155" y="330" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Passage 1</text><path d="M280,120 L408,120 L430,142 L430,300 L280,300 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M408,120 L408,142 L430,142" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><line x1="292" y1="150" x2="389.92" y2="150" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="292" y1="164" x2="407.92" y2="164" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="292" y1="178" x2="386.5" y2="178" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="292" y1="192" x2="407.92" y2="192" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="292" y1="206" x2="407.92" y2="206" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="292" y1="220" x2="386.5" y2="220" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="292" y1="234" x2="407.92" y2="234" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="292" y1="248" x2="407.92" y2="248" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="292" y1="262" x2="386.5" y2="262" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><text x="355" y="330" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Passage 2</text><text x="255" y="366" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">skim both questions and both passages: 2–3 minutes</text><rect x="96" y="180" width="118" height="22" rx="4" fill="#d4b02e" opacity="0.6"/><text x="155" y="232" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">a shift?</text><rect x="500" y="120" width="370" height="246" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="520" y="187.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Choose the passage you can</text><text x="520" y="212.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">argue about</text><text x="520" y="241.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="535.2" y="241.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A clear shift, tension or ambiguity</text><text x="535.2" y="262.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gives you an essay.</text><text x="520" y="288.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="535.2" y="288.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A text that seems simple can leave you</text><text x="535.2" y="309.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">describing.</text><rect x="30" y="390" width="270.6666666666667" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="432.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Weigh the form</text><text x="46" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Your practice matters, but</text><text x="46" y="481.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">do not avoid a form by</text><text x="46" y="502.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">habit: practise all three.</text><rect x="314.6666666666667" y="390" width="270.6666666666667" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="420.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Read the question’s</text><text x="330.6666666666667" y="444.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">wording</text><text x="330.6666666666667" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Your thesis answers the</text><text x="330.6666666666667" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">aspect it directs you to,</text><text x="330.6666666666667" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not one you would prefer.</text><rect x="599.3333333333334" y="390" width="270.6666666666667" height="145" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="615.3333333333334" y="421.9" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Then commit</text><text x="615.3333333333334" y="450.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Changing passage after</text><text x="615.3333333333334" y="471.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fifteen minutes is the</text><text x="615.3333333333334" y="492.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">costliest mistake in the</text><text x="615.3333333333334" y="513.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">section.</text>
</svg>