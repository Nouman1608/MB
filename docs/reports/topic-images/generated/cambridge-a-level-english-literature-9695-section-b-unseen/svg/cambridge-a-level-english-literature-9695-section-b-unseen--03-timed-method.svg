<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 798" width="900" height="798" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="798" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A timed method for about an hour</text>

<text x="30" y="126" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">About an hour: Paper 2 is two hours for two equally weighted answers</text><rect x="30" y="134" width="70" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="65" y="169" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">0–5</text><rect x="100" y="134" width="140" height="56" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="169" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5–15</text><rect x="240" y="134" width="70" height="56" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="275" y="169" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">15–20</text><rect x="310" y="134" width="490" height="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="169" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">20–55</text><rect x="800" y="134" width="70" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="835" y="169" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">55–60</text><text x="870" y="126" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">minutes</text><line x1="62" y1="230" x2="62" y2="754" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="210" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="245.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Choose and read for gist (0–5)</text><text x="128" y="273.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who is speaking or narrating, in what situation, and what changes from beginning to</text><text x="128" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">end?</text><circle cx="62" cy="264.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="273.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="329" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="364.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Second reading and annotation (5–15)</text><text x="128" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mark the turning point. Annotate language, form and structure, writing the effect</text><text x="128" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">beside each feature.</text><circle cx="62" cy="383.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="392.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="448" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="483.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plan (15–20)</text><text x="128" y="511.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A one-sentence thesis that answers the question; three or four points; two or three</text><text x="128" y="532.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quotations per point.</text><circle cx="62" cy="502.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="511.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="567" width="762" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="602.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Write (20–55)</text><text x="128" y="630.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Short introduction with your thesis, developed paragraphs with embedded quotation, a</text><text x="128" y="651.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conclusion with a final judgement.</text><circle cx="62" cy="621.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="630.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="686" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="721.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Check (55–60)</text><text x="128" y="749.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Every paragraph answers the question.</text><circle cx="62" cy="730" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="738.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>