<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What to notice in each form</text>

<rect x="30" y="118" width="270.6666666666667" height="402" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><rect x="42" y="130" width="246.66666666666669" height="80" rx="10" fill="#f2e7b8"/><line x1="129.33333333333334" y1="146.4" x2="201.33333333333334" y2="146.4" stroke="#1e2a44" stroke-width="4.8" stroke-linecap="round" opacity="0.6"/><line x1="129.33333333333334" y1="160.8" x2="201.33333333333334" y2="160.8" stroke="#1e2a44" stroke-width="4.8" stroke-linecap="round" opacity="0.6"/><line x1="129.33333333333334" y1="175.2" x2="201.33333333333334" y2="175.2" stroke="#1e2a44" stroke-width="4.8" stroke-linecap="round" opacity="0.6"/><line x1="129.33333333333334" y1="189.6" x2="172.53333333333333" y2="189.6" stroke="#1e2a44" stroke-width="4.8" stroke-linecap="round" opacity="0.6"/><text x="46" y="234" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Unseen prose</text><text x="46" y="262.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Narrative voice: person,</text><text x="61.2" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">distance, reliability.</text><text x="46" y="309.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pace: slowed into detail,</text><text x="61.2" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or summarised.</text><text x="46" y="356.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="356.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sentence shape: long and</text><text x="61.2" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">accumulating against short</text><text x="61.2" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and abrupt.</text><text x="46" y="424.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="424.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The withheld: what it makes</text><text x="61.2" y="445.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the reader wonder, without</text><text x="61.2" y="466.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inventing the plot.</text><rect x="314.6666666666667" y="118" width="270.6666666666667" height="402" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="326.6666666666667" y="130" width="246.66666666666669" height="80" rx="10" fill="#dce9e7"/><line x1="414" y1="146.4" x2="466.8" y2="146.4" stroke="#1e2a44" stroke-width="4.8" stroke-linecap="round" opacity="0.6"/><line x1="414" y1="160.8" x2="452.4" y2="160.8" stroke="#1e2a44" stroke-width="4.8" stroke-linecap="round" opacity="0.6"/><line x1="414" y1="175.2" x2="471.6" y2="175.2" stroke="#1e2a44" stroke-width="4.8" stroke-linecap="round" opacity="0.6"/><line x1="414" y1="189.6" x2="445.2" y2="189.6" stroke="#1e2a44" stroke-width="4.8" stroke-linecap="round" opacity="0.6"/><text x="330.6666666666667" y="234" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Unseen poetry</text><text x="330.6666666666667" y="262.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Speaker, listener and</text><text x="345.8666666666667" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">situation.</text><text x="330.6666666666667" y="309.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Form: stanza, line length,</text><text x="345.8666666666667" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rhyme, regular or disrupted</text><text x="345.8666666666667" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">metre.</text><text x="330.6666666666667" y="377.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Line endings: what</text><text x="345.8666666666667" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">enjambment holds back, what</text><text x="345.8666666666667" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the line end stresses.</text><text x="330.6666666666667" y="445.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="445.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The turn: the ending often</text><text x="345.8666666666667" y="466.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reframes the opening.</text><rect x="599.3333333333334" y="118" width="270.6666666666667" height="402" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><rect x="611.3333333333334" y="130" width="246.66666666666669" height="80" rx="10" fill="#f6e3d6"/><path d="M705.2666666666667,199.2 L708.2666666666667,168 Q715.4666666666667,162 722.6666666666667,168 L725.6666666666667,199.2 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="715.4666666666667" cy="156" r="7.8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M746.0666666666667,199.2 L749.0666666666667,168 Q756.2666666666668,162 763.4666666666668,168 L766.4666666666668,199.2 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="756.2666666666668" cy="156" r="7.8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="615.3333333333334" y="234" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Unseen drama</text><text x="615.3333333333334" y="262.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Read it as performance:</text><text x="630.5333333333334" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what would an audience see</text><text x="630.5333333333334" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and hear?</text><text x="615.3333333333334" y="330.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stage directions are</text><text x="630.5333333333334" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">evidence: pauses, movement,</text><text x="630.5333333333334" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">props, silence.</text><text x="615.3333333333334" y="398.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dialogue rhythm: who</text><text x="630.5333333333334" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">controls, interrupts, goes</text><text x="630.5333333333334" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quiet.</text><text x="615.3333333333334" y="466.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="466.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dramatic irony within the</text><text x="630.5333333333334" y="487.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">extract.</text><rect x="30" y="538" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="571.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The same discipline applies to all three forms; what changes is which features are worth</text><text x="50" y="593.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">noticing.</text>
</svg>