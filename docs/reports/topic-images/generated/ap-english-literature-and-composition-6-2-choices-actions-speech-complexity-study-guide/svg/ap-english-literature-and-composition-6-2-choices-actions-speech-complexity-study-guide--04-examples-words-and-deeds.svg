<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" width="900" height="466" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="466" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Words against deeds in three classics</text>

<rect x="30" y="110" width="840" height="50" rx="10" fill="#1e2a44"/><text x="44" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Work</text><text x="204" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Says or thinks</text><text x="454" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Does</text><text x="654" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Tension</text><rect x="30" y="160" width="840" height="114" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="188.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Macbeth</text><text x="204" y="188.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Doubts in private: "If it</text><text x="204" y="210.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">were done when 'tis</text><text x="204" y="232.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">done..."; Duncan is his</text><text x="204" y="254.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">guest and kinsman</text><line x1="190" y1="160" x2="190" y2="274" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="188.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Commits the murder</text><line x1="440" y1="160" x2="440" y2="274" stroke="#c9d6d4" stroke-width="2"/><text x="654" y="188.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Doubt against act;</text><text x="654" y="210.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">appearance against</text><text x="654" y="232.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">intent: "Look like the</text><text x="654" y="254.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">innocent flower"</text><line x1="640" y1="160" x2="640" y2="274" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="274" width="840" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="302.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hamlet</text><text x="204" y="302.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Now might I do it pat, now</text><text x="204" y="324.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">he is praying"</text><line x1="190" y1="274" x2="190" y2="366" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="302.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Does not do it</text><line x1="440" y1="274" x2="440" y2="366" stroke="#c9d6d4" stroke-width="2"/><text x="654" y="302.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Revenge against the fate</text><text x="654" y="324.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of Claudius's soul; is his</text><text x="654" y="346.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reason the whole truth?</text><line x1="640" y1="274" x2="640" y2="366" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="366" width="840" height="70" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="394.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Jane Eyre</text><text x="204" y="394.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"I am no bird; and no net</text><text x="204" y="416.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">ensnares me"</text><line x1="190" y1="366" x2="190" y2="436" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="394.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Leaves a man she</text><text x="454" y="416.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">loves</text><line x1="440" y1="366" x2="440" y2="436" stroke="#c9d6d4" stroke-width="2"/><text x="654" y="394.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Feeling against principle:</text><text x="654" y="416.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the choice costs her</text><line x1="640" y1="366" x2="640" y2="436" stroke="#c9d6d4" stroke-width="2"/>
</svg>