<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Theodora at the register</text>

<text x="272" y="126" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Refusal</text><text x="444" y="126" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Dismissal</text><text x="616" y="126" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Evasion</text><text x="788" y="126" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Reopening</text><rect x="30" y="140" width="840" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="300" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="192" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">SPEECH</text><text x="50" y="216" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">refuses</text><text x="50" y="352" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">ACTION</text><text x="50" y="376" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="start">is drawn back</text><rect x="200" y="154" width="144" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="212" y="193.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"It is not mine</text><text x="212" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">to tear"</text><rect x="200" y="314" width="144" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="212" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Closes the</text><text x="212" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">book gently</text><line x1="346" y1="360" x2="370" y2="360" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="372" y="154" width="144" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="384" y="193.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Go and see to</text><text x="384" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the horses"</text><rect x="372" y="314" width="144" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="384" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Does not move</text><text x="384" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">away from it</text><line x1="518" y1="360" x2="542" y2="360" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="544" y="154" width="144" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="183.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"I said a great</text><text x="556" y="204.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">many things</text><text x="556" y="225.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">yesterday"</text><rect x="544" y="314" width="144" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="364.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Opens it again</text><line x1="690" y1="360" x2="714" y2="360" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="716" y="154" width="144" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="728" y="204.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">(silence)</text><rect x="716" y="314" width="144" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="728" y="343.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reads the entry</text><text x="728" y="364.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">slowly, to the</text><text x="728" y="385.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">end</text><text x="450" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Two values pull against each other</text><rect x="90" y="480" width="260" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="220" y="504.95000000000005" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Integrity: not destroying a</text><text x="220" y="526.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">record</text><rect x="550" y="480" width="260" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="680" y="515.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Loyalty to family: "anything"</text><line x1="450" y1="510" x2="362" y2="510" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="450" y1="510" x2="538" y2="510" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><circle cx="450" cy="510" r="12" fill="#1e2a44"/><rect x="130" y="570" width="640" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="605.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Outcome unresolved</text><text x="450" y="634.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Suspense: what is in the entry, and what will she do?</text>
</svg>