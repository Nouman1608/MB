<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A label is not an analysis</text>

<rect x="380" y="110" width="490" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="400" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1  NAME</text><text x="400" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Name the tension</text><text x="400" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">e.g. integrity against family loyalty</text><line x1="625" y1="229" x2="625" y2="249" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="380" y="255" width="490" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="400" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2  MEANING</text><text x="400" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What the gap suggests</text><text x="400" y="345.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">about the character's values or fears</text><line x1="625" y1="374" x2="625" y2="394" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="380" y="400" width="490" height="115" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="400" y="433" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3  FUNCTION</text><text x="400" y="461" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What it does for the work</text><text x="400" y="490.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">irony, sympathy, suspense</text><rect x="30" y="110" width="260" height="405" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="160" y="285" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">LABEL ONLY</text><text x="160" y="316.2" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">"Hypocrite"</text><text x="160" y="348.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">The analysis stops here</text><line x1="294" y1="168" x2="374" y2="168" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)" stroke-dasharray="8 6"/><text x="335" y="155" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">go further</text>
</svg>