<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="820" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A method: map the tension</text>

<rect x="30" y="110" width="268" height="159" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 1</text><text x="50" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Professed</text><text x="50" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What do they say they value</text><text x="50" y="222.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">or intend?</text><rect x="316" y="110" width="268" height="159" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 2</text><text x="336" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Actual</text><text x="336" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What do they do?</text><rect x="602" y="110" width="268" height="159" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 3</text><text x="622" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Private</text><text x="622" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What do narration,</text><text x="622" y="222.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">soliloquy, stage directions</text><text x="622" y="244.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">or details suggest they feel?</text><line x1="164" y1="275" x2="364.2" y2="321" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="275" x2="450" y2="321" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="736" y1="275" x2="535.8" y2="321" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="329" width="600" height="115" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="362" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">STEP 4</text><text x="450" y="390" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Gap</text><text x="450" y="419.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Where do these differ? Name the tension in one phrase.</text><line x1="450" y1="448" x2="450" y2="474" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="480" width="600" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="513" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">STEP 5</text><text x="450" y="541" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Meaning</text><text x="450" y="570.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">What does the tension suggest about the character's values, fears or</text><text x="450" y="592.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">motives?</text><line x1="450" y1="621" x2="450" y2="647" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="653" width="600" height="137" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="686" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">STEP 6</text><text x="450" y="714" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Function</text><text x="450" y="743.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">What does it do for the work: suspense, irony, sympathy, a question</text><text x="450" y="765.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">about conscience, or a turn in the plot?</text>
</svg>