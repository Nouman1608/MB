<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 746" width="900" height="746" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Miss Tarrant</text>

<rect x="30" y="110" width="268" height="161" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROFESSED</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"The school has never</text><text x="50" y="195.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">taken charity"</text><text x="50" y="224.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Hands folded, eyes lowered:</text><text x="50" y="246.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">propriety and humility</text><rect x="316" y="110" width="268" height="161" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACTUAL</text><text x="336" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Refuses the money</text><text x="336" y="199.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Waits until the carriage</text><text x="336" y="221.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">has crossed the bridge</text><text x="336" y="243.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">before she moves</text><rect x="602" y="110" width="268" height="161" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRIVATE</text><text x="622" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Counts what the school</text><text x="622" y="195.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">needs</text><text x="622" y="224.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">panes, desks, and "the</text><text x="622" y="246.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">winter that was coming"</text><line x1="164" y1="277" x2="364.2" y2="319" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="277" x2="450" y2="319" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="736" y1="277" x2="535.8" y2="319" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="327" width="560" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="360" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">GAP</text><text x="450" y="388" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Principle against need</text><line x1="450" y1="418" x2="450" y2="444" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="450" width="560" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="483" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">MEANING</text><text x="450" y="511" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Not mere hypocrisy, not mere pride</text><text x="450" y="540.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Her independence is held at a visible cost</text><line x1="450" y1="569" x2="450" y2="595" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="601" width="560" height="115" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="634" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FUNCTION</text><text x="450" y="662" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sympathy and tension</text><text x="450" y="691.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Her later choices become the working-out of a real conflict</text>
</svg>