<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three channels of evidence</text>

<rect x="30" y="110" width="268" height="215" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANNEL 1</text><text x="50" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Speech</text><text x="50" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What is said, to whom, in</text><text x="50" y="222.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">what tone, with what words</text><text x="50" y="256.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Belief, or what they want</text><text x="50" y="278.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">others to believe?</text><rect x="316" y="110" width="268" height="215" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANNEL 2</text><text x="336" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Action</text><text x="336" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Choices under pressure,</text><text x="336" y="222.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">what is done and not done,</text><text x="336" y="244.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">gestures</text><text x="336" y="278.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Does it support or</text><text x="336" y="300.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">contradict the speech?</text><rect x="602" y="110" width="268" height="215" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANNEL 3</text><text x="622" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Private thought</text><text x="622" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Soliloquy, narrated thought,</text><text x="622" y="222.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">or details that let us infer it</text><text x="622" y="256.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What do they hide, and</text><text x="622" y="278.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">why?</text><line x1="164" y1="331" x2="349.9" y2="397" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="331" x2="450" y2="397" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="736" y1="331" x2="550.1" y2="397" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="405" width="560" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="441.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Where the channels disagree</text><text x="450" y="472.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">private thought against behaviour reveals tension between</text><text x="450" y="494.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">private and professed values</text><text x="450" y="559" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Competing, conflicting or inconsistent choices add complexity to the text as well as the character</text>
</svg>