<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Complexity is a tension you can name</text>

<text x="450" y="118" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">A complex character...</text><rect x="30" y="136" width="268" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="183.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">wants two things</text><text x="164" y="213.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">that cannot both be had</text><rect x="316" y="136" width="268" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="183.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">says one thing</text><text x="450" y="213.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">and does another</text><rect x="602" y="136" width="268" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="171.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">acts against stated</text><text x="736" y="196.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">beliefs</text><text x="736" y="225.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">then has to live with it</text><text x="450" y="300" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Patterns of tension the reader can name</text><rect x="30" y="322" width="840" height="288" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="344" width="220" height="46" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="190" y="373.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">duty</text><rect x="600" y="344" width="220" height="46" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="710" y="373.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">desire</text><line x1="450" y1="367" x2="312" y2="367" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="450" y1="367" x2="588" y2="367" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><circle cx="450" cy="367" r="12" fill="#1e2a44"/><rect x="80" y="410" width="220" height="46" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="190" y="439.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">loyalty</text><rect x="600" y="410" width="220" height="46" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="710" y="439.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">honesty</text><line x1="450" y1="433" x2="312" y2="433" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="450" y1="433" x2="588" y2="433" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><circle cx="450" cy="433" r="12" fill="#1e2a44"/><rect x="80" y="476" width="220" height="46" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="190" y="505.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">pride</text><rect x="600" y="476" width="220" height="46" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="710" y="505.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">need</text><line x1="450" y1="499" x2="312" y2="499" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="450" y1="499" x2="588" y2="499" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><circle cx="450" cy="499" r="12" fill="#1e2a44"/><rect x="80" y="542" width="220" height="46" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="190" y="571.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">ambition</text><rect x="600" y="542" width="220" height="46" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="710" y="571.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">conscience</text><line x1="450" y1="565" x2="312" y2="565" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="450" y1="565" x2="588" y2="565" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><circle cx="450" cy="565" r="12" fill="#1e2a44"/><rect x="30" y="644" width="390" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="225" y="691.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Name the tension</text><text x="225" y="721.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">in one phrase</text><line x1="426" y1="701" x2="474" y2="701" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="644" width="390" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="675" y="679.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Say what the writer wants us to</text><text x="675" y="704.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">understand about people</text><text x="675" y="733.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">This is a claim about function</text>
</svg>