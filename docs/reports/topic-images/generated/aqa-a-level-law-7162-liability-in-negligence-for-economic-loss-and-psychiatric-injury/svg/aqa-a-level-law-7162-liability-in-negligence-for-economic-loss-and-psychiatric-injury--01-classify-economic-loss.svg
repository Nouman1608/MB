<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is the financial loss pure or consequential?</text>

<rect x="170" y="100" width="560" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="130.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Did the loss follow physical damage to the claimant’s</text><text x="450" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">own person or property?</text><line x1="330" y1="180" x2="230" y2="216" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="180" x2="670" y2="216" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="214" y="210" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">yes</text><text x="686" y="210" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">no</text><rect x="30" y="234" width="400" height="176" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="264" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSEQUENTIAL</text><text x="48" y="290.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recoverable</text><text x="48" y="319.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wages lost after a broken leg</text><text x="48" y="345.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Profit lost on goods the defendant destroyed</text><rect x="470" y="234" width="400" height="176" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="488" y="264" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PURE ECONOMIC LOSS</text><text x="488" y="290.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Generally not recoverable</text><text x="488" y="319.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="503.2" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Profit lost because a supplier’s factory was</text><text x="503.2" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">damaged</text><text x="488" y="366.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="503.2" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repairing a defect before it damages</text><text x="503.2" y="387.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anything else (<tspan font-style="italic">Murphy</tspan>)</text><line x1="560" y1="414" x2="450" y2="436" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="780" y1="414" x2="780" y2="436" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="300" y="454" width="297.3953488372093" height="139" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="316" y="482" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAUSED BY A NEGLIGENT ACT</text><text x="316" y="513" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">No: <tspan font-style="italic">Spartan</tspan> <tspan font-style="italic">Steel</tspan> (1973), <tspan font-style="italic">Weller</tspan></text><text x="316" y="533" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1966), <tspan font-style="italic">Murphy</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Brentwood</tspan> <tspan font-style="italic">DC</tspan></text><text x="316" y="553" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1991). <tspan font-style="italic">Junior</tspan> <tspan font-style="italic">Books</tspan> (1983) is</text><text x="316" y="573" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exceptional, confined to its facts.</text><rect x="611.3953488372093" y="454" width="258.60465116279073" height="139" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="627.3953488372093" y="482" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CAUSED BY A MISSTATEMENT</text><text x="627.3953488372093" y="513" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Yes, <tspan font-weight="700" fill="#1e2a44">if</tspan> <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">special</tspan> <tspan font-weight="700" fill="#1e2a44">relationship</tspan></text><text x="627.3953488372093" y="533" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">exists</tspan>: <tspan font-style="italic">Hedley</tspan> <tspan font-style="italic">Byrne</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Heller</tspan></text><text x="627.3953488372093" y="553" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1964)</text>
</svg>