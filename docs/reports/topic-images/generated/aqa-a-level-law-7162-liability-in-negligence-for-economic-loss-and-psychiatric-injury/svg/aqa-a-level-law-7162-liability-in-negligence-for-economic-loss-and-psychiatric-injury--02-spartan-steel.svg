<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Spartan Steel v Martin (1973): what was recovered?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Contractors negligently cut the power cable to the claimant’s factory</text>
<rect x="30" y="124" width="254.54545454545456" height="92" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="157.27272727272728" y="166" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Damaged melt</text><text x="157.27272727272728" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">physical damage</text><rect x="284.54545454545456" y="124" width="254.54545454545456" height="92" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="411.81818181818187" y="166" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Profit on that melt</text><text x="411.81818181818187" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">consequential</text><rect x="539.0909090909091" y="124" width="330.90909090909093" height="92" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="704.5454545454546" y="166" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Profit on further melts</text><text x="704.5454545454546" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">pure economic loss</text><path d="M38,232 L531.0909090909091,232" stroke="#2e6b62" stroke-width="5"/><text x="284.54545454545456" y="262" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">RECOVERED</text><path d="M547.0909090909091,232 L862,232" stroke="#b5602e" stroke-width="5"/><text x="704.5454545454546" y="262" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">NOT RECOVERED</text><rect x="30" y="288" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="322.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lord Denning’s reasoning</text><text x="50" y="352.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Power cuts are a common risk that businesses should insure against and bear themselves.</text><rect x="30" y="393" width="840" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="423" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMPARE: WELLER v FOOT AND MOUTH DISEASE RESEARCH INSTITUTE (1966)</text><text x="48" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A virus escaped; cattle markets closed. Auctioneers who lost business recovered nothing: <tspan font-weight="700" fill="#1e2a44">no</tspan> <tspan font-weight="700" fill="#1e2a44">damage</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan></text><text x="48" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">their</tspan> <tspan font-weight="700" fill="#1e2a44">own</tspan> <tspan font-weight="700" fill="#1e2a44">property</tspan>.</text>
</svg>