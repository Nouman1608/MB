<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Secondary victims: the four Alcock controls</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Alcock v Chief Constable of South Yorkshire (1992)</text>
<rect x="30" y="124" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1  CLOSE TIE OF LOVE AND AFFECTION</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Presumed for parents, children and spouses;</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">others must prove it. A man who lost two brothers</text><text x="46" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">failed: no evidence of a close tie.</text><rect x="457" y="124" width="413" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="473" y="152" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">2  PROXIMITY IN TIME AND SPACE</text><text x="473" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">To the event or its <tspan font-weight="700" fill="#1e2a44">immediate</tspan> <tspan font-weight="700" fill="#1e2a44">aftermath</tspan> (see the</text><text x="473" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">timeline below).</text><rect x="30" y="258" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3  OWN UNAIDED SENSES</text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Live television of Hillsborough was not enough:</text><text x="46" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">broadcasting guidelines meant individuals were</text><text x="46" y="359.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not shown.</text><rect x="457" y="258" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4  REASONABLE FORTITUDE</text><text x="473" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A person of reasonable fortitude would have</text><text x="473" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suffered psychiatric injury.</text><rect x="30" y="396" width="840" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="428" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Immediate aftermath? Hours after the event</text><line x1="80" y1="466" x2="820" y2="466" stroke="#1e2a44" stroke-width="3"/><line x1="80" y1="458" x2="80" y2="474" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">event</text><line x1="244.44444444444446" y1="458" x2="244.44444444444446" y2="474" stroke="#1e2a44" stroke-width="2.5"/><text x="244.44444444444446" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2 h</text><line x1="408.8888888888889" y1="458" x2="408.8888888888889" y2="474" stroke="#1e2a44" stroke-width="2.5"/><text x="408.8888888888889" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">4 h</text><line x1="573.3333333333333" y1="458" x2="573.3333333333333" y2="474" stroke="#1e2a44" stroke-width="2.5"/><text x="573.3333333333333" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">6 h</text><line x1="737.7777777777778" y1="458" x2="737.7777777777778" y2="474" stroke="#1e2a44" stroke-width="2.5"/><text x="737.7777777777778" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">8 h</text><circle cx="80" cy="466" r="11" fill="#1e2a44"/><rect x="80" y="452" width="164.44444444444446" height="28" fill="#dce9e7" opacity="0.7"/><circle cx="244.44444444444446" cy="466" r="11" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="737.7777777777778" cy="466" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="62" cy="536" r="8" fill="#2e6b62"/><text x="78" y="542" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">McLoughlin</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">O’Brian</tspan> (1983): hospital about two</text><text x="78" y="562" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hours later, family not yet cleaned up: <tspan font-weight="700">recovered</tspan></text><circle cx="472" cy="536" r="8" fill="#b5602e"/><text x="488" y="542" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Alcock</tspan>: identifying a body at the mortuary about</text><text x="488" y="562" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">eight hours later: <tspan font-weight="700">too</tspan> <tspan font-weight="700">late</tspan></text>
</svg>