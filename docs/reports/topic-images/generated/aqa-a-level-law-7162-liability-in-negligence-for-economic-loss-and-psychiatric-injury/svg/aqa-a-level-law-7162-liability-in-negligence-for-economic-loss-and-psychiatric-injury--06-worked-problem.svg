<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="628" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked problem: Ade, Cleo and Dev</text>

<rect x="30" y="100" width="640" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MISSTATEMENT</text><text x="46" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ade v Wren</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wren has special skill, but casual advice at a barbecue, with no known purpose</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or assumed responsibility, is unlikely to create a special relationship (contrast</text><text x="46" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Chaudhry</tspan>, a specific task).</text><line x1="674" y1="173" x2="690" y2="173" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="694" y="100" width="176" height="146" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="782" y="178" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Likely no duty</text><rect x="30" y="258" width="640" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PSYCHIATRIC: PRIMARY</text><text x="46" y="312.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cleo v Bolt Ltd</text><text x="46" y="341.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Narrowly missed on the pavement: in the zone of danger. PTSD is a recognised</text><text x="46" y="362.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">illness. Physical injury foreseeable, so <tspan font-style="italic">Page</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Smith</tspan> applies.</text><line x1="674" y1="320.5" x2="690" y2="320.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="694" y="258" width="176" height="125" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="782" y="313.5" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Likely to</text><text x="782" y="337.5" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">succeed</text><rect x="30" y="395" width="640" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="423" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PSYCHIATRIC: SECONDARY</text><text x="46" y="449.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Dev v Bolt Ltd</text><text x="46" y="478.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An uncle: close tie must be proved. Not present; saw a livestream, so not his</text><text x="46" y="499.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">own unaided senses (<tspan font-style="italic">Alcock</tspan>).</text><line x1="674" y1="457.5" x2="690" y2="457.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="694" y="395" width="176" height="125" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="782" y="462.5" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Likely to fail</text><rect x="30" y="538" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="571.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Classify first: what kind of loss, and primary or secondary? Then apply only that category’s rules.</text>
</svg>