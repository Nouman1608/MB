<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 717" width="900" height="717" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="717" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Psychiatric injury: who is the claimant?</text>

<rect x="30" y="100" width="840" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THRESHOLD FOR EVERY CLAIMANT</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A recognised psychiatric illness, such as PTSD or clinical depression</text><text x="48" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Proved by medical evidence; not ordinary grief, fear or distress. Traditionally from a sudden shock</text><text x="48" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Alcock</tspan>); a 36-hour sequence was one event in <tspan font-style="italic">Walters</tspan> (2002).</text><line x1="450" y1="233" x2="450" y2="253" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="210" y="273" width="480" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="301.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">In the zone of physical danger, or reasonably</text><text x="450" y="324.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">believed so?</text><line x1="330" y1="347" x2="230" y2="383" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="347" x2="670" y2="383" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="214" y="377" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">yes</text><text x="686" y="377" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">no</text><rect x="30" y="401" width="405" height="157" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="431" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRIMARY VICTIM</text><text x="48" y="462.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Dulieu</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">White</tspan> (1901): barmaid feared for her</text><text x="63.2" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">own safety</text><text x="48" y="509.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="509.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Page</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Smith</tspan> (1996): physical injury</text><text x="63.2" y="530.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foreseeable, so psychiatric injury need not be</text><rect x="465" y="401" width="405" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="483" y="431" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">SECONDARY VICTIM</text><text x="483" y="462.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.2" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Witnessed danger or injury to someone else</text><text x="483" y="488.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.2" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Must satisfy <tspan font-weight="700" fill="#1e2a44">all</tspan> <tspan font-weight="700" fill="#1e2a44">four</tspan> <tspan font-style="italic">Alcock</tspan> controls</text><text x="483" y="514.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.2" y="514.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Needs an accident, an external event: <tspan font-style="italic">Paul</tspan></text><text x="498.2" y="535.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2024)</text><rect x="30" y="580" width="840" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="610" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESCUERS AND EMPLOYEES</text><text x="48" y="641.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">White</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">CC</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">South</tspan> <tspan font-style="italic">Yorkshire</tspan> (1998): primary only if in physical danger or reasonably believing so;</text><text x="48" y="662.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">otherwise secondary. <tspan font-style="italic">Chadwick</tspan> (1967) is now explained by his own danger in the wreckage.</text>
</svg>