<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 771" width="900" height="771" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="771" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Negligent misstatement: is there a special relationship?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Hedley Byrne v Heller (1964), refined in Caparo v Dickman (1990)</text>
<line x1="60" y1="144" x2="60" y2="420" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Special skill or knowledge</text><text x="117" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The defendant knows the claimant is likely to rely on it</text><circle cx="60" cy="160.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="169.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="205" width="766" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="232.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Claimant known to the defendant</text><text x="117" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Individually or as a member of an identified group who would rely</text><circle cx="60" cy="241.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="250.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="286" width="766" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="313.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A particular purpose</text><text x="117" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The advice was for a purpose known to the defendant</text><circle cx="60" cy="322.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="331.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="367" width="766" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="394.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reasonable reliance</text><text x="117" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The claimant reasonably relied on it</text><circle cx="60" cy="403.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="412.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="458" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="485" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">✗ CAPARO (1990)</text><text x="45" y="516" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Auditors’ reports were for shareholders to supervise</text><text x="45" y="536" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the company, not for investors buying shares</text><rect x="457" y="458" width="413" height="97" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="472" y="485" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ SMITH v ERIC S BUSH (1990)</text><text x="472" y="516" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mortgage valuer knew the buyer would very likely</text><text x="472" y="536" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rely; disclaimer failed under UCTA 1977</text><rect x="30" y="567" width="413" height="97" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="594" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ CHAUDHRY v PRABHAKAR (1989)</text><text x="45" y="625" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Unpaid friend claimed knowledge of cars and agreed</text><text x="45" y="645" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to find one not in an accident</text><rect x="457" y="567" width="413" height="97" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="472" y="594" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ SPRING v GUARDIAN ASSURANCE (1994)</text><text x="472" y="625" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Employer giving a reference owed a duty to the</text><text x="472" y="645" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">former employee</text><rect x="30" y="682" width="840" height="57" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="714.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">In <tspan font-style="italic">Hedley</tspan> <tspan font-style="italic">Byrne</tspan> itself the bank escaped: its reference was given “without responsibility”.</text>
</svg>