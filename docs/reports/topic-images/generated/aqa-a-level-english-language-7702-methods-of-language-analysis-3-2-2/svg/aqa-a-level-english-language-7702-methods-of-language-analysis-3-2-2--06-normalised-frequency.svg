<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading corpus results</text>

<rect x="40" y="115" width="820" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="155" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">frequency per million</text><text x="450" y="200" font-size="22" font-weight="600" fill="#1e2a44" text-anchor="middle">= (raw count ÷ corpus size in words) × 1,000,000</text><text x="450" y="240" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">so corpora of different sizes can be compared</text><text x="450" y="305" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Hypothetical illustration</text><rect x="40" y="325" width="220" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="365" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">raw count</text><text x="150" y="405" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">50</text><text x="150" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">occurrences</text><text x="290" y="395" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">÷</text><rect x="340" y="325" width="220" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="365" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">corpus size</text><text x="450" y="405" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">2,000,000</text><text x="450" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">words</text><line x1="565" y1="385" x2="625" y2="385" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="640" y="325" width="220" height="120" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="365" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">normalised</text><text x="750" y="405" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">25</text><text x="750" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">per million words</text><rect x="40" y="470" width="400" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="505" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Concordance</text><text x="64" y="535" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">each occurrence in its context:</text><text x="64" y="558" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">lets you check meaning</text><rect x="460" y="470" width="400" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="505" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Collocates</text><text x="484" y="535" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">words a term habitually appears with:</text><text x="484" y="558" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">can reveal semantic change or attitudes</text>
</svg>