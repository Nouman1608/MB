<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Describing a dialect utterance</text>

<rect x="40" y="112" width="820" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="134" width="85.82" height="36" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="65" y="160" font-size="21" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">We was</text><rect x="157.82" y="134" width="49.91" height="36" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="162.82" y="160" font-size="21" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">sat</text><text x="224.73" y="160" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">there for ages and there</text><rect x="533.01" y="134" width="181.57999999999998" height="36" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="538.01" y="160" font-size="21" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">weren't nobody</text><text x="65" y="206" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">about, so we</text><rect x="229.64" y="180" width="61.879999999999995" height="36" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="234.64" y="206" font-size="21" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">come</text><text x="308.52" y="206" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">home.</text><rect x="40" y="255" width="820" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="267" width="210" height="46" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="157" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">"We was"</text><text x="282" y="283" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">levelled past tense of BE: "was" with a plural</text><text x="282" y="305" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">subject</text><rect x="40" y="337" width="820" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="349" width="210" height="46" rx="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="157" y="378" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">"sat"</text><text x="282" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">past participle used for the progressive "sitting",</text><text x="282" y="387" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">common in northern and Midland English</text><rect x="40" y="419" width="820" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="431" width="210" height="46" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="157" y="460" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">"weren't nobody"</text><text x="282" y="447" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">multiple negation, plus levelled "weren't" with a</text><text x="282" y="469" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">singular subject</text><rect x="40" y="501" width="820" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="513" width="210" height="46" rx="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="157" y="542" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">"come" (past)</text><text x="282" y="540" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">non-standard past tense, identical to the base form</text><rect x="40" y="591" width="250" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="625" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Describe its grammar</text><line x1="292" y1="619" x2="323" y2="619" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="325" y="591" width="250" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="625" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Compare with Standard English</text><line x1="577" y1="619" x2="608" y2="619" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="591" width="250" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="625" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Place it as a regular pattern</text><text x="450" y="683" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Then explain it in an essay through networks, prestige or identity.</text>
</svg>