<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a text about language shows its stance</text>

<rect x="40" y="115" width="395" height="110" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="150" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Prescriptive signal</text><text x="64" y="180" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">modal verbs of obligation</text><text x="64" y="207" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">"should", "must"</text><rect x="465" y="115" width="395" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="150" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Descriptive signal</text><text x="489" y="180" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hedged claims</text><text x="489" y="207" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">"may", "research suggests"</text><text x="450" y="262" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Other clues to the writer's stance</text><rect x="40" y="280" width="820" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="289" width="160" height="50" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="132" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lexis</text><text x="230" y="308.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evaluative words: "sloppy", "mangled", "vibrant", "rich";</text><text x="230" y="331.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">metaphors of decay, disease, invasion or growth</text><rect x="40" y="358" width="820" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="367" width="160" height="40" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="132" y="393" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Grammar</text><text x="230" y="393" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">generic noun phrases ("young people today") generalise</text><rect x="40" y="426" width="820" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="435" width="160" height="50" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="132" y="466" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pragmatics</text><text x="230" y="454.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">presuppositions ("the decline of English"), irony and</text><text x="230" y="477.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">humour, appeals to shared common sense</text><rect x="40" y="504" width="820" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="513" width="160" height="50" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="132" y="544" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Discourse</text><text x="230" y="532.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anecdote versus evidence, the order of arguments, whose</text><text x="230" y="555.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">voices are quoted</text><rect x="40" y="582" width="820" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="591" width="160" height="50" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="132" y="622" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Graphology</text><text x="230" y="610.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quoted "errors" in bold or capitals invite ridicule;</text><text x="230" y="633.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">headings frame the issue</text>
</svg>