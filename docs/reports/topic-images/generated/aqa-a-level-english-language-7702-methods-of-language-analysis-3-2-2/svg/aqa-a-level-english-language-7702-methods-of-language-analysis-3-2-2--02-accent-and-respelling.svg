<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Describing accent precisely</text>

<rect x="40" y="115" width="380" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Describe by the sound</text><rect x="60" y="175" width="340" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="78" y="211" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">h-dropping</text><rect x="60" y="245" width="340" height="58" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="78" y="270" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">TH-fronting</text><text x="78" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">/θ/ as /f/: "think" sounds like "fink"</text><rect x="60" y="315" width="340" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="78" y="340" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Glottal stop</text><text x="78" y="362" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">replacing /t/ in "butter"</text><rect x="60" y="385" width="340" height="58" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="78" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rhotic accents</text><text x="78" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pronounce /r/ after vowels</text><rect x="60" y="455" width="340" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="78" y="480" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Non-rhotic accents</text><text x="78" y="502" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">do not</text><rect x="440" y="115" width="420" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="650" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Accent shown in spelling?</text><polygon points="650,172 830,232 650,292 470,232" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="650" y="225" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Does the spelling change</text><text x="650" y="246" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">the pronunciation?</text><path d="M520,262 L520,330" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="505" y="305" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">yes</text><path d="M780,262 L780,330" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="795" y="305" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">no</text><rect x="455" y="336" width="190" height="182" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="550" y="368" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Phonetic</text><text x="550" y="391" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">respelling</text><text x="550" y="428" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"'ow", "reet"</text><text x="550" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a representation</text><text x="550" y="481" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">chosen by the writer</text><rect x="655" y="336" width="190" height="182" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="750" y="368" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Eye dialect</text><text x="750" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"wuz" for "was"</text><text x="750" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">used to make a</text><text x="750" y="465" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">speaker seem</text><text x="750" y="484" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">uneducated</text>
</svg>