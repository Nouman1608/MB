<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three jobs for the methods in Paper 2</text>

<rect x="40" y="115" width="260" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="127" width="236" height="96" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="170" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Identify and describe</text><text x="170" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">features of diversity and</text><text x="170" y="205" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">change</text><circle cx="54" cy="127" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="132.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="62" y="262" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">What it looks like</text><text x="62" y="290" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Name a dialect form, an</text><text x="62" y="313" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">older spelling convention</text><text x="62" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or a semantic shift</text><text x="62" y="359" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">precisely</text><line x1="62" y1="395" x2="278" y2="395" stroke="#c9d6d4" stroke-width="2"/><text x="62" y="425" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Where it pays off</text><text x="62" y="453" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Evidence in the Section A</text><text x="62" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">essay; analysis of older</text><text x="62" y="499" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Section B texts</text><rect x="320" y="115" width="260" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="332" y="127" width="236" height="96" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Research</text><text x="450" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">diversity and change</text><circle cx="334" cy="127" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="334" y="132.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="342" y="262" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">What it looks like</text><text x="342" y="290" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Read dictionary entries,</text><text x="342" y="313" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">corpus results, surveys</text><text x="342" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and research findings</text><line x1="342" y1="395" x2="558" y2="395" stroke="#c9d6d4" stroke-width="2"/><text x="342" y="425" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Where it pays off</text><text x="342" y="453" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Supporting claims about</text><text x="342" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">when and how a change</text><text x="342" y="499" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">happened</text><rect x="600" y="115" width="260" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="612" y="127" width="236" height="96" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="730" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Analyse</text><text x="730" y="186" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">how texts present ideas</text><text x="730" y="205" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">about language</text><circle cx="614" cy="127" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="614" y="132.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="622" y="262" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">What it looks like</text><text x="622" y="290" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Examine the lexis,</text><text x="622" y="313" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">grammar and pragmatics a</text><text x="622" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">writer uses about</text><text x="622" y="359" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">language</text><line x1="622" y1="395" x2="838" y2="395" stroke="#c9d6d4" stroke-width="2"/><text x="622" y="425" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Where it pays off</text><text x="622" y="453" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Section B analysis of</text><text x="622" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">two texts</text><rect x="40" y="565" width="820" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="608" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Lexis and semantics: "including social and historical variation". In Paper 2, variation is the point.</text>
</svg>