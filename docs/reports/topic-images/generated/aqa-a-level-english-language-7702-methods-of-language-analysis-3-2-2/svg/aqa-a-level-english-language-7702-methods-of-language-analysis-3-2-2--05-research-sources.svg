<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Research sources and their limits</text>

<text x="325" y="128" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Tells you</text><text x="582" y="128" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Caution</text><rect x="40" y="142" width="820" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Historical dictionary</text><text x="60" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">e.g. Oxford English</text><text x="60" y="217" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Dictionary</text><text x="325" y="179" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">earliest recorded</text><text x="325" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">uses; dated quotations</text><rect x="570" y="154" width="278" height="62" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="584" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">first recorded use is not</text><text x="584" y="199" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">first use</text><rect x="40" y="240" width="820" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="272" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Corpora</text><text x="60" y="296" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">e.g. British National Corpus</text><text x="325" y="277" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">frequency, collocates,</text><text x="325" y="298" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">concordance lines</text><rect x="570" y="252" width="278" height="62" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="584" y="278" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reflects the text types it</text><text x="584" y="297" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">contains</text><rect x="40" y="338" width="820" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="370" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Frequency tools</text><text x="60" y="394" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">e.g. Google Books Ngram</text><text x="60" y="413" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Viewer</text><text x="325" y="375" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trends in printed use</text><text x="325" y="396" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">over centuries</text><rect x="570" y="350" width="278" height="62" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="584" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">under-represents informal and</text><text x="584" y="395" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">spoken use</text><rect x="40" y="436" width="820" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="468" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dialect surveys</text><text x="60" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">e.g. Survey of English</text><text x="60" y="511" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Dialects, 1950s</text><text x="325" y="473" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">where forms were used</text><text x="325" y="494" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and by whom</text><rect x="570" y="448" width="278" height="62" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="584" y="474" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">speakers may not represent</text><text x="584" y="493" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the community</text><rect x="40" y="534" width="820" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="566" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Research findings</text><text x="60" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">tables, graphs, statistics</text><text x="325" y="571" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">patterns across groups</text><text x="325" y="592" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or periods</text><rect x="570" y="546" width="278" height="62" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="584" y="572" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">check sample size, method,</text><text x="584" y="591" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">what is measured</text>
</svg>