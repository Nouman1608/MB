<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Real time and apparent time</text>

<rect x="40" y="115" width="400" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="152" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Real-time study</text><text x="240" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">same community, two dates</text><line x1="70" y1="420" x2="410" y2="420" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="240" y="455" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">time</text><rect x="110" y="230" width="120" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="170" y="270" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Community</text><circle cx="140" cy="320" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="170" cy="320" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="200" cy="320" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="170" y1="380" x2="170" y2="420" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="405" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="170" y="362" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Date 1</text><rect x="290" y="230" width="120" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="270" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Community</text><circle cx="320" cy="320" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="350" cy="320" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="380" cy="320" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="350" y1="380" x2="350" y2="420" stroke="#1e2a44" stroke-width="2.5"/><text x="350" y="405" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="350" y="362" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Date 2</text><rect x="460" y="115" width="400" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="660" y="152" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Apparent-time study</text><text x="660" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">age groups compared at one date</text><rect x="500" y="205" width="320" height="56" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="520" y="240" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Older speakers</text><rect x="500" y="275" width="320" height="56" rx="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="520" y="310" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Middle speakers</text><rect x="500" y="345" width="320" height="56" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="520" y="380" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Younger speakers</text><text x="660" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Assumes older speakers</text><text x="660" y="463" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">preserve earlier usage</text><rect x="40" y="555" width="820" height="80" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="590" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Caution for apparent time:</text><text x="64" y="618" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">differences between age groups may instead be age grading.</text>
</svg>