<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Labels for non-standard grammar</text>

<rect x="40" y="112" width="820" height="52" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="145" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Not</text><text x="110" y="145" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"wrong grammar"</text><text x="300" y="145" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Use a descriptive label for each pattern:</text><rect x="40" y="182" width="820" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="190" width="330" height="40" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="217" y="216" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Multiple negation</text><text x="400" y="217" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"I never said nothing"</text><rect x="40" y="248" width="820" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="256" width="330" height="40" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="217" y="282" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Levelled past tense of BE</text><text x="400" y="283" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"we was", "it weren't"</text><rect x="40" y="314" width="820" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="322" width="330" height="40" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="217" y="348" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-standard past forms</text><text x="400" y="349" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"I seen it", "she done it"</text><rect x="40" y="380" width="820" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="388" width="330" height="40" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="217" y="414" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Zero plural after numbers</text><text x="400" y="415" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"ten mile"</text><rect x="40" y="446" width="820" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="454" width="330" height="40" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="217" y="480" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Second-person plural pronouns</text><text x="400" y="481" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"youse", "y'all"</text><rect x="40" y="512" width="820" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="520" width="330" height="40" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="217" y="546" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Older forms</text><text x="400" y="547" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"-eth" and "-est" endings, "thou/thee", "I know not"</text><text x="450" y="610" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Word formation: name the process: compounding, blending, affixation, clipping, conversion</text>
</svg>