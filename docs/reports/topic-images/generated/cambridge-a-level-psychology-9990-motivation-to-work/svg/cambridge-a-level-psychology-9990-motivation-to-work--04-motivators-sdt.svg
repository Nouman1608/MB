<rect width="900" height="623" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rewards and self-determination theory</text>

<rect x="30" y="100" width="410" height="188" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EXTRINSIC: FROM OUTSIDE THE TASK</text><text x="50" y="163.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">pay</tspan>: regular wage or salary</text><text x="50" y="188.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">bonus</tspan>: one-off payment for a target</text><text x="50" y="213.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">profit-sharing</tspan>: a share of company profits</text><text x="50" y="238.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">performance-related</tspan> <tspan font-weight="700" fill="#1e2a44">pay</tspan>: linked to measured</text><text x="65.2" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">performance</text><rect x="460" y="100" width="410" height="188" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTRINSIC: NON-MONETARY</text><text x="480" y="163.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">praise</text><text x="480" y="188.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">respect</text><text x="480" y="213.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recognition</text><text x="480" y="238.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">empowerment: authority to make decisions</text><text x="480" y="263.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a sense of belonging</text><text x="450" y="324" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">DECI AND RYAN: THREE BASIC PSYCHOLOGICAL NEEDS</text><rect x="30" y="350" width="270.6666666666667" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="396.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Competence</text><text x="165.33333333333334" y="425.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">feeling effective</text><rect x="314.6666666666667" y="350" width="270.6666666666667" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="385.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Autonomy</text><text x="450" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">feeling in control of one's</text><text x="450" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">actions</text><rect x="599.3333333333334" y="350" width="270.6666666666667" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="396.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Relatedness</text><text x="734.6666666666667" y="425.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">feeling connected to others</text><rect x="30" y="482" width="410" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="514" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">INFORMATIONAL REWARD</text><text x="235" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">shows appreciation of competence → can</text><text x="235" y="566.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">support</tspan> intrinsic motivation</text><rect x="460" y="482" width="410" height="109" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="514" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">CONTROLLING REWARD</text><text x="665" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">frustrates autonomy → can <tspan font-weight="700" fill="#1e2a44">undermine</tspan> intrinsic</text><text x="665" y="566.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">motivation</text>
</svg>