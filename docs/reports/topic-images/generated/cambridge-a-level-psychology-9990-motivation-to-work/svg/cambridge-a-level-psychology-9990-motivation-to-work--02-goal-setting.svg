<rect width="900" height="459" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Goal-setting theory</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Latham and Locke: specific, difficult goals beat "do your best"</text>
<rect x="30" y="124" width="160" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="171.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Clarity</text><text x="44" y="198.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">specific and</text><text x="44" y="218.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">measurable</text><rect x="200" y="124" width="160" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="214" y="171.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Challenge</text><text x="214" y="198.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">difficult but</text><text x="214" y="218.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">achievable</text><rect x="370" y="124" width="160" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="384" y="161.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Commitment</text><text x="384" y="188.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">accepted; more</text><text x="384" y="208.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">likely if the person</text><text x="384" y="228.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">helps set it</text><rect x="540" y="124" width="160" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="554" y="161.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feedback</text><text x="554" y="188.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">progress reported</text><text x="554" y="208.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">so effort can be</text><text x="554" y="228.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">adjusted</text><rect x="710" y="124" width="160" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="724" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Task</text><text x="724" y="172.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">complexity</text><text x="724" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">complex tasks</text><text x="724" y="219" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">need time and</text><text x="724" y="239" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">support</text><text x="450" y="293" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">SMART: SPECIFIC · MEASURABLE · ACHIEVABLE · RELEVANT · TIME-BOUND</text><rect x="30" y="319" width="316" height="108" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="188" y="363" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">VAGUE</text><text x="188" y="389.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">"Improve customer service"</text><line x1="352" y1="373" x2="390" y2="373" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="396" y="319" width="474" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="633" y="351" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SMART</text><text x="633" y="377.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">"Answer 90% of customer emails within 24</text><text x="633" y="401.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">hours by the end of March"</text>
</svg>