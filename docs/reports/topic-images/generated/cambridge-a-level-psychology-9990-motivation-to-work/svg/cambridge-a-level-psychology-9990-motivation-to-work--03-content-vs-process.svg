<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing need and cognitive theories</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="307" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="221.05263157894737" height="49" fill="#b5d3cf"/><rect x="251.05263157894737" y="100" width="309.47368421052636" height="49" fill="#f2e7b8"/><text x="265.0526315789474" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Need theories</text><rect x="560.5263157894738" y="100" width="309.47368421052636" height="49" fill="#b5d3cf"/><text x="574.5263157894738" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cognitive theories</text><rect x="30" y="149" width="221.05263157894737" height="70" fill="#dce9e7"/><text x="44" y="176.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Examples</text><rect x="251.05263157894737" y="149" width="309.47368421052636" height="70" fill="#ffffff"/><text x="265.0526315789474" y="176.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Maslow; McClelland</text><rect x="560.5263157894738" y="149" width="309.47368421052636" height="70" fill="#ffffff"/><text x="574.5263157894738" y="176.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Goal-setting (Latham and Locke);</text><text x="574.5263157894738" y="198.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">VIE (Vroom)</text><line x1="30" y1="219" x2="870" y2="219" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="219" width="221.05263157894737" height="70" fill="#dce9e7"/><text x="44" y="246.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Explain</text><rect x="251.05263157894737" y="219" width="309.47368421052636" height="70" fill="#f8faf9"/><text x="265.0526315789474" y="246.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">What</tspan> motivates: the content</text><rect x="560.5263157894738" y="219" width="309.47368421052636" height="70" fill="#f8faf9"/><text x="574.5263157894738" y="246.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">How</tspan> motivation is produced: the</text><text x="574.5263157894738" y="268.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">process</text><line x1="30" y1="289" x2="870" y2="289" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="289" width="221.05263157894737" height="48" fill="#dce9e7"/><text x="44" y="316.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Source of motivation</text><rect x="251.05263157894737" y="289" width="309.47368421052636" height="48" fill="#ffffff"/><text x="265.0526315789474" y="316.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unmet needs</text><rect x="560.5263157894738" y="289" width="309.47368421052636" height="48" fill="#ffffff"/><text x="574.5263157894738" y="316.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Goals and beliefs</text><line x1="30" y1="337" x2="870" y2="337" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="337" width="221.05263157894737" height="70" fill="#dce9e7"/><text x="44" y="364.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">View of the worker</text><rect x="251.05263157894737" y="337" width="309.47368421052636" height="70" fill="#f8faf9"/><text x="265.0526315789474" y="364.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More <tspan font-weight="700">deterministic</tspan>: behaviour</text><text x="265.0526315789474" y="386.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">driven by needs</text><rect x="560.5263157894738" y="337" width="309.47368421052636" height="70" fill="#f8faf9"/><text x="574.5263157894738" y="364.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An <tspan font-weight="700">active</tspan> role in judging goals and</text><text x="574.5263157894738" y="386.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rewards</text></g><line x1="251.05263157894737" y1="100" x2="251.05263157894737" y2="407" stroke="#c9d6d4" stroke-width="1.5"/><line x1="560.5263157894738" y1="100" x2="560.5263157894738" y2="407" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="307" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
