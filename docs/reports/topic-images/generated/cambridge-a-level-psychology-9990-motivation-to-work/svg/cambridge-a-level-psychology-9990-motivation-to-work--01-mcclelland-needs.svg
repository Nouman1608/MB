<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">McClelland: three learned needs</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Learned through experience, so they differ between people</text>
<rect x="30" y="124" width="270.6666666666667" height="223" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">nAch</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Need for achievement</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to succeed at challenging</text><text x="65.2" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tasks</text><text x="50" y="259.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prefers moderately difficult</text><text x="65.2" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">goals, personal</text><text x="65.2" y="301.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">responsibility and clear</text><text x="65.2" y="322.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">feedback</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="223" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">nAff</text><text x="334.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Need for affiliation</text><text x="334.6666666666667" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to be liked and accepted</text><text x="334.6666666666667" y="238.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prefers cooperation and</text><text x="349.8666666666667" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">avoids conflict</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="223" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">nPow</text><text x="619.3333333333334" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Need for power</text><text x="619.3333333333334" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to influence and control</text><text x="634.5333333333334" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">others</text><text x="619.3333333333334" y="259.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personally, or for the</text><text x="634.5333333333334" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">organisation's goals</text><text x="450" y="383" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">APPLICATION: MATCH THE ROLE TO THE NEED</text><rect x="30" y="409" width="410" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="442.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">High-nAch employee → a <tspan font-weight="700" fill="#1e2a44">target-based</tspan></text><text x="235" y="464.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">project</tspan></text><rect x="460" y="409" width="410" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="453.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">High-nAff employee → a <tspan font-weight="700" fill="#1e2a44">team</tspan> <tspan font-weight="700" fill="#1e2a44">role</tspan></text><rect x="30" y="511" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="545.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="50" y="574.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Needs were often measured with <tspan font-weight="700" fill="#1e2a44">projective</tspan> <tspan font-weight="700" fill="#1e2a44">tests</tspan> (interpreting ambiguous pictures), which have</text><text x="50" y="595.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">questionable reliability.</text>
</svg>