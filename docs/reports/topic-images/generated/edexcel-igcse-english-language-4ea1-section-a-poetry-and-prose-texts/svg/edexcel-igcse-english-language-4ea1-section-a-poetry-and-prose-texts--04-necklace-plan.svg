<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 774" width="900" height="774" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="774" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning “The Necklace”: pride and its cost</text>

<rect x="30" y="100" width="840" height="104" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="54" y="132" font-size="15" font-weight="700" fill="#b5d3cf" text-anchor="start">THESIS</text><text x="54" y="160" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start">Pride is a trap that costs Mathilde far more than the necklace was worth, and the</text><text x="54" y="182" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start">structure makes the reader feel that cost.</text><line x1="62" y1="242" x2="62" y2="599" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="222" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="249.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Opening portrait</text><text x="121" y="277.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mathilde’s dreams set against her real home: contrast</text><circle cx="62" cy="258.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="267.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="303" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="330.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The ball</text><text x="121" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Her moment of success; why choosing the diamond necklace matters</text><circle cx="62" cy="339.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="348.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="384" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="411.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The loss, and the secret</text><text x="121" y="439.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not telling Madame Forestier: pride over honesty</text><circle cx="62" cy="420.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="429.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="465" width="762" height="73" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="121" y="492.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ten years compressed into a few lines</text><text x="121" y="520.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Plain summary replaces dreamy detail; placed straight after the proud choice</text><circle cx="62" cy="501.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="510.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="546" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="573.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The final revelation</text><text x="121" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Structure reframes everything that came before</text><circle cx="62" cy="582.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="591.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="637" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="670.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paragraph 4 earns credit for</text><text x="48" y="699.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">an interpretation (AO1), analysis of pacing and placement, and a comment on narrative style</text><text x="48" y="721.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(AO2), all linked to the focus.</text>
</svg>