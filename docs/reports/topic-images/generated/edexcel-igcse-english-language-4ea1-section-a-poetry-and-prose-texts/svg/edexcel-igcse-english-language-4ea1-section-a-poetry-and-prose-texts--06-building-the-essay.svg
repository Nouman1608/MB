<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 738" width="900" height="738" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="738" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a 45-minute essay</text>

<rect x="30" y="100" width="840" height="89" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="135.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Introduction</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two or three sentences: your thesis on the focus. No biography, no summary.</text><line x1="450" y1="194" x2="450" y2="218" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="223" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="258.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Body: three or four paragraphs</text><text x="50" y="287.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One method or one moment each, moving through the text: the opening, a turning point, the</text><text x="50" y="309.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">ending.</text><line x1="450" y1="339" x2="450" y2="363" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="368" width="840" height="89" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="403.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="432.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What the text suggests overall, perhaps with an alternative reading.</text><text x="450" y="499" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Every body paragraph</text><rect x="30" y="515" width="150" height="60" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="105" y="541" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Point on the</text><text x="105" y="562" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">focus</text><line x1="183" y1="545" x2="199" y2="545" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="202" y="515" width="150" height="60" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="277" y="541" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Short</text><text x="277" y="562" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">reference</text><line x1="355" y1="545" x2="371" y2="545" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="374" y="515" width="150" height="60" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="449" y="541" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Method</text><line x1="527" y1="545" x2="543" y2="545" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="546" y="515" width="150" height="60" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="621" y="541" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Effect on</text><text x="621" y="562" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">reader</text><line x1="699" y1="545" x2="715" y2="545" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="718" y="515" width="150" height="60" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="793" y="541" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Link to</text><text x="793" y="562" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">question</text><rect x="30" y="601" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="634.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Before planning, reread the printed text.</text><text x="48" y="663.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Mark three or four moments that answer the focus and order them by position. Do not</text><text x="48" y="685.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">overrun: Section B needs its 45 minutes.</text>
</svg>