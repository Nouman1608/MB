<text x="450" y="120" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Component 2: 1 hour 30 minutes, 60 marks</text><rect x="70" y="140" width="380" height="70" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="260" y="170" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: about 45 minutes</text><text x="260" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">30 marks: one essay</text><rect x="450" y="140" width="380" height="70" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="640" y="170" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Section B: 45 minutes</text><text x="640" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">30 marks</text><rect x="70" y="226" width="152" height="44" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="146" y="254" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1: 12</text><rect x="222" y="226" width="228" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="336" y="254" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2: 18</text><text x="474" y="245" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">AO2 is 18 of 30: analysis of</text><text x="474" y="266" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">methods drives every paragraph</text><rect x="30" y="294" width="411" height="186" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="327" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE TEXT</text><text x="50" y="354" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">One poem or prose text from</text><text x="50" y="380" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Anthology Part 2</text><text x="50" y="409.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ten possible texts, known in advance; the</text><text x="50" y="431.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">named text is printed in the exam.</text><rect x="459" y="294" width="411" height="186" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="327" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AO1 + AO2</text><text x="479" y="354" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Interpret and analyse</text><text x="479" y="383.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">AO1: the ideas you select and the</text><text x="479" y="405.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">interpretation you build, not retelling</text><text x="479" y="433.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">AO2: how linguistic and structural devices</text><text x="479" y="455.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">achieve effects</text>
</svg>