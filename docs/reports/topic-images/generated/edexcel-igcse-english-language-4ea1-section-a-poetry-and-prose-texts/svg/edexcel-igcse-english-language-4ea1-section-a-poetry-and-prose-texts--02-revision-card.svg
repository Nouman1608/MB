<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One revision card per text</text>

<rect x="80" y="108" width="760" height="420" rx="16" fill="#c9d6d4"/><rect x="60" y="100" width="760" height="420" rx="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="60" y="100" width="760" height="56" rx="16" fill="#1e2a44"/><rect x="60" y="136" width="760" height="20" fill="#1e2a44"/><text x="84" y="137" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">Text title</text><text x="796" y="137" font-size="16" font-weight="400" fill="#b5d3cf" text-anchor="end">poem or prose</text><circle cx="100" cy="196" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="100" y="202.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="132" y="192" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Situation</text><text x="132" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who, where, what happens, in two sentences</text><line x1="84" y1="234" x2="796" y2="234" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="100" cy="266" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="100" y="272.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="132" y="262" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Viewpoint and voice</text><text x="132" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">first person, third person, a speaker addressing someone</text><line x1="84" y1="304" x2="796" y2="304" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="100" cy="336" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="100" y="342.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="132" y="332" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><text x="132" y="356" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how it opens, where it turns, how it ends, how time moves</text><line x1="84" y1="374" x2="796" y2="374" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="100" cy="406" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="100" y="412.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="132" y="402" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Three key methods</text><text x="132" y="426" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">each with a short reference</text><line x1="84" y1="444" x2="796" y2="444" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="100" cy="476" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="100" y="482.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="132" y="472" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ideas and perspectives</text><text x="132" y="496" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what the writer seems to suggest, plus one alternative reading</text><rect x="30" y="552" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="585.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">No need to memorise long quotations: the text is printed.</text><text x="450" y="614.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">But know where the key moments are, so you can find them quickly.</text>
</svg>