<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 686" width="900" height="686" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="686" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What to look for: poem and prose</text>

<rect x="30" y="100" width="405" height="44" rx="10" fill="#2e6b62"/><text x="232" y="130" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Poem</text><rect x="30" y="156" width="405" height="75" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="184.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Form and stanza shape</text><text x="44" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">regular: control; irregular: disorder</text><rect x="30" y="241" width="405" height="75" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="269.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Line breaks and enjambment</text><text x="44" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">momentum, or a pause before a key word</text><rect x="30" y="326" width="405" height="75" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="354.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Caesura</text><text x="44" y="382.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a moment of shock or reflection</text><rect x="30" y="411" width="405" height="75" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="439.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Repetition and refrain</text><text x="44" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">emphasis, insistence or defiance</text><rect x="30" y="496" width="405" height="75" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="524.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rhyme and rhythm</text><text x="44" y="552.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">confident beat or hesitant, broken rhythm</text><rect x="30" y="581" width="405" height="75" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="609.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Voice and address</text><text x="44" y="637.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who speaks, to whom; tone changes</text><rect x="465" y="100" width="405" height="44" rx="10" fill="#8a6d0d"/><text x="667" y="130" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Prose</text><rect x="465" y="156" width="405" height="96" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="184.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Narrative viewpoint</text><text x="479" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">first person: intimacy, possible</text><text x="479" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unreliability; third: distance or irony</text><rect x="465" y="262" width="405" height="96" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pacing</text><text x="479" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">short sentences slow a key moment; summary</text><text x="479" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">speeds past years</text><rect x="465" y="368" width="405" height="96" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="396.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><text x="479" y="424.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time shift, delayed revelation, twist or open</text><text x="479" y="445.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ending</text><rect x="465" y="474" width="405" height="75" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="502.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dialogue</text><text x="479" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what characters say, and avoid saying</text><rect x="465" y="559" width="405" height="96" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="587.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Setting and symbolism</text><text x="479" y="615.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">objects or places that carry meaning beyond</text><text x="479" y="636.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">themselves</text>
</svg>