<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 599" width="900" height="599" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="599" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">“Disabled”: loss shown as a contrast</text>

<rect x="30" y="110" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><rect x="30" y="290" width="840" height="150" rx="14" fill="#1e2a44"/><text x="50" y="140" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">REMEMBERED PAST: light, crowds and admiration</text><text x="50" y="426" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">NOW: alone in a wheelchair, waiting for dark</text><path d="M90,338 C150,338 210,192 270,192 C330,192 390,338 450,338 C510,338 570,192 630,192 C690,192 750,338 810,338" fill="none" stroke="#d4b02e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><circle cx="270" cy="192" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="630" cy="192" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="90" cy="338" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="338" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="810" cy="338" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="370" font-size="15" font-weight="600" fill="#b5d3cf" text-anchor="middle">fresh loss</text><text x="800" y="370" font-size="15" font-weight="700" fill="#d4b02e" text-anchor="end">“Why don’t they come?”</text><text x="590" y="370" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="90" y="370" font-size="15" font-weight="600" fill="#b5d3cf" text-anchor="middle">opening</text><rect x="30" y="462" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="495.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ending: the repeated question “Why don’t they come?”</text><text x="48" y="524.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Helplessness rather than resolution: his dependence on others is the final form of what the</text><text x="48" y="546.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">war has taken.</text>
</svg>