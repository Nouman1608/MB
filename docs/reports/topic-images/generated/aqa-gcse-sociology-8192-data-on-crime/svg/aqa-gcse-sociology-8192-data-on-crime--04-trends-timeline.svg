<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Trends in crime figures, in outline</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">England and Wales</text>
<line x1="50" y1="260" x2="860" y2="260" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="120" cy="260" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="300" cy="260" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="260" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="620" cy="260" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="700" cy="260" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="790" cy="260" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="120" y1="250" x2="155" y2="210" stroke="#4a5568" stroke-width="2"/><rect x="30" y="112" width="250" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="138" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">1982</text><text x="44" y="162" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Victim survey begins as the</text><text x="44" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">British Crime Survey</text><line x1="470" y1="250" x2="450" y2="210" stroke="#4a5568" stroke-width="2"/><rect x="325" y="112" width="250" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="339" y="138" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Over two decades</text><text x="339" y="162" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Big falls in many crimes,</text><text x="339" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">such as burglary and vehicle</text><text x="339" y="202" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">crime</text><line x1="700" y1="250" x2="745" y2="210" stroke="#4a5568" stroke-width="2"/><rect x="620" y="112" width="250" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="634" y="138" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Mid-2010s</text><text x="634" y="162" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">CSEW adds fraud and computer</text><text x="634" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">misuse: among the most</text><text x="634" y="202" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">common crimes</text><line x1="300" y1="270" x2="155" y2="310" stroke="#4a5568" stroke-width="2"/><rect x="30" y="310" width="250" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="44" y="336" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Mid-1990s</text><text x="44" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">CSEW estimates of crime peak</text><line x1="620" y1="270" x2="450" y2="310" stroke="#4a5568" stroke-width="2"/><rect x="325" y="310" width="250" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="339" y="336" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">2012</text><text x="339" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Renamed the Crime Survey for</text><text x="339" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">England and Wales</text><line x1="790" y1="270" x2="745" y2="310" stroke="#4a5568" stroke-width="2"/><rect x="620" y="310" width="250" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="634" y="336" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Later 2010s</text><text x="634" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Police recorded crime rises,</text><text x="634" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">partly better recording</text><rect x="30" y="426" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="61" cy="456.39" r="4.5" fill="#8a6d0d"/><text x="74" y="462" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Recorded offending is concentrated among young people and men</text><circle cx="61" cy="486.39" r="4.5" fill="#8a6d0d"/><text x="74" y="492" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">In the exam you will usually be given the data: read it accurately</text>
</svg>