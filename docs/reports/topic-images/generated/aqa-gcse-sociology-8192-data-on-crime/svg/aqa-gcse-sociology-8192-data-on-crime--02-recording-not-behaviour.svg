<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A rise in recorded crime is not proof of more crime</text>

<rect x="330" y="116" width="240" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Recorded crime</text><text x="450" y="172" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">figures change</text><rect x="30" y="250" width="198" height="74" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="129" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Counting rules</text><text x="129" y="306" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">change</text><line x1="129" y1="246" x2="375" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="244" y="250" width="198" height="74" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="343" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Recording practice</text><text x="343" y="306" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">changes</text><line x1="343" y1="246" x2="425" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="458" y="250" width="198" height="74" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="557" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Police priorities</text><text x="557" y="306" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">change</text><line x1="557" y1="246" x2="475" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="672" y="250" width="198" height="74" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="771" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The law</text><text x="771" y="306" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">changes</text><line x1="771" y1="246" x2="525" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="344" width="840" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="384" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">…even when there is no change in how people actually behave</text><rect x="30" y="428" width="840" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="464" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example</text><circle cx="61" cy="487.39" r="4.5" fill="#8a6d0d"/><text x="74" y="493" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">In 2014 the UK Statistics Authority withdrew the National Statistics designation from</text><text x="74" y="515" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">police recorded crime, over concerns about the quality of recording</text><circle cx="61" cy="539.39" r="4.5" fill="#8a6d0d"/><text x="74" y="545" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Police recorded crime rose in the later 2010s; the ONS linked this partly to better</text><text x="74" y="567" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recording and more willingness to report</text>
</svg>