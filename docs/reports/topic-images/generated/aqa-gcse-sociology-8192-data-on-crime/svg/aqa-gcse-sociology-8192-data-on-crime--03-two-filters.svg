<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two filters create the dark figure</text>

<rect x="250" y="112" width="400" height="62" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Offence committed</text><line x1="450" y1="178" x2="450" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M330,226 L570,226 L520,276 L380,276 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Filter 1: reported?</text><line x1="450" y1="280" x2="450" y2="320" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="230" y="324" width="440" height="62" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="363" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Reported to the police</text><line x1="450" y1="390" x2="450" y2="434" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M330,438 L570,438 L520,488 L380,488 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="470" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Filter 2: recorded?</text><line x1="450" y1="492" x2="450" y2="532" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="260" y="536" width="380" height="62" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="575" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">In the official statistics</text><line x1="574" y1="251" x2="640" y2="251" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="646" y="192" width="228" height="126" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="660" y="218" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Lost if the victim…</text><circle cx="667" cy="239.05" r="4.5" fill="#2e6b62"/><text x="680" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">does not know</text><circle cx="667" cy="261.05" r="4.5" fill="#2e6b62"/><text x="680" y="266" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">does not care</text><circle cx="667" cy="283.05" r="4.5" fill="#2e6b62"/><text x="680" y="288" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">is afraid</text><circle cx="667" cy="305.05" r="4.5" fill="#2e6b62"/><text x="680" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">does not trust police</text><line x1="574" y1="463" x2="640" y2="463" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="646" y="412" width="228" height="106" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="660" y="438" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Lost because of…</text><circle cx="667" cy="459.05" r="4.5" fill="#2e6b62"/><text x="680" y="464" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">police discretion</text><circle cx="667" cy="481.05" r="4.5" fill="#2e6b62"/><text x="680" y="486" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lack of evidence</text><circle cx="667" cy="503.05" r="4.5" fill="#2e6b62"/><text x="680" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">recording rules</text><rect x="30" y="214" width="250" height="74" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="46" y="244" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Victim surveys</tspan> reach some</text><text x="46" y="265" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crime lost here</text><line x1="282" y1="251" x2="326" y2="251" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="104" width="196" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="42" y="130" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Self-report studies</tspan></text><text x="42" y="150" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reach offending never</text><text x="42" y="170" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">detected</text><line x1="228" y1="143" x2="246" y2="143" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="450" y="636" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">No source measures the whole dark figure.</text>
