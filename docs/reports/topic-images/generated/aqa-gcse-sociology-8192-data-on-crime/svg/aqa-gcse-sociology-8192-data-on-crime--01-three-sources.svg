<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three sources of data on crime</text>

<rect x="168" y="104" width="228.66666666666666" height="64" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="282.3333333333333" y="140.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Police recorded crime</text><rect x="404.66666666666663" y="104" width="228.66666666666666" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="519" y="140.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Victim surveys (CSEW)</text><rect x="641.3333333333333" y="104" width="228.66666666666666" height="64" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="755.6666666666666" y="140.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-report studies</text><rect x="30" y="176" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="227.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Who or what</text><rect x="168" y="176" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crimes <tspan font-weight="700">reported</tspan> to (or</text><text x="182" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">found by) police and then</text><text x="182" y="248.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">recorded</tspan></text><rect x="404.66666666666663" y="176" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People asked as <tspan font-weight="700">victims</tspan>:</text><text x="418.66666666666663" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crimes in the past twelve</text><text x="418.66666666666663" y="248.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">months</text><rect x="641.3333333333333" y="176" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="206.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People asked as</text><text x="655.3333333333333" y="227.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">offenders</tspan>: what they have</text><text x="655.3333333333333" y="248.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">done, caught or not</text><rect x="30" y="277" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="328.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How</text><rect x="168" y="277" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Home Office counting</text><text x="182" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rules; published by the</text><text x="182" y="349.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ONS; secondary data</text><rect x="404.66666666666663" y="277" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large random sample of</text><text x="418.66666666666663" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">households; quantitative;</text><text x="418.66666666666663" y="349.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">since 1982</text><rect x="641.3333333333333" y="277" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Anonymous questionnaires</text><text x="655.3333333333333" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or interviews, often of</text><text x="655.3333333333333" y="349.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">young people</text><rect x="30" y="378" width="130" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="440.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Useful for</text><rect x="168" y="378" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="408.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">National trends; crimes</text><text x="182" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">almost always reported,</text><text x="182" y="450.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such as homicide and</text><text x="182" y="471.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vehicle theft</text><rect x="404.66666666666663" y="378" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="408.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unreported crime;</text><text x="418.66666666666663" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">long-term trends</text><text x="418.66666666666663" y="450.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unaffected by police</text><text x="418.66666666666663" y="471.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recording</text><rect x="641.3333333333333" y="378" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="408.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hidden offending; testing</text><text x="655.3333333333333" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">who really commits crime</text><rect x="30" y="500" width="130" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="562.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Misses</text><rect x="168" y="500" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unreported and unrecorded</text><text x="182" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crime; changes with</text><text x="182" y="572.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">counting rules</text><rect x="404.66666666666663" y="500" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Corporate crime,</text><text x="418.66666666666663" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">homicide, crimes against</text><text x="418.66666666666663" y="572.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">businesses; relies on</text><text x="418.66666666666663" y="593.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">memory</text><rect x="641.3333333333333" y="500" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Serious crimes; white</text><text x="655.3333333333333" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collar crime; people may</text><text x="655.3333333333333" y="572.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lie or exaggerate</text>
</svg>