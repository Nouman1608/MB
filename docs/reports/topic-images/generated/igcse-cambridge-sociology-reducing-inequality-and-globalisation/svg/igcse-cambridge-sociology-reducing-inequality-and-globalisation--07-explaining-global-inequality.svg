<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 613" width="900" height="613" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="613" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What explains global inequality?</text>

<rect x="30" y="110" width="260" height="300" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="610" y="110" width="260" height="300" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="150" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Poorer countries</text><text x="740" y="150" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Richer countries</text><line x1="300" y1="220" x2="600" y2="220" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="208" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cheap labour</text><text x="450" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Marxist view</text><line x1="300" y1="290" x2="600" y2="290" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="278" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Raw materials</text><text x="450" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Marxist view; colonialism</text><line x1="300" y1="360" x2="600" y2="360" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="348" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Profit</text><text x="450" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Marxist view</text><text x="160" y="260" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">lasting</text><text x="160" y="284" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">disadvantage</text><text x="740" y="260" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">wealth</text><text x="740" y="284" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">moves here</text><rect x="30" y="430" width="410" height="153" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="463" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">COLONIALISM</text><text x="50" y="488.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Extracted resources</text><text x="50" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shaped economies around exports, leaving</text><text x="50" y="537.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lasting disadvantage.</text><rect x="460" y="430" width="410" height="153" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="463" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FEMINIST IDEAS OF PATRIARCHY</text><text x="480" y="488.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Women do much of the world’s work</text><text x="480" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">but own a small share of its property;</text><text x="480" y="537.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">globalisation may increase exploitation of</text><text x="480" y="558.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">women’s labour.</text>
</svg>