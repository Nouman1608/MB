<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 437" width="900" height="437" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="437" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Global ecological issues hit poorer societies hardest</text>

<rect x="30" y="104" width="410" height="153" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TRANSNATIONAL COMPANIES</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Jobs and investment, but…</text><text x="50" y="190.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May exploit cheap labour, weak regulation</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and natural resources.</text><rect x="460" y="104" width="410" height="153" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CLIMATE CHANGE</text><text x="480" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Harms poorer countries most</text><text x="480" y="190.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Drought, flooding, crop failure, though</text><text x="480" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">richer countries have produced more</text><text x="480" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">emissions.</text><rect x="30" y="275" width="410" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="308" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">POLLUTION</text><text x="50" y="333.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mining, factories, waste</text><text x="50" y="361.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Often affects poor communities.</text><rect x="460" y="275" width="410" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="308" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">URBANISATION</text><text x="480" y="333.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rapid growth of cities</text><text x="480" y="361.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Informal settlements without safe water or</text><text x="480" y="382.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sanitation.</text>
</svg>