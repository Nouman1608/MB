<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Migration between societies</text>

<rect x="30" y="110" width="330" height="380" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="540" y="110" width="330" height="380" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="195" y="148" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Sending country</text><text x="195" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">emigration: leaving</text><text x="705" y="148" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">Receiving country</text><text x="705" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">immigration: moving in</text><text x="55" y="212" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">PUSH FACTORS</text><text x="55" y="238" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Poverty, unemployment</text><text x="55" y="263" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Conflict, persecution</text><text x="55" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Natural disasters</text><text x="565" y="212" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">PULL FACTORS</text><text x="565" y="238" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Jobs, higher wages</text><text x="565" y="263" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Safety, education</text><text x="565" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Family</text><line x1="55" y1="330" x2="335" y2="330" stroke="#2e6b62" stroke-width="1.5"/><line x1="565" y1="330" x2="845" y2="330" stroke="#8a6d0d" stroke-width="1.5"/><text x="55" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Receives remittances</text><text x="55" y="386" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">May lose skilled workers</text><text x="55" y="408" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">(brain drain)</text><text x="565" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gains workers and taxes</text><text x="565" y="386" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Greater cultural diversity</text><text x="565" y="420" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">Negative perceptions: stereotyping,</text><text x="565" y="441" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">scapegoating, racism, often</text><text x="565" y="462" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">amplified by media</text><line x1="370" y1="260" x2="530" y2="260" stroke="#1e2a44" stroke-width="8" marker-end="url(#ah)"/><text x="450" y="240" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">migrants</text><line x1="530" y1="380" x2="370" y2="380" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="450" y="366" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">remittances</text><rect x="30" y="510" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="543.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explain who gains and who loses: migrants, receiving countries and sending countries.</text><text x="50" y="565.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Outcomes are unequal.</text>
</svg>