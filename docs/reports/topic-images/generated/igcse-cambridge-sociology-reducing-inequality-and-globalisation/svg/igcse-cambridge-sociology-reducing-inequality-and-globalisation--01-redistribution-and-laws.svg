<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How laws move resources towards the poor</text>

<rect x="30" y="110" width="250" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="155" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">HIGHER EARNERS</text><text x="155" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Pay a higher</text><text x="155" y="196" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">percentage in tax</text><text x="155" y="225.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">progressive taxation</text><rect x="345" y="110" width="210" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="152" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">THE STATE</text><text x="450" y="179" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Collects tax</text><text x="450" y="205" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">revenue</text><line x1="286" y1="175" x2="338" y2="175" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="620" y="110" width="250" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="152" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">REDISTRIBUTION</text><text x="745" y="179" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Benefits paid to</text><text x="745" y="205" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">low-income groups</text><line x1="560" y1="175" x2="613" y2="175" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="30" y="260" width="410" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="293" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BRAZIL · FROM 2003</text><text x="50" y="318.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bolsa Família</text><text x="50" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Paid poor families on condition that</text><text x="50" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">children attended school and had health</text><text x="50" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">checks.</text><rect x="460" y="260" width="410" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="293" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INDIA · 2005</text><text x="480" y="318.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">National Rural Employment Guarantee</text><text x="480" y="342.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Act</text><text x="480" y="370.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Guaranteed rural households a number of days</text><text x="480" y="391.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of paid work each year.</text><text x="450" y="454" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Other legal tools</text><rect x="30" y="472" width="269.3333333333333" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="506.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Minimum wage</text><text x="50" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A legal floor for pay,</text><text x="50" y="555.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">protecting the lowest paid</text><rect x="315.3333333333333" y="472" width="269.3333333333333" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="506.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Equal opportunities</text><text x="335.3333333333333" y="530.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">laws</text><text x="335.3333333333333" y="558.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Discrimination by sex,</text><text x="335.3333333333333" y="579.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ethnicity, disability or</text><text x="335.3333333333333" y="600.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">age made illegal</text><rect x="600.6666666666666" y="472" width="269.3333333333333" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="506.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Other measures</text><text x="620.6666666666666" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Conditional cash transfers,</text><text x="620.6666666666666" y="555.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">job guarantees, quotas</text>
</svg>