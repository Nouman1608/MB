<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Have these attempts worked? Critics from both sides</text>

<line x1="450" y1="144" x2="60" y2="144" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="450" y1="144" x2="840" y2="144" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="350" y="122" width="200" height="44" rx="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="151" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Welfare state</text><text x="60" y="186" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Does too much</text><text x="840" y="186" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">Does too little</text><rect x="30" y="214" width="410" height="190" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="247" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NEW RIGHT</text><text x="50" y="274" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Creates an underclass</text><text x="50" y="303.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="303.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Generous welfare discourages work and</text><text x="66.15" y="325.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">family responsibility</text><text x="50" y="352.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="352.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Charles Murray, Losing Ground (1984)</text><rect x="460" y="214" width="410" height="190" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="247" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARXISTS</text><text x="480" y="274" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Only softens capitalism</text><text x="480" y="303.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="303.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Prevents revolt</text><text x="480" y="330.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="330.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Keeps workers healthy enough to be</text><text x="496.15" y="352.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">exploited</text><text x="480" y="379.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="379.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Wealth inequality remains</text><rect x="30" y="422" width="410" height="175" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="455" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CULTURE OF POVERTY / DEPENDENCY CULTURE</text><text x="50" y="481.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Blaming values</text><text x="50" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Oscar Lewis (1959, 1966): fatalism passed</text><text x="50" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between generations in poor families in</text><text x="50" y="551.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mexico and Puerto Rico. Dependency culture:</text><text x="50" y="572.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people come to rely on benefits.</text><rect x="460" y="422" width="410" height="175" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="455" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FEMINISTS</text><text x="480" y="481.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Laws treat symptoms, not</text><text x="480" y="506.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">patriarchy</text><text x="480" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Equality laws have not closed the gender pay</text><text x="480" y="555.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gap; women still do most unpaid care.</text><rect x="30" y="615" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="648.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Evaluation: supporters point to reduced absolute poverty and longer life expectancy;</text><text x="50" y="670.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">critics show the gap between rich and poor remains large.</text>
</svg>