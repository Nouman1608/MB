<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A welfare state, from cradle to grave</text>

<line x1="60" y1="180" x2="850" y2="180" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="60" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">cradle</text><text x="850" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">grave</text><circle cx="160" cy="180" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="156" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Childhood</text><circle cx="450" cy="180" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="156" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Working age</text><circle cx="740" cy="180" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="156" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Old age</text><rect x="30" y="230" width="260" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="264.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Free / universal</text><text x="50" y="288.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">education</text><text x="50" y="316.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Opportunity for social</text><text x="50" y="337.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mobility</text><line x1="160" y1="190" x2="160" y2="230" stroke="#1e2a44" stroke-width="2.5"/><rect x="320" y="230" width="260" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="264.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unemployment benefits</text><text x="340" y="292.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Protection from poverty</text><text x="340" y="313.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">when out of work</text><line x1="450" y1="190" x2="450" y2="230" stroke="#1e2a44" stroke-width="2.5"/><rect x="610" y="230" width="260" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="264.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pensions</text><text x="630" y="292.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Income in old age</text><line x1="740" y1="190" x2="740" y2="230" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="394" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Throughout life</text><rect x="30" y="410" width="269.3333333333333" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="444.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Free healthcare</text><text x="50" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Care regardless of ability</text><text x="50" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to pay</text><rect x="315.3333333333333" y="410" width="269.3333333333333" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="335.3333333333333" y="444.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Low-cost housing</text><text x="335.3333333333333" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Secure homes for low-income</text><text x="335.3333333333333" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">families</text><rect x="600.6666666666666" y="410" width="269.3333333333333" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620.6666666666666" y="444.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Universal basic income</text><text x="620.6666666666666" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Regular payment to all, no</text><text x="620.6666666666666" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conditions; trialled in</text><text x="620.6666666666666" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Finland, 2017–2018</text><rect x="30" y="557" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="590.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Britain: the Beveridge Report (1942) led to the National Health Service (1948) and national</text><text x="50" y="612.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">insurance benefits.</text>
</svg>