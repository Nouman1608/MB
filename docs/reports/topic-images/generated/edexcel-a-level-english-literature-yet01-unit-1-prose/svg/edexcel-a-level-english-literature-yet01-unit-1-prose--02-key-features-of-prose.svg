<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key features of prose fiction</text>

<rect x="30" y="116" width="201" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130.5" y="152.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Characterisation</text><rect x="243" y="116" width="201" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.5" y="152.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Form and structure</text><rect x="456" y="116" width="201" height="64" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="556.5" y="141.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Grammatical</text><text x="556.5" y="163.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">structure</text><rect x="669" y="116" width="201" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="769.5" y="141.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Imagery, symbols</text><text x="769.5" y="163.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">and motifs</text><rect x="30" y="192" width="201" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130.5" y="228.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Language choices</text><rect x="243" y="192" width="201" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.5" y="228.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Voice</text><rect x="456" y="192" width="201" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.5" y="228.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Theme</text><rect x="669" y="192" width="201" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="769.5" y="228.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Use of dialogue</text><rect x="30" y="282" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="315" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE MOST OVERLOOKED FEATURE</text><text x="50" y="342" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Grammatical structure</text><rect x="50" y="366" width="173" height="33" rx="16.5" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="136.5" y="388.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">sentence length</text><rect x="235" y="366" width="75" height="33" rx="16.5" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="272.5" y="388.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">tense</text><rect x="322" y="366" width="192" height="33" rx="16.5" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="418" y="388.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the second person</text><rect x="526" y="366" width="280" height="33" rx="16.5" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="666" y="388.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">how syntax creates a voice</text><rect x="30" y="438" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="471.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The specification: “it is the writers’ use of narrative that should be taught alongside the</text><text x="50" y="493.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">critical appreciation of the text and consideration of any contextual influences”.</text>
