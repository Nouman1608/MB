<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 846" width="900" height="846" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="846" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Responding to the statement</text>

<rect x="30" y="120" width="840" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE STATEMENT (ORIGINAL)</text><text x="50" y="180" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“Balram is more a product of his society than a villain.”</text><text x="450" y="238" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">You are not asked to agree; you are asked to test it.</text><line x1="62" y1="280" x2="62" y2="802" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="260" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="294.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Define the key terms</text><text x="128" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What does “a victim”, or “a product of his society”, mean in this novel?</text><circle cx="62" cy="303.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="312.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="355" width="762" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="389.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Take a position</text><text x="128" y="417.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">It can be partial: “largely true, but…”.</text><circle cx="62" cy="398.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="407.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="450" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="484.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Build evidence from across the novel</text><text x="128" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The opening, a turning point, the ending.</text><circle cx="62" cy="493.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="502.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="545" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="579.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Show how methods shape the issue</text><text x="128" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The reader’s view depends on how the story is told.</text><circle cx="62" cy="588.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="597.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="640" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="674.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Use context to explain</text><text x="128" y="702.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Why the novel presents the issue this way.</text><circle cx="62" cy="683.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="692.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="108" y="735" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="769.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conclude with a judgement</text><text x="128" y="797.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Answer the statement directly.</text><circle cx="62" cy="778.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="787.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>