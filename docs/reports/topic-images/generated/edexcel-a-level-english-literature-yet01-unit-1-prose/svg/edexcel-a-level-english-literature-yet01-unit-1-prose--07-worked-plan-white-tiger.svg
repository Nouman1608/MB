<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 834" width="900" height="834" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="834" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked plan: testing a statement on The White Tiger</text>

<rect x="30" y="118" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="151" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THESIS</text><text x="50" y="181.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The novel invites the reader to see Balram as a product of a corrupt system, but his own</text><text x="50" y="203.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">confident narration makes that view harder to accept.</text><line x1="70" y1="268" x2="830" y2="268" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="70" y="300" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">product of his society</text><text x="830" y="300" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">villain</text><circle cx="133.2" cy="268" r="15" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="133.2" y="273.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="306" cy="268" r="15" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="306" y="273.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="219.6" cy="268" r="15" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="219.6" y="273.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="594" cy="268" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="594" y="273.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="702" cy="268" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="702" y="273.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="80" y="322" width="790" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="92" y="348.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The “Darkness” and the “Light”</text><text x="92" y="376.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Village poverty and servitude explain, but do not excuse, what follows.</text><circle cx="50" cy="357.5" r="17" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="50" y="363.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="756" y="332" width="104" height="31" rx="15.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="808" y="352.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2 + AO3</text><rect x="80" y="401" width="790" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="92" y="427.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Rooster Coop metaphor</text><text x="92" y="455.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The system keeps servants loyal; he presents the murder as escape.</text><circle cx="50" cy="436.5" r="17" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="50" y="442.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="756" y="411" width="104" height="31" rx="15.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="808" y="431.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2 + AO3</text><rect x="80" y="480" width="790" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="92" y="506.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The hit-and-run and forced confession</text><text x="92" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The clearest evidence that the powerful use the poor.</text><circle cx="50" cy="515.5" r="17" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="50" y="521.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="808" y="490" width="52" height="31" rx="15.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="834" y="510.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><rect x="80" y="559" width="790" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="92" y="585.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Form: letters to a foreign leader</text><text x="92" y="613.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He performs success, so he is a less reliable witness to his own innocence.</text><circle cx="50" cy="594.5" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="50" y="600.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="808" y="569" width="52" height="31" rx="15.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="834" y="589.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><rect x="80" y="638" width="790" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="92" y="664.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The ending</text><text x="92" y="692.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Entrepreneur in Bangalore; discomfort at his lack of remorse.</text><circle cx="50" cy="673.5" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="50" y="679.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="808" y="648" width="52" height="31" rx="15.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="834" y="668.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><rect x="30" y="725" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="758" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONCLUSION</text><text x="50" y="784.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Both: the society creates him, but the narration makes us judge him</text>
</svg>