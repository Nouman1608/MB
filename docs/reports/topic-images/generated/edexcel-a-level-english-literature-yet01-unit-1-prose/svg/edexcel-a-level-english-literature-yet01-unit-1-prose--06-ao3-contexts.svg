<rect width="900" height="722" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">AO3: context for post-2000 novels</text>

<text x="30" y="122" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Context usually means contemporary concerns</text><rect x="30" y="138" width="284" height="32" rx="16" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="172" y="159.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">globalisation and inequality</text><rect x="324" y="138" width="238" height="32" rx="16" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="443" y="159.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">migration and belonging</text><rect x="572" y="138" width="228" height="32" rx="16" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="686" y="159.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">religion and authority</text><rect x="30" y="180" width="192" height="32" rx="16" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="126" y="201.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">political violence</text><rect x="232" y="180" width="238" height="32" rx="16" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="351" y="201.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">how stories shape truth</text><rect x="30" y="236" width="210" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="266" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Novel</text><rect x="240" y="236" width="630" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="252" y="266" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Contexts worth knowing</text><rect x="30" y="282" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="307.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Brooklyn</text><rect x="240" y="282" width="630" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="307.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Irish emigration to the United States in the 1950s; Catholic community</text><text x="252" y="328.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">life; women’s work and marriage</text><rect x="30" y="346" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="371.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The Kite Runner</text><rect x="240" y="346" width="630" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="252" y="371.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Afghanistan from the monarchy to the Soviet invasion and Taliban rule;</text><text x="252" y="392.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pashtun and Hazara division; the Afghan diaspora in the United States</text><rect x="30" y="410" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="435.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Life of Pi</text><rect x="240" y="410" width="630" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="435.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Religious pluralism; zoos and the human relationship with animals;</text><text x="252" y="456.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">storytelling, faith and truth</text><rect x="30" y="474" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="499.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Purple Hibiscus</text><rect x="240" y="474" width="630" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="252" y="499.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Post-colonial Nigeria; political instability and military rule;</text><text x="252" y="520.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Catholicism and Igbo tradition</text><rect x="30" y="538" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="563.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The White Tiger</text><rect x="240" y="538" width="630" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="563.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">India’s economic growth and the outsourcing industry; class and caste;</text><text x="252" y="584.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">servants and masters; corruption</text><rect x="30" y="618" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="651.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Context is strongest when it explains a choice: why a novel set in the past might speak to</text><text x="50" y="673.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">readers in the 2000s, or how a narrator’s position in society shapes what he can say.</text>
</svg>