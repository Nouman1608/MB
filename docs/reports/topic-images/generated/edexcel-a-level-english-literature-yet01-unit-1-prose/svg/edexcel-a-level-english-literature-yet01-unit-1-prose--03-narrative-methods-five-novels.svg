<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Narrative methods in the five novels</text>

<rect x="30" y="116" width="190" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Novel</text><rect x="220" y="116" width="340" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="232" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Narrative method</text><rect x="560" y="116" width="310" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="572" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Why it matters</text><rect x="30" y="162" width="190" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="187.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Brooklyn</text><rect x="220" y="162" width="340" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="187.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Restrained third person, closely tied</text><text x="232" y="208.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to Eilis’s perception</text><rect x="560" y="162" width="310" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="187.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Feelings implied, not stated:</text><text x="572" y="208.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">silences and omissions carry</text><text x="572" y="229.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">meaning</text><rect x="30" y="247" width="190" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="272.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The Kite Runner</text><rect x="220" y="247" width="340" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="272.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">First-person retrospective narration</text><text x="232" y="293.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by Amir</text><rect x="560" y="247" width="310" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="272.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The adult judges his younger self;</text><text x="572" y="293.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">guilt shapes what he tells and</text><text x="572" y="314.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">when</text><rect x="30" y="332" width="190" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="357.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Life of Pi</text><rect x="220" y="332" width="340" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="357.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A frame with an author figure, Pi’s</text><text x="232" y="378.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">first-person story, and a final</text><text x="232" y="399.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interview offering a second version</text><rect x="560" y="332" width="310" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="357.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The structure asks the reader to</text><text x="572" y="378.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">choose between stories</text><rect x="30" y="417" width="190" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="442.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Purple Hibiscus</text><rect x="220" y="417" width="340" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="442.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kambili’s first person; opens on Palm</text><text x="232" y="463.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sunday, moves back to the months</text><text x="232" y="484.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">before, then forward to the present</text><rect x="560" y="417" width="310" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="442.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A quiet, constrained voice that</text><text x="572" y="463.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">changes as she does</text><rect x="30" y="502" width="190" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="527.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The White Tiger</text><rect x="220" y="502" width="340" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="527.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Balram’s letters to the Chinese</text><text x="232" y="548.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Premier over several nights</text><rect x="560" y="502" width="310" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="527.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A confident, comic, unreliable</text><text x="572" y="548.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">voice addressing an outsider</text>
</svg>