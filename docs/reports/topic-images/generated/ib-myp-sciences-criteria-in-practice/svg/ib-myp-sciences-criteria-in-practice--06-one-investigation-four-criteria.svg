<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One investigation, four criteria</text>

<circle cx="450" cy="430" r="120" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="416" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">One practical</text><text x="450" y="444" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">investigation</text><rect x="40" y="120" width="340" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="180" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="190.08" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="135" y="174" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">the scientific concept</text><text x="135" y="200" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">behind it</text><rect x="520" y="120" width="340" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="570" cy="180" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="570" y="190.08" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="615" y="174" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">the design of</text><text x="615" y="200" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">the investigation</text><rect x="40" y="620" width="340" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="680" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="690.08" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="135" y="674" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">processing and evaluating</text><text x="135" y="700" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">the data</text><rect x="520" y="620" width="340" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="570" cy="680" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="570" y="690.08" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="615" y="674" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">its wider scientific or</text><text x="615" y="700" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">real-world significance</text><line x1="365" y1="345" x2="300" y2="245" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="535" y1="345" x2="600" y2="245" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="365" y1="515" x2="300" y2="615" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="535" y1="515" x2="600" y2="615" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)" stroke-dasharray="9 7"/><text x="700" y="600" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">where relevant</text><text x="450" y="790" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Practise complete investigations, not each criterion in isolation.</text>
