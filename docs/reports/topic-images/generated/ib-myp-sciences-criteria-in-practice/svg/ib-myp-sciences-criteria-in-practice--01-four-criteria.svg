<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 815" width="900" height="815" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="815" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four MYP Sciences criteria</text>

<rect x="30" y="110" width="840" height="138" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="88" cy="179" r="32" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="88" y="190.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="145" y="154" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Knowing and understanding</text><text x="145" y="180" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">top-band evidence:</text><text x="145" y="206" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Apply knowledge to explain and judge in an unfamiliar context, not just</text><text x="145" y="228" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">recall a definition.</text><rect x="30" y="260" width="840" height="138" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="88" cy="329" r="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="88" y="340.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="145" y="304" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Inquiring and designing</text><text x="145" y="330" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">top-band evidence:</text><text x="145" y="356" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Write your own testable question and hypothesis, choose variables and</text><text x="145" y="378" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">justify the method.</text><rect x="30" y="410" width="840" height="138" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="88" cy="479" r="32" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="88" y="490.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="145" y="454" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Processing and evaluating</text><text x="145" y="480" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">top-band evidence:</text><text x="145" y="506" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Process and interpret data accurately; give a specific limitation and a</text><text x="145" y="528" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">specific improvement.</text><rect x="30" y="560" width="840" height="138" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="88" cy="629" r="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="88" y="640.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="145" y="604" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Reflecting on the impacts of science</text><text x="145" y="630" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">top-band evidence:</text><text x="145" y="656" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Weigh a real benefit against a real risk, cite sources and reach a</text><text x="145" y="678" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reasoned judgement.</text><rect x="30" y="715" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="758" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Same descriptors for discrete, modular and integrated courses.</text>
</svg>