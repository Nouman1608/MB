y="190" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">Weigh both sides, then reach</text><text x="450" y="216" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">a reasoned evaluative judgement.</text><text x="450" y="246" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">varied scientific language, sources documented</text><line x1="450" y1="262" x2="450" y2="316" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="660" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">Only benefits, only risks, or pure description cannot reach the top band.</text>
