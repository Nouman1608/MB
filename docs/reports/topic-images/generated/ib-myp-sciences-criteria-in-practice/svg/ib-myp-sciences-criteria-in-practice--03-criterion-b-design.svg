<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="840" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criterion B: design your own investigation</text>

<rect x="30" y="110" width="840" height="120" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Lower band: follow a worksheet</text><text x="52" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fixed instructions to measure how temperature affects reaction rate;</text><text x="52" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the student makes no design decisions.</text><rect x="30" y="250" width="840" height="560" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="288" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Top band: the student designs it</text><rect x="60" y="310" width="780" height="86" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><circle cx="98" cy="353" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="98" y="360.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="135" y="346" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Research question</text><text x="135" y="374" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How does the concentration of a reactant affect reaction rate?</text><rect x="60" y="410" width="780" height="86" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><circle cx="98" cy="453" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="98" y="460.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="135" y="446" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Hypothesis</text><text x="135" y="474" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a testable prediction the student writes</text><rect x="60" y="510" width="780" height="170" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><circle cx="98" cy="553" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="98" y="560.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="135" y="546" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Variables</text><rect x="135" y="570" width="215" height="92" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="242.5" y="621.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="242" y="602" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Independent</text><text x="242" y="628" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">concentration</text><text x="242" y="648" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(what you change)</text><rect x="365" y="570" width="215" height="92" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="472.5" y="621.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="472" y="602" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Dependent</text><text x="472" y="628" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">reaction rate</text><text x="472" y="648" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(what you measure)</text><rect x="595" y="570" width="230" height="92" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="710" y="621.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="710" y="602" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Controlled</text><text x="710" y="628" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">everything else kept</text><text x="710" y="648" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the same, with reasons</text><rect x="60" y="694" width="780" height="86" rx="12" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><circle cx="98" cy="737" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="98" y="744.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="135" y="730" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Method, justified</text><text x="135" y="758" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">explain why each choice suits the question, before starting</text>
</svg>