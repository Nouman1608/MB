<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criterion A: apply, don’t just name</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M170,200 C170,170 270,170 270,200 L270,236 L170,236 Z" fill="#efc9a8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="150" y="236" width="140" height="22" rx="11" fill="#c7cdd6" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="312" cy="247" rx="28" ry="18" fill="#c7cdd6" stroke="#1e2a44" stroke-width="2.5"/><path d="M570,200 C570,170 670,170 670,200 L670,236 L570,236 Z" fill="#efc9a8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="550" y="236" width="140" height="22" rx="11" fill="#c79a62" stroke="#8a6d0d" stroke-width="2.5"/><ellipse cx="712" cy="247" rx="28" ry="18" fill="#c79a62" stroke="#8a6d0d" stroke-width="2.5"/><text x="220" y="192" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">hand</text><text x="620" y="192" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">hand</text><text x="240" y="300" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Metal spoon</text><text x="640" y="300" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Wooden spoon</text><line x1="185" y1="214" x2="185" y2="262" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="220" y1="214" x2="220" y2="262" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="255" y1="214" x2="255" y2="262" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="620" y1="214" x2="620" y2="256" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><text x="240" y="330" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">heat leaves the hand fast</text><text x="640" y="330" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">heat leaves the hand slowly</text><text x="240" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">feels colder</text><text x="640" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">feels warmer</text><rect x="130" y="390" width="640" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="450" y="425" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Actual temperature: the same (room temperature)</text><text x="450" y="460" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">Perceived temperature: different, because of conduction rate</text><rect x="30" y="530" width="410" height="130" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="566" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Lower band</text><text x="52" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Names “thermal conductivity”</text><text x="52" y="618" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and stops there.</text><rect x="460" y="530" width="410" height="130" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="566" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Top band</text><text x="482" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Uses conduction rate to explain</text><text x="482" y="618" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the feeling, then judges actual</text><text x="482" y="640" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">versus perceived temperature.</text>
</svg>