<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criterion C: process, then evaluate</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="130" y1="450" x2="490" y2="450" stroke="#1e2a44" stroke-width="3"/><line x1="130" y1="450" x2="130" y2="180" stroke="#1e2a44" stroke-width="3"/><text x="310" y="490" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">concentration of reactant</text><text x="108" y="315" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 108 315)">reaction rate</text><line x1="158.8" y1="425.7" x2="464.8" y2="207" stroke="#2e6b62" stroke-width="3"/><path d="M177,397.1 L191,411.1 M191,397.1 L177,411.1" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M238.2,353.9 L252.2,367.9 M252.2,353.9 L238.2,367.9" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M303,316.1 L317,330.1 M317,316.1 L303,330.1" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M367.8,264.79999999999995 L381.8,278.79999999999995 M381.8,264.79999999999995 L367.8,278.79999999999995" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M432.6,221.60000000000002 L446.6,235.60000000000002 M446.6,221.60000000000002 L432.6,235.60000000000002" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="150" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Present: labelled graph</text><text x="540" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Then, in order:</text><circle cx="558" cy="200" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="558" y="206.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="588" y="207" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Identify the trend</text><circle cx="558" cy="295" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="558" y="301.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="588" y="302" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Explain it with a</text><circle cx="558" cy="390" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="558" y="396.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="588" y="397" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate the method</text><text x="588" y="328" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">concept, e.g. collision theory</text><text x="588" y="423" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a specific limitation and</text><text x="588" y="445" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a matching improvement</text><text x="588" y="233" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">state what the data show</text><rect x="30" y="530" width="410" height="170" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="566" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Generic: not credited</text><text x="52" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Improvement: “use more trials”.</text><text x="52" y="618" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="52" y="640" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">It names no actual problem with</text><text x="52" y="662" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">this method.</text><rect x="460" y="530" width="410" height="170" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="566" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Specific: top band</text><text x="482" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limitation: the colour-change</text><text x="482" y="618" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">endpoint was judged by eye,</text><text x="482" y="640" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adding timing error.</text><text x="482" y="662" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Improvement: use a colorimeter to</text><text x="482" y="684" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">detect the endpoint automatically.</text>
</svg>