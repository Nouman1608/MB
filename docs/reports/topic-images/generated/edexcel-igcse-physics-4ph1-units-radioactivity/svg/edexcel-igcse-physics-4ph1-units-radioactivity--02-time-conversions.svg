<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seconds, minutes and hours</text>

<rect x="30" y="110" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="170" width="180" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="160" y="222" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">1 h</text><rect x="360" y="170" width="180" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="222" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">60 min</text><rect x="650" y="170" width="180" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="222" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">3600 s</text><text x="305" y="216" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><text x="595" y="216" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><text x="450" y="300" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">minutes × 60 → seconds;  hours × 60 → minutes</text><text x="450" y="335" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">60, not 100</text><rect x="30" y="390" width="840" height="220" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Converting a count rate</text><rect x="60" y="450" width="300" height="70" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="494" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">counts per second</text><rect x="540" y="450" width="300" height="70" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="690" y="494" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">counts per minute</text><line x1="370" y1="470" x2="530" y2="470" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="460" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">× 60</text><line x1="530" y1="504" x2="370" y2="504" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="450" y="530" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">÷ 60</text><text x="450" y="580" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Per minute is always the bigger number: a minute holds 60 seconds.</text><rect x="30" y="630" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="668" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two rules</text><text x="60" y="702" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">1. Elapsed time and half-life in the same unit before dividing.</text><text x="60" y="732" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">2. Reading and background per the same time unit before subtracting.</text>
</svg>