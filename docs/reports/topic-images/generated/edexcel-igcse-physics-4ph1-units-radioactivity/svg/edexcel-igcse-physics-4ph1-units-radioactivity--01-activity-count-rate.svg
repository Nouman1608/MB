nd="url(#ahR)"/><line x1="232.39600199952386" y1="296.1199000333274" x2="241.9800099976193" y2="200.59950016663691" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="241.35213582768398" y1="298.8545746755991" x2="286.76067913841985" y2="214.2728733779956" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="248.5800098834467" y1="304.808448639753" x2="322.9000494172335" y2="244.04224319876496" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="252.9792458626637" y1="313.0750985867485" x2="344.8962293133185" y2="285.3754929337423" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><circle cx="230" cy="320" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="230" y="480" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">source: emits in all directions</text><rect x="560" y="297" width="150" height="46" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="560" y="297" width="28" height="46" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="635" y="280" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">G-M tube</text><path d="M710,320 Q760,320 770,300" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="760" y="250" width="90" height="60" rx="6" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><rect x="768" y="258" width="74" height="32" rx="3" fill="#e9f5ec" stroke="#1e2a44" stroke-width="1"/><text x="805" y="281" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0420</text><line x1="252" y1="312" x2="556" y2="312" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 5"/><line x1="252" y1="328" x2="556" y2="328" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 5"/><text x="430" y="300" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">only a small fraction</text><text x="640" y="390" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">+ background radiation</text><line x1="640" y1="372" x2="640" y2="352" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="550" width="410" height="220" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="590" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Activity</text><text x="60" y="626" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">decays per second in the source</text><text x="60" y="656" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">1 Bq = 1 decay per second</text><text x="60" y="686" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">1 kBq = 1000 Bq</text><text x="60" y="716" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">1 MBq = 1 000 000 Bq</text><rect x="460" y="550" width="410" height="220" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="590" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Count rate</text><text x="490" y="626" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">detected by the G-M tube</text><text x="490" y="656" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">counts per second or per minute,</text><text x="490" y="686" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">not Bq; normally much less</text><text x="490" y="716" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">than the activity</text><text x="450" y="795" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Both halve in one half-life, so either can be used to find a half-life.</text>
</svg>