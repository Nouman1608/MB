"2.5" marker-end="url(#ah)"/><line x1="130" y1="660" x2="130" y2="450" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="450" y="694" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">distance from source / cm</text><text x="108" y="555" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 108 555)">count rate</text><path d="M134,480 L250,490 Q330,510 370,620 L750,620" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="130" y1="620" x2="750" y2="620" stroke="#4a5568" stroke-width="2" stroke-dasharray="7 6"/><text x="750" y="610" font-size="15" font-weight="600" fill="#4a5568" text-anchor="end">background level</text><text x="430" y="510" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">drops to background within a few cm:</text><text x="430" y="532" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">alpha has stopped in the air</text><text x="450" y="720" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Sketch only: shape, not data.</text>
