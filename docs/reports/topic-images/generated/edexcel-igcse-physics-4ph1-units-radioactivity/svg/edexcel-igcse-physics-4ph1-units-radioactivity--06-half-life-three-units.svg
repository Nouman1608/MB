roke="#8a6d0d" stroke-width="2.5"/><text x="165" y="458" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">5.0 h</text><rect x="345" y="410" width="210" height="76" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="458" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">300 min</text><rect x="630" y="410" width="210" height="76" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="735" y="458" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">18 000 s</text><text x="307" y="430" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">× 60</text><line x1="275" y1="448" x2="340" y2="448" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="592" y="430" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">× 60</text><line x1="560" y1="448" x2="625" y2="448" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="450" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The same half-life, written in three units.</text>
