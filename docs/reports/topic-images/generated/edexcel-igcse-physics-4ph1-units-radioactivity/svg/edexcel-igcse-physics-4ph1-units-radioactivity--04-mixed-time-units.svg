<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: hours and minutes</text>

<rect x="30" y="110" width="840" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Half-life 45 min, activity 3200 Bq. Find the activity 3.0 h later.</text><text x="60" y="188" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">elapsed time = 3.0 h = 3.0 × 60 = 180 min</text><text x="60" y="220" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">number of half-lives = 180 ÷ 45 = 4</text><rect x="30" y="300" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="90" y="370" width="90" height="190" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="135" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3200 Bq</text><text x="135" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">0 min</text><text x="215" y="520" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">÷ 2</text><rect x="250" y="465" width="90" height="95" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="295" y="455" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1600 Bq</text><text x="295" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">45 min</text><text x="375" y="520" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">÷ 2</text><rect x="410" y="512.5" width="90" height="47.5" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="455" y="502.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">800 Bq</text><text x="455" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">90 min</text><text x="535" y="520" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">÷ 2</text><rect x="570" y="536.25" width="90" height="23.75" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="615" y="526.25" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">400 Bq</text><text x="615" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">135 min</text><text x="695" y="520" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">÷ 2</text><rect x="730" y="548.125" width="90" height="11.875" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="775" y="538.125" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">200 Bq</text><text x="775" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">180 min</text><text x="450" y="616" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Bars to scale. 180 min = 3.0 h.</text><rect x="30" y="650" width="840" height="80" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="697" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">✗ 3.0 ÷ 45 mixes hours with minutes: a meaningless fraction</text>
</svg>