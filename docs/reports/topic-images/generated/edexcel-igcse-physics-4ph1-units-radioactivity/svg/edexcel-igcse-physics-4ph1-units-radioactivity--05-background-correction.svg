<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: correcting for background</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1260 counts in 3.0 minutes; background 0.40 counts per second</text><rect x="60" y="170" width="370" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="245" y="210" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1260 ÷ 3.0 = 420 counts/min</text><rect x="470" y="170" width="370" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="655" y="210" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">0.40 × 60 = 24 counts/min</text><text x="245" y="262" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">measured</text><text x="655" y="262" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">background, converted to per minute</text><text x="450" y="330" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Both now per minute, so they can be subtracted.</text><rect x="30" y="380" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="420" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">counts per minute (bars to scale)</text><rect x="60" y="440" width="641.1428571428571" height="50" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><rect x="701.1428571428571" y="440" width="38.85714285714286" height="50" rx="4" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="70" y="472" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">corrected 396</text><text x="750" y="472" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">420</text><text x="720.5714285714286" y="516" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">background 24</text><text x="60" y="576" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">420 − 24 = 396 counts/min</text><text x="840" y="576" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="end">396 ÷ 60 = 6.6 counts/s</text>
</svg>