<rect width="900" height="799" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Baron-Cohen et al. (2001): design and results</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">All participants were adults</text>
<rect x="30" y="124" width="410" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUASI-EXPERIMENT</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Compare four groups</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Asperger syndrome or high-functioning autism</text><text x="50" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">general population</text><text x="50" y="263.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">university students</text><text x="50" y="289.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="289.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">IQ-matched general population group</text><rect x="460" y="124" width="410" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CORRELATION</text><text x="480" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Eyes test score vs AQ</text><text x="480" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Autism Spectrum Quotient: a self-report</text><text x="480" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">questionnaire of autistic traits.</text><rect x="30" y="336" width="410" height="300" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="448.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RESULT 1</text><text x="50" y="481.9" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">The Asperger syndrome or</text><text x="50" y="505.9" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">high-functioning autism group scored</text><text x="50" y="529.9" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">significantly</tspan> <tspan font-weight="700" fill="#1e2a44">lower</tspan> than the other groups.</text><rect x="460" y="336" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="366" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULT 2: NEGATIVE CORRELATION</text><line x1="530" y1="576" x2="840" y2="576" stroke="#1e2a44" stroke-width="2.5"/><line x1="530" y1="396" x2="530" y2="576" stroke="#1e2a44" stroke-width="2.5"/><circle cx="554.8" cy="421.2" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="576.5" cy="435.6" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="592" cy="428.4" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="613.7" cy="450" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="632.3" cy="442.8" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="654" cy="468" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="672.6" cy="457.2" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="691.2" cy="482.4" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="709.8" cy="475.2" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="728.4" cy="496.8" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="747" cy="504" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="765.6" cy="514.8" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="787.3" cy="529.2" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="809" cy="540" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="641.6" cy="460.8" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="716" cy="489.6" r="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="685" y="604" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">AQ score (autistic traits)</text><text x="514" y="486" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 514 486)">Eyes test score</text><text x="850" y="626" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">illustrative points</text><rect x="30" y="658" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="692.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="721.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The revised test is a more sensitive measure of individual differences in <tspan font-weight="700" fill="#1e2a44">social</tspan> <tspan font-weight="700" fill="#1e2a44">sensitivity</tspan> among adults.</text><text x="50" y="742.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">But static photographs lack real social context, and the autism group was small.</text>
</svg>