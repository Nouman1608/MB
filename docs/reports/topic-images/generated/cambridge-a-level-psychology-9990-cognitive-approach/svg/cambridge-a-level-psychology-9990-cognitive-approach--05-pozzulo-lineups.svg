<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pozzulo et al.: target-present and target-absent line-ups</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Young children and adults identified cartoon and human target faces</text>
<rect x="30" y="124" width="410" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Target-present</text><text x="235" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the culprit is in the line-up</text><circle cx="100" cy="234" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M64,292 Q64,262 100,262 Q136,262 136,292 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="190" cy="234" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M154,292 Q154,262 190,262 Q226,262 226,292 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="280" cy="234" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M244,292 Q244,262 280,262 Q316,262 316,292 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="370" cy="234" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M334,292 Q334,262 370,262 Q406,262 406,292 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="460" y="124" width="410" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Target-absent</text><text x="665" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the culprit is not in the line-up</text><circle cx="530" cy="234" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M494,292 Q494,262 530,262 Q566,262 566,292 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="620" cy="234" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M584,292 Q584,262 620,262 Q656,262 656,292 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="710" cy="234" r="24" fill="#f6e3d8" stroke="#b5602e" stroke-width="4"/><path d="M674,292 Q674,262 710,262 Q746,262 746,292 Z" fill="#f6e3d8" stroke="#b5602e" stroke-width="4"/><circle cx="800" cy="234" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M764,292 Q764,262 800,262 Q836,262 836,292 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="350" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">gold = the target</text><text x="665" y="338" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">choosing anyone here</text><text x="665" y="360" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">is a false positive</text><rect x="30" y="406" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="440.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Result</text><text x="450" y="470.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Children made <tspan font-weight="700" fill="#1e2a44">more</tspan> <tspan font-weight="700" fill="#1e2a44">false</tspan> <tspan font-weight="700" fill="#1e2a44">positive</tspan> <tspan font-weight="700" fill="#1e2a44">responses</tspan> than adults in <tspan font-weight="700" fill="#1e2a44">target-absent</tspan> line-ups: they are more</text><text x="450" y="492.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">likely to pick an innocent person when the culprit is not there.</text><rect x="30" y="539" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="571" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="602.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cartoon and human faces tested whether face</text><text x="50" y="623.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">type mattered; identical line-ups gave</text><text x="50" y="644.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">standardisation.</text><rect x="457" y="539" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="571" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="602.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A face on a screen, with no threat or emotion, is</text><text x="477" y="623.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unlike witnessing a crime: low ecological validity.</text><text x="450" y="703.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Ethics: parental consent was needed, and children had to be protected from feeling they had "failed".</text>
</svg>