<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Label the route in every study</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Input, process and output in the three cognitive core studies</text>
<text x="342" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">INPUT</text><text x="543" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PROCESS</text><text x="765" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">OUTPUT</text><rect x="30" y="154" width="200" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="188.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Andrade</text><text x="44" y="215" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">universal process</text><rect x="262" y="154" width="160" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342" y="190.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">telephone</text><text x="342" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">message</text><rect x="458" y="154" width="170" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="543" y="190.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">attention and</text><text x="543" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">memory</text><rect x="660" y="154" width="210" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="765" y="190.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">names written down</text><text x="765" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and recalled</text><line x1="425" y1="197" x2="454" y2="197" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="631" y1="197" x2="656" y2="197" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="254" width="200" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="288.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Baron-Cohen et al.</text><text x="44" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">groups differ</text><rect x="262" y="254" width="160" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342" y="290.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">photograph of</text><text x="342" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">eyes</text><rect x="458" y="254" width="170" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="543" y="290.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">inferring a</text><text x="543" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">mental state</text><rect x="660" y="254" width="210" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="765" y="301.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the chosen word</text><line x1="425" y1="297" x2="454" y2="297" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="631" y1="297" x2="656" y2="297" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="354" width="200" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="388.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pozzulo et al.</text><text x="44" y="415" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">groups differ</text><rect x="262" y="354" width="160" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342" y="401.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a target face</text><rect x="458" y="354" width="170" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="543" y="390.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">encoding, later</text><text x="543" y="411.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">recognition</text><rect x="660" y="354" width="210" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="765" y="401.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the line-up decision</text><line x1="425" y1="397" x2="454" y2="397" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="631" y1="397" x2="656" y2="397" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="454" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="487.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Andrade studies a <tspan font-weight="700" fill="#1e2a44">universal</tspan> process (assumption 1); Baron-Cohen et al. and Pozzulo et al.</text><text x="450" y="509.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">compare groups who <tspan font-weight="700" fill="#1e2a44">differ</tspan> in processing (assumption 2).</text>
