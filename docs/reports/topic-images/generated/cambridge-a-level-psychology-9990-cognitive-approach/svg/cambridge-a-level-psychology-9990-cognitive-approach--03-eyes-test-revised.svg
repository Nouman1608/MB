<rect width="900" height="626" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Eyes test was revised</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Baron-Cohen et al. (2001)</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="278" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="204.87804878048783" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feature</text><rect x="234.87804878048783" y="124" width="307.31707317073176" height="48" fill="#f2e7b8"/><text x="248.87804878048783" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Original (1997)</text><rect x="542.1951219512196" y="124" width="327.8048780487805" height="48" fill="#b5d3cf"/><text x="556.1951219512196" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Revised (2001)</text><rect x="30" y="172" width="204.87804878048783" height="68" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Answer choices</text><rect x="234.87804878048783" y="172" width="307.31707317073176" height="68" fill="#ffffff"/><text x="248.87804878048783" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only two, often opposites: guessing</text><text x="248.87804878048783" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was easy</text><rect x="542.1951219512196" y="172" width="327.8048780487805" height="68" fill="#dce9e7"/><text x="556.1951219512196" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Four</tspan> mental-state words: the target</text><text x="556.1951219512196" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and three foils</text><line x1="30" y1="240" x2="870" y2="240" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="240" width="204.87804878048783" height="47" fill="#dce9e7"/><text x="44" y="266.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Number of items</text><rect x="234.87804878048783" y="240" width="307.31707317073176" height="47" fill="#f8faf9"/><text x="248.87804878048783" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Too few</text><rect x="542.1951219512196" y="240" width="327.8048780487805" height="47" fill="#dce9e7"/><text x="556.1951219512196" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">36</tspan> photographs of the eye region</text><line x1="30" y1="287" x2="870" y2="287" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="287" width="204.87804878048783" height="68" fill="#dce9e7"/><text x="44" y="313.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Range of scores</text><rect x="234.87804878048783" y="287" width="307.31707317073176" height="68" fill="#ffffff"/><text x="248.87804878048783" y="313.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many near the maximum: a <tspan font-weight="700">ceiling</tspan></text><text x="248.87804878048783" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">effect</tspan></text><rect x="542.1951219512196" y="287" width="327.8048780487805" height="68" fill="#dce9e7"/><text x="556.1951219512196" y="313.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Separates people in the general</text><text x="556.1951219512196" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">population better</text><line x1="30" y1="355" x2="870" y2="355" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="355" width="204.87804878048783" height="47" fill="#dce9e7"/><text x="44" y="381.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Vocabulary</text><rect x="234.87804878048783" y="355" width="307.31707317073176" height="47" fill="#f8faf9"/><text x="248.87804878048783" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">—</text><rect x="542.1951219512196" y="355" width="327.8048780487805" height="47" fill="#dce9e7"/><text x="556.1951219512196" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A <tspan font-weight="700">glossary</tspan> defines the words</text></g><line x1="234.87804878048783" y1="124" x2="234.87804878048783" y2="402" stroke="#c9d6d4" stroke-width="1.5"/><line x1="542.1951219512196" y1="124" x2="542.1951219512196" y2="402" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="278" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="424" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="464" width="260" height="90" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="130" cy="509" rx="38" ry="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="130" cy="509" r="11" fill="#1e2a44"/><path d="M86,482 Q130,468 174,482" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="250" cy="509" rx="38" ry="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="250" cy="509" r="11" fill="#1e2a44"/><path d="M206,482 Q250,468 294,482" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="190" y="578" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">eye region only</text><rect x="380" y="462" width="220" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="490" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">target word</text><rect x="620" y="462" width="220" height="44" rx="22" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="490" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">foil</text><rect x="380" y="520" width="220" height="44" rx="22" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="548" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">foil</text><rect x="620" y="520" width="220" height="44" rx="22" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="548" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">foil</text><text x="620" y="578" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">one item: choose the word that describes the mental state</text>
</svg>