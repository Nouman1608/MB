<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 984" width="900" height="984" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="984" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Andrade (2010): does doodling help?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Laboratory experiment, independent measures design</text>
<rect x="170" y="124" width="560" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">40 participants from a research panel</text><text x="450" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">had just finished another, unrelated study, so were likely to be bored</text><line x1="450" y1="218" x2="450" y2="270" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="278" width="560" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="312.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Monotonous mock telephone message, about 2.5</text><text x="450" y="336.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">minutes</text><text x="450" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">task: write down the names of people coming to a party</text><line x1="370" y1="396" x2="240" y2="438" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="530" y1="396" x2="660" y2="438" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="458" width="360" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="490" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DOODLING</text><text x="210" y="516.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Shaded printed squares and</text><text x="210" y="540.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">circles</text><rect x="510" y="458" width="360" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="690" y="502" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CONTROL</text><text x="690" y="528.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">No shading</text><line x1="240" y1="572" x2="240" y2="624" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="660" y1="572" x2="660" y2="624" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="632" width="560" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="666.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Surprise recall test</text><text x="450" y="695.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">names and places mentioned in the message</text><rect x="30" y="742" width="840" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="774" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULT: RECALL (control set to 100)</text><text x="230" y="816" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Control</text><rect x="250" y="792" width="300" height="36" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="562" y="817" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">100</text><text x="230" y="862" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Doodling</text><rect x="250" y="838" width="387" height="36" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="649" y="863" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">about 29% more</text><text x="450" y="922.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Doodlers were also more accurate on the monitoring task. Likely reason: doodling <tspan font-weight="700">reduces</tspan> <tspan font-weight="700">daydreaming</tspan> (not</text><text x="450" y="943.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">measured directly).</text>
</svg>