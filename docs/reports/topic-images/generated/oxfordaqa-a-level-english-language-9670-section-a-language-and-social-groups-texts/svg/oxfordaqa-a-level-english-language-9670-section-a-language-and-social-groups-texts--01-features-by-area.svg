<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What to look for in each credited area</text>

<rect x="30" y="112" width="410" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="112" width="410" height="50" rx="14" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="145" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Group rapport</text><circle cx="57" cy="193" r="4.5" fill="#2e6b62"/><text x="70" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in-group lexis: words, abbreviations,</text><text x="70" y="219" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nicknames</text><circle cx="57" cy="247" r="4.5" fill="#2e6b62"/><text x="70" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inclusive pronouns: “we”, “us”, “our lot”</text><circle cx="57" cy="280" r="4.5" fill="#2e6b62"/><text x="70" y="285" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shared references that presuppose knowledge</text><circle cx="57" cy="313" r="4.5" fill="#2e6b62"/><text x="70" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">back-channelling: “yeah”, “exactly”, “mm”</text><rect x="460" y="112" width="410" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="112" width="410" height="50" rx="14" fill="#d4b02e" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="145" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Power and status</text><circle cx="487" cy="193" r="4.5" fill="#2e6b62"/><text x="500" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conversational control: topics, questions,</text><text x="500" y="219" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interruptions, the floor</text><circle cx="487" cy="247" r="4.5" fill="#2e6b62"/><text x="500" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">forms of address: asymmetry signals</text><text x="500" y="273" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hierarchy</text><circle cx="487" cy="301" r="4.5" fill="#2e6b62"/><text x="500" y="306" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">imperatives, modals, high-certainty</text><text x="500" y="327" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">declaratives</text><circle cx="487" cy="355" r="4.5" fill="#2e6b62"/><text x="500" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">specialist lexis that displays expertise</text><rect x="30" y="388" width="410" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="388" width="410" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="421" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Identity and relationship</text><circle cx="57" cy="469" r="4.5" fill="#2e6b62"/><text x="70" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-reference and self-presentation</text><circle cx="57" cy="502" r="4.5" fill="#2e6b62"/><text x="70" y="507" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">politeness: positive and negative face</text><circle cx="57" cy="535" r="4.5" fill="#2e6b62"/><text x="70" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">register and variety: dialect, slang,</text><text x="70" y="561" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">professional</text><circle cx="57" cy="589" r="4.5" fill="#2e6b62"/><text x="70" y="594" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">phatic talk: “How was your weekend?”</text><rect x="460" y="388" width="410" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="388" width="410" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="421" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Play and performance</text><circle cx="487" cy="469" r="4.5" fill="#2e6b62"/><text x="500" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wordplay: puns, rhymes, misspellings,</text><text x="500" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">portmanteau</text><circle cx="487" cy="523" r="4.5" fill="#2e6b62"/><text x="500" y="528" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">banter and mock impoliteness</text><circle cx="487" cy="556" r="4.5" fill="#2e6b62"/><text x="500" y="561" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">performance: storytelling, voices,</text><text x="500" y="582" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exaggeration, timing</text><circle cx="487" cy="610" r="4.5" fill="#2e6b62"/><text x="500" y="615" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shared routines: catchphrases, running jokes</text><rect x="30" y="670" width="840" height="74" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="701" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One feature can do several jobs at once:</text><text x="450" y="727" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">a nickname can build rapport, express a relationship and be playful.</text>
</svg>