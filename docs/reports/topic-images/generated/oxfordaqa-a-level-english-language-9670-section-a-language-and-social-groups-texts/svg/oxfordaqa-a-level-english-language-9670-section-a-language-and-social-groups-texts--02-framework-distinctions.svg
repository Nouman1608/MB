<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 835" width="900" height="835" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="835" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four distinctions worth applying</text>

<rect x="30" y="110" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="144" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Giles: communication accommodation</text><rect x="55" y="160" width="365" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="75" y="188" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Converging</text><text x="75" y="214" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">towards each other’s speech to build rapport</text><text x="450" y="202" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">vs</text><rect x="480" y="160" width="365" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="188" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Diverging</text><text x="500" y="214" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">away from it to mark difference</text><rect x="30" y="260" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="294" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Wareing: two kinds of power</text><rect x="55" y="310" width="365" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="75" y="338" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Instrumental power</text><text x="75" y="364" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">held through authority or rules</text><text x="450" y="352" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">vs</text><rect x="480" y="310" width="365" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="338" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Influential power</text><text x="500" y="364" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">the power to persuade</text><rect x="30" y="410" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="444" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Fairclough: where power sits</text><rect x="55" y="460" width="365" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="75" y="488" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Power in discourse</text><text x="75" y="514" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">exercised within an interaction</text><text x="450" y="502" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">vs</text><rect x="480" y="460" width="365" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="488" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Power behind discourse</text><text x="500" y="514" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">institutions that give some the right to speak</text><rect x="30" y="560" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="594" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Brown and Levinson: politeness</text><rect x="55" y="610" width="365" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="75" y="638" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Positive face</text><text x="75" y="664" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">the wish to be liked and approved of</text><text x="450" y="652" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">vs</text><rect x="480" y="610" width="365" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="638" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Negative face</text><text x="500" y="664" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">the wish not to be imposed on</text><rect x="30" y="718" width="840" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="55" y="750" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Communities of practice (Lave and Wenger; applied to language by</text><text x="55" y="774" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Eckert and McConnell-Ginet): groups formed around a shared activity</text><text x="55" y="798" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">develop shared ways of speaking.</text>
</svg>