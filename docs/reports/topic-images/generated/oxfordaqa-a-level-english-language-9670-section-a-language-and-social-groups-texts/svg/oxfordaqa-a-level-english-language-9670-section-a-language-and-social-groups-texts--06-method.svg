<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A five-step method for Section A</text>

<rect x="30" y="110" width="640" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="150" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="158.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="120" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Context first</text><text x="120" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who, to whom, in what setting, with what relationship</text><rect x="30" y="204" width="640" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="244" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="252.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="120" y="240" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Scan for each credited area</text><text x="120" y="266" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rapport, power, identity and relationship, play</text><rect x="30" y="298" width="640" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="338" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="346.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="120" y="334" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Select four or five rich moments</text><text x="120" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">especially where functions overlap or shift</text><rect x="30" y="392" width="640" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="432" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="440.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="120" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Name, quote, explain</text><text x="120" y="454" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">precise terminology and at least two frameworks</text><rect x="30" y="486" width="640" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="76" cy="526" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="534.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="120" y="522" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Note observations for Section B</text><text x="120" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">patterns that could support a wider argument</text><path d="M674,526 L740,526 L740,330" fill="none" stroke="#8a6d0d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="740" y1="330" x2="740" y2="300" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="690" y="180" width="180" height="116" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="780" y="220" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B</text><text x="780" y="248" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">essay uses the</text><text x="780" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">analysis as evidence</text>
</svg>