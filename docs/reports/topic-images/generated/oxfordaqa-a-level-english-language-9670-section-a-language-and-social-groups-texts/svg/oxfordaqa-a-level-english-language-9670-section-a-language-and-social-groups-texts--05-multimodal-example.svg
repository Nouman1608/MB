<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A multimodal text: the gaming announcement</text>

<rect x="30" y="112" width="470" height="420" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="66" cy="148" r="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="92" y="154" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Community announcement</text><text x="52" y="200" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="52" y="200" font-size="18" fill="#1e2a44"><tspan font-weight="700" fill="#8a6d0d">GG</tspan> to everyone in last night’s <tspan font-weight="700" fill="#8a6d0d">raid</tspan>.</text><text x="52" y="228" font-size="18" fill="#1e2a44"><tspan font-weight="700" fill="#2e6b62">Our squad</tspan> cleared the final <tspan font-weight="700" fill="#8a6d0d">boss</tspan> in</text><text x="52" y="256" font-size="18" fill="#1e2a44">under an hour. <tspan font-weight="700" fill="#b5602e">Mods are taking a</tspan></text><text x="52" y="284" font-size="18" fill="#1e2a44"><tspan font-weight="700" fill="#b5602e">well-earned nap.</tspan></text><rect x="52" y="306" width="426" height="204" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="120" cy="380" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M100,450 L104,402 L136,402 L140,450 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M104,408 L86,370 M136,408 L154,370" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="200" cy="392" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M180,462 L184,414 L216,414 L220,462 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M184,420 L166,382 M216,420 L234,382" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="280" cy="380" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M260,450 L264,402 L296,402 L300,450 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M264,408 L246,370 M296,408 L314,370" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="360" cy="392" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M340,462 L344,414 L376,414 L380,462 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M344,420 L326,382 M376,420 L394,382" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="430" cy="380" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M410,450 L414,402 L446,402 L450,450 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M414,408 L396,370 M446,408 L464,370" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="265" y="495" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">screenshot: avatars celebrating</text><rect x="530" y="112" width="340" height="92" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="548" y="142" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">In-group lexis</text><text x="548" y="166" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Only players decode “GG”, “raid”,</text><text x="548" y="186" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">“boss”, “mods”: group membership.</text><rect x="530" y="218" width="340" height="92" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="548" y="248" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Rapport</text><text x="548" y="272" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">“Our squad” includes every reader in</text><text x="548" y="292" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">the success.</text><rect x="530" y="324" width="340" height="92" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="548" y="354" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Playful self-deprecation</text><text x="548" y="378" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Those with power joke about napping,</text><text x="548" y="398" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">softening their status.</text><rect x="530" y="430" width="340" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="548" y="460" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Image + words</text><text x="548" y="484" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">The screenshot shows the shared</text><text x="548" y="504" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">success the words describe.</text><text x="450" y="570" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Explain how image and language work together; the image is not decoration.</text>
</svg>