<rect x="30" y="112" width="268" height="405" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="112" width="268" height="54" rx="14" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Spoken</text><rect x="54" y="190" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="214.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">turn-taking</text><rect x="54" y="240" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="264.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">interruption and overlap</text><rect x="54" y="290" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="314.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">adjacency pairs</text><rect x="54" y="340" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="364.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">back-channelling</text><rect x="54" y="390" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="414.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">prosody</text><text x="54" y="460" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Treat non-fluency as</text><text x="54" y="481" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">normal.</text><rect x="316" y="112" width="268" height="405" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="316" y="112" width="268" height="54" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Written</text><rect x="340" y="190" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="214.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">forms of address</text><rect x="340" y="240" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="264.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">pronouns</text><rect x="340" y="290" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="314.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">register</text><rect x="340" y="340" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="364.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">modality</text><rect x="340" y="390" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="414.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">structure</text><text x="340" y="460" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start"></text><rect x="602" y="112" width="268" height="405" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="602" y="112" width="268" height="54" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Multimodal</text><rect x="626" y="190" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="214.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">image</text><rect x="626" y="240" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="264.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">layout</text><rect x="626" y="290" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="314.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">typography</text><rect x="626" y="340" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="364.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">words</text><rect x="626" y="390" width="220" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="414.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">how they combine</text><text x="626" y="460" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">e.g. a club post with</text><text x="626" y="481" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">emoji, hashtags and group</text><text x="626" y="502" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">photos signals belonging.</text>
