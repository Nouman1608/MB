<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: power, face and banter</text>

<text x="45" y="125" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Debating team, Priya is captain</text><rect x="30" y="140" width="500" height="110" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="172" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">PRIYA</text><text x="120" y="172" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">right (.) okay (.) listen up (.) we’ve got</text><text x="120" y="196" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">twenty minutes</text><line x1="534" y1="195" x2="562" y2="195" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="568" y="140" width="302" height="110" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="584" y="168" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Instrumental power</text><text x="584" y="190" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">discourse markers seize the</text><text x="584" y="210" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">floor; imperative; time</text><text x="584" y="230" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">constraint</text><rect x="30" y="260" width="500" height="90" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="292" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">SAM</text><text x="120" y="292" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">yes boss</text><line x1="534" y1="305" x2="562" y2="305" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="568" y="260" width="302" height="90" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="584" y="288" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Banter</text><text x="584" y="310" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">mock deference: acknowledges</text><text x="584" y="330" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">and teases her power</text><rect x="30" y="360" width="500" height="70" rx="8" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="392" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">PRIYA</text><text x="120" y="392" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">[laughs] don’t (.) Tom (.) you’re opening</text><text x="120" y="416" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(.) are you happy with the definition</text><rect x="30" y="440" width="500" height="70" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="472" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">TOM</text><text x="120" y="472" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">I mean (.) I think it’s fine (.) maybe</text><text x="120" y="496" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">slightly narrow but</text><line x1="534" y1="475" x2="562" y2="475" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="568" y="440" width="302" height="70" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="584" y="468" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Negative face</text><text x="584" y="490" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">hedges recognise her authority</text><rect x="30" y="520" width="500" height="90" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="552" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">PRIYA</text><text x="120" y="552" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">// it’s fine (.) we’ll go with it</text><line x1="534" y1="565" x2="562" y2="565" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="568" y="520" width="302" height="90" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="584" y="548" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Power</text><text x="584" y="570" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">interrupts the hedged</text><text x="584" y="590" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">objection</text><rect x="30" y="620" width="500" height="54" rx="8" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="652" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">SAM</text><text x="120" y="652" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">classic Priya (.) democracy in action</text><rect x="30" y="684" width="500" height="90" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="716" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">TOM</text><text x="120" y="716" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">[laughs] the Supreme Leader has spoken</text><line x1="534" y1="729" x2="562" y2="729" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="568" y="684" width="302" height="90" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="584" y="712" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Banter</text><text x="584" y="734" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">playful exaggeration builds</text><text x="584" y="754" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">group rapport</text><rect x="30" y="784" width="500" height="90" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="816" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">PRIYA</text><text x="120" y="816" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">okay okay (.) Tom (.) what would you change</text><line x1="534" y1="829" x2="562" y2="829" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="568" y="784" width="302" height="90" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="584" y="812" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Accommodation</text><text x="584" y="834" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">she responds to the group’s</text><text x="584" y="854" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">challenge</text><rect x="30" y="890" width="840" height="66" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="930" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Her power is real but negotiated, held partly by consent.</text>
</svg>