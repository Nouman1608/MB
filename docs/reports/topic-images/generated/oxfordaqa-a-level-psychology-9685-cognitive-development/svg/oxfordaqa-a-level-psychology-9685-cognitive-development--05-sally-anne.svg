<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Sally-Anne study</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Baron-Cohen, Leslie and Frith (1985): a false-belief task</text>
<rect x="30" y="124" width="187.5" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="123.75" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="123.75" y="178.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sally puts the</text><text x="123.75" y="199.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">marble in her</text><text x="123.75" y="220.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">basket</text><line x1="223.5" y1="182.5" x2="241.5" y2="182.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247.5" y="124" width="187.5" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341.25" y="174" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="341.25" y="199.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sally leaves</text><line x1="441" y1="182.5" x2="459" y2="182.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="124" width="187.5" height="117" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="558.75" y="163.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="558.75" y="188.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Anne moves it to</text><text x="558.75" y="209.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">her box</text><line x1="658.5" y1="182.5" x2="676.5" y2="182.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="682.5" y="124" width="187.5" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="776.25" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">4</text><text x="776.25" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Where will Sally</text><text x="776.25" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">look?</text><text x="776.25" y="223" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">correct: the basket</text><text x="30" y="279" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">PERCENTAGE ANSWERING CORRECTLY</text><text x="244" y="330" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Typically developing</text><rect x="260" y="303" width="425" height="42" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="695" y="331" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">about 85%</text><text x="244" y="388" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Down syndrome</text><rect x="260" y="361" width="430" height="42" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="700" y="389" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">86%</text><text x="244" y="446" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Autistic children</text><rect x="260" y="419" width="100" height="42" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="370" y="447" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">20%</text><line x1="260" y1="295" x2="260" y2="469" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="483" width="840" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Proposal: autistic children have difficulties with <tspan font-weight="700" fill="#1e2a44">theory</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">mind</tspan>: knowing others have their own beliefs,</text><text x="450" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">which may differ from reality.</text><rect x="30" y="583" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="615" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="641.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Simple and repeatable</text><text x="50" y="669.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A clear, standard false-belief test.</text><rect x="457" y="583" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="615" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="641.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dolls, language and memory</text><text x="477" y="669.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Failure may have other causes; not all autistic</text><text x="477" y="690.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">children failed.</text>
</svg>