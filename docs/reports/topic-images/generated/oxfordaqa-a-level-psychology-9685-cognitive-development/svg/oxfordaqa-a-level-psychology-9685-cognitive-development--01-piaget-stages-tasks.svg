<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Piaget’s four stages and their tasks</text>

<rect x="30" y="204" width="204" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="132" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sensorimotor</text><text x="132" y="260" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">0-2 years</text><rect x="242" y="178" width="204" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="344" y="210" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pre-operational</text><text x="344" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2-7 years</text><rect x="454" y="152" width="204" height="122" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556" y="184" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Concrete operational</text><text x="556" y="208" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">7-11 years</text><rect x="666" y="126" width="204" height="148" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="768" y="158" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal operational</text><text x="768" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">11+ years</text><rect x="30" y="296" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,296 H280 V366 H44 A14,14 0 0 1 30,352 V310 A14,14 0 0 1 44,296 Z" fill="#dce9e7"/><rect x="30" y="296" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="323.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sensorimotor: object</text><text x="46" y="344.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">permanence</text><text x="296" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Develops at about <tspan font-weight="700" fill="#1e2a44">8</tspan> <tspan font-weight="700" fill="#1e2a44">months</tspan>: younger infants stopped reaching when a</text><text x="296" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">toy was covered with a cloth</text><rect x="30" y="374" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,374 H280 V444 H44 A14,14 0 0 1 30,430 V388 A14,14 0 0 1 44,374 Z" fill="#f2e7b8"/><rect x="30" y="374" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="401.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pre-operational:</text><text x="46" y="422.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">egocentrism</text><text x="296" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Three</tspan> <tspan font-weight="700" fill="#1e2a44">mountains</tspan> <tspan font-weight="700" fill="#1e2a44">task</tspan>: most under-sevens chose their own view, not the</text><text x="296" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">doll’s</text><rect x="30" y="452" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,452 H280 V522 H44 A14,14 0 0 1 30,508 V466 A14,14 0 0 1 44,452 Z" fill="#f2e7b8"/><rect x="30" y="452" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="479.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pre-operational:</text><text x="46" y="500.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">conservation</text><text x="296" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Liquid poured from a short wide glass into a tall thin one: “the tall glass</text><text x="296" y="501.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">holds more”</text><rect x="30" y="530" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,530 H280 V600 H44 A14,14 0 0 1 30,586 V544 A14,14 0 0 1 44,530 Z" fill="#f2e7b8"/><rect x="30" y="530" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="557.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pre-operational: class</text><text x="46" y="578.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">inclusion</text><text x="296" y="558.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mostly brown wooden beads, a few white: “more brown than wooden?”</text><text x="296" y="579.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→ “brown”</text><rect x="30" y="608" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,608 H280 V678 H44 A14,14 0 0 1 30,664 V622 A14,14 0 0 1 44,608 Z" fill="#dce9e7"/><rect x="30" y="608" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="646.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Concrete operational</text><text x="296" y="636.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conserve and reason logically about concrete objects; struggle with the</text><text x="296" y="657.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">abstract</text><rect x="30" y="686" width="840" height="52" rx="14" fill="#ffffff"/><path d="M44,686 H280 V738 H44 A14,14 0 0 1 30,724 V700 A14,14 0 0 1 44,686 Z" fill="#f2e7b8"/><rect x="30" y="686" width="840" height="52" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="715.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Formal operational</text><text x="296" y="716.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Abstract, hypothetical reasoning: change one variable at a time</text>
</svg>