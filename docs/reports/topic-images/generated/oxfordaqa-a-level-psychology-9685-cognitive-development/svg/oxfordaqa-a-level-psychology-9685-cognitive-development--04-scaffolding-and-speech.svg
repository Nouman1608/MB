<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Vygotsky: scaffolding and language</text>

<text x="30" y="116" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">SCAFFOLDING (WOOD, BRUNER AND ROSS, 1976): SUPPORT FADES</text><rect x="60" y="160" width="150" height="150" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="135" y="336" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Direct demonstration</text><line x1="218" y1="290" x2="258" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="265" y="210" width="150" height="100" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="340" y="336" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Hints</text><line x1="423" y1="290" x2="463" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="470" y="255" width="150" height="55" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="545" y="336" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Encouragement</text><line x1="628" y1="290" x2="668" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="750" y="336" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Child alone</text><line x1="50" y1="310" x2="850" y2="310" stroke="#1e2a44" stroke-width="3"/><text x="60" y="148" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">amount of support from the MKO (illustrative)</text><text x="450" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The <tspan font-weight="700">MKO</tspan> (more knowledgeable other): an adult, older child or peer with greater skill.</text><text x="450" y="431" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">LANGUAGE BECOMES A TOOL OF THOUGHT</text><rect x="30" y="453" width="249.33333333333334" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="154.66666666666669" y="487.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social speech</text><text x="154.66666666666669" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">with others</text><line x1="285.33333333333337" y1="497" x2="319.33333333333337" y2="497" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="453" width="249.33333333333334" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450.00000000000006" y="487.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Private speech</text><text x="450.00000000000006" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">talking aloud to oneself</text><line x1="580.6666666666667" y1="497" x2="614.6666666666667" y2="497" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="453" width="249.33333333333334" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745.3333333333334" y="487.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Inner speech</text><text x="745.3333333333334" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a tool of thought</text><rect x="30" y="563" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="595" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="621.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shaped teaching</text><text x="50" y="649.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Guided group work and peer tutoring.</text><rect x="457" y="563" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="595" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="621.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hard to test</text><text x="477" y="649.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The ZPD is difficult to measure; may underplay</text><text x="477" y="670.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">biological maturation.</text>
