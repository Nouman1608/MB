<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 764" width="900" height="764" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="764" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Violation of expectation: the carrot study</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Baillargeon and DeVos (1991): infants of about 3½ months. Schematic</text>
<rect x="30" y="124" width="405" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="232" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Short carrot</text><text x="232" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">below the window: never seen</text><path d="M90,374 l14,-70 l14,70 z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><path d="M360,374 l14,-70 l14,70 z" fill="#b5602e" stroke="#1e2a44" stroke-width="2" opacity="0.35"/><rect x="150" y="224" width="165" height="150" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><rect x="200" y="224" width="65" height="65" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="232" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">window</text><line x1="130" y1="394" x2="350" y2="394" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="465" y="124" width="405" height="300" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="667" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Tall carrot</text><text x="667" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">should appear in the window, but does not</text><path d="M525,374 l14,-120 l14,120 z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><path d="M795,374 l14,-120 l14,120 z" fill="#b5602e" stroke="#1e2a44" stroke-width="2" opacity="0.35"/><rect x="585" y="224" width="165" height="150" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><rect x="635" y="224" width="65" height="65" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="667" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">window</text><line x1="565" y1="394" x2="785" y2="394" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="446" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236.5" y="502.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">POSSIBLE EVENT</text><text x="236.5" y="528.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Short carrot passes unseen</text><rect x="457" y="446" width="413" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="663.5" y="478" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">IMPOSSIBLE EVENT</text><text x="663.5" y="504.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Infants looked longer</text><text x="663.5" y="532.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">they expected the carrot still existed behind the</text><text x="663.5" y="553.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">screen</text><rect x="30" y="600" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="632" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="658.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No motor response needed</text><text x="50" y="686.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Object permanence months earlier than Piaget</text><text x="50" y="707.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">claimed; may be partly innate (nature).</text><rect x="457" y="600" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="632" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="658.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What does looking mean?</text><text x="477" y="686.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Longer looking may reflect novelty or perceptual</text><text x="477" y="707.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interest, not understanding.</text>
</svg>