<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An application answer: Noor and the juice</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Explain using Piaget (behaviour) and Vygotsky (teacher’s approach) [6]</text>
<rect x="30" y="124" width="840" height="52" rx="14" fill="#ffffff"/><path d="M44,124 H230 V176 H44 A14,14 0 0 1 30,162 V138 A14,14 0 0 1 44,124 Z" fill="#f2e7b8"/><rect x="30" y="124" width="840" height="52" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="153.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Stage</text><text x="246" y="154.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pre-operational: Noor cannot yet <tspan font-weight="700" fill="#1e2a44">conserve</tspan> volume</text><rect x="30" y="184" width="840" height="52" rx="14" fill="#ffffff"/><path d="M44,184 H230 V236 H44 A14,14 0 0 1 30,222 V198 A14,14 0 0 1 44,184 Z" fill="#f2e7b8"/><rect x="30" y="184" width="840" height="52" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="213.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Centration</text><text x="246" y="214.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">She focuses on the <tspan font-weight="700" fill="#1e2a44">height</tspan> of the liquid, not the amount</text><rect x="30" y="244" width="840" height="52" rx="14" fill="#ffffff"/><path d="M44,244 H230 V296 H44 A14,14 0 0 1 30,282 V258 A14,14 0 0 1 44,244 Z" fill="#f2e7b8"/><rect x="30" y="244" width="840" height="52" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="273.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mechanism</text><text x="246" y="274.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Equal amounts in the jug → <tspan font-weight="700" fill="#1e2a44">disequilibrium</tspan> → accommodation of her schema</text><rect x="30" y="304" width="840" height="52" rx="14" fill="#ffffff"/><path d="M44,304 H230 V356 H44 A14,14 0 0 1 30,342 V318 A14,14 0 0 1 44,304 Z" fill="#dce9e7"/><rect x="30" y="304" width="840" height="52" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="333.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">MKO</text><text x="246" y="334.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The teacher is the <tspan font-weight="700" fill="#1e2a44">more</tspan> <tspan font-weight="700" fill="#1e2a44">knowledgeable</tspan> <tspan font-weight="700" fill="#1e2a44">other</tspan></text><rect x="30" y="364" width="840" height="52" rx="14" fill="#ffffff"/><path d="M44,364 H230 V416 H44 A14,14 0 0 1 30,402 V378 A14,14 0 0 1 44,364 Z" fill="#dce9e7"/><rect x="30" y="364" width="840" height="52" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="393.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ZPD and scaffolding</text><text x="246" y="394.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Demonstrate first, then let Noor try alone: scaffolding within her <tspan font-weight="700" fill="#1e2a44">ZPD</tspan></text><rect x="30" y="424" width="840" height="52" rx="14" fill="#ffffff"/><path d="M44,424 H230 V476 H44 A14,14 0 0 1 30,462 V438 A14,14 0 0 1 44,424 Z" fill="#dce9e7"/><rect x="30" y="424" width="840" height="52" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="453.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fading</text><text x="246" y="454.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Support is gradually <tspan font-weight="700" fill="#1e2a44">withdrawn</tspan> as Noor becomes competent</text><rect x="30" y="498" width="73.50399999999999" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="66.752" y="518.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Piaget</text><rect x="113.50399999999999" y="498" width="99.232" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="163.12" y="518.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Vygotsky</text><text x="870" y="519" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">Each point is applied to Noor, not just defined</text>
</svg>