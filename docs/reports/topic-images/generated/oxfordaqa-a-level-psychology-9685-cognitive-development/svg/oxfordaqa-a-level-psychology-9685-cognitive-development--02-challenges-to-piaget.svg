<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Challenges to Piaget’s methods</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">When tasks make human sense, children do better</text>
<rect x="30" y="124" width="413" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HUGHES (1975)</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Policeman doll task</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hide a boy doll from two policeman dolls;</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">children aged 3½ to 5</text><rect x="457" y="124" width="413" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MCGARRIGLE AND DONALDSON (1974)</text><text x="477" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Naughty teddy”</text><text x="477" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Teddy disarranges counters “accidentally”;</text><text x="477" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">children aged 4 to 6</text><text x="30" y="294" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">PERCENTAGE OF CHILDREN WHO SUCCEEDED</text><text x="264" y="345" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Hughes: hid the boy</text><rect x="280" y="318" width="396" height="42" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="686" y="346" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">about 90%</text><text x="264" y="403" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Naughty teddy</text><rect x="280" y="376" width="272.8" height="42" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="562.8" y="404" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">about 62% conserved</text><text x="264" y="461" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Experimenter rearranged</text><rect x="280" y="434" width="70.4" height="42" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><text x="360.4" y="462" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">16% conserved</text><line x1="280" y1="310" x2="280" y2="484" stroke="#1e2a44" stroke-width="2.5"/><line x1="280" y1="490" x2="720" y2="490" stroke="#1e2a44" stroke-width="2"/><line x1="280" y1="490" x2="280" y2="498" stroke="#1e2a44" stroke-width="2"/><text x="280" y="518" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0%</text><line x1="500" y1="490" x2="500" y2="498" stroke="#1e2a44" stroke-width="2"/><text x="500" y="518" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">50%</text><line x1="720" y1="490" x2="720" y2="498" stroke="#1e2a44" stroke-width="2"/><text x="720" y="518" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">100%</text><rect x="30" y="544" width="840" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="576.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Support Piaget’s <tspan font-weight="700" fill="#1e2a44">sequence</tspan>, but challenge his <tspan font-weight="700" fill="#1e2a44">ages</tspan> and the claim that thinking is limited by stage. Asking</text><text x="450" y="597.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the same question twice may have suggested a different answer was expected.</text>
</svg>