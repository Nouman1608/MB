<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The mirror neuron system</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Rizzolatti, Gallese and colleagues, 1990s: premotor cortex of macaques</text>
<rect x="30" y="124" width="300" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="180" y="164" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DOING</text><text x="180" y="190.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Performing an action</text><rect x="570" y="124" width="300" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="720" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">OBSERVING</text><text x="720" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Watching someone else do</text><text x="720" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">it</text><rect x="300" y="274" width="300" height="84" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="308.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The same mirror neurons</text><text x="450" y="332.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">fire</text><line x1="180" y1="230" x2="330" y2="276" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="720" y1="230" x2="570" y2="276" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="360" x2="450" y2="398" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="200" y="404" width="500" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="438.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Proposed in humans: understanding others’ actions</text><text x="450" y="461.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">and intentions</text><text x="450" y="489.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">supporting theory of mind and empathy</text><rect x="30" y="536" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="568" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="594.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Brain imaging</text><text x="50" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Human areas respond to both doing and</text><text x="50" y="643.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">observing actions.</text><rect x="457" y="536" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="568" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="594.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Overstated? (Hickok, 2009)</text><text x="477" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Most single-neuron recordings come from</text><text x="477" y="643.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">monkeys.</text>
</svg>