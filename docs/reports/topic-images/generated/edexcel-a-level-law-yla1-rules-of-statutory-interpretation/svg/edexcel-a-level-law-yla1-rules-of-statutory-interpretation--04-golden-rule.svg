<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 614" width="900" height="614" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="614" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The golden rule</text>

<rect x="30" y="110" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE GOLDEN RULE: <tspan font-style="italic">GREY V PEARSON</tspan> (1857)</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Start literal; if that leads to absurdity, adopt a different meaning</text><line x1="300" y1="210" x2="235" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="600" y1="210" x2="665" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="252" width="411" height="177" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="285" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NARROW APPROACH</text><text x="50" y="312.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Choose between possible meanings</text><text x="50" y="340" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R v Allen</tspan> (1872): "marry" read as "go through a</text><text x="64.25" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ceremony of marriage", or bigamy is impossible</text><text x="50" y="385" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="385" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Adler v George</tspan> [1964]: "in the vicinity of" read as</text><text x="64.25" y="405" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"in or in the vicinity of"</text><rect x="459" y="252" width="411" height="177" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="285" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BROAD APPROACH</text><text x="479" y="312.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One meaning, but repugnant</text><text x="479" y="340" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Re Sigsworth</tspan> [1935]: a son who murdered his</text><text x="493.25" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mother could not inherit under the Administration</text><text x="493.25" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of Estates Act 1925</text><rect x="30" y="447" width="411" height="137" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="480" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADVANTAGES</text><text x="50" y="510" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">corrects the worst literal results while staying</text><text x="64.25" y="530" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">close to the text</text><text x="50" y="555" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="555" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">assumes Parliament did not intend absurdity</text><rect x="459" y="447" width="411" height="137" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="480" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DISADVANTAGES</text><text x="479" y="510" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">no test of what is "absurd"</text><text x="479" y="535" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="535" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">used occasionally and unpredictably</text><text x="479" y="560" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="560" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the broad approach effectively rewrites the words</text>
</svg>