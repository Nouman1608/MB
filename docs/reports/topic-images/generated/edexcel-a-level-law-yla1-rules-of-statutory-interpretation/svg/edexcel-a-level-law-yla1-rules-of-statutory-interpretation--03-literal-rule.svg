<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 633" width="900" height="633" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="633" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The literal rule</text>

<rect x="30" y="110" width="840" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE LITERAL RULE</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plain, ordinary, dictionary meaning, even if the result is absurd</text><text x="50" y="198.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R v Judge of the City of London Court</tspan> [1892], Lord Esher: clear words must be followed "even though</text><text x="50" y="219.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">they lead to a manifest absurdity".</text><rect x="30" y="250" width="268" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="283.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Whiteley v Chappell</tspan> (1868)</text><text x="50" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Words: "any person entitled to</text><text x="50" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">vote"</text><text x="50" y="355" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">voted as a dead man; the dead</text><text x="50" y="375" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cannot vote</text><text x="50" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Result: not guilty</text><rect x="316" y="250" width="268" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="283.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Fisher v Bell</tspan> [1961]</text><text x="336" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Words: "offer for sale"</text><text x="336" y="335" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a knife in a window is an</text><text x="336" y="355" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">invitation to treat</text><text x="336" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Result: not guilty; Parliament</text><text x="336" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">amended the law</text><rect x="602" y="250" width="268" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="283.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">LNER v Berriman</tspan> [1946]</text><text x="622" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Words: "relaying or repairing"</text><text x="622" y="335" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">killed while oiling points:</text><text x="622" y="355" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">maintenance</text><text x="622" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Result: widow received nothing</text><rect x="30" y="442" width="411" height="161" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="475" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADVANTAGES</text><text x="50" y="501.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Supremacy and certainty</text><text x="50" y="529" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="529" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">applies Parliament’s words, not judges’ views</text><text x="50" y="554" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="554" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">predictable from the text</text><text x="50" y="579" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="579" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shows Parliament where to amend (<tspan font-style="italic">Fisher v Bell</tspan>)</text><rect x="459" y="442" width="411" height="161" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="475" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DISADVANTAGES</text><text x="479" y="501.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Absurd and unjust results</text><text x="479" y="529" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="529" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Whiteley</tspan>; <tspan font-style="italic">Berriman</tspan></text><text x="479" y="554" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="554" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">assumes perfect drafting (Law Commission, 1969)</text><text x="479" y="579" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="579" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">words can have more than one plain meaning</text>
</svg>