<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The purposive approach</text>

<rect x="30" y="110" width="840" height="138" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE PURPOSIVE APPROACH</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Find the purpose of the whole Act and read the words to achieve it, even reading</text><text x="50" y="195.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">words in</text><text x="50" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Broader than mischief; now dominant, influenced by European law and s 3 Human Rights Act 1998.</text><rect x="30" y="250" width="411" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="283.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Jones v Tower Boot Co</tspan> [1997]</text><text x="50" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"in the course of employment" read broadly: a</text><text x="50" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">narrow reading would defeat the purpose of the</text><text x="50" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Race Relations Act 1976</text><rect x="459" y="250" width="411" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="283.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R (Quintavalle)</tspan> [2003]</text><text x="479" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cloned embryos covered: the purpose was to</text><text x="479" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">regulate creating embryos outside the body</text><text x="450" y="398" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">MAGOR AND ST MELLONS RDC V NEWPORT CORPORATION</text><rect x="30" y="414" width="400" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="447" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LORD DENNING, COURT OF APPEAL [1950]</text><text x="50" y="474.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judges should "fill in the gaps"</text><rect x="470" y="414" width="400" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="490" y="447" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LORD SIMONDS, HOUSE OF LORDS [1952]</text><text x="490" y="474.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"A naked usurpation of the legislative</text><text x="490" y="499.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">function"</text><text x="450" y="467" font-size="20" font-weight="700" fill="#4a5568" text-anchor="middle">vs</text><rect x="30" y="543" width="411" height="157" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="576" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADVANTAGES</text><text x="50" y="606" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="606" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sensible, just results</text><text x="50" y="631" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="631" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">handles new technology</text><text x="50" y="656" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="656" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fits modern drafting and Convention rights</text><rect x="459" y="543" width="411" height="157" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="576" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DISADVANTAGES</text><text x="479" y="606" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="606" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">judges may substitute their own view</text><text x="479" y="631" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="631" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">less predictable</text><text x="479" y="656" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="656" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">finding the purpose may need costly research</text><text x="493.25" y="676" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Hansard</tspan>)</text>
</svg>