<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four approaches, from words to purpose</text>

<defs><linearGradient id="gSI" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="80" y="154" width="740" height="32" rx="16" fill="url(#gSI)" stroke="#c9d6d4" stroke-width="2"/><text x="80" y="136" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">the words</text><text x="820" y="136" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">the purpose</text><circle cx="120" cy="170" r="10" fill="#1e2a44"/><path d="M120,182 L129,230" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="232" width="198" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="267.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Literal</text><text x="50" y="295" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">plain, dictionary</text><text x="50" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">meaning, even if</text><text x="50" y="335" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">absurd</text><text x="50" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Whiteley v Chappell</tspan></text><text x="50" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1868)</text><circle cx="340" cy="170" r="10" fill="#1e2a44"/><path d="M340,182 L343,230" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="244" y="232" width="198" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="267.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Golden</text><text x="264" y="295" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">literal first; depart to</text><text x="264" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">avoid absurdity</text><text x="264" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R v Allen</tspan> (1872); <tspan font-style="italic">Re</tspan></text><text x="264" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Sigsworth</tspan> [1935]</text><circle cx="560" cy="170" r="10" fill="#1e2a44"/><path d="M560,182 L557,230" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="458" y="232" width="198" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="267.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mischief</text><text x="478" y="295" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Heydon’s Case</tspan></text><text x="478" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1584): the defect the</text><text x="478" y="335" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Act cures</text><text x="478" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Smith v Hughes</tspan></text><text x="478" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">[1960]</text><circle cx="780" cy="170" r="10" fill="#1e2a44"/><path d="M780,182 L771,230" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="672" y="232" width="198" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="692" y="267.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Purposive</text><text x="692" y="295" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the purpose of the</text><text x="692" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">whole Act</text><text x="692" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Jones v Tower Boot</tspan></text><text x="692" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">[1997]</text><rect x="30" y="424" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="462" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">More certainty and supremacy to the left; more flexibility and justice to the right.</text>
</svg>