<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 775" width="900" height="775" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="775" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The mischief rule</text>

<text x="450" y="130" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Four questions from <tspan font-style="italic">Heydon’s Case</tspan> (1584), applied to <tspan font-style="italic">Smith v Hughes</tspan> [1960]</text><circle cx="54" cy="189" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="195.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="86" y="150" width="400" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="104" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">What was the common law before the Act?</text><line x1="490" y1="189" x2="520" y2="189" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="526" y="150" width="344" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="544" y="184" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the law before the Street Offences Act</text><text x="544" y="204" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1959</text><circle cx="54" cy="279" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="285.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="86" y="240" width="400" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="104" y="274" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">What was the mischief or defect?</text><line x1="490" y1="279" x2="520" y2="279" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="526" y="240" width="344" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="544" y="274" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">people being solicited in the street</text><circle cx="54" cy="369" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="375.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="86" y="330" width="400" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="104" y="364" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">What remedy did Parliament provide?</text><line x1="490" y1="369" x2="520" y2="369" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="526" y="330" width="344" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="544" y="364" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">an offence to solicit "in a street"</text><circle cx="54" cy="459" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="465.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="86" y="420" width="400" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="104" y="454" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">What is the true reason for the remedy?</text><line x1="490" y1="459" x2="520" y2="459" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="526" y="420" width="344" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="544" y="454" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to stop that soliciting, wherever the</text><text x="544" y="474" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">prostitute stood</text><rect x="30" y="514" width="840" height="60" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="550" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Tapping on windows and balconies to attract men in the street: guilty</text><rect x="30" y="594" width="411" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="627" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ALSO</text><text x="50" y="652.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Elliott v Grey</tspan> [1960]</text><text x="50" y="679" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a car on blocks was "used on a road": the hazard</text><text x="50" y="699" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">insurance law aimed at</text><rect x="459" y="594" width="411" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="627" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ALSO</text><text x="479" y="652.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">RCN v DHSS</tspan> [1981]</text><text x="479" y="679" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">nurses under a doctor’s supervision: lawful, 3–2;</text><text x="479" y="699" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mischief was back-street abortions</text><text x="450" y="749" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Weaknesses: built for short statutes; may need extrinsic aids; risk of judges deciding what Parliament "should" have done.</text>
</svg>