<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why judges interpret statutes</text>

<rect x="30" y="110" width="411" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="144.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Broad terms</text><text x="50" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Brock v DPP</tspan> [1993]: "any dog of the type known as</text><text x="50" y="192" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the pit bull terrier"</text><rect x="459" y="110" width="411" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="144.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ambiguity</text><text x="479" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a word with two or more ordinary meanings</text><rect x="30" y="230" width="411" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="264.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Drafting errors</text><text x="50" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">missing or careless words, often in hurried</text><text x="50" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">amendments</text><rect x="459" y="230" width="411" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="264.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">New developments</text><text x="479" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R (Quintavalle)</tspan> [2003]: cloned embryos and an Act</text><text x="479" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">that assumed fertilisation</text><rect x="30" y="350" width="840" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="384.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Changes in language</text><text x="50" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">words shift meaning over time</text><rect x="30" y="456" width="840" height="120" rx="16" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="490" font-size="15" font-weight="700" fill="#d4b02e" text-anchor="middle">THE TENSION IN EVERY QUESTION</text><text x="240" y="534" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Parliamentary supremacy</text><text x="240" y="558" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">Parliament makes law, judges apply it</text><text x="450" y="540" font-size="30" font-weight="700" fill="#d4b02e" text-anchor="middle">⟷</text><text x="660" y="534" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">A sensible, just result</text><text x="660" y="558" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">in the case in front of the judge</text>
</svg>