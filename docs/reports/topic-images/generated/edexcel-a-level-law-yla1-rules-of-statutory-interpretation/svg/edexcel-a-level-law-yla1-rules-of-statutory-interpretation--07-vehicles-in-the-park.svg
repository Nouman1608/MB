<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 694" width="900" height="694" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="694" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: all four rules</text>

<rect x="30" y="110" width="840" height="70" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="142" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">"No vehicle shall be taken into a public park."</text><text x="450" y="166" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">a fictional Act</text><rect x="230" y="200" width="312" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="386" y="232" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ruth’s bicycle</text><rect x="550" y="200" width="320" height="50" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="710" y="232" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">An ambulance for an injured child</text><rect x="30" y="262" width="188" height="64" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="124" y="301" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Literal</text><rect x="230" y="262" width="312" height="64" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="250" y="298" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"vehicle" includes it: an offence</text><rect x="550" y="262" width="320" height="64" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="570" y="298" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">also an offence: absurd</text><rect x="30" y="336" width="188" height="76" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="124" y="381" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Golden</text><rect x="230" y="336" width="312" height="76" rx="12" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2.5"/><text x="386" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">as literal</text><rect x="550" y="336" width="320" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="570" y="368" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">narrow approach: "vehicle" not read to</text><text x="570" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cover emergency vehicles</text><rect x="30" y="422" width="188" height="76" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="124" y="467" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Mischief</text><rect x="230" y="422" width="312" height="76" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="250" y="454" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">may be caught, if the mischief is</text><text x="250" y="474" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">danger and noise to park users</text><rect x="550" y="422" width="320" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="570" y="464" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">saving life is not the mischief</text><rect x="30" y="508" width="188" height="76" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="124" y="553" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Purposive</text><rect x="230" y="508" width="312" height="76" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="250" y="540" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">probably caught: purpose is safe</text><text x="250" y="560" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">enjoyment of parks</text><rect x="550" y="508" width="320" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="570" y="550" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">advances the purpose of safety</text><rect x="30" y="600" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="638" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">The rule chosen changes the outcome: the main criticism of having no single binding rule.</text>
</svg>