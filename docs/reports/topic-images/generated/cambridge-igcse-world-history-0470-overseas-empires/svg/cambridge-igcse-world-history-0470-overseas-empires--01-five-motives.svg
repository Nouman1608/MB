<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 571" width="900" height="571" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="571" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five motives, and how they connected</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Who held each motive, and how they worked together</text>
<rect x="30" y="124" width="160" height="148" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="42" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ECONOMIC</text><text x="42" y="172.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Merchants,</text><text x="42" y="192.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">investors</text><text x="42" y="218.6" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">Suez shares (1875);</text><text x="42" y="237.6" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">Royal Niger</text><text x="42" y="256.6" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start">Company</text><rect x="200" y="124" width="160" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="212" y="158" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MILITARY</text><text x="212" y="182.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Navies</text><text x="212" y="208.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">Mahan (1890):</text><text x="212" y="227.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">bases, coaling</text><text x="212" y="246.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">stations</text><rect x="370" y="124" width="160" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="382" y="158" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GEOPOLITICAL</text><text x="382" y="182.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Governments</text><text x="382" y="208.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">Germany from</text><text x="382" y="227.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">1884; Fashoda</text><text x="382" y="246.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">(1898)</text><rect x="540" y="124" width="160" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="552" y="158" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELIGIOUS</text><text x="552" y="182.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Missions</text><text x="552" y="208.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">Crowther, first</text><text x="552" y="227.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">African Anglican</text><text x="552" y="246.6" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">bishop (1864)</text><rect x="710" y="124" width="160" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="722" y="167.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CULTURAL</text><text x="722" y="191.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Public opinion</text><text x="722" y="218.1" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">Ferry (1885): a duty</text><text x="722" y="237.1" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">to "civilise"</text><rect x="30" y="294" width="270.6666666666667" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="322.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Economic interests often</text><text x="45" y="343.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">came first</text><text x="45" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">But needed geopolitical and</text><text x="45" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cultural arguments to win public</text><text x="45" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and government support</text><rect x="314.6666666666667" y="294" width="270.6666666666667" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="329.6666666666667" y="332.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Military motives protected</text><text x="329.6666666666667" y="353.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">trade</text><text x="329.6666666666667" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Such as the route to India through</text><text x="329.6666666666667" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Suez</text><rect x="599.3333333333334" y="294" width="270.6666666666667" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="614.3333333333334" y="332.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rivalry explains speed</text><text x="614.3333333333334" y="359.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Berlin Conference (1884-85):</text><text x="614.3333333333334" y="379.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"effective occupation" set off a</text><text x="614.3333333333334" y="399.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">race</text><rect x="30" y="451" width="840" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="483" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY IT BECAME POSSIBLE AFTER ABOUT 1870</text><text x="50" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quinine against malaria; steamships and railways inland; the machine gun</text>
</svg>