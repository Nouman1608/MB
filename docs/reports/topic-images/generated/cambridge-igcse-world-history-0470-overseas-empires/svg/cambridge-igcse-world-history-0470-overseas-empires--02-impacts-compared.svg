<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621" width="900" height="621" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="621" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How varied were the impacts on Africans?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three colonies compared</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="332" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="140" height="48" fill="#b5d3cf"/><rect x="170" y="124" width="233.33333333333331" height="48" fill="#dce9e7"/><text x="184" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">French Senegal</text><rect x="403.3333333333333" y="124" width="233.33333333333331" height="48" fill="#f2e7b8"/><text x="417.3333333333333" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">British Northern Nigeria</text><rect x="636.6666666666666" y="124" width="233.33333333333331" height="48" fill="#f3dccd"/><text x="650.6666666666666" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Leopold's Congo</text><rect x="30" y="172" width="140" height="86" fill="#dce9e7"/><text x="44" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Political</text><rect x="170" y="172" width="233.33333333333331" height="86" fill="#ffffff"/><text x="184" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Direct rule by French</text><text x="184" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">officials; a few coastal</text><text x="184" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Africans voted</text><rect x="403.3333333333333" y="172" width="233.33333333333331" height="86" fill="#ffffff"/><text x="417.3333333333333" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Emirs kept thrones and</text><text x="417.3333333333333" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">courts, serving British</text><text x="417.3333333333333" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">officials</text><rect x="636.6666666666666" y="172" width="233.33333333333331" height="86" fill="#ffffff"/><text x="650.6666666666666" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Leopold's agents and the</text><text x="650.6666666666666" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Force Publique</text><line x1="30" y1="258" x2="870" y2="258" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="258" width="140" height="66" fill="#dce9e7"/><text x="44" y="284" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Economic</text><rect x="170" y="258" width="233.33333333333331" height="66" fill="#f8faf9"/><text x="184" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Groundnut exports; taxes;</text><text x="184" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">forced labour</text><rect x="403.3333333333333" y="258" width="233.33333333333331" height="66" fill="#f8faf9"/><text x="417.3333333333333" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Taxes through the emirs;</text><text x="417.3333333333333" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">trade to Britain</text><rect x="636.6666666666666" y="258" width="233.33333333333331" height="66" fill="#f8faf9"/><text x="650.6666666666666" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Forced rubber and ivory;</text><text x="650.6666666666666" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">quotas punished</text><line x1="30" y1="324" x2="870" y2="324" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="324" width="140" height="66" fill="#dce9e7"/><text x="44" y="350" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Social</text><rect x="170" y="324" width="233.33333333333331" height="66" fill="#ffffff"/><text x="184" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">French schools for a small</text><text x="184" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">elite</text><rect x="403.3333333333333" y="324" width="233.33333333333331" height="66" fill="#ffffff"/><text x="417.3333333333333" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Islamic law kept;</text><text x="417.3333333333333" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">missionaries restricted</text><rect x="636.6666666666666" y="324" width="233.33333333333331" height="66" fill="#ffffff"/><text x="650.6666666666666" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Hostage-taking; famine;</text><text x="650.6666666666666" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">huge population loss</text><line x1="30" y1="390" x2="870" y2="390" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="390" width="140" height="66" fill="#dce9e7"/><text x="44" y="416" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Resistance</text><rect x="170" y="390" width="233.33333333333331" height="66" fill="#f8faf9"/><text x="184" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Umar Tall; siege of Médine</text><text x="184" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1857)</text><rect x="403.3333333333333" y="390" width="233.33333333333331" height="66" fill="#f8faf9"/><text x="417.3333333333333" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Kano and Sokoto conquered</text><text x="417.3333333333333" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1903)</text><rect x="636.6666666666666" y="390" width="233.33333333333331" height="66" fill="#f8faf9"/><text x="650.6666666666666" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Revolts crushed by force</text></g><line x1="170" y1="124" x2="170" y2="456" stroke="#c9d6d4" stroke-width="1.5"/><line x1="403.3333333333333" y1="124" x2="403.3333333333333" y2="456" stroke="#c9d6d4" stroke-width="1.5"/><line x1="636.6666666666666" y1="124" x2="636.6666666666666" y2="456" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="332" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="478" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="512.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="542.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Varied in <tspan font-weight="700" fill="#1e2a44">method</tspan> and <tspan font-weight="700" fill="#1e2a44">intensity</tspan>, but all three took sovereignty and redirected economies to serve</text><text x="50" y="564.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Europe.</text>
</svg>