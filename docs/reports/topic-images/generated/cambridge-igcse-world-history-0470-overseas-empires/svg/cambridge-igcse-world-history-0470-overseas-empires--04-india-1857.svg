<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Indians resisted in 1857</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Different groups, different grievances</text>
<rect x="30" y="124" width="198" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="162" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEPOYS</text><text x="46" y="187.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Greased cartridges</text><text x="46" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">New Enfield rifle; pay;</text><text x="46" y="234" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">service overseas</text><rect x="244" y="124" width="198" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RULERS</text><text x="260" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Doctrine of Lapse</text><text x="260" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Jhansi (1853-54);</text><text x="260" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Nana Sahib refused a</text><text x="260" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pension</text><rect x="458" y="124" width="198" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="162" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LANDOWNERS</text><text x="474" y="187.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Awadh</text><text x="474" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Estates lost after</text><text x="474" y="234" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">annexation (1856)</text><rect x="672" y="124" width="198" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="688" y="162" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELIGIOUS</text><text x="688" y="187.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Faith under threat</text><text x="688" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Railways, missionaries,</text><text x="688" y="234" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Western education</text><rect x="150" y="328" width="600" height="115" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="360" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1857-58</text><text x="450" y="388.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The rising</text><text x="450" y="418.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Delhi retaken September 1857; fighting over in 1858</text><line x1="129" y1="270" x2="300" y2="322" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="343" y1="270" x2="400" y2="322" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="557" y1="270" x2="500" y2="322" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="771" y1="270" x2="600" y2="322" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="465" width="840" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="497" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EFFECTS</text><text x="50" y="528.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="528.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Company rule passes to the Crown (1858); Victoria Empress of India (1877)</text><text x="50" y="553.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="553.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No more annexations: the princely states survive as allies</text><text x="50" y="578.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">More British troops; recruits from groups thought loyal, such as Sikhs</text><text x="50" y="603.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="603.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Officials more cautious on religious reform, more socially separate</text>
</svg>