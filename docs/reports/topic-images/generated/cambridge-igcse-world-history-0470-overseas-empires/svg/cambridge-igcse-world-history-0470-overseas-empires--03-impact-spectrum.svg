<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 509" width="900" height="509" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="509" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From indirect rule to mass violence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The lesson's judgement: impacts varied in method and intensity</text>
<text x="40" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">LESS DISRUPTION</text><text x="860" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">MORE DISRUPTION</text><defs><linearGradient id="sg124" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="169" width="780" height="26" rx="13" fill="url(#sg124)" stroke="#1e2a44" stroke-width="2.5"/><path d="M138,195 L138,218 L165.33333333333334,232 L165.33333333333334,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="138" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M450,195 L450,218 L450,232 L450,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="450" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M777.6,195 L777.6,218 L734.6666666666667,232 L734.6666666666667,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="777.6" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="252" width="270.6666666666667" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="279.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Northern Nigeria</text><text x="165.33333333333334" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Indirect rule left more of African</text><text x="165.33333333333334" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">society in place</text><rect x="314.6666666666667" y="252" width="270.6666666666667" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="279.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Senegal</text><text x="450" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Assimilation offered opportunity</text><text x="450" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">only to a few</text><rect x="599.3333333333334" y="252" width="270.6666666666667" height="92" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="734.6666666666667" y="279.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Congo</text><text x="734.6666666666667" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Lost political power and mass</text><text x="734.6666666666667" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">violence</text><rect x="30" y="366" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="400.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Impact varied within colonies too</text><text x="50" y="430.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Among the Igbo of southern Nigeria there were no large kingdoms with chiefs, so British officials</text><text x="50" y="452.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">appointed "warrant chiefs" with no traditional authority, who were widely resented.</text>
</svg>