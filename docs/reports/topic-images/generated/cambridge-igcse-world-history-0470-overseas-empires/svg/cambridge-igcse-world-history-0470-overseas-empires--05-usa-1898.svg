<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The USA and Spain's colonies, 1895-1906</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale: a war for Cuba that ended in empire</text>
