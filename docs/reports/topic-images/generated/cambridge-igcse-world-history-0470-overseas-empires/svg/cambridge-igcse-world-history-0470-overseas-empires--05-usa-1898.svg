0" y1="148" x2="720" y2="472" stroke="#c9d6d4" stroke-width="1.5"/><text x="720" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1906</text><line x1="780" y1="148" x2="780" y2="472" stroke="#c9d6d4" stroke-width="1.5"/><text x="780" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1907</text><line x1="840" y1="148" x2="840" y2="472" stroke="#c9d6d4" stroke-width="1.5"/><text x="840" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1908</text><rect x="270" y="396" width="210" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="488" y="418.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">US military government in Cuba</text><rect x="305.99999999999454" y="438" width="174.00000000000546" height="34" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="488" y="460.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Philippine-American War</text><line x1="40" y1="264" x2="860" y2="264" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><path d="M60,264 L60,248 L91.584,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="150" width="123.168" height="64" fill="#f4f6f6"/><text x="91.584" y="165" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1895</text><text x="91.584" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Cuban war</text><text x="91.584" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">begins (Martí)</text><path d="M255,264 L255,248 L255,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="203.168" y="150" width="103.664" height="64" fill="#f4f6f6"/><text x="255" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Apr 1898</text><text x="255" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">War; Teller</text><text x="255" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Amendment</text><path d="M420,264 L420,248 L420,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="339.93600000000004" y="150" width="160.128" height="64" fill="#f4f6f6"/><text x="420" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">1901</text><text x="420" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Platt Amendment;</text><text x="420" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Aguinaldo captured</text><path d="M780,264 L780,248 L780,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="737.232" y="150" width="85.536" height="64" fill="#f4f6f6"/><text x="780" y="165" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1907</text><text x="780" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Philippine</text><text x="780" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">assembly</text><path d="M244.99999999999545,264 L244.99999999999545,280 L244.99999999999545,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="182.03199999999543" y="314" width="125.936" height="64" fill="#f4f6f6"/><text x="244.99999999999545" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Feb 1898</text><text x="244.99999999999545" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">de Lôme letter;</text><text x="244.99999999999545" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the Maine</text><path d="M274.99999999999545,264 L274.99999999999545,280 L358.9359999999955,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="315.96799999999547" y="314" width="85.936" height="64" fill="#f4f6f6"/><text x="358.9359999999955" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Aug 1898</text><text x="358.9359999999955" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Manila</text><text x="358.9359999999955" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">captured</text><path d="M720,264 L720,280 L720,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="656.064" y="314" width="127.872" height="64" fill="#f4f6f6"/><text x="720" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1906</text><text x="720" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">US troops</text><text x="720" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">reoccupy Cuba</text><circle cx="60" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="244.99999999999545" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="255" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="274.99999999999545" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="420" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="720" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="780" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="498" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="532.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The judgement in the model answer</text><text x="50" y="562.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The war was fought for <tspan font-weight="700" fill="#1e2a44">Cuba</tspan>, but ended in a way that created an <tspan font-weight="700" fill="#1e2a44">empire</tspan>: imperial ambition</text><text x="50" y="584.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">explains the peace more than the war.</text>
