<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 499" width="900" height="499" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="499" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Effects on Cuba and the Philippines</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Independence in form, American control in practice</text>
<rect x="30" y="124" width="411" height="232" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CUBA</text><text x="50" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A protectorate</text><text x="50" y="222.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Teller Amendment: no annexation</text><text x="50" y="248.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="248.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">US military government (1898-1902)</text><text x="50" y="274.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="274.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Platt Amendment (1901): right to intervene;</text><text x="65.2" y="295.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Guantánamo Bay</text><text x="50" y="321.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="321.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">US troops back after the 1906 revolt</text><rect x="459" y="124" width="411" height="232" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE PHILIPPINES</text><text x="479" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A colony</text><text x="479" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kept by McKinley: "benevolent assimilation"</text><text x="479" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aguinaldo excluded from Manila; war from</text><text x="494.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">February 1899</text><text x="479" y="284.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">War declared over in 1902</text><text x="479" y="310.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Taft: schools, roads, an assembly from 1907,</text><text x="494.2" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">under US control</text><rect x="30" y="378" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="412.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Watch out</text><text x="450" y="442.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The Teller Amendment concerned <tspan font-weight="700" fill="#1e2a44">Cuba</tspan> <tspan font-weight="700" fill="#1e2a44">only</tspan>, not the Philippines.</text>
</svg>