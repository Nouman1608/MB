<rect width="900" height="754" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which values fit which variables</text>

<text x="130" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">VALUE TYPE</text><text x="770" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">VARIABLE TYPE</text><rect x="30" y="150" width="200" height="110" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="130" y="194" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">int</text><text x="130" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">value, e.g.</text><text x="130" y="248" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">3 + 2  →  5</text><rect x="30" y="300" width="200" height="110" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="130" y="344" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">double</text><text x="130" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">value, e.g.</text><text x="130" y="398" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">3 + 2.0  →  5.0</text><rect x="30" y="450" width="200" height="110" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="130" y="494" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">boolean</text><text x="130" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">value, e.g.</text><text x="130" y="548" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">true</text><rect x="670" y="165" width="200" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="770" y="203" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">int</text><text x="770" y="227" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">variable</text><rect x="670" y="315" width="200" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="770" y="353" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">double</text><text x="770" y="377" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">variable</text><rect x="670" y="465" width="200" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="770" y="503" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">boolean</text><text x="770" y="527" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">variable</text><line x1="236" y1="205" x2="662" y2="205" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="449" y="196" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">allowed</text><line x1="236" y1="225" x2="662" y2="345" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="449" y="300" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">allowed: stored as 5.0</text><line x1="236" y1="355" x2="662" y2="355" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="449" y="372" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">allowed</text><line x1="236" y1="505" x2="662" y2="505" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="449" y="496" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">boolean only</text><line x1="236" y1="335" x2="560" y2="230" stroke="#b5602e" stroke-width="4" stroke-dasharray="9 7"/><circle cx="590" cy="220" r="20" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M580,210 l20,20 M600,210 l-20,20" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="430" y="258" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">not allowed</text><rect x="30" y="590" width="411" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="623" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMPILES</text><text x="50" y="650.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">double d = a + 2;</text><text x="50" y="678.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">an int value in a double variable: holds 5.0</text><rect x="459" y="590" width="411" height="134" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="623" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DOES NOT COMPILE</text><text x="479" y="650.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">int n = 2.5 * 2;</text><text x="479" y="678.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the value is a double, even though 5.0 looks</text><text x="479" y="699.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">whole</text>
</svg>