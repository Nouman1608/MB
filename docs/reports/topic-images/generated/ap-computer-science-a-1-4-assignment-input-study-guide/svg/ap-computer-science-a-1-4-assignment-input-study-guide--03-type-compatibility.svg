<text x="585" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">STORED IN A VARIABLE OF TYPE</text><rect x="304" y="144" width="182" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="395" y="178" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">int</text><rect x="494" y="144" width="182" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="585" y="178" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">double</text><rect x="684" y="144" width="182" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="775" y="178" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">boolean</text><text x="40" y="178" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">VALUE OF TYPE</text><rect x="30" y="210" width="258" height="96" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="250" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">int</text><text x="48" y="282" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">3 + 2  is  5</text><rect x="304" y="210" width="182" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="395" cy="258" r="18" fill="#2e6b62"/><path d="M386,258 l6,7 l12,-14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="494" y="210" width="182" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="585" cy="246" r="18" fill="#2e6b62"/><path d="M576,246 l6,7 l12,-14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="290" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">stored as 5.0</text><rect x="684" y="210" width="182" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="775" cy="258" r="18" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M767,250 l16,16 M783,250 l-16,16" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="314" width="258" height="96" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="354" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">double</text><text x="48" y="386" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">3 + 2.0  is  5.0</text><rect x="304" y="314" width="182" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="395" cy="350" r="18" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M387,342 l16,16 M403,342 l-16,16" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="395" y="394" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">even if it looks whole</text><rect x="494" y="314" width="182" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="585" cy="362" r="18" fill="#2e6b62"/><path d="M576,362 l6,7 l12,-14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="684" y="314" width="182" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="775" cy="362" r="18" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M767,354 l16,16 M783,354 l-16,16" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="418" width="258" height="96" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="458" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">boolean</text><text x="48" y="490" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">true</text><rect x="304" y="418" width="182" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="395" cy="466" r="18" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M387,458 l16,16 M403,458 l-16,16" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="494" y="418" width="182" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="585" cy="466" r="18" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M577,458 l16,16 M593,458 l-16,16" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="684" y="418" width="182" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="775" cy="466" r="18" fill="#2e6b62"/><path d="M766,466 l6,7 l12,-14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="538" width="411" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="571" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMPILES</text><text x="50" y="598.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">double d = a + 2;</text><text x="50" y="626.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">an int value in a double variable: holds 5.0</text><rect x="459" y="538" width="411" height="134" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="571" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DOES NOT COMPILE</text><text x="479" y="598.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">int n = 2.5 * 2;</text><text x="479" y="626.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the value is a double, even though 5.0 looks</text><text x="479" y="647.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">whole</text>
