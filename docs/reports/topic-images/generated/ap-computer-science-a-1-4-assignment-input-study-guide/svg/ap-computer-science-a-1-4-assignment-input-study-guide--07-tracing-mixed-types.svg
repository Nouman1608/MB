<rect x="30" y="110" width="192" height="139" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOVE 1</text><text x="44" y="162.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Column per</text><text x="44" y="184.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">variable</text><text x="44" y="211" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">with its type above</text><line x1="228" y1="179.5" x2="240" y2="179.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="246" y="110" width="192" height="139" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOVE 2</text><text x="260" y="162.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">One statement at a</text><text x="260" y="184.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">time</text><text x="260" y="211" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">top to bottom, never</text><text x="260" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">skip</text><line x1="444" y1="179.5" x2="456" y2="179.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="462" y="110" width="192" height="139" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOVE 3</text><text x="476" y="162.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Right side first</text><text x="476" y="189" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">value and its type,</text><text x="476" y="209" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">from current values</text><line x1="660" y1="179.5" x2="672" y2="179.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="678" y="110" width="192" height="139" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="692" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MOVE 4</text><text x="692" y="162.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Overwrite only the</text><text x="692" y="184.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">left</text><text x="692" y="211" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">copy the rest down; int</text><text x="692" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">into double gets .0</text><rect x="30" y="273" width="840" height="48" rx="10" fill="#1e2a44"/><text x="44" y="304" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">After statement</text><text x="391" y="297" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">items</text><text x="391" y="315" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">int</text><text x="473" y="297" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">price</text><text x="473" y="315" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">double</text><text x="555" y="297" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">cost</text><text x="555" y="315" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">double</text><text x="610" y="304" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Working</text><rect x="30" y="321" width="840" height="46" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="350" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">int items = 4;</text><rect x="356" y="327" width="70" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="391" y="351" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="350" y1="321" x2="350" y2="367" stroke="#c9d6d4" stroke-width="2"/><text x="473" y="351" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">-</text><line x1="432" y1="321" x2="432" y2="367" stroke="#c9d6d4" stroke-width="2"/><text x="555" y="351" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">-</text><line x1="514" y1="321" x2="514" y2="367" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="367" width="840" height="46" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="396" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">double price = 2.5;</text><text x="391" y="397" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">4</text><line x1="350" y1="367" x2="350" y2="413" stroke="#c9d6d4" stroke-width="2"/><rect x="438" y="373" width="70" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="473" y="397" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2.5</text><line x1="432" y1="367" x2="432" y2="413" stroke="#c9d6d4" stroke-width="2"/><text x="555" y="397" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">-</text><line x1="514" y1="367" x2="514" y2="413" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="413" width="840" height="46" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="442" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">double cost = items * price;</text><text x="391" y="443" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">4</text><line x1="350" y1="413" x2="350" y2="459" stroke="#c9d6d4" stroke-width="2"/><text x="473" y="443" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">2.5</text><line x1="432" y1="413" x2="432" y2="459" stroke="#c9d6d4" stroke-width="2"/><rect x="520" y="419" width="70" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="555" y="443" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">10.0</text><line x1="514" y1="413" x2="514" y2="459" stroke="#c9d6d4" stroke-width="2"/><line x1="596" y1="413" x2="596" y2="459" stroke="#c9d6d4" stroke-width="2"/><text x="608" y="441" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">4 * 2.5 is the double 10.0</text><rect x="30" y="459" width="840" height="46" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="488" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">items = items + 1;</text><rect x="356" y="465" width="70" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="391" y="489" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="350" y1="459" x2="350" y2="505" stroke="#c9d6d4" stroke-width="2"/><text x="473" y="489" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">2.5</text><line x1="432" y1="459" x2="432" y2="505" stroke="#c9d6d4" stroke-width="2"/><text x="555" y="489" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">10.0</text><line x1="514" y1="459" x2="514" y2="505" stroke="#c9d6d4" stroke-width="2"/><line x1="596" y1="459" x2="596" y2="505" stroke="#c9d6d4" stroke-width="2"/><text x="608" y="487" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">uses the old items, 4</text><rect x="30" y="505" width="840" height="46" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="534" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cost = cost + items * price;</text><text x="391" y="535" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">5</text><line x1="350" y1="505" x2="350" y2="551" stroke="#c9d6d4" stroke-width="2"/><text x="473" y="535" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">2.5</text><line x1="432" y1="505" x2="432" y2="551" stroke="#c9d6d4" stroke-width="2"/><rect x="520" y="511" width="70" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="555" y="535" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">22.5</text><line x1="514" y1="505" x2="514" y2="551" stroke="#c9d6d4" stroke-width="2"/><line x1="596" y1="505" x2="596" y2="551" stroke="#c9d6d4" stroke-width="2"/><text x="608" y="533" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">5 * 2.5 = 12.5; 10.0 + 12.5 = 22.5</text><rect x="30" y="551" width="840" height="46" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="580" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">price = items;</text><text x="391" y="581" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">5</text><line x1="350" y1="551" x2="350" y2="597" stroke="#c9d6d4" stroke-width="2"/><rect x="438" y="557" width="70" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="473" y="581" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5.0</text><line x1="432" y1="551" x2="432" y2="597" stroke="#c9d6d4" stroke-width="2"/><text x="555" y="581" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">22.5</text><line x1="514" y1="551" x2="514" y2="597" stroke="#c9d6d4" stroke-width="2"/><line x1="596" y1="551" x2="596" y2="597" stroke="#c9d6d4" stroke-width="2"/><text x="608" y="579" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">int 5 stored in a double: 5.0</text><rect x="30" y="617" width="410" height="64" rx="12" fill="#1e2a44"/><text x="50" y="657" font-size="17" font-weight="700" fill="#b5d3cf" text-anchor="start">Prints</text><text x="120" y="658" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">5 5.0 22.5</text><rect x="460" y="617" width="410" height="64" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><text x="476" y="645" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">items = price;</text><text x="476" y="669" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">would not compile: double into int</text>
