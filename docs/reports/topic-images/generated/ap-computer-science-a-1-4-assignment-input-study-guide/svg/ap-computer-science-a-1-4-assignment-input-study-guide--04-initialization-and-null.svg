<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 768" width="900" height="768" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="768" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Uninitialized variables and null</text>

<text x="30" y="132" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Not initialized</text><rect x="30" y="148" width="400" height="82" rx="12" fill="#1e2a44"/><text x="48" y="178" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">int y;</text><text x="48" y="206" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" fill="#d4b02e" text-anchor="start">int z = y + 1;</text><text x="570" y="164" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">y</text><rect x="510" y="176" width="120" height="64" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="570" y="216" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">?</text><text x="570" y="262" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">declared, no value</text><rect x="30" y="244" width="840" height="44" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="7 5"/><text x="46" y="273" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">error: variable y might not have been initialized</text><text x="680" y="200" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Fix: int y = 0;</text><text x="680" y="226" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">assign before any use</text><text x="30" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reference variables</text><rect x="30" y="346" width="400" height="82" rx="12" fill="#1e2a44"/><text x="48" y="376" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">String title = "Dune";</text><text x="48" y="404" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">String empty = null;</text><text x="120" y="468" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">title</text><rect x="60" y="480" width="120" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="120" y="520" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="120" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">String</text><circle cx="120" cy="512" r="7" fill="#1e2a44"/><line x1="127" y1="512" x2="336" y2="512" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="342" y="474" width="200" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="442" y="498" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">String object</text><text x="442" y="530" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">"Dune"</text><text x="120" y="598" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">empty</text><rect x="60" y="610" width="120" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="120" y="650" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#4a5568" text-anchor="middle">null</text><text x="120" y="696" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">String</text><text x="200" y="648" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">refers to no object at all</text><rect x="580" y="476" width="290" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="504" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">int n = null;</text><text x="596" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">does not compile: primitives cannot</text><text x="596" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hold null</text><rect x="580" y="570" width="290" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="598" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">""</text><text x="596" y="622" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">an actual empty String object, not</text><text x="596" y="642" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">null</text><rect x="580" y="654" width="290" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="682" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">empty.length()</text><text x="596" y="706" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">calling a method on null:</text><text x="596" y="726" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">NullPointerException</text>
</svg>