<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tracing four assignments</text>

<rect x="30" y="110" width="400" height="166" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">int a = 3;</text><text x="48" y="168" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">int b = a + 2;</text><text x="48" y="196" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">a = a * b;</text><text x="48" y="224" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">b = b - a;</text><text x="48" y="252" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">System.out.println(a + " " + b);</text><rect x="460" y="110" width="410" height="166" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="146" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Output</text><text x="480" y="186" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="start">15 -10</text><text x="480" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">b uses the new a (15), not the old one (3)</text><rect x="30" y="300" width="840" height="48" rx="10" fill="#1e2a44"/><text x="44" y="331" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">After statement</text><text x="310" y="324" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">a</text><text x="310" y="342" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">int</text><text x="410" y="324" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">b</text><text x="410" y="342" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">int</text><text x="474" y="331" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Working</text><rect x="30" y="348" width="840" height="46" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="377" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">int a = 3;</text><rect x="266" y="354" width="88" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="310" y="378" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="260" y1="348" x2="260" y2="394" stroke="#c9d6d4" stroke-width="2"/><text x="410" y="378" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">-</text><line x1="360" y1="348" x2="360" y2="394" stroke="#c9d6d4" stroke-width="2"/><line x1="460" y1="348" x2="460" y2="394" stroke="#c9d6d4" stroke-width="2"/><text x="472" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the literal 3 is stored</text><rect x="30" y="394" width="840" height="46" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="423" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">int b = a + 2;</text><text x="310" y="424" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">3</text><line x1="260" y1="394" x2="260" y2="440" stroke="#c9d6d4" stroke-width="2"/><rect x="366" y="400" width="88" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="410" y="424" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="360" y1="394" x2="360" y2="440" stroke="#c9d6d4" stroke-width="2"/><line x1="460" y1="394" x2="460" y2="440" stroke="#c9d6d4" stroke-width="2"/><text x="472" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a + 2 is 5</text><rect x="30" y="440" width="840" height="46" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="469" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a = a * b;</text><rect x="266" y="446" width="88" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="310" y="470" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">15</text><line x1="260" y1="440" x2="260" y2="486" stroke="#c9d6d4" stroke-width="2"/><text x="410" y="470" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">5</text><line x1="360" y1="440" x2="360" y2="486" stroke="#c9d6d4" stroke-width="2"/><line x1="460" y1="440" x2="460" y2="486" stroke="#c9d6d4" stroke-width="2"/><text x="472" y="468" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">current a (3) and b (5): 15</text><rect x="30" y="486" width="840" height="46" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="515" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">b = b - a;</text><text x="310" y="516" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">15</text><line x1="260" y1="486" x2="260" y2="532" stroke="#c9d6d4" stroke-width="2"/><rect x="366" y="492" width="88" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="410" y="516" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">-10</text><line x1="360" y1="486" x2="360" y2="532" stroke="#c9d6d4" stroke-width="2"/><line x1="460" y1="486" x2="460" y2="532" stroke="#c9d6d4" stroke-width="2"/><text x="472" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">uses the new a (15): 5 - 15 is -10</text><text x="30" y="562" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Highlighted cell: the only variable each statement changes</text>
</svg>