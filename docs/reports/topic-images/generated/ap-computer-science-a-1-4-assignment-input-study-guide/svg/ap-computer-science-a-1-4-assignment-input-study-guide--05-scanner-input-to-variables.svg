<rect width="900" height="884" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Input becomes values in variables</text>

<text x="30" y="132" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Input typed, one item per line:</text><text x="318" y="132" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start">Ada Lovelace⏎ 36⏎ 1.65⏎</text><text x="110" y="172" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">INPUT ITEM</text><text x="430" y="172" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">ASSIGNMENT</text><text x="760" y="172" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">VARIABLE</text><rect x="30" y="190" width="160" height="56" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="225" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Ada Lovelace</text><line x1="194" y1="218" x2="222" y2="218" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="228" y="190" width="402" height="56" rx="10" fill="#1e2a44"/><text x="244" y="225" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">String name = in.nextLine();</text><line x1="634" y1="218" x2="664" y2="218" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="670" y="190" width="200" height="56" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="770" y="216" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">"Ada Lovelace"</text><text x="770" y="237" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">name (String)</text><rect x="30" y="286" width="160" height="56" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="321" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">36</text><line x1="194" y1="314" x2="222" y2="314" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="228" y="286" width="402" height="56" rx="10" fill="#1e2a44"/><text x="244" y="321" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">int age = in.nextInt();</text><line x1="634" y1="314" x2="664" y2="314" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="670" y="286" width="200" height="56" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="770" y="312" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">36</text><text x="770" y="333" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">age (int)</text><rect x="30" y="382" width="160" height="56" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="417" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">1.65</text><line x1="194" y1="410" x2="222" y2="410" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="228" y="382" width="402" height="56" rx="10" fill="#1e2a44"/><text x="244" y="417" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">double height = in.nextDouble();</text><line x1="634" y1="410" x2="664" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="670" y="382" width="200" height="56" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="770" y="408" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1.65</text><text x="770" y="429" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">height (double)</text><rect x="30" y="492" width="840" height="50" rx="10" fill="#1e2a44"/><text x="44" y="523" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Method</text><text x="274" y="523" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Returns</text><rect x="30" y="542" width="840" height="48" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="570.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">nextInt()</text><text x="274" y="570.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the next int</text><line x1="260" y1="542" x2="260" y2="590" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="590" width="840" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="618.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">nextDouble()</text><text x="274" y="618.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the next double</text><line x1="260" y1="590" x2="260" y2="638" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="638" width="840" height="48" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="666.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">nextBoolean()</text><text x="274" y="666.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the next boolean</text><line x1="260" y1="638" x2="260" y2="686" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="686" width="840" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="714.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">next()</text><text x="274" y="714.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the next word, as a String</text><line x1="260" y1="686" x2="260" y2="734" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="734" width="840" height="48" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="762.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">nextLine()</text><text x="274" y="762.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the rest of the line, as a String</text><line x1="260" y1="734" x2="260" y2="782" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="798" width="840" height="56" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><text x="450" y="833" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Typing abc when nextInt() is called throws an InputMismatchException at run time</text>
</svg>