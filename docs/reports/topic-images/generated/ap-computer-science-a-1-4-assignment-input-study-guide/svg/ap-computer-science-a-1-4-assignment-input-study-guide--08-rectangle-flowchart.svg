<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: the rectangle program</text>

<rect x="180" y="120" width="140" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="250" y="149" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">start</text><line x1="250" y1="166" x2="250" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><path d="M80,196 L460,196 L420,258 L40,258 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round"/><text x="250" y="233" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">double length = in.nextDouble();</text><line x1="464" y1="227" x2="490" y2="227" stroke="#4a5568" stroke-width="2" stroke-dasharray="4 4"/><text x="498" y="233" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">input 4.5  →  4.5</text><line x1="250" y1="260" x2="250" y2="286" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><path d="M80,290 L460,290 L420,352 L40,352 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round"/><text x="250" y="327" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">double width = in.nextDouble();</text><line x1="464" y1="321" x2="490" y2="321" stroke="#4a5568" stroke-width="2" stroke-dasharray="4 4"/><text x="498" y="327" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">input 3  →  3.0</text><line x1="250" y1="354" x2="250" y2="380" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="384" width="380" height="62" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="250" y="421" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">double area = length * width;</text><line x1="464" y1="415" x2="490" y2="415" stroke="#4a5568" stroke-width="2" stroke-dasharray="4 4"/><text x="498" y="421" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">4.5 * 3.0  =  13.5</text><line x1="250" y1="448" x2="250" y2="474" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="478" width="380" height="62" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="250" y="515" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">double perimeter = 2 * (length + width);</text><line x1="464" y1="509" x2="490" y2="509" stroke="#4a5568" stroke-width="2" stroke-dasharray="4 4"/><text x="498" y="515" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">bracket first: 7.5, then 2 * 7.5 = 15.0</text><line x1="250" y1="542" x2="250" y2="568" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><path d="M80,572 L460,572 L420,634 L40,634 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round"/><text x="250" y="609" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">print area and perimeter</text><line x1="464" y1="603" x2="490" y2="603" stroke="#4a5568" stroke-width="2" stroke-dasharray="4 4"/><text x="498" y="609" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Area: 13.5   Perimeter: 15.0</text><line x1="250" y1="636" x2="250" y2="662" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="180" y="666" width="140" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="250" y="695" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">end</text><rect x="30" y="736" width="300" height="46" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="180" y="764.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">input / output</text><rect x="350" y="736" width="300" height="46" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="764.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">process (assignment)</text><rect x="30" y="802" width="840" height="56" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><text x="450" y="837" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Typing abc for the length: nextDouble() throws an InputMismatchException (run-time error)</text>
