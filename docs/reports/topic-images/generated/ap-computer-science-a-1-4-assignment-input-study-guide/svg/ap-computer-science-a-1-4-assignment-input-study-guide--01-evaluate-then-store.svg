<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Assignment: right side first, then store</text>

<rect x="318" y="100" width="264" height="62" rx="12" fill="#1e2a44"/><text x="348" y="142" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="34" font-weight="700" fill="#ffffff" text-anchor="start">a = a * b;</text><line x1="348" y1="176" x2="368.4" y2="176" stroke="#8a6d0d" stroke-width="5"/><line x1="429.6" y1="176" x2="531.6" y2="176" stroke="#2e6b62" stroke-width="5"/><text x="358" y="206" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">2  store here</text><text x="480.6" y="206" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">1  evaluate first</text><rect x="30" y="290" width="260" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="324" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Before</text><text x="100" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text><rect x="55" y="370" width="90" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="100" y="410" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="220" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">b</text><rect x="175" y="370" width="90" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="220" y="410" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="296" y1="402" x2="340" y2="402" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="346" y="290" width="210" height="200" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="451" y="324" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Right side</text><text x="451" y="382" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">a * b</text><text x="451" y="416" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle">3 * 5</text><text x="451" y="458" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">15</text><text x="451" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">one value, type int</text><line x1="562" y1="402" x2="606" y2="402" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="612" y="290" width="258" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="741" y="324" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">After</text><text x="682" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text><rect x="637" y="370" width="90" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="682" y="410" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">15</text><text x="802" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">b</text><rect x="757" y="370" width="90" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="802" y="410" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="520" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="554" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Not an equation: an instruction</text><text x="450" y="582" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"take the current a, multiply by b, and put the result back in a"</text>
</svg>