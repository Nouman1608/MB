<rect width="900" height="703" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing your NEA text</text>

<rect x="30" y="116" width="840" height="76" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="145.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A substantial whole prose fiction text</text><text x="450" y="173.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">not a short novella or a single short story</text><circle cx="60" cy="154" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="159.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="450" y1="196" x2="450" y2="218" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="66" y="222" width="768" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="251.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Not on the 9275 prescribed list</text><text x="450" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the Paper 1 prose list changes with the revised specification</text><circle cx="96" cy="260" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="96" y="265.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="450" y1="302" x2="450" y2="324" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="102" y="328" width="696" height="76" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="357.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Canon of the British Isles or seminal world literature</text><text x="450" y="385.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">any literary period</text><circle cx="132" cy="366" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="132" y="371.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="450" y1="408" x2="450" y2="430" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="138" y="434" width="624" height="101" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="463.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Similar in quality, scope and challenge to the Paper 1</text><text x="450" y="488.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">set texts</text><text x="450" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">enough narrative method, structure and language to analyse</text><circle cx="168" cy="484.5" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="168" y="490.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="450" y1="539" x2="450" y2="561" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="130" y="565" width="640" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="598" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">EXAMPLES OF THE KIND OF TEXT THAT MEETS THE STANDARD</text><text x="450" y="625" font-size="20" font-weight="700" font-style="italic" fill="#1e2a44" text-anchor="middle">Jane Eyre · Frankenstein · Things Fall Apart</text><text x="450" y="681" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Your teacher will guide or confirm the choice. Pick a text you will enjoy rereading.</text>
</svg>