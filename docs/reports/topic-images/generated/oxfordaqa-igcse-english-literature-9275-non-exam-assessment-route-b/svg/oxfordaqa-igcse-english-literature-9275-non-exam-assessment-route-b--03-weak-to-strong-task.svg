<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Framing the task</text>

<text x="235" y="122" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Weak task</text><text x="680" y="122" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Strong task</text><rect x="30" y="138" width="410" height="102" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="193.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Write about the main character.”</text><rect x="490" y="138" width="380" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="510" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“How does the writer present the main</text><text x="510" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">character’s struggle between duty and</text><text x="510" y="215.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">desire?”</text><line x1="444" y1="189" x2="484" y2="189" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="254" width="410" height="102" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="309.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“What happens in the novel?”</text><rect x="490" y="254" width="380" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="510" y="287.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“How does the writer use the novel’s</text><text x="510" y="309.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">structure to shape the reader’s</text><text x="510" y="331.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sympathy?”</text><line x1="444" y1="305" x2="484" y2="305" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="370" width="410" height="102" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="425.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Is the ending good?”</text><rect x="490" y="370" width="380" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="510" y="403.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“How far does the ending resolve the</text><text x="510" y="425.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">novel’s central conflict about</text><text x="510" y="447.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">belonging?”</text><line x1="444" y1="421" x2="484" y2="421" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="30" y="504" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">A strong task…</text><rect x="30" y="516" width="269.3333333333333" height="61" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164.66666666666666" y="551.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Has a focus</text><rect x="315.3333333333333" y="516" width="269.3333333333333" height="61" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="551.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Invites an argument</text><rect x="600.6666666666666" y="516" width="269.3333333333333" height="61" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="735.3333333333333" y="551.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Points to methods</text>
</svg>