<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Drafting and revising in order</text>

<line x1="62" y1="136" x2="62" y2="492" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="116" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Write a full first draft</text><text x="128" y="181.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Before polishing any part of it.</text><circle cx="62" cy="161" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="169.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="218" width="762" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="254" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Revise for argument</text><text x="128" y="283.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Does every paragraph advance the thesis? Can any be cut?</text><circle cx="62" cy="263" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="271.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="320" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="356" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Revise for analysis</text><text x="128" y="385.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">After each quotation, have you explained the method and its effect?</text><circle cx="62" cy="365" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="373.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="422" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="458" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Edit for accuracy</text><text x="128" y="487.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Quotations checked against the text; spelling, punctuation and terminology.</text><circle cx="62" cy="467" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="475.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="530" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="563.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Keep notes and drafts: your centre may need them to confirm the work is your own. Record</text><text x="50" y="585.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">any sources you use.</text>
</svg>