<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning your time</text>

<line x1="60" y1="280" x2="830" y2="280" stroke="#1e2a44" stroke-width="4"/><circle cx="60" cy="280" r="11" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><line x1="60" y1="269" x2="60" y2="256" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="198" width="160" height="58" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="110" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Reread with the</text><text x="110" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">task in mind</text><circle cx="200" cy="280" r="11" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><line x1="200" y1="291" x2="200" y2="304" stroke="#2e6b62" stroke-width="2.5"/><rect x="120" y="304" width="160" height="79" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="200" y="326.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Gather and</text><text x="200" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">organise</text><text x="200" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">evidence</text><circle cx="340" cy="280" r="11" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><line x1="340" y1="269" x2="340" y2="256" stroke="#2e6b62" stroke-width="2.5"/><rect x="260" y="219" width="160" height="37" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="340" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Write a plan</text><circle cx="480" cy="280" r="11" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><line x1="480" y1="291" x2="480" y2="304" stroke="#2e6b62" stroke-width="2.5"/><rect x="400" y="304" width="160" height="37" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="326.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Complete a draft</text><circle cx="620" cy="280" r="11" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><line x1="620" y1="269" x2="620" y2="256" stroke="#2e6b62" stroke-width="2.5"/><rect x="540" y="198" width="160" height="58" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Revise the</text><text x="620" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">argument</text><circle cx="760" cy="280" r="11" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><line x1="760" y1="291" x2="760" y2="304" stroke="#2e6b62" stroke-width="2.5"/><rect x="680" y="304" width="160" height="58" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="760" y="326.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Final accuracy</text><text x="760" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">check</text><rect x="806" y="248" width="64" height="64" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="838" y="276" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Dead-</text><text x="838" y="294" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">line</text><line x1="800" y1="416" x2="80" y2="416" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="444" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">plan the dates working backwards from your centre’s deadline</text><rect x="30" y="466" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="499.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Short, regular sessions are better than one long weekend. Leaving it late leaves no time to</text><text x="50" y="521.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">revise the argument.</text>
