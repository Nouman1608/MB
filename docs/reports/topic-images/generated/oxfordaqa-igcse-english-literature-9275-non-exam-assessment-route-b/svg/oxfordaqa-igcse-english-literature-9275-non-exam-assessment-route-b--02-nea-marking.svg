<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the NEA is marked</text>

<text x="30" y="128" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The NEA is 20% of the qualification</text><rect x="30" y="140" width="336" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="198" y="178" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1 · 8%</text><text x="198" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">themes, ideas, contexts</text><rect x="366" y="140" width="336" height="60" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="534" y="178" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2 · 8%</text><text x="534" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">how writers create meanings</text><rect x="702" y="140" width="168" height="60" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="786" y="178" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3 · 4%</text><text x="786" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">personal response,</text><text x="786" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">terminology,</text><text x="786" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">accuracy</text><text x="30" y="290" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Six levels (30 marks)</text><rect x="30" y="590" width="62" height="60" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="61" y="620" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">L1</text><line x1="92" y1="608" x2="470" y2="608" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><rect x="476" y="574" width="394" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="488" y="599" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEVEL 1 · 1–5</text><text x="488" y="628.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">simple, explicit comments; narrative or</text><text x="488" y="649.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">descriptive</text><rect x="100" y="540" width="62" height="110" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="131" y="570" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">L2</text><rect x="170" y="490" width="62" height="160" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="201" y="520" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">L3</text><rect x="240" y="440" width="62" height="210" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="271" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">L4</text><line x1="302" y1="458" x2="470" y2="458" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><rect x="476" y="424" width="394" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="488" y="449" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEVEL 4 · 16–20</text><text x="488" y="478.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clear understanding</text><rect x="310" y="390" width="62" height="260" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="341" y="420" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">L5</text><rect x="380" y="340" width="62" height="310" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="411" y="370" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">L6</text><line x1="442" y1="358" x2="470" y2="358" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><rect x="476" y="324" width="394" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="488" y="349" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEVEL 6 · 26–30</text><text x="488" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">convincing, critical analysis and</text><text x="488" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exploration</text><line x1="170" y1="664" x2="450" y2="664" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="170" y="690" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">from Level 3 up: descriptors refer to the whole text</text>
</svg>