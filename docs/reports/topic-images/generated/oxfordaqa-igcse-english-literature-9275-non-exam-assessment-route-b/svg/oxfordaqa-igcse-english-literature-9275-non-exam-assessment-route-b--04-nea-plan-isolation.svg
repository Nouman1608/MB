<rect width="900" height="704" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An NEA plan across the whole novel</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How does the writer present the theme of isolation?</text>
<rect x="30" y="148" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="181" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THESIS (ARGUABLE)</text><text x="50" y="208" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Isolation is both a punishment and a source of self-knowledge.</text><text paint-order="stroke" stroke="#f4f6f6" stroke-width="6" x="450" y="254" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">final pages echo the opening</text><rect x="30" y="280" width="158.4" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="109.2" y="310.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Opening</text><text x="109.2" y="332.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">chapters</text><text x="109.2" y="359" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">narrative voice;</text><text x="109.2" y="379" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">viewpoint</text><rect x="200.4" y="280" width="158.4" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="279.6" y="321.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Setting</text><text x="279.6" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">description and</text><text x="279.6" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">symbol</text><rect x="370.8" y="280" width="158.4" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="321.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Relationships</text><text x="450" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">dialogue; where</text><text x="450" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">it appears</text><rect x="541.2" y="280" width="158.4" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.4000000000001" y="321.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Turning point</text><text x="620.4000000000001" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">structural</text><text x="620.4000000000001" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">significance</text><rect x="711.6" y="280" width="158.4" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="790.8000000000001" y="311.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ending</text><text x="790.8000000000001" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">overcome,</text><text x="790.8000000000001" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">accepted or made</text><text x="790.8000000000001" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">permanent?</text><line x1="60" y1="424" x2="850" y2="424" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><circle cx="109.2" cy="424" r="8" fill="#2e6b62"/><text x="109.2" y="452" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">beginning</text><circle cx="450" cy="424" r="8" fill="#2e6b62"/><text x="450" y="452" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">middle</text><circle cx="790.8000000000001" cy="424" r="8" fill="#2e6b62"/><text x="790.8000000000001" y="452" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">end</text><path d="M790.8000000000001,276 C790.8000000000001,250 109.2,250 109.2,276" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#ahO)"/><text x="30" y="492" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">In every section</text><rect x="30" y="500" width="269.3333333333333" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164.66666666666666" y="533" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">AO2</text><text x="164.66666666666666" y="558.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Method analysis</text><rect x="315.3333333333333" y="500" width="269.3333333333333" height="84" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="533" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">AO1</text><text x="450" y="558.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Themes and context</text><rect x="600.6666666666666" y="500" width="269.3333333333333" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="735.3333333333333" y="533" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">AO3</text><text x="735.3333333333333" y="558.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">An argued voice</text><rect x="30" y="600" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="633.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Conclusion: return to the thesis and offer a personal judgement, perhaps acknowledging an</text><text x="50" y="655.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">alternative reading.</text>
</svg>