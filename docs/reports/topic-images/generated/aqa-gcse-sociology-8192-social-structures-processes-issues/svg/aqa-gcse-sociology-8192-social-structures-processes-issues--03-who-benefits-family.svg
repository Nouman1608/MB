<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 781" width="900" height="781" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="781" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same question, different answers</text>

<circle cx="450" cy="300" r="96" fill="#1e2a44"/><text x="450" y="292" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Who benefits</text><text x="450" y="318" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">from the family?</text><rect x="30" y="120" width="300" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L315.75,121.25 Q328.75,121.25 328.75,134.25 L328.75,170 Z" fill="#b5d3cf"/><line x1="31.25" y1="170" x2="328.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="180" y="150.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist: Parsons</text><text x="46" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Members and society: primary</text><text x="46" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">socialisation and stabilisation</text><text x="46" y="244" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of adult personalities</text><rect x="570" y="120" width="300" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M571.25,170 L571.25,134.25 Q571.25,121.25 584.25,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#dce9e7"/><line x1="571.25" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="720" y="150.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist: Zaretsky</text><text x="586" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Capitalism: unpaid domestic</text><text x="586" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">labour reproduces workers; the</text><text x="586" y="244" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">family is a unit of consumption</text><rect x="300" y="430" width="300" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M301.25,500 L301.25,444.25 Q301.25,431.25 314.25,431.25 L585.75,431.25 Q598.75,431.25 598.75,444.25 L598.75,500 Z" fill="#f2e7b8"/><line x1="301.25" y1="500" x2="598.75" y2="500" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="458.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist: Delphy and</text><text x="450" y="482.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Leonard</text><text x="316" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Men: the family is an economic</text><text x="316" y="552" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">system in which men appropriate</text><text x="316" y="574" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">women’s work</text><line x1="355" y1="260" x2="334" y2="245" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="545" y1="260" x2="566" y2="245" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="400" x2="450" y2="424" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="624" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="660" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judge</text><text x="56" y="689" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A dual-earner couple where the woman still does most housework fits Delphy and Leonard</text><text x="56" y="711" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">better; yet Zaretsky explains why family spending supports the economy, so capitalism and</text><text x="56" y="733" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">patriarchy may both benefit.</text>
</svg>