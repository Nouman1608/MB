<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What official statistics miss</text>

<rect x="30" y="108" width="268" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,159 L31.25,122.25 Q31.25,109.25 44.25,109.25 L283.75,109.25 Q296.75,109.25 296.75,122.25 L296.75,159 Z" fill="#b5d3cf"/><line x1="31.25" y1="159" x2="296.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="164" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Divorce</text><text x="48" y="194" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COUNTED</text><rect x="46" y="204" width="236" height="54" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="164" y="236.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Legal divorces</text><text x="48" y="290" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MISSED</text><rect x="46" y="300" width="236" height="210" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="8 6"/><circle cx="67" cy="328.39" r="4.5" fill="#b5602e"/><text x="80" y="334" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Separations without</text><text x="80" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">divorce</text><circle cx="67" cy="380.39" r="4.5" fill="#b5602e"/><text x="80" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Empty shell marriages</text><rect x="316" y="108" width="268" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M317.25,159 L317.25,122.25 Q317.25,109.25 330.25,109.25 L569.75,109.25 Q582.75,109.25 582.75,122.25 L582.75,159 Z" fill="#b5d3cf"/><line x1="317.25" y1="159" x2="582.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Crime</text><text x="334" y="194" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COUNTED</text><rect x="332" y="204" width="236" height="54" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="236.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Recorded crime</text><text x="334" y="290" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MISSED</text><rect x="332" y="300" width="236" height="210" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="8 6"/><circle cx="353" cy="328.39" r="4.5" fill="#b5602e"/><text x="366" y="334" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The dark figure:</text><text x="366" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unreported or</text><text x="366" y="378" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unrecorded crime</text><circle cx="353" cy="402.39" r="4.5" fill="#b5602e"/><text x="366" y="408" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Measured by victim</text><text x="366" y="430" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">surveys and</text><text x="366" y="452" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">self-report studies</text><rect x="602" y="108" width="268" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M603.25,159 L603.25,122.25 Q603.25,109.25 616.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,159 Z" fill="#b5d3cf"/><line x1="603.25" y1="159" x2="868.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="736" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Poverty</text><text x="620" y="194" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COUNTED</text><rect x="618" y="204" width="236" height="54" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="736" y="225.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Depends on the</text><text x="736" y="247.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">definition</text><text x="620" y="290" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ONE SOCIETY, 1968–69</text><rect x="618" y="300" width="236" height="210" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="8 6"/><circle cx="639" cy="328.39" r="4.5" fill="#b5602e"/><text x="652" y="334" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">State standard: just</text><text x="652" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">over 6%</text><circle cx="639" cy="380.39" r="4.5" fill="#b5602e"/><text x="652" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Relative income: a</text><text x="652" y="408" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">little over 9%</text><circle cx="639" cy="432.39" r="4.5" fill="#b5602e"/><text x="652" y="438" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Relative deprivation:</text><text x="652" y="460" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">more than 22%</text><rect x="30" y="548" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="584" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Perspectives read the figures differently</text><circle cx="61" cy="607.39" r="4.5" fill="#8a6d0d"/><text x="74" y="613" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Becker:</tspan> crime figures result from labelling decisions</text><circle cx="61" cy="637.39" r="4.5" fill="#8a6d0d"/><text x="74" y="643" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxists:</tspan> over-represent working-class crime, under-represent white collar crime</text><circle cx="61" cy="667.39" r="4.5" fill="#8a6d0d"/><text x="74" y="673" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Feminists:</tspan> crimes inside the home may stay hidden</text>
</svg>