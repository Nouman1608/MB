<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 909" width="900" height="909" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="909" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five questions for any extract</text>

<rect x="30" y="108" width="840" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="145" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="152.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="139" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Who and when?</text><text x="104" y="165" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Note the author and date: a sense of time and place.</text><rect x="30" y="192" width="840" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="229" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="236.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="223" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Which perspective?</text><text x="104" y="249" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Look for signal words (below).</text><rect x="30" y="276" width="840" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="313" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="320.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="307" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What is the main claim?</text><text x="104" y="333" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Put it in one sentence.</text><rect x="30" y="360" width="840" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="397" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="404.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="391" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What is the evidence?</text><text x="104" y="417" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Name the method and sample if given.</text><rect x="30" y="444" width="840" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="481" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="488.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="475" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What are the limits?</text><text x="104" y="501" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Has society changed since? Who was left out? What would rivals say?</text><text x="450" y="558" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Signal words</text><rect x="30" y="576" width="198" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="31.5" y="577.5" width="195" height="44" rx="11" fill="#b5d3cf"/><text x="129" y="607" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist</text><rect x="44" y="636" width="170" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="129" y="656" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">“value consensus”</text><rect x="44" y="676" width="170" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="129" y="696" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">“functions”</text><rect x="244" y="576" width="198" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="245.5" y="577.5" width="195" height="44" rx="11" fill="#dce9e7"/><text x="343" y="607" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><rect x="258" y="636" width="170" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="343" y="656" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">“capitalism”</text><rect x="258" y="676" width="170" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="343" y="696" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">“ruling class”</text><rect x="458" y="576" width="198" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="459.5" y="577.5" width="195" height="44" rx="11" fill="#f2e7b8"/><text x="557" y="607" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><rect x="472" y="636" width="170" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="557" y="656" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">“patriarchy”</text><rect x="472" y="676" width="170" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="557" y="696" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">“men benefit”</text><rect x="672" y="576" width="198" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="673.5" y="577.5" width="195" height="44" rx="11" fill="#e6e0cf"/><text x="771" y="607" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactionist</text><rect x="686" y="636" width="170" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="771" y="656" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">“label”</text><rect x="686" y="676" width="170" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="771" y="696" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">“meanings”</text><rect x="30" y="736" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="772" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Limits, as Appendix B models them</text><circle cx="61" cy="795.39" r="4.5" fill="#8a6d0d"/><text x="74" y="801" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Oakley’s paper predates civil partnerships and same-sex marriage</text><circle cx="61" cy="825.39" r="4.5" fill="#8a6d0d"/><text x="74" y="831" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Halsey’s sample excluded females</text><circle cx="61" cy="855.39" r="4.5" fill="#8a6d0d"/><text x="74" y="861" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Manual work was relatively easy to obtain in the 1970s (Willis)</text>
</svg>