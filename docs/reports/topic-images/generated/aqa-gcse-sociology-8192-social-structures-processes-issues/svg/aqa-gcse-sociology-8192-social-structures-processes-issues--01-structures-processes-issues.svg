<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structures, processes and issues</text>

<rect x="30" y="108" width="840" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="31.5" y="109.5" width="190" height="109" rx="12" fill="#b5d3cf"/><line x1="222" y1="110" x2="222" y2="218" stroke="#c9d6d4" stroke-width="2"/><text x="126" y="157" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social</text><text x="126" y="183" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">structures</text><text x="240" y="142" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">The lasting, organised patterns of a society</text><rect x="240" y="164" width="86" height="33" rx="16.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="283" y="183" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">families</text><rect x="336" y="164" width="149" height="33" rx="16.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="410.5" y="183" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">education system</text><rect x="495" y="164" width="141" height="33" rx="16.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="565.5" y="183" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">class structure</text><rect x="646" y="164" width="203" height="33" rx="16.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="747.5" y="183" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">criminal justice system</text><line x1="126" y1="224" x2="126" y2="254" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="146" y="245" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">work on people through</text><rect x="30" y="258" width="840" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="31.5" y="259.5" width="190" height="109" rx="12" fill="#dce9e7"/><line x1="222" y1="260" x2="222" y2="368" stroke="#c9d6d4" stroke-width="2"/><text x="126" y="307" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social</text><text x="126" y="333" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">processes</text><text x="240" y="292" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">The ways structures work on people</text><rect x="240" y="314" width="125" height="33" rx="16.5" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="302.5" y="333" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">socialisation</text><rect x="375" y="314" width="133" height="33" rx="16.5" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="441.5" y="333" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">social control</text><rect x="518" y="314" width="94" height="33" rx="16.5" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="565" y="333" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">labelling</text><rect x="622" y="314" width="172" height="33" rx="16.5" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="708" y="333" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">selection in school</text><line x1="126" y1="374" x2="126" y2="404" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="146" y="395" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">create and shape</text><rect x="30" y="408" width="840" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="31.5" y="409.5" width="190" height="109" rx="12" fill="#f2e7b8"/><line x1="222" y1="410" x2="222" y2="518" stroke="#c9d6d4" stroke-width="2"/><text x="126" y="470" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social issues</text><text x="240" y="442" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Patterns people debate and governments may try to change</text><rect x="240" y="464" width="79" height="33" rx="16.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><text x="279.5" y="483" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">divorce</text><rect x="329" y="464" width="149" height="33" rx="16.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><text x="403.5" y="483" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">underachievement</text><rect x="488" y="464" width="63" height="33" rx="16.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><text x="519.5" y="483" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">crime</text><rect x="561" y="464" width="79" height="33" rx="16.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><text x="600.5" y="483" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">poverty</text><text x="450" y="550" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Structure or agency?</text><line x1="160" y1="590" x2="740" y2="590" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="40" y="596" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><text x="860" y="596" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Agency</text><text x="250" y="626" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">Functionalist and Marxist accounts</text><text x="250" y="647" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">stress structure</text><text x="650" y="626" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">Interactionist accounts stress</text><text x="650" y="647" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">meanings and reactions to labels</text><text x="450" y="576" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">agency = people’s ability to make their own choices</text>
