<rect width="900" height="785" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the perspectives relate</text>

<ellipse cx="330" cy="330" rx="250" ry="175" fill="#b5d3cf" fill-opacity="0.6" stroke="#1e2a44" stroke-width="3"/><ellipse cx="570" cy="330" rx="250" ry="175" fill="#f2e7b8" fill-opacity="0.7" stroke="#1e2a44" stroke-width="3"/><text x="225" y="238" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Explain behaviour</text><text x="225" y="260" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">by social structure</text><text x="675" y="238" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Conflict theories</text><text x="675" y="260" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">serve a powerful group</text><rect x="115" y="294" width="190" height="72" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="324" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism</text><text x="210" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">value consensus</text><rect x="355" y="294" width="190" height="72" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="324" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism</text><text x="450" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">class conflict</text><rect x="595" y="294" width="190" height="72" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="690" y="324" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminism</text><text x="690" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">patriarchy</text><rect x="190" y="530" width="520" height="92" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="450" y="566" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactionism</text><text x="450" y="594" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">starts from small-scale interaction: meanings, labels</text><rect x="30" y="650" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="686" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Compare within a perspective too</text><text x="56" y="715" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Willis and Bowles and Gintis are both Marxists, but Willis rejects a direct link between the</text><text x="56" y="737" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">economy and schooling.</text>
</svg>