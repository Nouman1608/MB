<rect width="900" height="823" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The named studies and their methods</text>

<defs><linearGradient id="spec2" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="30" y="108" width="840" height="50" rx="25" fill="url(#spec2)" stroke="#1e2a44" stroke-width="2.5"/><text x="56" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">QUANTITATIVE: patterns, reliability</text><text x="844" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">QUALITATIVE: meanings, validity</text><rect x="30" y="178" width="412" height="146" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="31.5" y="179.5" width="10" height="143" rx="5" fill="#2e6b62"/><text x="58" y="210" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Halsey, Heath and Ridge</text><text x="58" y="234" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Over 8,000 males</text><text x="58" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large-scale survey</text><text x="58" y="306" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Excluded females</text><rect x="30" y="336" width="412" height="146" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="31.5" y="337.5" width="10" height="143" rx="5" fill="#2e6b62"/><text x="58" y="368" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Townsend</text><text x="58" y="392" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2,000+ households, 6,000+ individuals</text><text x="58" y="418" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Questionnaires, deprivation index</text><text x="58" y="464" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Index may reflect choice</text><rect x="30" y="494" width="412" height="146" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="31.5" y="495.5" width="10" height="143" rx="5" fill="#2e6b62"/><text x="58" y="526" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Willmott and Young</text><text x="58" y="550" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Nearly 2,000 people</text><text x="58" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large-scale social survey</text><text x="58" y="622" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Little real “symmetry”, say feminists</text><rect x="458" y="178" width="412" height="146" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="459.5" y="179.5" width="10" height="143" rx="5" fill="#d4b02e"/><text x="486" y="210" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ball</text><text x="486" y="234" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">One school, three years</text><text x="486" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Participant observation</text><text x="486" y="306" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Hard to generalise</text><rect x="458" y="336" width="412" height="146" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="459.5" y="337.5" width="10" height="143" rx="5" fill="#d4b02e"/><text x="486" y="368" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Willis</text><text x="486" y="392" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">One Midlands school</text><text x="486" y="418" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Observation, discussions, interviews, diaries</text><text x="486" y="464" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Small group of boys</text><rect x="458" y="494" width="412" height="146" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="459.5" y="495.5" width="10" height="143" rx="5" fill="#d4b02e"/><text x="486" y="526" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Carlen</text><text x="486" y="550" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">39 women</text><text x="486" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unstructured interviews</text><text x="486" y="622" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Small sample</text><rect x="30" y="658" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="694" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mixed methods vs triangulation</text><circle cx="61" cy="717.39" r="4.5" fill="#8a6d0d"/><text x="74" y="723" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Mixed methods:</tspan> qualitative and quantitative in one study, e.g. statistics to find</text><text x="74" y="745" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">high-exclusion areas, then interviews with pupils there</text><circle cx="61" cy="769.39" r="4.5" fill="#8a6d0d"/><text x="74" y="775" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Triangulation:</tspan> more than one method or source to check findings agree</text>
</svg>