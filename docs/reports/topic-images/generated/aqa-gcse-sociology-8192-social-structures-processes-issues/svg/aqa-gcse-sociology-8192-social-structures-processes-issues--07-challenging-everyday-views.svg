<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 803" width="900" height="803" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="803" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Challenging everyday understandings</text>

<text x="225" y="128" font-size="19" font-weight="700" fill="#4a5568" text-anchor="middle">Everyday understanding</text><text x="670" y="128" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Sociological challenge</text><rect x="30" y="146" width="390" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="225" y="192.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“Crime statistics show who the criminals</text><text x="225" y="214.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">are.”</text><line x1="426" y1="198" x2="466" y2="198" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="472" y="146" width="398" height="104" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="490" y="180" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Figures reflect reporting, recording and</text><text x="490" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">labelling decisions</text><text x="490" y="234" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Becker; the dark figure</text><rect x="30" y="262" width="390" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="225" y="308.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“Women commit less crime because they are</text><text x="225" y="330.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">naturally law-abiding.”</text><line x1="426" y1="314" x2="466" y2="314" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="472" y="262" width="398" height="104" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="490" y="296" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Women are more closely controlled at home,</text><text x="490" y="318" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">in public and at work</text><text x="490" y="350" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Heidensohn</text><rect x="30" y="378" width="390" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="225" y="424.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“School is fair, so the cleverest</text><text x="225" y="446.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">succeed.”</text><line x1="426" y1="430" x2="466" y2="430" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="472" y="378" width="398" height="104" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="490" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Class background shapes staying on and</text><text x="490" y="434" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">university entry</text><text x="490" y="466" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Halsey; Bowles and Gintis</text><rect x="30" y="494" width="390" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="225" y="540.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“The family is a private refuge from the</text><text x="225" y="562.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">outside world.”</text><line x1="426" y1="546" x2="466" y2="546" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="472" y="494" width="398" height="104" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="490" y="528" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A private life separate from the economy is</text><text x="490" y="550" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">an illusion</text><text x="490" y="582" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Zaretsky</text><rect x="30" y="616" width="840" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="652" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Poverty: present both views fairly</text><circle cx="61" cy="675.39" r="4.5" fill="#8a6d0d"/><text x="74" y="681" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Murray</tspan> (New Right): values and benefit dependency create an underclass; criticised for a</text><text x="74" y="703" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">poor evidence base</text><circle cx="61" cy="727.39" r="4.5" fill="#8a6d0d"/><text x="74" y="733" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Townsend:</tspan> lack of resources to join normal life; criticised for an index that may confuse</text><text x="74" y="755" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">choice with deprivation</text>
</svg>