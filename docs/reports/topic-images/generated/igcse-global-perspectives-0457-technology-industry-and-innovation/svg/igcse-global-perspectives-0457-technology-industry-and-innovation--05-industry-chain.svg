<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why a region struggles to attract industry</text>

<rect x="30" y="104" width="408" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CAUSE</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Few workers with technical training</text><rect x="462" y="104" width="408" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CAUSE</text><text x="482" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Weak roads, power or internet</text><line x1="235" y1="196" x2="420" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="665" y1="196" x2="480" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="254" width="170" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="286" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Local</text><rect x="214" y="254" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="283.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Young people leave to find skilled work.</text><rect x="30" y="316" width="170" height="50" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="348" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">National</text><rect x="214" y="316" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="345.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The country imports goods it could make, and earns less tax.</text><rect x="30" y="378" width="170" height="50" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Global</text><rect x="214" y="378" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="407.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">New industry gathers in a few places, widening gaps between regions.</text><rect x="30" y="446" width="408" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="491" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTENDED</text><text x="50" y="516.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A new factory creates jobs</text><rect x="462" y="446" width="408" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="479" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">POSSIBLE UNINTENDED</text><text x="482" y="504.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Higher house prices push out</text><text x="482" y="528.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">existing residents</text>
</svg>