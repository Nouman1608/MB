<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Do the grants work, or were the winners picked well?</text>

<rect x="30" y="114" width="840" height="88" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="147" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FICTIONAL REGION OF TALEN</text><text x="50" y="174.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">“Our innovation grants work.”</text><line x1="60" y1="460" x2="470" y2="460" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="287.5" width="130" height="172.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="275.5" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">75%</text><text x="165" y="486" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Funded firms</text><text x="165" y="508" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">45 of 60</text><rect x="290" y="345" width="130" height="115" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="355" y="333" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">50%</text><text x="355" y="486" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">National rate</text><text x="265" y="220" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">still trading after three years</text><rect x="500" y="220" width="370" height="156" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="520" y="253" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">THE WEAKNESS</text><text x="520" y="278.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The panel chose the most</text><text x="520" y="302.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">promising firms</text><text x="520" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">They may have survived anyway. And who</text><text x="520" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">carried out the study?</text><rect x="500" y="390" width="370" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="520" y="423" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A FAIRER TEST</text><text x="520" y="448.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Compare funded firms with</text><text x="520" y="472.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">similar firms that applied but</text><text x="520" y="496.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">just missed out</text><rect x="30" y="540" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="576" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Component 1, Question 2</text><text x="50" y="605.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">State the evidence, interpret it, find the weakness, suggest a better test.</text>
</svg>