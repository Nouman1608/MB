<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From a new idea to a changed world</text>

<rect x="30" y="104" width="180" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="141.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INVENTION</text><text x="44" y="165.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">A new idea,</text><text x="44" y="186.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">device or</text><text x="44" y="207.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">process</text><line x1="216" y1="170" x2="244" y2="170" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="104" width="180" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="141.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R&amp;D</text><text x="264" y="165.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Spending to</text><text x="264" y="186.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">discover and</text><text x="264" y="207.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">test it</text><line x1="436" y1="170" x2="464" y2="170" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="104" width="180" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="131" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INNOVATION</text><text x="484" y="154.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Put into use,</text><text x="484" y="175.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">changing how</text><text x="484" y="196.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">things are made</text><text x="484" y="217.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">or done</text><line x1="656" y1="170" x2="684" y2="170" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="104" width="180" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="704" y="131" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRANSFER</text><text x="704" y="154.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Technology</text><text x="704" y="175.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">shared between</text><text x="704" y="196.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">firms or</text><text x="704" y="217.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">countries</text><text x="450" y="278" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who controls it?</text><rect x="30" y="300" width="268" height="148" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="333" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PATENT</text><text x="50" y="357.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lets an inventor stop</text><text x="50" y="379.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">others using an</text><text x="50" y="401.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">invention for a set</text><text x="50" y="423.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">period</text><rect x="316" y="300" width="268" height="148" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="344" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">INTELLECTUAL PROPERTY</text><text x="336" y="368.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Legal rights over</text><text x="336" y="390.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">creations of the mind:</text><text x="336" y="412.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">patents, copyright</text><rect x="602" y="300" width="268" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="344" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBSIDY</text><text x="622" y="368.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Government money to</text><text x="622" y="390.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">lower a firm’s costs or</text><text x="622" y="412.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">encourage an activity</text><rect x="30" y="466" width="408" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="499" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDUSTRIALISATION</text><text x="50" y="523.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A shift from farming towards</text><text x="50" y="545.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">manufacturing</text><rect x="462" y="466" width="408" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="499" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PLANNED OBSOLESCENCE</text><text x="482" y="523.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A claim that products are designed to</text><text x="482" y="545.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">stop working or date early</text>
</svg>