<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A battery factory in Arnholt: three levels</text>

<circle cx="205" cy="270.5" r="165" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="270.5" r="110" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="270.5" r="55" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="205" y="276.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Local</text><text x="205" y="359" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">National</text><text x="205" y="414" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Global</text><path d="M236,271.5 C328,271.5 328,155.5 416,155.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="236" cy="271.5" r="4" fill="#1e2a44"/><path d="M249.8,354 C334.9,354 334.9,270.5 416,270.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="249.8" cy="354" r="4" fill="#1e2a44"/><path d="M240.6,409 C330.3,409 330.3,385.5 416,385.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="240.6" cy="409" r="4" fill="#1e2a44"/><rect x="420" y="104" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="135.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Local</text><text x="436" y="164.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Residents argue about the factory’s water use.</text><text x="436" y="186.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The council can set conditions on water.</text><rect x="420" y="219" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="250.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">National</text><text x="436" y="279.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The government offers a grant to attract the</text><text x="436" y="301.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">factory.</text><rect x="420" y="334" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="365.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Global</text><text x="436" y="394.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The growth of electric vehicles drives demand</text><text x="436" y="416.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">for batteries. The council cannot change it.</text><rect x="30" y="455" width="408" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="488" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">YOUNG RESIDENT</text><text x="50" y="513.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Supports it: skilled jobs close to</text><text x="50" y="537.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">home</text><text x="50" y="565.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Risk: having to move away for work.</text><rect x="462" y="455" width="408" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="488" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FARMER</text><text x="482" y="513.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Opposes it: relies on the same</text><text x="482" y="537.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">river for irrigation</text><text x="482" y="565.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Risk: a poorer harvest.</text><rect x="30" y="608" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="644" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A proposed action</text><text x="50" y="673.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Approve only with a binding water limit in dry months: it tackles the main cause of</text><text x="50" y="695.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">opposition. Weakness: it needs independent monitoring.</text>
</svg>