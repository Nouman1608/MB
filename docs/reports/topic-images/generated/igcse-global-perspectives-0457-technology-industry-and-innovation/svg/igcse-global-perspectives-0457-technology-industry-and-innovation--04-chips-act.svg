<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="516" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The US CHIPS and Science Act: predictions and values</text>

<rect x="30" y="104" width="840" height="110" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SIGNED 9 AUGUST 2022</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">$52.7 billion for US chip research, development, manufacturing and</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">workforce training</text><rect x="30" y="232" width="408" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="265" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPPORTERS PREDICT</text><text x="50" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Jobs, and less reliance on chips</text><text x="50" y="314.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">made abroad</text><text x="50" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Values: security and self-reliance</text><rect x="462" y="232" width="408" height="156" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="265" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRITICS ARGUE</text><text x="482" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Taxpayers’ money to profitable</text><text x="482" y="314.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">firms; better spent elsewhere</text><text x="482" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Values: fairness to taxpayers, free</text><text x="482" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">competition</text><rect x="30" y="406" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="439.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both sides make predictions that cannot be proved yet. When perspectives rest on different</text><text x="50" y="461.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">values, more data alone may not settle the disagreement.</text>
</svg>