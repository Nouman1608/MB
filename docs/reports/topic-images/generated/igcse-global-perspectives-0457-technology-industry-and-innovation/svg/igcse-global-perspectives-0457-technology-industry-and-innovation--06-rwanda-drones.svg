<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" width="900" height="565" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rwanda’s drone deliveries: judging the evidence</text>

<rect x="30" y="104" width="395" height="172" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="182" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PROBLEM</text><text x="50" y="206.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Slow road delivery to remote clinics</text><line x1="431" y1="190" x2="469" y2="190" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="104" width="395" height="172" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">14 OCTOBER 2016</text><text x="495" y="161.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">National drone delivery with</text><text x="495" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Zipline, backed by Gavi and the UPS</text><text x="495" y="205.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Foundation</text><text x="495" y="232" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Began by flying blood to hospitals and</text><text x="495" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">clinics in the west.</text><rect x="40" y="311.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,322.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="294" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="322.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Who reported early results?</text><text x="108" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The company and its partners: a vested interest in showing success.</text><rect x="40" y="394.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="94" y="377" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="405.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What would be stronger evidence?</text><text x="108" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Independent comparisons of delivery times and patient outcomes, before and after.</text><rect x="40" y="477.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="94" y="460" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="488.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Would it transfer?</text><text x="108" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A country with different geography, funding or regulations may get different results.</text>
</svg>