<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 673" width="900" height="673" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="673" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Courses of action on technology and industry</text>

<rect x="30" y="104" width="280" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Action</text><rect x="310" y="104" width="270" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="322" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Possible benefit</text><rect x="580" y="104" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="592" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Possible drawback</text><rect x="30" y="150" width="280" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Voluntary licensing of</text><text x="42" y="196.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">patents</text><rect x="310" y="150" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="322" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wider production without</text><text x="322" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">changing the law</text><rect x="580" y="150" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Depends on companies agreeing</text><rect x="30" y="214" width="280" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Government subsidies for</text><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">new industry</text><rect x="310" y="214" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="322" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Jobs and new skills</text><rect x="580" y="214" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Costly; may support firms that</text><text x="592" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">would have come anyway</text><rect x="30" y="278" width="280" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="303.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Conditions on new factories</text><rect x="310" y="278" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="322" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gains jobs while limiting</text><text x="322" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">harm</text><rect x="580" y="278" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Firm may choose another location</text><rect x="30" y="342" width="280" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Right-to-repair rules</text><rect x="310" y="342" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="322" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Products last longer; less</text><text x="322" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">waste</text><rect x="580" y="342" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Manufacturers’ costs may raise</text><text x="592" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prices</text><rect x="30" y="406" width="280" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="431.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Public funding for research</text><rect x="310" y="406" width="270" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="322" y="431.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Benefits shared widely</text><rect x="580" y="406" width="290" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="431.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Results slow and uncertain</text><rect x="30" y="449" width="280" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="474.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Training schemes with local</text><text x="42" y="495.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">colleges</text><rect x="310" y="449" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="322" y="474.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tackles the skills cause</text><rect x="580" y="449" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="474.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Takes years to show results</text><rect x="30" y="531" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="567" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A real example</text><text x="50" y="596.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">EU right-to-repair directive (2024/1799), adopted 13 June 2024, to be applied by 31 July</text><text x="50" y="618.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">2026. It is new, so evidence on its effects is still limited.</text>
</svg>