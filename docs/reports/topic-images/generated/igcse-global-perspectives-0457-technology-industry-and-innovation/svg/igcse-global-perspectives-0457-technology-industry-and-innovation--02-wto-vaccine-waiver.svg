<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 792" width="900" height="792" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="792" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Should vaccine patents be waived?</text>

<rect x="30" y="104" width="395" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OCTOBER 2020</text><text x="50" y="161.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">India and South Africa propose</text><text x="50" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">waiving some IP rules for COVID-19</text><text x="50" y="205.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">products at the WTO</text><line x1="431" y1="189" x2="469" y2="189" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="104" width="395" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUNE 2022</text><text x="495" y="161.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">WTO agrees a narrower decision:</text><text x="495" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">vaccines only</text><text x="495" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Eligible members may authorise production</text><text x="495" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">without the patent holder’s consent, for five</text><text x="495" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">years.</text><line x1="215" y1="342" x2="685" y2="342" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,342 L420,434 L480,434 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="342" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="342" x2="160" y2="397" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="342" x2="270" y2="397" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,397 L290,397 Q275,424 215,424 Q155,424 140,397 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="342" x2="630" y2="397" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="342" x2="740" y2="397" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,397 L760,397 Q745,424 685,424 Q625,424 610,397 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="446" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">supporters</text><text x="685" y="446" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">opponents</text><rect x="30" y="470" width="405" height="162" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="506" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Supporters of a waiver</text><text x="50" y="534.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Patents slowed supply to poorer countries</text><rect x="465" y="470" width="405" height="162" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="506" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Many drug firms, some rich</text><text x="485" y="532" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">governments</text><text x="485" y="560.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="560.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Patents pay for research</text><text x="485" y="586.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="586.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Factories, materials and skills limited</text><text x="500.2" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">supply, not patents</text><rect x="30" y="650" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="686" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A third view</text><text x="50" y="715.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Some campaign groups said the final decision was too narrow. You are marked on explaining</text><text x="50" y="737.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">why each side holds its view.</text>
</svg>