<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" width="900" height="504" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="504" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">More than a backdrop</text>

<rect x="200" y="110" width="500" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="149.2" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Setting</text><text x="450" y="181.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">depicts a time and place, and conveys values</text><line x1="450" y1="200" x2="162" y2="262" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="200" x2="450" y2="262" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="200" x2="738" y2="262" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="270" width="268" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1  CONVEYS VALUES</text><text x="50" y="329.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What the place values,</text><text x="50" y="353.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and what it costs</text><text x="50" y="381.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="381.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">crowded boarding house:</text><text x="65.2" y="402.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">thrift, noise, loss of privacy</text><text x="50" y="428.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">empty shore: exposure, a</text><text x="65.2" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">chance for reflection</text><rect x="316" y="270" width="268" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2  MARKS CHANGE</text><text x="336" y="329.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A change of setting</text><text x="336" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may suggest other</text><text x="336" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">movements, changes or</text><text x="336" y="399.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shifts in the narrative</text><rect x="602" y="270" width="268" height="204" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3  RELATES TO CHARACTER</text><text x="622" y="329.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How characters interact</text><text x="622" y="353.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">with surroundings</text><text x="622" y="381.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gives insight into the</text><text x="622" y="402.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">characters and the settings</text><text x="622" y="423.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">they inhabit</text>
</svg>