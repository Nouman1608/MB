ct x="65" y="352" width="230" height="42" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="378.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a garden</text><rect x="605" y="352" width="230" height="42" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="720" y="378.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">the lane below</text><line x1="330" y1="373" x2="570" y2="373" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><circle cx="450" cy="230" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M416,294 Q450,242 484,294 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="408" y1="266" x2="340" y2="266" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="492" y1="266" x2="560" y2="266" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a character</text><text x="450" y="348" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">caught between</text><text x="450" y="440" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The contrast can establish a conflict of values</text><rect x="30" y="460" width="264" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="162" y="497" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">security  ⟷  freedom</text><rect x="318" y="460" width="264" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="497" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">comfort  ⟷  conscience</text><rect x="606" y="460" width="264" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="738" y="497" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">privacy  ⟷  belonging</text>
