"/><rect x="60" y="310" width="30" height="20" fill="none" stroke="#f2e7b8" stroke-width="1.5" clip-path="url(#cw)"/><rect x="90" y="310" width="30" height="20" fill="none" stroke="#f2e7b8" stroke-width="1.5" clip-path="url(#cw)"/><rect x="120" y="310" width="30" height="20" fill="none" stroke="#f2e7b8" stroke-width="1.5" clip-path="url(#cw)"/><rect x="150" y="310" width="30" height="20" fill="none" stroke="#f2e7b8" stroke-width="1.5" clip-path="url(#cw)"/><rect x="180" y="310" width="30" height="20" fill="none" stroke="#f2e7b8" stroke-width="1.5" clip-path="url(#cw)"/><clipPath id="cw"><rect x="60" y="190" width="120" height="140"/></clipPath><rect x="54" y="184" width="132" height="152" fill="none" stroke="#1e2a44" stroke-width="6"/><line x1="120" y1="190" x2="120" y2="330" stroke="#1e2a44" stroke-width="4"/><text x="120" y="358" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">brick wall "a yard off"</text><text x="210" y="208" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">•</text><text x="224.25" y="208" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"narrow hall"</text><text x="210" y="246" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">•</text><text x="224.25" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">stairs for "one person and a</text><text x="224.25" y="266" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">half"</text><text x="210" y="284" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">•</text><text x="224.25" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a cough through "the thin</text><text x="224.25" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">wall"</text><text x="210" y="322" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">•</text><text x="224.25" y="322" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"boiled cabbage and wet</text><text x="224.25" y="342" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">wool"</text><text x="210" y="360" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">•</text><text x="224.25" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The front's let"</text><text x="479" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Her father's field</text><text x="479" y="170" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">the memory: space and freedom</text><path d="M479,330 Q620,300 850,320 L850,390 L479,390 Z" fill="#6f9a52" opacity="0.55"/><rect x="760" y="256" width="70" height="60" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><path d="M752,256 L795,222 L838,256 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M528,234 Q534,238 540,244 Q546,238 552,234" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M588,214 Q594,218 600,224 Q606,218 612,214" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M643,249 Q649,253 655,259 Q661,253 667,249" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M688,219 Q694,223 700,229 Q706,223 712,219" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M568,264 Q574,268 580,274 Q586,268 592,264" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="600" y="370" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">she once "counted the swallows"</text><rect x="410" y="238" width="80" height="44" rx="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="267" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">versus</text><rect x="30" y="430" width="411" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="463" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROSA'S BEHAVIOUR</text><text x="50" y="493.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"held her breath" until the smell "had made its</text><text x="65.2" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">peace with her"</text><text x="50" y="540.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="540.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">smooths each dress "as if it might otherwise</text><text x="65.2" y="561.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">take offence"</text><rect x="459" y="430" width="411" height="157" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="463" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONFLICT OF VALUES</text><text x="479" y="489.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Freedom and space against necessity and</text><text x="479" y="513.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">confinement</text><text x="479" y="541.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Her endurance, longing and dignity are</text><text x="479" y="562.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">measured by the contrast</text>
