<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" width="900" height="578" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="578" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a setting: detail to character</text>

<rect x="30" y="110" width="195" height="54" rx="10" fill="#1e2a44"/><text x="127.5" y="136" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Detail</text><line x1="227" y1="137" x2="243" y2="137" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="245" y="110" width="195" height="54" rx="10" fill="#1e2a44"/><text x="342.5" y="136" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">What it depicts</text><line x1="442" y1="137" x2="458" y2="137" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="110" width="195" height="54" rx="10" fill="#1e2a44"/><text x="557.5" y="126" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">What it suggests or</text><text x="557.5" y="148" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">values</text><line x1="657" y1="137" x2="673" y2="137" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="675" y="110" width="195" height="54" rx="10" fill="#1e2a44"/><text x="772.5" y="126" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">How the character</text><text x="772.5" y="148" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">relates</text><rect x="30" y="180" width="195" height="93" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="46" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sensory</text><text x="46" y="234" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sound, smell, light,</text><text x="46" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">space</text><rect x="245" y="180" width="195" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="259" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The literal place</text><rect x="460" y="180" width="195" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="211" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Feelings, rules or</text><text x="474" y="232" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">priorities attached to</text><text x="474" y="253" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it</text><rect x="675" y="180" width="195" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="689" y="221.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fits, resists, avoids, is</text><text x="689" y="242.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trapped, escapes</text><rect x="30" y="283" width="195" height="76" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="46" y="313" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Social</text><text x="46" y="337" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">who is there, what</text><text x="46" y="357" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">they do</text><rect x="245" y="283" width="195" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="259" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The community, or</text><text x="259" y="337" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lack of one</text><rect x="460" y="283" width="195" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Norms and</text><text x="474" y="337" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expectations</text><rect x="675" y="283" width="195" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="689" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Included, excluded,</text><text x="689" y="337" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">watched</text><rect x="30" y="369" width="195" height="76" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="46" y="399" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Temporal</text><text x="46" y="423" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">season, hour, era</text><rect x="245" y="369" width="195" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="259" y="412.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The time</text><rect x="460" y="369" width="195" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mood, stage of life,</text><text x="474" y="423" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pressure of time</text><rect x="675" y="369" width="195" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="689" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rushed, delayed, out</text><text x="689" y="423" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of step</text><rect x="30" y="455" width="195" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="46" y="485" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Changes</text><text x="46" y="509" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">in the details</text><rect x="245" y="455" width="195" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="259" y="496.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The movement of the</text><text x="259" y="517.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">story</text><rect x="460" y="455" width="195" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="496.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A turning point or</text><text x="474" y="517.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shift of attitude</text><rect x="675" y="455" width="195" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="689" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A change in the</text><text x="689" y="507" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">character's</text><text x="689" y="528" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">perception</text>
</svg>