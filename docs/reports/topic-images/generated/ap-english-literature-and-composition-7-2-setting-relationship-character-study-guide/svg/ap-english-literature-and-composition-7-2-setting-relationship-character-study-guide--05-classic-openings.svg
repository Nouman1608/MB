<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 457" width="900" height="457" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="457" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Setting in three stories</text>

<rect x="30" y="110" width="840" height="50" rx="10" fill="#1e2a44"/><text x="44" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Story</text><text x="224" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Setting</text><text x="454" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Values it conveys</text><text x="674" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">The character in it</text><rect x="30" y="160" width="840" height="89" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="187.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The Open Boat</text><text x="44" y="208.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(Crane)</text><text x="224" y="187.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"None of them knew the</text><text x="224" y="208.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">colour of the sky." The</text><text x="224" y="229.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sea and a dinghy</text><line x1="210" y1="160" x2="210" y2="249" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="187.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nature is indifferent; the</text><text x="454" y="208.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">men are small against it</text><line x1="440" y1="160" x2="440" y2="249" stroke="#c9d6d4" stroke-width="2"/><text x="674" y="187.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Absorbed in survival,</text><text x="674" y="208.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">watching the waves</text><line x1="660" y1="160" x2="660" y2="249" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="249" width="840" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="276.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">To Build a Fire</text><text x="44" y="297.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(London)</text><text x="224" y="276.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A bitterly cold, grey Yukon</text><text x="224" y="297.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">morning</text><line x1="210" y1="249" x2="210" y2="317" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="276.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A place that does not</text><text x="454" y="297.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">allow error</text><line x1="440" y1="249" x2="440" y2="317" stroke="#c9d6d4" stroke-width="2"/><text x="674" y="276.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Confident, unwilling to</text><text x="674" y="297.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heed warning</text><line x1="660" y1="249" x2="660" y2="317" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="317" width="840" height="110" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="344.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The Garden Party</text><text x="44" y="365.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(Mansfield)</text><text x="224" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"And after all the weather</text><text x="224" y="365.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was ideal." A sunny</text><text x="224" y="386.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">garden; poor cottages in</text><text x="224" y="407.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the lane below</text><line x1="210" y1="317" x2="210" y2="427" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Comfort against</text><text x="454" y="365.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compassion</text><line x1="440" y1="317" x2="440" y2="427" stroke="#c9d6d4" stroke-width="2"/><text x="674" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A young woman who</text><text x="674" y="365.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passes between them</text><line x1="660" y1="317" x2="660" y2="427" stroke="#c9d6d4" stroke-width="2"/>
</svg>