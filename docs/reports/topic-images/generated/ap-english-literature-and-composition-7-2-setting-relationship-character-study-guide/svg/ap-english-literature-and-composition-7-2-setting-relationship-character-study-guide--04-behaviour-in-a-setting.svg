<rect width="900" height="544" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How characters behave in a setting</text>

<rect x="30" y="110" width="411" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="86" cy="187" r="40" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><ellipse cx="86" cy="187" rx="28" ry="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><circle cx="86" cy="187" r="8" fill="#2e6b62"/><text x="142" y="167.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What do they notice?</text><text x="142" y="196.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">a dripping tap, the sky, the</text><text x="142" y="217.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">neighbours</text><rect x="459" y="110" width="411" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="515" cy="187" r="40" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><path d="M499,207 L499,181 Q499,175 505,175 L505,165 Q511,159 517,165 L517,177 L529,179 Q535,181 533,189 L527,207 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="571" y="167.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What do they do?</text><text x="571" y="196.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">smooth a dress, avoid a corridor,</text><text x="571" y="217.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">prop a window open</text><rect x="30" y="280" width="411" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="86" cy="357" r="40" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><path d="M58,339 h56 a8,8 0 0 1 8,8 v20 a8,8 0 0 1 -8,8 h-32 l-12,12 v-12 h-12 a8,8 0 0 1 -8,-8 v-20 a8,8 0 0 1 8,-8 z" fill="#ffffff" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="86" y="361" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">"..."</text><text x="142" y="348" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What do they call it?</text><text x="142" y="377" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">the words they choose for the place</text><rect x="459" y="280" width="411" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="515" cy="357" r="40" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><rect x="485" y="343" width="22" height="28" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="511" y1="357" x2="521" y2="357" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="525" y="343" width="22" height="28" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="571" y="350" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What changes about them as</text><text x="571" y="375" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">the setting changes?</text><rect x="30" y="450" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="489" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Behaviour in a place reveals an attitude to it, and develops the character</text>
</svg>