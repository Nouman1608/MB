<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 627" width="900" height="627" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="627" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: from kitchen to shore</text>

<rect x="30" y="110" width="360" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">The kitchen</text><text x="50" y="172" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">noisy, crowded, busy</text><text x="50" y="210" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">•</text><text x="65.2" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"a roar of pans and gossip"</text><text x="50" y="250" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">•</text><text x="65.2" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the kettle's "long argument with the</text><text x="65.2" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">fire"</text><text x="50" y="290" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">•</text><text x="65.2" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">constant demands and talk</text><rect x="510" y="110" width="360" height="270" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="530" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">The shore</text><text x="530" y="172" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">quiet, exposed</text><text x="530" y="210" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">•</text><text x="545.2" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"the tide had gone far out"</text><text x="530" y="250" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">•</text><text x="545.2" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">boats "leaning on their sides"</text><text x="530" y="290" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">•</text><text x="545.2" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a gull: "one note, over and over"</text><rect x="60" y="320" width="14" height="40" rx="3" fill="#b5602e" opacity="0.8"/><rect x="82" y="298" width="14" height="62" rx="3" fill="#b5602e" opacity="0.8"/><rect x="104" y="310" width="14" height="50" rx="3" fill="#b5602e" opacity="0.8"/><rect x="126" y="290" width="14" height="70" rx="3" fill="#b5602e" opacity="0.8"/><rect x="148" y="314" width="14" height="46" rx="3" fill="#b5602e" opacity="0.8"/><rect x="170" y="294" width="14" height="66" rx="3" fill="#b5602e" opacity="0.8"/><rect x="192" y="306" width="14" height="54" rx="3" fill="#b5602e" opacity="0.8"/><rect x="540" y="346" width="14" height="14" rx="3" fill="#2e6b62"/><text x="220" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">noise</text><text x="566" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">one note</text><path d="M700,350 Q740,356 770,322 L760,316 Q735,340 700,340 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><path d="M780,350 Q815,358 845,330 L836,322 Q812,344 780,340 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><line x1="690" y1="352" x2="855" y2="352" stroke="#8a6d0d" stroke-width="3"/><line x1="398" y1="220" x2="502" y2="220" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="200" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">"slipped out"</text><text x="450" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">noise "closed</text><text x="450" y="275" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">behind him</text><text x="450" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">like water"</text><rect x="30" y="404" width="390" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="437" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TOMAS BEFORE</text><text x="50" y="463.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A week of obligation</text><line x1="426" y1="458.5" x2="474" y2="458.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="404" width="390" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="500" y="437" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TOMAS AFTER</text><text x="500" y="463.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">For the first time, "did not know what</text><text x="500" y="487.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">he ought to be doing next"</text><rect x="30" y="533" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="572" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The change of setting marks a turn from outward duty to inward reflection</text>
</svg>