<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two slips examiners notice</text>

<rect x="30" y="110" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Elders take the plural verb as respect</text><text x="54" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">parents, grandparents, teachers: even for one person</text><circle cx="70" cy="222" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M63,222 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="232" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرے دادا بہت مہربان ہیں‏</text><text x="100" y="228" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">my grandfather is very kind</text><circle cx="70" cy="288" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M63,288 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="298" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میری والدہ ڈاکٹر ہیں‏</text><text x="100" y="294" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">my mother is a doctor</text><circle cx="70" cy="354" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M63,354 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="364" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میری نانی ہمیں کہانیاں سناتی ہیں‏</text><text x="100" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">my grandmother tells us stories</text><rect x="30" y="420" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="456" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Meeting someone: use</text><text x="318" y="460" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#2e6b62" text-anchor="middle">‏سے‏</text><text x="352" y="456" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">and no</text><text x="450" y="460" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#b5602e" text-anchor="middle">‏نے‏</text><text x="54" y="482" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the verb is intransitive</text><circle cx="70" cy="530" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M63,530 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="540" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں اپنے دوست سے ملا‏</text><text x="100" y="536" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">I met my friend</text><circle cx="70" cy="596" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M64,590 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="606" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں نے اپنے دوست کو ملا‏</text><text x="100" y="602" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start" font-style="italic">a very common error</text><circle cx="70" cy="662" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M63,662 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="672" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہماری ملاقات اسکول میں ہوئی‏</text><text x="100" y="668" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">we met at school (first meeting)</text>
</svg>