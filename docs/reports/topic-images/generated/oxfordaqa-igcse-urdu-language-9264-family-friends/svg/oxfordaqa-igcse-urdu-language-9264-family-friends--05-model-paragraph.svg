<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A best-friend paragraph, line by line</text>

<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Task: describe your best friend, how you met, and future plans together</text><rect x="30" y="148" width="840" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">name and identity</text><text x="48" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">present</text><text x="852" y="194" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏میری سب سے اچھی سہیلی کا نام عائشہ ہے۔‏</text><rect x="30" y="232" width="840" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="264" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">how you met</text><text x="48" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">past event</text><text x="852" y="278" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہماری ملاقات تین سال پہلے اسکول میں ہوئی۔‏</text><rect x="30" y="316" width="840" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="348" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">what she is like</text><text x="48" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">present</text><text x="852" y="362" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏وہ بہت خوش مزاج اور مددگار ہے۔‏</text><rect x="30" y="400" width="840" height="72" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="432" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">complex sentence</text><text x="48" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">when ... then</text><text x="852" y="446" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏جب مجھے ریاضی کا کوئی سوال سمجھ میں نہیں آتا تو وہ میری مدد کرتی ہے۔‏</text><rect x="30" y="484" width="840" height="72" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="516" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">justified opinion</text><text x="48" y="538" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a true friend is ...</text><text x="852" y="530" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرے خیال میں سچا دوست وہی ہے جو مشکل وقت میں ساتھ دے۔‏</text><rect x="30" y="568" width="840" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="600" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">future plan</text><text x="48" y="622" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">feminine plural</text><text x="852" y="614" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگلی گرمیوں میں ہم دونوں ایک ساتھ کمپیوٹر کورس کریں گی۔‏</text><rect x="30" y="660" width="840" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="694" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Three time frames, one complex sentence, one justified opinion, accurate agreement</text>
</svg>