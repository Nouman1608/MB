<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Agreement follows the noun</text>

<rect x="260" y="110" width="190" height="46" rx="10" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="355" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Masculine</text><rect x="470" y="110" width="190" height="46" rx="10" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="565" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminine</text><rect x="680" y="110" width="190" height="46" rx="10" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="775" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Plural</text><rect x="30" y="170" width="220" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="206" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Possessive</text><text x="48" y="232" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">agrees with the noun,</text><text x="48" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">not the speaker</text><rect x="260" y="170" width="190" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="355" y="230" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏میرا بھائی‏</text><rect x="470" y="170" width="190" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="565" y="230" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏میری بہن‏</text><rect x="680" y="170" width="190" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="775" y="230" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏میرے والدین‏</text><rect x="30" y="280" width="220" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Marked adjective</text><text x="48" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ends in alif: changes</text><rect x="260" y="280" width="190" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="355" y="340" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏شرمیلا لڑکا‏</text><rect x="470" y="280" width="190" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="565" y="340" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏شرمیلی لڑکی‏</text><rect x="680" y="280" width="190" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="775" y="340" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏شرمیلے بچے‏</text><rect x="30" y="390" width="220" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="426" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unmarked adjective</text><text x="48" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">does not change</text><rect x="260" y="390" width="190" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="355" y="450" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏مہربان استاد‏</text><rect x="470" y="390" width="190" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="565" y="450" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏مہربان استانی‏</text><rect x="680" y="390" width="190" height="96" rx="12" fill="none" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="30" y="510" width="840" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="52" y="546" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Same rule for</text><text x="240" y="550" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#2e6b62" text-anchor="middle">‏کا / کی / کے‏</text><text x="52" y="576" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">my friend’s sister: feminine because sister is feminine</text><text x="846" y="568" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرے دوست کی بہن‏</text>
</svg>