<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="900" height="950" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="950" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Translating into Urdu in three steps</text>

<rect x="30" y="108" width="840" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="138" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"My older brother is very kind, but sometimes we argue.</text><text x="450" y="162" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">My grandmother lives with us."</text><rect x="30" y="196" width="840" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="230" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="237.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="100" y="237" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Find the verb and put it last</text><text x="110" y="292" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"is kind"</text><line x1="330" y1="286" x2="470" y2="286" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="650" y="294" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="middle">‏مہربان ہے‏</text><text x="110" y="350" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"argue"</text><line x1="330" y1="344" x2="470" y2="344" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="650" y="352" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="middle">‏جھگڑا ہو جاتا ہے‏</text><text x="110" y="408" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"lives"</text><line x1="330" y1="402" x2="470" y2="402" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="650" y="410" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="middle">‏رہتی ہیں‏</text><rect x="30" y="448" width="840" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="482" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="489.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="100" y="489" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Check agreement and respect</text><text x="110" y="544" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">brother is masculine</text><line x1="330" y1="538" x2="470" y2="538" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="650" y="546" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="middle">‏میرا بڑا بھائی‏</text><text x="110" y="602" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">grandmother is an elder</text><line x1="330" y1="596" x2="470" y2="596" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="650" y="604" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="middle">‏رہتی ہیں‏</text><text x="728" y="600" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">not</text><text x="846" y="604" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#b5602e" text-anchor="end">‏رہتی ہے‏</text><rect x="30" y="646" width="840" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="680" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="687.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="100" y="687" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Translate the sense, not each word</text><text x="110" y="742" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"we argue"</text><line x1="330" y1="736" x2="470" y2="736" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="650" y="744" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ہمارا جھگڑا ہو جاتا ہے‏</text><rect x="30" y="786" width="840" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="818" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Answer</text><text x="846" y="860" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرا بڑا بھائی بہت مہربان ہے، لیکن کبھی کبھی ہمارا جھگڑا ہو جاتا ہے۔‏</text><text x="846" y="910" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میری دادی ہمارے ساتھ رہتی ہیں۔‏</text>
</svg>