<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Father’s side, mother’s side</text>

<text x="260" y="132" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Father’s side</text><text x="640" y="132" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">Mother’s side</text><rect x="130" y="148" width="260" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="260" y="196" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏دادا / دادی‏</text><text x="260" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">father’s father / father’s mother</text><rect x="510" y="148" width="260" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="640" y="196" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏نانا / نانی‏</text><text x="640" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mother’s father / mother’s mother</text><path d="M260,244 V268 M130,268 H350 M130,268 V292 M350,268 V292" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M640,244 V268 M550,268 H770 M550,268 V292 M770,268 V292" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="292" width="200" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="340" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏چچا / پھوپھی‏</text><text x="130" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">father’s brother / sister</text><rect x="270" y="292" width="160" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="350" y="340" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏والد‏</text><text x="350" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">father</text><rect x="470" y="292" width="160" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="550" y="340" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏والدہ‏</text><text x="550" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mother</text><rect x="670" y="292" width="200" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="770" y="340" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ماموں / خالہ‏</text><text x="770" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mother’s brother / sister</text><line x1="430" y1="340" x2="470" y2="340" stroke="#1e2a44" stroke-width="3"/><path d="M450,340 V418" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="370" y="420" width="160" height="50" rx="25" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="452" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">you</text><text x="52" y="520" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Also useful</text><rect x="30" y="536" width="204" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="132" y="582" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏والدین‏</text><text x="132" y="620" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">parents (plural verb)</text><rect x="242" y="536" width="204" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="344" y="582" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏رشتہ دار‏</text><text x="344" y="620" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">relative</text><rect x="454" y="536" width="204" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="582" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏مشترکہ خاندان‏</text><text x="556" y="620" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">joint family</text><rect x="666" y="536" width="204" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="768" y="582" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏اکلوتا / اکلوتی‏</text><text x="768" y="620" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">only (child)</text><rect x="30" y="656" width="840" height="52" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2"/><text x="450" y="689" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">In translation, read family words twice: grandmother may be either side</text>
</svg>