<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Atkinson’s flexible firm</text>

<circle cx="300" cy="330" r="200" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" stroke-dasharray="10 7"/><circle cx="300" cy="330" r="100" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="300" y="326" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Core</text><text x="300" y="352" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">skilled, secure</text><text x="300" y="180" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Periphery</text><text x="300" y="204" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">temporary or part-time</text><rect x="540" y="160" width="330" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M541.25,210 L541.25,174.25 Q541.25,161.25 554.25,161.25 L855.75,161.25 Q868.75,161.25 868.75,174.25 L868.75,210 Z" fill="#dce9e7"/><line x1="541.25" y1="210" x2="868.75" y2="210" stroke="#c9d6d4" stroke-width="2"/><text x="705" y="190.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Post-Fordism</text><text x="556" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Piore and Sabel (1984):</tspan> "flexible</text><text x="556" y="261" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">specialisation", with skilled</text><text x="556" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">workers using adaptable technology.</text><rect x="540" y="330" width="330" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M541.25,380 L541.25,344.25 Q541.25,331.25 554.25,331.25 L855.75,331.25 Q868.75,331.25 868.75,344.25 L868.75,380 Z" fill="#f2e7b8"/><line x1="541.25" y1="380" x2="868.75" y2="380" stroke="#c9d6d4" stroke-width="2"/><text x="705" y="360.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Critics</text><text x="556" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Flexibility for employers often</text><text x="556" y="431" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">means insecurity for workers.</text>
</svg>