<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Income, wealth and who is poor</text>

<rect x="30" y="110" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Income: a flow</text><line x1="80" y1="200" x2="390" y2="200" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><line x1="80" y1="234" x2="390" y2="234" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><line x1="80" y1="268" x2="390" y2="268" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="235" y="305" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">money over time: wages, benefits,</text><text x="235" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">pensions, interest</text><text x="665" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Wealth: a stock</text><rect x="590" y="260" width="48" height="30" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="642" y="260" width="48" height="30" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="694" y="260" width="48" height="30" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="616" y="226" width="48" height="30" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="668" y="226" width="48" height="30" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="642" y="192" width="48" height="30" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="665" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">assets at one point: property, shares, savings</text><text x="450" y="374" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Wealth is far more unequal than income, because it builds up and is inherited.</text><text x="450" y="420" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Groups more likely to be in poverty</text><rect x="30" y="436" width="412" height="263" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,486 L31.25,450.25 Q31.25,437.25 44.25,437.25 L427.75,437.25 Q440.75,437.25 440.75,450.25 L440.75,486 Z" fill="#f2e7b8"/><line x1="31.25" y1="486" x2="440.75" y2="486" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="466.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who</text><circle cx="49" cy="511.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="517.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children</text><circle cx="49" cy="540.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="546.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lone-parent families (mostly headed by</text><text x="62" y="567.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women)</text><circle cx="49" cy="590.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="596.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Disabled people</text><circle cx="49" cy="619.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="625.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low-paid or insecure workers</text><circle cx="49" cy="648.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="654.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some minority ethnic groups, notably</text><text x="62" y="675.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pakistani and Bangladeshi heritage</text><rect x="458" y="436" width="412" height="263" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,486 L459.25,450.25 Q459.25,437.25 472.25,437.25 L855.75,437.25 Q868.75,437.25 868.75,450.25 L868.75,486 Z" fill="#b5d3cf"/><line x1="459.25" y1="486" x2="868.75" y2="486" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="466.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Some explanations</text><circle cx="477" cy="511.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="517.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Gender:</tspan> unpaid care, part-time work, lower</text><text x="490" y="538.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pensions; <tspan font-weight="700">Pahl (1989):</tspan> hidden poverty</text><text x="490" y="559.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inside households</text><circle cx="477" cy="582.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="588.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ethnicity:</tspan> discrimination; low-paid sectors</text><circle cx="477" cy="611.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="617.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Class:</tspan> ownership of capital; <tspan font-weight="700">Piketty</tspan></text>
</svg>