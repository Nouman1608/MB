<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 559" width="900" height="559" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="559" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four views of the welfare state</text>

<rect x="30" y="104" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social democratic</text><text x="46" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Redistribution through progressive taxation</text><text x="46" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and generous, preferably universal, benefits.</text><rect x="458" y="104" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">New Right</text><text x="474" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Welfare creates dependency (Murray): a</text><text x="474" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">smaller state, more private and voluntary</text><text x="474" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">provision, stronger work requirements.</text><rect x="30" y="269" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,319 L31.25,283.25 Q31.25,270.25 44.25,270.25 L427.75,270.25 Q440.75,270.25 440.75,283.25 L440.75,319 Z" fill="#dce9e7"/><line x1="31.25" y1="319" x2="440.75" y2="319" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="300" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><text x="46" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Welfare keeps capitalism stable with a</text><text x="46" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">healthy workforce and less protest, without</text><text x="46" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">removing the inequality behind poverty.</text><rect x="458" y="269" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,319 L459.25,283.25 Q459.25,270.25 472.25,270.25 L855.75,270.25 Q868.75,270.25 868.75,283.25 L868.75,319 Z" fill="#dce9e7"/><line x1="459.25" y1="319" x2="868.75" y2="319" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="300" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><text x="474" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Welfare has often assumed a male breadwinner</text><text x="474" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and relied on women’s unpaid care.</text><rect x="30" y="434" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="470" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hills (2014)</text><text x="56" y="499" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Challenged the "them and us" view: most people both pay into and draw from the welfare</text><text x="56" y="521" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">state over their lifetimes.</text>
</svg>