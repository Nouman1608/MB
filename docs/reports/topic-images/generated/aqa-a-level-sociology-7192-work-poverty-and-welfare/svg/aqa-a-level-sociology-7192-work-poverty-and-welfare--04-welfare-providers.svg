<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four providers of welfare</text>

<circle cx="450" cy="274" r="78" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Welfare</text><text x="450" y="293" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">pluralism</text><rect x="30" y="104" width="300" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,148 L31.25,118.25 Q31.25,105.25 44.25,105.25 L315.75,105.25 Q328.75,105.25 328.75,118.25 L328.75,148 Z" fill="#b5d3cf"/><line x1="31.25" y1="148" x2="328.75" y2="148" stroke="#c9d6d4" stroke-width="2"/><text x="180" y="131.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">State</text><text x="46" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Beveridge Report (1942): five</text><text x="46" y="197" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">giants; Universal Credit (2012)</text><rect x="570" y="104" width="300" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M571.25,148 L571.25,118.25 Q571.25,105.25 584.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,148 Z" fill="#dce9e7"/><line x1="571.25" y1="148" x2="868.75" y2="148" stroke="#c9d6d4" stroke-width="2"/><text x="720" y="131.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Private</text><text x="586" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Private pensions and insurance</text><rect x="30" y="334" width="300" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,378 L31.25,348.25 Q31.25,335.25 44.25,335.25 L315.75,335.25 Q328.75,335.25 328.75,348.25 L328.75,378 Z" fill="#f2e7b8"/><line x1="31.25" y1="378" x2="328.75" y2="378" stroke="#c9d6d4" stroke-width="2"/><text x="180" y="361.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Voluntary</text><text x="46" y="406" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Charities such as food banks</text><rect x="570" y="334" width="300" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M571.25,378 L571.25,348.25 Q571.25,335.25 584.25,335.25 L855.75,335.25 Q868.75,335.25 868.75,348.25 L868.75,378 Z" fill="#f2e7b8"/><line x1="571.25" y1="378" x2="868.75" y2="378" stroke="#c9d6d4" stroke-width="2"/><text x="720" y="361.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal</text><text x="586" y="406" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Care by family and neighbours,</text><text x="586" y="427" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">much of it by women</text><line x1="336" y1="174" x2="386" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="564" y1="174" x2="514" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="336" y1="374" x2="386" y2="326" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="564" y1="374" x2="514" y2="326" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="464" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="500" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Esping-Andersen (1990): three worlds of welfare capitalism</text><text x="56" y="529" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Liberal, conservative and social democratic welfare states; he placed the UK closest to</text><text x="56" y="551" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the liberal model.</text>
