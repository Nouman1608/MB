<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Jahoda (1982): what a job gives besides a wage</text>

<circle cx="450" cy="330" r="82" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="326" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Paid</text><text x="450" y="351" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">employment</text><line x1="450" y1="242" x2="450" y2="170" stroke="#1e2a44" stroke-width="3"/><rect x="340" y="112" width="220" height="56" rx="28" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Time structure</text><line x1="533.6929734339735" y1="302.8065044950046" x2="602.1690426072246" y2="280.55728090000844" stroke="#1e2a44" stroke-width="3"/><rect x="558.7429987478853" y="243.28677106876" width="220" height="56" rx="28" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="668.7429987478853" y="277.28677106876" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social contact</text><line x1="501.7251022017376" y1="401.1934955049954" x2="544.0456403667957" y2="459.44271909999156" stroke="#1e2a44" stroke-width="3"/><rect x="475.1906080272688" y="455.71322893124" width="220" height="56" rx="28" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="585.1906080272688" y="489.71322893124" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shared purpose</text><line x1="398.2748977982624" y1="401.1934955049954" x2="355.9543596332043" y2="459.44271909999156" stroke="#1e2a44" stroke-width="3"/><rect x="204.8093919727312" y="455.71322893124" width="220" height="56" rx="28" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="314.8093919727312" y="489.71322893124" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Status and identity</text><line x1="366.3070265660265" y1="302.8065044950046" x2="297.8309573927754" y2="280.5572809000084" stroke="#1e2a44" stroke-width="3"/><rect x="121.25700125211469" y="243.28677106875995" width="220" height="56" rx="28" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="231.2570012521147" y="277.28677106875995" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Regular activity</text><rect x="30" y="570" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="606" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Losing these explains much of the harm of unemployment</text><text x="56" y="635" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Based on the Marienthal study (early 1930s). Critics: caring, volunteering and education</text><text x="56" y="657" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">can also provide structure and identity; Bauman argues identity now comes more from</text><text x="56" y="679" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">consumption.</text>
