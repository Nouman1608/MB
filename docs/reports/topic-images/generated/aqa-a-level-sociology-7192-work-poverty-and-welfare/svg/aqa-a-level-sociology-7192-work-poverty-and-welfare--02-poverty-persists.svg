<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 579" width="900" height="579" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="579" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why does poverty persist?</text>

<rect x="30" y="104" width="404" height="282" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural explanations</text><circle cx="53" cy="184.79" r="4.5" fill="#2e6b62"/><text x="66" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Lewis:</tspan> a "culture of poverty" of</text><text x="66" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">marginality, helplessness and</text><text x="66" y="234.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">dependency, passed to children</text><circle cx="53" cy="258.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Murray (1990):</tspan> generous welfare created</text><text x="66" y="286.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">an "underclass" of worklessness, lone</text><text x="66" y="308.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">parenthood and crime</text><rect x="466" y="104" width="404" height="282" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Structural explanations</text><circle cx="489" cy="184.79" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Townsend; social democrats:</tspan> low pay,</text><text x="502" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unemployment, inadequate benefits,</text><text x="502" y="234.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unequal access to resources</text><circle cx="489" cy="258.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Westergaard and Resler (1975):</tspan> poverty</text><text x="502" y="286.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is built into capitalist class</text><text x="502" y="308.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">inequality</text><circle cx="489" cy="332.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="338.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A pool of low-paid and unemployed</text><text x="502" y="360.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">workers keeps wages down</text><circle cx="450" cy="245" r="24" fill="#1e2a44"/><text x="450" y="252" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="404" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="440" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence against the cultural view</text><circle cx="61" cy="463.39" r="4.5" fill="#8a6d0d"/><text x="74" y="469" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Rodman (1963):</tspan> the poor "stretch" mainstream values</text><circle cx="61" cy="493.39" r="4.5" fill="#8a6d0d"/><text x="74" y="499" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">MacDonald and Marsh (2005):</tspan> questioned the welfare-dependent underclass</text><circle cx="61" cy="523.39" r="4.5" fill="#8a6d0d"/><text x="74" y="529" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Shildrick et al. (2012):</tspan> no three-generation workless families found</text>
</svg>