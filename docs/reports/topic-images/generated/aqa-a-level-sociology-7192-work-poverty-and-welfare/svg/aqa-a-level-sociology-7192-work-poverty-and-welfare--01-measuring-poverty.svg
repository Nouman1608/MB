<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" width="900" height="586" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="586" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Defining and measuring poverty</text>

<rect x="30" y="104" width="250.66666666666666" height="151" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155.33333333333331" y="137.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rowntree (1899)</text><text x="155.33333333333331" y="167.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">York survey; a "primary</text><text x="155.33333333333331" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">poverty" line from the</text><text x="155.33333333333331" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">cost of a minimum diet and</text><text x="155.33333333333331" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">essentials</text><line x1="284.66666666666663" y1="179.5" x2="320.66666666666663" y2="179.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="104" width="250.66666666666666" height="151" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="137.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Townsend (1979)</text><text x="449.99999999999994" y="167.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">deprivation index of</text><text x="449.99999999999994" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">everyday items and</text><text x="449.99999999999994" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">activities; poverty is</text><text x="449.99999999999994" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">relative</text><line x1="579.3333333333333" y1="179.5" x2="615.3333333333333" y2="179.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="104" width="250.66666666666666" height="151" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="744.6666666666666" y="136.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mack and Lansley</text><text x="744.6666666666666" y="160.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">(1985)</text><text x="744.6666666666666" y="190.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">consensual approach: the</text><text x="744.6666666666666" y="211.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">public decides which items</text><text x="744.6666666666666" y="232.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">are necessities</text><text x="155.33333333333331" y="285" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">absolute</text><text x="449.99999999999994" y="285" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">relative</text><text x="744.6666666666666" y="285" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">relative, consensual</text><rect x="30" y="307" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,357 L31.25,321.25 Q31.25,308.25 44.25,308.25 L427.75,308.25 Q440.75,308.25 440.75,321.25 L440.75,357 Z" fill="#f2e7b8"/><line x1="31.25" y1="357" x2="440.75" y2="357" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="337.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Absolute poverty</text><text x="44" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lacking the minimum needed for physical</text><text x="44" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">survival and health: food, shelter, warmth.</text><rect x="458" y="307" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,357 L459.25,321.25 Q459.25,308.25 472.25,308.25 L855.75,308.25 Q868.75,308.25 868.75,321.25 L868.75,357 Z" fill="#b5d3cf"/><line x1="459.25" y1="357" x2="868.75" y2="357" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="337.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Relative poverty</text><text x="472" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unable to reach the living standard normal in</text><text x="472" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">your own society at a given time.</text><rect x="30" y="449" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="485" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">UK official measure: relative low income</text><text x="56" y="514" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Household income below 60% of the median, adjusted for household size. Critics of</text><text x="56" y="536" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Townsend said his items were arbitrary and ignored choice.</text>
</svg>