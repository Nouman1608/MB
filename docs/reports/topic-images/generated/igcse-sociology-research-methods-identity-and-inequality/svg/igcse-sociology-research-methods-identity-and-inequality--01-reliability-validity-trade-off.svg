<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The reliability–validity trade-off</text>

<rect x="30" y="110" width="410" height="320" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUANTITATIVE</text><text x="54" y="172" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Fixed-choice answers</text><text x="54" y="202" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">questionnaires, structured interviews</text><text x="54" y="260" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><rect x="170" y="240" width="240" height="28" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="170" y="240" width="204" height="28" rx="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="364" y="259" font-size="15" font-weight="700" fill="#ffffff" text-anchor="end">strong</text><text x="54" y="310" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Validity</text><rect x="170" y="290" width="240" height="28" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="170" y="290" width="84" height="28" rx="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="264" y="309" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">weaker</text><rect x="460" y="110" width="410" height="320" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="144" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUALITATIVE</text><text x="484" y="172" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Rich, detailed data</text><text x="484" y="202" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unstructured interviews, participant observation</text><text x="484" y="260" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><rect x="600" y="240" width="240" height="28" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="600" y="240" width="84" height="28" rx="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="694" y="259" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">weaker</text><text x="484" y="310" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Validity</text><rect x="600" y="290" width="240" height="28" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="600" y="290" width="204" height="28" rx="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="794" y="309" font-size="15" font-weight="700" fill="#ffffff" text-anchor="end">strong</text><text x="54" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Easy to repeat and compare, but may</text><text x="54" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not capture what a respondent</text><text x="54" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">genuinely means.</text><text x="484" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A true picture of what is studied,</text><text x="484" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">but harder to reproduce</text><text x="484" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consistently.</text><rect x="30" y="450" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="483.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Apply this trade-off to the specific research topic in the question, rather than reciting</text><text x="50" y="505.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">it in the abstract.</text>
</svg>