<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining gender and ethnic inequality</text>

<rect x="30" y="110" width="520" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="144" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">An organisation</text><rect x="70" y="170" width="440" height="54" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="82" y="203" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Senior roles</text><circle cx="260" cy="197" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="300" cy="197" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="340" cy="197" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="380" cy="197" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="420" cy="197" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="460" cy="197" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="70" y="232" width="440" height="54" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="82" y="265" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Middle roles</text><circle cx="260" cy="259" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="300" cy="259" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="340" cy="259" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="380" cy="259" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="420" cy="259" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="460" cy="259" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="70" y="294" width="440" height="54" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="82" y="327" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Junior roles</text><circle cx="260" cy="321" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="300" cy="321" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="340" cy="321" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="380" cy="321" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="420" cy="321" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="460" cy="321" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="70" y="356" width="440" height="54" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="82" y="389" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Entry roles</text><circle cx="260" cy="383" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="300" cy="383" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="340" cy="383" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="380" cy="383" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="420" cy="383" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="460" cy="383" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="60" y1="228" x2="520" y2="228" stroke="#b5602e" stroke-width="5" stroke-dasharray="12 6"/><text x="510" y="162" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">glass ceiling</text><circle cx="90" cy="440" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="108" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women</text><circle cx="200" cy="440" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="218" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">men</text><text x="290" y="485" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Illustrative pattern, not real data</text><rect x="570" y="110" width="300" height="104" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="590" y="143" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">VERTICAL SEGREGATION</text><text x="590" y="167.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Women at lower levels</text><text x="590" y="189.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">within occupations</text><rect x="570" y="226" width="300" height="104" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="590" y="259" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">HORIZONTAL SEGREGATION</text><text x="590" y="283.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Women concentrated in</text><text x="590" y="305.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">particular occupations</text><rect x="570" y="342" width="300" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="590" y="375" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CAUSES</text><text x="590" y="404.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="605.2" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gender socialisation</text><text x="590" y="430.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="605.2" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unequal domestic and caring</text><text x="605.2" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">burden</text><text x="590" y="477.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="605.2" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Workplace discrimination</text><rect x="30" y="530" width="840" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="563" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ETHNIC INEQUALITY</text><text x="50" y="588.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Discrimination in employment and housing; institutional racism</text><text x="50" y="616.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Strong answers note that ethnicity and class interact: sociologists debate how much of the</text><text x="50" y="637.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">apparent effect of ethnicity is really due to class.</text>
