<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sampling and ethics: three rules to remember</text>

<rect x="30" y="104" width="269.3333333333333" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RULE 1</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">No sampling frame?</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Without the list, a</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">researcher is often forced</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to use a non-random</text><text x="50" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sampling method.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335.3333333333333" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RULE 2</text><text x="335.3333333333333" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bigger ≠ unbiased</text><text x="335.3333333333333" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A larger sample reduces</text><text x="335.3333333333333" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sampling error, but a</text><text x="335.3333333333333" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">biased method stays biased</text><text x="335.3333333333333" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">at any size.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="200" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="620.6666666666666" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RULE 3</text><text x="620.6666666666666" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Covert only as a</text><text x="620.6666666666666" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">last resort</text><text x="620.6666666666666" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">It breaches consent through</text><text x="620.6666666666666" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">deception; defended only</text><text x="620.6666666666666" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">where overt research would</text><text x="620.6666666666666" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">be impossible.</text><text x="450" y="342" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Research ethics require</text><rect x="123.07499999999999" y="368" width="199.6" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="222.875" y="397.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">informed consent</text><rect x="334.67499999999995" y="368" width="189.25" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="429.29999999999995" y="397.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">confidentiality</text><rect x="535.925" y="368" width="241" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="656.425" y="397.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">protection from harm</text><rect x="334.675" y="424" width="230.65" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="453.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">a right to withdraw</text>
</svg>