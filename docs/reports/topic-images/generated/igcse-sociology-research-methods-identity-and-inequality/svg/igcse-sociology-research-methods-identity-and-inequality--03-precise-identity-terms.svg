<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Precise terms examiners look for</text>

<rect x="30" y="104" width="395" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="227.5" y="149.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PRIMARY SOCIALISATION</text><text x="227.5" y="175.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Family, early childhood</text><line x1="431" y1="159" x2="469" y2="159" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="104" width="395" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="672.5" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SECONDARY SOCIALISATION</text><text x="672.5" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">School, peers, media, religion,</text><text x="672.5" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">workplace</text><rect x="30" y="232" width="840" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="259.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Together they transmit the norms and values that shape how people understand themselves and</text><text x="450" y="281.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">their place in society.</text><rect x="30" y="318" width="410" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="351" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">ASCRIBED STATUS</text><text x="235" y="378" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Fixed at birth</text><text x="235" y="407.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. sex, the family you are born into</text><rect x="460" y="318" width="410" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="351" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">ACHIEVED STATUS</text><text x="665" y="378" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Earned through action</text><text x="665" y="407.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. an occupation or qualification</text><rect x="30" y="450" width="840" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="483" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NATURE OR NURTURE?</text><text x="50" y="509.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The case for nurture</text><text x="50" y="538.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Cross-cultural variation in behaviour, and evidence from feral children, suggest that</text><text x="50" y="560.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">behaviour assumed to be natural is learned.</text>
</svg>