<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 798" width="900" height="798" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="798" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Resultant of two vectors at right angles</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="410" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="145" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Boat crossing a river</text><rect x="60" y="180" width="380" height="330" fill="#dce9e7"/><line x1="60" y1="180" x2="440" y2="180" stroke="#6f9a52" stroke-width="5" stroke-linecap="round"/><line x1="60" y1="510" x2="440" y2="510" stroke="#6f9a52" stroke-width="5" stroke-linecap="round"/><text x="430" y="200" font-size="14" font-weight="400" fill="#4a5568" text-anchor="end">river bank</text><line x1="120" y1="480" x2="120" y2="240" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="110" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">3.0 m/s</text><line x1="120" y1="240" x2="216" y2="240" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="168" y="228" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">1.2 m/s current</text><line x1="120" y1="480" x2="216" y2="240" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="190" y="390" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">3.2 m/s</text><path d="M120,420 A60,60 0 0 1 142.3,424.3" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="150" y="444" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">22°</text><rect x="460" y="110" width="410" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="145" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Two ropes on a crate</text><line x1="520" y1="470" x2="820" y2="470" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="670" y="498" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">600 N east (6.0 cm)</text><line x1="820" y1="470" x2="820" y2="245" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="810" y="360" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">450 N north</text><text x="810" y="380" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end">(4.5 cm)</text><line x1="520" y1="470" x2="820" y2="245" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="630" y="330" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">7.5 cm → 750 N</text><path d="M590,470 A70,70 0 0 0 576.0,428.0" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="600" y="452" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">37°</text><rect x="30" y="560" width="410" height="208" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="596" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">By calculation</text><text x="50" y="630" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">v² = 3.0² + 1.2² = 10.44</text><text x="50" y="660" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">v = 3.2 m/s</text><text x="50" y="690" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">tan θ = 1.2 / 3.0 = 0.40</text><text x="50" y="720" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">θ = 22° downstream from</text><text x="50" y="750" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">straight across</text><rect x="460" y="560" width="410" height="178" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="596" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Scale drawing: 1 cm = 100 N</text><text x="480" y="630" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">tip to tail at 90°</text><text x="480" y="660" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">resultant 7.5 cm</text><text x="480" y="690" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">= 750 N at 37° north of east</text><text x="480" y="720" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">check: √(600² + 450²) = 750 N</text>
</svg>