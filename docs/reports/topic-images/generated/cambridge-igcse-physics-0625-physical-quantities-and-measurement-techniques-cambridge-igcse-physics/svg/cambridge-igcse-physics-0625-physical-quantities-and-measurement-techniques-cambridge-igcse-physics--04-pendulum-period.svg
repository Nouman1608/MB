<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Timing the period of a pendulum</text>

<rect x="30" y="110" width="500" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="200" y1="150" x2="400" y2="150" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><line x1="300" y1="150" x2="300" y2="510" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><line x1="300" y1="150" x2="197.39395700229937" y2="431.9077862357725" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round"/><circle cx="197.39395700229937" cy="431.9077862357725" r="16" fill="#ffffff" stroke="#4a5568" stroke-width="2"/><line x1="300" y1="150" x2="402.6060429977006" y2="431.9077862357725" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round"/><circle cx="402.6060429977006" cy="431.9077862357725" r="16" fill="#ffffff" stroke="#4a5568" stroke-width="2"/><line x1="300" y1="150" x2="197.39395700229937" y2="431.9077862357725" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><circle cx="197.39395700229937" cy="431.9077862357725" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="296" y="480" width="8" height="40" rx="0" fill="#b5602e" stroke="#b5602e" stroke-width="1"/><text x="300" y="548" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">fiducial mark at the centre</text><path d="M183.7,469.5 A340,340 0 0 0 416.3,469.5" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M424.5,492.0 A364,364 0 0 1 175.5,492.0" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="300" y="588" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">one oscillation = across and back again</text><rect x="540" y="110" width="330" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="560" cy="178" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="560" y="184.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="592" y="172" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Release from a small</text><text x="592" y="194" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">distance to one side</text><circle cx="560" cy="262" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="560" y="268.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="592" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Start timing as the bob</text><text x="592" y="278" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">passes the mark, counting</text><text x="592" y="300" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"zero"</text><circle cx="560" cy="346" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="560" y="352.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="592" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Count passes in the same</text><text x="592" y="362" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">direction</text><circle cx="560" cy="430" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="560" y="436.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="592" y="424" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Time 20 oscillations;</text><text x="592" y="446" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">repeat; take the mean</text><circle cx="560" cy="514" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="560" y="520.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="592" y="508" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Period = mean time ÷ 20</text>
</svg>