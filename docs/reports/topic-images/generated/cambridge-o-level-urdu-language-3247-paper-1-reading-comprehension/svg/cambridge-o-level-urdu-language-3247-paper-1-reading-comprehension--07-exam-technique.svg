<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 769" width="900" height="769" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="769" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exam technique for Part 1</text>

<rect x="30" y="110" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="153.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="162.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the questions first</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Then read the passage knowing what to look for.</text><rect x="30" y="207" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="250.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="259.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="245" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the passage straight through</text><text x="122" y="273" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">For its overall argument and the writer's stance.</text><rect x="30" y="304" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="347.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="356.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="342" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Find the lines for each question</text><text x="122" y="370" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Read the sentence before and after: the reason is often in the next sentence.</text><rect x="30" y="401" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="444.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="453.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="439" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Mark the question word and tariff</text><text x="122" y="467" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Then write that number of points. Questions usually follow the passage order.</text><rect x="30" y="498" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="541.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="550.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="536" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Watch the clock</text><text x="122" y="564" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">1 hour 30 minutes for 50 marks: Part 1 should take not much more than half.</text><text x="450" y="613" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The question word sets the task</text><rect x="30" y="631" width="268" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="687" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کیوں&#x200F;</text><text x="164" y="723" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a reason</text><rect x="316" y="631" width="268" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="687" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کیسے&#x200F;</text><text x="450" y="723" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a method</text><rect x="602" y="631" width="268" height="108" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="736" y="687" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کیا فرق ہے&#x200F;</text><text x="736" y="723" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">both sides of the comparison</text>
</svg>