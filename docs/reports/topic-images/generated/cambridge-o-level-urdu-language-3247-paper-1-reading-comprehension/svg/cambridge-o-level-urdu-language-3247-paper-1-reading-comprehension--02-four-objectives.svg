<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four reading objectives, four kinds of question</text>

<rect x="30" y="110" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="174" r="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="182" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">R1</text><text x="132" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Understand and convey information</text><text x="132" y="180" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Find a fact and report it so a reader who</text><text x="132" y="201" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">has not seen the passage understands it.</text><rect x="516" y="124" width="338" height="100" rx="10" fill="#dce9e7"/><text x="840" y="176" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مضمون کے مطابق ... کب شروع ہوا؟&#x200F;</text><text x="840" y="210" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">locate one detail</text><rect x="30" y="250" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="302" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="310" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">R2</text><text x="132" y="290" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Order and present facts, ideas, opinions</text><text x="132" y="320" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Put steps, causes or events in the writer's order; tell fact from opinion.</text><rect x="30" y="366" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="430" r="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="438" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">R3</text><text x="132" y="406" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Select what is relevant</text><text x="132" y="436" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Test each detail against the key word of the</text><text x="132" y="457" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">question; a true but irrelevant point earns</text><text x="132" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nothing.</text><rect x="516" y="380" width="338" height="100" rx="10" fill="#dce9e7"/><text x="840" y="432" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وجوہات، نقصانات، اقدامات، فرق&#x200F;</text><text x="840" y="466" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">key words to underline</text><rect x="30" y="506" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="558" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="566" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">R4</text><text x="132" y="546" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Implicit meanings and attitudes</text><text x="132" y="576" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Infer the attitude from word choice and tone; name it and point to the words that show</text><text x="132" y="597" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it.</text>
</svg>