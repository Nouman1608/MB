<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 934" width="900" height="934" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="934" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Fact, opinion and attitude</text>

<rect x="30" y="110" width="410" height="196" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="52" y="128" width="120" height="34" rx="17" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="112" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FACT</text><text x="420" y="214" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;فنی اداروں میں داخلے بڑھ رہے ہیں&#x200F;</text><text x="420" y="262" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">presented as fact</text><rect x="460" y="110" width="410" height="196" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><rect x="482" y="128" width="120" height="34" rx="17" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="542" y="151" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">OPINION</text><text x="850" y="214" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہر محنت قابلِ احترام ہے&#x200F;</text><text x="850" y="262" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="end" font-style="italic">a judgement</text><rect x="30" y="330" width="840" height="446" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,380 L31.25,344 Q31.25,331.25 44,331.25 L856,331.25 Q868.75,331.25 868.75,344 L868.75,380 Z" fill="#b5d3cf"/><text x="424" y="362" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Opinion signals (R2)</text><text x="854" y="362" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Attitude words (R4)</text><line x1="440" y1="330" x2="440" y2="776" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="380" x2="870" y2="380" stroke="#c9d6d4" stroke-width="2"/><text x="235" y="432.25" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;خیال ہے&#x200F;</text><text x="235" y="465" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">is of the view</text><text x="655" y="432.25" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;افسوس کی بات یہ ہے&#x200F;</text><text x="655" y="465" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">the sad thing is</text><line x1="30" y1="479" x2="870" y2="479" stroke="#c9d6d4" stroke-width="2"/><text x="235" y="531.25" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;رائے میں&#x200F;</text><text x="235" y="564" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">in the opinion of</text><text x="655" y="531.25" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;خوش آئند&#x200F;</text><text x="655" y="564" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">welcome</text><line x1="30" y1="578" x2="870" y2="578" stroke="#c9d6d4" stroke-width="2"/><text x="235" y="630.25" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;چاہیے&#x200F;</text><text x="235" y="663" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">should</text><text x="655" y="630.25" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;بدقسمتی سے&#x200F;</text><text x="655" y="663" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">unfortunately</text><line x1="30" y1="677" x2="870" y2="677" stroke="#c9d6d4" stroke-width="2"/><text x="235" y="729.25" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;یوں لگتا ہے&#x200F;</text><text x="235" y="762" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">it seems</text><text x="655" y="729.25" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;آخرکار&#x200F;</text><text x="655" y="762" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">at last</text><rect x="30" y="798" width="840" height="108" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="838" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Trap: a reported view is not a fact</text><text x="54" y="872" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Report it as the teachers' view,</text><text x="54" y="894" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">not as a fact stated by the writer.</text><text x="846" y="870" font-size="26" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اساتذہ کا خیال ہے&#x200F;</text>
</svg>