<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Let the tariff decide the length</text>

<rect x="30" y="110" width="268" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="152" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1 mark</text><rect x="64" y="178" width="200" height="28" rx="6" fill="#b5d3cf"/><text x="164" y="198" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">point 1</text><text x="164" y="316" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a phrase or a short</text><text x="164" y="339" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">sentence</text><text x="164" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one located point</text><rect x="316" y="110" width="268" height="380" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="152" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">2 marks</text><rect x="350" y="178" width="200" height="28" rx="6" fill="#b5d3cf"/><text x="450" y="198" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">point 1</text><rect x="350" y="218" width="200" height="28" rx="6" fill="#b5d3cf"/><text x="450" y="238" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">point 2</text><text x="450" y="316" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">two separate points, or</text><text x="450" y="339" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a point plus its reason</text><text x="450" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">link them so the second is</text><text x="450" y="405" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">visible</text><rect x="602" y="110" width="268" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="152" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">3+ marks</text><rect x="636" y="178" width="200" height="28" rx="6" fill="#b5d3cf"/><text x="736" y="198" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">point 1</text><rect x="636" y="218" width="200" height="28" rx="6" fill="#b5d3cf"/><text x="736" y="238" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">point 2</text><rect x="636" y="258" width="200" height="28" rx="6" fill="#b5d3cf"/><text x="736" y="278" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">point 3</text><text x="736" y="316" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a short paragraph</text><text x="736" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">each mark has its own</text><text x="736" y="405" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">clause; count points</text><text x="736" y="426" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">against marks</text><text x="512" y="470" font-size="25" fill="#8a6d0d" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کیونکہ&#x200F;</text><text x="392" y="470" font-size="25" fill="#8a6d0d" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;اس لیے کہ&#x200F;</text><rect x="30" y="514" width="410" height="112" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="550.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Too long</text><text x="50" y="578.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Four lines for a 1-mark question waste time</text><text x="50" y="600.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">needed for Part 2.</text><rect x="460" y="514" width="410" height="112" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="550.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Too short</text><text x="480" y="578.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One line for a 4-mark question gives away</text><text x="480" y="600.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">marks you could earn.</text>
</svg>