<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Part 1 Reading at a glance</text>

<rect x="30" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="127.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">25 marks</text><text x="127.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">half of Paper 1</text><rect x="245" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">~400 words</text><text x="342.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one non-literary</text><text x="342.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">text</text><rect x="460" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="557.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">No choice</text><text x="557.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">all questions</text><text x="557.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">answered</text><rect x="675" y="110" width="195" height="130" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="772.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">In Urdu</text><text x="772.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">all answers written</text><text x="772.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in Urdu</text><rect x="30" y="266" width="410" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="303" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Expect</text><text x="50" y="332.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">an article, a report or an opinion piece</text><text x="50" y="361.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">on diet, technology, school and work, or</text><text x="50" y="384.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the environment</text><rect x="460" y="266" width="410" height="150" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="303" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Not</text><text x="480" y="332.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a story or a poem</text><text x="480" y="361.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">no questions on imagery or characters</text><text x="480" y="384.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(those belong to Paper 2)</text><text x="450" y="458" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Topic areas</text><rect x="30" y="476" width="201" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">health and fitness</text><rect x="243" y="476" width="201" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the world of youth</text><rect x="456" y="476" width="201" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">education and training</text><rect x="669" y="476" width="201" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="769" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the world we live in</text><text x="450" y="570" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">You are asked what the writer says, why, how the ideas connect, and what the writer thinks.</text>
