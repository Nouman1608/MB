<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 984" width="900" height="984" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="984" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: one point per mark</text>

<rect x="30" y="110" width="840" height="202" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="154" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">(a)</text><rect x="96" y="130" width="56" height="34" rx="17" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="124" y="153" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">[1]</text><text x="166" y="154" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">R1</text><text x="846" y="168" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پہلے والدین فنی کام کے بارے میں کیا سوچتے تھے؟&#x200F;</text><rect x="50" y="196" width="800" height="96" rx="10" fill="#dce9e7"/><text x="836" y="242" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وہ اسے ڈاکٹری یا انجینئری سے کم عزت والا کام سمجھتے تھے۔&#x200F;</text><text x="836" y="280" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end" font-style="italic">one located point, reworded</text><rect x="30" y="326" width="840" height="308" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="370" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">(b)</text><rect x="96" y="346" width="56" height="34" rx="17" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="124" y="369" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">[2]</text><text x="166" y="370" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">two points</text><text x="846" y="384" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بعض اساتذہ کیا تجویز کرتے ہیں اور اس کا مقصد کیا ہے؟&#x200F;</text><rect x="50" y="412" width="800" height="96" rx="10" fill="#dce9e7"/><text x="836" y="458" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ان کے نزدیک ہنر کے ساتھ زبان اور حساب کی بنیادی تعلیم بھی دی جائے،&#x200F;</text><text x="836" y="496" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end" font-style="italic">point 1: the suggestion</text><rect x="50" y="518" width="800" height="96" rx="10" fill="#dce9e7"/><text x="836" y="564" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تاکہ طلبہ بعد میں خود اپنا کام چلا سکیں۔&#x200F;</text><text x="836" y="602" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end" font-style="italic">point 2: its purpose</text><text x="68" y="562" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">joined by</text><text x="150" y="566" font-size="24" fill="#8a6d0d" text-anchor="start" font-family="Noto Nastaliq Urdu">&#x200F;تاکہ&#x200F;</text><rect x="30" y="648" width="840" height="308" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="692" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">(c)</text><rect x="96" y="668" width="56" height="34" rx="17" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="124" y="691" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">[2]</text><text x="166" y="692" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">R4</text><text x="846" y="706" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آخری جملے سے مصنف کے رویّے کے بارے میں کیا پتا چلتا ہے؟&#x200F;</text><rect x="50" y="734" width="800" height="96" rx="10" fill="#dce9e7"/><text x="836" y="780" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مصنف اس تبدیلی سے خوش ہے۔&#x200F;</text><text x="836" y="818" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end" font-style="italic">mark 1: names the attitude</text><rect x="50" y="840" width="800" height="96" rx="10" fill="#dce9e7"/><text x="836" y="886" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لفظ "آخرکار" بتاتا ہے کہ وہ مدت سے اس سوچ کا انتظار کر رہا تھا اور اب اسے اطمینان ہے۔&#x200F;</text><text x="836" y="924" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end" font-style="italic">mark 2: evidence from the text</text>
</svg>