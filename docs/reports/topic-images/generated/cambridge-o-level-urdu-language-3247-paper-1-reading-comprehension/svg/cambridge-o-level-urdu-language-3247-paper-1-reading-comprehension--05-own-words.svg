<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways into your own words</text>

<rect x="30" y="110" width="840" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="144" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="150.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="98" y="151" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Change the word</text><text x="278" y="151" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">keep the meaning</text><rect x="50" y="170" width="350" height="100" rx="10" fill="#f4f6f6"/><text x="64" y="258" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Passage</text><text x="386" y="218" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کم تر سمجھا جاتا تھا&#x200F;</text><text x="386" y="258" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">was thought lesser</text><line x1="404" y1="220" x2="436" y2="220" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="170" width="410" height="100" rx="10" fill="#dce9e7"/><text x="454" y="258" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Your words</text><text x="836" y="218" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اسے حقیر جانا جاتا تھا&#x200F;</text><text x="836" y="258" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">was looked down on</text><rect x="30" y="298" width="840" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="332" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="338.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="98" y="339" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Change the grammar</text><text x="311.6" y="339" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">noun phrase to verb clause</text><rect x="50" y="358" width="350" height="100" rx="10" fill="#f4f6f6"/><text x="64" y="446" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Passage</text><text x="386" y="406" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;داخلوں میں اضافہ&#x200F;</text><text x="386" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">an increase in admissions</text><line x1="404" y1="408" x2="436" y2="408" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="358" width="410" height="100" rx="10" fill="#dce9e7"/><text x="454" y="446" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Your words</text><text x="836" y="406" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;زیادہ طلبہ داخلہ لے رہے ہیں&#x200F;</text><text x="836" y="446" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">more students are enrolling</text><rect x="30" y="486" width="840" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="520" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="526.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="98" y="527" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Change the angle</text><text x="289.2" y="527" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">report it from the other side</text><rect x="50" y="546" width="350" height="100" rx="10" fill="#f4f6f6"/><text x="64" y="634" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Passage</text><text x="386" y="594" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;روزگار جلد مل جاتا ہے&#x200F;</text><text x="386" y="634" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">work is found quickly</text><line x1="404" y1="596" x2="436" y2="596" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="546" width="410" height="100" rx="10" fill="#dce9e7"/><text x="454" y="634" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Your words</text><text x="836" y="594" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;انھیں نوکری کے لیے زیادہ انتظار نہیں کرنا پڑتا&#x200F;</text><text x="836" y="634" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">they need not wait long for a job</text><rect x="30" y="680" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="720" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Technical words with no simple equivalent can stay:</text><text x="846" y="740" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;فنی تعلیم&#x200F;</text><text x="54" y="750" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the test is whether the sentence is built by you.</text>
</svg>