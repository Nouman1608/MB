<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How photochemical smog forms</text>

<rect x="30" y="110" width="440" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="156" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="163.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vehicles emit NO and VOCs</text><text x="104" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">morning rush hour; NO oxidised to NO₂</text><rect x="30" y="214" width="440" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="260" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="267.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="254" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sunlight splits NO₂</text><text x="104" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">NO₂ → NO + O</text><rect x="30" y="318" width="440" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="364" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="371.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="358" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ozone forms</text><text x="104" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">O + O₂ → O₃</text><rect x="30" y="422" width="440" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="468" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="475.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="462" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">VOCs react with nitrogen oxides</text><text x="104" y="488" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">forming PANs and more ozone</text><line x1="250" y1="202" x2="250" y2="212" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="250" y1="306" x2="250" y2="316" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="250" y1="410" x2="250" y2="420" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="530" width="440" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="562" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ozone harms</text><text x="52" y="590" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lungs and eyes; crops (less photosynthesis);</text><text x="52" y="612" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">materials such as rubber</text><rect x="490" y="110" width="380" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="680" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Through a sunny, still day</text><line x1="540" y1="560" x2="850" y2="560" stroke="#1e2a44" stroke-width="3"/><line x1="540" y1="560" x2="540" y2="200" stroke="#1e2a44" stroke-width="3"/><path d="M540,520 C580,515 600,300 630,300 C670,300 690,470 760,500 L850,515" fill="none" stroke="#8a6d0d" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M540,540 C620,540 660,400 710,250 C740,210 770,300 800,430 L850,520" fill="none" stroke="#2e6b62" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><text x="640" y="290" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">NO₂</text><text x="745" y="220" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">O₃</text><text x="630" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">morning</text><text x="730" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">afternoon</text><text x="850" y="610" font-size="15" font-weight="600" fill="#4a5568" text-anchor="end">time of day →</text><text x="518" y="380" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle" transform="rotate(-90 518 380)">concentration</text><text x="680" y="632" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">O₃ peaks when sunlight is strongest</text>
</svg>