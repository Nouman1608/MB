<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Thermal inversions trap pollution</text>

<rect x="30" y="110" width="410" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Normal conditions</text><path d="M45,390 L120,500 L350,500 L425,390 L425,580 L45,580 Z" fill="#cfe0c0" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="180" cy="215" rx="120" ry="32" fill="#9c8f6e" opacity="0.2"/><text x="180" y="221" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">pollutants disperse</text><line x1="130" y1="480" x2="130" y2="255" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="180" y1="480" x2="180" y2="250" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="230" y1="480" x2="230" y2="255" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="235" y="610" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Warm polluted air rises and disperses</text><text x="235" y="634" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">temperature falls with height</text><rect x="170" y="450" width="34" height="50" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="210" y="420" width="34" height="80" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="250" y="440" width="34" height="60" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="290" y="460" width="34" height="40" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="320" y="172" width="106" height="132" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><line x1="338" y1="280" x2="338" y2="186" stroke="#1e2a44" stroke-width="2"/><line x1="338" y1="280" x2="416" y2="280" stroke="#1e2a44" stroke-width="2"/><text x="344" y="194" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">height</text><text x="377" y="298" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">temperature</text><path d="M406,276 L350,202" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="460" y="110" width="410" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Thermal inversion</text><path d="M475,390 L550,500 L780,500 L855,390 L855,580 L475,580 Z" fill="#cfe0c0" stroke="#1e2a44" stroke-width="2.5"/><rect x="475" y="318" width="380" height="64" fill="#d4b02e" opacity="0.45"/><text x="665" y="356" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">warm air layer</text><path d="M475,390 L550,500 L780,500 L855,390 Z" fill="#9c8f6e" opacity="0.3"/><text x="665" y="412" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">cool, polluted air</text><line x1="580" y1="480" x2="580" y2="392" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="580" y="388" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><line x1="750" y1="480" x2="750" y2="392" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="750" y="388" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="665" y="610" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Pollutants trapped near the surface</text><text x="665" y="634" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">calm, clear nights; valleys and basins</text><rect x="600" y="450" width="34" height="50" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="640" y="420" width="34" height="80" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="680" y="440" width="34" height="60" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="720" y="460" width="34" height="40" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="750" y="172" width="106" height="132" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><line x1="768" y1="280" x2="768" y2="186" stroke="#1e2a44" stroke-width="2"/><line x1="768" y1="280" x2="846" y2="280" stroke="#1e2a44" stroke-width="2"/><text x="774" y="194" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">height</text><text x="807" y="298" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">temperature</text><path d="M784,276 L832,236 L790,202" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
</svg>