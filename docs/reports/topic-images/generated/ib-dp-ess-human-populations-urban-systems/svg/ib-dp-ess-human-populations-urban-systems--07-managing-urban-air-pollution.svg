<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three levels of managing urban air pollution</text>

<rect x="30" y="120" width="840" height="150" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><circle cx="70" cy="162" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="169.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="106" y="170" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Alter the human activity</text><text x="60" y="208" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public transport, cycling, compact planning,</text><text x="60" y="230" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">renewable electricity, congestion charges</text><text x="60" y="256" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">tackles the cause; slow, needs public support</text><line x1="450" y1="272" x2="450" y2="292" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="65" y="295" width="770" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><circle cx="105" cy="337" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="105" y="344.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="141" y="345" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Control release of the pollutant</text><text x="95" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">catalytic converters, particulate filters,</text><text x="95" y="405" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scrubbers, emission standards, low-emission zones</text><text x="95" y="431" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">faster; needs enforcement</text><line x1="450" y1="447" x2="450" y2="467" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="100" y="470" width="700" height="150" rx="12" fill="#efdfa8" stroke="#b5602e" stroke-width="3"/><circle cx="140" cy="512" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="140" y="519.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="176" y="520" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Clean up / restore</text><text x="130" y="558" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">street trees and green walls trap particulates;</text><text x="130" y="580" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">air quality alerts for vulnerable people</text><text x="130" y="606" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">weakest for air: pollutants disperse</text><text x="450" y="660" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Work from the top: the earlier the intervention, the closer it is to the cause.</text>
</svg>