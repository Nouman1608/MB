<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The urban heat island</text>

<rect x="30" y="110" width="840" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="500" width="836" height="40" fill="#cfe0c0"/><line x1="32" y1="500" x2="868" y2="500" stroke="#1e2a44" stroke-width="3"/><rect x="250" y="460" width="44" height="40" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="300" y="430" width="44" height="70" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="345" y="390" width="44" height="110" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="395" y="330" width="44" height="170" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="445" y="280" width="44" height="220" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="500" y="310" width="44" height="190" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="550" y="370" width="44" height="130" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="600" y="420" width="44" height="80" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="650" y="450" width="44" height="50" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="67" y="476" width="6" height="24" fill="#9c8f6e"/><circle cx="70" cy="466" r="18" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="127" y="476" width="6" height="24" fill="#9c8f6e"/><circle cx="130" cy="466" r="18" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="187" y="476" width="6" height="24" fill="#9c8f6e"/><circle cx="190" cy="466" r="18" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="717" y="476" width="6" height="24" fill="#9c8f6e"/><circle cx="720" cy="466" r="18" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="777" y="476" width="6" height="24" fill="#9c8f6e"/><circle cx="780" cy="466" r="18" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="837" y="476" width="6" height="24" fill="#9c8f6e"/><circle cx="840" cy="466" r="18" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><path d="M50,290 C200,288 260,250 330,220 C390,190 470,178 520,188 C600,210 640,270 700,286 C760,294 820,290 850,290" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="60" y="268" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">air temperature</text><text x="470" y="166" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">warmest over the centre</text><text x="110" y="528" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">rural</text><text x="470" y="528" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">city centre</text><text x="790" y="528" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">rural</text><circle cx="60" cy="340" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="345.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="82" y="338" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Dark surfaces absorb</text><text x="82" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sun, release heat slowly</text><circle cx="664" cy="340" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="664" y="345.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="686" y="338" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Waste heat: vehicles,</text><text x="686" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">buildings, air conditioning</text><circle cx="60" cy="400" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="405.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="82" y="398" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Less vegetation, so</text><text x="82" y="416" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">less evapotranspiration</text><circle cx="664" cy="400" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="664" y="405.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="686" y="398" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Tall buildings trap</text><text x="686" y="416" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">heat, reduce wind</text><text x="60" y="590" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cities are warmer than the surrounding countryside, especially at night.</text><text x="60" y="614" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Impermeable surfaces also speed runoff and raise flood risk.</text><text x="60" y="638" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Green roofs, street trees and parks help cool the city.</text>
</svg>