<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A city as an open system</text>

<rect x="30" y="150" width="230" height="420" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="145" y="192" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Inputs</text><text x="52" y="236" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">food</text><text x="52" y="274" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">water</text><text x="52" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">energy (fuel,</text><text x="52" y="350" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">electricity)</text><text x="52" y="388" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">building materials</text><text x="52" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">manufactured goods</text><text x="52" y="464" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">people (migrants,</text><text x="52" y="502" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">commuters)</text><rect x="300" y="150" width="300" height="420" rx="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3" stroke-dasharray="12 8"/><text x="450" y="192" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">City</text><text x="450" y="218" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">open system: storages</text><rect x="335" y="280" width="60" height="110" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="345" y="294" width="40" height="10" fill="#f2e7b8"/><rect x="345" y="320" width="40" height="10" fill="#f2e7b8"/><rect x="345" y="346" width="40" height="10" fill="#f2e7b8"/><rect x="405" y="250" width="45" height="140" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="415" y="264" width="25" height="10" fill="#f2e7b8"/><rect x="415" y="290" width="25" height="10" fill="#f2e7b8"/><rect x="415" y="316" width="25" height="10" fill="#f2e7b8"/><rect x="460" y="300" width="55" height="90" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="470" y="314" width="35" height="10" fill="#f2e7b8"/><rect x="470" y="340" width="35" height="10" fill="#f2e7b8"/><rect x="470" y="366" width="35" height="10" fill="#f2e7b8"/><rect x="525" y="270" width="45" height="120" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="535" y="284" width="25" height="10" fill="#f2e7b8"/><rect x="535" y="310" width="25" height="10" fill="#f2e7b8"/><rect x="535" y="336" width="25" height="10" fill="#f2e7b8"/><text x="330" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">buildings and infrastructure</text><text x="330" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">people</text><text x="330" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stocks of goods</text><rect x="640" y="150" width="230" height="420" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="755" y="192" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Outputs</text><text x="662" y="236" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">solid waste</text><text x="662" y="274" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sewage</text><text x="662" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">air pollutants</text><text x="662" y="350" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">greenhouse gases</text><text x="662" y="388" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">waste heat</text><text x="662" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">goods and services</text><text x="662" y="464" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">people leaving</text><line x1="262" y1="260" x2="296" y2="260" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><line x1="604" y1="260" x2="636" y2="260" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><line x1="262" y1="360" x2="296" y2="360" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><line x1="604" y1="360" x2="636" y2="360" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><line x1="262" y1="460" x2="296" y2="460" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><line x1="604" y1="460" x2="636" y2="460" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><rect x="30" y="595" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="637" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Little food or energy is produced inside, so the footprint is far larger than the city’s area.</text>
</svg>