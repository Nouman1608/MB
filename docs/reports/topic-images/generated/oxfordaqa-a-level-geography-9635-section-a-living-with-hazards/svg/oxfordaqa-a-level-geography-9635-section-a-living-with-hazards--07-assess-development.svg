<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 591" width="900" height="591" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An "assess" paragraph on tropical storms</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How important is level of development in determining impacts?</text>
<line x1="60" y1="144" x2="60" y2="539" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Claim (links to risk)</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Development shapes impacts because it determines vulnerability and capacity to cope.</text><circle cx="60" cy="166" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="174.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="220" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="252.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Specific evidence: Nargis</text><text x="122" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Surge on a dense, low-lying delta; lightly built homes; warnings missed villages; delayed foreign</text><text x="122" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">aid lengthened relief.</text><circle cx="60" cy="272.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="281.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="337" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="369.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Counter-evidence: Katrina</text><text x="122" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">New Orleans largely below sea level; levees failed; residents without cars: over 1,800 deaths in</text><text x="122" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a high-income country.</text><circle cx="60" cy="389.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="398.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="454" width="766" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="486.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Weighted judgement</text><text x="122" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Physical factors (surge height, coastal shape, track) set the scale of threat; development</text><text x="122" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decides how much becomes disaster.</text><circle cx="60" cy="506.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="515.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>