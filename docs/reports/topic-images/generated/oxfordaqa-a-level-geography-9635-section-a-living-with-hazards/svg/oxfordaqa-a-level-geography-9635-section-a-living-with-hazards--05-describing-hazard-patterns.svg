<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Describing hazard patterns</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The specification's terms as a checklist</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="332" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="155.21739130434784" height="44" fill="#b5d3cf"/><rect x="185.21739130434784" y="124" width="228.2608695652174" height="44" fill="#f2e7b8"/><text x="197.21739130434784" y="149.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Volcanic</text><rect x="413.47826086956525" y="124" width="228.2608695652174" height="44" fill="#b5d3cf"/><text x="425.47826086956525" y="149.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Seismic</text><rect x="641.7391304347826" y="124" width="228.2608695652174" height="44" fill="#dce9e7"/><text x="653.7391304347826" y="149.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tropical storms</text><rect x="30" y="168" width="155.21739130434784" height="82" fill="#dce9e7"/><text x="42" y="192" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Spatial</text><text x="42" y="212" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">distribution</text><rect x="185.21739130434784" y="168" width="228.2608695652174" height="82" fill="#ffffff"/><text x="197.21739130434784" y="192" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Plate margins and over</text><text x="197.21739130434784" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">magma plumes</text><rect x="413.47826086956525" y="168" width="228.2608695652174" height="82" fill="#ffffff"/><text x="425.47826086956525" y="192" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Plate margins</text><rect x="641.7391304347826" y="168" width="228.2608695652174" height="82" fill="#ffffff"/><text x="653.7391304347826" y="192" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Warm oceans about 5-30°</text><text x="653.7391304347826" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">latitude; track west, then</text><text x="653.7391304347826" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">poleward</text><line x1="30" y1="250" x2="870" y2="250" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="250" width="155.21739130434784" height="62" fill="#dce9e7"/><text x="42" y="274" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Magnitude</text><rect x="185.21739130434784" y="250" width="228.2608695652174" height="62" fill="#f8faf9"/><text x="197.21739130434784" y="274" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Volcanic Explosivity Index</text><text x="197.21739130434784" y="294" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(VEI)</text><rect x="413.47826086956525" y="250" width="228.2608695652174" height="62" fill="#f8faf9"/><text x="425.47826086956525" y="274" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Moment magnitude:</text><text x="425.47826086956525" y="294" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">logarithmic</text><rect x="641.7391304347826" y="250" width="228.2608695652174" height="62" fill="#f8faf9"/><text x="653.7391304347826" y="274" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Saffir-Simpson scale</text><line x1="30" y1="312" x2="870" y2="312" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="312" width="155.21739130434784" height="82" fill="#dce9e7"/><text x="42" y="336" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Frequency and</text><text x="42" y="356" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">regularity</text><rect x="185.21739130434784" y="312" width="228.2608695652174" height="82" fill="#ffffff"/><text x="197.21739130434784" y="336" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Some erupt almost</text><text x="197.21739130434784" y="356" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">continuously; others after</text><text x="197.21739130434784" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">centuries of dormancy</text><rect x="413.47826086956525" y="312" width="228.2608695652174" height="82" fill="#ffffff"/><text x="425.47826086956525" y="336" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Small quakes far more</text><text x="425.47826086956525" y="356" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">frequent than large</text><rect x="641.7391304347826" y="312" width="228.2608695652174" height="82" fill="#ffffff"/><text x="653.7391304347826" y="336" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A season: regular timing, not</text><text x="653.7391304347826" y="356" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exact track</text><line x1="30" y1="394" x2="870" y2="394" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="394" width="155.21739130434784" height="62" fill="#dce9e7"/><text x="42" y="418" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Predictability</text><rect x="185.21739130434784" y="394" width="228.2608695652174" height="62" fill="#f8faf9"/><text x="197.21739130434784" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Measurable warnings</text><rect x="413.47826086956525" y="394" width="228.2608695652174" height="62" fill="#f8faf9"/><text x="425.47826086956525" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Timing random; location</text><text x="425.47826086956525" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">only as a probability</text><rect x="641.7391304347826" y="394" width="228.2608695652174" height="62" fill="#f8faf9"/><text x="653.7391304347826" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Tracks forecast days ahead</text></g><line x1="185.21739130434784" y1="124" x2="185.21739130434784" y2="456" stroke="#c9d6d4" stroke-width="1.5"/><line x1="413.47826086956525" y1="124" x2="413.47826086956525" y2="456" stroke="#c9d6d4" stroke-width="1.5"/><line x1="641.7391304347826" y1="124" x2="641.7391304347826" y2="456" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="332" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="30" y="488" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">MOMENT MAGNITUDE: EACH WHOLE NUMBER ≈ 32 TIMES MORE ENERGY</text><circle cx="60" cy="538" r="16" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="544" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">M4</text><line x1="82" y1="538" x2="234" y2="538" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="160" y="526" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">x 32</text><circle cx="260" cy="538" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="260" y="544" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">M5</text><line x1="286" y1="538" x2="430" y2="538" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="360" y="526" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">x 32</text><circle cx="460" cy="538" r="24" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="460" y="544" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">M6</text><line x1="490" y1="538" x2="626" y2="538" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="560" y="526" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">x 32</text><circle cx="660" cy="538" r="28" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="544" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">M7</text><line x1="694" y1="538" x2="782" y2="538" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="740" y="526" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">x 32</text><circle cx="820" cy="538" r="32" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="820" y="544" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">M8</text><text x="450" y="594" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">M8 is not "twice" M4: it is 32 x 32 x 32 x 32 times the energy</text>
