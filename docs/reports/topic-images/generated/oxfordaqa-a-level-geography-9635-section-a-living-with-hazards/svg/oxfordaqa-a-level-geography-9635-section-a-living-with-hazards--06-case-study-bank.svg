<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A bank of recent case studies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Organise each under the same headings so they can be compared</text>
<rect x="116.06" y="124" width="133.66500000000002" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="182.8925" y="143.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">physical cause</text><rect x="259.725" y="124" width="255.975" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="387.71250000000003" y="143.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">primary and secondary impacts</text><rect x="525.7" y="124" width="258.24" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="654.82" y="143.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">short- and long-term responses</text><rect x="257.97749999999996" y="163" width="384.045" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="450" y="182.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">preparedness, mitigation, prevention, adaptation</text><clipPath id="tc208"><rect x="30" y="208" width="840" height="422" rx="14"/></clipPath><g clip-path="url(#tc208)"><rect x="30" y="208" width="215.67567567567568" height="42" fill="#b5d3cf"/><text x="41" y="232.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Event</text><rect x="245.67567567567568" y="208" width="170.27027027027026" height="42" fill="#b5d3cf"/><text x="256.6756756756757" y="232.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Deaths</text><rect x="415.94594594594594" y="208" width="454.054054054054" height="42" fill="#b5d3cf"/><text x="426.94594594594594" y="232.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key points from the lesson</text><rect x="30" y="250" width="215.67567567567568" height="80" fill="#dce9e7"/><text x="41" y="273" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Soufrière Hills,</text><text x="41" y="293" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Montserrat (from 1995)</text><rect x="245.67567567567568" y="250" width="170.27027027027026" height="80" fill="#ffffff"/><text x="256.6756756756757" y="273" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">19 (pyroclastic</text><text x="256.6756756756757" y="293" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">flows, June 1997)</text><rect x="415.94594594594594" y="250" width="454.054054054054" height="80" fill="#ffffff"/><text x="426.94594594594594" y="273" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Destructive margin; Plymouth abandoned and buried;</text><text x="426.94594594594594" y="293" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">southern exclusion zone; Montserrat Volcano Observatory</text><text x="426.94594594594594" y="313" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sets hazard zones</text><line x1="30" y1="330" x2="870" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="330" width="215.67567567567568" height="60" fill="#dce9e7"/><text x="41" y="353" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Christchurch, NZ (22 Feb</text><text x="41" y="373" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">2011)</text><rect x="245.67567567567568" y="330" width="170.27027027027026" height="60" fill="#f8faf9"/><text x="256.6756756756757" y="353" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">185</text><rect x="415.94594594594594" y="330" width="454.054054054054" height="60" fill="#f8faf9"/><text x="426.94594594594594" y="353" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Shallow earthquake; liquefaction in eastern suburbs; centre</text><text x="426.94594594594594" y="373" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rebuilt to stricter standards</text><line x1="30" y1="390" x2="870" y2="390" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="390" width="215.67567567567568" height="60" fill="#dce9e7"/><text x="41" y="413" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Cyclone Nargis, Myanmar</text><text x="41" y="433" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">(May 2008)</text><rect x="245.67567567567568" y="390" width="170.27027027027026" height="60" fill="#ffffff"/><text x="256.6756756756757" y="413" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Around 138,000</text><text x="256.6756756756757" y="433" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dead or missing</text><rect x="415.94594594594594" y="390" width="454.054054054054" height="60" fill="#ffffff"/><text x="426.94594594594594" y="413" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Storm surge across the low Irrawaddy delta; foreign aid at</text><text x="426.94594594594594" y="433" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">first restricted</text><line x1="30" y1="450" x2="870" y2="450" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="450" width="215.67567567567568" height="60" fill="#dce9e7"/><text x="41" y="473" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Hurricane Katrina, USA</text><text x="41" y="493" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">(2005)</text><rect x="245.67567567567568" y="450" width="170.27027027027026" height="60" fill="#f8faf9"/><text x="256.6756756756757" y="473" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">More than 1,800</text><rect x="415.94594594594594" y="450" width="454.054054054054" height="60" fill="#f8faf9"/><text x="426.94594594594594" y="473" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Levees failed in New Orleans; poorer residents could not</text><text x="426.94594594594594" y="493" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">evacuate</text><line x1="30" y1="510" x2="870" y2="510" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="510" width="215.67567567567568" height="60" fill="#dce9e7"/><text x="41" y="533" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Camp Fire, California (Nov</text><text x="41" y="553" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">2018)</text><rect x="245.67567567567568" y="510" width="170.27027027027026" height="60" fill="#ffffff"/><text x="256.6756756756757" y="533" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">85</text><rect x="415.94594594594594" y="510" width="454.054054054054" height="60" fill="#ffffff"/><text x="426.94594594594594" y="533" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Paradise largely destroyed; started by transmission</text><text x="426.94594594594594" y="553" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">equipment; dry fuel, strong winds</text><line x1="30" y1="570" x2="870" y2="570" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="570" width="215.67567567567568" height="60" fill="#dce9e7"/><text x="41" y="593" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Tōhoku, Japan (11 Mar</text><text x="41" y="613" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">2011)</text><rect x="245.67567567567568" y="570" width="170.27027027027026" height="60" fill="#f8faf9"/><text x="256.6756756756757" y="593" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Around 18,000 dead</text><text x="256.6756756756757" y="613" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">or missing</text><rect x="415.94594594594594" y="570" width="454.054054054054" height="60" fill="#f8faf9"/><text x="426.94594594594594" y="593" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Magnitude 9.0; tsunami; Fukushima Daiichi accident:</text><text x="426.94594594594594" y="613" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">multi-hazard setting</text></g><line x1="245.67567567567568" y1="208" x2="245.67567567567568" y2="630" stroke="#c9d6d4" stroke-width="1.5"/><line x1="415.94594594594594" y1="208" x2="415.94594594594594" y2="630" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="208" width="840" height="422" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>