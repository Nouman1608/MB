<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the shape of the Park model</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">One community, one event</text>
<rect x="30" y="124" width="840" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="100" y1="484" x2="840" y2="484" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="100" y1="484" x2="100" y2="154" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="840" y="510" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">time</text><text transform="translate(66,324) rotate(-90)" text-anchor="middle" font-size="16" fill="#4a5568">quality of life / normality</text><line x1="100" y1="264" x2="840" y2="264" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="8 6"/><text x="106" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pre-event level</text><path d="M100,264 L190,264 C210,264 215,282 228,282 L240,278 L244,444 C280,454 320,454 350,442 C460,374 570,274 670,238 L830,230" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><line x1="242" y1="164" x2="242" y2="484" stroke="#b5602e" stroke-width="2.5"/><text x="248" y="170" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">hazard event</text><path d="M244,470 L244,478 L360,478 L360,470" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="302" y="464" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">relief</text><path d="M364,470 L364,478 L570,478 L570,470" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="467" y="464" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">rehabilitation</text><path d="M574,470 L574,478 L830,478 L830,470" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="702" y="464" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">reconstruction</text><circle cx="210" cy="240" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="210" y="245.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><circle cx="270" cy="364" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="270" y="369.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="300" cy="424" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="300" y="429.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="465" cy="362" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="465" y="367.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="790" cy="206" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="790" y="211.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="850" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Illustrative shape</text><rect x="30" y="570" width="268" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="43" y="595" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1 · DEPTH OF FALL</text><text x="43" y="626" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Vulnerability and event</text><text x="43" y="646" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">magnitude.</text><rect x="316" y="570" width="268" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="329" y="595" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2 · LENGTH OF RELIEF</text><text x="329" y="626" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Emergency capacity and access</text><text x="329" y="646" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">to the area.</text><rect x="602" y="570" width="268" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615" y="595" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3 · SLOPE OF RECOVERY</text><text x="615" y="626" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Funding, governance and</text><text x="615" y="646" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">insurance.</text><rect x="30" y="675" width="411" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="43" y="700" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4 · END LEVEL</text><text x="43" y="731" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Above the line: better building or planning; below:</text><text x="43" y="751" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">long-term damage.</text><rect x="459" y="675" width="411" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="700" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">5 · PRE-EVENT DIP</text><text x="472" y="731" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Preparedness actions and warnings (on some</text><text x="472" y="751" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">versions).</text>
</svg>