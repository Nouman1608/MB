<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 591" width="900" height="591" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why responses differ</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Five hazard properties steer the choice among six human responses</text>
<rect x="49.936000000000035" y="124" width="87.056" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="93.46400000000003" y="144.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">fatalism</text><rect x="146.99200000000002" y="124" width="103.92" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="198.95200000000003" y="144.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">prediction</text><rect x="260.91200000000003" y="124" width="210.128" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="365.976" y="144.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">adjustment / adaptation</text><rect x="481.04" y="124" width="102.512" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="532.296" y="144.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">mitigation</text><rect x="593.552" y="124" width="126.784" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="656.9440000000001" y="144.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">management</text><rect x="730.336" y="124" width="119.728" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="790.2" y="144.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">risk-sharing</text><clipPath id="tc170"><rect x="30" y="170" width="840" height="389" rx="14"/></clipPath><g clip-path="url(#tc170)"><rect x="30" y="170" width="224" height="49" fill="#b5d3cf"/><text x="44" y="198.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Property</text><rect x="254" y="170" width="616.0000000000001" height="49" fill="#b5d3cf"/><text x="268" y="198.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How it steers the response</text><rect x="30" y="219" width="224" height="68" fill="#dce9e7"/><text x="44" y="245.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Incidence (how often)</text><rect x="254" y="219" width="616.0000000000001" height="68" fill="#ffffff"/><text x="268" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Frequent events justify permanent investment (building codes, drills); rare</text><text x="268" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">events encourage complacency or fatalism.</text><line x1="30" y1="287" x2="870" y2="287" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="287" width="224" height="68" fill="#dce9e7"/><text x="44" y="313.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Intensity (effects at a</text><text x="44" y="334.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">place)</text><rect x="254" y="287" width="616.0000000000001" height="68" fill="#f8faf9"/><text x="268" y="313.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High-intensity zones near a fault or vent need zoning or exclusion;</text><text x="268" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">low-intensity areas can adapt buildings.</text><line x1="30" y1="355" x2="870" y2="355" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="355" width="224" height="68" fill="#dce9e7"/><text x="44" y="381.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Magnitude (size of</text><text x="44" y="402.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">event)</text><rect x="254" y="355" width="616.0000000000001" height="68" fill="#ffffff"/><text x="268" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Very large events can overwhelm any defence, so evacuation and</text><text x="268" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">risk-sharing matter more than engineering.</text><line x1="30" y1="423" x2="870" y2="423" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="423" width="224" height="68" fill="#dce9e7"/><text x="44" y="449.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Distribution (where)</text><rect x="254" y="423" width="616.0000000000001" height="68" fill="#f8faf9"/><text x="268" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hazards in known belts (plate margins, storm tracks) can be mapped and</text><text x="268" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">zoned; scattered hazards such as wildfire are harder to plan for.</text><line x1="30" y1="491" x2="870" y2="491" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="491" width="224" height="68" fill="#dce9e7"/><text x="44" y="517.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Level of development</text><rect x="254" y="491" width="616.0000000000001" height="68" fill="#ffffff"/><text x="268" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wealth funds monitoring, insurance and engineering; poorer communities</text><text x="268" y="538.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may rely on informal adaptation and aid, or have to accept the risk.</text></g><line x1="254" y1="170" x2="254" y2="559" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="170" width="840" height="389" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>