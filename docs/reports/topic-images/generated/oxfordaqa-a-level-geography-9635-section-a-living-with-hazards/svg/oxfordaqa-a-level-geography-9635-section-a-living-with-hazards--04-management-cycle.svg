<rect width="900" height="536" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The hazard management cycle</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Preparedness, response, recovery, mitigation</text>
<circle cx="300" cy="314" r="140" fill="none" stroke="#c9d6d4" stroke-width="10"/><path d="M352.4449230782277,184.19426036064976 A140,140 0 0 1 429.80573963935024,261.5550769217723" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M429.80573963935024,366.4449230782277 A140,140 0 0 1 352.4449230782277,443.80573963935024" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M247.5550769217723,443.80573963935024 A140,140 0 0 1 170.19426036064976,366.4449230782277" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M170.19426036064976,261.5550769217723 A140,140 0 0 1 247.55507692177227,184.19426036064976" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="218" y="150" width="164" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="300" y="181" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Preparedness</text><rect x="358" y="290" width="164" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="440" y="321" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Response</text><rect x="218" y="430" width="164" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="300" y="461" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Recovery</text><rect x="78" y="290" width="164" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="160" y="321" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mitigation</text><text x="300" y="308" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lessons from one event</text><text x="300" y="328" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">shape the next</text><rect x="520" y="134" width="350" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="168.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Park model</text><text x="540" y="196.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What happens to one community after</text><text x="540" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one event.</text><rect x="520" y="254" width="350" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="288.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Management cycle</text><text x="540" y="316.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How management should improve</text><text x="540" y="337.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between events.</text><rect x="520" y="374" width="350" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="540" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"Moved round the cycle"</text><text x="540" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">E.g. rebuilding with new building codes</text><text x="540" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is mitigation for the next event.</text>
</svg>