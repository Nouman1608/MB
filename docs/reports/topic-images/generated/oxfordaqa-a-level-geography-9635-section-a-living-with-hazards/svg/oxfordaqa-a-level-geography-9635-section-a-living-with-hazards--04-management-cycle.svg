<rect width="900" height="536" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The hazard management cycle</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Preparedness, response, recovery, mitigation</text>
<circle cx="270" cy="314" r="160" fill="none" stroke="#c9d6d4" stroke-width="10"/><path d="M350,175.43593539448983 A160,160 0 0 1 411.2716148574283,238.88454995425747" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M408.5640646055102,394 A160,160 0 0 1 345.11545004574253,455.2716148574283" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M190.00000000000003,452.5640646055102 A160,160 0 0 1 128.7283851425717,389.1154500457426" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M131.43593539448983,234 A160,160 0 0 1 194.88454995425747,172.72838514257168" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="195" y="130" width="150" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="270" y="161" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Preparedness</text><rect x="355" y="290" width="150" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="430" y="321" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Response</text><rect x="195" y="450" width="150" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="270" y="481" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Recovery</text><rect x="35" y="290" width="150" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="110" y="321" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mitigation</text><text x="270" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lessons from</text><text x="270" y="320" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">one event shape</text><text x="270" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the next</text><rect x="520" y="134" width="350" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="168.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Park model</text><text x="540" y="196.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What happens to one community after</text><text x="540" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one event.</text><rect x="520" y="254" width="350" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="288.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Management cycle</text><text x="540" y="316.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How management should improve</text><text x="540" y="337.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between events.</text><rect x="520" y="374" width="350" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="540" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"Moved round the cycle"</text><text x="540" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">E.g. rebuilding with new building codes</text><text x="540" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is mitigation for the next event.</text>
</svg>