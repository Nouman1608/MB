<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Order the methods for the audience</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: a homework-free weekend, for a sceptical headteacher</text>
<rect x="220" y="122" width="650" height="99.32000000000002" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5" /><text x="236" y="153.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Cause-effect</text><text x="236" y="180.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The problem is real: 70% feel exhausted on Mondays (invented survey);</text><text x="236" y="201.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">exhausted pupils learn less.</text><circle cx="60" cy="171.66000000000003" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="179.58" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="94" y="157.66000000000003" width="28" height="28" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><line x1="124" y1="171.66000000000003" x2="140" y2="171.66000000000003" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="142" y="157.66000000000003" width="28" height="28" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><line x1="172" y1="171.66000000000003" x2="188" y2="171.66000000000003" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="190" y="157.66000000000003" width="28" height="28" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><line x1="60" y1="195.66000000000003" x2="60" y2="265.32000000000005" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="220" y="243.32000000000002" width="650" height="78.20000000000002" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5" /><text x="236" y="274.52000000000004" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Comparison-contrast</text><text x="236" y="302.00000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The solution works: the neighbouring school that has tried the policy.</text><circle cx="60" cy="282.42" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="290.34000000000003" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="262.42" width="44" height="40" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><rect x="160" y="262.42" width="44" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="154" y="289.42" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">⟷</text><line x1="60" y1="306.42" x2="60" y2="365.52000000000004" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="220" y="343.52000000000004" width="650" height="78.19999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="236" y="374.72" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Narration</text><text x="236" y="402.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A human face: the Year 9 pupil who spent a whole Sunday on a project.</text><circle cx="60" cy="382.62" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="390.54" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="94" y1="382.62" x2="184" y2="382.62" stroke="#1e2a44" stroke-width="3"/><circle cx="104" cy="382.62" r="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="139" cy="382.62" r="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="174" cy="382.62" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="184" y1="382.62" x2="198" y2="382.62" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="445.72" width="840" height="74.24000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="477.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Narration is vivid but personal: for a sceptical reader it works best <tspan font-weight="700">after</tspan> the case has been made.</text><text x="450" y="498.44000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Another order can work if the writer can explain it.</text>
