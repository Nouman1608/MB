<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: does easier recycling work?</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Metal waste: 18,000 t a year</text><text x="840" y="148" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented figures</text><text x="184" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Before</text><rect x="200" y="176" width="640" height="54" fill="#e6ebea" stroke="#1e2a44" stroke-width="2.5"/><rect x="200" y="176" width="160" height="54" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="280" y="210" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4,500 t = 25%</text><text x="184" y="290" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">After</text><rect x="200" y="256" width="640" height="54" fill="#e6ebea" stroke="#1e2a44" stroke-width="2.5"/><rect x="200" y="256" width="256" height="54" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="328" y="290" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">7,200 t = 40%</text><text x="472" y="290" font-size="16.5" font-weight="600" fill="#4a5568" text-anchor="start">not recycled: 60%</text><text x="60" y="372" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kerbside collection made recycling more accessible and easier.</text><rect x="30" y="430" width="410" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="468" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mass recycled rose by</text><text x="54" y="498" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(7,200 − 4,500) ÷ 4,500</text><text x="54" y="524" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">× 100 = 60%</text><rect x="460" y="430" width="410" height="140" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="468" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">60% of the metal is still not recycled,</text><text x="484" y="491" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">so education is needed as well.</text>
</svg>