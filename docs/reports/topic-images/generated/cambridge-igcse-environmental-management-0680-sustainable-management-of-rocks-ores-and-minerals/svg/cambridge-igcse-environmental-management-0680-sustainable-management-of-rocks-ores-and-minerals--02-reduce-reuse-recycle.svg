<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" width="900" height="575" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="575" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reduce, reuse, recycle: not the same</text>

<rect x="30" y="110" width="270" height="330" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="150" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">Reduce</text><text x="165" y="180" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">use less in the first</text><text x="165" y="201" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">place</text><text x="52" y="252" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Examples</text><text x="52" y="280" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="68" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">thinner drinks cans</text><text x="52" y="307" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="68" y="307" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lighter car parts</text><text x="52" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="68" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">longer-lasting goods</text><text x="52" y="361" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="68" y="361" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">buy fewer replacements</text><rect x="315" y="110" width="270" height="330" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="150" font-size="24" font-weight="700" fill="#8a6d0d" text-anchor="middle">Reuse</text><text x="450" y="180" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">use the object again,</text><text x="450" y="201" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">without processing</text><text x="337" y="252" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Examples</text><text x="337" y="280" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="353" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reclaimed bricks and</text><text x="353" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">building stone</text><text x="337" y="328" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="353" y="328" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">refillable glass bottles</text><text x="337" y="355" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="353" y="355" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repaired electronics</text><text x="337" y="382" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="353" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">second-hand machinery</text><rect x="600" y="110" width="270" height="330" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="735" y="150" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">Recycle</text><text x="735" y="180" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">process waste into raw</text><text x="735" y="201" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">material again</text><text x="622" y="252" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Examples</text><text x="622" y="280" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="638" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">melt aluminium cans or</text><text x="638" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">steel</text><text x="622" y="328" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="638" y="328" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recover copper from</text><text x="638" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cables</text><text x="622" y="376" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="638" y="376" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crush old concrete for</text><text x="638" y="397" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aggregate</text><rect x="30" y="460" width="840" height="90" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reuse keeps the object; recycling breaks it down into raw material.</text><text x="450" y="524" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">Reduce and reuse are the cheapest: no new extraction or processing.</text>
</svg>