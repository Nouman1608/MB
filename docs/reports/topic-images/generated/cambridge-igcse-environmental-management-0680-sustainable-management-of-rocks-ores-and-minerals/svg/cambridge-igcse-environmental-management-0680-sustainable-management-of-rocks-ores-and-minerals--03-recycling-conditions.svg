<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes people recycle?</text>

<rect x="30" y="110" width="270" height="130" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Accessibility</text><text x="48" y="170.575" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">collection points close</text><text x="48" y="192.355" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">by, or collection from</text><text x="48" y="214.135" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">homes and businesses</text><line x1="165" y1="244" x2="390" y2="288" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="315" y="110" width="270" height="130" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="333" y="145" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Ease</text><text x="333" y="170.575" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">simple sorting, clearly</text><text x="333" y="192.355" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">labelled bins, products</text><text x="333" y="214.135" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">easy to separate</text><line x1="450" y1="244" x2="450" y2="288" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="600" y="110" width="270" height="130" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="145" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Education</text><text x="618" y="170.575" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">people know what can be</text><text x="618" y="192.355" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">recycled, how to prepare</text><text x="618" y="214.135" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">it and why it matters</text><line x1="735" y1="244" x2="510" y2="288" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="294" width="400" height="56" rx="28" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="328.84" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">more material recycled</text><rect x="30" y="374" width="410" height="214" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="410" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Benefits</text><text x="54" y="442" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="442" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">less demand for new ore: less mining,</text><text x="70" y="463" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">habitat loss and mining waste</text><text x="54" y="489" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="489" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">usually less energy than new ore</text><text x="54" y="515" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="515" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">less waste to landfill</text><rect x="460" y="374" width="410" height="214" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="484" y="410" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Limitations</text><text x="484" y="442" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="442" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">collection, transport and sorting cost</text><text x="500" y="463" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">money and use energy</text><text x="484" y="489" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="489" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">mixed materials (phones) hard to</text><text x="500" y="510" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">separate</text><text x="484" y="536" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="536" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">contamination lowers quality</text><text x="484" y="562" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="562" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">can only supply what is thrown away</text>
</svg>