<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: how long will the reserve last?</text>

<rect x="30" y="110" width="560" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="530" x2="547.5" y2="530" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="530" x2="120" y2="140" stroke="#1e2a44" stroke-width="3"/><line x1="112" y1="530" x2="120" y2="530" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="536" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="112" y1="470" x2="120" y2="470" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="476" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">100</text><line x1="122" y1="470" x2="547.5" y2="470" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="410" x2="120" y2="410" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="416" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">200</text><line x1="122" y1="410" x2="547.5" y2="410" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="350" x2="120" y2="350" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="356" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">300</text><line x1="122" y1="350" x2="547.5" y2="350" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="290" x2="120" y2="290" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="296" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">400</text><line x1="122" y1="290" x2="547.5" y2="290" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="230" x2="120" y2="230" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="236" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">500</text><line x1="122" y1="230" x2="547.5" y2="230" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="170" x2="120" y2="170" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="176" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">600</text><line x1="122" y1="170" x2="547.5" y2="170" stroke="#e3e9e8" stroke-width="1.5"/><line x1="120" y1="530" x2="120" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="558" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">0</text><line x1="215" y1="530" x2="215" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="215" y="558" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">10</text><line x1="310" y1="530" x2="310" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="310" y="558" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">20</text><line x1="405" y1="530" x2="405" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="405" y="558" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">30</text><line x1="500" y1="530" x2="500" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="558" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">40</text><text x="329" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">years from now</text><text x="58" y="350" font-size="16" fill="#4a5568" text-anchor="middle" transform="rotate(-90 58 350)">reserve left (million tonnes)</text><path d="M120,170 L405,530" fill="none" stroke="#b5602e" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M120,170 L500,530" fill="none" stroke="#2e6b62" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="405" cy="530" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="500" cy="530" r="7" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="136" y="470" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">20 Mt a year: 30 years</text><rect x="364" y="324.8" width="223.2" height="21.6" rx="5" fill="#ffffff" opacity="0.92"/><text x="370" y="340" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">15 Mt a year: 40 years</text><text x="580" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented figures</text><rect x="610" y="110" width="260" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="632" y="148" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Current rate</text><text x="632" y="176" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">600 ÷ 20 = 30 years</text><text x="632" y="226" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">A quarter met by</text><text x="632" y="248" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">recycling and reduction</text><text x="632" y="276" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">20 × 0.75 = 15 Mt a year</text><text x="632" y="299" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">600 ÷ 15 = 40 years</text><text x="632" y="360" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Strategies extend the</text><text x="632" y="381" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">reserve but do not make</text><text x="632" y="402" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">it renewable.</text><text x="632" y="456" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Assumes demand stays the</text><text x="632" y="477" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">same: if it rises, the</text><text x="632" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reserve runs out sooner.</text>
</svg>