<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven strategies weighed up</text>

<text x="330" y="136" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Benefit</text><text x="670" y="136" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Limitation</text><rect x="30" y="152" width="190" height="64" rx="12" fill="#1e2a44"/><text x="125" y="190" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="middle">Reduce and reuse</text><rect x="230" y="152" width="300" height="64" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="246" y="180" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">cheapest: no new extraction or</text><text x="246" y="199" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">processing</text><rect x="540" y="152" width="330" height="64" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="556" y="190" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">depends on changing habits</text><rect x="30" y="226" width="190" height="64" rx="12" fill="#1e2a44"/><text x="125" y="264" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="middle">Recycling</text><rect x="230" y="226" width="300" height="64" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="246" y="254" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">less new ore, mining and</text><text x="246" y="273" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">landfill</text><rect x="540" y="226" width="330" height="64" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="556" y="264" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">can only supply what is thrown away</text><rect x="30" y="300" width="190" height="64" rx="12" fill="#1e2a44"/><text x="125" y="328" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="middle">Efficient</text><text x="125" y="348" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="middle">extraction</text><rect x="230" y="300" width="300" height="64" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="246" y="328" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">more from each deposit; less</text><text x="246" y="347" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">waste</text><rect x="540" y="300" width="330" height="64" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="556" y="338" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">expensive; still uses up the deposit</text><rect x="30" y="374" width="190" height="64" rx="12" fill="#1e2a44"/><text x="125" y="412" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="middle">Avoiding depletion</text><rect x="230" y="374" width="300" height="64" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="246" y="402" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">keeps the resource for future</text><text x="246" y="421" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">generations</text><rect x="540" y="374" width="330" height="64" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="556" y="412" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">less income, jobs and supply now</text><rect x="30" y="448" width="190" height="64" rx="12" fill="#1e2a44"/><text x="125" y="486" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="middle">Legislation</text><rect x="230" y="448" width="300" height="64" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="246" y="476" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">applies to everyone; fast,</text><text x="246" y="495" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">large-scale change</text><rect x="540" y="448" width="330" height="64" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="556" y="486" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">no effect unless enforced</text><rect x="30" y="522" width="190" height="64" rx="12" fill="#1e2a44"/><text x="125" y="560" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="middle">Enforcement</text><rect x="230" y="522" width="300" height="64" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="246" y="550" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">turns laws into real change;</text><text x="246" y="569" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">deters illegal mining</text><rect x="540" y="522" width="330" height="64" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="556" y="560" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">costly; remote areas hard to police</text><rect x="30" y="596" width="190" height="64" rx="12" fill="#1e2a44"/><text x="125" y="624" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="middle">Alternative</text><text x="125" y="644" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="middle">materials</text><rect x="230" y="596" width="300" height="64" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="246" y="634" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">less demand for a scarce mineral</text><rect x="540" y="596" width="330" height="64" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="556" y="634" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">alternative may be finite or harmful</text><text x="450" y="690" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">In a discuss answer, develop each point with “so” or “because”, then judge.</text>
</svg>