<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Alternative materials</text>

<text x="220" y="136" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Scarce material</text><text x="680" y="136" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Alternative</text><rect x="30" y="152" width="380" height="72" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="220" y="196" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">copper telecom cables</text><line x1="416" y1="188" x2="484" y2="188" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="490" y="152" width="380" height="72" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="680" y="196" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">fibre-optic cables (glass)</text><rect x="30" y="244" width="380" height="72" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="220" y="288" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">copper pipes</text><line x1="416" y1="280" x2="484" y2="280" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="490" y="244" width="380" height="72" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="680" y="288" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">plastic pipes</text><rect x="30" y="336" width="380" height="72" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="220" y="380" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">newly quarried rock</text><line x1="416" y1="372" x2="484" y2="372" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="490" y="336" width="380" height="72" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="680" y="380" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">recycled crushed concrete</text><rect x="30" y="440" width="410" height="170" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="474.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Benefits</text><text x="48" y="499.72499999999997" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">• less demand for a scarce mineral</text><text x="48" y="521.505" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">• may be lighter, cheaper or better</text><rect x="460" y="440" width="410" height="170" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="474.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Limitations</text><text x="478" y="499.72499999999997" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">• may itself be finite or harmful:</text><text x="478" y="521.505" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">  plastics are made from petroleum</text><text x="478" y="543.285" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">• may cost more or perform less well</text><text x="478" y="565.0649999999999" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">• switching may need new equipment</text>
</svg>