<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why rocks, ores and minerals are finite</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A finite resource is about RATES</text><text x="60" y="196" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Replaced</text><text x="60" y="218" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">by the rock cycle</text><rect x="240" y="180" width="18" height="34" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="272" y="204" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">over millions of years</text><text x="60" y="276" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Extracted</text><text x="60" y="298" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">by people</text><rect x="240" y="260" width="600" height="34" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="540" y="284" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">tonnes per day</text><text x="840" y="148" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">bar lengths illustrative</text><rect x="30" y="360" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="398" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Metals are not destroyed when used: they are spread out</text><rect x="70" y="430" width="200" height="140" rx="10" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><circle cx="110" cy="465" r="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="146" cy="465" r="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="182" cy="465" r="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="218" cy="465" r="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="110" cy="499" r="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="146" cy="499" r="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="182" cy="499" r="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="218" cy="499" r="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="110" cy="533" r="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="146" cy="533" r="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="182" cy="533" r="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="218" cy="533" r="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="170" y="598" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">concentrated ore</text><text x="170" y="620" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="middle">easier to recover</text><line x1="290" y1="500" x2="380" y2="500" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="335" y="486" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">use</text><rect x="400" y="430" width="140" height="140" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="422" cy="455" r="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="469" cy="486" r="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="516" cy="517" r="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="463" cy="458" r="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="470" y="598" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">products</text><rect x="560" y="430" width="140" height="140" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="595" cy="474" r="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="642" cy="505" r="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="589" cy="536" r="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="636" cy="477" r="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="630" y="598" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">waste</text><rect x="720" y="430" width="140" height="140" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="768" cy="493" r="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="815" cy="524" r="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="762" cy="465" r="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><circle cx="809" cy="496" r="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="790" y="598" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">landfill</text><text x="630" y="626" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="middle">much harder to recover</text><text x="450" y="690" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">That is why reuse and recycling are part of the answer.</text>
</svg>