<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The verb follows the object</text>

<rect x="30" y="110" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Past tense with the ergative marker:</text><text x="54" y="174" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the verb agrees with the object, not with you</text><text x="846" y="160" font-family="Noto Nastaliq Urdu" font-size="30" font-weight="400" fill="#8a6d0d" text-anchor="end">‏میں نے‏</text><rect x="30" y="210" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="272" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M59,272 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="282" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں نے دوست کو پیغام بھیجا‏</text><text x="96" y="278" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">I sent my friend a message.</text><text x="96" y="302" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">message is masculine</text><circle cx="66" cy="370" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M59,370 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="380" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں نے ایک تصویر پوسٹ کی‏</text><text x="96" y="376" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">I posted a photo.</text><text x="96" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">photo is feminine</text><circle cx="66" cy="468" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,462 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="478" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#b5602e" text-anchor="end">‏میں نے ویڈیو دیکھا‏</text><text x="96" y="474" font-size="17" font-weight="400" fill="#b5602e" text-anchor="start" font-style="italic">should be the feminine form</text><text x="96" y="498" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">video is usually feminine</text><rect x="30" y="560" width="840" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="54" y="604" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Right:</text><text x="846" y="606" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں نے ویڈیو دیکھی‏</text>
</svg>