<text x="54" y="138" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reading: a disadvantage usually follows a signpost</text><rect x="30" y="156" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="202" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏لیکن‏</text><text x="130" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">but</text><rect x="243" y="156" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="343" y="202" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏مگر‏</text><text x="343" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">but</text><rect x="456" y="156" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="556" y="202" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏دوسری طرف‏</text><text x="556" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">on the other hand</text><rect x="669" y="156" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="769" y="202" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏اس کے برعکس‏</text><text x="769" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">on the contrary</text><text x="54" y="292" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and a why-question wants the reason after</text><rect x="30" y="306" width="200" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="352" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏کیونکہ‏</text><text x="130" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">because</text><rect x="243" y="306" width="200" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343" y="352" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏اس لیے‏</text><text x="343" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">so, therefore</text><rect x="456" y="306" width="200" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="352" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏کی وجہ سے‏</text><text x="556" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">because of</text><text x="54" y="450" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Writing: a four-part plan</text><rect x="30" y="470" width="196" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="58" cy="498" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="504.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="128" y="540" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">How you use</text><text x="128" y="562" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">technology now</text><line x1="228" y1="524" x2="241" y2="524" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="243" y="470" width="196" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="271" cy="498" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="271" y="504.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="341" y="540" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">One</text><text x="341" y="562" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">advantage</text><line x1="441" y1="524" x2="454" y2="524" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="456" y="470" width="196" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="484" cy="498" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="484" y="504.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="554" y="540" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">One</text><text x="554" y="562" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">disadvantage</text><line x1="654" y1="524" x2="667" y2="524" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="669" y="470" width="196" height="108" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="697" cy="498" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="697" y="504.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="767" y="540" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A justified</text><text x="767" y="562" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">overall view</text><rect x="30" y="594" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="636" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">+ one past or future sentence:</text><text x="520" y="640" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#2e6b62" text-anchor="middle">‏پہلے ... تھا‏</text><text x="610" y="636" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">or</text><text x="740" y="640" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#2e6b62" text-anchor="middle">‏مستقبل میں ... ہو گا‏</text>
