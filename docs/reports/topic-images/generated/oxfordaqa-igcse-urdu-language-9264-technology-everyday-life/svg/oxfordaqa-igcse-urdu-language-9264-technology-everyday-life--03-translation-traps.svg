<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two translation traps</text>

<rect x="30" y="108" width="840" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="138" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"I use my phone every day to talk to my relatives in Pakistan."</text><text x="450" y="164" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Two traps: the possessive and the word order</text><rect x="30" y="196" width="410" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="232" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">my phone, when "I" is the subject</text><circle cx="66" cy="290" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,284 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="250" y="302" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#b5602e" text-anchor="middle">‏میرا فون‏</text><circle cx="66" cy="360" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M59,360 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="250" y="372" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="middle">‏اپنا فون‏</text><text x="330" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">reflexive</text><rect x="460" y="196" width="410" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="232" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose: oblique + for</text><text x="846" y="310" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="end">‏بات کرنے کے لیے‏</text><text x="846" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">to talk (oblique infinitive)</text><rect x="30" y="414" width="840" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="446" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Answer: verb last</text><text x="846" y="500" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں روزانہ پاکستان میں اپنے رشتہ داروں سے بات کرنے کے لیے‏</text><text x="846" y="558" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏اپنا فون استعمال کرتا ہوں۔‏</text><text x="54" y="560" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the verb comes last, not straight after the subject</text>
</svg>