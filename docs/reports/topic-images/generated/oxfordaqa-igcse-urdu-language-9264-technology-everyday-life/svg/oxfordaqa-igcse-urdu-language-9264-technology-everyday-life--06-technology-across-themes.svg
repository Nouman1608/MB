<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Technology beyond Theme 1</text>

<rect x="30" y="110" width="840" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Theme 2: charity</text><text x="52" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by means of</text><text x="380" y="154" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#2e6b62" text-anchor="middle">‏کے ذریعے‏</text><text x="846" y="212" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏سوشل میڈیا کے ذریعے ہم نے سیلاب زدگان کے لیے چندہ جمع کیا۔‏</text><text x="846" y="246" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Through social media we raised money for flood victims.</text><rect x="30" y="278" width="840" height="204" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Theme 3: study</text><text x="52" y="342" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">then-and-now contrast</text><text x="380" y="322" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#2e6b62" text-anchor="middle">‏لیکن‏</text><text x="846" y="380" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏آن لائن کلاسوں سے پڑھائی آسان ہو گئی ہے،‏</text><text x="846" y="432" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏لیکن اساتذہ سے براہِ راست سوال پوچھنا مشکل ہو گیا ہے۔‏</text><text x="846" y="466" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Online classes have made studying easier, but asking teachers directly has become harder.</text><rect x="30" y="498" width="840" height="152" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="536" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Theme 2: environment</text><text x="52" y="562" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">instead of</text><text x="380" y="542" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#2e6b62" text-anchor="middle">‏کے بجائے‏</text><text x="846" y="600" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏پرانے فون پھینکنے کے بجائے انہیں ری سائیکل کرنا چاہیے۔‏</text><text x="846" y="634" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Instead of throwing old phones away, we should recycle them.</text>
</svg>