<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 976" width="900" height="976" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="976" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a balanced view</text>

<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Task: is mobile technology good or bad for young people?</text><rect x="30" y="148" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1. Advantage frame</text><text x="846" y="232" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اس کا سب سے بڑا فائدہ یہ ہے کہ‏</text><text x="846" y="268" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">its biggest advantage is that ...</text><rect x="30" y="294" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="332" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">2. Contrast</text><text x="846" y="378" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏دوسری طرف،‏</text><text x="846" y="414" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">on the other hand, ...</text><rect x="30" y="440" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="478" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">3. Cause and effect</text><text x="846" y="524" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏جس کی وجہ سے ان کی نیند پوری نہیں ہوتی‏</text><text x="846" y="560" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">because of which they do not get enough sleep</text><rect x="30" y="586" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="624" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">4. Personal experience (past)</text><text x="846" y="670" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏پچھلے مہینے میں نے سونے سے پہلے فون بند کرنا شروع کیا‏</text><text x="846" y="706" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">last month I started switching my phone off before sleeping</text><rect x="30" y="732" width="840" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="770" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">5. Conditional opinion</text><text x="846" y="816" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرے خیال میں ٹیکنالوجی اچھی ہے، بشرطیکہ ہم اسے سمجھ داری سے استعمال کریں۔‏</text><text x="846" y="852" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">technology is good, provided that we use it sensibly</text><rect x="30" y="888" width="840" height="64" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="926" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Weak: a list of apps in the present tense, with no evaluation, does not answer "good or bad?"</text>
</svg>