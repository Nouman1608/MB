<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 653" width="900" height="653" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="653" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The research log at a glance</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Component 4: 85 marks</text><rect x="60" y="168" width="688.235294117647" height="46" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="404.1176470588235" y="198" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Research report: 75</text><rect x="748.235294117647" y="168" width="91.76470588235293" height="46" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="794.1176470588234" y="198" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">10</text><text x="840" y="240" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">research log: 10 marks (AO1, AO2)</text><rect x="30" y="282" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="328.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A separate document</text><text x="48" y="355.67" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">submitted for assessment alongside the report</text><rect x="460" y="282" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="318.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Notes or prose</text><text x="478" y="345.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">note form, or a mixture of notes and</text><text x="478" y="366.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">continuous prose</text><rect x="30" y="401" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="447.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Outside the 5000 words</text><text x="48" y="474.67" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">but not a way to extend the word limit</text><rect x="460" y="401" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="447.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Decisions, not everything</text><text x="478" y="474.67" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no need to record all actions and thinking</text><rect x="30" y="520" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="556.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Worth recording</text><text x="48" y="583.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">question wording, choice of methods,</text><text x="48" y="604.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">judgements from findings, teacher feedback</text><rect x="460" y="520" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="566.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Monitored by your teacher</text><text x="478" y="593.67" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through discussion of the log</text>
</svg>