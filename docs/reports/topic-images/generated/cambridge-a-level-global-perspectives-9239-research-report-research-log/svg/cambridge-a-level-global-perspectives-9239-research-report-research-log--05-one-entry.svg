<rect width="900" height="532" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One entry that records, reflects and plans</text>

<rect x="30" y="110" width="840" height="54" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.2"/><text x="56" y="145" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">Log entry · Stage 5: collecting and analysing evidence</text><rect x="30" y="164" width="840" height="103.32000000000001" fill="#ffffff"/><line x1="30" y1="164" x2="870" y2="164" stroke="#c9d6d4" stroke-width="1.5"/><rect x="52" y="193.66" width="150" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="127" y="221.66" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Record</text><text x="226" y="199" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Two demand forecasts disagree sharply. The higher one assumes battery</text><text x="226" y="221.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">technology stays the same; the lower one assumes a shift to batteries</text><text x="226" y="243.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">using fewer of these metals.</text><rect x="30" y="267.32" width="840" height="58.44" fill="#ffffff"/><line x1="30" y1="267.32" x2="870" y2="267.32" stroke="#c9d6d4" stroke-width="1.5"/><rect x="52" y="274.53999999999996" width="150" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="127" y="302.53999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reflect</text><text x="226" y="302.32" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">So the economic case depends on a technology assumption.</text><rect x="30" y="325.76" width="840" height="80.88" fill="#ffffff"/><line x1="30" y1="325.76" x2="870" y2="325.76" stroke="#c9d6d4" stroke-width="1.5"/><rect x="52" y="344.2" width="150" height="44" rx="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="127" y="372.2" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Plan / decide</text><text x="226" y="360.76" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Make this assumption a central point of comparison between</text><text x="226" y="383.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">perspectives, not a footnote.</text><rect x="30" y="110" width="840" height="296.64" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="428.64" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="459.78999999999996" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Record findings that surprise you or conflict with others, and your judgement about what they</text><text x="450" y="482.22999999999996" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">mean.</text>
</svg>