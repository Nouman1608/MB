<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the log supports the report</text>

<rect x="400" y="120" width="470" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="418" y="156.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Introduction</text><text x="418" y="183.17000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“how and why the question was developed”</text><path d="M312,316.5 C356,316.5 356,162 394,162" fill="none" stroke="#2e6b62" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="400" y="216" width="470" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="418" y="252.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Methods section</text><text x="418" y="279.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">choices, procedure and reasons</text><path d="M312,316.5 C356,316.5 356,258 394,258" fill="none" stroke="#2e6b62" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="400" y="312" width="470" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="418" y="348.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="418" y="375.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“how alternative perspectives have influenced their</text><text x="418" y="396.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">argument”</text><path d="M312,316.5 C356,316.5 356,364.5 394,364.5" fill="none" stroke="#2e6b62" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="400" y="429" width="470" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="418" y="465.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="418" y="492.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“reflect on their conclusions”</text><path d="M312,316.5 C356,316.5 356,471 394,471" fill="none" stroke="#2e6b62" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="30" y="120" width="280" height="393" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="170" y="254.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Research log</text><text x="170" y="283.34000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">dated entries:</text><text x="170" y="305.78000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">feedback and decisions</text><text x="170" y="328.22" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">method choices and reasons</text><text x="170" y="350.66" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">evaluated sources</text><text x="170" y="373.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">conflicting findings</text><text x="170" y="395.54" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">final reflection</text><text x="640" y="112" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Research report</text><rect x="30" y="539" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="570.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">But the log must not become a second report: it is assessed on recording, planning and</text><text x="450" y="592.59" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">reflecting, not on argument.</text>
</svg>