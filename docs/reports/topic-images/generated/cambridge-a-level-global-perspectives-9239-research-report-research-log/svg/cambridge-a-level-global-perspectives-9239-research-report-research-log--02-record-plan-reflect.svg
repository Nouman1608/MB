<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 474" width="900" height="474" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="474" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Record, reflect, plan</text>

<rect x="30" y="120" width="250" height="167" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="155" y="175.85" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Record</text><text x="155" y="204.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">what you read, found, did</text><text x="155" y="226.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">or were told, with enough</text><text x="155" y="249.17" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">detail to find it again</text><line x1="284" y1="203.5" x2="321" y2="203.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325" y="120" width="250" height="167" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="164.85" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Reflect</text><text x="450" y="193.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">what a finding or</text><text x="450" y="215.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">decision means for your</text><text x="450" y="238.17" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">question, your methods or</text><text x="450" y="260.61" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">your argument</text><line x1="579" y1="203.5" x2="616" y2="203.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620" y="120" width="250" height="167" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="745" y="187.35" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Plan</text><text x="745" y="215.79" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">what you will do next,</text><text x="745" y="238.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and why</text><rect x="30" y="317" width="410" height="129" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="353.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ A diary</text><text x="48" y="381.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Recording without reflection is a diary:</text><text x="48" y="403.93" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">dates and tasks only.</text><rect x="460" y="317" width="410" height="129" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="353.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ A research log</text><text x="478" y="381.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An entry that links all three, with</text><text x="478" y="403.93" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reflection at its heart: evidence of a</text><text x="478" y="426.37" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">researcher at work.</text>
</svg>