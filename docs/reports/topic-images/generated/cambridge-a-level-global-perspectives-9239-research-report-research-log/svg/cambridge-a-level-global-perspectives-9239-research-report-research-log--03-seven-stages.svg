<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What to log at each stage</text>

<rect x="100" y="110" width="770" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="58" cy="143" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="58" y="150.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="151" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Choosing a topic and question</text><text x="475" y="138.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">topics considered and why some were rejected;</text><text x="475" y="159.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">whether a debate exists</text><line x1="58" y1="165" x2="58" y2="197" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="186" width="770" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="58" cy="219" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="226.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="227" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Proposal and teacher discussion</text><text x="475" y="214.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the feedback in your own words, and what you</text><text x="475" y="235.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decided</text><line x1="58" y1="241" x2="58" y2="273" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="262" width="770" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="58" cy="295" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="58" y="302.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="303" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Finding and evaluating sources</text><text x="475" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each source, evaluated as you go</text><line x1="58" y1="317" x2="58" y2="349" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="338" width="770" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="58" cy="371" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="378.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="379" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Choosing and designing methods</text><text x="475" y="377" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the options, the choice and the reason</text><line x1="58" y1="393" x2="58" y2="425" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="414" width="770" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="58" cy="447" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="58" y="454.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="455" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Collecting and analysing evidence</text><text x="475" y="442.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surprising or conflicting findings, and what</text><text x="475" y="463.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they mean</text><line x1="58" y1="469" x2="58" y2="501" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="490" width="770" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="58" cy="523" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="530.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="122" y="531" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Drafting</text><text x="475" y="529" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">structural decisions and word-limit problems</text><line x1="58" y1="545" x2="58" y2="577" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="566" width="770" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="58" cy="599" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="58" y="606.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="122" y="607" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Final reflection</text><text x="475" y="594.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">how your thinking and your question changed</text><text x="475" y="615.5600000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">overall</text><text x="450" y="664" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Date every entry, write it soon after the work, keep it short.</text>
</svg>