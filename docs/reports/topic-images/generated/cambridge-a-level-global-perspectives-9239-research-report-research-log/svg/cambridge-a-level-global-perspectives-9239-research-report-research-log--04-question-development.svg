<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A question changing in the log</text>

<rect x="130" y="110" width="740" height="108" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="148" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Three topics considered</text><text x="148" y="175.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">water privatisation, school uniforms, deep-sea mining; uniforms rejected (debate</text><text x="148" y="197.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mostly local, few academic sources)</text><text x="70" y="170" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Stage 1</text><line x1="500" y1="221" x2="500" y2="245" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="130" y="248" width="740" height="108" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="148" y="285" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Draft question</text><text x="148" y="313.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Is deep-sea mining necessary for a low-carbon future?”</text><text x="148" y="335.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Concern: “necessary” may push towards one answer.</text><text x="70" y="308" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Stage 1</text><line x1="500" y1="359" x2="500" y2="383" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="130" y="386" width="740" height="108" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="148" y="434" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Teacher feedback</text><text x="148" y="462.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Could you judge “necessary” without technical expertise in metals supply? Agreed.</text><text x="70" y="446" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Stage 2</text><line x1="500" y1="497" x2="500" y2="521" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="130" y="524" width="740" height="131" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="148" y="561" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Revised question</text><text x="148" y="589.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Should countries permit deep-sea mining in international waters?”</text><text x="148" y="611.8800000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Keeps the debate (economic need against environmental risk) as a policy question</text><text x="148" y="634.32" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">judged from evidence and arguments.</text><text x="70" y="595.5" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Stage 2</text><rect x="30" y="679" width="840" height="72.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="709.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Logging the change makes it easy for the report to explain “how and why the question was developed”.</text><text x="450" y="730.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">(Model entries are invented.)</text>
</svg>