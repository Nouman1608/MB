<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 794" width="900" height="794" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="794" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing consolidation: Stalin and Castro</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Europe and the Americas: one theme per paragraph, both leaders in each</text>
<rect x="30" y="124" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Thesis</text><text x="450" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Both combined coercion and persuasion, but Stalin <tspan font-weight="700" fill="#1e2a44">captured</tspan> institutions inside an existing</text><text x="450" y="210.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">single-party state, while Castro <tspan font-weight="700" fill="#1e2a44">built</tspan> new ones on nationalism and US hostility.</text><clipPath id="tc257"><rect x="30" y="257" width="840" height="372" rx="14"/></clipPath><g clip-path="url(#tc257)"><rect x="30" y="257" width="140" height="48" fill="#b5d3cf"/><text x="44" y="284.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Theme</text><rect x="170" y="257" width="240" height="48" fill="#b5d3cf"/><text x="184" y="284.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Stalin</text><rect x="410" y="257" width="260" height="48" fill="#f2e7b8"/><text x="424" y="284.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Castro</text><rect x="670" y="257" width="200" height="48" fill="#d4b02e"/><text x="684" y="284.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><rect x="30" y="305" width="140" height="86" fill="#dce9e7"/><text x="44" y="331" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Institutions</text><rect x="170" y="305" width="240" height="86" fill="#ffffff"/><text x="184" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Party machine; rivals</text><text x="184" y="351" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">defeated 1924-29</text><rect x="410" y="305" width="260" height="86" fill="#ffffff"/><text x="424" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Agrarian Reform Law (1959);</text><text x="424" y="351" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">CDRs (1960); Communist Party</text><text x="424" y="371" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of Cuba (1965)</text><rect x="670" y="305" width="200" height="86" fill="#f2e7b8"/><text x="684" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Stalin captured</text><text x="684" y="351" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">institutions; Castro</text><text x="684" y="371" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">created them</text><line x1="30" y1="391" x2="870" y2="391" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="391" width="140" height="86" fill="#dce9e7"/><text x="44" y="417" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Force</text><rect x="170" y="391" width="240" height="86" fill="#f8faf9"/><text x="184" y="417" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Purges; Great Terror</text><text x="184" y="437" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1936-38)</text><rect x="410" y="391" width="260" height="86" fill="#f8faf9"/><text x="424" y="417" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Trials and executions of Batista</text><text x="424" y="437" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">officials; opponents imprisoned</text><text x="424" y="457" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">or emigrated</text><rect x="670" y="391" width="200" height="86" fill="#f2e7b8"/><text x="684" y="417" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Far greater scale under</text><text x="684" y="437" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Stalin</text><line x1="30" y1="477" x2="870" y2="477" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="477" width="140" height="86" fill="#dce9e7"/><text x="44" y="503" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Persuasion</text><rect x="170" y="477" width="240" height="86" fill="#ffffff"/><text x="184" y="503" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Personality cult; Five-Year</text><text x="184" y="523" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Plan propaganda</text><rect x="410" y="477" width="260" height="86" fill="#ffffff"/><text x="424" y="503" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Charisma; literacy campaign</text><text x="424" y="523" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1961); nationalism against the</text><text x="424" y="543" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">USA</text><rect x="670" y="477" width="200" height="86" fill="#f2e7b8"/><text x="684" y="503" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Castro relied more on</text><text x="684" y="523" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">popularity</text><line x1="30" y1="563" x2="870" y2="563" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="563" width="140" height="66" fill="#dce9e7"/><text x="44" y="589" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Foreign policy</text><rect x="170" y="563" width="240" height="66" fill="#f8faf9"/><text x="184" y="589" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Limited role before 1939</text><rect x="410" y="563" width="260" height="66" fill="#f8faf9"/><text x="424" y="589" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Bay of Pigs (1961) rallied support</text><rect x="670" y="563" width="200" height="66" fill="#f2e7b8"/><text x="684" y="589" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">More important for</text><text x="684" y="609" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Castro</text></g><line x1="170" y1="257" x2="170" y2="629" stroke="#c9d6d4" stroke-width="1.5"/><line x1="410" y1="257" x2="410" y2="629" stroke="#c9d6d4" stroke-width="1.5"/><line x1="670" y1="257" x2="670" y2="629" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="257" width="840" height="372" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="651" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="685.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="715.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A mix of methods in both; the balance differed: terror central for Stalin, nationalism and</text><text x="50" y="737.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">mobilization for Castro.</text>
</svg>