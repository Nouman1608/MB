<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="900" height="598" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="598" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How power was consolidated</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Leaders rarely relied on force alone</text>
<line x1="330" y1="196.5" x2="413" y2="300.45" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="355.5" x2="413" y2="348.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="504" x2="413" y2="392.7" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="265.5" x2="487" y2="321.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="424.5" x2="487" y2="368.85" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="345" r="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="339.54" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Holding</text><text x="450" y="365.16" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">power</text><rect x="30" y="124" width="300" height="145" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEGAL METHODS</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Decrees and constitutions</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reichstag fire decree; Enabling</text><text x="46" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Act; the 1936 Soviet constitution as</text><text x="46" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a façade</text><rect x="30" y="283" width="300" height="145" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="311" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FORCE</text><text x="46" y="337.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Purges and terror</text><text x="46" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Night of the Long Knives (1934);</text><text x="46" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Great Terror (1936-38); Mao's</text><text x="46" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">campaigns of the early 1950s</text><rect x="30" y="442" width="300" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="470" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHARISMA AND PROPAGANDA</text><text x="46" y="496.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Personality cults</text><text x="46" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hitler, Stalin, Mao; Castro's</text><text x="46" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">televised speeches</text><rect x="570" y="193" width="300" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="221" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OPPOSITION</text><text x="586" y="247.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Co-opt, exile, imprison</text><text x="586" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Concordat (July 1933); Trotsky</text><text x="586" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expelled (1929); camps and</text><text x="586" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">execution</text><rect x="570" y="352" width="300" height="145" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="586" y="380" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOREIGN POLICY</text><text x="586" y="406.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Success abroad</text><text x="586" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hitler's bloodless gains (1936-38);</text><text x="586" y="455.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Castro's Bay of Pigs victory (April</text><text x="586" y="476.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1961)</text>
</svg>