<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Conditions open the door; methods walk through it</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Keep the two apart in emergence questions</text>
<text x="320" y="140" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">CONDITIONS: why the society was open</text><text x="680" y="140" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">METHODS: how the leader seized it</text><text x="30" y="201" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Stalin's USSR</text><rect x="170" y="154" width="300" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="183" y="189" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Civil war legacy; single-party rule in</text><text x="183" y="209" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">place; economic backwardness</text><rect x="530" y="154" width="340" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="543" y="179" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Party machine as General Secretary (from</text><text x="543" y="199" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1922); alliances against Trotsky, then</text><text x="543" y="219" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Zinoviev and Kamenev, then Bukharin</text><line x1="476" y1="195" x2="524" y2="195" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="30" y="285" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hitler's</text><text x="30" y="305" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Germany</text><rect x="170" y="248" width="300" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="183" y="283" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Defeat, Versailles, hyperinflation, the</text><text x="183" y="303" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Depression, weak coalitions</text><rect x="530" y="248" width="340" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="543" y="273" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mass party, elections, propaganda; SA</text><text x="543" y="293" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">violence; deal with conservative elites:</text><text x="543" y="313" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">chancellor, 30 January 1933</text><line x1="476" y1="289" x2="524" y2="289" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="30" y="379" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mao's China</text><rect x="170" y="342" width="300" height="62" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="183" y="367" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Civil war, Japanese invasion,</text><text x="183" y="387" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Guomindang corruption and inflation</text><rect x="530" y="342" width="340" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="543" y="367" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Peasant mobilization, land reform, the PLA;</text><text x="543" y="387" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">civil war victory; PRC, 1 October 1949</text><line x1="476" y1="373" x2="524" y2="373" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="30" y="463" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Castro's Cuba</text><rect x="170" y="416" width="300" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="183" y="451" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Batista's corrupt dictatorship, US</text><text x="183" y="471" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">economic dominance, rural poverty</text><rect x="530" y="416" width="340" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="543" y="441" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Guerrilla war from the Sierra Maestra after</text><text x="543" y="461" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the Granma landing (1956); Batista fled, 1</text><text x="543" y="481" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">January 1959</text><line x1="476" y1="457" x2="524" y2="457" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>