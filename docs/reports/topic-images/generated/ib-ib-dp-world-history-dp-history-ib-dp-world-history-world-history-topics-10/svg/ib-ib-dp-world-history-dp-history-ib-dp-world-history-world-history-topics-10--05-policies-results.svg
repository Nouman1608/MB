<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Policies: results and limits</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Set the aim, then measure the result</text>
<clipPath id="tc116"><rect x="30" y="116" width="840" height="464" rx="14"/></clipPath><g clip-path="url(#tc116)"><rect x="30" y="116" width="240" height="48" fill="#b5d3cf"/><text x="44" y="143.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Policy</text><rect x="270" y="116" width="300" height="48" fill="#b5d3cf"/><text x="284" y="143.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it did</text><rect x="570" y="116" width="300" height="48" fill="#f2e7b8"/><text x="584" y="143.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cost or limit</text><rect x="30" y="164" width="240" height="86" fill="#dce9e7"/><text x="44" y="190" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Stalin's first Five-Year Plan</text><text x="44" y="210" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">and collectivization (from</text><text x="44" y="230" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">1928)</text><rect x="270" y="164" width="300" height="86" fill="#ffffff"/><text x="284" y="190" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Rapid heavy-industrial growth</text><rect x="570" y="164" width="300" height="86" fill="#ffffff"/><text x="584" y="190" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Famine, 1932-33</text><line x1="30" y1="250" x2="870" y2="250" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="250" width="240" height="66" fill="#dce9e7"/><text x="44" y="276" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Mao's Great Leap Forward</text><text x="44" y="296" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">(1958-62)</text><rect x="270" y="250" width="300" height="66" fill="#f8faf9"/><rect x="570" y="250" width="300" height="66" fill="#f8faf9"/><text x="584" y="276" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Catastrophic famine</text><line x1="30" y1="316" x2="870" y2="316" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="316" width="240" height="66" fill="#dce9e7"/><text x="44" y="342" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Nazi rearmament and public</text><text x="44" y="362" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">works</text><rect x="270" y="316" width="300" height="66" fill="#ffffff"/><text x="284" y="342" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Unemployment reduced</text><rect x="570" y="316" width="300" height="66" fill="#ffffff"/><text x="584" y="342" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Economy strained by 1939</text><line x1="30" y1="382" x2="870" y2="382" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="382" width="240" height="66" fill="#dce9e7"/><text x="44" y="408" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Nazi policy on women:</text><text x="44" y="428" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">motherhood</text><rect x="270" y="382" width="300" height="66" fill="#f8faf9"/><text x="284" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Marriage loans (1933); Mother's Cross</text><text x="284" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(late 1938)</text><rect x="570" y="382" width="300" height="66" fill="#f8faf9"/><text x="584" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Women's employment rose again with</text><text x="584" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rearmament</text><line x1="30" y1="448" x2="870" y2="448" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="448" width="240" height="66" fill="#dce9e7"/><text x="44" y="474" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Mao's Marriage Law (1950)</text><rect x="270" y="448" width="300" height="66" fill="#ffffff"/><text x="284" y="474" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Arranged marriages banned; divorce</text><text x="284" y="494" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">allowed</text><rect x="570" y="448" width="300" height="66" fill="#ffffff"/><line x1="30" y1="514" x2="870" y2="514" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="514" width="240" height="66" fill="#dce9e7"/><text x="44" y="540" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Castro: Federation of Cuban</text><text x="44" y="560" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Women (1960)</text><rect x="270" y="514" width="300" height="66" fill="#f8faf9"/><text x="284" y="540" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Gains in education and health</text><rect x="570" y="514" width="300" height="66" fill="#f8faf9"/><text x="584" y="540" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Traditional roles in the home persisted</text></g><line x1="270" y1="116" x2="270" y2="580" stroke="#c9d6d4" stroke-width="1.5"/><line x1="570" y1="116" x2="570" y2="580" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="116" width="840" height="464" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
