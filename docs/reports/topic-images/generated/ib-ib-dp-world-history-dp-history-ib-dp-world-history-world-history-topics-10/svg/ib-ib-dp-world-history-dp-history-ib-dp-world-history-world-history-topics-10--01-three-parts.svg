<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 699" width="900" height="699" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="699" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Authoritarian states: three parts</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Emergence, consolidation, then policies and how far control was achieved</text>
<rect x="30" y="124" width="840" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PART 1</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Emergence</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Conditions:</tspan> economic factors, social division, war, weak political systems. <tspan font-weight="700" fill="#1e2a44">Methods:</tspan> persuasion and</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">coercion, leaders, ideology, force, propaganda</text><line x1="450" y1="263" x2="450" y2="289" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="294" width="840" height="113" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="326" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PART 2</text><text x="50" y="353.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Consolidation and maintenance</text><text x="50" y="382.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Legal methods, force, charisma, propaganda, treatment of opposition, foreign policy success or failure</text><line x1="450" y1="412" x2="450" y2="438" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="443" width="840" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="475" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PART 3</text><text x="50" y="502.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Aims and results of policies</text><text x="50" y="531.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Economic, political, cultural and social policies; women and minorities</text><rect x="30" y="578" width="840" height="89" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="612.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The question examiners like</text><text x="450" y="642.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">To what extent was authoritarian control <tspan font-weight="700" fill="#1e2a44">really</tspan> achieved, not only how leaders tried?</text>
</svg>