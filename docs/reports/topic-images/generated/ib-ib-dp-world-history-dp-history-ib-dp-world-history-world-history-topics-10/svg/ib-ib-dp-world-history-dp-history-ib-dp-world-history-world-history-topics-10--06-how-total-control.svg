<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Use the debate to evaluate, not to label</text>
<text x="40" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Control from above</text><text x="860" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">Limits from below</text><defs><linearGradient id="sg124" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="169" width="780" height="26" rx="13" fill="url(#sg124)" stroke="#1e2a44" stroke-width="2.5"/><path d="M122.4,195 L122.4,218 L205,232 L205,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="122.4" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M777.6,195 L777.6,218 L695,232 L695,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="777.6" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="252" width="350" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="205" y="290.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Terror and ideology</text><text x="205" y="319.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">What set these states apart</text><rect x="520" y="252" width="350" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="695" y="280.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ordinary people's role</text><text x="695" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Co-operation, denunciation or</text><text x="695" y="329.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">indifference; the limits of the state's reach</text><text x="30" y="384" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">EVIDENCE OF LIMITS TO LOOK FOR</text><rect x="140.279" y="400" width="111.516" height="31" rx="15.5" fill="#