<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Charge flows round; energy is transferred</text>

<rect x="30" y="110" width="600" height="415" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><polyline points="120,170 560,170 560,420 120,420 120,170" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="332" y="394" width="16" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><line x1="333" y1="396" x2="333" y2="444" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="347" y1="408" x2="347" y2="432" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><circle cx="340" cy="170" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="327.3" y1="157.3" x2="352.7" y2="182.7" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="327.3" y1="182.7" x2="352.7" y2="157.3" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="362.17310878027087" y1="179.18440237676216" x2="369.56414504036115" y2="182.24586983568287" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="349.18440237676214" y1="192.17310878027087" x2="352.24586983568287" y2="199.56414504036118" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="330.81559762323786" y1="192.17310878027087" x2="327.75413016431713" y2="199.56414504036118" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="317.82689121972913" y1="179.18440237676216" x2="310.43585495963885" y2="182.24586983568287" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="317.82689121972913" y1="160.81559762323784" x2="310.43585495963885" y2="157.75413016431713" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="330.8155976232378" y1="147.82689121972913" x2="327.75413016431713" y2="140.43585495963885" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="349.18440237676214" y1="147.82689121972913" x2="352.24586983568287" y2="140.43585495963882" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="362.17310878027087" y1="160.81559762323784" x2="369.56414504036115" y2="157.7541301643171" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><text x="323" y="388" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="358" y="388" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">−</text><text x="340" y="462" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">6.0 V battery</text><line x1="120" y1="310" x2="120" y2="288" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="440" y1="170" x2="462" y2="170" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="560" y1="290" x2="560" y2="312" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="230" y1="420" x2="208" y2="420" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="150" y1="290" x2="150" y2="312" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="460" y1="200" x2="438" y2="200" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="530" y1="310" x2="530" y2="288" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="210" y1="390" x2="232" y2="390" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="378" y="392" width="112" height="54" rx="26" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="434" y="414" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1 C</text><text x="434" y="434" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">gains 6.0 J</text><text x="340" y="130" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="140" y="140" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">each coulomb transfers</text><text x="140" y="158" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">6.0 J in the lamp</text><line x1="55" y1="482" x2="85" y2="482" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="95" y="487" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">conventional current: + to −</text><line x1="55" y1="505" x2="85" y2="505" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="95" y="510" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">electron flow: − to +</text><rect x="650" y="110" width="220" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="672" y="147.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Current</text><text x="672" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rate of flow of</text><text x="672" y="193.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">charge: Q = I × t</text><rect x="650" y="245" width="220" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="672" y="282.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Voltage</text><text x="672" y="307" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">energy transferred</text><text x="672" y="328.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">per unit charge</text><text x="672" y="349.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(J/C)</text><rect x="650" y="380" width="220" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="672" y="417.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Energy</text><text x="672" y="442" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">E = Q × V. Charge is</text><text x="672" y="463.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not used up; energy</text><text x="672" y="484.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is transferred.</text>
