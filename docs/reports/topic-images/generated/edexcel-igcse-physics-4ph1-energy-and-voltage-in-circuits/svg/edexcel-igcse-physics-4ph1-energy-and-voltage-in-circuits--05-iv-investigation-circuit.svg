<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Investigating an I–V characteristic</text>

<rect x="30" y="110" width="840" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><polyline points="120,180 620,180 620,380 120,380 120,180" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="344" y="354" width="52" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><line x1="349" y1="356" x2="349" y2="404" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="363" y1="368" x2="363" y2="392" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><line x1="377" y1="356" x2="377" y2="404" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="391" y1="368" x2="391" y2="392" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><circle cx="120" cy="280" r="19" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="120" y="287" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="220" y="168" width="60" height="24" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><line x1="224" y1="200" x2="278" y2="158" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="440" y="158" width="80" height="44" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="480" y="186" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">test</text><polyline points="440,180 420,180 420,270 455,270" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><polyline points="505,270 540,270 540,180 520,180" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="420" cy="180" r="5" fill="#1e2a44"/><circle cx="540" cy="180" r="5" fill="#1e2a44"/><circle cx="480" cy="270" r="19" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="480" y="277" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">V</text><text x="370" y="430" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">supply</text><text x="88" y="285" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">ammeter</text><text x="250" y="146" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">variable resistor</text><text x="480" y="148" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">component</text><text x="480" y="315" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">voltmeter across it</text><text x="660" y="190" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1  Vary the resistor in steps:</text><text x="674" y="214" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">at least six pairs of V, I</text><text x="660" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">2  Reverse the component;</text><text x="674" y="262" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">repeat for negative values</text><text x="660" y="286" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">3  Plot I (y) against V (x)</text><text x="660" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">4  Switch off between</text><text x="674" y="334" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">readings (not for the lamp)</text><rect x="50" y="450" width="800" height="62" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="488" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Ammeter in series with the component; voltmeter in parallel across it.</text>
</svg>