<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Current at junctions, voltage in loops</text>

<rect x="30" y="110" width="290" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="175" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">At a junction</text><line x1="60" y1="280" x2="170" y2="280" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><polyline points="170,280 270,200" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round"/><polyline points="170,280 270,360" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round"/><circle cx="170" cy="280" r="7" fill="#1e2a44"/><line x1="75" y1="260" x2="135" y2="260" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="100" y="248" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">0.80 A</text><line x1="205" y1="234" x2="245" y2="203" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="255" y="180" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">0.30 A</text><line x1="205" y1="326" x2="245" y2="357" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="250" y="395" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">0.50 A</text><text x="175" y="425" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">in = out: 0.80 = 0.30 + 0.50</text><rect x="335" y="110" width="260" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="465" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Series</text><polyline points="370,200 560,200 560,340 370,340 370,200" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="390" y="188" width="60" height="24" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><rect x="480" y="188" width="60" height="24" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><rect x="457" y="314" width="16" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><line x1="458" y1="316" x2="458" y2="364" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="472" y1="328" x2="472" y2="352" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><text x="420" y="180" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">V₁</text><text x="510" y="180" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">V₂</text><text x="465" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">V supply</text><text x="465" y="410" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">V supply = V₁ + V₂</text><text x="465" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">voltage is shared</text><rect x="610" y="110" width="260" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Parallel</text><polyline points="650,340 650,190 830,190 830,340 650,340" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><polyline points="650,260 830,260" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="650" cy="260" r="5" fill="#1e2a44"/><circle cx="830" cy="260" r="5" fill="#1e2a44"/><rect x="710" y="178" width="60" height="24" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><rect x="710" y="248" width="60" height="24" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><rect x="732" y="314" width="16" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><line x1="733" y1="316" x2="733" y2="364" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="747" y1="328" x2="747" y2="352" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><text x="740" y="172" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">V</text><text x="740" y="242" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">V</text><text x="740" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">V supply</text><text x="740" y="410" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">each branch = V supply</text><text x="740" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">same voltage</text><rect x="30" y="455" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="497" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Charge cannot build up or vanish, and each coulomb passes through every series component once.</text>
</svg>