<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why house lights are in parallel</text>

<rect x="30" y="110" width="410" height="350" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="146" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Series: one lamp fails</text><polyline points="80,200 390,200 390,330 80,330 80,200" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="150" cy="200" r="18" fill="#e3e6e6" stroke="#1e2a44" stroke-width="3"/><line x1="137.3" y1="187.3" x2="162.7" y2="212.7" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="137.3" y1="212.7" x2="162.7" y2="187.3" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="222" y="186" width="26" height="28" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="235" cy="200" r="18" fill="#e3e6e6" stroke="#1e2a44" stroke-width="3"/><path d="M224,192 l8,6 l-4,4 l10,6" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="320" cy="200" r="18" fill="#e3e6e6" stroke="#1e2a44" stroke-width="3"/><line x1="307.3" y1="187.3" x2="332.7" y2="212.7" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="307.3" y1="212.7" x2="332.7" y2="187.3" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="227" y="304" width="16" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><line x1="228" y1="306" x2="228" y2="354" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="242" y1="318" x2="242" y2="342" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><text x="235" y="240" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">broken</text><text x="55" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One path, so the circuit is broken: all</text><text x="55" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the lamps go out. One switch controls</text><text x="55" y="422" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">them all.</text><rect x="470" y="110" width="400" height="350" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="670" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Parallel: one lamp fails</text><polyline points="510,180 510,330 830,330" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="662" y="304" width="16" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><line x1="663" y1="306" x2="663" y2="354" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="677" y1="318" x2="677" y2="342" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><polyline points="510,180 570,180" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><polyline points="510,180 670,180" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><polyline points="510,180 770,180" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><polyline points="510,180 790,180" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="580" cy="180" r="5" fill="#1e2a44"/><polyline points="580,180 580,300 830,300" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><g transform="rotate(90 580 212)"><rect x="556" y="204" width="48" height="16" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="560" cy="212" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="600" cy="212" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><line x1="560" y1="212" x2="598" y2="192" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(90 580 262)"><circle cx="580" cy="262" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="567.3" y1="249.3" x2="592.7" y2="274.7" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="567.3" y1="274.7" x2="592.7" y2="249.3" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/></g><line x1="602.1731087802709" y1="271.18440237676214" x2="609.5641450403612" y2="274.24586983568287" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="589.1844023767621" y1="284.17310878027087" x2="592.2458698356829" y2="291.56414504036115" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="570.8155976232379" y1="284.17310878027087" x2="567.7541301643171" y2="291.56414504036115" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="557.8268912197291" y1="271.18440237676214" x2="550.4358549596388" y2="274.24586983568287" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="557.8268912197291" y1="252.81559762323784" x2="550.4358549596388" y2="249.75413016431713" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="570.8155976232379" y1="239.82689121972913" x2="567.7541301643171" y2="232.43585495963885" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="589.1844023767621" y1="239.82689121972913" x2="592.2458698356829" y2="232.43585495963882" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="602.1731087802709" y1="252.81559762323784" x2="609.5641450403612" y2="249.7541301643171" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><circle cx="685" cy="180" r="5" fill="#1e2a44"/><polyline points="685,180 685,300 830,300" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><g transform="rotate(90 685 212)"><rect x="661" y="204" width="48" height="16" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="665" cy="212" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="705" cy="212" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><line x1="665" y1="212" x2="703" y2="192" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/></g><circle cx="685" cy="262" r="18" fill="#e3e6e6" stroke="#1e2a44" stroke-width="3"/><path d="M674,254 l8,6 l-4,4 l10,6" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="790" cy="180" r="5" fill="#1e2a44"/><polyline points="790,180 790,300 830,300" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><g transform="rotate(90 790 212)"><rect x="766" y="204" width="48" height="16" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="770" cy="212" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="810" cy="212" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><line x1="770" y1="212" x2="808" y2="192" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(90 790 262)"><circle cx="790" cy="262" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="777.3" y1="249.3" x2="802.7" y2="274.7" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="777.3" y1="274.7" x2="802.7" y2="249.3" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/></g><line x1="812.1731087802709" y1="271.18440237676214" x2="819.5641450403612" y2="274.24586983568287" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="799.1844023767621" y1="284.17310878027087" x2="802.2458698356829" y2="291.56414504036115" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="780.8155976232379" y1="284.17310878027087" x2="777.7541301643171" y2="291.56414504036115" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="767.8268912197291" y1="271.18440237676214" x2="760.4358549596388" y2="274.24586983568287" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="767.8268912197291" y1="252.81559762323784" x2="760.4358549596388" y2="249.75413016431713" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="780.8155976232379" y1="239.82689121972913" x2="777.7541301643171" y2="232.43585495963885" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="799.1844023767621" y1="239.82689121972913" x2="802.2458698356829" y2="232.43585495963882" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="812.1731087802709" y1="252.81559762323784" x2="819.5641450403612" y2="249.7541301643171" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><polyline points="830,300 830,330" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="495" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Each lamp has the full voltage and its</text><text x="495" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">own switch; the others keep working.</text><rect x="30" y="475" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="505" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Domestic lighting is wired in parallel. Series suits a switch or a fuse,</text><text x="450" y="528" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">which must carry the same current as the device it controls.</text>
</svg>