<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: two resistors in series</text>

<rect x="30" y="110" width="360" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><polyline points="80,190 340,190 340,360 80,360 80,190" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="130" y="178" width="60" height="24" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><rect x="240" y="178" width="60" height="24" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><rect x="184" y="334" width="52" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><line x1="189" y1="336" x2="189" y2="384" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="203" y1="348" x2="203" y2="372" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><line x1="217" y1="336" x2="217" y2="384" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="231" y1="348" x2="231" y2="372" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><text x="160" y="166" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">120 Ω</text><text x="270" y="166" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">60 Ω</text><text x="160" y="230" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">6.0 V</text><text x="270" y="230" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">3.0 V</text><text x="210" y="405" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">9.0 V</text><line x1="340" y1="265" x2="340" y2="287" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="352" y="300" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="210" y="290" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">0.050 A everywhere</text><rect x="410" y="110" width="460" height="313.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="434" y="150.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">R = 120 + 60 = 180 Ω</text><text x="434" y="190.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">I = V / R = 9.0 / 180 = 0.050 A</text><text x="434" y="230.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">V(120 Ω) = 0.050 × 120 = 6.0 V</text><text x="434" y="270.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">V(60 Ω) = 0.050 × 60 = 3.0 V</text><text x="434" y="310.2" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">check: 6.0 + 3.0 = 9.0 V</text><text x="434" y="350.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Q in 2.0 min = 0.050 × 120 = 6.0 C</text><text x="434" y="390.2" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">E = Q × V = 6.0 × 9.0 = 54 J</text><text x="450" y="475" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Same current through both; the larger resistor takes the larger share of the voltage.</text>
</svg>