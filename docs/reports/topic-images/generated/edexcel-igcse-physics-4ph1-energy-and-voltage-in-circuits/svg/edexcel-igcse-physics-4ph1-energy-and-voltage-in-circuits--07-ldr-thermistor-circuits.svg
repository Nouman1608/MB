<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sensors in series with a fixed resistor</text>

<rect x="30" y="110" width="410" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">LDR</text><polyline points="70,200 400,200 400,330 70,330 70,200" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="160" cy="200" r="30" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="130" y="188" width="60" height="24" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><line x1="120" y1="158" x2="142" y2="178" stroke="#1e2a44" stroke-width="2.2" marker-end="url(#ah)"/><line x1="138" y1="152" x2="160" y2="172" stroke="#1e2a44" stroke-width="2.2" marker-end="url(#ah)"/><rect x="280" y="188" width="60" height="24" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><circle cx="400" cy="265" r="19" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="400" y="272" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="209" y="304" width="52" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><line x1="214" y1="306" x2="214" y2="354" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="228" y1="318" x2="228" y2="342" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><line x1="242" y1="306" x2="242" y2="354" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="256" y1="318" x2="256" y2="342" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><text x="310" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fixed</text><text x="55" y="390" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Brighter light:</text><text x="55" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→ sensor resistance falls</text><text x="55" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→ current rises</text><text x="55" y="464" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→ V across fixed resistor rises</text><text x="55" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→ V across sensor falls</text><rect x="460" y="110" width="410" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Thermistor</text><polyline points="500,200 830,200 830,330 500,330 500,200" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="560" y="188" width="60" height="24" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><path d="M560,222 L612,178 L626,178" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="710" y="188" width="60" height="24" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><circle cx="830" cy="265" r="19" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="830" y="272" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="639" y="304" width="52" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><line x1="644" y1="306" x2="644" y2="354" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="658" y1="318" x2="658" y2="342" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><line x1="672" y1="306" x2="672" y2="354" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="686" y1="318" x2="686" y2="342" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><text x="740" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fixed</text><text x="485" y="390" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Higher temperature:</text><text x="485" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→ sensor resistance falls</text><text x="485" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→ current rises</text><text x="485" y="464" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→ V across fixed resistor rises</text><text x="485" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→ V across sensor falls</text><rect x="30" y="525" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="557" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Used in circuits that respond to light (outdoor lamps)</text><text x="450" y="580" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">or to temperature (fire alarms, thermostats).</text>
</svg>