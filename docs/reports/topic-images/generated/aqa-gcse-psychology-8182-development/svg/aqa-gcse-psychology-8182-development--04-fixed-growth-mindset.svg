<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dweck's Mindset Theory</text>

<rect x="30" y="100" width="411" height="163" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FIXED MINDSET</text><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ability is set and cannot change</text><text x="50" y="189.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Avoids challenge</text><text x="50" y="216.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="216.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Gives up after failure</text><rect x="459" y="100" width="411" height="163" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GROWTH MINDSET</text><text x="479" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ability can be developed</text><text x="479" y="189.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">through effort, good strategies and help</text><text x="495.15" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">from others</text><text x="479" y="238.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="238.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sees mistakes as part of learning</text><rect x="30" y="285" width="411" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="317" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PRAISING ABILITY</text><text x="50" y="343.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"You're so clever"</text><text x="50" y="373.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">can encourage a fixed mindset</text><rect x="459" y="285" width="411" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="317" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRAISING EFFORT AND STRATEGY</text><text x="479" y="343.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"You kept trying different methods"</text><text x="479" y="373.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">encourages a growth mindset</text><rect x="30" y="420" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="454.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Self-efficacy</text><text x="50" y="484.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Belief in your ability to succeed at a particular task: pupils who believe effort will pay off are more</text><text x="50" y="506.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">likely to keep going.</text><rect x="30" y="553" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="595.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTH</text><text x="50" y="627.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Clear practical uses in schools; simple changes</text><text x="50" y="648.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for teachers to try.</text><rect x="457" y="553" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="585" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESS</text><text x="477" y="616.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Later research found smaller effects on grades;</text><text x="477" y="637.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mindset cannot overcome poor teaching or lack</text><text x="477" y="658.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of resources.</text>
</svg>