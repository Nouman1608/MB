<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hughes: the 'policeman doll' study</text>

<rect x="90" y="135" width="280" height="280" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="90" y="135" width="140" height="280" fill="#b5602e" fill-opacity="0.13"/><rect x="90" y="275" width="280" height="140" fill="#b5602e" fill-opacity="0.13"/><rect x="230" y="135" width="140" height="140" fill="#d4b02e" fill-opacity="0.55"/><line x1="90" y1="275" x2="370" y2="275" stroke="#1e2a44" stroke-width="9"/><line x1="230" y1="135" x2="230" y2="415" stroke="#1e2a44" stroke-width="9"/><circle cx="50" cy="249" r="10" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2.5"/><rect x="39" y="261" width="22" height="26" rx="8" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="319" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="middle">police</text><circle cx="210" cy="435" r="10" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2.5"/><rect x="199" y="447" width="22" height="26" rx="8" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2.5"/><text x="256" y="459" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">police</text><circle cx="300" cy="189" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="289" y="201" width="22" height="26" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="300" y="251" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">boy doll</text><text x="230" y="106" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">View from above: two walls make four sections</text><rect x="460" y="110" width="410" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="136" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROCEDURE</text><text x="474" y="167.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">After practising with one policeman, young</text><text x="474" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children hid a boy doll from two policemen placed</text><text x="474" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so only one section was hidden from both.</text><rect x="460" y="238" width="410" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="264" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FINDINGS</text><text x="474" y="295.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most children hid the boy correctly.</text><rect x="460" y="324" width="410" height="118" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="350" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUSION</text><text x="474" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">They can take another's point of view much</text><text x="474" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">earlier than Piaget's mountain task suggested:</text><text x="474" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hiding made human sense.</text><rect x="30" y="492" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="534.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTH</text><text x="50" y="566.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The task was meaningful to children, which may</text><text x="50" y="587.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">give a truer picture of their ability.</text><rect x="457" y="492" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="524" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESS</text><text x="477" y="555.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A hiding game may be easier than seeing exactly</text><text x="477" y="576.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what another person sees: the tasks may not</text><text x="477" y="597.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">measure the same thing.</text>
</svg>