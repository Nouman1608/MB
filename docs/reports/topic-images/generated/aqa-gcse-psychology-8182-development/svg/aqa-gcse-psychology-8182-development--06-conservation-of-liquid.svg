<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 693" width="900" height="693" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="693" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ava and the juice</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Applying Piaget: conservation of liquid</text>
<rect x="110" y="288" width="150" height="66" fill="#d4b02e" fill-opacity="0.85"/><path d="M110,244 L110,354 L260,354 L260,244" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round"/><rect x="450" y="197.6" width="64" height="156.4" fill="#d4b02e" fill-opacity="0.85"/><path d="M450,124 L450,354 L514,354 L514,124" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round"/><line x1="290" y1="274" x2="420" y2="274" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="355" y="260" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">poured</text><text x="185" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">short, wide glass</text><text x="482" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">tall, thin glass</text><rect x="580" y="154" width="290" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="600" y="188.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"There is more juice now!"</text><text x="600" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ava, aged 5</text><path d="M590,232 L550,272 L620,242" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="30" y="416" width="840" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="444.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ava is in the pre-operational stage (2–7)</text><text x="44" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">[1]</text><rect x="30" y="501" width="840" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="529.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">She cannot conserve</text><text x="44" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">She does not understand that quantity stays the same when appearance changes. [1]</text><rect x="30" y="586" width="840" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="614.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">She focuses on the height and ignores the width</text><text x="44" y="642.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">so she believes there is more. [1]</text>
</svg>