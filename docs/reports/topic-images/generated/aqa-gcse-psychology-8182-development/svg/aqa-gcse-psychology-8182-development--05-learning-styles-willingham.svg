<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="440" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Learning styles and Willingham's criticism</text>

<rect x="30" y="100" width="393" height="206" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEARNING STYLES CLAIM</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Match teaching to the learner's</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">preferred style</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Verbalisers</tspan> prefer words, spoken or written</text><text x="50" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Visualisers</tspan> prefer pictures, diagrams and</text><text x="65.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">charts</text><line x1="429" y1="203" x2="471" y2="203" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="477" y="100" width="393" height="206" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="497" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WILLINGHAM'S CRITICISM</text><text x="497" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Match the method to the content</text><text x="497" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="512.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Little evidence that matching a preferred</text><text x="512.2" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">style improves learning</text><text x="497" y="234.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="512.2" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A map is best learned visually by everyone</text><text x="497" y="260.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="512.2" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Much of what we remember is stored as</text><text x="512.2" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">meaning</tspan></text><rect x="30" y="328" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="361.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">So teaching should help pupils <tspan font-weight="700" fill="#1e2a44">think</tspan> <tspan font-weight="700" fill="#1e2a44">about</tspan> <tspan font-weight="700" fill="#1e2a44">what</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">material</tspan> <tspan font-weight="700" fill="#1e2a44">means</tspan>. People may have</text><text x="450" y="383.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">preferences, but they matter less than the content.</text>
</svg>