<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="496" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Assimilation and accommodation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How a child's schemas change</text>
<rect x="300" y="124" width="300" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">New information</text><text x="450" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">meets an existing schema</text><path d="M400,217 C400,253 200,243 200,277" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M500,217 C500,253 700,243 700,277" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="283" width="320" height="137" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="190" y="326" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">IT FITS</text><text x="190" y="354.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Assimilate</text><text x="190" y="384.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Add it to the existing schema</text><rect x="550" y="283" width="320" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="710" y="315" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">IT DOES NOT FIT</text><text x="710" y="343.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Accommodate</text><text x="710" y="373.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Uncertainty, so change the</text><text x="710" y="395.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">schema or create a new one</text><text x="450" y="455.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Piaget saw children as <tspan font-weight="700">active</tspan> <tspan font-weight="700">learners</tspan> who build schemas: mental frameworks.</text>
</svg>