<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 824" width="900" height="824" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="824" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The brain develops from the bottom up</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Basic survival functions first, complex thinking last</text>
<line x1="60" y1="154" x2="60" y2="542" stroke="#c9d6d4" stroke-width="4"/><rect x="110" y="124" width="300" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="126" y="156.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cortex</text><text x="126" y="185.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Thinking, language, memory,</text><text x="126" y="206.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">planning</text><rect x="450" y="124" width="420" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="466" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MAKES POSSIBLE</text><text x="466" y="184.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cognition; front parts keep maturing into</text><text x="466" y="206.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">adolescence</text><line x1="414" y1="175.5" x2="444" y2="175.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="60" cy="175.5" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="183.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="110" y="239" width="300" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="126" y="270.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cerebellum</text><text x="126" y="299.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Co-ordinates movement, balance,</text><text x="126" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">posture</text><rect x="450" y="239" width="420" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="466" y="277.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MAKES POSSIBLE</text><text x="466" y="310.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Movement: sitting, crawling, walking</text><line x1="414" y1="290" x2="444" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="60" cy="290" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="297.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="110" y="353" width="300" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="126" y="384.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Thalamus</text><text x="126" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Relays information from the senses</text><text x="126" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to the cortex</text><rect x="450" y="353" width="420" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="466" y="391.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MAKES POSSIBLE</text><text x="466" y="424.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sensory processing</text><line x1="414" y1="404" x2="444" y2="404" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="60" cy="404" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="411.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="110" y="467" width="300" height="103" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="126" y="499.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Brain stem</text><text x="126" y="528.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Controls automatic body</text><text x="126" y="549.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">processes</text><rect x="450" y="467" width="420" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="466" y="495" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MAKES POSSIBLE</text><text x="466" y="527.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Autonomic functions: breathing, heart rate,</text><text x="466" y="549.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">swallowing, needed from birth</text><line x1="414" y1="518.5" x2="444" y2="518.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="60" cy="518.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="526.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="30" y="592" width="390" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="634.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATURE</text><text x="50" y="661.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Genes set the order</text><text x="50" y="690.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">which is why the sequence is broadly the</text><text x="50" y="711.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">same in all children</text><rect x="480" y="592" width="390" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="500" y="624" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NURTURE</text><text x="500" y="650.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Affects how well it develops</text><text x="500" y="679.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">diet and health in pregnancy, avoiding</text><text x="500" y="700.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">alcohol; stimulation, play and interaction after</text><text x="500" y="721.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">birth</text><text x="450" y="782.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Best answer: brain development is an <tspan font-weight="700">interaction</tspan> of nature and nurture.</text>
</svg>