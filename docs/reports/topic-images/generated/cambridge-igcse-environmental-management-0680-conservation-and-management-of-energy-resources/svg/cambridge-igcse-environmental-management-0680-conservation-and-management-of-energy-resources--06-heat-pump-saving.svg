<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same heat, a third of the electricity</text>

<rect x="150" y="140" width="420" height="360" fill="#ffffff"/><line x1="150" y1="500" x2="570" y2="500" stroke="#c9d6d4" stroke-width="1.5"/><line x1="143" y1="500" x2="150" y2="500" stroke="#1e2a44" stroke-width="2"/><text x="138" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="150" y1="410" x2="570" y2="410" stroke="#c9d6d4" stroke-width="1.5"/><line x1="143" y1="410" x2="150" y2="410" stroke="#1e2a44" stroke-width="2"/><text x="138" y="416" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">3,000</text><line x1="150" y1="320" x2="570" y2="320" stroke="#c9d6d4" stroke-width="1.5"/><line x1="143" y1="320" x2="150" y2="320" stroke="#1e2a44" stroke-width="2"/><text x="138" y="326" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">6,000</text><line x1="150" y1="230" x2="570" y2="230" stroke="#c9d6d4" stroke-width="1.5"/><line x1="143" y1="230" x2="150" y2="230" stroke="#1e2a44" stroke-width="2"/><text x="138" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">9,000</text><line x1="150" y1="140" x2="570" y2="140" stroke="#c9d6d4" stroke-width="1.5"/><line x1="143" y1="140" x2="150" y2="140" stroke="#1e2a44" stroke-width="2"/><text x="138" y="146" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">12,000</text><path d="M150,140 L150,500 L570,500" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="0" y="0" transform="translate(88,320) rotate(-90)" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Electricity used (kWh per year)</text><rect x="200" y="140" width="130" height="360" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="390" y="380" width="130" height="120" rx="0" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="265" y="170" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">12,000</text><text x="455" y="368" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">4,000</text><text x="265" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Electric heater</text><text x="455" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Heat pump</text><line x1="330" y1="140" x2="545" y2="140" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="545" y1="140" x2="545" y2="376" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="555" y="256" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">8,000 saved</text><text x="555" y="278" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">= 66.7%</text><rect x="690" y="140" width="180" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="780" y="176" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Heat pump</text><rect x="745" y="200" width="70" height="40" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="226" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1 kWh</text><text x="780" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">electricity in</text><line x1="780" y1="272" x2="780" y2="312" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="715" y="320" width="130" height="70" rx="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="362" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3 kWh</text><text x="780" y="414" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">heat out</text><text x="780" y="450" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">illustrative</text><text x="780" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">figure</text><text x="450" y="580" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Same 12,000 kWh of heat each year. The house must be well insulated for the heat pump to supply enough.</text>
</svg>