<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 766" width="900" height="766" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="766" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Heat pumps move heat, they do not make it</text>

<rect x="30" y="110" width="410" height="530" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="530" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Ground source</text><text x="665" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Air source</text><rect x="32" y="400" width="406" height="150" rx="0" fill="#f2e7b8"/><line x1="32" y1="400" x2="438" y2="400" stroke="#1e2a44" stroke-width="3"/><rect x="60" y="250" width="170" height="150" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M46,250 L145,175 L244,250 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="120" y="340" width="40" height="60" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M209,360 L270,360 L270,440 L420,440 L420,470 L60,470 L60,500 L420,500" fill="none" stroke="#2b5a9a" stroke-width="5" stroke-linejoin="round"/><rect x="175" y="340" width="34" height="40" rx="0" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="192" y="330" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">pump</text><line x1="110" y1="530" x2="110" y2="508" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="200" y1="530" x2="200" y2="508" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="290" y1="530" x2="290" y2="508" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="380" y1="530" x2="380" y2="508" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="235" y="556" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">pipes in trenches or boreholes</text><text x="330" y="290" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="start">fluid absorbs</text><text x="330" y="308" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="start">heat from</text><text x="330" y="326" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="start">the ground</text><rect x="462" y="400" width="406" height="150" rx="0" fill="#f2e7b8"/><line x1="462" y1="400" x2="868" y2="400" stroke="#1e2a44" stroke-width="3"/><rect x="500" y="250" width="170" height="150" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M486,250 L585,175 L684,250 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="560" y="340" width="40" height="60" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="682" y="320" width="70" height="60" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="717" cy="350" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M717,334 L717,366 M701,350 L733,350" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="850" y1="250" x2="770" y2="290" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="850" y1="280" x2="770" y2="320" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="855" y="234" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">heat from outside air</text><line x1="670" y1="350" x2="640" y2="350" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="707" y="430" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">fan unit on outside wall</text><text x="54" y="586" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ground temperature changes little, so</text><text x="54" y="607" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">output is steady.</text><text x="484" y="586" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheaper and easier to fit, but less</text><text x="484" y="607" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">efficient in very cold weather.</text><rect x="30" y="660" width="840" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="691.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both use electricity to move heat that already exists. They deliver more heat energy</text><text x="48" y="713.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">than the electrical energy they use, with no emissions on site.</text>
</svg>