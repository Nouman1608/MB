<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two ways to manage energy</text>

<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="410" height="100" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="146" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Reduce demand</text><text x="235" y="174" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">use less energy for the same result</text><rect x="125.25000000000001" y="230.5" width="219.49999999999997" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="235" y="252.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Reducing consumption</text><rect x="174.125" y="278.5" width="121.74999999999999" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="235" y="300.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Insulation</text><rect x="105.69999999999999" y="326.5" width="258.6" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="235" y="348.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Energy-efficient devices</text><rect x="66.60000000000002" y="374.5" width="336.79999999999995" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="235" y="396.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Education on energy conservation</text><rect x="135.025" y="422.5" width="199.95" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="235" y="444.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Transport policies</text><text x="54" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Usually cheaper and quicker to put in</text><text x="54" y="541" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">place.</text><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="146" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Change or secure supply</text><text x="665" y="174" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">get more from what is available, or</text><text x="665" y="196" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">replace finite resources</text><rect x="477.05" y="234.5" width="375.9" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="665" y="256.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Exploiting existing energy resources</text><text x="665" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. waste heat, fuller use of rivers and wind</text><rect x="579.6875" y="310.5" width="170.625" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="665" y="332.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Battery storage</text><text x="665" y="362" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">store surplus solar and wind power</text><rect x="481.9375" y="386.5" width="366.125" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="665" y="408.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Development of new energy resources</text><text x="665" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">hydrogen fuel and heat pumps</text><text x="484" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Usually larger and more expensive, but can</text><text x="484" y="541" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">transform a country’s energy mix.</text>
</svg>