<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Blue or green hydrogen?</text>

<rect x="30" y="110" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="22" font-weight="700" fill="#2b5a9a" text-anchor="start">Blue hydrogen</text><rect x="54" y="174" width="210" height="90" rx="12" fill="#b5d3cf" stroke="#2b5a9a" stroke-width="2.5"/><text x="159" y="209.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">natural gas</text><text x="159" y="240.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a fossil fuel</text><line x1="270" y1="219" x2="340" y2="219" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="346" y="174" width="170" height="90" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="431" y="223.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">hydrogen</text><rect x="540" y="174" width="310" height="90" rx="12" fill="#cbbf9f" stroke="#b5602e" stroke-width="2.5"/><text x="558" y="199.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">+ carbon dioxide</text><text x="558" y="230.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">low-carbon only if it is captured</text><text x="558" y="250.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and stored</text><text x="54" y="294" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Can be made at large scale using existing gas supplies.</text><rect x="30" y="330" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="368" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">Green hydrogen</text><rect x="54" y="394" width="210" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="159" y="419.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">water</text><text x="159" y="450.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">split by renewable</text><text x="159" y="470.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">electricity</text><line x1="270" y1="439" x2="340" y2="439" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="346" y="394" width="170" height="90" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="431" y="443.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">hydrogen</text><rect x="540" y="394" width="310" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="558" y="429.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">+ oxygen</text><text x="558" y="460.54" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">very low emissions</text><text x="54" y="514" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Currently expensive; needs large amounts of renewable electricity; can store surplus.</text><rect x="30" y="550" width="840" height="108" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="582.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Using hydrogen</text><text x="48" y="614.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Burned or used in a fuel cell, it releases energy and the only product is water: for</text><text x="48" y="636.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">buses, lorries and heat for industry.</text>
</svg>