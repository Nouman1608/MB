k</text><rect x="30" y="342" width="840" height="179" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="378" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Related themes in 3.1.1.4</text><circle cx="61" cy="401.39" r="4.5" fill="#8a6d0d"/><text x="74" y="407" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Division of domestic labour; power and decision-making</text><circle cx="61" cy="431.39" r="4.5" fill="#8a6d0d"/><text x="74" y="437" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Violence against women and children</text><circle cx="61" cy="461.39" r="4.5" fill="#8a6d0d"/><text x="74" y="467" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Children’s status and child-centredness</text><circle cx="61" cy="491.39" r="4.5" fill="#8a6d0d"/><text x="74" y="497" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Adult children, including "boomerang" families, and older people</text>
