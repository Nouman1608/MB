<rect width="900" height="449" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three perspectives on the family</text>

<rect x="30" y="104" width="269.3333333333333" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist</text><text x="46" y="188.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Parsons</text><text x="46" y="218.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The functions the family</text><text x="46" y="240.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">performs, and how the</text><text x="46" y="262.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">nuclear family "fits"</text><text x="46" y="284.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">modern industrial society.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><text x="331.3333333333333" y="188.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Engels</text><text x="331.3333333333333" y="218.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The family as an agent of</text><text x="331.3333333333333" y="240.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">social control serving</text><text x="331.3333333333333" y="262.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">capitalism.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><text x="616.6666666666666" y="188.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Oakley</text><text x="616.6666666666666" y="218.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How families shape the</text><text x="616.6666666666666" y="240.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">different positions of men</text><text x="616.6666666666666" y="262.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and women in society.</text><rect x="30" y="324" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="360" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Revise comparatively</text><text x="56" y="389" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Contrast how each perspective reads the same aspect of family life. Named sociologists</text><text x="56" y="411" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">for Unit 1: Engels, Oakley, Parsons, Smart, Stacey, Therborn.</text>
</svg>