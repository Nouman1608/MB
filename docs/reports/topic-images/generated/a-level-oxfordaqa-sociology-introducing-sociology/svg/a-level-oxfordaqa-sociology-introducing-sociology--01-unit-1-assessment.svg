<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Unit 1 is assessed</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">OxfordAQA International A-level Sociology (9690)</text>
<text x="450" y="138" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Unit 1 Introducing Sociology (60 marks)</text><rect x="30" y="156" width="412" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,206 L31.25,170.25 Q31.25,157.25 44.25,157.25 L427.75,157.25 Q440.75,157.25 440.75,170.25 L440.75,206 Z" fill="#b5d3cf"/><line x1="31.25" y1="206" x2="440.75" y2="206" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="186.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: Families (3.1.1)</text><text x="44" y="237.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">40 of 60 marks</text><text x="44" y="264.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Short and extended-response questions.</text><rect x="458" y="156" width="412" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,206 L459.25,170.25 Q459.25,157.25 472.25,157.25 L855.75,157.25 Q868.75,157.25 868.75,170.25 L868.75,206 Z" fill="#f2e7b8"/><line x1="459.25" y1="206" x2="868.75" y2="206" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="186.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: Research methods (3.1.3)</text><text x="472" y="237.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">20 marks</text><text x="472" y="264.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Short questions plus a structured question</text><text x="472" y="285.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">based on data about an unseen issue.</text><text x="450" y="343" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3.1.3 Research Methods and Theory is examined twice</text><rect x="30" y="361" width="246.66666666666666" height="127" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="403.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Unit 1</text><text x="153.33333333333331" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">short and structured</text><text x="153.33333333333331" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">questions</text><rect x="326.66666666666663" y="361" width="246.66666666666666" height="127" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="393.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Same content</text><text x="449.99999999999994" y="423.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">approaches, methods,</text><text x="449.99999999999994" y="444.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">issues, data</text><text x="449.99999999999994" y="465.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">interpretation, theories</text><rect x="623.3333333333333" y="361" width="246.66666666666666" height="127" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="403.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Unit 2</text><text x="746.6666666666666" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a single extended-response</text><text x="746.6666666666666" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">question</text><line x1="322.66666666666663" y1="424.5" x2="282.66666666666663" y2="424.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="577.3333333333333" y1="424.5" x2="619.3333333333333" y2="424.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="516" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle" font-style="italic">a different question form, not different content</text>
</svg>