<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 513" width="900" height="513" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="513" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Participant observation of a criminal gang</text>

<rect x="30" y="104" width="404" height="254" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Strengths</text><circle cx="53" cy="184.79" r="4.5" fill="#2e6b62"/><text x="66" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">High validity: behaviour in its natural</text><text x="66" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">setting</text><circle cx="53" cy="236.79" r="4.5" fill="#2e6b62"/><text x="66" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Access to a group that would refuse a</text><text x="66" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">questionnaire</text><circle cx="53" cy="288.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reveals the meanings members attach to</text><text x="66" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">their actions</text><rect x="466" y="104" width="404" height="254" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Weaknesses</text><circle cx="489" cy="184.79" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not reliable: cannot be replicated</text><circle cx="489" cy="214.79" r="4.5" fill="#8a6d0d"/><text x="502" y="220.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Small sample, not representative</text><circle cx="489" cy="244.79" r="4.5" fill="#8a6d0d"/><text x="502" y="250.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">May "go native", losing objectivity</text><circle cx="489" cy="274.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="280.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Covert work raises consent and safety</text><text x="502" y="302.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">issues</text><circle cx="489" cy="326.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="332.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Time-consuming and expensive</text><circle cx="450" cy="231" r="24" fill="#1e2a44"/><text x="450" y="238" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="376" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="412" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion: it depends on purpose</text><text x="56" y="441" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">For understanding meaning it is the strongest method available; for measuring prevalence</text><text x="56" y="463" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">it is the wrong tool.</text>
</svg>