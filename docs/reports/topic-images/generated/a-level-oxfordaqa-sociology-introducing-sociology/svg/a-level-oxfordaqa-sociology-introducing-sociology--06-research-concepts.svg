<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 641" width="900" height="641" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="641" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judging a research method</text>

<rect x="228" y="104" width="317" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="386.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Positivist methods</text><rect x="553" y="104" width="317" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="711.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interpretivist methods</text><rect x="30" y="156" width="190" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="197.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Examples</text><rect x="228" y="156" width="317" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Questionnaires, structured</text><text x="242" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interviews, official statistics</text><rect x="553" y="156" width="317" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unstructured interviews,</text><text x="567" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">participant observation</text><rect x="30" y="236" width="190" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="277.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><rect x="228" y="236" width="317" height="72" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">High:</tspan> repeating it would give the</text><text x="242" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">same result</text><rect x="553" y="236" width="317" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Low:</tspan> hard to repeat</text><rect x="30" y="316" width="190" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="357.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Validity</text><rect x="228" y="316" width="317" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">May be low:</tspan> may not measure what</text><text x="242" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it claims to</text><rect x="553" y="316" width="317" height="72" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">High:</tspan> valid, in-depth insight</text><rect x="30" y="396" width="190" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="437.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Representativeness</text><rect x="228" y="396" width="317" height="72" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="426.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Generalisable</tspan> findings</text><rect x="553" y="396" width="317" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="426.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Less generalisable:</tspan> in-depth study</text><text x="567" y="447.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of few people</text><rect x="30" y="484" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="520" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Also judge by PET</text><text x="56" y="549" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Practical, ethical and theoretical factors. Ethics: informed consent, confidentiality,</text><text x="56" y="571" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">protection from harm, right to withdraw. Sampling: random, systematic, quota,</text><text x="56" y="593" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">multistage, stratified random, snowball.</text>
</svg>