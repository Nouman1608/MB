<rect width="900" height="607" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why families have changed</text>

<rect x="30" y="104" width="380" height="221" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L395.75,105.25 Q408.75,105.25 408.75,118.25 L408.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="408.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Demographic factors</text><circle cx="49" cy="179.92" r="4.5" fill="#2e6b62"/><text x="62" y="185.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family size</text><circle cx="49" cy="208.92" r="4.5" fill="#2e6b62"/><text x="62" y="214.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Birth and death rates</text><circle cx="49" cy="237.92" r="4.5" fill="#2e6b62"/><text x="62" y="243.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Infant and child mortality</text><circle cx="49" cy="266.92" r="4.5" fill="#2e6b62"/><text x="62" y="272.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Migration</text><circle cx="49" cy="295.92" r="4.5" fill="#2e6b62"/><text x="62" y="301.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An ageing population</text><rect x="490" y="104" width="380" height="221" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M491.25,154 L491.25,118.25 Q491.25,105.25 504.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="491.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="680" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social and economic change</text><circle cx="509" cy="179.92" r="4.5" fill="#2e6b62"/><text x="522" y="185.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Industrialisation</text><circle cx="509" cy="208.92" r="4.5" fill="#2e6b62"/><text x="522" y="214.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Urbanisation</text><circle cx="509" cy="237.92" r="4.5" fill="#2e6b62"/><text x="522" y="243.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Smart:</tspan> personal life</text><circle cx="509" cy="266.92" r="4.5" fill="#2e6b62"/><text x="522" y="272.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Individualisation: more freely chosen</text><text x="522" y="293.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">arrangements</text><line x1="235" y1="331" x2="390" y2="373" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="665" y1="331" x2="510" y2="373" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="379" width="400" height="56" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="415" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Newer family diversity</text><rect x="30" y="453" width="201" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="130.5" y="477" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Pivot / sandwich</text><text x="130.5" y="498" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">generation</text><rect x="243" y="453" width="201" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="343.5" y="477" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Reconstituted /</text><text x="343.5" y="498" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">blended</text><rect x="456" y="453" width="201" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="556.5" y="477" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Living apart</text><text x="556.5" y="498" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">together</text><rect x="669" y="453" width="201" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="769.5" y="487" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Child-free couples</text><rect x="30" y="523" width="201" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="130.5" y="557" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Beanpole families</text><rect x="243" y="523" width="201" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="343.5" y="547" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Diasporas and</text><text x="343.5" y="568" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">transnational</text><rect x="456" y="523" width="201" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="556.5" y="557" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Friends as family</text><rect x="669" y="523" width="201" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="769.5" y="547" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Pets as family</text><text x="769.5" y="568" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">members</text>
</svg>