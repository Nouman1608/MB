<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Controlling the nobility: Peter and Akbar</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Peter the Great (Europe) and Akbar (Asia and Oceania)</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="321" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="202.02531645569618" height="49" fill="#b5d3cf"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Theme</text><rect x="232.02531645569618" y="124" width="318.98734177215186" height="49" fill="#b5d3cf"/><text x="246.02531645569618" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peter the Great</text><rect x="551.0126582278481" y="124" width="318.98734177215186" height="49" fill="#f2e7b8"/><text x="565.0126582278481" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Akbar</text><rect x="30" y="173" width="202.02531645569618" height="68" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ranks tied to service</text><rect x="232.02531645569618" y="173" width="318.98734177215186" height="68" fill="#ffffff"/><text x="246.02531645569618" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Table of Ranks: across the whole</text><text x="246.02531645569618" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">administration</text><rect x="551.0126582278481" y="173" width="318.98734177215186" height="68" fill="#ffffff"/><text x="565.0126582278481" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mansabdari: civil and military rank</text><text x="565.0126582278481" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">combined</text><line x1="30" y1="241" x2="870" y2="241" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="241" width="202.02531645569618" height="68" fill="#dce9e7"/><text x="44" y="267.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rewards and</text><text x="44" y="288.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">dependence</text><rect x="232.02531645569618" y="241" width="318.98734177215186" height="68" fill="#ffffff"/><text x="246.02531645569618" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lifelong service; nobles kept estates</text><text x="246.02531645569618" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and serfs</text><rect x="551.0126582278481" y="241" width="318.98734177215186" height="68" fill="#ffffff"/><text x="565.0126582278481" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rotated jagirs prevented local power</text><text x="565.0126582278481" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bases</text><line x1="30" y1="309" x2="870" y2="309" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="309" width="202.02531645569618" height="68" fill="#dce9e7"/><text x="44" y="335.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Inclusion or coercion</text><rect x="232.02531645569618" y="309" width="318.98734177215186" height="68" fill="#ffffff"/><text x="246.02531645569618" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Forced change; punished resistance</text><text x="246.02531645569618" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(the streltsy)</text><rect x="551.0126582278481" y="309" width="318.98734177215186" height="68" fill="#ffffff"/><text x="565.0126582278481" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rajputs brought in through alliances</text><text x="565.0126582278481" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and toleration</text><line x1="30" y1="377" x2="870" y2="377" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="377" width="202.02531645569618" height="68" fill="#dce9e7"/><text x="44" y="403.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Culture</text><rect x="232.02531645569618" y="377" width="318.98734177215186" height="68" fill="#ffffff"/><text x="246.02531645569618" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Western dress and a new capital</text><text x="246.02531645569618" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">imposed</text><rect x="551.0126582278481" y="377" width="318.98734177215186" height="68" fill="#ffffff"/><text x="565.0126582278481" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Court culture blending Persian, Indian</text><text x="565.0126582278481" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and Islamic traditions</text></g><line x1="232.02531645569618" y1="124" x2="232.02531645569618" y2="445" stroke="#c9d6d4" stroke-width="1.5"/><line x1="551.0126582278481" y1="124" x2="551.0126582278481" y2="445" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="321" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><defs><linearGradient id="spg467" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="501" width="780" height="26" rx="13" fill="url(#spg467)" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="487" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Force</text><text x="840" y="487" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">Consent</text><path d="M231.6,527 L231.6,551 L236,559 L236,581" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="231.6" cy="514" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="581" width="412" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="609.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peter: more force</text><text x="44" y="637.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Compulsion and cultural change</text><path d="M668.4,527 L668.4,551 L664,559 L664,581" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="668.4" cy="514" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="458" y="581" width="412" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="609.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Akbar: more consent</text><text x="472" y="637.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Incentive and inclusion</text>
</svg>