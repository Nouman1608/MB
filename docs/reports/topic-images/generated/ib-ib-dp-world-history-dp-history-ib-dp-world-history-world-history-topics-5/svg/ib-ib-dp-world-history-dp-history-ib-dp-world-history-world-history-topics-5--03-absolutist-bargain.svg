<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 529" width="900" height="529" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="529" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Absolutism in practice: a bargain</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Even "absolute" monarchs ruled through deals with elites</text>
<rect x="30" y="154" width="280" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="207.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE RULER</text><text x="50" y="234.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Claims sovereign</text><text x="50" y="258.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">authority</text><text x="50" y="287.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not shared with any assembly;</text><text x="50" y="308.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">often justified by divine right</text><rect x="590" y="154" width="280" height="200" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="610" y="219.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE ELITES</text><text x="610" y="246.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nobles</text><text x="610" y="275.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cooperate with the ruler's</text><text x="610" y="296.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">government</text><line x1="320" y1="234" x2="580" y2="234" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="450" y="192" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">office, honours,</text><text x="450" y="216" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">protection of privileges</text><line x1="580" y1="309" x2="320" y2="309" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="450" y="294" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">cooperation</text><rect x="30" y="386" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="420.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Using the term</text><text x="50" y="450.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">When you call a ruler "absolute", explain what it meant in practice for your example. Do not assume</text><text x="50" y="472.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">it meant unlimited power.</text>
</svg>