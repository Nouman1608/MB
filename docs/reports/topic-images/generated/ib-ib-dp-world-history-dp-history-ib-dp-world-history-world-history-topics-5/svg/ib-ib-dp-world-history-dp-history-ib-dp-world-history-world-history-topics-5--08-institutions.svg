<rect width="900" height="362" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Match the institution to the state</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Do not confuse them in the exam</text>
<rect x="30" y="124" width="270.6666666666667" height="206" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RUSSIA</text><text x="48" y="181.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Table of Ranks (1722)</text><text x="48" y="211.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.15" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Status depends on service</text><text x="64.15" y="233.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in army, navy or civil</text><text x="64.15" y="255.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">administration</text><text x="48" y="285.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.15" y="285.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Also: Senate (1711), Holy</text><text x="64.15" y="307.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Synod (1721)</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="206" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="332.6666666666667" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MUGHAL EMPIRE</text><text x="332.6666666666667" y="181.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Mansabdari</text><text x="332.6666666666667" y="211.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="348.81666666666666" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Each mansab (rank) sets</text><text x="348.81666666666666" y="233.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">status, pay and cavalry to</text><text x="348.81666666666666" y="255.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">maintain</text><text x="332.6666666666667" y="285.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="348.81666666666666" y="285.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Also: jagirs, temporary</text><text x="348.81666666666666" y="307.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">revenue assignments</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="206" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="617.3333333333334" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OTTOMAN EMPIRE</text><text x="617.3333333333334" y="181.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Devshirme</text><text x="617.3333333333334" y="211.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="633.4833333333333" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Christian boys recruited,</text><text x="633.4833333333333" y="233.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">converted, trained as</text><text x="633.4833333333333" y="255.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Janissaries or officials</text><text x="617.3333333333334" y="285.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="633.4833333333333" y="285.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Also: timars, land revenue</text><text x="633.4833333333333" y="307.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">for cavalry service</text>
</svg>