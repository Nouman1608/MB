<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="512" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Enlightened absolutism: what changed?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Prussia under Frederick II (r. 1740-1786)</text>
<rect x="30" y="124" width="410" height="226" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGED: LANGUAGE AND SOME METHODS</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Enlightenment ideas</text><text x="50" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"First servant of the state"</text><text x="50" y="241.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="241.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Reformed the law</text><text x="50" y="269.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="269.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Restricted judicial torture</text><text x="50" y="297.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="297.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Tolerated religious minorities</text><text x="50" y="325.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="325.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Corresponded with Voltaire</text><rect x="460" y="124" width="410" height="226" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNCHANGED: SOCIAL FOUNDATIONS</text><text x="480" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Absolutism's base</text><text x="480" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Junker nobility supplied the officer corps</text><text x="480" y="241.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="241.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Junkers kept their serfs</text><text x="480" y="269.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="269.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Conscripts drawn from rural districts</text><text x="480" y="297.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="297.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Inherited efficient administration and large</text><text x="496.15" y="319.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">army</text><rect x="30" y="372" width="840" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="402" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">USED AT ONCE</text><text x="48" y="428.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Silesia seized from Austria (1740)</text><text x="48" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kept through the War of the Austrian Succession and the Seven Years' War (1756-1763)</text>
</svg>