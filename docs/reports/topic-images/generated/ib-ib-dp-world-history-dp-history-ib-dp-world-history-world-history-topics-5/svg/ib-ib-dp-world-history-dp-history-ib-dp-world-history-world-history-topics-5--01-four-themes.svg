<rect width="900" height="477" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Early Modern states: four themes</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Stronger states, and what limited them</text>
<rect x="30" y="124" width="201" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="44" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Emergence and</text><text x="44" y="199.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">expansion</text><text x="44" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How states formed,</text><text x="44" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">grew and were held</text><text x="44" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">together</text><rect x="243" y="124" width="201" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="257" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="257" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rulers and</text><text x="257" y="199.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">legitimacy</text><text x="257" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Divine right, dynastic</text><text x="257" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">claims, religious</text><text x="257" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">authority</text><rect x="456" y="124" width="201" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="470" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Methods of</text><text x="470" y="199.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">government</text><text x="470" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bureaucracy, taxation,</text><text x="470" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">armies, law; control of</text><text x="470" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nobles and religion</text><rect x="669" y="124" width="201" height="185" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="683" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4</text><text x="683" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Challenges and</text><text x="683" y="199.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">limits</text><text x="683" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rebellion, assemblies,</text><text x="683" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">religious opposition,</text><text x="683" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">financial crisis, new</text><text x="683" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ideas</text><rect x="138.12" y="331" width="132.048" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="204.144" y="351.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Larger armies</text><rect x="280.168" y="331" width="131.776" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="346.05600000000004" y="351.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">More officials</text><rect x="421.944" y="331" width="123.136" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="483.512" y="351.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Higher taxes</text><rect x="555.08" y="331" width="206.8" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="658.48" y="351.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Tighter control of elites</text><rect x="338.408" y="371" width="223.184" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="391.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Tighter control of religion</text><text x="450" y="436.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">How rulers built stronger states; the topic also asks what limited them.</text>
</svg>