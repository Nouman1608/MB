<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="568" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Peter the Great's reforms</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">After the Grand Embassy (1697-1698) and the streltsy revolt</text>
<line x1="345" y1="216" x2="413" y2="295.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="345" y1="351" x2="413" y2="336.3" stroke="#1e2a44" stroke-width="2.5"/><line x1="345" y1="465" x2="413" y2="370.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="555" y1="184.5" x2="487" y2="286.35" stroke="#1e2a44" stroke-width="2.5"/><line x1="555" y1="319.5" x2="487" y2="326.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="555" y1="465" x2="487" y2="370.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="330" r="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="324.54" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Peter's</text><text x="450" y="350.16" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Russia</text><rect x="30" y="145" width="315" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="175.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Army and navy</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Life conscription of peasants; navy</text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from nothing. Narva (1700) defeat,</text><text x="46" y="245.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Poltava (1709) victory; Nystad (1721):</text><text x="46" y="266.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Baltic coast.</text><rect x="30" y="301" width="315" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="331.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Administration</text><text x="46" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Senate (1711) and colleges; Table of</text><text x="46" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ranks (1722): status from service.</text><rect x="30" y="415" width="315" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="445.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Taxation</text><text x="46" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Poll tax on male peasants replaced</text><text x="46" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the household tax.</text><rect x="555" y="124" width="315" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="571" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Church</text><text x="571" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Patriarchate left vacant, then</text><text x="571" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">replaced by the state-controlled Holy</text><text x="571" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Synod (1721).</text><rect x="555" y="259" width="315" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="571" y="289.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Culture</text><text x="571" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">St Petersburg founded 1703,</text><text x="571" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">becomes capital; western dress and</text><text x="571" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shaving ordered.</text><rect x="555" y="394" width="315" height="142" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="571" y="424.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Limits</text><text x="571" y="452.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rested on serfdom and coercion;</text><text x="571" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">noble service later relaxed;</text><text x="571" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">succession uncertain after Alexei's</text><text x="571" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">death (1718).</text>
</svg>