<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stuart England: a monarchy limited</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A contrast with absolutism</text>
<line x1="130" y1="132" x2="130" y2="584" stroke="#1e2a44" stroke-width="4"/><rect x="170" y="124" width="700" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="183" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Charles I and Parliament in dispute</text><text x="183" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Over taxation, religion and royal authority</text><circle cx="130" cy="158.5" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="170" y="203" width="700" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="183" y="230.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Civil war begins</text><circle cx="130" cy="225.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="231.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1642</text><rect x="170" y="258" width="700" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="183" y="285.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Execution of the king</text><circle cx="130" cy="280.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="286.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1649</text><rect x="170" y="313" width="700" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="183" y="340.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Restoration of the monarchy</text><circle cx="130" cy="335.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="341.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1660</text><rect x="170" y="368" width="700" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="183" y="395.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">James II</text><text x="183" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">His Catholicism and use of royal power provoke opposition</text><circle cx="130" cy="402.5" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="170" y="447" width="700" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="183" y="474.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Glorious Revolution</text><circle cx="130" cy="469.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="475.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1688</text><rect x="170" y="502" width="700" height="90" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="183" y="529.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bill of Rights</text><text x="183" y="553.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parliament must consent to taxation and to a standing army in peacetime: a limited</text><text x="183" y="574.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">monarchy</text><circle cx="130" cy="547" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="553" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1689</text>
</svg>