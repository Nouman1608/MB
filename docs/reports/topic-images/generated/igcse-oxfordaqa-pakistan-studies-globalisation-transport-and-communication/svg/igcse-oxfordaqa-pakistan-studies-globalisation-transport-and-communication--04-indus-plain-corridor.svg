<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The main transport corridor</text>

<rect x="30" y="112" width="840" height="290" rx="12" fill="#e6eef0" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">line diagram: order of cities only, not distance or direction</text><line x1="90" y1="252" x2="810" y2="252" stroke="#1e2a44" stroke-width="8" stroke-linecap="round"/><line x1="90" y1="268" x2="810" y2="268" stroke="#8a6d0d" stroke-width="8" stroke-linecap="round" stroke-dasharray="20 10"/><circle cx="90" cy="260" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="4"/><text x="90" y="224" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Karachi</text><circle cx="234" cy="260" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="4"/><text x="234" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hyderabad</text><circle cx="378" cy="260" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="4"/><text x="378" y="224" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Multan</text><circle cx="522" cy="260" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="4"/><text x="522" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Lahore</text><circle cx="666" cy="260" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="4"/><text x="666" y="224" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Islamabad</text><circle cx="810" cy="260" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="4"/><text x="810" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Peshawar</text><line x1="90" y1="284" x2="90" y2="338" stroke="#2e6b62" stroke-width="5"/><rect x="40" y="338" width="180" height="40" rx="20" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="364" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">sea trade</text><line x1="70" y1="176" x2="110" y2="176" stroke="#1e2a44" stroke-width="8"/><text x="120" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">road</text><line x1="200" y1="176" x2="240" y2="176" stroke="#8a6d0d" stroke-width="8" stroke-dasharray="20 10"/><text x="250" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rail (main line, ML-1, planned for upgrading)</text><rect x="30" y="420" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="450.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Road and rail are densest along this flat, populous corridor. Motorways such as the M-2</text><text x="48" y="472.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lahore–Islamabad cut journey times; the Karakoram Highway links Pakistan to China.</text>
</svg>