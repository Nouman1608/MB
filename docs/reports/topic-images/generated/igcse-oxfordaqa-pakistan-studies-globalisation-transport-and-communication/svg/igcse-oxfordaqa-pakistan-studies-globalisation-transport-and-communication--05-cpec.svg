<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The China–Pakistan Economic Corridor</text>

<rect x="330" y="112" width="240" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">CPEC</text><text x="450" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">launched 2015</text><rect x="30" y="242" width="156" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="108" y="276" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Roads</text><path d="M450,192 L108,240" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="201" y="242" width="156" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="279" y="276" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Railways (ML-1)</text><path d="M450,192 L279,240" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="372" y="242" width="156" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="276" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Power stations</text><path d="M450,192 L450,240" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="543" y="242" width="156" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="621" y="276" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Gwadar port</text><path d="M450,192 L621,240" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="714" y="242" width="156" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="792" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Special</text><text x="792" y="285" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">economic zones</text><path d="M450,192 L792,240" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="30" y="224" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Chinese investment in:</text><rect x="30" y="332" width="410" height="179" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="365" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Supporters say</text><text x="48" y="394.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="394.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fills infrastructure and energy gaps</text><text x="48" y="419.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="419.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Creates jobs</text><rect x="460" y="332" width="410" height="179" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="365" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Critics point to</text><text x="478" y="394.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="394.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Debt</text><text x="478" y="419.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="419.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Share of contracts and jobs going to</text><text x="494" y="441.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Chinese firms</text><text x="478" y="466.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="466.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Need for benefits to reach local</text><text x="494" y="488.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">communities, especially in Balochistan</text>
