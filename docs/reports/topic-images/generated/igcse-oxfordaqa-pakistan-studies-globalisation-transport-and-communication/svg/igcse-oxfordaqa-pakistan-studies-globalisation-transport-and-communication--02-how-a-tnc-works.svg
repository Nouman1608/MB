<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 651" width="900" height="651" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="651" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a transnational corporation works</text>

<rect x="30" y="112" width="260" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Headquarters</text><text x="160" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in one country</text><text x="160" y="212" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">decisions made here</text><text x="160" y="232" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">profits return here</text><rect x="560" y="132" width="310" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="715" y="160" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Operations in Pakistan</text><rect x="560" y="182" width="310" height="44" rx="22" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="715" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Operations elsewhere</text><rect x="560" y="232" width="310" height="44" rx="22" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="715" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Operations elsewhere</text><line x1="296" y1="168" x2="552" y2="154" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="424" y="142" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">investment, brands, technology</text><line x1="552" y1="174" x2="296" y2="212" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)" stroke-dasharray="9 6"/><text x="440" y="228" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">profits sent home</text><rect x="30" y="292" width="840" height="105" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="325" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Examples in Pakistan</text><text x="48" y="353.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Consumer-goods firms such as Unilever and Nestlé; car makers in joint ventures such as Pak Suzuki and</text><text x="48" y="374.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Indus Motor (Toyota); soft-drink, fast-food, technology and telecommunications firms.</text><rect x="30" y="417" width="410" height="204" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="450" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Positive impacts</text><text x="48" y="478.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="478.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jobs and training</text><text x="48" y="502.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="502.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tax revenue</text><text x="48" y="526.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="526.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">New technology and management skills</text><text x="48" y="550.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="550.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exports</text><text x="48" y="574.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="574.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Better products for consumers</text><text x="48" y="598.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="598.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Investment in local suppliers</text><rect x="460" y="417" width="410" height="204" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="450" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Negative impacts</text><text x="478" y="478.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="478.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Profits sent back to the home country</text><text x="478" y="502.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="502.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Small local firms pushed out</text><text x="478" y="526.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="526.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pressure on labour standards in supply chains</text><text x="478" y="550.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="550.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Water use, waste and pollution</text><text x="478" y="574.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="574.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dependence on decisions made abroad</text>
</svg>