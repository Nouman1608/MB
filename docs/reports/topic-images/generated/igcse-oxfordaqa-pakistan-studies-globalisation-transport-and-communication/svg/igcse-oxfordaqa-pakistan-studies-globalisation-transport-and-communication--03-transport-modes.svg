<rect width="900" height="455" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five modes of transport: where and why</text>

<rect x="30" y="112" width="840" height="313" rx="12" fill="#ffffff"/><path d="M30,156 L30,124 Q30,112 42,112 L858,112 Q870,112 870,124 L870,156 Z" fill="#b5d3cf"/><rect x="30" y="156" width="840" height="83" fill="#ffffff"/><text x="42" y="181.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Road and rail</text><text x="192" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Densest on the flat, populous Indus Plain</text><text x="522" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Steep relief, landslides, snow, earthquakes,</text><text x="522" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deserts and low population in Balochistan</text><text x="522" y="223.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and the north</text><line x1="30" y1="156" x2="870" y2="156" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="239" width="840" height="83" fill="#dce9e7"/><text x="42" y="264.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Air</text><text x="192" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Links major cities; serves remote</text><text x="192" y="285.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">northern towns such as Gilgit and</text><text x="192" y="306.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Skardu</text><text x="522" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Used where roads are slow</text><line x1="30" y1="239" x2="870" y2="239" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="322" width="840" height="62" fill="#ffffff"/><text x="42" y="347.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">River</text><text x="192" y="347.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Very limited</text><text x="522" y="347.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Flow varies greatly between seasons;</text><text x="522" y="368.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">barrages block navigation</text><line x1="30" y1="322" x2="870" y2="322" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="384" width="840" height="41" fill="#dce9e7"/><text x="42" y="409.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sea</text><text x="192" y="409.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Karachi Port, Port Qasim and Gwadar</text><text x="522" y="409.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">—</text><line x1="30" y1="384" x2="870" y2="384" stroke="#c9d6d4" stroke-width="1.5"/><line x1="180" y1="112" x2="180" y2="425" stroke="#c9d6d4" stroke-width="1.5"/><line x1="510" y1="112" x2="510" y2="425" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mode</text><text x="192" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Where it is strong</text><text x="522" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What limits it</text><rect x="30" y="112" width="840" height="313" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>