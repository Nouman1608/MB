<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five ways Pakistan is connected to the world</text>

<line x1="450" y1="330" x2="450" y2="140" stroke="#2e6b62" stroke-width="4"/><line x1="450" y1="330" x2="693.9459964297068" y2="271.28677106876" stroke="#2e6b62" stroke-width="4"/><line x1="450" y1="330" x2="600.7669172130194" y2="483.71322893124" stroke="#2e6b62" stroke-width="4"/><line x1="450" y1="330" x2="299.2330827869807" y2="483.71322893124" stroke="#2e6b62" stroke-width="4"/><line x1="450" y1="330" x2="206.0540035702931" y2="271.28677106875995" stroke="#2e6b62" stroke-width="4"/><circle cx="450" cy="330" r="88" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="326" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan</text><text x="450" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">in a global web</text><rect x="340" y="87.5" width="220" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="120.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Trade</text><text x="450" y="149.1" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Export markets for</text><text x="450" y="170.1" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">textiles</text><rect x="583.9459964297068" y="218.78677106876" width="220" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="693.9459964297068" y="251.78677106876" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Investment</text><text x="693.9459964297068" y="280.38677106876" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Foreign investment and</text><text x="693.9459964297068" y="301.38677106876" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">TNCs</text><rect x="490.7669172130194" y="431.21322893124" width="220" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="600.7669172130194" y="464.21322893124" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Migration</text><text x="600.7669172130194" y="492.81322893124" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Remittances from</text><text x="600.7669172130194" y="513.81322893124" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">workers abroad</text><rect x="189.23308278698067" y="431.21322893124" width="220" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="299.2330827869807" y="464.21322893124" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Technology</text><text x="299.2330827869807" y="492.81322893124" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">IT outsourcing; cleaner</text><text x="299.2330827869807" y="513.81322893124" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">technologies</text><rect x="96.0540035702931" y="218.78677106875995" width="220" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="206.0540035702931" y="251.78677106875995" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Culture</text><text x="206.0540035702931" y="280.38677106875997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Global brands and</text><text x="206.0540035702931" y="301.38677106875997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">products</text><rect x="30" y="590" width="840" height="97" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="620.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Globalisation is the growing interconnection of countries through trade, investment, migration,</text><text x="48" y="642.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">technology and culture. Each link brings positive and negative impacts on the economy, people and</text><text x="48" y="664.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">environment.</text>
