<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 518" width="900" height="518" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="518" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the financial system supports development</text>

<rect x="30" y="112" width="180" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="155" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Savings</text><rect x="260" y="102" width="380" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="130" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Financial institutions</text><text x="450" y="156" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">banks · microfinance · Islamic banking</text><text x="450" y="176" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">stock exchange · mobile money</text><rect x="690" y="112" width="180" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="155" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Investment</text><line x1="214" y1="147" x2="254" y2="147" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="644" y1="147" x2="684" y2="147" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="222" width="840" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="255" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">State Bank of Pakistan</text><text x="48" y="283.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Regulates banks and runs the instant payment system Raast (launched 2021).</text><text x="30" y="328" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOBILE WALLETS (e.g. JazzCash, Easypaisa) LET PEOPLE WITHOUT BANK ACCOUNTS:</text><rect x="30" y="340" width="270" height="50" rx="25" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="371" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Send money</text><rect x="315" y="340" width="270" height="50" rx="25" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="371" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Pay bills</text><rect x="600" y="340" width="270" height="50" rx="25" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="371" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Receive government cash transfers</text><line x1="450" y1="396" x2="450" y2="426" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="170" y="432" width="560" height="56" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="466" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Financial inclusion, especially for women and rural households</text>
</svg>