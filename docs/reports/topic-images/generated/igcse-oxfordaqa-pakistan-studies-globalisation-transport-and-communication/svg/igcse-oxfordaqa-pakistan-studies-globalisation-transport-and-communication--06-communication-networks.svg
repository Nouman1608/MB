<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 659" width="900" height="659" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="659" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Expanding communication networks</text>

<line x1="105" y1="130" x2="105" y2="397" stroke="#1e2a44" stroke-width="4"/><rect x="202" y="120" width="668" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="151.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Private TV channels</text><text x="220" y="179.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Expand rapidly.</text><rect x="202" y="212" width="668" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="220" y="243.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">3G and 4G licences auctioned</text><text x="220" y="271.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mobile internet reaches millions.</text><rect x="202" y="304" width="668" height="103" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="335.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Radio, TV and mobiles</text><text x="220" y="363.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Radio and television reach most of the population; mobile phones are far more</text><text x="220" y="384.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">common than landlines.</text><rect x="30" y="134" width="150" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="161" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2000s</text><line x1="180" y1="154" x2="202" y2="154" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="226" width="150" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="253" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2014</text><line x1="180" y1="246" x2="202" y2="246" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="318" width="150" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="345" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Now</text><line x1="180" y1="338" x2="202" y2="338" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="431" width="410" height="198" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="464" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Opportunities</text><text x="48" y="492.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="492.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">E-commerce</text><text x="48" y="516.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="516.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Online education and telemedicine</text><text x="48" y="540.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="540.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Freelancing and IT exports</text><text x="48" y="564.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="564.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Market prices for farmers</text><rect x="460" y="431" width="410" height="198" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="464" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Challenges</text><text x="478" y="492.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="492.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mountain and desert terrain raise the cost of</text><text x="494" y="513.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">masts and fibre</text><text x="478" y="537.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="537.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Power cuts</text><text x="478" y="561.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="561.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low digital literacy; gender gap in phone</text><text x="494" y="582.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ownership</text><text x="478" y="606.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="606.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cyber-security and internet shutdowns</text>
</svg>