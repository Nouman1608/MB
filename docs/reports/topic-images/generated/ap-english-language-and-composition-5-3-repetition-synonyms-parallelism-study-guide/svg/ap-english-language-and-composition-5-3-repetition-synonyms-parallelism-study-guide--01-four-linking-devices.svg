<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" width="900" height="880" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="880" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four tools that link</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">All four at work in one paragraph</text>
<rect x="30" y="128" width="122.20587" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="91.102935" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A library is a</text><rect x="160.20587" y="128" width="91.87855000000002" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="206.145145" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">promise.</text><text x="206.145145" y="184.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">repetition</text><rect x="260.08442" y="128" width="77.36200000000001" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="298.76542" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">It</text><text x="298.76542" y="184.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">→ library</text><rect x="30" y="213.3" width="539.88941" height="35" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="299.944705" y="236.75" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">promises that a child who has no books at home will find them;</text><text x="299.944705" y="269.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">parallel clause 1</text><rect x="30" y="298.6" width="543.23382" height="35" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="301.61691" y="322.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">it promises that a jobseeker who has no computer will find one;</text><text x="301.61691" y="355.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">parallel clause 2</text><rect x="30" y="383.90000000000003" width="434.32162" height="35" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="247.16081" y="407.35" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">it promises that a lonely person will find company.</text><text x="247.16081" y="440.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">parallel clause 3</text><rect x="472.32162" y="383.90000000000003" width="169.37781" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="557.010525" y="407.35" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A town that keeps</text><rect x="649.69943" y="383.90000000000003" width="121.31286" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="710.35586" y="407.35" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">this promise</text><text x="710.35586" y="440.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">clear reference</text><text x="710.35586" y="458.70000000000005" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">back</text><rect x="30" y="487.5" width="340.64312000000007" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="200.32156000000003" y="510.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">keeps something more than a building.</text><text x="200.32156000000003" y="544" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">abstract → concrete</text><rect x="30" y="580.8" width="840" height="41.8" fill="#dce9e7"/><text x="42" y="605.0999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Device</text><text x="252" y="605.0999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">What it is</text><text x="582" y="605.0999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Main job</text><rect x="30" y="622.5999999999999" width="840" height="61.6" fill="#ffffff"/><text x="42" y="646.8999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Repetition</text><text x="252" y="646.8999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the same word, phrase or structure again</text><text x="582" y="646.8999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">keeps attention on a key idea;</text><text x="582" y="666.6999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">emphasis, rhythm</text><line x1="30" y1="622.5999999999999" x2="870" y2="622.5999999999999" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="684.1999999999999" width="840" height="61.6" fill="#ffffff"/><text x="42" y="708.4999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Synonym</text><text x="252" y="708.4999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a similar word in place of an earlier one</text><text x="582" y="708.4999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">avoids monotony; adds a shade or</text><text x="582" y="728.2999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">progression</text><line x1="30" y1="684.1999999999999" x2="870" y2="684.1999999999999" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="745.8" width="840" height="61.6" fill="#ffffff"/><text x="42" y="770.0999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Pronoun reference</text><text x="252" y="770.0999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">it, they, this, which for an earlier noun</text><text x="582" y="770.0999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">avoids clumsy repetition; ties</text><text x="582" y="789.8999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">sentences</text><line x1="30" y1="745.8" x2="870" y2="745.8" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="807.4" width="840" height="41.8" fill="#ffffff"/><text x="42" y="831.6999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Parallel structure</text><text x="252" y="831.6999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">matching grammatical form</text><text x="582" y="831.6999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">shows equality or contrast; rhythm</text><line x1="30" y1="807.4" x2="870" y2="807.4" stroke="#c9d6d4" stroke-width="1.5"/><line x1="240" y1="580.8" x2="240" y2="849.1999999999999" stroke="#c9d6d4" stroke-width="1.5"/><line x1="570" y1="580.8" x2="570" y2="849.1999999999999" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="580.8" width="840" height="268.4" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5" />
</svg>