<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">No two words are exactly the same</text>

<text x="30" y="108" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">A synonym can develop an idea: Lincoln’s escalation</text><rect x="60" y="196" width="220" height="50" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="170" y="228" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">dedicate</text><rect x="320" y="166" width="220" height="80" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="430" y="213" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">consecrate</text><rect x="580" y="136" width="220" height="110" rx="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5" /><text x="690" y="198" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">hallow</text><line x1="60" y1="266" x2="800" y2="266" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="430" y="292" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">each verb a step up in sacredness</text><text x="30" y="332" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">A synonym can also change the claim: one event, three suggestions</text><rect x="30" y="350" width="269.3333333333333" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="164.66666666666666" y="385.42" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“The council <tspan font-weight="700">decided</tspan>”</text><rect x="315.3333333333333" y="350" width="269.3333333333333" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="385.42" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“The council <tspan font-weight="700">ruled</tspan>”</text><rect x="600.6666666666666" y="350" width="269.3333333333333" height="60" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="735.3333333333333" y="385.42" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“The council <tspan font-weight="700">dictated</tspan>”</text><text x="450" y="440" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">In argument, change the word and you may change the claim. Avoid shifting “cost” to “price” to</text><text x="450" y="461.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">“expense” without reason.</text>
</svg>