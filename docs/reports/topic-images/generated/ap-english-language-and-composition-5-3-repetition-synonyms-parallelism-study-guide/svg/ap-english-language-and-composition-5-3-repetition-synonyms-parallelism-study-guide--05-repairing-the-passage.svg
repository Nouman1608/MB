<rect width="900" height="499" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Repairing a passage</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: the phone rule</text>
<text x="255" y="132" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Draft</text><text x="690" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Revision</text><text x="30" y="162" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Pronouns</text><rect x="30" y="170" width="420" height="99.19999999999999" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="42" y="204.64999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“she said that <tspan font-weight="700">they</tspan> would change the rule. <tspan font-weight="700">It</tspan> was</text><text x="42" y="224.45" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">approved... <tspan font-weight="700">which</tspan> surprised the parents. <tspan font-weight="700">They</tspan> don’t</text><text x="42" y="244.24999999999997" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">like...”</text><rect x="480" y="170" width="390" height="99.19999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="492" y="194.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...the principal, <tspan font-weight="700">who</tspan> said the school would</text><text x="492" y="214.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">change the rule... <tspan font-weight="700">The</tspan> <tspan font-weight="700">change</tspan> was approved... <tspan font-weight="700">a</tspan></text><text x="492" y="234.35" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">speed</tspan> <tspan font-weight="700">that</tspan> surprised the parents, <tspan font-weight="700">who</tspan> dislike</text><text x="492" y="254.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">quick changes.”</text><line x1="454" y1="219.6" x2="476" y2="219.6" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="30" y="301.2" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Repetition</text><rect x="30" y="309.2" width="420" height="59.60000000000002" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="42" y="333.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The new <tspan font-weight="700">policy</tspan> is a <tspan font-weight="700">policy</tspan> that sets <tspan font-weight="700">new</tspan> rules for the</text><text x="42" y="353.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">use of phones.”</text><rect x="480" y="309.2" width="390" height="59.60000000000002" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="492" y="343.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The new policy sets limits on phones.”</text><line x1="454" y1="339" x2="476" y2="339" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="30" y="400.8" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Parallelism</text><rect x="30" y="408.8" width="420" height="59.60000000000002" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="42" y="433.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“to use phones less, to be better at paying attention</text><text x="42" y="453.35" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">and</tspan> <tspan font-weight="700">that</tspan> <tspan font-weight="700">phones</tspan> <tspan font-weight="700">should</tspan> <tspan font-weight="700">not</tspan> <tspan font-weight="700">interrupt</tspan> <tspan font-weight="700">lessons</tspan>.”</text><rect x="480" y="408.8" width="390" height="59.60000000000002" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="492" y="433.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“to use phones less, to pay better attention <tspan font-weight="700">and</tspan> <tspan font-weight="700">to</tspan></text><text x="492" y="453.35" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">keep</tspan> <tspan font-weight="700">lessons</tspan> <tspan font-weight="700">free</tspan> <tspan font-weight="700">from</tspan> <tspan font-weight="700">interruption</tspan>.”</text><line x1="454" y1="438.6" x2="476" y2="438.6" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>