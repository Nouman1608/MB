<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 559" width="900" height="559" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="559" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When a pronoun points nowhere</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A pronoun works only if its antecedent is unmistakable</text>
<rect x="30" y="122" width="420" height="90.03999999999999" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="44" y="149.6" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Ambiguous antecedent</text><text x="44" y="175.19" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The mayor told the engineer that <tspan font-weight="700">he</tspan> would approve</text><text x="44" y="194.99" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the plan.”</text><rect x="500" y="122" width="370" height="90.03999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="514" y="152.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Quote directly or name the person: “The</text><text x="514" y="171.87" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">mayor told the engineer, ‘I will approve the</text><text x="514" y="191.67" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">plan.’”</text><line x1="456" y1="167.01999999999998" x2="494" y2="167.01999999999998" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="224.04" width="420" height="70.24000000000004" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="44" y="251.64" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Missing antecedent</text><text x="44" y="277.23" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“In the report <tspan font-weight="700">they</tspan> say the road is unsafe.”</text><rect x="500" y="224.04" width="370" height="70.24000000000004" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="514" y="264.01" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The report says the road is unsafe.”</text><line x1="456" y1="259.16" x2="494" y2="259.16" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="306.28000000000003" width="420" height="70.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="44" y="333.88000000000005" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Vague “this” or “which”</text><text x="44" y="359.47" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The shops closed early. <tspan font-weight="700">This</tspan> caused anger.”</text><rect x="500" y="306.28000000000003" width="370" height="70.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="514" y="346.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The early closing caused anger.”</text><line x1="456" y1="341.40000000000003" x2="494" y2="341.40000000000003" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="388.52000000000004" width="420" height="70.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="44" y="416.12000000000006" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Distant antecedent</text><text x="44" y="441.71000000000004" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a pronoun three sentences after its noun</text><rect x="500" y="388.52000000000004" width="370" height="70.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="514" y="428.49" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Repeat the noun or restructure</text><line x1="456" y1="423.64000000000004" x2="494" y2="423.64000000000004" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="474.76000000000005" width="840" height="74.23999999999995" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="506.36000000000007" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Habit:</tspan> follow “this”, “that” and “it” with a noun when the reference could be unclear: “This decision...”,</text><text x="450" y="527.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“That change...”.</text>
</svg>