<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same status, same form</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Faulty and deliberate parallelism</text>
<text x="30" y="146" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">✗ Faulty</text><rect x="150" y="122" width="105.74544" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="202.87272000000002" y="144.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">She enjoys</text><rect x="261.74544000000003" y="122" width="71.35168" height="34" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="297.42128" y="144.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">hiking,</text><rect x="339.09712" y="122" width="80.51456" height="34" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="379.3544" y="144.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">to swim</text><rect x="425.61168000000004" y="122" width="122.91760000000001" height="34" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="487.07048000000003" y="144.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and bicycles.</text><text x="30" y="194" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">✓ Parallel</text><rect x="150" y="170" width="105.74544" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="202.87272000000002" y="192.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">She enjoys</text><rect x="261.74544000000003" y="170" width="71.35168" height="34" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="297.42128" y="192.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">hiking,</text><rect x="339.09712" y="170" width="98.87328" height="34" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="388.53376000000003" y="192.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">swimming</text><rect x="443.97040000000004" y="170" width="114.36448" height="34" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="501.15264" y="192.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and cycling.</text><text x="30" y="258" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">✗ Faulty</text><rect x="150" y="234" width="117.77584" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="208.88792" y="256.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The plan will</text><rect x="273.77584" y="234" width="119.14368" height="34" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="333.34768" y="256.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">save money,</text><rect x="398.91952000000003" y="234" width="150.63696" height="34" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="474.23800000000006" y="256.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">improving safety</text><rect x="555.55648" y="234" width="188.55744" height="34" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="649.8352" y="256.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and to reduce delays.</text><text x="30" y="306" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">✓ Parallel</text><rect x="150" y="282" width="117.77584" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="208.88792" y="304.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The plan will</text><rect x="273.77584" y="282" width="119.14368" height="34" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="333.34768" y="304.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">save money,</text><rect x="398.91952000000003" y="282" width="136.41472" height="34" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="467.12688" y="304.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">improve safety</text><rect x="541.33424" y="282" width="168.6496" height="34" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="625.65904" y="304.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and reduce delays.</text><text x="30" y="356" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Deliberate parallelism</text><rect x="30" y="372" width="260" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="406.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Equality</tspan></text><rect x="300" y="372" width="570" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="314" y="399.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Life, Liberty and the pursuit of Happiness” <tspan font-style="italic">Declaration</tspan> <tspan font-style="italic">of</tspan></text><text x="314" y="420.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">Independence,</tspan> <tspan font-style="italic">1776</tspan></text><rect x="30" y="438" width="260" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="472.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Rhythm</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">equal</tspan> <tspan font-weight="700">weight</tspan></text><rect x="300" y="438" width="570" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="314" y="472.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“of the people, by the people, for the people” <tspan font-style="italic">Lincoln,</tspan> <tspan font-style="italic">1863</tspan></text><rect x="30" y="504" width="260" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="538.0400000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Contrast</tspan></text><rect x="300" y="504" width="570" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="314" y="538.0400000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“To err is human, to forgive, divine” <tspan font-style="italic">Pope,</tspan> <tspan font-style="italic">An</tspan> <tspan font-style="italic">Essay</tspan> <tspan font-style="italic">on</tspan> <tspan font-style="italic">Criticism,</tspan> <tspan font-style="italic">1711</tspan></text><rect x="30" y="570" width="260" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="597.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Cause</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">effect</tspan> <tspan font-weight="700">feel</tspan></text><text x="44" y="618.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">inevitable</tspan></text><rect x="300" y="570" width="570" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="314" y="604.0400000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“the harder the conflict, the more glorious the triumph” <tspan font-style="italic">Paine</tspan></text>
</svg>