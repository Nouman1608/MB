<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is it a magnet? Only repulsion proves it</text>

<rect x="30" y="110" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Magnetic: attracted by a magnet (common magnetic metals)</text><rect x="55" y="160" width="125" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="117" y="186" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">iron</text><rect x="190" y="160" width="125" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="252" y="186" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">steel</text><rect x="325" y="160" width="125" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="387" y="186" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">nickel</text><rect x="460" y="160" width="125" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="522" y="186" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">cobalt</text><text x="55" y="236" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Non-magnetic: a magnet has no effect</text><rect x="55" y="250" width="125" height="40" rx="8" fill="#f6e3d6" stroke="#b5602e" stroke-width="2" /><text x="117" y="276" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">copper</text><rect x="190" y="250" width="125" height="40" rx="8" fill="#f6e3d6" stroke="#b5602e" stroke-width="2" /><text x="252" y="276" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">aluminium</text><rect x="325" y="250" width="125" height="40" rx="8" fill="#f6e3d6" stroke="#b5602e" stroke-width="2" /><text x="387" y="276" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">brass</text><rect x="460" y="250" width="125" height="40" rx="8" fill="#f6e3d6" stroke="#b5602e" stroke-width="2" /><text x="522" y="276" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">wood</text><rect x="595" y="250" width="125" height="40" rx="8" fill="#f6e3d6" stroke="#b5602e" stroke-width="2" /><text x="657" y="276" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">plastic</text><rect x="730" y="250" width="125" height="40" rx="8" fill="#f6e3d6" stroke="#b5602e" stroke-width="2" /><text x="792" y="276" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">glass</text><rect x="30" y="325" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="359" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Bring each end of the test bar up to each pole of a known magnet</text><rect x="60" y="380" width="75" height="40" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5" /><rect x="135" y="380" width="75" height="40" rx="0" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5" /><text x="97.5" y="408" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><text x="172.5" y="408" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><rect x="330" y="380" width="150" height="40" rx="0" fill="#c9d0d0" stroke="#1e2a44" stroke-width="2.5" /><text x="405" y="407" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">test bar</text><text x="245" y="407" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">← →</text><text x="510" y="397" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repelled by either pole:</text><text x="510" y="421" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">it IS a magnet (like poles repel)</text><rect x="30" y="460" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="494" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Example: a steel bar is attracted to both ends of a bar magnet</text><rect x="60" y="515" width="75" height="40" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5" /><rect x="135" y="515" width="75" height="40" rx="0" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5" /><text x="97.5" y="543" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><text x="172.5" y="543" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><rect x="330" y="515" width="150" height="40" rx="0" fill="#c9d0d0" stroke="#1e2a44" stroke-width="2.5" /><text x="405" y="542" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">test bar</text><text x="245" y="542" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">→ ←</text><text x="510" y="532" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Attraction only: the magnet induces an</text><text x="510" y="556" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">unlike pole in the near end. Not a magnet.</text><rect x="30" y="595" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="632" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Attraction cannot prove an object is a magnet. Only repulsion can.</text>
</svg>