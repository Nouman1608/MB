<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why conflict starts, and what it leaves</text>

<text x="165" y="128" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Possible causes</text><text x="735" y="128" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Possible consequences</text><rect x="30" y="144" width="270" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="169.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Competition for scarce land,</text><text x="44" y="189.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">water or jobs</text><line x1="300" y1="173" x2="380" y2="309" stroke="#8a6d0d" stroke-width="2.5"/><rect x="30" y="212" width="270" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="237.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Unequal treatment of groups,</text><text x="44" y="257.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">real or perceived</text><line x1="300" y1="241" x2="380" y2="309" stroke="#8a6d0d" stroke-width="2.5"/><rect x="30" y="280" width="270" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="314.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Historical grievances</text><line x1="300" y1="309" x2="380" y2="309" stroke="#8a6d0d" stroke-width="2.5"/><rect x="30" y="348" width="270" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="382.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Political exclusion</text><line x1="300" y1="377" x2="380" y2="309" stroke="#8a6d0d" stroke-width="2.5"/><rect x="30" y="416" width="270" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="450.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Misinformation and rumours</text><line x1="300" y1="445" x2="380" y2="309" stroke="#8a6d0d" stroke-width="2.5"/><rect x="600" y="144" width="270" height="58" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="614" y="178.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">People forced to leave home</text><line x1="520" y1="309" x2="600" y2="173" stroke="#2e6b62" stroke-width="2.5"/><rect x="600" y="212" width="270" height="58" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="614" y="246.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Schooling interrupted</text><line x1="520" y1="309" x2="600" y2="241" stroke="#2e6b62" stroke-width="2.5"/><rect x="600" y="280" width="270" height="58" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="614" y="305.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Damage to homes, roads,</text><text x="614" y="325.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">hospitals</text><line x1="520" y1="309" x2="600" y2="309" stroke="#2e6b62" stroke-width="2.5"/><rect x="600" y="348" width="270" height="58" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="614" y="373.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Lasting distrust between</text><text x="614" y="393.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">communities</text><line x1="520" y1="309" x2="600" y2="377" stroke="#2e6b62" stroke-width="2.5"/><rect x="600" y="416" width="270" height="58" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="614" y="441.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Sometimes: new laws, peace</text><text x="614" y="461.0" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">deals, cooperation</text><line x1="520" y1="309" x2="600" y2="445" stroke="#2e6b62" stroke-width="2.5"/><rect x="380" y="264" width="140" height="90" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="317" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Conflict</text><text x="450" y="518" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Analysis links them into a chain</text><rect x="30" y="534" width="180" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="579.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Dispute over</text><text x="120" y="600.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">grazing land</text><line x1="216" y1="586" x2="244" y2="586" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="534" width="180" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="558.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Farmers and</text><text x="340" y="579.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">herders avoid</text><text x="340" y="600.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the shared</text><text x="340" y="621.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">market</text><line x1="436" y1="586" x2="464" y2="586" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="534" width="180" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="569.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Less trade</text><text x="560" y="590.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">between the</text><text x="560" y="611.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">groups</text><line x1="656" y1="586" x2="684" y2="586" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="534" width="180" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="780" y="569.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A reason to keep</text><text x="780" y="590.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the peace is</text><text x="780" y="611.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">lost</text>
</svg>