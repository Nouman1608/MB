<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a single ranking hides: the Global Peace Index</text>

<rect x="30" y="104" width="268" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Societal safety and</text><text x="164" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">security</text><rect x="316" y="104" width="268" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ongoing domestic and</text><text x="450" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">international conflict</text><rect x="602" y="104" width="268" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="736" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Militarisation</text><line x1="165" y1="188" x2="450" y2="246" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="188" x2="450" y2="246" stroke="#1e2a44" stroke-width="3"/><line x1="735" y1="188" x2="450" y2="246" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="246" x2="450" y2="268" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="270" y="288" width="360" height="92" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="324.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">One ranking of countries</text><text x="450" y="355.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Institute for Economics and Peace</text><rect x="30" y="398" width="408" height="132" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="455" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="480.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Same method across many countries</text><rect x="462" y="398" width="408" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="431" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">HIDDEN CHOICES</text><text x="482" y="456.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Which indicators? How weighted? How</text><text x="482" y="480.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">reliable is the data where</text><text x="482" y="504.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">reporting is hard?</text>
</svg>