<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 748" width="900" height="748" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="748" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Peace has stages: key terms</text>

<rect x="130" y="120" width="740" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="146" y="151.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ceasefire</text><text x="146" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An agreement to stop fighting, usually for a set time or while talks happen.</text><rect x="170" y="212" width="700" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="186" y="243.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Peacemaking</text><text x="186" y="271.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bringing the sides to an agreement, often by negotiation or mediation.</text><rect x="210" y="304" width="660" height="101" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="226" y="335.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Peacekeeping</text><text x="226" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Neutral forces or observers placed between sides to stop fighting starting</text><text x="226" y="384.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">again.</text><rect x="250" y="417" width="620" height="101" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="266" y="448.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Peacebuilding</text><text x="266" y="476.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Longer-term work on causes: rebuilding trust, institutions and the</text><text x="266" y="497.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">economy.</text><rect x="290" y="530" width="580" height="80" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="306" y="561.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reconciliation</text><text x="306" y="589.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rebuilding relationships between groups after conflict.</text><line x1="70" y1="120" x2="70" y2="602" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text transform="translate(55,371) rotate(-90)" text-anchor="middle" font-size="17" font-weight="700" fill="#2e6b62">stop the fighting → fix the causes</text><rect x="30" y="628" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="663.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mediation</text><text x="50" y="692.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A neutral third person helps the sides reach their own agreement. Peacemaking often uses</text><text x="50" y="714.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">it, and schools train students in peer mediation.</text>
</svg>