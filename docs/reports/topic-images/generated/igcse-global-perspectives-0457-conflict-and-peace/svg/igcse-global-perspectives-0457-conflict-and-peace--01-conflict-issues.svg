<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From “conflict and peace” to arguable issues</text>

<rect x="30" y="104" width="840" height="116" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT AN ISSUE</text><text x="50" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">“War causes suffering.”</text><text x="50" y="195.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Almost nobody disagrees, so there is nothing to analyse.</text><rect x="30" y="238" width="840" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="271" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GLOBAL</text><text x="50" y="296.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Should countries be allowed to sell weapons to governments involved in armed</text><text x="50" y="320.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">conflict?</text><rect x="30" y="358" width="840" height="108" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="391" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL</text><text x="50" y="416.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">After a civil conflict, should a country hold criminal trials or a truth</text><text x="50" y="440.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">commission?</text><rect x="30" y="478" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="511" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LOCAL</text><text x="50" y="536.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How can neighbours settle disputes over shared land or noise without</text><text x="50" y="560.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">involving the police?</text><rect x="30" y="604" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="637.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each issue is a question that people answer differently. That is what makes it usable.</text>
</svg>