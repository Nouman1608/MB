<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Should young people do national service?</text>

<rect x="30" y="104" width="408" height="159" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEANS FOR</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A defence ministry</text><text x="50" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Argues: keeps forces ready, builds</text><text x="65.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">national unity.</text><text x="50" y="238.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="238.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Why: its job is national security.</text><rect x="462" y="104" width="408" height="159" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LEANS AGAINST</text><text x="482" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A young person leaving school</text><text x="482" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Argues: it delays study and work.</text><text x="482" y="217.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Why: it affects their own plans directly.</text><rect x="30" y="281" width="408" height="159" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="314" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEANS FOR</text><text x="50" y="340.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">An employer</text><text x="50" y="368.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Argues: recruits return with discipline</text><text x="65.2" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and teamwork skills.</text><text x="50" y="415.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="415.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Why: it could gain more skilled workers.</text><rect x="462" y="281" width="408" height="159" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="314" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LEANS AGAINST</text><text x="482" y="340.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A peace campaign group</text><text x="482" y="368.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Argues: combat training makes violence</text><text x="497.2" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seem normal.</text><text x="482" y="415.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="415.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Why: its values put non-violence first.</text><rect x="30" y="458" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="494" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Vested interest</text><text x="50" y="523.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The defence ministry and the employer may have a vested interest: they gain if the policy</text><text x="50" y="545.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">happens. That is a reason to check their evidence, not to reject it.</text>
</svg>