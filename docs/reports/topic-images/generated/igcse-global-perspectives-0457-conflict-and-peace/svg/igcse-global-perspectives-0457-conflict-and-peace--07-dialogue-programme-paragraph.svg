<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating a charity’s success claim</text>

<rect x="30" y="104" width="840" height="86" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FICTIONAL TOWN: DIALOGUE CHARITY REPORT</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“Trust between the two communities rose sharply after our programme.”</text><rect x="30" y="208" width="170" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="251" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Knowledge</text><rect x="214" y="208" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="237.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The claim is supported by the charity’s own survey, showing trust</text><text x="230" y="259.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rising.</text><rect x="30" y="292" width="170" height="72" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="335" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Application</text><rect x="214" y="292" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="321.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The charity runs the programme and may need good results to keep its</text><text x="230" y="343.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">funding: a vested interest.</text><rect x="30" y="376" width="170" height="72" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="419" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Analysis</text><rect x="214" y="376" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="405.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The same people who ran the sessions ran the survey, so respondents may</text><text x="230" y="427.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">have said what organisers wanted.</text><rect x="30" y="460" width="170" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="503" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><rect x="214" y="460" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="489.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weaker than it looks. An independent body should repeat the survey,</text><text x="230" y="511.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">including residents who did not attend.</text><rect x="30" y="550" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="583.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The final step also suggests a way to test the claim, a skill the syllabus describes for</text><text x="50" y="605.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Question 2.</text>
</svg>