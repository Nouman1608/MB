<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Real actions: strengths and limitations</text>

<rect x="30" y="104" width="260" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Action (level)</text><rect x="290" y="104" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="302" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="580" y="104" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="592" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="30" y="150" width="260" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Mine Ban Treaty, 1997</text><text x="42" y="196.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(global)</text><rect x="290" y="150" width="290" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A shared rule and pressure on</text><text x="302" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">states to clear mines</text><rect x="580" y="150" width="290" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Binds only states that join;</text><text x="592" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">some major military powers have</text><text x="592" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not</text><rect x="30" y="235" width="260" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">UN peacekeeping (global)</text><rect x="290" y="235" width="290" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Neutral forces can reduce the</text><text x="302" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">chance of fighting restarting</text><rect x="580" y="235" width="290" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Depends on volunteered troops</text><text x="592" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and funding, and on the sides’</text><text x="592" y="302.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">consent</text><rect x="30" y="320" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="345.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Good Friday Agreement,</text><text x="42" y="366.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1998 (national)</text><rect x="290" y="320" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gave all main groups a peaceful</text><text x="302" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">political route</text><rect x="580" y="320" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shared institutions can stall</text><text x="592" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">when parties disagree</text><rect x="30" y="384" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="409.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Truth and Reconciliation</text><text x="42" y="430.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Commission (national)</text><rect x="290" y="384" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="409.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Victims heard publicly; a record</text><text x="302" y="430.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">created</text><rect x="580" y="384" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="409.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some victims felt amnesty denied</text><text x="592" y="430.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">them justice</text><rect x="30" y="448" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="473.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Peer mediation (local)</text><rect x="290" y="448" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="473.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cheap; students may listen to</text><text x="302" y="494.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">peers more readily</text><rect x="580" y="448" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="473.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unsuitable for serious violence</text><text x="592" y="494.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or big power imbalances</text><rect x="114.73750000000007" y="530" width="161.075" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="195.27500000000006" y="557.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Effectiveness</text><rect x="287.81250000000006" y="530" width="141.52499999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="358.57500000000005" y="557.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Feasibility</text><rect x="441.33750000000003" y="530" width="161.075" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="521.875" y="557.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Acceptability</text><rect x="614.4125" y="530" width="170.84999999999997" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="699.8375" y="557.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Sustainability</text><rect x="320.58750000000003" y="582" width="258.82499999999993" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="609.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Unintended consequences</text>
</svg>