 text-anchor="start">So the real figure could be higher.</text><text x="450" y="394" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A possible cause chain</text><rect x="30" y="412" width="249.33333333333334" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="154.66666666666669" y="458.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evening buses stop</text><text x="154.66666666666669" y="482.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">running</text><line x1="285.33333333333337" y1="466" x2="319.33333333333337" y2="466" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="412" width="249.33333333333334" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="446.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Older residents stop</text><text x="450.00000000000006" y="470.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">going to the</text><text x="450.00000000000006" y="494.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">centre’s events</text><line x1="580.6666666666667" y1="466" x2="614.6666666666667" y2="466" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="412" width="249.33333333333334" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745.3333333333334" y="458.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fewer chances to</text><text x="745.3333333333334" y="482.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">meet people</text>
