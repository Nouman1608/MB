<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Assessing a student-run culture club</text>

<rect x="30" y="104" width="840" height="85" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">ACTION</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Students of all backgrounds lead activities from their own traditions</text><rect x="30" y="207" width="408" height="185" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="240" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOR</text><text x="50" y="266.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Targets the cause</text><text x="50" y="294.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Newcomers meet others</text><text x="50" y="320.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Their background is valued</text><text x="50" y="346.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Costs little</text><rect x="462" y="207" width="408" height="185" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="240" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">AGAINST</text><text x="482" y="266.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Limits</text><text x="482" y="294.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Depends on committed student leaders</text><text x="482" y="320.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May attract mainly confident students</text><text x="482" y="346.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does not change attitudes of those who</text><text x="497.2" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">never attend</text><rect x="30" y="410" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="446" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="475.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Likely to help in the short term; works best alongside other actions.</text><rect x="52.0625" y="518" width="197.875" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="151" y="542.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Who carries it out?</text><rect x="261.9375" y="518" width="68.5" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="296.1875" y="542.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Cost</text><rect x="342.4375" y="518" width="137.5" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="411.1875" y="542.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">How quickly?</text><rect x="491.9375" y="518" width="146.125" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="565" y="542.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Who benefits?</text><rect x="650.0625" y="518" width="197.875" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="749" y="542.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Who might lose out?</text><rect x="307.9375" y="566" width="284.125" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="590.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">How would you know it worked?</text>
</svg>