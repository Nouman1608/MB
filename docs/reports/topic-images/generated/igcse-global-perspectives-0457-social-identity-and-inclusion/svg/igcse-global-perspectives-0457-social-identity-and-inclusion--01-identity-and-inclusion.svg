<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 696" width="900" height="696" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="696" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Identity, inclusion and belonging</text>

<line x1="225" y1="325" x2="225" y2="175" stroke="#2e6b62" stroke-width="2.5"/><circle cx="225" cy="175" r="54" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="225" y="181" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">family</text><line x1="225" y1="325" x2="354.9038105676658" y2="250" stroke="#2e6b62" stroke-width="2.5"/><circle cx="354.9038105676658" cy="250" r="54" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="354.9038105676658" y="256" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">language</text><line x1="225" y1="325" x2="354.9038105676658" y2="400" stroke="#2e6b62" stroke-width="2.5"/><circle cx="354.9038105676658" cy="400" r="54" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="354.9038105676658" y="406" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">nationality</text><line x1="225" y1="325" x2="225" y2="475" stroke="#2e6b62" stroke-width="2.5"/><circle cx="225" cy="475" r="54" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="225" y="481" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">age group</text><line x1="225" y1="325" x2="95.09618943233423" y2="400.00000000000006" stroke="#2e6b62" stroke-width="2.5"/><circle cx="95.09618943233423" cy="400.00000000000006" r="54" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="95.09618943233423" y="406.00000000000006" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">faith</text><line x1="225" y1="325" x2="95.0961894323342" y2="250" stroke="#2e6b62" stroke-width="2.5"/><circle cx="95.0961894323342" cy="250" r="54" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="95.0961894323342" y="256" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">school</text><circle cx="225" cy="325" r="62" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="225" y="321" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social</text><text x="225" y="343" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">identity</text><rect x="440" y="120" width="430" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="460" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INCLUSION</text><text x="460" y="178.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Everyone can take part fully</text><text x="460" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">in a community, school, workplace or society</text><rect x="440" y="242" width="430" height="110" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="460" y="275" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EXCLUSION</text><text x="460" y="300.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">People are left out</text><text x="460" y="328" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">by rules, attitudes, cost or physical barriers</text><rect x="440" y="364" width="430" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="460" y="397" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BELONGING</text><text x="460" y="422.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Feeling accepted as part of a group</text><text x="450" y="568" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Two contested ideas</text><rect x="30" y="586" width="408" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="619" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTEGRATION</text><text x="50" y="643.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Newcomers and residents mix and share</text><text x="50" y="665.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">common institutions</text><rect x="462" y="586" width="408" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="619" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MULTICULTURALISM</text><text x="482" y="643.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Groups keep and celebrate distinct</text><text x="482" y="665.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">identities within one society</text>
</svg>