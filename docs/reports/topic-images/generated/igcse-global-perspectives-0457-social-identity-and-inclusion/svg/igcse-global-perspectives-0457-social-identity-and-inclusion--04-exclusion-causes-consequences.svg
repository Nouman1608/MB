<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="564" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why people are left out, and what it costs</text>

<rect x="60.39999999999998" y="104" width="190.39999999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="155.59999999999997" y="130.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Physical barriers</text><rect x="262.79999999999995" y="104" width="70.8" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="298.19999999999993" y="130.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Cost</text><rect x="345.59999999999997" y="104" width="218" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="454.59999999999997" y="130.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Language differences</text><rect x="575.5999999999999" y="104" width="264" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="707.5999999999999" y="130.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Stereotypes and prejudice</text><rect x="180" y="156" width="319.2" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="339.6" y="182.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Rules designed for the majority</text><rect x="511.2" y="156" width="208.79999999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.6" y="182.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Lack of information</text><line x1="450" y1="212" x2="450" y2="242" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="470" y="236" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">exclusion</text><rect x="30" y="262" width="268" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="295" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDIVIDUALS</text><text x="50" y="320.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Loneliness, lower</text><text x="50" y="344.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">confidence</text><text x="50" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">missed education or jobs</text><rect x="316" y="262" width="268" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="295" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMUNITIES</text><text x="336" y="320.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Less trust between</text><text x="336" y="344.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">groups</text><text x="336" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">wasted talent</text><rect x="602" y="262" width="268" height="174" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="295" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COUNTRIES</text><text x="622" y="320.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lower output, social</text><text x="622" y="344.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">tension</text><text x="622" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">but where inclusion succeeds:</text><text x="622" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a wider range of skills and</text><text x="622" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ideas</text><rect x="30" y="454" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="487.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Consequences can be positive or negative and fall on different groups: say who is affected</text><text x="50" y="509.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and how.</text>
</svg>