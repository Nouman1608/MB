<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" width="900" height="574" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="574" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">School dress rules: four perspectives</text>

<line x1="320" y1="190" x2="369.25" y2="234.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="350.5" x2="369.25" y2="291.025" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="178" x2="530.75" y2="230.65" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="340" x2="530.75" y2="287.35" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="259" r="95" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="244.75" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">School dress</text><text x="450" y="266" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">and appearance</text><text x="450" y="287.25" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">rules</text><g transform="translate(0,1.5)"><rect x="30" y="104" width="290" height="169" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOME PARENTS AND TEACHERS</text><text x="46" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One identical uniform</text><text x="46" y="182.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">for all</text><text x="46" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Value: it reduces visible</text><text x="46" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">differences in wealth and</text><text x="46" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">background.</text><rect x="30" y="287" width="290" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="316" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A GOVERNMENT</text><text x="46" y="341.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Clear national rules</text><text x="46" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Every school can apply them the</text><text x="46" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">same way.</text></g><g transform="translate(0,0)"><rect x="580" y="104" width="290" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OTHER FAMILIES</text><text x="596" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Room for cultural dress</text><text x="596" y="182.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">or hairstyles</text><text x="596" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Part of a child’s identity and</text><text x="596" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heritage.</text><rect x="580" y="266" width="290" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="295" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STUDENTS</text><text x="596" y="320.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Appearance expresses who</text><text x="596" y="344.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">they are</text><text x="596" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May feel excluded if a</text><text x="596" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tradition is treated as untidy.</text></g><rect x="30" y="432" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="468" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Global level</text><text x="50" y="497.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">International documents set a principle of non-discrimination, but they do not settle how a</text><text x="50" y="519.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">school’s dress rules should be written.</text>
</svg>