<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="534" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is it an issue? Does it divide opinion?</text>

<rect x="40" y="121.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,132.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="104" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="132.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Discrimination is bad.”</text><text x="108" y="160.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Almost nobody disagrees: not an issue.</text><rect x="40" y="206.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,227.5 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="189" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="217.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Should school dress rules allow exceptions for cultural identity?</text><text x="108" y="245.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parents, students, teachers and governments give different answers.</text><rect x="30" y="282" width="180" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="312" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Level</text><rect x="210" y="282" width="660" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="222" y="312" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Example issue</text><rect x="30" y="328" width="180" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="354.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Global</text><rect x="210" y="328" width="660" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="354.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Should international agreements require countries to make public</text><text x="222" y="376.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">services accessible to disabled people?</text><rect x="30" y="394" width="180" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="420.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">National</text><rect x="210" y="394" width="660" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="420.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Should reserved places (quotas) be used to increase the presence of</text><text x="222" y="442.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">under-represented groups in public bodies?</text><rect x="30" y="460" width="180" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="486.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Local</text><rect x="210" y="460" width="660" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="486.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Can wheelchair users reach every building in our neighbourhood?</text>
</svg>