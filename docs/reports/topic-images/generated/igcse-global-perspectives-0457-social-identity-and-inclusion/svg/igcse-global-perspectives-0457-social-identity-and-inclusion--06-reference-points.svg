<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Strong reference points still have limits</text>

<rect x="30" y="104" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Source</text><rect x="320" y="104" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="332" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="610" y="104" width="260" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="622" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="30" y="150" width="290" height="106" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">UDHR (1948), Article 2</text><rect x="320" y="150" width="290" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="332" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Widely recognised: rights</text><text x="332" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">without distinction of race,</text><text x="332" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">colour, sex, language or</text><text x="332" y="238.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">religion</text><rect x="610" y="150" width="260" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="622" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A declaration: sets</text><text x="622" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">standards, does not force</text><text x="622" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">action</text><rect x="30" y="256" width="290" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="281.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">UN Convention on the Rights</text><text x="42" y="302.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">of Persons with Disabilities</text><text x="42" y="323.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(2006, in force 2008)</text><rect x="320" y="256" width="290" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="332" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A treaty states sign up to</text><rect x="610" y="256" width="260" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="622" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Signing does not show how</text><text x="622" y="302.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">well a country carries it</text><text x="622" y="323.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">out</text><rect x="30" y="341" width="290" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="366.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">SDG 10, target 10.2</text><rect x="320" y="341" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="332" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shows global priority on</text><text x="332" y="387.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inclusion of all by 2030</text><rect x="610" y="341" width="260" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="622" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A target is an aim, not</text><text x="622" y="387.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">evidence of progress</text><rect x="30" y="405" width="290" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="430.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">WHO: about 1.3 billion, 1 in</text><text x="42" y="451.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">6, with significant</text><text x="42" y="472.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">disability</text><rect x="320" y="405" width="290" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="332" y="430.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A respected international source</text><rect x="610" y="405" width="260" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="622" y="430.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Combines national data</text><text x="622" y="451.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">collected in different ways</text><rect x="30" y="508" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="544" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Worked judgement</text><text x="50" y="573.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Using “1 in 6 worldwide” to demand that every building in one town be fully accessible</text><text x="50" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">jumps from a global figure to a local decision. The source is credible; the reasoning is</text><text x="50" y="617.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">only partly supported.</text>
</svg>