<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Step 5: range, accuracy and a checking order</text>

<text x="450" y="132" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Use range you can control</text><rect x="40" y="260" width="260" height="150" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="294" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Emergent</text><text x="170" y="326" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">short, accurate sentences</text><text x="170" y="347" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">basic connectives</text><rect x="320" y="210" width="260" height="200" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="244" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Capable</text><text x="450" y="276" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">reasons; more than one</text><text x="450" y="297" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">time frame; some complex</text><text x="450" y="318" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">sentences</text><rect x="600" y="160" width="260" height="250" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="194" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Proficient</text><text x="730" y="226" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">precise word choice; varied</text><text x="730" y="247" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">structures; idiom used</text><text x="730" y="268" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">naturally</text><line x1="30" y1="412" x2="870" y2="412" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="440" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="476" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Checking order at the end</text><circle cx="76" cy="509" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="514.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="515" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Verbs: endings, tense, agreement</text><circle cx="76" cy="546" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="551.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="552" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Agreement: gender and number</text><circle cx="76" cy="583" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="588.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="589" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Word order: especially after connectives</text><circle cx="76" cy="620" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="625.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="626" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Spelling and accents</text><circle cx="76" cy="657" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="662.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="663" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Register: read it as the audience would</text><rect x="560" y="500" width="290" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="578" y="534" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Personal error list</text><text x="578" y="564" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">note your three most</text><text x="578" y="587" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">frequent errors and</text><text x="578" y="610" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">check for those first</text>
</svg>