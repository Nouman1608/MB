<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Step 1: decode the task</text>

<rect x="30" y="110" width="840" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="144" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Task</text><text x="55" y="172" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Email your head of school proposing a school repair café for sustainability</text><text x="55" y="195" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">week, using ideas from the Repair Café poster.</text><rect x="30" y="234" width="200" height="86" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Purpose</text><rect x="244" y="234" width="626" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="281" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">persuade (propose with reasons) and request support</text><rect x="30" y="334" width="200" height="86" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="384" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Audience</text><rect x="244" y="334" width="626" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="381" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">head of school, an adult in authority, so FORMAL register</text><rect x="30" y="434" width="200" height="86" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="484" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Text type</text><rect x="244" y="434" width="626" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">email: subject line, greeting, paragraphs, closing request,</text><text x="264" y="492" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sign-off</text><rect x="30" y="534" width="200" height="86" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="584" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Stimulus</text><rect x="244" y="534" width="626" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">free repairs, volunteers, everyday objects, 40 items saved;</text><text x="264" y="592" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hands stitching together; crossed-out bin</text><text x="450" y="660" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">You must add yourself: why it suits a school, and how it would run.</text>
</svg>