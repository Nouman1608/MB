<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Step 2: plan one job per paragraph</text>

<rect x="150" y="110" width="600" height="600" rx="10" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><rect x="150" y="110" width="600" height="44" rx="10" fill="#b5d3cf"/><text x="172" y="139" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Email plan: one job per paragraph</text><rect x="172" y="172" width="556" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="186" y="194" width="96" height="46" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="234" y="222.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Opening</text><text x="300" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">state why you are writing</text><text x="300" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sustainability week; you have an idea</text><rect x="172" y="276" width="556" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="186" y="298" width="96" height="46" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="234" y="326.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="300" y="314" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">explain the idea</text><text x="300" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what a repair café is; the Eastfield poster</text><rect x="172" y="380" width="556" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="186" y="402" width="96" height="46" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="234" y="430.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="300" y="418" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">give reasons</text><text x="300" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">less waste; practical skills; brings year</text><text x="300" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">groups and families together</text><rect x="172" y="484" width="556" height="90" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><rect x="186" y="506" width="96" height="46" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="234" y="534.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="300" y="522" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">answer an objection</text><text x="300" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cost and safety: free volunteers, teachers</text><text x="300" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">supervise, nothing electrical</text><rect x="172" y="588" width="556" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="186" y="610" width="96" height="46" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="234" y="638.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Close</text><text x="300" y="626" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">make the request</text><text x="300" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ask for a meeting or a trial date</text><text x="762" y="470" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">shows you</text><text x="762" y="489" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">thought about</text><text x="762" y="508" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">the reader</text><line x1="800" y1="530" x2="760" y2="560" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/>
</svg>