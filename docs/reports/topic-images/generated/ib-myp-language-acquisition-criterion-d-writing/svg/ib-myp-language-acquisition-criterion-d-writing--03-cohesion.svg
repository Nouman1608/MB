<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Step 3: linking ideas with cohesive devices</text>

<rect x="30" y="110" width="840" height="130" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weak cohesion: a list of separate facts</text><text x="52" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The café would be free. Volunteers would help. Students would learn skills.</text><text x="52" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families could come.</text><rect x="30" y="260" width="840" height="230" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="296" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Stronger cohesion: same ideas, now linked</text><text x="52" y="336" font-size="18" fill="#1e2a44">The café would be free, <tspan font-weight="700" fill="#8a6d0d">because</tspan> volunteers would do the repairs.</text><text x="52" y="366" font-size="18" fill="#1e2a44"><tspan font-weight="700" fill="#8a6d0d">This</tspan> would <tspan font-weight="700" fill="#8a6d0d">also</tspan> give students a chance to learn practical skills.</text><text x="52" y="396" font-size="18" fill="#1e2a44"><tspan font-weight="700" fill="#8a6d0d">Furthermore</tspan>, families could come along, <tspan font-weight="700" fill="#8a6d0d">so</tspan> the event would bring</text><text x="52" y="426" font-size="18" fill="#1e2a44">the whole school community together.</text><text x="52" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">highlighted: connectives and a reference word</text><rect x="30" y="512" width="160" height="84" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="110" y="544" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Adding</text><text x="110" y="572" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">furthermore, also</text><rect x="200" y="512" width="160" height="84" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="280" y="544" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Contrasting</text><text x="280" y="572" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">however</text><rect x="370" y="512" width="160" height="84" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="544" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Result</text><text x="450" y="572" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">therefore</text><rect x="540" y="512" width="160" height="84" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="620" y="544" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Example</text><text x="620" y="572" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">for example</text><rect x="710" y="512" width="160" height="84" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="790" y="544" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sequencing</text><text x="790" y="572" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">first, finally</text><text x="450" y="628" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">A connective must match the logic: however introduces a contrast, not an extra point.</text>
</svg>