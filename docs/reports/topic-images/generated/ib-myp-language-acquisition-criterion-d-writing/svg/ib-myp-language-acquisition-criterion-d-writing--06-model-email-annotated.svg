<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 785" width="900" height="785" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="785" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The model email, annotated</text>

<rect x="30" y="110" width="520" height="620" rx="10" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><rect x="46" y="128" width="8" height="52" rx="4" fill="#2e6b62"/><text x="66" y="148" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Subject: Proposal: a repair café for</text><text x="66" y="170" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">sustainability week</text><line x1="552" y1="146" x2="576" y2="146" stroke="#4a5568" stroke-width="2"/><rect x="580" y="124" width="290" height="64" rx="10" fill="#eaf3f1" stroke="#c9d6d4" stroke-width="1.8"/><text x="596" y="150" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">subject line</text><rect x="46" y="226" width="8" height="30" rx="4" fill="#2e6b62"/><text x="66" y="246" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Dear Ms Okafor, I am writing to propose an idea …</text><line x1="552" y1="244" x2="576" y2="244" stroke="#4a5568" stroke-width="2"/><rect x="580" y="222" width="290" height="64" rx="10" fill="#eaf3f1" stroke="#c9d6d4" stroke-width="1.8"/><text x="596" y="238" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">formal greeting; purpose</text><text x="596" y="258" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">stated</text><rect x="46" y="324" width="8" height="52" rx="4" fill="#d4b02e"/><text x="66" y="344" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Last month I visited the Repair Café … forty items</text><text x="66" y="366" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">were saved from the bin.</text><line x1="552" y1="342" x2="576" y2="342" stroke="#4a5568" stroke-width="2"/><rect x="580" y="320" width="290" height="64" rx="10" fill="#fbf6e0" stroke="#c9d6d4" stroke-width="1.8"/><text x="596" y="336" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">past tense; stimulus ideas</text><text x="596" y="356" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">reused, not copied</text><rect x="46" y="422" width="8" height="52" rx="4" fill="#d4b02e"/><text x="66" y="442" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">First … Second … Finally, such an event would</text><text x="66" y="464" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">bring students, parents and staff together …</text><line x1="552" y1="440" x2="576" y2="440" stroke="#4a5568" stroke-width="2"/><rect x="580" y="418" width="290" height="64" rx="10" fill="#fbf6e0" stroke="#c9d6d4" stroke-width="1.8"/><text x="596" y="434" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">sequencing + reference word;</text><text x="596" y="454" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">uses the image</text><rect x="46" y="520" width="8" height="52" rx="4" fill="#b5602e"/><text x="66" y="540" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">I understand that you may be concerned about cost</text><text x="66" y="562" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">and safety. However …</text><line x1="552" y1="538" x2="576" y2="538" stroke="#4a5568" stroke-width="2"/><rect x="580" y="516" width="290" height="64" rx="10" fill="#fbeee6" stroke="#c9d6d4" stroke-width="1.8"/><text x="596" y="532" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">answers an objection; contrast</text><text x="596" y="552" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">connective</text><rect x="46" y="618" width="8" height="52" rx="4" fill="#2e6b62"/><text x="66" y="638" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Would it be possible to meet next week …? Yours</text><text x="66" y="660" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">sincerely,</text><line x1="552" y1="636" x2="576" y2="636" stroke="#4a5568" stroke-width="2"/><rect x="580" y="614" width="290" height="64" rx="10" fill="#eaf3f1" stroke="#c9d6d4" stroke-width="1.8"/><text x="596" y="630" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">polite request; formal</text><text x="596" y="650" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">sign-off</text><text x="450" y="760" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">One job per paragraph, linked ideas, formal throughout, past to conditional.</text>
</svg>