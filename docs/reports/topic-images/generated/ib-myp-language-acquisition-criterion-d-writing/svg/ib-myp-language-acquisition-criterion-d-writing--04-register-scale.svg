<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Step 4: register is a scale</text>

<defs><linearGradient id="reg" x1="0" x2="1"><stop offset="0" stop-color="#f2e7b8"/><stop offset="1" stop-color="#b5d3cf"/></linearGradient></defs><rect x="40" y="130" width="820" height="30" rx="15" fill="url(#reg)" stroke="#1e2a44" stroke-width="2"/><text x="56" y="151" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">informal</text><text x="844" y="151" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">formal</text><circle cx="170" cy="145" r="11" fill="#1e2a44"/><line x1="170" y1="156" x2="170" y2="180" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="182" width="280" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Message to a friend</text><text x="170" y="244" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“We should totally do a repair</text><text x="170" y="265" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">café at school – it’d be so</text><text x="170" y="286" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">fun!”</text><circle cx="450" cy="145" r="11" fill="#1e2a44"/><line x1="450" y1="156" x2="450" y2="180" stroke="#1e2a44" stroke-width="2.5"/><rect x="310" y="182" width="280" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">School newsletter</text><text x="450" y="244" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“A repair café at school would</text><text x="450" y="265" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">be a fun and useful event.”</text><circle cx="730" cy="145" r="11" fill="#1e2a44"/><line x1="730" y1="156" x2="730" y2="180" stroke="#1e2a44" stroke-width="2.5"/><rect x="590" y="182" width="280" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Email to the head</text><text x="730" y="244" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“I would like to propose that</text><text x="730" y="265" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">the school hosts a repair café</text><text x="730" y="286" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">during sustainability week.”</text><rect x="270" y="356" width="290" height="40" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="415" y="381.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal</text><rect x="575" y="356" width="295" height="40" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="722.5" y="381.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal</text><rect x="30" y="406" width="225" height="44" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="44" y="434" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Greeting / sign-off</text><rect x="270" y="406" width="290" height="44" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="284" y="434" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">“Hi Sam” / “See you soon”</text><rect x="575" y="406" width="295" height="44" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="589" y="434" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">“Dear Ms Okafor” / “Yours sincerely”</text><rect x="30" y="458" width="225" height="44" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="44" y="486" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Address</text><rect x="270" y="458" width="290" height="44" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="284" y="486" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">familiar form</text><rect x="575" y="458" width="295" height="44" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="589" y="486" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">polite form, kept throughout</text><rect x="30" y="510" width="225" height="44" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="44" y="538" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Contractions</text><rect x="270" y="510" width="290" height="44" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="284" y="538" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">common (“I’d”)</text><rect x="575" y="510" width="295" height="44" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="589" y="538" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">avoided (“I would”)</text><rect x="30" y="562" width="225" height="44" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="44" y="590" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Vocabulary</text><rect x="270" y="562" width="290" height="44" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="284" y="590" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">“stop chucking stuff out”</text><rect x="575" y="562" width="295" height="44" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="589" y="590" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">“reduce waste”</text><rect x="30" y="614" width="225" height="44" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.8"/><text x="44" y="642" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Sentences</text><rect x="270" y="614" width="290" height="44" rx="8" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.5"/><text x="284" y="642" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">short, exclamations</text><rect x="575" y="614" width="295" height="44" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="589" y="642" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">complete, often longer</text><rect x="30" y="676" width="840" height="92" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="712" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Register drift</text><text x="52" y="742" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a formal email that ends “Anyway, let me know, thanks!”</text>
</svg>