<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 835" width="900" height="835" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="835" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which statute controls the clause?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Apply the Act that matches the parties</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="577" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="189" height="48" fill="#b5d3cf"/><rect x="219" y="124" width="325.5" height="48" fill="#b5d3cf"/><text x="233" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">UCTA 1977: business to business</text><rect x="544.5" y="124" width="325.5" height="48" fill="#d4b02e"/><text x="558.5" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">CRA 2015: trader and consumer</text><rect x="30" y="172" width="189" height="68" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Scope</text><rect x="219" y="172" width="325.5" height="68" fill="#ffffff"/><text x="233" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s1(3): business liability only</text><rect x="544.5" y="172" width="325.5" height="68" fill="#ffffff"/><text x="558.5" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s61 trader and consumer contracts; s2</text><text x="558.5" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">definitions</text><line x1="30" y1="240" x2="870" y2="240" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="240" width="189" height="68" fill="#dce9e7"/><text x="44" y="266.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Death or personal</text><text x="44" y="287.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">injury by negligence</text><rect x="219" y="240" width="325.5" height="68" fill="#f8faf9"/><text x="233" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s2(1): cannot be excluded</text><rect x="544.5" y="240" width="325.5" height="68" fill="#f8faf9"/><text x="558.5" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s65: cannot be excluded</text><line x1="30" y1="308" x2="870" y2="308" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="308" width="189" height="110" fill="#dce9e7"/><text x="44" y="334.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Other liability</text><rect x="219" y="308" width="325.5" height="110" fill="#ffffff"/><text x="233" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s2(2): other negligence liability only if</text><text x="233" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasonable. s3: reasonableness where</text><text x="233" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one party deals on the other’s written</text><text x="233" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">standard terms</text><rect x="544.5" y="308" width="325.5" height="110" fill="#ffffff"/><text x="558.5" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s31: cannot exclude or restrict the s9</text><text x="558.5" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to s11 rights. s57: cannot exclude s49</text><line x1="30" y1="418" x2="870" y2="418" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="418" width="189" height="131" fill="#dce9e7"/><text x="44" y="444.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The test</text><rect x="219" y="418" width="325.5" height="131" fill="#f8faf9"/><text x="233" y="444.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s11: fair and reasonable given the</text><text x="233" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">circumstances known to, or</text><text x="233" y="486.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contemplated by, the parties when the</text><text x="233" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contract was made</text><rect x="544.5" y="418" width="325.5" height="131" fill="#f8faf9"/><text x="558.5" y="444.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s62: unfair if, contrary to good faith, it</text><text x="558.5" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">causes a significant imbalance to the</text><text x="558.5" y="486.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consumer’s detriment; then not</text><text x="558.5" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">binding. s68: written terms must be</text><text x="558.5" y="528.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plain, intelligible and legible</text><line x1="30" y1="549" x2="870" y2="549" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="549" width="189" height="152" fill="#dce9e7"/><text x="44" y="575.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Cases</text><rect x="219" y="549" width="325.5" height="152" fill="#ffffff"/><text x="233" y="575.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Clause failed: <tspan font-style="italic">George</tspan> <tspan font-style="italic">Mitchell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Finney</tspan></text><text x="233" y="596.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Lock</tspan> <tspan font-style="italic">Seeds</tspan> (1983); <tspan font-style="italic">St</tspan> <tspan font-style="italic">Albans</tspan> <tspan font-style="italic">v</tspan></text><text x="233" y="617.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">International</tspan> <tspan font-style="italic">Computers</tspan> (1996).</text><text x="233" y="638.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Watford</tspan> <tspan font-style="italic">Electronics</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Sanderson</tspan></text><text x="233" y="659.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2001): equal businesses should</text><text x="233" y="680.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">usually allocate their own risks</text><rect x="544.5" y="549" width="325.5" height="152" fill="#ffffff"/></g><line x1="219" y1="124" x2="219" y2="701" stroke="#c9d6d4" stroke-width="1.5"/><line x1="544.5" y1="124" x2="544.5" y2="701" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="577" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="723" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="756.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> applying UCTA 1977 to a consumer contract, or the CRA 2015 to a sale between</text><text x="450" y="778.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">two businesses.</text>
</svg>