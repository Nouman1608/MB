<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 753" width="900" height="753" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="753" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Consumer Rights Act 2015: rights and remedies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Trader and consumer contracts</text>
<rect x="30" y="124" width="470" height="50" rx="14" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="265" y="154.38" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Goods</text><rect x="30" y="188" width="470" height="45" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s9</tspan> satisfactory quality</text><rect x="30" y="241" width="470" height="45" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s10</tspan> fit for a particular purpose made known</text><rect x="30" y="294" width="470" height="45" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="320.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s11</tspan> as described</text><text x="265" y="369" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">IF BREACHED</text><rect x="30" y="383" width="470" height="79" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="413.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Short-term right to reject (s20, s22)</text><text x="46" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Normally within 30 days; full refund</text><line x1="265" y1="467" x2="265" y2="497" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="502" width="470" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="532.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Repair or replacement (s23)</text><text x="46" y="560.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Within a reasonable time and without significant</text><text x="46" y="581.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inconvenience</text><line x1="265" y1="607" x2="265" y2="637" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="642" width="470" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="672.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Price reduction or final right to reject (s24)</text><text x="46" y="700.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">If repair or replacement is impossible or fails</text><rect x="530" y="124" width="340" height="50" rx="14" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="700" y="154.38" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Services</text><rect x="530" y="188" width="340" height="45" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="544" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s49</tspan> reasonable care and skill</text><rect x="530" y="241" width="340" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="544" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s52</tspan> reasonable time, where none is</text><text x="544" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fixed</text><text x="700" y="337" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">IF BREACHED</text><rect x="530" y="351" width="340" height="51" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="546" y="381.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Repeat performance (s55)</text><line x1="700" y1="407" x2="700" y2="437" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="530" y="442" width="340" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="546" y="472.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Price reduction (s56)</text><text x="546" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">If repeat performance is impossible, or</text><text x="546" y="521.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not done within a reasonable time and</text><text x="546" y="542.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">without significant inconvenience</text>
</svg>