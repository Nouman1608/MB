<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 703" width="900" height="703" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="703" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Written terms and their limits</text>

<rect x="30" y="100" width="380" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SIGNATURE</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A signer is bound, read or not</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">L’Estrange</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Graucob</tspan> (1934)</text><text x="220" y="244" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">BUT</text><line x1="220" y1="252" x2="220" y2="276" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="282" width="380" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="310" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EFFECT MISREPRESENTED</text><text x="46" y="341.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Curtis</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Chemical</tspan> <tspan font-style="italic">Cleaning</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Dyeing</tspan> <tspan font-style="italic">Co</tspan></text><text x="46" y="362.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1951): the assistant said the clause covered</text><text x="46" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">only beads and sequins, so the cleaners</text><text x="46" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">could not rely on the wider wording.</text><rect x="440" y="100" width="430" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="460" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PAROL EVIDENCE RULE</text><text x="460" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Oral or other outside evidence cannot add</text><text x="460" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">to, vary or contradict the writing</text><text x="460" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protects certainty</text><text x="655" y="268" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">BUT</text><line x1="655" y1="276" x2="655" y2="300" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="306" width="430" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="456" y="334" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOT THE WHOLE AGREEMENT</text><text x="456" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The rule does not apply where the writing was not</text><text x="456" y="386.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meant to contain the whole agreement.</text><rect x="440" y="417" width="430" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="456" y="445" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONDITION PRECEDENT</text><text x="456" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The contract was not to operate until an event</text><text x="456" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">happened: <tspan font-style="italic">Pym</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Campbell</tspan> (1856).</text><rect x="440" y="528" width="430" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="456" y="556" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COLLATERAL CONTRACT</text><text x="456" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">City</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Westminster</tspan> <tspan font-style="italic">Properties</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Mudd</tspan> (1959): a</text><text x="456" y="608.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lease banning residence, signed relying on an oral</text><text x="456" y="629.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">promise that the tenant could keep sleeping on the</text><text x="456" y="650.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">premises.</text>
</svg>