<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 853" width="900" height="853" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="853" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Model answer: Priya’s laptop</text>

<rect x="30" y="100" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">£900 laptop from TechHub Ltd. Salesperson: “This model runs for ten hours on one charge.”</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Receipt: “TechHub accepts no liability for battery performance.” After five weeks the battery lasts</text><text x="50" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">two hours.</text><line x1="60" y1="275" x2="60" y2="801" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="255" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="288.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Status of the statement</text><text x="122" y="318.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Specialist knowledge and importance: likely a term (<tspan font-style="italic">Dick</tspan> <tspan font-style="italic">Bentley</tspan>). Also part of the</text><text x="122" y="340.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">description.</text><circle cx="60" cy="309" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="317.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="375" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="408.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Implied terms</text><text x="122" y="438.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Consumer and trader (s2, s61). Two hours is arguably not satisfactory quality (s9:</text><text x="122" y="460.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">durability, usual purposes) and does not match the description (s11).</text><circle cx="60" cy="429" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="437.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="495" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="528.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Remedy</text><text x="122" y="558.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Five weeks is outside the 30-day short-term right to reject, so require repair or</text><text x="122" y="580.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">replacement (s23); if that fails, price reduction or final right to reject (s24).</text><circle cx="60" cy="549" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="557.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="615" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="648.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Exclusion clause</text><text x="122" y="678.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A receipt handed over after the sale is too late to be incorporated (<tspan font-style="italic">Olley</tspan>). Even if</text><text x="122" y="700.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">incorporated, s31 makes it not binding.</text><circle cx="60" cy="669" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="677.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="735" width="766" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="768.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="122" y="798.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The clause is ineffective.</text><circle cx="60" cy="778" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="786.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>