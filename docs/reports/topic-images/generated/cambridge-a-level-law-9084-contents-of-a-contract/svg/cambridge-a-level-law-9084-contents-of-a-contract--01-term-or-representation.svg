<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 736" width="900" height="736" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="736" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Term or representation?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The test is the parties’ objective intention</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="425" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="168" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Guide</text><rect x="198" y="124" width="336" height="48" fill="#d4b02e"/><text x="212" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Points to a TERM</text><rect x="534" y="124" width="336" height="48" fill="#b5d3cf"/><text x="548" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Points to a REPRESENTATION</text><rect x="30" y="172" width="168" height="110" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Importance</text><text x="44" y="219.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">attached</text><rect x="198" y="172" width="336" height="110" fill="#ffffff"/><text x="212" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Bannerman</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">White</tspan> (1861): buyer would</text><text x="212" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not buy hops treated with sulphur.</text><text x="212" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Couchman</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hill</tspan> (1947): oral assurance</text><text x="212" y="261.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the heifer was unserved</text><rect x="534" y="172" width="336" height="110" fill="#ffffff"/><line x1="30" y1="282" x2="870" y2="282" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="282" width="168" height="89" fill="#dce9e7"/><text x="44" y="308.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Timing</text><rect x="198" y="282" width="336" height="89" fill="#f8faf9"/><rect x="534" y="282" width="336" height="89" fill="#f8faf9"/><text x="548" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Routledge</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">McKay</tspan> (1954): motorcycle’s</text><text x="548" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">date stated a week before a written</text><text x="548" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contract that did not repeat it</text><line x1="30" y1="371" x2="870" y2="371" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="371" width="168" height="89" fill="#dce9e7"/><text x="44" y="397.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Special</text><text x="44" y="418.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">knowledge</text><rect x="198" y="371" width="336" height="89" fill="#ffffff"/><text x="212" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Dick</tspan> <tspan font-style="italic">Bentley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Harold</tspan> <tspan font-style="italic">Smith</tspan> <tspan font-style="italic">Motors</tspan></text><text x="212" y="418.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1965): a dealer who should have known</text><text x="212" y="439.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the true mileage</text><rect x="534" y="371" width="336" height="89" fill="#ffffff"/><text x="548" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Oscar</tspan> <tspan font-style="italic">Chess</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Williams</tspan> (1957): a private</text><text x="548" y="418.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">seller who relied on the logbook</text><line x1="30" y1="460" x2="870" y2="460" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="460" width="168" height="89" fill="#dce9e7"/><text x="44" y="486.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Invitation to</text><text x="44" y="507.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">verify</text><rect x="198" y="460" width="336" height="89" fill="#f8faf9"/><text x="212" y="486.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Schawel</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Reade</tspan> (1913): buyer told not</text><text x="212" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to bother examining a horse because it</text><text x="212" y="528.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was perfect</text><rect x="534" y="460" width="336" height="89" fill="#f8faf9"/><text x="548" y="486.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ecay</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Godfrey</tspan> (1947): seller told the</text><text x="548" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">buyer to have a boat surveyed</text></g><line x1="198" y1="124" x2="198" y2="549" stroke="#c9d6d4" stroke-width="1.5"/><line x1="534" y1="124" x2="534" y2="549" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="425" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="571" width="412" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="603" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IF A TERM PROVES UNTRUE</text><text x="50" y="629.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Breach of contract</text><text x="50" y="658.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Automatic claim; damages put the claimant</text><text x="50" y="679.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">where performance would have put them.</text><rect x="458" y="571" width="412" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="603" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IF A REPRESENTATION PROVES UNTRUE</text><text x="478" y="629.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not a breach</text><text x="478" y="658.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The claimant must prove misrepresentation, and</text><text x="478" y="679.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the remedies differ.</text>
</svg>