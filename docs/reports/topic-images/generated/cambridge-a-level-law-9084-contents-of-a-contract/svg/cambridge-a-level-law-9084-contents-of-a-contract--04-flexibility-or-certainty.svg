<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 539" width="900" height="539" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="539" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Classifying a term: flexibility or certainty?</text>

<rect x="30" y="100" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="134.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The label does not settle it</text><text x="50" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Schuler</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Wickman</tspan> <tspan font-style="italic">Machine</tspan> <tspan font-style="italic">Tool</tspan> <tspan font-style="italic">Sales</tspan> (1974): a clause called a “condition” required weekly visits to six</text><text x="50" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">named firms. The parties could not have meant that one missed visit allowed termination.</text><rect x="30" y="231" width="412" height="276" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="263" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INNOMINATE TERM: JUDGE THE EFFECT</text><text x="50" y="290.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Flexibility</text><text x="50" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hong</tspan> <tspan font-style="italic">Kong</tspan> <tspan font-style="italic">Fir</tspan> <tspan font-style="italic">Shipping</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Kawasaki</tspan> <tspan font-style="italic">Kisen</tspan> <tspan font-style="italic">Kaisha</tspan></text><text x="50" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1962): seaworthiness breached, but the delay</text><text x="50" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">did not deprive the charterers of substantially</text><text x="50" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the whole benefit, so no termination.</text><text x="50" y="411.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Applied to a sale of goods in <tspan font-style="italic">Cehave</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bremer</tspan>,</text><text x="50" y="432.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">The</tspan> <tspan font-style="italic">Hansa</tspan> <tspan font-style="italic">Nord</tspan> (1976).</text><text x="50" y="461.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Gain:</tspan> a party cannot escape a bad bargain over</text><text x="50" y="482.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a trivial breach.</text><rect x="458" y="231" width="412" height="276" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="263" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONDITION FIXED IN ADVANCE</text><text x="478" y="290.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Certainty</text><text x="478" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Bunge</tspan> <tspan font-style="italic">Corporation</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Tradax</tspan> <tspan font-style="italic">Export</tspan> (1981): a time</text><text x="478" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clause in a commercial contract treated as a</text><text x="478" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">condition.</text><text x="478" y="390.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Gain:</tspan> traders need to know at once whether they</text><text x="478" y="411.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can terminate.</text>
</svg>