<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" width="900" height="511" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="511" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Material deprivation and attainment</text>

<rect x="30" y="104" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Housing</text><text x="46" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Overcrowding leaves no quiet</text><text x="46" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">place to study; temporary</text><text x="46" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing means changing</text><text x="46" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schools.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Diet and health</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hunger and illness reduce</text><text x="331.3333333333333" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">concentration and increase</text><text x="331.3333333333333" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">absence.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hidden costs</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Uniforms, trips, books,</text><text x="616.6666666666666" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">devices and internet access.</text><rect x="30" y="290" width="269.3333333333333" height="191" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,340 L31.25,304.25 Q31.25,291.25 44.25,291.25 L285.0833333333333,291.25 Q298.0833333333333,291.25 298.0833333333333,304.25 L298.0833333333333,340 Z" fill="#f2e7b8"/><line x1="31.25" y1="340" x2="298.0833333333333" y2="340" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="320.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Paid work</text><text x="46" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Older pupils may work</text><text x="46" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">part-time or leave education</text><text x="46" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">early to earn.</text><rect x="315.3333333333333" y="290" width="269.3333333333333" height="191" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,340 L316.5833333333333,304.25 Q316.5833333333333,291.25 329.5833333333333,291.25 L570.4166666666666,291.25 Q583.4166666666666,291.25 583.4166666666666,304.25 L583.4166666666666,340 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="340" x2="583.4166666666666" y2="340" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="320.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">School choice</text><text x="331.3333333333333" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Houses near high-performing</text><text x="331.3333333333333" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schools cost more. Gewirtz,</text><text x="331.3333333333333" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ball and Bowe (1995):</text><text x="331.3333333333333" y="436.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">middle-class parents keep</text><text x="331.3333333333333" y="457.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">their advantage.</text><rect x="600.6666666666666" y="290" width="269.3333333333333" height="191" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,340 L601.9166666666666,304.25 Q601.9166666666666,291.25 614.9166666666666,291.25 L855.75,291.25 Q868.75,291.25 868.75,304.25 L868.75,340 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="340" x2="868.75" y2="340" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="320.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">But…</text><text x="616.6666666666666" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many poor children succeed,</text><text x="616.6666666666666" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and money also buys tutors,</text><text x="616.6666666666666" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">books and trips that build</text><text x="616.6666666666666" y="436.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cultural capital.</text>
</svg>