<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1011" width="900" height="1011" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1011" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Labelling and the self-fulfilling prophecy</text>

<rect x="30" y="104" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="163" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="170.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="143.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Teacher judges against the “ideal pupil”</text><text x="104" y="173.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Becker (1952): an image matching middle-class behaviour. Rist (1970): kindergarten</text><text x="104" y="195.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">tables by day eight, on appearance and background.</text><line x1="450" y1="226" x2="450" y2="262" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="268" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="327" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="334.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="307.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Label and placement</text><text x="104" y="337.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ball (1981): non-manual pupils more likely to reach the top band than working-class</text><text x="104" y="359.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pupils of similar ability.</text><line x1="450" y1="390" x2="450" y2="426" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="432" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="491" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="498.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="471.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Different treatment</text><text x="104" y="501.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lower bands meet lower expectations; triage writes some pupils off (Gillborn and</text><text x="104" y="523.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Youdell, 2000).</text><line x1="450" y1="554" x2="450" y2="590" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="596" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="655" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="662.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="635.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pupil responses</text><text x="104" y="665.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hargreaves (1967): low-stream delinquent subculture. Lacey (1970): differentiation and</text><text x="104" y="687.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">polarisation.</text><line x1="450" y1="718" x2="450" y2="754" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="760" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="67" cy="808" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="815.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="799.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The prophecy is fulfilled</text><text x="104" y="829.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The pupil comes to fit the label.</text><rect x="30" y="874" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="910" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not automatic</text><text x="56" y="939" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some pupils reject negative labels and work harder; Willis’s lads chose their culture</text><text x="56" y="961" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">partly because they expected manual work.</text>
</svg>