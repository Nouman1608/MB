<line x1="50" y1="250" x2="850" y2="250" stroke="#1e2a44" stroke-width="4"/><line x1="100" y1="192" x2="90" y2="238" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="108" width="140" height="84" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="100" y="136" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Perry</text><text x="100" y="157" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Preschool</text><text x="100" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1962–1967,</text><text x="100" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Michigan</text><circle cx="90" cy="250" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="275" y1="286" x2="134.0816326530612" y2="262" stroke="#1e2a44" stroke-width="2"/><rect x="205" y="286" width="140" height="84" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="275" y="314" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Head Start</text><text x="275" y="335" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">USA, War on</text><text x="275" y="355" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Poverty</text><circle cx="134.0816326530612" cy="250" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="192" x2="163.46938775510205" y2="238" stroke="#1e2a44" stroke-width="2"/><rect x="380" y="108" width="140" height="84" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="136" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Plowden Report</text><text x="450" y="157" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">“positive</text><text x="450" y="177" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">discrimination”</text><circle cx="163.46938775510205" cy="250" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="625" y1="286" x2="618.9795918367347" y2="262" stroke="#1e2a44" stroke-width="2"/><rect x="555" y="286" width="140" height="84" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="625" y="314" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sure Start;</text><text x="625" y="335" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">EAZs</text><text x="625" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">England and Wales</text><circle cx="618.9795918367347" cy="250" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="800" y1="192" x2="810" y2="238" stroke="#1e2a44" stroke-width="2"/><rect x="730" y="108" width="140" height="84" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="800" y="136" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pupil Premium</text><text x="800" y="157" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">money per pupil</text><circle cx="810" cy="250" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="30" y="400" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Perry Preschool: graduated high school by age 19</text><rect x="230" y="430" width="375.20000000000005" height="56" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="215" y="465" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Pre-school group</text><text x="617.2" y="467" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">67%</text><rect x="230" y="510" width="274.4" height="56" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="215" y="545" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Control group</text><text x="516.4" y="547" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">49%</text><rect x="30" y="616" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="652" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Did it work?</text><text x="56" y="681" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Head Start’s early IQ gains often faded, which Jensen used to argue IQ cannot be boosted;</text><text x="56" y="703" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Perry’s gains showed in life outcomes. Critics say many programmes assume a cultural deficit</text><text x="56" y="725" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and cannot offset wider inequality.</text>
