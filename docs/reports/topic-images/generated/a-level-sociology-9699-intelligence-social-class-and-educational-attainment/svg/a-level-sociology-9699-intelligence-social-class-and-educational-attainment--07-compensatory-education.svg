<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Compensatory education</text>

<line x1="50" y1="278" x2="850" y2="278" stroke="#1e2a44" stroke-width="4"/><line x1="105" y1="236" x2="90" y2="266" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="108" width="150" height="128" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="105" y="136" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Perry Preschool</text><text x="105" y="157" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1962–1967,</text><text x="105" y="177" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Michigan</text><circle cx="90" cy="278" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="277" y1="314" x2="134.0816326530612" y2="290" stroke="#1e2a44" stroke-width="2"/><rect x="202" y="314" width="150" height="128" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="277" y="342" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Head Start</text><text x="277" y="363" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(1965)</text><text x="277" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">USA, War on</text><text x="277" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Poverty</text><circle cx="134.0816326530612" cy="278" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="449" y1="236" x2="163.46938775510205" y2="266" stroke="#1e2a44" stroke-width="2"/><rect x="374" y="108" width="150" height="128" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="449" y="136" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Plowden Report</text><text x="449" y="157" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(1967)</text><text x="449" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">“positive</text><text x="449" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">discrimination”</text><circle cx="163.46938775510205" cy="278" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="621" y1="314" x2="618.9795918367347" y2="290" stroke="#1e2a44" stroke-width="2"/><rect x="546" y="314" width="150" height="128" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="621" y="342" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sure Start;</text><text x="621" y="363" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Education</text><text x="621" y="384" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Action Zones</text><text x="621" y="405" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(1998)</text><text x="621" y="426" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">England and Wales</text><circle cx="618.9795918367347" cy="278" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="793" y1="236" x2="810" y2="266" stroke="#1e2a44" stroke-width="2"/><rect x="718" y="108" width="150" height="128" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="793" y="136" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pupil Premium</text><text x="793" y="157" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(2011)</text><text x="793" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">money per</text><text x="793" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">disadvantaged</text><text x="793" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">pupil</text><circle cx="810" cy="278" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="30" y="490" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Perry Preschool: graduated high school by age 19</text><rect x="230" y="520" width="375.20000000000005" height="56" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="215" y="555" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Pre-school group</text><text x="617.2" y="557" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">67%</text><rect x="230" y="600" width="274.4" height="56" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="215" y="635" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Control group</text><text x="516.4" y="637" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">49%</text><rect x="30" y="682" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="718" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Did it work?</text><text x="56" y="747" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Head Start’s early IQ gains often faded, which Jensen used to argue IQ cannot be boosted;</text><text x="56" y="769" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Perry’s gains showed in life outcomes. Critics say many programmes assume a cultural</text><text x="56" y="791" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">deficit and cannot offset wider inequality.</text>
</svg>