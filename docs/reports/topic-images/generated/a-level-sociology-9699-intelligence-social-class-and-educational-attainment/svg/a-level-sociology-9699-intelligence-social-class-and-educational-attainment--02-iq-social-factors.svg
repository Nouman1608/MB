<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" width="900" height="511" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="511" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How social factors shape IQ scores</text>

<rect x="30" y="104" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural bias</text><text x="46" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Early eleven-plus items on</text><text x="46" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">household servants and</text><text x="46" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">classical composers favoured</text><text x="46" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">middle-class children.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Language</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tests in the school’s</text><text x="331.3333333333333" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">standard language favour</text><text x="331.3333333333333" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children who use it at home.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Test-wiseness</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Practice and coaching raise</text><text x="616.6666666666666" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scores.</text><rect x="30" y="290" width="269.3333333333333" height="191" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,340 L31.25,304.25 Q31.25,291.25 44.25,291.25 L285.0833333333333,291.25 Q298.0833333333333,291.25 298.0833333333333,304.25 L298.0833333333333,340 Z" fill="#b5d3cf"/><line x1="31.25" y1="340" x2="298.0833333333333" y2="340" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="320.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The Flynn effect</text><text x="46" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Average scores rose across</text><text x="46" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">many countries in the 20th</text><text x="46" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">century (Flynn, 1987: 14</text><text x="46" y="436.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nations). Genes do not change</text><text x="46" y="457.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">that fast.</text><rect x="315.3333333333333" y="290" width="269.3333333333333" height="191" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,340 L316.5833333333333,304.25 Q316.5833333333333,291.25 329.5833333333333,291.25 L570.4166666666666,291.25 Q583.4166666666666,291.25 583.4166666666666,304.25 L583.4166666666666,340 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="340" x2="583.4166666666666" y2="340" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="320.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Flawed research</text><text x="331.3333333333333" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kamin (1974) questioned</text><text x="331.3333333333333" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Burt’s twin data; Hearnshaw</text><text x="331.3333333333333" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1979): most post-war data</text><text x="331.3333333333333" y="436.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unreliable or fraudulent.</text><rect x="600.6666666666666" y="290" width="269.3333333333333" height="191" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,340 L601.9166666666666,304.25 Q601.9166666666666,291.25 614.9166666666666,291.25 L855.75,291.25 Q868.75,291.25 868.75,304.25 L868.75,340 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="340" x2="868.75" y2="340" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="320.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“Culture-fair” tests?</text><text x="616.6666666666666" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Non-verbal puzzles still</text><text x="616.6666666666666" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reward skills practised at</text><text x="616.6666666666666" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">home and in school.</text>
</svg>