<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" width="900" height="643" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What is intelligence?</text>

<rect x="30" y="108" width="268" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">One general ability</text><text x="164" y="168" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Spearman (1904)</text><circle cx="164" cy="240" r="38" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="164" y="251" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">g</text><line x1="140" y1="280" x2="84" y2="330" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="62" y="334" width="44" height="30" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="155.9" y1="280" x2="137" y2="330" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="115" y="334" width="44" height="30" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="172.1" y1="280" x2="191" y2="330" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="169" y="334" width="44" height="30" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="188" y1="280" x2="244" y2="330" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="222" y="334" width="44" height="30" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="164" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">different tests</text><text x="164" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Scores on different tests</text><text x="164" y="453" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">correlate.</text><rect x="316" y="108" width="268" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Multiple intelligences</text><text x="450" y="168" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Gardner (1983)</text><rect x="350" y="188" width="200" height="34" rx="17" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="211" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">linguistic</text><rect x="350" y="232" width="200" height="34" rx="17" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="255" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">logical-mathematical</text><rect x="350" y="276" width="200" height="34" rx="17" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="299" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">musical</text><rect x="350" y="320" width="200" height="34" rx="17" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="343" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">spatial</text><text x="450" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">schools reward only some</text><text x="450" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Hard to test, so difficult to</text><text x="450" y="453" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">check.</text><rect x="602" y="108" width="268" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Triarchic theory</text><text x="736" y="168" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Sternberg (1985)</text><path d="M736,205 L831,355 L641,355 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="736" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">analytical</text><text x="641" y="376" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">creative</text><text x="831" y="376" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">practical</text><text x="736" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Three kinds of intelligence.</text><rect x="30" y="508" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="544" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gould, The Mismeasure of Man (1981)</text><text x="56" y="573" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">IQ and g are <tspan font-weight="700">reifications</tspan>: a number is mistaken for a real quality inside the head. If</text><text x="56" y="595" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">definitions differ, a test measures only the version its designers chose.</text>
</svg>