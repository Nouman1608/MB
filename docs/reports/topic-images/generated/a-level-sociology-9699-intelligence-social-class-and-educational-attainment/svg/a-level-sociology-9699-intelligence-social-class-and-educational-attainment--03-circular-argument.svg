<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 732" width="900" height="732" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="732" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Does intelligence explain attainment?</text>

<rect x="285" y="132" width="330" height="76" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="166" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">IQ tests</text><text x="450" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">judged valid…</text><rect x="285" y="432" width="330" height="76" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="450" y="466" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">School success</text><text x="450" y="492" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">…explained by IQ</text><path d="M620,175 C750,220 750,420 622,462" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="735" y="300" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">because they</text><text x="735" y="322" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">predict it</text><path d="M280,465 C150,420 150,220 278,178" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="165" y="300" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">then used</text><text x="165" y="322" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">to explain it</text><rect x="330" y="296" width="240" height="68" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="324" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">But class shapes</text><text x="450" y="348" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">both scores and results</text><rect x="30" y="540" width="412" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,590 L31.25,554.25 Q31.25,541.25 44.25,541.25 L427.75,541.25 Q440.75,541.25 440.75,554.25 L440.75,590 Z" fill="#f2e7b8"/><line x1="31.25" y1="590" x2="440.75" y2="590" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="570.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hereditarian view</text><text x="44" y="621.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Jensen (1969):</tspan> about 80% of IQ variation</text><text x="44" y="642.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">genetic. <tspan font-weight="700">Herrnstein and Murray (1994):</tspan> a</text><text x="44" y="663.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“cognitive elite”.</text><rect x="458" y="540" width="412" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,590 L459.25,554.25 Q459.25,541.25 472.25,541.25 L855.75,541.25 Q868.75,541.25 868.75,554.25 L868.75,590 Z" fill="#dce9e7"/><line x1="459.25" y1="590" x2="868.75" y2="590" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="570.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Critics</text><text x="472" y="621.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Heritability within a group says nothing about</text><text x="472" y="642.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">why groups differ; middle-class scores may</text><text x="472" y="663.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reflect resources, language and test</text><text x="472" y="684.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">familiarity.</text>
</svg>