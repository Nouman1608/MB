<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cultural explanations of class differences</text>

<text x="30" y="128" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Bernstein (1971): speech codes</text>

<rect x="30" y="140" width="416" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="238" y="167.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Restricted code</text><rect x="454" y="140" width="416" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="662" y="167.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Elaborated code</text><rect x="30" y="192" width="416" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="223.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Short, context-bound, relies on shared</text><text x="44" y="245.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">understanding</text><rect x="454" y="192" width="416" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="223.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explicit, detailed, context-free; used by</text><text x="468" y="245.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">schools and more by middle-class children</text>
<text x="30" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Not inferior: Bernstein denied offering a deficit account.</text><rect x="30" y="320" width="404" height="264" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,370 L31.25,334.25 Q31.25,321.25 44.25,321.25 L419.75,321.25 Q432.75,321.25 432.75,334.25 L432.75,370 Z" fill="#f2e7b8"/><line x1="31.25" y1="370" x2="432.75" y2="370" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="351" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural deprivation</text><rect x="466" y="320" width="404" height="264" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,370 L467.25,334.25 Q467.25,321.25 480.25,321.25 L855.75,321.25 Q868.75,321.25 868.75,334.25 L868.75,370 Z" fill="#b5d3cf"/><line x1="467.25" y1="370" x2="868.75" y2="370" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="351" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural capital</text><text x="232" y="400" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">the home lacks something</text><text x="668" y="400" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">the school rewards one class’s culture</text><circle cx="55" cy="428.72" r="4.5" fill="#2e6b62"/><text x="68" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Douglas (1964):</tspan> parental attitudes</text><circle cx="55" cy="457.72" r="4.5" fill="#2e6b62"/><text x="68" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hyman; Sugarman:</tspan> values such as immediate</text><text x="68" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gratification</text><circle cx="55" cy="507.72" r="4.5" fill="#2e6b62"/><text x="68" y="513" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Keddie (1973):</tspan> different, not deprived</text><circle cx="491" cy="428.72" r="4.5" fill="#2e6b62"/><text x="504" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bourdieu and Passeron:</tspan> middle-class culture</text><text x="504" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rewarded as if natural ability</text><circle cx="491" cy="478.72" r="4.5" fill="#2e6b62"/><text x="504" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Lareau (2003):</tspan> concerted cultivation versus</text><text x="504" y="505" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">natural growth</text><circle cx="491" cy="528.72" r="4.5" fill="#2e6b62"/><text x="504" y="534" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Sullivan (2001):</tspan> a direct class effect</text><text x="504" y="555" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">remained</text><circle cx="450" cy="443" r="24" fill="#1e2a44"/><text x="450" y="450" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text>
</svg>