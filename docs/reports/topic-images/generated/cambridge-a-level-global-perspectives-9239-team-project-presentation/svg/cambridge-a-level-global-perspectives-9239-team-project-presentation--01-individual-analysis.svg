<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Your individual analysis of the problem</text>

<rect x="300" y="110" width="300" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="146.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Team problem statement</text><text x="450" y="173.17000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">agreed by the whole team</text><line x1="450" y1="182" x2="450" y2="210" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="236" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Your individual analysis answers:</text><rect x="30" y="254" width="410" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="319" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="325.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="82" y="254" width="358" height="130" rx="12" fill="none" stroke="none" stroke-width="2.2"/><text x="100" y="290.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What exactly is the problem</text><text x="100" y="315.13" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">locally?</text><text x="100" y="342.25" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Who is affected, how, and how do we</text><text x="100" y="363.37" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">know?</text><rect x="460" y="254" width="410" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="490" cy="319" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="490" y="325.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="512" y="254" width="358" height="130" rx="12" fill="none" stroke="none" stroke-width="2.2"/><text x="530" y="313.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What causes it?</text><text x="530" y="340.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Causes are what a solution must act on.</text><rect x="30" y="398" width="410" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="463" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="469.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="82" y="398" width="358" height="130" rx="12" fill="none" stroke="none" stroke-width="2.2"/><text x="100" y="446.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How is it globally relevant?</text><text x="100" y="473.67" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Show the same problem, or the same</text><text x="100" y="494.79" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cause, elsewhere.</text><rect x="460" y="398" width="410" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="490" cy="463" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="490" y="469.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="512" y="398" width="358" height="130" rx="12" fill="none" stroke="none" stroke-width="2.2"/><text x="530" y="444.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What does your perspective</text><text x="530" y="469.63" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">highlight?</text><text x="530" y="496.75" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">It shapes which causes you emphasise.</text><text x="30" y="560" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">What different perspectives ask about</text><rect x="30" y="576" width="266" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="163" y="606" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic</text><text x="163" y="632" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">costs and incentives</text><rect x="317" y="576" width="266" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="606" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Environmental</text><text x="450" y="632" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">harm and sustainability</text><rect x="604" y="576" width="266" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="737" y="606" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social</text><text x="737" y="632" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">who gains and loses</text>
</svg>