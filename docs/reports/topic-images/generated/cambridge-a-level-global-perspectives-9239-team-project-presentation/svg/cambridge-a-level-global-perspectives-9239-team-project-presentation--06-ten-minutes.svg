<rect width="900" height="513" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Organising ten minutes</text>

<line x1="60" y1="300" x2="60" y2="310" stroke="#1e2a44" stroke-width="2"/><text x="60" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><line x1="136" y1="300" x2="136" y2="310" stroke="#1e2a44" stroke-width="2"/><text x="136" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">1</text><line x1="212" y1="300" x2="212" y2="310" stroke="#1e2a44" stroke-width="2"/><text x="212" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2</text><line x1="288" y1="300" x2="288" y2="310" stroke="#1e2a44" stroke-width="2"/><text x="288" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">3</text><line x1="364" y1="300" x2="364" y2="310" stroke="#1e2a44" stroke-width="2"/><text x="364" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">4</text><line x1="440" y1="300" x2="440" y2="310" stroke="#1e2a44" stroke-width="2"/><text x="440" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">5</text><line x1="516" y1="300" x2="516" y2="310" stroke="#1e2a44" stroke-width="2"/><text x="516" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">6</text><line x1="592" y1="300" x2="592" y2="310" stroke="#1e2a44" stroke-width="2"/><text x="592" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">7</text><line x1="668" y1="300" x2="668" y2="310" stroke="#1e2a44" stroke-width="2"/><text x="668" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">8</text><line x1="744" y1="300" x2="744" y2="310" stroke="#1e2a44" stroke-width="2"/><text x="744" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">9</text><line x1="820" y1="300" x2="820" y2="310" stroke="#1e2a44" stroke-width="2"/><text x="820" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">10</text><text x="842" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">min</text><rect x="60" y="220" width="133" height="80" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="126.5" y="268" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1.5–2 min</text><line x1="126.5" y1="158" x2="126.5" y2="220" stroke="#4a5568" stroke-width="1.5"/><text x="126.5" y="130.88" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Problem: locally and</text><text x="126.5" y="152" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">globally</text><rect x="193" y="220" width="152" height="80" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="269" y="268" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2 min</text><line x1="269" y1="194" x2="269" y2="220" stroke="#4a5568" stroke-width="1.5"/><text x="269" y="188" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Perspective and causes</text><rect x="345" y="220" width="171" height="80" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="430.5" y="268" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2–2.5 min</text><line x1="430.5" y1="158" x2="430.5" y2="220" stroke="#4a5568" stroke-width="1.5"/><text x="430.5" y="130.88" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Research with source</text><text x="430.5" y="152" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">evaluation</text><rect x="516" y="220" width="228" height="80" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="630" y="268" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3 min</text><line x1="630" y1="194" x2="630" y2="220" stroke="#4a5568" stroke-width="1.5"/><text x="630" y="188" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Solution and justification</text><rect x="744" y="220" width="76" height="80" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="782" y="268" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1 min</text><line x1="782" y1="158" x2="782" y2="220" stroke="#4a5568" stroke-width="1.5"/><text x="782" y="152" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Conclusion</text><line x1="820" y1="200" x2="820" y2="312" stroke="#b5602e" stroke-width="4"/><text x="850" y="362" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">beyond 10 minutes: not assessed</text><rect x="30" y="410" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="441.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">One sensible plan, not a syllabus requirement. The solution gets the largest share: that is</text><text x="450" y="463.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">where research becomes argument.</text>
</svg>