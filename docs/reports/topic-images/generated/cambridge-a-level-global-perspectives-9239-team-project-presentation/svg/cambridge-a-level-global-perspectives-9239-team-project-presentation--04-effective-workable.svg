<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" width="900" height="454" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="454" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two tests: effective and workable</text>

<rect x="30" y="115" width="410" height="230" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="54" y="160.85" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Effective?</text><text x="54" y="190.60999999999999" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• Does it act on the causes you</text><text x="54" y="214.36999999999998" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">identified?</text><text x="54" y="238.13" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• What evidence shows it would reduce</text><text x="54" y="261.89" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">the problem?</text><text x="54" y="285.65" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• By how much?</text><rect x="460" y="115" width="410" height="230" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="484" y="160.85" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Workable?</text><text x="484" y="190.60999999999999" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• Who would carry it out?</text><text x="484" y="214.36999999999998" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• What would it cost, and who would pay?</text><text x="484" y="238.13" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• How long would it take?</text><text x="484" y="261.89" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• Would the people affected accept it?</text><circle cx="450" cy="380" r="0"/><rect x="30" y="370" width="840" height="55.08" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="403.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Justification: show your solution passes both tests better than the alternatives.</text>
</svg>