<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Anatomy of a justification passage</text>

<text x="450" y="100" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle" font-style="italic">Problem: canteen food is thrown away while some local families cannot afford enough to eat</text><rect x="30" y="120" width="840" height="68.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="160.12" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">States the solution</text><text x="282" y="148" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">six secondary schools give unsold canteen food daily to the community</text><text x="282" y="169.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">food bank, collected by its volunteers on an agreed route</text><rect x="30" y="198.24" width="840" height="68.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="238.36" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Links to the cause</text><text x="282" y="226.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schools pay to dispose of food because there is no simple way to pass</text><text x="282" y="247.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it on</text><rect x="30" y="276.48" width="840" height="89.36" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="327.16" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluates sources</text><text x="282" y="304.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">food bank records: local, the only record of capacity, checked with</text><text x="282" y="325.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the coordinator; a comparable city’s study, but it had paid drivers,</text><text x="282" y="346.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so volunteers may collect less</text><rect x="30" y="375.84000000000003" width="840" height="68.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="415.96000000000004" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tests workability</text><text x="282" y="403.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cost to schools is lower than disposal, which is why the speaker</text><text x="282" y="424.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expects headteachers to accept it</text><rect x="30" y="454.08000000000004" width="840" height="68.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="494.20000000000005" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Compares an alternative</text><text x="282" y="482.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a teammate’s menu change is better for the environment but does</text><text x="282" y="503.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nothing for families this year</text><rect x="30" y="532.32" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="567.32" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Reasoned preference</text><text x="282" y="565.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on economic criteria, redistribution gives more benefit for less cost</text><text x="450" y="616.32" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Economic perspective; details invented for illustration.</text>
</svg>