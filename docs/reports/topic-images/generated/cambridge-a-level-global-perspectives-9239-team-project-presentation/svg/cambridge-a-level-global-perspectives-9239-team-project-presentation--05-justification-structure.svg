<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 663" width="900" height="663" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="663" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A six-step justification</text>

<rect x="30" y="110" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="142" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="149.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="112" y="149" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">State the solution precisely</text><text x="480" y="149" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">who does what, where</text><rect x="30" y="184" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="216" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="223.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="112" y="223" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Link it to the cause</text><text x="480" y="223" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the cause it addresses</text><rect x="30" y="258" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="72" cy="290" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="72" y="297.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="112" y="297" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Give the evidence that it works</text><text x="480" y="297" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from your research, with its limits</text><rect x="30" y="332" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="72" cy="364" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="72" y="371.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="112" y="371" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Show it is workable</text><text x="480" y="371" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cost, responsibility, timescale, acceptance</text><rect x="30" y="406" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="438" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="445.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="112" y="445" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Compare briefly with an alternative</text><text x="480" y="445" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">why yours is better on your perspective’s criteria</text><rect x="30" y="480" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="512" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="519.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="112" y="519" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Answer the strongest objection</text><rect x="30" y="560" width="840" height="74.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="591.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Acknowledging a teammate’s alternative and explaining why you still prefer yours can</text><text x="450" y="613.59" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">strengthen your justification.</text>
</svg>