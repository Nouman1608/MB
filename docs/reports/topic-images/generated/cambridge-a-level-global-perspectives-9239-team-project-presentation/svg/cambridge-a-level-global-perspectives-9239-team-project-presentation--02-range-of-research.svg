<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 543" width="900" height="543" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="543" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Range of research: two scales, several types</text>

<rect x="30" y="115" width="410" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Local evidence</text><text x="48" y="181.39" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">data from local authorities or</text><text x="48" y="203.82999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">organisations; observations; interviews you</text><text x="48" y="226.26999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">carry out (with consent and attention to</text><text x="48" y="248.70999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">safety)</text><rect x="460" y="115" width="410" height="170" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="478" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Global evidence</text><text x="478" y="181.39" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">studies or reports on the same problem</text><text x="478" y="203.82999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">elsewhere, and especially on solutions that</text><text x="478" y="226.26999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">have been tried</text><text x="450" y="326" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Across both scales, more than one type of evidence:</text><rect x="30" y="344" width="266" height="72" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="163" y="374" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Data</text><text x="163" y="400" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">for scale</text><rect x="317" y="344" width="266" height="72" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="374" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Expert analysis</text><text x="450" y="400" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">for explanation</text><rect x="604" y="344" width="266" height="72" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="737" y="374" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Case studies</text><text x="737" y="400" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">for what has worked</text><rect x="30" y="440" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="471.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The most useful global research is evidence about what happened when someone tried your</text><text x="450" y="493.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">solution, ideally in a comparable place.</text>
</svg>