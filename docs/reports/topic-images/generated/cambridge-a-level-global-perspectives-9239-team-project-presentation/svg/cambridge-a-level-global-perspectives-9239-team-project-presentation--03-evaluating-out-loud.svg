<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating sources out loud</text>

<rect x="30" y="120" width="400" height="250" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="120" width="400" height="40" rx="10" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><text x="50" y="147" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">On the slide</text><rect x="60" y="180" width="200" height="110" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="80" y="220" width="26" height="70" rx="2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="120" y="240" width="26" height="50" rx="2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="160" y="205" width="26" height="85" rx="2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="200" y="250" width="26" height="40" rx="2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="280" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the evidence</text><text x="280" y="228" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(e.g. a chart)</text><rect x="52" y="308" width="356" height="44" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="230" y="336" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">full reference</text><path d="M470,120 L870,120 L870,330 L560,330 L520,370 L525,330 L470,330 Z" fill="#eaf3f1" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="494" y="152" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">In what you say</text><text x="494" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the evaluative point, in one sentence</text><text x="494" y="212" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“This figure comes from the council’s own</text><text x="494" y="234.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">survey of every household, so it is the</text><text x="494" y="256.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">most complete local data available.”</text><rect x="30" y="400" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="430" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Both appear in the verbatim transcript.</text><text x="450" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Short enough to say in a sentence, clear enough to follow by ear.</text>
</svg>