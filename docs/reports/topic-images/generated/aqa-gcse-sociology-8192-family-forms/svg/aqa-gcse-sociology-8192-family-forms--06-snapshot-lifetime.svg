<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621" width="900" height="621" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="621" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Diversity: a snapshot or a lifetime?</text>

<rect x="30" y="108" width="404" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,158 Z" fill="#f2e7b8"/><line x1="31.25" y1="158" x2="432.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A snapshot of households</text><rect x="52" y="184" width="112" height="56" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="108" y="218" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">nuclear</text><rect x="176" y="184" width="112" height="56" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="232" y="218" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">lone parent</text><rect x="300" y="184" width="112" height="56" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="356" y="218" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">empty nest</text><rect x="52" y="254" width="112" height="56" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="108" y="288" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">reconstituted</text><rect x="176" y="254" width="112" height="56" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="232" y="288" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">single sex</text><rect x="300" y="254" width="112" height="56" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="356" y="288" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">nuclear</text><rect x="52" y="324" width="112" height="56" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="108" y="358" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">cohabiting</text><rect x="176" y="324" width="112" height="56" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="232" y="358" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">extended</text><rect x="300" y="324" width="112" height="56" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="356" y="358" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">nuclear</text><text x="232" y="440" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Diversity looks great</text><rect x="466" y="108" width="404" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,158 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#b5d3cf"/><line x1="467.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">One person’s lifetime</text><rect x="490" y="184" width="356" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="668" y="220" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Couple with young children</text><text x="668" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">nuclear (often neo-conventional: both work)</text><line x1="668" y1="272" x2="668" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="490" y="304" width="356" height="84" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="668" y="340" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Children leave home</text><text x="668" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">empty nest family</text><text x="668" y="440" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Most pass through a nuclear family</text><rect x="30" y="486" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="522" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Chester (1985)</text><text x="56" y="551" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Most people still spend part of their lives in a nuclear family, so diversity may be greater</text><text x="56" y="573" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">in a snapshot of households than across people’s lifetimes.</text>
</svg>