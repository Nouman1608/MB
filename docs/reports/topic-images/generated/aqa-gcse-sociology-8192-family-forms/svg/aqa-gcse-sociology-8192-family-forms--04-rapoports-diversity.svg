<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 821" width="900" height="821" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="821" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Rapoports: five types of diversity</text>

<line x1="450" y1="330" x2="150" y2="175" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 6"/><line x1="450" y1="330" x2="750" y2="175" stroke="#8a6d0d" stroke-width="4"/><line x1="450" y1="330" x2="150" y2="485" stroke="#8a6d0d" stroke-width="4"/><line x1="450" y1="330" x2="750" y2="485" stroke="#8a6d0d" stroke-width="4"/><line x1="450" y1="330" x2="450" y2="590" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="15" y="129" width="270" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="150" y="161" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Organisational</text><text x="150" y="187" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Internal structure, e.g. division</text><text x="150" y="207" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">of labour</text><rect x="615" y="129" width="270" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="750" y="161" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural</text><text x="750" y="187" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Beliefs and values, often</text><text x="750" y="207" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">ethnicity or religion</text><rect x="15" y="439" width="270" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="150" y="471" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><text x="150" y="497" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Resources from class position</text><rect x="615" y="439" width="270" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="750" y="471" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Life course</text><text x="750" y="497" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Stage in the family life cycle</text><rect x="315" y="544" width="270" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="576" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cohort</text><text x="450" y="602" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">The historical period lived</text><text x="450" y="622" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">through</text><circle cx="450" cy="330" r="105" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="450" y="298" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A working-class</text><text x="450" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Bangladeshi family</text><text x="450" y="342" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">with teenage</text><text x="450" y="364" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">children</text><text x="450" y="112" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">The types overlap: this one family shows three at once</text><rect x="30" y="656" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="692" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="715.39" r="4.5" fill="#8a6d0d"/><text x="74" y="721" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“British families in transition” (1982) predates gay and lesbian households becoming more</text><text x="74" y="743" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">open and accepted, so the typology needs updating for single sex families</text><circle cx="61" cy="767.39" r="4.5" fill="#8a6d0d"/><text x="74" y="773" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use one type at a time, but recognise that real families combine them</text>
</svg>