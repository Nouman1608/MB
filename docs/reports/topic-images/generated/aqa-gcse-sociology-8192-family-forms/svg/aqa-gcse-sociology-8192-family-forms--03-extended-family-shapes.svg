<rect x="30" y="108" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L425.75,109.25 Q438.75,109.25 438.75,122.25 L438.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="438.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="235" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Vertically extended</text><rect x="150" y="170" width="170" height="134" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="235" cy="193.1" r="6.82" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><path d="M224,214 Q224,200.8 235,200.8 Q246,200.8 246,214 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><circle cx="235" cy="235.1" r="6.82" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M224,256 Q224,242.8 235,242.8 Q246,242.8 246,256 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="235" cy="273" r="6.2" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M225,292 Q225,280 235,280 Q245,280 245,292 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="48" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Three or more generations living together</text><rect x="460" y="108" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M461.25,158 L461.25,122.25 Q461.25,109.25 474.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#dce9e7"/><line x1="461.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="665" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Horizontally extended</text><rect x="530" y="200" width="270" height="96" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="560" cy="253.2" r="7.4399999999999995" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M548,276 Q548,261.6 560,261.6 Q572,261.6 572,276 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="600" cy="253.2" r="7.4399999999999995" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M588,276 Q588,261.6 600,261.6 Q612,261.6 612,276 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="640" cy="253.2" r="7.4399999999999995" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M628,276 Q628,261.6 640,261.6 Q652,261.6 652,276 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="690" cy="253.2" r="7.4399999999999995" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M678,276 Q678,261.6 690,261.6 Q702,261.6 702,276 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="730" cy="253.2" r="7.4399999999999995" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M718,276 Q718,261.6 730,261.6 Q742,261.6 742,276 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="770" cy="253.2" r="7.4399999999999995" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M758,276 Q758,261.6 770,261.6 Q782,261.6 782,276 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="478" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kin of the same generation, e.g. a brother and</text><text x="478" y="345" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">his wife living with his sister’s family</text><rect x="30" y="394" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,444 L31.25,408.25 Q31.25,395.25 44.25,395.25 L425.75,395.25 Q438.75,395.25 438.75,408.25 L438.75,444 Z" fill="#f2e7b8"/><line x1="31.25" y1="444" x2="438.75" y2="444" stroke="#c9d6d4" stroke-width="2"/><text x="235" y="425" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Modified extended</text><rect x="106" y="504" width="68" height="56" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="140" cy="533" r="6.2" fill="#b5d3cf" str