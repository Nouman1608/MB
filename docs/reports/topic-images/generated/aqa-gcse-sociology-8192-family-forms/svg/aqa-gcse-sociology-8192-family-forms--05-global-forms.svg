<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 855" width="900" height="855" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="855" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Family forms in a global context</text>

<rect x="320" y="108" width="260" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="138" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marriage</text><text x="450" y="162" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"></text><path d="M450,168 L450,190 L230,190 L230,212" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M450,190 L670,190 L670,212" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="40" y="214" width="380" height="120" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="244" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Monogamy</text><text x="230" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">One partner at a time; the only legal form in</text><text x="230" y="288" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the UK (bigamy is a crime)</text><rect x="480" y="214" width="380" height="120" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="670" y="244" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Polygamy</text><text x="670" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">More than one partner at the same time</text><path d="M230,334 L230,360" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="40" y="362" width="380" height="112" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="392" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Serial monogamy</text><text x="230" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">A series of monogamous relationships; more</text><text x="230" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">common with divorce and remarriage</text><path d="M670,334 L670,346 L572,346 L572,362" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M670,346 L768,346 L768,362" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="479" y="362" width="186" height="140" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="572" y="392" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Polygyny</text><text x="572" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">One husband, two or</text><text x="572" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">more wives; legal in</text><text x="572" y="456" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a number of countries</text><rect x="675" y="362" width="186" height="140" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="768" y="392" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Polyandry</text><text x="768" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">One wife, two or more</text><text x="768" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">husbands; rarer: some</text><text x="768" y="456" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Himalayan communities</text><text x="450" y="528" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Other forms beyond the UK pattern</text><rect x="30" y="540" width="269.3333333333333" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,590 L31.25,554.25 Q31.25,541.25 44.25,541.25 L285.0833333333333,541.25 Q298.0833333333333,541.25 298.0833333333333,554.25 L298.0833333333333,590 Z" fill="#dce9e7"/><line x1="31.25" y1="590" x2="298.0833333333333" y2="590" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="570.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Extended families</text><text x="44" y="620.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">More common in many societies:</text><text x="44" y="640.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">pooling labour on the land and</text><text x="44" y="660.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">caring for elders with little</text><text x="44" y="680.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">state welfare</text><rect x="315.3333333333333" y="540" width="269.3333333333333" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,590 L316.5833333333333,554.25 Q316.5833333333333,541.25 329.5833333333333,541.25 L570.4166666666666,541.25 Q583.4166666666666,541.25 583.4166666666666,554.25 L583.4166666666666,590 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="590" x2="583.4166666666666" y2="590" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="570.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The kibbutz</text><text x="329.3333333333333" y="620.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Early Israeli kibbutzim:</text><text x="329.3333333333333" y="640.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">children often slept in</text><text x="329.3333333333333" y="660.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">communal children’s houses;</text><text x="329.3333333333333" y="680.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">child rearing shared</text><rect x="600.6666666666666" y="540" width="269.3333333333333" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,590 L601.9166666666666,554.25 Q601.9166666666666,541.25 614.9166666666666,541.25 L855.75,541.25 Q868.75,541.25 868.75,554.25 L868.75,590 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="590" x2="868.75" y2="590" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="570.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Matriarchal families</text><text x="614.6666666666666" y="620.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Headed by women, who hold</text><text x="614.6666666666666" y="640.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">authority over the household</text><rect x="30" y="720" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="756" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it matters</text><text x="56" y="785" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">These examples challenge Murdock’s claim that the nuclear family is universal, and show that</text><text x="56" y="807" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">family forms are social constructs shaped by law, religion and economics.</text>
</svg>