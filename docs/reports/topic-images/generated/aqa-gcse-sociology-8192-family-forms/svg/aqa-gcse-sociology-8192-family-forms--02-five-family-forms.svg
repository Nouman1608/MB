<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The five family forms</text>

<rect x="30" y="108" width="270" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L285.75,109.25 Q298.75,109.25 298.75,122.25 L298.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="298.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="165" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Nuclear</text><circle cx="135" cy="209.5" r="9.3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M120,238 Q120,220 135,220 Q150,220 150,238 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="195" cy="209.5" r="9.3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M180,238 Q180,220 195,220 Q210,220 210,238 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><line x1="151" y1="232" x2="179" y2="232" stroke="#1e2a44" stroke-width="2.5"/><line x1="165" y1="232" x2="165" y2="258" stroke="#1e2a44" stroke-width="2.5"/><circle cx="143" cy="269" r="6.2" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M133,288 Q133,276 143,276 Q153,276 153,288 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="187" cy="269" r="6.2" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M177,288 Q177,276 187,276 Q197,276 197,288 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="46" y="322" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Two generations: a couple and</text><text x="46" y="342" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">their dependent children</text><rect x="315" y="108" width="270" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.25,158 L316.25,122.25 Q316.25,109.25 329.25,109.25 L570.75,109.25 Q583.75,109.25 583.75,122.25 L583.75,158 Z" fill="#dce9e7"/><line x1="316.25" y1="158" x2="583.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Extended</text><circle cx="426" cy="193.2" r="7.4399999999999995" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><path d="M414,216 Q414,201.6 426,201.6 Q438,201.6 438,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><circle cx="474" cy="193.2" r="7.4399999999999995" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><path d="M462,216 Q462,201.6 474,201.6 Q486,201.6 486,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><circle cx="426" cy="233.5" r="9.3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M411,262 Q411,244 426,244 Q441,244 441,262 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="474" cy="233.5" r="9.3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M459,262 Q459,244 474,244 Q489,244 489,262 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="432" cy="279" r="6.2" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M422,298 Q422,286 432,286 Q442,286 442,298 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="468" cy="279" r="6.2" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M458,298 Q458,286 468,286 Q478,286 478,298 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="331" y="322" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Includes kin beyond the nuclear</text><text x="331" y="342" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">unit, e.g. grandparents living</text><text x="331" y="362" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">with children and grandchildren</text><rect x="600" y="108" width="270" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.25,158 L601.25,122.25 Q601.25,109.25 614.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="601.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="735" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Reconstituted</text><circle cx="705" cy="209.5" r="9.3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M690,238 Q690,220 705,220 Q720,220 720,238 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="765" cy="209.5" r="9.3" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.2"/><path d="M750,238 Q750,220 765,220 Q780,220 780,238 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.2"/><line x1="721" y1="232" x2="749" y2="232" stroke="#1e2a44" stroke-width="2.5"/><circle cx="695" cy="269" r="6.2" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M685,288 Q685,276 695,276 Q705,276 705,288 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="735" cy="269" r="6.2" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.2"/><path d="M725,288 Q725,276 735,276 Q745,276 745,288 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.2"/><circle cx="775" cy="269" r="6.2" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.2"/><path d="M765,288 Q765,276 775,276 Q785,276 785,288 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.2"/><text x="807" y="238" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">step</text><text x="616" y="322" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">One or both partners have</text><text x="616" y="342" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">children from a previous</text><text x="616" y="362" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">relationship; step-parents and</text><text x="616" y="382" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">step-siblings</text><rect x="30" y="423" width="270" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,473 L31.25,437.25 Q31.25,424.25 44.25,424.25 L285.75,424.25 Q298.75,424.25 298.75,437.25 L298.75,473 Z" fill="#dce9e7"/><line x1="31.25" y1="473" x2="298.75" y2="473" stroke="#c9d6d4" stroke-width="2"/><text x="165" y="454" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Lone parent</text><circle cx="165" cy="524.5" r="9.3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M150,553 Q150,535 165,535 Q180,535 180,553 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="143" cy="584" r="6.2" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M133,603 Q133,591 143,591 Q153,591 153,603 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="187" cy="584" r="6.2" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M177,603 Q177,591 187,591 Q197,591 197,603 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="46" y="637" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">One parent with dependent</text><text x="46" y="657" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">children; most UK lone parent</text><text x="46" y="677" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">families are headed by mothers</text><rect x="315" y="423" width="270" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.25,473 L316.25,437.25 Q316.25,424.25 329.25,424.25 L570.75,424.25 Q583.75,424.25 583.75,437.25 L583.75,473 Z" fill="#b5d3cf"/><line x1="316.25" y1="473" x2="583.75" y2="473" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="454" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Single sex</text><circle cx="420" cy="524.5" r="9.3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M405,553 Q405,535 420,535 Q435,535 435,553 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="480" cy="524.5" r="9.3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M465,553 Q465,535 480,535 Q495,535 495,553 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><line x1="436" y1="547" x2="464" y2="547" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="584" r="6.2" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M440,603 Q440,591 450,591 Q460,591 460,603 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="331" y="637" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Headed by a same-sex couple,</text><text x="331" y="657" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">with or without children (civil</text><text x="331" y="677" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">partnership 2004; marriage from</text><text x="331" y="697" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">2014)</text><rect x="600" y="423" width="270" height="300" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="616" y="457" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Other key terms</text><circle cx="621" cy="485.885" r="4.5" fill="#8a6d0d"/><text x="634" y="491" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Cohabitation:</tspan> living</text><text x="634" y="511" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">together unmarried</text><circle cx="621" cy="533.885" r="4.5" fill="#8a6d0d"/><text x="634" y="539" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Empty nest:</tspan> children have</text><text x="634" y="559" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">left home</text><circle cx="621" cy="581.885" r="4.5" fill="#8a6d0d"/><text x="634" y="587" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Commune:</tspan> sharing property</text><text x="634" y="607" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">and child rearing</text>
</svg>