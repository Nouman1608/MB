<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Family or household?</text>

<ellipse cx="320" cy="330" rx="270" ry="205" fill="#b5d3cf" fill-opacity="0.6" stroke="#1e2a44" stroke-width="3"/><ellipse cx="580" cy="330" rx="270" ry="205" fill="#f2e7b8" fill-opacity="0.8" stroke="#1e2a44" stroke-width="3"/><text x="190" y="180" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Household</text><text x="190" y="208" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">same address, sharing</text><text x="190" y="228" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">facilities such as a</text><text x="190" y="248" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">kitchen</text><text x="710" y="180" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Family</text><text x="710" y="208" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">linked by kinship,</text><text x="710" y="228" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">marriage, civil</text><text x="710" y="248" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">partnership or</text><text x="710" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">cohabitation</text><circle cx="150" cy="311.5" r="9.3" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M135,340 Q135,322 150,322 Q165,322 165,340 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><circle cx="190" cy="311.5" r="9.3" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M175,340 Q175,322 190,322 Q205,322 205,340 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><circle cx="230" cy="311.5" r="9.3" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M215,340 Q215,322 230,322 Q245,322 245,340 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="190" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">Student house share</tspan>:</text><text x="190" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">household, not family</text><circle cx="710" cy="311.5" r="9.3" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M695,340 Q695,322 710,322 Q725,322 725,340 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="710" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">Grandmother two streets</tspan></text><text x="710" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">away</tspan>: family, not</text><text x="710" y="422" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">household</text><circle cx="430" cy="291.5" r="9.3" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><path d="M415,320 Q415,302 430,302 Q445,302 445,320 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><circle cx="470" cy="291.5" r="9.3" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><path d="M455,320 Q455,302 470,302 Q485,302 485,320 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><circle cx="440" cy="333" r="6.2" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M430,352 Q430,340 440,340 Q450,340 450,352 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="462" cy="333" r="6.2" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M452,352 Q452,340 462,340 Q472,340 472,352 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">Couple and children at</tspan></text><text x="450" y="421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">home</tspan>: both</text><rect x="30" y="552" width="840" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="450" y="589" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">So a single-person household is not a “family form”.</text>
</svg>