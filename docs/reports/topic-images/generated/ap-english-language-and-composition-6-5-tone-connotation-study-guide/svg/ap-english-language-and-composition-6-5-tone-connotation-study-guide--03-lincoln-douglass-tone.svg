<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two speeches, two tones</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each tone fits a different purpose and situation</text>
<text x="235" y="134" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Lincoln, Second Inaugural (1865)</text><rect x="30" y="148" width="410" height="150" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="198.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“With malice toward none, with charity for all, with</text><text x="44" y="217.95000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">firmness in the right as God gives us to see the</text><text x="44" y="237.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">right, let us strive on... to bind up the nation’s</text><text x="44" y="257.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">wounds...”</text><rect x="30" y="312" width="410" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="343.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Words:</tspan> “malice toward none”, “charity for all”, “bind</text><text x="42" y="363.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">up the nation’s wounds”</text><line x1="235" y1="387" x2="235" y2="399" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="400" width="410" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="431.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Connotations:</tspan> generosity, forgiveness, healing;</text><text x="42" y="451.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">humility in “as God gives us to see the right”</text><line x1="235" y1="475" x2="235" y2="487" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="488" width="410" height="74" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="529.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Tone:</tspan> conciliatory and humble; solemn, not vengeful</text><line x1="235" y1="563" x2="235" y2="575" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="576" width="410" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="617.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Purpose:</tspan> call a divided nation to reconciliation</text><text x="665" y="134" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Douglass, Rochester (1852)</text><rect x="460" y="148" width="410" height="150" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="474" y="208.05" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“To him, your celebration is a sham; your boasted</text><text x="474" y="227.85000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">liberty, an unholy license; your national greatness,</text><text x="474" y="247.65" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">swelling vanity.”</text><rect x="460" y="312" width="410" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="472" y="343.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Words:</tspan> “sham”, “boasted”, “unholy license”,</text><text x="472" y="363.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“swelling vanity”</text><line x1="665" y1="387" x2="665" y2="399" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="460" y="400" width="410" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="472" y="431.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Connotations:</tspan> a negative judgement on each thing</text><text x="472" y="451.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the audience is proud of</text><line x1="665" y1="475" x2="665" y2="487" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="460" y="488" width="410" height="74" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="472" y="519.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Tone:</tspan> scornful and indignant, controlled by</text><text x="472" y="539.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">balanced phrasing</text><line x1="665" y1="563" x2="665" y2="575" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="460" y="576" width="410" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="472" y="607.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Purpose:</tspan> make celebrants face the contradiction</text><text x="472" y="627.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">with slavery</text>
</svg>