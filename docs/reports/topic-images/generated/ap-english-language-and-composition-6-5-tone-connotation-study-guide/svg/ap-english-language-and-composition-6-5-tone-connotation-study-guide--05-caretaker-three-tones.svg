<rect width="900" height="470" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Changing tone, keeping the facts</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: “The caretaker repaired the roof on Tuesday.”</text>
<rect x="250" y="122" width="400" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="159.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Neutral</text><text x="450" y="187.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“The caretaker repaired the roof on Tuesday.”</text><path d="M380,214 C330,242 240,232 232,266" fill="none" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><path d="M520,214 C570,242 660,232 668,266" fill="none" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="30" y="272" width="405" height="168" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="306" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Respectful, appreciative</text><text x="48" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“On Tuesday, our caretaker <tspan font-weight="700">kindly</tspan> repaired the</text><text x="48" y="355.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">roof, and we are <tspan font-weight="700">grateful</tspan> for his <tspan font-weight="700">patient</tspan> work.”</text><rect x="465" y="272" width="405" height="168" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="483" y="306" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Sarcastic</text><text x="483" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“On Tuesday, the caretaker <tspan font-weight="700">finally</tspan> <tspan font-weight="700">managed</tspan> to</text><text x="483" y="355.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">repair the roof, <tspan font-weight="700">only</tspan> three weeks after it</text><text x="483" y="376.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">started to leak.”</text><text x="483" y="397.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">“only”</tspan> <tspan font-style="italic">is</tspan> <tspan font-style="italic">ironic;</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">three</tspan> <tspan font-style="italic">weeks</tspan> <tspan font-style="italic">would</tspan> <tspan font-style="italic">need</tspan> <tspan font-style="italic">to</tspan></text><text x="483" y="418.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">be</tspan> <tspan font-style="italic">true</tspan></text>
</svg>