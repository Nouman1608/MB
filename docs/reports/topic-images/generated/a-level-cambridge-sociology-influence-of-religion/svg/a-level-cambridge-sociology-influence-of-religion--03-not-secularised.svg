<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="632" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Has religion really lost its significance?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four arguments that it has not</text>
<rect x="30" y="120" width="412" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L427.75,121.25 Q440.75,121.25 440.75,134.25 L440.75,170 Z" fill="#b5d3cf"/><line x1="31.25" y1="170" x2="440.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Believing without belonging</text><text x="46" y="203.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Davie (1994)</text><text x="46" y="232.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Belief persists even where attendance</text><text x="46" y="253.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">declines.</text><rect x="458" y="120" width="412" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,170 L459.25,134.25 Q459.25,121.25 472.25,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#b5d3cf"/><line x1="459.25" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Religious market theory</text><text x="474" y="203.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Stark and Bainbridge (1985)</text><text x="474" y="232.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Demand is constant; decline in one</text><text x="474" y="253.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">organisation is matched by growth elsewhere,</text><text x="474" y="274.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and competition revitalises religion (the</text><text x="474" y="295.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">USA).</text><rect x="30" y="335" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,385 L31.25,349.25 Q31.25,336.25 44.25,336.25 L427.75,336.25 Q440.75,336.25 440.75,349.25 L440.75,385 Z" fill="#b5d3cf"/><line x1="31.25" y1="385" x2="440.75" y2="385" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="366" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Existential security</text><text x="46" y="418.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Norris and Inglehart (2004)</text><text x="46" y="447.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Religion declines where life is secure and</text><text x="46" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">persists where it is insecure; high birth</text><text x="46" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rates make the world more religious.</text><rect x="458" y="335" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,385 L459.25,349.25 Q459.25,336.25 472.25,336.25 L855.75,336.25 Q868.75,336.25 868.75,349.25 L868.75,385 Z" fill="#b5d3cf"/><line x1="459.25" y1="385" x2="868.75" y2="385" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="366" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Public religion</text><text x="474" y="418.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Casanova (1994)</text><text x="474" y="447.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Deprivatisation</tspan>: faiths re-entered politics.</text><rect x="30" y="529" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="565" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Problems of measurement</text><text x="56" y="594" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Definitions and data shape conclusions; a “golden age” of past religiosity may be a myth.</text>
</svg>