<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 689" width="900" height="689" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="689" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Declining, changing or reviving?</text>

<rect x="300" y="110" width="300" height="70" rx="14" fill="#1e2a44"/><text x="450" y="153" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Congregational religion</text><line x1="364.5" y1="184" x2="165" y2="254" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="184" x2="450" y2="254" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="535.5" y1="184" x2="735" y2="254" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="260" width="269.3333333333333" height="274" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,310 L31.25,274.25 Q31.25,261.25 44.25,261.25 L285.0833333333333,261.25 Q298.0833333333333,261.25 298.0833333333333,274.25 L298.0833333333333,310 Z" fill="#f2e7b8"/><line x1="31.25" y1="310" x2="298.0833333333333" y2="310" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="290.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Decline</text><text x="44" y="341.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Secularisation</text><text x="44" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Religion loses significance</text><text x="44" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as attendance and belief</text><text x="44" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fall.</text><rect x="315.3333333333333" y="260" width="269.3333333333333" height="274" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,310 L316.5833333333333,274.25 Q316.5833333333333,261.25 329.5833333333333,261.25 L570.4166666666666,261.25 Q583.4166666666666,261.25 583.4166666666666,274.25 L583.4166666666666,310 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="310" x2="583.4166666666666" y2="310" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="290.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Change of form</text><text x="329.3333333333333" y="341.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Privatisation and choice</text><circle cx="334.3333333333333" cy="362.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Privatised:</tspan> belief</text><text x="347.3333333333333" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">practised at home or alone</text><circle cx="334.3333333333333" cy="412.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="418.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Spiritual shopping:</tspan></text><text x="347.3333333333333" y="439.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pick-and-mix beliefs (Lyon,</text><text x="347.3333333333333" y="460.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2000)</text><circle cx="334.3333333333333" cy="483.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Pilgrims</tspan> and <tspan font-weight="700">converts</tspan></text><text x="347.3333333333333" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Hervieu-Léger)</text><rect x="600.6666666666666" y="260" width="269.3333333333333" height="274" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,310 L601.9166666666666,274.25 Q601.9166666666666,261.25 614.9166666666666,261.25 L855.75,261.25 Q868.75,261.25 868.75,274.25 L868.75,310 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="310" x2="868.75" y2="310" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="290.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Revival</text><text x="614.6666666666666" y="341.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Resacralisation</text><text x="614.6666666666666" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The sacred returns through</text><text x="614.6666666666666" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">NRMs, New Age, charismatic</text><text x="614.6666666666666" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and Pentecostal growth and</text><text x="614.6666666666666" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fundamentalism.</text><rect x="30" y="554" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="590" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Kendal Project (Heelas and Woodhead, 2005)</text><text x="56" y="619" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Holistic spirituality grew in a small English town while congregational religion declined,</text><text x="56" y="641" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">but not enough to replace it.</text>
</svg>