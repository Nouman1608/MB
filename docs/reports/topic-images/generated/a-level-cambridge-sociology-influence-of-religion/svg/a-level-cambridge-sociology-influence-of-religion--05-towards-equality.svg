<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 559" width="900" height="559" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="559" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Towards equality? Religion and women</text>

<rect x="30" y="104" width="440" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="132" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Change in organisations</text><line x1="70" y1="200" x2="430" y2="200" stroke="#1e2a44" stroke-width="4"/><circle cx="130" cy="200" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="178" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1994</text><text x="130" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">first women priests</text><circle cx="360" cy="200" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="360" y="178" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2015</text><text x="360" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">first woman bishop</text><text x="245" y="266" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Church of England</text><circle cx="65" cy="306.39" r="4.5" fill="#2e6b62"/><text x="78" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Women serve as rabbis in Reform Judaism</text><circle cx="65" cy="336.39" r="4.5" fill="#2e6b62"/><text x="78" y="342" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Female leadership in many NRMs and New Age</text><text x="78" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">groups</text><rect x="490" y="104" width="380" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M491.25,154 L491.25,118.25 Q491.25,105.25 504.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="491.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="680" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Can religion benefit women?</text><circle cx="515" cy="182.39" r="4.5" fill="#2e6b62"/><text x="528" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Watson (1994):</tspan> some Muslim women</text><text x="528" y="210" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">chose the veil to express identity</text><text x="528" y="232" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and avoid the male gaze</text><circle cx="515" cy="260.39" r="4.5" fill="#2e6b62"/><text x="528" y="266" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Participation can bring community,</text><text x="528" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">status and support</text><circle cx="515" cy="316.39" r="4.5" fill="#2e6b62"/><text x="528" y="322" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Woodhead:</tspan> women use religion for</text><text x="528" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">their own ends (“religious forms of</text><text x="528" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">feminism”)</text><rect x="30" y="424" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="460" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="56" y="489" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Change is uneven between and within faiths, and choice and constraint are difficult to</text><text x="56" y="511" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">separate.</text>
</svg>