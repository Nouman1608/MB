<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 701" width="900" height="701" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="701" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The secularisation thesis</text>

<rect x="30" y="108" width="198" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="129" y="143.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Industrialisation</text><rect x="244" y="108" width="198" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="343" y="143.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Urbanisation</text><rect x="458" y="108" width="198" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="557" y="143.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Science</text><rect x="672" y="108" width="198" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="771" y="143.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Education</text><line x1="135" y1="176" x2="371.25" y2="238" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="345" y1="176" x2="423.75" y2="238" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="555" y1="176" x2="476.25" y2="238" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="765" y1="176" x2="528.75" y2="238" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="150" y="242" width="600" height="80" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="276" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Religious thinking, practice and institutions</text><text x="450" y="304" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">lose social significance (Wilson, 1966)</text><text x="450" y="368" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence for decline</text><rect x="30" y="388" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,438 L31.25,402.25 Q31.25,389.25 44.25,389.25 L285.0833333333333,389.25 Q298.0833333333333,389.25 298.0833333333333,402.25 L298.0833333333333,438 Z" fill="#f2e7b8"/><line x1="31.25" y1="438" x2="298.0833333333333" y2="438" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="418.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Practice</text><text x="44" y="469.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Falling church attendance and</text><text x="44" y="490.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">membership in much of Western</text><text x="44" y="511.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Europe.</text><rect x="315.3333333333333" y="388" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,438 L316.5833333333333,402.25 Q316.5833333333333,389.25 329.5833333333333,389.25 L570.4166666666666,389.25 Q583.4166666666666,389.25 583.4166666666666,402.25 L583.4166666666666,438 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="438" x2="583.4166666666666" y2="438" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="418.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Belief</text><text x="329.3333333333333" y="469.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer say they believe in God</text><text x="329.3333333333333" y="490.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or identify with a religion,</text><text x="329.3333333333333" y="511.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">especially the young.</text><rect x="600.6666666666666" y="388" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,438 L601.9166666666666,402.25 Q601.9166666666666,389.25 614.9166666666666,389.25 L855.75,389.25 Q868.75,389.25 868.75,402.25 L868.75,438 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="438" x2="868.75" y2="438" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="418.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Institutions</text><text x="614.6666666666666" y="469.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer clergy, religious</text><text x="614.6666666666666" y="490.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marriages and baptisms in</text><text x="614.6666666666666" y="511.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">many Western societies.</text><rect x="30" y="549" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,599 L31.25,563.25 Q31.25,550.25 44.25,550.25 L427.75,550.25 Q440.75,550.25 440.75,563.25 L440.75,599 Z" fill="#f2e7b8"/><line x1="31.25" y1="599" x2="440.75" y2="599" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="579.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Generational decline</text><text x="44" y="630.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bruce (2002): each generation is less</text><text x="44" y="651.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">religious than its parents.</text><rect x="458" y="549" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,599 L459.25,563.25 Q459.25,550.25 472.25,550.25 L855.75,550.25 Q868.75,550.25 868.75,563.25 L868.75,599 Z" fill="#f2e7b8"/><line x1="459.25" y1="599" x2="868.75" y2="599" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="579.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Disengagement</text><text x="472" y="630.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The state, not the church, now runs education,</text><text x="472" y="651.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">welfare and law.</text>
</svg>