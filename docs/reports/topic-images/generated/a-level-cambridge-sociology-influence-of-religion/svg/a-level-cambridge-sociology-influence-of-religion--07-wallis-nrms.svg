<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Wallis’s three types of new religious movement</text>

<line x1="80" y1="140" x2="840" y2="140" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="830" y1="140" x2="70" y2="140" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="60" y="124" font-size="17" font-weight="600" fill="#4a5568" text-anchor="start">turns away from the world</text><text x="840" y="124" font-size="17" font-weight="600" fill="#4a5568" text-anchor="end">embraces the world</text><rect x="30" y="170" width="269.3333333333333" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,220 L31.25,184.25 Q31.25,171.25 44.25,171.25 L285.0833333333333,171.25 Q298.0833333333333,171.25 298.0833333333333,184.25 L298.0833333333333,220 Z" fill="#f2e7b8"/><line x1="31.25" y1="220" x2="298.0833333333333" y2="220" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="201" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">World-rejecting</text><text x="44" y="254.05" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Separate from society.</text><rect x="315.3333333333333" y="170" width="269.3333333333333" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,220 L316.5833333333333,184.25 Q316.5833333333333,171.25 329.5833333333333,171.25 L570.4166666666666,171.25 Q583.4166666666666,171.25 583.4166666666666,184.25 L583.4166666666666,220 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="220" x2="583.4166666666666" y2="220" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="201" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">World-accommodating</text><text x="329.3333333333333" y="254.05" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Enrich religious life.</text><rect x="600.6666666666666" y="170" width="269.3333333333333" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,220 L601.9166666666666,184.25 Q601.9166666666666,171.25 614.9166666666666,171.25 L855.75,171.25 Q868.75,171.25 868.75,184.25 L868.75,220 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="220" x2="868.75" y2="220" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="201" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">World-affirming</text><text x="614.6666666666666" y="254.05" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Offer techniques for</text><text x="614.6666666666666" y="279.05" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">success.</text><rect x="30" y="326" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="362" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why do NRMs grow?</text><circle cx="61" cy="385.39" r="4.5" fill="#8a6d0d"/><text x="74" y="391" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Relative deprivation</text><circle cx="61" cy="415.39" r="4.5" fill="#8a6d0d"/><text x="74" y="421" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rapid social change</text><circle cx="61" cy="445.39" r="4.5" fill="#8a6d0d"/><text x="74" y="451" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A search for meaning</text><rect x="30" y="489" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="525" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">New Age</text><text x="56" y="554" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Beliefs focused on the self, spirituality and wellbeing: Heelas’s “spirituality of life”</text><text x="56" y="576" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">suited to consumer societies.</text>
