<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why is religion patriarchal?</text>

<rect x="30" y="104" width="269.3333333333333" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Male leadership</text><text x="46" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Male-dominated organisations</text><text x="46" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and leadership.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sacred texts</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Written and interpreted by</text><text x="331.3333333333333" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">men.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Female impurity</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ideas of impurity restrict</text><text x="616.6666666666666" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women’s participation.</text><rect x="30" y="248" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,298 L31.25,262.25 Q31.25,249.25 44.25,249.25 L285.0833333333333,249.25 Q298.0833333333333,249.25 298.0833333333333,262.25 L298.0833333333333,298 Z" fill="#f2e7b8"/><line x1="31.25" y1="298" x2="298.0833333333333" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="278.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Religious laws</text><text x="46" y="331.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rules on marriage, divorce</text><text x="46" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and dress.</text><rect x="315.3333333333333" y="248" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,298 L316.5833333333333,262.25 Q316.5833333333333,249.25 329.5833333333333,249.25 L570.4166666666666,249.25 Q583.4166666666666,249.25 583.4166666666666,262.25 L583.4166666666666,298 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="298" x2="583.4166666666666" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="278.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">History</text><text x="331.3333333333333" y="331.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Armstrong (1993): early</text><text x="331.3333333333333" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">religions often had female</text><text x="331.3333333333333" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deities before</text><text x="331.3333333333333" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">male-dominated monotheism.</text><rect x="600.6666666666666" y="248" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,298 L601.9166666666666,262.25 Q601.9166666666666,249.25 614.9166666666666,249.25 L855.75,249.25 Q868.75,249.25 868.75,262.25 L868.75,298 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="298" x2="868.75" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="278.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">False compensation</text><text x="616.6666666666666" y="331.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">de Beauvoir (1949): religion</text><text x="616.6666666666666" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compensates women for</text><text x="616.6666666666666" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">second-class status.</text><rect x="30" y="434" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="470" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feminists disagree</text><circle cx="61" cy="493.39" r="4.5" fill="#8a6d0d"/><text x="74" y="499" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Radical feminists:</tspan> religion is fundamentally patriarchal</text><circle cx="61" cy="523.39" r="4.5" fill="#8a6d0d"/><text x="74" y="529" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Liberal feminists:</tspan> reform is possible</text><circle cx="61" cy="553.39" r="4.5" fill="#8a6d0d"/><text x="74" y="559" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">El Saadawi (1980):</tspan> patriarchal interpretations, not religion itself, oppress women</text>
</svg>