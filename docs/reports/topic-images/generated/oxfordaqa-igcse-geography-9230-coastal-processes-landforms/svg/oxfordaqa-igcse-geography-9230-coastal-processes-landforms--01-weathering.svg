<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weathering at the coast</text>

<text x="30" y="128" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Mechanical: freeze-thaw</text><rect x="30" y="146" width="196" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="176" width="136" height="120" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M125,176 L124,264 L131,176 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><circle cx="56" cy="330" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="335.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="78" y="326" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Water enters a</text><text x="78" y="344" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">crack</text><line x1="228" y1="236" x2="240" y2="236" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="242" y="146" width="196" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="272" y="176" width="136" height="120" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M335.5,176 L336,264 L344.5,176 Z" fill="#e6f2fb" stroke="#1e2a44" stroke-width="2"/><text x="340" y="170" font-size="18" font-weight="400" fill="#2b5a9a" text-anchor="middle">❄</text><line x1="328" y1="216" x2="308" y2="216" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="352" y1="216" x2="372" y2="216" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="268" cy="330" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="268" y="335.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="290" y="326" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">It freezes and</text><text x="290" y="344" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">expands</text><line x1="440" y1="236" x2="452" y2="236" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="454" y="146" width="196" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="484" y="176" width="136" height="120" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M545,176 L548,264 L559,176 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><circle cx="480" cy="330" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="480" y="335.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="502" y="326" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">The crack widens</text><line x1="652" y1="236" x2="664" y2="236" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="666" y="146" width="196" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="696" y="176" width="136" height="120" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M696,176 L758,176 L786,242 L832,242 L832,296 L696,296 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M778,168 L816,176 L832,220 L802,226 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" transform="rotate(14 806 196)"/><line x1="842" y1="216" x2="842" y2="266" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="692" cy="330" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="692" y="335.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="714" y="326" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">A fragment breaks</text><text x="714" y="344" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">off</text><text x="450" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Repeated cycles of freezing and thawing break the rock apart.</text><rect x="30" y="410" width="410" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="446.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mechanical: salt weathering</text><text x="48" y="473.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seawater evaporates in cracks; salt crystals</text><text x="48" y="494.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grow and force the rock apart.</text><rect x="460" y="410" width="410" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="478" y="446.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Chemical: carbonation</text><text x="478" y="473.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rainwater absorbs carbon dioxide, is slightly</text><text x="478" y="494.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">acidic, and slowly dissolves limestone and</text><text x="478" y="515.41" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chalk.</text><rect x="30" y="552" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="583.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Weathering is breakdown in place, without movement; it weakens cliffs so erosion and mass</text><text x="450" y="605.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">movement work faster.</text>
</svg>