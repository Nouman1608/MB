<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From spit to bar</text>

<rect x="30" y="110" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Spit</text><rect x="40" y="166" width="390" height="310" fill="#b5d3cf"/><path d="M40,166 L430,166 L430,400 L380,400 Q320,250 235,236 Q150,250 110,380 L40,380 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2.5"/><path d="M110,380 L260,380" fill="none" stroke="#1e2a44" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" /><path d="M110,380 L260,380" fill="none" stroke="#efdfa8" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" /><path d="M140,372 Q180,330 240,360 Q190,372 140,372 Z" fill="#a9c48f"/><text x="190" y="352" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">calm water</text><text x="270" y="418" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">spit grows across the bay</text><line x1="266" y1="380" x2="320" y2="380" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="7 5"/><line x1="60" y1="456" x2="170" y2="456" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><text x="180" y="462" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">longshore drift</text><rect x="460" y="110" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Bar</text><rect x="470" y="166" width="390" height="310" fill="#b5d3cf"/><path d="M470,166 L860,166 L860,400 L810,400 Q750,250 665,236 Q580,250 540,380 L470,380 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2.5"/><path d="M540,380 L810,400" fill="none" stroke="#1e2a44" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" /><path d="M540,380 L810,400" fill="none" stroke="#efdfa8" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" /><path d="M548,370 Q580,250 665,244 Q750,258 800,390 Z" fill="#9cc7d6" stroke="#2e6b62" stroke-width="2"/><text x="665" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">LAGOON</text><text x="665" y="430" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">bar</text><line x1="490" y1="456" x2="600" y2="456" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><text x="610" y="462" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">longshore drift</text><line x1="442" y1="300" x2="458" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="512" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="543.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">If a spit grows across a bay and joins the land on the other side, it forms a bar, trapping a</text><text x="450" y="565.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">shallow lagoon behind it.</text>
</svg>