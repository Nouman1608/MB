<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Geology and the shape of the coast</text>

<rect x="30" y="110" width="410" height="390" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="142" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Discordant coast</text><rect x="50" y="240" width="370" height="180" fill="#b5d3cf"/><path d="M50,150 L124,150 L124,360 Q87,384 50,360 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M124,150 L198,150 L198,310 Q161,230 124,310 Z" fill="#e8dcc0" stroke="#1e2a44" stroke-width="2"/><path d="M130,296 Q161,254 192,296" fill="none" stroke="#d4b02e" stroke-width="7"/><path d="M198,150 L272,150 L272,360 Q235,384 198,360 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M272,150 L346,150 L346,310 Q309,230 272,310 Z" fill="#e8dcc0" stroke="#1e2a44" stroke-width="2"/><path d="M278,296 Q309,254 340,296" fill="none" stroke="#d4b02e" stroke-width="7"/><path d="M346,150 L420,150 L420,360 Q383,384 346,360 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M50,30 " fill="none"/><rect x="50" y="380" width="370" height="40" fill="#b5d3cf" opacity="0.9"/><text x="87" y="180" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">hard</text><text x="161" y="180" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">soft</text><text x="87" y="352" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">headland</text><text x="161" y="262" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">bay</text><text x="235" y="406" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">SEA</text><text x="235" y="446" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">bands at right angles to the coast</text><rect x="460" y="110" width="410" height="390" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="142" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Concordant coast</text><rect x="480" y="150" width="370" height="70" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="480" y="220" width="370" height="80" fill="#e8dcc0" stroke="#1e2a44" stroke-width="2"/><rect x="480" y="300" width="370" height="60" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M635,360 L635,300 Q575,250 665,232 Q755,250 695,300 L695,360 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="480" y="360" width="370" height="60" fill="#b5d3cf"/><text x="490" y="340" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">resistant band</text><text x="490" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">softer rock</text><text x="490" y="190" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">resistant rock</text><text x="743" y="252" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">cove</text><text x="665" y="406" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">SEA</text><text x="665" y="446" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">bands parallel to the coast</text><text x="860" y="104" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">plan view, not to scale</text><rect x="30" y="516" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="546.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Joints and faults are lines of weakness that erosion exploits; the dip of the layers affects cliff</text><text x="450" y="567.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">steepness and stability.</text>
