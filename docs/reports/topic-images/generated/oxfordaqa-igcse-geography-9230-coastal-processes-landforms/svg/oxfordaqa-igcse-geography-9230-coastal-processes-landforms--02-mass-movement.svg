<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three types of mass movement</text>

<rect x="30" y="110" width="266" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="163" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sliding</text><text x="48" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A block of rock or soil</text><text x="48" y="421.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">moves down a slope along a</text><text x="48" y="442.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">flat surface, often after</text><text x="48" y="463.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heavy rain.</text><rect x="317" y="110" width="266" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Slumping</text><text x="335" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Saturated material, often</text><text x="335" y="421.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clay, moves down a curved</text><text x="335" y="442.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surface with a rotational</text><text x="335" y="463.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">movement, leaving a stepped,</text><text x="335" y="484.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">curved scar.</text><rect x="604" y="110" width="266" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="737" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Rock falls</text><text x="622" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fragments break away from a</text><text x="622" y="421.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">steep cliff face and fall,</text><text x="622" y="442.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">often after freeze-thaw or</text><text x="622" y="463.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">undercutting by the sea.</text><path d="M50,370 L50,190 L100,190 L276,350 L276,370 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M140,226 L180,262 L158,286 L118,250 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><line x1="100" y1="190" x2="276" y2="350" stroke="#b5602e" stroke-width="3" stroke-dasharray="8 5"/><line x1="180" y1="236" x2="226" y2="278" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="150" y="340" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">flat surface</text><path d="M337,370 L337,190 L467,190 L467,300 L563,350 L563,370 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M407,190 Q415,300 507,322 L467,300 L467,190 Z" fill="#c9b98a" stroke="#1e2a44" stroke-width="2.5"/><path d="M407,190 Q415,300 507,322" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/><path d="M487,226 A40,40 0 0 1 513,280" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="357" y="182" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">curved scar</text><text x="527" y="210" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">rotation</text><path d="M624,370 L624,170 L754,170 L754,300 L744,330 L754,370 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="755" y="330" width="113" height="40" fill="#b5d3cf"/><path d="M754,330 q-10,-15 -10,-15 l10,-15" fill="none"/><path d="M774,220 l10,-10 l10,6 l-5,10 z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M792,262 l8,-8 l8,4.8 l-4,8 z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M807,300 l9,-9 l9,5.3999999999999995 l-4.5,9 z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M789,356 l11,-11 l11,6.6 l-5.5,11 z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M818,360 l8,-8 l8,4.8 l-4,8 z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><line x1="780" y1="236" x2="788" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="732" y="346" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">notch</text><text x="860" y="360" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">sea</text><text x="450" y="540" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Cross-sections, not to scale. All three are movement downhill under gravity.</text>
</svg>