<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" width="900" height="582" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="582" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cliff retreat and the wave-cut platform</text>

<rect x="30" y="110" width="266" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="142" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="148.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="88" y="149" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Notch cut</text><rect x="36" y="280" width="254" height="90" fill="#b5d3cf" opacity="0.85"/><path d="M290,180 L134,180 L134,282 L156,296 L138,324 L134,370 L290,370 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="164" y="304" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">notch</text><line x1="36" y1="280" x2="100" y2="280" stroke="#2b5a9a" stroke-width="2" stroke-dasharray="6 4"/><text x="40" y="274" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">HT</text><line x1="36" y1="318" x2="100" y2="318" stroke="#2b5a9a" stroke-width="2" stroke-dasharray="6 4"/><text x="40" y="312" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">LT</text><text x="48" y="428" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Destructive waves attack the</text><text x="48" y="449.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">base between high and low</text><text x="48" y="470.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tide; hydraulic power and</text><text x="48" y="491.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">abrasion cut a wave-cut</text><text x="48" y="512.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">notch.</text><line x1="298" y1="320" x2="315" y2="320" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="317" y="110" width="266" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="347" cy="142" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="347" y="148.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="375" y="149" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Overhang collapses</text><rect x="323" y="280" width="254" height="90" fill="#b5d3cf" opacity="0.85"/><path d="M577,180 L447,180 L445,280 L465,318 L455,348 L377,364 L377,370 L577,370 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="431" cy="324" r="9" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="413" cy="336" r="7" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="439" cy="344" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M421,180 L421,280 " fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><text x="417" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">old cliff</text><line x1="323" y1="280" x2="387" y2="280" stroke="#2b5a9a" stroke-width="2" stroke-dasharray="6 4"/><text x="327" y="274" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">HT</text><line x1="323" y1="318" x2="387" y2="318" stroke="#2b5a9a" stroke-width="2" stroke-dasharray="6 4"/><text x="327" y="312" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">LT</text><text x="335" y="428" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The notch deepens, the rock</text><text x="335" y="449.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">above is unsupported and</text><text x="335" y="470.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collapses; the cliff</text><text x="335" y="491.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">retreats inland.</text><line x1="585" y1="320" x2="602" y2="320" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="604" y="110" width="266" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="634" cy="142" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="634" y="148.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="662" y="149" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Platform left</text><rect x="610" y="280" width="254" height="90" fill="#b5d3cf" opacity="0.85"/><path d="M864,180 L754,180 L754,312 L618,360 L618,370 L864,370 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M708,180 L708,280 " fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><path d="M732,180 L732,280 " fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><text x="664" y="396" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">wave-cut platform</text><line x1="610" y1="280" x2="674" y2="280" stroke="#2b5a9a" stroke-width="2" stroke-dasharray="6 4"/><text x="614" y="274" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">HT</text><line x1="610" y1="318" x2="674" y2="318" stroke="#2b5a9a" stroke-width="2" stroke-dasharray="6 4"/><text x="614" y="312" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">LT</text><text x="622" y="428" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repeated over time, a gently</text><text x="622" y="449.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sloping wave-cut platform is</text><text x="622" y="470.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">left, exposed at low tide.</text><text x="450" y="556" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Cross-sections, not to scale. HT = high tide, LT = low tide.</text>
</svg>