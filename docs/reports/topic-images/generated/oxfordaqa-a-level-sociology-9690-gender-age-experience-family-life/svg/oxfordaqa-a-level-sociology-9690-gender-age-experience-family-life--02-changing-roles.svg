<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 697" width="900" height="697" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="697" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why conjugal roles are changing</text>

<rect x="30" y="110" width="269.3333333333333" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,180 L31.25,124.25 Q31.25,111.25 44.25,111.25 L285.0833333333333,111.25 Q298.0833333333333,111.25 298.0833333333333,124.25 L298.0833333333333,180 Z" fill="#dce9e7"/><line x1="31.25" y1="180" x2="298.0833333333333" y2="180" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="150.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Women’s employment</text><text x="44" y="211.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dual earners weaken the</text><text x="44" y="232.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breadwinner model; more</text><text x="44" y="253.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bargaining power</text><rect x="315.3333333333333" y="110" width="269.3333333333333" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,180 L316.5833333333333,124.25 Q316.5833333333333,111.25 329.5833333333333,111.25 L570.4166666666666,111.25 Q583.4166666666666,111.25 583.4166666666666,124.25 L583.4166666666666,180 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="180" x2="583.4166666666666" y2="180" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="138.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist ideas and</text><text x="450" y="162.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">equality laws</text><text x="329.3333333333333" y="211.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change expectations of</text><text x="329.3333333333333" y="232.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fairness</text><rect x="600.6666666666666" y="110" width="269.3333333333333" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,180 L601.9166666666666,124.25 Q601.9166666666666,111.25 614.9166666666666,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,180 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="180" x2="868.75" y2="180" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="138.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Decline of manual</text><text x="735.3333333333333" y="162.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">industry</text><text x="614.6666666666666" y="211.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fewer secure "male" jobs;</text><text x="614.6666666666666" y="232.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"crisis of masculinity" (Mac</text><text x="614.6666666666666" y="253.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an Ghaill)</text><rect x="175" y="291" width="267" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M176.25,361 L176.25,305.25 Q176.25,292.25 189.25,292.25 L427.75,292.25 Q440.75,292.25 440.75,305.25 L440.75,361 Z" fill="#dce9e7"/><line x1="176.25" y1="361" x2="440.75" y2="361" stroke="#c9d6d4" stroke-width="2"/><text x="308.5" y="319.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Smaller families and</text><text x="308.5" y="343.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">technology</text><text x="189" y="392.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less domestic work overall</text><rect x="458" y="291" width="267" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,361 L459.25,305.25 Q459.25,292.25 472.25,292.25 L710.75,292.25 Q723.75,292.25 723.75,305.25 L723.75,361 Z" fill="#dce9e7"/><line x1="459.25" y1="361" x2="723.75" y2="361" stroke="#c9d6d4" stroke-width="2"/><text x="591.5" y="331.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Changing fatherhood</text><text x="472" y="392.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more hands-on fathers in</text><text x="472" y="413.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">some groups</text><line x1="450" y1="453" x2="450" y2="487" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="497" width="412" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,547 L31.25,511.25 Q31.25,498.25 44.25,498.25 L427.75,498.25 Q440.75,498.25 440.75,511.25 L440.75,547 Z" fill="#b5d3cf"/><line x1="31.25" y1="547" x2="440.75" y2="547" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="527.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Symmetrical family</text><text x="44" y="578.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Young and Willmott (1973)</text><text x="44" y="605.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Roles becoming similar but not identical;</text><text x="44" y="626.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">both share paid and domestic work.</text><rect x="458" y="497" width="412" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,547 L459.25,511.25 Q459.25,498.25 472.25,498.25 L855.75,498.25 Q868.75,498.25 868.75,511.25 L868.75,547 Z" fill="#f2e7b8"/><line x1="459.25" y1="547" x2="868.75" y2="547" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="527.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Lagged adaptation</text><text x="472" y="578.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Gershuny</text><text x="472" y="605.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Men’s share of housework rises slowly behind</text><text x="472" y="626.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women’s move into paid work, as each</text><text x="472" y="647.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">generation learns new norms.</text>
</svg>