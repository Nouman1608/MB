<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" width="900" height="643" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing the domestic division of labour</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Oakley (1974) and Boulton (1983) challenge the symmetrical family</text>
<rect x="258" y="120" width="302" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="409" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Often men</text><rect x="568" y="120" width="302" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="719" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Often women</text><rect x="30" y="172" width="220" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="214.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tasks vs</text><text x="42" y="236.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">responsibility</text><rect x="258" y="172" width="302" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="272" y="203.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cooks sometimes; "helps";</text><text x="272" y="225.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">plays with children</text><rect x="568" y="172" width="302" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="582" y="203.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Plans meals; notices what</text><text x="582" y="225.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">children need; responsible for</text><text x="582" y="247.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">their welfare</text><rect x="30" y="276" width="220" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="307.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Routine vs</text><text x="42" y="329.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">occasional</text><rect x="258" y="276" width="302" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="272" y="307.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Occasional, flexible tasks</text><text x="272" y="329.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">such as repairs</text><rect x="568" y="276" width="302" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="582" y="307.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Daily, time-bound work:</text><text x="582" y="329.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cooking, cleaning</text><rect x="30" y="358" width="220" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="411.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Paid help</text><rect x="258" y="358" width="302" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="272" y="389.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some middle-class dual-earner</text><text x="272" y="411.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">couples buy domestic help…</text><rect x="568" y="358" width="302" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="582" y="389.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">…so equality rests on the</text><text x="582" y="411.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">labour of other, often</text><text x="582" y="433.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">migrant, women</text><rect x="30" y="470" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="506" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Power and decision making</text><circle cx="61" cy="529.39" r="4.5" fill="#8a6d0d"/><text x="74" y="535" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Edgell (1980):</tspan> husbands dominated very important decisions such as moving house</text><circle cx="61" cy="559.39" r="4.5" fill="#8a6d0d"/><text x="74" y="565" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Pahl:</tspan> pooling income does not guarantee equal control</text><circle cx="61" cy="589.39" r="4.5" fill="#8a6d0d"/><text x="74" y="595" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Economic dependence lowers bargaining power; men’s leisure is better protected</text>
</svg>