<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why families became child-centred</text>

<rect x="30" y="110" width="198" height="88" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="129" y="154.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Smaller families</text><rect x="244" y="110" width="198" height="88" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="343" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower infant</text><text x="343" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">mortality</text><rect x="458" y="110" width="198" height="88" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="557" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rising living</text><text x="557" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">standards</text><rect x="672" y="110" width="198" height="88" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="771" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Expert parenting</text><text x="771" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">advice</text><line x1="130" y1="204" x2="354" y2="258" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="343" y1="204" x2="417.9" y2="258" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="557" y1="204" x2="482.1" y2="258" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="770" y1="204" x2="546" y2="258" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="200" y="262" width="500" height="92" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="300" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Child-centred family</text><text x="450" y="328" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">more time, money and emotion invested in fewer children</text><rect x="30" y="374" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="410" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criticism</text><circle cx="61" cy="433.39" r="4.5" fill="#8a6d0d"/><text x="74" y="439" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Adults still control children’s time, space and bodies: Gittins’s <tspan font-weight="700">age patriarchy</tspan></text><circle cx="61" cy="463.39" r="4.5" fill="#8a6d0d"/><text x="74" y="469" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Child centredness varies by class and between societies</text>
</svg>