<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Childhood is socially constructed</text>

<line x1="200" y1="120" x2="200" y2="394" stroke="#1e2a44" stroke-width="4"/><rect x="222" y="110" width="648" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="200" cy="138" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="178" y="144" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">Medieval Europe</text><text x="240" y="144.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Children join the adult world early (Ariès, Centuries of Childhood)</text><rect x="222" y="180" width="648" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="200" cy="208" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="178" y="214" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">Gradually</text><text x="240" y="214.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A separate idea of childhood develops</text><rect x="222" y="250" width="648" height="70" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="200" cy="285" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="178" y="291" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">Laws</text><text x="240" y="280.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Child labour laws, compulsory education and child-protection law</text><text x="240" y="302.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">separate childhood further</text><rect x="222" y="334" width="648" height="70" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="200" cy="369" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="178" y="375" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1982</text><text x="240" y="364.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Postman: television gives children adult information, blurring the</text><text x="240" y="386.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">boundary again</text><rect x="30" y="428" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,478 L31.25,442.25 Q31.25,429.25 44.25,429.25 L427.75,429.25 Q440.75,429.25 440.75,442.25 L440.75,478 Z" fill="#f2e7b8"/><line x1="31.25" y1="478" x2="440.75" y2="478" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="458.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rural Bolivia (Punch)</text><text x="44" y="509.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children take on household and farm tasks</text><text x="44" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">early and negotiate independence through</text><text x="44" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work.</text><rect x="458" y="428" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,478 L459.25,442.25 Q459.25,429.25 472.25,429.25 L855.75,429.25 Q868.75,429.25 868.75,442.25 L868.75,478 Z" fill="#b5d3cf"/><line x1="459.25" y1="478" x2="868.75" y2="478" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="458.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Wealthy societies</text><text x="472" y="509.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children excluded from paid work, longer in</text><text x="472" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">school, treated as dependent and needing</text><text x="472" y="551.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protection.</text>
</svg>