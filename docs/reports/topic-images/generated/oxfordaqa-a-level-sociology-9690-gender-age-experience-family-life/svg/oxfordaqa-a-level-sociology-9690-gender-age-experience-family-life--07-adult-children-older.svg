<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 663" width="900" height="663" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="663" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Adult children and older people</text>

<rect x="30" y="110" width="256" height="148" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="158" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reasons</text><text x="158" y="172.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">housing costs, student</text><text x="158" y="193.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">debt, insecure work,</text><text x="158" y="214.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">relationship breakdown,</text><text x="158" y="235.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">cultural expectation</text><line x1="290" y1="184" x2="318" y2="184" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="322" y="110" width="256" height="148" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="161.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Adult child returns</text><text x="450" y="185.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">home</text><text x="450" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the "boomerang" family</text><line x1="582" y1="184" x2="610" y2="184" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="614" y="110" width="256" height="148" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="742" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mixed effects</text><text x="742" y="172.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">delayed independence and</text><text x="742" y="193.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">strained resources, but</text><text x="742" y="214.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">stronger intergenerational</text><text x="742" y="235.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">ties</text><rect x="30" y="282" width="412" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,332 L31.25,296.25 Q31.25,283.25 44.25,283.25 L427.75,283.25 Q440.75,283.25 440.75,296.25 L440.75,332 Z" fill="#dce9e7"/><line x1="31.25" y1="332" x2="440.75" y2="332" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="312.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Status of older people</text><circle cx="49" cy="357.92" r="4.5" fill="#2e6b62"/><text x="62" y="363.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Strong filial obligation</tspan> (e.g. Confucian</text><text x="62" y="384.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">filial piety): support, respect, authority</text><text x="62" y="405.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in extended households</text><circle cx="49" cy="428.92" r="4.5" fill="#2e6b62"/><text x="62" y="434.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Status tied to paid work:</tspan> retirement can</text><text x="62" y="455.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lower status; may live alone</text><rect x="458" y="282" width="412" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,332 L459.25,296.25 Q459.25,283.25 472.25,283.25 L855.75,283.25 Q868.75,283.25 868.75,296.25 L868.75,332 Z" fill="#dce9e7"/><line x1="459.25" y1="332" x2="868.75" y2="332" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="312.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Grandparent roles</text><circle cx="477" cy="357.92" r="4.5" fill="#2e6b62"/><text x="490" y="363.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Childcare for working parents; financial</text><text x="490" y="384.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">support</text><circle cx="477" cy="407.92" r="4.5" fill="#2e6b62"/><text x="490" y="413.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Passing on language, religion, family</text><text x="490" y="434.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">history</text><circle cx="477" cy="457.92" r="4.5" fill="#2e6b62"/><text x="490" y="463.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Skipped-generation households (parts of</text><text x="490" y="484.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sub-Saharan Africa affected by HIV/AIDS)</text><rect x="30" y="526" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="562" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ageing populations</text><text x="56" y="591" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Longer grandparent roles, but more dependent very old people needing care, often from</text><text x="56" y="613" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the pivot generation.</text>
</svg>