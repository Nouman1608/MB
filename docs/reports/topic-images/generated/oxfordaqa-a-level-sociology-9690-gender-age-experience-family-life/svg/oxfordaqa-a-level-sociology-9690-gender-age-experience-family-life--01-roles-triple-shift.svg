<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Instrumental, expressive and the triple shift</text>

<rect x="30" y="110" width="412" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124.25 Q31.25,111.25 44.25,111.25 L427.75,111.25 Q440.75,111.25 440.75,124.25 L440.75,160 Z" fill="#b5d3cf"/><line x1="31.25" y1="160" x2="440.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Instrumental role</text><text x="44" y="192.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">husband: the "breadwinner"</text><text x="44" y="220.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Earns money and links the family to the</text><text x="44" y="242.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">economy.</text><rect x="458" y="110" width="412" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,160 L459.25,124.25 Q459.25,111.25 472.25,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,160 Z" fill="#f2e7b8"/><line x1="459.25" y1="160" x2="868.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Expressive role</text><text x="472" y="192.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">wife</text><text x="472" y="220.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cares for children and provides emotional</text><text x="472" y="242.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">warmth and support.</text><text x="450" y="296" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Parsons: segregated, complementary roles rooted in biology</text><text x="450" y="332" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Many employed women perform a triple shift</text><rect x="30" y="352" width="266.6666666666667" height="127" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="163.33333333333334" y="415.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1 Paid work</text><rect x="316.6666666666667" y="352" width="266.6666666666667" height="127" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="394.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2 Domestic labour</text><text x="450" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Hochschild (1989): the</text><text x="450" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">"second shift"</text><rect x="603.3333333333334" y="352" width="266.6666666666667" height="127" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="736.6666666666667" y="384.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3 Emotion work</text><text x="736.6666666666667" y="414.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">managing partners’ and</text><text x="736.6666666666667" y="435.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">children’s feelings</text><text x="736.6666666666667" y="456.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">(Duncombe and Marsden, 1995)</text><rect x="30" y="497" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="533" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why "traditional" is in inverted commas</text><text x="56" y="562" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">These roles are culturally specific and historically recent in many societies, where</text><text x="56" y="584" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">women have long done agricultural or market work.</text>
</svg>