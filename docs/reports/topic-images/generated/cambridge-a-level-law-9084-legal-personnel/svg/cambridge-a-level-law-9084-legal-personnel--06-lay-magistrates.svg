<rect width="900" height="870" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Becoming a lay magistrate</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Age 18 to under 75; at least 13 days a year</text>
<text x="450" y="140" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">THE SIX KEY QUALITIES</text><rect x="137.45600000000002" y="154" width="145.28" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="210.096" y="174.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Good character</text><rect x="292.736" y="154" width="298.688" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="442.08" y="174.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Understanding and communication</text><rect x="601.424" y="154" width="161.12" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="681.9839999999999" y="174.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Social awareness</text><rect x="99.048" y="194" width="285.264" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="241.68" y="214.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Maturity and sound temperament</text><rect x="394.312" y="194" width="162.096" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="475.36" y="214.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sound judgement</text><rect x="566.408" y="194" width="234.544" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="683.6800000000001" y="214.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Commitment and reliability</text><rect x="30" y="246" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="278.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Disqualified:</tspan> certain criminal convictions, undischarged bankruptcy, conflicting occupations such as</text><text x="50" y="299.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serving police officers.</text><line x1="60" y1="366" x2="60" y2="695" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="346" width="766" height="57" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="379.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Vacancies advertised</text><circle cx="60" cy="374.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="383.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="415" width="766" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="448.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Local advisory committee interviews</text><text x="122" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tests personal qualities and judicial aptitude through case scenarios; recommends</text><text x="122" y="498.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">appointments</text><circle cx="60" cy="468" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="476.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="533" width="766" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="566.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Appointed by the Lord Chief Justice</text><text x="122" y="595.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on the monarch’s behalf</text><circle cx="60" cy="575.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="584.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="630" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="663.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Training (Judicial College framework)</text><text x="122" y="692.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Induction, observing sittings, mentoring, then appraisal; more for chairing, youth or family courts</text><circle cx="60" cy="672.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="681.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="737" width="413" height="101" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="765" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOR</text><text x="46" y="796.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Local knowledge, low cost, public participation</text><rect x="457" y="737" width="413" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="765" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">AGAINST</text><text x="473" y="796.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Case-hardening, inconsistent sentencing between</text><text x="473" y="817.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">benches, imperfect representativeness</text>
</svg>