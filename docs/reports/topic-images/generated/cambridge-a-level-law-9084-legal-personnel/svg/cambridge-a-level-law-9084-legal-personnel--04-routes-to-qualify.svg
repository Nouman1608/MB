<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three routes into the legal professions</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="426" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="150.76923076923075" height="49" fill="#b5d3cf"/><text x="44" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stage</text><rect x="180.76923076923075" y="100" width="236.92307692307693" height="49" fill="#b5d3cf"/><text x="194.76923076923075" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Solicitors</text><rect x="417.6923076923077" y="100" width="236.92307692307693" height="49" fill="#d4b02e"/><text x="431.6923076923077" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Barristers</text><rect x="654.6153846153846" y="100" width="215.38461538461536" height="49" fill="#dce9e7"/><text x="668.6153846153846" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Legal executives</text><rect x="30" y="149" width="150.76923076923075" height="89" fill="#dce9e7"/><text x="44" y="175.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1 Academic</text><rect x="180.76923076923075" y="149" width="236.92307692307693" height="89" fill="#ffffff"/><text x="194.76923076923075" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Degree in any subject or</text><text x="194.76923076923075" y="196.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">equivalent</text><rect x="417.6923076923077" y="149" width="236.92307692307693" height="89" fill="#ffffff"/><text x="431.6923076923077" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Law degree, or non-law</text><text x="431.6923076923077" y="196.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">degree plus conversion</text><text x="431.6923076923077" y="217.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">course</text><rect x="654.6153846153846" y="149" width="215.38461538461536" height="89" fill="#ffffff"/><text x="668.6153846153846" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">CILEX qualifications; no</text><text x="668.6153846153846" y="196.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">degree needed</text><line x1="30" y1="238" x2="870" y2="238" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="238" width="150.76923076923075" height="89" fill="#dce9e7"/><text x="44" y="264.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">2 Vocational</text><rect x="180.76923076923075" y="238" width="236.92307692307693" height="89" fill="#f8faf9"/><text x="194.76923076923075" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">SQE1 (legal knowledge)</text><text x="194.76923076923075" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and SQE2 (practical skills)</text><rect x="417.6923076923077" y="238" width="236.92307692307693" height="89" fill="#f8faf9"/><text x="431.6923076923077" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bar course; one of the four</text><text x="431.6923076923077" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inns of Court; call to the</text><text x="431.6923076923077" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bar</text><rect x="654.6153846153846" y="238" width="215.38461538461536" height="89" fill="#f8faf9"/><text x="668.6153846153846" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">CILEX professional</text><text x="668.6153846153846" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">qualification</text><line x1="30" y1="327" x2="870" y2="327" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="327" width="150.76923076923075" height="89" fill="#dce9e7"/><text x="44" y="353.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">3 Work-based</text><rect x="180.76923076923075" y="327" width="236.92307692307693" height="89" fill="#ffffff"/><text x="194.76923076923075" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Two years’ qualifying work</text><text x="194.76923076923075" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">experience; character and</text><text x="194.76923076923075" y="395.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suitability check</text><rect x="417.6923076923077" y="327" width="236.92307692307693" height="89" fill="#ffffff"/><text x="431.6923076923077" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pupillage, usually twelve</text><text x="431.6923076923077" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">months</text><rect x="654.6153846153846" y="327" width="215.38461538461536" height="89" fill="#ffffff"/><text x="668.6153846153846" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Qualifying employment</text><line x1="30" y1="416" x2="870" y2="416" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="416" width="150.76923076923075" height="110" fill="#dce9e7"/><text x="44" y="442.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Typical role</text><rect x="180.76923076923075" y="416" width="236.92307692307693" height="110" fill="#f8faf9"/><text x="194.76923076923075" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Direct client contact;</text><text x="194.76923076923075" y="463.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advice, conveyancing,</text><text x="194.76923076923075" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wills, litigation; advocacy,</text><text x="194.76923076923075" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">higher rights if qualified</text><rect x="417.6923076923077" y="416" width="236.92307692307693" height="110" fill="#f8faf9"/><text x="431.6923076923077" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Specialist advocacy and</text><text x="431.6923076923077" y="463.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">written opinions;</text><text x="431.6923076923077" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-employed in chambers</text><text x="431.6923076923077" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or employed</text><rect x="654.6153846153846" y="416" width="215.38461538461536" height="110" fill="#f8faf9"/><text x="668.6153846153846" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Specialist fee-earner;</text><text x="668.6153846153846" y="463.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may become an</text><text x="668.6153846153846" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advocate, partner or</text><text x="668.6153846153846" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">judge</text></g><line x1="180.76923076923075" y1="100" x2="180.76923076923075" y2="526" stroke="#c9d6d4" stroke-width="1.5"/><line x1="417.6923076923077" y1="100" x2="417.6923076923077" y2="526" stroke="#c9d6d4" stroke-width="1.5"/><line x1="654.6153846153846" y1="100" x2="654.6153846153846" y2="526" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="426" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="548" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="576.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Cab-rank</tspan> <tspan font-weight="700" fill="#1e2a44">rule:</tspan> barristers</text><text x="46" y="597.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accept work in their field when</text><text x="46" y="618.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">available</text><rect x="314.6666666666667" y="548" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="576.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">King’s</tspan> <tspan font-weight="700" fill="#1e2a44">Counsel:</tspan> senior</text><text x="330.6666666666667" y="597.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">barristers and</text><text x="330.6666666666667" y="618.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">solicitor-advocates, by</text><text x="330.6666666666667" y="639.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">independent selection</text><rect x="599.3333333333334" y="548" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="576.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Arthur</tspan> <tspan font-style="italic">JS</tspan> <tspan font-style="italic">Hall</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Simons</tspan></text><text x="615.3333333333334" y="597.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2000): advocates’ immunity</text><text x="615.3333333333334" y="618.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from negligence removed</text>
</svg>