<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judges: experience needed and role</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Post-qualification experience: Tribunals, Courts and Enforcement Act 2007</text>
<clipPath id="tc124"><rect x="80" y="124" width="790" height="519" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="80" y="124" width="216.43835616438358" height="48" fill="#b5d3cf"/><text x="94" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Judge</text><rect x="296.43835616438355" y="124" width="248.90410958904107" height="48" fill="#b5d3cf"/><text x="310.43835616438355" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Qualifying experience</text><rect x="545.3424657534247" y="124" width="324.6575342465753" height="48" fill="#b5d3cf"/><text x="559.3424657534247" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Role</text><rect x="80" y="172" width="216.43835616438358" height="89" fill="#f2e7b8"/><text x="94" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Justices of the</text><text x="94" y="219.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Supreme Court</text><rect x="296.43835616438355" y="172" width="248.90410958904107" height="89" fill="#ffffff"/><text x="310.43835616438355" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Two years in high judicial</text><text x="310.43835616438355" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">office, or 15 years (CRA</text><text x="310.43835616438355" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2005 s25)</text><rect x="545.3424657534247" y="172" width="324.6575342465753" height="89" fill="#ffffff"/><text x="559.3424657534247" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hear appeals, set binding precedent,</text><text x="559.3424657534247" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interpret statutes</text><line x1="80" y1="261" x2="870" y2="261" stroke="#c9d6d4" stroke-width="1.5"/><rect x="80" y="261" width="216.43835616438358" height="68" fill="#f2e7b8"/><text x="94" y="287.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Lords and Lady</text><text x="94" y="308.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Justices of Appeal</text><rect x="296.43835616438355" y="261" width="248.90410958904107" height="68" fill="#f8faf9"/><text x="310.43835616438355" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seven years, or already a</text><text x="310.43835616438355" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High Court judge</text><rect x="545.3424657534247" y="261" width="324.6575342465753" height="68" fill="#f8faf9"/><text x="559.3424657534247" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Appeals and precedent; sentencing</text><text x="559.3424657534247" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">guideline judgments</text><line x1="80" y1="329" x2="870" y2="329" stroke="#c9d6d4" stroke-width="1.5"/><rect x="80" y="329" width="216.43835616438358" height="89" fill="#f2e7b8"/><text x="94" y="355.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">High Court judges</text><rect x="296.43835616438355" y="329" width="248.90410958904107" height="89" fill="#ffffff"/><text x="310.43835616438355" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seven years</text><rect x="545.3424657534247" y="329" width="324.6575342465753" height="89" fill="#ffffff"/><text x="559.3424657534247" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Major civil cases, judicial review,</text><text x="559.3424657534247" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">appeals, most serious Crown Court</text><text x="559.3424657534247" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cases</text><line x1="80" y1="418" x2="870" y2="418" stroke="#c9d6d4" stroke-width="1.5"/><rect x="80" y="418" width="216.43835616438358" height="68" fill="#dce9e7"/><text x="94" y="444.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Circuit judges</text><rect x="296.43835616438355" y="418" width="248.90410958904107" height="68" fill="#f8faf9"/><text x="310.43835616438355" y="444.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seven years</text><rect x="545.3424657534247" y="418" width="324.6575342465753" height="68" fill="#f8faf9"/><text x="559.3424657534247" y="444.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crown Court (direct jury on law, sum</text><text x="559.3424657534247" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">up, sentence) and County Court</text><line x1="80" y1="486" x2="870" y2="486" stroke="#c9d6d4" stroke-width="1.5"/><rect x="80" y="486" width="216.43835616438358" height="68" fill="#dce9e7"/><text x="94" y="512.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Recorders (part-time)</text><rect x="296.43835616438355" y="486" width="248.90410958904107" height="68" fill="#ffffff"/><text x="310.43835616438355" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seven years</text><rect x="545.3424657534247" y="486" width="324.6575342465753" height="68" fill="#ffffff"/><text x="559.3424657534247" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crown Court and County Court; often</text><text x="559.3424657534247" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a step to full-time posts</text><line x1="80" y1="554" x2="870" y2="554" stroke="#c9d6d4" stroke-width="1.5"/><rect x="80" y="554" width="216.43835616438358" height="89" fill="#dce9e7"/><text x="94" y="580.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">District judges</text><rect x="296.43835616438355" y="554" width="248.90410958904107" height="89" fill="#f8faf9"/><text x="310.43835616438355" y="580.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Five years</text><rect x="545.3424657534247" y="554" width="324.6575342465753" height="89" fill="#f8faf9"/><text x="559.3424657534247" y="580.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most County Court work incl. small</text><text x="559.3424657534247" y="601.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">claims; magistrates’ courts: criminal</text><text x="559.3424657534247" y="622.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cases alone</text></g><line x1="296.43835616438355" y1="124" x2="296.43835616438355" y2="643" stroke="#c9d6d4" stroke-width="1.5"/><line x1="545.3424657534247" y1="124" x2="545.3424657534247" y2="643" stroke="#c9d6d4" stroke-width="1.5"/><rect x="80" y="124" width="790" height="519" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="176" width="38" height="238" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="49" y="295" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 49 295)" dy="6">SUPERIOR</text><rect x="30" y="422" width="38" height="217" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="49" y="530.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 49 530.5)" dy="6">INFERIOR</text>
</svg>