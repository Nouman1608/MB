<rect width="900" height="649" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The jury: eligibility, vetting and challenges</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Juries Act 1974, as amended</text>
<rect x="30" y="124" width="270.6666666666667" height="172" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ELIGIBLE</text><text x="46" y="183.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Aged 18–75</text><text x="46" y="208.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">On the electoral register</text><text x="46" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UK resident 5+ years since</text><text x="61.2" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">age 13</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DISQUALIFIED</text><text x="330.6666666666667" y="183.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">5+ years’ imprisonment: for</text><text x="345.8666666666667" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">life</text><text x="330.6666666666667" y="229.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Recently served a sentence,</text><text x="345.8666666666667" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or on bail</text><text x="330.6666666666667" y="275.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lacking mental capacity</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="172" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POLICE, LAWYERS, JUDGES</text><text x="615.3333333333334" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May serve (CJA 2003), but <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan></text><text x="615.3333333333334" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Abdroikov</tspan> (2007): appearance</text><text x="615.3333333333334" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of bias quashed two of three</text><text x="615.3333333333334" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">convictions</text><rect x="30" y="318" width="413" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="346" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VETTING</text><text x="46" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Routine</tspan> <tspan font-weight="700" fill="#1e2a44">police</tspan> <tspan font-weight="700" fill="#1e2a44">checks</tspan> for disqualification (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan></text><text x="46" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Mason</tspan>, 1980)</text><text x="46" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Authorised</tspan> <tspan font-weight="700" fill="#1e2a44">checks</tspan> in national security and</text><text x="46" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">terrorism cases (Attorney General’s guidelines)</text><rect x="457" y="318" width="413" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="346" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHALLENGES</text><text x="473" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">To</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">array:</tspan> the whole panel</text><text x="473" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">For</tspan> <tspan font-weight="700" fill="#1e2a44">cause:</tspan> one juror, e.g. knows the defendant</text><text x="473" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Stand</tspan> <tspan font-weight="700" fill="#1e2a44">by:</tspan> prosecution moves a juror back</text><text x="473" y="452.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No peremptory challenge since 1988; no right to a</text><text x="473" y="473.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">racially balanced jury (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ford</tspan>)</text><rect x="30" y="516" width="840" height="101" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="544" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IN COURT</text><text x="46" y="575.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Twelve jurors decide the facts in secret after the judge directs them on law. Majority verdict of 10–2 after</text><text x="46" y="596.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">at least two hours (s17).</text>
</svg>