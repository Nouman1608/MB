<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Protecting judicial independence</text>

<line x1="330" y1="181.5" x2="406" y2="253.95" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="295.5" x2="406" y2="288.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="399" x2="406" y2="319.2" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="160.5" x2="494" y2="247.65" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="285" x2="494" y2="285" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="409.5" x2="494" y2="322.35" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="285" r="88" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="279.54" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Judicial</text><text x="450" y="305.16" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">independence</text><rect x="30" y="121" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Security of tenure</text><text x="46" y="179.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Superior judges removable only on</text><text x="46" y="200.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an address from both Houses</text><text x="46" y="221.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(used once, 1830)</text><rect x="30" y="256" width="300" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="286.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Salaries</text><text x="46" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Paid from the Consolidated Fund</text><rect x="30" y="349" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="379.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Immunity from suit</text><text x="46" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">For judicial acts: <tspan font-style="italic">Sirros</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Moore</tspan></text><text x="46" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1975)</text><rect x="570" y="100" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="130.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Separation of powers</text><text x="586" y="158.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Full-time judges cannot be MPs;</text><text x="586" y="179.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Supreme Court replaced the Lords’</text><text x="586" y="200.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Appellate Committee (2009)</text><rect x="570" y="235" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="265.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Statutory guarantee</text><text x="586" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s3 CRA 2005: ministers must</text><text x="586" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">uphold independence</text><rect x="570" y="349" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="379.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Impartiality</text><text x="586" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Re</tspan> <tspan font-style="italic">Pinochet</tspan> (1999): decision set</text><text x="586" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aside over Lord Hoffmann’s links</text><text x="586" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with Amnesty International</text><rect x="30" y="492" width="413" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="520" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRONG IN LAW</text><text x="46" y="551.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tenure, pay, immunity and statute protect</text><text x="46" y="572.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decisions from pressure.</text><rect x="457" y="492" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="520" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BUT</text><text x="473" y="551.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Media pressure: the <tspan font-style="italic">Miller</tspan> (2016) judges called</text><text x="473" y="572.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Enemies of the People”. Diversity lags behind the</text><text x="473" y="593.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">population.</text>
</svg>