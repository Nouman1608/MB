<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 751" width="900" height="751" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="751" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How judges are selected and appointed</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Judicial Appointments Commission, created by the Constitutional Reform Act 2005</text>
<rect x="30" y="124" width="183" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="121.5" y="173.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Qualifying tests</text><line x1="219" y1="169" x2="243" y2="169" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="249" y="124" width="183" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="340.5" y="173.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Shortlisting</text><line x1="438" y1="169" x2="462" y2="169" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="468" y="124" width="183" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="559.5" y="173.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">References</text><line x1="657" y1="169" x2="681" y2="169" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="687" y="124" width="183" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="778.5" y="150.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Selection day</text><text x="778.5" y="177" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">interview and</text><text x="778.5" y="197" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">role-play</text><line x1="450" y1="238" x2="450" y2="266" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="220" y="272" width="460" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="306.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">JAC recommends ONE candidate</text><text x="450" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Judges, lawyers and lay members; must encourage</text><text x="450" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">diversity among applicants</text><line x1="450" y1="405" x2="450" y2="433" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="400" y1="533" x2="223.33333333333331" y2="567" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="533" x2="450" y2="567" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="500" y1="533" x2="676.6666666666666" y2="567" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="220" y="439" width="460" height="88" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="473.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Lord Chancellor</text><text x="450" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">or, for many lower posts, the Lord Chief Justice</text><rect x="120" y="573" width="206.66666666666666" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="223.33333333333331" y="610.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Accept</text><rect x="346.66666666666663" y="573" width="206.66666666666666" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="449.99999999999994" y="610.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reject</text><rect x="573.3333333333333" y="573" width="206.66666666666666" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="676.6666666666666" y="600.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ask for</text><text x="676.6666666666666" y="621.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">reconsideration</text><rect x="30" y="661" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="694.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Supreme</tspan> <tspan font-weight="700" fill="#1e2a44">Court</tspan> <tspan font-weight="700" fill="#1e2a44">Justices</tspan> are chosen by a special selection commission.</text>
</svg>