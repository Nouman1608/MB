<rect width="900" height="878" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who represents and who regulates</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Legal Services Act 2007: representation separated from regulation</text>
<rect x="250" y="124" width="400" height="89" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Legal Services Board</text><text x="450" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">oversees the regulators</text><path d="M450,213 L450,231 M235,231 L665,231" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="235" y1="231" x2="235" y2="250" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="665" y1="231" x2="665" y2="250" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="253" width="410" height="44" rx="12" fill="#2e6b62"/><text x="235" y="282" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Barristers</text><rect x="460" y="253" width="410" height="44" rx="12" fill="#2e6b62"/><text x="665" y="282" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Solicitors</text><rect x="30" y="309" width="410" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="341" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REPRESENTS AND PROMOTES</text><text x="50" y="367.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Bar Council</text><rect x="460" y="309" width="410" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="341" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REPRESENTS AND PROMOTES</text><text x="480" y="367.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Law Society</text><rect x="30" y="404" width="410" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REGULATES</text><text x="50" y="462.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bar Standards Board</text><text x="50" y="490.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Education and training standards; code of</text><text x="50" y="511.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conduct; investigates breaches; disciplinary</text><text x="50" y="532.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proceedings</text><rect x="460" y="404" width="410" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REGULATES</text><text x="480" y="462.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Solicitors Regulation Authority</text><text x="480" y="490.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Admission standards and conduct rules;</text><text x="480" y="511.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">investigates misconduct; prosecutes serious</text><text x="480" y="532.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cases</text><line x1="665" y1="561" x2="665" y2="593" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="597" width="410" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="631.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Solicitors Disciplinary Tribunal</text><text x="665" y="659.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Can strike a solicitor off the roll</text><text x="30" y="740" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">COMPLAINTS ABOUT POOR SERVICE</text><rect x="30" y="752" width="253.33333333333334" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156.66666666666669" y="793.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Complain to the lawyer</text><text x="156.66666666666669" y="814.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">first</text><line x1="289.33333333333337" y1="799" x2="317.33333333333337" y2="799" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="752" width="253.33333333333334" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450.00000000000006" y="779.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Refer to the Legal</text><text x="450.00000000000006" y="800.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ombudsman</text><text x="450.00000000000006" y="827.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">independent scheme</text><line x1="582.6666666666667" y1="799" x2="610.6666666666667" y2="799" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="752" width="253.33333333333334" height="94" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="743.3333333333334" y="779.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Remedies</text><text x="743.3333333333334" y="806.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">apology, refund or reduction</text><text x="743.3333333333334" y="827.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">of fees, compensation</text>
</svg>