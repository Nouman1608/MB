<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Digestive enzymes</text>

<rect x="30" y="110" width="840" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Amylase</text><text x="60" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a carbohydrase</text><line x1="230" y1="190" x2="390" y2="190" stroke="#1e2a44" stroke-width="3"/><polygon points="235,178 255,178 262,190 255,202 235,202 228,190" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><polygon points="271,178 291,178 298,190 291,202 271,202 264,190" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><polygon points="307,178 327,178 334,190 327,202 307,202 300,190" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><polygon points="343,178 363,178 370,190 363,202 343,202 336,190" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><polygon points="379,178 399,178 406,190 399,202 379,202 372,190" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="310" y="240" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">starch</text><line x1="410" y1="190" x2="480" y2="190" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="445" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">amylase</text><line x1="500" y1="190" x2="560" y2="190" stroke="#1e2a44" stroke-width="3"/><polygon points="505,178 525,178 532,190 525,202 505,202 498,190" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><polygon points="541,178 561,178 568,190 561,202 541,202 534,190" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="580" y1="190" x2="640" y2="190" stroke="#1e2a44" stroke-width="3"/><polygon points="585,178 605,178 612,190 605,202 585,202 578,190" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><polygon points="621,178 641,178 648,190 641,202 621,202 614,190" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="590" y="240" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">maltose (then glucose)</text><text x="700" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">made in:</text><text x="700" y="190" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">salivary glands,</text><text x="700" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pancreas</text><rect x="30" y="280" width="840" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="320" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Protease</text><text x="60" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">e.g. pepsin</text><line x1="230" y1="360" x2="390" y2="360" stroke="#1e2a44" stroke-width="3"/><circle cx="240" cy="360" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="276" cy="360" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><circle cx="312" cy="360" r="13" fill="#b5602e" stroke="#1e2a44" stroke-width="2.2"/><circle cx="348" cy="360" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="384" cy="360" r="13" fill="#c9b6dd" stroke="#1e2a44" stroke-width="2.2"/><text x="310" y="410" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">proteins</text><line x1="410" y1="360" x2="480" y2="360" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="445" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">protease</text><circle cx="505" cy="350" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="539" cy="370" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><circle cx="573" cy="350" r="13" fill="#b5602e" stroke="#1e2a44" stroke-width="2.2"/><circle cx="607" cy="370" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="641" cy="350" r="13" fill="#c9b6dd" stroke="#1e2a44" stroke-width="2.2"/><text x="590" y="410" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">amino acids</text><text x="700" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">made in:</text><text x="700" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stomach, pancreas,</text><text x="700" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">small intestine</text><rect x="30" y="450" width="840" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="490" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Lipase</text><rect x="232" y="500" width="14" height="62" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="246" y1="510" x2="380" y2="510" stroke="#8a6d0d" stroke-width="7" stroke-linecap="round"/><line x1="246" y1="531" x2="380" y2="531" stroke="#8a6d0d" stroke-width="7" stroke-linecap="round"/><line x1="246" y1="552" x2="380" y2="552" stroke="#8a6d0d" stroke-width="7" stroke-linecap="round"/><text x="310" y="580" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">lipids (fats)</text><line x1="410" y1="530" x2="480" y2="530" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="445" y="516" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lipase</text><rect x="500" y="500" width="14" height="62" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="540" y1="506" x2="640" y2="506" stroke="#8a6d0d" stroke-width="7" stroke-linecap="round"/><line x1="548" y1="528" x2="648" y2="528" stroke="#8a6d0d" stroke-width="7" stroke-linecap="round"/><line x1="556" y1="550" x2="656" y2="550" stroke="#8a6d0d" stroke-width="7" stroke-linecap="round"/><text x="590" y="580" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">fatty acids and glycerol</text><text x="700" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">made in:</text><text x="700" y="530" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pancreas, small</text><text x="700" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">intestine</text><rect x="30" y="620" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="658" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bile is not an enzyme.</text><text x="60" y="690" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Made in the liver, stored in the gall bladder: it emulsifies fats into small droplets</text><text x="60" y="714" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(more surface area for lipase) and neutralises stomach acid.</text>
</svg>