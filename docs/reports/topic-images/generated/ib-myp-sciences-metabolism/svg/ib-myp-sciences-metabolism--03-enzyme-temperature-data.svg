<rect x="30" y="110" width="840" height="510" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="140" y1="500" x2="580" y2="500" stroke="#1e2a44" stroke-width="3"/><line x1="140" y1="500" x2="140" y2="180" stroke="#1e2a44" stroke-width="3"/><text x="360" y="544" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">temperature (°C)</text><text x="90" y="340" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 90 340)">rate, 1000/time (s⁻¹ × 10⁻³)</text><rect x="272" y="180" width="176" height="320" fill="#f2e7b8" opacity="0.8"/><text x="360" y="460" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">true optimum</text><text x="360" y="480" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">somewhere here</text><path d="M184,436.45714285714286 L272,373.14285714285717 L360,214.28571428571428 L448,309.1428571428571 L536,461.9428571428571" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M177,429.45714285714286 L191,443.45714285714286 M191,429.45714285714286 L177,443.45714285714286" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="196" y="426.45714285714286" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">5.56</text><path d="M265,366.14285714285717 L279,380.14285714285717 M279,366.14285714285717 L265,380.14285714285717" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="284" y="363.14285714285717" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">11.1</text><path d="M353,207.28571428571428 L367,221.28571428571428 M367,207.28571428571428 L353,221.28571428571428" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="360" y="200.28571428571428" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">25.0</text><path d="M441,302.1428571428571 L455,316.1428571428571 M455,302.1428571428571 L441,316.1428571428571" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="460" y="299.1428571428571" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">16.7</text><path d="M529,454.9428571428571 L543,468.9428571428571 M543,454.9428571428571 L529,468.9428571428571" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="548" y="451.9428571428571" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">3.33</text><text x="184" y="522" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">15</text><line x1="184" y1="500" x2="184" y2="506" stroke="#1e2a44" stroke-width="2"/><text x="272" y="522" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">25</text><line x1="272" y1="500" x2="272" y2="506" stroke="#1e2a44" stroke-width="2"/><text x="360" y="522" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">35</text><line x1="360" y1="500" x2="360" y2="506" stroke="#1e2a44" stroke-width="2"/><text x="448" y="522" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">45</text><line x1="448" y1="500" x2="448" y2="506" stroke="#1e2a44" stroke-width="2"/><text x="536" y="522" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">55</text><line x1="536" y1="500" x2="536" y2="506" stroke="#1e2a44" stroke-width="2"/><text x="130" y="505" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="134" y1="500" x2="140" y2="500" stroke="#1e2a44" stroke-width="2"/><text x="130" y="390.7142857142857" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">10</text><line x1="134" y1="385.7142857142857" x2="140" y2="385.7142857142857" stroke="#1e2a44" stroke-width="2"/><text x="130" y="276.42857142857144" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">20</text><line x1="134" y1="271.42857142857144" x2="140" y2="271.42857142857144" stroke="#1e2a44" stroke-width="2"/><rect x="620" y="150" width="230" height="140" rx="12" fill="#dce9e7"/><text x="636" y="180" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Rising side</text><text x="636" y="206" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">faster molecules, more</text><text x="636" y="225" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">collisions, more</text><text x="636" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">enzyme–substrate</text><text x="636" y="263" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">complexes</text><rect x="620" y="305" width="230" height="140" rx="12" fill="#f6d9c6"/><text x="636" y="335" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Falling side</text><text x="636" y="361" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">bonds break, active</text><text x="636" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">site changes shape:</text><text x="636" y="399" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">enzyme denatured</text><text x="636" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(permanent)</text><text x="620" y="480" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">Improve: repeat at 2 °C</text><text x="620" y="500" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">steps from 30 to 44 °C.</text><text x="450" y="600" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Amylase timed to clear starch: 180, 90, 40, 60, 300 s at 15 to 55 °C.</text>
