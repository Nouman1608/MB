<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two kinds of metabolic reaction</text>

<rect x="30" y="110" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Anabolic: build up</text><text x="665" y="150" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Catabolic: break down</text><circle cx="90" cy="220" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="130" cy="236" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="170" cy="220" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="210" cy="236" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><line x1="235" y1="250" x2="235" y2="310" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="115" y1="350" x2="355" y2="350" stroke="#1e2a44" stroke-width="4"/><circle cx="115" cy="350" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="155" cy="350" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="195" cy="350" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="235" cy="350" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="275" cy="350" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="315" cy="350" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="355" cy="350" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><rect x="290" y="200" width="120" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="350" y="228" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">energy in</text><text x="60" y="410" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. photosynthesis; glucose → starch;</text><text x="60" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">amino acids → proteins</text><line x1="545" y1="220" x2="785" y2="220" stroke="#1e2a44" stroke-width="4"/><circle cx="545" cy="220" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="585" cy="220" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="625" cy="220" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="665" cy="220" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="705" cy="220" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="745" cy="220" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="785" cy="220" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><line x1="665" y1="250" x2="665" y2="310" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><circle cx="530" cy="350" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="570" cy="366" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="610" cy="350" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="650" cy="366" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><rect x="720" y="330" width="130" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="785" y="358" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">energy out</text><text x="490" y="410" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. respiration; digestion</text><text x="490" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(often releases energy)</text><rect x="30" y="510" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="548" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Metabolism = the sum of all the chemical reactions in an organism</text><text x="450" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Digestion’s small products feed the anabolic reactions in cells.</text>
</svg>