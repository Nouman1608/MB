ext-anchor="middle">10 cm</text><text x="370" y="750" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">start</text><rect x="620" y="680" width="20" height="40" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="630" y="660" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">20 cm</text><text x="630" y="750" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">× ¼</text><line x1="134" y1="700" x2="670" y2="700" stroke="#d4b02e" stroke-width="2" stroke-dasharray="6 6"/><text x="700" y="650" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Double the distance:</text><text x="700" y="672" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">a quarter of the light,</text><text x="700" y="694" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">not half.</text>
</svg>