e="#1e2a44" stroke-width="1.5"/><line x1="760" y1="242" x2="760" y2="256" stroke="#1e2a44" stroke-width="1.5"/><rect x="590" y="244" width="8" height="32" fill="#1e2a44"/><line x1="598" y1="260" x2="810" y2="260" stroke="#1e2a44" stroke-width="4"/><rect x="810" y="242" width="8" height="36" fill="#1e2a44"/><text x="620" y="315" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">gas syringe: 18 cm³ collected</text><line x1="380" y1="530" x2="290" y2="425" stroke="#1e2a44" stroke-width="1.8"/><text x="386" y="535" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">yeast in sugar solution</text><text x="310" y="160" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">CO₂ travels along the tube</text><rect x="470" y="360" width="380" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="490" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">rate = volume ÷ time</text><text x="490" y="432" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">= 18 ÷ 5</text><text x="490" y="470" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">= 3.6 cm³ min⁻¹</text><text x="450" y="568" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Always give the unit: a rate with no unit can lose marks.</text>
