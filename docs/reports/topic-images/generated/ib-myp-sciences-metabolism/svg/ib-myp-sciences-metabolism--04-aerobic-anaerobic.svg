<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Aerobic and anaerobic respiration</text>

<rect x="30" y="110" width="270" height="480" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Aerobic</text><text x="165" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">uses oxygen</text><rect x="45" y="196" width="240" height="80" rx="10" fill="#fff"/><text x="165" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">glucose + oxygen →</text><text x="165" y="252" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">carbon dioxide + water</text><text x="165" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">C₆H₁₂O₆ + 6O₂ → 6CO₂ +</text><text x="165" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">6H₂O</text><text x="165" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mainly in mitochondria</text><text x="165" y="400" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">energy released per glucose</text><rect x="70" y="420" width="190" height="140" fill="#fff" stroke="#1e2a44" stroke-width="2"/><rect x="70" y="420" width="190" height="140" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="165" y="450" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">much more</text><rect x="315" y="110" width="270" height="480" rx="14" fill="#f6d9c6" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Anaerobic: muscles</text><text x="450" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">no oxygen</text><rect x="330" y="196" width="240" height="80" rx="10" fill="#fff"/><text x="450" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">glucose →</text><text x="450" y="252" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">lactic acid</text><text x="450" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">oxygen debt afterwards</text><text x="450" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">during hard exercise</text><text x="450" y="400" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">energy released per glucose</text><rect x="355" y="420" width="190" height="140" fill="#fff" stroke="#1e2a44" stroke-width="2"/><rect x="355" y="525" width="190" height="35" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="509" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">much less</text><rect x="600" y="110" width="270" height="480" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Anaerobic: yeast</text><text x="735" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">no oxygen; fermentation</text><rect x="615" y="196" width="240" height="80" rx="10" fill="#fff"/><text x="735" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">glucose →</text><text x="735" y="252" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">ethanol + carbon dioxide</text><text x="735" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">also in plants</text><text x="735" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle"></text><text x="735" y="400" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">energy released per glucose</text><rect x="640" y="420" width="190" height="140" fill="#fff" stroke="#1e2a44" stroke-width="2"/><rect x="640" y="525" width="190" height="35" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="735" y="509" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">much less</text><text x="450" y="615" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Bar heights show “much more” and “much less” only; glucose is only partly broken down without oxygen.</text>
</svg>