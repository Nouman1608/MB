<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 783" width="900" height="783" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="783" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the Team Project runs</text>

<line x1="62" y1="124" x2="62" y2="569" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Choose a topic and a local issue</text><text x="128" y="168.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A specific, local instance of a global topic from the syllabus list.</text><circle cx="62" cy="148.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="157.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="203" width="762" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="238.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Research different aspects</text><text x="128" y="267.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Each member researches a different angle, such as a different perspective.</text><circle cx="62" cy="247.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="256.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="302" width="762" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="337.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Decide on a course of action</text><text x="128" y="366.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Combine the research and agree the action through discussion.</text><circle cx="62" cy="346.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="355.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="401" width="762" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="436.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plan and carry out the action</text><text x="128" y="465.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The team acts on the issue.</text><circle cx="62" cy="445.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="454.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="500" width="762" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="535.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Measure how successful it was</text><text x="128" y="564.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Judge the effect of the action.</text><circle cx="62" cy="544.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="553.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="450" y="627" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Built up alongside: the Explanation of Research and Planning</text><rect x="30" y="647" width="249.33333333333334" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="676" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 1</text><text x="46" y="701.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Topic and issue</text><text x="46" y="725.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">identified</text><line x1="285.33333333333337" y1="697" x2="319.33333333333337" y2="697" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="647" width="249.33333333333334" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341.33333333333337" y="676" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 2</text><text x="341.33333333333337" y="701.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Plan of action and</text><text x="341.33333333333337" y="725.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">roles</text><line x1="580.6666666666667" y1="697" x2="614.6666666666667" y2="697" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="647" width="249.33333333333334" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="636.6666666666667" y="676" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 3</text><text x="636.6666666666667" y="701.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Review of changes</text><text x="636.6666666666667" y="725.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">made</text>
</svg>