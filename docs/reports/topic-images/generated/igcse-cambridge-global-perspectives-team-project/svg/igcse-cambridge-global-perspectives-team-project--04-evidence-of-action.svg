/><rect x="94" y="328" width="436" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="356.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Presentations</text><rect x="40" y="388" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,409 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="384" width="436" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="412.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Event photographs</text><rect x="560" y="104" width="310" height="328" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="580" y="247" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DOES NOT COUNT</text><text x="580" y="274" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence of research or</text><text x="580" y="300" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">planning meetings</text><text x="580" y="329.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">It shows preparation, not the</text><text x="580" y="351.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">action itself.</text><circle cx="715" cy="174" r="34" fill="#ffffff" stroke="#b5602e" stroke-width="5"/><path d="M697,156 l36,36 m0,-36 l-36,36" fill="none" stroke="#b5602e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="450" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="483.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Any appropriate form works, as long as it shows what the team actually did.</text>
