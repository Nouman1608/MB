<line x1="290" y1="130" x2="356.5" y2="209.95" stroke="#1e2a44" stroke-width="2.5"/><line x1="290" y1="208" x2="356.5" y2="237.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="290" y1="298" x2="356.5" y2="268.75" stroke="#1e2a44" stroke-width="2.5"/><line x1="290" y1="376" x2="356.5" y2="296.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="610" y1="151" x2="543.5" y2="217.3" stroke="#1e2a44" stroke-width="2.5"/><line x1="610" y1="253" x2="543.5" y2="253" stroke="#1e2a44" stroke-width="2.5"/><line x1="610" y1="355" x2="543.5" y2="288.7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="253" r="110" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="236.25" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Collaboration,</text><text x="450" y="260" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">observed across</text><text x="450" y="283.75" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">the project</text><g transform="translate(0,0)"><rect x="30" y="104" width="260" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Clear communication</text><rect x="30" y="170" width="260" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="200.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sharing and developing</text><text x="46" y="224.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ideas</text><rect x="30" y="260" width="260" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Agreeing targets and</text><text x="46" y="314.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">deadlines</text><rect x="30" y="350" width="260" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="380.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Solving problems</text></g><g transform="translate(0,9)"><rect x="610" y="104" width="260" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Being flexible when</text><text x="626" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">required</text><rect x="610" y="194" width="260" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="224.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dividing tasks,</text><text x="626" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">recognising every</text><text x="626" y="272.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">contribution</text><rect x="610" y="308" width="260" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="338.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Asking for and giving</text><text x="626" y="362.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">support</text></g><rect x="30" y="420" width="405" height="93" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="232.5" y="457.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5 marks</text><text x="232.5" y="488.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">the same for the whole team</text><rect x="465" y="420" width="405" height="93" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="667.5" y="457.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5 marks</text><text x="667.5" y="488.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">individual: can vary within a team</text>
