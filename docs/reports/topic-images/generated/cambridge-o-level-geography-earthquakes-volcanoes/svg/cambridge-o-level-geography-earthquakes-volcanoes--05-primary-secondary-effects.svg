<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Primary and secondary effects</text>

<rect x="30" y="110" width="840" height="245" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Earthquakes</text><rect x="55" y="172" width="300" height="165" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="75" y="202" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Primary</text><text x="160" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the event itself</text><text x="75" y="234" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="91" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Buildings and bridges</text><text x="91" y="255" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collapse</text><text x="75" y="282" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="91" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deaths and injuries</text><text x="75" y="309" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="91" y="309" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Roads and pipes broken</text><line x1="362" y1="255" x2="400" y2="255" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="405" y="172" width="445" height="165" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="425" y="202" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Secondary</text><text x="527" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what follows from it</text><text x="425" y="234" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="441" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fires from broken gas</text><text x="441" y="255" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pipes</text><text x="425" y="282" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="441" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tsunamis</text><text x="425" y="309" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="441" y="309" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Landslides</text><text x="640" y="234" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="656" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Disease from damaged</text><text x="656" y="255" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">water supply</text><text x="640" y="282" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="656" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Homelessness</text><text x="640" y="309" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="656" y="309" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economic loss</text><rect x="30" y="371" width="840" height="245" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="411" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Volcanoes</text><rect x="55" y="433" width="300" height="165" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="75" y="463" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Primary</text><text x="160" y="463" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the event itself</text><text x="75" y="495" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="91" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lava flows</text><text x="75" y="522" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="91" y="522" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pyroclastic flows</text><text x="75" y="549" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="91" y="549" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ash fall</text><text x="75" y="576" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="91" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Volcanic gases</text><line x1="362" y1="516" x2="400" y2="516" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="405" y="433" width="445" height="165" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="425" y="463" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Secondary</text><text x="527" y="463" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what follows from it</text><text x="425" y="495" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="441" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lahars (mudflows)</text><text x="425" y="522" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="441" y="522" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crop and livestock</text><text x="441" y="543" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">loss</text><text x="640" y="495" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="656" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Air travel disruption</text><text x="640" y="522" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="656" y="522" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Climate cooling from</text><text x="656" y="543" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ash and gas</text><text x="450" y="660" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The same hazard hits harder or softer depending on …</text><rect x="30" y="678" width="201" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130.5" y="704.58" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">magnitude</text><rect x="243" y="678" width="201" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="343.5" y="704.58" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">depth of focus</text><rect x="456" y="678" width="201" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="556.5" y="704.58" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">distance from epicentre</text><rect x="669" y="678" width="201" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="769.5" y="704.58" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">population density</text><rect x="30" y="732" width="201" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130.5" y="758.58" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">building quality</text><rect x="243" y="732" width="201" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="343.5" y="758.58" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">time of day</text><rect x="456" y="732" width="201" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="556.5" y="758.58" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">level of development</text><rect x="669" y="732" width="201" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="769.5" y="758.58" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">preparedness</text>
</svg>