<rect x="30" y="110" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><defs><clipPath id="eqclip"><rect x="50" y="190" width="440" height="260"/></clipPath></defs><rect x="50" y="190" width="440" height="260" fill="#cbbf9f"/><line x1="50" y1="190" x2="490" y2="190" stroke="#1e2a44" stroke-width="3"/><g clip-path="url(#eqclip)"><circle cx="270" cy="370" r="45" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray=""/><circle cx="270" cy="370" r="95" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="270" cy="370" r="145" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray=""/><circle cx="270" cy="370" r="195" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="270" cy="370" r="245" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray=""/></g><line x1="270" y1="370" x2="270" y2="190" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M270,356 l4,9 l10,1 l-8,7 l3,10 l-9,-5 l-9,5 l3,-10 l-8,-7 l10,-1 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="190" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="150" y="166" width="30" height="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M147,166 L165,153 L183,166 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="330" y="166" width="30" height="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M327,166 L345,153 L363,166 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="420" y="166" width="30" height="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M417,166 L435,153 L453,166 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="520" y="170" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Epicentre</text><text x="520" y="195" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">point on the surface directly above</text><text x="520" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the focus; shaking usually strongest</text><text x="520" y="270" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Seismic waves</text><text x="520" y="295" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shock waves radiating out</text><text x="520" y="316" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from the focus</text><text x="520" y="370" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Focus</text><text x="520" y="395" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">point underground where rock</text><text x="520" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fractures and energy is released</text><line x1="278" y1="188" x2="510" y2="165" stroke="#b5602e" stroke-width="1.6"/><line x1="290" y1="370" x2="510" y2="365" stroke="#1e2a44" stroke-width="1.6"/><rect x="30" y="490" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="526" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Shallow focus</text><rect x="50" y="580" width="370" height="140" fill="#cbbf9f"/><line x1="50" y1="580" x2="420" y2="580" stroke="#1e2a44" stroke-width="2.5"/><defs><clipPath id="cl30"><rect x="50" y="580" width="370" height="140"/></clipPath></defs><g clip-path="url(#cl30)"><path d="M205,615 A30,30 0 0 1 265,615" fill="none" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="6 5"/><path d="M175,615 A60,60 0 0 1 295,615" fill="none" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="6 5"/><path d="M145,615 A90,90 0 0 1 325,615" fill="none" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="6 5"/></g><path d="M235,605 l3,7 l8,1 l-6,5 l2,8 l-7,-4 l-7,4 l2,-8 l-6,-5 l8,-1 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M150,577 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8 l10,-8 l10,8" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="52" y="552" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">more surface damage</text><rect x="460" y="490" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="526" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Deep focus</text><rect x="480" y="580" width="370" height="140" fill="#cbbf9f"/><line x1="480" y1="580" x2="850" y2="580" stroke="#1e2a44" stroke-width="2.5"/><defs><clipPath id="cl460"><rect x="480" y="580" width="370" height="140"/></clipPath></defs><g clip-path="url(#cl460)"><path d="M635,700 A30,30 0 0 1 695,700" fill="none" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="6 5"/><path d="M605,700 A60,60 0 0 1 725,700" fill="none" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="6 5"/><path d="M575,700 A90,90 0 0 1 755,700" fill="none" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="6 5"/></g><path d="M665,690 l3,7 l8,1 l-6,5 l2,8 l-7,-4 l-7,4 l2,-8 l-6,-5 l8,-1 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M625,577 l10,-4 l10,4 l10,-4 l10,4 l10,-4 l10,4 l10,-4 l10,4" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="482" y="552" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">less damage at the surface</text><text x="450" y="772" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Same magnitude: the deep quake loses more energy before its waves reach the surface.</text><rect x="30" y="800" width="840" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="838" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Magnitude is logarithmic</text><rect x="80" y="860" width="90" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="905" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">M5</text><line x1="176" y1="895" x2="374" y2="895" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="275" y="882" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">×10 ground movement</text><text x="275" y="920" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">≈ ×32 energy</text><rect x="380" y="860" width="90" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="425" y="905" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">M6</text><line x1="476" y1="895" x2="674" y2="895" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="575" y="882" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">×10 ground movement</text><text x="575" y="920" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">≈ ×32 energy</text><rect x="680" y="860" width="90" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="725" y="905" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">M7</text>
</svg>