<rect x="30" y="110" width="410" height="640" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="45" y="440" width="380" height="95" fill="#d7dde0"/><line x1="45" y1="440" x2="425" y2="440" stroke="#1e2a44" stroke-width="2.5"/><text x="54" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Strato-volcano</text><text x="54" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">composite cone</text><path d="M90,440 L215,250 L255,250 L380,440 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M114.65,440 L215,250 L255,250 L355.35,440 Z" fill="#b9ab88" stroke="none" stroke-width="2.5"/><path d="M139.3,440 L215,250 L255,250 L330.7,440 Z" fill="#cbbf9f" stroke="none" stroke-width="2.5"/><path d="M163.95,440 L215,250 L255,250 L306.05,440 Z" fill="#b9ab88" stroke="none" stroke-width="2.5"/><path d="M188.60000000000002,440 L215,250 L255,250 L281.4,440 Z" fill="#cbbf9f" stroke="none" stroke-width="2.5"/><path d="M215,250 L235,266 L255,250 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M235,480 L235,266" fill="none" stroke="#d9772f" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><path d="M235,395 L320,346" fill="none" stroke="#d9772f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M202,229 Q191,229 192.1,218 Q193.2,205.9 207.5,208.1 Q213,191.6 232.25,194.9 Q248.75,185 259.75,204.25 Q279,204.25 277.9,219.1 Q279,229 268,229 Z" fill="#9aa6b2" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="235" cy="492" rx="70" ry="24" fill="#d9772f" stroke="#1e2a44" stroke-width="2.5"/><rect x="281" y="197.75" width="93" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="287" y="212" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">ash cloud</text><rect x="257" y="253.75" width="66" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="263" y="268" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">crater</text><rect x="321" y="328.225" width="133.8" height="19.575000000000003" rx="5" fill="#ffffff" opacity="0.92"/><text x="327" y="342" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">secondary vent</text><rect x="52" y="333.75" width="93" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="58" y="348" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">main vent</text><line x1="138" y1="343" x2="229" y2="343" stroke="#1e2a44" stroke-width="2"/><rect x="133.3" y="410.225" width="203.4" height="19.575000000000003" rx="5" fill="#ffffff" opacity="0.92"/><text x="235" y="424" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="middle">layers of ash and lava</text><rect x="307" y="484.225" width="125.1" height="19.575000000000003" rx="5" fill="#d7dde0" opacity="1"/><text x="313" y="498" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">magma chamber</text><text x="54" y="580" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Lava</text><text x="155" y="580" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">thick, viscous, flows a short way</text><text x="54" y="620" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Eruptions</text><text x="155" y="620" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">explosive: ash, pyroclastic flows</text><line x1="50" y1="594" x2="420" y2="594" stroke="#c9d6d4" stroke-width="1.5"/><text x="54" y="660" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Boundary</text><text x="155" y="660" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">destructive</text><line x1="50" y1="634" x2="420" y2="634" stroke="#c9d6d4" stroke-width="1.5"/><text x="54" y="700" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Examples</text><text x="155" y="700" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Mount Fuji; Mount St Helens</text><line x1="50" y1="674" x2="420" y2="674" stroke="#c9d6d4" stroke-width="1.5"/><rect x="460" y="110" width="410" height="640" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="475" y="440" width="380" height="95" fill="#d7dde0"/><line x1="475" y1="440" x2="855" y2="440" stroke="#1e2a44" stroke-width="2.5"/><text x="484" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Shield volcano</text><text x="484" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wide, gently sloping dome</text><path d="M480,440 Q665,340 850,440 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M517,440 Q665,354 813,440 Z" fill="#b9ab88" stroke="none" stroke-width="2.5"/><path d="M554,440 Q665,368 776,440 Z" fill="#cbbf9f" stroke="none" stroke-width="2.5"/><path d="M591,440 Q665,382 739,440 Z" fill="#b9ab88" stroke="none" stroke-width="2.5"/><path d="M665,480 L665,392" fill="none" stroke="#d9772f" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><path d="M649,390 L665,400 L681,390 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M679,394 Q755,406 840,437" fill="none" stroke="#d9772f" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="665" cy="492" rx="70" ry="24" fill="#d9772f" stroke="#1e2a44" stroke-width="2.5"/><rect x="632" y="357.75" width="66" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="665" y="372" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">crater</text><rect x="729" y="362.225" width="186" height="19.575000000000003" rx="5" fill="#ffffff" opacity="0.92"/><text x="735" y="376" font-size="14.5" font-weight="700" fill="#b5602e" text-anchor="start">runny lava flows far</text><rect x="494" y="414.225" width="229.5" height="19.575000000000003" rx="5" fill="#ffffff" opacity="0.92"/><text x="500" y="428" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">many layers of runny lava</text><rect x="737" y="484.225" width="125.1" height="19.575000000000003" rx="5" fill="#d7dde0" opacity="1"/><text x="743" y="498" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">magma chamber</text><rect x="539" y="457.75" width="48" height="20.25" rx="5" fill="#d7dde0" opacity="1"/><text x="545" y="472" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">vent</text><line x1="583" y1="467" x2="659" y2="467" stroke="#1e2a44" stroke-width="2"/><text x="484" y="580" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Lava</text><text x="585" y="580" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">runny, flows long distances</text><text x="484" y="620" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Eruptions</text><text x="585" y="620" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">frequent, gentle, effusive</text><line x1="480" y1="594" x2="850" y2="594" stroke="#c9d6d4" stroke-width="1.5"/><text x="484" y="660" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Boundary</text><text x="585" y="660" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">constructive or hotspot</text><line x1="480" y1="634" x2="850" y2="634" stroke="#c9d6d4" stroke-width="1.5"/><text x="484" y="700" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Example</text><text x="585" y="700" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Mauna Loa, Hawaii</text><line x1="480" y1="674" x2="850" y2="674" stroke="#c9d6d4" stroke-width="1.5"/>
</svg>