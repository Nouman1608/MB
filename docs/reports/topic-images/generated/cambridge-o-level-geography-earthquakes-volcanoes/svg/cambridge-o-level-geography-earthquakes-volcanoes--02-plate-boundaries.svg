<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 912" width="900" height="912" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="912" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of plate boundary</text>

<rect x="30" y="110" width="840" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="45" y="130" width="420" height="152" rx="10" fill="#dce9e7"/><rect x="45" y="239" width="420" height="43" fill="#f1d3b8"/><rect x="55" y="205" width="190" height="34" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="265" y="205" width="190" height="34" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M241,275 L241,207 L255,187 L269,207 L269,275 Z" fill="#d9772f" stroke="#1e2a44" stroke-width="2"/><line x1="215" y1="183" x2="135" y2="183" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="295" y1="183" x2="375" y2="183" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="226.5" y="156.75" width="57" height="20.25" rx="5" fill="#dce9e7" opacity="1"/><text x="255" y="171" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">ridge</text><text x="485" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Constructive (divergent)</text><text x="485" y="172" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Plates move apart; magma rises and forms new</text><text x="485" y="192" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">crust and an ocean ridge.</text><text x="485" y="230" font-size="15.5" font-weight="700" fill="#b5602e" text-anchor="start">Small, shallow earthquakes; runny lava</text><text x="485" y="256" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start">e.g. Mid-Atlantic Ridge, Iceland</text><rect x="30" y="308" width="840" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="45" y="328" width="420" height="152" rx="10" fill="#dce9e7"/><rect x="45" y="437" width="420" height="43" fill="#f1d3b8"/><path d="M55,403 L255,403 L345,463 L330,477 L245,433 L55,433 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M267,401 L455,401 L455,453 L300,453 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M345,401 L375,359 L405,401 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M357,453 Q367,423 375,363" fill="none" stroke="#d9772f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="345" cy="459" rx="16" ry="9" fill="#d9772f" stroke="#1e2a44" stroke-width="1.5"/><line x1="105" y1="385" x2="185" y2="385" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="445" y1="385" x2="415" y2="385" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="227.8" y="407.7" width="62.4" height="18.900000000000002" rx="5" fill="#dce9e7" opacity="0.95"/><text x="259" y="421" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">trench</text><rect x="121.8" y="449.7" width="146.4" height="18.900000000000002" rx="5" fill="#f1d3b8" opacity="1"/><text x="195" y="463" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">subducted, melts</text><text x="485" y="344" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Destructive: oceanic–continental</text><text x="485" y="370" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Denser oceanic plate is subducted and melts;</text><text x="485" y="390" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">trench and fold mountains form.</text><text x="485" y="428" font-size="15.5" font-weight="700" fill="#b5602e" text-anchor="start">Powerful earthquakes, explosive</text><text x="485" y="448" font-size="15.5" font-weight="700" fill="#b5602e" text-anchor="start">volcanoes, tsunamis</text><text x="485" y="474" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start">e.g. Nazca under South American Plate</text><rect x="30" y="506" width="840" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="45" y="526" width="420" height="152" rx="10" fill="#dce9e7"/><rect x="45" y="635" width="420" height="43" fill="#f1d3b8"/><path d="M55,597 L205,597 L230,561 L250,589 L267,549 L285,587 L307,565 L320,597 L455,597 L455,647 L55,647 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round"/><line x1="263" y1="597" x2="263" y2="647" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="85" y1="581" x2="175" y2="581" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="425" y1="581" x2="345" y2="581" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="198.2" y="617.7" width="129.6" height="18.900000000000002" rx="5" fill="#cbbf9f" opacity="1"/><text x="263" y="631" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">fold mountains</text><text x="485" y="542" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Collision: continental–continental</text><text x="485" y="568" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Neither plate is subducted; crust crumples</text><text x="485" y="588" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">into fold mountains.</text><text x="485" y="626" font-size="15.5" font-weight="700" fill="#b5602e" text-anchor="start">Strong earthquakes, no volcanoes</text><text x="485" y="652" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start">e.g. Indian and Eurasian Plates</text><rect x="30" y="704" width="840" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="45" y="724" width="420" height="152" rx="10" fill="#d8e3c6"/><line x1="55" y1="796" x2="455" y2="796" stroke="#1e2a44" stroke-width="4" stroke-dasharray="14 8"/><line x1="305" y1="766" x2="165" y2="766" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><line x1="205" y1="826" x2="345" y2="826" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="455" y="856" font-size="14" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">seen from above</text><rect x="384" y="788.7" width="54" height="18.900000000000002" rx="5" fill="#d8e3c6" opacity="1"/><text x="390" y="802" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="start">fault</text><text x="485" y="740" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conservative</text><text x="485" y="766" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Plates slide past each other; friction locks</text><text x="485" y="786" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">them until stress is released.</text><text x="485" y="824" font-size="15.5" font-weight="700" fill="#b5602e" text-anchor="start">Earthquakes, no volcanoes</text><text x="485" y="850" font-size="15.5" font-weight="600" fill="#2e6b62" text-anchor="start">e.g. San Andreas Fault</text>
</svg>