<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 818" width="900" height="818" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="818" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Case study: Mount St Helens, 18 May 1980</text>

<rect x="30" y="110" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="142" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="148.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="149" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Subduction</text><rect x="50" y="170" width="370" height="125" rx="8" fill="#dce9e7"/><line x1="50" y1="285" x2="420" y2="285" stroke="#1e2a44" stroke-width="2"/><path d="M50,230 L190,230 L290,292 L270,295 L180,250 L50,250 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M200,228 L420,228 L420,295 L270,295 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M300,228 L325,192 L350,228 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M285,288 Q315,250 325,198" fill="none" stroke="#d9772f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="54" y="204.7" width="112.8" height="18.900000000000002" rx="5" fill="#dce9e7" opacity="1"/><text x="60" y="218" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="start">Juan de Fuca</text><rect x="306" y="251.7" width="104.39999999999999" height="18.900000000000002" rx="5" fill="#cbbf9f" opacity="1"/><text x="312" y="265" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="start">N. American</text><text x="52" y="320" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Juan de Fuca Plate sinks beneath the North</text><text x="52" y="339" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">American Plate; magma builds up.</text><rect x="460" y="110" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="492" cy="142" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="148.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="520" y="149" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bulge</text><rect x="480" y="170" width="370" height="125" rx="8" fill="#dce9e7"/><line x1="480" y1="285" x2="850" y2="285" stroke="#1e2a44" stroke-width="2"/><path d="M570,285 L650,195 L680,195 L760,285 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M635,212 Q580,230 600,260" fill="none" stroke="#b5602e" stroke-width="3" stroke-dasharray="7 5"/><ellipse cx="665" cy="270" rx="26" ry="9" fill="#d9772f"/><rect x="484" y="188.7" width="96" height="18.900000000000002" rx="5" fill="#ffffff" opacity="0.92"/><text x="490" y="202" font-size="14" font-weight="700" fill="#b5602e" text-anchor="start">north side</text><rect x="484" y="206.7" width="89" height="18.900000000000002" rx="5" fill="#ffffff" opacity="0.92"/><text x="490" y="220" font-size="14" font-weight="400" fill="#b5602e" text-anchor="start">bulges out</text><text x="482" y="320" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">The north side of the volcano bulges</text><text x="482" y="339" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">outwards.</text><rect x="30" y="376" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="408" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="414.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="90" y="415" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Earthquake and landslide</text><rect x="50" y="436" width="370" height="125" rx="8" fill="#dce9e7"/><line x1="50" y1="551" x2="420" y2="551" stroke="#1e2a44" stroke-width="2"/><path d="M140,551 L220,461 L250,461 L330,551 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M205,478 Q140,501 165,536 L185,501 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><line x1="155" y1="504" x2="100" y2="544" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><path d="M240,534 l3,7 l8,1 l-6,5 l2,8 l-7,-4 l-7,4 l2,-8 l-6,-5 l8,-1 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><text x="52" y="586" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">An earthquake triggers a huge landslide of</text><text x="52" y="605" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">the bulging north face.</text><rect x="460" y="376" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="492" cy="408" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="492" y="414.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="520" y="415" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lateral blast</text><rect x="480" y="436" width="370" height="125" rx="8" fill="#dce9e7"/><line x1="480" y1="551" x2="850" y2="551" stroke="#1e2a44" stroke-width="2"/><path d="M570,551 L620,496 L660,481 L690,468 L760,551 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M522,507 Q511,507 512.1,496 Q513.2,483.9 527.5,486.1 Q533,469.6 552.25,472.9 Q568.75,463 579.75,482.25 Q599,482.25 597.9,497.1 Q599,507 588,507 Z" fill="#9aa6b2" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="610" y1="501" x2="515" y2="491" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="610" y1="516" x2="515" y2="516" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="610" y1="531" x2="515" y2="541" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="482" y="586" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Pressure is released sideways: a lateral</text><text x="482" y="605" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">blast.</text><rect x="30" y="646" width="272" height="150" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="679.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">People</text><text x="48" y="703.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">57 killed; homes, roads and</text><text x="48" y="724.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">bridges destroyed; ash fell</text><text x="48" y="744.67" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">over a wide area.</text><rect x="314" y="646" width="272" height="150" rx="14" fill="#ffffff" stroke="#6f9a52" stroke-width="2.5"/><text x="332" y="679.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Environment</text><text x="332" y="703.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Forests flattened; lahars</text><text x="332" y="724.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">filled valleys; wildlife</text><text x="332" y="744.67" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">killed; summit lowered,</text><text x="332" y="765.13" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">large crater.</text><rect x="598" y="646" width="272" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="616" y="679.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Management</text><text x="616" y="703.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Monitoring led to an</text><text x="616" y="724.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">exclusion zone before the</text><text x="616" y="744.67" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">eruption, which reduced the</text><text x="616" y="765.13" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">death toll.</text>
</svg>