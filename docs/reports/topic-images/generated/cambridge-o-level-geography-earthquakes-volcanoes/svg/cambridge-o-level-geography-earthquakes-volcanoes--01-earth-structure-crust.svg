<rect width="900" height="850" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Inside the Earth</text>

<rect x="30" y="110" width="840" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="240" cy="335" r="200" fill="#8c7d64" stroke="#1e2a44" stroke-width="3"/><circle cx="240" cy="335" r="190" fill="#f1d3b8" stroke="#1e2a44" stroke-width="2"/><circle cx="240" cy="335" r="105" fill="#e7a25c" stroke="#1e2a44" stroke-width="2"/><circle cx="240" cy="335" r="55" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="360.05398768850336" cy="181.3379030466892" r="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><polyline points="360.05398768850336,181.3379030466892 470,154 490,154" fill="none" stroke="#1e2a44" stroke-width="2"/><text x="500" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Crust</text><text x="500" y="185" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">thin and rigid</text><circle cx="375.9461680554975" cy="271.6072607388951" r="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><polyline points="375.9461680554975,271.6072607388951 470,249 490,249" fill="none" stroke="#1e2a44" stroke-width="2"/><text x="500" y="255" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Mantle</text><text x="500" y="280" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">thick; hot rock that flows very slowly</text><circle cx="322" cy="335" r="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><polyline points="322,335 470,344 490,344" fill="none" stroke="#1e2a44" stroke-width="2"/><text x="500" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Outer core</text><text x="500" y="375" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">liquid</text><circle cx="255.32088886237955" cy="347.8557521937308" r="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><polyline points="255.32088886237955,347.8557521937308 470,439 490,439" fill="none" stroke="#1e2a44" stroke-width="2"/><text x="500" y="445" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Inner core</text><text x="500" y="470" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">solid</text><text x="500" y="515" font-size="16.5" font-weight="700" fill="#2e6b62" text-anchor="start">Crust + top of the mantle = tectonic plates</text><text x="450" y="600" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Two kinds of crust</text><rect x="30" y="700" width="840" height="60" fill="#f1d3b8" stroke="#1e2a44" stroke-width="2"/><text x="450" y="740" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">mantle</text><rect x="30" y="672" width="400" height="28" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="630" width="400" height="42" fill="#b5d3cf" opacity="0.8"/><rect x="470" y="620" width="400" height="80" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="660" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">ocean</text><text x="230" y="792" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Oceanic crust</text><text x="230" y="818" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">thinner · denser · can be subducted</text><text x="670" y="792" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Continental crust</text><text x="670" y="818" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">thicker · less dense · too buoyant to sink</text>
</svg>