 stroke-width="3"/><text x="700" y="185.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="722" y="176" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">gas emissions</text><text x="722" y="196" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">change</text><circle cx="790" cy="300" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="790" y="305.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="812" y="340" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">ground</text><text x="812" y="360" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">swells</text><circle cx="520" cy="486" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="520" y="491.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="540" y="476.8" width="175.2" height="21.6" rx="5" fill="#d7dde0" opacity="1"/><text x="546" y="492" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">small earthquakes</text><text x="485" y="540" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Eruptions can often be forecast.</text><text x="485" y="565" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Tiltmeters and satellites detect swelling.</text><rect x="30" y="610" width="201" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="642.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Tsunami warnings</text><text x="48" y="666.9" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">minutes or hours of</text><text x="48" y="687.36" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">notice; sea walls</text><rect x="243" y="610" width="201" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="261" y="642.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Drills and kits</text><text x="261" y="666.9" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Japan: Disaster</text><text x="261" y="687.36" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Prevention Day, 1</text><text x="261" y="707.8199999999999" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">September</text><rect x="456" y="610" width="201" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="642.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Cool the lava</text><text x="474" y="666.9" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Heimaey, Iceland,</text><text x="474" y="687.36" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">1973: seawater</text><text x="474" y="707.8199999999999" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">pumped</text><rect x="669" y="610" width="201" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="687" y="642.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Plan land use</text><text x="687" y="666.9" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">exclusion zones,</text><text x="687" y="687.36" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">hazard maps; avoid</text><text x="687" y="707.8199999999999" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">unstable land</text>
