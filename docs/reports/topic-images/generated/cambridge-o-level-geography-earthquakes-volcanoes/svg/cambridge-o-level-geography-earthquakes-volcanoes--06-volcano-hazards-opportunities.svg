-weight="700" fill="#b5602e" text-anchor="start">Lava flows</text><line x1="160" y1="296" x2="385" y2="360" stroke="#b5602e" stroke-width="1.8"/><text x="60" y="400" font-size="17.5" font-weight="700" fill="#b5602e" text-anchor="start">Pyroclastic</text><text x="60" y="421" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">flows</text><line x1="165" y1="396" x2="320" y2="430" stroke="#b5602e" stroke-width="1.8"/><text x="500" y="168" font-size="17.5" font-weight="700" fill="#8a6d0d" text-anchor="start">Volcanic gases</text><line x1="498" y1="172" x2="466" y2="200" stroke="#8a6d0d" stroke-width="1.8"/><text x="840" y="152" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">OPPORTUNITIES</text><text x="840" y="260" font-size="17.5" font-weight="700" fill="#2e6b62" text-anchor="end">Fertile soils</text><text x="840" y="281" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">e.g. vineyards, orchards on Etna</text><line x1="700" y1="290" x2="590" y2="400" stroke="#2e6b62" stroke-width="1.8"/><text x="840" y="340" font-size="17.5" font-weight="700" fill="#2e6b62" text-anchor="end">Geothermal energy</text><text x="840" y="361" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">e.g. Iceland: power and heating</text><line x1="745" y1="370" x2="715" y2="410" stroke="#2e6b62" stroke-width="1.8"/><text x="840" y="420" font-size="17.5" font-weight="700" fill="#2e6b62" text-anchor="end">Tourism</text><rect x="30" y="530" width="410" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="564.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Also: minerals</text><text x="48" y="589.725" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Sulphur and volcanic rock for building</text><text x="48" y="611.505" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">materials.</text><rect x="460" y="530" width="410" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="564.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why people stay</text><text x="478" y="589.725" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Family and land are there, eruptions are</text><text x="478" y="611.505" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">infrequent, and they trust monitoring and</text><text x="478" y="633.2850000000001" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">warnings.</text>
