<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 764" width="900" height="764" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="764" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: answering another reading</text>

<rect x="30" y="110" width="840" height="138" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EVIDENCE</text><text x="50" y="173.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"the face that had never looked save with love upon her"</text><text x="50" y="202.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"no powerful will bending hers in that blind persistence with which men and women believe they have a</text><text x="50" y="223.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">right to impose a private will upon a fellow-creature"</text><line x1="450" y1="254" x2="450" y2="276" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="282" width="400" height="109" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="315" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ALTERNATIVE READING</text><text x="50" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Her joy is callous or shock; the husband is a</text><text x="50" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tyrant</text><rect x="470" y="282" width="400" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="315" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANSWERED BY EVIDENCE</text><text x="490" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A face "that had never looked save with love"</text><text x="490" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rules out the tyrant</text><line x1="436" y1="336.5" x2="464" y2="336.5" stroke="#b5602e" stroke-width="4"/><text x="450" y="326.5" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">✕</text><text x="450" y="431" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">"blind persistence" and "men and women" move the blame</text><circle cx="130" cy="521" r="48" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="130" y="527" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">one man</text><text x="130" y="595" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Brently Mallard</text><line x1="188" y1="521" x2="380" y2="521" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="450" cy="521" r="60" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="527" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a custom</text><text x="450" y="607" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">of men and women</text><line x1="520" y1="521" x2="688" y2="521" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="770" cy="521" r="72" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="770" y="527" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">an institution</text><text x="770" y="619" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">marriage as a structure</text><rect x="30" y="645" width="840" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="678" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONNECT TO THE THESIS</text><text x="50" y="709.6" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">The ending condemns marriage as a structure, not Brently Mallard as an individual.</text>
</svg>