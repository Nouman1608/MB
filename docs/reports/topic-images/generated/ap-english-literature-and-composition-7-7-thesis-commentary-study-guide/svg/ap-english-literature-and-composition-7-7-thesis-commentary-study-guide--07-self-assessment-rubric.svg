<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Self-assessment: from 1 to 3</text>

<rect x="244" y="110" width="202" height="44" rx="10" fill="#1e2a44"/><text x="345" y="139" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1  not yet</text><rect x="454" y="110" width="202" height="44" rx="10" fill="#1e2a44"/><text x="555" y="139" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="664" y="110" width="202" height="44" rx="10" fill="#1e2a44"/><text x="765" y="139" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3  secure</text><line x1="260" y1="172" x2="850" y2="172" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="34" y="235.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Thesis</text><rect x="244" y="188" width="202" height="83" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="345" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Summary or a list</text><rect x="454" y="188" width="202" height="83" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="555" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">General claim</text><rect x="664" y="188" width="202" height="83" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="765" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Specific, defensible</text><text x="765" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">interpretation that</text><text x="765" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">previews a direction</text><text x="34" y="316" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Line of reasoning</text><rect x="244" y="279" width="202" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="345" y="315.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A list of points</text><rect x="454" y="279" width="202" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="555" y="315.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Some logic</text><rect x="664" y="279" width="202" height="62" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="765" y="305" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Claims build, each</text><text x="765" y="326" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">needing proof</text><text x="34" y="396.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Commentary</text><rect x="244" y="349" width="202" height="83" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="345" y="396" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Restates evidence</text><rect x="454" y="349" width="202" height="83" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="555" y="396" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Interprets</text><rect x="664" y="349" width="202" height="83" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="765" y="375" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Interprets, explains</text><text x="765" y="396" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">how, connects to claim</text><text x="765" y="417" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and thesis</text><text x="34" y="487.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sophistication</text><rect x="244" y="440" width="202" height="83" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="345" y="487" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">None</text><rect x="454" y="440" width="202" height="83" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="555" y="476.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A move that sits apart</text><text x="555" y="497.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">from the argument</text><rect x="664" y="440" width="202" height="83" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="765" y="466" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A move that is</text><text x="765" y="487" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">integrated and</text><text x="765" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">supported by evidence</text><text x="34" y="578.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Control of the text</text><rect x="244" y="531" width="202" height="83" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="345" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A few details</text><rect x="454" y="531" width="202" height="83" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="555" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Several details</text><rect x="664" y="531" width="202" height="83" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="765" y="557" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Details chosen</text><text x="765" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">precisely, patterns</text><text x="765" y="599" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">traced</text>
</svg>