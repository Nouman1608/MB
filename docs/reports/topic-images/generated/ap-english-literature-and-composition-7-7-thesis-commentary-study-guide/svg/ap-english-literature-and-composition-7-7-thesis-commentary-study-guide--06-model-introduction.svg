<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A short model introduction</text>

<rect x="30" y="110" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SENTENCE 1: ORIENT</text><text x="50" y="174.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Kate Chopin's The Story of an Hour compresses a marriage, a bereavement and a death into a</text><text x="50" y="196.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">few pages, and it is in that compression that its argument lies."</text><text x="50" y="245" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">orients the reader without summarising the plot</text><rect x="30" y="265" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="298" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SENTENCE 2: THESIS</text><text x="50" y="329.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"By moving Mrs Mallard from a conventional outburst of grief to a private room where spring</text><text x="50" y="351.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">presses in, Chopin presents her joy as natural and long suppressed, so that the ending's irony</text><text x="50" y="373.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">condemns not a cruel husband but a marriage that leaves no space for the self."</text><line x1="450" y1="406" x2="450" y2="432" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="436" width="249.33333333333334" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="154.66666666666669" y="469.6" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">conventional grief</text><line x1="285.33333333333337" y1="465" x2="319.33333333333337" y2="465" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="436" width="249.33333333333334" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450.00000000000006" y="469.6" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">spring presses in</text><line x1="580.6666666666667" y1="465" x2="614.6666666666667" y2="465" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="436" width="249.33333333333334" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745.3333333333334" y="469.6" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">the ending's irony</text><text x="450" y="524" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">No long preamble: a clear route to the thesis, then a line of reasoning to follow</text>
</svg>