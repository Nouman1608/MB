<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From claim to a sophisticated argument</text>

<circle cx="450" cy="330" r="200" fill="#f2e7b8" fill-opacity="0.5" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="10 7"/><circle cx="450" cy="330" r="112" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="450" y="278" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THE BASICS</text><text x="450" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">thesis</text><text x="450" y="342" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">line of reasoning</text><text x="450" y="372" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">commentary</text><rect x="30" y="130" width="230" height="109" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="145" y="165.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Broader context</text><text x="145" y="193.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">why the interpretation</text><text x="145" y="214.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">matters beyond the text</text><line x1="339.3166491381646" y1="289.0952833771478" x2="220" y2="245" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="640" y="130" width="230" height="134" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="755" y="165.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Alternative</text><text x="755" y="190.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">interpretation</text><text x="755" y="218.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">state a different reading</text><text x="755" y="239.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and answer it</text><line x1="564.1788381428275" y1="300.21421613665365" x2="680" y2="270" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="335" y="560" width="230" height="109" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="595.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Analogy</text><text x="450" y="623.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a parallel that helps the</text><text x="450" y="644.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">audience understand</text><line x1="450" y1="448" x2="450" y2="554" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><text x="450" y="714" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle" font-style="italic">Each move connects the argument to something beyond a single sentence of evidence</text>
