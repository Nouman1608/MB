<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three moves that add sophistication</text>

<rect x="30" y="110" width="264" height="198" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DOES</text><text x="50" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Broader context</text><text x="50" y="199.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explains why the</text><text x="50" y="220.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interpretation matters</text><text x="50" y="241.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">beyond the single text: for a</text><text x="50" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">society, an idea, human</text><text x="50" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">experience</text><rect x="30" y="320" width="264" height="67" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="46" y="342" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">START</text><text x="46" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"This matters because ..."</text><rect x="30" y="399" width="264" height="88" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="7 5"/><text x="46" y="421" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">RISK</text><text x="46" y="443" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Making a grand claim without</text><text x="46" y="464" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evidence</text><rect x="318" y="110" width="264" height="198" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="338" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DOES</text><text x="338" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Alternative</text><text x="338" y="197" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">interpretation</text><text x="338" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">States a different reading</text><text x="338" y="246.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and answers it</text><rect x="318" y="320" width="264" height="88" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="334" y="342" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">START</text><text x="334" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"A reader might see ...</text><text x="334" y="385" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">However, ..."</text><rect x="318" y="420" width="264" height="88" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="7 5"/><text x="334" y="442" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">RISK</text><text x="334" y="464" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Listing readings without</text><text x="334" y="485" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">choosing between them</text><rect x="606" y="110" width="264" height="198" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DOES</text><text x="626" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Analogy</text><text x="626" y="199.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Uses a parallel to clarify the</text><text x="626" y="220.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interpretation</text><rect x="606" y="320" width="264" height="109" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="622" y="342" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">START</text><text x="622" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Like a prisoner who mourns</text><text x="622" y="385" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a kind jailer yet rejoices at an</text><text x="622" y="406" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">open gate, ..."</text><rect x="606" y="441" width="264" height="88" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="7 5"/><text x="622" y="463" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">RISK</text><text x="622" y="485" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An analogy that distracts or</text><text x="622" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">does not fit</text><text x="450" y="563" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Each move must be tied to evidence, and chosen, not just listed</text>
</svg>