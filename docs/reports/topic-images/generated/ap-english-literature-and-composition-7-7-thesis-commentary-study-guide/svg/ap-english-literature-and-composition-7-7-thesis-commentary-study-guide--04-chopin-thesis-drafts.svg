<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 751" width="900" height="751" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="751" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a thesis on The Story of an Hour</text>

<rect x="30" y="110" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="145" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Draft 1</text><text x="140" y="144.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Mrs Mallard is sad and then happy."</text><circle cx="600" cy="139" r="12" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M595,134 l10,10 M605,134 l-10,10" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="622" y="145" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">A summary of emotions</text><rect x="30" y="178" width="840" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="218" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Draft 2</text><text x="140" y="207" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Chopin uses setting and symbolism to show her</text><text x="140" y="228" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">feelings."</text><circle cx="600" cy="212" r="12" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M595,207 l10,10 M605,207 l-10,10" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="622" y="218" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Lists elements; no claim</text><rect x="30" y="256" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="291" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Draft 3</text><text x="140" y="290.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Chopin shows that Mrs Mallard feels free."</text><circle cx="600" cy="285" r="12" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M595,280 l10,10 M605,280 l-10,10" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="622" y="291" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Too obvious; no why</text><rect x="30" y="334" width="840" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="367" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DRAFT 4 (STRONG)</text><text x="50" y="398.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"By moving Mrs Mallard from a conventional outburst of grief to a private room where the open</text><text x="50" y="420.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">window brings spring and freedom, Chopin presents her joy as natural and long suppressed, so</text><text x="50" y="442.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">that the story's ironic ending condemns not a cruel husband but a marriage that leaves no space</text><text x="50" y="464.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">for the self."</text><text x="450" y="521" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The line of reasoning it sets up</text><rect x="30" y="617" width="195" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="644" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLAIM 1</text><text x="44" y="674.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conventional grief:</text><text x="44" y="695.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what she is expected</text><text x="44" y="716.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to feel</text><line x1="227" y1="657" x2="243" y2="639" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="245" y="591" width="195" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="259" y="618" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLAIM 2</text><text x="259" y="648.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Window and spring:</text><text x="259" y="669.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the new feeling as</text><text x="259" y="690.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">natural</text><line x1="442" y1="631" x2="458" y2="613" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="565" width="195" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="592" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLAIM 3</text><text x="474" y="622.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The marriage: kind</text><text x="474" y="643.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">but constraining</text><line x1="657" y1="605" x2="673" y2="587" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="675" y="539" width="195" height="118" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="689" y="566" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLAIM 4</text><text x="689" y="596.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The ironic ending: no</text><text x="689" y="617.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">space for such</text><text x="689" y="638.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">freedom</text>
</svg>