<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" width="900" height="511" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="511" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Commentary in short fiction</text>

<rect x="30" y="110" width="184.5" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOVE 1</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Interpret</text><line x1="220.5" y1="165.5" x2="242.5" y2="165.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="110" width="184.5" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="268.5" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOVE 2</text><text x="268.5" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain how</text><line x1="439" y1="165.5" x2="461" y2="165.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="110" width="184.5" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="487" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOVE 3</text><text x="487" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Connect to the</text><text x="487" y="195.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">claim</text><line x1="657.5" y1="165.5" x2="679.5" y2="165.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="110" width="184.5" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705.5" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOVE 4</text><text x="705.5" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Connect to the</text><text x="705.5" y="195.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">thesis</text><rect x="30" y="261" width="840" height="220" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="297" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">+ LOOK FOR A PATTERN</text><text x="50" y="325" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A short story is compact, so the same element often appears more than once. Tracing it gives</text><text x="50" y="347" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the commentary weight.</text><line x1="80" y1="421" x2="820" y2="421" stroke="#1e2a44" stroke-width="3"/><line x1="800" y1="421" x2="840" y2="421" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="150" cy="421" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="457" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">opening</text><circle cx="400" cy="421" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="400" y="457" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">middle</text><circle cx="650" cy="421" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="650" y="457" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">ending</text><path d="M150,403 Q275,363 400,403 Q525,363 650,403" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><text x="275" y="371" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle" font-style="italic">the same element returns</text>
</svg>