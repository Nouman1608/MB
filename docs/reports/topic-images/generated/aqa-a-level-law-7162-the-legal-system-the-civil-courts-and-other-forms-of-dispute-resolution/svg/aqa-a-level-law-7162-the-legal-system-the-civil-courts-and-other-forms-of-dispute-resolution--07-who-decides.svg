<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who decides the outcome?</text>

<rect x="30" y="100" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="150" y="138" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Negotiation</text><text x="450" y="138" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Mediation</text><text x="750" y="138" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Tribunal or court</text><circle cx="110" cy="180" r="11" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M110,191 L110,220 M96,202 L124,202 M110,220 L98,240 M110,220 L122,240" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="190" cy="180" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M190,191 L190,220 M176,202 L204,202 M190,220 L178,240 M190,220 L202,240" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M128,202 L172,202" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/><circle cx="395" cy="180" r="11" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M395,191 L395,220 M381,202 L409,202 M395,220 L383,240 M395,220 L407,240" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="505" cy="180" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M505,191 L505,220 M491,202 L519,202 M505,220 L493,240 M505,220 L517,240" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="450" cy="170" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M450,181 L450,210 M450,210 L438,230 M450,210 L462,230 M436,192 L464,192" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="262" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">neutral mediator</text><rect x="700" y="166" width="100" height="40" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="192" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">judge</text><circle cx="705" cy="216" r="11" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M705,227 L705,256 M691,238 L719,238 M705,256 L693,276 M705,256 L717,276" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="795" cy="216" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M795,227 L795,256 M781,238 L809,238 M795,256 L783,276 M795,256 L807,276" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="70" y1="310" x2="830" y2="310" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="70" y="296" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">parties keep full control</text><text x="830" y="296" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">a binding decision is imposed</text><text x="150" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Parties or lawyers agree a</text><text x="150" y="365" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">settlement</text><text x="450" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Agreement binding only if made</text><text x="450" y="365" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a contract or court order</text><text x="750" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Tribunals make binding</text><text x="750" y="365" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">decisions</text><rect x="30" y="422" width="840" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="452" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NEGOTIATION AND PART 36 OFFERS</text><text x="48" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most civil claims settle before trial. A party who rejects a Part 36 offer and then fails to do better at trial</text><text x="48" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">faces costs consequences. Strengths: private, cheapest, full control, any time. Weaknesses: unequal</text><text x="48" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bargaining power, no neutral helper, may stall.</text>
</svg>