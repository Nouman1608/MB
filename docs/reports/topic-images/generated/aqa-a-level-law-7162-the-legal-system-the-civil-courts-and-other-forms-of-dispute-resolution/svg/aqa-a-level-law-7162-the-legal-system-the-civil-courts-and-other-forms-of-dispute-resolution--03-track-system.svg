<rect width="900" height="691" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The track system</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Normal value of the claim</text>
<rect x="30" y="124" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="154" width="170" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Small claims</text><text x="135" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">up to £10,000</text><rect x="220" y="154" width="190" height="74" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="315" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fast track</text><text x="315" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">£10,000–£25,000</text><rect x="410" y="154" width="220" height="74" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="520" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Intermediate</text><text x="520" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">£25,000–£100,000</text><rect x="630" y="154" width="220" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Multi-track</text><text x="740" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">over £100,000 or complex</text><text x="60" y="254" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">District judge;</text><text x="60" y="273" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">informal; parties</text><text x="60" y="292" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">often act for</text><text x="60" y="311" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">themselves; costs</text><text x="60" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">generally not</text><text x="60" y="349" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">recoverable</text><text x="230" y="254" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Trial normally no longer</text><text x="230" y="273" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">than one day; limited</text><text x="230" y="292" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">experts; fixed costs</text><text x="420" y="254" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">From October 2023; trial up</text><text x="420" y="273" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to three days; limited</text><text x="420" y="292" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">experts; fixed costs</text><text x="640" y="254" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Active case management;</text><text x="640" y="273" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">County Court or High Court</text><line x1="220" y1="236" x2="220" y2="358" stroke="#c9d6d4" stroke-width="2"/><line x1="410" y1="236" x2="410" y2="358" stroke="#c9d6d4" stroke-width="2"/><line x1="630" y1="236" x2="630" y2="358" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="396" width="840" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="426" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SMALL CLAIMS: LOWER LIMITS</text><text x="48" y="457.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Personal injury generally up to £1,000; road traffic injury up to £5,000; housing disrepair up to £1,000.</text><text x="48" y="478.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most defended money claims go first to the free small claims mediation service.</text><text x="450" y="541" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">VALUE IS NOT THE ONLY FACTOR</text><rect x="131.84000000000003" y="555" width="238.944" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="251.312" y="575.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Complexity of facts and law</text><rect x="380.784" y="555" width="163.76" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="462.664" y="575.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Number of parties</text><rect x="554.544" y="555" width="213.616" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="661.352" y="575.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Amount of oral evidence</text><rect x="249.216" y="595" width="226.144" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="362.288" y="615.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Importance to non-parties</text><rect x="485.36" y="595" width="165.424" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="568.072" y="615.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">The parties’ views</text><text x="450" y="655" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">A complex £20,000 claim may go to a higher track.</text>
</svg>