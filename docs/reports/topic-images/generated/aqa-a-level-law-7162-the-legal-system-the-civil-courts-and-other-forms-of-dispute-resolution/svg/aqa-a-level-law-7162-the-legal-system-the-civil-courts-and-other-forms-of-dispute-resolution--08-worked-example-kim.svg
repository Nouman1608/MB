<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 677" width="900" height="677" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="677" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Kim is owed £6,500</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A decorator’s client says the work was poor</text>
<line x1="60" y1="144" x2="60" y2="625" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Negotiation first</text><text x="118" y="180.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Letter before claim; try to agree a reduced sum</text><circle cx="60" cy="161.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="170.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="209" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="237.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pre-action conduct</text><text x="118" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Expected by the court; avoids costs penalties</text><circle cx="60" cy="246.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="255.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="294" width="766" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="322.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Issue in the County Court: small claims track</text><text x="118" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Under £10,000</text><circle cx="60" cy="331.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="340.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="379" width="766" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="407.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mediation</text><text x="118" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Defended small claim normally referred to the free mediation service: quick, informal, keeps</text><text x="118" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">future work possible</text><circle cx="60" cy="427" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="435.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="485" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="513.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Small claims hearing</text><text x="118" y="541.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">District judge; informal; Kim can represent herself; costs generally not recoverable</text><circle cx="60" cy="522.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="531.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="570" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="598.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Appeal</text><text x="118" y="626.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Only with permission, to a circuit judge, if the decision was wrong</text><circle cx="60" cy="607.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="616.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>