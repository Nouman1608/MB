<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Civil courts at first instance</text>

<rect x="30" y="100" width="300" height="221" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COUNTY COURT</text><text x="48" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One national court, many</text><text x="48" y="179.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">hearing centres</text><text x="48" y="207.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The great majority of civil</text><text x="63.2" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">claims: contract, tort, debt,</text><text x="63.2" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing, family-related money</text><text x="48" y="275.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">District judges and circuit judges</text><rect x="350" y="100" width="520" height="221" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="368" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HIGH COURT</text><text x="368" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">London and regional centres: three divisions</text><rect x="364" y="179" width="157.33333333333334" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="376" y="204.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">King’s Bench</text><text x="376" y="231" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Higher-value or</text><text x="376" y="251" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">complex contract</text><text x="376" y="271" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and tort;</text><text x="376" y="291" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Commercial Court</text><rect x="531.3333333333334" y="179" width="157.33333333333334" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="543.3333333333334" y="204.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Chancery</text><text x="543.3333333333334" y="231" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Business,</text><text x="543.3333333333334" y="251" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">property, trusts,</text><text x="543.3333333333334" y="271" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">insolvency,</text><text x="543.3333333333334" y="291" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">probate</text><rect x="698.6666666666667" y="179" width="157.33333333333334" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="710.6666666666667" y="204.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><text x="710.6666666666667" y="231" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Complex family</text><text x="710.6666666666667" y="251" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cases</text><rect x="30" y="343" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="375" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHERE DOES A MONEY CLAIM START?</text><rect x="60" y="393" width="433.33333333333337" height="34" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="493.33333333333337" y="393" width="346.66666666666663" height="34" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="70" y="416" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Most money claims: County Court</text><text x="503.33333333333337" y="416" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">High Court possible: over £100,000</text><rect x="60" y="447" width="216.66666666666669" height="34" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="276.6666666666667" y="447" width="563.3333333333333" height="34" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="70" y="470" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Personal injury</text><text x="286.6666666666667" y="470" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">High Court possible: over £50,000</text>
</svg>