<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621" width="900" height="621" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="621" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Courts and mediation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A neutral mediator helps the parties reach their own agreement</text>
<rect x="30" y="124" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="70" y1="194" x2="830" y2="194" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="170" cy="194" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="170" y="172" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2002</text><text x="170" y="234" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Dunnett</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Railtrack</tspan></text><text x="170" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Winner denied costs for</text><text x="170" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">refusing to consider</text><text x="170" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">mediation</text><circle cx="450" cy="194" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="172" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2004</text><text x="450" y="234" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Halsey</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Milton</tspan> <tspan font-style="italic">Keynes</tspan> <tspan font-style="italic">NHS</tspan></text><text x="450" y="256" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Trust</tspan></text><text x="450" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Courts cannot compel</text><text x="450" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">mediation, but can penalise</text><text x="450" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">unreasonable refusal in costs</text><circle cx="730" cy="194" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="730" y="172" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2023</text><text x="730" y="234" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Churchill</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Merthyr</tspan> <tspan font-style="italic">Tydfil</tspan></text><text x="730" y="256" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">CBC</tspan></text><text x="730" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Courts can order non-court</text><text x="730" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">dispute resolution if fair trial</text><text x="730" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">not impaired and</text><text x="730" y="345" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">proportionate</text><rect x="30" y="396" width="319.87878787878793" height="193" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="424" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">USES</text><text x="46" y="455.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Small money claims (court</text><text x="61.2" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mediation service)</text><text x="46" y="501.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="501.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Neighbour and business disputes</text><text x="46" y="526.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="526.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family: usually a mediation</text><text x="61.2" y="547.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">information and assessment</text><text x="61.2" y="568.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meeting first</text><rect x="363.87878787878793" y="396" width="246.06060606060606" height="193" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="379.87878787878793" y="424" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTHS</text><text x="379.87878787878793" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheap, quick, private,</text><text x="379.87878787878793" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">flexible outcomes,</text><text x="379.87878787878793" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">preserves relationships</text><rect x="623.939393939394" y="396" width="246.06060606060606" height="193" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="639.939393939394" y="424" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESSES</text><text x="639.939393939394" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No guarantee of settlement;</text><text x="639.939393939394" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a weaker party may be</text><text x="639.939393939394" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pressured; no precedent</text>
</svg>