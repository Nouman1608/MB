<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The tribunal structure</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Tribunals, Courts and Enforcement Act 2007, after Franks (1957) and Leggatt (2001)</text>
<rect x="30" y="124" width="560" height="74" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="310" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Court of Appeal</text><text x="310" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">further appeal, with permission</text><rect x="30" y="244" width="560" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="274" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">UPPER TRIBUNAL: appeals on points of law; some judicial review</text><rect x="46" y="294" width="192.87" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="142.435" y="313.9" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Administrative Appeals</text><rect x="246.87" y="294" width="199.86" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="346.8" y="313.9" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Immigration and Asylum</text><rect x="46" y="333" width="156.165" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="124.0825" y="352.9" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Tax and Chancery</text><rect x="210.165" y="333" width="67.86" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="244.095" y="352.9" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Lands</text><rect x="30" y="426" width="560" height="175" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="456" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FIRST-TIER TRIBUNAL: hears cases at first instance</text><rect x="46" y="466" width="154.29" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="123.145" y="485.9" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Social Entitlement</text><rect x="208.29" y="466" width="199.86" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="308.22" y="485.9" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Immigration and Asylum</text><rect x="416.15" y="466" width="51.045" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="441.67249999999996" y="485.9" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Tax</text><rect x="475.195" y="466" width="87.06" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="518.725" y="485.9" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Property</text><rect x="46" y="505" width="163.365" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="127.6825" y="524.9" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">General Regulatory</text><rect x="217.365" y="505" width="269.22" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="351.975" y="524.9" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Health, Education and Social Care</text><rect x="46" y="544" width="370.185" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="231.0925" y="563.9" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">War Pensions and Armed Forces Compensation</text><line x1="310" y1="240" x2="310" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="310" y1="422" x2="310" y2="386" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620" y="124" width="250" height="477" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2" stroke-dasharray="8 6"/><text x="745" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">OUTSIDE THE TWO TIERS</text><rect x="640" y="244" width="210" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="271" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Employment Appeal</text><text x="745" y="292" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Tribunal</text><rect x="640" y="426" width="210" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="453" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Employment Tribunals</text><line x1="745" y1="422" x2="745" y2="314" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="745" y="518" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">First: <tspan font-weight="700">ACAS</tspan> <tspan font-weight="700">early</tspan></text><text x="745" y="538" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">conciliation</tspan> before most</text><text x="745" y="558" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">claims</text><rect x="30" y="623" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="655.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Led by the <tspan font-weight="700" fill="#1e2a44">Senior</tspan> <tspan font-weight="700" fill="#1e2a44">President</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">Tribunals</tspan>. Panels: a tribunal judge, and in some jurisdictions specialist</text><text x="450" y="676.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">members such as doctors.</text>
</svg>