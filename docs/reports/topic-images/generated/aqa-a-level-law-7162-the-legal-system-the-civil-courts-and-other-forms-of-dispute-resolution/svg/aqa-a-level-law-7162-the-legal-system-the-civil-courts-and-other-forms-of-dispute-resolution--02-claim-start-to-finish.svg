<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 788" width="900" height="788" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A claim from start to finish</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Civil Procedure Rules 1998, after Lord Woolf’s Access to Justice (1996)</text>
<line x1="60" y1="144" x2="60" y2="625" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pre-action conduct</text><text x="118" y="180.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Follow the pre-action protocol: exchange information, try to settle, consider alternatives. Ignoring</text><text x="118" y="201.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it risks costs penalties.</text><circle cx="60" cy="172" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="180.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="230" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="258.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Issuing</text><text x="118" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Claim form and particulars of claim; court fee; many money claims issued online</text><circle cx="60" cy="267.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="276.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="315" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="343.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Response</text><text x="118" y="371.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Admit, file a defence, or do nothing (claimant may ask for judgment in default)</text><circle cx="60" cy="352.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="361.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="400" width="766" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="428.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Allocation</text><text x="118" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">If defended: questionnaire, then allocation to a track</text><circle cx="60" cy="437.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="446.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="485" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="513.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Case management and trial</text><text x="118" y="541.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Timetable for disclosure, witness statements and experts; then the trial</text><circle cx="60" cy="522.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="531.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="570" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="598.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Enforcement</text><text x="118" y="626.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">If the loser does not pay: e.g. instructing enforcement agents</text><circle cx="60" cy="607.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="616.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="30" y="667" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="701.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Overriding objective</text><text x="450" y="731.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Deal with cases justly and at proportionate cost.</text>
</svg>