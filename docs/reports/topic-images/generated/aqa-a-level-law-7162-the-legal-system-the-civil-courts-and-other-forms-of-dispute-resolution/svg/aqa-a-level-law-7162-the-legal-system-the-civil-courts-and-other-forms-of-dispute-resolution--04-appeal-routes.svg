ght="700" fill="#1e2a44">principle</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">practice</tspan> or <tspan font-weight="700" fill="#1e2a44">some</tspan> <tspan font-weight="700" fill="#1e2a44">other</tspan> <tspan font-weight="700" fill="#1e2a44">compelling</tspan></text><text x="476" y="679.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">reason</tspan></text>
