<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Almost every appeal needs permission; it is not a rehearing</text>
<rect x="270" y="124" width="360" height="58" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Supreme Court</text><text x="450" y="171" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">point of law of general public importance</text><rect x="270" y="216" width="360" height="58" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="252" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Court of Appeal (Civil Division)</text><line x1="450" y1="212" x2="450" y2="188" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="270" y="308" width="360" height="58" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">High Court judge</text><line x1="450" y1="304" x2="450" y2="280" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="270" y="400" width="360" height="58" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="436" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Circuit judge (County Court)</text><line x1="450" y1="396" x2="450" y2="372" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="270" y="492" width="360" height="58" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="528" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">District judge (County Court)</text><line x1="450" y1="488" x2="450" y2="464" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="650" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">also a first-instance</text><text x="650" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">court for big claims</text><path d="M270,337 C150,337 150,153 264,153" fill="none" stroke="#8a6d0d" stroke-widt