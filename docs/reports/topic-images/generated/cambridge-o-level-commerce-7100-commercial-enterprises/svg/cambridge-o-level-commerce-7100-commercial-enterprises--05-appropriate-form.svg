<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Matching the form to the situation</text>

<rect x="30" y="110" width="198" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="129" y="140.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Capital needed?</text><line x1="230" y1="135" x2="239" y2="135" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="243" y="110" width="198" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="342" y="140.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Risk to owners?</text><line x1="443" y1="135" x2="452" y2="135" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="456" y="110" width="198" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="140.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Control wanted?</text><line x1="656" y1="135" x2="665" y2="135" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="669" y="110" width="198" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="768" y="140.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">How many share it?</text><rect x="30" y="185" width="330" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="223" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A tailor starting alone with</text><text x="50" y="245" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">savings of $3,000</text><line x1="368" y1="229" x2="428" y2="229" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="185" width="430" height="88" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="460" y="219" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Sole trader</text><text x="460" y="247" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Little capital; full control; quick to set up</text><rect x="30" y="285" width="330" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="323" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Three vets combining skills and</text><text x="50" y="345" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">equipment</text><line x1="368" y1="329" x2="428" y2="329" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="285" width="430" height="88" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="460" y="319" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Partnership</text><text x="460" y="347" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shared capital and expertise; shared workload</text><rect x="30" y="385" width="330" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="423" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A family bakery opening a second</text><text x="50" y="445" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">branch, no outside owners</text><line x1="368" y1="429" x2="428" y2="429" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="385" width="430" height="88" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="460" y="419" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Private limited company</text><text x="460" y="447" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limited liability; shares stay in the family</text><rect x="30" y="485" width="330" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="523" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A cement producer raising</text><text x="50" y="545" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">millions for a new plant</text><line x1="368" y1="529" x2="428" y2="529" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="485" width="430" height="88" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="460" y="519" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Public limited company</text><text x="460" y="547" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can raise very large capital from the public</text><rect x="30" y="585" width="330" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="623" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fifty coffee growers wanting to</text><text x="50" y="645" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sell together</text><line x1="368" y1="629" x2="428" y2="629" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="585" width="430" height="88" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="460" y="619" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Cooperative</text><text x="460" y="647" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Share facilities and gain bargaining power</text>
</svg>