<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What happens when the business fails?</text>

<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Sole trader: unlimited</text><rect x="80" y="205" width="90" height="315" fill="#f3d9c8" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="195" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$30,000</text><rect x="250" y="205" width="90" height="189" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="250" y="394" width="90" height="126.00000000000001" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="295" y="195" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$30,000</text><text x="295" y="305.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">18,000</text><text x="295" y="463" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">12,000</text><line x1="60" y1="520" x2="410" y2="520" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="544" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Debts</text><text x="295" y="544" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Paid from…</text><rect x="350" y="384" width="14" height="14" fill="#b5d3cf" stroke="#1e2a44"/><text x="370" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">shop</text><rect x="350" y="225" width="14" height="14" fill="#b5602e" stroke="#1e2a44"/><text x="370" y="237" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">owner’s</text><text x="370" y="255" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">property</text><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Shareholder: limited</text><rect x="500" y="190" width="330" height="70" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="219.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paid $5,000 for shares</text><text x="665" y="241.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">in a limited company</text><line x1="665" y1="266" x2="665" y2="306" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="500" y="312" width="330" height="60" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="347.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The company fails</text><line x1="665" y1="378" x2="665" y2="418" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="500" y="424" width="330" height="70" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="453.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Loses at most $5,000</text><text x="665" y="475.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">personal property safe</text><text x="665" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">The company is a separate legal entity.</text><text x="450" y="615" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Sole trader: debts $30,000 − assets $12,000 = $18,000 from personal property (invented figures).</text>
</svg>