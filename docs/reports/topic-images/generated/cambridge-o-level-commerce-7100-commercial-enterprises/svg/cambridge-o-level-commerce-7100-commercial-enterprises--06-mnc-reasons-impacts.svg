<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Multinationals: why they exist and what they bring</text>

<rect x="30" y="110" width="840" height="215" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why MNCs exist</text><circle cx="62" cy="176.4" r="5" fill="#2e6b62"/><text x="86" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reach new markets</text><circle cx="62" cy="207.4" r="5" fill="#2e6b62"/><text x="86" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheaper labour, land or raw materials</text><circle cx="62" cy="238.4" r="5" fill="#2e6b62"/><text x="86" y="244" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Avoid trade barriers such as tariffs</text><circle cx="62" cy="269.4" r="5" fill="#2e6b62"/><text x="86" y="275" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cut transport costs near customers</text><circle cx="482" cy="176.4" r="5" fill="#2e6b62"/><text x="506" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Spread risk</text><circle cx="482" cy="207.4" r="5" fill="#2e6b62"/><text x="506" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economies of scale</text><circle cx="482" cy="238.4" r="5" fill="#2e6b62"/><text x="506" y="244" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Host-government incentives</text><rect x="30" y="345" width="410" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="382" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Positive for the host country</text><circle cx="66" cy="414.4" r="12" fill="#2e6b62"/><path d="M60.6,414.64 L64.8,418.96 L72,410.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jobs and training for local workers</text><circle cx="66" cy="449.4" r="12" fill="#2e6b62"/><path d="M60.6,449.64 L64.8,453.96 L72,445.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">New technology and management skills</text><circle cx="66" cy="484.4" r="12" fill="#2e6b62"/><path d="M60.6,484.64 L64.8,488.96 L72,480.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="490" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Investment in factories and</text><text x="86" y="511" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">infrastructure</text><circle cx="66" cy="540.4" r="12" fill="#2e6b62"/><path d="M60.6,540.64 L64.8,544.9599999999999 L72,536.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="546" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tax revenue for the government</text><circle cx="66" cy="575.4" r="12" fill="#2e6b62"/><path d="M60.6,575.64 L64.8,579.9599999999999 L72,571.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="581" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More exports, wider consumer choice</text><rect x="460" y="345" width="410" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="382" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Negative for the host country</text><circle cx="496" cy="414.4" r="12" fill="#b5602e"/><path d="M491.44,409.84 L500.56,418.96 M500.56,409.84 L491.44,418.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Local firms may be unable to compete</text><circle cx="496" cy="449.4" r="12" fill="#b5602e"/><path d="M491.44,444.84 L500.56,453.96 M500.56,444.84 L491.44,453.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Profits may be sent home</text><circle cx="496" cy="484.4" r="12" fill="#b5602e"/><path d="M491.44,479.84 L500.56,488.96 M500.56,479.84 L491.44,488.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="490" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low wages or poor conditions</text><circle cx="496" cy="519.4" r="12" fill="#b5602e"/><path d="M491.44,514.84 L500.56,523.9599999999999 M500.56,514.84 L491.44,523.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="525" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Environmental damage, heavy resource</text><text x="516" y="546" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">use</text><circle cx="496" cy="575.4" r="12" fill="#b5602e"/><path d="M491.44,570.84 L500.56,579.9599999999999 M500.56,570.84 L491.44,579.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="581" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Influence over government; may leave</text><text x="516" y="602" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suddenly</text>
</svg>