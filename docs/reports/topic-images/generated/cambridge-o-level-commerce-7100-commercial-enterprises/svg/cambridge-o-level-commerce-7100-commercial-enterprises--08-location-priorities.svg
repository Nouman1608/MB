<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same factors, different priorities</text>

<rect x="30" y="110" width="270" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="155" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cement works</text><text x="165" y="212" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Ranks highest:</text><rect x="55" y="230" width="220" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="256.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Raw materials</text><rect x="55" y="284" width="220" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="310.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Transport</text><line x1="54" y1="455" x2="276" y2="455" stroke="#c9d6d4" stroke-width="2"/><text x="165" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Limestone is heavy and</text><text x="165" y="507" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">costly to move.</text><rect x="315" y="110" width="270" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="155" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">City café</text><text x="450" y="212" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Ranks highest:</text><rect x="340" y="230" width="220" height="42" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="256.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Markets</text><rect x="340" y="284" width="220" height="42" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="310.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Competition</text><line x1="339" y1="455" x2="561" y2="455" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Its customers come in</text><text x="450" y="507" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">person.</text><rect x="600" y="110" width="270" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="143" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Online electronics</text><text x="735" y="171" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">seller</text><text x="735" y="212" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Ranks highest:</text><rect x="625" y="230" width="220" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="256.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Wi-fi</text><rect x="625" y="284" width="220" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="310.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Warehousing</text><rect x="625" y="338" width="220" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="364.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Technology specialists</text><rect x="625" y="392" width="220" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="418.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Logistics</text><line x1="624" y1="455" x2="846" y2="455" stroke="#c9d6d4" stroke-width="2"/><text x="735" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Little need for passing</text><text x="735" y="507" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">trade; fast delivery</text><text x="735" y="528" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">matters.</text><text x="450" y="575" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Name the two or three factors that matter most, and say why for that business.</text>
