<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Public corporations: features and reasons</text>

<rect x="30" y="110" width="300" height="450" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Public corporation</text><circle cx="58" cy="184.4" r="5" fill="#8a6d0d"/><text x="82" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Owned by the state</text><circle cx="58" cy="217.4" r="5" fill="#8a6d0d"/><text x="82" y="223" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Run by a</text><text x="82" y="244" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">government-appointed board</text><circle cx="58" cy="271.4" r="5" fill="#8a6d0d"/><text x="82" y="277" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Financed by government and</text><text x="82" y="298" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">customers</text><circle cx="58" cy="325.4" r="5" fill="#8a6d0d"/><text x="82" y="331" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Accountable to government</text><text x="82" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and the public</text><circle cx="58" cy="379.4" r="5" fill="#8a6d0d"/><text x="82" y="385" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Aims to provide a service;</text><text x="82" y="406" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">often expected to cover</text><text x="82" y="427" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">costs</text><text x="605" y="132" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reasons for public corporations</text><rect x="360" y="148" width="510" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="380" y="174" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Essential services</text><text x="380" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">water, electricity, railways at affordable prices</text><line x1="356" y1="178" x2="338" y2="178" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="360" y="218" width="510" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="380" y="244" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Strategic industries</text><text x="380" y="267" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">energy or defence under national control</text><line x1="356" y1="248" x2="338" y2="248" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="360" y="288" width="510" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="380" y="314" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Loss-making areas</text><text x="380" y="337" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">where private firms would make a loss</text><line x1="356" y1="318" x2="338" y2="318" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="360" y="358" width="510" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="380" y="384" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Avoid a private monopoly</text><text x="380" y="407" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">exploiting customers</text><line x1="356" y1="388" x2="338" y2="388" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="360" y="428" width="510" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="380" y="454" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Very large projects</text><text x="380" y="477" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">more capital than private investors would risk</text><line x1="356" y1="458" x2="338" y2="458" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="360" y="498" width="510" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="380" y="524" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Protect employment</text><text x="380" y="547" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">in an important industry</text><line x1="356" y1="528" x2="338" y2="528" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/>
</svg>