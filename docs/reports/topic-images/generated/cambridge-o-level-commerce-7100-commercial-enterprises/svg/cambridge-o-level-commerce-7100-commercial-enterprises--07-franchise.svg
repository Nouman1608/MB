<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a franchise works</text>

<rect x="30" y="120" width="240" height="90" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="159.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Franchisor</text><text x="150" y="181.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">owns the brand</text><rect x="630" y="120" width="240" height="90" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="159.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Franchisee</text><text x="750" y="181.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">runs the outlet</text><line x1="282" y1="150" x2="618" y2="150" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="136" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">brand name, logo, products and methods</text><line x1="618" y1="186" x2="282" y2="186" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="212" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">initial fee + royalty (often % of sales)</text><text x="450" y="252" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">The franchisee must follow the franchisor’s rules.</text><text x="357.5" y="307" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Advantages</text><text x="702.5" y="307" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Disadvantages</text><rect x="30" y="323" width="150" height="170" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="414.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Franchisee</text><rect x="190" y="323" width="335" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="220" cy="355.4" r="12" fill="#2e6b62"/><path d="M214.6,355.64 L218.8,359.96 L226,351.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="361" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Known brand attracts customers</text><circle cx="220" cy="386.4" r="12" fill="#2e6b62"/><path d="M214.6,386.64 L218.8,390.96 L226,382.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Proven model lowers risk</text><circle cx="220" cy="417.4" r="12" fill="#2e6b62"/><path d="M214.6,417.64 L218.8,421.96 L226,413.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="423" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Training, national advertising,</text><text x="240" y="444" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supplies</text><rect x="535" y="323" width="335" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="355.4" r="12" fill="#b5602e"/><path d="M560.44,350.84 L569.56,359.96 M569.56,350.84 L560.44,359.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="361" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fees and royalties reduce profit</text><circle cx="565" cy="386.4" r="12" fill="#b5602e"/><path d="M560.44,381.84 L569.56,390.96 M569.56,381.84 L560.44,390.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Little freedom over products,</text><text x="585" y="413" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prices, decor</text><circle cx="565" cy="438.4" r="12" fill="#b5602e"/><path d="M560.44,433.84 L569.56,442.96 M569.56,433.84 L560.44,442.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="444" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contract may not be renewed</text><rect x="30" y="508" width="150" height="170" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="599.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Franchisor</text><rect x="190" y="508" width="335" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="220" cy="540.4" r="12" fill="#2e6b62"/><path d="M214.6,540.64 L218.8,544.9599999999999 L226,536.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="546" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fast expansion with franchisees’</text><text x="240" y="567" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">capital</text><circle cx="220" cy="592.4" r="12" fill="#2e6b62"/><path d="M214.6,592.64 L218.8,596.9599999999999 L226,588.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="598" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Income from fees and royalties</text><circle cx="220" cy="623.4" r="12" fill="#2e6b62"/><path d="M214.6,623.64 L218.8,627.9599999999999 L226,619.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="629" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Motivated owner-managers</text><rect x="535" y="508" width="335" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="540.4" r="12" fill="#b5602e"/><path d="M560.44,535.84 L569.56,544.9599999999999 M569.56,535.84 L560.44,544.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="546" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less direct control over quality</text><circle cx="565" cy="571.4" r="12" fill="#b5602e"/><path d="M560.44,566.84 L569.56,575.9599999999999 M569.56,566.84 L560.44,575.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="577" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One poor outlet can damage the</text><text x="585" y="598" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">brand</text><circle cx="565" cy="623.4" r="12" fill="#b5602e"/><path d="M560.44,618.84 L569.56,627.9599999999999 M569.56,618.84 L560.44,627.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="629" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shares profit</text>
</svg>