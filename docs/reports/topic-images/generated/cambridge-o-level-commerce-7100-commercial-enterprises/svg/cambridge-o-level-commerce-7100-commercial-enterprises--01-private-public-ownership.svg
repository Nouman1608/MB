<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Private or public sector?</text>

<rect x="30" y="110" width="410" height="300" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="150" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">Private sector</text><text x="54" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Owned by individuals or groups of</text><text x="54" y="212" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">private investors</text><text x="54" y="260" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Most aim to make a profit</text><rect x="54" y="300" width="362" height="80" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="335.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">e.g. a giant listed company</text><text x="235" y="356.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">is still private sector</text><rect x="460" y="110" width="410" height="300" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="150" font-size="24" font-weight="700" fill="#8a6d0d" text-anchor="middle">Public sector</text><text x="484" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Owned and controlled by the government</text><text x="484" y="212" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">on behalf of the people</text><text x="484" y="260" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Usually aim to provide a service</text><rect x="484" y="300" width="362" height="80" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="335.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">e.g. a small state-run post office</text><text x="665" y="356.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">is still public sector</text><rect x="30" y="430" width="840" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="473" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The test is ownership, not size.</text>
</svg>