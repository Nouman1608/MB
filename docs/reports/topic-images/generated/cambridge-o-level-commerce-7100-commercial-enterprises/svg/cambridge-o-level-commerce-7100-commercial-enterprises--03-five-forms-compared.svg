<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The five private sector forms compared</text>

<text x="215" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Owners</text><text x="400" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Control</text><text x="580" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Capital</text><text x="795" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Liability</text><rect x="30" y="142" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="192" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sole trader</text><text x="215" y="192" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">One person</text><text x="400" y="192" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Owner decides alone</text><text x="580" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Owner’s savings,</text><text x="580" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">loans</text><rect x="725" y="156" width="140" height="60" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="795" y="191.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Unlimited</text><rect x="30" y="242" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="292" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Partnership</text><text x="215" y="292" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Two or more partners</text><text x="400" y="270" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Shared, per</text><text x="400" y="290" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">partnership</text><text x="400" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">agreement</text><text x="580" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Partners’</text><text x="580" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">contributions</text><rect x="725" y="256" width="140" height="60" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="795" y="281.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Usually</text><text x="795" y="301.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">unlimited</text><rect x="30" y="342" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="392" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cooperative</text><text x="215" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Members</text><text x="400" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">One vote each,</text><text x="400" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">usually</text><text x="580" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Members’</text><text x="580" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">contributions</text><rect x="725" y="356" width="140" height="60" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="795" y="381.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Usually limited</text><text x="795" y="401.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">if registered</text><rect x="30" y="442" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="478" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Private limited</text><text x="46" y="502" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">company</text><text x="215" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Shareholders, shares</text><text x="215" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sold privately</text><text x="400" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Directors chosen by</text><text x="400" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">shareholders</text><text x="580" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Private share</text><text x="580" y="500" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sales</text><rect x="725" y="456" width="140" height="60" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="795" y="491.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Limited</text><rect x="30" y="542" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="578" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Public limited</text><text x="46" y="602" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">company</text><text x="215" y="580" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Shareholders, shares</text><text x="215" y="600" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">offered to the public</text><text x="400" y="570" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Directors; owners</text><text x="400" y="590" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and managers often</text><text x="400" y="610" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">differ</text><text x="580" y="580" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Public share</text><text x="580" y="600" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">issues: largest</text><rect x="725" y="556" width="140" height="60" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="795" y="591.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Limited</text><text x="450" y="660" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Companies are separate legal entities; sole traders and ordinary partnerships are not.</text>
</svg>