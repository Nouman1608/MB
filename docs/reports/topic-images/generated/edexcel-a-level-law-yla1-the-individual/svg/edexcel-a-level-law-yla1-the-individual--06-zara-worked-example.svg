<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 659" width="900" height="659" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="659" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Applying the 1984 Act to a child trespasser</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Zara, 9, climbs through a gap in a fence into a disused quarry and falls from a ledge</text>
<line x1="60" y1="144" x2="60" y2="476" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Is she a visitor or a trespasser?</text><text x="118" y="180.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A <tspan font-weight="700" fill="#1e2a44">trespasser</tspan>, so the <tspan font-weight="700" fill="#1e2a44">1984</tspan> <tspan font-weight="700" fill="#1e2a44">Act</tspan> applies.</text><circle cx="60" cy="161.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="170.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="209" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="237.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">s 1(3)(a) and (b)</text><text x="118" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The owner knew of the danger and that children came in: both met.</text><circle cx="60" cy="246.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="255.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="294" width="766" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="322.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">s 1(3)(c)</text><text x="118" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Risks to children from a quarry are ones the owner could reasonably be expected to guard</text><text x="118" y="371.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">against.</text><circle cx="60" cy="342" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="350.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="400" width="766" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="428.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Breach and remedy</text><text x="118" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mending the fence was cheap and practical, so breach is likely. Damages cover her <tspan font-weight="700" fill="#1e2a44">personal</tspan></text><text x="118" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">injury</tspan>.</text><circle cx="60" cy="448" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="456.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="518" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="552.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Remember</text><text x="50" y="581.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The 1984 Act covers personal injury only, not property (s 1(8)). <tspan font-style="italic">Tomlinson</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Congleton</tspan> <tspan font-style="italic">BC</tspan> [2003]: no</text><text x="50" y="602.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">liability where the danger was obvious.</text>
</svg>