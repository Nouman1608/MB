<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Taking a case to Strasbourg</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The European Court of Human Rights: Council of Europe, not the EU</text>
<rect x="30" y="124" width="147.2" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="103.6" y="171.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="103.6" y="195.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Exhaust</text><text x="103.6" y="215.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">domestic</text><text x="103.6" y="235.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">remedies</text><line x1="183.2" y1="199.5" x2="197.2" y2="199.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="203.2" y="124" width="147.2" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276.79999999999995" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="276.79999999999995" y="172.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Apply within</text><text x="276.79999999999995" y="192.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">four months</text><text x="276.79999999999995" y="219" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">of the final</text><text x="276.79999999999995" y="239" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">domestic</text><text x="276.79999999999995" y="259" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">decision</text><line x1="356.4" y1="199.5" x2="370.4" y2="199.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="376.4" y="124" width="147.2" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="181.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="450" y="205.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Admissibility,</text><text x="450" y="225.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">then merits</text><line x1="529.5999999999999" y1="199.5" x2="543.5999999999999" y2="199.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="549.5999999999999" y="124" width="147.2" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="623.1999999999999" y="158" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">4</text><text x="623.1999999999999" y="182.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Just</text><text x="623.1999999999999" y="202.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">satisfaction</text><text x="623.1999999999999" y="229" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">compensation if</text><text x="623.1999999999999" y="249" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a violation</text><line x1="702.8" y1="199.5" x2="716.8" y2="199.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="722.8" y="124" width="147.2" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="796.4" y="158" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">5</text><text x="796.4" y="182.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Committee of</text><text x="796.4" y="202.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Ministers</text><text x="796.4" y="229" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">supervises the</text><text x="796.4" y="249" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">state</text><rect x="30" y="297" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="331.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A judgment binds the UK in international law but does not itself change UK law</text><clipPath id="tc379"><rect x="30" y="379" width="840" height="236" rx="14"/></clipPath><g clip-path="url(#tc379)"><rect x="30" y="379" width="369.6" height="48" fill="#b5d3cf"/><text x="44" y="406.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Judgment</text><rect x="399.6" y="379" width="470.4" height="48" fill="#b5d3cf"/><text x="413.6" y="406.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Government response</text><rect x="30" y="427" width="369.6" height="47" fill="#dce9e7"/><text x="44" y="453.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Malone</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> [1984], telephone tapping</text><rect x="399.6" y="427" width="470.4" height="47" fill="#ffffff"/><text x="413.6" y="453.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Interception of Communications Act 1985</text><line x1="30" y1="474" x2="870" y2="474" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="474" width="369.6" height="47" fill="#dce9e7"/><text x="44" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Sunday</tspan> <tspan font-style="italic">Times</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> [1979]</text><rect x="399.6" y="474" width="470.4" height="47" fill="#f8faf9"/><text x="413.6" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contempt of Court Act 1981</text><line x1="30" y1="521" x2="870" y2="521" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="521" width="369.6" height="47" fill="#dce9e7"/><text x="44" y="547.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Goodwin</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> [2002]</text><rect x="399.6" y="521" width="470.4" height="47" fill="#ffffff"/><text x="413.6" y="547.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gender Recognition Act 2004</text><line x1="30" y1="568" x2="870" y2="568" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="568" width="369.6" height="47" fill="#dce9e7"/><text x="44" y="594.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hirst</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> <tspan font-style="italic">(No</tspan> <tspan font-style="italic">2)</tspan> [2005], prisoners' voting</text><rect x="399.6" y="568" width="470.4" height="47" fill="#f2e7b8"/><text x="413.6" y="594.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only a limited administrative change, many years later</text></g><line x1="399.6" y1="379" x2="399.6" y2="615" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="379" width="840" height="236" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
