<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 637" width="900" height="637" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="637" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Trespass to land</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Direct and intentional interference with land in another's possession</text>
<rect x="30" y="124" width="840" height="300" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="32" y="354" width="836" height="68" fill="#d8e3c6"/><line x1="450" y1="244" x2="450" y2="420" stroke="#1e2a44" stroke-width="3" stroke-dasharray="8 6"/><text x="440" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">boundary</text><rect x="560" y="274" width="150" height="80" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M550,274 L635,234 L720,274 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="635" y="324" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">claimant's land</text><rect x="200" y="244" width="150" height="110" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="350" y1="264" x2="520" y2="264" stroke="#1e2a44" stroke-width="4"/><rect x="470" y="268" width="70" height="32" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="505" y="290" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">SIGN</text><line x1="430" y1="236" x2="490" y2="268" stroke="#8a6d0d" stroke-width="2"/><rect x="250" y="204" width="200" height="36" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="350" y="228" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">✓ trespass: Kelsen</text><path d="M640,174 l70,0 l18,-12 l6,0 l-8,14 l20,0 l-8,8 l-98,0 Z" fill="#2b5a9a"/><rect x="580" y="194" width="270" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="715" y="220" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">✗ not trespass: Bernstein</text><text x="50" y="164" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Airspace at the height needed for ordinary use</text><text x="50" y="186" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">but not aircraft at a reasonable height</text><rect x="30" y="446" width="272" height="159" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="474" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NO DAMAGE NEEDED</text><text x="46" y="505" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Actionable without proof of</text><text x="46" y="525" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">damage. Entering (even by</text><text x="46" y="545" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">mistake about whose land it is),</text><text x="46" y="565" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">remaining after permission ends,</text><text x="46" y="585" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">placing things on land.</text><rect x="314" y="446" width="272" height="159" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="474" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTINUING TRESPASS</text><text x="330" y="505" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Leaving an object on the land</text><text x="330" y="525" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">gives a fresh cause of action</text><text x="330" y="545" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">each day.</text><rect x="598" y="446" width="272" height="159" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="614" y="474" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFENCES</text><text x="614" y="505" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Permission (licence) and lawful</text><text x="614" y="525" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">authority.</text>
</svg>