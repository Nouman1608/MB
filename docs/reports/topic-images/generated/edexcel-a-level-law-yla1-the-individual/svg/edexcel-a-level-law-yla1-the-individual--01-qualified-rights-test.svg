<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Restricting Articles 10 and 11</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Both are qualified rights: a restriction must pass all three tests</text>
<rect x="30" y="124" width="253.33333333333334" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="199.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TEST 1</text><text x="50" y="225.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prescribed by law</text><line x1="289.33333333333337" y1="209" x2="317.33333333333337" y2="209" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="124" width="253.33333333333334" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.33333333333337" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TEST 2</text><text x="343.33333333333337" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A legitimate aim</text><text x="343.33333333333337" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">national security, public</text><text x="343.33333333333337" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">safety, preventing disorder or</text><text x="343.33333333333337" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">crime, protecting the rights</text><text x="343.33333333333337" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and reputation of others</text><line x1="582.6666666666667" y1="209" x2="610.6666666666667" y2="209" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="124" width="253.33333333333334" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="174.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TEST 3</text><text x="636.6666666666667" y="200.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Necessary in a</text><text x="636.6666666666667" y="223.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">democratic society</text><text x="636.6666666666667" y="251.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">meaning proportionate</text><rect x="30" y="316" width="413" height="199" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="348" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 10: EXPRESSION</text><text x="50" y="379" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="379" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Protects ideas that "offend, shock or disturb":</text><text x="64.25" y="399" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Handyside</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> [1976]</text><text x="50" y="425" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="425" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Injunction on thalidomide articles breached Art 10:</text><text x="64.25" y="445" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Sunday</tspan> <tspan font-style="italic">Times</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> [1979]</text><rect x="457" y="316" width="413" height="199" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="348" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 11: PEACEFUL ASSEMBLY</text><text x="477" y="379" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.25" y="379" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Peaceful, non-obstructive assembly on the</text><text x="491.25" y="399" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">highway can be lawful: <tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Jones</tspan> [1999]</text><text x="477" y="425" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.25" y="425" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Obstructing a road: the court must weigh</text><text x="491.25" y="445" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">proportionality: <tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ziegler</tspan> [2021]</text><text x="477" y="471" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.25" y="471" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Police conditions on processions and assemblies:</text><text x="491.25" y="491" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Public Order Act 1986</text><rect x="30" y="537" width="272" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="563" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HRA 1998 s 6</text><text x="44" y="594" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Public authorities must act</text><text x="44" y="614" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">compatibly</text><rect x="314" y="537" width="272" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="563" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s 3</text><text x="328" y="594" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Courts interpret legislation</text><text x="328" y="614" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">compatibly where possible</text><rect x="598" y="537" width="272" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="563" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s 4</text><text x="612" y="594" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Higher courts may declare</text><text x="612" y="614" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">incompatibility</text>
</svg>