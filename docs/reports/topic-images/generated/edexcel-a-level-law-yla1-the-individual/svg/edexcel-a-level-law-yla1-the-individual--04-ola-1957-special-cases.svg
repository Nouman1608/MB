<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" width="900" height="586" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="586" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">OLA 1957: adjusting the common duty of care</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">s 2(2): the common duty of care owed to lawful visitors</text>
<rect x="30" y="124" width="413" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHILDREN · s 2(3)(a)</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Expect them to be less careful</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Glasgow</tspan> <tspan font-style="italic">Corporation</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Taylor</tspan> [1922]: poisonous</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">berries. But parents should supervise young</text><text x="50" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">children: <tspan font-style="italic">Phipps</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Rochester</tspan> [1955].</text><rect x="457" y="124" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SKILLED VISITORS · s 2(3)(b)</text><text x="477" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Expected to guard against risks of their</text><text x="477" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">trade</text><text x="477" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Roles</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Nathan</tspan> [1963]</text><rect x="30" y="291" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="323" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WARNINGS · s 2(4)(a)</text><text x="50" y="349.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">May discharge the duty</text><text x="50" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">if enough to keep the visitor safe</text><rect x="457" y="291" width="413" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="323" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDEPENDENT CONTRACTORS · s 2(4)(b)</text><text x="477" y="349.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Occupier not liable if reasonable</text><text x="477" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in choosing and checking the contractor:</text><text x="477" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Haseldine</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Daw</tspan> [1941]</text><rect x="30" y="445" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="479.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The duty and the occupier</text><text x="50" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Take reasonable care to see the visitor is reasonably safe for the purposes of the visit. The occupier is</text><text x="50" y="529.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">whoever has control of the premises: <tspan font-style="italic">Wheat</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">E</tspan> <tspan font-style="italic">Lacon</tspan> <tspan font-style="italic">&amp;</tspan> <tspan font-style="italic">Co</tspan> [1966].</text>
</svg>