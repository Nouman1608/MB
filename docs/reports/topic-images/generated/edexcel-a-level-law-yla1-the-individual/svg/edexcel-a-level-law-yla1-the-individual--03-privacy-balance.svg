<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Article 8 against Article 10</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Misuse of private information</text>
<rect x="30" y="124" width="395" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="158.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION 1</text><text x="50" y="184.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Did the claimant have a reasonable</text><text x="50" y="207.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">expectation of privacy?</text><line x1="431" y1="179.5" x2="469" y2="179.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="124" width="395" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="495" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION 2</text><text x="495" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Was publication justified?</text><text x="495" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Balance Article 8 against Article 10</text><rect x="30" y="257" width="413" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="289" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAMPBELL v MGN [2004]</text><text x="50" y="320.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Photographs of a model leaving a Narcotics</text><text x="50" y="341.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Anonymous meeting: a misuse.</text><rect x="457" y="257" width="413" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="289" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOSLEY [2008] · PJS [2016]</text><text x="477" y="320.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Privacy can outweigh press freedom where</text><text x="477" y="341.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">there is no genuine public interest.</text><rect x="30" y="388" width="413" height="168" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="420" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DATA PROTECTION ACT 2018</text><text x="50" y="445.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Processing personal data</text><text x="50" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">With the UK GDPR. ss 43 and 45: data subject</text><text x="50" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rights, including access. s 170: offence to knowingly</text><text x="50" y="512" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">or recklessly obtain or disclose personal data</text><text x="50" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">without consent.</text><rect x="457" y="388" width="413" height="168" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="420" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FREEDOM OF INFORMATION ACT 2000</text><text x="477" y="445.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Information held by public authorities</text><text x="477" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A right to request recorded information; response</text><text x="477" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">generally within 20 working days, subject to</text><text x="477" y="512" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">exemptions. Own data: subject access route</text><text x="477" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">instead.</text>
</svg>