<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Build vocabulary in three layers</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">For each topic your class studies</text>
<rect x="170" y="316" width="560" height="84" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="214" cy="358" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="214" y="365.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="252" y="352" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Nouns</text><text x="252" y="380" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">a ceremony, a suitcase</text><rect x="100" y="220" width="700" height="84" rx="12" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="144" cy="262" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="144" y="269.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="182" y="256" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Verbs</text><text x="182" y="284" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">to celebrate, to settle</text><rect x="30" y="124" width="840" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="74" cy="166" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="74" y="173.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="112" y="160" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluative language</text><text x="112" y="188" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">unforgettable, bittersweet</text><text x="846" y="174" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">most often missing</text><rect x="30" y="422" width="390" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="456.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nouns and verbs only</text><text x="50" y="486.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A list of events: "There was a ceremony.</text><text x="50" y="508.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">There was a meal. It was good."</text><line x1="426" y1="477.5" x2="474" y2="477.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="422" width="390" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="456.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">With evaluative language</text><text x="500" y="486.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">An experience: the reader learns what the</text><text x="500" y="508.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">moment felt like and why it mattered.</text>
</svg>