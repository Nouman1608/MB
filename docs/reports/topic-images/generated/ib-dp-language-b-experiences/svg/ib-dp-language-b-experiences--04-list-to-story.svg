<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From a list of events to an experience</text>

<rect x="30" y="244.5" width="270" height="231" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="276.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">FLAT ACCOUNT</text><text x="50" y="309.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">I went to my cousin's</text><text x="50" y="331.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">graduation.</text><text x="50" y="361.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">There was a ceremony.</text><text x="50" y="391.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">There was a meal.</text><text x="50" y="421.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">It was good.</text><text x="50" y="451.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">I came home.</text><line x1="306" y1="360" x2="352" y2="360" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="390" y1="120" x2="390" y2="600" stroke="#c9d6d4" stroke-width="4"/><rect x="434" y="100" width="436" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="448" y="128.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two kinds of past</text><text x="448" y="156.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Completed <tspan font-style="italic">walked</tspan> <tspan font-style="italic">on,</tspan> <tspan font-style="italic">ate</tspan> set against background</text><text x="448" y="177.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">was</tspan> <tspan font-style="italic">crying</tspan>.</text><circle cx="390" cy="148" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="390" y="156.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="434" y="206" width="436" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="448" y="234.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An earlier past</text><text x="448" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">had</tspan> <tspan font-style="italic">left</tspan> <tspan font-style="italic">school,</tspan> <tspan font-style="italic">had</tspan> <tspan font-style="italic">worked</tspan> pull in the aunt's life</text><text x="448" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">story.</text><circle cx="390" cy="254" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="390" y="262.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="434" y="312" width="436" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="448" y="340.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluative detail</text><text x="448" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">went</tspan> <tspan font-style="italic">quiet,</tspan> <tspan font-style="italic">was</tspan> <tspan font-style="italic">crying</tspan> show feeling instead of "it was</text><text x="448" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">good".</text><circle cx="390" cy="360" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="390" y="368.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="434" y="418" width="436" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="448" y="446.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A bridge to the present</text><text x="448" y="474.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Since</tspan> <tspan font-style="italic">that</tspan> <tspan font-style="italic">day</tspan> <tspan font-style="italic">I</tspan> <tspan font-style="italic">have</tspan> <tspan font-style="italic">thought…</tspan> answers the first</text><text x="448" y="495.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">possible question.</text><circle cx="390" cy="466" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="390" y="474.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="434" y="524" width="436" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="448" y="552.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural meaning</text><text x="448" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"It was his, but it was hers too" answers the second</text><text x="448" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">possible question.</text><circle cx="390" cy="572" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="390" y="580.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>