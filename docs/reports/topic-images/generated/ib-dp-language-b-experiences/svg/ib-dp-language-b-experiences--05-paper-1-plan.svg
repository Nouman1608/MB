<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 761" width="900" height="761" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="761" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a Paper 1 answer on Experiences</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Prompt: how one family member's move shaped your family</text>
<rect x="30" y="124" width="411" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 1</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Context, audience, purpose</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">School collection project · students, parents and</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">teachers · inform and move the reader</text><rect x="459" y="124" width="411" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 2</text><text x="479" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Text type and register</text><text x="479" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Magazine article: headline, neutral but warm</text><text x="479" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">register, quotations from the family member</text><text x="30" y="293" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 3: PLAN IN TIME ORDER, THEN REFLECT</text><rect x="30" y="309" width="253.33333333333334" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="337" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1 · OPENING</text><text x="46" y="363.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A vivid moment</text><text x="46" y="391.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The day of arrival; a headline</text><text x="46" y="412.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">that names the person</text><line x1="289.33333333333337" y1="371" x2="317.33333333333337" y2="371" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="309" width="253.33333333333334" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="339.33333333333337" y="347.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2 · BEFORE</text><text x="339.33333333333337" y="373.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why they left</text><text x="339.33333333333337" y="402.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Background past forms</text><line x1="582.6666666666667" y1="371" x2="610.6666666666667" y2="371" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="309" width="253.33333333333334" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="632.6666666666667" y="337" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3 · THE MOVE</text><text x="632.6666666666667" y="363.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two or three events</text><text x="632.6666666666667" y="391.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Completed events in</text><text x="632.6666666666667" y="412.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sequence, with time markers</text><rect x="30" y="451" width="253.33333333333334" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="479" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4 · SETTLING</text><text x="46" y="505.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One difficulty</text><text x="46" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A new language, work or</text><text x="46" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">homesickness, and how it</text><text x="46" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">was solved</text><line x1="289.33333333333337" y1="523.5" x2="317.33333333333337" y2="523.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="451" width="253.33333333333334" height="145" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="339.33333333333337" y="489.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">5 · NOW</text><text x="339.33333333333337" y="515.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bridge paragraph</text><text x="339.33333333333337" y="544.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">since</tspan> <tspan font-style="italic">then</tspan>, <tspan font-style="italic">today</tspan>: the effect</text><text x="339.33333333333337" y="565.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on the family</text><line x1="582.6666666666667" y1="523.5" x2="610.6666666666667" y2="523.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="451" width="253.33333333333334" height="145" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="632.6666666666667" y="489.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">6 · CLOSE</text><text x="632.6666666666667" y="515.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One sentence</text><text x="632.6666666666667" y="544.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Answer "how does our past</text><text x="632.6666666666667" y="565.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shape our present?"</text><rect x="30" y="618" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="652.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">At HL</text><text x="50" y="682.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weigh the gains and losses of the move, or compare two generations' views, rather than only</text><text x="50" y="704.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recounting.</text>
</svg>