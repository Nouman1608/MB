<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Controlling time in a story</text>

<rect x="30" y="100" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="60" y1="270" x2="720" y2="270" stroke="#1e2a44" stroke-width="4"/><line x1="720" y1="270" x2="850" y2="270" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)" stroke-dasharray="10 7"/><text x="125" y="140" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">EARLIER PAST</text><text x="360" y="140" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">PAST</text><text x="600" y="140" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">NOW</text><text x="790" y="140" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">FUTURE</text><circle cx="125" cy="270" r="11" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><text x="125" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">had left,</text><text x="125" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">had worked</text><rect x="220" y="254" width="280" height="32" rx="16" fill="#b5d3cf" opacity="0.85"/><text x="360" y="314" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">background / habit:</text><text x="360" y="334" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle" font-style="italic">was raining, used to spend</text><circle cx="270" cy="270" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="360" cy="270" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="450" cy="270" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="360" y="212" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">completed events:</text><text x="360" y="236" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle" font-style="italic">arrived, walked on, ate</text><path d="M470,256 C510,180 560,180 594,252" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="532" y="178" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">since then</text><circle cx="600" cy="270" r="13" fill="#1e2a44"/><text x="600" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">I have</text><text x="600" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">thought…</text><text x="790" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">one day</text><text x="790" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">I hope to…</text><rect x="30" y="422" width="269.3333333333333" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="454" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PAST MARKERS</text><text x="50" y="480.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Move the story on</text><text x="50" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">at first · the next morning ·</text><text x="50" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">two years later · by the time</text><text x="50" y="551.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">we arrived</text><rect x="315.3333333333333" y="422" width="269.3333333333333" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335.3333333333333" y="454" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BRIDGE MARKERS</text><text x="335.3333333333333" y="480.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Link past to now</text><text x="335.3333333333333" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">since then · ever since: these</text><text x="335.3333333333333" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">answer "how does our past</text><text x="335.3333333333333" y="551.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shape our present?"</text><rect x="600.6666666666666" y="422" width="269.3333333333333" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="464.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRESENT AND FUTURE</text><text x="620.6666666666666" y="491.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Say what it means now</text><text x="620.6666666666666" y="520.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">now · these days · one day I</text><text x="620.6666666666666" y="541.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hope to</text><rect x="30" y="598" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="632.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reflection turns narrative into meaning</text><text x="50" y="662.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"Looking back, I realise that…" · "If I had not missed that train, I would never have met…": complex</text><text x="50" y="684.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">structures the brief expects at HL Paper 1.</text>
</svg>