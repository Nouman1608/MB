text><rect x="610" y="236" width="260" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="272.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rites of passage</text><rect x="610" y="314" width="260" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="350.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Customs and traditions</text><rect x="610" y="392" width="260" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="428.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Migration</text><text x="450" y="492" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">POSSIBLE QUESTIONS: use them as lenses on any text</text><rect x="30" y="508" width="411" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="542.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">"How does our past shape our present and</text><text x="50" y="566.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">our future?"</text><rect x="459" y="508" width="411" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="542.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">"How and why do different cultures mark</text><text x="479" y="566.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">important moments in life?"</text>
