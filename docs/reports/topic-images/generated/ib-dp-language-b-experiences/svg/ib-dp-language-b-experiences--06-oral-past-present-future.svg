<rect x="320" y="110" width="260" height="190" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="334" y="124" width="232" height="162" fill="#dce9e7"/><circle cx="520" cy="162" r="18" fill="#d4b02e"/><path d="M334,286 L410,200 L460,240 L500,210 L566,286 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="330" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">a festival · a station platform · a graduation</text><rect x="30" y="140" width="230" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="172" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PAST</text><text x="145" y="198.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What came before</text><text x="145" y="222.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">it?</text><rect x="640" y="140" width="230" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="755" y="172" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FUTURE</text><text x="755" y="198.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What will it lead to?</text><line x1="310" y1="194" x2="266" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="590" y1="182" x2="634" y2="182" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="316.4755" y="342" width="267.049" height="31" rx="15.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="363.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">PRESENT: what event is this?</text><rect x="30" y="395" width="411" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="437.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SL STIMULUS</text><text x="50" y="464.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A visual image</text><text x="50" y="493.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Describe briefly, then ask what event it is, what</text><text x="50" y="514.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">came before it and what it will lead to.</text><rect x="459" y="395" width="411" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="427" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HL STIMULUS</text><text x="479" y="453.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">An excerpt from a literary work</text><text x="479" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Early in the course, note turning points,</text><text x="479" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">departures and ceremonies that shape a</text><text x="479" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">character's life.</text><text x="450" y="584.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">The oral is internally assessed: 25% (30 marks).</text>
