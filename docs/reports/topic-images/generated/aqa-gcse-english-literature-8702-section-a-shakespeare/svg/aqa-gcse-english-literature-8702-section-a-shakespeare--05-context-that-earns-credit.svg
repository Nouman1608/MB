<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="544" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Context that earns credit</text>

<line x1="320" y1="191.5" x2="369.25" y2="228.55" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="337" x2="369.25" y2="279.475" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="170.5" x2="530.75" y2="221.2" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="295" x2="530.75" y2="264.775" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="248.5" r="95" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="243" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Context of</text><text x="450" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">writing</text><g transform="translate(0,0)"><rect x="30" y="110" width="290" height="163" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="140.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The theatre</text><text x="46" y="168.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The audience; no women on the</text><text x="46" y="189.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">public stage in Shakespeare’s</text><text x="46" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lifetime; a bare stage, so</text><text x="46" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">language did the work of</text><text x="46" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scenery.</text><rect x="30" y="287" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="317.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Beliefs</text><text x="46" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">About hierarchy, gender,</text><text x="46" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">religion and authority.</text></g><g transform="translate(0,21)"><rect x="580" y="110" width="290" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="140.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Genre expectations</text><text x="596" y="168.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tragedy, comedy or romance.</text><rect x="580" y="203" width="290" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="233.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two audiences</text><text x="596" y="261.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How an original and a modern</text><text x="596" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">audience might respond</text><text x="596" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">differently, both anchored in</text><text x="596" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the text.</text></g><rect x="30" y="409" width="408" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="444.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Earns credit</text><text x="50" y="473.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Relevant to the question and your play,</text><text x="50" y="495.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">linked to a specific moment or phrase.</text><rect x="462" y="409" width="408" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="444.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Earns little</text><text x="482" y="473.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A paragraph of history with no link to the</text><text x="482" y="495.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">text.</text>
</svg>