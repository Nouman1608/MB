<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the Shakespeare question rewards</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">One question on your play: an extract, then the whole play</text>
<rect x="30" y="126" width="296.47058823529414" height="74" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="178.23529411764707" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><text x="178.23529411764707" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">12 marks</text><rect x="326.47058823529414" y="126" width="296.47058823529414" height="74" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="474.7058823529412" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><text x="474.7058823529412" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">12 marks</text><rect x="622.9411764705883" y="126" width="148.23529411764707" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="697.0588235294118" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><text x="697.0588235294118" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">6 marks</text><rect x="771.1764705882354" y="126" width="98.82352941176471" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="820.5882352941177" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4</text><text x="820.5882352941177" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">4 marks</text><rect x="28" y="124" width="844" height="78" rx="6" fill="none" stroke="#1e2a44" stroke-width="3"/><path d="M30,214 L30,226 L767.1764705882354,226 L767.1764705882354,214" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="400.5882352941177" y="252" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">the question: 30 marks, marked as a whole</text><path d="M775.1764705882354,214 L775.1764705882354,226 L870,226 L870,214" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="870" y="252" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="end">+ 4 for AO4</text><rect x="30" y="286" width="840" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="324" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">The usual question</text><text x="54" y="360" font-size="22" fill="#1e2a44" xml:space="preserve"><tspan>“</tspan><tspan fill="#b5602e" font-weight="700">Starting with this extract</tspan><tspan>, </tspan><tspan fill="#b5602e" font-weight="700">explore</tspan><tspan> how Shakespeare </tspan><tspan fill="#b5602e" font-weight="700">presents</tspan><tspan> …”</tspan></text><text x="54" y="398" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Starting with this extract</text><text x="290" y="398" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→  two bullets: the extract, then the play as a whole</text><text x="54" y="432" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">explore</text><text x="290" y="432" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→  weigh more than one reading</text><text x="54" y="466" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">presents</text><text x="290" y="466" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→  the dramatist’s choices, not the character as a real person</text><rect x="30" y="500" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="536" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Time</text><text x="50" y="565.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Section A carries 34 of Paper 1’s 64 marks, so it deserves a little over half of the 1 hour</text><text x="50" y="587.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">45 minutes.</text>
