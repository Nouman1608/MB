<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 735" width="900" height="735" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Annotating a soliloquy</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Original passage: Aldric is offered his brother’s lands</text>
<rect x="30" y="120" width="450" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="152" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">What is a brother but a name we wear,</text><text x="48" y="176" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">A borrowed coat that warms us while it fits?</text><line x1="484" y1="177" x2="506" y2="177" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="510" y="120" width="360" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="148" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rhetorical question; a clothing</text><text x="526" y="169" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">metaphor makes family loyalty sound</text><text x="526" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">temporary and removable.</text><text x="526" y="215" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">AO2: language</text><rect x="30" y="246" width="450" height="93" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="278" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">And yet this coat was cut from my own cloth.</text><line x1="484" y1="292.5" x2="506" y2="292.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="510" y="246" width="360" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“And yet”: the image rebounds, so the</text><text x="526" y="295" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">metaphor ends up proving loyalty.</text><text x="526" y="320" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">AO2: structure within the speech</text><rect x="30" y="351" width="450" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="383" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The night is kind; it does not ask my name.</text><line x1="484" y1="408" x2="506" y2="408" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="510" y="351" width="360" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="379" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A soliloquy: the audience alone hears</text><text x="526" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the argument collapse, building</text><text x="526" y="421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dramatic irony for later scenes.</text><text x="526" y="446" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">AO2: form; AO1: whole-play link</text><rect x="30" y="477" width="450" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="509" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Go, conscience, sleep. I’ll wake thee when I’m</text><text x="48" y="533" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">crowned.</text><line x1="484" y1="534" x2="506" y2="534" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="510" y="477" width="360" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="505" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conscience treated as a servant he can</text><text x="526" y="526" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dismiss: he places himself outside the</text><text x="526" y="547" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">natural order.</text><text x="526" y="572" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">AO3: tied to the line</text><rect x="30" y="609" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="642.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Argument: the soliloquy presents ambition as a force that persuades itself. Every sentence</text><text x="50" y="664.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">makes a point about meaning, methods are named only when they help, and context is attached</text><text x="50" y="686.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to a phrase.</text>
</svg>