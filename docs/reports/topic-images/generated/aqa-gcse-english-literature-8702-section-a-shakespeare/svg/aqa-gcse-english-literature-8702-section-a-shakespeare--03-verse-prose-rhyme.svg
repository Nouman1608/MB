<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="616" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Verse, prose and rhyme</text>

<rect x="30" y="110" width="270" height="330" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="148" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Blank verse</text><rect x="56" y="194" width="14" height="14" rx="3" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="74" y="184" width="22" height="24" rx="3" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="102" y="194" width="14" height="14" rx="3" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="120" y="184" width="22" height="24" rx="3" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="148" y="194" width="14" height="14" rx="3" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="166" y="184" width="22" height="24" rx="3" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="194" y="194" width="14" height="14" rx="3" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="212" y="184" width="22" height="24" rx="3" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="240" y="194" width="14" height="14" rx="3" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="258" y="184" width="22" height="24" rx="3" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="165" y="232" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">da-DUM ×5</text><text x="50" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unrhymed, usually ten</text><text x="50" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">syllables, da-DUM (iambic</text><text x="50" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pentameter).</text><text x="50" y="355" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Often high-status</text><text x="50" y="376" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">characters; serious,</text><text x="50" y="397" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controlled speech.</text><rect x="315" y="110" width="270" height="330" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="148" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Prose</text><line x1="341" y1="186" x2="541.56" y2="186" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round"/><line x1="341" y1="200" x2="526.3" y2="200" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round"/><line x1="341" y1="214" x2="548.1" y2="214" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round"/><line x1="341" y1="228" x2="471.79999999999995" y2="228" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round"/><text x="450" y="248" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">no metre</text><text x="335" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ordinary sentences without</text><text x="335" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">metre.</text><text x="335" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Often lower-status</text><text x="335" y="355" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">characters, comedy,</text><text x="335" y="376" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">letters, or a mind breaking</text><text x="335" y="397" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">down.</text><rect x="600" y="110" width="270" height="330" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Rhyming couplets</text><line x1="630" y1="190" x2="790" y2="190" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><rect x="800" y="181" width="38" height="18" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="630" y1="214" x2="790" y2="214" stroke="#c9d6d4" stroke-width="6" stroke-linecap="round"/><rect x="800" y="205" width="38" height="18" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M840,190 q16,12 0,24" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="735" y="242" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">rhyme closes it</text><text x="620" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Two rhymed lines, often</text><text x="620" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">closing a scene or speech.</text><text x="620" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can sound decisive,</text><text x="620" y="355" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proverbial or falsely neat.</text><rect x="30" y="458" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="494" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The exceptions are the interesting moments</text><text x="50" y="523.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">These are tendencies, not rules. Look for exceptions: a noble character slipping into</text><text x="50" y="545.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">prose, a servant in verse, an extra syllable or a mid-line pause (caesura). When the metre</text><text x="50" y="567.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">disturbs, ask what it shows about the speaker’s state of mind.</text>
</svg>