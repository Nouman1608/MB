<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dramatic methods worth knowing</text>

<rect x="30" y="110" width="270" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><rect x="300" y="110" width="570" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="312" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it does for the audience</text><rect x="30" y="156" width="270" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="182.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soliloquy</text><rect x="300" y="156" width="570" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="182.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Alone on stage, a character speaks thoughts aloud: private</text><text x="312" y="204.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">motives that can create sympathy or unease.</text><rect x="30" y="222" width="270" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="248.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Aside</text><rect x="300" y="222" width="570" height="66" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="312" y="248.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A remark others on stage do not hear: a secret alliance with</text><text x="312" y="270.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the audience.</text><rect x="30" y="288" width="270" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="314.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dramatic irony</text><rect x="300" y="288" width="570" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="314.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The audience knows more, so ordinary lines carry a second,</text><text x="312" y="336.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">darker or comic meaning.</text><rect x="30" y="354" width="270" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="380.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Entrances and exits</text><rect x="300" y="354" width="570" height="66" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="312" y="380.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Who arrives, leaves or is left alone can shift power within a</text><text x="312" y="402.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">scene.</text><rect x="30" y="420" width="270" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="446.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Embedded stage directions</text><rect x="300" y="420" width="570" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="446.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Actions implied in the dialogue (“give me your hand”) tell</text><text x="312" y="468.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">actors what to do.</text><rect x="30" y="486" width="270" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="512.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Juxtaposition of scenes</text><rect x="300" y="486" width="570" height="44" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="312" y="512.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A violent scene next to a comic or domestic one sharpens both.</text><rect x="30" y="530" width="270" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="556.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Shared lines</text><rect x="300" y="530" width="570" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="556.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Finishing another’s line of verse: closeness, urgency, or one</text><text x="312" y="578.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">character overpowering another.</text>
</svg>