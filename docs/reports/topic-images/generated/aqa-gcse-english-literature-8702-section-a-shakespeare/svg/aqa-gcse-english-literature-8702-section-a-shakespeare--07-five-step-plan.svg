<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 774" width="900" height="774" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="774" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From extract to whole play: a plan</text>

<line x1="62" y1="130" x2="62" y2="632" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="110" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the question and extract twice</text><text x="128" y="175.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Underline the focus word; mark four or five details that relate to it.</text><circle cx="62" cy="155" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="163.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="212" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="248" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Write a one-sentence argument</text><text x="128" y="277.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Shakespeare presents loyalty as something characters claim most loudly when they</text><text x="128" y="299.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">are about to break it.”</text><circle cx="62" cy="268" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="276.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="336" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="372" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Analyse the extract first</text><text x="128" y="401.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two or three paragraphs, choosing details that support the argument.</text><circle cx="62" cy="381" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="389.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="438" width="762" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="474" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Move outward</text><text x="128" y="503.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two or three other moments, ideally one earlier and one later: memorised</text><text x="128" y="525.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">quotations or precise references.</text><circle cx="62" cy="494" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="502.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="562" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="598" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclude with a judgement</text><text x="128" y="627.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What is Shakespeare suggesting by the end of the play?</text><circle cx="62" cy="607" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="615.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="670" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="703.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weaving extract and play together in every paragraph also works, as long as both bullets</text><text x="50" y="725.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">are covered and the argument stays consistent.</text>
</svg>