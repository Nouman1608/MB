<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where does the extract sit?</text>

<rect x="40" y="280" width="820" height="46" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="80" y="280" width="140" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Opening</text><line x1="150" y1="326" x2="150" y2="350" stroke="#1e2a44" stroke-width="2.5"/><rect x="20" y="350" width="260" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="150" y="377.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Situations and</text><text x="150" y="399.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">relationships are</text><text x="150" y="421.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">established.</text><rect x="380" y="280" width="140" height="46" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Turning point</text><line x1="450" y1="326" x2="450" y2="350" stroke="#1e2a44" stroke-width="2.5"/><rect x="320" y="350" width="260" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="377.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">A decision changes</text><text x="450" y="399.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">everything.</text><rect x="680" y="280" width="140" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ending</text><line x1="750" y1="326" x2="750" y2="350" stroke="#1e2a44" stroke-width="2.5"/><rect x="620" y="350" width="260" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="750" y="377.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Earlier ideas are</text><text x="750" y="399.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">resolved, punished or left</text><text x="750" y="421.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">uneasy.</text><path d="M150,274 C250,150 650,150 750,274" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#ahT)"/><circle cx="150" cy="258" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="264" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="450" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Echo: an image, phrase or action at the start</text><text x="450" y="148" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">returns later with its meaning changed</text><rect x="30" y="476" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="509.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ask where your extract sits, then track the echoes: one of the clearest ways to write about</text><text x="50" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">structure.</text>
</svg>