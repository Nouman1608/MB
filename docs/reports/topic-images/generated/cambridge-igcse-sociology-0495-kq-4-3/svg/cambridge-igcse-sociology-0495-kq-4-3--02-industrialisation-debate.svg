<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Did industrialisation create the nuclear family?</text>

<text x="390" y="130" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pre-industrial</text><text x="585" y="130" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Early industrial</text><text x="780" y="130" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Later industrial</text><line x1="300" y1="146" x2="870" y2="146" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="166" width="250" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="207.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Parsons</text><text x="50" y="235.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">functionalist account</text><rect x="300" y="166" width="180" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="312" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Extended family as</text><text x="312" y="230" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">unit of production</text><rect x="495" y="166" width="180" height="100" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="690" y="166" width="180" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="702" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Isolated nuclear</text><text x="702" y="220" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">family fits a mobile</text><text x="702" y="240" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">workforce</text><rect x="30" y="280" width="250" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="315.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Laslett and</text><text x="50" y="340.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Anderson</text><text x="50" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">historical evidence</text><rect x="300" y="280" width="180" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="312" y="314" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Laslett: most</text><text x="312" y="334" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">households already</text><text x="312" y="354" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">small and nuclear</text><rect x="495" y="280" width="180" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="507" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Anderson, Preston</text><text x="507" y="324" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1851: extended</text><text x="507" y="344" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">households common;</text><text x="507" y="364" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">kin helped migrants</text><rect x="690" y="280" width="180" height="100" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/><rect x="30" y="394" width="250" height="100" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="435.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Young and Willmott</text><text x="50" y="463.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stages</text><rect x="300" y="394" width="180" height="100" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="312" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Family working</text><text x="312" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">together</text><rect x="495" y="394" width="180" height="100" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="507" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Men’s and women’s</text><text x="507" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lives separate</text><rect x="690" y="394" width="180" height="100" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="702" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Symmetrical family:</text><text x="702" y="448" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">work, tasks and</text><text x="702" y="468" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">leisure shared</text><rect x="30" y="512" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="545.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Early industrialisation may have strengthened extended ties before later industrialisation</text><text x="50" y="567.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weakened them. In urbanising societies today, extended families often continue as modified</text><text x="50" y="589.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">extended networks.</text>
</svg>