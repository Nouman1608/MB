<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 833" width="900" height="833" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="833" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One developed point in a “discuss” answer</text>

<rect x="30" y="104" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUESTION</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Discuss the reasons why divorce rates have increased in many societies.</text><rect x="30" y="207" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="240" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1  IDENTIFY</text><text x="50" y="270.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One reason is the changing status of women.</text><line x1="450" y1="300" x2="450" y2="324" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="329" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="362" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2  MECHANISM</text><text x="50" y="392.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More women are educated and in paid work, so they are no longer financially dependent on a</text><text x="50" y="414.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">husband.</text><line x1="450" y1="444" x2="450" y2="468" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="473" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="506" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3  EFFECT</text><text x="50" y="536.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Leaving an unhappy marriage becomes a realistic option.</text><line x1="450" y1="566" x2="450" y2="590" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="595" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="628" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4  EVALUATE</text><text x="50" y="658.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">This fits societies where women have equal employment rights better than those where they</text><text x="50" y="680.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">do not.</text><rect x="30" y="723" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="756.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Repeat with two more factors, such as legislation and secularisation, for three developed</text><text x="50" y="778.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">points.</text>
</svg>