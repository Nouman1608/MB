<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why have marriage, divorce and cohabitation changed?</text>

<line x1="315" y1="175" x2="371.8" y2="255.925" stroke="#1e2a44" stroke-width="2.5"/><line x1="315" y1="299.5" x2="371.8" y2="299.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="315" y1="424" x2="371.8" y2="343.075" stroke="#1e2a44" stroke-width="2.5"/><line x1="585" y1="164.5" x2="528.2" y2="252.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="585" y1="299.5" x2="528.2" y2="299.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="585" y1="434.5" x2="528.2" y2="346.75" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="299.5" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="274.625" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Fewer and later</text><text x="450" y="295.875" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">marriages, more</text><text x="450" y="317.125" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">divorce and</text><text x="450" y="338.375" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">cohabitation</text><g transform="translate(0,10.5)"><rect x="30" y="104" width="285" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Legislation</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Divorce easier and cheaper:</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Divorce Reform Act 1969;</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">no-fault divorce 2022</text><rect x="30" y="239" width="285" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="269.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Attitudes and values</text><text x="46" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Less stigma; marriage for</text><text x="46" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">personal happiness</text><rect x="30" y="353" width="285" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="383.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The internet</text><text x="46" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Online dating widens the pool;</text><text x="46" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">online support makes</text><text x="46" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">separation less isolating</text></g><g transform="translate(0,0)"><rect x="585" y="104" width="285" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="601" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Secularisation</text><text x="601" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Marriage less seen as sacred</text><text x="601" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and lifelong; fewer religious</text><text x="601" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">weddings</text><rect x="585" y="239" width="285" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="601" y="269.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural expectations</text><text x="601" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Where honour and community</text><text x="601" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pressure are strong, divorce</text><text x="601" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stays lower</text><rect x="585" y="374" width="285" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="601" y="404.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Women’s status and power</text><text x="601" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Education, paid work and</text><text x="601" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">welfare rights end financial</text><text x="601" y="474.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dependence</text></g>
</svg>