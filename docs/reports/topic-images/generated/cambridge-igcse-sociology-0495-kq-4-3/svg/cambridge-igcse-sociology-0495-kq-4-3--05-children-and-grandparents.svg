<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 633" width="900" height="633" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="633" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Changing roles of children and grandparents</text>

<text x="450" y="124" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Children</text><rect x="30" y="150" width="270.6666666666667" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="185.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">From asset to burden</text><text x="50" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Once workers; now dependent</text><text x="50" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for longer and costly to</text><text x="50" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">raise</text><rect x="314.6666666666667" y="150" width="270.6666666666667" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="185.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Child-centred</text><text x="334.6666666666667" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fewer children, so more</text><text x="334.6666666666667" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time, money and attention</text><text x="334.6666666666667" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for each</text><rect x="599.3333333333334" y="150" width="270.6666666666667" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="185.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Boomerang children</text><text x="619.3333333333334" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Adults who return home:</text><text x="619.3333333333334" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">housing costs, student</text><text x="619.3333333333334" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">debt, insecure jobs</text><text x="450" y="318" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">Grandparents</text><rect x="30" y="344" width="201" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="378.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Childcare</text><text x="50" y="406.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lets both parents</text><text x="50" y="427.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">work</text><rect x="243" y="344" width="201" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="263" y="378.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economic</text><text x="263" y="402.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">support</text><text x="263" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. help with</text><text x="263" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">housing deposits</text><rect x="456" y="344" width="201" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="378.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wisdom and</text><text x="476" y="402.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">advice</text><text x="476" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Passing on culture</text><text x="476" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and experience</text><rect x="669" y="344" width="201" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="689" y="378.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Dependence</text><text x="689" y="406.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In very old age;</text><text x="689" y="427.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">some families feel</text><text x="689" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it as a burden</text><rect x="30" y="494" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="529.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conjugal roles</text><text x="50" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Young and Willmott (1973): more joint roles, the symmetrical family; dual worker families more</text><text x="50" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">common. Feminists point to the dual burden.</text>
</svg>