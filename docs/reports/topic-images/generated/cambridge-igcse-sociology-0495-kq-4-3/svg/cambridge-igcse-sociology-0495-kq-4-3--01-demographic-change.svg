<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 733" width="900" height="733" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="733" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From demographic trends to family life</text>

<rect x="30" y="140" width="260" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="166.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Falling birth rate</text><text x="160" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">contraception, women’s</text><text x="160" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">careers, cost of children</text><rect x="30" y="250" width="260" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="285.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rising life expectancy</text><text x="160" y="314.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">diet, sanitation, medicine</text><rect x="30" y="360" width="260" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="386.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Later parenthood</text><text x="160" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">longer education, careers,</text><text x="160" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">later marriage</text><rect x="345" y="190" width="220" height="100" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="455" y="245" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ageing population</text><line x1="294" y1="185" x2="340" y2="225" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="294" y1="295" x2="340" y2="260" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620" y="140" width="250" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="166.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Beanpole families</text><text x="745" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">more generations, fewer in</text><text x="745" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">each</text><rect x="620" y="250" width="250" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="287.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Care for elderly</text><text x="745" y="311.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">relatives</text><rect x="620" y="360" width="250" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="386.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sandwich generation</text><text x="745" y="410.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">more likely</text><text x="745" y="438.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">bigger age gap between</text><text x="745" y="459.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">generations</text><line x1="569" y1="225" x2="614" y2="185" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="569" y1="260" x2="614" y2="295" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="294" y1="405" x2="614" y2="405" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="160" y="128" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">CAUSES</text><text x="745" y="128" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">EFFECTS ON FAMILY LIFE</text><rect x="30" y="485" width="410" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="485" width="410" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="519" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Wide, short family tree</text><text x="665" y="519" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Long, thin beanpole</text><line x1="147" y1="575" x2="323" y2="575" stroke="#1e2a44" stroke-width="2.5"/><circle cx="147" cy="575" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="191" cy="575" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="235" cy="575" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="279" cy="575" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="323" cy="575" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="103" y1="645" x2="367" y2="645" stroke="#1e2a44" stroke-width="2.5"/><circle cx="103" cy="645" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="147" cy="645" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="191" cy="645" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="235" cy="645" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="279" cy="645" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="323" cy="645" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="367" cy="645" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="235" y1="575" x2="235" y2="645" stroke="#1e2a44" stroke-width="2.5"/><line x1="645" y1="557" x2="685" y2="557" stroke="#1e2a44" stroke-width="2.5"/><circle cx="645" cy="557" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="685" cy="557" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="645" y1="597" x2="685" y2="597" stroke="#1e2a44" stroke-width="2.5"/><circle cx="645" cy="597" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="685" cy="597" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="665" y1="557" x2="665" y2="597" stroke="#1e2a44" stroke-width="2.5"/><line x1="645" y1="637" x2="685" y2="637" stroke="#1e2a44" stroke-width="2.5"/><circle cx="645" cy="637" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="685" cy="637" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="665" y1="597" x2="665" y2="637" stroke="#1e2a44" stroke-width="2.5"/><line x1="645" y1="677" x2="685" y2="677" stroke="#1e2a44" stroke-width="2.5"/><circle cx="645" cy="677" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="685" cy="677" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="665" y1="637" x2="665" y2="677" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="691" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">two generations, many in each</text><text x="780" y="621" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">four</text><text x="780" y="639" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">generations</text>
</svg>