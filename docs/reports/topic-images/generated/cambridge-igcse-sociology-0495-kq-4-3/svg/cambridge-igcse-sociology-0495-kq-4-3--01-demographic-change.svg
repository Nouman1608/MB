<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 728" width="900" height="728" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="728" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From demographic trends to family life</text>

<rect x="30" y="110" width="260" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="136.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Falling birth rate</text><text x="160" y="164.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">contraception, women’s</text><text x="160" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">careers, cost of children</text><rect x="30" y="220" width="260" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="255.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rising life expectancy</text><text x="160" y="284.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">diet, sanitation, medicine</text><rect x="30" y="330" width="260" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="356.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Later parenthood</text><text x="160" y="384.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">longer education, careers,</text><text x="160" y="405.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">later marriage</text><rect x="345" y="160" width="220" height="100" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="455" y="215" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ageing population</text><line x1="294" y1="155" x2="340" y2="195" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="294" y1="265" x2="340" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620" y="110" width="250" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="136.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Beanpole families</text><text x="745" y="164.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">more generations, fewer in</text><text x="745" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">each</text><rect x="620" y="220" width="250" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="257.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Care for elderly</text><text x="745" y="281.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">relatives</text><rect x="620" y="330" width="250" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="356.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sandwich generation</text><text x="745" y="380.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">more likely</text><text x="745" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">bigger age gap between</text><text x="745" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">generations</text><line x1="569" y1="195" x2="614" y2="155" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="569" y1="230" x2="614" y2="265" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="294" y1="375" x2="614" y2="375" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="160" y="450" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">CAUSES</text><text x="745" y="450" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">EFFECTS ON FAMILY LIFE</text><rect x="30" y="480" width="410" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="480" width="410" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="514" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Wide, short family tree</text><text x="665" y="514" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Long, thin beanpole</text><line x1="147" y1="570" x2="323" y2="570" stroke="#1e2a44" stroke-width="2.5"/><circle cx="147" cy="570" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="191" cy="570" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="235" cy="570" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="279" cy="570" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="323" cy="570" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="103" y1="640" x2="367" y2="640" stroke="#1e2a44" stroke-width="2.5"/><circle cx="103" cy="640" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="147" cy="640" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="191" cy="640" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="235" cy="640" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="279" cy="640" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="323" cy="640" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="367" cy="640" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="235" y1="570" x2="235" y2="640" stroke="#1e2a44" stroke-width="2.5"/><line x1="645" y1="544" x2="685" y2="544" stroke="#1e2a44" stroke-width="2.5"/><circle cx="645" cy="544" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="685" cy="544" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="645" y1="590" x2="685" y2="590" stroke="#1e2a44" stroke-width="2.5"/><circle cx="645" cy="590" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="685" cy="590" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="665" y1="544" x2="665" y2="590" stroke="#1e2a44" stroke-width="2.5"/><line x1="645" y1="636" x2="685" y2="636" stroke="#1e2a44" stroke-width="2.5"/><circle cx="645" cy="636" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="685" cy="636" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="665" y1="590" x2="665" y2="636" stroke="#1e2a44" stroke-width="2.5"/><line x1="645" y1="682" x2="685" y2="682" stroke="#1e2a44" stroke-width="2.5"/><circle cx="645" cy="682" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="685" cy="682" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="665" y1="636" x2="665" y2="682" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="686" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">two generations, many in each</text><text x="780" y="616" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">four</text><text x="780" y="634" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">generations</text>
</svg>