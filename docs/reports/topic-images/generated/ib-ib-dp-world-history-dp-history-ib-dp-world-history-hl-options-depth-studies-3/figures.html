<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ib-ib-dp-world-history-dp-history-ib-dp-world-history-hl-options-depth-studies-3--02-qing-reforms.webp" width="900" height="529" alt="Three reforms with their outcomes. Self-Strengthening (1860s-1890s) borrowed military and industrial methods without political change and was exposed by defeat in 1895. The Hundred Days' Reform of 1898 was reversed by Cixi's coup. The New Policies of 1901-1911 abolished the examinations, built a new army and created provincial assemblies, but raised expectations and strengthened groups that turned against the dynasty." loading="lazy">
  <figcaption>The last reform was the most real, and the most dangerous to the dynasty.</figcaption>
</figure>

<!-- place after: ## Content area 1: the decline of the Qing and the 1911 Revolution -->
