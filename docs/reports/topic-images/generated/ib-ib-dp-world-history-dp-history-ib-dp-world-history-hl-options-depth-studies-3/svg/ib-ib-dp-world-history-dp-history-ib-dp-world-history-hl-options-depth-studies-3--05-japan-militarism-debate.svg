<rect width="900" height="421" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why did the military dominate policy?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Most evidence in the lesson weighs on one side</text>
<polygon points="450,164 416,234 484,234" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="210" y1="130" x2="690" y2="198" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="164" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="210" y1="130" x2="210" y2="170" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="170" width="360" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="200.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A deliberate plan</text><text x="46" y="229.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Militarism as the product of a planned</text><text x="61.2" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">course</text><line x1="690" y1="198" x2="690" y2="238" stroke="#1e2a44" stroke-width="3"/><rect x="510" y="238" width="360" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="526" y="268.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A weak constitutional system</text><text x="526" y="297.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Army and navy answered to the emperor</text><text x="541.2" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and could topple cabinets</text><text x="526" y="343.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="343.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Economic crisis</text><text x="526" y="368.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nationalist violence</text>
</svg>