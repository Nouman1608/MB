<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plan: the reforms and the fall of the Qing</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"To what extent were the reforms of 1901-1911 responsible?"</text>
<rect x="30" y="124" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Thesis</text><text x="450" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The New Policies were <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">most</tspan> <tspan font-weight="700" fill="#1e2a44">important</tspan> <tspan font-weight="700" fill="#1e2a44">reason</tspan>: they created the army, assemblies and elites</text><text x="450" y="210.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">that abandoned the Qing, though foreign pressure and revolutionaries made them necessary and</text><text x="450" y="232.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">set the timing.</text><rect x="130" y="279" width="740" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="145" y="308.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The reforms</text><text x="145" y="337.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Examinations abolished (1905); the New Army; provincial assemblies (1909)</text><circle cx="62" cy="318" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="326.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="733.005" y="291" width="121.995" height="29" rx="14.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="794.0025" y="310.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">named factor</text><rect x="130" y="369" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="398.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Foreign pressure</text><text x="145" y="427.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Defeats in 1895 and 1900; the Boxer indemnity drained the treasury</text><circle cx="62" cy="408" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="416.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="752.13" y="381" width="102.87" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="803.565" y="400.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">alternative</text><rect x="130" y="459" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="488.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Revolutionaries</text><text x="145" y="517.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tongmenghui and Sun Yat-sen supplied ideology; Sun was in the USA at Wuchang</text><circle cx="62" cy="498" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="506.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="752.13" y="471" width="102.87" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="803.565" y="490.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">alternative</text><rect x="130" y="549" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="578.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The trigger</text><text x="145" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Railway nationalization (1911) united provincial elites against Beijing</text><circle cx="62" cy="588" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="596.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="752.13" y="561" width="102.87" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="803.565" y="580.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">alternative</text><rect x="30" y="649" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="683.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="713.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The reforms were decisive because they shaped who acted in 1911 and why.</text>
</svg>