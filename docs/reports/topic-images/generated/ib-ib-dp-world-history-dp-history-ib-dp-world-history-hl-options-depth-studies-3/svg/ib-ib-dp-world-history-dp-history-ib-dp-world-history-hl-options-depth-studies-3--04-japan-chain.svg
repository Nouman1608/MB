<rect width="900" height="899" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Japan, 1918-1941: a chain, not one decision</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Teal: party government. Gold: turning points as the army takes the initiative</text>
<line x1="160" y1="134" x2="160" y2="857" stroke="#1e2a44" stroke-width="4"/><rect x="194" y="124" width="676" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="207" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hara Takashi, first commoner prime minister</text><text x="207" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Party cabinets become normal</text><line x1="160" y1="158.5" x2="194" y2="158.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="158.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="164.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1918</text><rect x="194" y="201" width="676" height="45" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="207" y="228.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Universal male suffrage; Peace Preservation Law</text><line x1="160" y1="223.5" x2="194" y2="223.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="223.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="229.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1925</text><rect x="194" y="254" width="676" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="281.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">London Naval Treaty; Hamaguchi shot</text><text x="207" y="305.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pressures on party government, alongside the Depression</text><line x1="160" y1="288.5" x2="194" y2="288.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="288.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="294.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1930</text><rect x="194" y="331" width="676" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="207" y="358.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mukden Incident</text><text x="207" y="382.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kwantung Army officers act without Tokyo's authority</text><line x1="160" y1="365.5" x2="194" y2="365.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="365.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="371.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">18 Sep 1931</text><rect x="194" y="408" width="676" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="207" y="435.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Manchukuo; Inukai assassinated (15 May)</text><text x="207" y="459.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">End of party cabinets</text><line x1="160" y1="442.5" x2="194" y2="442.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="442.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="448.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1932</text><rect x="194" y="485" width="676" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="512.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Japan leaves the League after the Lytton Report</text><line x1="160" y1="507.5" x2="194" y2="507.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="507.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="513.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1933</text><rect x="194" y="538" width="676" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="565.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Army rebellion in Tokyo, suppressed</text><text x="207" y="589.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Army influence over government grows</text><line x1="160" y1="572.5" x2="194" y2="572.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="572.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="578.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">26 Feb 1936</text><rect x="194" y="615" width="676" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="207" y="642.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Marco Polo Bridge; full-scale war with China</text><text x="207" y="666.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nanjing massacre in December</text><line x1="160" y1="649.5" x2="194" y2="649.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="649.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="655.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">7 Jul 1937</text><rect x="194" y="692" width="676" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="719.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tripartite Pact with Germany and Italy</text><line x1="160" y1="714.5" x2="194" y2="714.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="714.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="720.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Sep 1940</text><rect x="194" y="745" width="676" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="772.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">US asset freeze and oil embargo</text><text x="207" y="796.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Choice between retreat and war</text><line x1="160" y1="779.5" x2="194" y2="779.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="779.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="785.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jul-Aug 1941</text><rect x="194" y="822" width="676" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="207" y="849.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Attack on Pearl Harbor</text><line x1="160" y1="844.5" x2="194" y2="844.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="844.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="850.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">7 Dec 1941</text>
</svg>