<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 529" width="900" height="529" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="529" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three reforms and why they fell short</text>

<rect x="30" y="100" width="430" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1860s-1890s</text><text x="46" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Self-Strengthening</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Military and industrial borrowing</text><rect x="520" y="100" width="350" height="120" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="536" y="140.32" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Fell short</text><text x="536" y="169.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No political change; exposed by defeat in</text><text x="536" y="190.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1895</text><line x1="466" y1="160" x2="514" y2="160" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="236" width="430" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="264" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1898</text><text x="46" y="290.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hundred Days' Reform</text><text x="46" y="319.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Guangxu Emperor's edicts</text><rect x="520" y="236" width="350" height="120" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="536" y="286.82" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Fell short</text><text x="536" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reversed by Cixi's coup</text><line x1="466" y1="296" x2="514" y2="296" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="372" width="430" height="125" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="400" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1901-1911</text><text x="46" y="426.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">New Policies</text><text x="46" y="455.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Examinations abolished (1905); new army; provincial</text><text x="46" y="476.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">assemblies</text><rect x="520" y="372" width="350" height="125" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="536" y="414.82" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Backfired</text><text x="536" y="443.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Raised expectations; strengthened</text><text x="536" y="464.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">groups that turned against the dynasty</text><line x1="466" y1="434.5" x2="514" y2="434.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>