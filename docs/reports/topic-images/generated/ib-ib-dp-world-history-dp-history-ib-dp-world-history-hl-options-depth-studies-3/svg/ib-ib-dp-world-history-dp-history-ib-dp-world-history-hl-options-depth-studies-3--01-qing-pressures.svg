<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pressures on the Qing, 1839-1901</text>

<rect x="188.912" y="96" width="162.176" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="270" y="116.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">external pressure</text><rect x="564.944" y="96" width="130.112" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="630" y="116.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">internal crisis</text><line x1="150" y1="152" x2="150" y2="593" stroke="#1e2a44" stroke-width="4"/><rect x="184" y="142" width="686" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="197" y="169.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First Opium War; Treaty of Nanjing (1842)</text><text x="197" y="193.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hong Kong ceded to Britain; five treaty ports opened; an indemnity paid</text><line x1="150" y1="176.5" x2="184" y2="176.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="176.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="182.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1839-42</text><rect x="184" y="221" width="686" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="197" y="248.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Taiping Rebellion</text><text x="197" y="272.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Devastated central China; defeated by regional armies, shifting power to provincial</text><text x="197" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">leaders such as Zeng Guofan and Li Hongzhang</text><line x1="150" y1="266" x2="184" y2="266" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="266" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="272" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1850-64</text><rect x="184" y="321" width="686" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="197" y="348.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Second Opium War</text><text x="197" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Further concessions; the Summer Palace burned (1860)</text><line x1="150" y1="355.5" x2="184" y2="355.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="355.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="361.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1856-60</text><rect x="184" y="400" width="686" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="197" y="427.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Defeat by Japan; Treaty of Shimonoseki</text><text x="197" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Taiwan ceded</text><line x1="150" y1="434.5" x2="184" y2="434.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="434.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="440.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1894-95</text><rect x="184" y="479" width="686" height="45" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="197" y="506.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Scramble for concessions by the powers</text><line x1="150" y1="501.5" x2="184" y2="501.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="501.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="507.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1897-98</text><rect x="184" y="534" width="686" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="197" y="561.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Boxer Uprising; Boxer Protocol (1901)</text><text x="197" y="585.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A humiliating settlement; revolutionary groups grew afterwards</text><line x1="150" y1="568.5" x2="184" y2="568.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="568.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="574.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1899-1901</text>
</svg>