<rect width="900" height="531" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">China under Deng, 1976-1997</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Economic transformation without political liberalization</text>
<rect x="30" y="124" width="249.33333333333334" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="154.66666666666669" y="164" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SEP 1976</text><text x="154.66666666666669" y="190.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mao dies</text><line x1="285.33333333333337" y1="173.5" x2="319.33333333333337" y2="173.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="124" width="249.33333333333334" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="164" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">OCT 1976</text><text x="450.00000000000006" y="190.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Gang of Four arrested</text><line x1="580.6666666666667" y1="173.5" x2="614.6666666666667" y2="173.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="124" width="249.33333333333334" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745.3333333333334" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DEC 1978</text><text x="745.3333333333334" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Third Plenum</text><text x="745.3333333333334" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">"Reform and opening"</text><rect x="30" y="245" width="410" height="212" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="280.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Economy: changed</text><text x="50" y="309.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Household responsibility system</text><text x="50" y="336.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Special Economic Zones such as Shenzhen</text><text x="65.2" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1980)</text><text x="50" y="384.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="384.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Township and village enterprises</text><text x="50" y="411.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Deng's Southern Tour (1992) restarts market</text><text x="65.2" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reform</text><rect x="460" y="245" width="410" height="212" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="280.6" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Politics: not liberalized</text><text x="480" y="309.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Democracy Wall ended (1978-79); Wei</text><text x="495.2" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Jingsheng imprisoned</text><text x="480" y="357.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Four Cardinal Principles (1979)</text><text x="480" y="384.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="384.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tiananmen Square cleared, 4 June 1989; Zhao</text><text x="495.2" y="405.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ziyang removed</text><text x="450" y="495" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Deng died in February 1997, months before Hong Kong's return in July.</text>
</svg>