<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 788" width="900" height="788" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From reform to revolution, 1905-1912</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How the New Policies created the people who abandoned the Qing</text>
<rect x="30" y="124" width="269.3333333333333" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1905</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Examinations abolished</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cut the link between the</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gentry and the throne</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="335.3333333333333" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NEW ARMY</text><text x="335.3333333333333" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Modern officers</text><text x="335.3333333333333" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Revolutionary ideas spread</text><text x="335.3333333333333" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">among them</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620.6666666666666" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1909</text><text x="620.6666666666666" y="192.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Provincial assemblies</text><text x="620.6666666666666" y="221.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gave elites a political base</text><line x1="165" y1="244" x2="290" y2="310" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="244" x2="450" y2="310" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735" y1="244" x2="610" y2="310" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="318" width="600" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="350" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1911</text><text x="450" y="376.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Railway nationalization; railway protection movement</text><text x="450" y="405.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Provincial elites united against Beijing</text><line x1="450" y1="435" x2="450" y2="469" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="474" width="600" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="506" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">10 OCTOBER 1911</text><text x="450" y="532.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Army mutiny at Wuchang</text><text x="450" y="561.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Set off provincial declarations of independence</text><line x1="450" y1="591" x2="450" y2="625" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="630" width="600" height="84" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="662" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FEBRUARY 1912</text><text x="450" y="688.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Puyi abdicates; Yuan Shikai becomes president</text><text x="450" y="752" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Sun Yat-sen's Tongmenghui (1905) supplied ideology, but Sun was in the USA when Wuchang began.</text>
</svg>