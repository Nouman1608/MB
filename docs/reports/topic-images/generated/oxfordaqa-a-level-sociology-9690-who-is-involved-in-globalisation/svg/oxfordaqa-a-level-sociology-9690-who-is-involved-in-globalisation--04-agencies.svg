<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Lenders and norm-setters</text>

<rect x="178" y="104" width="342" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="349" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Bretton Woods and WTO</text><rect x="528" y="104" width="342" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="699" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">UN agencies</text><rect x="30" y="156" width="140" height="151" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="236.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Who</text><rect x="178" y="156" width="342" height="151" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="197" cy="180.92" r="4.5" fill="#2e6b62"/><text x="210" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">IMF:</tspan> lends in financial crisis</text><circle cx="197" cy="209.92" r="4.5" fill="#2e6b62"/><text x="210" y="215.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">World Bank:</tspan> funds development</text><text x="210" y="236.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">projects</text><circle cx="197" cy="259.92" r="4.5" fill="#2e6b62"/><text x="210" y="265.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">WTO (1995):</tspan> sets and enforces trade</text><text x="210" y="286.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rules</text><rect x="528" y="156" width="342" height="151" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="547" cy="180.92" r="4.5" fill="#2e6b62"/><text x="560" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">UNDP:</tspan> Human Development Report</text><text x="560" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">since 1990</text><circle cx="547" cy="230.92" r="4.5" fill="#2e6b62"/><text x="560" y="236.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">WHO:</tspan> smallpox eradication (1980)</text><circle cx="547" cy="259.92" r="4.5" fill="#2e6b62"/><text x="560" y="265.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">UNICEF, UNHCR, ILO</tspan></text><rect x="30" y="315" width="140" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="377.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How</text><rect x="178" y="315" width="342" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="345.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Loan conditions: the Washington</text><text x="192" y="366.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consensus (Williamson, 1989): fiscal</text><text x="192" y="387.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">discipline, trade liberalisation,</text><text x="192" y="408.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">privatisation, deregulation</text><rect x="528" y="315" width="342" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="542" y="345.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Set norms and deliver services: MDGs</text><text x="542" y="366.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2000–2015), then SDGs (2015–2030)</text><rect x="30" y="437" width="140" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="499.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Power</text><rect x="178" y="437" width="342" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="467.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Real leverage over borrowing</text><text x="192" y="488.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">countries; critics: structural</text><text x="192" y="509.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adjustment cut health and education</text><text x="192" y="530.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and added user fees</text><rect x="528" y="437" width="342" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="542" y="467.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Depend on voluntary funding; cannot</text><text x="542" y="488.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enforce most targets</text><rect x="30" y="567" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="603" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="56" y="632" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Many sociologists see the lending bodies as more powerful actors in globalisation than</text><text x="56" y="654" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the UN agencies.</text>
</svg>