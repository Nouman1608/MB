<rect width="900" height="536" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Development aid: deeper arguments</text>

<text x="30" y="114" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Types of aid</text><rect x="30" y="130" width="199.5" height="104" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="129.75" y="170.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Bilateral or</text><text x="129.75" y="194.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">multilateral</text><rect x="243.5" y="130" width="199.5" height="104" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="343.25" y="170.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Humanitarian or</text><text x="343.25" y="194.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">development</text><rect x="457" y="130" width="199.5" height="104" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="556.75" y="182.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Grants or loans</text><rect x="670.5" y="130" width="199.5" height="104" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="770.25" y="162.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tied aid</text><text x="770.25" y="192.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">spent on donor’s goods</text><text x="770.25" y="212.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">or services</text><text x="450" y="260" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">UN target (1970): 0.7% of gross national income; few donors meet it</text><rect x="30" y="284" width="269.3333333333333" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,334 L31.25,298.25 Q31.25,285.25 44.25,285.25 L285.0833333333333,285.25 Q298.0833333333333,285.25 298.0833333333333,298.25 L298.0833333333333,334 Z" fill="#b5d3cf"/><line x1="31.25" y1="334" x2="298.0833333333333" y2="334" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="314.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">For aid</text><circle cx="49" cy="359.92" r="4.5" fill="#2e6b62"/><text x="62" y="365.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Modernisation: investment</text><text x="62" y="386.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for take-off</text><circle cx="49" cy="409.92" r="4.5" fill="#2e6b62"/><text x="62" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sachs: "big push"</text><circle cx="49" cy="438.92" r="4.5" fill="#2e6b62"/><text x="62" y="444.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Humanitarian aid saves</text><text x="62" y="465.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lives; health aid supports</text><text x="62" y="486.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vaccination</text><rect x="315.3333333333333" y="284" width="269.3333333333333" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,334 L316.5833333333333,298.25 Q316.5833333333333,285.25 329.5833333333333,285.25 L570.4166666666666,285.25 Q583.4166666666666,285.25 583.4166666666666,298.25 L583.4166666666666,334 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="334" x2="583.4166666666666" y2="334" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="314.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Against (right)</text><circle cx="334.3333333333333" cy="359.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="365.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Moyo:</tspan> dependency and</text><text x="347.3333333333333" y="386.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">corruption</text><circle cx="334.3333333333333" cy="409.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Easterly (2006):</tspan> top-down</text><text x="347.3333333333333" y="436.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"planners" vs local</text><text x="347.3333333333333" y="457.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"searchers"</text><rect x="600.6666666666666" y="284" width="269.3333333333333" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,334 L601.9166666666666,298.25 Q601.9166666666666,285.25 614.9166666666666,285.25 L855.75,285.25 Q868.75,285.25 868.75,298.25 L868.75,334 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="334" x2="868.75" y2="334" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="314.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Against (left)</text><circle cx="619.6666666666666" cy="359.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="365.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hayter (1971):</tspan> aid serves</text><text x="632.6666666666666" y="386.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">donors’ political and</text><text x="632.6666666666666" y="407.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">economic interests</text><circle cx="619.6666666666666" cy="430.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="436.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tied aid and loan</text><text x="632.6666666666666" y="457.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conditions support this</text>
</svg>