<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nation states in globalisation</text>

<rect x="30" y="104" width="269.3333333333333" height="291" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More developed states</text><circle cx="51" cy="181.92" r="4.5" fill="#2e6b62"/><text x="64" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">IMF and World Bank votes</text><text x="64" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weighted by financial</text><text x="64" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contribution</text><circle cx="51" cy="252.92" r="4.5" fill="#2e6b62"/><text x="64" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Set trade policy (WTO,</text><text x="64" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regional blocs); provide</text><text x="64" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">most aid</text><circle cx="51" cy="323.92" r="4.5" fill="#2e6b62"/><text x="64" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Chang (2002):</tspan> protected</text><text x="64" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">their own industries, then</text><text x="64" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"kicked away the ladder"</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="291" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The competing state</text><circle cx="336.3333333333333" cy="181.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bids for investment with</text><text x="349.3333333333333" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tax breaks, low wages and</text><text x="349.3333333333333" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">export processing zones</text><circle cx="336.3333333333333" cy="252.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics: a "race to the</text><text x="349.3333333333333" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bottom" in labour and</text><text x="349.3333333333333" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">environmental standards</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="291" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The developmental state</text><circle cx="621.6666666666666" cy="181.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">South Korea and Taiwan</text><text x="634.6666666666666" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from the 1960s: directed</text><text x="634.6666666666666" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">banks, protected new</text><text x="634.6666666666666" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">industries, set export</text><text x="634.6666666666666" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">targets</text><circle cx="621.6666666666666" cy="294.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shapes globalisation</text><text x="634.6666666666666" y="321.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rather than simply</text><text x="634.6666666666666" y="342.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">receiving it</text><rect x="30" y="411" width="840" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="447" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Is the state declining?</text><circle cx="61" cy="470.39" r="4.5" fill="#8a6d0d"/><text x="74" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Yes:</tspan> Ohmae (1995), regional economies and global markets replace states; Strange</text><text x="74" y="498" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(1996), power shifts to markets and corporations</text><circle cx="61" cy="522.39" r="4.5" fill="#8a6d0d"/><text x="74" y="528" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">No:</tspan> states still control borders, armies, taxes and citizenship; China used</text><text x="74" y="550" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">globalisation to increase its power</text>
</svg>