d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Grassroots movements</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">organise from below</text><circle cx="336.3333333333333" cy="210.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Zapatistas:</tspan> Chiapas, 1</text><text x="349.3333333333333" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">January 1994, the day</text><text x="349.3333333333333" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">NAFTA began</text><circle cx="336.3333333333333" cy="281.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">La Via Campesina</tspan> (1993):</text><text x="349.3333333333333" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">food sovereignty</text><circle cx="336.3333333333333" cy="331.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Narmada Bachao Andolan:</tspan></text><text x="349.3333333333333" y="358.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">against large dams</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="312" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Indigenous peoples</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">UN Declaration (2007)</text><circle cx="621.6666666666666" cy="210.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Free, prior and informed</text><text x="634.6666666666666" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consent before projects</text><circle cx="621.6666666666666" cy="260.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Standing Rock</tspan> (2016):</text><text x="634.6666666666666" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">global alliances</text><circle cx="621.6666666666666" cy="310.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="316.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Traditional ecological</text><text x="634.6666666666666" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">knowledge in climate talks</text><rect x="30" y="432" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="468" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Same tools, other direction</text><text x="56" y="497" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Globalisation from below uses international networks, media attention and appeals to</text><text x="56" y="519" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">global rights, like globalisation from above.</text>
