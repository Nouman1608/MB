<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing the actors in globalisation</text>

<rect x="300" y="110" width="300" height="64" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Any actor in globalisation</text><line x1="366" y1="178" x2="170" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="178" x2="450" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="534" y1="178" x2="730" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="228" width="269.3333333333333" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,298 L31.25,242.25 Q31.25,229.25 44.25,229.25 L285.0833333333333,229.25 Q298.0833333333333,229.25 298.0833333333333,242.25 L298.0833333333333,298 Z" fill="#b5d3cf"/><line x1="31.25" y1="298" x2="298.0833333333333" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="256.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">What resources does it</text><text x="164.66666666666666" y="280.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">have?</text><text x="44" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">money, law, votes, people,</text><text x="44" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">knowledge</text><rect x="315.3333333333333" y="228" width="269.3333333333333" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,298 L316.5833333333333,242.25 Q316.5833333333333,229.25 329.5833333333333,229.25 L570.4166666666666,229.25 Q583.4166666666666,229.25 583.4166666666666,242.25 L583.4166666666666,298 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="298" x2="583.4166666666666" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="256.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Whose interests does it</text><text x="450" y="280.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">serve?</text><text x="329.3333333333333" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="600.6666666666666" y="228" width="269.3333333333333" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,298 L601.9166666666666,242.25 Q601.9166666666666,229.25 614.9166666666666,229.25 L855.75,229.25 Q868.75,229.25 868.75,242.25 L868.75,298 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="298" x2="868.75" y2="298" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="256.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Who holds it to</text><text x="735.3333333333333" y="280.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">account?</text><text x="614.6666666666666" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="392" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="428" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it works</text><text x="56" y="457" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Answers that use these questions analyse power rather than list organisations.</text>
