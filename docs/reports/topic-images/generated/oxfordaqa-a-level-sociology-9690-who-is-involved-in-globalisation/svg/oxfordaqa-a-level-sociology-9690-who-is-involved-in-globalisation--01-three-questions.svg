<rect width="900" height="491" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing the actors in globalisation</text>

<rect x="300" y="110" width="300" height="64" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Any actor in globalisation</text><line x1="366" y1="178" x2="170" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="178" x2="450" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="534" y1="178" x2="730" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="228" width="269.3333333333333" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="164.66666666666666" y="260.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">What resources does it</text><text x="164.66666666666666" y="284.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">have?</text><text x="164.66666666666666" y="314.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">money, law, votes, people,</text><text x="164.66666666666666" y="335.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">knowledge</text><rect x="315.3333333333333" y="228" width="269.3333333333333" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="281.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Whose interests does it</text><text x="450" y="305.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">serve?</text><rect x="600.6666666666666" y="228" width="269.3333333333333" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="735.3333333333333" y="281.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Who holds it to</text><text x="735.3333333333333" y="305.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">account?</text><rect x="30" y="376" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="412" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it works</text><text x="56" y="441" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Answers that use these questions analyse power rather than list organisations.</text>
</svg>