<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Transnational corporations: double-edged</text>

<rect x="30" y="104" width="404" height="238" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">For development</text><circle cx="53" cy="184.79" r="4.5" fill="#2e6b62"/><text x="66" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Investment and jobs</text><circle cx="53" cy="214.79" r="4.5" fill="#2e6b62"/><text x="66" y="220.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Technology transfer</text><circle cx="53" cy="244.79" r="4.5" fill="#2e6b62"/><text x="66" y="250.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Links to export markets</text><circle cx="53" cy="274.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="280.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tax revenue</text><rect x="466" y="104" width="404" height="238" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Against</text><circle cx="489" cy="184.79" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Profits flow to shareholders in richer</text><text x="502" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">countries</text><circle cx="489" cy="236.79" r="4.5" fill="#8a6d0d"/><text x="502" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Production moves to wherever costs are</text><text x="502" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lowest</text><circle cx="489" cy="288.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Subcontracting chains blur</text><text x="502" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">responsibility</text><circle cx="450" cy="223" r="24" fill="#1e2a44"/><text x="450" y="230" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="360" width="840" height="193" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="396" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cases and theory</text><circle cx="61" cy="419.39" r="4.5" fill="#8a6d0d"/><text x="74" y="425" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bhopal (1984):</tspan> Union Carbide gas leak killed thousands; lower safety standards abroad?</text><circle cx="61" cy="449.39" r="4.5" fill="#8a6d0d"/><text x="74" y="455" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Rana Plaza (2013):</tspan> garment factory collapse killed more than 1,100; led to the Accord</text><text x="74" y="477" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">on Fire and Building Safety</text><circle cx="61" cy="501.39" r="4.5" fill="#8a6d0d"/><text x="74" y="507" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Sklair (2002):</tspan> a transnational capitalist class of executives, politicians,</text><text x="74" y="529" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">professionals and media elites</text>
</svg>