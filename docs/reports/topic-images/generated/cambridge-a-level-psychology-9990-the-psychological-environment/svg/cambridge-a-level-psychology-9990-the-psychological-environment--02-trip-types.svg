fill="#4a5568" text-anchor="middle">broad, leisurely or exploratory</text><text x="450" y="558" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">routes</text><rect x="704.864" y="468" width="70.27199999999999" height="30" rx="15" fill="#f6e3d8" stroke="#b5602e" stroke-width="2"/><text x="740" y="488.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">raider</text><text x="740" y="538" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fast, targeted visits</text><rect x="30" y="596" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="630.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gil et al. (2009): CCTV tracking</text><text x="50" y="659.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Objective, reliable routes, not memories. But it shows <tspan font-weight="700" fill="#1e2a44">where</tspan>, not <tspan font-weight="700" fill="#1e2a44">why</tspan>; privacy if shoppers did not agree;</text><text x="50" y="680.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">five patterns is reductionist.</text>
