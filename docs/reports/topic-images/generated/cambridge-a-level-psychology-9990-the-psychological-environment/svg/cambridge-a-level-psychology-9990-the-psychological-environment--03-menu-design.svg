0.00</text><line x1="564" y1="292" x2="710" y2="292" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><text x="816" y="297" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">0.00</text><line x1="564" y1="318" x2="690" y2="318" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><text x="816" y="323" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">0.00</text><line x1="564" y1="344" x2="730" y2="344" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><text x="816" y="349" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">0.00</text><line x1="564" y1="370" x2="710" y2="370" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><text x="816" y="375" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">0.00</text><line x1="564" y1="396" x2="690" y2="396" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><text x="816" y="401" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">0.00</text><rect x="772" y="174" width="54" height="236" rx="6" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="210" y="454" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Positive</text><text x="690" y="454" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Negative</text><text x="380" y="224" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Highlighted item</text><line x1="374" y1="232" x2="286" y2="236" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="380" y="334" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Prices in a neat</text><text x="380" y="355" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">column</text><line x1="500" y1="324" x2="764" y2="300" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="30" y="486" width="413" height="184" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="518" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POSITIVE</text><text x="50" y="549.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="549.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Boxes, graphics or extra space for items the</text><text x="65.2" y="570.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">restaurant most wants to sell</text><text x="50" y="595.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="595.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Clear categories</text><text x="50" y="620.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="620.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Appealing, accurate descriptions</text><text x="50" y="645.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="645.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A readable font</text><rect x="457" y="486" width="413" height="184" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="477" y="518" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NEGATIVE</text><text x="477" y="549.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="549.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prices in a neat column: invites choosing by</text><text x="492.2" y="570.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">price</text><text x="477" y="595.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="595.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Too many items: slow, stressful choosing</text><text x="477" y="620.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="620.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cluttered layouts</text><rect x="30" y="692" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="725.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Eye-tracking</tspan> tests these ideas objectively: where diners look first, for how long and in what order.</text>
