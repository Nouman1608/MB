<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 786" width="900" height="786" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="786" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Wayfinding in shopping malls</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Where am I, where do I want to go, and how do I get there?</text>
<rect x="30" y="124" width="413" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SIGNS</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Directional signs at decision points</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">junctions, escalators; identification signs on</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shops</text><rect x="457" y="124" width="413" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">“YOU ARE HERE” MAPS</text><text x="477" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">At entrances and junctions, aligned</text><text x="477" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“up” on the map means “straight ahead”</text><rect x="30" y="270" width="413" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="302" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LANDMARKS AND LAYOUT</text><text x="50" y="328.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A fountain or atrium; a simple layout</text><text x="50" y="356.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">make a mental map easier to form</text><rect x="457" y="270" width="413" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="302" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FAMILIARITY</text><text x="477" y="328.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Regular visitors rely less on signs</text><rect x="30" y="403" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="443" width="160" height="120" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="150" y1="553" x2="150" y2="463" stroke="#c9d6d4" stroke-width="12"/><circle cx="150" cy="533" r="9" fill="#b5602e"/><line x1="150" y1="521" x2="150" y2="473" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="500" y="443" width="160" height="120" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="553" x2="580" y2="463" stroke="#c9d6d4" stroke-width="12"/><circle cx="580" cy="533" r="9" fill="#b5602e"/><line x1="570" y1="533" x2="526" y2="533" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="260" y="473" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Aligned:</text><text x="260" y="499" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“up” on the map = straight</text><text x="260" y="520" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ahead for the viewer</text><text x="690" y="473" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Not aligned:</text><text x="690" y="499" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“up” on the map is</text><text x="690" y="520" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not straight ahead</text><text x="450" y="603" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic “you are here” maps; red dot = viewer, arrow = the way they face</text><rect x="30" y="645" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="679.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Dogu and Erkip (2000)</text><text x="50" y="708.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Surveyed mall shoppers about signs, maps and layout, and how familiarity made a difference. Quick and</text><text x="50" y="729.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">many shoppers, but subjective; one mall in one country.</text>
</svg>