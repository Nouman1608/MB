<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="476" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three functions of personal space</text>

<rect x="30" y="100" width="270.6666666666667" height="178" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OVERLOAD</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Too much close</text><text x="50" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">stimulation is</text><text x="50" y="204.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">overwhelming</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">so we keep distance to</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reduce it</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="178" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AROUSAL</text><text x="334.6666666666667" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Closeness raises arousal</text><text x="334.6666666666667" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pleasant with a partner,</text><text x="334.6666666666667" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unpleasant with strangers</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="178" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="619.3333333333334" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BEHAVIOUR CONSTRAINT</text><text x="619.3333333333334" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Others too close limit our</text><text x="619.3333333333334" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">freedom</text><text x="619.3333333333334" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to talk privately or to move</text><text x="450" y="316" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">APPLIED TO CLOSE RESTAURANT TABLES (ROBSON ET AL., 2011)</text><rect x="30" y="338" width="233.75" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="146.875" y="371.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Overheard</text><text x="146.875" y="392.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">conversations</text><text x="146.875" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">= overload</text><line x1="269.75" y1="391" x2="303.75" y2="391" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="309.75" y="338" width="280.5" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="371.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Limits on what diners feel</text><text x="450" y="392.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">able to say</text><text x="450" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">= behaviour constraint</text><line x1="596.25" y1="391" x2="630.25" y2="391" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="636.25" y="338" width="233.75" height="106" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="753.125" y="385.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Romantic scenario</text><text x="753.125" y="406.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">most affected</text>
</svg>