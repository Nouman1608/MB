<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Item position on a menu</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Dayan and Bar-Hillel (2011)</text>
<rect x="170" y="124" width="560" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One menu category</text><rect x="210" y="180" width="480" height="42" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="207" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">first item</text><text x="670" y="207" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">chosen more often</text><rect x="210" y="232" width="480" height="42" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="259" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">middle item</text><rect x="210" y="284" width="480" height="42" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="311" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">middle item</text><rect x="210" y="336" width="480" height="42" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="363" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">middle item</text><rect x="210" y="388" width="480" height="42" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="415" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">last item</text><text x="670" y="415" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">chosen more often</text><text x="155" y="207" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">PRIMACY</text><text x="745" y="415" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">RECENCY</text><rect x="30" y="476" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="509.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Fits primacy and recency from memory research: first and last items get <tspan font-weight="700" fill="#1e2a44">more</tspan> <tspan font-weight="700" fill="#1e2a44">attention</tspan> and are</text><text x="450" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">better</tspan> <tspan font-weight="700" fill="#1e2a44">remembered</tspan>.</text><text x="450" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Real orders give more ecological validity than a hypothetical menu, but also depend on price, hunger and</text><text x="450" y="611.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">recommendations.</text>
</svg>