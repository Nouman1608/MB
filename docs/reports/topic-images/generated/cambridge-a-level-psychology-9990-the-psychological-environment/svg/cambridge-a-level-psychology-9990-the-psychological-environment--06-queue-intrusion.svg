<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 835" width="900" height="835" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="835" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Milgram et al. (1986): defending a queue</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Confederates pushed into real queues in New York</text>
<rect x="30" y="124" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="184" width="70" height="100" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">counter</text><circle cx="180" cy="234" r="18" fill="#eef1f0" stroke="#4a5568" stroke-width="2.5"/><circle cx="240" cy="234" r="18" fill="#eef1f0" stroke="#4a5568" stroke-width="2.5"/><circle cx="300" cy="234" r="18" fill="#eef1f0" stroke="#4a5568" stroke-width="2.5"/><circle cx="360" cy="234" r="18" fill="#eef1f0" stroke="#4a5568" stroke-width="2.5"/><circle cx="470" cy="234" r="18" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="530" cy="234" r="18" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="590" cy="234" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="650" cy="234" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="710" cy="234" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="770" cy="234" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="415" cy="178" r="18" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><line x1="415" y1="200" x2="415" y2="228" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="445" y="174" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">intruder: neutral comment, no justification</text><text x="270" y="286" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">in front: object less</text><text x="500" y="286" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">directly behind: object most</text><line x1="455" y1="262" x2="545" y2="262" stroke="#b5602e" stroke-width="3"/><text x="450" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic queue</text><rect x="30" y="396" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="428" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NUMBER OF INTRUSIONS</text><text x="50" y="453.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Two intruders → more objection than one</text><text x="50" y="480.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the cost of tolerating it rose</text><rect x="457" y="396" width="413" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="428" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BUFFERS</text><text x="477" y="453.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Passive confederates behind the intrusion →</text><text x="477" y="474.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">objection fell</text><text x="477" y="501.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">responsibility to object shifted to them</text><rect x="30" y="540" width="413" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="572" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOCIAL STRUCTURE</text><text x="50" y="597.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A queue is a social system with shared rules</text><text x="50" y="624.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">those who lost their place objected more</text><rect x="457" y="540" width="413" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="572" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESPONSES</text><text x="477" y="597.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mostly verbal objections</text><text x="477" y="624.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">also looks and gestures; physical action rare</text><rect x="30" y="671" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="703" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="729.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Real queues</text><text x="50" y="757.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">High ecological validity; quantitative and</text><text x="50" y="778.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">qualitative data.</text><rect x="457" y="671" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="703" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="729.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ethics and culture</text><text x="477" y="757.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Deception, no consent, irritation; queuing norms</text><text x="477" y="778.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">vary.</text>
</svg>