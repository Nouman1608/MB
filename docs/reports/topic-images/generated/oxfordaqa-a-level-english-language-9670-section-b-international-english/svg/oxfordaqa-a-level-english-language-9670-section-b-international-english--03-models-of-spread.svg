<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Models of the spread of English</text>

<rect x="30" y="110" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Kachru: three circles (1985)</text><circle cx="160" cy="270" r="105" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="160" cy="270" r="70" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="160" cy="270" r="36" fill="#2e6b62"/><text x="160" y="276" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">inner</text><text x="160" y="224" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">outer</text><text x="160" y="188" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">expanding</text><text x="285" y="200" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ recognises</text><text x="285" y="221" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">   outer-circle</text><text x="285" y="242" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">   varieties</text><text x="285" y="290" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− nation-based</text><text x="285" y="311" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− inner circle</text><text x="285" y="332" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">   at the centre</text><rect x="460" y="110" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">McArthur: Circle of World English</text><line x1="665" y1="300" x2="770" y2="300" stroke="#2e6b62" stroke-width="2.5"/><circle cx="770" cy="300" r="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="665" y1="300" x2="739.2462120245875" y2="362.2253967444162" stroke="#2e6b62" stroke-width="2.5"/><circle cx="739.2462120245875" cy="362.2253967444162" r="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="665" y1="300" x2="665" y2="388" stroke="#2e6b62" stroke-width="2.5"/><circle cx="665" cy="388" r="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="665" y1="300" x2="590.7537879754125" y2="362.2253967444162" stroke="#2e6b62" stroke-width="2.5"/><circle cx="590.7537879754125" cy="362.2253967444162" r="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="665" y1="300" x2="560" y2="300" stroke="#2e6b62" stroke-width="2.5"/><circle cx="560" cy="300" r="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="665" y1="300" x2="590.7537879754125" y2="237.77460325558383" stroke="#2e6b62" stroke-width="2.5"/><circle cx="590.7537879754125" cy="237.77460325558383" r="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="665" y1="300" x2="665" y2="212" stroke="#2e6b62" stroke-width="2.5"/><circle cx="665" cy="212" r="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="665" y1="300" x2="739.2462120245875" y2="237.7746032555838" stroke="#2e6b62" stroke-width="2.5"/><circle cx="739.2462120245875" cy="237.7746032555838" r="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="665" cy="300" r="50" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="665" y="294" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">World</text><text x="665" y="312" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Standard</text><text x="665" y="330" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">English</text><text x="482" y="172" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">1987: regional varieties around a hub</text><text x="665" y="448" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Varieties are related, not ranked.</text><rect x="30" y="490" width="410" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="526" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Modiano: centripetal circles (1999)</text><circle cx="180" cy="650" r="95" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="180" cy="650" r="52" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="646" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">proficient</text><text x="180" y="664" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">users</text><text x="295" y="610" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Centre: speakers</text><text x="295" y="631" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proficient in</text><text x="295" y="652" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">international</text><text x="295" y="673" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">communication,</text><text x="295" y="694" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">whatever their</text><text x="295" y="715" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">first language</text><rect x="460" y="490" width="410" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="526" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">World English features are systematic</text><rect x="482" y="542" width="366" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="498" y="566" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“prepone”</text><text x="498" y="589" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Indian English: by analogy with “postpone”</text><rect x="482" y="607" width="366" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="498" y="631" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“isn’t it”</text><text x="498" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">invariant tag in several varieties</text><rect x="482" y="672" width="366" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="498" y="696" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“lah”</text><text x="498" y="719" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Singapore English discourse particle</text><rect x="482" y="737" width="366" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="498" y="761" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">local vocabulary</text><text x="498" y="784" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">from contact languages</text>
