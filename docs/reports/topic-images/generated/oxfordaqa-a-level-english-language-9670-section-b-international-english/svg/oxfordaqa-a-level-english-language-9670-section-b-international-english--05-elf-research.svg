<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">English as a lingua franca: key research</text>

<rect x="30" y="110" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Jenkins (2000): the Lingua Franca Core</text><text x="55" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pronunciation features most important for intelligibility between non-native speakers</text><rect x="55" y="192" width="380" height="116" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="75" y="224" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Matter most</text><text x="75" y="254" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• most consonant sounds</text><text x="75" y="282" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• vowel length</text><rect x="465" y="192" width="380" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="485" y="224" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Matter less</text><text x="485" y="254" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• the “th” sounds</text><rect x="30" y="350" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="386" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Seidlhofer: the VOICE corpus of spoken ELF</text><text x="55" y="414" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Features observed that rarely impede understanding:</text><rect x="55" y="432" width="330" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="220" y="460.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">omitting third-person “-s”</text><rect x="400" y="432" width="340" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="570" y="460.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">“isn’t it?” as a universal tag</text><rect x="30" y="520" width="840" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="556" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Accommodation strategies</text><rect x="55" y="576" width="140" height="42" rx="21" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="125" y="602.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">repetition</text><rect x="205" y="576" width="140" height="42" rx="21" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="275" y="602.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">paraphrase</text><rect x="355" y="576" width="230" height="42" rx="21" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="470" y="602.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">checking understanding</text><rect x="595" y="576" width="250" height="42" rx="21" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="720" y="602.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">adjusting for the listener</text><text x="55" y="656" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Successful ELF communication is a skill, not an approximation of native speech.</text>
</svg>