ke-width="3"/><text x="798" y="179.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="798" y="220" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Differentiation</text><line x1="40" y1="500" x2="860" y2="500" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="450" y="530" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">a postcolonial English moves towards becoming an accepted local variety</text><text x="450" y="130" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Schneider’s Dynamic Model</text>
