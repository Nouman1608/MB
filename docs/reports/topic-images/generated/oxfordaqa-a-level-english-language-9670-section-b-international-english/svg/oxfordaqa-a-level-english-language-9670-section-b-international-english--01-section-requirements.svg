<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section B: International English</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unit 3 exam</text><text x="845" y="146" font-size="18" font-weight="600" fill="#4a5568" text-anchor="end">2 hours · 50 marks · 30% of the A-level</text><rect x="55" y="166" width="395" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="252" y="208" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Section A</text><rect x="450" y="166" width="395" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="647" y="198" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: International English</text><text x="647" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><text x="450" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">One question from a choice of two</text><rect x="30" y="318" width="840" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="352" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Each question sets out an issue for discussion</text><text x="450" y="382" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Builds on the academic essay skills of Unit 2 Section B</text><rect x="30" y="428" width="268" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="466" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="472.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="92" y="473" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Knowledge</text><text x="52" y="506" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of the topic, including</text><text x="52" y="527" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">theories and approaches</text><rect x="316" y="428" width="268" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="350" cy="466" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="350" y="472.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="378" y="473" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Data analysis</text><text x="338" y="506" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">any material provided is</text><text x="338" y="527" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">used as evidence</text><rect x="602" y="428" width="268" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="636" cy="466" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="636" y="472.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="664" y="473" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Argument</text><text x="624" y="506" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">academic argument and</text><text x="624" y="527" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">evaluation of ideas</text>
