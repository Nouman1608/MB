<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="850" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five debates questions are likely to set</text>

<rect x="30" y="110" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="142" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Standards and ownership</text><rect x="55" y="156" width="330" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="72" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Quirk (1990)</text><text x="72" y="202" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">one standard for teaching</text><line x1="392" y1="184" x2="508" y2="184" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" marker-start="url(#ahO)"/><rect x="515" y="156" width="330" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="532" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Kachru (1991)</text><text x="532" y="202" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">outer-circle norms are legitimate</text><text x="55" y="232" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Widdowson (1994): native speakers cannot claim custody of an international language.</text><rect x="30" y="256" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="288" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Intelligibility vs identity</text><rect x="55" y="302" width="330" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="72" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A shared standard</text><text x="72" y="348" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">supports understanding</text><line x1="392" y1="330" x2="508" y2="330" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" marker-start="url(#ahO)"/><rect x="515" y="302" width="330" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="532" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Local varieties</text><text x="532" y="348" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">express identity</text><text x="55" y="378" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Many speakers shift style by audience: managed rather than resolved.</text><rect x="30" y="402" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="434" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Teaching models</text><rect x="55" y="448" width="330" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="72" y="472" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Native model</text><text x="72" y="494" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">British or American</text><line x1="392" y1="476" x2="508" y2="476" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" marker-start="url(#ahO)"/><rect x="515" y="448" width="330" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="532" y="472" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Local standard or ELF</text><text x="532" y="494" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">intelligibility as the goal</text><text x="55" y="524" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Native-speakerism: the belief that native speakers are better teachers.</text><rect x="30" y="548" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="580" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Power and inequality</text><rect x="55" y="594" width="330" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="72" y="618" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Phillipson</text><text x="72" y="640" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">linguistic imperialism</text><line x1="392" y1="622" x2="508" y2="622" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" marker-start="url(#ahO)"/><rect x="515" y="594" width="330" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="532" y="618" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Crystal: speakers adopt English</text><text x="532" y="640" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">for their own purposes</text><text x="55" y="670" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">English opens access, but whose norms are rewarded?</text><rect x="30" y="694" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="726" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">The future</text><rect x="55" y="740" width="330" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="72" y="764" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fragment</text><text x="72" y="786" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">into separate languages</text><line x1="392" y1="768" x2="508" y2="768" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" marker-start="url(#ahO)"/><rect x="515" y="740" width="330" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="532" y="764" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Converge</text><text x="532" y="786" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">on a global standard</text><text x="55" y="816" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Or a family of varieties with an international style alongside.</text>
</svg>