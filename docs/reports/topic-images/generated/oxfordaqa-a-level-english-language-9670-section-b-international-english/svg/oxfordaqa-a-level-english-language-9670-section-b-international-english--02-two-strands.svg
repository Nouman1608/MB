<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 608" width="900" height="608" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="608" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two strands of international English</text>

<rect x="30" y="110" width="410" height="395" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="110" width="410" height="56" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="146" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Established world Englishes</text><text x="54" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Long-standing national and regional</text><text x="54" y="223" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">varieties with their own norms.</text><text x="54" y="290" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Focus</text><text x="54" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">varieties tied to places</text><circle cx="60" cy="360" r="5" fill="#2e6b62"/><text x="76" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Indian, Nigerian, Singaporean</text><circle cx="60" cy="400" r="5" fill="#2e6b62"/><text x="76" y="406" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Caribbean, South African, Australian</text><circle cx="60" cy="440" r="5" fill="#2e6b62"/><text x="76" y="446" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">features are systematic, not errors</text><circle cx="60" cy="480" r="5" fill="#2e6b62"/><text x="76" y="486" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">models: Kachru, Schneider and others</text><rect x="460" y="110" width="410" height="395" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><rect x="460" y="110" width="410" height="56" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="146" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">English as a lingua franca</text><text x="484" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A shared language between people with</text><text x="484" y="223" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">different first languages, often with no</text><text x="484" y="246" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">native speaker present.</text><text x="484" y="290" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Focus</text><text x="484" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">communication from anywhere</text><circle cx="490" cy="360" r="5" fill="#8a6d0d"/><text x="506" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Jenkins: Lingua Franca Core</text><circle cx="490" cy="400" r="5" fill="#8a6d0d"/><text x="506" y="406" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Seidlhofer: the VOICE corpus</text><circle cx="490" cy="440" r="5" fill="#8a6d0d"/><text x="506" y="446" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">accommodation strategies</text><circle cx="490" cy="480" r="5" fill="#8a6d0d"/><text x="506" y="486" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a skill, not an approximation</text><rect x="30" y="522" width="840" height="60" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="559" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">A common mistake: treating world Englishes and ELF as the same idea.</text>
</svg>