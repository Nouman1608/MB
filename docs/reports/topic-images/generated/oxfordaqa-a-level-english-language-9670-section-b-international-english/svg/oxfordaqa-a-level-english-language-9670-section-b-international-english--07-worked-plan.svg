<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: planning the essay</text>

<rect x="30" y="108" width="840" height="58" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="144" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">“Non-native speakers should aim to speak English like native speakers.” Discuss.</text><rect x="30" y="186" width="236" height="78" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="148" y="231" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Thesis</text><line x1="270" y1="225" x2="290" y2="225" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="296" y="186" width="574" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="314" y="219" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The aim confuses accuracy with effectiveness:</text><text x="314" y="241" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intelligibility and accommodation matter more.</text><rect x="30" y="278" width="236" height="78" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="148" y="323" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">For the view</text><line x1="270" y1="317" x2="290" y2="317" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="296" y="278" width="574" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="314" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Native models are codified, used in teaching</text><text x="314" y="333" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and testing, rewarded by some.</text><rect x="784" y="299" width="71" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="819.5" y="322.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Quirk</text><rect x="30" y="370" width="236" height="78" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="148" y="415" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Against: ELF</text><line x1="270" y1="409" x2="290" y2="409" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="296" y="370" width="574" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="314" y="403" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most interactions have no native speaker;</text><text x="314" y="425" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">native idioms can reduce understanding.</text><rect x="766.8" y="391" width="88.19999999999999" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="810.9" y="414.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Jenkins</text><rect x="30" y="462" width="236" height="78" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="148" y="507" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Against: world Englishes</text><line x1="270" y1="501" x2="290" y2="501" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="296" y="462" width="574" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="314" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Outer-circle speakers have their own norms;</text><text x="314" y="517" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“native” is plural.</text><rect x="680.8" y="483" width="174.2" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="767.9" y="506.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Kachru, Schneider</text><rect x="30" y="554" width="236" height="78" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="148" y="599" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><line x1="270" y1="593" x2="290" y2="593" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="296" y="554" width="574" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="314" y="587" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Identity, ownership and the risk of</text><text x="314" y="609" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">native-speakerism.</text><rect x="749.6" y="575" width="105.39999999999999" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="802.3000000000001" y="598.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Widdowson</text><rect x="30" y="646" width="236" height="78" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="148" y="691" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><line x1="270" y1="685" x2="290" y2="685" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="296" y="646" width="574" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="314" y="679" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Qualified: native models suit some goals, but are not the</text><text x="314" y="701" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">right universal aim.</text><text x="450" y="762" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Both strands used as evidence, an opposing view included, and a judgement reached.</text>
</svg>