<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six forms and their conventions</text>

<rect x="30" y="100" width="410" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="136" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Article</text><text x="50" y="164.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Headline; optional subheading or standfirst;</text><text x="50" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a hooking opening; one point per paragraph;</text><text x="50" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a closing thought</text><text x="50" y="248" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Lively for a student magazine, measured for</text><text x="50" y="267" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">a broadsheet</text><rect x="460" y="100" width="410" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="136" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Speech</text><text x="480" y="164.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Greeting; signposting (“First…”,</text><text x="480" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Finally…”); triples and questions; a</text><text x="480" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">memorable close and thanks</text><text x="480" y="267" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Spoken rhythm; direct address throughout</text><rect x="30" y="295" width="410" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="331" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Letter</text><text x="50" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Greeting and sign-off; reason for writing</text><text x="50" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">early; one issue per paragraph; a requested</text><text x="50" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">action at the end</text><text x="50" y="443" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Formal unless the prompt sets a personal</text><text x="50" y="462" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">relationship</text><rect x="460" y="295" width="410" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="331" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Guide</text><text x="480" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Title; clear sections or subheadings;</text><text x="480" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">practical advice, often in the second</text><text x="480" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">person; logical order</text><text x="480" y="462" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Helpful, confident, clear</text><rect x="30" y="490" width="410" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="526" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Review</text><text x="50" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Title naming what is reviewed; brief</text><text x="50" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">context; balanced judgement with evidence; a</text><text x="50" y="596.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">final verdict</text><text x="50" y="657" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Personal but informed</text><rect x="460" y="490" width="410" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="526" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Text of a leaflet</text><text x="480" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Title; subheadings; short paragraphs; direct</text><text x="480" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">address; a clear call to action or contact</text><text x="480" y="596.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">point</text><text x="480" y="638" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Concise; do not draw pictures or boxes:</text><text x="480" y="657" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">only words are marked</text><rect x="30" y="693" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="726.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Form features help only when they serve the purpose.</text><text x="48" y="755.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A headline and three subheadings do not rescue an article whose paragraphs do not develop</text><text x="48" y="777.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">an argument.</text>
</svg>