<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">AO5 under time pressure</text>

<rect x="30" y="100" width="230" height="47" fill="#1e2a44"/><text x="145" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Habit</text><rect x="260" y="100" width="610" height="47" fill="#1e2a44"/><text x="565" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">How</text><rect x="30" y="147" width="230" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="173.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Vary sentences</text><text x="44" y="195.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">deliberately</text><rect x="260" y="147" width="610" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="173.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A short sentence after two long ones creates emphasis: use it for</text><text x="274" y="195.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">your strongest point</text><rect x="30" y="217" width="230" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="254.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Precise vocabulary</text><rect x="260" y="217" width="610" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="243.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Neglected” is more exact than “very bad”; “ubiquitous” is not</text><text x="274" y="265.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">better if it is used wrongly</text><rect x="30" y="287" width="230" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="324.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Paragraph for meaning</text><rect x="260" y="287" width="610" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="313.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A new paragraph for each new point, time shift or change of</text><text x="274" y="335.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">speaker</text><rect x="30" y="357" width="230" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="383.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Punctuation with a</text><text x="44" y="405.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">job</text><rect x="260" y="357" width="610" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="383.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Colons introduce explanations; semicolons balance related clauses;</text><text x="274" y="405.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">dashes mark an aside</text><rect x="30" y="427" width="230" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="453.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Three minutes to</text><text x="44" y="475.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">proofread</text><rect x="260" y="427" width="610" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="453.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Missing words, comma splices, homophones: their/there,</text><text x="274" y="475.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">affect/effect</text><rect x="30" y="100" width="840" height="397" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="519" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="552.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Accuracy matters more than variety.</text><text x="450" y="581.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Use a range of punctuation, but only where you can use it correctly.</text>
</svg>