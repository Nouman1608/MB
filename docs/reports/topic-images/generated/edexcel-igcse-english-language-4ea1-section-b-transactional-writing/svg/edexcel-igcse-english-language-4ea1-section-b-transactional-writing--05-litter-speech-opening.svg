<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 541" width="900" height="541" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="541" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Annotated opening: a litter-picking speech</text>

<rect x="30" y="100" width="420" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="137.1" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Good morning, everyone. Look at your</text><text x="44" y="159.1" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">shoes.”</text><rect x="480" y="100" width="390" height="87" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="494" y="126.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Audience and form: a greeting and a direct</text><text x="494" y="147.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">instruction create a spoken, inclusive</text><text x="494" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">voice (AO4)</text><line x1="450" y1="143.5" x2="480" y2="143.5" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="199" width="420" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="226.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“…each of us decided it was someone</text><text x="44" y="248.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">else’s problem. I did too.”</text><rect x="480" y="199" width="390" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="494" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Purpose: admitting shared guilt persuades</text><text x="494" y="247.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">without lecturing (AO4)</text><line x1="450" y1="233" x2="480" y2="233" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="279" width="420" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="306.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“This morning I want to ask for one hour</text><text x="44" y="328.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">a week from you, and I want to explain</text><text x="44" y="350.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">why…”</text><rect x="480" y="279" width="390" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="494" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Structure: signposts the argument and sets</text><text x="494" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a clear request (AO4)</text><line x1="450" y1="324" x2="480" y2="324" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="391" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="425" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">AO5: deliberate sentence variety</text><rect x="54" y="445" width="194" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="151" y="466.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">a short imperative</text><text x="58" y="497" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Look at your shoes.</text><rect x="310" y="445" width="267" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="443.5" y="466.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">a long cumulative sentence</text><text x="314" y="497" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Somewhere on the walk…</text><rect x="603" y="445" width="222" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="714" y="466.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">a three-word sentence</text><text x="607" y="497" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">I did too.</text>
</svg>