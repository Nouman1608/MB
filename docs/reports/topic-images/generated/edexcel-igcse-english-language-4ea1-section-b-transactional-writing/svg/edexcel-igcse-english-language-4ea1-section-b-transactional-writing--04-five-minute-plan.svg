<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 747" width="900" height="747" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="747" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning in five minutes</text>

<rect x="30" y="100" width="185" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="122.5" y="121.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Purpose: persuade</text><rect x="227" y="100" width="267" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="360.5" y="121.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Audience: Year 10 students</text><rect x="506" y="100" width="139" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="575.5" y="121.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Form: speech</text><line x1="62" y1="170" x2="62" y2="596" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="150" width="642" height="71" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="176.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Opening</text><text x="120" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A striking scene or question that connects with the audience</text><circle cx="62" cy="185.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="194.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">O</text><rect x="108" y="229" width="642" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="255.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Point 1</text><text x="120" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The main reason, with an example from school life</text><circle cx="62" cy="264.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="273.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="308" width="642" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="334.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Point 2</text><text x="120" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A second reason, with a contrast (before / after)</text><circle cx="62" cy="343.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="352.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="387" width="642" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="413.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Counter</text><text x="120" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Acknowledge the objection, then answer it</text><circle cx="62" cy="422.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="431.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><rect x="108" y="466" width="642" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="492.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Point 3</text><text x="120" y="520.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What the audience can do</text><circle cx="62" cy="501.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="510.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="545" width="642" height="71" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="571.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Close</text><text x="120" y="599.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Return to the opening image; a short, direct final line</text><circle cx="62" cy="580.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="589.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">E</text><path d="M752,586 C830,586 830,180 756,180" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="860" y="389" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">echo</text><rect x="30" y="632" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="665.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plan the ending before you begin.</text><text x="48" y="694.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Running out of time without a conclusion loses AO4 marks for structure and purpose.</text>
</svg>