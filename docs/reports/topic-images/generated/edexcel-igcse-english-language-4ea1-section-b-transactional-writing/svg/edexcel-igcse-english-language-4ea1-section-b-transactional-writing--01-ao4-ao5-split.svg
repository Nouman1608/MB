<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" width="900" height="465" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="465" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section B: 45 marks for one task</text>

<rect x="70" y="100" width="456" height="70" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="298" y="132" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4: 27 marks</text><text x="298" y="156" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">form, tone and register for purpose and audience</text><rect x="526" y="100" width="304" height="70" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="678" y="132" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO5: 18 marks</text><text x="678" y="156" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">vocabulary, sentences, accuracy</text><rect x="30" y="192" width="411" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="225" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHOICE</text><text x="50" y="252" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">One task from two prompts</text><text x="50" y="281.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Each gives an audience, form or purpose</text><rect x="459" y="192" width="411" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="225" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TIME</text><text x="479" y="252" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">About 45 minutes</text><text x="479" y="281.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">After about 1 hour 30 minutes on Section</text><text x="479" y="303.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A, in a 2 hour 15 minute paper</text><rect x="30" y="350" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="383.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4 carries more marks, but AO5 is judged on every sentence.</text><text x="450" y="412.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">A strong idea expressed carelessly still loses marks.</text>
</svg>