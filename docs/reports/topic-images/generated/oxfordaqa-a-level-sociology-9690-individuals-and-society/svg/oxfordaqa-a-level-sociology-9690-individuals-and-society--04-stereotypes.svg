<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="456" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How stereotypes do harm</text>

<rect x="30" y="110" width="184.5" height="151" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="122.25" y="154.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Stereotype</text><text x="122.25" y="184.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">"pictures in our</text><text x="122.25" y="205.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">heads" (Lippmann,</text><text x="122.25" y="226.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">1922)</text><line x1="218.5" y1="185.5" x2="244.5" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="110" width="184.5" height="151" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="340.75" y="175.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Prejudice</text><text x="340.75" y="205.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">attitudes</text><line x1="437" y1="185.5" x2="463" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="110" width="184.5" height="151" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="559.25" y="175.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Discrimination</text><text x="559.25" y="205.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">actions</text><line x1="655.5" y1="185.5" x2="681.5" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="110" width="184.5" height="151" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="777.75" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-fulfilling</text><text x="777.75" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">prophecy</text><text x="777.75" y="196.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">if internalised or</text><text x="777.75" y="217.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">acted on by</text><text x="777.75" y="238.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">institutions</text><rect x="30" y="281" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="317" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why stereotypes persist</text><circle cx="61" cy="340.39" r="4.5" fill="#8a6d0d"/><text x="74" y="346" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">They simplify a complex social world</text><circle cx="61" cy="370.39" r="4.5" fill="#8a6d0d"/><text x="74" y="376" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">They are reproduced by agencies of socialisation, especially the media</text><circle cx="61" cy="400.39" r="4.5" fill="#8a6d0d"/><text x="74" y="406" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Links: identity (3.1.2.3) and othering (3.1.2.4)</text>
</svg>