<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ethnic subcultures in multicultural societies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">differ from the mainstream in some ways, share others</text>
<rect x="30" y="110" width="412" height="213" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124.25 Q31.25,111.25 44.25,111.25 L427.75,111.25 Q440.75,111.25 440.75,124.25 L440.75,160 Z" fill="#f2e7b8"/><line x1="31.25" y1="160" x2="440.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Examples</text><circle cx="49" cy="185.92" r="4.5" fill="#2e6b62"/><text x="62" y="191.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Singapore:</tspan> policy around Chinese, Malay,</text><text x="62" y="212.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Indian and "Other" categories</text><circle cx="49" cy="235.92" r="4.5" fill="#2e6b62"/><text x="62" y="241.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Canada:</tspan> official multiculturalism policy,</text><text x="62" y="262.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1971</text><rect x="458" y="110" width="412" height="213" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,160 L459.25,124.25 Q459.25,111.25 472.25,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,160 Z" fill="#f2e7b8"/><line x1="459.25" y1="160" x2="868.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Maintained through</text><circle cx="477" cy="185.92" r="4.5" fill="#2e6b62"/><text x="490" y="191.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family socialisation</text><circle cx="477" cy="214.92" r="4.5" fill="#2e6b62"/><text x="490" y="220.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Religious institutions and community</text><text x="490" y="241.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">organisations</text><circle cx="477" cy="264.92" r="4.5" fill="#2e6b62"/><text x="490" y="270.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Media in community languages</text><circle cx="477" cy="293.92" r="4.5" fill="#2e6b62"/><text x="490" y="299.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sometimes separate schools</text><rect x="30" y="341" width="269.3333333333333" height="209" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,411 L31.25,355.25 Q31.25,342.25 44.25,342.25 L285.0833333333333,342.25 Q298.0833333333333,342.25 298.0833333333333,355.25 L298.0833333333333,411 Z" fill="#b5d3cf"/><line x1="31.25" y1="411" x2="298.0833333333333" y2="411" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="369.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Integration vs</text><text x="164.66666666666666" y="393.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">distinctiveness</text><text x="44" y="442.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Functionalists: strong</text><text x="44" y="463.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">subcultures could weaken</text><text x="44" y="484.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shared values.</text><text x="44" y="505.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Multiculturalists: diversity</text><text x="44" y="526.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and civic values coexist.</text><rect x="315.3333333333333" y="341" width="269.3333333333333" height="209" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,411 L316.5833333333333,355.25 Q316.5833333333333,342.25 329.5833333333333,342.25 L570.4166666666666,342.25 Q583.4166666666666,342.25 583.4166666666666,355.25 L583.4166666666666,411 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="411" x2="583.4166666666666" y2="411" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="381.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Change</text><text x="329.3333333333333" y="442.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Second and third generations</text><text x="329.3333333333333" y="463.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">blend cultures into hybrid</text><text x="329.3333333333333" y="484.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identities.</text><rect x="600.6666666666666" y="341" width="269.3333333333333" height="209" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,411 L601.9166666666666,355.25 Q601.9166666666666,342.25 614.9166666666666,342.25 L855.75,342.25 Q868.75,342.25 868.75,355.25 L868.75,411 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="411" x2="868.75" y2="411" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="381.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Power</text><text x="614.6666666666666" y="442.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A dominant group defines</text><text x="614.6666666666666" y="463.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"mainstream", so minorities</text><text x="614.6666666666666" y="484.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may be marginalised.</text>
</svg>