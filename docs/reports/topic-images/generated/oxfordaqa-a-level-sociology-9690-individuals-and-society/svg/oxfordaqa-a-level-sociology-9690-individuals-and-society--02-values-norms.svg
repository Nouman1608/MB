<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From values to norms to laws</text>

<rect x="30" y="110" width="390" height="108" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Value</text><text x="225" y="172.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">general belief about what is good, e.g.</text><text x="225" y="194.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">respect for elders</text><line x1="424" y1="164" x2="476" y2="164" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="110" width="390" height="108" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Norm</text><text x="675" y="172.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">specific rule that puts it into practice,</text><text x="675" y="194.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. standing when an older person enters</text><text x="30" y="264" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sumner (1906): how strongly norms are enforced</text><rect x="30" y="326" width="270" height="124" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="362" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Folkways</text><text x="165" y="388" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">everyday conventions</text><text x="165" y="418" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">breach brings mild</text><text x="165" y="440" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">disapproval</text><rect x="315" y="304" width="270" height="146" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="340" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Mores</text><text x="450" y="366" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">strong moral weight</text><text x="450" y="396" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">breach brings outrage</text><rect x="600" y="282" width="270" height="168" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="318" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Laws</text><text x="735" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">some mores become laws</text><text x="735" y="374" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">formal sanctions</text><line x1="60" y1="476" x2="840" y2="476" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="504" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">stronger sanctions</text>
</svg>