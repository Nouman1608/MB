<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 547" width="900" height="547" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Status and role</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">status = social position; role = behaviour expected in it</text>
<rect x="188" y="120" width="337" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="356.5" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ascribed status</text><rect x="533" y="120" width="337" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="701.5" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Achieved status</text><rect x="30" y="172" width="150" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="214.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Meaning</text><rect x="188" y="172" width="337" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="203.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fixed at birth or beyond the</text><text x="202" y="225.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">individual’s control</text><rect x="533" y="172" width="337" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="203.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Earned through effort or merit</text><rect x="30" y="254" width="150" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="285.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Examples</text><rect x="188" y="254" width="337" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="285.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sex, caste, royal birth, age</text><rect x="533" y="254" width="337" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="285.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A qualification or job title</text><rect x="30" y="322" width="840" height="201" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="358" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Linton (1936) and key terms</text><circle cx="61" cy="381.39" r="4.5" fill="#8a6d0d"/><text x="74" y="387" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Industrialisation said to shift societies towards achieved status, though class,</text><text x="74" y="409" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">gender and ethnicity still shape what people achieve</text><circle cx="61" cy="433.39" r="4.5" fill="#8a6d0d"/><text x="74" y="439" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Role conflict:</tspan> incompatible demands from two roles (employee and carer)</text><circle cx="61" cy="463.39" r="4.5" fill="#8a6d0d"/><text x="74" y="469" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Role strain:</tspan> pressure within one role</text><circle cx="61" cy="493.39" r="4.5" fill="#8a6d0d"/><text x="74" y="499" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Master status:</tspan> dominates how others see a person; links to stigma</text>
</svg>