<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What is culture?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">the learned, shared way of life of a group</text>
<rect x="30" y="110" width="412" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124.25 Q31.25,111.25 44.25,111.25 L427.75,111.25 Q440.75,111.25 440.75,124.25 L440.75,160 Z" fill="#f2e7b8"/><line x1="31.25" y1="160" x2="440.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Material culture</text><text x="44" y="192.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tools, buildings, clothing, technology</text><rect x="458" y="110" width="412" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,160 L459.25,124.25 Q459.25,111.25 472.25,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,160 Z" fill="#b5d3cf"/><line x1="459.25" y1="160" x2="868.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-material culture</text><text x="472" y="192.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Values, norms, symbols, language</text><rect x="30" y="232" width="269.3333333333333" height="148" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="164.66666666666666" y="264.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Learned</text><text x="164.66666666666666" y="294.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">not inherited: children in</text><text x="164.66666666666666" y="315.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">different societies acquire</text><text x="164.66666666666666" y="336.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">different languages, diets</text><text x="164.66666666666666" y="357.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and manners</text><rect x="315.3333333333333" y="232" width="269.3333333333333" height="148" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="274.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shared</text><text x="450" y="304.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">makes social life</text><text x="450" y="325.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">predictable, though never</text><text x="450" y="346.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">totally</text><rect x="600.6666666666666" y="232" width="269.3333333333333" height="148" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="735.3333333333333" y="274.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Varies</text><text x="735.3333333333333" y="304.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">between societies and over</text><text x="735.3333333333333" y="325.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">time: ethnocentrism vs</text><text x="735.3333333333333" y="346.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">cultural relativism</text><rect x="30" y="396" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,446 L31.25,410.25 Q31.25,397.25 44.25,397.25 L285.0833333333333,397.25 Q298.0833333333333,397.25 298.0833333333333,410.25 L298.0833333333333,446 Z" fill="#f2e7b8"/><line x1="31.25" y1="446" x2="298.0833333333333" y2="446" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="426.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist</text><text x="44" y="477.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shared values, a collective</text><text x="44" y="498.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conscience (Durkheim), bind</text><text x="44" y="519.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">society.</text><rect x="315.3333333333333" y="396" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,446 L316.5833333333333,410.25 Q316.5833333333333,397.25 329.5833333333333,397.25 L570.4166666666666,397.25 Q583.4166666666666,397.25 583.4166666666666,410.25 L583.4166666666666,446 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="446" x2="583.4166666666666" y2="446" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="426.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><text x="329.3333333333333" y="477.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dominant culture reflects</text><text x="329.3333333333333" y="498.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ruling-class ideas and</text><text x="329.3333333333333" y="519.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serves the powerful.</text><rect x="600.6666666666666" y="396" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,446 L601.9166666666666,410.25 Q601.9166666666666,397.25 614.9166666666666,397.25 L855.75,397.25 Q868.75,397.25 868.75,410.25 L868.75,446 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="446" x2="868.75" y2="446" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="426.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactionist</text><text x="614.6666666666666" y="477.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Culture is continually</text><text x="614.6666666666666" y="498.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">negotiated in everyday</text><text x="614.6666666666666" y="519.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interaction.</text>
</svg>