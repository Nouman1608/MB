<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mills: troubles and issues</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">linking biography and history (The Sociological Imagination, 1959)</text>
<rect x="188" y="120" width="337" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="356.5" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal trouble</text><rect x="533" y="120" width="337" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="701.5" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Public issue</text><rect x="30" y="172" width="150" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="214.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Located in</text><rect x="188" y="172" width="337" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="203.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An individual’s character and</text><text x="202" y="225.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">immediate relationships</text><rect x="533" y="172" width="337" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="203.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The institutions of a society as a</text><text x="547" y="225.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">whole</text><rect x="30" y="254" width="150" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="307.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Unemployment</text><rect x="188" y="254" width="337" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="285.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One person in a city is</text><text x="202" y="307.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unemployed: look at their skills</text><text x="202" y="329.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or character</text><rect x="533" y="254" width="337" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="285.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A large share of the workforce is</text><text x="547" y="307.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unemployed: rooted in the economy</text><rect x="30" y="358" width="150" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="411.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Today</text><rect x="188" y="358" width="337" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="389.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A graduate blames themselves; a</text><text x="202" y="411.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">family struggles to care for an</text><text x="202" y="433.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">older relative</text><rect x="533" y="358" width="337" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="389.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Graduate underemployment reflects</text><text x="547" y="411.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">labour markets; ageing populations</text><text x="547" y="433.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and social policy</text><rect x="30" y="470" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="506" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="529.39" r="4.5" fill="#8a6d0d"/><text x="74" y="535" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pushes sociology towards public relevance (Burawoy’s public sociology)</text><circle cx="61" cy="559.39" r="4.5" fill="#8a6d0d"/><text x="74" y="565" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A way of thinking rather than a testable theory</text><circle cx="61" cy="589.39" r="4.5" fill="#8a6d0d"/><text x="74" y="595" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Interactionists: individuals also shape structures through their choices</text>
</svg>