<line x1="70" y1="330" x2="830" y2="330" stroke="#1e2a44" stroke-width="3"/><rect x="70" y="320" width="431.68" height="20" fill="#c9d6d4"/><text x="76" y="128" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">London Street Tramways v LCC</tspan> [1898]: the Lords</text><text x="76" y="148" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">bound by their own decisions</text><path d="M88.24,150 L88.24,318" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="501.68" cy="330" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="501.68" y="374" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1966</text><text x="351.68" y="400" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Lord Gardiner LC: normally binding, but</text><text x="351.68" y="420" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">depart "when it appears right to do so"</text><circle cx="769.2" cy="330" r="10" fill="#1e2a44"/><text x="769.2" y="374" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2010</text><text x="649.2" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Austin v Southwark LBC</tspan>:</text><text x="649.2" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the power applies to the</text><text x="649.2" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Supreme Court</text><circle cx="513.8399999999999" cy="330" r="8" fill="#2e6b62"/><path d="M513.8399999999999,322 L513.8399999999999,176" fill="none" stroke="#2e6b62" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="519.8399999999999" y="168" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start"><tspan font-style="italic">Conway v Rimmer</tspan> 1968</text><circle cx="538.1600000000001" cy="330" r="8" fill="#2e6b62"/><path d="M538.1600000000001,322 L538.1600000000001,200" fill="none" stroke="#2e6b62" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="544.1600000000001" y="192" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start"><tspan font-style="italic">Herrington</tspan> 1972</text><circle cx="562.48" cy="330" r="8" fill="#2e6b62"/><path d="M562.48,322 L562.48,224" fill="none" stroke="#2e6b62" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="568.48" y="216" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start"><tspan font-style="italic">Miliangos</tspan> 1976</text><circle cx="623.28" cy="330" r="8" fill="#2e6b62"/><path d="M623.28,322 L623.28,248" fill="none" stroke="#2e6b62" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="629.28" y="240" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start"><tspan font-style="italic">R v Shivpuri</tspan> 1986</text><circle cx="665.84" cy="330" r="8" fill="#2e6b62"/><path d="M665.84,322 L665.84,272" fill="none" stroke="#2e6b62" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="671.84" y="264" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start"><tspan font-style="italic">Pepper v Hart</tspan> 1993</text><circle cx="726.64" cy="330" r="8" fill="#2e6b62"/><path d="M726.64,322 L726.64,296" fill="none" stroke="#2e6b62" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="732.64" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start"><tspan font-style="italic">R v G</tspan> 2003</text><circle cx="538.1600000000001" cy="330" r="7" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><circle cx="550.24" cy="330" r="7" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><path d="M538.1600000000001,340 L538.1600000000001,360 L434.8,360" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="430.8" y="366" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">refused: <tspan font-style="italic">Jones</tspan> 1972, <tspan font-style="italic">Knuller</tspan> 1973</text><rect x="30" y="470" width="840" height="42" rx="10" fill="#1e2a44"/><text x="46" y="498" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Case</text><text x="400" y="498" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Overruled</text><text x="620" y="498" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Point</text><rect x="30" y="512" width="840" height="48" fill="#f8faf9" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="542" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Conway v Rimmer</tspan> [1968]</text><text x="400" y="542" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Duncan v Cammell Laird</tspan></text><text x="620" y="533" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">first major use: Crown privilege</text><text x="620" y="551" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(technical)</text><rect x="30" y="560" width="840" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="590" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">British Railways Board v Herrington</tspan> [1972]</text><text x="400" y="590" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Addie v Dumbreck</tspan></text><text x="620" y="581" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">duty of common humanity to</text><text x="620" y="599" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">child trespassers</text><rect x="30" y="608" width="840" height="48" fill="#f8faf9" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="638" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Miliangos v George Frank</tspan> [1976]</text><text x="400" y="638" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Re United Railways of Havana</tspan></text><text x="620" y="638" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">judgments in foreign currency</text><rect x="30" y="656" width="840" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="686" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v Shivpuri</tspan> [1986]</text><text x="400" y="686" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Anderton v Ryan</tspan></text><text x="620" y="677" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">first criminal use: attempting the</text><text x="620" y="695" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">impossible</text><rect x="30" y="704" width="840" height="48" fill="#f8faf9" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="734" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Pepper v Hart</tspan> [1993]</text><text x="400" y="734" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Davis v Johnson</tspan> on this point</text><text x="620" y="734" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">courts may consult <tspan font-style="italic">Hansard</tspan></text><rect x="30" y="752" width="840" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="782" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v G</tspan> [2003]</text><text x="400" y="782" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">MPC v Caldwell</tspan></text><text x="620" y="782" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">recklessness is subjective</text><text x="450" y="826" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Used sparingly: flexibility weighed against certainty.</text>
</svg>