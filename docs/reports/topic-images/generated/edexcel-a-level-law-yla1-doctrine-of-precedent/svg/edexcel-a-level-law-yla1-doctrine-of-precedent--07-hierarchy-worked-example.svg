<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 599" width="900" height="599" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="599" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: applying the hierarchy</text>

<rect x="30" y="110" width="411" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CASE A, 2015</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Court of Appeal (Civil Division)</text><rect x="459" y="110" width="411" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CASE B, 2024</text><text x="479" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Supreme Court: a conflicting principle</text><text x="450" y="166" font-size="30" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text><text x="450" y="246" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">In 2026 the same issue reaches…</text><rect x="30" y="266" width="176" height="86" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="118" y="315" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">High Court</text><rect x="220" y="266" width="470" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bound by both courts above; where they conflict, it must</text><text x="240" y="323.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">follow the higher court.</text><rect x="704" y="266" width="166" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="787" y="316" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Follows B</text><rect x="30" y="366" width="176" height="99" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="118" y="421.5" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Court of Appeal</text><rect x="220" y="366" width="470" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Normally bound by its own case A, but <tspan font-style="italic">Young v Bristol</tspan></text><text x="240" y="419.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Aeroplane</tspan> exception 2: a decision inconsistent with a</text><text x="240" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">later Supreme Court ruling must not be followed.</text><rect x="704" y="366" width="166" height="99" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="787" y="422.5" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Follows B</text><rect x="30" y="479" width="176" height="86" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="118" y="528" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Supreme Court</text><rect x="220" y="479" width="470" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Could depart from case B under the Practice Statement,</text><text x="240" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">but only "when it appears right to do so".</text><rect x="704" y="479" width="166" height="86" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="787" y="529" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">May depart</text>
</svg>