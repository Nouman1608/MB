<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The process of appeal</text>

<rect x="30" y="110" width="411" height="600" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="146" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Civil</text><rect x="105" y="640" width="260" height="56" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="674" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Supreme Court</text><rect x="85" y="480" width="300" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="514" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Court of Appeal (Civil Division)</text><rect x="65" y="300" width="170" height="56" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">High Court</text><rect x="245" y="180" width="170" height="56" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="214" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">County Court</text><line x1="330" y1="238" x2="330" y2="474" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="338" y="366" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">depending on</text><text x="338" y="386" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">case and judge</text><path d="M300,238 L190,294" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><line x1="150" y1="358" x2="190" y2="474" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="100" y="420" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">permission</text><line x1="235" y1="538" x2="235" y2="634" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="245" y="592" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">permission</text><path d="M66,328 L46,328 L46,668 L100,668" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)" stroke-dasharray="8 6"/><text x="56" y="700" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">leapfrog: point of law of public importance</text><rect x="459" y="110" width="411" height="600" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="664" y="146" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Criminal</text><rect x="534" y="640" width="260" height="56" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="664" y="674" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Supreme Court</text><rect x="475" y="480" width="190" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="570" y="507.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Court of Appeal</text><text x="570" y="528.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(Criminal Division)</text><rect x="685" y="480" width="170" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="770" y="507.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Divisional Court</text><text x="770" y="528.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(KBD)</text><rect x="485" y="330" width="170" height="56" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="570" y="364" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Crown Court</text><rect x="554" y="180" width="220" height="56" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="664" y="214" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Magistrates’ court</text><line x1="620" y1="238" x2="580" y2="324" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="512" y="284" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">conviction</text><text x="512" y="302" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">or sentence</text><line x1="710" y1="238" x2="770" y2="474" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="752" y="330" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">case</text><text x="752" y="348" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">stated</text><line x1="570" y1="388" x2="570" y2="474" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="580" y="434" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">leave</text><line x1="570" y1="546" x2="620" y2="634" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="770" y1="546" x2="710" y2="634" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="664" y="600" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">point of law of general public importance, certified,</text><text x="664" y="620" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">with leave</text><rect x="30" y="730" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="768" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Only appellate courts create binding precedent; an appeal can reverse the decision in that case.</text>
</svg>