<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 589" width="900" height="589" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="589" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When the Court of Appeal can escape its own decisions</text>

<rect x="30" y="110" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start"><tspan font-style="italic">YOUNG V BRISTOL AEROPLANE CO</tspan> [1944]</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Court of Appeal is bound by its own previous decisions, except:</text><circle cx="164" cy="222" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="164" y="229.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="30" y="246" width="268" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="280.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two conflicting decisions</text><text x="50" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it may choose which to follow</text><circle cx="450" cy="222" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="229.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="316" y="246" width="268" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="280.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conflict with a later</text><text x="336" y="304.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">House of Lords or</text><text x="336" y="328.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Supreme Court decision</text><text x="336" y="356.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it must follow the higher court</text><circle cx="736" cy="222" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="736" y="229.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="602" y="246" width="268" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="280.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Per incuriam</tspan></text><text x="622" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">made through carelessness</text><text x="622" y="329.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or ignorance of a relevant</text><text x="622" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">statute or binding authority</text><rect x="30" y="405" width="411" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="438" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRIMINAL DIVISION</text><text x="50" y="464.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More flexible: liberty is at stake</text><text x="50" y="492.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may depart where the law was misapplied or</text><text x="50" y="513.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">misunderstood: <tspan font-style="italic">R v Taylor</tspan> [1950], <tspan font-style="italic">R v Gould</tspan></text><text x="50" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">[1968], <tspan font-style="italic">R v Spencer</tspan> [1985]</text><rect x="459" y="405" width="411" height="154" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="438" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LORD DENNING’S CHALLENGE</text><text x="479" y="464.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rejected</text><text x="479" y="492.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tried to free the Court of Appeal, notably in <tspan font-style="italic">Davis</tspan></text><text x="479" y="513.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">v Johnson</tspan> [1979]; the House of Lords reaffirmed</text><text x="479" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it is bound</text>
</svg>