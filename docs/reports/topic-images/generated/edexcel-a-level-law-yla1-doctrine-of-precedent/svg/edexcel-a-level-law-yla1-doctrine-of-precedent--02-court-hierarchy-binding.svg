<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 752" width="900" height="752" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="752" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The court hierarchy: who binds whom</text>

<text x="220" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">COURT</text><text x="560" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">BINDS</text><text x="780" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">BOUND BY ITSELF?</text><rect x="30" y="148" width="400" height="78" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="194" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Supreme Court</text><rect x="450" y="148" width="220" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="466" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">binds all courts below</text><rect x="684" y="148" width="186" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="698" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">normally, but may</text><text x="698" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">depart: Practice</text><text x="698" y="220" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Statement</text><line x1="230" y1="228" x2="230" y2="242" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="44" y="244" width="372" height="78" rx="12" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="276" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Court of Appeal (Civil and Criminal)</text><rect x="450" y="244" width="220" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="466" y="276" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">binds all courts below</text><rect x="684" y="244" width="186" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="698" y="276" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">yes, subject to Young</text><text x="698" y="296" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">v Bristol Aeroplane</text><line x1="230" y1="324" x2="230" y2="338" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="58" y="340" width="344" height="78" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="372" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Divisional Courts of the High Court</text><rect x="450" y="340" width="220" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="466" y="372" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">bind the High Court and</text><text x="466" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">inferior courts</text><rect x="684" y="340" width="186" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="698" y="372" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">generally yes, similar</text><text x="698" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exceptions</text><line x1="230" y1="420" x2="230" y2="434" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="72" y="436" width="316" height="78" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="482" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">High Court</text><rect x="450" y="436" width="220" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="466" y="468" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">binds County Court and</text><text x="466" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">magistrates’ courts</text><rect x="684" y="436" width="186" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="698" y="468" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">no: judges persuade</text><text x="698" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">one another</text><line x1="230" y1="516" x2="230" y2="530" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="86" y="532" width="288" height="78" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="564" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Crown Court, County Court,</text><text x="230" y="586" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">magistrates’ courts</text><rect x="450" y="532" width="220" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="466" y="564" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">do not create binding</text><text x="466" y="584" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">precedent</text><rect x="684" y="532" width="186" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="698" y="564" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">no</text><rect x="30" y="634" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="672" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">European Court of Human Rights: not binding; s 2 Human Rights Act 1998 says take it into account.</text><text x="450" y="726" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">The Supreme Court replaced the House of Lords in 2009 (Constitutional Reform Act 2005).</text>
</svg>