<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Avoiding a precedent</text>

<rect x="30" y="110" width="268" height="470" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="148" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Distinguishing</text><rect x="60" y="180" width="92" height="54" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="213" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Earlier</text><rect x="176" y="180" width="92" height="54" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="222" y="213" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Now</text><text x="164" y="214" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text><text x="164" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">facts differ: not applied</text><text x="48" y="330" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Any court</text><text x="48" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Material facts differ, so the</text><text x="48" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">earlier ratio does not apply.</text><text x="48" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Balfour v Balfour</tspan> [1919] (living</text><text x="48" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">together) distinguished in</text><text x="48" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Merritt v Merritt</tspan> [1970]</text><text x="48" y="530" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(separated).</text><rect x="316" y="110" width="268" height="470" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="148" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Overruling</text><rect x="340" y="196" width="92" height="54" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="386" y="229" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Case X</text><rect x="468" y="196" width="92" height="54" rx="8" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="514" y="229" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Case Y</text><path d="M466,222 L436,222" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M348,204 l76,38 M424,204 l-76,38" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="284" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">later case, different parties</text><text x="334" y="330" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">A higher court, or the same</text><text x="334" y="350" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">court with a power to depart</text><text x="334" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The rule in an earlier,</text><text x="334" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">DIFFERENT case was wrong.</text><text x="334" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R v G</tspan> [2003] overruled <tspan font-style="italic">Caldwell</tspan></text><text x="334" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">[1982].</text><rect x="602" y="110" width="268" height="470" rx="14" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2.5"/><text x="736" y="148" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="middle">Reversing</text><rect x="632" y="240" width="92" height="54" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="678" y="273" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Trial</text><rect x="748" y="180" width="92" height="54" rx="8" fill="#ffffff" stroke="#2b5a9a" stroke-width="2.5"/><text x="794" y="213" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Appeal</text><path d="M724,256 C752,256 752,250 792,238" fill="none" stroke="#2b5a9a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="736" y="312" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="middle">same parties</text><text x="620" y="330" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">A higher court, on appeal</text><text x="620" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Changes the decision in the</text><text x="620" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">SAME case.</text><text x="620" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Overruling is a different, earlier</text><text x="620" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">case; reversing is the same</text><text x="620" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">case.</text>
</svg>