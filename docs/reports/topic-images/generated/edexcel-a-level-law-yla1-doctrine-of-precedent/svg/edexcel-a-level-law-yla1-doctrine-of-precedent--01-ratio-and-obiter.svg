<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 748" width="900" height="748" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="748" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ratio decidendi and obiter dicta</text>

<path d="M60,120 H330 L370,160 V470 H60 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="80" y="152" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A judgment</text><rect x="80" y="180" width="250" height="14" rx="5" fill="#dce9e7"/><rect x="80" y="210" width="230" height="14" rx="5" fill="#dce9e7"/><rect x="80" y="240" width="260" height="14" rx="5" fill="#dce9e7"/><rect x="80" y="270" width="240" height="14" rx="5" fill="#d4b02e"/><rect x="80" y="300" width="210" height="14" rx="5" fill="#d4b02e"/><rect x="80" y="330" width="250" height="14" rx="5" fill="#dce9e7"/><rect x="80" y="360" width="220" height="14" rx="5" fill="#dce9e7"/><rect x="80" y="390" width="260" height="14" rx="5" fill="#dce9e7"/><rect x="80" y="420" width="180" height="14" rx="5" fill="#dce9e7"/><text x="215" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">the ratio is not labelled</text><path d="M345,276 L420,226" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M345,350 L420,382" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="430" y="120" width="440" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="153" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RATIO DECIDENDI</text><text x="450" y="180.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The reason for the decision: BINDING</text><text x="450" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The legal principle the decision rests on, applied to</text><text x="450" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the material facts. Later judges identify it, so its</text><text x="450" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scope can be argued.</text><rect x="430" y="291" width="440" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OBITER DICTA</text><text x="450" y="351.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Things said by the way: PERSUASIVE</text><text x="450" y="379.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Comments on hypothetical facts, wider statements</text><text x="450" y="400.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of principle, dissenting judgments.</text><text x="450" y="494" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">OBITER CAN BECOME LAW</text><rect x="30" y="508" width="260" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="542.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v Howe</tspan> [1987]</text><text x="50" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Duress no defence to murder;</text><text x="50" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">obiter: nor to attempted</text><text x="50" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">murder</text><line x1="294" y1="571" x2="324" y2="571" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="330" y="508" width="240" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="542.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v Gotts</tspan> [1992]</text><text x="350" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">House of Lords followed</text><text x="350" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">that obiter statement</text><rect x="610" y="508" width="260" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="540.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Central London Property</tspan></text><text x="630" y="561.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Trust v High Trees House</tspan></text><text x="630" y="582.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">[1947]</text><text x="630" y="609" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Denning J’s obiter remarks</text><text x="630" y="629" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">founded promissory estoppel</text><rect x="30" y="654" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="692" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Also persuasive: lower courts, the Privy Council, other common law countries.</text>
</svg>