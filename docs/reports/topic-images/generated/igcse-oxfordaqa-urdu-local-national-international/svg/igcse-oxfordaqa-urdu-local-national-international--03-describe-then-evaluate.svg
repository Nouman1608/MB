<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Switching register in one answer</text>

<rect x="30" y="110" width="380" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="150" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Describe</text><text x="54" y="178" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a place, factually</text><text x="54" y="232" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Present tense</text><text x="54" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">what the place is like</text><text x="54" y="302" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Comparatives</text><text x="54" y="326" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">this town is quieter than the city</text><text x="54" y="372" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Past narrative</text><text x="54" y="396" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recounting a specific trip</text><rect x="490" y="110" width="380" height="400" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="514" y="150" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate</text><text x="514" y="178" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a problem, opinion-led</text><text x="514" y="232" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Impersonal constructions</text><text x="514" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">general social or global problems</text><text x="514" y="302" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Cause and effect</text><text x="514" y="326" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">as a result, this leads to</text><text x="514" y="372" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Conditionals</text><text x="514" y="396" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">if we recycled more, ... would improve</text><line x1="414" y1="310" x2="486" y2="310" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="552" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Practise moving from description to argument within a single piece of writing</text>
</svg>