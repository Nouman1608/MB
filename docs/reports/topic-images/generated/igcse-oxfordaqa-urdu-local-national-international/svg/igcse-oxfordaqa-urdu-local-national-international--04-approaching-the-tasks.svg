<rect x="30" y="110" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Reading on social and global issues: what is this part doing?</text><rect x="60" y="172" width="240" height="136" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="214" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Describing</text><text x="180" y="248" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">a problem</text><line x1="302" y1="240" x2="326" y2="240" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="330" y="172" width="240" height="136" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="214" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Proposing</text><text x="450" y="248" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">a solution</text><line x1="572" y1="240" x2="596" y2="240" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="172" width="240" height="136" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="720" y="214" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluating</text><text x="720" y="248" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">how well a</text><text x="720" y="272" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">solution worked</text><rect x="30" y="350" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="388" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Writing on travel: two time frames in one response</text><rect x="60" y="416" width="360" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="84" y="454" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Past-tense recount</text><text x="84" y="486" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">what you did</text><rect x="480" y="416" width="360" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="504" y="454" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Present-tense evaluation</text><text x="504" y="486" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">what you think of it now</text><line x1="424" y1="491" x2="476" y2="491" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="84" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">avoid a pure narrative with no comment</text><text x="504" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shows opinion-giving language</text>
