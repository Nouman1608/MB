<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Global ecological issues: who pays?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568"><tspan fill="#2e6b62" font-weight="700">Profits flow up</tspan>; <tspan fill="#b5602e" font-weight="700">costs flow down</tspan></text>
<rect x="30" y="130" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="169.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Richer, industrialised societies</text><rect x="30" y="510" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="549.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Poorer societies</text><line x1="120" y1="502" x2="120" y2="208" stroke="#2e6b62" stroke-width="7" marker-end="url(#ahT)"/><rect x="55" y="300" width="130" height="110" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="120" y="328" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Profits to</text><text x="120" y="349" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">shareholders</text><text x="120" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">from TNC</text><text x="120" y="394" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">production</text><line x1="270" y1="502" x2="270" y2="208" stroke="#2e6b62" stroke-width="7" marker-end="url(#ahT)"/><rect x="205" y="300" width="130" height="110" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="270" y="328" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Products</text><text x="270" y="349" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">consumed</text><text x="270" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">from mining</text><text x="270" y="394" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and oil</text><line x1="415" y1="208" x2="415" y2="502" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><rect x="356" y="260" width="118" height="190" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="415" y="288" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Factory</text><text x="415" y="309" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">disasters</text><text x="415" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Bhopal 1984;</text><text x="415" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Rana Plaza</text><text x="415" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2013</text><line x1="545" y1="208" x2="545" y2="502" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><rect x="486" y="260" width="118" height="190" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="545" y="288" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Climate</text><text x="545" y="309" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">effects</text><text x="545" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">drought,</text><text x="545" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">floods,</text><text x="545" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rising seas;</text><text x="545" y="398" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fewer</text><text x="545" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">resources to</text><text x="545" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">adapt</text><line x1="675" y1="208" x2="675" y2="502" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><rect x="616" y="260" width="118" height="190" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="675" y="288" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Hazardous</text><text x="675" y="309" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">waste</text><text x="675" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e-waste</text><text x="675" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">dismantled by</text><text x="675" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">hand</text><line x1="805" y1="208" x2="805" y2="502" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><rect x="746" y="260" width="118" height="190" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="805" y="288" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Polluted</text><text x="805" y="309" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">land and</text><text x="805" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">water</text><text x="805" y="359" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">from mining</text><text x="805" y="379" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and oil</text><rect x="30" y="600" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="633.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Greenhouse gases came historically mostly from industrialised countries, yet climate change</text><text x="50" y="655.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">often hits poorer societies hardest. Low-lying states such as Tuvalu and the Maldives face</text><text x="50" y="677.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">threats to their very territory.</text>
</svg>