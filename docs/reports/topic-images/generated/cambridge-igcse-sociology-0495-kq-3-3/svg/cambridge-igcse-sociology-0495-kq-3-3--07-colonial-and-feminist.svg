<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Colonial and feminist explanations</text>

<rect x="30" y="104" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">COLONIALISM</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Berlin Conference, 1884–85: European states set rules for dividing Africa</text><rect x="30" y="207" width="201" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130.5" y="250.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Extracted minerals</text><text x="130.5" y="271.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and crops</text><rect x="243" y="207" width="201" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.5" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Transport built to</text><text x="343.5" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">ports, not between</text><text x="343.5" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">regions</text><rect x="456" y="207" width="201" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.5" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Borders ignored</text><text x="556.5" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">existing</text><text x="556.5" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">communities</text><rect x="669" y="207" width="201" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="769.5" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Education limited</text><rect x="30" y="324" width="840" height="88" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="359.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Result: dependence on a narrow range of raw-material exports</text><text x="50" y="387.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Neo-colonialism: continued economic control through trade and debt after independence</text><text x="450" y="450" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Feminist ideas of patriarchy: global inequality is gendered</text><rect x="30" y="476" width="201" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="510.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Assembly lines</text><text x="50" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Young women paid</text><text x="50" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">less, assumed</text><text x="50" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">docile</text><rect x="243" y="476" width="201" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="263" y="510.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Migration</text><text x="263" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Women as domestic</text><text x="263" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">workers and carers</text><rect x="456" y="476" width="201" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="510.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Environment</text><text x="476" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Drought adds to</text><text x="476" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unpaid water and</text><text x="476" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fuel work</text><rect x="669" y="476" width="201" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="689" y="510.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Ownership</text><text x="689" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Limited access to</text><text x="689" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">land, credit,</text><text x="689" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">property</text>
</svg>