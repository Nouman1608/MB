<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Push, pull and obstacles</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Everett Lee’s theory of migration (1966)</text>
<rect x="30" y="130" width="260" height="136" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="163" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ORIGIN</text><text x="50" y="190.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Push factors</text><text x="50" y="220.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Conditions that drive</text><text x="50" y="241.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people out</text><rect x="320" y="130" width="260" height="164" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="340" y="163" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">IN BETWEEN</text><text x="340" y="190.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Intervening</text><text x="340" y="218.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">obstacles</text><text x="340" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cost, distance, border</text><text x="340" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">controls</text><rect x="610" y="130" width="260" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="630" y="163" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DESTINATION</text><text x="630" y="190.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Pull factors</text><text x="630" y="220.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Attractions elsewhere</text><path d="M180,298 C300,352 600,352 720,298" fill="none" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="366" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">migration</text><text x="450" y="410" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">How globalisation affects each</text><rect x="30" y="426" width="260" height="141" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="458.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Global economic change can</text><text x="50" y="479.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">create push factors, e.g.</text><text x="50" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">local industries close</text><text x="50" y="521.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">when cheaper imports</text><text x="50" y="542.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">arrive</text><rect x="320" y="426" width="260" height="141" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="458.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheaper travel and</text><text x="340" y="479.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">communication lower</text><text x="340" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">obstacles</text><rect x="610" y="426" width="260" height="141" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="630" y="458.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Global media make</text><text x="630" y="479.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">opportunities elsewhere</text><text x="630" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">visible</text>
</svg>