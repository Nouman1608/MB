<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 681" width="900" height="681" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="681" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Marxist views of global inequality</text>

<rect x="30" y="110" width="440" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="250" cy="340" r="190" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><circle cx="250" cy="340" r="125" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="250" cy="340" r="62" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="250" y="347" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Core</text><text x="250" y="254" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Semi-periphery</text><text x="250" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Periphery</text><line x1="100" y1="440" x2="198" y2="374" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="400" y1="440" x2="302" y2="374" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="250" y="505" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">surplus flows to the core</text><text x="250" y="144" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Wallerstein: world-systems theory</text><rect x="490" y="110" width="380" height="88" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="510" y="145.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Core</text><text x="510" y="173.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rich industrial states</text><rect x="490" y="208" width="380" height="88" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="510" y="243.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Semi-periphery</text><text x="510" y="271.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In between</text><rect x="490" y="306" width="380" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="510" y="341.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Periphery</text><text x="510" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Supplies raw materials and cheap labour</text><rect x="490" y="404" width="380" height="151" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="510" y="439.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Frank: dependency theory</text><text x="510" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rich “metropolis” countries developed by</text><text x="510" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">draining surplus from poor “satellites”:</text><text x="510" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">underdevelopment is caused by the global</text><text x="510" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">system</text><rect x="30" y="573" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="606.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Today Marxists point to TNC profits returning to shareholders, unequal trade (raw materials</text><text x="50" y="628.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">earn little), and debt repayments to rich lenders.</text>
</svg>