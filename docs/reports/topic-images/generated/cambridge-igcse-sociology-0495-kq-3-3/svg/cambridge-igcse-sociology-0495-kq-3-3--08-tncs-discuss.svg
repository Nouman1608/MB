<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 657" width="900" height="657" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="657" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Do TNCs reduce or increase global inequality?</text>

<line x1="215" y1="154" x2="685" y2="154" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,154 L420,246 L480,246 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="154" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="154" x2="160" y2="209" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="154" x2="270" y2="209" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,209 L290,209 Q275,236 215,236 Q155,236 140,209 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="154" x2="630" y2="209" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="154" x2="740" y2="209" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,209 L760,209 Q745,236 685,236 Q625,236 610,209 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="258" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">REDUCE</text><text x="685" y="258" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">INCREASE</text><rect x="30" y="282" width="405" height="215" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="318" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Reduce inequality</text><text x="50" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Investment and jobs in poorer countries</text><text x="50" y="374.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="374.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Technology transfer; taxes</text><text x="50" y="401.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="401.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Factory work may pay more than farm</text><text x="66.15" y="423.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">labour</text><text x="50" y="450.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="450.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Independent income for women</text><rect x="465" y="282" width="405" height="215" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="318" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Increase inequality</text><text x="485" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Locate where wages are lowest</text><text x="485" y="374.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="374.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Profits return to core shareholders</text><text x="501.15" y="396.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(dependency theory)</text><text x="485" y="423.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="423.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Costs fall on poorer societies: Bhopal,</text><text x="501.15" y="445.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Rana Plaza</text><text x="485" y="472.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="472.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Rely on young women’s low-paid labour</text><rect x="30" y="515" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="551" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="580.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Real opportunities, but on unequal terms: the effect depends on how strongly host</text><text x="50" y="602.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">governments regulate wages, safety and pollution.</text>
</svg>