<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 614" width="900" height="614" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="614" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How negative perceptions reinforce inequality</text>

<rect x="30" y="104" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="140" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Stereotyping and scapegoating</text><text x="450" y="169.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Migrants blamed for unemployment or housing shortages that have wider causes</text><line x1="450" y1="199" x2="450" y2="229" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="234" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Amplified</text><text x="450" y="299.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Media coverage spreads fear; political campaigns use migration as an issue</text><line x1="450" y1="329" x2="450" y2="359" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="364" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="400" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Discrimination</text><text x="450" y="429.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">In jobs and housing</text><line x1="450" y1="459" x2="450" y2="489" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="494" width="840" height="90" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="530" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Many migrants kept in low-paid work</text><text x="450" y="559.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Inequality inside the receiving society is reinforced</text>
</svg>