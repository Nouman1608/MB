<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Urbanisation and informal settlements</text>

<rect x="30" y="104" width="249.33333333333334" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="154.66666666666669" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">People move from</text><text x="154.66666666666669" y="164.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">the countryside for</text><text x="154.66666666666669" y="189.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">work</text><line x1="285.33333333333337" y1="171" x2="319.33333333333337" y2="171" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="104" width="249.33333333333334" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450.00000000000006" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Housing and</text><text x="450.00000000000006" y="164.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">infrastructure</text><text x="450.00000000000006" y="189.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">cannot keep up</text><line x1="580.6666666666667" y1="171" x2="614.6666666666667" y2="171" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="104" width="249.33333333333334" height="134" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="745.3333333333334" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal</text><text x="745.3333333333334" y="164.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">settlements grow</text><text x="745.3333333333334" y="192.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. Dharavi (Mumbai),</text><text x="745.3333333333334" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Kibera (Nairobi)</text><rect x="30" y="256" width="410" height="166" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="292" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Opportunities</text><text x="50" y="321.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="321.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Work</text><text x="50" y="348.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="348.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Higher incomes</text><rect x="460" y="256" width="410" height="166" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="292" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Problems</text><text x="480" y="321.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="321.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No secure tenure, clean water or</text><text x="496.15" y="343.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sanitation</text><text x="480" y="370.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="370.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Concentrated poverty</text><text x="480" y="397.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="397.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Exposure to pollution and flooding</text>
</svg>