<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 701" width="900" height="701" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="701" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Migration: who gains, who loses?</text>

<rect x="30" y="110" width="270" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165" y="146.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Sending society</text><rect x="30" y="184" width="270" height="165" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="217" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GAINS</text><text x="50" y="246.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Remittances: money sent</text><text x="65.2" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">home supports families,</text><text x="65.2" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schooling and small</text><text x="65.2" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">businesses</text><rect x="30" y="363" width="270" height="180" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="396" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LOSSES</text><text x="50" y="425.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Brain drain: loss of</text><text x="65.2" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trained doctors, nurses,</text><text x="65.2" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">engineers and teachers it</text><text x="65.2" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">paid to train</text><rect x="315" y="110" width="270" height="64" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Migrants</text><rect x="315" y="184" width="270" height="165" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="335" y="217" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GAINS</text><text x="335" y="246.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.2" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Higher wages</text><text x="335" y="272.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.2" y="272.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Safety</text><text x="335" y="298.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.2" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Education for children</text><rect x="315" y="363" width="270" height="180" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="335" y="396" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LOSSES</text><text x="335" y="425.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.2" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exploitation, insecure</text><text x="350.2" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work</text><text x="335" y="472.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.2" y="472.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Separation from family</text><text x="335" y="498.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.2" y="498.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Discrimination</text><rect x="600" y="110" width="270" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="146.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Receiving society</text><rect x="600" y="184" width="270" height="165" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="217" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GAINS</text><text x="620" y="246.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.2" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fill shortages in health</text><text x="635.2" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">care, construction,</text><text x="635.2" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">agriculture</text><text x="620" y="314.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.2" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Taxes; new businesses</text><rect x="600" y="363" width="270" height="180" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="620" y="396" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LOSSES</text><text x="620" y="425.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.2" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Possible pressure on</text><text x="635.2" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing and services in</text><text x="635.2" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">some areas</text><text x="620" y="493.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.2" y="493.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some employers keep wages</text><text x="635.2" y="514.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">low</text><rect x="30" y="561" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="597" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">When migrants lack power</text><text x="50" y="626.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kafala system (several Gulf states): residence tied to the employer, so changing jobs or</text><text x="50" y="648.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">leaving can be very difficult; critics say this leaves workers open to exploitation.</text>
</svg>