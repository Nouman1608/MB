<rect x="30" y="110" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="78" cy="151" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="78" y="158.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="118" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Criterion B specification: measurable points</text><text x="118" y="173" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">drives the development of the solution, and the evaluation too</text><line x1="130" y1="196" x2="130" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="232" width="200" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="130" cy="272" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="279.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="130" y="322" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Design tests</text><text x="130" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a test for every</text><text x="130" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">specification point</text><line x1="231" y1="317" x2="241" y2="317" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="343" y1="196" x2="343" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="243" y="232" width="200" height="170" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><circle cx="343" cy="272" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="343" y="279.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="343" y="322" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Carry out and judge</text><text x="343" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">met, partly met or</text><text x="343" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">not met, with</text><text x="343" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">evidence</text><line x1="444" y1="317" x2="454" y2="317" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="556" y1="196" x2="556" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="456" y="232" width="200" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="556" cy="272" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="556" y="279.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="556" y="322" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Improvements</text><text x="556" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">specific,</text><text x="556" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">evidence-based</text><text x="556" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">changes</text><line x1="657" y1="317" x2="667" y2="317" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="769" y1="196" x2="769" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="669" y="232" width="200" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="769" cy="272" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="769" y="279.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="769" y="322" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Impact</text><text x="769" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">on the client or</text><text x="769" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">target audience</text><rect x="30" y="425" width="840" height="96" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="461" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Vague specification</text><text x="52" y="491" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nothing precise to test against, so a strong evaluation is almost impossible</text>
