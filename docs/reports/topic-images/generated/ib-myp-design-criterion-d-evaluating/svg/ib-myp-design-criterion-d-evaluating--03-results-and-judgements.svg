<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Music stand: results against the specification</text>

<text x="50" y="140" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Spec point</text><text x="210" y="140" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Target</text><text x="390" y="140" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Result</text><text x="580" y="140" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Judgement</text><rect x="30" y="156" width="840" height="80" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="202" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1 Sag</text><text x="210" y="202" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">≤ 5 mm</text><text x="390" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">mean 4.0 mm</text><text x="390" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">3.8, 4.2, 4.0 mm</text><rect x="580" y="176" width="120" height="40" rx="10" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.2"/><text x="640" y="201.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">✓ Met</text><rect x="30" y="248" width="840" height="80" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="294" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2 Mass</text><text x="210" y="294" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">≤ 1.20 kg</text><text x="390" y="286" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1.35 kg</text><text x="390" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">12.5% over</text><rect x="580" y="268" width="120" height="40" rx="10" fill="#f4d9c8" stroke="#b5602e" stroke-width="2.2"/><text x="640" y="293.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">✗ Not met</text><rect x="30" y="340" width="840" height="80" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">3 Folding</text><text x="210" y="386" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">≥ 80% under 20 s</text><text x="390" y="378" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">70% (7 of 10)</text><text x="390" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">close; mean misleads</text><rect x="580" y="360" width="120" height="40" rx="10" fill="#f4d9c8" stroke="#b5602e" stroke-width="2.2"/><text x="640" y="385.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">✗ Not met</text><rect x="30" y="432" width="840" height="80" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="478" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">4 Cost</text><text x="210" y="478" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">≤ £12</text><text x="390" y="470" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">£9.40</text><text x="390" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">£2.60 to spare</text><rect x="580" y="452" width="120" height="40" rx="10" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.2"/><text x="640" y="477.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">✓ Met</text><rect x="30" y="524" width="840" height="80" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="570" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">5 Carrying</text><text x="210" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">most rate 4 or 5</text><text x="390" y="562" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">75% (9 of 12)</text><text x="390" y="586" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">corners dug into hands</text><rect x="580" y="544" width="120" height="40" rx="10" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.2"/><text x="640" y="569.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">✓ Met</text><rect x="30" y="625" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="661" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Overall judgement</text><text x="55" y="690" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Strong enough, affordable and liked for carrying, but too heavy and slightly too</text><text x="55" y="713" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hard to fold. Link the failures: the heavy hinge is also where players struggled.</text>
</svg>