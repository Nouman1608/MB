<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Designing tests</text>

<text x="55" y="135" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">For each specification point, decide:</text><rect x="30" y="152" width="200" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Method</text><text x="130" y="214" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">repeatable steps</text><rect x="243" y="152" width="200" height="84" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="343" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Success measure</text><text x="343" y="214" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">straight from the spec</text><rect x="456" y="152" width="200" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="556" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Data to record</text><text x="556" y="214" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">readings, times, counts</text><rect x="669" y="152" width="200" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="769" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Who and where</text><text x="769" y="214" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">audience, real setting</text><rect x="30" y="248" width="840" height="60" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="50" y="284" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sag:</text><text x="100" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2 kg at centre, rule, ×3  →  mean ≤ 5 mm  →  three readings in mm</text><rect x="30" y="330" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="368" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Types of test and the data they give</text><defs><linearGradient id="qq" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="90" y="406" width="720" height="28" rx="14" fill="url(#qq)" stroke="#1e2a44" stroke-width="2"/><text x="90" y="394" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Quantitative: numbers</text><text x="810" y="394" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">Qualitative: descriptions, opinions</text><line x1="120" y1="434" x2="120" y2="466" stroke="#1e2a44" stroke-width="2"/><circle cx="120" cy="420" r="7" fill="#1e2a44"/><text x="140" y="486" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Performance test</text><text x="140" y="508" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">load the desk, measure sag</text><line x1="270" y1="434" x2="270" y2="556" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="420" r="7" fill="#1e2a44"/><text x="270" y="576" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Questionnaire</text><text x="270" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1–5 ease-of-carrying rating</text><line x1="420" y1="434" x2="420" y2="466" stroke="#1e2a44" stroke-width="2"/><circle cx="420" cy="420" r="7" fill="#1e2a44"/><text x="420" y="486" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">User trial</text><text x="420" y="508" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">players fold it, timed</text><line x1="560" y1="434" x2="560" y2="556" stroke="#1e2a44" stroke-width="2"/><circle cx="560" cy="420" r="7" fill="#1e2a44"/><text x="560" y="576" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Comparison test</text><text x="560" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">vs the old metal stand</text><line x1="680" y1="434" x2="680" y2="466" stroke="#1e2a44" stroke-width="2"/><circle cx="680" cy="420" r="7" fill="#1e2a44"/><text x="680" y="486" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Interview</text><text x="680" y="508" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">client’s view of appearance</text><line x1="790" y1="434" x2="790" y2="556" stroke="#1e2a44" stroke-width="2"/><circle cx="790" cy="420" r="7" fill="#1e2a44"/><text x="760" y="576" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Expert appraisal</text><text x="760" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">technician checks joints</text><text x="450" y="646" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Use both: numbers show whether a target was met; comments explain why.</text>
</svg>