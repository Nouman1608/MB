<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Thinking about impact in categories</text>

<rect x="330" y="110" width="240" height="70" rx="35" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Impact on the</text><text x="450" y="164" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">client or audience</text><rect x="30" y="200" width="840" height="78" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="234" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Use</text><text x="55" y="259" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">quicker, safer, easier?</text><text x="330" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">players set up faster; fewer trips</text><text x="840" y="248" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="end">+</text><rect x="30" y="290" width="840" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="324" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wellbeing and ergonomics</text><text x="55" y="349" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">comfort, strain, access</text><text x="330" y="336" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lighter to carry, but corners need rounding</text><text x="840" y="338" font-size="26" font-weight="700" fill="#8a6d0d" text-anchor="end">±</text><rect x="30" y="380" width="840" height="78" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="414" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cost and resources</text><text x="55" y="439" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for the client, over its life</text><text x="330" y="426" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">material cost £9.40</text><text x="840" y="428" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="end">+</text><rect x="30" y="470" width="840" height="78" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="504" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Environment</text><text x="55" y="529" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">materials, repair, end of life</text><text x="330" y="516" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plywood recyclable; steel hinge reusable</text><text x="840" y="518" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="end">+</text><rect x="30" y="560" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="594" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wider community</text><text x="55" y="619" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">who else is affected?</text><text x="330" y="606" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">other staff, families, other schools</text><text x="840" y="608" font-size="26" font-weight="700" fill="#4a5568" text-anchor="end">?</text><rect x="30" y="660" width="840" height="92" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="55" y="694" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Include negative or uncertain impacts</text><text x="55" y="724" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">too heavy for the youngest players, so some may still need help</text><text x="450" y="785" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Say where an impact is a prediction; link it to the unit’s global context.</text>
</svg>