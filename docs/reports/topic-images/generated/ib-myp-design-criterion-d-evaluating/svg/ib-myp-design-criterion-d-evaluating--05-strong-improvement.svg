<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 745" width="900" height="745" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="745" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From a wish to an improvement</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weak</text><text x="52" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“I would make it lighter and easier to fold.”</text><rect x="30" y="222" width="840" height="470" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="258" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Strong: five things the paragraph does</text><rect x="55" y="280" width="790" height="68" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="92" cy="314" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="92" y="321.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="128" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Names the evidence</text><text x="128" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">0.15 kg over the mass target; slowest players paused at the hinge catch</text><rect x="55" y="360" width="790" height="68" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="92" cy="394" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="92" y="401.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="128" y="390" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gives a specific change</text><text x="128" y="414" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lighter hinge of the same length, or lightening holes; larger thumb catch</text><rect x="55" y="440" width="790" height="68" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="92" cy="474" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="92" y="481.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="128" y="470" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Explains why it works</text><text x="128" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the steel hinge (0.22 kg) is the main source of extra mass</text><rect x="55" y="520" width="790" height="68" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="92" cy="554" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="92" y="561.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="128" y="550" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Protects what passed</text><text x="128" y="574" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the desk, which passed its sag test, stays unchanged</text><rect x="55" y="600" width="790" height="68" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="92" cy="634" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="92" y="641.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="128" y="630" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Plans a re-test</text><text x="128" y="654" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">re-test mass and folding with the same method</text><text x="450" y="722" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">Improvements can target the testing too: more players, or the real band room.</text>
</svg>