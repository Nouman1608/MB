<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">In-house or outsourced production?</text>

<rect x="30" y="110" width="410" height="300" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="148" font-size="23" font-weight="700" fill="#8a6d0d" text-anchor="middle">In-house</text><text x="235" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">own staff, premises and equipment</text><circle cx="66" cy="212.05" r="12" fill="#2e6b62"/><path d="M60.6,212.29000000000002 L64.8,216.61 L72,207.85000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Control on quality: inspect every</text><text x="86" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stage, fix faults at once</text><circle cx="66" cy="272.05" r="12" fill="#2e6b62"/><path d="M60.6,272.29 L64.8,276.61 L72,267.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="278" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Control of information: designs,</text><text x="86" y="300" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recipes and data stay inside</text><circle cx="66" cy="332.05" r="12" fill="#2e6b62"/><path d="M60.6,332.29 L64.8,336.61 L72,327.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="338" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer delays from a supplier’s other</text><text x="86" y="360" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">customers</text><rect x="460" y="110" width="410" height="300" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="148" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="middle">Outsourced</text><text x="665" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">pay another business to do it</text><circle cx="496" cy="212.05" r="12" fill="#2e6b62"/><path d="M490.6,212.29000000000002 L494.8,216.61 L502,207.85000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Accessing expertise: skills and</text><text x="516" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">equipment the business lacks</text><circle cx="496" cy="272.05" r="12" fill="#2e6b62"/><path d="M490.6,272.29 L494.8,276.61 L502,267.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="278" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cost savings: no machinery or extra</text><text x="516" y="300" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">staff; specialist’s scale</text><circle cx="496" cy="332.05" r="12" fill="#2e6b62"/><path d="M490.6,332.29 L494.8,336.61 L502,327.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="338" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Managers focus on what the business</text><text x="516" y="360" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">does best</text><rect x="30" y="430" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="472" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Assess: weigh quality and information control against expertise and cost.</text>
</svg>