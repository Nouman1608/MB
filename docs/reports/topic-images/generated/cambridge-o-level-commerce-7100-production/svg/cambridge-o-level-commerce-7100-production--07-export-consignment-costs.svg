<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Costing an export of 500 jackets</text>

<rect x="30" y="110" width="840" height="455" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="145" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Cost</text><text x="290" y="145" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Working</text><text x="846" y="145" font-size="16" font-weight="700" fill="#4a5568" text-anchor="end">$</text><line x1="54" y1="162" x2="846" y2="162" stroke="#c9d6d4" stroke-width="1.5"/><text x="54" y="192" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Transport</text><text x="290" y="192" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">given</text><text x="846" y="192" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">1,800</text><line x1="54" y1="218" x2="846" y2="218" stroke="#c9d6d4" stroke-width="1.5"/><text x="54" y="248" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Packaging</text><text x="290" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">500 × $0.60</text><text x="846" y="248" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">300</text><line x1="54" y1="274" x2="846" y2="274" stroke="#c9d6d4" stroke-width="1.5"/><text x="54" y="304" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Customs duties</text><text x="290" y="304" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">5% of $20,000</text><text x="290" y="326" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start" font-style="italic">convert the % to $ first</text><text x="846" y="304" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">1,000</text><line x1="54" y1="330" x2="846" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><text x="54" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Commission to agent</text><text x="290" y="360" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">3% of $20,000</text><text x="846" y="360" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">600</text><line x1="54" y1="386" x2="846" y2="386" stroke="#c9d6d4" stroke-width="1.5"/><text x="54" y="416" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Warehousing</text><text x="290" y="416" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">2 weeks × $150</text><text x="846" y="416" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">300</text><line x1="54" y1="442" x2="846" y2="442" stroke="#c9d6d4" stroke-width="1.5"/><text x="54" y="472" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bank charges</text><text x="290" y="472" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">given</text><text x="846" y="472" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">45</text><rect x="46" y="505" width="808" height="48" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="66" y="537" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Total</text><text x="838" y="537" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="end">4,045</text><rect x="30" y="585" width="840" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="625" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cost per jacket = 4,045 / 500 = $8.09</text><text x="450" y="652" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">500 jackets worth $20,000 (invented figures)</text>
</svg>