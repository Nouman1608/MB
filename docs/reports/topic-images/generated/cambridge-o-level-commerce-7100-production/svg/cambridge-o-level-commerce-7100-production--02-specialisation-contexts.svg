<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Specialisation in three contexts</text>

<text x="400" y="128" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Advantages</text><text x="730" y="128" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Disadvantages</text><rect x="30" y="145" width="140" height="155" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="229.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual</text><rect x="185" y="145" width="335" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="215" cy="177.4" r="12" fill="#2e6b62"/><path d="M209.6,177.64000000000001 L213.8,181.96 L221,173.20000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="183" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Skilled and quick at the task</text><circle cx="215" cy="208.4" r="12" fill="#2e6b62"/><path d="M209.6,208.64000000000001 L213.8,212.96 L221,204.20000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can earn more as an expert</text><circle cx="215" cy="239.4" r="12" fill="#2e6b62"/><path d="M209.6,239.64000000000001 L213.8,243.96 L221,235.20000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No time lost switching jobs</text><rect x="535" y="145" width="335" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="177.4" r="12" fill="#b5602e"/><path d="M560.44,172.84 L569.56,181.96 M569.56,172.84 L560.44,181.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="183" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repetitive and boring work</text><circle cx="565" cy="208.4" r="12" fill="#b5602e"/><path d="M560.44,203.84 L569.56,212.96 M569.56,203.84 L560.44,212.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Skills may become out of date</text><circle cx="565" cy="239.4" r="12" fill="#b5602e"/><path d="M560.44,234.84 L569.56,243.96 M569.56,234.84 L560.44,243.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Harder to change job</text><rect x="30" y="315" width="140" height="155" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="399.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Factory</text><rect x="185" y="315" width="335" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="215" cy="347.4" r="12" fill="#2e6b62"/><path d="M209.6,347.64 L213.8,351.96 L221,343.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Trained staff and specialist</text><text x="235" y="374" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">machines raise output per worker</text><circle cx="215" cy="399.4" r="12" fill="#2e6b62"/><path d="M209.6,399.64 L213.8,403.96 L221,395.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="405" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More consistent quality</text><rect x="535" y="315" width="335" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="347.4" r="12" fill="#b5602e"/><path d="M560.44,342.84 L569.56,351.96 M569.56,342.84 L560.44,351.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A stoppage at one stage halts</text><text x="585" y="374" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the line</text><circle cx="565" cy="399.4" r="12" fill="#b5602e"/><path d="M560.44,394.84 L569.56,403.96 M569.56,394.84 L560.44,403.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="405" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less motivation, more absences</text><rect x="30" y="485" width="140" height="155" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="569.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Country</text><rect x="185" y="485" width="335" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="215" cy="517.4" r="12" fill="#2e6b62"/><path d="M209.6,517.64 L213.8,521.9599999999999 L221,513.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="523" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Uses natural advantages to</text><text x="235" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">produce more</text><circle cx="215" cy="569.4" r="12" fill="#2e6b62"/><path d="M209.6,569.64 L213.8,573.9599999999999 L221,565.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="575" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Earns export income</text><rect x="535" y="485" width="335" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="517.4" r="12" fill="#b5602e"/><path d="M560.44,512.84 L569.56,521.9599999999999 M569.56,512.84 L560.44,521.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="523" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Depends on others for goods it</text><text x="585" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">does not make</text><circle cx="565" cy="569.4" r="12" fill="#b5602e"/><path d="M560.44,564.84 L569.56,573.9599999999999 M569.56,564.84 L560.44,573.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="575" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Vulnerable if world demand or</text><text x="585" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prices fall</text><text x="450" y="680" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Name the context: bored workers, a stopped line, or over-dependence on one export.</text>
</svg>