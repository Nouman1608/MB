<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Automation and EDI</text>

<rect x="30" y="110" width="840" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">EDI: a supermarket re-orders</text><rect x="54" y="170" width="220" height="90" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="164" y="209.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Supermarket system</text><text x="164" y="231.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">stock at set level</text><rect x="626" y="170" width="220" height="90" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="736" y="220.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Supplier system</text><line x1="282" y1="196" x2="618" y2="196" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="186" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">order sent automatically</text><line x1="618" y1="238" x2="282" y2="238" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="264" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">invoices back</text><rect x="30" y="305" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="343" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Automation (robots)</text><circle cx="64" cy="377.4" r="12" fill="#2e6b62"/><path d="M58.6,377.64 L62.8,381.96 L70,373.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Faster, more consistent output</text><circle cx="64" cy="408.4" r="12" fill="#2e6b62"/><path d="M58.6,408.64 L62.8,412.96 L70,404.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Works around the clock</text><circle cx="64" cy="439.4" r="12" fill="#2e6b62"/><path d="M58.6,439.64 L62.8,443.96 L70,435.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="445" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Removes dangerous jobs</text><circle cx="64" cy="490.4" r="12" fill="#b5602e"/><path d="M59.44,485.84 L68.56,494.96 M68.56,485.84 L59.44,494.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Expensive to buy and maintain</text><circle cx="64" cy="521.4" r="12" fill="#b5602e"/><path d="M59.44,516.84 L68.56,525.9599999999999 M68.56,516.84 L59.44,525.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="527" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some jobs lost; retraining needed</text><rect x="460" y="305" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="343" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">EDI</text><circle cx="494" cy="377.4" r="12" fill="#2e6b62"/><path d="M488.6,377.64 L492.8,381.96 L500,373.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less paperwork and fewer errors</text><circle cx="494" cy="408.4" r="12" fill="#2e6b62"/><path d="M488.6,408.64 L492.8,412.96 L500,404.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Faster re-ordering</text><circle cx="494" cy="459.4" r="12" fill="#b5602e"/><path d="M489.44,454.84 L498.56,463.96 M498.56,454.84 L489.44,463.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="465" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Both firms need compatible systems</text><circle cx="494" cy="490.4" r="12" fill="#b5602e"/><path d="M489.44,485.84 L498.56,494.96 M498.56,485.84 L489.44,494.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A system failure stops orders</text>
</svg>