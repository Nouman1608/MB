<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Domestic and global supply chains</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Domestic supply chain</text><text x="54" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">every stage within one country</text><rect x="54" y="190" width="792" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="9 6"/><text x="450" y="222" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">materials, making and selling all in one country</text><rect x="30" y="280" width="840" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Global supply chain: a bicycle</text><text x="54" y="342" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">at least some stages in other countries</text><rect x="54" y="365" width="230" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="9 6"/><text x="169" y="392" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Country 1</text><rect x="79" y="410" width="180" height="60" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="169" y="445.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Frame welded</text><rect x="334" y="365" width="230" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="9 6"/><text x="449" y="392" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">Country 2</text><rect x="359" y="410" width="180" height="60" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="449" y="445.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Gears made</text><rect x="614" y="365" width="230" height="150" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="9 6"/><text x="729" y="392" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">Country 3</text><rect x="639" y="410" width="180" height="60" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="729" y="445.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Final assembly</text><line x1="543" y1="440" x2="629" y2="440" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M169,472 C169,590 724,590 724,478" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
