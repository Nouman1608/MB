<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Intermediaries: agent and factor</text>

<rect x="30" y="110" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Home trade</text><rect x="54" y="166" width="170" height="52" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="139" y="198.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Producer</text><line x1="228" y1="192" x2="256" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="262" y="166" width="170" height="52" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="347" y="198.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Wholesaler</text><line x1="436" y1="192" x2="464" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="470" y="166" width="170" height="52" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="198.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Retailer</text><line x1="644" y1="192" x2="672" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="678" y="166" width="170" height="52" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="763" y="198.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumer</text><text x="450" y="280" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">International trade: agent or factor?</text><rect x="30" y="300" width="410" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="316" width="150" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="125" y="345.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Agent</text><text x="52" y="400" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What it does</text><text x="52" y="424" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Finds buyers or sellers; arranges deals</text><text x="52" y="454" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Holds the goods?</text><text x="52" y="478" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">No</text><text x="52" y="508" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Owns the goods? Paid by?</text><text x="52" y="532" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">No; commission</text><rect x="460" y="300" width="410" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="316" width="150" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="555" y="345.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Factor</text><text x="482" y="400" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What it does</text><text x="482" y="424" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sells the goods for the owner</text><text x="482" y="454" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Holds the goods?</text><text x="482" y="478" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Yes: takes possession</text><text x="482" y="508" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Owns the goods? Paid by?</text><text x="482" y="532" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">No; commission</text><rect x="30" y="580" width="840" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="617" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">The key difference is possession. Not the same as debt factoring (Topic 5).</text>
</svg>