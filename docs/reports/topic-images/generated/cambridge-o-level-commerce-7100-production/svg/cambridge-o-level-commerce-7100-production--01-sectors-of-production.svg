<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four sectors of production</text>

<rect x="30" y="110" width="240" height="106" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="156" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary</text><text x="150" y="184" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Extractive</text><rect x="285" y="110" width="585" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="305" y="146" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Takes natural resources from land or sea</text><text x="305" y="175" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. Farming, fishing, mining, oil drilling, forestry</text><rect x="30" y="228" width="240" height="106" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="274" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><text x="150" y="302" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Manufacturing and</text><text x="150" y="322" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">construction</text><rect x="285" y="228" width="585" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="305" y="264" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Turns raw materials into goods, or builds structures</text><text x="305" y="293" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. Car assembly, flour milling, house and road building</text><rect x="30" y="346" width="240" height="106" rx="14" fill="#e6b79a" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="392" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Tertiary</text><text x="150" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Commercial and direct</text><text x="150" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">services</text><rect x="285" y="346" width="585" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="305" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Commercial services help trade; direct services are given</text><text x="305" y="403" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personally</text><text x="305" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. Shops, banks, couriers; doctors, teachers, police</text><rect x="30" y="464" width="240" height="106" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="510" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Quaternary</text><text x="150" y="538" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Digital technology</text><rect x="285" y="464" width="585" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="305" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Activities based on digital technology and information</text><text x="305" y="529" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. Software, data analysis, cloud computing, app design</text><rect x="30" y="590" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="624" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Place the activity, not the whole firm</text><text x="54" y="652" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">In a mining company: geologist searching for oil → primary; office cashier → tertiary.</text><text x="54" y="676" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A delivery driver is tertiary (transport is a commercial service), not secondary.</text>
</svg>