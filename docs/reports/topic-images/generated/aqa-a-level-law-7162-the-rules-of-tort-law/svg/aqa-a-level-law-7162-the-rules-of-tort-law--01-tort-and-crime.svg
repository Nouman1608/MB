<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One incident, two separate proceedings</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A driver kills a pedestrian</text>
<rect x="300" y="124" width="300" height="48" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="152.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The same facts</text><line x1="400" y1="176" x2="240" y2="212" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="500" y1="176" x2="660" y2="212" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="216" width="412" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="236" y="244" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TORT: A CIVIL WRONG</text><text x="236" y="270.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Negligence claim</text><rect x="458" y="216" width="412" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="664" y="244" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">CRIME</text><text x="664" y="270.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Criminal charge</text><clipPath id="tc314"><rect x="30" y="314" width="840" height="279" rx="14"/></clipPath><g clip-path="url(#tc314)"><rect x="30" y="314" width="210" height="49" fill="#b5d3cf"/><rect x="240" y="314" width="315" height="49" fill="#b5d3cf"/><text x="254" y="342.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tort</text><rect x="555" y="314" width="315" height="49" fill="#f2e7b8"/><text x="569" y="342.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Crime</text><rect x="30" y="363" width="210" height="68" fill="#dce9e7"/><text x="44" y="389.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Who brings it</text><rect x="240" y="363" width="315" height="68" fill="#ffffff"/><text x="254" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The claimant sues the defendant</text><rect x="555" y="363" width="315" height="68" fill="#ffffff"/><text x="569" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usually the Crown Prosecution</text><text x="569" y="410.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Service</text><line x1="30" y1="431" x2="870" y2="431" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="431" width="210" height="47" fill="#dce9e7"/><text x="44" y="457.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Standard of proof</text><rect x="240" y="431" width="315" height="47" fill="#f8faf9"/><text x="254" y="457.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Balance of probabilities</text><rect x="555" y="431" width="315" height="47" fill="#f8faf9"/><text x="569" y="457.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Beyond reasonable doubt</text><line x1="30" y1="478" x2="870" y2="478" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="478" width="210" height="47" fill="#dce9e7"/><text x="44" y="504.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Outcome</text><rect x="240" y="478" width="315" height="47" fill="#ffffff"/><text x="254" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Liability and a remedy</text><rect x="555" y="478" width="315" height="47" fill="#ffffff"/><text x="569" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conviction and sentence</text><line x1="30" y1="525" x2="870" y2="525" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="525" width="210" height="68" fill="#dce9e7"/><text x="44" y="551.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><rect x="240" y="525" width="315" height="68" fill="#f8faf9"/><text x="254" y="551.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Compensation and protection of</text><text x="254" y="572.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rights</text><rect x="555" y="525" width="315" height="68" fill="#f8faf9"/><text x="569" y="551.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Punishment and protection of society</text></g><line x1="240" y1="314" x2="240" y2="593" stroke="#c9d6d4" stroke-width="1.5"/><line x1="555" y1="314" x2="555" y2="593" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="314" width="840" height="279" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="615" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="648.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> using criminal language (guilty, prosecution, sentence) in a tort answer.</text>
</svg>