<rect width="900" height="669" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Defences: reduce or defeat the claim</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Proved by the defendant once the tort is established</text>
<rect x="30" y="124" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="60" y1="314" x2="840" y2="314" stroke="#1e2a44" stroke-width="2.5"/><rect x="110" y="184" width="120" height="130" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="174" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">full damages</text><text x="170" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">No defence</text><rect x="380" y="216.5" width="120" height="97.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="440" y="206.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">reduced</text><text x="440" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Contributory negligence</text><rect x="650" y="308" width="120" height="6" fill="#b5602e"/><text x="710" y="298" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">nothing</text><text x="710" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Consent</text><text x="450" y="154" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Bar heights are illustrative</text><rect x="30" y="386" width="412" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTRIBUTORY NEGLIGENCE: PARTIAL</text><text x="48" y="442.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1945 Act, s1</text><text x="48" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Damages reduced by the share the court thinks</text><text x="48" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">just. Seat belts: 25% or 15% (<tspan font-style="italic">Froom</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Butcher</tspan>,</text><text x="48" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1976).</text><rect x="458" y="386" width="412" height="149" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="476" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSENT (VOLENTI): COMPLETE</text><text x="476" y="442.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Knew of the risk and freely agreed</text><text x="476" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Smith</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Baker</tspan> (1891); <tspan font-style="italic">Morris</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Murray</tspan> (1991).</text><text x="476" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rescuers do not consent (<tspan font-style="italic">Haynes</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Harwood</tspan>,</text><text x="476" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1935).</text><rect x="30" y="557" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="585" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIFIC DEFENCES</text><text x="46" y="616.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nuisance: prescription, statutory authority. <tspan font-style="italic">Rylands</tspan>: Act of God, act of a stranger.</text>
</svg>