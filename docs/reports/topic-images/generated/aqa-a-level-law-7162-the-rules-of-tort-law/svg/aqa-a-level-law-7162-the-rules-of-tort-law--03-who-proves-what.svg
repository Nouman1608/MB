<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 608" width="900" height="608" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="608" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who has to prove what?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Both sides prove on the balance of probabilities</text>
<rect x="30" y="124" width="480.66666666666663" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLAIMANT PROVES</text><text x="48" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Each element of the tort</text><text x="48" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">In negligence: duty, breach, damage caused by the</text><text x="48" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breach and not too remote</text><rect x="526.6666666666666" y="124" width="343.33333333333337" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="544.6666666666666" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFENDANT PROVES</text><text x="544.6666666666666" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Any defence</text><text x="544.6666666666666" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Such as contributory negligence or</text><text x="544.6666666666666" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consent</text><rect x="30" y="275" width="840" height="105" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="305" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CAUSATION FAILS: BARNETT v CHELSEA AND KENSINGTON HMC (1969)</text><text x="48" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A doctor refused to examine a patient but was not liable: the patient would have died anyway. A careless</text><text x="48" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">defendant escapes if factual causation is not shown.</text><text x="450" y="420" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">HELP FOR THE CLAIMANT</text><rect x="30" y="434" width="412" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="464.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Res ipsa loquitur</text><text x="46" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Thing under D’s control; accident would not</text><text x="46" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">normally happen without negligence: court may</text><text x="46" y="534.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">infer it (<tspan font-style="italic">Scott</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">London</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">St</tspan> <tspan font-style="italic">Katherine</tspan> <tspan font-style="italic">Docks</tspan>,</text><text x="46" y="555.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1865)</text><rect x="458" y="434" width="412" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="464.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A criminal conviction</text><text x="474" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">For the same incident: evidence of the facts in the</text><text x="474" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">civil claim (s11 Civil Evidence Act 1968)</text>
</svg>