<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 696" width="900" height="696" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="696" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Kit and the falling wall</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Jas, a delivery driver, reverses into a wall while on his phone</text>
<rect x="30" y="124" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="179" width="200" height="60" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="206" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Kit</text><text x="160" y="227" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">claimant, broken leg</text><rect x="600" y="144" width="240" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="171" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">SpeedyParcels Ltd</text><text x="720" y="192" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">employer</text><rect x="600" y="220" width="240" height="60" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="247" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Jas</text><text x="720" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">employee, negligent</text><line x1="264" y1="204" x2="594" y2="174" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="264" y1="214" x2="594" y2="248" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="430" y="174" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">vicarious liability</text><text x="430" y="252" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">negligence</text><line x1="720" y1="206" x2="720" y2="218" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="316" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="344" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DUTY</text><text x="46" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Established: road users to those nearby; no need</text><text x="46" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for <tspan font-style="italic">Caparo</tspan> (<tspan font-style="italic">Robinson</tspan>)</text><rect x="458" y="316" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="344" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BREACH</text><text x="474" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Looking at a phone while reversing falls below the</text><text x="474" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasonable driver (<tspan font-style="italic">Vaughan</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Menlove</tspan>)</text><rect x="30" y="429" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="457" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DAMAGE</text><text x="46" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">But for the reversing, no injury (<tspan font-style="italic">Barnett</tspan>); broken</text><text x="46" y="509.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leg a foreseeable type of harm (<tspan font-style="italic">Wagon</tspan> <tspan font-style="italic">Mound</tspan>)</text><rect x="458" y="429" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="457" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VICARIOUS LIABILITY</text><text x="474" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jas is an employee acting in the course of</text><text x="474" y="509.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">employment</text><rect x="30" y="542" width="412" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="570" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFENCES</text><text x="46" y="601.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contributory negligence: Kit ignored the sign.</text><text x="46" y="622.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consent unlikely: he did not agree to being hit by</text><text x="46" y="643.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a van.</text><rect x="458" y="542" width="412" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="570" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REMEDY AND CONCLUSION</text><text x="474" y="601.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">SpeedyParcels likely vicariously liable;</text><text x="474" y="622.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compensatory damages, reduced</text>
</svg>