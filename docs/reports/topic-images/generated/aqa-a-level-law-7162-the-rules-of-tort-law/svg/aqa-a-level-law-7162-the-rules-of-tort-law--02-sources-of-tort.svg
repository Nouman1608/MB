<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the tort rules come from</text>

<rect x="30" y="100" width="412" height="276" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON LAW: BUILT CASE BY CASE</text><text x="48" y="161.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Negligence:</tspan> <tspan font-style="italic">Donoghue</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Stevenson</tspan> (1932);</text><text x="63.2" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Caparo</tspan> (1990); <tspan font-style="italic">Robinson</tspan> (2018)</text><text x="48" y="209.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Private</tspan> <tspan font-weight="700" fill="#1e2a44">nuisance:</tspan> <tspan font-style="italic">Hunter</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Canary</tspan> <tspan font-style="italic">Wharf</tspan></text><text x="63.2" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1997)</text><text x="48" y="257.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="257.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Rylands</tspan> <tspan font-weight="700" fill="#1e2a44">v</tspan> <tspan font-weight="700" fill="#1e2a44">Fletcher</tspan> (1868); <tspan font-style="italic">Transco</tspan> (2003)</text><text x="48" y="284.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Vicarious</tspan> <tspan font-weight="700" fill="#1e2a44">liability:</tspan> <tspan font-style="italic">Various</tspan> <tspan font-style="italic">Claimants</tspan> (2012);</text><text x="63.2" y="305.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Lister</tspan> (2001)</text><text x="48" y="332.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Consent:</tspan> <tspan font-style="italic">Smith</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Baker</tspan> (1891); <tspan font-style="italic">ICI</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Shatwell</tspan></text><text x="63.2" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1965)</text><rect x="458" y="100" width="412" height="276" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATUTE: USE THE WORDING</text><text x="476" y="161.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Occupiers’</tspan> <tspan font-weight="700" fill="#1e2a44">Liability</tspan> <tspan font-weight="700" fill="#1e2a44">Act</tspan> <tspan font-weight="700" fill="#1e2a44">1957</tspan> (visitors):</text><text x="491.2" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“common duty of care”, s2(2)</text><text x="476" y="209.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Occupiers’</tspan> <tspan font-weight="700" fill="#1e2a44">Liability</tspan> <tspan font-weight="700" fill="#1e2a44">Act</tspan> <tspan font-weight="700" fill="#1e2a44">1984</tspan> (trespassers):</text><text x="491.2" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">three conditions in s1(3)</text><text x="476" y="257.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="257.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Law</tspan> <tspan font-weight="700" fill="#1e2a44">Reform</tspan> <tspan font-weight="700" fill="#1e2a44">(Contributory</tspan> <tspan font-weight="700" fill="#1e2a44">Negligence)</tspan> <tspan font-weight="700" fill="#1e2a44">Act</tspan></text><text x="491.2" y="278.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">1945</tspan></text><text x="450" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DUTY IN NEGLIGENCE SINCE ROBINSON</text><rect x="30" y="430" width="397" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="228.5" y="460.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Established precedent</text><text x="228.5" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The starting point</text><line x1="433" y1="469.5" x2="467" y2="469.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="430" width="397" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="671.5" y="460.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Genuinely novel situation?</text><text x="671.5" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Only then use <tspan font-style="italic">Caparo</tspan></text>
