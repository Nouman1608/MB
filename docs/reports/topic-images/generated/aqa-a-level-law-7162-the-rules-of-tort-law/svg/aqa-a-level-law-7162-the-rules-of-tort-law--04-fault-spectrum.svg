<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Liability and fault across the torts</text>

<rect x="30" y="100" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><defs><linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="142" width="780" height="40" rx="20" fill="url(#fg)" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="169" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Personal fault needed</text><text x="820" y="169" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">No personal fault</text><text x="450" y="128" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">use this spectrum for an essay on whether tort should depend on fault</text><rect x="30" y="222" width="840" height="101" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="250" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NEGLIGENCE: FAULT-BASED</text><text x="46" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Below the objective reasonable person (<tspan font-style="italic">Vaughan</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Menlove</tspan>, 1837), weighed against probability (<tspan font-style="italic">Bolton</tspan> <tspan font-style="italic">v</tspan></text><text x="46" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Stone</tspan>, 1951) and seriousness (<tspan font-style="italic">Paris</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Stepney</tspan> <tspan font-style="italic">BC</tspan>, 1951)</text><rect x="30" y="333" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="361" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OCCUPIERS’ LIABILITY: FAULT-BASED STATUTORY DUTY</text><text x="46" y="392.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Such care as is reasonable in all the circumstances (OLA 1957 s2(2); OLA 1984 s1(4))</text><rect x="30" y="423" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="451" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRIVATE NUISANCE: UNREASONABLE USE OF LAND</text><text x="46" y="482.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Locality, duration; malice can make reasonable conduct a nuisance (<tspan font-style="italic">Christie</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Davey</tspan>, 1893)</text><rect x="30" y="513" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="541" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RYLANDS v FLETCHER: STRICT</text><text x="46" y="572.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No need to prove carelessness, but the type of damage must be foreseeable (<tspan font-style="italic">Cambridge</tspan> <tspan font-style="italic">Water</tspan>, 1994)</text><rect x="30" y="603" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="631" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VICARIOUS LIABILITY: NO PERSONAL FAULT BY THE EMPLOYER</text><text x="46" y="662.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Liability for an employee’s tort in the course of employment</text>
</svg>