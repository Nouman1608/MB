<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 686" width="900" height="686" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="686" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From analysis to evaluation</text>

<rect x="30" y="110" width="397" height="216" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="194" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANALYSIS</text><text x="50" y="221" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What does this choice do?</text><text x="50" y="250.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Explains the effect.</text><line x1="433" y1="218" x2="467" y2="218" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="110" width="397" height="216" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="493" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EVALUATION</text><text x="493" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">How well does it do it, and why</text><text x="493" y="196" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">does it matter?</text><text x="493" y="225.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="509.15" y="225.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Why is it effective here?</text><text x="493" y="252.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="509.15" y="252.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Is it more powerful than an</text><text x="509.15" y="274.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">alternative?</text><text x="493" y="301.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="509.15" y="301.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Does it work alongside other choices?</text><text x="450" y="366" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Grammatical features count too</text><rect x="30" y="386" width="330" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="195" y="418" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A passive verb</text><line x1="368" y1="411" x2="420" y2="411" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="428" y="386" width="442" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="448" y="418" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">can hide who is responsible</text><rect x="30" y="450" width="330" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="195" y="482" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A list</text><line x1="368" y1="475" x2="420" y2="475" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="428" y="450" width="442" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="448" y="482" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">can overwhelm</text><rect x="30" y="514" width="330" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="195" y="546" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A sudden short sentence</text><line x1="368" y1="539" x2="420" y2="539" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="428" y="514" width="442" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="448" y="546" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">can shock</text><rect x="30" y="582" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="615.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use terminology to make evaluation precise, not as decoration. The specification asks about</text><text x="50" y="637.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“quality and impact”.</text>
</svg>