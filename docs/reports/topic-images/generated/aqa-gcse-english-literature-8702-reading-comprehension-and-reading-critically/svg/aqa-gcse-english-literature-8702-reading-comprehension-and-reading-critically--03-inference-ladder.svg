<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The inference ladder</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">“She set two places at the table, then cleared one away.”</text>
<rect x="30" y="340" width="200" height="250" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="60" cy="374" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="380.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="86" y="381" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Detail</text><text x="44" y="424" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">What exactly is</text><text x="44" y="445" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">written?</text><text x="44" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Two places are set;</text><text x="44" y="499" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">one is cleared.</text><rect x="243" y="278" width="200" height="312" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="273" cy="312" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="273" y="318.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="299" y="319" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Literal meaning</text><text x="257" y="362" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">What happens?</text><text x="257" y="395" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">She expected</text><text x="257" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">someone, then</text><text x="257" y="437" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">remembered they</text><text x="257" y="458" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">would not come.</text><rect x="456" y="216" width="200" height="374" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="486" cy="250" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="486" y="256.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="512" y="257" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inference</text><text x="470" y="300" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">What does it</text><text x="470" y="321" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">suggest about</text><text x="470" y="342" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">character or</text><text x="470" y="363" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">feeling?</text><text x="470" y="396" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Habit and grief: she</text><text x="470" y="417" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">has recently lost</text><text x="470" y="438" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">someone.</text><rect x="669" y="154" width="200" height="436" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="699" cy="188" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="699" y="194.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="725" y="195" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Significance</text><text x="683" y="238" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">How does it link</text><text x="683" y="259" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">to the text’s</text><text x="683" y="280" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">ideas?</text><text x="683" y="313" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Loss is shown</text><text x="683" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">through routine, so</text><text x="683" y="355" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">grief becomes part</text><text x="683" y="376" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">of daily life.</text><rect x="257" y="524" width="172" height="52" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="343" y="545" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">Most weak answers</text><text x="343" y="564" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">stop here</text><rect x="683" y="524" width="172" height="52" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="769" y="545" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Strong answers</text><text x="769" y="564" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">reach step 4</text><path d="M769,596 L769,622 L130,622" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><line x1="130" y1="622" x2="130" y2="600" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="450" y="650" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">…and stay anchored in the detail at step 1</text>
</svg>