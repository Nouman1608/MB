<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="632" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the model answer earns its marks</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How does the writer present Nan’s feelings?</text>
<rect x="30" y="110" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARGUMENT</text><text x="50" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Nan’s grief is something she manages through routine rather than</text><text x="50" y="196" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">speech.</text><text x="30" y="246" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Evidence</text><text x="318" y="246" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">What it suggests</text><text x="640" y="246" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Skill shown</text><rect x="30" y="256" width="260" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="286" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“dead since March”</text><line x1="294" y1="288" x2="314" y2="288" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="318" y="256" width="292" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="286" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">She cannot yet let go.</text><rect x="640" y="256" width="230" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="656" y="286" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">inference from</text><text x="656" y="307" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">explicit detail</text><rect x="30" y="332" width="260" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="362" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Habit”; a counter</text><text x="46" y="385" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“already clean”</text><line x1="294" y1="377.5" x2="314" y2="377.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="318" y="332" width="292" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="362" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Seems dismissive, but she is</text><text x="334" y="385" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">keeping busy to avoid</text><text x="334" y="408" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">feeling.</text><rect x="640" y="332" width="230" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="656" y="362" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">motive inferred;</text><text x="656" y="383" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">alternative reading</text><text x="656" y="404" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">weighed</text><rect x="30" y="435" width="260" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="465" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">nine days behind the</text><text x="46" y="488" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">clock; folded “the size</text><text x="46" y="511" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">of a stamp”</text><line x1="294" y1="480.5" x2="314" y2="480.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="318" y="435" width="292" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="465" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Avoidance; trying to make the</text><text x="334" y="488" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bad news smaller.</text><rect x="640" y="435" width="230" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="656" y="465" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">sequence and imagery</text><text x="656" y="486" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">evaluated</text><rect x="30" y="538" width="260" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="568" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">the understated final</text><text x="46" y="591" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">line</text><line x1="294" y1="572" x2="314" y2="572" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="318" y="538" width="292" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="568" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Her calm reveals how much she</text><text x="334" y="591" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is holding back.</text><rect x="640" y="538" width="230" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="656" y="568" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">evaluation of impact</text>
</svg>