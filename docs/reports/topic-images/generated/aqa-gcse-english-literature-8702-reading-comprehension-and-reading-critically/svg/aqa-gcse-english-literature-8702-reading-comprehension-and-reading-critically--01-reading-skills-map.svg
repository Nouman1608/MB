<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 714" width="900" height="714" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four groups of reading skills</text>

<rect x="30" y="110" width="411" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="150" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="157.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="100" y="156" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Literal and inferential</text><text x="100" y="181" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">comprehension</text><text x="52" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Words in context; plot, character, events,</text><text x="52" y="237" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">settings; explicit vs implied; motive,</text><text x="52" y="258" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sequence and cause.</text><rect x="459" y="110" width="411" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="495" cy="150" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="495" y="157.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="529" y="156" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Critical reading</text><text x="481" y="191" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Themes; a point of view with evidence;</text><text x="481" y="212" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">different responses; context; an informed</text><text x="481" y="233" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">personal response.</text><rect x="30" y="294" width="411" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="66" cy="334" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="341.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="100" y="340" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluating a writer’s choices</text><text x="52" y="375" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How language, structure, form and</text><text x="52" y="396" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">presentation contribute to quality and</text><text x="52" y="417" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">impact.</text><rect x="459" y="294" width="411" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="495" cy="334" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="495" y="341.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="529" y="340" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Comparing texts</text><text x="481" y="375" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Theme, characterisation, context (where</text><text x="481" y="396" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">known), style and literary quality.</text><text x="450" y="496" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">How the skills map onto the assessment objectives</text><rect x="30" y="518" width="120" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="551" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><line x1="158" y1="543" x2="205" y2="543" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="212" y="518" width="658" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="232" y="550" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">comprehension and personal response (mostly)</text><rect x="30" y="580" width="120" height="50" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="613" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><line x1="158" y1="605" x2="205" y2="605" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="212" y="580" width="658" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="232" y="612" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">analysis and evaluation of methods</text><rect x="30" y="642" width="120" height="50" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="675" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><line x1="158" y1="667" x2="205" y2="667" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="212" y="642" width="658" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="232" y="674" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">context-informed evaluation</text>
</svg>