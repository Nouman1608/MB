<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a word, then reading beneath it</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Words in context: what does it mean here?</text><rect x="70" y="225" width="150" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="145" y="267" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">“cold”</text><path d="M222,257 C270,257 270,198 316,198" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="318" y="176" width="230" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="433" y="205" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the weather</text><path d="M222,257 C270,257 270,256 316,256" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="318" y="234" width="230" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="433" y="263" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a character’s manner</text><path d="M222,257 C270,257 270,314 316,314" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="318" y="292" width="230" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="433" y="321" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a dead body</text><circle cx="592" cy="184" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="592" y="189.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="618" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What does it mean here?</text><circle cx="592" cy="223" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="592" y="228.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="618" y="229" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What else might it suggest?</text><text x="618" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(connotations)</text><circle cx="592" cy="283" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="592" y="288.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="618" y="289" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Older text? Meanings may</text><text x="618" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">have shifted: check glosses</text><text x="618" y="331" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and the sentence around it.</text><rect x="30" y="384" width="400" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="424" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">Explicit</text><text x="54" y="456" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stated directly in the words of the</text><text x="54" y="478" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">text.</text><rect x="470" y="384" width="400" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="494" y="424" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">Implied</text><text x="494" y="456" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Suggested by details; you must infer</text><text x="494" y="478" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">it. Higher-level answers spend most</text><text x="494" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">time here.</text><line x1="432" y1="449" x2="466" y2="449" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="534" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="570" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The evidence test</text><text x="50" y="599.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Test every inference: could you point to the words that support it? If not, it is a guess.</text><text x="50" y="621.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ground each inference in something explicit.</text>
</svg>