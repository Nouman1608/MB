<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two readings, then a judgement</text>

<line x1="62" y1="130" x2="62" y2="406" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="110" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">State a reading</text><text x="128" y="175.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Some readers may see her silence as weakness.”</text><circle cx="62" cy="155" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="163.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="212" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="248" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Offer an alternative</text><text x="128" y="277.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“However, it could be read as resistance, since she refuses to give him the</text><text x="128" y="299.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reaction he wants.”</text><circle cx="62" cy="268" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="276.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="336" width="762" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="372" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Weigh them</text><text x="128" y="401.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“The ending supports the second reading, because…”</text><circle cx="62" cy="381" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="389.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="446" width="397" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="228.5" y="482" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Recognising readings</text><text x="228.5" y="511.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">is credited</text><line x1="433" y1="491" x2="467" y2="491" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="446" width="397" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="671.5" y="482" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluating readings</text><text x="671.5" y="511.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">moves an answer higher</text><rect x="30" y="554" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="587.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Different audiences can respond differently too: an original audience and a modern one, or</text><text x="50" y="609.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">readers with different values.</text>
</svg>