<rect width="900" height="420" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the question words ask for</text>

<rect x="30" y="110" width="330" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Question wording</text><rect x="360" y="110" width="510" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="372" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it asks you to do</text><rect x="30" y="156" width="330" height="70" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="183.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Explore” / “How far”</text><rect x="360" y="156" width="510" height="70" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="372" y="183.3" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Consider more than one reading and reach a</text><text x="372" y="207.3" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">judgement.</text><rect x="30" y="226" width="330" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="253.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“How does the writer present”</text><rect x="360" y="226" width="510" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="372" y="253.3" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Focus on the writer’s methods and their effects.</text><rect x="30" y="272" width="330" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="299.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Compare”</text><rect x="360" y="272" width="510" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="372" y="299.3" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Keep both texts together throughout.</text><rect x="30" y="338" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="371.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Underline the focus word in the question and test every inference against it.</text>
</svg>