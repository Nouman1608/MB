<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Illich (1975): medicine as a cause of harm</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">three kinds of iatrogenesis</text>
<rect x="30" y="120" width="269.3333333333333" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L285.0833333333333,121.25 Q298.0833333333333,121.25 298.0833333333333,134.25 L298.0833333333333,170 Z" fill="#f2e7b8"/><line x1="31.25" y1="170" x2="298.0833333333333" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Clinical</text><text x="46" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Injury from unsafe or wrong</text><text x="46" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treatment.</text><rect x="315.3333333333333" y="120" width="269.3333333333333" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,170 L316.5833333333333,134.25 Q316.5833333333333,121.25 329.5833333333333,121.25 L570.4166666666666,121.25 Q583.4166666666666,121.25 583.4166666666666,134.25 L583.4166666666666,170 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="170" x2="583.4166666666666" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social</text><text x="331.3333333333333" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Medicalisation of life and</text><text x="331.3333333333333" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dependence on medical care.</text><rect x="600.6666666666666" y="120" width="269.3333333333333" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,170 L601.9166666666666,134.25 Q601.9166666666666,121.25 614.9166666666666,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural</text><text x="616.6666666666666" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Loss of traditional ways of</text><text x="616.6666666666666" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">coping with suffering and</text><text x="616.6666666666666" y="245.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">death.</text><rect x="30" y="285" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="321" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Did medicine cut death rates?</text><circle cx="61" cy="344.39" r="4.5" fill="#8a6d0d"/><text x="74" y="350" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">McKeown (1976):</tspan> death rates since the late 18th century fell mainly through better</text><text x="74" y="372" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">living standards, especially nutrition</text><circle cx="61" cy="396.39" r="4.5" fill="#8a6d0d"/><text x="74" y="402" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Szreter:</tspan> McKeown underplayed public health such as clean water and sanitation</text>
