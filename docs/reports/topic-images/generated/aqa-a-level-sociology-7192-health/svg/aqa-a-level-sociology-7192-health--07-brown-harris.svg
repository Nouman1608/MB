<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 581" width="900" height="581" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="581" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Brown and Harris (1978): depression in Camberwell</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">a realist, structural explanation</text>
<rect x="30" y="104" width="380" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L395.75,105.25 Q408.75,105.25 408.75,118.25 L408.75,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="408.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Life events and difficulties</text><circle cx="49" cy="180.54" r="4.5" fill="#2e6b62"/><text x="62" y="186.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Severe life events, such as a</text><text x="62" y="208.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bereavement</text><circle cx="49" cy="232.54" r="4.5" fill="#2e6b62"/><text x="62" y="238.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Long-term difficulties</text><rect x="490" y="104" width="380" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M491.25,154 L491.25,118.25 Q491.25,105.25 504.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="491.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="680" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Vulnerability factors</text><circle cx="509" cy="180.54" r="4.5" fill="#2e6b62"/><text x="522" y="186.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No intimate, confiding relationship</text><circle cx="509" cy="210.54" r="4.5" fill="#2e6b62"/><text x="522" y="216.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No paid work outside the home</text><circle cx="509" cy="240.54" r="4.5" fill="#2e6b62"/><text x="522" y="246.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lost mother before age 11</text><circle cx="450" cy="187" r="24" fill="#1e2a44"/><text x="450" y="196" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">+</text><line x1="450" y1="278" x2="450" y2="320" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="290" y="328" width="320" height="58" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="365" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Depression</text><rect x="30" y="408" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,458 L31.25,422.25 Q31.25,409.25 44.25,409.25 L427.75,409.25 Q440.75,409.25 440.75,422.25 L440.75,458 Z" fill="#b5d3cf"/><line x1="31.25" y1="458" x2="440.75" y2="458" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="438.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Finding</text><text x="44" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Working-class women were much more likely to</text><text x="44" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">become depressed once a severe event had</text><text x="44" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">occurred.</text><rect x="458" y="408" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,458 L459.25,422.25 Q459.25,409.25 472.25,409.25 L855.75,409.25 Q868.75,409.25 868.75,422.25 L868.75,458 Z" fill="#f2e7b8"/><line x1="459.25" y1="458" x2="868.75" y2="458" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="438.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><text x="472" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Relied on recall of past events, and studied</text><text x="472" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women only.</text>
</svg>