<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why does health follow class?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">four explanations, plus a psychosocial one</text>
<rect x="30" y="120" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L427.75,121.25 Q440.75,121.25 440.75,134.25 L440.75,170 Z" fill="#ffffff"/><line x1="31.25" y1="170" x2="440.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Artefact</text><circle cx="64" cy="145" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="151.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="46" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The gap is a product of how class and death</text><text x="46" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">are measured.</text><rect x="458" y="120" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,170 L459.25,134.25 Q459.25,121.25 472.25,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#ffffff"/><line x1="459.25" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social selection</text><circle cx="492" cy="145" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="151.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="474" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ill people drift down the class scale.</text><rect x="30" y="264" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,314 L31.25,278.25 Q31.25,265.25 44.25,265.25 L427.75,265.25 Q440.75,265.25 440.75,278.25 L440.75,314 Z" fill="#f2e7b8"/><line x1="31.25" y1="314" x2="440.75" y2="314" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="295" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural / behavioural</text><circle cx="64" cy="289" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="295.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="46" y="347.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower classes smoke, drink and eat in less</text><text x="46" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">healthy ways. Risks blaming the victim.</text><rect x="458" y="264" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,314 L459.25,278.25 Q459.25,265.25 472.25,265.25 L855.75,265.25 Q868.75,265.25 868.75,278.25 L868.75,314 Z" fill="#b5d3cf"/><line x1="459.25" y1="314" x2="868.75" y2="314" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="295" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Material / structural</text><circle cx="492" cy="289" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="295.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="474" y="347.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Poverty, poor housing and hazardous work</text><text x="474" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cause ill health. Favoured by the Black</text><text x="474" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Report (1980) and Acheson (1998).</text><rect x="30" y="429" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="465" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Psychosocial: the Whitehall studies (Marmot)</text><text x="56" y="494" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lowest-grade civil servants had three times the death rate of the highest; risk factors</text><text x="56" y="516" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">explained only part. Low status and control cause harmful stress, which explains a</text><text x="56" y="538" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">gradient even among people who are not poor.</text>
</svg>