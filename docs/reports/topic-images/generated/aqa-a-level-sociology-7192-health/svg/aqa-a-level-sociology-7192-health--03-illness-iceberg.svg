<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 789" width="900" height="789" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="789" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The illness iceberg (Last, 1963)</text>

<rect x="30" y="250" width="840" height="360" fill="#b5d3cf"/><line x1="30" y1="250" x2="870" y2="250" stroke="#2e6b62" stroke-width="3"/><path d="M300,250 L370,150 L420,128 L470,160 L520,250 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M300,250 L520,250 L640,330 L690,450 L620,560 L420,590 L250,540 L170,420 L210,320 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7"/><text x="560" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reaches health services</text><text x="560" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the visible tip: recorded illness</text><line x1="555" y1="170" x2="505" y2="195" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="430" y="400" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Illness that never</text><text x="430" y="426" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">comes to the attention</text><text x="430" y="452" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">of health services</text><text x="860" y="276" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">water line</text><rect x="30" y="630" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="666" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it matters</text><text x="56" y="695" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Recorded illness is only the visible tip, so official health figures understate how much</text><text x="56" y="717" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">illness there is. Lay definitions (Blaxter and Paterson, 1982) shape who goes to a</text><text x="56" y="739" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">doctor.</text>
</svg>