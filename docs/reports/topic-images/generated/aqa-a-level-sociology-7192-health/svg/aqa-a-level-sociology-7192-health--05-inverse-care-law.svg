<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 669" width="900" height="669" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="669" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The inverse care law</text>

<rect x="30" y="110" width="840" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="420" x2="840" y2="420" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="140" x2="120" y2="420" stroke="#1e2a44" stroke-width="3"/><line x1="140" y1="170" x2="820" y2="380" stroke="#b5602e" stroke-width="6"/><line x1="140" y1="380" x2="820" y2="170" stroke="#2e6b62" stroke-width="6"/><text x="160" y="158" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Need for care</text><text x="820" y="158" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">Availability of good care</text><text x="120" y="450" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Most deprived areas</text><text x="840" y="450" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Least deprived areas</text><text x="450" y="478" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">schematic: no data plotted</text><rect x="30" y="510" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="546" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Tudor Hart (1971)</text><text x="56" y="575" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"The availability of good medical care tends to vary inversely with the need for it in</text><text x="56" y="597" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the population served." He said it works most fully under market forces, so without the</text><text x="56" y="619" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">free NHS (1948) the gap could be wider.</text>
</svg>