<rect width="900" height="641" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Parsons (1951): illness as deviance</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">functionalism</text>
<rect x="300" y="120" width="300" height="58" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="157" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">The sick role</text><line x1="330" y1="182" x2="230" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="182" x2="670" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="232" width="412" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,282 L31.25,246.25 Q31.25,233.25 44.25,233.25 L427.75,233.25 Q440.75,233.25 440.75,246.25 L440.75,282 Z" fill="#b5d3cf"/><line x1="31.25" y1="282" x2="440.75" y2="282" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="262.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Two rights</text><circle cx="49" cy="308.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="314.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Exemption from normal duties</text><circle cx="49" cy="338.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="344.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not being blamed for the illness</text><rect x="458" y="232" width="412" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,282 L459.25,246.25 Q459.25,233.25 472.25,233.25 L855.75,233.25 Q868.75,233.25 868.75,246.25 L868.75,282 Z" fill="#f2e7b8"/><line x1="459.25" y1="282" x2="868.75" y2="282" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="262.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Two obligations</text><circle cx="477" cy="308.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="314.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Wanting to get well</text><circle cx="477" cy="338.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="344.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Seeking technically competent help and</text><text x="490" y="366.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cooperating with it</text><rect x="30" y="404" width="840" height="54" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="438" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The doctor acts as gatekeeper to the sick role</text><rect x="30" y="474" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="510" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="533.39" r="4.5" fill="#8a6d0d"/><text x="74" y="539" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fits short, acute illness; fits chronic illness badly, as the person may never "get</text><text x="74" y="561" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">well"</text><circle cx="61" cy="585.39" r="4.5" fill="#8a6d0d"/><text x="74" y="591" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores stigmatised conditions where people are blamed (Goffman)</text>
</svg>