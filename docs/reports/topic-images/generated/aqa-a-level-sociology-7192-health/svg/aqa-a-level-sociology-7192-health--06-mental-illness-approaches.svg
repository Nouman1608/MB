<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 593" width="900" height="593" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="593" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What is mental illness?</text>

<rect x="30" y="104" width="404" height="312" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Realist approach</text><circle cx="53" cy="184.79" r="4.5" fill="#2e6b62"/><text x="66" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Real conditions causing genuine</text><text x="66" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">distress</text><circle cx="53" cy="236.79" r="4.5" fill="#2e6b62"/><text x="66" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Identifiable, often social, causes</text><circle cx="53" cy="266.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="272.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Brown and Harris (1978):</tspan> depression</text><text x="66" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">linked to life events and vulnerability</text><rect x="466" y="104" width="404" height="312" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Social constructionist approach</text><circle cx="489" cy="184.79" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What counts as illness reflects the</text><text x="502" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">judgements of those with power to</text><text x="502" y="234.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">define it</text><circle cx="489" cy="258.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Szasz (1961):</tspan> psychiatry turns</text><text x="502" y="286.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">difficulties of living into "illness"</text><circle cx="489" cy="310.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Scheff (1966):</tspan> a label can reinforce</text><text x="502" y="338.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the behaviour it describes</text><circle cx="489" cy="362.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="368.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Goffman (1961):</tspan> total institutions</text><text x="502" y="390.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">strip away the former self</text><circle cx="450" cy="260" r="24" fill="#1e2a44"/><text x="450" y="267" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="434" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="470" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use with care</text><text x="56" y="499" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rosenhan (1973) reported "pseudopatients" admitted to hospital, but Cahalan (2019) found</text><text x="56" y="521" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">inconsistent data and misleading descriptions. Labelling explains the effect of</text><text x="56" y="543" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">diagnosis, not the original behaviour.</text>
</svg>