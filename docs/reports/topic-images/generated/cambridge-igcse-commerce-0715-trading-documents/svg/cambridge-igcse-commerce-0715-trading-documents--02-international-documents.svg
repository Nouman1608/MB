<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four documents of international trade</text>

<rect x="30" y="110" width="410" height="255" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="410" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Certificate of origin</text><text x="50" y="190" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">What it is</text><text x="50" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">States the country where the goods were</text><text x="50" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">made</text><text x="50" y="278" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Why it is needed</text><text x="50" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Customs decide what duty applies and</text><text x="50" y="323" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">whether goods may enter</text><rect x="460" y="110" width="410" height="255" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="143" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Bill of lading</text><text x="480" y="190" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">What it is</text><text x="480" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Issued by the shipping company: receipt,</text><text x="480" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contract of carriage evidence</text><text x="480" y="278" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Why it is needed</text><text x="480" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The holder can claim the goods at the</text><text x="480" y="323" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">destination port</text><rect x="665" y="119" width="190" height="32" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="760" y="139.9" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">Document of title: YES</text><rect x="30" y="380" width="410" height="255" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="380" width="410" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="413" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Air waybill</text><text x="50" y="460" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">What it is</text><text x="50" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Issued by the airline: receipt, contract of</text><text x="50" y="505" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">carriage evidence</text><text x="50" y="548" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Why it is needed</text><text x="50" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Goods arrive quickly and are released to</text><text x="50" y="593" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the named consignee</text><rect x="235" y="389" width="190" height="32" rx="14" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="330" y="409.9" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">Document of title: NO</text><rect x="460" y="380" width="410" height="255" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="380" width="410" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="413" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Documentary credit</text><text x="480" y="460" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">What it is</text><text x="480" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Importer’s bank promises to pay once agreed</text><text x="480" y="505" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">documents are presented</text><text x="480" y="548" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Why it is needed</text><text x="480" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reduces the risk of non-payment</text><text x="450" y="680" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Sea journeys are long and goods may be sold at sea, so only the bill of lading carries title.</text>
</svg>