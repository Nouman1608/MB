<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dalia’s chairs: the figures on each document</text>

<rect x="30" y="110" width="620" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="14" height="124" rx="4" fill="#f2e7b8" stroke="#f2e7b8" stroke-width="2.5"/><text x="60" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Invoice</text><text x="60" y="168" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">20 chairs at $45</text><text x="630" y="168" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="end">900.00</text><text x="60" y="194" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Less trade discount 20% (0.20 × 900)</text><text x="630" y="194" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="end">− 180.00</text><text x="60" y="220" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Invoice total</text><text x="630" y="220" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">720.00</text><line x1="60" y1="202" x2="630" y2="202" stroke="#c9d6d4" stroke-width="1.5"/><rect x="680" y="142" width="190" height="60" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="775" y="177.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Owed: $720.00</text><line x1="775" y1="206" x2="775" y2="276" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="248" width="620" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="248" width="14" height="124" rx="4" fill="#f3d9c8" stroke="#f3d9c8" stroke-width="2.5"/><text x="60" y="278" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Credit note</text><text x="60" y="306" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2 damaged chairs: 2 × 45</text><text x="630" y="306" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="end">90.00</text><text x="60" y="332" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Less trade discount 20%</text><text x="630" y="332" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="end">− 18.00</text><text x="60" y="358" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Credit note value</text><text x="630" y="358" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">72.00</text><line x1="60" y1="340" x2="630" y2="340" stroke="#c9d6d4" stroke-width="1.5"/><rect x="680" y="280" width="190" height="60" rx="14" fill="#f3d9c8" stroke="#1e2a44" stroke-width="2.5"/><text x="775" y="315.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Owed: $648.00</text><line x1="775" y1="344" x2="775" y2="414" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="386" width="620" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="386" width="14" height="124" rx="4" fill="#dce9e7" stroke="#dce9e7" stroke-width="2.5"/><text x="60" y="416" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Statement of account</text><text x="60" y="444" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">3rd  Invoice (debit)</text><text x="630" y="444" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="end">720.00</text><text x="60" y="470" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">9th  Credit note (credit)</text><text x="630" y="470" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="end">− 72.00</text><text x="60" y="496" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Balance owed</text><text x="630" y="496" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">648.00</text><line x1="60" y1="478" x2="630" y2="478" stroke="#c9d6d4" stroke-width="1.5"/><rect x="680" y="418" width="190" height="60" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="775" y="453.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Owed: $648.00</text><line x1="775" y1="482" x2="775" y2="552" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="524" width="620" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="524" width="14" height="124" rx="4" fill="#d4b02e" stroke="#d4b02e" stroke-width="2.5"/><text x="60" y="554" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Payment within 14 days</text><text x="60" y="582" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Balance</text><text x="630" y="582" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="end">648.00</text><text x="60" y="608" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Less cash discount 5% (0.05 × 648)</text><text x="630" y="608" font-size="16" font-weight="500" fill="#1e2a44" text-anchor="end">− 32.40</text><text x="60" y="634" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Dalia pays</text><text x="630" y="634" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">615.60</text><line x1="60" y1="616" x2="630" y2="616" stroke="#c9d6d4" stroke-width="1.5"/><rect x="680" y="556" width="190" height="60" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="775" y="591.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Then: receipt</text><rect x="30" y="666" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="698" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Trade discount: on the invoice, because Dalia buys as a business.</text><text x="54" y="724" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cash discount: only if she pays within 14 days.</text><text x="54" y="750" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Credit note: also net of trade discount, as she was never charged the full $45.</text>
