<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From browsing to receiving an online order</text>

<rect x="30" y="110" width="410" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="152" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="159.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="100" y="159" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Browse</text><line x1="66" y1="174" x2="66" y2="230" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="210" width="410" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="66" cy="252" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="259.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="100" y="259" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Select: add to basket</text><line x1="66" y1="274" x2="66" y2="330" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="310" width="410" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="352" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="359.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="100" y="359" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Log in, create account or guest</text><line x1="66" y1="374" x2="66" y2="430" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="410" width="410" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="452" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="459.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="100" y="459" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Enter delivery details</text><rect x="460" y="110" width="410" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="496" cy="152" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="496" y="159.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="530" y="159" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Pay securely</text><line x1="496" y1="174" x2="496" y2="230" stroke="#1e2a44" stroke-width="2.5"/><rect x="460" y="210" width="410" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="496" cy="252" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="496" y="259.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="530" y="259" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Order confirmation email</text><line x1="496" y1="274" x2="496" y2="330" stroke="#1e2a44" stroke-width="2.5"/><rect x="460" y="310" width="410" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="496" cy="352" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="496" y="359.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="530" y="346" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Dispatch notification and</text><text x="530" y="370" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">tracking</text><line x1="496" y1="374" x2="496" y2="430" stroke="#1e2a44" stroke-width="2.5"/><rect x="460" y="410" width="410" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="496" cy="452" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="496" y="459.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="530" y="459" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Receive the order</text><rect x="30" y="520" width="840" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="554" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Each stage replaces a paper document</text><text x="54" y="584" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Basket and checkout → the order</text><text x="54" y="610" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Confirmation email → the receipt</text><text x="470" y="584" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tracking and electronic proof of</text><text x="470" y="610" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">delivery → the signed delivery note</text>
</svg>