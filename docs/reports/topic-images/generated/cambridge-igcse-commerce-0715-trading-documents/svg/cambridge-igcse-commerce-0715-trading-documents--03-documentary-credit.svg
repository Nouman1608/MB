<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How documentary credit protects the exporter</text>

<rect x="20" y="110" width="200" height="52" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="141.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Exporter</text><line x1="120" y1="162" x2="120" y2="590" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="7 6"/><rect x="240" y="110" width="200" height="52" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="340" y="141.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Shipping company</text><line x1="340" y1="162" x2="340" y2="590" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="7 6"/><rect x="460" y="110" width="200" height="52" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="560" y="141.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Importer’s bank</text><line x1="560" y1="162" x2="560" y2="590" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="7 6"/><rect x="680" y="110" width="200" height="52" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="141.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Importer (buyer)</text><line x1="780" y1="162" x2="780" y2="590" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="7 6"/><line x1="556" y1="214" x2="128" y2="214" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><circle cx="142" cy="196" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="142" y="200.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="162" y="203" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">promises to pay once documents are presented</text><line x1="124" y1="268" x2="332" y2="268" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="142" cy="250" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="142" y="254.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="162" y="257" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">ships the goods</text><line x1="336" y1="322" x2="128" y2="322" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="142" cy="304" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="142" y="308.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="162" y="311" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">bill of lading</text><line x1="124" y1="376" x2="552" y2="376" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="142" cy="358" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="142" y="362.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="162" y="365" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">presents the agreed documents</text><line x1="556" y1="430" x2="128" y2="430" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><circle cx="142" cy="412" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="142" y="416.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="162" y="419" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">pays the exporter</text><line x1="564" y1="484" x2="772" y2="484" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="582" cy="466" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="582" y="470.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="602" y="473" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">bill of lading passed to the buyer</text><line x1="776" y1="538" x2="348" y2="538" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="362" cy="520" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="362" y="524.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="382" y="527" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">claims the goods at the port</text><rect x="30" y="610" width="840" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="649" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">The exporter relies on a bank, not only on an unknown buyer abroad.</text>
</svg>