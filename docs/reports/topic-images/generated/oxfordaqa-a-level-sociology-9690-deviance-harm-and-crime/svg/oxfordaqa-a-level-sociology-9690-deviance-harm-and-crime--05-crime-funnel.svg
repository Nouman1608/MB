<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 677" width="900" height="677" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="677" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The crime funnel</text>

<path d="M30,110 L610,110 L585,172 L55,172 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="320" y="148" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Act takes place</text><path d="M55,178 L585,178 L560,240 L80,240 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="320" y="216" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Noticed</text><line x1="593" y1="176" x2="640" y2="176" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><path d="M80,246 L560,246 L535,308 L105,308 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="320" y="284" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Recognised as a crime</text><line x1="568" y1="244" x2="640" y2="244" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><path d="M105,314 L535,314 L510,376 L130,376 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="320" y="352" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reported</text><line x1="543" y1="312" x2="640" y2="312" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><path d="M130,382 L510,382 L485,444 L155,444 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="320" y="420" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Recorded by the police</text><line x1="518" y1="380" x2="640" y2="380" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><path d="M155,450 L485,450 L460,512 L180,512 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="320" y="488" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Arrest, charge, conviction</text><line x1="493" y1="448" x2="640" y2="448" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="650" y="160" width="220" height="298" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="760" y="210" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Crime drops out at</text><text x="760" y="234" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">every stage</text><text x="760" y="300" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">The dark figure:</text><text x="760" y="324" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">unrecorded crime</text><rect x="30" y="532" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="568" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two readings of the statistics</text><circle cx="61" cy="591.39" r="4.5" fill="#8a6d0d"/><text x="74" y="597" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Interactionists (Cicourel):</tspan> socially constructed by police and court decisions</text><circle cx="61" cy="621.39" r="4.5" fill="#8a6d0d"/><text x="74" y="627" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Positivists:</tspan> useful, if imperfect, indicators</text>
</svg>