<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" width="900" height="536" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="536" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why crime is socially constructed</text>

<rect x="30" y="104" width="269.3333333333333" height="291" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Labelling</text><circle cx="64" cy="129" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="135.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Becker (1963),</text><text x="46" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">interactionist</text><circle cx="51" cy="231.92" r="4.5" fill="#2e6b62"/><text x="64" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deviance is not a quality</text><text x="64" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of the act but the result</text><text x="64" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of others applying rules</text><circle cx="51" cy="302.92" r="4.5" fill="#2e6b62"/><text x="64" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Moral entrepreneurs</text><text x="64" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">campaign for new rules</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="291" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Moral panics</text><circle cx="349.3333333333333" cy="129" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="349.3333333333333" y="135.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Cohen (1972); Hall et al.</text><text x="331.3333333333333" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">(1978)</text><circle cx="336.3333333333333" cy="231.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Media exaggeration creates</text><text x="349.3333333333333" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alarm and calls for</text><text x="349.3333333333333" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tougher laws</text><circle cx="336.3333333333333" cy="302.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hall: the 1970s "mugging"</text><text x="349.3333333333333" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">panic racialised street</text><text x="349.3333333333333" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crime and justified</text><text x="349.3333333333333" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">authoritarian policing</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="291" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Power and law</text><circle cx="634.6666666666666" cy="129" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="634.6666666666666" y="135.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Marxist</text><circle cx="621.6666666666666" cy="210.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Laws largely reflect</text><text x="634.6666666666666" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ruling-class interests</text><circle cx="621.6666666666666" cy="260.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Property offences policed</text><text x="634.6666666666666" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intensively; harmful</text><text x="634.6666666666666" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">business practices lightly</text><text x="634.6666666666666" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regulated</text><rect x="30" y="411" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="447" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Durkheim: deviance is normal and functional</text><text x="56" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reactions to it clarify the boundaries of acceptable behaviour, and it can be the first</text><text x="56" y="498" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">step towards social change.</text>
</svg>