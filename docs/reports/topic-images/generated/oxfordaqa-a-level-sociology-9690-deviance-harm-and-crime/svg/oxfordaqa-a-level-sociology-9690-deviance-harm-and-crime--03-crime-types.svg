<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eight types of crime</text>

<rect x="30" y="104" width="198" height="206" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,174 L31.25,118.25 Q31.25,105.25 44.25,105.25 L213.75,105.25 Q226.75,105.25 226.75,118.25 L226.75,174 Z" fill="#b5d3cf"/><line x1="31.25" y1="174" x2="226.75" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="129" y="132.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Violent and</text><text x="129" y="156.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">property</text><text x="46" y="206.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Dominate police</text><text x="46" y="226.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">records and media;</text><text x="46" y="246.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">shape the image of</text><text x="46" y="266.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the "typical</text><text x="46" y="286.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">criminal".</text><rect x="244" y="104" width="198" height="206" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M245.25,174 L245.25,118.25 Q245.25,105.25 258.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,174 Z" fill="#f2e7b8"/><line x1="245.25" y1="174" x2="440.75" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="343" y="144.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">White-collar</text><text x="260" y="206.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sutherland (1939):</text><text x="260" y="226.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">high-status people at</text><text x="260" y="246.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">work. Challenges</text><text x="260" y="266.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">links between crime</text><text x="260" y="286.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and poverty.</text><rect x="458" y="104" width="198" height="206" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,174 L459.25,118.25 Q459.25,105.25 472.25,105.25 L641.75,105.25 Q654.75,105.25 654.75,118.25 L654.75,174 Z" fill="#f2e7b8"/><line x1="459.25" y1="174" x2="654.75" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="144.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Corporate</text><text x="474" y="206.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">By or for</text><text x="474" y="226.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">organisations. Bhopal</text><text x="474" y="246.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1984). Box (1983):</text><text x="474" y="266.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">more death and injury</text><text x="474" y="286.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">than street crime.</text><rect x="672" y="104" width="198" height="206" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M673.25,174 L673.25,118.25 Q673.25,105.25 686.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,174 Z" fill="#f2e7b8"/><line x1="673.25" y1="174" x2="868.75" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="771" y="144.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">State</text><text x="688" y="206.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">By governments or</text><text x="688" y="226.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">state agencies. Green</text><text x="688" y="246.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and Ward (2004):</text><text x="688" y="266.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">human rights</text><text x="688" y="286.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">violations.</text><rect x="30" y="326" width="198" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,376 L31.25,340.25 Q31.25,327.25 44.25,327.25 L213.75,327.25 Q226.75,327.25 226.75,340.25 L226.75,376 Z" fill="#dce9e7"/><line x1="31.25" y1="376" x2="226.75" y2="376" stroke="#c9d6d4" stroke-width="2"/><text x="129" y="356.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Green</text><text x="46" y="408.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Harm to the</text><text x="46" y="428.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">environment and other</text><text x="46" y="448.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">species: illegal</text><text x="46" y="468.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">logging, toxic</text><text x="46" y="488.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dumping.</text><rect x="244" y="326" width="198" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M245.25,376 L245.25,340.25 Q245.25,327.25 258.25,327.25 L427.75,327.25 Q440.75,327.25 440.75,340.25 L440.75,376 Z" fill="#dce9e7"/><line x1="245.25" y1="376" x2="440.75" y2="376" stroke="#c9d6d4" stroke-width="2"/><text x="343" y="356.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">"Victimless"</text><text x="260" y="408.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Consensual offences</text><text x="260" y="428.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">such as some drug use</text><text x="260" y="448.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">or gambling; the</text><text x="260" y="468.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">victim is disputed.</text><rect x="458" y="326" width="198" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,376 L459.25,340.25 Q459.25,327.25 472.25,327.25 L641.75,327.25 Q654.75,327.25 654.75,340.25 L654.75,376 Z" fill="#dce9e7"/><line x1="459.25" y1="376" x2="654.75" y2="376" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="356.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cyber</text><text x="474" y="408.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Fraud, hacking,</text><text x="474" y="428.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ransomware, online</text><text x="474" y="448.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">abuse; crosses</text><text x="474" y="468.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">borders.</text><rect x="672" y="326" width="198" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M673.25,376 L673.25,340.25 Q673.25,327.25 686.25,327.25 L855.75,327.25 Q868.75,327.25 868.75,340.25 L868.75,376 Z" fill="#d4b02e"/><line x1="673.25" y1="376" x2="868.75" y2="376" stroke="#c9d6d4" stroke-width="2"/><text x="771" y="356.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Do not confuse</text><text x="688" y="408.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">White-collar:</text><text x="688" y="428.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">individual, personal</text><text x="688" y="448.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">gain at work.</text><text x="688" y="468.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Corporate: for the</text><text x="688" y="488.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">organisation.</text>
</svg>