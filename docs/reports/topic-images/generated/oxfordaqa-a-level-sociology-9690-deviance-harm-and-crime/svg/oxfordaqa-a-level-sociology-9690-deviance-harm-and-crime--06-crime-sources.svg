<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 567" width="900" height="567" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="567" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways to measure crime</text>

<rect x="258" y="104" width="302" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="409" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Best used for</text><rect x="568" y="104" width="302" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="719" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Main problem</text><rect x="30" y="156" width="220" height="96" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="198.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Official / police</text><text x="42" y="220.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">statistics</text><rect x="258" y="156" width="302" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="272" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Trends in serious, reported</text><text x="272" y="209.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">crime; workload of the justice</text><text x="272" y="231.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">system</text><rect x="568" y="156" width="302" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="582" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reflect reporting, police</text><text x="582" y="209.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">priorities and counting rules</text><rect x="30" y="260" width="220" height="96" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="313.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Victim surveys</text><rect x="258" y="260" width="302" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="272" y="291.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unreported crime against</text><text x="272" y="313.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">individuals and households</text><rect x="568" y="260" width="302" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="582" y="291.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Miss crimes with no individual</text><text x="582" y="313.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">victim, or where victims are</text><text x="582" y="335.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unaware</text><rect x="30" y="364" width="220" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="406.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Self-report studies</text><rect x="258" y="364" width="302" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="272" y="395.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hidden offending, especially</text><text x="272" y="417.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">among groups rarely arrested</text><rect x="568" y="364" width="302" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="582" y="395.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Honesty, memory and a focus on</text><text x="582" y="417.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">minor offences</text><rect x="30" y="454" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Strongest answers</text><text x="56" y="519" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Compare sources rather than dismissing one.</text>
</svg>