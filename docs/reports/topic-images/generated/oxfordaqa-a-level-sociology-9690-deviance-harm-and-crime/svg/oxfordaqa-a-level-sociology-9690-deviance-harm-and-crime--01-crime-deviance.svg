<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 759" width="900" height="759" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="759" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Crime and deviance are not the same</text>

<circle cx="340" cy="370" r="200" fill="#b5d3cf" fill-opacity="0.75" stroke="#1e2a44" stroke-width="3"/><circle cx="560" cy="370" r="200" fill="#f2e7b8" fill-opacity="0.8" stroke="#1e2a44" stroke-width="3"/><text x="150" y="132" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Deviance</text><text x="150" y="156" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">breaks social norms</text><text x="750" y="132" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Crime</text><text x="750" y="156" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">breaks the criminal law</text><text x="245" y="340" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Deviant but not</text><text x="245" y="362" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">criminal</text><text x="245" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">rudeness, unusual</text><text x="245" y="411" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">dress</text><text x="450" y="355" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Deviant and</text><text x="450" y="377" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">criminal</text><text x="658" y="340" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Criminal but not</text><text x="658" y="362" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">seen as deviant</text><text x="658" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">minor speeding in</text><text x="658" y="433" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">many places</text><rect x="30" y="600" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="636" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why the distinction matters</text><text x="56" y="665" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Who makes the rules decides what counts as crime. Laws differ between societies</text><text x="56" y="687" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(alcohol, gambling, dress, religious conversion) and change over time (drink-driving</text><text x="56" y="709" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">criminalised; new technologies create new offences).</text>
</svg>