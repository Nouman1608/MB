<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 898" width="900" height="898" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="898" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning the 20-mark answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">“The most harmful actions in society are not treated as crimes.”</text>
<rect x="30" y="120" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="168" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="175.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Introduction</text><text x="104" y="189.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Define crime (law-breaking) and social harm (serious harm, legal or not).</text><line x1="450" y1="220" x2="450" y2="256" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="262" width="840" height="118" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="321" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="328.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="301.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">For</text><text x="104" y="331.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Box on corporate harm; Bhopal; state crime and denial (Cohen, Green and Ward);</text><text x="104" y="353.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pollution within legal limits; zemiology on poverty and unsafe work.</text><line x1="450" y1="384" x2="450" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="426" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="496" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="503.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="465.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Against</text><text x="104" y="495.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Violent and sexual crimes are criminalised almost everywhere; many corporate and</text><text x="104" y="517.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">green acts have been criminalised; "harm" is hard to measure; left realists on</text><text x="104" y="539.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">street crime in poor communities.</text><line x1="450" y1="570" x2="450" y2="606" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="612" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="660" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="667.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="651.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Application</text><text x="104" y="681.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A named society: a recent industrial disaster or air-pollution policy.</text><line x1="450" y1="712" x2="450" y2="748" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="754" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="813" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="820.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="793.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="104" y="823.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The law captures visible individual harm but under-captures diffuse harm by</text><text x="104" y="845.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">powerful organisations.</text>
</svg>