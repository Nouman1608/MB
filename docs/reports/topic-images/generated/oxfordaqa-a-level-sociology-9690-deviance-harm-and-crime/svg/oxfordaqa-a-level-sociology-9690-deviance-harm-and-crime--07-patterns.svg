<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 729" width="900" height="729" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="729" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining patterns of crime</text>

<rect x="158" y="104" width="352" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="334" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Pattern</text><rect x="518" y="104" width="352" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="694" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Explanations</text><rect x="30" y="156" width="120" height="151" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="236.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gender</text><rect x="158" y="156" width="352" height="151" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Men commit most recorded crime,</text><text x="172" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">especially violence; women more often</text><text x="172" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">victims of domestic and sexual</text><text x="172" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">violence.</text><rect x="518" y="156" width="352" height="151" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="537" cy="180.92" r="4.5" fill="#2e6b62"/><text x="550" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Pollak (1950):</tspan> chivalry thesis</text><circle cx="537" cy="209.92" r="4.5" fill="#2e6b62"/><text x="550" y="215.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Heidensohn:</tspan> women more tightly</text><text x="550" y="236.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controlled</text><circle cx="537" cy="259.92" r="4.5" fill="#2e6b62"/><text x="550" y="265.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Messerschmidt:</tspan> crime "accomplishes"</text><text x="550" y="286.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">masculinity</text><rect x="30" y="315" width="120" height="143" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="380.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Social</text><text x="42" y="402.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">class</text><rect x="158" y="315" width="352" height="143" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="345.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Working class over-represented in</text><text x="172" y="366.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recorded crime and prisons.</text><rect x="518" y="315" width="352" height="143" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="537" cy="339.92" r="4.5" fill="#2e6b62"/><text x="550" y="345.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxists (Box):</tspan> crimes of the</text><text x="550" y="366.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">powerful under-policed</text><circle cx="537" cy="389.92" r="4.5" fill="#2e6b62"/><text x="550" y="395.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Lea and Young (1984):</tspan> relative</text><text x="550" y="416.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deprivation, marginalisation,</text><text x="550" y="437.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">subcultures</text><rect x="30" y="466" width="120" height="101" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="521.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Age</text><rect x="158" y="466" width="352" height="101" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="496.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Peaks in late teens and early</text><text x="172" y="517.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">twenties; young people often victims</text><text x="172" y="538.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">too.</text><rect x="518" y="466" width="352" height="101" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="537" cy="490.92" r="4.5" fill="#2e6b62"/><text x="550" y="496.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Time in public spaces, peer</text><text x="550" y="517.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">influence, fewer adult commitments</text><circle cx="537" cy="540.9200000000001" r="4.5" fill="#2e6b62"/><text x="550" y="546.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More police attention to youth</text><rect x="30" y="575" width="120" height="122" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="641.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ethnicity</text><rect x="158" y="575" width="352" height="122" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="605.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some minorities over-represented in</text><text x="172" y="626.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">arrests and prisons in some societies;</text><text x="172" y="647.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hate crime.</text><rect x="518" y="575" width="352" height="122" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="537" cy="599.9200000000001" r="4.5" fill="#2e6b62"/><text x="550" y="605.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hall et al.:</tspan> discriminatory policing</text><text x="550" y="626.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and labelling</text><circle cx="537" cy="649.9200000000001" r="4.5" fill="#2e6b62"/><text x="550" y="655.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Left realists:</tspan> deprivation and</text><text x="550" y="676.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marginalisation</text>
</svg>