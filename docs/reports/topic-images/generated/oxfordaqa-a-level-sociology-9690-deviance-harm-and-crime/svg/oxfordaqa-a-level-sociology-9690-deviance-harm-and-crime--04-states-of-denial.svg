<rect width="900" height="420" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cohen (2001): how states deny atrocities</text>

<rect x="30" y="110" width="260" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="70" cy="152" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="159.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="105" y="159" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Literal denial</text><rect x="306" y="110" width="564" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="326" y="157.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"It didn’t happen."</text><rect x="30" y="208" width="260" height="84" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="70" cy="250" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="257.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="105" y="257" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Interpretive denial</text><rect x="306" y="208" width="564" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="326" y="255.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"It was something else."</text><rect x="30" y="306" width="260" height="88" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="70" cy="350" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="357.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="105" y="357" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Implicatory denial</text><rect x="306" y="306" width="564" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="326" y="343.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Accepts the facts but denies their moral implications:</text><text x="326" y="367.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">"it was necessary", "it is nothing to do with us".</text>
</svg>