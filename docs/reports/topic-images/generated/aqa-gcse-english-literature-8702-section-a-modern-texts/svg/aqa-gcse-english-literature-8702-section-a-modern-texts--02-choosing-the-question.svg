<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing between the two questions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Decide in a minute or two</text>
<rect x="40" y="129" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,150 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="110" width="776" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Can I argue something?</text><text x="108" y="169.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pick the question on which you have a clear view, not just knowledge.</text><rect x="40" y="219" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,240 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="200" width="776" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="230" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Can I cover the whole text?</text><text x="108" y="259.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">You need evidence from the beginning, middle and end.</text><rect x="40" y="320" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,341 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="290" width="776" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="320" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Do I have quotations for it?</text><text x="108" y="349.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A character you know well may be safer than a theme you understand but cannot quote</text><text x="108" y="371.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">on.</text><rect x="30" y="416" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="456" width="210" height="70" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="486" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Character</text><text x="165" y="510" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">question</text><line x1="278" y1="491" x2="350" y2="491" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="314" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">is also</text><rect x="358" y="456" width="210" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="463" y="486" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Theme</text><text x="463" y="510" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">question</text><text x="596" y="466" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A character is a construct</text><text x="596" y="488" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the writer uses to explore</text><text x="596" y="510" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ideas: say what ideas the</text><text x="596" y="532" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">character represents.</text>
</svg>