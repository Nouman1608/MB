<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plan by moment, not by plot</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The Birling family’s attitudes to responsibility</text>
<rect x="30" y="110" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARGUMENT IN ONE SENTENCE</text><text x="50" y="169.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The older Birlings refuse responsibility to the end; the younger</text><text x="50" y="194.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">generation begins to accept it, so change depends on the young.</text><line x1="102" y1="260" x2="102" y2="612" stroke="#c9d6d4" stroke-width="4"/><rect x="148" y="240" width="722" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="168" y="275.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Opening celebration</text><text x="168" y="304.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Birling’s confident speeches; the Titanic “unsinkable”: dramatic irony.</text><circle cx="102" cy="284.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="102" y="293.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="148" y="341" width="722" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="168" y="376.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Links to Eva Smith revealed in turn</text><text x="168" y="405.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The structure makes responsibility collective.</text><circle cx="102" cy="385.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="102" y="394.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="148" y="442" width="722" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="168" y="477.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sheila and Eric vs their parents</text><text x="168" y="506.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Changing responses compared with denial.</text><circle cx="102" cy="486.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="102" y="495.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="148" y="543" width="722" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="168" y="578.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The final telephone call</text><text x="168" y="607.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A circular ending: the lesson must be learned again.</text><circle cx="102" cy="587.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="102" y="596.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><path d="M76,602 L48,602 L48,270" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><line x1="48" y1="270" x2="74" y2="270" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="450" y="664" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Dashed loop: the circular ending returns to where the play began</text>
</svg>