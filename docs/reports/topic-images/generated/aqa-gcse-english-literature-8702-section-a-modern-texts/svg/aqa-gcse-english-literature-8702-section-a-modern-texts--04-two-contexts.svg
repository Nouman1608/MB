<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two contexts: set and written</text>

<line x1="60" y1="200" x2="840" y2="200" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="845" y="236" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">time</text><circle cx="200" cy="200" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="200" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">When it is set</text><text x="200" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">what the characters know</text><circle cx="680" cy="200" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="680" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">When it was written</text><text x="680" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">what the audience knows</text><path d="M215,230 Q440,280 665,230" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><text x="440" y="284" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">the gap is often deliberate</text><rect x="30" y="320" width="840" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="356" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example: An Inspector Calls</text><rect x="54" y="376" width="300" height="92" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="204" y="406" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Set in 1912</text><text x="204" y="432" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Birling calls the Titanic</text><text x="204" y="453" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">“unsinkable”</text><line x1="362" y1="422" x2="420" y2="422" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="428" y="376" width="418" height="92" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="637" y="406" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Written after the Second World War</text><text x="637" y="432" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A 1940s audience knew the ship had sunk:</text><text x="637" y="453" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">dramatic irony</text><text x="30" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Other relevant contexts:</text><rect x="250" y="510" width="72" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="286" y="531.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">class</text><rect x="332" y="510" width="81" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="372.5" y="531.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">gender</text><rect x="423" y="510" width="63" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="454.5" y="531.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">race</text><rect x="496" y="510" width="109" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="550.5" y="531.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">migration</text><rect x="615" y="510" width="100" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="531.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">identity</text><text x="30" y="568" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">…and the writer’s own known purposes, where well documented.</text><rect x="30" y="588" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="621.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use context to explain a choice, never to replace analysis. Ask: why would the writer want</text><text x="50" y="643.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">this audience, at this time, to see this?</text>
</svg>