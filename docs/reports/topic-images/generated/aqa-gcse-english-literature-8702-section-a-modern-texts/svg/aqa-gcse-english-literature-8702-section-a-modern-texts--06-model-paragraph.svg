<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Inside the model paragraph</text>

<line x1="62" y1="130" x2="62" y2="450" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="110" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">AO2 · dramatic method</text><text x="128" y="175.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Birling’s claim that the Titanic is “unsinkable” is dramatic irony: a 1940s</text><text x="128" y="197.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">audience knew the ship had sunk in 1912.</text><circle cx="62" cy="166" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="174.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="234" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">AO1 · interpretation</text><text x="128" y="299.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Making Birling wrong about something so famous encourages the audience to doubt</text><text x="128" y="321.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">his other confident claims.</text><circle cx="62" cy="290" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="298.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="358" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="394" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">AO3 · context of writing vs setting</text><text x="128" y="423.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Written after the Second World War, the play gives a hindsight the characters</text><text x="128" y="445.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">lack, exposing Birling’s selfish individualism.</text><circle cx="62" cy="414" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="422.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="488" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="524" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What the paragraph does</text><text x="50" y="553.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One word quoted, precise reference to events, a method explained, and context used to</text><text x="50" y="575.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">explain why Priestley made the choice.</text>
</svg>