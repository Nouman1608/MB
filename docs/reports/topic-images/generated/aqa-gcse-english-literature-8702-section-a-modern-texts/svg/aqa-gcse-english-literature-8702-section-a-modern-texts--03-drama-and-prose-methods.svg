<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which methods to analyse</text>

<rect x="30" y="110" width="408" height="310" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DRAMA</text><text x="50" y="170.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Analyse it as performance</text><text x="50" y="201.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="201.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Stage directions: lighting, set, sound,</text><text x="66.15" y="223.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">movement</text><text x="50" y="255.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="255.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Entrances, exits and interruptions</text><text x="50" y="287.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="287.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Dramatic irony</text><text x="50" y="319.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="319.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Dialogue: silences, register, the last</text><text x="66.15" y="341.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">word</text><text x="50" y="373.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="373.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Structure: acts, cliffhangers, time</text><text x="66.15" y="395.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">shifts, narrators</text><rect x="462" y="110" width="408" height="310" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PROSE</text><text x="482" y="170.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Analyse how the story is told</text><text x="482" y="201.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="498.15" y="201.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Narrator and viewpoint</text><text x="482" y="233.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="498.15" y="233.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Symbolism</text><text x="482" y="265.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="498.15" y="265.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Allegory</text><text x="482" y="297.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="498.15" y="297.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Structure: openings, endings, order,</text><text x="498.15" y="319.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">shape</text><text x="482" y="351.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="498.15" y="351.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Dialogue and voice: dialect, slang,</text><text x="498.15" y="373.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">register</text><rect x="30" y="438" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="471.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stage directions in modern plays are the writer’s own words, so they are fully analysable.</text>
</svg>