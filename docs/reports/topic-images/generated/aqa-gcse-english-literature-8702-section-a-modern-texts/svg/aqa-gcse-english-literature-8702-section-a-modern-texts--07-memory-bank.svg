<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A portable memory bank</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">No extract in the exam, so your evidence must travel</text>
<rect x="30" y="110" width="840" height="328" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">For each major character and theme</text><rect x="70" y="252" width="760" height="22" rx="11" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="304" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">beginning</text><text x="450" y="304" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">middle</text><text x="830" y="304" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">end</text><line x1="130.8" y1="248" x2="130.8" y2="228" stroke="#1e2a44" stroke-width="2"/><rect x="104.80000000000001" y="196" width="52" height="32" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="130.8" y="219" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“…”</text><line x1="298" y1="248" x2="298" y2="228" stroke="#1e2a44" stroke-width="2"/><rect x="272" y="196" width="52" height="32" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="298" y="219" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“…”</text><line x1="450" y1="248" x2="450" y2="228" stroke="#1e2a44" stroke-width="2"/><rect x="424" y="196" width="52" height="32" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="219" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“…”</text><line x1="617.1999999999999" y1="248" x2="617.1999999999999" y2="228" stroke="#1e2a44" stroke-width="2"/><rect x="591.1999999999999" y="196" width="52" height="32" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="617.1999999999999" y="219" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“…”</text><line x1="776.8000000000001" y1="248" x2="776.8000000000001" y2="228" stroke="#1e2a44" stroke-width="2"/><rect x="750.8000000000001" y="196" width="52" height="32" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="776.8000000000001" y="219" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“…”</text><text x="450" y="182" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">4–5 short quotations (2–5 words) spread across the text</text><rect x="50" y="326" width="256" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="178" y="362.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One sentence</text><text x="178" y="391.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">on how it changes</text><rect x="322" y="326" width="256" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="352.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One method</text><text x="450" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">per quotation: a word, an</text><text x="450" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">image, a stage direction</text><rect x="594" y="326" width="256" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="722" y="352.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One context link</text><text x="722" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">that genuinely explains</text><text x="722" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">something</text><rect x="30" y="456" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="489.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Can’t recall the exact words? A precise reference to an event is still valid evidence.</text>
</svg>