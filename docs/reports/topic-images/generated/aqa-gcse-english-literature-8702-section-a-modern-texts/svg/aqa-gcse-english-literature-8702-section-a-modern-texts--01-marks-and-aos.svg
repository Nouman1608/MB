<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the modern text question rewards</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">One essay from a choice of two, on the whole text, with no extract</text>
<rect x="30" y="126" width="296.47058823529414" height="74" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="178.23529411764707" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><text x="178.23529411764707" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">12 marks</text><rect x="326.47058823529414" y="126" width="296.47058823529414" height="74" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="474.7058823529412" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><text x="474.7058823529412" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">12 marks</text><rect x="622.9411764705883" y="126" width="148.23529411764707" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="697.0588235294118" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><text x="697.0588235294118" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">6 marks</text><rect x="771.1764705882354" y="126" width="98.82352941176471" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="820.5882352941177" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4</text><text x="820.5882352941177" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">4 marks</text><rect x="28" y="124" width="844" height="78" rx="6" fill="none" stroke="#1e2a44" stroke-width="3"/><path d="M30,214 L30,226 L767.1764705882354,226 L767.1764705882354,214" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="400.5882352941177" y="252" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">the question: 30 marks</text><path d="M775.1764705882354,214 L775.1764705882354,226 L870,226 L870,214" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="870" y="252" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="end">+ 4 for AO4</text><rect x="30" y="278" width="110" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="85" y="320" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><rect x="152" y="278" width="718" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="307.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A critical, informed personal response to the question, supported by</text><text x="170" y="330.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">references.</text><rect x="30" y="358" width="110" height="50" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="85" y="390" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><rect x="152" y="358" width="718" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="389" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Analysis of the writer’s language, form and structure.</text><rect x="30" y="418" width="110" height="50" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="85" y="450" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><rect x="152" y="418" width="718" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="449" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The relationship between the text and the contexts in which it was written.</text><rect x="30" y="478" width="110" height="70" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="85" y="520" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4</text><rect x="152" y="478" width="718" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="507.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A range of vocabulary and sentence structures, with accurate spelling and</text><text x="170" y="530.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">punctuation.</text><rect x="30" y="566" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="599.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marking is holistic against level descriptors. The bullet about “the ways he or she writes”</text><text x="50" y="621.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is a reminder that AO2 is required, not optional.</text>
</svg>