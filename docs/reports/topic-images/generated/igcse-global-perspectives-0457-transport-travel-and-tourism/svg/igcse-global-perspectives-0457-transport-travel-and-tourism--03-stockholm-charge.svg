<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 696" width="900" height="696" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="696" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stockholm’s charge: where you live shapes your view</text>

<rect x="30" y="120" width="250.66666666666666" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="164" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JAN–JULY 2006</text><text x="50" y="188.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Trial congestion</text><text x="50" y="210.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">charge</text><line x1="286.66666666666663" y1="183" x2="318.66666666666663" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="120" width="250.66666666666666" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="344.66666666666663" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEPTEMBER 2006</text><text x="344.66666666666663" y="177.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Referendums in the</text><text x="344.66666666666663" y="199.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">city and some</text><text x="344.66666666666663" y="221.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">surrounding areas</text><line x1="581.3333333333333" y1="183" x2="613.3333333333333" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="120" width="250.66666666666666" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="639.3333333333333" y="164" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AUGUST 2007</text><text x="639.3333333333333" y="188.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Charge becomes</text><text x="639.3333333333333" y="210.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">permanent</text><text x="30" y="302" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">City of Stockholm</text><rect x="300" y="270" width="296.8" height="48" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="596.8" y="270" width="263.2" height="48" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="448.4" y="301" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">53% yes</text><text x="30" y="372" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Surrounding areas</text><rect x="300" y="340" width="224" height="48" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="524" y="340" width="336" height="48" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="412" y="371" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">40% yes</text><text x="870" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">surrounding areas held their own votes: about 40% yes overall</text><rect x="30" y="430" width="408" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="475" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CITY RESIDENTS</text><text x="50" y="500.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gained quieter streets</text><rect x="462" y="430" width="408" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="463" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SURROUNDING AREAS</text><text x="482" y="488.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Many drove into the city and would</text><text x="482" y="512.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">pay</text><rect x="30" y="556" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="592" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judging the evidence</text><text x="50" y="621.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Trial evidence: traffic across the boundary fell by about 20–25%. A 2012 study of the first</text><text x="50" y="643.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">five years found the fall had lasted. Ask how long evidence was collected for.</text>
</svg>