<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="900" height="598" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="598" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When does tourism become overtourism?</text>

<line x1="80" y1="390" x2="840" y2="390" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="80" y1="390" x2="80" y2="130" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="830" y="418" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">number of visitors</text><text transform="translate(62,255) rotate(-90)" text-anchor="middle" font-size="16" fill="#4a5568">harm to residents and place</text><rect x="470" y="140" width="370" height="250" fill="#f2e7b8" opacity="0.7"/><path d="M80,380 C300,365 420,345 470,320 S700,180 820,150" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><line x1="470" y1="140" x2="470" y2="390" stroke="#1e2a44" stroke-width="3" stroke-dasharray="10 7"/><text x="458" y="166" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">carrying capacity</text><text x="660" y="280" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">OVERTOURISM</text><text x="660" y="304" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">residents’ lives or the place harmed</text><rect x="30" y="442" width="268" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="475" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUSTAINABLE TOURISM</text><text x="50" y="499.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Planned to protect</text><text x="50" y="521.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">environment and</text><text x="50" y="543.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">community long term</text><rect x="316" y="442" width="268" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336" y="475" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SHORT-TERM RENTAL</text><text x="336" y="499.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A home let to visitors</text><text x="336" y="521.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">by the night, often via</text><text x="336" y="543.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">an app</text><rect x="602" y="442" width="268" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="475" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MODAL SHIFT</text><text x="622" y="499.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Switching how you</text><text x="622" y="521.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">travel, such as car to</text><text x="622" y="543.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">bus</text>
</svg>