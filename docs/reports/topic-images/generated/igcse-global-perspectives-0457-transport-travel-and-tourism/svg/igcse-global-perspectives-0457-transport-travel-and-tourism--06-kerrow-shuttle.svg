<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 882" width="900" height="882" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="882" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two kinds of evidence about a shuttle bus</text>

<text x="30" y="124" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fictional Kerrow Island: summer-weekend cars on the causeway</text><line x1="40" y1="370" x2="480" y2="370" stroke="#1e2a44" stroke-width="3"/><rect x="90" y="190" width="140" height="180" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="180" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5,400</text><text x="160" y="396" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">before shuttle</text><rect x="290" y="235" width="140" height="135" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="360" y="225" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4,050</text><text x="360" y="396" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">after shuttle</text><text x="260" y="426" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">−25%: suggests some modal shift</text><rect x="510" y="140" width="360" height="156" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="530" y="173" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BUT</text><text x="530" y="198.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Were weather and visitor</text><text x="530" y="222.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">numbers similar both years?</text><text x="530" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">If not, other causes cannot be ruled</text><text x="530" y="271.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">out.</text><rect x="30" y="460" width="840" height="86" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="493" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FICTIONAL KERROW HOTELIERS’ ASSOCIATION</text><text x="50" y="520" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“Most visitors oppose the shuttle bus.”</text><rect x="40" y="568" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,579 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="564" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="592.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Only 45 of 300 members replied (15%)</text><rect x="40" y="624" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,635 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="620" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="648.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reported what guests said, not asked visitors directly</text><rect x="40" y="680" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,691 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="676" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="704.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vested interest: hotels with car parks may lose an advantage</text><rect x="30" y="740" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="776" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A better test</text><text x="50" y="805.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Survey a random sample of visitors at the ferry port on several days, with the same neutral</text><text x="50" y="827.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">question.</text>
</svg>