<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="534" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Overtourism in a historic town</text>

<rect x="30" y="104" width="408" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CAUSE</text><text x="50" y="161.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cheaper flights and cruise calls</text><text x="50" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">bring more short visits</text><rect x="462" y="104" width="408" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CAUSE</text><text x="482" y="161.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Social media makes a few spots</text><text x="482" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">famous, so crowds gather</text><line x1="235" y1="216" x2="420" y2="254" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="665" y1="216" x2="480" y2="254" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="274" width="170" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="306" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal</text><rect x="214" y="274" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="303.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A resident struggles through crowded streets to work.</text><rect x="30" y="334" width="170" height="50" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="366" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Local</text><rect x="214" y="334" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="363.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Homes become holiday lets; rents rise; families leave.</text><rect x="30" y="394" width="170" height="50" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="426" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">National</text><rect x="214" y="394" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="423.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tourism tax income rises, but so do cleaning and policing costs.</text><rect x="30" y="454" width="170" height="50" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="486" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Global</text><rect x="214" y="454" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="483.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More travel adds to emissions from aircraft and ships.</text>
</svg>