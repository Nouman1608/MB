<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judging national actions on travel</text>

<rect x="30" y="104" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FRANCE, MAY 2023</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ban on some domestic flights where a train takes under 2½ hours</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In practice three routes from Paris-Orly: Bordeaux, Nantes, Lyon. Connecting flights not covered.</text><rect x="30" y="234" width="408" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="267" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GOVERNMENT</text><text x="50" y="292.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Part of its climate law</text><text x="50" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wants its policy to look effective.</text><rect x="462" y="234" width="408" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="267" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">AIRLINES FOR EUROPE</text><text x="482" y="292.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Symbolic”: little effect on</text><text x="482" y="316.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">emissions</text><text x="482" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A vested interest in fewer restrictions.</text><rect x="30" y="387" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="420.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What would settle it: emissions from the three routes compared with all French flights, and</text><text x="50" y="442.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">whether passengers switched to trains.</text><text x="450" y="509" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Bhutan’s daily Sustainable Development Fee: an action adjusted after evidence</text><rect x="30" y="531" width="250.66666666666666" height="131" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155.33333333333331" y="568.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">$65</text><text x="155.33333333333331" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">before reopening</text><line x1="286.66666666666663" y1="596.5" x2="318.66666666666663" y2="596.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="531" width="250.66666666666666" height="131" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="449.99999999999994" y="568.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">$200</text><text x="449.99999999999994" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">from September 2022</text><line x1="581.3333333333333" y1="596.5" x2="613.3333333333333" y2="596.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="531" width="250.66666666666666" height="131" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="744.6666666666666" y="568.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">$100</text><text x="744.6666666666666" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">from 1 September 2023, for</text><text x="744.6666666666666" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">four years; visitor numbers</text><text x="744.6666666666666" y="638" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">had not recovered as hoped</text>
</svg>