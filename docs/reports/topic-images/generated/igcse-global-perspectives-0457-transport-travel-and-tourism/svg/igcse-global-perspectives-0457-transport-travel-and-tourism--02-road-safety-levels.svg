<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Road safety: from a school crossing to a global toll</text>

<circle cx="205" cy="292.5" r="170" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="292.5" r="113.33333333333333" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="292.5" r="56.666666666666664" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="205" y="298.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Local</text><text x="205" y="383.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">National</text><text x="205" y="440.16666666666663" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Global</text><path d="M236,293.5 C328,293.5 328,155.5 416,155.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="236" cy="293.5" r="4" fill="#1e2a44"/><path d="M249.8,378.5 C334.9,378.5 334.9,270.5 416,270.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="249.8" cy="378.5" r="4" fill="#1e2a44"/><path d="M240.6,435.16666666666663 C330.3,435.16666666666663 330.3,407.5 416,407.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="240.6" cy="435.16666666666663" r="4" fill="#1e2a44"/><rect x="420" y="104" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="135.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Local</text><text x="436" y="164.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Parents in the fictional town of Benmoor want a</text><text x="436" y="186.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">crossing outside the school.</text><rect x="420" y="219" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="250.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">National</text><text x="436" y="279.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Wider action such as speed limits and safety</text><text x="436" y="301.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rules for motorbikes.</text><rect x="420" y="334" width="450" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="365.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Global</text><text x="436" y="394.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">WHO 2023: about 1.19 million road deaths a</text><text x="436" y="416.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">year, down 5% since 2010; the leading cause of</text><text x="436" y="438.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">death for ages 5 to 29; nine in ten in low- and</text><text x="436" y="460.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">middle-income countries.</text><rect x="30" y="499" width="408" height="126" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="543" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="567.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">WHO gathers data from many</text><text x="50" y="589.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">governments</text><rect x="462" y="499" width="408" height="126" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="532" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATIONS</text><text x="482" y="556.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Countries record deaths differently,</text><text x="482" y="578.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">some under-report; it says nothing</text><text x="482" y="600.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">about which actions work</text>
</svg>