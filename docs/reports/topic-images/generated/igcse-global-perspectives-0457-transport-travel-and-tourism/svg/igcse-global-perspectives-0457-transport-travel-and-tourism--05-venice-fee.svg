<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 567" width="900" height="567" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="567" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Venice’s day-visitor fee: which problem does it fix?</text>

<rect x="30" y="104" width="395" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FROM 25 APRIL 2024</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">5 euros on 29 days</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Day-trippers only; overnight guests and</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">residents exempt.</text><line x1="431" y1="170.5" x2="469" y2="170.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="104" width="395" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="495" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2025</text><text x="495" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">54 days</text><text x="495" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">5 euros if booked at least four days ahead,</text><text x="495" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">10 euros later.</text><rect x="30" y="255" width="408" height="184" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SHORT-TERM PROBLEM</text><text x="50" y="314.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Crowding</text><text x="50" y="342.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fee aims to discourage visits at the</text><text x="65.2" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">busiest times</text><text x="50" y="389.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">And to gather better visitor data</text><rect x="462" y="255" width="408" height="184" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="288" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LONG-TERM PROBLEM</text><text x="482" y="314.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Residents leaving over housing</text><text x="482" y="339.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">costs</text><text x="482" y="367.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Protesters: “No to tickets, yes to</text><text x="497.2" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">services and housing”</text><text x="482" y="414.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The fee does not tackle this</text><rect x="30" y="457" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="490.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Separating two problems that are often merged is analysis: an action can fix one and miss</text><text x="50" y="512.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the other.</text>
</svg>