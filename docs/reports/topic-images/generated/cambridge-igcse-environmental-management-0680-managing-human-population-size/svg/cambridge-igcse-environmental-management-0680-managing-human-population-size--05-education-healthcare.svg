<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Education and healthcare: indirect routes</text>

<rect x="30" y="110" width="410" height="490" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Access to education</text><rect x="55" y="168" width="360" height="46" rx="23" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="197.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">girls stay in school longer</text><line x1="235" y1="218" x2="235" y2="244" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="55" y="250" width="360" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="75" y="280" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="91" y="280" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">marry later, start families later</text><text x="75" y="305" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="91" y="305" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">better job prospects</text><text x="75" y="330" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="91" y="330" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">know more about contraception and</text><text x="91" y="351" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">health</text><text x="75" y="376" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="91" y="376" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">more say in family decisions</text><line x1="235" y1="404" x2="235" y2="430" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="55" y="436" width="360" height="46" rx="23" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="465.12" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">lower fertility</text><text x="55" y="520" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Slow: the effect comes when</text><text x="55" y="543" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">today’s pupils become adults.</text><text x="55" y="566" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Example: Kerala, India.</text><rect x="460" y="110" width="410" height="490" rx="14" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Access to healthcare</text><rect x="485" y="168" width="360" height="46" rx="23" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="197.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">fewer children die</text><line x1="665" y1="218" x2="665" y2="244" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="485" y="250" width="360" height="150" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="505" y="284" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">parents no longer need extra</text><text x="505" y="308" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">children to ensure some survive</text><text x="505" y="332" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="505" y="356" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">clinics also deliver contraception</text><text x="505" y="380" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">and family planning advice</text><line x1="665" y1="404" x2="665" y2="430" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="485" y="436" width="360" height="46" rx="23" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="465.12" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">fertility falls</text><text x="485" y="520" font-size="16.5" font-weight="600" fill="#b5602e" text-anchor="start">But in the short term growth can</text><text x="485" y="543" font-size="16.5" font-weight="600" fill="#b5602e" text-anchor="start">RISE: deaths fall before births do.</text>
</svg>