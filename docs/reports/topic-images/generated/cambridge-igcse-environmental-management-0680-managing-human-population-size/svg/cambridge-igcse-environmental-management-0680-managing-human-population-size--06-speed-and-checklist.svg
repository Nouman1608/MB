<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How fast does each strategy work?</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><defs><linearGradient id="spd" x1="0" x2="1"><stop offset="0" stop-color="#2e6b62"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="70" y="286" width="760" height="28" rx="14" fill="url(#spd)" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="350" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">FAST</text><text x="830" y="350" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="end">SLOW</text><circle cx="140" cy="300" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="140" y1="286" x2="140" y2="250" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Control of</text><text x="140" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">migration</text><text x="140" y="196" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">works quickly</text><circle cx="330" cy="300" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="330" y1="314" x2="330" y2="372" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Anti-natalist</text><text x="330" y="418" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">policy</text><text x="330" y="442" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">can lower births quickly</text><circle cx="560" cy="300" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="560" y1="286" x2="560" y2="250" stroke="#1e2a44" stroke-width="2.5"/><text x="560" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pro-natalist</text><text x="560" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">policy</text><text x="560" y="196" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">extra births join the</text><text x="560" y="215" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">workforce after ~20 years</text><circle cx="740" cy="300" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="740" y1="314" x2="740" y2="372" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Access to</text><text x="740" y="418" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">education</text><text x="740" y="442" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">effect when pupils become</text><text x="740" y="461" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">adults</text><text x="450" y="550" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Other questions to ask of any strategy:</text><rect x="30" y="570" width="236" height="48" rx="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="148" y="599.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">voluntary or compulsory?</text><rect x="274" y="570" width="186" height="48" rx="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="367" y="599.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">what does it cost?</text><rect x="468" y="570" width="166" height="48" rx="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="551" y="599.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">side effects?</text><rect x="642" y="570" width="228" height="48" rx="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="756" y="599.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">does it suit the country?</text><text x="450" y="660" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Strategies work best together: education and healthcare reduce the desire</text><text x="450" y="684" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">for large families; contraception gives the means to act on it.</text>
</svg>