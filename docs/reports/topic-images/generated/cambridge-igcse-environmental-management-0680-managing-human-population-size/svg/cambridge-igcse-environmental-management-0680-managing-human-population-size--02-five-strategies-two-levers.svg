<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five strategies, two levers</text>

<rect x="540" y="140" width="330" height="300" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="180" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">BIRTHS</text><text x="705" y="206" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">children per woman</text><circle cx="645" cy="252.6" r="7.700000000000001" fill="#2e6b62"/><path d="M635.1,290 L635.1,272.4 Q635.1,262.5 645,262.5 Q654.9,262.5 654.9,272.4 L654.9,290 Z" fill="#2e6b62"/><circle cx="685" cy="252.6" r="7.700000000000001" fill="#2e6b62"/><path d="M675.1,290 L675.1,272.4 Q675.1,262.5 685,262.5 Q694.9,262.5 694.9,272.4 L694.9,290 Z" fill="#2e6b62"/><circle cx="725" cy="252.6" r="7.700000000000001" fill="#2e6b62"/><path d="M715.1,290 L715.1,272.4 Q715.1,262.5 725,262.5 Q734.9,262.5 734.9,272.4 L734.9,290 Z" fill="#2e6b62"/><circle cx="765" cy="252.6" r="7.700000000000001" fill="#2e6b62"/><path d="M755.1,290 L755.1,272.4 Q755.1,262.5 765,262.5 Q774.9,262.5 774.9,272.4 L774.9,290 Z" fill="#2e6b62"/><text x="705" y="340" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">four strategies act</text><text x="705" y="362" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">here, raising or</text><text x="705" y="384" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">lowering births</text><rect x="540" y="470" width="330" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="512" font-size="24" font-weight="700" fill="#8a6d0d" text-anchor="middle">MIGRATION</text><text x="705" y="545" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">who can enter and settle:</text><text x="705" y="567" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">raise or limit population</text><rect x="30" y="122" width="400" height="76" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><circle cx="64" cy="160" r="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="64" y="166.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text><text x="96" y="154" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Access to contraception</text><text x="96" y="178" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">means to choose family size</text><line x1="434" y1="160" x2="532" y2="190" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="207" width="400" height="76" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><circle cx="64" cy="245" r="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="64" y="251.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">b</text><text x="96" y="239" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Population policies</text><text x="96" y="263" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">pro-natalist or anti-natalist</text><line x1="434" y1="245" x2="532" y2="245" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="292" width="400" height="76" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><circle cx="64" cy="330" r="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="64" y="336.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">c</text><text x="96" y="324" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Access to education</text><text x="96" y="348" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">especially girls: later families</text><line x1="434" y1="330" x2="532" y2="330" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="377" width="400" height="76" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><circle cx="64" cy="415" r="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="64" y="421.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">d</text><text x="96" y="409" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Access to healthcare</text><text x="96" y="433" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">fewer child deaths, fewer births</text><line x1="434" y1="415" x2="532" y2="400" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="477" width="400" height="76" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="64" cy="515" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="521.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">e</text><text x="96" y="509" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Control of migration</text><text x="96" y="533" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">visas, permits, quotas, points</text><line x1="434" y1="515" x2="532" y2="540" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="630" width="840" height="56" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="9 6"/><text x="450" y="665" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Deaths: not a lever. No strategy aims to raise death rates.</text>
</svg>