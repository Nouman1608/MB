<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pro-natalist and anti-natalist policies</text>

<rect x="30" y="110" width="410" height="560" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="148" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="start">Pro-natalist</text><text x="54" y="174" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">encourages MORE children</text><text x="54" y="212" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Measures</text><text x="54" y="238" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">payments for each child</text><text x="54" y="262" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tax reductions for families</text><text x="54" y="286" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="286" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">paid parental leave</text><text x="54" y="310" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">subsidised childcare</text><text x="54" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing priority for larger families</text><rect x="50" y="362" width="370" height="56" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="64" y="385" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">Example: France, long-standing</text><text x="64" y="405" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">generous family benefits</text><text x="54" y="452" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Benefits</text><text x="54" y="478" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="478" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can slow population decline and ageing</text><text x="54" y="502" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="502" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">helps families with the costs of children</text><text x="54" y="532" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Limitations</text><text x="54" y="558" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="558" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">very expensive</text><text x="54" y="582" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="582" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">results often small: housing costs and</text><text x="70" y="603" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the wish to work also shape family size</text><text x="54" y="627" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="70" y="627" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">extra births take about 20 years to join</text><text x="70" y="648" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the workforce</text><rect x="460" y="110" width="410" height="560" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="484" y="148" font-size="23" font-weight="700" fill="#b5602e" text-anchor="start">Anti-natalist</text><text x="484" y="174" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">encourages or requires FEWER</text><text x="484" y="212" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Measures</text><text x="484" y="238" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">campaigns promoting small families</text><text x="484" y="262" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">incentives: better housing or schooling</text><text x="500" y="283" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for small families</text><text x="484" y="307" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="307" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">penalties for larger families</text><text x="484" y="331" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="331" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strictest case: legal limits</text><rect x="480" y="359" width="370" height="56" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="494" y="382" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">Example: China’s one-child policy,</text><text x="494" y="402" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">around 1980 to 2015</text><text x="484" y="449" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Benefits</text><text x="484" y="475" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="475" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can lower births quickly</text><text x="484" y="499" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="499" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reduces future pressure on resources</text><text x="484" y="529" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Limitations</text><text x="484" y="555" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="555" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strict limits raise ethical concerns</text><text x="500" y="576" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about freedom</text><text x="484" y="600" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">China: more males than females in younger</text><text x="500" y="621" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">groups, rapid ageing</text><text x="484" y="645" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500" y="645" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wealthier families may ignore incentives</text>
</svg>