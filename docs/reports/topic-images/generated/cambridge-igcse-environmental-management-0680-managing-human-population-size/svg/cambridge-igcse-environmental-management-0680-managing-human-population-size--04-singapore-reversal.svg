<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" width="900" height="535" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="535" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Singapore: a policy reversed</text>

<rect x="30" y="110" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="60" y1="270" x2="850" y2="270" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="850" y="256" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">time</text><circle cx="180" cy="270" r="14" fill="#ffffff" stroke="#b5602e" stroke-width="4"/><text x="180" y="236" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">1970s</text><text x="180" y="316" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stop at Two campaign</text><text x="180" y="340" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">aim: lower births</text><circle cx="450" cy="270" r="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="4"/><text x="450" y="236" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">then</text><text x="450" y="316" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">fertility falls very low</text><text x="450" y="340" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">the opposite problem</text><circle cx="720" cy="270" r="14" fill="#ffffff" stroke="#2e6b62" stroke-width="4"/><text x="720" y="236" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">late 1980s</text><text x="720" y="316" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">switch to measures</text><text x="720" y="340" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">encouraging larger families</text><text x="180" y="170" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">anti-natalist</text><text x="720" y="170" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">pro-natalist</text><path d="M250,175 Q450,120 640,170" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)" stroke-dasharray="8 6"/><text x="450" y="140" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">policy reversed</text><text x="840" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Singapore</text><rect x="30" y="420" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="458" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A successful anti-natalist policy can create the opposite</text><text x="450" y="486" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">problem a generation later. Policies can be reversed.</text>
</svg>