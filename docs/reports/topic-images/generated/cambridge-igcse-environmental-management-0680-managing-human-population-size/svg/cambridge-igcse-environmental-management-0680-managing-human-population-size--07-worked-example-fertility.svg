<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: did the programme work?</text>

<rect x="30" y="110" width="520" height="510" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="540" x2="520" y2="540" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="540" x2="120" y2="168" stroke="#1e2a44" stroke-width="3"/><line x1="112" y1="540" x2="120" y2="540" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="546" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="112" y1="478" x2="120" y2="478" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">1</text><line x1="112" y1="416" x2="120" y2="416" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="422" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">2</text><line x1="112" y1="354" x2="120" y2="354" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">3</text><line x1="112" y1="292" x2="120" y2="292" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="298" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">4</text><line x1="112" y1="230" x2="120" y2="230" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">5</text><line x1="112" y1="168" x2="120" y2="168" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="174" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">6</text><text x="62" y="330" font-size="16" fill="#4a5568" text-anchor="middle" transform="rotate(-90 62 330)">children per woman</text><rect x="170" y="217.59999999999997" width="110" height="322.40000000000003" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="205.59999999999997" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5.2</text><text x="225" y="568" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">Before</text><rect x="360" y="347.79999999999995" width="110" height="192.20000000000002" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="415" y="335.79999999999995" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3.1</text><text x="415" y="568" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">15 years later</text><line x1="120" y1="409.79999999999995" x2="520" y2="409.79999999999995" stroke="#b5602e" stroke-width="3" stroke-dasharray="10 7"/><rect x="301.4" y="385.07499999999993" width="216.6" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="512" y="399.79999999999995" font-size="15.5" font-weight="700" fill="#b5602e" text-anchor="end">about 2.1: replacement</text><text x="530" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented data</text><rect x="570" y="110" width="300" height="510" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="592" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Calculation</text><text x="592" y="186" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">Fall = 5.2 − 3.1</text><text x="592" y="211" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">= 2.1 children per woman</text><text x="592" y="236" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="592" y="261" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">% fall = 2.1 ÷ 5.2 × 100</text><text x="592" y="286" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">= 40.4%</text><rect x="590" y="320" width="262" height="120" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="606" y="350" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">3.1 is still above about</text><text x="606" y="372" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">2.1, so the population</text><text x="606" y="394" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">keeps growing, but more</text><text x="606" y="416" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="start">slowly.</text><text x="592" y="480" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Limitation: urbanisation or</text><text x="592" y="501" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rising incomes may also have</text><text x="592" y="522" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lowered fertility, so the</text><text x="592" y="543" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">programme cannot take all the</text><text x="592" y="564" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">credit.</text>
</svg>