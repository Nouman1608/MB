<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two opposite population problems</text>

<rect x="30" y="110" width="400" height="420" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="230" y="150" font-size="23" font-weight="700" fill="#b5602e" text-anchor="middle">Rapid growth</text><text x="230" y="176" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">many births</text><rect x="50" y="196" width="360" height="105" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="68" y="229.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The problem</text><text x="68" y="254.875" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Pressure on food, water, housing,</text><text x="68" y="276.655" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">schools, jobs and the environment.</text><line x1="230" y1="306" x2="230" y2="338" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="50" y="344" width="360" height="70" rx="14" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><text x="230" y="387" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Aim: slow growth</text><text x="230" y="448" font-size="16.5" font-weight="700" fill="#4a5568" text-anchor="middle">Possible tools</text><text x="230" y="474" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">anti-natalist policy, contraception,</text><text x="230" y="496" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">education, healthcare</text><rect x="470" y="110" width="400" height="420" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="150" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="middle">Low fertility and ageing</text><text x="670" y="176" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">few births, many elderly</text><rect x="490" y="196" width="360" height="105" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="508" y="229.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The problem</text><text x="508" y="254.875" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer workers to support pensions and</text><text x="508" y="276.655" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">healthcare for the elderly.</text><line x1="670" y1="306" x2="670" y2="338" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="490" y="344" width="360" height="70" rx="14" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="387" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Aim: more births or immigrants</text><text x="670" y="448" font-size="16.5" font-weight="700" fill="#4a5568" text-anchor="middle">Possible tools</text><text x="670" y="474" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">pro-natalist policy,</text><text x="670" y="496" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">encouraging working-age immigrants</text><rect x="30" y="550" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="586" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Every strategy works by changing births or migration.</text><text x="450" y="612" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">None aims to raise deaths: never offer death rates as a management tool.</text>
</svg>