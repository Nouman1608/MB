<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 678" width="900" height="678" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="678" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing the thesis against the evidence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1 (invented evidence)</text>
<rect x="30" y="122" width="840" height="50" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="154.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Original thesis: <tspan font-weight="700">“Schools</tspan> <tspan font-weight="700">should</tspan> <tspan font-weight="700">end</tspan> <tspan font-weight="700">homework.”</tspan></text><rect x="30" y="192" width="60" height="50" rx="10" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="60" y="224" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">E1</text><rect x="100" y="192" width="470" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="112" y="221.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Maths: short, regular practice improved pupils more</text><rect x="590" y="197" width="280" height="40" rx="20" fill="#f6e3d8" stroke="#b5602e" stroke-width="2" /><text x="730" y="223" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">contradicts</text><rect x="30" y="252" width="60" height="50" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="60" y="284" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">E2</text><rect x="100" y="252" width="470" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="112" y="281.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Over 90 minutes a night: markedly less sleep</text><rect x="590" y="257" width="280" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="730" y="283" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">supports a claim about excess</text><rect x="30" y="312" width="60" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="60" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">E3</text><rect x="100" y="312" width="470" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="112" y="341.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">No homework under eleven: no fall in results</text><rect x="590" y="317" width="280" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="730" y="343" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">supports for young children</text><rect x="30" y="382" width="840" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="48" y="416" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Revised thesis (narrow + condition)</text><text x="48" y="444" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Schools should end homework for children under eleven and, for older students, limit it to short,</text><text x="48" y="465.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">regular practice, because the evidence suggests that long homework costs sleep while brief practice</text><text x="48" y="486.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">appears to help in subjects such as mathematics.”</text><text x="30" y="532" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">New line of reasoning</text><rect x="30" y="546" width="270.6666666666667" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="165.33333333333334" y="580" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">¶1 E2</text><text x="165.33333333333334" y="607.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">long homework costs sleep</text><rect x="314.6666666666667" y="546" width="270.6666666666667" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="580" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">¶2 E3</text><text x="450" y="607.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">young children lose nothing</text><rect x="599.3333333333334" y="546" width="270.6666666666667" height="102" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="734.6666666666667" y="580" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">¶3 E1</text><text x="734.6666666666667" y="607.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">short practice helps in maths,</text><text x="734.6666666666667" y="626.9499999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">so keep it</text>
</svg>