<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 768" width="900" height="768" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="768" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six ways a thesis can change</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Starting from “Schools should end homework.”</text>
<line x1="450" y1="390" x2="280" y2="190" stroke="#c9d6d4" stroke-width="2.5"/><line x1="450" y1="390" x2="620" y2="190" stroke="#c9d6d4" stroke-width="2.5"/><line x1="450" y1="390" x2="280" y2="390" stroke="#c9d6d4" stroke-width="2.5"/><line x1="450" y1="390" x2="620" y2="390" stroke="#c9d6d4" stroke-width="2.5"/><line x1="450" y1="390" x2="280" y2="590" stroke="#c9d6d4" stroke-width="2.5"/><line x1="450" y1="390" x2="620" y2="590" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="122" width="250" height="136" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="182.62" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Narrow</text><text x="44" y="208.73" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...for children under eleven.”</text><rect x="620" y="122" width="250" height="136" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="634" y="152.92000000000002" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Qualify</text><text x="634" y="179.03" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...should probably limit</text><text x="634" y="198.83" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">homework, since the</text><text x="634" y="218.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">evidence on benefits is</text><text x="634" y="238.43" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">mixed.”</text><rect x="30" y="322" width="250" height="136" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="372.71999999999997" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Add a condition</text><text x="44" y="398.83" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...unless it is short and</text><text x="44" y="418.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">regular practice.”</text><rect x="620" y="322" width="250" height="136" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="634" y="362.82" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Broaden</text><text x="634" y="388.93" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...reconsider all</text><text x="634" y="408.73" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">out-of-school work, not only</text><text x="634" y="428.53000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">homework.”</text><rect x="30" y="522" width="250" height="136" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="572.7199999999999" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Reverse</text><text x="44" y="598.8299999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Schools should keep</text><text x="44" y="618.6299999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">homework, but cap it.”</text><rect x="620" y="522" width="250" height="136" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="634" y="562.82" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Refocus</text><text x="634" y="588.9300000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The question is not whether</text><text x="634" y="608.73" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">to set homework but how</text><text x="634" y="628.5300000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">much.”</text><rect x="320" y="335" width="260" height="110" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="450" y="383.54" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">“Schools</tspan> <tspan font-weight="700">should</tspan> <tspan font-weight="700">end</tspan></text><text x="450" y="407.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">homework.”</tspan></text><rect x="30" y="682" width="840" height="74.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="713.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The revision must still be a defensible, specific claim. <tspan font-weight="700" fill="#b5602e">“Homework</tspan> <tspan font-weight="700" fill="#b5602e">is</tspan> <tspan font-weight="700" fill="#b5602e">complicated”</tspan> is not a revision; it</text><text x="450" y="734.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">is a retreat.</text>
</svg>