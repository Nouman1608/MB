<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A method for revising</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The evidence shapes the claim, not the reverse</text>
<rect x="110" y="122" width="600" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="122" y="152.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">State the current thesis</text><circle cx="70" cy="147" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="153.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="70" y1="166" x2="70" y2="180" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="110" y="184" width="600" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="122" y="214.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">List the evidence: supports, contradicts or complicates?</text><circle cx="70" cy="209" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="215.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="70" y1="228" x2="70" y2="242" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="110" y="246" width="600" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="122" y="276.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Test: does it say more than the evidence shows, or ignore evidence?</text><circle cx="70" cy="271" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="277.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="70" y1="290" x2="70" y2="304" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="110" y="308" width="600" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="122" y="338.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Choose the revision</text><circle cx="70" cy="333" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="339.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="70" y1="352" x2="70" y2="366" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="110" y="370" width="600" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="122" y="400.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Write the new thesis: a specific claim that fits</text><circle cx="70" cy="395" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="401.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="70" y1="414" x2="70" y2="428" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="110" y="432" width="600" height="50" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="122" y="462.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Revise the line of reasoning: topic sentences, order</text><circle cx="70" cy="457" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="463.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><line x1="70" y1="476" x2="70" y2="490" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="110" y="494" width="600" height="50" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="122" y="524.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Check commentary against the new thesis</text><circle cx="70" cy="519" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="525.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><path d="M714,516 C770,496 770,152 714,147" fill="none" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)" stroke-dasharray="7 5"/><text x="830" y="322" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">repeat as</text><text x="830" y="341.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">new</text><text x="830" y="361.6" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">evidence</text><text x="830" y="381.4" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">arrives</text><rect x="30" y="562" width="840" height="74.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="593.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Fooling</tspan> <tspan font-weight="700" fill="#b5602e">yourself:</tspan> selecting only evidence that suits your first idea, and discarding the rest. A sceptical</text><text x="450" y="614.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">reader will see it.</text>
</svg>