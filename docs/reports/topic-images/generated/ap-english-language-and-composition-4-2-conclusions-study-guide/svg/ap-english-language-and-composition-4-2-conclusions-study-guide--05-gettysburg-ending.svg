<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An ending that rises</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lincoln, Gettysburg Address, 1863</text>
<text x="30" y="134" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic" xml:space="preserve">“...that we here highly resolve</text><rect x="30" y="162" width="640" height="46.44" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="190.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">—that</tspan> <tspan font-weight="700">these</tspan> <tspan font-weight="700">dead</tspan> <tspan font-weight="700">shall</tspan> <tspan font-weight="700">not</tspan> <tspan font-weight="700">have</tspan> <tspan font-weight="700">died</tspan> <tspan font-weight="700">in</tspan> <tspan font-weight="700">vain</tspan></text><text x="684" y="190.22" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">call to act: “we” share</text><text x="684" y="210.02" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">the task</text><rect x="80" y="220.44" width="610" height="46.44" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="94" y="248.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">—that</tspan> <tspan font-weight="700">this</tspan> <tspan font-weight="700">nation,</tspan> <tspan font-weight="700">under</tspan> <tspan font-weight="700">God,</tspan> <tspan font-weight="700">shall</tspan> <tspan font-weight="700">have</tspan> <tspan font-weight="700">a</tspan> <tspan font-weight="700">new</tspan> <tspan font-weight="700">birth</tspan> <tspan font-weight="700">of</tspan> <tspan font-weight="700">freedom</tspan></text><text x="704" y="248.66" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">an aim</text><rect x="130" y="278.88" width="580" height="68.88" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="144" y="307.33" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">—and</tspan> <tspan font-weight="700">that</tspan> <tspan font-weight="700">government</tspan> <tspan font-weight="700">of</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">people,</tspan> <tspan font-weight="700">by</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">people,</tspan> <tspan font-weight="700">for</tspan> <tspan font-weight="700">the</tspan></text><text x="144" y="329.77" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">people,</tspan> <tspan font-weight="700">shall</tspan> <tspan font-weight="700">not</tspan> <tspan font-weight="700">perish</tspan> <tspan font-weight="700">from</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">earth.”</tspan></text><text x="724" y="318.32" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">widened lens and</text><text x="724" y="338.12" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">compelling image</text><text x="30" y="394.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Triple phrase:</text><rect x="170" y="369.76" width="149.059" height="38" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="244.52949999999998" y="395.76" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">of the people</text><rect x="339.05899999999997" y="369.76" width="153.2614" height="38" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="415.68969999999996" y="395.76" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">by the people</text><rect x="512.3204" y="369.76" width="156.8046" height="38" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="590.7226999999999" y="395.76" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">for the people</text><rect x="30" y="433.76" width="840" height="74.24000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="465.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Three “that” clauses give a rising cadence; the audience leaves with a phrase it can repeat, and with</text><text x="450" y="486.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the unfinished work as its own.</text>
</svg>