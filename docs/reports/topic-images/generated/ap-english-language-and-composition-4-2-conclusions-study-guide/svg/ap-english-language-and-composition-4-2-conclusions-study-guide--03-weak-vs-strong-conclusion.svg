<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 651" width="900" height="651" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="651" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weak and strong conclusions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The school-start-time essay from Topic 4.1</text>
<rect x="30" y="122" width="840" height="104.64000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="48" y="156" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Weak</text><text x="48" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“In conclusion, there are many reasons why school should start later. As I have said above, teenagers</text><text x="48" y="205.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">are tired, and schools should change. Thank you for reading.”</text><text x="30" y="252" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Strong</text><rect x="30" y="266" width="520" height="86.04000000000002" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="303.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The bus driver who switches on her headlights at 6:40 is not</text><text x="42" y="324.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the real problem; the timetable she serves is.</text><rect x="580" y="266" width="290" height="86.04000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="592" y="291.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Unity + new thinking</text><text x="592" y="317.19" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">returns to the opening image;</text><text x="592" y="336.99" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">reframes the cause</text><line x1="552" y1="309.02" x2="576" y2="309.02" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="362.04" width="520" height="86.04000000000002" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="399.5400000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A later bell will cost districts some inconvenience and some</text><text x="42" y="420.6600000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">money,</text><rect x="580" y="362.04" width="290" height="86.04000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="592" y="387.64000000000004" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Weighing the opposition</text><text x="592" y="413.23" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a brief concession makes the</text><text x="592" y="433.03000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">ending credible</text><line x1="552" y1="405.06000000000006" x2="576" y2="405.06000000000006" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="458.08000000000004" width="520" height="66.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="485.68000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and it will return to students the hour of sleep that biology has</text><text x="42" y="506.80000000000007" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">been asking for.</text><rect x="580" y="458.08000000000004" width="290" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="592" y="483.68000000000006" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Benefit, drawn together</text><text x="592" y="509.27000000000004" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">no new proof</text><line x1="552" y1="491.20000000000005" x2="576" y2="491.20000000000005" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="534.32" width="520" height="86.04000000000008" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="571.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">If a school’s job is to prepare students to learn, then it should</text><text x="42" y="592.94" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">schedule learning for the hours when learning is possible.</text><rect x="580" y="534.32" width="290" height="86.04000000000008" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="592" y="559.9200000000001" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Significance + closing note</text><text x="592" y="585.5100000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">links the claim to the purpose of</text><text x="592" y="605.3100000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">schooling</text><line x1="552" y1="577.3400000000001" x2="576" y2="577.3400000000001" stroke="#2e6b62" stroke-width="2.5"/>
</svg>