<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A conclusion that fits its purpose</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: a railway line becomes a path</text>
<rect x="30" y="122" width="840" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="48" y="156" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Introduction</text><text x="48" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">an empty platform with weeds growing between the rails</text><rect x="30" y="222" width="269.3333333333333" height="104.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="164.66666666666666" y="256" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Body 1</text><text x="164.66666666666666" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">fewer short car journeys</text><rect x="315.3333333333333" y="222" width="269.3333333333333" height="104.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="256" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Body 2</text><text x="450" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">custom for local shops</text><rect x="600.6666666666666" y="222" width="269.3333333333333" height="104.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="735.3333333333333" y="256" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Body 3</text><text x="735.3333333333333" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">a safe route for people</text><text x="735.3333333333333" y="305.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">without cars</text><line x1="164.66666666666666" y1="330.64" x2="335.8666666666667" y2="382.64" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="330.64" x2="450" y2="382.64" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="735.3333333333333" y1="330.64" x2="564.1333333333333" y2="382.64" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><path d="M30,160 C12,322 12,426.64 26,436.64" fill="none" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" stroke-dasharray="8 6"/><rect x="30" y="386.64" width="840" height="208" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3" /><text x="50" y="416.64" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Conclusion</text><text x="50" y="448.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Unity:</tspan> the platform returns, transformed: “let the town walk across it”</text><text x="50" y="500.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Significance:</tspan> “A town that can turn a dead line into a living route has shown it can think about its</text><text x="50" y="521.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">future.”</text><text x="50" y="552.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Call</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">act:</tspan> “The council should approve the funding.”</text><text x="450" y="626.64" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Not new proof: the claims about shops and cars were argued in the body; the conclusion draws them together.</text>
</svg>