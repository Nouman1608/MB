<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The so-what test</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Answer the reader’s question before it is asked</text>
<rect x="30" y="122" width="400" height="54" rx="27" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><path d="M70,175 l-10,16 l24,-15 z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round"/><rect x="62" y="171" width="26" height="6" fill="#f2e7b8"/><text x="230" y="155" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic" xml:space="preserve">“Why does this matter beyond the example?”</text><line x1="436" y1="149" x2="494" y2="149" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="500" y="122" width="370" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="514" y="154.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Significance</tspan> <tspan font-weight="700">in</tspan> <tspan font-weight="700">a</tspan> <tspan font-weight="700">broader</tspan> <tspan font-weight="700">context</tspan></text><rect x="30" y="198" width="400" height="54" rx="27" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><path d="M70,251 l-10,16 l24,-15 z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round"/><rect x="62" y="247" width="26" height="6" fill="#f2e7b8"/><text x="230" y="231" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic" xml:space="preserve">“What should I do now?”</text><line x1="436" y1="225" x2="494" y2="225" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="500" y="198" width="370" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="514" y="230.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Call</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">act,</tspan> <tspan font-weight="700">change</tspan> <tspan font-weight="700">in</tspan> <tspan font-weight="700">attitude,</tspan> <tspan font-weight="700">solution</tspan></text><rect x="30" y="274" width="400" height="54" rx="27" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><path d="M70,327 l-10,16 l24,-15 z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round"/><rect x="62" y="323" width="26" height="6" fill="#f2e7b8"/><text x="230" y="307" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic" xml:space="preserve">“What follows if this is right?”</text><line x1="436" y1="301" x2="494" y2="301" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="500" y="274" width="370" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="514" y="306.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Implications</tspan></text><rect x="30" y="350" width="400" height="54" rx="27" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><path d="M70,403 l-10,16 l24,-15 z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round"/><rect x="62" y="399" width="26" height="6" fill="#f2e7b8"/><text x="230" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic" xml:space="preserve">“How does this relate to where we started?”</text><line x1="436" y1="377" x2="494" y2="377" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="500" y="350" width="370" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="514" y="382.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Return</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">introduction</tspan></text><rect x="30" y="426" width="400" height="54" rx="27" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><path d="M70,479 l-10,16 l24,-15 z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round"/><rect x="62" y="475" width="26" height="6" fill="#f2e7b8"/><text x="230" y="459" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic" xml:space="preserve">“What will I remember?”</text><line x1="436" y1="453" x2="494" y2="453" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="500" y="426" width="370" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="514" y="458.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">A</tspan> <tspan font-weight="700">compelling</tspan> <tspan font-weight="700">image</tspan></text><rect x="30" y="502" width="400" height="54" rx="27" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><path d="M70,555 l-10,16 l24,-15 z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round"/><rect x="62" y="551" width="26" height="6" fill="#f2e7b8"/><text x="230" y="535" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic" xml:space="preserve">“Can you pull it together?”</text><line x1="436" y1="529" x2="494" y2="529" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="500" y="502" width="370" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="514" y="534.0400000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Summary</tspan> <tspan font-weight="700">of</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">reasoning,</tspan> <tspan font-weight="700">in</tspan> <tspan font-weight="700">new</tspan> <tspan font-weight="700">words</tspan></text><text x="450" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Strong conclusions combine two or three moves that fit the rhetorical situation.</text>
