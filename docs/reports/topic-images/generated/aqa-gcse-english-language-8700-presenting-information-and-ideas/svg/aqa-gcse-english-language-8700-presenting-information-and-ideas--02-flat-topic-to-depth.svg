<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 619" width="900" height="619" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="619" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Turn a subject into a question or a claim</text>

<text x="175" y="118" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Flat topic: a list of facts</text><text x="620" y="118" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Topic with depth: something to weigh</text><rect x="30" y="136" width="290" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="166.4" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">My favourite football</text><text x="46" y="190.4" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">club</text><rect x="390" y="136" width="480" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="406" y="166.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Should football clubs be owned by their</text><text x="406" y="190.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">fans?</text><line x1="326" y1="174" x2="384" y2="174" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="226" width="290" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="268.4" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Climate change</text><rect x="390" y="226" width="480" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="406" y="256.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What can one town realistically do about</text><text x="406" y="280.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">climate change?</text><line x1="326" y1="264" x2="384" y2="264" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="316" width="290" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="358.4" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Social media</text><rect x="390" y="316" width="480" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="406" y="346.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Does social media make teenagers more or</text><text x="406" y="370.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">less lonely?</text><line x1="326" y1="354" x2="384" y2="354" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="406" width="290" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="448.4" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">My holiday in Italy</text><rect x="390" y="406" width="480" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="406" y="436.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What I learned about my own town by living</text><text x="406" y="460.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">somewhere else for a month</text><line x1="326" y1="444" x2="384" y2="444" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="504" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="537.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The second column gives you something to explain, weigh and argue.</text><text x="450" y="566.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">That is where challenging ideas come from.</text>
</svg>