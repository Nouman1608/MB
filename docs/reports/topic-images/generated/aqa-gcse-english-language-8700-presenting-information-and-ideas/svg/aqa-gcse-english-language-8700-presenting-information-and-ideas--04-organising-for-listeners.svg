<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Make the structure audible</text>

<text x="450" y="120" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1. Choose a shape</text><rect x="30" y="140" width="156" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="172" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Problem and</text><text x="108" y="193" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">solution</text><rect x="48" y="228" width="120" height="30" rx="6" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="108" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">problem</text><rect x="48" y="268" width="120" height="30" rx="6" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="108" y="289" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">solution</text><rect x="201" y="140" width="156" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="279" y="172" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Claim, reasons,</text><text x="279" y="193" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">counter-argument</text><rect x="219" y="228" width="120" height="30" rx="6" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="279" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">claim</text><rect x="219" y="268" width="120" height="30" rx="6" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="279" y="289" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">reasons</text><rect x="219" y="308" width="120" height="30" rx="6" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="279" y="329" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">counter</text><rect x="372" y="140" width="156" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="172" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Past, present,</text><text x="450" y="193" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">future</text><rect x="390" y="228" width="120" height="30" rx="6" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">past</text><rect x="390" y="268" width="120" height="30" rx="6" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="289" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">present</text><rect x="390" y="308" width="120" height="30" rx="6" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="329" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">future</text><rect x="543" y="140" width="156" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="621" y="172" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Two options</text><text x="621" y="193" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">compared</text><rect x="561" y="228" width="120" height="30" rx="6" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="621" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">option A</text><rect x="561" y="268" width="120" height="30" rx="6" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="621" y="289" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">option B</text><rect x="714" y="140" width="156" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="792" y="172" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Myth-busting</text><rect x="732" y="228" width="120" height="30" rx="6" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="792" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">myth</text><rect x="732" y="268" width="120" height="30" rx="6" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="792" y="289" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">correction</text><text x="450" y="392" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2. Keep the listener on track</text><rect x="30" y="408" width="270" height="161" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="444" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Signpost aloud</text><text x="50" y="473.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“I want to look at three</text><text x="50" y="495.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">questions”</text><text x="50" y="522.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“That brings me to the</text><text x="50" y="544.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">second”</text><rect x="315" y="408" width="270" height="161" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="444" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Repeat key ideas</text><text x="335" y="473.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">more than in writing:</text><text x="335" y="495.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">repetition aids memory</text><text x="335" y="517.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">when heard</text><rect x="600" y="408" width="270" height="161" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="620" y="444" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Summarise before</text><text x="620" y="470" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">concluding</text><text x="620" y="499.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">so latecomers to your</text><text x="620" y="521.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">argument can catch up</text><rect x="30" y="591" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="624.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A reader can flick back; a listener cannot.</text><text x="450" y="653.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">So spoken structure must be more visible than written structure.</text>
</svg>