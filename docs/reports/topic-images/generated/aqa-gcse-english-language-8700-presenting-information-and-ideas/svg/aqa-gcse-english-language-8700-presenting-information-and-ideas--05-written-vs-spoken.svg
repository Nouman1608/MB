<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 532" width="900" height="532" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="532" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Written style and spoken style</text>

<rect x="30" y="100" width="420" height="47" fill="#4a5568"/><text x="240" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Written</text><rect x="450" y="100" width="420" height="47" fill="#2e6b62"/><text x="660" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Spoken</text><rect x="30" y="147" width="420" height="62" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="180.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Long sentences with several clauses</text><rect x="450" y="147" width="420" height="62" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="464" y="180.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Shorter sentences, one idea at a time</text><rect x="30" y="209" width="420" height="62" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="242.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“It could be argued that…”</text><rect x="450" y="209" width="420" height="62" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="464" y="242.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Some people say…”</text><rect x="30" y="271" width="420" height="62" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="304.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Parenthesis inside sentences</text><rect x="450" y="271" width="420" height="62" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="464" y="304.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Pauses and separate sentences</text><rect x="30" y="333" width="420" height="62" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="366.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Headings and paragraphs show structure</text><rect x="450" y="333" width="420" height="62" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="464" y="366.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Signposting phrases show structure</text><rect x="30" y="100" width="840" height="295" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="417" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="450.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal enough for the setting, but still sounding like speech</text><text x="450" y="479.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">not like an essay being read aloud.</text>
</svg>