<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the presenting criteria step up</text>

<rect x="30" y="100" width="170" height="70" fill="#1e2a44"/><text x="115" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Grade</text><rect x="200" y="100" width="240" height="70" fill="#1e2a44"/><text x="320" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Ideas and vocabulary</text><rect x="440" y="100" width="220" height="70" fill="#1e2a44"/><text x="550" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Organisation</text><rect x="660" y="100" width="210" height="70" fill="#1e2a44"/><text x="765" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Audience and</text><text x="765" y="152.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">purpose</text><rect x="30" y="170" width="170" height="92" fill="#d4b02e" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="221.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Distinction</text><rect x="200" y="170" width="240" height="92" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="196.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sophisticated ideas with</text><text x="214" y="218.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a sophisticated</text><text x="214" y="240.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">repertoire of vocabulary</text><rect x="440" y="170" width="220" height="92" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="196.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An effective range of</text><text x="454" y="218.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">strategies to engage</text><text x="454" y="240.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the audience</text><rect x="660" y="170" width="210" height="92" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="674" y="218.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Achieves the purpose</text><rect x="30" y="262" width="170" height="92" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="313.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Merit</text><rect x="200" y="262" width="240" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="299.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Challenging ideas with a</text><text x="214" y="321.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">range of vocabulary</text><rect x="440" y="262" width="220" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="288.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Clear, appropriate</text><text x="454" y="310.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">structure that meets</text><text x="454" y="332.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the audience’s needs</text><rect x="660" y="262" width="210" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="674" y="310.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Achieves the purpose</text><rect x="30" y="354" width="170" height="92" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="405.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pass</text><rect x="200" y="354" width="240" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="391.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Straightforward ideas,</text><text x="214" y="413.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">information or feelings</text><rect x="440" y="354" width="220" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="380.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An attempt to</text><text x="454" y="402.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">organise and</text><text x="454" y="424.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">structure</text><rect x="660" y="354" width="210" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="674" y="391.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An attempt to meet</text><text x="674" y="413.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the audience’s needs</text><rect x="30" y="100" width="840" height="346" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="468" width="840" height="70" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="499" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">For any grade: be audible and use spoken Standard English</text><text x="450" y="524" font-size="16" font-weight="400" fill="#b5d3cf" text-anchor="middle">Competency basis: you must meet every criterion for a grade to be awarded it</text>
