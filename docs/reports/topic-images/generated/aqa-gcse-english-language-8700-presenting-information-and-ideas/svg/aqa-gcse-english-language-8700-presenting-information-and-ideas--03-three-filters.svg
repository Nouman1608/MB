<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Research more than you need, then cut hard</text>

<path d="M110,100 L790,100 L600,400 L300,400 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round"/><text x="450" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1. Does it serve my purpose?</text><text x="450" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">inform, explain, argue or persuade</text><line x1="150" y1="196" x2="750" y2="196" stroke="#2e6b62" stroke-width="2" stroke-dasharray="7 6"/><text x="450" y="236" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2. Will my audience understand it</text><text x="450" y="260" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">without a long explanation?</text><line x1="224" y1="286" x2="676" y2="286" stroke="#2e6b62" stroke-width="2" stroke-dasharray="7 6"/><text x="450" y="326" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3. Is it memorable when heard once?</text><text x="450" y="350" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">listeners cannot reread</text><line x1="450" y1="404" x2="450" y2="446" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="317" y="452" width="266" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="475.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">what goes into the talk</text><text x="40" y="250" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">cut</text><line x1="110" y1="256" x2="60" y2="275" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="860" y="250" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">cut</text><line x1="790" y1="256" x2="840" y2="275" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="30" y="508" width="411" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="544" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">One vivid example often beats</text><text x="50" y="570" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">three statistics</text><text x="50" y="599.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">when it is heard only once.</text><rect x="459" y="508" width="411" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="544" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Keep a note of your sources</text><text x="479" y="573.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">so that you can answer questions about</text><text x="479" y="595.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">your information.</text>
</svg>