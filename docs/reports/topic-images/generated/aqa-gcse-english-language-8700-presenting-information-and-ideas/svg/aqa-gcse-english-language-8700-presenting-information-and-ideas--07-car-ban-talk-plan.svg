<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 931" width="900" height="931" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="931" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a talk that aims high</text>

<rect x="30" y="100" width="840" height="60" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="138" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">“Should our town ban cars from the high street on Saturdays?”</text><path d="M60,252.5 L60,712" fill="none" stroke="#c9d6d4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="100" y="182" width="560" height="97" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="114" y="211.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Opening hook</text><text x="114" y="239.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The high street at noon on a Saturday from a pedestrian’s view,</text><text x="114" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">then the question</text><circle cx="60" cy="230.5" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="237.7" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="680" y="214.5" width="190" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="775" y="235.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">description + question</text><rect x="100" y="289" width="560" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="114" y="318.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Signpost</text><text x="114" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“I’ll look at who gains, who loses, and what a fair compromise</text><text x="114" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">might be.”</text><circle cx="60" cy="337.5" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="344.7" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="680" y="321.5" width="190" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="775" y="342.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">signposting</text><rect x="100" y="396" width="560" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="114" y="425.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Who gains</text><text x="114" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pedestrians, cafés with outdoor seating, families; one vivid</text><text x="114" y="474.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">example</text><circle cx="60" cy="444.5" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="451.7" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="680" y="428.5" width="190" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="775" y="449.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">vivid example</text><rect x="100" y="503" width="560" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="114" y="532.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Who loses</text><text x="114" y="560.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Disabled drivers, delivery firms, older residents who drive in:</text><text x="114" y="581.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">treated seriously</text><circle cx="60" cy="551.5" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="558.7" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="680" y="535.5" width="190" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="775" y="556.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">balanced argument</text><rect x="100" y="610" width="560" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="114" y="639.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Compromise</text><text x="114" y="667.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A ban with exemptions and a trial period that answers both sides</text><circle cx="60" cy="648" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="655.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="100" y="696" width="560" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="114" y="725.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Summary and close</text><text x="114" y="753.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Return to the opening image, reimagined, and state a clear view</text><circle cx="60" cy="734" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="741.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="680" y="718" width="190" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="775" y="738.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">returning image</text><rect x="30" y="794" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="827.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it aims high</text><text x="48" y="856.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">It weighs competing interests rather than listing benefits, it is signposted, and its</text><text x="48" y="878.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">strategies vary. Notes: cue cards with keywords only.</text>
</svg>