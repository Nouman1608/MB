<rect x="309.5" y="100" width="281" height="44" rx="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="129.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A talk on volunteering</text><path d="M400,144 C400,174 250,164 250,194" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M500,144 C500,174 650,164 650,194" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="204" width="390" height="148" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="237" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AUDIENCE</text><text x="50" y="265.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Year 7</text><text x="50" y="297.4" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="67.1" y="297.4" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Concrete examples</text><text x="50" y="326.4" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="67.1" y="326.4" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">A clear invitation</text><rect x="480" y="204" width="390" height="148" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="237" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AUDIENCE</text><text x="500" y="265.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Governors</text><text x="500" y="297.4" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="517.1" y="297.4" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Evidence of benefit</text><text x="500" y="326.4" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="517.1" y="326.4" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">A measured tone</text><rect x="30" y="374" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="412" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Only the teacher listening? Imagine a wider audience:</text><rect x="54" y="438" width="195" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="151.5" y="460.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a radio interview</text><rect x="263" y="438" width="204" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="365" y="460.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a pitch to a panel</text><rect x="481" y="438" width="272" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="617" y="460.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a speech to a named group</text>
