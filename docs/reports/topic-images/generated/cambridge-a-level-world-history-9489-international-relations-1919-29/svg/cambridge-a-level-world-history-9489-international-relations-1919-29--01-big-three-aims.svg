<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 493" width="900" height="493" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="493" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Big Three wanted different peaces</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Aims at the Paris peace conference</text>
<rect x="30" y="124" width="270.6666666666667" height="182" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FRANCE: CLEMENCEAU</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Security against Germany</text><text x="50" y="210.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reparations</text><text x="50" y="235.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Disarmament</text><text x="50" y="260.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">If possible, a buffer in the</text><text x="65.2" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rhineland</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="182" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="158" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BRITAIN: LLOYD GEORGE</text><text x="334.6666666666667" y="184.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Punish, but keep trading</text><text x="334.6666666666667" y="212.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Germany punished but able</text><text x="349.8666666666667" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to trade</text><text x="334.6666666666667" y="258.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Naval and imperial interests</text><text x="349.8666666666667" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">protected</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="182" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">USA: WILSON</text><text x="619.3333333333334" y="192.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Fourteen Points</text><text x="619.3333333333334" y="221.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="634.5333333333334" y="221.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Self-determination</text><text x="619.3333333333334" y="246.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="634.5333333333334" y="246.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Open diplomacy</text><text x="619.3333333333334" y="271.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="634.5333333333334" y="271.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A League of Nations</text><rect x="30" y="328" width="840" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="360" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEFT OUT</text><text x="50" y="386.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Who had no voice</text><text x="50" y="415.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The defeated powers were not represented; Soviet Russia was excluded; smaller allies had little say once</text><text x="50" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decisions moved to the Council of Four.</text>
</svg>