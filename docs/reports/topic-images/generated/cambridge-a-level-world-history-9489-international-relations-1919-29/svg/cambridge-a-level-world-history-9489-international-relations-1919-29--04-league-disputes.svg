<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 782" width="900" height="782" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="782" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The League's disputes in the 1920s</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From rulings accepted to rulings bypassed</text>
<defs><linearGradient id="lg124" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#b5602e"/></linearGradient></defs><rect x="40" y="124" width="30" height="626" rx="15" fill="url(#lg124)" stroke="#1e2a44" stroke-width="2.5"/><rect x="120" y="124" width="750" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="133" y="149" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1920-21</text><text x="133" y="175.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Aaland Islands</text><text x="133" y="203" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Finland kept them; demilitarised, Swedish speakers given autonomy</text><rect x="713.925" y="136" width="141.075" height="29" rx="14.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="784.4625" y="155.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Accepted ruling</text><rect x="120" y="230" width="750" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="133" y="255" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1925</text><text x="133" y="281.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Greco-Bulgarian border</text><text x="133" y="309" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Greece withdrew and paid compensation</text><rect x="670.95" y="242" width="184.05" height="29" rx="14.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="762.975" y="261.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Success, small power</text><rect x="120" y="336" width="750" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="133" y="361" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1921</text><text x="133" y="387.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Upper Silesia</text><text x="133" y="415" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Plebiscite, then partition; resented in Germany</text><rect x="737.16" y="348" width="117.84" height="29" rx="14.5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="796.0799999999999" y="367.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Compromise</text><rect x="120" y="442" width="750" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="133" y="467" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1919-20</text><text x="133" y="493.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Teschen</text><text x="133" y="521" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Divided by the Conference of Ambassadors</text><rect x="712.065" y="454" width="142.935" height="29" rx="14.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="783.5325" y="473.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Decided outside</text><rect x="120" y="548" width="750" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="133" y="573" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1923</text><text x="133" y="599.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Memel</text><text x="133" y="627" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Seized by Lithuania; confirmed with autonomy (1924)</text><rect x="733.545" y="560" width="121.455" height="29" rx="14.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="794.2724999999999" y="579.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Fait accompli</text><rect x="120" y="654" width="750" height="96" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="133" y="679" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1920</text><text x="133" y="705.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vilna</text><text x="133" y="733" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Seized by Polish forces; Poland, backed by France, kept it</text><rect x="697.3050000000001" y="666" width="157.695" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="776.1525" y="685.9" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">League powerless</text><text transform="translate(84 437) rotate(90)" text-anchor="middle" font-size="16" font-weight="700" fill="#4a5568">more effective  →  less effective</text>
</svg>