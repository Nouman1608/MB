<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Locarno, 1925: two kinds of border</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Labelled schematic, not to scale and not a map</text>
<rect x="30" y="124" width="840" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="164" width="200" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="221" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">France</text><rect x="70" y="314" width="200" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="371" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Belgium</text><rect x="350" y="224" width="200" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="296" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Germany</text><rect x="630" y="164" width="200" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="221" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Poland</text><rect x="630" y="314" width="200" height="100" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="371" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Czechoslovakia</text><line x1="310" y1="154" x2="310" y2="426" stroke="#2e6b62" stroke-width="9"/><line x1="590" y1="154" x2="590" y2="424" stroke="#b5602e" stroke-width="5" stroke-dasharray="12 9"/><text x="310" y="450" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">guaranteed</text><text x="590" y="450" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">arbitration only</text><rect x="30" y="486" width="411" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="518" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WESTERN BORDERS</text><text x="50" y="544.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Accepted and guaranteed</text><text x="50" y="573.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Germany, France and Belgium accept their</text><text x="50" y="594.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">common borders; Britain and Italy guarantee</text><text x="50" y="615.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">them</text><rect x="459" y="486" width="411" height="154" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="518" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EASTERN BORDERS</text><text x="479" y="544.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Left open</text><text x="479" y="573.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Arbitration treaties with Poland and</text><text x="479" y="594.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Czechoslovakia, but no guarantee of the</text><text x="479" y="615.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">frontiers</text>
</svg>