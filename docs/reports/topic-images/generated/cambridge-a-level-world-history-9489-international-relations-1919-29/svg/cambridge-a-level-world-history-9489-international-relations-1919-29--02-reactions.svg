<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 517" width="900" height="517" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="517" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nobody was fully satisfied</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How each power reacted to the settlements</text>
<rect x="30" y="124" width="201" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="43" y="149" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FRANCE</text><text x="43" y="174.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Too lenient</text><text x="43" y="201" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">And no Anglo-American</text><text x="43" y="221" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">guarantee once the</text><text x="43" y="241" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Senate rejected the</text><text x="43" y="261" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">treaty</text><rect x="243" y="124" width="201" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="256" y="169" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BRITAIN</text><text x="256" y="194.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soon had doubts</text><text x="256" y="221" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Encouraged by Keynes</text><text x="256" y="241" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1919)</text><rect x="456" y="124" width="201" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="469" y="179" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">USA</text><text x="469" y="204.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Refused to ratify</text><text x="469" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Never joined the League</text><rect x="669" y="124" width="201" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="682" y="179" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ITALY</text><text x="682" y="204.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">"Mutilated victory"</text><text x="682" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">No Fiume or Dalmatia</text><rect x="30" y="290" width="201" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="43" y="345.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JAPAN</text><text x="43" y="370.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gains, and a snub</text><text x="43" y="397.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Shandong and Pacific</text><text x="43" y="417.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mandates; racial</text><text x="43" y="437.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">equality clause rejected</text><rect x="243" y="290" width="201" height="195" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="256" y="345.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GERMANY</text><text x="256" y="370.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A Diktat</text><text x="256" y="397.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Article 231 read as "war</text><text x="256" y="417.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">guilt"; 132 billion gold</text><text x="256" y="437.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">marks (1921)</text><rect x="456" y="290" width="201" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="469" y="345.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RUSSIA</text><text x="469" y="370.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Excluded</text><text x="469" y="397.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Did not recover the</text><text x="469" y="417.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">lands lost at</text><text x="469" y="437.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Brest-Litovsk</text><rect x="669" y="290" width="201" height="195" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="682" y="315" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SELF-DETERMINATION</text><text x="682" y="340.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Applied</text><text x="682" y="361.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">inconsistently</text><text x="682" y="388" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Yes for Poles and</text><text x="682" y="408" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Czechs; no for Germans</text><text x="682" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">in Austria and the</text><text x="682" y="448" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sudetenland, or Arabs</text><text x="682" y="468" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">under mandates</text>
</svg>