<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Was Locarno the main reason?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">What made the improvement possible, and what made it visible</text>
<rect x="250" y="124" width="400" height="133" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">MADE IT VISIBLE</text><text x="450" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Locarno (1925)</text><text x="450" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Western borders settled; Germany an equal;</text><text x="450" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">path to League entry</text><rect x="170" y="271" width="560" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">MADE IT POSSIBLE</text><text x="450" y="329.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dawes Plan (1924)</text><text x="450" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Without it France and Germany could not negotiate; also the</text><text x="450" y="379.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Stresemann-Briand partnership and exhaustion after the Ruhr</text><rect x="30" y="418" width="840" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="450" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THE FOUNDATION</text><text x="450" y="476.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">American loans</text><text x="450" y="505.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Recalled after the Wall Street Crash: the whole structure was exposed</text><rect x="30" y="552" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="586.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A strong judgement</text><text x="450" y="616.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Dawes made improvement <tspan font-weight="700" fill="#1e2a44">possible</tspan> and Locarno made it <tspan font-weight="700" fill="#1e2a44">visible</tspan>, but both depended on American</text><text x="450" y="638.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">loans.</text>
</svg>