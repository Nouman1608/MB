<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the League was organised</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The Covenant was written into every peace treaty</text>
<rect x="30" y="124" width="411" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235.5" y="170" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">ALL MEMBERS</text><text x="235.5" y="197.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Assembly</text><rect x="459" y="124" width="411" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664.5" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PERMANENT: BRITAIN, FRANCE, ITALY, JAPAN</text><text x="664.5" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Council</text><text x="664.5" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Plus elected members</text><rect x="30" y="257" width="411" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235.5" y="301" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">GENEVA</text><text x="235.5" y="327.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Secretariat</text><rect x="459" y="257" width="411" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="664.5" y="289" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THE HAGUE</text><text x="664.5" y="315.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Permanent Court of International</text><text x="664.5" y="339.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Justice</text><text x="30" y="401" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGENCIES AND COMMISSIONS: often judged its most lasting success</text><rect x="30" y="423" width="160" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="448.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Refugees</text><text x="42" y="475" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Nansen: prisoners</text><text x="42" y="495" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">home; "Nansen</text><text x="42" y="515" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">passports"</text><rect x="200" y="423" width="160" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="212" y="448.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ILO</text><text x="212" y="475" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Standards on</text><text x="212" y="495" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hours and</text><text x="212" y="515" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conditions</text><rect x="370" y="423" width="160" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="382" y="458.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Slavery</text><text x="382" y="485" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Slavery</text><text x="382" y="505" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Convention (1926)</text><rect x="540" y="423" width="160" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="552" y="458.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Disarmament</text><text x="552" y="485" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Achieved little in</text><text x="552" y="505" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the 1920s</text><rect x="710" y="423" width="160" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="722" y="458.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mandates</text><text x="722" y="485" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Reports, but could</text><text x="722" y="505" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">not compel</text><rect x="30" y="551" width="840" height="163" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="583" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESSES</text><text x="50" y="614.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="614.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Membership:</tspan> no USA; Germany only from 1926, USSR from 1934</text><text x="50" y="639.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="639.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Voting:</tspan> usually needed unanimity</text><text x="50" y="664.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="664.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Enforcement:</tspan> sanctions or members' troops; no army of its own</text><text x="50" y="689.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="689.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Leadership:</tspan> Britain and France, with different priorities</text>
</svg>