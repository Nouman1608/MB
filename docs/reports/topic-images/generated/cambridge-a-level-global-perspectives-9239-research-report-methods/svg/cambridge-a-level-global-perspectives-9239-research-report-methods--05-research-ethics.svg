<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Research ethics with participants</text>

<rect x="30" y="110" width="410" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="188.5" r="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M58,188.5 l7,8 l13,-15" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="92" y="110" width="348" height="157" rx="12" fill="none" stroke="none" stroke-width="2.2"/><text x="110" y="171.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Informed consent</text><text x="110" y="199.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Participants know what the research</text><text x="110" y="222.38" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is for and agree to take part.</text><rect x="460" y="110" width="410" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="498" cy="188.5" r="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M488,188.5 l7,8 l13,-15" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="522" y="110" width="348" height="157" rx="12" fill="none" stroke="none" stroke-width="2.2"/><text x="540" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Anonymity and</text><text x="540" y="173.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">confidentiality</text><text x="540" y="201.84" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Names and identifying details are</text><text x="540" y="224.28" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">removed unless participants agree</text><text x="540" y="246.72" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">otherwise.</text><rect x="30" y="285" width="410" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="363.5" r="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M58,363.5 l7,8 l13,-15" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="92" y="285" width="348" height="157" rx="12" fill="none" stroke="none" stroke-width="2.2"/><text x="110" y="357.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Right to withdraw</text><text x="110" y="385.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Participants can stop at any point.</text><rect x="460" y="285" width="410" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="498" cy="363.5" r="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M488,363.5 l7,8 l13,-15" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="522" y="285" width="348" height="157" rx="12" fill="none" stroke="none" stroke-width="2.2"/><text x="540" y="335" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sensitivity and safety</text><text x="540" y="363.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Avoid topics or settings that could</text><text x="540" y="385.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cause harm to participants or to</text><text x="540" y="408.32" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">you.</text><rect x="30" y="464" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="495.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">For research involving people, say in your methods section how you met these conventions.</text>
</svg>