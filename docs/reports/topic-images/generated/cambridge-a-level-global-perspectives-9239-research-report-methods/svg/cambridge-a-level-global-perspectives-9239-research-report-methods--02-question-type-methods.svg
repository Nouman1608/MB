<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 788" width="900" height="788" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What kind of question have you asked?</text>

<text x="38" y="128" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Question type</text><text x="260" y="128" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Example form</text><text x="484" y="128" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Evidence it needs</text><text x="704" y="128" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Methods that fit</text><rect x="30" y="142" width="840" height="133.60000000000002" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="206.8" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Empirical</text><text x="48" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">What is the case?</text><text x="264" y="202.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Has X increased?”</text><text x="264" y="223.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Does X affect Y?”</text><line x1="230" y1="208.8" x2="248" y2="208.8" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="488" y="192.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Measurement;</text><text x="488" y="213.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">comparison over time</text><text x="488" y="234.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or between groups</text><line x1="454" y1="208.8" x2="472" y2="208.8" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="708" y="171" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Statistical</text><text x="708" y="192.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">analysis of</text><text x="708" y="213.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">existing data;</text><text x="708" y="234.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surveys;</text><text x="708" y="255.48000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">experiments</text><line x1="674" y1="208.8" x2="692" y2="208.8" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="30" y="287.6" width="840" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="331.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Interpretive</text><text x="48" y="355.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">What does it mean?</text><text x="264" y="327.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“How is X represented</text><text x="264" y="348.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">in …?”</text><line x1="230" y1="333.6" x2="248" y2="333.6" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="488" y="316.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Close reading of</text><text x="488" y="338.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">texts, images or</text><text x="488" y="359.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accounts</text><line x1="454" y1="333.6" x2="472" y2="333.6" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="708" y="316.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Close analysis of</text><text x="708" y="338.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">texts; interviews;</text><text x="708" y="359.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">focus groups</text><line x1="674" y1="333.6" x2="692" y2="333.6" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="30" y="391.6" width="840" height="154.72" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="466.96000000000004" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Normative</text><text x="48" y="490.96000000000004" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">What should be done?</text><text x="264" y="462.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Should X be …?” “Is</text><text x="264" y="483.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">X a good thing?”</text><line x1="230" y1="468.96000000000004" x2="248" y2="468.96000000000004" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="488" y="431.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Arguments about</text><text x="488" y="452.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">values and</text><text x="488" y="473.40000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consequences, plus</text><text x="488" y="494.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evidence of</text><text x="488" y="515.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consequences</text><line x1="454" y1="468.96000000000004" x2="472" y2="468.96000000000004" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="708" y="420.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Review of the</text><text x="708" y="441.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">secondary</text><text x="708" y="462.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">literature;</text><text x="708" y="483.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evaluation of</text><text x="708" y="505.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evidence on</text><text x="708" y="526.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outcomes</text><line x1="674" y1="468.96000000000004" x2="692" y2="468.96000000000004" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="30" y="558.32" width="840" height="112.48" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="612.5600000000001" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Explanatory</text><text x="48" y="636.5600000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Why does X happen?</text><text x="264" y="619" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Why has X declined?”</text><line x1="230" y1="614.5600000000001" x2="248" y2="614.5600000000001" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="488" y="597.8800000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Evidence that tests</text><text x="488" y="619.0000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">competing</text><text x="488" y="640.1200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">explanations</text><line x1="454" y1="614.5600000000001" x2="472" y2="614.5600000000001" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="708" y="587.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Literature review</text><text x="708" y="608.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plus data that can</text><text x="708" y="629.5600000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">separate the</text><text x="708" y="650.6800000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">explanations</text><line x1="674" y1="614.5600000000001" x2="692" y2="614.5600000000001" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="30" y="686.8000000000001" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="717.0000000000001" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">“Is industrialisation a good thing?” is normative: data can show what industrialisation has done,</text><text x="450" y="738.1200000000001" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">but judging whether that is “good” needs arguments about which outcomes matter most.</text>
</svg>