<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 629" width="900" height="629" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="629" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Your methods set what you can claim</text>

<text x="180" y="132" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Your evidence</text><text x="486" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">✓ Can support</text><text x="750" y="132" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">✗ Cannot, alone</text><rect x="30" y="148" width="300" height="77.52000000000001" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="180" y="179" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Qualitative evidence from a</text><text x="180" y="202.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">few people</text><line x1="333" y1="186.76" x2="352" y2="186.76" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="356" y="148" width="260" height="77.52000000000001" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="486" y="180.64000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">how and why something is</text><text x="486" y="201.76000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">experienced</text><rect x="630" y="148" width="240" height="77.52000000000001" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2"/><text x="750" y="191.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">how common it is</text><rect x="30" y="237.52" width="300" height="77.52000000000001" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="180" y="268.52" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Data from one place or</text><text x="180" y="292.28" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">period</text><line x1="333" y1="276.28000000000003" x2="352" y2="276.28000000000003" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="356" y="237.52" width="260" height="77.52000000000001" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="486" y="270.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">conclusions about that</text><text x="486" y="291.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">place or period first</text><rect x="630" y="237.52" width="240" height="77.52000000000001" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2"/><text x="750" y="270.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">automatic generalisation</text><text x="750" y="291.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">elsewhere</text><rect x="30" y="327.04" width="300" height="77.52000000000001" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="180" y="358.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Correlation in numerical</text><text x="180" y="381.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">data</text><line x1="333" y1="365.8" x2="352" y2="365.8" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="356" y="327.04" width="260" height="77.52000000000001" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="486" y="359.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">that two things vary</text><text x="486" y="380.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">together</text><rect x="630" y="327.04" width="240" height="77.52000000000001" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2"/><text x="750" y="359.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">cause, without further</text><text x="750" y="380.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">evidence</text><rect x="30" y="416.56000000000006" width="300" height="93.36" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="180" y="467.36000000000007" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence of outcomes</text><line x1="333" y1="463.24000000000007" x2="352" y2="463.24000000000007" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="356" y="416.56000000000006" width="260" height="93.36" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="486" y="467.68000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">what has happened</text><rect x="630" y="416.56000000000006" width="240" height="93.36" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2"/><text x="750" y="446.56000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a normative judgement,</text><text x="750" y="467.68000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">without explicit</text><text x="750" y="488.80000000000007" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">reasoning about values</text><rect x="30" y="527.9200000000001" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="558.1200000000001" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Linking the limits of your methods to the strength of your conclusion meets the AO2 demand to</text><text x="450" y="579.2400000000001" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">reflect on scope, nature and limitations.</text>
</svg>