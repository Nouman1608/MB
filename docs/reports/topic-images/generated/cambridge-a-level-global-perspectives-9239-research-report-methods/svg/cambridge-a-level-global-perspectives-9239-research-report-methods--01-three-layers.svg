<rect width="900" height="619" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Methods, procedure, methodology</text>

<rect x="30" y="115" width="840" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="80" cy="170" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="178.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="124" y="178" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Methods</text><text x="375" y="153" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What you did</text><text x="375" y="176.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a review of published studies and an analysis of</text><text x="375" y="197.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">national data</text><rect x="50" y="241" width="800" height="110" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="100" cy="296" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="100" y="304.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="144" y="304" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Procedure</text><text x="375" y="279" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How you did it</text><text x="375" y="302.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">which studies, found how; which data, from where,</text><text x="375" y="323.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">over what period</text><rect x="70" y="367" width="760" height="129.76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="120" cy="431.88" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="440.52" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="164" y="439.88" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Methodology</text><text x="375" y="403" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why these methods suit this kind of question</text><text x="375" y="426.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">in this subject</text><text x="375" y="450.52" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and what that choice allows you to conclude, and</text><text x="375" y="471.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what it does not</text><text x="860" y="104" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end" font-style="italic">most weak methods sections stop here ↓</text><rect x="30" y="518.76" width="840" height="72.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="548.96" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Methodology: “the study of the reasons why particular sets of methods are appropriate for specific</text><text x="450" y="570.08" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">academic subject areas”.</text>
</svg>