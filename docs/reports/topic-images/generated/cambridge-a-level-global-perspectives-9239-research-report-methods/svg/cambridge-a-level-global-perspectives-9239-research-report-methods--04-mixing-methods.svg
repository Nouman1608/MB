<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Combining two methods</text>

<rect x="30" y="120" width="330" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="195" y="169.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">National data</text><text x="195" y="197.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">shows that a change happened</text><rect x="540" y="120" width="330" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="705" y="169.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Interviews</text><text x="705" y="197.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">show how people experienced it</text><circle cx="450" cy="175" r="44" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="170" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">compare</text><text x="450" y="190" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">findings</text><line x1="362" y1="175" x2="402" y2="175" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="538" y1="175" x2="498" y2="175" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><path d="M450,221 C450,260 240,250 240,290" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><path d="M450,221 C450,260 660,250 660,290" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="298" width="360" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="240" y="352" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Both point the same way</text><text x="240" y="380.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">your conclusion is more secure</text><rect x="480" y="298" width="360" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="660" y="341" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">They conflict</text><text x="660" y="369.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the conflict is itself a finding to</text><text x="660" y="391.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">discuss</text><rect x="30" y="446" width="410" height="129" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="482.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Hard to manage</text><text x="48" y="510.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Four thin methods within 5000 words.</text><rect x="460" y="446" width="410" height="129" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="482.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Usually more manageable</text><text x="478" y="510.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Two well-designed methods, each answering a</text><text x="478" y="532.9300000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">part of the question the other cannot, or</text><text x="478" y="555.37" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">checking the other.</text>
</svg>