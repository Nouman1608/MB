<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Design decisions you must be able to defend</text>

<rect x="30" y="110" width="410" height="127" rx="12" fill="#f2e7b8" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary literature review</text><text x="48" y="174.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">how you will find sources; which you will</text><text x="48" y="195.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">include; organise by perspective, not one by</text><text x="48" y="216.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one</text><rect x="460" y="110" width="410" height="127" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Close analysis of texts</text><text x="478" y="174.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">which texts and passages, and why; what you</text><text x="478" y="195.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">are looking for; test your reading against an</text><text x="478" y="216.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alternative</text><rect x="30" y="253" width="410" height="127" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="290" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Interviews and focus groups</text><text x="48" y="317.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">who and how many; how contacted; open</text><text x="48" y="338.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">questions; how responses are recorded and</text><text x="48" y="359.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grouped into themes</text><rect x="460" y="253" width="410" height="127" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="290" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Surveys</text><text x="478" y="317.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the population and how it is sampled; pilot</text><text x="478" y="338.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the questions; a survey records what people</text><text x="478" y="359.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">say, not what they do</text><rect x="30" y="396" width="410" height="127" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="433" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Statistical or numerical data</text><text x="48" y="460.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">check definitions, period covered, who</text><text x="48" y="481.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collected it and how; decide the comparison in</text><text x="48" y="502.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advance</text><rect x="460" y="396" width="410" height="127" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="433" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Experiments</text><text x="478" y="460.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what you vary, measure and hold constant;</text><text x="478" y="481.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safety</text><rect x="30" y="543" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="574.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A stated search strategy turns “I read some articles” into a method.</text>
</svg>