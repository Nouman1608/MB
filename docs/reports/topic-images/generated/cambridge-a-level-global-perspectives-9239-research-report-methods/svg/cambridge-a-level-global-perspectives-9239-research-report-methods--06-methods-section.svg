<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five questions a methods section answers</text>

<text x="450" y="102" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle" font-style="italic">Example: “Are national school league tables a fair way to judge school quality?” (invented details)</text><rect x="30" y="120" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="158" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="165.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="102" y="162.12" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What did I do?</text><text x="370" y="151.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">analysed published exam results; reviewed literature on</text><text x="370" y="173" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">school accountability</text><line x1="68" y1="197" x2="68" y2="209" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="210" width="840" height="89.36" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="254.68" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="261.88" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="102" y="258.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How exactly?</text><text x="370" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">five years of results for 40 schools in one region</text><text x="370" y="259.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alongside free-meal eligibility; a university library</text><text x="370" y="280.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">search and the reference lists of two key reviews</text><line x1="68" y1="300.36" x2="68" y2="312.36" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="313.36" width="840" height="89.36" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="358.04" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="365.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="102" y="350.28000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why does this suit my</text><text x="102" y="374.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">question and subject?</text><text x="370" y="341.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the question has an empirical and a normative part;</text><text x="370" y="362.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">education research combines outcome data with argument</text><text x="370" y="383.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about what schools are for</text><line x1="68" y1="403.72" x2="68" y2="415.72" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="416.72" width="840" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="68" cy="454.72" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="68" y="461.92" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="102" y="458.84000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What are the limits?</text><text x="370" y="459.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">data from one region; no pupils’ or parents’ views</text><line x1="68" y1="493.72" x2="68" y2="505.72" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="506.72" width="840" height="89.36" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="68" cy="551.4" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="68" y="558.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="102" y="543.64" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How do the limits affect</text><text x="102" y="567.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">what I can conclude?</text><text x="370" y="534.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the finding about intake may not hold nationally; the</text><text x="370" y="555.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conclusion is about measurement, not how league tables are</text><text x="370" y="576.96" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">experienced</text><rect x="30" y="614.08" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="645.23" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Limits must be applied to the conclusion, not just listed (steps 4 and 5).</text>
</svg>