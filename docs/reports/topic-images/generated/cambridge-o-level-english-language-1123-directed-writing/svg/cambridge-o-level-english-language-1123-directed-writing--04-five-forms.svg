<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 792" width="900" height="792" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="792" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five forms and their conventions</text>

<text x="190" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Opening</text><text x="420" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Shape</text><text x="660" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Register</text><rect x="30" y="148" width="840" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="148" width="140" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="100" y="204" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Speech</text><text x="190" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">address the audience</text><text x="190" y="203" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">directly (“Good</text><text x="190" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">morning, everyone”)</text><text x="420" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">spoken signposts,</text><text x="420" y="203" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rhetorical questions, a</text><text x="420" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">memorable close</text><text x="660" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">set by the audience:</text><text x="660" y="203" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">peers, parents, a</text><text x="660" y="224" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">committee</text><rect x="30" y="258" width="840" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="258" width="140" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="100" y="314" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Email</text><text x="190" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">greeting, purpose in</text><text x="190" y="313" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">first lines</text><text x="420" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">short paragraphs, clear</text><text x="420" y="313" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">request or recommendation</text><text x="660" y="292" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">formal or semi-formal;</text><text x="660" y="313" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">set by the recipient</text><rect x="30" y="368" width="840" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="368" width="140" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="100" y="424" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Report</text><text x="190" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">title, purpose or terms</text><text x="190" y="423" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of reference</text><text x="420" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">headings or clearly</text><text x="420" y="423" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marked sections,</text><text x="420" y="444" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">findings, recommendation</text><text x="660" y="402" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">impersonal, objective</text><rect x="30" y="478" width="840" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="478" width="140" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="100" y="534" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Letter</text><text x="190" y="512" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">appropriate salutation</text><text x="420" y="512" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">purpose, argument,</text><text x="420" y="533" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">request or call to</text><text x="420" y="554" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">action, sign-off</text><text x="660" y="512" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">formal for officials</text><text x="660" y="533" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and editors</text><rect x="30" y="588" width="840" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="588" width="140" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="100" y="644" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Article</text><text x="190" y="622" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">headline, engaging</text><text x="190" y="643" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">opening</text><text x="420" y="622" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">developed paragraphs, a</text><text x="420" y="643" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">viewpoint, a strong</text><text x="420" y="664" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ending</text><text x="660" y="622" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">suited to the</text><text x="660" y="643" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">publication’s readers</text><rect x="30" y="708" width="840" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="745" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">W4, “use register appropriate to context”, is assessed in this task.</text>
</svg>