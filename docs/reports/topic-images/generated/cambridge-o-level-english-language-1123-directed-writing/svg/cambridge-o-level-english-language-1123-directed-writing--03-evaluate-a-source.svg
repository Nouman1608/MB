<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 752" width="900" height="752" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="752" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six questions to evaluate a source</text>

<text x="450" y="104" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Influence may include facts, ideas, perspectives, opinions and bias</text><rect x="30" y="128" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="166" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="174" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">?</text><text x="104" y="173" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Fact or opinion?</text><text x="54" y="212" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">numbers and verifiable events versus</text><text x="54" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">judgements (“disastrous”, “obviously”)</text><rect x="460" y="128" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="500" cy="166" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="174" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">?</text><text x="534" y="173" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Whose perspective?</text><text x="484" y="212" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who wrote it and what they stand to gain</text><text x="484" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or lose</text><rect x="30" y="278" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="316" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="324" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">?</text><text x="104" y="323" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Bias?</text><text x="54" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one side only, loaded words, missing</text><text x="54" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">counter-arguments</text><rect x="460" y="278" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="500" cy="316" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="324" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">?</text><text x="534" y="323" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence?</text><text x="484" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is a claim supported, and by what: data,</text><text x="484" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">examples, one anecdote?</text><rect x="30" y="428" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="466" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="474" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">?</text><text x="104" y="473" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Conflict?</text><text x="54" y="512" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">where two sources disagree, which is more</text><text x="54" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">convincing and why</text><rect x="460" y="428" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="500" cy="466" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="474" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">?</text><text x="534" y="473" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Gaps?</text><text x="484" y="512" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what neither source mentions that your</text><text x="484" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">audience would want to know</text><rect x="30" y="590" width="840" height="138" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="622" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Evaluation inside your own writing:</text><text x="50" y="652" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Although the developer claims the scheme will ‘transform the town’, it offers</text><text x="50" y="675" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">no figures to support this, and as the company building the road, it can hardly</text><text x="50" y="698" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">be called neutral.”</text>
</svg>