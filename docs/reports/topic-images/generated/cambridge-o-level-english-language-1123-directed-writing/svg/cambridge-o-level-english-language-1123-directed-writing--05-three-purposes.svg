<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Discursive, argumentative, persuasive</text>

<rect x="30" y="110" width="270" height="420" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="150" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Discursive</text><line x1="165" y1="200" x2="165" y2="300" stroke="#1e2a44" stroke-width="4"/><line x1="85" y1="210" x2="245" y2="210" stroke="#1e2a44" stroke-width="4"/><path d="M85,210 l-26,46 h52 z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M245,210 l-26,46 h52 z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="85" y="280" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">side A</text><text x="245" y="280" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">side B</text><rect x="125" y="300" width="80" height="12" fill="#1e2a44"/><text x="52" y="348" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weigh both sides fairly and</text><text x="52" y="371" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reach a judgement</text><text x="52" y="460" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Cue in the question:</text><rect x="50" y="472" width="230" height="40" rx="20" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="498" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">“consider the views…”</text><rect x="315" y="110" width="270" height="420" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="150" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">Argumentative</text><rect x="388" y="194" width="124" height="40" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="220" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">position</text><line x1="380" y1="272" x2="408" y2="236" stroke="#1e2a44" stroke-width="3"/><rect x="350" y="272" width="60" height="30" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="380" y="293" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">reason</text><line x1="450" y1="272" x2="450" y2="236" stroke="#1e2a44" stroke-width="3"/><rect x="420" y="272" width="60" height="30" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="293" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">reason</text><line x1="520" y1="272" x2="492" y2="236" stroke="#1e2a44" stroke-width="3"/><rect x="490" y="272" width="60" height="30" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="520" y="293" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">reason</text><path d="M542,180 L518,206" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="546" y="172" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">counter</text><text x="337" y="348" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">take a position and defend</text><text x="337" y="371" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">it with reasons, answering</text><text x="337" y="394" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">counter-arguments</text><text x="337" y="460" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Cue in the question:</text><rect x="335" y="472" width="230" height="40" rx="20" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="498" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">“argue for or against…”</text><rect x="600" y="110" width="270" height="420" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="735" y="150" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">Persuasive</text><circle cx="675" cy="250" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="255" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">you</text><path d="M705,250 L763,250" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><circle cx="795" cy="224" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="809" cy="250" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="795" cy="276" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="801" y="306" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">audience</text><text x="735" y="206" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">agree or act</text><text x="622" y="348" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">move the audience to agree</text><text x="622" y="371" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or act: appeals to their</text><text x="622" y="394" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">interests and feelings as</text><text x="622" y="417" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">well as reasons</text><text x="622" y="460" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Cue in the question:</text><rect x="620" y="472" width="230" height="40" rx="20" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="735" y="498" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">“persuade the council…”</text><rect x="30" y="550" width="840" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="585" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">“Consider” in the syllabus means “review and respond to given information”.</text>
</svg>