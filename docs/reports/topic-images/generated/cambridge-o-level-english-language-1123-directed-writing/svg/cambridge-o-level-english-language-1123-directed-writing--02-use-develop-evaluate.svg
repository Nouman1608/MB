<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three verbs that climb in difficulty</text>

<g transform="translate(0,-70)"><rect x="30" y="380" width="270" height="220" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="420" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Use</text><text x="50" y="448" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">the minimum</text><text x="50" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Take relevant ideas from the</text><text x="50" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">source(s) and put them in</text><text x="50" y="528" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">your answer. Used alone,</text><text x="50" y="550" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">restating points in order,</text><text x="50" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it reads like a summary.</text><rect x="315" y="290" width="270" height="310" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="335" y="330" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Develop</text><text x="335" y="358" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">take an idea further</text><text x="335" y="394" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Draw out a consequence, give</text><text x="335" y="416" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a fresh example, connect two</text><text x="335" y="438" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">points from different</text><text x="335" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sources, or apply an idea to</text><text x="335" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">your audience.</text><rect x="600" y="200" width="270" height="400" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="620" y="240" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate</text><text x="620" y="268" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">judge the ideas</text><text x="620" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Is a claim backed by</text><text x="620" y="326" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evidence? Is the writer</text><text x="620" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">biased? Which argument is</text><text x="620" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stronger, and why? What has</text><text x="620" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a source left out?</text><path d="M110,366 C150,310 230,292 312,290" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M395,276 C435,220 515,202 597,200" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="205" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">harder</text><text x="490" y="244" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">harder</text><rect x="30" y="620" width="840" height="100" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="652" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Develop, in the guide’s example:</text><text x="50" y="680" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The article says the new road would cut journey times;</text><text x="50" y="703" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">for our students, that could mean twenty minutes more sleep each morning.”</text><rect x="30" y="736" width="840" height="54" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="770" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">High reading marks come from develop and evaluate, not from use.</text></g>
</svg>