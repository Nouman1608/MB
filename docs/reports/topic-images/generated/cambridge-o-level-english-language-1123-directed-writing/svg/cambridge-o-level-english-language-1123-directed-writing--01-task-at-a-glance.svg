<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Directed writing at a glance</text>

<rect x="30" y="110" width="250" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Read</text><rect x="60" y="166" width="90" height="112" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="160" y="166" width="90" height="112" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><line x1="74" y1="186" x2="136" y2="186" stroke="#8a6d0d" stroke-width="3"/><line x1="74" y1="203" x2="136" y2="203" stroke="#8a6d0d" stroke-width="3"/><line x1="74" y1="220" x2="136" y2="220" stroke="#8a6d0d" stroke-width="3"/><line x1="74" y1="237" x2="112" y2="237" stroke="#8a6d0d" stroke-width="3"/><line x1="174" y1="186" x2="236" y2="186" stroke="#8a6d0d" stroke-width="3"/><line x1="174" y1="203" x2="236" y2="203" stroke="#8a6d0d" stroke-width="3"/><line x1="174" y1="220" x2="236" y2="220" stroke="#8a6d0d" stroke-width="3"/><line x1="174" y1="237" x2="212" y2="237" stroke="#8a6d0d" stroke-width="3"/><text x="105" y="268" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Text 1</text><text x="205" y="268" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Text 2</text><text x="155" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">one or two texts</text><text x="155" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">about 400–450 words</text><line x1="284" y1="235" x2="316" y2="235" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="110" width="250" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="445" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Work on the ideas</text><rect x="360" y="168" width="170" height="46" rx="23" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="197.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">use</text><rect x="360" y="228" width="170" height="46" rx="23" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="257.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">develop</text><rect x="360" y="288" width="170" height="46" rx="23" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="317.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">evaluate</text><line x1="574" y1="235" x2="606" y2="235" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="110" width="260" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Write</text><text x="740" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a discursive / argumentative /</text><text x="740" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">persuasive piece as a:</text><rect x="628" y="212" width="72" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="664" y="235.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">speech</text><rect x="706" y="212" width="72" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="742" y="235.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">email</text><rect x="784" y="212" width="72" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="820" y="235.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">report</text><rect x="667" y="258" width="72" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="703" y="281.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">letter</text><rect x="745" y="258" width="72" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="781" y="281.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">article</text><text x="740" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">about 250–350 words</text><text x="450" y="404" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">One compulsory question: 25 marks</text><rect x="30" y="424" width="504" height="70" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="534" y="424" width="336" height="70" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="282" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Writing: 15 marks</text><text x="282" y="481" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">W1–W5</text><text x="702" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Reading: 10 marks</text><text x="702" y="481" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">R3, R5</text><rect x="30" y="518" width="413" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="550" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">R3</text><text x="50" y="576" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“analyse, evaluate and develop facts, ideas</text><text x="50" y="596" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and opinions, using appropriate support from</text><text x="50" y="616" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the text”</text><rect x="457" y="518" width="413" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="550" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">R5</text><text x="477" y="576" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“select and use information for specific</text><text x="477" y="596" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">purposes”</text>
</svg>