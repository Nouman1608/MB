<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 928" width="900" height="928" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="928" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Market Street</text>

<rect x="30" y="110" width="330" height="250" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="142" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Text 1: council leaflet</text><text x="50" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">• Closing Market Street on</text><text x="50" y="193" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Saturdays: safer, cleaner</text><text x="50" y="234" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">• Similar schemes “popular” with</text><text x="50" y="253" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">families</text><text x="50" y="294" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">• Park on the edge of town; free</text><text x="50" y="313" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">shuttle bus</text><rect x="540" y="110" width="330" height="250" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="560" y="142" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Text 2: shopkeeper’s letter</text><text x="560" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">• “This plan will kill small</text><text x="560" y="193" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">businesses”</text><text x="560" y="234" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">• Elderly customers will not wait</text><text x="560" y="253" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">for shuttle buses</text><text x="560" y="294" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">• Council has not asked a single</text><text x="560" y="313" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">shopkeeper</text><rect x="370" y="160" width="160" height="150" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="196" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Task</text><text x="450" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a letter to the</text><text x="450" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">council giving</text><text x="450" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">your views</text><text x="450" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">250–350 words</text><text x="450" y="398" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Moves in the model paragraph</text><rect x="30" y="418" width="840" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="418" width="150" height="72" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="105" y="460" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">USE</text><text x="200" y="448" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A car-free street would be safer, especially for families.</text><text x="850" y="478" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">point from Text 1</text><rect x="30" y="502" width="840" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="502" width="150" height="72" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="105" y="544" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">EVALUATE</text><text x="200" y="532" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Popular” is vague: popular with whom, and for how long?</text><text x="850" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">weak evidence in Text 1</text><rect x="30" y="586" width="840" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="586" width="150" height="72" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="105" y="628" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">EVALUATE</text><text x="200" y="616" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The shopkeeper’s concern deserves more weight than the leaflet</text><text x="200" y="636" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gives it.</text><text x="850" y="646" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Text 2 treated as fair</text><rect x="30" y="670" width="840" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="670" width="150" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="105" y="712" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">DEVELOP</text><text x="200" y="700" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Elderly shoppers who find the bus difficult could leave the</text><text x="200" y="720" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">street empty of the customers small shops rely on.</text><text x="850" y="730" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">a consequence</text><rect x="30" y="754" width="840" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="754" width="150" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="105" y="796" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">DEVELOP</text><text x="200" y="784" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consult traders first; try alternate Saturdays so the effect</text><text x="200" y="804" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on trade is measured.</text><text x="850" y="814" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">a solution neither text offered</text><rect x="30" y="846" width="840" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="882" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The proposal is the candidate’s own, but it grows from the conflict between sources.</text>
</svg>