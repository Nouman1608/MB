<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning in ten minutes</text>

<rect x="100" y="110" width="770" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="56" cy="156" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="164.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="124" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the question</text><text x="124" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">form, audience, purpose, and any bullet points it asks you to cover</text><line x1="56" y1="182" x2="56" y2="263" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="214" width="770" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="56" cy="289" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="56" y="297.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="124" y="252" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the source(s) twice and annotate</text><rect x="124" y="272" width="52" height="52" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="150" y="306" font-size="24" font-weight="700" fill="#8a6d0d" text-anchor="middle">U</text><text x="188" y="304" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">useful point</text><rect x="369" y="272" width="52" height="52" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="395" y="306" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">D</text><text x="433" y="304" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">could develop</text><rect x="614" y="272" width="52" height="52" rx="8" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="640" y="306" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">E</text><text x="678" y="304" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">needs evaluating</text><text x="124" y="350" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">E = bias, weak evidence, conflict</text><line x1="56" y1="315" x2="56" y2="382" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="376" width="770" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="56" cy="408" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="416.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="124" y="414" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Decide your position or judgement</text><line x1="56" y1="434" x2="56" y2="472" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="452" width="770" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="56" cy="498" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="506.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="124" y="490" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Plan four or five paragraphs</text><text x="124" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for each: the source point and your development or evaluation</text><line x1="56" y1="524" x2="56" y2="576" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="556" width="770" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="56" cy="602" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="610.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="124" y="594" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Plan your opening and closing</text><text x="124" y="624" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in the form’s conventions</text>
</svg>