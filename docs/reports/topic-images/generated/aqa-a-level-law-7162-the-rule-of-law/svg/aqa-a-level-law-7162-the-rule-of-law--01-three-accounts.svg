<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621" width="900" height="621" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="621" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three accounts of the rule of law</text>

<rect x="30" y="100" width="270.6666666666667" height="242" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A. V. DICEY (1885)</text><text x="46" y="159.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="159.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No punishment except for a</text><text x="61.2" y="180.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breach of law before the</text><text x="61.2" y="201.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ordinary courts</text><text x="46" y="227.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Everyone subject to the</text><text x="61.2" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ordinary law and courts</text><text x="46" y="274.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="274.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rights secured by judicial</text><text x="61.2" y="295.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decisions, not a written</text><text x="61.2" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">constitution</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="242" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JOSEPH RAZ (1977): FORMAL</text><text x="330.6666666666667" y="159.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="159.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Law should be able to guide</text><text x="345.8666666666667" y="180.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">behaviour</text><text x="330.6666666666667" y="206.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prospective, open, clear,</text><text x="345.8666666666667" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relatively stable</text><text x="330.6666666666667" y="253.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Applied by independent</text><text x="345.8666666666667" y="274.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">courts</text><text x="330.6666666666667" y="300.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="300.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A system could comply and</text><text x="345.8666666666667" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">still be unjust in content</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="242" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LORD BINGHAM (2010): THICKER</text><text x="615.3333333333334" y="159.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="630.5333333333334" y="159.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Eight principles</text><text x="615.3333333333334" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="630.5333333333334" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Includes protection of</text><text x="630.5333333333334" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">fundamental</tspan> <tspan font-weight="700" fill="#1e2a44">human</tspan> <tspan font-weight="700" fill="#1e2a44">rights</tspan></text><text x="615.3333333333334" y="232.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="630.5333333333334" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and compliance with</text><text x="630.5333333333334" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">international law</text><line x1="40" y1="384" x2="860" y2="384" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="412" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">thicker: more content counts as part of the rule of law</text><rect x="30" y="442" width="840" height="147" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="472" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVALUATION TEST CASE</text><text x="48" y="498.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A law that is clear and prospective but violates rights</text><rect x="50" y="524" width="392" height="47" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="246" y="552.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Raz: rule of law satisfied</text><rect x="458" y="524" width="392" height="47" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="654" y="552.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Bingham: not satisfied</text>
</svg>