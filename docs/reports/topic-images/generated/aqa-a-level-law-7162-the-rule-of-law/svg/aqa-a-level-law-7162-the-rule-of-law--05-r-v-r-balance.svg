<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Retrospective judicial change: R v R</text>

<rect x="30" y="100" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><polygon points="450,190 416,330 484,330" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="160" y1="210" x2="740" y2="170" stroke="#1e2a44" stroke-width="5"/><path d="M190,212 L120,262 M190,212 L260,262" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M85,262 L295,262 Q190,332 85,262 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="190" y="324" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Respect for human dignity</text><path d="M710,172 L640,222 M710,172 L780,222" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M605,222 L815,222 Q710,292 605,222 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="710" y="284" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">No retrospective liability</text><text x="450" y="138" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Change was a foreseeable development of the law</text><rect x="30" y="382" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="412" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R v R (1991)</text><text x="48" y="443.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">House of Lords: a husband could be guilty of</text><text x="48" y="464.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">raping his wife.</text><rect x="458" y="382" width="412" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="412" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SW v UNITED KINGDOM (1995)</text><text x="476" y="443.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ECtHR: no breach of Article 7; the change was</text><text x="476" y="464.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foreseeable and removing marital immunity</text><text x="476" y="485.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">respected human dignity.</text>
</svg>