<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a 5-mark “explain” answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Explain how the rule of law applies to the legal system</text>
<line x1="60" y1="144" x2="60" y2="583" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CORE PRINCIPLE</text><text x="118" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Disputes decided by independent courts applying the law fairly</text><circle cx="60" cy="159.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="168.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="205" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="231" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ELEMENT + CASE</text><text x="118" y="257.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Equality: the government is subject to the courts</text><text x="118" y="285.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">M</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Home</tspan> <tspan font-style="italic">Office</tspan> (1993): Home Secretary in contempt</text><circle cx="60" cy="254.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="263.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="314" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="340" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECOND ELEMENT + CASE</text><text x="118" y="366.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fairness: people must be able to reach the courts</text><text x="118" y="394.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Employment tribunal fees quashed in <tspan font-style="italic">UNISON</tspan> (2017)</text><circle cx="60" cy="363.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="372.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="423" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="449" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEORY LINKED</text><text x="118" y="475.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bingham’s sixth principle</text><text x="118" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No prohibitive cost or inordinate delay</text><circle cx="60" cy="472.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="481.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="532" width="766" height="71" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="558" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVALUATIVE POINT</text><text x="118" y="584.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Legal aid reductions mean some cannot enforce their rights</text><circle cx="60" cy="567.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="576.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>