<clipPath id="tc100"><rect x="30" y="100" width="840" height="316" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="178.1818181818182" height="49" fill="#b5d3cf"/><text x="44" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Area</text><rect x="208.1818181818182" y="100" width="330.90909090909093" height="49" fill="#b5d3cf"/><text x="222.1818181818182" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rule of law respected</text><rect x="539.0909090909091" y="100" width="330.90909090909093" height="49" fill="#f2e7b8"/><text x="553.0909090909091" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rule of law under strain</text><rect x="30" y="149" width="178.1818181818182" height="89" fill="#dce9e7"/><text x="44" y="175.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Law making</text><rect x="208.1818181818182" y="149" width="330.90909090909093" height="89" fill="#ffffff"/><text x="222.1818181818182" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Statutes published and generally</text><text x="222.1818181818182" y="196.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prospective; HRA 1998 s19 statement of</text><text x="222.1818181818182" y="217.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compatibility</text><rect x="539.0909090909091" y="149" width="330.90909090909093" height="89" fill="#f2e7b8"/><text x="553.0909090909091" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Retrospective legislation; Henry VIII</text><text x="553.0909090909091" y="196.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">powers; wide ouster clauses</text><line x1="30" y1="238" x2="870" y2="238" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="238" width="178.1818181818182" height="68" fill="#dce9e7"/><text x="44" y="264.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The legal system</text><rect x="208.1818181818182" y="238" width="330.90909090909093" height="68" fill="#f8faf9"/><text x="222.1818181818182" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Independent judges; open courts;</text><text x="222.1818181818182" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">appeals; judicial review; jury trial</text><rect x="539.0909090909091" y="238" width="330.90909090909093" height="68" fill="#f2e7b8"/><text x="553.0909090909091" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cost of litigation; reduced legal aid;</text><text x="553.0909090909091" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">delay</text><line x1="30" y1="306" x2="870" y2="306" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="306" width="178.1818181818182" height="110" fill="#dce9e7"/><text x="44" y="332.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Substantive law</text><rect x="208.1818181818182" y="306" width="330.90909090909093" height="110" fill="#ffffff"/><text x="222.1818181818182" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Offences defined in advance;</text><text x="222.1818181818182" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">presumption of mens rea; Article 7</text><rect x="539.0909090909091" y="306" width="330.90909090909093" height="110" fill="#f2e7b8"/><text x="553.0909090909091" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Vague common law offences</text><text x="553.0909090909091" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(conspiracy to corrupt public morals);</text><text x="553.0909090909091" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strict liability; retrospective judicial</text><text x="553.0909090909091" y="395.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change</text></g><line x1="208.1818181818182" y1="100" x2="208.1818181818182" y2="416" stroke="#c9d6d4" stroke-width="1.5"/><line x1="539.0909090909091" y1="100" x2="539.0909090909091" y2="416" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="316" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="438" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> describing the elements without applying them to law making, the legal system <tspan font-weight="700" fill="#1e2a44">and</tspan></text><text x="450" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">substantive law.</text>
