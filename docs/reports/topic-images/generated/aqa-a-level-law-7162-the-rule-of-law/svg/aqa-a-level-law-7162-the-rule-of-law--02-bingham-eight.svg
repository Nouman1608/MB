<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 557" width="900" height="557" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="557" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Lord Bingham’s eight principles</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The Rule of Law (2010)</text>
<rect x="84" y="124" width="358" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="98" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Law accessible and, so far as possible,</text><text x="98" y="172.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">intelligible, clear and predictable</text><circle cx="54" cy="157" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="164.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="512" y="124" width="358" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Legal rights resolved by applying the</text><text x="526" y="172.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">law, not by discretion</text><circle cx="482" cy="157" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="482" y="164.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="84" y="202" width="358" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="98" y="239.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Law applies equally to all, except where</text><text x="98" y="260.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">objective differences justify it</text><circle cx="54" cy="245.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="253.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="512" y="202" width="358" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="229.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ministers and officials act in good faith,</text><text x="526" y="250.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">fairly, for the proper purpose, within</text><text x="526" y="271.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">limits</text><circle cx="482" cy="245.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="482" y="253.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="84" y="301" width="358" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="98" y="328.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Adequate protection of fundamental</text><text x="98" y="349.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">human rights</text><circle cx="54" cy="334" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="341.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="512" y="301" width="358" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="328.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Civil disputes resolved without</text><text x="526" y="349.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">prohibitive cost or inordinate delay</text><circle cx="482" cy="334" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="482" y="341.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="84" y="379" width="358" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="98" y="416.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Adjudicative procedures must be fair</text><circle cx="54" cy="412" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="419.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="512" y="379" width="358" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="406.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The state complies with its obligations</text><text x="526" y="427.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">in international law</text><circle cx="482" cy="412" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="482" y="419.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><rect x="30" y="467" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="500.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Principle 5 is the one Raz would leave out. Principle 6 links the doctrine to access to justice.</text>
</svg>