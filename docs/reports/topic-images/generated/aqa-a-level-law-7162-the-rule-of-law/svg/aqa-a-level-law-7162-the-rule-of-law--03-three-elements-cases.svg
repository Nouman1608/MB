<rect width="900" height="511" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The three elements and fresh authorities</text>

<rect x="30" y="100" width="270" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="127.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">No sanction except in</text><text x="165" y="148.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">accordance with the law</text><rect x="30" y="178" width="270" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="202.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Laporte</tspan> (2006)</text><text x="42" y="229" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Protesters’ coaches turned back</text><text x="42" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">with no imminent breach of the</text><text x="42" y="269" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">peace: unlawful</text><rect x="30" y="295" width="270" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="319.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Liversidge</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Anderson</tspan> (1942)</text><text x="42" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Lord Atkin’s dissent now seen as</text><text x="42" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">correct</text><rect x="30" y="392" width="270" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="416.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Article 7 ECHR</text><text x="42" y="443" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">No punishment for conduct not an</text><text x="42" y="463" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">offence when committed</text><rect x="315" y="100" width="270" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="137.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Equality before the law</text><rect x="315" y="178" width="270" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="327" y="202.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">M</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Home</tspan> <tspan font-style="italic">Office</tspan> (1993)</text><text x="327" y="229" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Home Secretary in contempt for</text><text x="327" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">disobeying a court order</text><rect x="315" y="275" width="270" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="327" y="299.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Chaytor</tspan> (2010)</text><text x="327" y="326" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">MPs’ expenses: no privilege from</text><text x="327" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ordinary criminal law</text><rect x="315" y="372" width="270" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="327" y="396.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Exceptions</text><text x="327" y="423" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Diplomatic immunity (1964 Act);</text><text x="327" y="443" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the monarch</text><rect x="600" y="100" width="270" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="137.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Fairness and clarity</text><rect x="600" y="178" width="270" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="202.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">(Evans)</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">AG</tspan> (2015)</text><text x="612" y="229" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Minister could not override a</text><text x="612" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">tribunal just by disagreeing</text><rect x="600" y="275" width="270" height="67" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="299.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Miller;</tspan> <tspan font-style="italic">Cherry</tspan> (2019)</text><text x="612" y="326" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Five-week prorogation unlawful</text><rect x="600" y="352" width="270" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="376.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Anisminic</tspan> (1969); <tspan font-style="italic">Privacy</tspan></text><text x="612" y="396.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">International</tspan> (2019)</text><text x="612" y="423" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Ouster clauses read narrowly</text>
</svg>