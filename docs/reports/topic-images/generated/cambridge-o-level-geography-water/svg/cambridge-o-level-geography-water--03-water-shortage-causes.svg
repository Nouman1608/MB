<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why some places run short of water</text>

<rect x="30" y="115" width="410" height="280" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Physical causes</text><text x="55" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low or unreliable rainfall: deserts,</text><text x="71" y="201" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">semi-arid areas</text><text x="55" y="234" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High temperatures increase evaporation</text><text x="55" y="267" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="267" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Drought years, perhaps more frequent</text><text x="71" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with climate change</text><text x="55" y="321" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="321" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Small countries or islands with few</text><text x="71" y="342" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rivers or little storage</text><rect x="460" y="115" width="410" height="280" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="150" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Human causes</text><text x="485" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Population growth and urbanisation</text><text x="485" y="209" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="209" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More irrigated farming</text><text x="485" y="238" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Groundwater pumped faster than aquifers</text><text x="501" y="259" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recharge</text><text x="485" y="288" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pollution of rivers and aquifers</text><text x="485" y="317" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="317" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No money for dams, pipes, treatment</text><text x="485" y="346" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Leaking pipes, wasteful use</text><rect x="30" y="415" width="840" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="452" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Not only a physical problem</text><text x="55" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economic water scarcity: rainfall may be adequate, but there is no money to build</text><text x="55" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dams, pipes and treatment works, so people still lack safe water.</text>
</svg>