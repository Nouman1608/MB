<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 745" width="900" height="745" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="745" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Case study: Singapore’s Four National Taps</text>

<circle cx="450" cy="380" r="95" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><text x="450" y="372" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Singapore</text><text x="450" y="398" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">water supply (PUB)</text><rect x="30" y="120" width="270" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="153.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1  Local catchment</text><text x="48" y="177.32500000000002" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Drains, canals and rivers</text><text x="48" y="197.78500000000003" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">feed reservoirs; Marina</text><text x="48" y="218.245" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Barrage (2008) also controls</text><text x="48" y="238.705" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">floods.</text><line x1="290.8169492582708" y1="246.724745806178" x2="366.12203382781945" y2="325.55289915139156" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><rect x="600" y="120" width="270" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="153.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2  Imported water</text><text x="618" y="177.32500000000002" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Piped from Johor, Malaysia,</text><text x="618" y="197.78500000000003" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">under an agreement to 2061.</text><line x1="609.1830507417292" y1="246.724745806178" x2="533.8779661721805" y2="325.55289915139156" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><rect x="30" y="470" width="270" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="503.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">3  NEWater</text><text x="48" y="527.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Used water treated with</text><text x="48" y="547.7850000000001" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">membranes and UV; mainly for</text><text x="48" y="568.245" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">industry such as wafer</text><text x="48" y="588.705" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">plants.</text><line x1="294.8139428221689" y1="497.40155429853803" x2="363.4573714518874" y2="430.1036270541705" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><rect x="600" y="470" width="270" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="503.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">4  Desalination</text><text x="618" y="527.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Seawater treated in plants</text><text x="618" y="547.7850000000001" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">such as those at Tuas.</text><line x1="605.1860571778311" y1="497.40155429853803" x2="536.5426285481126" y2="430.1036270541705" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><rect x="312" y="130" width="276" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="160" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Why it needs them</text><text x="450" y="184" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">heavy rain, but little land to store</text><text x="450" y="203" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">it; no large rivers or aquifers</text><rect x="312" y="530" width="276" height="90" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="560" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Managing demand</text><text x="450" y="584" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">pricing, a water conservation tax,</text><text x="450" y="603" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">saving campaigns</text><rect x="30" y="645" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="678" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Secure supply through technology and planning, but desalination and NEWater</text><text x="450" y="704" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">use a lot of energy, and the approach needs wealth many countries lack.</text>
</svg>