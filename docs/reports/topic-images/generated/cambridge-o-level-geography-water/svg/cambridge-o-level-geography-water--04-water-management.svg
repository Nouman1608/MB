<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Managing water for the future</text>

<path d="M330,200 L330,470 Q330,500 360,500 L540,500 Q570,500 570,470 L570,200" fill="none" stroke="#1e2a44" stroke-width="4"/><rect x="333" y="300" width="234" height="197" fill="#b5d3cf"/><line x1="333" y1="300" x2="567" y2="300" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="410" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">usable</text><text x="450" y="434" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">fresh water</text><line x1="250" y1="160" x2="400" y2="260" stroke="#2e6b62" stroke-width="7" marker-end="url(#ahT)"/><line x1="570" y1="450" x2="690" y2="450" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><path d="M500,500 q6,14 0,24 M520,500 q6,14 0,24" fill="none" stroke="#2b5a9a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="512" y="545" font-size="14.5" font-weight="600" fill="#2b5a9a" text-anchor="middle">leaks</text><rect x="30" y="115" width="260" height="220" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="149.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Increase supply</text><text x="48" y="178" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="178" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">New reservoirs</text><text x="48" y="202" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="202" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Desalination</text><text x="48" y="226" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="226" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Water recycling</text><text x="48" y="250" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="250" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Transfers</text><text x="48" y="274" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="274" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Rainwater harvesting</text><rect x="610" y="330" width="260" height="260" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="628" y="364.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Reduce demand</text><text x="628" y="392" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="392" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Meters and pricing</text><text x="628" y="416" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="416" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Fix leaks</text><text x="628" y="440" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="440" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Efficient appliances</text><text x="628" y="464" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="464" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Drip irrigation</text><text x="628" y="488" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="488" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Education campaigns</text><text x="628" y="512" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="644" y="512" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Limit groundwater</text><text x="644" y="532" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">pumping</text><rect x="30" y="400" width="260" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="434.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Protect quality</text><text x="48" y="459.72499999999997" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Treat sewage; limit</text><text x="48" y="481.505" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">industrial and farm</text><text x="48" y="503.28499999999997" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">pollution.</text><line x1="294" y1="470" x2="326" y2="440" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="30" y="615" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="647" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Demand keeps rising while usable fresh water is limited:</text><text x="450" y="673" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">without management, aquifers run dry and rivers are polluted.</text>
</svg>