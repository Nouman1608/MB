<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 795" width="900" height="795" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="795" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where water comes from</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic landscape, not to scale</text>
<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="45" y="125" width="810" height="235" rx="10" fill="#dce9e7"/><path d="M45,360 L45,180 L130,170 L200,300 L250,320 L250,360 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M150,294 L238,294 L238,330 Q190,326 150,294 Z" fill="#b5d3cf"/><rect x="236" y="286" width="16" height="74" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="45" y="360" width="810" height="135" fill="#efdfa8"/><rect x="45" y="420" width="655" height="45" fill="#b5d3cf" opacity="0.65"/><line x1="45" y1="420" x2="700" y2="420" stroke="#2b5a9a" stroke-width="2" stroke-dasharray="8 5"/><rect x="54" y="431.75" width="309" height="20.25" rx="5" fill="#b5d3cf" opacity="1"/><text x="60" y="446" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">aquifer: rock holding groundwater</text><rect x="474" y="399.75" width="111" height="20.25" rx="5" fill="#efdfa8" opacity="1"/><text x="480" y="414" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">water table</text><path d="M252,350 Q330,356 400,358 L700,358" fill="none" stroke="#2b5a9a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><rect x="700" y="348" width="155" height="147" fill="#b5d3cf"/><text x="820" y="480" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">sea</text><line x1="320" y1="300" x2="320" y2="440" stroke="#1e2a44" stroke-width="4"/><rect x="305" y="284" width="30" height="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="440" y="320" width="40" height="30" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="460" y1="350" x2="460" y2="362" stroke="#1e2a44" stroke-width="4"/><rect x="490" y="334" width="33" height="26.400000000000002" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M486.7,334 L506.5,319.7 L526.3,334 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="527" y="338" width="14" height="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="620" y="310" width="76" height="48" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="560" y="324" width="50" height="34" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M200,290 Q260,175 500,175 L800,175" fill="none" stroke="#9c8f6e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="717" y="190.75" width="129" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="840" y="205" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">to a dry city</text><circle cx="195" cy="265" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="195" y="270.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="345" cy="270" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="345" y="275.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="460" cy="300" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="460" y="305.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="658" cy="288" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="658" y="293.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="585" cy="302" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="585" y="307.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><circle cx="520" cy="158" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="520" y="163.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><circle cx="510" cy="300" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="510" y="305.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="30" y="530" width="410" height="56" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="54" cy="558" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="563.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="78" y="554" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Reservoir and dam</text><text x="78" y="575" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">reliable store; floods land, evaporation losses</text><rect x="460" y="530" width="410" height="56" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="484" cy="558" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="484" y="563.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="508" y="554" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Well or borehole</text><text x="508" y="575" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cheap; over-pumping lowers the water table</text><rect x="30" y="594" width="410" height="56" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="54" cy="622" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="627.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="78" y="618" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">River abstraction</text><text x="78" y="639" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">simple; low in dry seasons, upstream pollution</text><rect x="460" y="594" width="410" height="56" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="484" cy="622" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="484" y="627.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="508" y="618" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Desalination</text><text x="508" y="639" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">unlimited at coasts; energy-hungry, brine waste</text><rect x="30" y="658" width="410" height="56" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="54" cy="686" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="691.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="78" y="682" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Water recycling</text><text x="78" y="703" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cuts demand on rivers; costly, some resistance</text><rect x="460" y="658" width="410" height="56" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="484" cy="686" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="484" y="691.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="508" y="682" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Water transfer</text><text x="508" y="703" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">reaches dry cities; very expensive</text><rect x="30" y="722" width="410" height="56" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="54" cy="750" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="755.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="78" y="746" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rainwater harvesting</text><text x="78" y="767" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cheap and local; depends on rain</text>
</svg>