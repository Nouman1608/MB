<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How water use changes with development</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Illustrative pattern from the lesson, for teaching only</text>
<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="184" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Low income</text><rect x="250" y="150" width="476" height="50" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><text x="488" y="182" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">85%</text><rect x="726" y="150" width="28" height="50" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="754" y="150" width="56" height="50" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="782" y="182" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">10%</text><text x="230" y="274" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Middle income</text><rect x="250" y="240" width="392" height="50" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><text x="446" y="272" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">70%</text><rect x="642" y="240" width="100.8" height="50" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="692.4" y="272" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">18%</text><rect x="742.8" y="240" width="67.2" height="50" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="776.4" y="272" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">12%</text><text x="230" y="364" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">High income</text><rect x="250" y="330" width="224" height="50" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><text x="362" y="362" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">40%</text><rect x="474" y="330" width="252" height="50" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="600" y="362" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">45%</text><rect x="726" y="330" width="84" height="50" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="768" y="362" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">15%</text><text x="740" y="144" font-size="14" font-weight="700" fill="#9c8f6e" text-anchor="middle">5%</text><rect x="270" y="410" width="22" height="16" fill="#a9c48f" stroke="#1e2a44" stroke-width="1.5"/><text x="300" y="424" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">agriculture</text><rect x="440" y="410" width="22" height="16" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><text x="470" y="424" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">industry</text><rect x="610" y="410" width="22" height="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="640" y="424" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">domestic</text><rect x="30" y="460" width="270" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="493.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Low income</text><text x="48" y="517.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Most people farm, many rely</text><text x="48" y="537.7850000000001" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">on irrigation; little</text><text x="48" y="558.245" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">industry; many homes lack</text><text x="48" y="578.705" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">piped water.</text><rect x="315" y="460" width="270" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="333" y="493.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Industrialising</text><text x="333" y="517.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Factories and power stations</text><text x="333" y="537.7850000000001" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">need water for processing</text><text x="333" y="558.245" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">and cooling, so industry’s</text><text x="333" y="578.705" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">share rises.</text><rect x="600" y="460" width="270" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="493.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">High income</text><text x="618" y="517.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Piped water, showers and</text><text x="618" y="537.7850000000001" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">appliances: high domestic</text><text x="618" y="558.245" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">use per person, though its</text><text x="618" y="578.705" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">share stays modest.</text><rect x="30" y="670" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="709" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Share (%) is not amount (volume): 40% of a large total can be a lot.</text>
</svg>