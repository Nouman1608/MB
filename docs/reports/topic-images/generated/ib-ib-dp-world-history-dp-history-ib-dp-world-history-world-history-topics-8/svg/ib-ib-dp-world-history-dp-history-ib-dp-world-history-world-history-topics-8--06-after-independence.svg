<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">After independence: the hardest stage</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">New states inherited borders, economies and institutions shaped by empire</text>
<rect x="30" y="124" width="270.6666666666667" height="291" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDIA</text><text x="45" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Partition and integration</text><text x="45" y="205.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="205.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Partition violence and</text><text x="60.2" y="226.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">refugees</text><text x="45" y="252.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kashmir conflict from 1947;</text><text x="60.2" y="273.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hyderabad absorbed (1948)</text><text x="45" y="299.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="299.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Constitution in force 26</text><text x="60.2" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">January 1950</text><text x="45" y="346.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Linguistic states (1956)</text><text x="45" y="372.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nehru's Five-Year Plans</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="291" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="329.6666666666667" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GHANA</text><text x="329.6666666666667" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economy and one-party</text><text x="329.6666666666667" y="200.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">rule</text><text x="329.6666666666667" y="228.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="344.8666666666667" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Volta River (Akosombo Dam)</text><text x="344.8666666666667" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">project</text><text x="329.6666666666667" y="275.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="344.8666666666667" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Falling cocoa prices</text><text x="329.6666666666667" y="301.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="344.8666666666667" y="301.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Preventive Detention Act</text><text x="344.8666666666667" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1958)</text><text x="329.6666666666667" y="348.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="344.8666666666667" y="348.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One-party state (1964)</text><text x="329.6666666666667" y="374.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="344.8666666666667" y="374.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nkrumah overthrown in a</text><text x="344.8666666666667" y="395.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">coup (1966)</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="291" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614.3333333333334" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ALGERIA</text><text x="614.3333333333334" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Departure and division</text><text x="614.3333333333334" y="205.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="629.5333333333334" y="205.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Most European settlers leave</text><text x="629.5333333333334" y="226.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in 1962, taking skills</text><text x="614.3333333333334" y="252.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="629.5333333333334" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reprisals against the harkis</text><text x="614.3333333333334" y="278.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="629.5333333333334" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ben Bella overthrown by</text><text x="629.5333333333334" y="299.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Boumediene (1965)</text><rect x="30" y="437" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="471.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do not stop at independence day</text><text x="50" y="501.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Many questions ask about the challenges of the years that followed and how governments</text><text x="50" y="523.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">responded.</text>
</svg>