<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Methods: a spectrum, not a choice</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Few movements were purely violent or purely peaceful</text>
<defs><linearGradient id="spg124" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="158" width="780" height="26" rx="13" fill="url(#spg124)" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="144" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Non-violent</text><text x="840" y="144" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">Armed struggle</text><path d="M99,184 L99,208 L129,216 L129,238" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="99" cy="171" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="238" width="198" height="159" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="266.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">India</text><text x="44" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Non-cooperation</text><text x="44" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1920-22), Salt March</text><text x="44" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1930), Quit India</text><text x="44" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1942); elections,</text><text x="44" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">negotiation</text><path d="M294,184 L294,208 L343,216 L343,238" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="294" cy="171" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="244" y="238" width="198" height="159" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="258" y="266.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ghana</text><text x="258" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Party organization</text><text x="258" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(CPP, 1949); strikes</text><text x="258" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and boycotts (1950);</text><text x="258" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">elections</text><path d="M699.5999999999999,184 L699.5999999999999,208 L557,216 L557,238" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="699.5999999999999" cy="171" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="458" y="238" width="198" height="159" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="266.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Algeria</text><text x="472" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">FLN armed struggle</text><text x="472" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from 1954; terrorism,</text><text x="472" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">guerrilla war;</text><text x="472" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">diplomacy</text><path d="M801,184 L801,208 L771,216 L771,238" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="801" cy="171" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="672" y="238" width="198" height="159" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="686" y="266.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vietnam</text><text x="686" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Communist-led</text><text x="686" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">organization; guerrilla,</text><text x="686" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">then conventional,</text><text x="686" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">war</text><text x="30" y="433" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">EFFECTIVENESS DEPENDED ON THE COLONIAL POWER'S RESPONSE</text><rect x="30" y="457" width="410" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="508.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Britain</text><text x="46" y="537.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Under Attlee, willing to leave India.</text><rect x="460" y="457" width="410" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="487.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">France</text><text x="476" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fought in Indochina and Algeria; Algeria was</text><text x="476" y="537.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">legally part of France and home to around a</text><text x="476" y="558.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">million European settlers.</text>
</svg>