<rect width="900" height="567" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three stages of an independence movement</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Questions target one stage, or the link between two</text>
<rect x="30" y="124" width="257.3333333333333" height="267" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 1</text><text x="45" y="177.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Origins and rise</text><text x="45" y="206.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nationalism and national</text><text x="60.2" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">identity</text><text x="45" y="253.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Political, economic, social</text><text x="60.2" y="274.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and religious grievances</text><text x="45" y="300.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wars and external events</text><text x="60.2" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">weaken the ruler</text><line x1="293.3333333333333" y1="257.5" x2="315.3333333333333" y2="257.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="124" width="257.3333333333333" height="267" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336.3333333333333" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 2</text><text x="336.3333333333333" y="177.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Methods and reasons</text><text x="336.3333333333333" y="201.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">for success</text><text x="336.3333333333333" y="230.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.5333333333333" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Violent and non-violent</text><text x="351.5333333333333" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">methods</text><text x="336.3333333333333" y="277.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.5333333333333" y="277.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mass mobilization</text><text x="336.3333333333333" y="303.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.5333333333333" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Leaders</text><text x="336.3333333333333" y="329.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.5333333333333" y="329.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">External factors: states,</text><text x="351.5333333333333" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">organizations, world wars,</text><text x="351.5333333333333" y="371.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cold War</text><line x1="584.6666666666666" y1="257.5" x2="606.6666666666666" y2="257.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="124" width="257.3333333333333" height="267" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="627.6666666666666" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 3</text><text x="627.6666666666666" y="177.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Challenges after</text><text x="627.6666666666666" y="201.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">independence</text><text x="627.6666666666666" y="230.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="642.8666666666667" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Political, economic, social</text><text x="627.6666666666666" y="256.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="642.8666666666667" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ethnic, religious, territorial</text><text x="627.6666666666666" y="282.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="642.8666666666667" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How governments</text><text x="642.8666666666667" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">responded</text><text x="30" y="427" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">PAIRS FROM DIFFERENT REGIONS</text><rect x="76" y="451" width="364" height="84" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="90" y="483.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Algeria and Ghana</text><text x="90" y="512.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">both in Africa and the Middle East</text><circle cx="48" cy="493" r="18" fill="#b5602e"/><path d="M41.16,486.16 L54.84,499.84 M54.84,486.16 L41.16,499.84" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="506" y="451" width="364" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="520" y="479.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">India and Ghana</text><text x="520" y="507.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Asia and Oceania; Africa and the Middle</text><text x="520" y="528.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">East</text><circle cx="478" cy="493" r="18" fill="#2e6b62"/><path d="M469.9,493 L476.2,499.84 L487,485.8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
</svg>