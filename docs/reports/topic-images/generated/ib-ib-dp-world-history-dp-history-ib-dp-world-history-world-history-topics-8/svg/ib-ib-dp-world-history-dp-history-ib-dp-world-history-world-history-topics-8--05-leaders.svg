<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Leaders: necessary, sufficient, decisive?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The judgement from the model introduction</text>
<text x="440" y="140" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Necessary</text><text x="530" y="140" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Decisive</text><rect x="30" y="156" width="360" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="186.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gandhi, India</text><text x="46" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Made Congress a mass movement after</text><text x="46" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1919; non-violent mass protest</text><circle cx="440" cy="218" r="20" fill="#2e6b62"/><path d="M431,218 L438,225.6 L450,210" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="530" cy="218" r="20" fill="#b5602e"/><path d="M522.4,210.4 L537.6,225.6 M537.6,210.4 L522.4,225.6" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="590" y="156" width="280" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="604" y="201.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Timing of 1947 owed more to</text><text x="604" y="222.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Britain's post-war weakness and</text><text x="604" y="243.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Attlee's decision to withdraw</text><rect x="30" y="296" width="360" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="326.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nkrumah, Gold Coast</text><text x="46" y="355.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Founded the CPP (1949); won elections in</text><text x="46" y="376.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1951 while in prison; transfer of power by</text><text x="46" y="397.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1957</text><circle cx="440" cy="358" r="20" fill="#2e6b62"/><path d="M431,358 L438,365.6 L450,350" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="530" cy="358" r="20" fill="#2e6b62"/><path d="M521,358 L528,365.6 L540,350" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="590" y="296" width="280" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="604" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">British willingness to decolonize</text><text x="604" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">met an organized mass party</text><rect x="30" y="442" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="476.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ask two questions of any leader</text><text x="50" y="506.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Was he <tspan font-weight="700" fill="#1e2a44">necessary</tspan> to success? Was he <tspan font-weight="700" fill="#1e2a44">sufficient</tspan>, or did structure (the ruler's weakness and</text><text x="50" y="528.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">choices) decide the outcome?</text>
</svg>