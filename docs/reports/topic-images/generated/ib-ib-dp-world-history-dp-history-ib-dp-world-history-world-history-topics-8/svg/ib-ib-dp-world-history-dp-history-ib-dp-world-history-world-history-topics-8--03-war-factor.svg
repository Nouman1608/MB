<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 487" width="900" height="487" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="487" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">War: the most powerful external factor</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Wars weakened rulers' economies and prestige and raised expectations</text>
<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">INDIA</text><rect x="30" y="148" width="198.1935483870968" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="185.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Second World War</text><line x1="234.1935483870968" y1="181" x2="258.1935483870968" y2="181" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="264.1935483870968" y="148" width="297.2903225806451" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="278.1935483870968" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quit India (1942); Britain depends</text><text x="278.1935483870968" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on Indian troops and resources</text><line x1="567.483870967742" y1="181" x2="591.483870967742" y2="181" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="597.483870967742" y="148" width="272.5161290322581" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="611.483870967742" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Labour wins in 1945, committed</text><text x="611.483870967742" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to withdrawal</text><text x="30" y="246" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">VIETNAM</text><rect x="30" y="256" width="198.1935483870968" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="292.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Japanese</text><text x="44" y="315.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">occupation</text><line x1="234.1935483870968" y1="299.5" x2="258.1935483870968" y2="299.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="264.1935483870968" y="256" width="297.2903225806451" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="278.1935483870968" y="282.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">French authority broken;</text><text x="278.1935483870968" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">independence declared 2</text><text x="278.1935483870968" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">September 1945</text><line x1="567.483870967742" y1="299.5" x2="591.483870967742" y2="299.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="597.483870967742" y="256" width="272.5161290322581" height="87" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="611.483870967742" y="293.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">French defeat at Dien Bien Phu</text><text x="611.483870967742" y="314.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1954); Geneva Accords</text><text x="30" y="375" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">LATIN AMERICA</text><rect x="30" y="385" width="198.1935483870968" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="413.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Napoleon invades</text><text x="44" y="436.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Spain (1808)</text><line x1="234.1935483870968" y1="420" x2="258.1935483870968" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="264.1935483870968" y="385" width="297.2903225806451" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="278.1935483870968" y="413.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A crisis of legitimacy in the Spanish</text><text x="278.1935483870968" y="434.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">empire</text><line x1="567.483870967742" y1="420" x2="591.483870967742" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="597.483870967742" y="385" width="272.5161290322581" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="611.483870967742" y="413.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Independence wars led by</text><text x="611.483870967742" y="434.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bolívar and San Martín</text>
</svg>