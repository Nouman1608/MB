<line x1="70" y1="124" x2="70" y2="514" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="70" y1="514" x2="70" y2="524" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="546" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1940</text><line x1="224" y1="124" x2="224" y2="514" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="224" y1="514" x2="224" y2="524" stroke="#1e2a44" stroke-width="2.5"/><text x="224" y="546" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1945</text><line x1="378" y1="124" x2="378" y2="514" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="378" y1="514" x2="378" y2="524" stroke="#1e2a44" stroke-width="2.5"/><text x="378" y="546" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1950</text><line x1="532" y1="124" x2="532" y2="514" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="532" y1="514" x2="532" y2="524" stroke="#1e2a44" stroke-width="2.5"/><text x="532" y="546" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1955</text><line x1="686" y1="124" x2="686" y2="514" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="686" y1="514" x2="686" y2="524" stroke="#1e2a44" stroke-width="2.5"/><text x="686" y="546" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1960</text><line x1="840" y1="124" x2="840" y2="514" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="840" y1="514" x2="840" y2="524" stroke="#1e2a44" stroke-width="2.5"/><text x="840" y="546" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1965</text><line x1="50" y1="514" x2="860" y2="514" stroke="#1e2a44" stroke-width="3"/><path d="M131.6,148 L141.6,161 L131.6,174 L121.6,161 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M285.6,148 L295.6,161 L285.6,174 L275.6,161 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="119.6" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">India: Quit India 1942; independence 15 August 1947</text><text x="119.6" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Partition into India and Pakistan</text><path d="M224,242 L234,255 L224,268 L214,255 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M501.2,242 L511.2,255 L501.2,268 L491.2,255 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="212" y="236" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vietnam: independence declared 2 September 1945</text><text x="212" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dien Bien Phu and the Geneva Accords, 1954</text><path d="M347.2,336 L357.2,349 L347.2,362 L337.2,349 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M378,336 L388,349 L378,362 L368,349 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M593.6,336 L603.6,349 L593.6,362 L583.6,349 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="335.2" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ghana: CPP 1949; Positive Action 1950</text><text x="335.2" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Independence 6 March 1957</text><path d="M501.2,430 L511.2,443 L501.2,456 L491.2,443 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><path d="M747.6,430 L757.6,443 L747.6,456 L737.6,443 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="759.6" y="424" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Algeria: FLN armed struggle from 1 November 1954</text><text x="759.6" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">Evian Accords March 1962; independence July 1962</text><rect x="30" y="576" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="610.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Earlier case: Latin America</text><text x="50" y="640.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Napoleon's invasion of Spain (1808) created a crisis of legitimacy in the Spanish empire that</text><text x="50" y="662.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">opened the way to the independence wars led by Bolívar and San Martín.</text>
