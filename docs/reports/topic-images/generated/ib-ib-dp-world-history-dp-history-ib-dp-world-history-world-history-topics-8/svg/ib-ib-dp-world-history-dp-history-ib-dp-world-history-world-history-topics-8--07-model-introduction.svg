<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes the model introduction work</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Evaluate the importance of leadership in two independence movements</text>
<line x1="60" y1="144" x2="60" y2="568" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFINES THE ISSUE</text><text x="122" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"... leadership mattered in different ways."</text><text x="122" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Asks in what ways leaders mattered, rather than asserting they were important.</text><circle cx="60" cy="177.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="186.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="243" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="273" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRECISE EVIDENCE</text><text x="122" y="299.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Congress after 1919; the CPP in 1949; elections in 1951; 1957</text><text x="122" y="327.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Both cases are evidenced from the first paragraph.</text><circle cx="60" cy="296.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="305.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="362" width="766" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="392" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMPARATIVE THESIS</text><text x="122" y="418.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"... necessary in both cases but decisive only in the Gold Coast"</text><text x="122" y="446.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A judgement of degree: necessary against decisive.</text><circle cx="60" cy="415.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="424.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="481" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="511" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SIGNALS THE COUNTER-ARGUMENT</text><text x="122" y="537.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Britain's post-war weakness; Attlee's decision</text><text x="122" y="565.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Structural factors and British policy that the body will weigh.</text><circle cx="60" cy="534.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="543.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>