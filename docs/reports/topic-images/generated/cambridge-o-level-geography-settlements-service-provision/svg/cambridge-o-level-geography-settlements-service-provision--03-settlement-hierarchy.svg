<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The settlement hierarchy</text>

<rect x="260" y="120" width="140" height="64" rx="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="330" y="160" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Conurbation</text><rect x="224" y="194" width="212" height="64" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="330" y="234" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">City</text><rect x="188" y="268" width="284" height="64" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="330" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Town</text><rect x="152" y="342" width="356" height="64" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="330" y="382" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Village</text><rect x="116" y="416" width="428" height="64" rx="8" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="330" y="456" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hamlet</text><rect x="80" y="490" width="500" height="64" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="330" y="530" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Isolated dwelling</text><line x1="690" y1="560" x2="690" y2="130" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="710" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Going up:</text><text x="710" y="196" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="726" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fewer settlements</text><text x="710" y="227" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="726" y="227" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each larger</text><text x="710" y="258" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="726" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">further apart</text><text x="710" y="289" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="726" y="289" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more and</text><text x="726" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">higher-order</text><text x="726" y="331" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">services</text><text x="710" y="362" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="726" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">larger sphere of</text><text x="726" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">influence</text><rect x="30" y="580" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="616" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it forms</text><text x="55" y="646" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Threshold: minimum number of people needed to keep a service running.</text><text x="55" y="672" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Range: maximum distance people will travel to use it.</text><text x="55" y="698" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">High threshold + long range → only large settlements can support the service.</text>
</svg>