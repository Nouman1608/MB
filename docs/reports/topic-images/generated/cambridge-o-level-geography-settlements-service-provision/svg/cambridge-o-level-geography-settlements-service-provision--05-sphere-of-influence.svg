ight="400" fill="#4a5568" text-anchor="middle" font-style="italic">lines = desire lines to customers’ homes (schematic)</text><text x="535" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Survey of 40 shoppers</text><text x="535" y="174" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">mean / furthest distance (km)</text><rect x="535" y="192" width="315" height="80" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="553" y="222" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Newsagent</text><text x="553" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1.5 / 4 km</text><text x="835" y="250" font-size="15" font-weight="600" fill="#4a5568" text-anchor="end">low-order</text><rect x="535" y="284" width="315" height="80" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="553" y="314" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Supermarket</text><text x="553" y="342" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">6 / 15 km</text><text x="835" y="342" font-size="15" font-weight="600" fill="#4a5568" text-anchor="end"></text><rect x="535" y="376" width="315" height="80" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="553" y="406" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Furniture store</text><text x="553" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">22 / 55 km</text><text x="835" y="434" font-size="15" font-weight="600" fill="#4a5568" text-anchor="end">high-order</text><text x="535" y="490" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Larger threshold and range → fewer</text><text x="535" y="511" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">settlements can support the</text><text x="535" y="532" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">service.</text>