<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 475" width="900" height="475" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="475" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rural services under pressure</text>

<rect x="30" y="115" width="270" height="240" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="149.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Why services close</text><text x="50" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More car ownership:</text><text x="66" y="201" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people shop in larger</text><text x="66" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">towns</text><text x="50" y="255" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="255" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Online shopping and</text><text x="66" y="276" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">banking</text><text x="50" y="309" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="309" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ageing or declining</text><text x="66" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">population</text><line x1="305" y1="235" x2="335" y2="235" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="340" y="115" width="220" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="358" y="149.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Losses</text><text x="360" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="376" y="180" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Village shops</text><text x="360" y="216" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="376" y="216" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Banks</text><text x="360" y="252" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="376" y="252" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Post offices</text><line x1="565" y1="235" x2="595" y2="235" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="600" y="115" width="270" height="240" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="149.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Responses</text><text x="620" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="636" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mobile libraries, clinics</text><text x="636" y="201" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and banking vans</text><text x="620" y="234" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="636" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Multi-purpose shop with</text><text x="636" y="255" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">post office and café</text><text x="620" y="288" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="636" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Community-run shops</text><rect x="30" y="375" width="840" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="420" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Fast-growing cities face the opposite problem: services cannot be built fast enough.</text>
</svg>