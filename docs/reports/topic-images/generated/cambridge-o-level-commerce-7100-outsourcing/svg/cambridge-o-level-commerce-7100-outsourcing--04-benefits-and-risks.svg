<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Should the business outsource?</text>

<rect x="30" y="110" width="410" height="345" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Benefits to the client</text><circle cx="66" cy="184.05" r="12" fill="#2e6b62"/><path d="M60.6,184.29000000000002 L64.8,188.61 L72,179.85000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No factories, warehouses or vehicles</text><text x="86" y="212" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to buy</text><circle cx="66" cy="244.05" r="12" fill="#2e6b62"/><path d="M60.6,244.29000000000002 L64.8,248.61 L72,239.85000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Expertise and modern equipment</text><circle cx="66" cy="282.05" r="12" fill="#2e6b62"/><path d="M60.6,282.29 L64.8,286.61 L72,277.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lower cost per unit from the</text><text x="86" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">contractor’s scale</text><circle cx="66" cy="342.05" r="12" fill="#2e6b62"/><path d="M60.6,342.29 L64.8,346.61 L72,337.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="348" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Costs that vary with output</text><circle cx="66" cy="380.05" r="12" fill="#2e6b62"/><path d="M60.6,380.29 L64.8,384.61 L72,375.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Management time freed for design and</text><text x="86" y="408" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">selling</text><rect x="460" y="110" width="410" height="345" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="148" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Risks to the client</text><circle cx="496" cy="184.05" r="12" fill="#b5602e"/><path d="M491.44,179.49 L500.56,188.61 M500.56,179.49 L491.44,188.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Less control over quality and timing</text><circle cx="496" cy="222.05" r="12" fill="#b5602e"/><path d="M491.44,217.49 L500.56,226.61 M500.56,217.49 L491.44,226.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="228" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Dependence: problems if it fails or</text><text x="516" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">raises prices</text><circle cx="496" cy="282.05" r="12" fill="#b5602e"/><path d="M491.44,277.49 L500.56,286.61 M500.56,277.49 L491.44,286.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Designs or customer data leaked or</text><text x="516" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">copied</text><circle cx="496" cy="342.05" r="12" fill="#b5602e"/><path d="M491.44,337.49 L500.56,346.61 M500.56,337.49 L491.44,346.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="348" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Contractor’s conditions or pollution</text><text x="516" y="370" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hurt reputation</text><circle cx="496" cy="402.05" r="12" fill="#b5602e"/><path d="M491.44,397.49 L500.56,406.61 M500.56,397.49 L491.44,406.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="408" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Communication delays across time</text><text x="516" y="430" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">zones</text><rect x="30" y="475" width="840" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="510" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Weigh at least two of each, then decide: the type of product matters.</text><text x="450" y="536" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Medicines or baby food raise bigger quality concerns than plain cardboard boxes.</text>
</svg>