<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Contract manufacturing: who does what</text>

<text x="220" y="130" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Client (brand owner)</text><text x="680" y="130" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Contractor</text><rect x="30" y="145" width="380" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="183" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">New juice brand</text><text x="52" y="213" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recipe, labels, marketing</text><line x1="418" y1="177" x2="482" y2="177" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="450" y="167" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">design</text><line x1="482" y1="211" x2="418" y2="211" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="450" y="233" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">goods</text><rect x="490" y="145" width="380" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="512" y="183" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bottling plant</text><text x="512" y="213" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mixes, fills, seals bottles</text><rect x="30" y="257" width="380" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="295" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cosmetics company</text><text x="52" y="325" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">designs a skin cream</text><line x1="418" y1="289" x2="482" y2="289" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="450" y="279" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">design</text><line x1="482" y1="323" x2="418" y2="323" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="450" y="345" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">goods</text><rect x="490" y="257" width="380" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="512" y="295" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Laboratory-equipped factory</text><text x="512" y="325" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">produces it in large quantities</text><rect x="30" y="369" width="380" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="407" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Electronics brand</text><text x="52" y="437" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">designs earphones</text><line x1="418" y1="401" x2="482" y2="401" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="450" y="391" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">design</text><line x1="482" y1="435" x2="418" y2="435" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="450" y="457" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">goods</text><rect x="490" y="369" width="380" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="512" y="407" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Specialist assembler abroad</text><text x="512" y="437" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">builds them</text><rect x="30" y="490" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="532" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Made to the client’s design and sold under the client’s brand.</text>
</svg>