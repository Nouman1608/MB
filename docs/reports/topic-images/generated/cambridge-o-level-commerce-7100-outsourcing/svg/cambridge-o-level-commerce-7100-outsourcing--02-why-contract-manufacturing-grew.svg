<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why contract manufacturing has grown</text>

<rect x="30" y="110" width="250" height="72" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="151.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower start-up costs</text><line x1="288" y1="146" x2="328" y2="146" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="338" y="110" width="532" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="358" y="140" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sell without buying a factory, so ideas with little</text><text x="358" y="162" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">capital can enter a market</text><rect x="30" y="194" width="250" height="72" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="225.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Specialist expertise and</text><text x="155" y="246.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">equipment</text><line x1="288" y1="230" x2="328" y2="230" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="338" y="194" width="532" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="358" y="224" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Contractors serve many clients, so they afford</text><text x="358" y="246" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">advanced machines and skilled staff</text><rect x="30" y="278" width="250" height="72" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="319.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Economies of scale</text><line x1="288" y1="314" x2="328" y2="314" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="338" y="278" width="532" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="358" y="320" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Producing for several brands lowers the cost per unit</text><rect x="30" y="362" width="250" height="72" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="403.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Flexibility</text><line x1="288" y1="398" x2="328" y2="398" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="338" y="362" width="532" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="358" y="392" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Order more in busy seasons, less in quiet ones, with</text><text x="358" y="414" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">no idle machines</text><rect x="30" y="446" width="250" height="72" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="487.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Focus on core activities</text><line x1="288" y1="482" x2="328" y2="482" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="338" y="446" width="532" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="358" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Design, branding and selling, where the client adds</text><text x="358" y="498" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">most value</text><rect x="30" y="530" width="250" height="72" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="561.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Global chains, digital</text><text x="155" y="582.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">communication</text><line x1="288" y1="566" x2="328" y2="566" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="338" y="530" width="532" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="358" y="560" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Designs, orders and reports exchanged instantly with</text><text x="358" y="582" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">contractors abroad</text>
</svg>