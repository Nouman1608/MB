<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bloom Box: own logistics or a provider?</text>

<rect x="30" y="110" width="360" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">In-house, 2,000 orders</text><text x="54" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Warehouse rent</text><text x="366" y="184" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">3,000</text><text x="54" y="218" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">3 staff × 900</text><text x="366" y="218" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">2,700</text><text x="54" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Van running costs</text><text x="366" y="252" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">1,500</text><text x="54" y="286" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Packaging 0.40 × 2,000</text><text x="366" y="286" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">800</text><line x1="54" y1="316" x2="366" y2="316" stroke="#c9d6d4" stroke-width="1.5"/><text x="54" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Total</text><text x="366" y="344" font-size="19" font-weight="700" fill="#b5602e" text-anchor="end">$8,000</text><text x="54" y="384" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">8,000 / 2,000 = $4.00 per order</text><line x1="420" y1="380" x2="870" y2="380" stroke="#1e2a44" stroke-width="2.5"/><rect x="440" y="140" width="85" height="240" fill="#f3d9c8" stroke="#1e2a44" stroke-width="2.5"/><text x="482" y="130" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">$8,000</text><rect x="535" y="170" width="85" height="210" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="577" y="160" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">$7,000</text><text x="482" y="366" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">$4.00</text><text x="577" y="366" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">$3.50</text><text x="530" y="406" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2,000 orders</text><rect x="660" y="154.4" width="85" height="225.6" fill="#f3d9c8" stroke="#1e2a44" stroke-width="2.5"/><text x="702" y="144.4" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">$7,520</text><rect x="755" y="296" width="85" height="84" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="797" y="286" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">$2,800</text><text x="702" y="366" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">$9.40</text><text x="797" y="366" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">$3.50</text><text x="750" y="406" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">800 orders</text><rect x="440" y="430" width="18" height="18" fill="#f3d9c8" stroke="#1e2a44"/><text x="466" y="445" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">In-house</text><rect x="580" y="430" width="18" height="18" fill="#b5d3cf" stroke="#1e2a44"/><text x="606" y="445" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Provider at $3.50 per order</text><text x="870" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">small figures = cost per order</text><rect x="30" y="430" width="360" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="462" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">At 800 orders</text><text x="54" y="490" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fixed 7,200 + packaging 320</text><text x="54" y="516" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">= $7,520, or $9.40 per order</text><rect x="410" y="485" width="460" height="55" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="640" y="519" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">Provider: 2,000 × 3.50 = $7,000; 800 × 3.50 = $2,800</text><rect x="30" y="560" width="840" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="594" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Outsourcing is cheaper at both levels, and the gap widens when sales fall,</text><text x="450" y="620" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">because in-house costs are mostly fixed (invented figures).</text>
</svg>