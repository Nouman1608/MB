<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Contract logistics: more than transport</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What the provider can do</text><rect x="54" y="170" width="182" height="74" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="202.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Receive and store in</text><text x="145" y="222.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">its warehouse</text><line x1="238" y1="207" x2="254" y2="207" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="256" y="170" width="182" height="74" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="347" y="202.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Pick and pack each</text><text x="347" y="222.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">order</text><line x1="440" y1="207" x2="456" y2="207" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="458" y="170" width="182" height="74" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="549" y="192.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Transport and</text><text x="549" y="212.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">deliver to shops or</text><text x="549" y="232.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">homes</text><line x1="642" y1="207" x2="658" y2="207" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="660" y="170" width="182" height="74" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="751" y="212.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Handle returns</text><rect x="54" y="262" width="792" height="52" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="293.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Export documents and customs clearance, often with freight forwarders</text><text x="450" y="375" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why it has grown</text><rect x="30" y="395" width="410" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="429" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Ecommerce</text><text x="50" y="457" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Thousands of small parcels and returns;</text><text x="50" y="478" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">costly to build in-house</text><rect x="460" y="395" width="410" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="429" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Customer expectations</text><text x="480" y="457" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Next-day delivery and live tracking are now</text><text x="480" y="478" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">common</text><rect x="30" y="505" width="410" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="539" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Global trade</text><text x="50" y="567" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Routes, documents and customs need</text><text x="50" y="588" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">specialist knowledge</text><rect x="460" y="505" width="410" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="539" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Cost and flexibility</text><text x="480" y="567" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pay per order or per pallet, so costs move</text><text x="480" y="588" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with sales</text>
</svg>