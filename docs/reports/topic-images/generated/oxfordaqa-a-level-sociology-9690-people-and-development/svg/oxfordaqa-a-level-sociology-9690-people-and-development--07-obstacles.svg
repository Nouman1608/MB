<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 707" width="900" height="707" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="707" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Obstacles to progress: three views</text>

<rect x="158" y="104" width="232" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="274" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Modernisation</text><rect x="398" y="104" width="232" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="514" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><rect x="638" y="104" width="232" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="754" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><rect x="30" y="156" width="120" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="207.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Main</text><text x="42" y="229.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">obstacle</text><rect x="158" y="156" width="232" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Traditional values and</text><text x="172" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">practices: fatalism,</text><text x="172" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kinship obligations,</text><text x="172" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ascribed status.</text><rect x="398" y="156" width="232" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="412" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Capitalism and</text><text x="412" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">globalisation keep</text><text x="412" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">periphery nations poor.</text><rect x="638" y="156" width="232" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="652" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Globalisation can</text><text x="652" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reinforce patriarchy.</text><rect x="30" y="278" width="120" height="177" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="371.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key ideas</text><rect x="158" y="278" width="232" height="177" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rostow’s route to</text><text x="172" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">take-off.</text><rect x="398" y="278" width="232" height="177" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="412" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Frank:</tspan> satellites grew</text><text x="412" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">most when ties were</text><text x="412" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weakest. <tspan font-weight="700">Wallerstein</tspan></text><text x="412" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">(1974):</tspan> core,</text><text x="412" y="392.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">semi-periphery,</text><text x="412" y="413.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">periphery. <tspan font-weight="700">Bello:</tspan> WTO</text><text x="412" y="434.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and IMF rules.</text><rect x="638" y="278" width="232" height="177" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="652" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Mies (1986):</tspan></text><text x="652" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housewifisation. <tspan font-weight="700">Elson</tspan></text><text x="652" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">and Pearson (1981):</tspan></text><text x="652" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"nimble fingers".</text><text x="652" y="392.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hochschild:</tspan> global care</text><text x="652" y="413.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chains.</text><rect x="30" y="463" width="120" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="514.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Criticism</text><rect x="158" y="463" width="232" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="493.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Blames poor societies</text><text x="172" y="514.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for their own poverty.</text><rect x="398" y="463" width="232" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="412" y="493.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Struggles to explain</text><text x="412" y="514.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fast-growing former</text><text x="412" y="535.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">colonies.</text><rect x="638" y="463" width="232" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="652" y="493.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Factory jobs can raise</text><text x="652" y="514.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women’s independence.</text><rect x="30" y="572" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="608" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Other obstacles in 3.2.1.5</text><text x="56" y="637" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Persistent health and education gaps; the climate crisis (Brundtland, 1987: sustainable</text><text x="56" y="659" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">development); wars and Collier’s conflict trap; Kaldor’s "new wars".</text>
</svg>