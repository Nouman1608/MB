<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 788" width="900" height="788" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why did Europe industrialise first?</text>

<rect x="238" y="104" width="312" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="394" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Explanation</text><rect x="558" y="104" width="312" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="714" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><rect x="30" y="156" width="200" height="135" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="217.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Modernisation</text><text x="42" y="239.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(Rostow, 1960)</text><rect x="238" y="156" width="312" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Five stages from traditional</text><text x="252" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">society through "take-off" to</text><text x="252" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">high mass consumption; Europe’s</text><text x="252" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">values favoured enterprise and</text><text x="252" y="270.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">science.</text><rect x="558" y="156" width="312" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="572" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ethnocentric: assumes all</text><text x="572" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">societies must copy the Western</text><text x="572" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">route.</text><rect x="30" y="299" width="200" height="114" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="339.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Protestant work</text><text x="42" y="361.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ethic (Weber,</text><text x="42" y="383.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1905)</text><rect x="238" y="299" width="312" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Calvinist belief in</text><text x="252" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">predestination drove disciplined</text><text x="252" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work and reinvestment: the</text><text x="252" y="392.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"spirit of capitalism".</text><rect x="558" y="299" width="312" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="572" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Catholic northern Italy had early</text><text x="572" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">capitalism; East Asian growth</text><text x="572" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shows other values can support</text><text x="572" y="392.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it.</text><rect x="30" y="421" width="200" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="461.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dependency (Frank;</text><text x="42" y="483.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rodney, 1972)</text><rect x="238" y="421" width="312" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The metropolis grew by extracting</text><text x="252" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surplus from satellites; Europe</text><text x="252" y="493.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">underdeveloped Africa.</text><rect x="558" y="421" width="312" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="572" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Struggles to explain fast growth</text><text x="572" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in South Korea and Singapore.</text><rect x="30" y="522" width="200" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="562.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Enslavement</text><text x="42" y="584.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(Williams, 1944)</text><rect x="238" y="522" width="312" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Profits from slavery and the</text><text x="252" y="573.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plantation trade helped finance</text><text x="252" y="594.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">British industrialisation.</text><rect x="558" y="522" width="312" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="572" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Used to argue that value-based</text><text x="572" y="573.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accounts such as Weber’s leave</text><text x="572" y="594.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">out exploitation.</text><rect x="30" y="631" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="667" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pomeranz (2000): the Great Divergence</text><text x="56" y="696" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Advanced regions of China and Europe were broadly comparable around 1750; Britain’s lead</text><text x="56" y="718" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">owed much to cheap coal and colonial land and resources. Braudel’s longue durée stresses</text><text x="56" y="740" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">slow change over centuries.</text>
</svg>