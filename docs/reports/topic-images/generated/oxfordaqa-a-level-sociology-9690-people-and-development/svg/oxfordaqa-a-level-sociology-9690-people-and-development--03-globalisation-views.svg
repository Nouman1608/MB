<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="510" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three views of globalisation</text>

<rect x="30" y="104" width="269.3333333333333" height="265" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,178 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,178 Z" fill="#b5d3cf"/><line x1="31.25" y1="178" x2="298.0833333333333" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Neo-liberal</text><text x="164.66666666666666" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">(positive globalist)</text><text x="46" y="211.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Ohmae (1990)</text><text x="46" y="240.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Free markets and open</text><text x="46" y="261.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">borders spread prosperity</text><text x="46" y="282.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and weaken the nation state.</text><text x="46" y="303.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Falls in extreme poverty in</text><text x="46" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">China and India.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="265" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,178 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,178 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="178" x2="583.4166666666666" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Negative globalist</text><text x="331.3333333333333" y="211.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Bello; Polanyi (1944)</text><text x="331.3333333333333" y="240.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deepens inequality and</text><text x="331.3333333333333" y="261.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serves rich states and TNCs.</text><text x="331.3333333333333" y="282.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bello: "deglobalisation".</text><text x="331.3333333333333" y="303.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Polanyi: markets "disembed"</text><text x="331.3333333333333" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the economy; the double</text><text x="331.3333333333333" y="345.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">movement.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="265" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,178 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,178 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="178" x2="868.75" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Transformationalist</text><text x="616.6666666666666" y="211.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Held et al. (1999)</text><text x="616.6666666666666" y="240.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Real but reshapes, rather</text><text x="616.6666666666666" y="261.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">than ends, states and</text><text x="616.6666666666666" y="282.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cultures; outcomes are</text><text x="616.6666666666666" y="303.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mixed. Glocalisation</text><text x="616.6666666666666" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Robertson).</text><rect x="30" y="385" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="421" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Say which type</text><text x="56" y="450" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Economic globalisation is the most advanced, political is uneven, and cultural flows run</text><text x="56" y="472" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">in several directions (Bollywood, K-pop, anime).</text>
</svg>