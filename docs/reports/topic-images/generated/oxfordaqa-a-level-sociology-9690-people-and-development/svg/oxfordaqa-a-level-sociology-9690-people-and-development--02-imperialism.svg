<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="383" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Imperialism and its legacies</text>

<rect x="30" y="120" width="183" height="169" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="121.5" y="171.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Exploration and</text><text x="121.5" y="195.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">trade</text><text x="121.5" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">European states</text><text x="121.5" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">build empires</text><line x1="217" y1="204.5" x2="245" y2="204.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="249" y="120" width="183" height="169" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="340.5" y="162.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Enslavement</text><text x="340.5" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Atlantic trade</text><text x="340.5" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">forced millions to</text><text x="340.5" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">work plantations</text><text x="340.5" y="255.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">in the Americas</text><line x1="436" y1="204.5" x2="464" y2="204.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="468" y="120" width="183" height="169" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="559.5" y="173.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Colonialism</text><text x="559.5" y="203.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">political control</text><text x="559.5" y="224.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">plus extraction of</text><text x="559.5" y="245.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">raw materials</text><line x1="655" y1="204.5" x2="683" y2="204.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="687" y="120" width="183" height="169" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="778.5" y="152.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Neocolonialism</text><text x="778.5" y="182.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">control through</text><text x="778.5" y="203.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">debt, trade terms</text><text x="778.5" y="224.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and investment</text><text x="778.5" y="245.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">after independence</text><text x="778.5" y="266.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">(Nkrumah, 1965)</text><line x1="60" y1="317" x2="840" y2="317" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="347" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">from direct rule to indirect control</text>
</svg>