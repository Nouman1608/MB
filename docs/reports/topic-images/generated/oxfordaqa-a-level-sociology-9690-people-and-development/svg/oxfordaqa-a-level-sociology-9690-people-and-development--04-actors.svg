<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 531" width="900" height="531" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="531" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who is involved in globalisation?</text>

<rect x="30" y="104" width="269.3333333333333" height="232" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,174 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,174 Z" fill="#b5d3cf"/><line x1="31.25" y1="174" x2="298.0833333333333" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="144.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Nation states</text><text x="46" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More developed states shape</text><text x="46" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trade rules; less developed</text><text x="46" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">states compete for</text><text x="46" y="270.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">investment, or direct</text><text x="46" y="291.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">development (China,</text><text x="46" y="312.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Vietnam).</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="232" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,174 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,174 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="174" x2="583.4166666666666" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="144.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">TNCs</text><text x="331.3333333333333" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Investment, jobs,</text><text x="331.3333333333333" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">technology; critics: profit</text><text x="331.3333333333333" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repatriation, tax avoidance,</text><text x="331.3333333333333" y="270.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weak labour protection.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="232" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,174 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,174 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="174" x2="868.75" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="132.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Transnational and UN</text><text x="735.3333333333333" y="156.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">agencies</text><text x="616.6666666666666" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">World Bank, IMF (structural</text><text x="616.6666666666666" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adjustment), WTO; UNICEF,</text><text x="616.6666666666666" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">WHO, UNHCR; the SDGs (2015).</text><rect x="30" y="352" width="269.3333333333333" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,402 L31.25,366.25 Q31.25,353.25 44.25,353.25 L285.0833333333333,353.25 Q298.0833333333333,353.25 298.0833333333333,366.25 L298.0833333333333,402 Z" fill="#f2e7b8"/><line x1="31.25" y1="402" x2="298.0833333333333" y2="402" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="382.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">NGOs</text><text x="46" y="435.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deliver aid and lobby;</text><text x="46" y="456.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">flexible, but may answer to</text><text x="46" y="477.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Northern donors.</text><rect x="315.3333333333333" y="352" width="269.3333333333333" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,402 L316.5833333333333,366.25 Q316.5833333333333,353.25 329.5833333333333,353.25 L570.4166666666666,353.25 Q583.4166666666666,353.25 583.4166666666666,366.25 L583.4166666666666,402 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="402" x2="583.4166666666666" y2="402" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="382.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Grassroots movements</text><text x="331.3333333333333" y="435.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Action from below: Chipko</text><text x="331.3333333333333" y="456.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(India, 1970s); Maathai’s</text><text x="331.3333333333333" y="477.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Green Belt Movement (Kenya).</text><rect x="600.6666666666666" y="352" width="269.3333333333333" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,402 L601.9166666666666,366.25 Q601.9166666666666,353.25 614.9166666666666,353.25 L855.75,353.25 Q868.75,353.25 868.75,366.25 L868.75,402 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="402" x2="868.75" y2="402" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="382.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Indigenous peoples</text><text x="616.6666666666666" y="435.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Affected by mining, dams and</text><text x="616.6666666666666" y="456.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">logging; UN Declaration on</text><text x="616.6666666666666" y="477.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">their rights (2007).</text>
</svg>