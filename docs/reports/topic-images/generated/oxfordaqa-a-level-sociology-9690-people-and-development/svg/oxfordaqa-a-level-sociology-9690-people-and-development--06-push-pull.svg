<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why people migrate</text>

<rect x="30" y="110" width="250" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,184 L31.25,124.25 Q31.25,111.25 44.25,111.25 L265.75,111.25 Q278.75,111.25 278.75,124.25 L278.75,184 Z" fill="#f2e7b8"/><line x1="31.25" y1="184" x2="278.75" y2="184" stroke="#c9d6d4" stroke-width="2"/><text x="155" y="153" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Push factors</text><circle cx="53" cy="210.72" r="4.5" fill="#8a6d0d"/><text x="66" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Poverty</text><circle cx="53" cy="239.72" r="4.5" fill="#8a6d0d"/><text x="66" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conflict</text><circle cx="53" cy="268.72" r="4.5" fill="#8a6d0d"/><text x="66" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Persecution</text><circle cx="53" cy="297.72" r="4.5" fill="#8a6d0d"/><text x="66" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Climate change:</text><text x="66" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drought, sea-level</text><text x="66" y="345" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rise, storms</text><rect x="325" y="110" width="250" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M326.25,184 L326.25,124.25 Q326.25,111.25 339.25,111.25 L560.75,111.25 Q573.75,111.25 573.75,124.25 L573.75,184 Z" fill="#d4b02e"/><line x1="326.25" y1="184" x2="573.75" y2="184" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Intervening</text><text x="450" y="166" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">obstacles</text><circle cx="348" cy="210.72" r="4.5" fill="#2e6b62"/><text x="361" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Distance</text><circle cx="348" cy="239.72" r="4.5" fill="#2e6b62"/><text x="361" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cost</text><circle cx="348" cy="268.72" r="4.5" fill="#2e6b62"/><text x="361" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Law: borders, passports</text><text x="361" y="295" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and visas</text><rect x="620" y="110" width="250" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M621.25,184 L621.25,124.25 Q621.25,111.25 634.25,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,184 Z" fill="#b5d3cf"/><line x1="621.25" y1="184" x2="868.75" y2="184" stroke="#c9d6d4" stroke-width="2"/><text x="745" y="153" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Pull factors</text><circle cx="643" cy="210.72" r="4.5" fill="#2e6b62"/><text x="656" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jobs</text><circle cx="643" cy="239.72" r="4.5" fill="#2e6b62"/><text x="656" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Safety</text><circle cx="643" cy="268.72" r="4.5" fill="#2e6b62"/><text x="656" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family</text><line x1="284" y1="240" x2="320" y2="240" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="579" y1="240" x2="615" y2="240" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="155" y="398" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">origin</text><text x="745" y="398" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">destination</text><text x="450" y="398" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Lee (1966)</text><rect x="30" y="422" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="458" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criticisms</text><circle cx="61" cy="481.39" r="4.5" fill="#8a6d0d"/><text x="74" y="487" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Treats migrants as rational individuals</text><circle cx="61" cy="511.39" r="4.5" fill="#8a6d0d"/><text x="74" y="517" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores structures: colonial ties, labour recruitment, state schemes and visa rules</text><circle cx="61" cy="541.39" r="4.5" fill="#8a6d0d"/><text x="74" y="547" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">People follow relatives, so flows run along diaspora networks</text>
</svg>