<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 699" width="900" height="699" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="699" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Little Hans: two explanations of one phobia</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Freud (1909): a five-year-old boy's fear of horses</text>
<rect x="170" y="124" width="560" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fear that a horse would bite him or fall down</text><text x="450" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">began after he saw a horse pulling a bus collapse in the street</text><line x1="370" y1="218" x2="240" y2="260" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="530" y1="218" x2="660" y2="260" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="280" width="410" height="235" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="312" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FREUD'S INTERPRETATION</text><text x="50" y="338.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Displaced anxiety about his father</text><text x="50" y="367.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="367.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">part of the <tspan font-weight="700" fill="#1e2a44">Oedipus</tspan> <tspan font-weight="700" fill="#1e2a44">complex</tspan></text><text x="50" y="394.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="394.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">black around horses' mouths → father's</text><text x="65.2" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">moustache</tspan></text><text x="50" y="442.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">blinkers → father's <tspan font-weight="700" fill="#1e2a44">glasses</tspan></text><text x="50" y="469.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="469.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">phobia resolved as Hans worked through</text><text x="65.2" y="490.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fantasies</text><rect x="460" y="280" width="410" height="235" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="312" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SIMPLER ALTERNATIVE</text><text x="480" y="338.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Classical conditioning</text><text x="480" y="367.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="367.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fear learned after seeing the horse accident</text><text x="480" y="394.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="495.2" y="394.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fits the facts more simply</text><rect x="30" y="537" width="275.3333333333333" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="569" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTH</text><text x="50" y="600.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rich, idiographic detail.</text><rect x="319.3333333333333" y="537" width="550.6666666666666" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="339.3333333333333" y="569" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="339.3333333333333" y="600.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Subjective, unfalsifiable interpretations; Freud worked mostly from</text><text x="339.3333333333333" y="621.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the father's letters, and the father, a supporter of Freud, may have</text><text x="339.3333333333333" y="642.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">led the answers.</text>
</svg>