<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three anxiety and fear-related disorders</text>

<rect x="30" y="100" width="270.6666666666667" height="367" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GAD</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Generalised anxiety</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">disorder</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no specific feared object</text><text x="50" y="239.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">free-floating apprehension</text><text x="65.2" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or excessive worry about</text><text x="65.2" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">everyday matters: family,</text><text x="65.2" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">health, money, work</text><text x="50" y="330.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">muscle tension,</text><text x="65.2" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">restlessness, poor</text><text x="65.2" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">concentration, irritability,</text><text x="65.2" y="393.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disturbed sleep</text><text x="50" y="421.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="421.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">at least several months,</text><text x="65.2" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more days than not</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="367" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGORAPHOBIA</text><text x="334.6666666666667" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Situations where escape</text><text x="334.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">is hard</text><text x="334.6666666666667" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public transport, crowds,</text><text x="349.8666666666667" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shops, outside the home</text><text x="349.8666666666667" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alone</text><text x="334.6666666666667" y="281.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fear of panic or</text><text x="349.8666666666667" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">embarrassing physical</text><text x="349.8666666666667" y="323.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">symptoms</text><text x="334.6666666666667" y="351.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">avoided, entered only with a</text><text x="349.8666666666667" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">companion, or endured with</text><text x="349.8666666666667" y="393.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intense fear</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="367" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BII PHOBIA</text><text x="619.3333333333334" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Blood, injury, injections</text><text x="619.3333333333334" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fear on seeing or</text><text x="634.5333333333334" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anticipating them, out of</text><text x="634.5333333333334" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proportion to the danger</text><text x="619.3333333333334" y="257.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="257.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vasovagal response can</text><text x="634.5333333333334" y="278.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cause fainting</text><text x="619.3333333333334" y="306.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may avoid medical and</text><text x="634.5333333333334" y="327.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dental care</text><rect x="30" y="489" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="522.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">GAD is <tspan font-weight="700" fill="#1e2a44">not</tspan> a phobia: there is no specific feared object. BII phobia differs from other phobias in its</text><text x="450" y="544.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">physical</tspan> <tspan font-weight="700" fill="#1e2a44">response</tspan>.</text>
</svg>