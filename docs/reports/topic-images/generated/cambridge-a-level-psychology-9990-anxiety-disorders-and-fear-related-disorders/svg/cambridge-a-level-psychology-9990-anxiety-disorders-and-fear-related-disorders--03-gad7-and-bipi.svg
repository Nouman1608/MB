<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 737" width="900" height="737" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="737" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring anxiety</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two self-report scales</text>
<rect x="30" y="124" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GAD-7</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">7 items about the last two weeks, each scored 0 to 3</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">0 = not at all … 3 = nearly every day</text><rect x="60" y="268" width="185.71428571428572" height="60" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="152.85714285714286" y="305" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">below mild</text><rect x="245.71428571428572" y="268" width="185.71428571428572" height="60" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="338.5714285714286" y="305" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">mild</text><rect x="431.42857142857144" y="268" width="185.71428571428572" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="524.2857142857143" y="305" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">moderate</text><rect x="617.1428571428572" y="268" width="222.8571428571429" height="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="728.5714285714287" y="305" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">severe</text><line x1="60" y1="328" x2="60" y2="340" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="362" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><line x1="245.71428571428572" y1="328" x2="245.71428571428572" y2="340" stroke="#1e2a44" stroke-width="2.5"/><text x="245.71428571428572" y="362" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="431.42857142857144" y1="328" x2="431.42857142857144" y2="340" stroke="#1e2a44" stroke-width="2.5"/><text x="431.42857142857144" y="362" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">10</text><line x1="617.1428571428572" y1="328" x2="617.1428571428572" y2="340" stroke="#1e2a44" stroke-width="2.5"/><text x="617.1428571428572" y="362" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">15</text><line x1="840.0000000000001" y1="328" x2="840.0000000000001" y2="340" stroke="#1e2a44" stroke-width="2.5"/><text x="840.0000000000001" y="362" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">21</text><text x="450" y="392" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">total score 0 to 21; thresholds of 5, 10 and 15 are commonly used</text><rect x="30" y="420" width="840" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="452" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BLOOD INJECTION PHOBIA INVENTORY (BIPI)</text><text x="50" y="478.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Situations involving blood and injections</text><text x="50" y="507.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Records <tspan font-weight="700" fill="#1e2a44">cognitive,</tspan> <tspan font-weight="700" fill="#1e2a44">physiological</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">behavioural</tspan> responses to each situation. Mas et al. (2010)</text><text x="50" y="528.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">examined it as a psychometric measure.</text><rect x="30" y="575" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="607" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="638.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quick; quantitative data that can track change.</text><rect x="457" y="575" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="607" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="638.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Subjective: people may under-report; imagined</text><text x="477" y="659.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">situations may not match behaviour in a real</text><text x="477" y="680.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clinic.</text>
</svg>