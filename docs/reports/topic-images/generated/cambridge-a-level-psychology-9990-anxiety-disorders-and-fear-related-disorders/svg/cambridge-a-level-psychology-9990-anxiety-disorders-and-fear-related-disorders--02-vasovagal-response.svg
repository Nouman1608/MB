<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why people with BII phobia may faint</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The vasovagal response</text>
<rect x="30" y="118" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="444" x2="850" y2="444" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="444" x2="110" y2="144" stroke="#1e2a44" stroke-width="3"/><text x="480" y="478" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">time after seeing blood or a needle</text><text x="88" y="294" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 88 294)">heart rate and blood pressure</text><text x="850" y="136" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">illustrative: no data in the lesson</text><line x1="110" y1="309" x2="850" y2="309" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="7 6"/><text x="118" y="301" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">usual level</text><path d="M110,309 L240,309 C300,309 320,189 380,189 C440,189 470,198.00000000000003 500,264 C530,354 545,408 600,414 L840,408" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="380" cy="155" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="380" y="161.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="410" y="161" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">first rise</text><circle cx="470" cy="354" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="470" y="360.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="442" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">sharp drop</text><rect x="620" y="340" width="210" height="50" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="725" y="371" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">fainting possible</text><rect x="30" y="540" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="573.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Other phobias do not show this drop, which is why BII phobia needs a different treatment: <tspan font-weight="700" fill="#1e2a44">applied</tspan></text><text x="450" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">tension</tspan>.</text>
</svg>