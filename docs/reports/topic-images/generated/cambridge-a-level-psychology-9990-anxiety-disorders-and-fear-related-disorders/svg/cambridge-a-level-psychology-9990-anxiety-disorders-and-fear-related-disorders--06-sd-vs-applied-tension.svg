<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="668" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Relax or tense?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Why BII phobia needs a different treatment</text>
<rect x="30" y="124" width="410" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SYSTEMATIC DESENSITISATION</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reciprocal inhibition</text><text x="50" y="213.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Relaxation and fear cannot be felt at the same</text><text x="50" y="235.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">time.</text><rect x="460" y="124" width="410" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">APPLIED TENSION (BII PHOBIA)</text><text x="480" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Raise blood pressure</text><text x="480" y="213.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tension counteracts the drop in blood</text><text x="480" y="235.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pressure that causes fainting.</text><line x1="60" y1="302" x2="60" y2="483" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="282" width="336" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="310.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Learn relaxation</text><circle cx="60" cy="305.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="314.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="341" width="336" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="369.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Build a hierarchy</text><text x="118" y="397.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of feared situations</text><circle cx="60" cy="378.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="387.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="428" width="336" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="456.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Work up step by step</text><text x="118" y="484.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">while relaxed, in imagination or real life</text><circle cx="60" cy="465.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="474.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="490" y1="302" x2="490" y2="483" stroke="#c9d6d4" stroke-width="4"/><rect x="534" y="282" width="336" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="548" y="310.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tense large muscles</text><text x="548" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">arms, legs and torso</text><circle cx="490" cy="319.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="490" y="328.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="534" y="369" width="336" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="548" y="397.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hold several seconds</text><text x="548" y="425.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">until the face feels warm</text><circle cx="490" cy="406.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="490" y="415.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="534" y="456" width="336" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="548" y="484.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Release, then repeat</text><circle cx="490" cy="479.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="490" y="488.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="525" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="559.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">For BII phobia, relaxation can be counter-productive</text><text x="50" y="589.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Relaxation lowers blood pressure further, adding to the drop that causes fainting. CBT adds</text><text x="50" y="611.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">psychoeducation, challenging catastrophic beliefs ("I will faint and die") and graded exposure.</text>
</svg>