<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 862" width="900" height="862" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="862" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Little Albert: learning a fear</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Watson and Rayner (1920)</text>
<rect x="30" y="124" width="840" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="194" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="201.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BEFORE (about 9 months)</text><rect x="110" y="164" width="210" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="215" y="192.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">White rat</text><text x="215" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">neutral: no fear</text><rect x="370" y="164" width="210" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="475" y="192.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Loud noise</text><text x="475" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">steel bar struck</text><line x1="586" y1="201" x2="630" y2="201" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="636" y="164" width="210" height="74" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="741" y="192.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Startled</text><text x="741" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">unconditioned response</text><rect x="30" y="262" width="840" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="332" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="339.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="110" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURING (about 11 months)</text><rect x="110" y="302" width="470" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="345" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rat + loud noise together</text><text x="345" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">twice, then five more times a week later</text><line x1="586" y1="339" x2="630" y2="339" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="636" y="302" width="210" height="74" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="741" y="343.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Startled</text><rect x="30" y="400" width="840" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="470" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="477.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="110" y="428" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AFTER</text><rect x="110" y="440" width="470" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="345" y="468.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rat alone</text><text x="345" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">now a conditioned stimulus</text><line x1="586" y1="477" x2="630" y2="477" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="636" y="440" width="210" height="74" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="741" y="468.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cried, crawled away</text><text x="741" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">conditioned fear</text><rect x="30" y="538" width="840" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="608" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="615.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="110" y="566" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DAYS LATER: GENERALISATION</text><rect x="110" y="578" width="470" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="345" y="606.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rabbit, dog, fur coat, mask</text><text x="345" y="634" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">similar objects</text><line x1="586" y1="615" x2="630" y2="615" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="636" y="578" width="210" height="74" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="741" y="619.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fear</text><rect x="30" y="676" width="303.8461538461538" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="729" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TWO-PROCESS THEORY: STEP 1</text><text x="50" y="755.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Acquired</text><text x="50" y="784.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by classical conditioning</text><line x1="339.8461538461538" y1="753" x2="377.8461538461538" y2="753" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="383.8461538461538" y="676" width="486.15384615384613" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="403.8461538461538" y="708" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 2</text><text x="403.8461538461538" y="734.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Maintained</text><text x="403.8461538461538" y="763.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by operant conditioning: avoiding the object reduces</text><text x="403.8461538461538" y="784.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anxiety (negative reinforcement), so the person never</text><text x="403.8461538461538" y="805.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">learns it is safe</text>
</svg>