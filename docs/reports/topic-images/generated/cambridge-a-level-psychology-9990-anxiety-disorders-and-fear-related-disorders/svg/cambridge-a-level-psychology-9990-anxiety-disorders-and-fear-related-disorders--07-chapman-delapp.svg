<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 784" width="900" height="784" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="784" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Chapman and DeLapp (2013)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Case study of "T", a 42-year-old man who fainted during blood tests</text>
<rect x="30" y="124" width="413" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">METHOD</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diagnostic interview; questionnaires including</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the <tspan font-weight="700" fill="#1e2a44">Beck</tspan> <tspan font-weight="700" fill="#1e2a44">Anxiety</tspan> <tspan font-weight="700" fill="#1e2a44">Inventory</tspan> <tspan font-weight="700" fill="#1e2a44">(BAI)</tspan>; SUDS ratings</text><text x="50" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(0–100).</text><rect x="457" y="124" width="413" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TREATMENT</text><text x="477" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nine sessions of manualised CBT:</text><text x="477" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">psychoeducation, cognitive restructuring, a fear</text><text x="477" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hierarchy; <tspan font-weight="700" fill="#1e2a44">applied</tspan> <tspan font-weight="700" fill="#1e2a44">tension</tspan> <tspan font-weight="700" fill="#1e2a44">from</tspan> <tspan font-weight="700" fill="#1e2a44">session</tspan> <tspan font-weight="700" fill="#1e2a44">5</tspan>, used</text><text x="477" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">during graded exposure.</text><text x="30" y="311" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">EXPOSURE STEPS, EASIEST TO HARDEST</text><rect x="30" y="337" width="147.2" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="103.6" y="371" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Tourniquet on</text><text x="103.6" y="391" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the arm</text><line x1="183.2" y1="377" x2="197.2" y2="377" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="203.2" y="337" width="147.2" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276.79999999999995" y="371" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Videos of blood</text><text x="276.79999999999995" y="391" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">draws</text><line x1="356.4" y1="377" x2="370.4" y2="377" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="376.4" y="337" width="147.2" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="371" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Finger-prick with</text><text x="450" y="391" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a glucometer</text><line x1="529.5999999999999" y1="377" x2="543.5999999999999" y2="377" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="549.5999999999999" y="337" width="147.2" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="623.1999999999999" y="371" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Watching blood</text><text x="623.1999999999999" y="391" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">donation</text><line x1="702.8" y1="377" x2="716.8" y2="377" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="722.8" y="337" width="147.2" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="796.4" y="361" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Own</tspan> <tspan font-weight="700" fill="#1e2a44">blood</tspan></text><text x="796.4" y="381" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">drawn</tspan> <tspan font-weight="700" fill="#1e2a44">in</tspan></text><text x="796.4" y="401" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">session</tspan> <tspan font-weight="700" fill="#1e2a44">9</tspan></text><rect x="30" y="439" width="840" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="473" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULTS: BAI SCORE</text><text x="210" y="515" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">before</text><rect x="230" y="495" width="492" height="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="734" y="518" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">41</text><text x="210" y="559" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">after</text><rect x="230" y="539" width="84" height="30" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="326" y="562" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">7</text><text x="450" y="603" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">SUDS fell within and across sessions; less need for applied tension; gains kept at follow-ups up to 12 months</text><rect x="30" y="643" width="413" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="675" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="706.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rich detail; a replicable, manualised approach.</text><rect x="457" y="643" width="413" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="675" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="706.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One participant; self-report measures; no control</text><text x="477" y="727.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">comparison.</text>
</svg>