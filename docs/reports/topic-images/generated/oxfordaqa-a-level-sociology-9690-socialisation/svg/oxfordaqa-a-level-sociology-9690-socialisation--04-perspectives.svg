<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four perspectives on socialisation</text>

<rect x="178" y="104" width="225.33333333333334" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="290.6666666666667" y="130.81" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">What is passed on</text><rect x="411.33333333333337" y="104" width="225.33333333333334" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="524" y="130.81" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Key evidence</text><rect x="644.6666666666667" y="104" width="225.33333333333334" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="757.3333333333334" y="130.81" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Criticism</text><rect x="30" y="156" width="140" height="130" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="226.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalist</text><rect x="178" y="156" width="225.33333333333334" height="130" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="185.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Shared values creating</text><text x="192" y="205.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">order</text><rect x="411.33333333333337" y="156" width="225.33333333333334" height="130" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="425.33333333333337" y="185.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Durkheim: school as</text><text x="425.33333333333337" y="205.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">society in miniature;</text><text x="425.33333333333337" y="225.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Parsons: particularistic</text><text x="425.33333333333337" y="245.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to universalistic</text><text x="425.33333333333337" y="265.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">standards</text><rect x="644.6666666666667" y="156" width="225.33333333333334" height="130" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="658.6666666666667" y="185.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Wrong (1961):</text><text x="658.6666666666667" y="205.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"oversocialised</text><text x="658.6666666666667" y="225.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">conception of man"</text><rect x="30" y="294" width="140" height="110" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="354.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Marxist</text><rect x="178" y="294" width="225.33333333333334" height="110" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="323.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Ruling-class ideology</text><rect x="411.33333333333337" y="294" width="225.33333333333334" height="110" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="425.33333333333337" y="323.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Bowles and Gintis (1976):</text><text x="425.33333333333337" y="343.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">correspondence principle;</text><text x="425.33333333333337" y="363.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Althusser: education as</text><text x="425.33333333333337" y="383.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">key ISA</text><rect x="644.6666666666667" y="294" width="225.33333333333334" height="110" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="658.6666666666667" y="323.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Deterministic; Willis</text><text x="658.6666666666667" y="343.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1977): the "lads"</text><text x="658.6666666666667" y="363.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">resisted</text><rect x="30" y="412" width="140" height="130" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="482.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist</text><rect x="178" y="412" width="225.33333333333334" height="130" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="441.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Gender roles and</text><text x="192" y="461.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">patriarchy</text><rect x="411.33333333333337" y="412" width="225.33333333333334" height="130" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="425.33333333333337" y="441.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Oakley: canalisation and</text><text x="425.33333333333337" y="461.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">manipulation; Sharpe:</text><text x="425.33333333333337" y="481.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">girls’ priorities shifted</text><text x="425.33333333333337" y="501.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from the 1970s to the</text><text x="425.33333333333337" y="521.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1990s</text><rect x="644.6666666666667" y="412" width="225.33333333333334" height="130" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="658.6666666666667" y="441.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Underplays change and</text><text x="658.6666666666667" y="461.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">women’s agency; feminists</text><text x="658.6666666666667" y="481.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">disagree</text><rect x="30" y="550" width="140" height="110" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="610.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interactionist</text><rect x="178" y="550" width="225.33333333333334" height="110" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="579.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">An active, negotiated</text><text x="192" y="599.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">self</text><rect x="411.33333333333337" y="550" width="225.33333333333334" height="110" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="425.33333333333337" y="579.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mead: play, game,</text><text x="425.33333333333337" y="599.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">generalised other;</text><text x="425.33333333333337" y="619.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cooley: looking-glass</text><text x="425.33333333333337" y="639.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">self</text><rect x="644.6666666666667" y="550" width="225.33333333333334" height="110" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="658.6666666666667" y="579.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Underplays structural</text><text x="658.6666666666667" y="599.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">constraints</text>
</svg>