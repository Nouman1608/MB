<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 528" width="900" height="528" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="528" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the self develops</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">the interactionist view</text>
<rect x="30" y="110" width="253.33333333333334" height="127" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="156.66666666666669" y="163.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Imitation</text><text x="156.66666666666669" y="193.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">children copy others</text><line x1="287.33333333333337" y1="173.5" x2="319.33333333333337" y2="173.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="110" width="253.33333333333334" height="127" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450.00000000000006" y="152.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Play</text><text x="450.00000000000006" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">take the role of particular</text><text x="450.00000000000006" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">others</text><line x1="580.6666666666667" y1="173.5" x2="612.6666666666667" y2="173.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="110" width="253.33333333333334" height="127" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Game</text><text x="743.3333333333334" y="172.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">learn the expectations of</text><text x="743.3333333333334" y="193.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">many people at once: the</text><text x="743.3333333333334" y="214.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">generalised other</text><text x="450" y="263" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Mead, Mind, Self and Society (1934)</text><text x="30" y="293" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cooley (1902): the looking-glass self</text><rect x="30" y="309" width="390" height="64" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="341.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">How I imagine others see me</text><line x1="424" y1="341" x2="476" y2="341" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="309" width="390" height="64" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="341.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">How I see myself</text><rect x="30" y="391" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="427" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Socialisation is negotiated</text><text x="56" y="456" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Individuals can reinterpret or resist what agencies teach. Criticism: underplays</text><text x="56" y="478" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">structural constraints of class, gender and ethnicity.</text>
</svg>