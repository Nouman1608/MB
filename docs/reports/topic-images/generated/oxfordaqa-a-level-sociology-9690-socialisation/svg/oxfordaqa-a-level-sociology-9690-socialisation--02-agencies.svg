<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 815" width="900" height="815" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="815" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Agencies and their methods</text>

<rect x="168" y="104" width="347" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="341.5" y="130.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Processes and methods</text><rect x="523" y="104" width="347" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="696.5" y="130.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">For analysis</text><rect x="30" y="156" width="130" height="90" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="206.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Families</text><rect x="168" y="156" width="347" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="185.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Imitation, role modelling, sanctions;</text><text x="182" y="205.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">canalisation and manipulation (Oakley,</text><text x="182" y="225.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1972)</text><rect x="523" y="156" width="347" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="185.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Most powerful in early childhood; varies</text><text x="537" y="205.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">by class, culture, religion</text><rect x="30" y="254" width="130" height="70" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="294.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Schools</text><rect x="168" y="254" width="347" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="283.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Formal and hidden curriculum; rewards</text><text x="182" y="303.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and punishments; streaming</text><rect x="523" y="254" width="347" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="283.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Can reinforce or challenge home values</text><rect x="30" y="332" width="130" height="70" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="372.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Peers</text><rect x="168" y="332" width="347" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="361.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Approval and acceptance; teasing and</text><text x="182" y="381.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exclusion; styles and slang</text><rect x="523" y="332" width="347" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="361.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Strong in adolescence; can support or</text><text x="537" y="381.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">oppose adult norms</text><rect x="30" y="410" width="130" height="90" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="460.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Media</text><rect x="168" y="410" width="347" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="439.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Representations, role models,</text><text x="182" y="459.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">advertising, algorithms, likes and</text><text x="182" y="479.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">comments</text><rect x="523" y="410" width="347" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="439.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Influence debated: direct effects to</text><text x="537" y="459.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">active audiences</text><rect x="30" y="508" width="130" height="70" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="548.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Religions</text><rect x="168" y="508" width="347" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="537.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Teachings, rituals, festivals, community</text><text x="182" y="557.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">expectations, religious schooling</text><rect x="523" y="508" width="347" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="537.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Strong collective identity and moral</text><text x="537" y="557.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">framework</text><rect x="30" y="586" width="130" height="70" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="626.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Workplace</text><rect x="168" y="586" width="347" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="615.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Induction, training, codes of conduct,</text><text x="182" y="635.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">culture; anticipatory socialisation</text><rect x="523" y="586" width="347" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="615.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Continues socialisation into adult life</text><rect x="30" y="672" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="708" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two distinctions for "explain" questions</text><circle cx="61" cy="731.39" r="4.5" fill="#8a6d0d"/><text x="74" y="737" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Formal vs informal:</tspan> a school’s written rules vs a peer group’s mockery</text><circle cx="61" cy="761.39" r="4.5" fill="#8a6d0d"/><text x="74" y="767" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Deliberate vs unintended:</tspan> teaching manners vs copying a parent’s attitudes to money</text>
</svg>