<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">School mirrors work</text>

<rect x="30" y="110" width="370" height="54" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="215" y="145" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">School: hidden curriculum</text><rect x="500" y="110" width="370" height="54" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="685" y="145" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Workplace</text><rect x="30" y="176" width="370" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="215" y="213" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Obedience to teachers</text><rect x="500" y="176" width="370" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="685" y="213" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Obedience at work</text><line x1="408" y1="206" x2="492" y2="206" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="248" width="370" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="215" y="285" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Acceptance of the school hierarchy</text><rect x="500" y="248" width="370" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="685" y="285" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Acceptance of hierarchy at work</text><line x1="408" y1="278" x2="492" y2="278" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="320" width="370" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="215" y="357" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Motivation by grades</text><rect x="500" y="320" width="370" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="685" y="357" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Motivation by wages</text><line x1="408" y1="350" x2="492" y2="350" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="450" y="406" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Bowles and Gintis (1976): the correspondence principle</text><rect x="30" y="428" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="464" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Willis (1977): Learning to Labour</text><text x="56" y="493" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Working-class "lads" resisted school values, yet their resistance led them into manual</text><text x="56" y="515" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">work anyway.</text>
</svg>