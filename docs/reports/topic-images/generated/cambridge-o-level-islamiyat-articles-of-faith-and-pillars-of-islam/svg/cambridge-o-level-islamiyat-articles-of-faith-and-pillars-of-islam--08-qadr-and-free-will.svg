<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 518" width="900" height="518" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="518" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Predestination and free will</text>

<rect x="30" y="110" width="370" height="240" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="215" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Al-qadr: Allah...</text><circle cx="60" cy="186" r="6" fill="#8a6d0d"/><text x="76" y="192" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">knows everything before it happens</text><circle cx="60" cy="230" r="6" fill="#8a6d0d"/><text x="76" y="236" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">has recorded it</text><circle cx="60" cy="274" r="6" fill="#8a6d0d"/><text x="76" y="280" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">wills it</text><circle cx="60" cy="318" r="6" fill="#8a6d0d"/><text x="76" y="324" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">creates it</text><rect x="500" y="110" width="370" height="240" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="685" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Human free will</text><text x="685" y="210" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Humans make real choices</text><text x="685" y="238" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">and are judged on them.</text><circle cx="450" cy="230" r="46" fill="#1e2a44"/><text x="450" y="226" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">held</text><text x="450" y="246" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">together</text><line x1="450" y1="354" x2="450" y2="384" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="390" width="272" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="166" y="430" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Patience in hardship</text><text x="166" y="469.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">"this was written"</text><rect x="314" y="390" width="272" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="448" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Humility in success</text><rect x="598" y="390" width="272" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734" y="430" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Continued effort</text><text x="734" y="459.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">"tie your camel and trust in</text><text x="734" y="479.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Allah"</text>
</svg>