<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 738" width="900" height="738" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="738" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Five Pillars: practice and significance</text>

<text x="218" y="132" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">What Muslims do</text><text x="554" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Why it matters</text><rect x="30" y="146" width="170" height="88" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="64" cy="190" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="196.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="92" y="197" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Shahada</text><rect x="206" y="146" width="330" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="174" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The declaration of faith in Allah</text><text x="220" y="196" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and in Muhammad (pbuh) as His</text><text x="220" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Messenger.</text><rect x="542" y="146" width="328" height="88" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="556" y="174" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The door to Islam; repeated in</text><text x="556" y="196" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">every prayer; Muslims hope it will</text><text x="556" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">be their last words.</text><rect x="30" y="244" width="170" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="64" cy="299" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="305.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="92" y="306" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Salat</text><rect x="206" y="244" width="330" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="272" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Five times daily at set times from</text><text x="220" y="294" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">dawn to night: rak'at of standing,</text><text x="220" y="316" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recitation, bowing and prostration,</text><text x="220" y="338" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">facing the qibla.</text><rect x="542" y="244" width="328" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="556" y="272" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Discipline, remembrance of Allah,</text><text x="556" y="294" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">equality and unity in congregation,</text><text x="556" y="316" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">protection from indecency and</text><text x="556" y="338" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wrongdoing (29.45).</text><rect x="30" y="364" width="170" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="64" cy="419" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="425.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="92" y="426" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Zakat</text><rect x="206" y="364" width="330" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="392" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">2.5 per cent a year on savings</text><text x="220" y="414" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">above the nisab (other rates on</text><text x="220" y="436" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">crops and livestock), to the eight</text><text x="220" y="458" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">categories in 9.60.</text><rect x="542" y="364" width="328" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="556" y="392" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Purification of wealth, relief of</text><text x="556" y="414" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">poverty and social solidarity.</text><rect x="30" y="484" width="170" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="64" cy="539" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="545.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="92" y="546" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sawm</text><rect x="206" y="484" width="330" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="512" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fasting in Ramadan from dawn to</text><text x="220" y="534" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sunset: no food, drink or marital</text><text x="220" y="556" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">relations, and no bad words or</text><text x="220" y="578" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">deeds.</text><rect x="542" y="484" width="328" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="556" y="512" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Self-control, gratitude, empathy</text><text x="556" y="534" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">for the poor and increased worship,</text><text x="556" y="556" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">especially on Laylat al-Qadr.</text><rect x="30" y="604" width="170" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="64" cy="659" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="665.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="92" y="666" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Hajj</text><rect x="206" y="604" width="330" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="632" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pilgrimage to Makka in Dhu</text><text x="220" y="654" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">al-Hijja, once in a lifetime for</text><text x="220" y="676" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">those physically and financially</text><text x="220" y="698" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">able.</text><rect x="542" y="604" width="328" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="556" y="632" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Equality of all believers,</text><text x="556" y="654" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">remembrance of Ibrahim, Hajar and</text><text x="556" y="676" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Isma'il, forgiveness of sins,</text><text x="556" y="698" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">preparation for meeting Allah.</text>
</svg>