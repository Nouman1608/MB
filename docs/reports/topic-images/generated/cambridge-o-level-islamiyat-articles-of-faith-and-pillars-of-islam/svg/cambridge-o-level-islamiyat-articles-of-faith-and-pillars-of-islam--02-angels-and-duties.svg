<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="639.58" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Angels and their duties</text>

<rect x="30" y="110" width="840" height="60" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><text x="450" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Created from light  ·  do not eat or sleep  ·  obey Allah without free will</text><rect x="30" y="188" width="414" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="220.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Jibril</text><text x="46" y="249.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Delivered revelation</text><rect x="456" y="188" width="414" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="220.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Mika'il</text><text x="472" y="249.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Oversees provision and rain</text><rect x="30" y="292" width="414" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="324.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Israfil</text><text x="46" y="353.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Will sound the trumpet</text><rect x="456" y="292" width="414" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="324.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The Angel of Death</text><text x="472" y="353.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Takes souls</text><rect x="30" y="396" width="414" height="92" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="46" y="428.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Kiraman Katibin</text><text x="46" y="457.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Record deeds</text><rect x="456" y="396" width="414" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="428.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Munkar and Nakir</text><text x="472" y="457.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Question the dead</text><rect x="30" y="504" width="840" height="111.58000000000001" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="539.58" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Significance</text><text x="50" y="568.6400000000001" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Muslims know they are never unobserved, which encourages honesty and good conduct even in</text><text x="50" y="591.0800000000002" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">private.</text>
</svg>