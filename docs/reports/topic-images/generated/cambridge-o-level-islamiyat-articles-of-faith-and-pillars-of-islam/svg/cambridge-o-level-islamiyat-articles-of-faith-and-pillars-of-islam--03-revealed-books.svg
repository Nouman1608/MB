<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="512" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The revealed books</text>

<rect x="30" y="112" width="160" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="160" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">Suhuf</text><text x="110" y="186" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(scrolls)</text><text x="110" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">given to</text><rect x="40" y="242" width="140" height="56" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="110" y="275.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ibrahim</text><rect x="200" y="112" width="160" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="280" y="160" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">Tawrat</text><text x="280" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">given to</text><rect x="210" y="242" width="140" height="56" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="280" y="275.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Musa</text><rect x="370" y="112" width="160" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="160" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">Zabur</text><text x="450" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">given to</text><rect x="380" y="242" width="140" height="56" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="275.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Dawud</text><rect x="540" y="112" width="160" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="160" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">Injil</text><text x="620" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">given to</text><rect x="550" y="242" width="140" height="56" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="275.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Isa</text><rect x="710" y="112" width="160" height="200" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><text x="790" y="160" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="middle">Qur'an</text><text x="790" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">given to</text><rect x="720" y="242" width="140" height="56" rx="16" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="790" y="265.07" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Muhammad</text><text x="790" y="286.83" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">(pbuh)</text><path d="M40,340 L860,340" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" marker-end="url(#ahT)"/><path d="M860,340 L40,340" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" marker-end="url(#ahT)"/><text x="450" y="370" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">all taught tawhid and right conduct</text><rect x="30" y="396" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="432" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Qur'an is the last revelation, preserved unchanged in its original</text><text x="56" y="462" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">Arabic and memorised by millions: the final guide for life and law.</text>
</svg>