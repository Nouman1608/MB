<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The range of meanings of jihad</text>

<rect x="200" y="108" width="500" height="70" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><text x="450" y="151" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Jihad means "striving"</text><path d="M450,178 L450,200 L166,200 L166,226" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="232" width="272" height="160" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="48" y="266" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Inner struggle</text><text x="48" y="293" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="start" font-style="italic">the greater jihad</text><text x="48" y="327" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Controlling desires and</text><text x="48" y="350" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">living rightly.</text><path d="M450,178 L450,200 L450,200 L450,226" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="314" y="232" width="272" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="332" y="266" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Speech, study,</text><text x="332" y="291" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">teaching and wealth</text><text x="332" y="324" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Striving through what one</text><text x="332" y="347" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">says, learns, teaches and</text><text x="332" y="370" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">gives.</text><path d="M450,178 L450,200 L734,200 L734,226" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="598" y="232" width="272" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="266" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Physical jihad</text><text x="616" y="299" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Permitted only under strict</text><text x="616" y="322" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">conditions.</text><line x1="734" y1="394" x2="734" y2="430" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="436" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="472" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Physical jihad is permitted only:</text><circle cx="68" cy="504" r="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M62,504 l5,5 l8,-10" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="90" y="510" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">for defence or to</text><text x="90" y="534" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">end oppression</text><circle cx="308" cy="504" r="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M302,504 l5,5 l8,-10" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="330" y="510" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">under legitimate</text><text x="330" y="534" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">authority</text><circle cx="538" cy="504" r="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M532,504 l5,5 l8,-10" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="560" y="510" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">never against civilians,</text><text x="560" y="534" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">women, children, the elderly,</text><text x="560" y="558" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">crops or places of worship</text>
</svg>