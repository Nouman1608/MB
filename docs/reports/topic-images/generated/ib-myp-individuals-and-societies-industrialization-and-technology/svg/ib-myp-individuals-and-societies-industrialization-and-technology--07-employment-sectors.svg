<rect x="30" y="110" width="840" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="150" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Norland (fictional data): share of jobs by sector</text><text x="150" y="225" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">1800</text><rect x="170" y="180" width="396.8" height="70" fill="#6f9a52" stroke="#fff" stroke-width="2"/><text x="368.4" y="222" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">62%</text><rect x="566.8" y="180" width="140.8" height="70" fill="#b5602e" stroke="#fff" stroke-width="2"/><text x="637.1999999999999" y="222" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">22%</text><rect x="707.5999999999999" y="180" width="102.4" height="70" fill="#b5d3cf" stroke="#fff" stroke-width="2"/><text x="758.8" y="222" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">16%</text><text x="150" y="335" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">1900</text><rect x="170" y="290" width="115.19999999999999" height="70" fill="#6f9a52" stroke="#fff" stroke-width="2"/><text x="227.6" y="332" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">18%</text><rect x="285.2" y="290" width="294.40000000000003" height="70" fill="#b5602e" stroke="#fff" stroke-width="2"/><text x="432.4" y="332" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">46%</text><rect x="579.6" y="290" width="230.39999999999998" height="70" fill="#b5d3cf" stroke="#fff" stroke-width="2"/><text x="694.8" y="332" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">36%</text><text x="150" y="445" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">2020</text><rect x="170" y="400" width="12.8" height="70" fill="#6f9a52" stroke="#fff" stroke-width="2"/><rect x="182.8" y="400" width="108.80000000000001" height="70" fill="#b5602e" stroke="#fff" stroke-width="2"/><text x="237.20000000000002" y="442" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">17%</text><rect x="291.6" y="400" width="518.4000000000001" height="70" fill="#b5d3cf" stroke="#fff" stroke-width="2"/><text x="550.8000000000001" y="442" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">81%</text><text x="174" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">primary 2%</text><rect x="250" y="530" width="22" height="22" fill="#6f9a52"/><text x="280" y="548" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Primary</text><rect x="410" y="530" width="22" height="22" fill="#b5602e"/><text x="440" y="548" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Secondary</text><rect x="570" y="530" width="22" height="22" fill="#b5d3cf"/><text x="600" y="548" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tertiary</text><text x="450" y="600" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Secondary: +24 percentage points (1800–1900), then −29 (1900–2020)</text><rect x="30" y="650" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="681.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A change from 22% to 46% is 24 percentage points, not a “24% increase”.</text>
