<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 787" width="900" height="787" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="787" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who industrialised when</text>

<rect x="30" y="110" width="840" height="542" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="330" y1="130" x2="330" y2="612" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 4"/><text x="330" y="637" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1750</text><line x1="434" y1="130" x2="434" y2="612" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 4"/><text x="434" y="637" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1800</text><line x1="538" y1="130" x2="538" y2="612" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 4"/><text x="538" y="637" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1850</text><line x1="642" y1="130" x2="642" y2="612" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 4"/><text x="642" y="637" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1900</text><line x1="746" y1="130" x2="746" y2="612" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 4"/><text x="746" y="637" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1950</text><line x1="850" y1="130" x2="850" y2="612" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 4"/><text x="850" y="637" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2000</text><text x="50" y="162" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Britain</text><rect x="350.8" y="144" width="499.2" height="18" rx="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><circle cx="350.8" cy="153" r="8" fill="#8a6d0d"/><text x="330" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">first, c. 1760–1840</text><text x="50" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">USA</text><rect x="569.2" y="210" width="280.79999999999995" height="18" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="569.2" cy="219" r="8" fill="#2e6b62"/><text x="330" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mainly after the Civil War (1861–1865)</text><text x="50" y="294" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Japan</text><rect x="575.44" y="276" width="274.55999999999995" height="18" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="575.44" cy="285" r="8" fill="#2e6b62"/><text x="330" y="318" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">after the Meiji Restoration (1868): state copied Western technology</text><text x="50" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Germany</text><rect x="581.6800000000001" y="342" width="268.31999999999994" height="18" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="581.6800000000001" cy="351" r="8" fill="#2e6b62"/><text x="330" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fast after unification (1871): steel, chemicals, electrical goods</text><text x="50" y="426" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">USSR</text><rect x="700.24" y="408" width="149.76" height="18" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="700.24" cy="417" r="8" fill="#2e6b62"/><text x="330" y="450" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Five-Year Plans: state-planned heavy industry</text><text x="50" y="492" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">South Korea, Taiwan,</text><text x="50" y="512" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Singapore, Hong Kong</text><rect x="766.8" y="474" width="83.20000000000005" height="18" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="766.8" cy="483" r="8" fill="#2e6b62"/><text x="330" y="516" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">from the 1960s: export-led manufacturing</text><text x="50" y="558" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">China</text><rect x="804.24" y="540" width="45.75999999999999" height="18" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="804.24" cy="549" r="8" fill="#2e6b62"/><text x="330" y="582" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">reforms from 1978; Shenzhen SEZ (1980)</text><rect x="30" y="682" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="713.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Later industrialisers borrowed technology and leaned on the state far more than Britain did,</text><text x="450" y="735.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">so they changed faster.</text>
</svg>