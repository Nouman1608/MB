<rect width="900" height="724" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Challenge and response</text>

<text x="270" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Textiles: a back-and-forth</text><path d="M365.2,228.1 A175,175 0 0 1 435.0,316.6" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M435.0,433.4 A175,175 0 0 1 365.2,521.9" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M174.8,521.9 A175,175 0 0 1 105.0,433.4" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M105.0,316.6 A175,175 0 0 1 174.8,228.1" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="185" y="152" width="170" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="270" y="194.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Faster weaving</text><text x="270" y="220.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">flying shuttle</text><rect x="360" y="327" width="170" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="445" y="371.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More demand for</text><text x="445" y="394.86" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">yarn</text><rect x="185" y="502" width="170" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="270" y="532.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Spinning</text><text x="270" y="556.36" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">mechanised</text><text x="270" y="582.1600000000001" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">jenny, frame, mule</text><rect x="10" y="327" width="170" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="95" y="357.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Faster weaving</text><text x="95" y="381.36" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">needed</text><text x="95" y="407.16" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">power loom</text><text x="700" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Power: one need leads to the next</text><rect x="560" y="160" width="280" height="55" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="700" y="195.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Machines need power</text><line x1="700" y1="219" x2="700" y2="249" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="560" y="255" width="280" height="55" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="700" y="290.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Water gives way to steam</text><line x1="700" y1="314" x2="700" y2="344" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="560" y="350" width="280" height="55" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="700" y="385.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Steam needs coal</text><line x1="700" y1="409" x2="700" y2="439" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="560" y="445" width="280" height="106" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="700" y="480.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Coal needs better</text><text x="700" y="503.86" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">transport</text><text x="700" y="530.98" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">canals, then railways</text><rect x="30" y="640" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="672.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Using the chain shows causality, which scores better than a list.</text>
</svg>