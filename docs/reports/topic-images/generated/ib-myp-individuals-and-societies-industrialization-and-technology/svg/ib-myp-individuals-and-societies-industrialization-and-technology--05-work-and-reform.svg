<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Work: from home to factory to reform</text>

<rect x="30" y="110" width="410" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="235" y="178.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Domestic system</text><text x="235" y="205.67000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the putting-out system: families spun and wove</text><text x="235" y="226.79000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">at home</text><rect x="460" y="110" width="410" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="665" y="168.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Factory system</text><text x="665" y="195.17000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">set by clock and machine, often 12–14 hours;</text><text x="665" y="216.29000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">fines for lateness; women and children cheap</text><text x="665" y="237.41000000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">labour</text><line x1="420" y1="195" x2="480" y2="195" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="30" y="320" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Responses</text><rect x="30" y="335" width="270" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="165" y="378.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Luddites</text><text x="165" y="405.67" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">1811–1816: skilled hand</text><text x="165" y="426.79" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">workers broke machines</text><rect x="315" y="335" width="270" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="450" y="389.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Trade unions grow</text><text x="450" y="416.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">workers organised</text><rect x="600" y="335" width="270" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="735" y="378.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Chartists</text><text x="735" y="405.67" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">1838–1848: demanded the vote</text><text x="735" y="426.79" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">for working men</text><text x="30" y="495" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Slow reform</text><rect x="30" y="510" width="410" height="130" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="548.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Factory Act 1833</text><text x="48" y="575.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">no children under nine in textile mills;</text><text x="48" y="596.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">limited hours for older children; factory</text><text x="48" y="617.41" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inspectors</text><rect x="460" y="510" width="410" height="130" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="558.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mines Act 1842</text><text x="478" y="585.67" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">banned women and girls, and boys under ten,</text><text x="478" y="606.79" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from working underground</text>
</svg>