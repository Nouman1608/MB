<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 748" width="900" height="748" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="748" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why industrialisation began in Britain</text>

<line x1="450" y1="370" x2="160" y2="180" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="370" x2="450" y2="180" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="370" x2="740" y2="180" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="370" x2="160" y2="560" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="370" x2="450" y2="560" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="370" x2="740" y2="560" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="120" width="260" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="160" y="164.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Resources</text><text x="160" y="190.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">coal and iron ore close</text><text x="160" y="210.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">together; fast rivers</text><rect x="320" y="120" width="260" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="164.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Agricultural change</text><text x="450" y="190.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">more food, growing population,</text><text x="450" y="210.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">labour freed for towns</text><rect x="610" y="120" width="260" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="740" y="164.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Capital</text><text x="740" y="190.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">trade profits, including the</text><text x="740" y="210.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Atlantic slave trade; banks</text><rect x="30" y="500" width="260" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="160" y="544.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Markets and empire</text><text x="160" y="570.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">colonies supplied raw cotton</text><text x="160" y="590.1999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and bought goods</text><rect x="320" y="500" width="260" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="544.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Transport</text><text x="450" y="570.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rivers, long coastline, canals</text><text x="450" y="590.1999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">from the 1760s</text><rect x="610" y="500" width="260" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="740" y="544.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Political stability</text><text x="740" y="570.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">no invasion; Parliament</text><text x="740" y="590.1999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">protected property and patents</text><circle cx="450" cy="370" r="104" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="337.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Industrial</text><text x="450" y="363.79999999999995" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Revolution</text><text x="450" y="390.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">in Britain</text><text x="450" y="416.59999999999997" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">c. 1760–1840</text><rect x="30" y="645" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="675.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Explain how the factors link, for example farm change freed the labour that factories used, rather</text><text x="450" y="696.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">than listing them.</text>
</svg>