<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 848" width="900" height="848" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="848" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key inventions, 1709–1830</text>

<rect x="30" y="110" width="840" height="678" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="180" y1="140" x2="180" y2="748" stroke="#1e2a44" stroke-width="4"/><text x="160" y="161" font-size="19" font-weight="700" fill="#b5602e" text-anchor="end">1709</text><circle cx="180" cy="154" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="210" y="161" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Darby smelts iron with coke</text><text x="560" y="161" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cheaper iron, not limited by charcoal</text><text x="160" y="219" font-size="19" font-weight="700" fill="#b5602e" text-anchor="end">1712</text><circle cx="180" cy="212" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="210" y="219" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Newcomen’s steam engine</text><text x="560" y="219" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pumped water out of mines</text><text x="160" y="277" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">1733</text><circle cx="180" cy="270" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="210" y="277" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kay’s flying shuttle</text><text x="560" y="277" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">faster weaving; more demand for yarn</text><text x="160" y="335" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="end">1761</text><circle cx="180" cy="328" r="9" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="210" y="335" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bridgewater Canal opens</text><text x="560" y="335" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">halved the cost of coal in Manchester</text><text x="160" y="393" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">c. 1764</text><circle cx="180" cy="386" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="210" y="393" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hargreaves’s spinning jenny</text><text x="560" y="393" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one worker spun several threads</text><text x="160" y="451" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">1769</text><circle cx="180" cy="444" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="210" y="451" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Arkwright’s water frame</text><text x="560" y="451" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">strong yarn from water power</text><text x="160" y="509" font-size="19" font-weight="700" fill="#b5602e" text-anchor="end">1769</text><circle cx="180" cy="502" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="210" y="509" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Watt’s separate condenser</text><text x="560" y="509" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">much more efficient steam engine</text><text x="160" y="567" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">1779</text><circle cx="180" cy="560" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="210" y="567" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Crompton’s spinning mule</text><text x="560" y="567" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fine, strong yarn in quantity</text><text x="160" y="625" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="end">1785</text><circle cx="180" cy="618" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="210" y="625" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cartwright’s power loom</text><text x="560" y="625" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mechanised weaving</text><text x="160" y="683" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="end">1825</text><circle cx="180" cy="676" r="9" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="210" y="683" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stockton and Darlington Railway</text><text x="560" y="683" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">first public steam railway</text><text x="160" y="741" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="end">1830</text><circle cx="180" cy="734" r="9" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="210" y="741" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Liverpool and Manchester Railway</text><text x="560" y="741" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">first inter-city line fully by steam</text><circle cx="250" cy="818" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="266" y="824" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">power and iron</text><circle cx="430" cy="818" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="446" y="824" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">textiles</text><circle cx="610" cy="818" r="9" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2"/><text x="626" y="824" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transport</text>
</svg>