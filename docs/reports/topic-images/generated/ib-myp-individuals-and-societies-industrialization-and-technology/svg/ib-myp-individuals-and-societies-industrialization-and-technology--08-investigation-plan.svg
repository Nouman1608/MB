<rect width="900" height="782" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning an investigation (criterion B)</text>

<rect x="30" y="110" width="840" height="112.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="166.32" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="174.95999999999998" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="128" y="149" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Research question</text><text x="128" y="173.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Focused, answerable, open: “How far did the 1833 Factory Act improve conditions for child</text><text x="128" y="194.52" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">workers in textile mills?”</text><rect x="30" y="232.64000000000001" width="840" height="91.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="278.40000000000003" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="287.04" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="128" y="271.64" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Justify it</text><text x="128" y="296.03999999999996" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Why it matters and how it links to a concept such as causality or change.</text><rect x="30" y="334.16" width="840" height="112.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="390.48" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="399.12" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="128" y="373.16" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><text x="128" y="397.56" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Primary sources (factory reports, census tables, letters) and secondary sources</text><text x="128" y="418.68" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(historians, textbooks).</text><rect x="30" y="456.80000000000007" width="840" height="91.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="502.56000000000006" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="511.20000000000005" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="128" y="495.80000000000007" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Action plan</text><text x="128" y="520.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Steps with dates, so the work is manageable.</text><rect x="30" y="558.32" width="840" height="91.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="604.08" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="612.72" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="128" y="597.32" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Recording and referencing</text><text x="128" y="621.72" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Every source noted in one consistent format.</text><rect x="30" y="659.84" width="840" height="91.52000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="705.6" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="714.24" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="128" y="698.84" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="128" y="723.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Judge the source range, what went well and what you would change.</text>
</svg>