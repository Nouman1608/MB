<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hohfeld’s legal relations</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each position is matched by a correlative held by another person</text>
<text x="170" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">A HOLDS</text><text x="470" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">B HOLDS</text><rect x="40" y="152" width="260" height="76" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="197" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Claim-right</text><line x1="306" y1="190" x2="374" y2="190" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah)"/><rect x="380" y="152" width="180" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="197" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Duty</text><text x="585" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A has a right to be paid; B has a duty to</text><text x="585" y="201" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pay</text><rect x="40" y="240" width="260" height="76" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="285" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Liberty (privilege)</text><line x1="306" y1="278" x2="374" y2="278" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah)"/><rect x="380" y="240" width="180" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="285" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">No-right</text><text x="585" y="270" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A is free to walk on public land; B has</text><text x="585" y="289" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">no right to stop A</text><rect x="40" y="328" width="260" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="373" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Power</text><line x1="306" y1="366" x2="374" y2="366" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah)"/><rect x="380" y="328" width="180" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="373" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Liability</text><text x="585" y="358" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A can make a will; others’ legal</text><text x="585" y="377" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">positions are changed</text><rect x="40" y="416" width="260" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="461" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Immunity</text><line x1="306" y1="454" x2="374" y2="454" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah)"/><rect x="380" y="416" width="180" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="461" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Disability</text><text x="585" y="446" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A cannot be stripped of a protected</text><text x="585" y="465" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">status; the state lacks the power</text><rect x="30" y="514" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="548.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The key contrast</text><text x="450" y="577.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A <tspan font-weight="700" fill="#1e2a44">claim-right</tspan> puts a <tspan font-weight="700" fill="#1e2a44">duty</tspan> on someone else. A <tspan font-weight="700" fill="#1e2a44">liberty</tspan> only means the holder has <tspan font-weight="700" fill="#1e2a44">no</tspan> <tspan font-weight="700" fill="#1e2a44">duty</tspan> <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">act</tspan>:</text><text x="450" y="598.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">nobody is obliged to help.</text>
</svg>