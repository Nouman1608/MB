<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 591" width="900" height="591" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Residual liberties and rights in the UK</text>

<rect x="30" y="100" width="412" height="176" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BEFORE 1998: RESIDUAL LIBERTIES</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do anything the law does not forbid</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dicey (1885): liberties protected by the</text><text x="63.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ordinary courts applying ordinary law</text><text x="48" y="232.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Weakness:</tspan> the state too may do anything not</text><text x="63.2" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">forbidden</text><rect x="458" y="100" width="412" height="176" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A RIGHT</text><text x="476" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Places a duty on the state</text><text x="476" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The state must justify any interference</text><rect x="30" y="298" width="840" height="107" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="328" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MALONE v METROPOLITAN POLICE COMMISSIONER (1979)</text><text x="48" y="354.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Telephone tapping lawful because no law forbade it</text><text x="48" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mr Malone had no right of privacy to assert.</text><text x="450" y="445" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BERLIN, TWO CONCEPTS OF LIBERTY (1958)</text><rect x="30" y="459" width="412" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="489.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Negative liberty</text><text x="46" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Freedom from interference. Mostly protected by</text><text x="46" y="538.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">civil and political rights such as Article 10</text><rect x="458" y="459" width="412" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="489.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Positive liberty</text><text x="474" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Capacity to act and control one’s life. Positive</text><text x="474" y="538.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">obligations and social rights move towards it</text>
</svg>