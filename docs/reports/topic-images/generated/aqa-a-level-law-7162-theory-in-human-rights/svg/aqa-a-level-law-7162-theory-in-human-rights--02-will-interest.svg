<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 461" width="900" height="461" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="461" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What does having a right mean?</text>

<rect x="30" y="100" width="412" height="177" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WILL (CHOICE) THEORY: HART</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Control over another’s duty</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The holder can enforce or waive it</text><text x="48" y="212.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Problem:</tspan> young children and people lacking</text><text x="63.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">capacity cannot choose; some rights cannot be</text><text x="63.2" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">waived</text><rect x="458" y="100" width="412" height="177" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTEREST (BENEFIT) THEORY: RAZ</text><text x="476" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Well-being is reason enough for a duty</text><text x="476" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An aspect of well-being justifies holding others</text><text x="491.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">under a duty</text><text x="476" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Problem:</tspan> risks treating every protected interest</text><text x="491.2" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as a right</text><rect x="30" y="299" width="840" height="130" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="333" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THE CONVENTION FITS THE INTEREST THEORY BETTER</text><rect x="50" y="351" width="392" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="246" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Article</tspan> <tspan font-weight="700" fill="#1e2a44">2</tspan> protects the life of a person who</text><text x="246" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">cannot choose</text><rect x="458" y="351" width="392" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="654" y="388.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Freedom</tspan> <tspan font-weight="700" fill="#1e2a44">from</tspan> <tspan font-weight="700" fill="#1e2a44">torture</tspan> cannot be waived</text>
</svg>