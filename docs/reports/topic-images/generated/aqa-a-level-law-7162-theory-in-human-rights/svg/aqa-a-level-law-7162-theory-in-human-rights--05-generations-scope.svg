<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 809" width="900" height="809" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="809" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The scope of fundamental human rights</text>

<text x="450" y="114" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">KAREL VASAK’S GENERATIONS OF RIGHTS</text><rect x="30" y="128" width="560" height="74" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="159" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1st generation</text><text x="50" y="184" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Civil and political</text><text x="570" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Life, liberty, expression</text><rect x="606" y="128" width="264" height="74" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="738" y="158" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">The ECHR is mainly here: easier</text><text x="738" y="178" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">to enforce in court</text><rect x="30" y="212" width="840" height="74" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="243" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2nd generation</text><text x="50" y="268" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Economic, social and cultural</text><text x="850" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Work, health, education</text><rect x="30" y="296" width="840" height="74" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="327" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3rd generation</text><text x="50" y="352" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Collective</text><text x="850" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Development, a healthy environment</text><rect x="30" y="392" width="412" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="422" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNIVERSALITY</text><text x="48" y="448.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rights belong to everyone</text><text x="48" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Vienna Declaration 1993: “universal, indivisible</text><text x="48" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and interdependent and interrelated”</text><rect x="458" y="392" width="412" height="128" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="422" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CULTURAL RELATIVISM</text><text x="476" y="448.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rights reflect Western values</text><text x="476" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Apply with regard to local cultures. The margin of</text><text x="476" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">appreciation is a limited concession</text><rect x="30" y="542" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="570" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HIERARCHY</text><text x="46" y="601.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Absolute, limited and qualified rights: torture</text><text x="46" y="622.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cannot be balanced; expression can be restricted</text><rect x="458" y="542" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="570" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONFLICTS</text><text x="474" y="601.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Privacy v expression; assembly v others’ freedom</text><text x="474" y="622.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of movement: not all rights can be trumps</text><rect x="30" y="655" width="412" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="683" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESPONSIBILITIES</text><text x="46" y="714.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Article 10.2: expression “carries with it duties and</text><text x="46" y="735.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">responsibilities”</text><rect x="458" y="655" width="412" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="683" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHO HOLDS THEM</text><text x="474" y="714.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Individuals, and some claims by companies,</text><text x="474" y="735.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">groups and NGOs (<tspan font-style="italic">Sunday</tspan> <tspan font-style="italic">Times</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan>, 1979);</text><text x="474" y="756.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mainly against the state</text>
</svg>