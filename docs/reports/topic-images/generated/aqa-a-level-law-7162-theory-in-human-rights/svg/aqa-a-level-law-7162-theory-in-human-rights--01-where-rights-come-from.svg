<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="900" height="598" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="598" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where do rights come from?</text>

<rect x="30" y="100" width="270.6666666666667" height="218" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATURAL RIGHTS</text><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Because we are human</text><text x="46" y="182.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Locke</tspan> (1689): life, liberty,</text><text x="61.2" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">property; social contract</text><text x="46" y="229.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Paine</tspan> (1791): each</text><text x="61.2" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">generation’s rights</text><text x="46" y="276.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="276.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UDHR 1948: “inherent</text><text x="61.2" y="297.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dignity”</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="218" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POSITIVISM</text><text x="330.6666666666667" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Because the law says so</text><text x="330.6666666666667" y="182.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Bentham:</tspan> natural rights are</text><text x="345.8666666666667" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“nonsense upon stilts”; test</text><text x="345.8666666666667" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is happiness</text><text x="330.6666666666667" y="250.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Hart</tspan> (1961): a “minimum</text><text x="345.8666666666667" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">content of natural law”</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="218" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RIGHTS AS TRUMPS</text><text x="615.3333333333334" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Override collective goals</text><text x="615.3333333333334" y="182.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="630.5333333333334" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Dworkin</tspan> (1977): no override</text><text x="630.5333333333334" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">just to make the majority</text><text x="630.5333333333334" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">better off</text><text x="615.3333333333334" y="250.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="630.5333333333334" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protects minorities</text><clipPath id="tc340"><rect x="30" y="340" width="840" height="226" rx="14"/></clipPath><g clip-path="url(#tc340)"><rect x="30" y="340" width="140" height="48" fill="#b5d3cf"/><rect x="170" y="340" width="233.33333333333331" height="48" fill="#b5d3cf"/><text x="184" y="367.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Natural rights</text><rect x="403.3333333333333" y="340" width="233.33333333333331" height="48" fill="#f2e7b8"/><text x="417.3333333333333" y="367.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Positivism</text><rect x="636.6666666666666" y="340" width="233.33333333333331" height="48" fill="#c9d6d4"/><text x="650.6666666666666" y="367.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Trumps</text><rect x="30" y="388" width="140" height="89" fill="#dce9e7"/><text x="44" y="414.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="170" y="388" width="233.33333333333331" height="89" fill="#ffffff"/><text x="184" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A standard to criticise</text><text x="184" y="435.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unjust laws, such as Nazi</text><text x="184" y="456.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">laws</text><rect x="403.3333333333333" y="388" width="233.33333333333331" height="89" fill="#ffffff"/><text x="417.3333333333333" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explains how rights work</text><text x="417.3333333333333" y="435.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in practice: HRA rights can</text><text x="417.3333333333333" y="456.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">be enforced</text><rect x="636.6666666666666" y="388" width="233.33333333333331" height="89" fill="#ffffff"/><text x="650.6666666666666" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explains why some rights</text><text x="650.6666666666666" y="435.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cannot be balanced away</text><line x1="30" y1="477" x2="870" y2="477" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="477" width="140" height="89" fill="#dce9e7"/><text x="44" y="503.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Weakness</text><rect x="170" y="477" width="233.33333333333331" height="89" fill="#f8faf9"/><text x="184" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No agreed method;</text><text x="184" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different thinkers, different</text><text x="184" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lists</text><rect x="403.3333333333333" y="477" width="233.33333333333331" height="89" fill="#f8faf9"/><text x="417.3333333333333" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A state can remove rights</text><text x="417.3333333333333" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">that depend wholly on law</text><rect x="636.6666666666666" y="477" width="233.33333333333331" height="89" fill="#f8faf9"/><text x="650.6666666666666" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gives judges too large a</text><text x="650.6666666666666" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">role</text></g><line x1="170" y1="340" x2="170" y2="566" stroke="#c9d6d4" stroke-width="1.5"/><line x1="403.3333333333333" y1="340" x2="403.3333333333333" y2="566" stroke="#c9d6d4" stroke-width="1.5"/><line x1="636.6666666666666" y1="340" x2="636.6666666666666" y2="566" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="340" width="840" height="226" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>