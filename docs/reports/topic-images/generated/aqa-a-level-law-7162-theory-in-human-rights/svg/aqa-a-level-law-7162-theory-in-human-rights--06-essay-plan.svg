<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 799" width="900" height="799" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="799" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Essay plan: rights or liberties?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Discuss the view that human rights are no more than liberties granted by law</text>
<line x1="60" y1="144" x2="60" y2="747" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="65" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTRODUCTION</text><text x="116" y="173.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Define right (claim + duty, Hohfeld) and liberty (no duty not to act)</text><circle cx="60" cy="156.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="165.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="197" width="766" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="221" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOR</text><text x="116" y="246.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Positivist support</text><text x="116" y="273.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bentham: rights come only from law; HRA 1998 rights exist because Parliament enacted them</text><circle cx="60" cy="243.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="252.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="298" width="766" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="322" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGAINST</text><text x="116" y="347.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Natural rights</text><text x="116" y="374.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Locke; the UDHR’s “inherent dignity”: some rights exist whatever the law says</text><circle cx="60" cy="344.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="353.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="399" width="766" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="423" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UK EXPERIENCE</text><text x="116" y="448.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Residual liberties failed in Malone (1979)</text><text x="116" y="475.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A right imposes a duty that a liberty does not</text><circle cx="60" cy="445.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="454.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="500" width="766" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="524" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGAINST</text><text x="116" y="549.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dworkin: rights as trumps</text><text x="116" y="576.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Resist majority override; statute can remove liberties</text><circle cx="60" cy="546.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="555.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="601" width="766" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="625" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SCOPE</text><text x="116" y="650.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Absolute rights like Article 3 are not mere liberties</text><text x="116" y="677.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Qualified rights look closer to liberties</text><circle cx="60" cy="647.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="656.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="104" y="702" width="766" height="65" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="726" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUSION</text><text x="116" y="751.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Legal recognition enforces rights; their justification is moral</text><circle cx="60" cy="734.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="743.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text>
</svg>