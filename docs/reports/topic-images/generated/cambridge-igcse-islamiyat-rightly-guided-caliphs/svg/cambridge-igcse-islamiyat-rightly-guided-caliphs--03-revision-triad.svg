<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 594" width="900" height="594" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="594" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One achievement, one difficulty, one link</text>

<text x="450" y="128" font-size="20" font-weight="700" fill="#4a5568" text-anchor="middle">Example: Abu Bakr</text><rect x="30" y="148" width="840" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="76" cy="198" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="76" y="206.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="120" y="188" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">One achievement</text><text x="120" y="220" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Held the community together after the Prophet's death</text><rect x="30" y="264" width="840" height="100" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><circle cx="76" cy="314" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="76" y="322.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="120" y="304" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">One difficulty</text><text x="120" y="336" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">The Ridda wars: tribes renounced allegiance to Medina</text><rect x="30" y="380" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="76" cy="430" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="76" y="438.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="120" y="420" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">One sentence linking it to leadership</text><text x="120" y="452" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">His firmness is seen as critical to Islam's survival as a unified community</text><rect x="30" y="506" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="546" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Repeat for Umar, Uthman and Ali before the exam.</text>
</svg>