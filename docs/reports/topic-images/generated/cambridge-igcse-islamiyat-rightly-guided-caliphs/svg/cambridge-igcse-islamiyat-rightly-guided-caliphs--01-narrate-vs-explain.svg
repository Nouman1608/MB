<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 434" width="900" height="434" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="434" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Narrating versus explaining</text>

<rect x="30" y="110" width="400" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="148" font-size="23" font-weight="700" fill="#b5602e" text-anchor="start">Narrating</text><text x="56" y="174" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">states what happened</text><rect x="56" y="200" width="348" height="90" rx="12" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="230" y="239.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Abu Bakr fought the Wars of</text><text x="230" y="263.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Apostasy (Ridda wars).</text><text x="56" y="330" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Accurate, but on its own it does not</text><text x="56" y="353" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">answer a significance question.</text><rect x="470" y="110" width="400" height="300" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="3"/><text x="496" y="148" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="start">Explaining</text><text x="496" y="174" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">says why it mattered</text><rect x="496" y="200" width="348" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="233.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Held the early community together</text><line x1="670" y1="258" x2="670" y2="284" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="496" y="290" width="348" height="96" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="321.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Islam survived as a unified faith</text><text x="670" y="343.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">and political community after the</text><text x="670" y="365.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Prophet's death</text><line x1="432" y1="245" x2="466" y2="245" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/>
</svg>