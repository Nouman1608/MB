<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four steps to a significance answer</text>

<text x="180" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">The step</text><text x="618" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Worked example: Umar</text><rect x="30" y="146" width="300" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="196" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="203.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="106" y="190" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">State a specific</text><text x="106" y="214" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">action or policy</text><line x1="332" y1="196" x2="362" y2="196" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="366" y="146" width="504" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="386" y="191" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Umar established administrative systems, including the</text><text x="386" y="213" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">diwan (register) for state finances and military pay.</text><rect x="30" y="260" width="300" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="310" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="317.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="106" y="304" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the problem</text><text x="106" y="328" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">it solved</text><line x1="332" y1="310" x2="362" y2="310" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="366" y="260" width="504" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="386" y="294" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Rapid expansion created a need for organised</text><text x="386" y="316" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">governance across a much larger and more diverse</text><text x="386" y="338" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">state.</text><rect x="30" y="374" width="300" height="100" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="70" cy="424" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="431.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="106" y="418" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the lasting</text><text x="106" y="442" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">significance</text><line x1="332" y1="424" x2="362" y2="424" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="366" y="374" width="504" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="386" y="419" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">These structures provided a model for governance used</text><text x="386" y="441" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and adapted by later Islamic states.</text><rect x="30" y="488" width="300" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="538" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="545.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="106" y="532" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Connect to</text><text x="106" y="556" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">leadership qualities</text><line x1="332" y1="538" x2="362" y2="538" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="366" y="488" width="504" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="386" y="533" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">It reflects Umar's reputation for justice and</text><text x="386" y="555" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">practical governance.</text>
</svg>