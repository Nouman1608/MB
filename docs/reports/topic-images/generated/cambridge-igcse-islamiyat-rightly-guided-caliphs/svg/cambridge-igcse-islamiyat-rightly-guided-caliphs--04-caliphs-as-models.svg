<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Caliphs still matter</text>

<line x1="450" y1="360" x2="260" y2="190" stroke="#2e6b62" stroke-width="3.5"/><line x1="450" y1="360" x2="640" y2="190" stroke="#2e6b62" stroke-width="3.5"/><line x1="450" y1="360" x2="260" y2="530" stroke="#2e6b62" stroke-width="3.5"/><line x1="450" y1="360" x2="640" y2="530" stroke="#2e6b62" stroke-width="3.5"/><rect x="280" y="298" width="340" height="124" rx="18" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><text x="450" y="339.91" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The Rightly Guided</text><text x="450" y="366.79" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Caliphate</text><text x="450" y="394" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">a reference point for...</text><rect x="110" y="148" width="300" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="260" y="197" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Just governance</text><rect x="490" y="148" width="300" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640" y="197" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Consultation (shura)</text><rect x="110" y="488" width="300" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="260" y="537" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ruler and community</text><rect x="490" y="488" width="300" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640" y="524.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Relations with other</text><text x="640" y="549.8000000000001" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">states</text><rect x="30" y="600" width="840" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="641" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Significant at the time and since, not only in the seventh century.</text>
