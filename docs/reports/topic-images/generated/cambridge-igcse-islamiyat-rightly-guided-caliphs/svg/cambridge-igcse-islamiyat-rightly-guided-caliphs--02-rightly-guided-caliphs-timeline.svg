<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Rightly Guided Caliphs, 632–661</text>

<rect x="50" y="130" width="55.172413793103445" height="44" rx="6" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><rect x="105.17241379310344" y="130" width="275.86206896551727" height="44" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="381.0344827586207" y="130" width="331.0344827586207" height="44" rx="6" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><rect x="712.0689655172414" y="130" width="137.9310344827586" height="44" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="50" y1="124" x2="50" y2="182" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="112" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">632</text><line x1="105.17241379310344" y1="124" x2="105.17241379310344" y2="182" stroke="#1e2a44" stroke-width="2.5"/><text x="109.17241379310344" y="112" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">634</text><line x1="381.0344827586207" y1="124" x2="381.0344827586207" y2="182" stroke="#1e2a44" stroke-width="2.5"/><text x="381.0344827586207" y="112" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">644</text><line x1="712.0689655172414" y1="124" x2="712.0689655172414" y2="182" stroke="#1e2a44" stroke-width="2.5"/><text x="712.0689655172414" y="112" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">656</text><line x1="850" y1="124" x2="850" y2="182" stroke="#1e2a44" stroke-width="2.5"/><text x="850" y="112" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">661</text><text x="450" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Bar lengths show years of rule (CE), drawn to scale.</text><path d="M77.58620689655172,176 L77.58620689655172,190 L131,236 L131,246" fill="none" stroke="#d4b02e" stroke-width="2.5" stroke-linejoin="round"/><rect x="30" y="246" width="202" height="282" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><rect x="30" y="246" width="202" height="86" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="131" y="286.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Abu Bakr</text><text x="131" y="320" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">632–634</text><circle cx="48" cy="356" r="5" fill="#d4b02e"/><text x="62" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ridda wars: tribes</text><text x="62" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">renounced</text><text x="62" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">allegiance to</text><text x="62" y="425" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Madinah</text><circle cx="48" cy="456" r="5" fill="#d4b02e"/><text x="62" y="462" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Held the community</text><text x="62" y="483" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">together</text><path d="M243.10344827586206,176 L243.10344827586206,190 L344,236 L344,246" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round"/><rect x="243" y="246" width="202" height="282" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="243" y="246" width="202" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="344" y="275.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Umar ibn</text><text x="344" y="298.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">al-Khattab</text><text x="344" y="320" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">634–644</text><circle cx="261" cy="356" r="5" fill="#2e6b62"/><text x="275" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rapid territorial</text><text x="275" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expansion</text><circle cx="261" cy="414" r="5" fill="#2e6b62"/><text x="275" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Built the</text><text x="275" y="441" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">administration:</text><text x="275" y="462" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">taxation, the</text><text x="275" y="483" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">diwan, treatment of</text><text x="275" y="504" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">non-Muslim subjects</text><path d="M546.551724137931,176 L546.551724137931,190 L557,236 L557,246" fill="none" stroke="#d4b02e" stroke-width="2.5" stroke-linejoin="round"/><rect x="456" y="246" width="202" height="282" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><rect x="456" y="246" width="202" height="86" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="557" y="286.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Uthman ibn Affan</text><text x="557" y="320" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">644–656</text><circle cx="474" cy="356" r="5" fill="#d4b02e"/><text x="488" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Standardised</text><text x="488" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">written Qur'an sent</text><text x="488" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to the major</text><text x="488" y="425" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">centres</text><circle cx="474" cy="456" r="5" fill="#d4b02e"/><text x="488" y="462" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Growing unrest;</text><text x="488" y="483" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assassinated</text><path d="M781.0344827586207,176 L781.0344827586207,190 L770,236 L770,246" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round"/><rect x="669" y="246" width="202" height="282" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="669" y="246" width="202" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="770" y="286.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ali ibn Abi Talib</text><text x="770" y="320" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">656–661</text><circle cx="687" cy="356" r="5" fill="#2e6b62"/><text x="701" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First Fitna:</text><text x="701" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Battles of the</text><text x="701" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Camel and Siffin</text><circle cx="687" cy="435" r="5" fill="#2e6b62"/><text x="701" y="441" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shaped the later</text><text x="701" y="462" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sunni-Shi'a</text><text x="701" y="483" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">division</text>
</svg>