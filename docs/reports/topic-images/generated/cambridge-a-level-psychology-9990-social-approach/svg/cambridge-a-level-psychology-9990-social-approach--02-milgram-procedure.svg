<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Milgram (1963): the procedure</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Yale University; 40 men aged 20 to 50, paid $4.50</text>
<rect x="30" y="124" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="590" y1="148" x2="590" y2="280" stroke="#1e2a44" stroke-width="5"/><text x="600" y="164" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">wall</text><rect x="60" y="168" width="200" height="96" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="207.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Experimenter</text><text x="160" y="235.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">uses four prods</text><rect x="320" y="168" width="200" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="420" y="197.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Teacher</text><text x="420" y="225.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">real participant at the</text><text x="420" y="245.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">generator</text><rect x="640" y="168" width="200" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="197.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Learner</text><text x="740" y="225.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">confederate, electrode</text><text x="740" y="245.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">on wrist</text><line x1="264" y1="216" x2="314" y2="216" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="524" y1="216" x2="634" y2="216" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="556" y="202" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">shocks</text><text x="450" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Rigged draw: the participant was always the teacher. Real 45 V sample shock.</text><text x="30" y="362" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">THE GENERATOR: 30 SWITCHES, 15 TO 450 V IN 15 V STEPS</text><rect x="40" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="67.6" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="95.2" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="122.80000000000001" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="150.4" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="178" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="205.60000000000002" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="233.20000000000002" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="260.8" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="288.4" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="316" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="343.6" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="371.20000000000005" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="398.8" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="426.40000000000003" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="454" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="481.6" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="509.20000000000005" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="536.8" y="380" width="26" height="44" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><rect x="564.4" y="380" width="26" height="44" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><rect x="592" y="380" width="26" height="44" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><rect x="619.6" y="380" width="26" height="44" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><rect x="647.2" y="380" width="26" height="44" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><rect x="674.8000000000001" y="380" width="26" height="44" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><rect x="702.4000000000001" y="380" width="26" height="44" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><rect x="730" y="380" width="26" height="44" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><rect x="757.6" y="380" width="26" height="44" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><rect x="785.2" y="380" width="26" height="44" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><rect x="812.8000000000001" y="380" width="26" height="44" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><rect x="840.4000000000001" y="380" width="26" height="44" rx="4" fill="#b5602e" stroke="#1e2a44" stroke-width="1.8"/><text x="53" y="448" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">15 V</text><text x="577.4" y="448" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">300 V</text><text x="853.4000000000001" y="448" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">450 V</text><text x="40" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“Slight Shock”</text><text x="866.4000000000001" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">“XXX”</text><text x="632.6" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">“Danger: Severe Shock”</text><rect x="30" y="502" width="270.6666666666667" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="534" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">300 V</text><text x="50" y="560.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Learner pounds on the</text><text x="50" y="583.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">wall</text><text x="50" y="611.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and stops answering</text><rect x="314.6666666666667" y="502" width="270.6666666666667" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="534" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AFTER 315 V</text><text x="334.6666666666667" y="560.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pounds again</text><text x="334.6666666666667" y="588.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">then silence</text><rect x="599.3333333333334" y="502" width="270.6666666666667" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="534" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IF THE TEACHER HESITATES</text><text x="619.3333333333334" y="560.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Four prods in order</text><text x="619.3333333333334" y="588.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Please continue” … “You</text><text x="619.3333333333334" y="609.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">have no other choice, you</text><text x="619.3333333333334" y="630.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">must go on”</text><text x="450" y="689.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Observed through a one-way mirror; interviewed afterwards.</text>
</svg>