<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Piliavin et al. (1969): the procedure</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A field experiment on a non-stop 7½-minute stretch of the New York subway</text>
<rect x="50" y="144" width="800" height="220" rx="30" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="826" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Schematic: positions not to scale</text><circle cx="90" cy="340" r="10" fill="#eef1f0" stroke="#4a5568" stroke-width="2"/><text x="108" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">passengers</text><circle cx="450" cy="244" r="20" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="288" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Victim</text><text x="450" y="308" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">collapses after 70 s</text><circle cx="640" cy="214" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="640" y="258" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Model</text><text x="640" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">helps at a set time</text><circle cx="190" cy="224" r="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="190" y="268" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Observer 1</text><circle cx="780" cy="264" r="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="308" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Observer 2</text><circle cx="300" cy="294" r="12" fill="#eef1f0" stroke="#4a5568" stroke-width="2"/><circle cx="350" cy="204" r="12" fill="#eef1f0" stroke="#4a5568" stroke-width="2"/><circle cx="730" cy="180" r="12" fill="#eef1f0" stroke="#4a5568" stroke-width="2"/><circle cx="530" cy="184" r="12" fill="#eef1f0" stroke="#4a5568" stroke-width="2"/><circle cx="570" cy="294" r="12" fill="#eef1f0" stroke="#4a5568" stroke-width="2"/><rect x="30" y="386" width="413" height="106" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="429.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CANE CONDITION</text><text x="50" y="455.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Appeared sober, carried a black cane</text><rect x="457" y="386" width="413" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="418" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DRUNK CONDITION</text><text x="477" y="444.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Smelled of alcohol, bottle in a brown</text><text x="477" y="467.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">paper bag</text><text x="450" y="526.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Weekdays 11 a.m. to 3 p.m.; about 4,450 passengers; 103 trials. Observers recorded race, sex and location of</text><text x="450" y="547.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">passengers, time to help and comments.</text>
</svg>