width="1.6"/><path d="M49,216 Q49,201 60,201 Q71,201 71,216 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="100" cy="190" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><path d="M89,216 Q89,201 100,201 Q111,201 111,216 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="140" cy="190" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><path d="M129,216 Q129,201 140,201 Q151,201 151,216 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="180" cy="190" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><path d="M169,216 Q169,201 180,201 Q191,201 191,216 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="220" cy="190" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><path d="M209,216 Q209,201 220,201 Q231,201 231,216 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="260" cy="190" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><path d="M249,216 Q249,201 260,201 Q271,201 271,216 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="300" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M289,216 Q289,201 300,201 Q311,201 311,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="340" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M329,216 Q329,201 340,201 Q351,201 351,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="380" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M369,216 Q369,201 380,201 Q391,201 391,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="420" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M409,216 Q409,201 420,201 Q431,201 431,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="460" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M449,216 Q449,201 460,201 Q471,201 471,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="500" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M489,216 Q489,201 500,201 Q511,201 511,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="540" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M529,216 Q529,201 540,201 Q551,201 551,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="580" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M569,216 Q569,201 580,201 Q591,201 591,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="620" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M609,216 Q609,201 620,201 Q631,201 631,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="660" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M649,216 Q649,201 660,201 Q671,201 671,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="700" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M689,216 Q689,201 700,201 Q711,201 711,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="740" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M729,216 Q729,201 740,201 Q751,201 751,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="780" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M769,216 Q769,201 780,201 Q791,201 791,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><circle cx="820" cy="190" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><path d="M809,216 Q809,201 820,201 Q831,201 831,216 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><rect x="40" y="240" width="16" height="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.6"/><text x="64" y="254" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stopped between 300 and 450 V</text><rect x="360" y="240" width="16" height="16" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><text x="384" y="254" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">went to the maximum 450 V</text><text x="224" y="308" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Reached 300 V</text><rect x="240" y="282" width="460" height="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="710" y="309" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">40 of 40 (all)</text><text x="224" y="362" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Reached 450 V</text><rect x="240" y="336" width="299" height="40" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="549" y="363" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">26 of 40 (65%)</text><text x="224" y="416" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Predicted by students</text><rect x="240" y="390" width="4.6" height="40" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><text x="254.6" y="417" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">around 1%</text><line x1="240" y1="274" x2="240" y2="438" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="452" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="486.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ordinary people obey a legitimate authority to the point of apparently harming someone: the <tspan font-weight="700" fill="#1e2a44">situation</tspan> is</text><text x="50" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more powerful than predicted from disposition alone.</text><rect x="30" y="583" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="615" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="641.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Replicable; full picture</text><text x="50" y="669.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Standardised prods and scripted responses;</text><text x="50" y="690.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quantitative voltage plus qualitative tension and</text><text x="50" y="711.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interviews.</text><rect x="457" y="583" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="615" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="641.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sample; believability</text><text x="477" y="669.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">American men only; some may have doubted the</text><text x="477" y="690.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shocks were real.</text><rect x="30" y="750" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="782" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ETHICS</text><text x="50" y="808.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Deception, distress, withdrawal</text><text x="50" y="836.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sweating, trembling, three seizures; prods made</text><text x="50" y="857.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">withdrawal difficult.</text><rect x="457" y="750" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="782" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DEFENCE</text><text x="477" y="808.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Debrief and follow-up</text><text x="477" y="836.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reunion with the unharmed learner; most said</text><text x="477" y="857.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">they were glad to have taken part.</text>
</svg>