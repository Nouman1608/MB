<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 895" width="900" height="895" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="895" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Piliavin et al. (1969): results and explanation</text>

<text x="30" y="116" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">SPONTANEOUS HELP: TRIALS OUT OF THOSE RUN</text><text x="174" y="162" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Cane</text><rect x="190" y="134" width="560" height="42" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="190" y="134" width="534.1538461538462" height="42" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="762" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">62 of 65</text><text x="174" y="220" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Drunk</text><rect x="190" y="192" width="560" height="42" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="190" y="192" width="280" height="42" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="762" y="220" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">19 of 38</text><text x="190" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Each bar is the full number of trials for that condition</text><rect x="39.896000000000015" y="288" width="221.792" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="150.79200000000003" y="308.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">cane victim helped faster</text><rect x="271.688" y="288" width="242.656" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="393.01599999999996" y="308.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">most first helpers were men</text><rect x="524.344" y="288" width="335.76" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="692.224" y="308.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">slight same-race helping (mainly drunk)</text><rect x="319.728" y="328" width="260.544" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="450" y="348.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">larger groups did not help less</text><rect x="30" y="380" width="840" height="58" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="413.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">No <tspan font-weight="700" fill="#1e2a44">diffusion</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">responsibility</tspan> here: the victim was clearly visible and escape was impossible.</text><text x="450" y="476" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">AROUSAL: COST–REWARD MODEL</text><rect x="30" y="498" width="207.77777777777777" height="131" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="133.88888888888889" y="568.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">See an emergency</text><line x1="243.77777777777777" y1="563.5" x2="277.77777777777777" y2="563.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="283.77777777777777" y="498" width="207.77777777777777" height="131" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="387.66666666666663" y="556.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Unpleasant</text><text x="387.66666666666663" y="579.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">arousal</text><line x1="497.55555555555554" y1="563.5" x2="531.5555555555555" y2="563.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="537.5555555555555" y="498" width="332.4444444444444" height="131" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="703.7777777777777" y="532.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reduce it by the response that</text><text x="703.7777777777777" y="555.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">costs least</text><text x="703.7777777777777" y="583.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">help, leave, or decide help is not</text><text x="703.7777777777777" y="604.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">needed</text><rect x="30" y="651" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="684.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Helping a drunk costs more (disgust, possible harm) and not helping is less blameworthy.</text><rect x="30" y="731" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="763" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="789.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">High ecological validity</text><text x="50" y="817.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Passengers did not know they were studied: no</text><text x="50" y="838.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">demand characteristics.</text><rect x="457" y="731" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="763" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="789.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ethics and unequal conditions</text><text x="477" y="817.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No consent, withdrawal or debrief; fewer drunk</text><text x="477" y="838.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">trials, one black victim.</text>
</svg>