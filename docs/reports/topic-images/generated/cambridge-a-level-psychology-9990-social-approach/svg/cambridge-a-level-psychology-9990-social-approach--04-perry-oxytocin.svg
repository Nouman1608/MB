<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="900" height="950" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="950" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Perry et al. (2015): oxytocin and personal space</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Double-blind, placebo-controlled: oxytocin in one session, placebo in another</text>
<rect x="30" y="124" width="413" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPERIMENT 1</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Comfortable Interpersonal Distance Scale</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">(computerised)</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stand at the centre of a room; mark where an</text><text x="50" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">approaching figure becomes uncomfortable</text><rect x="457" y="124" width="413" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPERIMENT 2</text><text x="477" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pictures of rooms</text><text x="477" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Choose between rooms that place you at</text><text x="477" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">different distances from another person</text><rect x="30" y="301" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="335" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Preferred distance from others. Illustrative pattern, not real data</text><line x1="210" y1="571" x2="590" y2="571" stroke="#1e2a44" stroke-width="3"/><line x1="210" y1="571" x2="210" y2="381" stroke="#1e2a44" stroke-width="3"/><text x="188" y="476" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 188 476)">distance →</text><text x="290" y="599" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Placebo</text><text x="510" y="599" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Oxytocin</text><path d="M290,476 L510,531" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="290" cy="476" r="8" fill="#2e6b62"/><circle cx="510" cy="531" r="8" fill="#2e6b62"/><path d="M290,466 L510,406" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 8"/><circle cx="290" cy="466" r="8" fill="#b5602e"/><circle cx="510" cy="406" r="8" fill="#b5602e"/><text x="530" y="411" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Low empathy:</text><text x="530" y="433" font-size="17" font-weight="400" fill="#b5602e" text-anchor="start">further away</text><text x="530" y="525" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">High empathy:</text><text x="530" y="547" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start">closer</text><rect x="30" y="653" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="687.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="717.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Oxytocin does not make everyone more sociable: its effect depends on <tspan font-weight="700" fill="#1e2a44">empathy</tspan>, an interaction of</text><text x="50" y="739.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">person and situation.</text><rect x="30" y="786" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="818" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="844.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Controls and replication</text><text x="50" y="872.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Placebo and double-blind control expectations;</text><text x="50" y="893.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">two measures, same pattern.</text><rect x="457" y="786" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="818" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="844.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Imagined distances</text><text x="477" y="872.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May not match real behaviour or crowded</text><text x="477" y="893.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">everyday settings.</text>
</svg>