<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="482" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The social approach: two assumptions</text>

<rect x="30" y="100" width="413" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ASSUMPTION 1</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Social contexts, environments and</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">groups</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">influence behaviour, cognitions and emotions</text><rect x="457" y="100" width="413" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ASSUMPTION 2</text><text x="477" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The actual, implied or imagined</text><text x="477" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">presence of others</text><text x="477" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">influences behaviour, cognitions and emotions</text><text x="450" y="274" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">THREE KINDS OF PRESENCE IN THE CORE STUDIES</text><rect x="30" y="296" width="270.6666666666667" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="328" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">ACTUAL</text><text x="165.33333333333334" y="354.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Piliavin et al.</text><text x="165.33333333333334" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">other passengers really are</text><text x="165.33333333333334" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">there</text><rect x="314.6666666666667" y="296" width="270.6666666666667" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="328" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">PARTLY IMPLIED</text><text x="450" y="354.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Milgram</text><text x="450" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">experimenter actually present;</text><text x="450" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">learner next door, known only</text><text x="450" y="425.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">from sounds</text><rect x="599.3333333333334" y="296" width="270.6666666666667" height="154" rx="14" fill="#e3eaf3" stroke="#2b5a9a" stroke-width="2.5"/><text x="734.6666666666667" y="328" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="middle">IMAGINED</text><text x="734.6666666666667" y="354.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Perry et al.</text><text x="734.6666666666667" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">distance judged from figures</text><text x="734.6666666666667" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">on a screen or in pictures</text>
</svg>