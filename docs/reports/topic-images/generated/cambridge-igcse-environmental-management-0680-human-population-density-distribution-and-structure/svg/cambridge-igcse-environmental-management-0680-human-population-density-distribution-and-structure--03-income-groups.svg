<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">World Bank income groups</text>

<defs><linearGradient id="inc" x1="0" x2="1"><stop offset="0" stop-color="#f2e7b8"/><stop offset="1" stop-color="#2e6b62"/></linearGradient></defs><rect x="60" y="200" width="780" height="60" rx="10" fill="url(#inc)" stroke="#1e2a44" stroke-width="2.5"/><line x1="60" y1="290" x2="840" y2="290" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="320" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">income per person (gross national income per capita)</text><text x="157.5" y="180" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Low-income</text><text x="157.5" y="238" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">LICs</text><line x1="255" y1="192" x2="255" y2="268" stroke="#1e2a44" stroke-width="3"/><text x="450" y="180" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Middle-income</text><line x1="645" y1="192" x2="645" y2="268" stroke="#1e2a44" stroke-width="3"/><text x="742.5" y="180" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">High-income</text><text x="742.5" y="238" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">HICs</text><line x1="450" y1="206" x2="450" y2="254" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><text x="352.5" y="254" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">lower-middle</text><text x="547.5" y="254" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">upper-middle</text><rect x="30" y="350" width="410" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="389.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Limits change yearly</text><text x="48" y="420.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the income limits are updated every year,</text><text x="48" y="441.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so you do not need to learn the figures</text><rect x="460" y="350" width="410" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="379.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An average hides gaps</text><text x="478" y="410.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it classifies national economies, so it</text><text x="478" y="431.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hides differences between rich and poor</text><text x="478" y="452.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people within a country</text><text x="450" y="500" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Write “low-income countries”, not “poor countries”.</text>
</svg>