<rect width="900" height="837" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a desert landscape</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A mountain front: one sediment cascade from source to sink</text>
<rect x="30" y="124" width="840" height="330" rx="14" fill="#eef3f7" stroke="#c9d6d4" stroke-width="2.5"/><path d="M32,204 L120,184 L200,214 L260,314 L330,354 L470,370 L560,374 L700,374 L760,334 L790,274 L820,344 L868,368 L868,452 L32,452 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M172,198 L186,222 L200,206" fill="#eef3f7" stroke="#2b5a9a" stroke-width="3.5"/><path d="M250,318 Q330,344 420,368 L470,370 L300,358 Z" fill="#efdfa8" stroke="#8a6d0d" stroke-width="2"/><path d="M560,374 L700,374" stroke="#ffffff" stroke-width="7"/><path d="M760,334 L790,274 L820,344" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><text x="300" y="164" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Mountains: wadis</text><text x="300" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">cut by flash floods</text><path d="M235,170 L190,204" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="470" y="304" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Alluvial fans</text><text x="470" y="322" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">merge into a bahada</text><text x="630" y="344" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Playa</text><text x="630" y="362" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">fine sediment</text><text x="790" y="244" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Inselberg</text><line x1="180" y1="228" x2="290" y2="324" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="440" y1="392" x2="560" y2="392" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="450" y="420" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">sediment cascade: source → sink</text><text x="855" y="444" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end" font-style="italic">Schematic, not to scale</text><clipPath id="tc470"><rect x="30" y="470" width="840" height="210" rx="14"/></clipPath><g clip-path="url(#tc470)"><rect x="30" y="470" width="221.05263157894734" height="48" fill="#b5d3cf"/><text x="44" y="497.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Landscape</text><rect x="251.05263157894734" y="470" width="265.2631578947368" height="48" fill="#b5d3cf"/><text x="265.05263157894734" y="497.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dominant processes</text><rect x="516.3157894736842" y="470" width="353.6842105263158" height="48" fill="#b5d3cf"/><text x="530.3157894736842" y="497.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Landforms</text><rect x="30" y="518" width="221.05263157894734" height="47" fill="#dce9e7"/><text x="44" y="544.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sand sea (erg)</text><rect x="251.05263157894734" y="518" width="265.2631578947368" height="47" fill="#ffffff"/><text x="265.05263157894734" y="544.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wind transport and deposition</text><rect x="516.3157894736842" y="518" width="353.6842105263158" height="47" fill="#ffffff"/><text x="530.3157894736842" y="544.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Barchans, seifs, large dune ridges</text><line x1="30" y1="565" x2="870" y2="565" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="565" width="221.05263157894734" height="47" fill="#dce9e7"/><text x="44" y="591.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Stony desert (reg)</text><rect x="251.05263157894734" y="565" width="265.2631578947368" height="47" fill="#f8faf9"/><text x="265.05263157894734" y="591.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deflation and sheet wash</text><rect x="516.3157894736842" y="565" width="353.6842105263158" height="47" fill="#f8faf9"/><text x="530.3157894736842" y="591.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Desert pavements, ventifacts</text><line x1="30" y1="612" x2="870" y2="612" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="612" width="221.05263157894734" height="68" fill="#dce9e7"/><text x="44" y="638.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rocky desert (hamada)</text><text x="44" y="659.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">and mountain front</text><rect x="251.05263157894734" y="612" width="265.2631578947368" height="68" fill="#ffffff"/><text x="265.05263157894734" y="638.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Weathering and episodic water</text><rect x="516.3157894736842" y="612" width="353.6842105263158" height="68" fill="#ffffff"/><text x="530.3157894736842" y="638.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wadis, alluvial fans, bahadas, pediments,</text><text x="530.3157894736842" y="659.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">playas, inselbergs</text></g><line x1="251.05263157894734" y1="470" x2="251.05263157894734" y2="680" stroke="#c9d6d4" stroke-width="1.5"/><line x1="516.3157894736842" y1="470" x2="516.3157894736842" y2="680" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="470" width="840" height="210" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="696" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="730.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Inherited landforms</text><text x="50" y="759.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many wadis are larger than present-day floods could cut, suggesting they partly formed in wetter</text><text x="50" y="780.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">periods.</text>
</svg>