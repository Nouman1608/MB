<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A dune field as an open system</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked sediment budget (invented figures)</text>
<rect x="330" y="164" width="240" height="170" rx="14" fill="#efdfa8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="237.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">STORE</text><text x="450" y="266.9" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">Dune field</text><text x="40" y="164" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">INPUT: 40,000 t a year</text><line x1="40" y1="214" x2="300" y2="214" stroke="#2e6b62" stroke-width="64" stroke-linecap="butt"/><path d="M300,172 L324,214 L300,256 Z" fill="#2e6b62"/><text x="40" y="269" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">blown in from a dry riverbed upwind</text><text x="40" y="304" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">INPUT: 5,000 t a year</text><line x1="40" y1="320" x2="300" y2="320" stroke="#2e6b62" stroke-width="8" stroke-linecap="butt"/><path d="M300,306 L324,320 L300,334 Z" fill="#2e6b62"/><text x="40" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">weathering of nearby rock</text><text x="860" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">OUTPUT: 52,000 t a year</text><line x1="576" y1="249" x2="836" y2="249" stroke="#b5602e" stroke-width="83.2" stroke-linecap="butt"/><path d="M836,197.4 L860,249 L836,300.6 Z" fill="#b5602e"/><text x="860" y="320" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">carried out downwind</text><text x="450" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Arrow widths to scale</text><rect x="30" y="410" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="444.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Budget = inputs - outputs = 45,000 - 52,000 = -7,000 tonnes a year</text><text x="50" y="473.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A negative budget: the store is shrinking, so dunes lower and migrate away. If irrigation upstream cut the</text><text x="50" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">river's sediment supply, the deficit would grow.</text><text x="30" y="549" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">ENERGY INPUTS</text><rect x="30" y="567" width="268" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="601.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Insolation</text><text x="50" y="629" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Intense under clear skies and a</text><text x="50" y="649" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">high sun; drives weathering and</text><text x="50" y="669" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">local convection winds.</text><rect x="316" y="567" width="268" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="611.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wind</text><text x="336" y="639" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Kinetic energy that moves sand</text><text x="336" y="659" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and dust.</text><rect x="602" y="567" width="268" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="611.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Runoff</text><text x="622" y="639" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Short bursts of very high</text><text x="622" y="659" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">energy in rare storms.</text>
</svg>