<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 864" width="900" height="864" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="864" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a barchan dune forms</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Wind from left to right</text>
<rect x="30" y="124" width="840" height="320" rx="14" fill="#efdfa8" stroke="#8a6d0d" stroke-width="2.5"/><path d="M370,189 C250,174 180,234 180,284 C180,334 250,394 370,379 C290,354 270,314 270,284 C270,254 290,214 370,189 Z" fill="#e6cf86" stroke="#1e2a44" stroke-width="3"/><text x="220" y="290" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">windward</text><text x="390" y="290" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">slip face</text><line x1="386" y1="284" x2="276" y2="284" stroke="#8a6d0d" stroke-width="2.5"/><text x="380" y="184" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">horn</text><text x="380" y="394" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">horn</text><line x1="60" y1="164" x2="160" y2="164" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="60" y="152" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">wind</text><text x="260" y="430" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">PLAN VIEW</text><path d="M480,344 L710,264 L760,344 Z" fill="#e6cf86" stroke="#1e2a44" stroke-width="3"/><line x1="460" y1="344" x2="810" y2="344" stroke="#1e2a44" stroke-width="2.5"/><path d="M520,318 q20,-26 40,-14 q20,-26 40,-14 q20,-26 40,-14" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="540" y="224" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">saltation up the</text><text x="540" y="242" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">gentle windward slope</text><line x1="720" y1="278" x2="750" y2="330" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="770" y="284" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">avalanche:</text><text x="770" y="302" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">slip face</text><text x="770" y="320" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">30-34°</text><line x1="540" y1="384" x2="740" y2="384" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="640" y="410" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">whole dune migrates downwind</text><text x="620" y="430" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">PROFILE</text><text x="855" y="150" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Schematic, not to scale</text><line x1="60" y1="480" x2="60" y2="812" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="460" width="766" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="485.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sand accumulates</text><text x="116" y="512" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Around an obstacle, or where supply is limited on a hard surface.</text><circle cx="60" cy="494" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="502.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="536" width="766" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="561.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Saltation up the windward slope</text><text x="116" y="588" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Wind pushes sand up the gentle slope.</text><circle cx="60" cy="570" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="578.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="612" width="766" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="637.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Avalanching down the slip face</text><text x="116" y="664" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Settles at about 30 to 34 degrees.</text><circle cx="60" cy="646" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="654.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="688" width="766" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="713.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Horns form</text><text x="116" y="740" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Lower edges have less sand, move faster than the centre and are drawn out downwind.</text><circle cx="60" cy="722" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="730.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="764" width="766" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="789.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Migration in dynamic equilibrium</text><text x="116" y="816" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The dune moves downwind while keeping its shape.</text><circle cx="60" cy="798" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="806.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>