<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Desertification: causes to futures</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Follow the specification's sequence in long answers</text>
<rect x="30" y="124" width="187.5" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">10,000 YEARS</text><text x="42" y="173.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Changing extent</text><text x="42" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Early-mid Holocene</text><text x="42" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sahara wetter:</text><text x="42" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">grassland, lakes</text><line x1="223.5" y1="200" x2="241.5" y2="200" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247.5" y="124" width="187.5" height="152" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="259.5" y="148" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CAUSES</text><text x="259.5" y="173.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Climate + people</text><text x="259.5" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Drought; overgrazing,</text><text x="259.5" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">over-cultivation,</text><text x="259.5" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fuelwood, salinisation</text><line x1="441" y1="200" x2="459" y2="200" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="124" width="187.5" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AT RISK</text><text x="477" y="173.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Semi-arid margins</text><text x="477" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">E.g. the Sahel: variable</text><text x="477" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rain, high population</text><text x="477" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pressure</text><line x1="658.5" y1="200" x2="676.5" y2="200" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="682.5" y="124" width="187.5" height="152" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="694.5" y="148" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">IMPACTS</text><text x="694.5" y="173.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Land and people</text><text x="694.5" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gullying, dune</text><text x="694.5" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">advance, crusted</text><text x="694.5" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">soils; food insecurity,</text><text x="694.5" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">migration</text><rect x="30" y="292" width="840" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="326.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feedback</text><text x="50" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Drought reduces plant cover, and grazing pressure prevents recovery: the causes reinforce each other.</text><text x="30" y="410" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">ALTERNATIVE FUTURES (WITH PREDICTED CLIMATE CHANGE)</text><rect x="30" y="428" width="268" height="150" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="493.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Continued degradation</text><text x="50" y="522.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">And out-migration.</text><rect x="316" y="428" width="268" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336" y="483.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Adaptation</text><text x="336" y="511.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Drought-resistant crops;</text><text x="336" y="532.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">water harvesting.</text><rect x="602" y="428" width="268" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="462.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Restoration</text><text x="622" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parts of Niger:</text><text x="622" y="511.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">farmer-managed natural</text><text x="622" y="532.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">regeneration has re-greened</text><text x="622" y="553.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">large areas.</text>
</svg>