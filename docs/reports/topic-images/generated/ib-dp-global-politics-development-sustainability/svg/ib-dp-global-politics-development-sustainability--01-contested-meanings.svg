<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four contested meanings</text>

<rect x="30" y="115" width="410" height="175" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="153.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Development</text><text x="48" y="180.36" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">as growth: GDP or GNI per person</text><text x="48" y="200.82000000000002" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">as human development: Sen’s capabilities, real</text><text x="48" y="221.28000000000003" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">freedoms</text><text x="48" y="241.74" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">as political and institutional change:</text><text x="48" y="262.20000000000005" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">accountable government, courts, rights</text><rect x="460" y="115" width="410" height="175" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="478" y="153.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Sustainability</text><text x="478" y="180.36" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">environmental, social, economic dimensions</text><text x="478" y="200.82000000000002" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Brundtland (1987): meet present needs without</text><text x="478" y="221.28000000000003" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">reducing future generations’ ability to meet</text><text x="478" y="241.74" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">theirs</text><rect x="30" y="305" width="410" height="175" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="343.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Poverty</text><text x="48" y="370.35999999999996" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">lack of resources: absolute poverty below a</text><text x="48" y="390.81999999999994" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">fixed minimum</text><text x="48" y="411.28" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">lack of opportunities: relative poverty, e.g. EU</text><text x="48" y="431.73999999999995" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">line at 60% of median income</text><rect x="460" y="305" width="410" height="175" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="343.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Inequality</text><text x="478" y="370.35999999999996" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">economic, political and social</text><text x="478" y="390.81999999999994" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">linked to power asymmetries: less wealth, less</text><text x="478" y="411.28" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">say over the rules</text><rect x="30" y="505" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="536.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Define each term in more than one way and explain why actors disagree.</text>
</svg>