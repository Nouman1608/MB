<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring development: what each index misses</text>

<rect x="30" y="110" width="840" height="51.760000000000005" rx="12" fill="#2e6b62"/><text x="42" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Measure</text><text x="292" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Combines</text><text x="622" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Main limitation</text><rect x="30" y="157.76" width="840" height="62.24000000000001" fill="#ffffff"/><text x="42" y="183.35999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Human Development Index</text><text x="292" y="183.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">health, education, income</text><text x="622" y="183.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ignores inequality,</text><text x="622" y="204.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">environment, freedom</text><rect x="30" y="220" width="840" height="62.24000000000001" fill="#f7f9f9"/><text x="42" y="245.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Multidimensional Poverty</text><text x="42" y="266.71999999999997" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Index</text><text x="292" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">10 indicators, household by household</text><text x="292" y="266.71999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(replaced HPI, 2010)</text><text x="622" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weights are a choice; income</text><text x="622" y="266.71999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">left out</text><line x1="30" y1="220" x2="870" y2="220" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="282.24" width="840" height="62.24000000000001" fill="#ffffff"/><text x="42" y="307.84000000000003" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Happy Planet Index</text><text x="292" y="307.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wellbeing and life expectancy against</text><text x="292" y="328.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ecological footprint</text><text x="622" y="307.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wellbeing self-reported</text><line x1="30" y1="282.24" x2="870" y2="282.24" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="344.48" width="840" height="62.24000000000001" fill="#f7f9f9"/><text x="42" y="370.08000000000004" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Gini index</text><text x="292" y="370.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">spread of income: 0 = perfect equality</text><text x="622" y="370.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">same Gini can hide different</text><text x="622" y="391.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shapes</text><line x1="30" y1="344.48" x2="870" y2="344.48" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="406.72" width="840" height="62.24000000000001" fill="#ffffff"/><text x="42" y="432.32000000000005" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Corruption and trust indices</text><text x="292" y="432.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">perceived corruption; trust in</text><text x="292" y="453.44000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">institutions</text><text x="622" y="432.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">based on perceptions</text><line x1="30" y1="406.72" x2="870" y2="406.72" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="468.96000000000004" width="840" height="62.24000000000001" fill="#f7f9f9"/><text x="42" y="494.56000000000006" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">ESI, SSI, SGI</text><text x="292" y="494.56000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">environmental, social, governance</text><text x="292" y="515.6800000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">performance</text><text x="622" y="494.56000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">many indicators; weights</text><text x="622" y="515.6800000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disputed</text><line x1="30" y1="468.96000000000004" x2="870" y2="468.96000000000004" stroke="#c9d6d4" stroke-width="1.5"/><line x1="280" y1="157.76" x2="280" y2="531.2" stroke="#c9d6d4" stroke-width="1.5"/><line x1="610" y1="157.76" x2="610" y2="531.2" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="110" width="840" height="421.20000000000005" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/>
