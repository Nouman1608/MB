<rect width="900" height="541" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pathways to development</text>

<rect x="30" y="110" width="840" height="51.760000000000005" rx="12" fill="#2e6b62"/><text x="42" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Pathway</text><text x="262" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Core idea</text><text x="592" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Criticism</text><rect x="30" y="157.76" width="840" height="62.24000000000001" fill="#ffffff"/><text x="42" y="183.35999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Modernization (Rostow)</text><text x="262" y="183.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">poorer states follow richer ones:</text><text x="262" y="204.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">investment, industry, mass consumption</text><text x="592" y="183.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assumes one route; ignores</text><text x="592" y="204.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">external constraints</text><rect x="30" y="220" width="840" height="62.24000000000001" fill="#f7f9f9"/><text x="42" y="245.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Market-led / neoliberal</text><text x="262" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">open trade, attract FDI, shrink the</text><text x="262" y="266.71999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">state</text><text x="592" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">growth can be unequal; social</text><text x="592" y="266.71999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">spending cut</text><line x1="30" y1="220" x2="870" y2="220" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="282.24" width="840" height="62.24000000000001" fill="#ffffff"/><text x="42" y="307.84000000000003" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">State-led</text><text x="262" y="307.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">government directs investment,</text><text x="262" y="328.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protects new industries</text><text x="592" y="307.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">risk of corruption and vested</text><text x="592" y="328.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interests</text><line x1="30" y1="282.24" x2="870" y2="282.24" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="344.48" width="840" height="62.24000000000001" fill="#f7f9f9"/><text x="42" y="370.08000000000004" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Dependency /</text><text x="42" y="391.20000000000005" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">world-systems</text><text x="262" y="370.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trade keeps the periphery supplying</text><text x="262" y="391.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cheap raw materials to the core</text><text x="592" y="370.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hard to explain states that</text><text x="592" y="391.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">climbed</text><line x1="30" y1="344.48" x2="870" y2="344.48" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="406.72" width="840" height="41.120000000000005" fill="#ffffff"/><text x="42" y="432.32000000000005" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Human development</text><text x="262" y="432.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">invest in people’s capabilities first</text><text x="592" y="432.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">slower to show in growth figures</text><line x1="30" y1="406.72" x2="870" y2="406.72" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="447.84000000000003" width="840" height="62.24000000000001" fill="#f7f9f9"/><text x="42" y="473.44000000000005" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Community-led and</text><text x="42" y="494.56000000000006" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">sustainable</text><text x="262" y="473.44000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">local control, cooperatives, green</text><text x="262" y="494.56000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">technology</text><text x="592" y="473.44000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hard to scale up</text><line x1="30" y1="447.84000000000003" x2="870" y2="447.84000000000003" stroke="#c9d6d4" stroke-width="1.5"/><line x1="250" y1="157.76" x2="250" y2="510.08000000000004" stroke="#c9d6d4" stroke-width="1.5"/><line x1="580" y1="157.76" x2="580" y2="510.08000000000004" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="110" width="840" height="400.08000000000004" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/>
</svg>