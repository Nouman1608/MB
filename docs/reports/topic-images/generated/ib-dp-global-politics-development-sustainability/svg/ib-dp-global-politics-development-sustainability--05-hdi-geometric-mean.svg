<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the HDI uses a geometric mean</text>

<rect x="30" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Country A (fictional)</text><rect x="80" y="211" width="80" height="189" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="120" y="203" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">0.90</text><text x="120" y="424" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">health</text><rect x="190" y="295" width="80" height="105" rx="4" fill="#efcdb8" stroke="#1e2a44" stroke-width="2"/><text x="230" y="287" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">0.50</text><text x="230" y="424" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">education</text><rect x="300" y="221.5" width="80" height="178.5" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="340" y="213.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">0.85</text><text x="340" y="424" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">income</text><line x1="60" y1="400" x2="410" y2="400" stroke="#1e2a44" stroke-width="2"/><text x="235" y="462" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">arithmetic mean = 0.75</text><text x="235" y="498" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">HDI (geometric mean) = 0.726</text><rect x="460" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Country B (fictional)</text><rect x="510" y="242.5" width="80" height="157.5" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="550" y="234.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">0.75</text><text x="550" y="424" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">health</text><rect x="620" y="242.5" width="80" height="157.5" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="660" y="234.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">0.75</text><text x="660" y="424" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">education</text><rect x="730" y="242.5" width="80" height="157.5" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="770" y="234.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">0.75</text><text x="770" y="424" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">income</text><line x1="490" y1="400" x2="840" y2="400" stroke="#1e2a44" stroke-width="2"/><text x="665" y="462" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">arithmetic mean = 0.75</text><text x="665" y="498" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">HDI (geometric mean) = 0.75</text><rect x="30" y="550" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="581.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A weak score in one dimension pulls the HDI down: high income cannot hide poor schooling.</text>
</svg>