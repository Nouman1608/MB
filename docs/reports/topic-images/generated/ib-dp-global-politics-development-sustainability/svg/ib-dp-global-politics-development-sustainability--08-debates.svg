<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Debating development and sustainability</text>

<rect x="30" y="115" width="410" height="140" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Globalization: for</text><text x="48" y="179.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">export-led growth; fall in extreme poverty in</text><text x="48" y="200.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">East Asia</text><rect x="460" y="115" width="410" height="140" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="478" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Globalization: against</text><text x="478" y="179.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rising inequality within states; “race to the</text><text x="478" y="200.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bottom” in standards; loss of policy space</text><text x="478" y="221.36" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">under WTO rules and investment treaties</text><rect x="30" y="275" width="840" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="318.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">SDGs (2015–2030): 17 goals after the 8 MDGs (2000–2015)</text><text x="450" y="345.67" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">shared framework for rich and poor alike — but critics say they assume endless growth, some targets</text><text x="450" y="366.79" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">clash, and nothing binds states</text><text x="30" y="435" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Alternative views</text><rect x="30" y="450" width="270" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="486.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">De-growth</text><text x="48" y="511.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rich states shrink material</text><text x="48" y="531.65" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">production and consumption; aim</text><text x="48" y="551.45" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for wellbeing</text><rect x="315" y="450" width="270" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="333" y="486.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Regenerative</text><text x="333" y="511.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">restore ecosystems and</text><text x="333" y="531.65" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">communities, not just slow</text><text x="333" y="551.45" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">damage</text><rect x="600" y="450" width="270" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="618" y="486.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Related ideas</text><text x="618" y="511.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Raworth’s doughnut; buen vivir</text><text x="618" y="531.65" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(Ecuador, 2008); Bhutan’s Gross</text><text x="618" y="551.45" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">National Happiness</text>
</svg>