<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 708" width="900" height="708" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="708" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who shapes development?</text>

<line x1="450" y1="300" x2="160" y2="185" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="300" x2="740" y2="185" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="300" x2="160" y2="515" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="300" x2="740" y2="515" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="300" x2="450" y2="527.5" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="115" width="260" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="160" y="169.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">States and governments</text><text x="160" y="195.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tax, welfare, land policy; e.g.</text><text x="160" y="215.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Bolsa Família (from 2003)</text><rect x="610" y="115" width="260" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="740" y="159.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">IGOs and IFIs</text><text x="740" y="185.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lend, set conditions and trade</text><text x="740" y="205.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rules; World Bank, IMF, WTO;</text><text x="740" y="225" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">SDGs</text><rect x="30" y="445" width="260" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="160" y="499.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Civil society</text><text x="160" y="525.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mobilise, deliver, hold to</text><text x="160" y="545.1999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">account; Green Belt Movement</text><rect x="610" y="445" width="260" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="740" y="499.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">TNCs and MNCs</text><text x="740" y="525.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">investment, jobs, supply</text><text x="740" y="545.1999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">chains; Rana Plaza (2013)</text><rect x="320" y="470" width="260" height="115" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="450" y="512.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Marginalised groups</text><text x="450" y="537.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">claim land and a say; often</text><text x="450" y="557.6999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">excluded</text><circle cx="450" cy="300" r="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="282.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Development</text><text x="450" y="306.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">and</text><text x="450" y="330.06" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">sustainability</text><rect x="30" y="605" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="635.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">IMF and World Bank voting shares follow contributions, so many borrowers question the fairness of</text><text x="450" y="656.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">the rules.</text>
</svg>