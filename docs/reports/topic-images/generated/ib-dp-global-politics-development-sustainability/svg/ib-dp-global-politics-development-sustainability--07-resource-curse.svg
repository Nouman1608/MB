<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Factors interact: the resource curse</text>

<rect x="30" y="120" width="253.33333333333334" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="156.66666666666669" y="161" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Oil or mineral</text><text x="156.66666666666669" y="187.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">wealth</text><text x="156.66666666666669" y="214.52" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">environmental and economic</text><text x="156.66666666666669" y="235.64000000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">factor</text><line x1="286.33333333333337" y1="190" x2="318.33333333333337" y2="190" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="120" width="253.33333333333334" height="140" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="450.00000000000006" y="171.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feeds corruption and</text><text x="450.00000000000006" y="197.9" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">conflict</text><text x="450.00000000000006" y="225.02" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">political factor</text><line x1="579.6666666666667" y1="190" x2="611.6666666666667" y2="190" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="120" width="253.33333333333334" height="140" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="743.3333333333334" y="174" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Slower development</text><text x="743.3333333333334" y="201.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">than some resource-poor</text><text x="743.3333333333334" y="222.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">states</text><text x="30" y="310" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Five sets of factors</text><rect x="30" y="325" width="160" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="110" y="355.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Political</text><text x="110" y="380.28999999999996" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">stability,</text><text x="110" y="399.42999999999995" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">accountability,</text><text x="110" y="418.56999999999994" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">conflict</text><rect x="200" y="325" width="160" height="110" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="280" y="364.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic</text><text x="280" y="389.78999999999996" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">debt, trade, FDI,</text><text x="280" y="408.92999999999995" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">aid</text><rect x="370" y="325" width="160" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="364.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Social</text><text x="450" y="389.78999999999996" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">culture, gender,</text><text x="450" y="408.92999999999995" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">migration</text><rect x="540" y="325" width="160" height="110" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="620" y="364.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Institutional</text><text x="620" y="389.78999999999996" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">UN, IMF, World</text><text x="620" y="408.92999999999995" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">Bank, WTO</text><rect x="710" y="325" width="160" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="790" y="364.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Environmental</text><text x="790" y="389.78999999999996" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">geography,</text><text x="790" y="408.92999999999995" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">resources, climate</text>
