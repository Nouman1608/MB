<rect width="900" height="1155" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two strands, six components</text>

<rect x="30" y="112" width="412" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="236" y="144" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">STRUCTURE</text><text x="236" y="172" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">what is matter built from and how is it arranged?</text><rect x="458" y="112" width="412" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="144" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">REACTIVITY</text><text x="664" y="172" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">why and how does matter change?</text><rect x="30" y="206" width="412" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="243" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Structure 1</text><text x="46" y="265" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Models of the particulate nature of</text><text x="46" y="286" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">matter</text><rect x="46" y="302" width="285.20000000000005" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="324.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">1.1 Particulate nature of matter</text><rect x="46" y="346" width="188.00000000000003" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="368.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">1.2 The nuclear atom</text><rect x="46" y="390" width="244.70000000000005" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="412.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">1.3 Electron configurations</text><rect x="46" y="434" width="350.00000000000006" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="456.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">1.4 Counting particles by mass: the mole</text><rect x="46" y="478" width="147.50000000000003" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="500.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">1.5 Ideal gases</text><rect x="458" y="206" width="412" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="243" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reactivity 1</text><text x="474" y="265" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">What drives chemical reactions?</text><rect x="474" y="281" width="260.90000000000003" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="487" y="303.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">1.1 Measuring enthalpy change</text><rect x="474" y="325" width="269.00000000000006" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="487" y="347.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">1.2 Energy cycles in reactions</text><rect x="474" y="369" width="196.10000000000002" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="487" y="391.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">1.3 Energy from fuels</text><rect x="474" y="413" width="283.08000000000004" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="483" y="419" width="32.379999999999995" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="499.19" y="435" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">HL</text><text x="525.38" y="435.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">1.4 Entropy and spontaneity</text><rect x="30" y="542" width="412" height="255" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="579" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Structure 2</text><text x="46" y="601" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Models of bonding and structure</text><rect x="46" y="617" width="179.90000000000003" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="639.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">2.1 The ionic model</text><rect x="46" y="661" width="204.20000000000005" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="683.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">2.2 The covalent model</text><rect x="46" y="705" width="204.20000000000005" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="727.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">2.3 The metallic model</text><rect x="46" y="749" width="252.80000000000004" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="771.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">2.4 From models to materials</text><rect x="458" y="542" width="412" height="255" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="579" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reactivity 2</text><text x="474" y="601" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">How much, how fast and how far?</text><rect x="474" y="617" width="269.00000000000006" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="487" y="639.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">2.1 How much? Amount of change</text><rect x="474" y="661" width="252.80000000000004" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="487" y="683.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">2.2 How fast? Rate of change</text><rect x="474" y="705" width="260.90000000000003" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="487" y="727.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">2.3 How far? Extent of change</text><rect x="30" y="813" width="412" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="850" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Structure 3</text><text x="46" y="872" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Classification of matter</text><rect x="46" y="888" width="204.20000000000005" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="910.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">3.1 The periodic table</text><rect x="46" y="932" width="196.10000000000002" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="59" y="954.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">3.2 Functional groups</text><rect x="458" y="813" width="412" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="850" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reactivity 3</text><text x="474" y="872" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">What are the mechanisms of chemical</text><text x="474" y="893" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">change?</text><rect x="474" y="909" width="277.1" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="487" y="931.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">3.1 Proton transfer (acid-base)</text><rect x="474" y="953" width="307.47" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><rect x="483" y="959" width="40.57" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="503.285" y="975" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">+HL</text><text x="533.57" y="975.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">3.2 Electron transfer (redox)</text><rect x="474" y="997" width="277.1" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><text x="487" y="1019.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">3.3 Electron sharing (radicals)</text><rect x="474" y="1041" width="275.07000000000005" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.8"/><rect x="483" y="1047" width="40.57" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="503.285" y="1063" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">+HL</text><text x="533.57" y="1063.4" font-size="15" font-weight="500" fill="#1e2a44" text-anchor="start">3.4 Electron-pair sharing</text><rect x="40" y="1108" width="70" height="26" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="1.8" stroke-dasharray="6 4"/><rect x="46" y="1110" width="32.379999999999995" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="62.19" y="1126" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">HL</text><text x="122" y="1126" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">HL only</text><rect x="225.51999999999998" y="1110" width="40.57" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="245.80499999999998" y="1126" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">+HL</text><text x="276.09" y="1126" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">additional higher level content inside a sub-topic</text>
</svg>