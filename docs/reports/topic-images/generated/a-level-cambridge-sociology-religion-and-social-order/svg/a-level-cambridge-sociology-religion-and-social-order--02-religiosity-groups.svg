<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="900" height="506" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="506" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who is more religious, and why?</text>

<rect x="30" y="104" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Women often report higher belief and</text><text x="46" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">attendance</text><text x="46" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Socialisation into caring roles, greater</text><text x="46" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">involvement in child-rearing, the life course.</text><rect x="458" y="104" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Age</text><text x="474" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Older people often more religious in the</text><text x="474" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">West</text><text x="474" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ageing:</tspan> approaching death, or <tspan font-weight="700">generation:</tspan></text><text x="474" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">socialised in more religious times.</text><rect x="30" y="298" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,348 L31.25,312.25 Q31.25,299.25 44.25,299.25 L427.75,299.25 Q440.75,299.25 440.75,312.25 L440.75,348 Z" fill="#f2e7b8"/><line x1="31.25" y1="348" x2="440.75" y2="348" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="329" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnicity</text><text x="46" y="381.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Minority and migrant groups often highly</text><text x="46" y="402.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">religious</text><text x="46" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Community support, <tspan font-weight="700">cultural defence</tspan> (Bruce,</text><text x="46" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1996) or easing <tspan font-weight="700">cultural transition</tspan>.</text><rect x="458" y="298" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,348 L459.25,312.25 Q459.25,299.25 472.25,299.25 L855.75,299.25 Q868.75,299.25 868.75,312.25 L868.75,348 Z" fill="#f2e7b8"/><line x1="459.25" y1="348" x2="868.75" y2="348" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="329" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><text x="474" y="381.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Different groups, different religions</text><text x="474" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Weber: the disadvantaged drawn to a <tspan font-weight="700">theodicy of</tspan></text><text x="474" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">disprivilege</tspan>; the middle class to</text><text x="474" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">world-affirming movements.</text>
</svg>