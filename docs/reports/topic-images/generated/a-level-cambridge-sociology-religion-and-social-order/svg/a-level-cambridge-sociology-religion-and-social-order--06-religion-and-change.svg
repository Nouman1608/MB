<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Religion as a force for change</text>

<rect x="30" y="104" width="269.3333333333333" height="329" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,176 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,176 Z" fill="#b5d3cf"/><line x1="31.25" y1="176" x2="298.0833333333333" y2="176" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="145.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Liberation theology</text><text x="46" y="209.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Latin America, from the</text><text x="46" y="230.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">1960s</text><circle cx="51" cy="253.92" r="4.5" fill="#2e6b62"/><text x="64" y="259.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Catholic clergy committed</text><text x="64" y="280.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to the poor</text><circle cx="51" cy="303.92" r="4.5" fill="#2e6b62"/><text x="64" y="309.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gutiérrez (1971)</text><circle cx="51" cy="332.92" r="4.5" fill="#2e6b62"/><text x="64" y="338.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Archbishop Romero</text><text x="64" y="359.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assassinated (1980)</text><circle cx="51" cy="382.92" r="4.5" fill="#2e6b62"/><text x="64" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Religion opposing an unjust</text><text x="64" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">order</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="329" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,176 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,176 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="176" x2="583.4166666666666" y2="176" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="133.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evangelicals in US</text><text x="450" y="158.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">politics</text><text x="331.3333333333333" y="209.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Moral Majority, 1979</text><circle cx="336.3333333333333" cy="232.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="238.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Founded by Jerry Falwell</text><circle cx="336.3333333333333" cy="261.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="267.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mobilised conservative</text><text x="349.3333333333333" y="288.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Christians on abortion and</text><text x="349.3333333333333" y="309.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">school prayer</text><circle cx="336.3333333333333" cy="332.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="338.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bruce (2003): attention but</text><text x="349.3333333333333" y="359.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">limited policy change</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="329" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,176 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,176 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="176" x2="868.75" y2="176" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="145.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Iranian revolution</text><text x="616.6666666666666" y="209.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Ayatollah Khomeini, 1979</text><circle cx="621.6666666666666" cy="232.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="238.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mass movement overthrew the</text><text x="634.6666666666666" y="259.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shah</text><circle cx="621.6666666666666" cy="282.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="288.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Established an Islamic</text><text x="634.6666666666666" y="309.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">republic</text><circle cx="621.6666666666666" cy="332.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="338.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Religion as a revolutionary</text><text x="634.6666666666666" y="359.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">force</text><rect x="30" y="449" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="485" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A challenge to Marx</text><text x="56" y="514" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">These cases show religion can oppose the existing order rather than only legitimate it.</text>
</svg>