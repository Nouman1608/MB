<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring religious belief</text>

<line x1="250" y1="278" x2="250" y2="197" stroke="#1e2a44" stroke-width="2.5"/><rect x="178" y="153" width="144" height="44" rx="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="181" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Belief</text><line x1="316.57395614066075" y1="320.8409463487533" x2="359.37149937394264" y2="295.8105698043825" stroke="#1e2a44" stroke-width="2.5"/><rect x="334.9243251887003" y="267.0121959281337" width="144" height="44" rx="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="406.9243251887003" y="295.0121959281337" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Practice</text><line x1="291.1449676604731" y1="390.1590536512467" x2="317.5953040136344" y2="455.6894301956175" stroke="#1e2a44" stroke-width="2.5"/><rect x="274.98456662825805" y="451.4878040718663" width="144" height="44" rx="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="346.98456662825805" y="479.4878040718663" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Experience</text><line x1="208.85503233952687" y1="390.1590536512467" x2="182.4046959863656" y2="455.6894301956175" stroke="#1e2a44" stroke-width="2.5"/><rect x="81.01543337174195" y="451.4878040718663" width="144" height="44" rx="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="153.01543337174195" y="479.4878040718663" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Knowledge</text><line x1="183.42604385933925" y1="320.8409463487532" x2="140.62850062605736" y2="295.81056980438245" stroke="#1e2a44" stroke-width="2.5"/><rect x="21.075674811299677" y="267.0121959281336" width="144" height="44" rx="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="93.07567481129968" y="295.0121959281336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Consequences</text><ellipse cx="250" cy="340" rx="82" ry="64" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="250" y="347" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Religiosity</text><text x="250" y="560" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Glock and Stark (1968): five dimensions</text><text x="670" y="124" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Why measurement is hard</text><rect x="480" y="144" width="390" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="144" width="10" height="92" rx="4" fill="#b5602e"/><text x="504" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Attendance figures</text><text x="504" y="198" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">depend on who counts; people may attend for</text><text x="504" y="219" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">social reasons</text><rect x="480" y="248" width="390" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="248" width="10" height="92" rx="4" fill="#b5602e"/><text x="504" y="278" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Survey wording</text><text x="504" y="302" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“belong to a religion?” versus “believe in</text><text x="504" y="323" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">God?” give different answers</text><rect x="480" y="352" width="390" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="352" width="10" height="92" rx="4" fill="#b5602e"/><text x="504" y="382" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Social desirability</text><text x="504" y="406" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">over-reporting in religious societies,</text><text x="504" y="427" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">under-reporting in secular ones</text><rect x="480" y="456" width="390" height="71" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="456" width="10" height="71" rx="4" fill="#b5602e"/><text x="504" y="486" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Private belief</text><text x="504" y="510" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cannot be observed directly</text>
</svg>