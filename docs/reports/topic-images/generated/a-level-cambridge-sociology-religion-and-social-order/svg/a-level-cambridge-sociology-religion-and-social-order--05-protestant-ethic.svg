<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Did religion cause capitalism?</text>

<text x="30" y="140" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Weber, The Protestant Ethic (1905): religion causes economic change</text><rect x="30" y="160" width="246.66666666666666" height="127" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="192.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Calvinist ideas</text><text x="153.33333333333331" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">predestination, the</text><text x="153.33333333333331" y="243.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">calling, ascetic</text><text x="153.33333333333331" y="264.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">self-denial</text><line x1="280.66666666666663" y1="223.5" x2="322.66666666666663" y2="223.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="160" width="246.66666666666666" height="127" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="213.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Disciplined work ethic</text><text x="449.99999999999994" y="243.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and reinvestment of profit</text><line x1="577.3333333333333" y1="223.5" x2="619.3333333333333" y2="223.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="160" width="246.66666666666666" height="127" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="213.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rise of capitalism</text><text x="746.6666666666666" y="243.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in Northern Europe</text><text x="30" y="357" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Tawney (1926) and Marxists: economic change comes first</text><rect x="30" y="377" width="246.66666666666666" height="106" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="409.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic change</text><text x="153.33333333333331" y="439.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">changes in the mode of</text><text x="153.33333333333331" y="460.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">production</text><line x1="280.66666666666663" y1="430" x2="322.66666666666663" y2="430" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="377" width="246.66666666666666" height="106" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="430.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Capitalism develops</text><line x1="577.3333333333333" y1="430" x2="619.3333333333333" y2="430" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="377" width="246.66666666666666" height="106" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="419.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Protestantism adapts</text><text x="746.6666666666666" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">religion follows</text><rect x="30" y="507" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="543" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Further criticism</text><text x="56" y="572" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Capitalism developed in some Catholic areas and not in some Calvinist ones.</text>
</svg>