<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Religion and social order: two views</text>

<rect x="188" y="104" width="337" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="356.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism</text><rect x="533" y="104" width="337" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="701.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism</text><rect x="30" y="156" width="150" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="196.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What religion</text><text x="42" y="218.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">does</text><rect x="188" y="156" width="337" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Creates collective conscience and</text><text x="202" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">social solidarity; gives core values</text><text x="202" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and meaning; helps people cope</text><rect x="533" y="156" width="337" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Acts as ideology legitimating</text><text x="547" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inequality; “the opium of the people”;</text><text x="547" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offers compensation in an afterlife</text><rect x="30" y="257" width="150" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="308.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key ideas</text><rect x="188" y="257" width="337" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Durkheim (1912): the sacred symbolises</text><text x="202" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">society; Malinowski; Parsons; Bellah’s</text><text x="202" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">civil religion (1967)</text><rect x="533" y="257" width="337" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Marx (1844); divine right of kings;</text><text x="547" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">caste; Maduro (1982): relative</text><text x="547" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">autonomy</text><rect x="30" y="358" width="150" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="409.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strengths</text><rect x="188" y="358" width="337" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explains the persistence of ritual and</text><text x="202" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">religion’s role in crises and national</text><text x="202" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ceremonies</text><rect x="533" y="358" width="337" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explains religion’s link to power and</text><text x="547" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inequality</text><rect x="30" y="459" width="150" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="521.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitations</text><rect x="188" y="459" width="337" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores conflict between and within</text><text x="202" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">religions; struggles with diversity;</text><text x="202" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">based on small-scale societies</text><rect x="533" y="459" width="337" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores religion’s role in social</text><text x="547" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change; assumes false consciousness;</text><text x="547" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less relevant where religion has</text><text x="547" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">declined</text>
</svg>