<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building the conclusion: judge each kind of justice</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Criminal law, from the worked example</text>
<rect x="30" y="124" width="660" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Procedural</text><text x="44" y="180.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High: standard of proof, jury trial, right of appeal</text><rect x="706" y="124" width="164" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="788" y="168.5" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">STRONG</text><rect x="30" y="209" width="660" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="237.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Formal</text><text x="44" y="265.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Achieved by grading offences according to fault</text><rect x="706" y="209" width="164" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="788" y="253.5" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">STRONG</text><rect x="30" y="294" width="660" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="322.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Correcting errors</text><text x="44" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Criminal Cases Review Commission and quashed convictions: mechanisms work, if</text><text x="44" y="371.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">too slowly</text><rect x="706" y="294" width="164" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="788" y="349" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">PARTIAL</text><rect x="30" y="400" width="660" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="428.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Substantive</text><text x="44" y="456.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sally Clark, Malkinson; mandatory life sentence</text><rect x="706" y="400" width="164" height="75" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="788" y="444.5" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">WEAKEST</text><rect x="30" y="495" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="529.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Answer “extent” directly</text><text x="50" y="559.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Criminal law achieves justice to a <tspan font-weight="700" fill="#1e2a44">considerable</tspan> <tspan font-weight="700" fill="#1e2a44">but</tspan> <tspan font-weight="700" fill="#1e2a44">incomplete</tspan> extent, with substantive justice the</text><text x="50" y="581.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weakest dimension.</text>
</svg>