<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five kinds of justice</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Justice means fairness, but fairness has several dimensions</text>
<rect x="30" y="124" width="176" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="168.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal</text><rect x="220" y="124" width="650" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="234" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Are like cases treated alike, by consistent rules?</text><text x="234" y="180.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Precedent; equality before the law</text><rect x="30" y="209" width="176" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="253.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Substantive</text><rect x="220" y="209" width="650" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="234" y="237.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Is the content of the rule, and the outcome, fair?</text><text x="234" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mandatory life sentence in a mercy killing</text><rect x="30" y="294" width="176" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="338.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Procedural</text><rect x="220" y="294" width="650" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="234" y="322.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Was the process fair?</text><text x="234" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fair hearing; impartial judge; jury trial</text><rect x="30" y="379" width="176" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="423.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Distributive</text><rect x="220" y="379" width="650" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="234" y="407.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Are benefits and burdens shared fairly?</text><text x="234" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Taxation, welfare law, legal aid</text><rect x="30" y="464" width="176" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="508.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Corrective</text><rect x="220" y="464" width="650" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="234" y="492.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Is a wrong between two parties put right?</text><text x="234" y="520.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Compensatory damages in tort and contract</text><rect x="30" y="559" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="593.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Formal and substantive justice can conflict</text><text x="50" y="623.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Applying a harsh rule consistently gives formal justice, but repeats the same unfairness every time.</text>
</svg>