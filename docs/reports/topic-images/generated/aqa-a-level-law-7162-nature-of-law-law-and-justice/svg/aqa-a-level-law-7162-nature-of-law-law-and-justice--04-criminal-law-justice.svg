<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 532" width="900" height="532" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="532" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Does criminal law achieve justice?</text>

<rect x="30" y="100" width="411" height="301" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACHIEVES JUSTICE</text><text x="48" y="161.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Beyond</tspan> <tspan font-weight="700" fill="#1e2a44">reasonable</tspan> <tspan font-weight="700" fill="#1e2a44">doubt</tspan> protects the</text><text x="63.2" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">innocent</text><text x="48" y="210.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Jury</tspan> <tspan font-weight="700" fill="#1e2a44">trial</tspan> brings community judgement</text><text x="48" y="238.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Appeals</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">Criminal</tspan> <tspan font-weight="700" fill="#1e2a44">Cases</tspan> <tspan font-weight="700" fill="#1e2a44">Review</tspan></text><text x="63.2" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Commission</tspan> correct wrongful convictions</text><text x="48" y="287.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Grading</tspan> <tspan font-weight="700" fill="#1e2a44">by</tspan> <tspan font-weight="700" fill="#1e2a44">fault</tspan>: murder and manslaughter</text><text x="63.2" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">differ</text><text x="48" y="336.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Retrial</tspan> <tspan font-weight="700" fill="#1e2a44">on</tspan> <tspan font-weight="700" fill="#1e2a44">new</tspan> <tspan font-weight="700" fill="#1e2a44">evidence</tspan> (Criminal Justice Act</text><text x="63.2" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2003): Gary Dobson, acquitted 1996, convicted</text><text x="63.2" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2012</text><rect x="459" y="100" width="411" height="301" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="477" y="130" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FAILS</text><text x="477" y="161.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Miscarriages</tspan>: Guildford Four (quashed 1989);</text><text x="492.2" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sally Clark (quashed 2003); Andrew Malkinson</text><text x="492.2" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(quashed 2023 after seventeen years in</text><text x="492.2" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prison)</text><text x="477" y="252.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Rigid</tspan> <tspan font-weight="700" fill="#1e2a44">rules</tspan>: mandatory life sentence in a mercy</text><text x="492.2" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">killing</text><text x="477" y="301.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="301.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Strict</tspan> <tspan font-weight="700" fill="#1e2a44">liability</tspan> can convict the careful</text><text x="477" y="329.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Legal</tspan> <tspan font-weight="700" fill="#1e2a44">aid</tspan> <tspan font-weight="700" fill="#1e2a44">reductions</tspan>: unequal representation</text><text x="450" y="439" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Miscarriages are failures, but their correction shows the system working, if slowly</text><rect x="30" y="455" width="250.66666666666666" height="45" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="155.33333333333331" y="482.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Wrongful conviction</text><line x1="286.66666666666663" y1="477.5" x2="318.66666666666663" y2="477.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="455" width="250.66666666666666" height="45" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="449.99999999999994" y="482.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Review and appeal</text><line x1="581.3333333333333" y1="477.5" x2="613.3333333333333" y2="477.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="455" width="250.66666666666666" height="45" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="744.6666666666666" y="482.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Conviction quashed</text>
</svg>