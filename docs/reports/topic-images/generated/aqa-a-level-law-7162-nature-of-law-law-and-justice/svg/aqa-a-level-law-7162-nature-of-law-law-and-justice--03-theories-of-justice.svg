<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six theories of justice</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Core idea, what it means for law, and a weakness</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="496" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="138.39816933638443" height="44" fill="#b5d3cf"/><text x="42" y="149.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Theorist</text><rect x="168.39816933638443" y="124" width="278.71853546910756" height="44" fill="#b5d3cf"/><text x="180.39816933638443" y="149.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Core idea</text><rect x="447.11670480549196" y="124" width="221.05263157894734" height="44" fill="#dce9e7"/><text x="459.11670480549196" y="149.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">For law</text><rect x="668.1693363844392" y="124" width="201.83066361556064" height="44" fill="#f2e7b8"/><text x="680.1693363844392" y="149.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Weakness</text><rect x="30" y="168" width="138.39816933638443" height="82" fill="#dce9e7"/><text x="42" y="192" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Aristotle</text><rect x="168.39816933638443" y="168" width="278.71853546910756" height="82" fill="#ffffff"/><text x="180.39816933638443" y="192" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Distributive: each gets what is due</text><text x="180.39816933638443" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">by merit. Corrective: restore the</text><text x="180.39816933638443" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">balance after a wrong</text><rect x="447.11670480549196" y="168" width="221.05263157894734" height="82" fill="#ffffff"/><text x="459.11670480549196" y="192" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Tort damages are</text><text x="459.11670480549196" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">corrective justice</text><rect x="668.1693363844392" y="168" width="201.83066361556064" height="82" fill="#ffffff"/><text x="680.1693363844392" y="192" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">“Merit” is contested</text><line x1="30" y1="250" x2="870" y2="250" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="250" width="138.39816933638443" height="62" fill="#dce9e7"/><text x="42" y="274" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Bentham, Mill</text><rect x="168.39816933638443" y="250" width="278.71853546910756" height="62" fill="#f8faf9"/><text x="180.39816933638443" y="274" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Greatest happiness of the greatest</text><text x="180.39816933638443" y="294" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">number</text><rect x="447.11670480549196" y="250" width="221.05263157894734" height="62" fill="#f8faf9"/><text x="459.11670480549196" y="274" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Deterrent sentencing; laws</text><text x="459.11670480549196" y="294" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">for the majority</text><rect x="668.1693363844392" y="250" width="201.83066361556064" height="62" fill="#f8faf9"/><text x="680.1693363844392" y="274" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Can justify sacrificing an</text><text x="680.1693363844392" y="294" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">individual</text><line x1="30" y1="312" x2="870" y2="312" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="312" width="138.39816933638443" height="62" fill="#dce9e7"/><text x="42" y="336" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Perelman</text><rect x="168.39816933638443" y="312" width="278.71853546910756" height="62" fill="#ffffff"/><text x="180.39816933638443" y="336" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Treat beings of the same essential</text><text x="180.39816933638443" y="356" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">category the same way</text><rect x="447.11670480549196" y="312" width="221.05263157894734" height="62" fill="#ffffff"/><text x="459.11670480549196" y="336" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Explains precedent and</text><text x="459.11670480549196" y="356" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">equality before the law</text><rect x="668.1693363844392" y="312" width="201.83066361556064" height="62" fill="#ffffff"/><text x="680.1693363844392" y="336" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Silent on which</text><text x="680.1693363844392" y="356" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">categories are fair</text><line x1="30" y1="374" x2="870" y2="374" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="374" width="138.39816933638443" height="82" fill="#dce9e7"/><text x="42" y="398" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Marx</text><rect x="168.39816933638443" y="374" width="278.71853546910756" height="82" fill="#f8faf9"/><text x="180.39816933638443" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Law serves the property-owning</text><text x="180.39816933638443" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">class; “to each according to his</text><text x="180.39816933638443" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">needs”</text><rect x="447.11670480549196" y="374" width="221.05263157894734" height="82" fill="#f8faf9"/><text x="459.11670480549196" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Criticises rules protecting</text><text x="459.11670480549196" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">property over people</text><rect x="668.1693363844392" y="374" width="201.83066361556064" height="82" fill="#f8faf9"/><text x="680.1693363844392" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Little guidance for</text><text x="680.1693363844392" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">existing societies</text><line x1="30" y1="456" x2="870" y2="456" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="456" width="138.39816933638443" height="82" fill="#dce9e7"/><text x="42" y="480" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Rawls</text><rect x="168.39816933638443" y="456" width="278.71853546910756" height="82" fill="#ffffff"/><text x="180.39816933638443" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Choose principles behind a veil of</text><text x="180.39816933638443" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ignorance; inequality only if it helps</text><text x="180.39816933638443" y="520" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the least advantaged</text><rect x="447.11670480549196" y="456" width="221.05263157894734" height="82" fill="#ffffff"/><text x="459.11670480549196" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Supports legal aid and</text><text x="459.11670480549196" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">protection for minorities</text><rect x="668.1693363844392" y="456" width="201.83066361556064" height="82" fill="#ffffff"/><text x="680.1693363844392" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Would people really</text><text x="680.1693363844392" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">choose his principles?</text><line x1="30" y1="538" x2="870" y2="538" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="538" width="138.39816933638443" height="82" fill="#dce9e7"/><text x="42" y="562" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Nozick</text><rect x="168.39816933638443" y="538" width="278.71853546910756" height="82" fill="#f8faf9"/><text x="180.39816933638443" y="562" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Respect entitlements fairly</text><text x="180.39816933638443" y="582" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">acquired and transferred;</text><text x="180.39816933638443" y="602" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">redistribution is unjust</text><rect x="447.11670480549196" y="538" width="221.05263157894734" height="82" fill="#f8faf9"/><text x="459.11670480549196" y="562" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Property and contract</text><text x="459.11670480549196" y="582" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rights; limits on taxation</text><rect x="668.1693363844392" y="538" width="201.83066361556064" height="82" fill="#f8faf9"/><text x="680.1693363844392" y="562" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Can leave serious need</text><text x="680.1693363844392" y="582" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">unaddressed</text></g><line x1="168.39816933638443" y1="124" x2="168.39816933638443" y2="620" stroke="#c9d6d4" stroke-width="1.5"/><line x1="447.11670480549196" y1="124" x2="447.11670480549196" y2="620" stroke="#c9d6d4" stroke-width="1.5"/><line x1="668.1693363844392" y1="124" x2="668.1693363844392" y2="620" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="496" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>