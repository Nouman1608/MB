<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 489" width="900" height="489" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="489" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Procedural justice: the two rules of natural justice</text>

<rect x="30" y="100" width="410" height="106" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RULE 1</text><text x="235" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">No one should be a judge in their own</text><text x="235" y="182.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">cause</text><rect x="460" y="100" width="410" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="142.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">RULE 2</text><text x="665" y="170.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Both sides must be heard</text><rect x="30" y="222" width="410" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="250" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DIMES v GRAND JUNCTION CANAL (1852)</text><text x="46" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lord Chancellor’s decision set aside: he held</text><text x="46" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shares in the canal company that was a party</text><rect x="30" y="335" width="410" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="363" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ex p PINOCHET (No 2) (1999)</text><text x="46" y="394.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">House of Lords set aside its own decision: Lord</text><text x="46" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hoffmann had links to Amnesty International,</text><text x="46" y="436.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">which had intervened</text><rect x="460" y="222" width="410" height="235" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="306.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RIDGE v BALDWIN (1964)</text><text x="476" y="338.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A chief constable’s dismissal was void: he was</text><text x="476" y="359.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not told the case against him or given a chance to</text><text x="476" y="380.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">answer it</text>
</svg>