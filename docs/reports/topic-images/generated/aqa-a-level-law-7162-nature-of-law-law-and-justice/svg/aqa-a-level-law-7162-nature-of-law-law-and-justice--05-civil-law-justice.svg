<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" width="900" height="426" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="426" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Does civil law achieve justice?</text>

<rect x="30" y="100" width="411" height="294" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACHIEVES JUSTICE</text><text x="48" y="161.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Corrective</tspan> <tspan font-weight="700" fill="#1e2a44">justice</tspan>: compensatory damages</text><text x="63.2" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">restore the claimant’s position</text><text x="48" y="210.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Flexible</tspan> <tspan font-weight="700" fill="#1e2a44">remedies</tspan>: injunctions prevent</text><text x="63.2" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">continuing harm</text><text x="48" y="259.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Judicial</tspan> <tspan font-weight="700" fill="#1e2a44">development</tspan>: <tspan font-style="italic">Donoghue</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Stevenson</tspan></text><text x="63.2" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1932) gave a remedy without a contract</text><text x="48" y="308.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Procedural</tspan> <tspan font-weight="700" fill="#1e2a44">reform</tspan>: Woolf, <tspan font-style="italic">Access</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">Justice</tspan></text><text x="63.2" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1996), led to the Civil Procedure Rules 1998:</text><text x="63.2" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deal with cases justly, at proportionate cost</text><rect x="459" y="100" width="411" height="294" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="477" y="130" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FAILS</text><text x="477" y="161.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Cost</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">delay</tspan> deter claims; the loser usually</text><text x="492.2" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pays costs</text><text x="477" y="210.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Inequality</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">arms</tspan>: a well-funded company</text><text x="492.2" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can outlast an individual</text><text x="477" y="259.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Legal</tspan> <tspan font-weight="700" fill="#1e2a44">aid</tspan> <tspan font-weight="700" fill="#1e2a44">cuts</tspan>: the Legal Aid, Sentencing and</text><text x="492.2" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Punishment of Offenders Act 2012 took most</text><text x="492.2" y="301.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">civil areas out of scope, more litigants in</text><text x="492.2" y="322.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">person</text><text x="477" y="350.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Fault</tspan> <tspan font-weight="700" fill="#1e2a44">requirements</tspan> leave some victims</text><text x="492.2" y="371.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">uncompensated</text>
</svg>