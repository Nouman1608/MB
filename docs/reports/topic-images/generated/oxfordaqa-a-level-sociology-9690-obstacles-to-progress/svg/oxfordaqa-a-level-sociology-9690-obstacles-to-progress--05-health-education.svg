<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why health and education gaps persist</text>

<rect x="188" y="104" width="337" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="356.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Health</text><rect x="533" y="104" width="337" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="701.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Education</text><rect x="30" y="156" width="150" height="193" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="246.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Access and</text><text x="42" y="268.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">provision</text><rect x="188" y="156" width="337" height="193" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="207" cy="180.92" r="4.5" fill="#2e6b62"/><text x="220" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Inverse care law</tspan> (Tudor Hart,</text><text x="220" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1971): care least available where</text><text x="220" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">most needed</text><circle cx="207" cy="251.92" r="4.5" fill="#2e6b62"/><text x="220" y="257.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">User fees</tspan> under structural</text><text x="220" y="278.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adjustment deterred poor patients</text><circle cx="207" cy="301.92" r="4.5" fill="#2e6b62"/><text x="220" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Health-worker migration</tspan> to richer</text><text x="220" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">countries</text><rect x="533" y="156" width="337" height="193" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="552" cy="180.92" r="4.5" fill="#2e6b62"/><text x="565" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Distance to school, fees and</text><text x="565" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">uniforms</text><circle cx="552" cy="230.92" r="4.5" fill="#2e6b62"/><text x="565" y="236.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Child labour, early marriage</text><circle cx="552" cy="259.92" r="4.5" fill="#2e6b62"/><text x="565" y="265.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No safe toilets for girls;</text><text x="565" y="286.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conflict</text><rect x="30" y="357" width="150" height="164" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="433.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Deeper</text><text x="42" y="455.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">causes</text><rect x="188" y="357" width="337" height="164" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="207" cy="381.92" r="4.5" fill="#2e6b62"/><text x="220" y="387.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Neglected diseases:</tspan> research</text><text x="220" y="408.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">follows markets</text><circle cx="207" cy="431.92" r="4.5" fill="#2e6b62"/><text x="220" y="437.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Living conditions:</tspan> unsafe water,</text><text x="220" y="458.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">poor sanitation, malnutrition that</text><text x="220" y="479.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clinics alone cannot fix</text><rect x="533" y="357" width="337" height="164" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="552" cy="381.92" r="4.5" fill="#2e6b62"/><text x="565" y="387.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Quality:</tspan> Pritchett (2013),</text><text x="565" y="408.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"schooling ain’t learning";</text><text x="565" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enrolment rose faster than skills</text><circle cx="552" cy="452.92" r="4.5" fill="#2e6b62"/><text x="565" y="458.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Within-country gaps:</tspan> rural, poor,</text><text x="565" y="479.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disabled and minority-language</text><text x="565" y="500.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children furthest behind</text><rect x="30" y="537" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="573" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use for evaluation</text><text x="56" y="602" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gaps are partly produced by global processes and partly by national choices (spending,</text><text x="56" y="624" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">gender norms): weigh the three perspectives here.</text>
</svg>