<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 697" width="900" height="697" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="697" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Parsons’s pattern variables</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">used by modernisation theorists to contrast traditional and modern societies</text>
<rect x="30" y="120" width="416" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="238" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Traditional</text><rect x="454" y="120" width="416" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="662" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Modern</text><rect x="30" y="172" width="416" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="203.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ascription:</tspan> status by birth</text><rect x="454" y="172" width="416" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="203.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Achievement:</tspan> status by effort and merit</text><rect x="30" y="232" width="416" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="263.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Particularism:</tspan> treating people by personal</text><text x="44" y="285.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ties</text><rect x="454" y="232" width="416" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="263.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Universalism:</tspan> the same rules for all</text><rect x="30" y="314" width="416" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="345.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Collectivity orientation:</tspan> family or group</text><text x="44" y="367.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">first</text><rect x="454" y="314" width="416" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="345.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Self-orientation:</tspan> individual goals</text><rect x="30" y="396" width="416" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="427.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Affectivity:</tspan> emotional relationships</text><rect x="454" y="396" width="416" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="427.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Affective neutrality:</tspan> impersonal at work</text><rect x="30" y="456" width="416" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="487.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Diffuseness:</tspan> relationships cover many areas</text><rect x="454" y="456" width="416" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="487.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Specificity:</tspan> relationships for one purpose</text><rect x="30" y="524" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="560" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="583.39" r="4.5" fill="#8a6d0d"/><text x="74" y="589" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ethnocentric</tspan> and <tspan font-weight="700">blames the poor</tspan>, ignoring colonial history</text><circle cx="61" cy="613.39" r="4.5" fill="#8a6d0d"/><text x="74" y="619" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Family networks finance businesses; East Asian growth kept strong group loyalties</text><circle cx="61" cy="643.39" r="4.5" fill="#8a6d0d"/><text x="74" y="649" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Some support:</tspan> corruption and patronage are widely recognised barriers</text>
</svg>