<rect width="900" height="536" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Feminist views: from WID to GAD</text>

<rect x="30" y="104" width="404" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Women in Development</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">1970s</text><circle cx="53" cy="215.79" r="4.5" fill="#2e6b62"/><text x="66" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Add women to existing projects</text><rect x="466" y="104" width="404" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender and Development</text><text x="484" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">later</text><circle cx="489" cy="215.79" r="4.5" fill="#8a6d0d"/><text x="502" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unequal power relations between women</text><text x="502" y="243.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and men must themselves change</text><circle cx="450" cy="186.5" r="24" fill="#1e2a44"/><text x="450" y="193.5" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="287" width="840" height="223" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="323" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence and debate</text><circle cx="61" cy="346.39" r="4.5" fill="#8a6d0d"/><text x="74" y="352" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Boserup (1970):</tspan> women did much farming, but projects gave training, land titles and</text><text x="74" y="374" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">technology to men</text><circle cx="61" cy="398.39" r="4.5" fill="#8a6d0d"/><text x="74" y="404" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Sen (1990):</tspan> over 100 million "missing women" through neglect and sex-selective</text><text x="74" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">practices</text><circle cx="61" cy="450.39" r="4.5" fill="#8a6d0d"/><text x="74" y="456" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Liberal feminists:</tspan> schooling and paid work erode patriarchy</text><circle cx="61" cy="480.39" r="4.5" fill="#8a6d0d"/><text x="74" y="486" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Radical and Marxist feminists:</tspan> paid work adds to unpaid work, a "double burden"</text>
</svg>