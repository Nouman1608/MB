<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How war blocks development</text>

<rect x="30" y="110" width="412" height="192" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124.25 Q31.25,111.25 44.25,111.25 L427.75,111.25 Q440.75,111.25 440.75,124.25 L440.75,160 Z" fill="#f2e7b8"/><line x1="31.25" y1="160" x2="440.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Direct effects</text><circle cx="49" cy="185.92" r="4.5" fill="#2e6b62"/><text x="62" y="191.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deaths and injuries</text><circle cx="49" cy="214.92" r="4.5" fill="#2e6b62"/><text x="62" y="220.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Destroyed schools, clinics and roads</text><circle cx="49" cy="243.92" r="4.5" fill="#2e6b62"/><text x="62" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Landmines make farmland unusable</text><rect x="458" y="110" width="412" height="192" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,160 L459.25,124.25 Q459.25,111.25 472.25,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,160 Z" fill="#f2e7b8"/><line x1="459.25" y1="160" x2="868.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Indirect effects</text><circle cx="477" cy="185.92" r="4.5" fill="#2e6b62"/><text x="490" y="191.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Displacement</text><circle cx="477" cy="214.92" r="4.5" fill="#2e6b62"/><text x="490" y="220.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Collapse of public services</text><circle cx="477" cy="243.92" r="4.5" fill="#2e6b62"/><text x="490" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lost schooling</text><circle cx="477" cy="272.92" r="4.5" fill="#2e6b62"/><text x="490" y="278.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Investment flight</text><text x="30" y="330" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"Greed and grievance" (Collier and Hoeffler)</text><rect x="30" y="348" width="253.33333333333334" height="85" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="156.66666666666669" y="380.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Lootable resources</text><text x="156.66666666666669" y="410.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. diamonds</text><line x1="287.33333333333337" y1="390.5" x2="319.33333333333337" y2="390.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="348" width="253.33333333333334" height="85" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450.00000000000006" y="390.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Opportunity to profit</text><line x1="580.6666666666667" y1="390.5" x2="612.6666666666667" y2="390.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="348" width="253.33333333333334" height="85" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="380.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Civil war</text><text x="743.3333333333334" y="410.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Sierra Leone, 1991–2002</text><rect x="30" y="451" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="487" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Responses and critique</text><circle cx="61" cy="510.39" r="4.5" fill="#8a6d0d"/><text x="74" y="516" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Kimberley Process (2003):</tspan> certification to stop "conflict diamonds"</text><circle cx="61" cy="540.39" r="4.5" fill="#8a6d0d"/><text x="74" y="546" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxists:</tspan> global demand for minerals and arms sales by richer countries feed conflicts</text><circle cx="61" cy="570.39" r="4.5" fill="#8a6d0d"/><text x="74" y="576" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Also: Collier’s conflict trap; Kaldor’s new wars</text>
</svg>