<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 627" width="900" height="627" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="627" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Marxist views: the obstacle is the world economy</text>

<rect x="30" y="104" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Commodity dependence</text><text x="46" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A few raw-material exports with swinging</text><text x="46" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prices; value added by processing and</text><text x="46" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">branding is captured in richer countries.</text><rect x="458" y="104" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Debt</text><text x="474" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1970s borrowing, then rising interest rates:</text><text x="474" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the 1980s debt crisis diverted spending from</text><text x="474" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">health and education.</text><rect x="30" y="269" width="412" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,319 L31.25,283.25 Q31.25,270.25 44.25,270.25 L427.75,270.25 Q440.75,270.25 440.75,283.25 L440.75,319 Z" fill="#f2e7b8"/><line x1="31.25" y1="319" x2="440.75" y2="319" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="300" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Kicking away the ladder</text><text x="46" y="352.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Chang (2002)</text><text x="46" y="381.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rich states forbid the protective policies</text><text x="46" y="402.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they used themselves.</text><rect x="458" y="269" width="412" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,319 L459.25,283.25 Q459.25,270.25 472.25,270.25 L855.75,270.25 Q868.75,270.25 868.75,283.25 L868.75,319 Z" fill="#f2e7b8"/><line x1="459.25" y1="319" x2="868.75" y2="319" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="300" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Accumulation by dispossession</text><text x="474" y="352.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Harvey (2003)</text><text x="474" y="381.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Land, water and public services taken into</text><text x="474" y="402.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">private hands.</text><rect x="30" y="442" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="478" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Remedy and evaluation</text><circle cx="61" cy="501.39" r="4.5" fill="#8a6d0d"/><text x="74" y="507" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bello:</tspan> deglobalisation, economies reoriented to local and national needs</text><circle cx="61" cy="531.39" r="4.5" fill="#8a6d0d"/><text x="74" y="537" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Against:</tspan> East Asian growth shows peripheral status is not permanent; Marxists reply it</text><text x="74" y="559" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">came with strong state direction</text><circle cx="61" cy="583.39" r="4.5" fill="#8a6d0d"/><text x="74" y="589" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marxists may underplay internal factors such as corruption</text>
</svg>