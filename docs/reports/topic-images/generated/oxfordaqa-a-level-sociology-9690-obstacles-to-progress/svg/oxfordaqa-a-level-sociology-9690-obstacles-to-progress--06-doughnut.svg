<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 957" width="900" height="957" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="957" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Development within limits</text>

<circle cx="300" cy="340" r="210" fill="#f2e7b8" stroke="#b5602e" stroke-width="4"/><circle cx="300" cy="340" r="190" fill="#b5d3cf" stroke="none"/><circle cx="300" cy="340" r="100" fill="#f2e7b8" stroke="#1e2a44" stroke-width="4"/><text x="300" y="336" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Below the</text><text x="300" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">foundation</text><text x="300" y="384" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">needs not met</text><text x="300" y="204" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Safe and just space</text><text x="300" y="490" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">for development</text><line x1="400" y1="340" x2="560" y2="380" stroke="#1e2a44" stroke-width="2"/><text x="570" y="386" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Social foundation: human</text><text x="570" y="408" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">needs</text><line x1="448" y1="192" x2="560" y2="230" stroke="#b5602e" stroke-width="2"/><text x="570" y="236" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Ecological ceiling: do not</text><text x="570" y="258" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">exceed</text><text x="570" y="150" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Raworth, Doughnut Economics</text><text x="570" y="174" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">(2017)</text><rect x="30" y="590" width="269.3333333333333" height="212" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,678 L31.25,604.25 Q31.25,591.25 44.25,591.25 L285.0833333333333,591.25 Q298.0833333333333,591.25 298.0833333333333,604.25 L298.0833333333333,678 Z" fill="#dce9e7"/><line x1="31.25" y1="678" x2="298.0833333333333" y2="678" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="617.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Common but</text><text x="164.66666666666666" y="639.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">differentiated</text><text x="164.66666666666666" y="661.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">responsibilities</text><text x="44" y="709.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">UNFCCC (1992)</text><text x="44" y="736.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">All states act; those that</text><text x="44" y="757.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">industrialised first bear</text><text x="44" y="778.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more responsibility.</text><rect x="315.3333333333333" y="590" width="269.3333333333333" height="212" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,678 L316.5833333333333,604.25 Q316.5833333333333,591.25 329.5833333333333,591.25 L570.4166666666666,591.25 Q583.4166666666666,591.25 583.4166666666666,604.25 L583.4166666666666,678 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="678" x2="583.4166666666666" y2="678" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="639.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Offshoring</text><text x="329.3333333333333" y="709.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Moving production moves</text><text x="329.3333333333333" y="730.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">emissions and pollution to</text><text x="329.3333333333333" y="751.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">poorer countries.</text><rect x="600.6666666666666" y="590" width="269.3333333333333" height="212" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,678 L601.9166666666666,604.25 Q601.9166666666666,591.25 614.9166666666666,591.25 L855.75,591.25 Q868.75,591.25 868.75,604.25 L868.75,678 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="678" x2="868.75" y2="678" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="639.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Degrowth</text><text x="614.6666666666666" y="709.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Hickel (2020)</text><text x="614.6666666666666" y="736.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rich countries cut material</text><text x="614.6666666666666" y="757.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consumption so poorer ones</text><text x="614.6666666666666" y="778.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can develop.</text><rect x="30" y="820" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="856" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The tension</text><text x="56" y="885" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Brundtland (1987) assumes growth and protection can be reconciled, yet the model that</text><text x="56" y="907" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">made rich countries rich drives climate change.</text>
</svg>