<rect width="900" height="453" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What counts as progress?</text>

<rect x="30" y="104" width="404" height="216" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Modernisation theory</text><circle cx="53" cy="184.79" r="4.5" fill="#2e6b62"/><text x="66" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Progress = economic growth</text><circle cx="53" cy="214.79" r="4.5" fill="#2e6b62"/><text x="66" y="220.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Plus Western-style institutions</text><rect x="466" y="104" width="404" height="216" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sen (1999): capabilities</text><circle cx="489" cy="184.79" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Development = expanding real freedoms</text><circle cx="489" cy="214.79" r="4.5" fill="#8a6d0d"/><text x="502" y="220.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">To be healthy, educated, safe and able</text><text x="502" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to take part in decisions</text><circle cx="489" cy="266.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="272.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An obstacle is anything that limits</text><text x="502" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">capabilities, even where income rises</text><circle cx="450" cy="212" r="24" fill="#1e2a44"/><text x="450" y="219" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="338" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="374" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Exam move</text><text x="56" y="403" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">State which definition you are using: it shapes which obstacles look most important.</text>
</svg>