<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="900" height="598" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="598" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Disclosing and presenting a diagnosis</text>

<rect x="30" y="100" width="270.6666666666667" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">TOO LITTLE</text><text x="165.33333333333334" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Anxious, unable to make</text><text x="165.33333333333334" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">choices</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="106" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="132" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">DISCLOSURE</text><text x="450" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">How much to tell, and</text><text x="450" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">when</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="143.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">TOO MUCH AT ONCE</text><text x="734.6666666666667" y="169.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Overwhelmed</text><text x="450" y="244" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">DELIVERING BAD NEWS WELL</text><line x1="60" y1="286" x2="60" y2="546" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="266" width="766" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="296.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A private setting</text><circle cx="60" cy="292" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="300.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="328" width="766" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="358.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Check what the patient already knows</text><circle cx="60" cy="354" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="362.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="390" width="766" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="420.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Give information in manageable amounts</text><circle cx="60" cy="416" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="424.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="452" width="766" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="482.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Allow time for questions</text><circle cx="60" cy="478" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="486.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="514" width="766" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="544.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Agree next steps</text><circle cx="60" cy="540" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="548.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>