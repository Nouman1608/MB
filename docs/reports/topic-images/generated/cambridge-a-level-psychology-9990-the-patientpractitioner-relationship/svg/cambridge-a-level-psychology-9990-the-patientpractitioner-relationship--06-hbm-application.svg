<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Applying the health belief model</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Mr Hassan: a two-month cough, “just a cold”, busy at work</text>
<rect x="30" y="124" width="840" height="72" rx="14" fill="#ffffff"/><path d="M44,124 H230 V196 H44 A14,14 0 0 1 30,182 V138 A14,14 0 0 1 44,124 Z" fill="#b5d3cf"/><rect x="30" y="124" width="840" height="72" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="163.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The model (1)</text><text x="246" y="153.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Action depends on perceived threat and on benefits weighed against</text><text x="246" y="175.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">barriers</text><rect x="30" y="206" width="840" height="64" rx="14" fill="#ffffff"/><path d="M44,206 H230 V270 H44 A14,14 0 0 1 30,256 V220 A14,14 0 0 1 44,206 Z" fill="#f2e7b8"/><rect x="30" y="206" width="840" height="64" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="241.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Severity (1)</text><text x="246" y="242.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Just a cold” → <tspan font-weight="700" fill="#1e2a44">low</tspan> <tspan font-weight="700" fill="#1e2a44">perceived</tspan> <tspan font-weight="700" fill="#1e2a44">severity</tspan></text><rect x="30" y="280" width="840" height="64" rx="14" fill="#ffffff"/><path d="M44,280 H230 V344 H44 A14,14 0 0 1 30,330 V294 A14,14 0 0 1 44,280 Z" fill="#f2e7b8"/><rect x="30" y="280" width="840" height="64" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="315.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Barriers (1)</text><text x="246" y="316.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Busy at work → a <tspan font-weight="700" fill="#1e2a44">barrier</tspan> that outweighs the benefits of attending</text><rect x="30" y="354" width="840" height="64" rx="14" fill="#ffffff"/><path d="M44,354 H230 V418 H44 A14,14 0 0 1 30,404 V368 A14,14 0 0 1 44,354 Z" fill="#f2e7b8"/><rect x="30" y="354" width="840" height="64" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="389.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cue to action (1)</text><text x="246" y="390.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No cue, such as the cough worsening → he does not seek help</text><rect x="30" y="440" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="473.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Apply <tspan font-weight="700" fill="#1e2a44">each</tspan> <tspan font-weight="700" fill="#1e2a44">part</tspan> of the model to the person in the question, not just the model in general.</text>
</svg>