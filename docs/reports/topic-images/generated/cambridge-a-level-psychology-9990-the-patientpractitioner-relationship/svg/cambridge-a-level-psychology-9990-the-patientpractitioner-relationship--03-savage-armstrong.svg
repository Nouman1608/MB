<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 869" width="900" height="869" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="869" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Savage and Armstrong (1990)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Do patients prefer a directing or a sharing consulting style?</text>
<rect x="30" y="124" width="413" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DOCTOR-CENTRED (DIRECTING)</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Doctor controls the consultation</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">closed questions, clear instructions</text><rect x="457" y="124" width="413" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PATIENT-CENTRED (SHARING)</text><text x="477" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Patient’s views invited</text><text x="477" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">open questions, decisions reached together</text><rect x="30" y="257" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,257 H180 V327 H44 A14,14 0 0 1 30,313 V271 A14,14 0 0 1 44,257 Z" fill="#b5d3cf"/><rect x="30" y="257" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="295.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Design</text><text x="196" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Controlled field experiment; one GP, inner London general practice; patients <tspan font-weight="700" fill="#1e2a44">randomly</tspan></text><text x="196" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">allocated</tspan> to a style for the treatment, advice and prognosis part</text><rect x="30" y="337" width="840" height="56" rx="14" fill="#ffffff"/><path d="M44,337 H180 V393 H44 A14,14 0 0 1 30,379 V351 A14,14 0 0 1 44,337 Z" fill="#b5d3cf"/><rect x="30" y="337" width="840" height="56" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="368.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sample</text><text x="196" y="369.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">359</tspan> patients</text><rect x="30" y="403" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,403 H180 V473 H44 A14,14 0 0 1 30,459 V417 A14,14 0 0 1 44,403 Z" fill="#b5d3cf"/><rect x="30" y="403" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="441.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Measures</text><text x="196" y="431.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Satisfaction questionnaire immediately after (89% returned) and a week later (58%</text><text x="196" y="452.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">returned)</text><rect x="30" y="483" width="840" height="120" rx="14" fill="#fbf7e6"/><path d="M44,483 H180 V603 H44 A14,14 0 0 1 30,589 V497 A14,14 0 0 1 44,483 Z" fill="#d4b02e"/><rect x="30" y="483" width="840" height="120" rx="14" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="546.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Results</text><text x="196" y="511.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="211.2" y="511.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Directing style: <tspan font-weight="700" fill="#1e2a44">significantly</tspan> <tspan font-weight="700" fill="#1e2a44">higher</tspan> <tspan font-weight="700" fill="#1e2a44">satisfaction</tspan> on almost all measures</text><text x="196" y="536.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="211.2" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Especially physical problems and patients given a prescription</text><text x="196" y="561.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="211.2" y="561.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No significant difference: longer consultations, psychological or chronic problems,</text><text x="211.2" y="582.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advice as main treatment</text><rect x="30" y="613" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,613 H180 V683 H44 A14,14 0 0 1 30,669 V627 A14,14 0 0 1 44,613 Z" fill="#2e6b62"/><rect x="30" y="613" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="651.44" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Conclusion</text><text x="196" y="641.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many patients value a clear, authoritative explanation; sharing is not automatically</text><text x="196" y="662.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">better</text><rect x="30" y="705" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="737" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="763.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Real surgery; random allocation</text><text x="50" y="791.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">High ecological validity; patient variables</text><text x="50" y="812.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">controlled.</text><rect x="457" y="705" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="737" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="763.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One GP; 58% response</text><text x="477" y="791.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">His manner may suit directing; later results may</text><text x="477" y="812.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">be biased.</text>
</svg>