<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Non-verbal and verbal communication</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two named studies</text>
<rect x="30" y="124" width="413" height="202" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NON-VERBAL: CLOTHING</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">McKinstry and Wang (1991)</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">General practice patients rated <tspan font-weight="700" fill="#1e2a44">photographs</tspan></text><text x="65.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of doctors, formal to casual</text><text x="50" y="259.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Formal dress generally preferred, particularly</text><text x="65.2" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by <tspan font-weight="700" fill="#1e2a44">older</tspan> patients</text><rect x="457" y="124" width="413" height="202" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">VERBAL: MEDICAL TERMINOLOGY</text><text x="477" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">McKinlay (1975)</text><text x="477" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Women on a maternity ward: terms staff used</text><text x="492.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">v the women’s understanding</text><text x="477" y="259.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Understanding of many terms was poor; staff</text><text x="492.2" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">used terms they did not expect patients to</text><text x="492.2" y="301.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">understand</text><rect x="30" y="348" width="413" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="380" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="406.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Quantitative, easy to compare</text><text x="50" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">photographs and questionnaires</text><rect x="457" y="348" width="413" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="380" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRACTICAL MESSAGE</text><text x="477" y="406.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Check understanding; use plain language</text><rect x="30" y="481" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="513" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="50" y="539.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A photo is not a real doctor</text><text x="50" y="567.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">preferences may differ between cultures and</text><text x="50" y="588.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">over time</text><rect x="457" y="481" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="513" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="539.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Narrow sample</text><text x="477" y="567.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may not generalise to other patient groups</text>
</svg>