<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 746" width="900" height="746" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Munchausen syndrome v malingering</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Both involve feigning illness; the difference is the motive</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="211" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="193.84615384615384" height="49" fill="#b5d3cf"/><rect x="223.84615384615384" y="124" width="323.0769230769231" height="49" fill="#f2e7b8"/><text x="237.84615384615384" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Munchausen syndrome</text><rect x="546.9230769230769" y="124" width="323.0769230769231" height="49" fill="#b5d3cf"/><text x="560.9230769230769" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Malingering</text><rect x="30" y="173" width="193.84615384615384" height="47" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Behaviour</text><rect x="223.84615384615384" y="173" width="323.0769230769231" height="47" fill="#ffffff"/><text x="237.84615384615384" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Feigning or inducing illness</text><rect x="546.9230769230769" y="173" width="323.0769230769231" height="47" fill="#ffffff"/><text x="560.9230769230769" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Faking or exaggerating illness</text><line x1="30" y1="220" x2="870" y2="220" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="220" width="193.84615384615384" height="68" fill="#dce9e7"/><text x="44" y="246.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Motive</text><rect x="223.84615384615384" y="220" width="323.0769230769231" height="68" fill="#f8faf9"/><text x="237.84615384615384" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Medical attention and the sick role</text><rect x="546.9230769230769" y="220" width="323.0769230769231" height="68" fill="#f8faf9"/><text x="560.9230769230769" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An external reward: money, time off</text><text x="560.9230769230769" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work, avoiding duty</text><line x1="30" y1="288" x2="870" y2="288" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="288" width="193.84615384615384" height="47" fill="#dce9e7"/><text x="44" y="314.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Awareness of motive</text><rect x="223.84615384615384" y="288" width="323.0769230769231" height="47" fill="#ffffff"/><text x="237.84615384615384" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Internal; not about obvious gain</text><rect x="546.9230769230769" y="288" width="323.0769230769231" height="47" fill="#ffffff"/><text x="560.9230769230769" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deliberate and goal-directed</text></g><line x1="223.84615384615384" y1="124" x2="223.84615384615384" y2="335" stroke="#c9d6d4" stroke-width="1.5"/><line x1="546.9230769230769" y1="124" x2="546.9230769230769" y2="335" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="211" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="373" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">DIAGNOSING MUNCHAUSEN SYNDROME (NAMED BY ASHER, 1951)</text><rect x="30" y="395" width="413" height="188" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="427" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ESSENTIAL FEATURES</text><text x="50" y="458.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Repeated feigned or self-induced illness</text><text x="50" y="483.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="483.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pathological lying</text><text x="50" y="508.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="508.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Moving from hospital to hospital</text><rect x="457" y="395" width="413" height="188" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="427" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPPORTING FEATURES</text><text x="477" y="458.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Extensive medical knowledge</text><text x="477" y="483.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="483.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many scars from previous procedures</text><text x="477" y="508.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="508.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aggressive or evasive when challenged</text><text x="477" y="533.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Self-discharge against advice</text><text x="477" y="558.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="558.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Few visitors</text><rect x="30" y="605" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="639.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Aleem and Ajarim (1995): a case report</text><text x="50" y="668.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rich detail about a rare condition, but cannot be generalised and relies on records the patient may have</text><text x="50" y="689.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">falsified.</text>
</svg>