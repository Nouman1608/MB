<rect width="900" height="516" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Safer et al. (1979): three stages of delay</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Interviews with patients waiting at clinics</text>
<line x1="60" y1="194" x2="840" y2="194" stroke="#1e2a44" stroke-width="4"/><circle cx="60" cy="194" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="168" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Notice a symptom</text><circle cx="320" cy="194" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="320" y="168" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Decide I am ill</text><circle cx="580" cy="194" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="580" y="168" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Decide to seek care</text><circle cx="840" cy="194" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="840" y="168" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Attend</text><rect x="76" y="220" width="228" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="190" y="248" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Appraisal delay</text><rect x="336" y="220" width="228" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="248" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Illness delay</text><rect x="596" y="220" width="228" height="44" rx="22" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="710" y="248" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Utilisation delay</text><rect x="30" y="296" width="270.6666666666667" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Appraisal</text><text x="50" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time to decide a symptom</text><text x="50" y="379.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">means illness</text><rect x="314.6666666666667" y="296" width="270.6666666666667" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Illness</text><text x="334.6666666666667" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from deciding one is ill to</text><text x="334.6666666666667" y="379.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">deciding to seek care</text><rect x="599.3333333333334" y="296" width="270.6666666666667" height="108" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="619.3333333333334" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Utilisation</text><text x="619.3333333333334" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from deciding to seek care to</text><text x="619.3333333333334" y="379.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">actually attending</text><rect x="30" y="426" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="459.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Interviews give detailed qualitative reasons but rely on accurate memory of past events.</text>
