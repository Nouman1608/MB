<rect width="900" height="883" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The question word sets the answer form</text>

<rect x="30" y="110" width="840" height="743" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="284" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Question word</text><text x="316" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Meaning</text><line x1="300" y1="110" x2="300" y2="853" stroke="#c9d6d4" stroke-width="2"/><text x="516" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Your answer must be</text><line x1="500" y1="110" x2="500" y2="853" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="212.25" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کب&#x200F;</text><text x="316" y="203.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">when</text><text x="516" y="203.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a day, date or time</text><line x1="30" y1="237" x2="870" y2="237" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="289.25" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کتنے دن / کتنے عرصے&#x200F;</text><text x="316" y="280.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">for how long</text><text x="516" y="280.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a duration, sometimes worked out</text><line x1="30" y1="314" x2="870" y2="314" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="366.25" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کہاں / کس جگہ&#x200F;</text><text x="316" y="357.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">where</text><text x="516" y="357.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a place</text><line x1="30" y1="391" x2="870" y2="391" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="443.25" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کتنا / کتنے / کتنی&#x200F;</text><text x="316" y="422.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">how much, how</text><text x="316" y="445.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">many</text><text x="516" y="434.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a number or amount</text><line x1="30" y1="468" x2="870" y2="468" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="520.25" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کون / کس نے&#x200F;</text><text x="316" y="511.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">who</text><text x="516" y="511.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a person or group</text><line x1="30" y1="545" x2="870" y2="545" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="597.25" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیا&#x200F;</text><text x="316" y="588.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">what</text><text x="516" y="588.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a thing or an action</text><line x1="30" y1="622" x2="870" y2="622" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="674.25" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیسے / کس طرح&#x200F;</text><text x="316" y="665.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">how</text><text x="516" y="665.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a method or means</text><line x1="30" y1="699" x2="870" y2="699" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="751.25" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیوں&#x200F;</text><text x="316" y="742.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">why</text><text x="516" y="742.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a reason</text><line x1="30" y1="776" x2="870" y2="776" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="828.25" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کس مقصد کے لیے&#x200F;</text><text x="316" y="819.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">for what purpose</text><text x="516" y="819.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the gist of the whole text</text>
</svg>