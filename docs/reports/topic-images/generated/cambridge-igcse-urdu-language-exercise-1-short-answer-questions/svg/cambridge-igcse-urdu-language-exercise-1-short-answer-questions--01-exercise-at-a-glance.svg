<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exercise 1 at a glance</text>

<rect x="30" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="127.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">8 marks</text><text x="127.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of the 60 on Paper</text><text x="127.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">1</text><rect x="245" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1 short text</text><text x="342.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">printed in the</text><text x="342.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">question paper</text><rect x="460" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="557.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Word or phrase</text><text x="557.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">each answer,</text><text x="557.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">written in Urdu</text><rect x="675" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="772.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">10-12 min</text><text x="772.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a reasonable time</text><text x="772.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">target</text><text x="450" y="290" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">All four reading objectives are tested</text><rect x="30" y="312" width="195" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="127.5" y="352.4" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">R1</text><text x="127.5" y="383.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Identify and</text><text x="127.5" y="405.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">select relevant</text><text x="127.5" y="427.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">information</text><rect x="245" y="312" width="195" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342.5" y="352.4" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">R2</text><text x="342.5" y="383.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Understand ideas,</text><text x="342.5" y="405.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">opinions and</text><text x="342.5" y="427.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">attitudes</text><rect x="460" y="312" width="195" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="557.5" y="352.4" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">R3</text><text x="557.5" y="383.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Understand the</text><text x="557.5" y="405.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">connections</text><text x="557.5" y="427.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">between them</text><rect x="675" y="312" width="195" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="772.5" y="352.4" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">R4</text><text x="772.5" y="383.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Understand what is</text><text x="772.5" y="405.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">implied: gist or</text><text x="772.5" y="427.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the writer's</text><text x="772.5" y="449.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">purpose</text><rect x="30" y="490" width="840" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="527" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Most questions are R1 detail questions</text><text x="54" y="557" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One or two ask why, how or for what purpose. No dictionaries; everything is in Urdu.</text>
