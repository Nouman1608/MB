<rect width="900" height="793.6" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Layout clues and the questions they invite</text>

<rect x="30" y="110" width="840" height="449.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Text type</text><text x="256" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Layout clues</text><line x1="240" y1="110" x2="240" y2="559.6" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Typical questions</text><line x1="540" y1="110" x2="540" y2="559.6" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="201.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Advertisement</text><text x="256" y="201.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">bold headline, prices, offers</text><text x="854" y="204.79999999999998" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">کتنے پیسے؟ کیا فائدہ؟</text><line x1="30" y1="234" x2="870" y2="234" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="275.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Leaflet / brochure</text><text x="256" y="264.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">headings, bullet points,</text><text x="256" y="287.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">opening times</text><text x="854" y="278.8" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">کب؟ کہاں؟ کس کے لیے؟</text><line x1="30" y1="308" x2="870" y2="308" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="349.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Guide</text><text x="256" y="349.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">places, directions, advice</text><text x="854" y="352.8" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">کہاں؟ کیسے پہنچیں؟</text><line x1="30" y1="382" x2="870" y2="382" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="426.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Instructions /</text><text x="46" y="449.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">manual</text><text x="256" y="426.95" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">numbered steps, polite</text><text x="256" y="449.95" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">imperatives</text><text x="854" y="417.1" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">پہلے کیا کرنا ہے؟</text><text x="854" y="466.1" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">کس بات سے بچنا ہے؟</text><line x1="30" y1="485.6" x2="870" y2="485.6" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="527.25" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Report / article</text><text x="256" y="515.75" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">headline, then who, what,</text><text x="256" y="538.75" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">where, when in the first lines</text><text x="854" y="530.4" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">کیا ہوا؟ کس نے کہا؟ کیوں؟</text><text x="450" y="593.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Spotting a rule or a step in instructions</text><rect x="30" y="613.6" width="410" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="647.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Polite imperative ending</text><text x="420" y="647.6" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">ـیے</text><text x="420" y="725.6" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">رکھیے، بھریے، کیجیے</text><rect x="460" y="613.6" width="410" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="647.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Negative</text><text x="850" y="647.6" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">نہ</text><text x="850" y="725.6" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">فلیش استعمال نہ کریں</text>
</svg>