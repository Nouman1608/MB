<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 847" width="900" height="847" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="847" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Layout clues and the questions they invite</text>

<rect x="30" y="110" width="840" height="503.00000000000006" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Text type</text><text x="256" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Layout clues</text><line x1="240" y1="110" x2="240" y2="613" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Typical questions</text><line x1="540" y1="110" x2="540" y2="613" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="204.45000000000002" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Advertisement</text><text x="256" y="204.45000000000002" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">bold headline, prices, offers</text><text x="854" y="214.1" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کتنے پیسے؟ کیا فائدہ؟&#x200F;</text><line x1="30" y1="239.60000000000002" x2="870" y2="239.60000000000002" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="284.05" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Leaflet / brochure</text><text x="256" y="272.55" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">headings, bullet points,</text><text x="256" y="295.55" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">opening times</text><text x="854" y="293.70000000000005" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کب؟ کہاں؟ کس کے لیے؟&#x200F;</text><line x1="30" y1="319.20000000000005" x2="870" y2="319.20000000000005" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="363.65000000000003" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Guide</text><text x="256" y="363.65000000000003" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">places, directions, advice</text><text x="854" y="373.30000000000007" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کہاں؟ کیسے پہنچیں؟&#x200F;</text><line x1="30" y1="398.80000000000007" x2="870" y2="398.80000000000007" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="459.25000000000006" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Instructions /</text><text x="46" y="482.25000000000006" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">manual</text><text x="256" y="459.25000000000006" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">numbered steps, polite</text><text x="256" y="482.25000000000006" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">imperatives</text><text x="854" y="452.9000000000001" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پہلے کیا کرنا ہے؟&#x200F;</text><text x="854" y="507.9000000000001" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کس بات سے بچنا ہے؟&#x200F;</text><line x1="30" y1="533.4000000000001" x2="870" y2="533.4000000000001" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="577.85" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Report / article</text><text x="256" y="566.35" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">headline, then who, what,</text><text x="256" y="589.35" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">where, when in the first lines</text><text x="854" y="587.5000000000001" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیا ہوا؟ کس نے کہا؟ کیوں؟&#x200F;</text><text x="450" y="647" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Spotting a rule or a step in instructions</text><rect x="30" y="667" width="410" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="701" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Polite imperative ending</text><text x="420" y="709" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ـیے&#x200F;</text><text x="420" y="779" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;رکھیے، بھریے، کیجیے&#x200F;</text><rect x="460" y="667" width="410" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="701" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Negative</text><text x="850" y="709" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نہ&#x200F;</text><text x="850" y="779" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;فلیش استعمال نہ کریں&#x200F;</text>
</svg>