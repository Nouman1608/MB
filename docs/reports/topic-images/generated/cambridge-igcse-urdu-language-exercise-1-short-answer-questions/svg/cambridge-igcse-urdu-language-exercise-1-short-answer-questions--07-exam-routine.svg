<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" width="900" height="940" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="940" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A six-step routine for 10-12 minutes</text>

<rect x="30" y="110" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="165" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="173.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Look at the layout (20 seconds)</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Headline, headings, bullet points: what kind of text, and where each type of</text><text x="122" y="199" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">information sits.</text><rect x="30" y="230" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="285" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="293.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read all the questions</text><text x="122" y="296" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Underline each question word and predict the answer form: time, place, number,</text><text x="122" y="319" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reason or purpose.</text><rect x="30" y="350" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="396" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="404.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="388" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Scan, then read around</text><text x="122" y="416" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Find each key word, then read its whole sentence and the next one for qualifiers.</text><rect x="30" y="452" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="507" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="515.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="490" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Answer in order</text><text x="122" y="518" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Answers usually follow the order of the text, so the next answer shows roughly</text><text x="122" y="541" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">where a missing one sits.</text><rect x="30" y="572" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="618" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="626.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="610" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gist question last</text><text x="122" y="638" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">You understand the purpose better once the detail questions are done.</text><rect x="30" y="674" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="720" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="728.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="122" y="712" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Check the form</text><text x="122" y="740" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Each answer has the form its question word asked for.</text><rect x="30" y="790" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="826" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The rubric: treat it literally</text><text x="850" y="872" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ایک لفظ یا مختصر فقرے میں جواب دیجیے&#x200F;</text><text x="54" y="882" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">answer in one word or a short phrase</text>
</svg>