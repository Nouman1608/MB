<rect width="900" height="668" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When or for how long?</text>

<rect x="30" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="420" y="182" font-size="30" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کب&#x200F;</text><text x="50" y="162" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">when</text><text x="50" y="218" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">wants a point in time</text><rect x="50" y="240" width="370" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="76" y="292" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="405" y="292" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چھٹی کے بعد&#x200F;</text><text x="100" y="290" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">after the holiday</text><rect x="50" y="338" width="370" height="84" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="76" y="390" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="405" y="390" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چھ مہینے&#x200F;</text><text x="100" y="388" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">a length of time</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="850" y="182" font-size="30" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کتنے دن&#x200F;</text><text x="480" y="162" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">for how long</text><text x="480" y="218" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">wants a duration</text><rect x="480" y="240" width="370" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="506" y="292" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="835" y="292" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چھ مہینے&#x200F;</text><text x="530" y="290" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">six months</text><rect x="480" y="338" width="370" height="84" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="506" y="390" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="835" y="390" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چھٹی کے بعد&#x200F;</text><text x="530" y="388" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">a point in time</text><rect x="30" y="465" width="840" height="175" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="500" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A duration may need working out</text><text x="54" y="528" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A fair "from the 15th to the 19th": the text never says how many days.</text><rect x="70" y="550" width="76" height="66" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="108" y="592" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">15th</text><rect x="162" y="550" width="76" height="66" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="200" y="592" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">16th</text><rect x="254" y="550" width="76" height="66" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="292" y="592" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">17th</text><rect x="346" y="550" width="76" height="66" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="384" y="592" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">18th</text><rect x="438" y="550" width="76" height="66" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="476" y="592" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">19th</text><line x1="540" y1="583" x2="600" y2="583" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="615" y="592" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="start">five days</text>
</svg>