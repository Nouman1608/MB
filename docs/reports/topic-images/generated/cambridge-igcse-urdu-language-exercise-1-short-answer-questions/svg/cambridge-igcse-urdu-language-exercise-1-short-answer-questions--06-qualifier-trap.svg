<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The qualifier trap</text>

<rect x="30" y="110" width="840" height="125" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="145" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Question B</text><text x="850" y="176" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ایک چار سال کے بچے کے ٹکٹ کی قیمت کیا ہے؟&#x200F;</text><text x="54" y="215" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">What does a ticket for a four-year-old cost?</text><rect x="30" y="255" width="840" height="235" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="288" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">In the leaflet</text><text x="850" y="330" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بڑوں کے لیے 200 روپے، بچوں کے لیے 50 روپے۔&#x200F;</text><text x="54" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">adults 200 rupees, children 50 rupees</text><rect x="42" y="378" width="816" height="100" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="846" y="432" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پانچ سال سے کم عمر بچوں کا داخلہ مفت ہے۔&#x200F;</text><text x="56" y="465" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start" font-style="italic">entry is free for children under five</text><rect x="30" y="510" width="410" height="120" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="66" y="565" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="96" y="550" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Obvious but wrong</text><text x="420" y="605" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;50 روپے&#x200F;</text><text x="96" y="610" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ignores the condition</text><rect x="460" y="510" width="410" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="496" y="565" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="526" y="550" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Correct</text><text x="850" y="605" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مفت&#x200F;</text><text x="526" y="610" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">free: the qualifier applies</text><text x="450" y="672" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Words that limit or change a rule: read the next sentence too</text><rect x="745" y="692" width="78" height="82" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="784" y="748" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;صرف&#x200F;</text><rect x="612" y="692" width="123" height="82" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="673.5" y="748" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کم از کم&#x200F;</text><rect x="504" y="692" width="98" height="82" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="553" y="748" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;سے کم&#x200F;</text><rect x="371" y="692" width="123" height="82" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="432.5" y="748" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کے علاوہ&#x200F;</text><rect x="283" y="692" width="78" height="82" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="322" y="748" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;مگر&#x200F;</text><rect x="185" y="692" width="88" height="82" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="229" y="748" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;البتہ&#x200F;</text><rect x="77" y="692" width="98" height="82" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="126" y="748" font-size="25" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;سوائے&#x200F;</text>
</svg>