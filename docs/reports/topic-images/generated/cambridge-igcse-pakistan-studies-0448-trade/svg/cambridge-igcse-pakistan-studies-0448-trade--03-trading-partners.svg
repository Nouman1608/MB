<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Trading partners and the goods traded</text>

<rect x="30" y="104" width="250" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Partner (region)</text><rect x="280" y="104" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="292" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pakistan exports</text><rect x="580" y="104" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="592" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pakistan imports</text><rect x="30" y="150" width="250" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">USA</text><rect x="280" y="150" width="300" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Textiles, garments, bed linen</text><rect x="580" y="150" width="290" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Machinery, cotton, chemicals</text><rect x="30" y="193" width="250" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="218.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">China</text><rect x="280" y="193" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="218.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cotton yarn, rice, seafood</text><rect x="580" y="193" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="218.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Machinery, electronics,</text><text x="592" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">chemicals, steel</text><rect x="30" y="257" width="250" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="282.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">UAE (the Gulf)</text><rect x="280" y="257" width="300" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="282.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rice, textiles, food</text><rect x="580" y="257" width="290" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="282.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Petroleum products</text><rect x="30" y="300" width="250" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="325.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Saudi Arabia and Kuwait</text><text x="42" y="346.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(the Gulf)</text><rect x="280" y="300" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="325.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rice, textiles, food</text><rect x="580" y="300" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="325.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Crude oil and petroleum products</text><rect x="30" y="364" width="250" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="389.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">UK and EU countries</text><rect x="280" y="364" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="389.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Textiles, bed linen, leather,</text><text x="292" y="410.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rice, sports goods</text><rect x="580" y="364" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="389.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Machinery, chemicals, medicines</text><rect x="30" y="428" width="250" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="453.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Afghanistan (neighbour)</text><rect x="280" y="428" width="300" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="453.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Food, cement, medicines,</text><text x="292" y="474.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">manufactured goods</text><rect x="580" y="428" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="453.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fruit, coal</text><rect x="30" y="492" width="250" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="517.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Malaysia and Indonesia</text><rect x="280" y="492" width="300" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="517.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rice, textiles</text><rect x="580" y="492" width="290" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="517.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Palm oil</text><rect x="30" y="553" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="586.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rankings change from year to year: learn the pattern, and give the region as well as the</text><text x="50" y="608.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">country.</text>
