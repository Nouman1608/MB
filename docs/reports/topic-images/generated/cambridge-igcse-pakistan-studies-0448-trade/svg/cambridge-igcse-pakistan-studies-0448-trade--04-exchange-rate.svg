<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 528" width="900" height="528" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="528" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A falling rupee: exports cheaper, imports dearer</text>

<rect x="30" y="104" width="840" height="86" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">INVENTED FIGURES</text><text x="450" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Exchange rate falls from Rs 160 to Rs 200 per US dollar</text><rect x="30" y="208" width="408" height="192" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="241" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPORT</text><text x="50" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pakistani shirt, Rs 1,600</text><text x="50" y="297.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Before: 1,600 ÷ 160 = $10</text><text x="50" y="325.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">After: 1,600 ÷ 200 = $8</text><text x="50" y="353.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cheaper for a US buyer: may win orders</text><rect x="462" y="208" width="408" height="192" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="241" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">IMPORT</text><text x="482" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Oil at $80 a barrel</text><text x="482" y="297.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Before: 80 × 160 = Rs 12,800</text><text x="482" y="325.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">After: 80 × 200 = Rs 16,000</text><text x="482" y="353.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Dearer at home: fuel and machinery cost</text><text x="482" y="375.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">more</text><rect x="30" y="418" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="451.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Exporters also import inputs such as dyes and machinery, so part of the benefit is lost. A</text><text x="50" y="473.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">falling rupee often makes the deficit worse in the short term.</text>
</svg>