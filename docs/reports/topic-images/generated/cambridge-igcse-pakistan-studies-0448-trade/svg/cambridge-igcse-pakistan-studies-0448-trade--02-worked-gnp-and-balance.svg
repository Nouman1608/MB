<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: GNP and the balance of trade</text>

<rect x="30" y="110" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">INVENTED FIGURES</text><text x="450" y="168.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Country X: for practice only, not Pakistan</text><text x="30" y="234" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">GNP</text><rect x="30" y="242" width="190" height="78" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">GDP</text><text x="125" y="302" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">$300 bn</text><text x="238" y="290" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="256" y="242" width="190" height="78" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="351" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">earned abroad</text><text x="351" y="302" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">$25 bn</text><text x="464" y="290" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">−</text><rect x="482" y="242" width="190" height="78" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="577" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">paid to foreign owners</text><text x="577" y="302" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">$7 bn</text><text x="690" y="290" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="708" y="242" width="162" height="78" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="789" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">GNP</text><text x="789" y="302" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">$318 bn</text><text x="30" y="364" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Balance of trade = exports − imports</text><rect x="30" y="378" width="436.3636363636364" height="44" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="44" y="407" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Exports $30 bn</text><rect x="466.3636363636364" y="378" width="363.6363636363636" height="44" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="648.1818181818181" y="407" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">deficit −$25 bn</text><rect x="30" y="432" width="800" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="44" y="461" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Imports $55 bn</text><rect x="30" y="496" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="532" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Effect on the economy</text><text x="50" y="561.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A persistent deficit means borrowing or relying on money sent home by workers abroad,</text><text x="50" y="583.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">growing foreign debt, pressure on the currency and less money for schools and hospitals.</text>
</svg>