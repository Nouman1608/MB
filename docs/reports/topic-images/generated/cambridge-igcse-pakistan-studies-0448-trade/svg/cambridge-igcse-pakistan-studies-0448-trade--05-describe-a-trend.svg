<line x1="62" y1="124" x2="62" y2="378" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Overall trend first</text><text x="128" y="169.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What is the overall pattern across the whole resource?</text><circle cx="62" cy="149" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="157.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="206" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="242" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Highest and lowest values, with years</text><text x="128" y="271.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Quote the figures from the resource.</text><circle cx="62" cy="251" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="259.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="308" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="344" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Any change in direction</text><text x="128" y="373.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Where the trend turns, and when.</text><circle cx="62" cy="353" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="361.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="416" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="449.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No exact trade figures are required from memory, but you must interpret any figures given</text><text x="50" y="471.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">in the question.</text>
