<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 593" width="900" height="593" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="593" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From raw cotton to a shirt: adding value</text>

<rect x="30" y="224" width="180" height="90" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="260.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Raw cotton</text><text x="120" y="288" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">bale</text><line x1="214" y1="254" x2="246" y2="254" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="194" width="180" height="120" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="340" y="245.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cotton yarn</text><text x="340" y="273" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">spun</text><line x1="434" y1="239" x2="466" y2="239" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="164" width="180" height="150" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="560" y="230.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cloth</text><text x="560" y="258" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">woven or knitted</text><line x1="654" y1="224" x2="686" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="134" width="180" height="180" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="193.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Finished</text><text x="780" y="217.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">garments</text><text x="780" y="245" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">bed linen, towels,</text><text x="780" y="265" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">shirts</text><line x1="60" y1="354" x2="840" y2="354" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="450" y="384" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">each stage adds value: the same cotton earns more as a shirt than as a bale</text><rect x="30" y="412" width="268" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="447.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Types</text><text x="50" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A shift from raw materials</text><text x="50" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">towards processed and</text><text x="50" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">manufactured goods</text><rect x="316" y="412" width="268" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="447.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Amounts and value</text><text x="336" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exports and imports both</text><text x="336" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grown; imports usually</text><text x="336" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">faster (fuel, machinery,</text><text x="336" y="538.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">food)</text><rect x="602" y="412" width="268" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="447.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Concentration</text><text x="622" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Textiles still a large</text><text x="622" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">share: dependence on one</text><text x="622" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">industry</text>
</svg>