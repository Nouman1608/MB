<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 517" width="900" height="517" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="517" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One late train, four tones</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Same facts; different words, different attitude</text>
<rect x="30" y="122" width="840" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="154.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Chain for reading tone: <tspan font-weight="700">word</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">connotation</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">attitude</tspan> <tspan font-weight="700">→</tspan> <tspan font-weight="700">purpose</tspan></text><rect x="170" y="192" width="500" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="184" y="227.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The 8:10 train <tspan font-weight="700">arrived</tspan> at 8:50.”</text><text x="30" y="229" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Neutral</text><line x1="674" y1="222" x2="700" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="710" y="228" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">detached,</tspan> <tspan font-style="italic">factual</tspan></text><rect x="170" y="264" width="500" height="66.24000000000001" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="184" y="291.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The 8:10 train <tspan font-weight="700">limped</tspan> in at 8:50, <tspan font-weight="700">yet</tspan> <tspan font-weight="700">again</tspan>, with <tspan font-weight="700">no</tspan></text><text x="184" y="312.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">apology</tspan>.”</text><text x="30" y="304.12" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Indignant</text><line x1="674" y1="297.12" x2="700" y2="297.12" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="710" y="303.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">indignant,</tspan> <tspan font-style="italic">accusing</tspan></text><rect x="170" y="342.24" width="500" height="66.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="184" y="369.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The 8:10 train <tspan font-weight="700">graciously</tspan> joined us at 8:50, <tspan font-weight="700">having</tspan></text><text x="184" y="390.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">evidently</tspan> found better things to do.”</text><text x="30" y="382.36" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Wry</text><line x1="674" y1="375.36" x2="700" y2="375.36" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="710" y="381.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">wry,</tspan> <tspan font-style="italic">mock-polite</tspan></text><rect x="170" y="420.48" width="500" height="66.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="184" y="448.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The 8:10 train arrived at 8:50, <tspan font-weight="700">as</tspan> <tspan font-weight="700">it</tspan> <tspan font-weight="700">does</tspan>, and we <tspan font-weight="700">filed</tspan> on,</text><text x="184" y="469.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">used</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">it</tspan>.”</text><text x="30" y="460.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Resigned</text><line x1="674" y1="453.6" x2="700" y2="453.6" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="710" y="459.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">weary,</tspan> <tspan font-style="italic">resigned</tspan></text>
</svg>