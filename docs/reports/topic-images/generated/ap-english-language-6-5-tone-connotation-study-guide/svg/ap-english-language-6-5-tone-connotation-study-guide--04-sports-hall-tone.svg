<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading tone from word choice</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: the new sports hall</text>
<rect x="30" y="128" width="411.62865999999997" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="235.81432999999998" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The new sports hall was opened last week by a</text><rect x="447.62865999999997" y="128" width="160.83293" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="528.045125" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">visiting dignitary,</text><text x="528.045125" y="184.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">mock-formal:</text><text x="528.045125" y="202.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">pomposity</text><rect x="614.46159" y="128" width="55.17759" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="642.050385" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">who</text><rect x="675.63918" y="128" width="120" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="735.63918" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">cut a ribbon</text><text x="735.63918" y="184.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">a routine</text><text x="735.63918" y="202.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">gesture</text><rect x="801.63918" y="128" width="50.90515" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="827.091755" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and</text><rect x="30" y="231.6" width="213.20534" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="136.60267" y="255.04999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">spoke for forty minutes</text><text x="136.60267" y="288.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">tedium</text><rect x="249.20534" y="231.6" width="67.13692" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="282.7738" y="255.04999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">about</text><rect x="322.34226" y="231.6" width="120" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="382.34226" y="255.04999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“legacy”.</text><text x="382.34226" y="288.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">doubted, in</text><text x="382.34226" y="306.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">quotation</text><text x="382.34226" y="324.70000000000005" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">marks</text><rect x="30" y="353.5" width="568.5883" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="314.29415" y="376.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The hall has a leaking roof, and the changing rooms are not ready.</text><rect x="604.5883" y="353.5" width="263.82675000000006" height="35" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="736.501675" y="376.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Still, the buffet was excellent.</text><text x="736.501675" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">deflating anticlimax</text><rect x="30" y="444.8" width="408" height="125.75999999999999" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="48" y="478.8" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Tone</text><text x="48" y="506.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">wry and sceptical; mildly mocking, not bitter</text><rect x="462" y="444.8" width="408" height="125.75999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="480" y="478.8" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Purpose</text><text x="480" y="506.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">invites readers to doubt a showy opening that</text><text x="480" y="527.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">hides unfinished work, more persuasively than</text><text x="480" y="549.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a plain complaint</text>
</svg>