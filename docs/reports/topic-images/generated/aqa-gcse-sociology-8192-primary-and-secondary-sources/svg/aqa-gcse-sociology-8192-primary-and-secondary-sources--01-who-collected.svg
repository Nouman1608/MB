<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621" width="900" height="621" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="621" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Primary or secondary? It depends who collected it</text>

<circle cx="140" cy="215.8" r="11.16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M122,250 Q122,228.4 140,228.4 Q158,228.4 158,250 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="140" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Researcher A</text><text x="140" y="306" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">carries out the interview</text><path d="M405,150 L475,150 L495,170 L495,260 L405,260 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="419" y1="180" x2="481" y2="180" stroke="#4a5568" stroke-width="2"/><line x1="419" y1="200" x2="481" y2="200" stroke="#4a5568" stroke-width="2"/><line x1="419" y1="220" x2="481" y2="220" stroke="#4a5568" stroke-width="2"/><line x1="419" y1="240" x2="481" y2="240" stroke="#4a5568" stroke-width="2"/><text x="450" y="290" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Interview transcript</text><circle cx="760" cy="215.8" r="11.16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M742,250 Q742,228.4 760,228.4 Q778,228.4 778,250 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="760" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Researcher B</text><text x="760" y="306" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">reads it years later</text><line x1="190" y1="200" x2="395" y2="200" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="505" y1="200" x2="712" y2="200" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><rect x="215" y="140" width="150" height="40" rx="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="290" y="166" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">PRIMARY</text><rect x="535" y="140" width="150" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="610" y="166" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">SECONDARY</text><rect x="30" y="340" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,390 L31.25,354.25 Q31.25,341.25 44.25,341.25 L427.75,341.25 Q440.75,341.25 440.75,354.25 L440.75,390 Z" fill="#b5d3cf"/><line x1="31.25" y1="390" x2="440.75" y2="390" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="371" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary data</text><text x="44" y="422.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Collected first-hand by the researcher, for</text><text x="44" y="444.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">their own study</text><rect x="458" y="340" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,390 L459.25,354.25 Q459.25,341.25 472.25,341.25 L855.75,341.25 Q868.75,341.25 868.75,354.25 L868.75,390 Z" fill="#f2e7b8"/><line x1="459.25" y1="390" x2="868.75" y2="390" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="371" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary data</text><text x="472" y="422.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Already exist: produced by someone else,</text><text x="472" y="444.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">usually for a different purpose</text><rect x="30" y="486" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="522" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The test</text><text x="56" y="551" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ask who collected the data and why, not what type of data it is. Official statistics are</text><text x="56" y="573" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">secondary data for any sociologist who uses them.</text>
</svg>