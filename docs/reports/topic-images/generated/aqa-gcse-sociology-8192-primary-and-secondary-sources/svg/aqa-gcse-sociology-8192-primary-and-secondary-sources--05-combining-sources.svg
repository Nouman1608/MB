<rect width="900" height="464" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Combining sources</text>

<rect x="30" y="118" width="246.66666666666666" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="150.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary first</text><text x="153.33333333333331" y="180.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Shows what is already</text><text x="153.33333333333331" y="202.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">known and helps design the</text><text x="153.33333333333331" y="224.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">study</text><line x1="280.66666666666663" y1="183" x2="322.66666666666663" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="118" width="246.66666666666666" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="161.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary fills the gap</text><text x="449.99999999999994" y="191.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">New research on what is</text><text x="449.99999999999994" y="213.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">not yet known</text><line x1="577.3333333333333" y1="183" x2="619.3333333333333" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="118" width="246.66666666666666" height="130" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="161.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Triangulation</text><text x="746.6666666666666" y="191.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Compare primary findings</text><text x="746.6666666666666" y="213.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">with secondary data</text><text x="450" y="294" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Example: why are some pupils excluded from school?</text><rect x="30" y="312" width="390" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,384 L31.25,326.25 Q31.25,313.25 44.25,313.25 L405.75,313.25 Q418.75,313.25 418.75,326.25 L418.75,384 Z" fill="#f2e7b8"/><line x1="31.25" y1="384" x2="418.75" y2="384" stroke="#c9d6d4" stroke-width="2"/><text x="225" y="353.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Official exclusion figures</text><text x="44" y="416.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Which groups are most affected?</text><rect x="480" y="312" width="390" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M481.25,384 L481.25,326.25 Q481.25,313.25 494.25,313.25 L855.75,313.25 Q868.75,313.25 868.75,326.25 L868.75,384 Z" fill="#b5d3cf"/><line x1="481.25" y1="384" x2="868.75" y2="384" stroke="#c9d6d4" stroke-width="2"/><text x="675" y="341.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interviews with excluded pupils</text><text x="675" y="366.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">and parents</text><text x="494" y="416.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What are the reasons?</text><line x1="424" y1="376" x2="474" y2="376" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/>
</svg>