<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 669" width="900" height="669" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="669" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Primary and secondary data compared</text>

<rect x="30" y="104" width="404" height="410" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Questionnaires, interviews, focus groups,</text><text x="48" y="211.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">observation</text><circle cx="53" cy="236.79" r="4.5" fill="#2e6b62"/><text x="66" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Fit the research aim exactly</text><circle cx="53" cy="266.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="272.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Researcher knows how they were</text><text x="66" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">collected</text><circle cx="53" cy="318.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="324.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Up to date; researcher controls the</text><text x="66" y="346.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sample</text><circle cx="53" cy="370.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="376.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Take time and cost money</text><circle cx="53" cy="400.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="406.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Access to some groups is difficult</text><circle cx="53" cy="430.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="436.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Ethical issues managed directly</text><circle cx="53" cy="460.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="466.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Cannot usually reach the past</text><rect x="466" y="104" width="404" height="410" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><text x="484" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Statistics, previous research, documents,</text><text x="484" y="211.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">media</text><circle cx="489" cy="236.79" r="4.5" fill="#8a6d0d"/><text x="502" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Quick and cheap, often free</text><circle cx="489" cy="266.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="272.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Can cover very large groups</text><circle cx="489" cy="296.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="302.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> May be the only way to study the past</text><circle cx="489" cy="326.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="332.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Avoid some ethical problems; allow</text><text x="502" y="354.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">comparison over time (Devine)</text><circle cx="489" cy="378.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="384.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Collected for another purpose</text><circle cx="489" cy="408.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="414.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Definitions may differ (Townsend and</text><text x="502" y="436.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the state standard)</text><circle cx="489" cy="460.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="466.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> May be biased, incomplete or out of</text><text x="502" y="488.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">date</text><circle cx="450" cy="309" r="24" fill="#1e2a44"/><text x="450" y="316" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="532" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="568" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common mistake</text><text x="56" y="597" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Secondary data are not automatically less reliable than primary data: it depends on the</text><text x="56" y="619" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">source.</text>
</svg>