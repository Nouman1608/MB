<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 543" width="900" height="543" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="543" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judging a document: four questions</text>

<rect x="30" y="104" width="412" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Is it genuine?</text><circle cx="64" cy="129" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="135.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="46" y="188.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Is it what it claims to be, written by the</text><text x="46" y="210.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">person it claims?</text><rect x="458" y="104" width="412" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Is it believable?</text><circle cx="492" cy="129" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="135.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="474" y="188.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Was the author sincere and accurate, or</text><text x="474" y="210.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">writing to impress, persuade or protect</text><text x="474" y="232.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">themselves?</text><rect x="30" y="272" width="412" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,322 L31.25,286.25 Q31.25,273.25 44.25,273.25 L427.75,273.25 Q440.75,273.25 440.75,286.25 L440.75,322 Z" fill="#f2e7b8"/><line x1="31.25" y1="322" x2="440.75" y2="322" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="303" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Is it typical?</text><circle cx="64" cy="297" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="303.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="46" y="356.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Does it represent a wider group, or just one</text><text x="46" y="378.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">person or organisation?</text><rect x="458" y="272" width="412" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,322 L459.25,286.25 Q459.25,273.25 472.25,273.25 L855.75,273.25 Q868.75,273.25 868.75,286.25 L868.75,322 Z" fill="#dce9e7"/><line x1="459.25" y1="322" x2="868.75" y2="322" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="303" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Is its meaning clear?</text><circle cx="492" cy="297" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="303.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="474" y="356.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Can the researcher understand what the author</text><text x="474" y="378.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">meant, especially in older texts or slang?</text><rect x="30" y="418" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="454" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example: a school’s published behaviour policy</text><text x="56" y="483" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Genuine and clear, but it may describe how the school wants to be seen rather than what</text><text x="56" y="505" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">actually happens in classrooms.</text>
</svg>