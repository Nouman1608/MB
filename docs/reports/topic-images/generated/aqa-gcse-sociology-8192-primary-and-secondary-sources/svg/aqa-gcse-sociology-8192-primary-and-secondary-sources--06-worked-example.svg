<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing sources: fathers and childcare</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Changes in how fathers take part in childcare over fifty years</text>
<rect x="40" y="224" width="560" height="24" fill="#f2e7b8"/><rect x="600" y="224" width="260" height="24" fill="#b5d3cf"/><line x1="40" y1="236" x2="868" y2="236" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="60" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fifty years ago</text><text x="860" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">today</text><rect x="30" y="120" width="560" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="50" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary sources reach the past</text><text x="50" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">primary research cannot reach fathers in the 1970s</text><rect x="610" y="120" width="260" height="80" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="626" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Primary research</text><text x="626" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interviews with fathers</text><rect x="30" y="292" width="269.3333333333333" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,342 L31.25,306.25 Q31.25,293.25 44.25,293.25 L285.0833333333333,293.25 Q298.0833333333333,293.25 298.0833333333333,306.25 L298.0833333333333,342 Z" fill="#f2e7b8"/><line x1="31.25" y1="342" x2="298.0833333333333" y2="342" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="322.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Earlier studies</text><text x="44" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Young and Willmott’s survey:</text><text x="44" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what was found at the time</text><rect x="315.3333333333333" y="292" width="269.3333333333333" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,342 L316.5833333333333,306.25 Q316.5833333333333,293.25 329.5833333333333,293.25 L570.4166666666666,293.25 Q583.4166666666666,293.25 583.4166666666666,306.25 L583.4166666666666,342 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="342" x2="583.4166666666666" y2="342" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="322.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Official statistics</text><text x="329.3333333333333" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Changes in mothers’ and</text><text x="329.3333333333333" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fathers’ employment</text><rect x="600.6666666666666" y="292" width="269.3333333333333" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,342 L601.9166666666666,306.25 Q601.9166666666666,293.25 614.9166666666666,293.25 L855.75,293.25 Q868.75,293.25 868.75,306.25 L868.75,342 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="342" x2="868.75" y2="342" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="322.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interviews today</text><text x="614.6666666666666" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How fathers see their role now</text><rect x="30" y="434" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="470" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recognise the limits</text><text x="56" y="499" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Earlier studies used different definitions and questions, so comparisons may not be exact:</text><text x="56" y="521" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the secondary data were collected for different purposes.</text>
</svg>