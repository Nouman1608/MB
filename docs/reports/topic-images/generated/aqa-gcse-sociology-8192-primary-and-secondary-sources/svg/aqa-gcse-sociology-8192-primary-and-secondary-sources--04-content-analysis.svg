<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 796" width="900" height="796" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="796" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Content analysis</text>

<rect x="30" y="108" width="404" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="432.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Quantitative</text><rect x="466" y="108" width="404" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,158 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="467.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Qualitative</text><text x="52" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Counting</tspan> how often something appears, using a</text><text x="52" y="209" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">coding sheet</text><rect x="60" y="250" width="344" height="150" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="60" y1="294" x2="404" y2="294" stroke="#1e2a44" stroke-width="2"/><line x1="274" y1="250" x2="274" y2="400" stroke="#1e2a44" stroke-width="2"/><line x1="60" y1="347" x2="404" y2="347" stroke="#c9d6d4" stroke-width="2"/><text x="167" y="279" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">In the advert</text><text x="339" y="279" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Tally</text><text x="72" y="326" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Man doing housework</text><text x="72" y="379" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Woman doing housework</text><text x="232" y="440" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. housework in television adverts</text><text x="488" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Examining meanings</tspan> and messages in the</text><text x="488" y="209" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">content</text><rect x="500" y="250" width="336" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="516" y="280" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">News report about young people</text><text x="516" y="312" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How are they described?</text><text x="516" y="338" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Which words are used?</text><text x="516" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What message is given?</text><text x="668" y="440" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. how news reports describe young people</text><rect x="30" y="490" width="412" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,540 L31.25,504.25 Q31.25,491.25 44.25,491.25 L427.75,491.25 Q440.75,491.25 440.75,504.25 L440.75,540 Z" fill="#dce9e7"/><line x1="31.25" y1="540" x2="440.75" y2="540" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="520.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Strengths</text><circle cx="49" cy="565.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="571.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Media content is easy to access</text><circle cx="49" cy="594.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="600.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A reusable coding sheet makes quantitative</text><text x="62" y="621.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">analysis fairly reliable</text><circle cx="49" cy="644.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="650.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reveals patterns in representation</text><rect x="458" y="490" width="412" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,540 L459.25,504.25 Q459.25,491.25 472.25,491.25 L855.75,491.25 Q868.75,491.25 868.75,504.25 L868.75,540 Z" fill="#dce9e7"/><line x1="459.25" y1="540" x2="868.75" y2="540" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="520.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Limitations</text><circle cx="477" cy="565.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="571.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deciding how to code involves judgement</text><circle cx="477" cy="594.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="600.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shows what is in the media, not how audiences</text><text x="490" y="621.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interpret it</text><rect x="30" y="690" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="726" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Based on secondary sources, but the counting and coding are the researcher’s own work, so it</text><text x="56" y="748" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">produces new primary findings.</text>
</svg>