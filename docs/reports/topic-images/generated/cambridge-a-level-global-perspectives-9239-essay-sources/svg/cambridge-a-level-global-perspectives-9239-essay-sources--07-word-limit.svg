<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 549" width="900" height="549" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="549" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">References and the word limit</text>

<rect x="30" y="120" width="410" height="200" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="56" y="166.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Not counted</text><text x="56" y="197.98000000000002" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• title</text><text x="56" y="223.06000000000003" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• references</text><text x="56" y="248.14000000000001" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• citations</text><rect x="460" y="120" width="410" height="200" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="486" y="166.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Counted (1750–2000 words)</text><text x="486" y="197.98000000000002" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• your argument</text><text x="486" y="223.06000000000003" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• evaluative clauses and sentences</text><text x="486" y="248.14000000000001" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">about sources</text><text x="235" y="298" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle" font-style="italic">full references cost you no words</text><text x="665" y="298" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle" font-style="italic">so plan for them</text><rect x="30" y="342" width="410" height="107" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="378.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Not realistic</text><text x="48" y="406.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A paragraph of evaluation for every source.</text><rect x="460" y="342" width="410" height="107" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="378.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Realistic</text><text x="478" y="406.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A sentence or two of evaluation for each key</text><text x="478" y="428.93" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">source.</text><rect x="30" y="469" width="840" height="51.120000000000005" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="499.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Quotations must be fully referenced, and the essay must include a list of sources used.</text>
</svg>