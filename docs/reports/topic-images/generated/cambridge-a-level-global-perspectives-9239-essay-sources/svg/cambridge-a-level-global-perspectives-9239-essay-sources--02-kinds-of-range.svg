<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three kinds of range</text>

<rect x="30" y="110" width="266" height="378.96000000000004" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="163" cy="160" r="34" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="163" cy="160" rx="14" ry="34" fill="none" stroke="#2e6b62" stroke-width="2"/><line x1="129" y1="160" x2="197" y2="160" stroke="#2e6b62" stroke-width="2"/><circle cx="145" cy="144" r="5.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><circle cx="179" cy="168" r="5.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><circle cx="157" cy="180" r="5.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><text x="163" y="230" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Geographical</text><text x="48" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More than one region,</text><text x="48" y="283.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">including places on</text><text x="48" y="304.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different sides of the</text><text x="48" y="325.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">issue.</text><line x1="48" y1="354.48" x2="278" y2="354.48" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="380.48" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">Globally contrasting</text><text x="48" y="401.6" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">perspectives are hard to</text><text x="48" y="422.72" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">build from sources written</text><text x="48" y="443.84000000000003" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">in one country.</text><rect x="317" y="110" width="266" height="378.96000000000004" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="403" y="130" width="22" height="60" rx="3" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><rect x="427" y="130" width="22" height="60" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><rect x="451" y="130" width="22" height="60" rx="3" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><rect x="475" y="130" width="22" height="60" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="230" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Type</text><text x="335" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A mix of academic research,</text><text x="335" y="283.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">official data, international</text><text x="335" y="304.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or non-governmental reports,</text><text x="335" y="325.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quality journalism or</text><text x="335" y="346.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">commentary.</text><line x1="335" y1="375.6" x2="565" y2="375.6" stroke="#c9d6d4" stroke-width="2"/><text x="335" y="401.6" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">Each type has different</text><text x="335" y="422.72" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">strengths; a mix lets one</text><text x="335" y="443.84000000000003" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">check another.</text><rect x="604" y="110" width="266" height="378.96000000000004" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="715" cy="156" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="759" cy="156" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><path d="M693,190 q22,-28 44,0 z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><path d="M737,190 q22,-28 44,0 z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="737" y="230" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Standpoint</text><text x="622" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Each perspective has at</text><text x="622" y="283.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">least one source that argues</text><text x="622" y="304.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for it in its own terms.</text><line x1="622" y1="333.36" x2="852" y2="333.36" stroke="#c9d6d4" stroke-width="2"/><text x="622" y="359.36" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">You can only evaluate a</text><text x="622" y="380.48" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">perspective fairly if you</text><text x="622" y="401.6" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">meet its strongest version.</text><rect x="30" y="510.96000000000004" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="546.96" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Range is not quantity</text><rect x="320" y="528.96" width="14" height="24" rx="2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="340" y="528.96" width="14" height="24" rx="2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="360" y="528.96" width="14" height="24" rx="2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="380" y="528.96" width="14" height="24" rx="2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="400" y="528.96" width="14" height="24" rx="2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><rect x="420" y="528.96" width="14" height="24" rx="2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="445" y="546.96" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">used and evaluated</text><text x="608" y="548.96" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">&gt;</text><rect x="632" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="647" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="662" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="677" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="692" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="707" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="722" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="737" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="752" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="767" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="782" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="797" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="812" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="827" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><rect x="842" y="528.96" width="11" height="24" rx="2" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/><text x="60" y="584.96" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Six well-chosen sources you use and evaluate are worth more than fifteen you mention once.</text>
</svg>