<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 549" width="900" height="549" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="549" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four questions before you use a source</text>

<rect x="30" y="205" width="190" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="125" y="255.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Candidate</text><text x="125" y="281.9" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">source</text><rect x="280" y="110" width="360" height="68" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><circle cx="306" cy="144" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="306" y="149.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="334" y="139" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Reasons and evidence,</text><text x="334" y="162" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">or only assertions?</text><rect x="280" y="192" width="360" height="68" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><circle cx="306" cy="226" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="306" y="231.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="334" y="221" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Can I trace where</text><text x="334" y="244" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">its evidence comes from?</text><rect x="280" y="274" width="360" height="68" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><circle cx="306" cy="308" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="306" y="313.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="334" y="303" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Is the writer qualified</text><text x="334" y="326" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">to make this judgement?</text><rect x="280" y="356" width="360" height="68" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><circle cx="306" cy="390" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="306" y="395.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="334" y="385" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Does it address my question,</text><text x="334" y="408" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">or a neighbouring one?</text><line x1="222" y1="260" x2="262" y2="260" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="644" y1="260" x2="690" y2="260" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="698" y="180" width="172" height="160" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="784" y="217" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Use it</text><text x="784" y="244.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">reaches “firmly</text><text x="784" y="265.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">supported</text><text x="784" y="286.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">judgements”</text><text x="784" y="307.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">through evidence</text><text x="784" y="328.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">you can see</text><path d="M280,106 L270,106 L270,412 L280,412" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M640,106 L650,106 L650,412 L640,412" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="448" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="478.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">A short opinion column may state a perspective clearly, but with no reasons to examine it is weak</text><text x="450" y="499.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">material for building that perspective.</text>
</svg>