<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 509" width="900" height="509" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="509" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three things your sources must show</text>

<rect x="30" y="130" width="266" height="186" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="52" y="172.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Range</text><text x="52" y="200.02" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sources cover the issue</text><text x="52" y="221.14000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from more than one place,</text><text x="52" y="242.26000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">type and standpoint.</text><circle cx="163" cy="130" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="163" y="137.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="30" y="330" width="266" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="163" y="362" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">Place, type and standpoint?</text><rect x="317" y="130" width="266" height="186" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="339" y="172.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Assessment</text><text x="339" y="200.02" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Make an informed</text><text x="339" y="221.14000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">judgement”: how far each</text><text x="339" y="242.26000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">source can be trusted and</text><text x="339" y="263.38" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">how strongly it supports</text><text x="339" y="284.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what you use it for.</text><circle cx="450" cy="130" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="137.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="317" y="330" width="266" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="450" y="362" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">How good is this source?</text><rect x="604" y="130" width="266" height="186" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="626" y="172.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Justification</text><text x="626" y="200.02" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Support a case with</text><text x="626" y="221.14000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">evidence/argument”: why</text><text x="626" y="242.26000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each key source belongs in</text><text x="626" y="263.38" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">your essay.</text><circle cx="737" cy="130" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="737" y="137.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="604" y="330" width="266" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="737" y="362" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">Why have I used it here?</text><rect x="30" y="406" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="437.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">A source can be limited and still be justified: for example, the clearest statement of a</text><text x="450" y="459.59" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">perspective you need to examine.</text>
</svg>