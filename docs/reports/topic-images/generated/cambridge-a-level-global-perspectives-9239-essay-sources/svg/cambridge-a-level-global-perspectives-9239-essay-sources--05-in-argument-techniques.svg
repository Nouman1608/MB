<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Assessing a source inside your argument</text>

<rect x="30" y="110" width="840" height="124.44" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="172.22" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="180.14" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="145" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The evaluative clause</text><text x="110" y="170.08" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Attach a short judgement to</text><text x="110" y="191.20000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the citation, in about a</text><text x="110" y="212.32000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dozen words.</text><rect x="372" y="122" width="484" height="100.44" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="388" y="167.66" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“A ten-country survey …, which uses each country’s</text><text x="388" y="188.78" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">hospital records rather than estimates, found that …”</text><rect x="30" y="248.44" width="840" height="149.52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="323.2" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="72" y="331.12" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="110" y="283.44" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The comparison of</text><text x="110" y="308.52" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">credibility</text><text x="110" y="333.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">When two sources disagree,</text><text x="110" y="354.72" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">assess them against each</text><text x="110" y="375.84000000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">other.</text><rect x="372" y="260.44" width="484" height="125.52000000000001" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="388" y="308.08" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The ministry’s figures are more recent, but the</text><text x="388" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">university study explains its method in full, so … the</text><text x="388" y="350.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">study is the safer guide.”</text><rect x="30" y="411.96000000000004" width="840" height="149.52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="486.72" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="494.64000000000004" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="110" y="446.96000000000004" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The limit that changes</text><text x="110" y="472.04" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">the weight</text><text x="110" y="497.12000000000006" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Name a limitation and say</text><text x="110" y="518.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what it does to your</text><text x="110" y="539.36" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">argument.</text><rect x="372" y="423.96000000000004" width="484" height="125.52000000000001" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="388" y="471.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Because the campaign group funded the report, … the</text><text x="388" y="492.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">essay therefore treats it as the upper end of the</text><text x="388" y="513.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">likely effect.”</text><rect x="30" y="579.48" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="609.6800000000001" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Evaluate where you use the source, not in a separate list at the end. A limitation that changes</text><text x="450" y="630.8000000000001" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">nothing is not worth the words.</text>
</svg>