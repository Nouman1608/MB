<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weak and strong use of the same sources</text>

<text x="450" y="100" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle" font-style="italic">Question: “Should governments use congestion charges to reduce urban air pollution?”</text><rect x="30" y="120" width="300" height="398.32" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="156" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weak paragraph</text><text x="52" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="68" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cites sources but assesses</text><text x="68" y="213.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">none</text><text x="52" y="246.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="68" y="246.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“all of these sources are</text><text x="68" y="267.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reliable” is asserted</text><text x="52" y="300.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="68" y="300.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">second citation incomplete</text><text x="52" y="333.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="68" y="333.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no perspective is linked to</text><text x="68" y="354.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">any source</text><rect x="350" y="120" width="520" height="398.32" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="372" y="156" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Strong paragraph does all three jobs</text><rect x="372" y="180" width="476" height="106.48" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="386" y="208" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Assesses</text><text x="508" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the transport authority has an interest</text><text x="508" y="227.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in its policy succeeding, offset by</text><text x="508" y="248.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">publishing monitoring-station data others</text><text x="508" y="269.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can check</text><rect x="372" y="296.48" width="476" height="106.48" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="386" y="324.48" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Justifies</text><text x="508" y="322.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the review is the clearest statement of</text><text x="508" y="343.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the perspective; the independent study is</text><text x="508" y="364.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relied on more because it covers weak</text><text x="508" y="385.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public transport</text><rect x="372" y="412.96000000000004" width="476" height="85.36" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="386" y="440.96000000000004" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Uses range</text><text x="508" y="438.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a single-city official review and an</text><text x="508" y="460.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">independent study of schemes on three</text><text x="508" y="481.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">continents</text><rect x="30" y="540.3199999999999" width="840" height="51.120000000000005" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="570.52" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">The sources in this example are illustrative, not real publications.</text>
</svg>