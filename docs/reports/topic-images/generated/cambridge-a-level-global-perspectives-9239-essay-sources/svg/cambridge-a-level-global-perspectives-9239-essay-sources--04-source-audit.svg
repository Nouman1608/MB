<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" width="900" height="662" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A source audit table</text>

<rect x="30" y="110" width="840" height="50" rx="12" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.2"/><text x="60" y="142" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">What to note for each source, as you read</text><rect x="30" y="160" width="840" height="58" fill="#ffffff"/><text x="60" y="196" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reference</text><text x="250" y="196" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Full details for your list of sources</text><rect x="30" y="218" width="840" height="58" fill="#f7f9f9"/><text x="60" y="254" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Perspective</text><text x="250" y="254" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Which perspective it supports, in a few words</text><line x1="30" y1="218" x2="870" y2="218" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="276" width="840" height="58" fill="#ffffff"/><text x="60" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Provenance</text><text x="250" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Who wrote it, where, when, for whom</text><line x1="30" y1="276" x2="870" y2="276" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="334" width="840" height="58" fill="#f7f9f9"/><text x="60" y="370" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Basis</text><text x="250" y="370" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What evidence or reasoning it uses</text><line x1="30" y1="334" x2="870" y2="334" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="392" width="840" height="58" fill="#ffffff"/><text x="60" y="428" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><text x="250" y="428" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Why it is credible for this purpose</text><line x1="30" y1="392" x2="870" y2="392" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="450" width="840" height="58" fill="#f7f9f9"/><text x="60" y="486" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><text x="250" y="486" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What weakens it, and how much</text><line x1="30" y1="450" x2="870" y2="450" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="508" width="840" height="58" fill="#f2e7b8"/><text x="60" y="544" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Use</text><text x="250" y="544" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">State a perspective, supply evidence, or challenge another source</text><line x1="30" y1="508" x2="870" y2="508" stroke="#c9d6d4" stroke-width="1.5"/><line x1="230" y1="160" x2="230" y2="566" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="110" width="840" height="456" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/><rect x="30" y="508" width="840" height="58" rx="0" fill="none" stroke="#8a6d0d" stroke-width="3.5"/><text x="450" y="606" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">The Use column is your justification. If you cannot fill it in,</text><text x="450" y="632" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">the source probably does not belong in the essay.</text>
</svg>