<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a diver at 25 m</text>

<rect x="30" y="190" width="420" height="400" rx="0" fill="#dce9e7" stroke="none" stroke-width="0" /><path d="M30,190 q20,-8 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t20,0" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="150" y1="120" x2="150" y2="184" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="162" y="145" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">atmospheric pressure</text><text x="162" y="165" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1.0 × 10⁵ Pa</text><line x1="95" y1="196" x2="95" y2="464" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="95" y1="464" x2="95" y2="196" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="108" y="330" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">h = 25 m</text><line x1="70" y1="470" x2="420" y2="470" stroke="#2e6b62" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><circle cx="250" cy="452" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M250,466 L250,510 M250,478 L222,496 M250,478 L278,496 M250,510 L232,540 M250,510 L268,540" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="256" y="470" width="12" height="30" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="240" y="575" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">sea water: ρ = 1030 kg/m³</text><rect x="470" y="120" width="400" height="299.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="494" y="161.1" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pressure difference</text><text x="494" y="199.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">p = h × ρ × g</text><text x="516" y="237.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 25 × 1030 × 10</text><text x="516" y="275.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">= 257 500 Pa</text><text x="494" y="313.1" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Total pressure</text><text x="516" y="351.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 1.0 × 10⁵ + 2.575 × 10⁵</text><text x="516" y="389.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">= 3.6 × 10⁵ Pa (2 s.f.)</text><text x="475" y="450" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">About three and a half times</text><text x="475" y="475" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">atmospheric pressure. Add</text><text x="475" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">atmospheric pressure only when</text><text x="475" y="525" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the question asks for the total.</text>
</svg>