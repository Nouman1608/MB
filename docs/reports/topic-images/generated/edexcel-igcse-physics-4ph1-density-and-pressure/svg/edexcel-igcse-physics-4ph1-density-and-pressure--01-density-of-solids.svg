<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring the density of a solid</text>

<rect x="30" y="110" width="270" height="490" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="144" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="150.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="86" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Regular solid</text><text x="86" y="164" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a cuboid block</text><path d="M80,260 L200,260 L200,330 L80,330 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><path d="M80,260 L110,235 L230,235 L200,260 Z" fill="#ddd3b8" stroke="#1e2a44" stroke-width="3"/><path d="M200,260 L230,235 L230,305 L200,330 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><line x1="80" y1="348" x2="200" y2="348" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="200" y1="348" x2="80" y2="348" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="140" y="375" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">length</text><line x1="245" y1="230" x2="245" y2="302" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="245" y1="302" x2="245" y2="230" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="252" y="272" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">height</text><text x="150" y="222" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">width</text><text x="52" y="418" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mass on a top-pan balance.</text><text x="52" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Measure each side in more</text><text x="52" y="462" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">than one place; find the mean.</text><rect x="50" y="500" width="230" height="76" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="165" y="530" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">V = l × w × h</text><text x="165" y="560" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">ρ = m ÷ V</text><rect x="315" y="110" width="270" height="490" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="345" cy="144" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="345" y="150.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="371" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Irregular solid</text><text x="371" y="164" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">measuring cylinder</text><rect x="355" y="330" width="70" height="100" fill="#dce9e7"/><path d="M355,330 Q390,337 425,330" fill="none" stroke="#2e6b62" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M355,200 L355,430 L425,430 L425,200" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="341" y1="430" x2="439" y2="430" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><line x1="411" y1="218" x2="425" y2="218" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="417" y1="243" x2="425" y2="243" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="411" y1="268" x2="425" y2="268" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="417" y1="293" x2="425" y2="293" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="411" y1="318" x2="425" y2="318" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="417" y1="343" x2="425" y2="343" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="411" y1="368" x2="425" y2="368" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="417" y1="393" x2="425" y2="393" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="390" y="460" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">before</text><rect x="475" y="290" width="70" height="140" fill="#dce9e7"/><path d="M475,290 Q510,297 545,290" fill="none" stroke="#2e6b62" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M475,200 L475,430 L545,430 L545,200" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="461" y1="430" x2="559" y2="430" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><line x1="531" y1="218" x2="545" y2="218" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="537" y1="243" x2="545" y2="243" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="531" y1="268" x2="545" y2="268" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="537" y1="293" x2="545" y2="293" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="531" y1="318" x2="545" y2="318" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="537" y1="343" x2="545" y2="343" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="531" y1="368" x2="545" y2="368" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="537" y1="393" x2="545" y2="393" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="475" y1="330" x2="545" y2="330" stroke="#8a6d0d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 4"/><rect x="475" y="292" width="70" height="38" fill="#f2e7b8" opacity="0.9"/><line x1="510" y1="180" x2="510" y2="395" stroke="#1e2a44" stroke-width="1.5" stroke-linecap="round"/><path d="M490.8,400.2 L502.8,388.2 L524.4,391.8 L530.4,409.8 L517.2,420.6 L495.6,418.2 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><text x="510" y="460" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">after</text><text x="561" y="316" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">rise</text><ellipse cx="335" cy="290" rx="16" ry="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="339" cy="290" r="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><line x1="351" y1="290" x2="473" y2="290" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><text x="337" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Read the meniscus bottom at</text><text x="337" y="522" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">eye level. Object volume =</text><text x="337" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the INCREASE in reading.</text><rect x="600" y="110" width="270" height="490" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="630" cy="144" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="630" y="150.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="656" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Too big?</text><text x="656" y="164" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">displacement can</text><path d="M630,210 L630,400 L750,400 L750,245 L805,285" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M632,245 L748,245 L748,398 L632,398 Z" fill="#dce9e7"/><line x1="632" y1="245" x2="748" y2="245" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><line x1="690" y1="170" x2="690" y2="330" stroke="#1e2a44" stroke-width="1.5" stroke-linecap="round"/><path d="M664.4,335.6 L680.4,319.6 L709.2,324.4 L717.2,348.4 L699.6,362.8 L670.8,359.6 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><path d="M805,285 q8,10 6,40" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="785" y="410" width="60" height="40" fill="#dce9e7"/><path d="M785,410 Q815,417 845,410" fill="none" stroke="#2e6b62" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M785,330 L785,450 L845,450 L845,330" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="771" y1="450" x2="859" y2="450" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><line x1="831" y1="348" x2="845" y2="348" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="837" y1="359.25" x2="845" y2="359.25" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="831" y1="370.5" x2="845" y2="370.5" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="837" y1="381.75" x2="845" y2="381.75" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="831" y1="393" x2="845" y2="393" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="837" y1="404.25" x2="845" y2="404.25" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="831" y1="415.5" x2="845" y2="415.5" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="837" y1="426.75" x2="845" y2="426.75" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="815" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">overflow</text><text x="690" y="425" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">filled to the spout</text><text x="622" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower the object in; catch the</text><text x="622" y="522" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">overflow in a measuring</text><text x="622" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cylinder. Overflow = volume.</text>
