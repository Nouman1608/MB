<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Density of a liquid: oil</text>

<rect x="30" y="110" width="420" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Empty cylinder</text><path d="M215,190 L215,370 L265,370 L265,190" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="170" y="372" width="140" height="12" rx="3" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><rect x="180" y="384" width="120" height="46" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><rect x="198" y="392" width="84" height="30" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="240" y="414" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">82.0 g</text><rect x="470" y="110" width="400" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="670" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">With 50.0 cm³ of oil</text><rect x="645" y="250" width="50" height="120" fill="#d4b02e" opacity="0.55"/><path d="M645,250 Q670,257 695,250" fill="none" stroke="#8a6d0d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M645,190 L645,370 L695,370 L695,190" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="600" y="372" width="140" height="12" rx="3" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><rect x="610" y="384" width="120" height="46" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><rect x="628" y="392" width="84" height="30" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="670" y="414" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">128.0 g</text><ellipse cx="600" cy="252" rx="16" ry="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="604" cy="252" r="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><line x1="616" y1="252" x2="642" y2="252" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><text x="712" y="256" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">50.0 cm³</text><rect x="30" y="490" width="840" height="147.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="532" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">mass of oil = 128.0 − 82.0 = 46.0 g</text><text x="54" y="570" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="start">ρ = m ÷ V = 46.0 ÷ 50.0 = 0.920 g/cm³</text><text x="76" y="608" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">= 920 kg/m³   (× 1000 to change g/cm³ to kg/m³)</text>
</svg>