<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two steps: force on a submarine window</text>

<rect x="30" y="150" width="440" height="420" rx="0" fill="#dce9e7" stroke="none" stroke-width="0" /><line x1="30" y1="150" x2="470" y2="150" stroke="#2e6b62" stroke-width="3" stroke-linecap="round"/><text x="40" y="138" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">sea surface</text><line x1="445" y1="156" x2="445" y2="410" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="445" y1="410" x2="445" y2="156" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="433" y="280" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">h = 200 m</text><line x1="355" y1="416" x2="465" y2="416" stroke="#2e6b62" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><ellipse cx="250" cy="470" rx="170" ry="55" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><rect x="215" y="395" width="60" height="30" rx="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3" /><rect x="300" y="411" width="50" height="10" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><line x1="325" y1="330" x2="325" y2="405" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="313" y="350" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">force on</text><text x="313" y="369" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">window</text><text x="260" y="548" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">window area 0.050 m²</text><rect x="490" y="120" width="380" height="337.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="514" y="161.1" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Step 1: pressure</text><text x="514" y="199.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">p = h × ρ × g</text><text x="536" y="237.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 200 × 1030 × 10</text><text x="536" y="275.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">= 2.06 × 10⁶ Pa</text><text x="514" y="313.1" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Step 2: force</text><text x="514" y="351.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">F = p × A</text><text x="536" y="389.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 2.06 × 10⁶ × 0.050</text><text x="536" y="427.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">= 1.03 × 10⁵ N</text><text x="495" y="490" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Combine p = h × ρ × g</text><text x="495" y="515" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">with p = F ÷ A.</text>
</svg>