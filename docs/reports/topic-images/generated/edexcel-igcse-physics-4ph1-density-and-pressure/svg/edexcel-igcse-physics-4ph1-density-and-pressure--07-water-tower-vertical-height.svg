y2="179" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="318" y="240" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">h = 15 m</text><line x1="810" y1="179" x2="810" y2="476" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="810" y1="476" x2="810" y2="179" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="798" y="330" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">larger h</text><text x="160" y="140" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">tank</text><text x="540" y="330" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">pipe length is NOT h</text><rect x="30" y="580" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="616" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Upper tap:  p = h × ρ × g = 15 × 1000 × 10 = 150 000 Pa</text><text x="55" y="646" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lower house: larger vertical height below the surface, so a larger pressure</text><text x="55" y="670" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">difference and the water flows out faster. Always use the vertical height.</text>
