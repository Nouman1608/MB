<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same weight, different pressure</text>

<rect x="30" y="110" width="270" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Flat shoes</text><line x1="165" y1="175" x2="165" y2="260" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="179" y="210" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">600 N</text><rect x="50" y="290" width="230" height="50" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5" /><rect x="120" y="274" width="90" height="16" rx="3" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><text x="165" y="370" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">area 0.040 m²</text><text x="165" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">p = 600 ÷ 0.040</text><rect x="50" y="445" width="230" height="70" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="165" y="489" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">15 000 Pa</text><rect x="315" y="110" width="270" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Snowshoes</text><line x1="450" y1="175" x2="450" y2="260" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="464" y="210" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">600 N</text><rect x="335" y="290" width="230" height="50" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5" /><rect x="340" y="274" width="220" height="16" rx="3" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><text x="450" y="370" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">area 0.30 m²</text><text x="450" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">p = 600 ÷ 0.30</text><rect x="335" y="445" width="230" height="70" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="450" y="489" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2000 Pa</text><rect x="600" y="110" width="270" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">One narrow heel</text><line x1="735" y1="175" x2="735" y2="260" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="749" y="210" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">600 N</text><rect x="620" y="290" width="230" height="50" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5" /><rect x="732" y="274" width="6" height="16" rx="3" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><text x="735" y="370" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">area 1.0 cm² = 1.0 × 10⁻⁴ m²</text><text x="735" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">p = 600 ÷ 1.0 × 10⁻⁴</text><rect x="620" y="445" width="230" height="70" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="735" y="489" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">6.0 × 10⁶ Pa</text><rect x="30" y="560" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="598" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">p = F ÷ A: the same force over a smaller area gives a greater pressure</text><text x="450" y="630" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Wide tractor tyres: low pressure on soft ground. Sharp knives and needles: large pressure.</text>
</svg>