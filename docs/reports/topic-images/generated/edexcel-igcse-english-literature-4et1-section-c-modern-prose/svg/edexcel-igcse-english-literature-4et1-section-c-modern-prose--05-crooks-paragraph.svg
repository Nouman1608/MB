<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 728" width="900" height="728" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="728" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a Section C paragraph</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Of Mice and Men: Crooks</text>
<rect x="120" y="116" width="750" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="140" y="149" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CLAIM</text><text x="140" y="179.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Loneliness on the ranch is not just bad luck but is imposed by prejudice.</text><line x1="80" y1="170" x2="80" y2="226" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><circle cx="80" cy="160" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="120" y="218" width="750" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="251" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRECISE REFERENCE</text><text x="140" y="281.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Crooks lives apart in the harness room; his first reaction to Lennie is defensive</text><text x="140" y="303.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hostility.</text><line x1="80" y1="283" x2="80" y2="350" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><circle cx="80" cy="273" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="120" y="342" width="750" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="375" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEVELOPMENT</text><text x="140" y="405.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">He admits how much a person needs someone to be near: bitterness covers a longing</text><text x="140" y="427.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">for company.</text><line x1="80" y1="407" x2="80" y2="474" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><circle cx="80" cy="397" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="120" y="466" width="750" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="140" y="499" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONTEXT</text><text x="140" y="529.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">In 1930s America, segregation meant a Black worker could be excluded legally and</text><text x="140" y="551.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">socially.</text><line x1="80" y1="531" x2="80" y2="598" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><circle cx="80" cy="521" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="120" y="590" width="750" height="88" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="623" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">SO WHAT</text><text x="140" y="653.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The reader sees that society as cruel rather than natural.</text><circle cx="80" cy="634" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="702" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">Paraphrase counts as precise reference in a closed-book exam.</text>
</svg>