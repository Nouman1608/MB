<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a theme question</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How does Steinbeck present loneliness in Of Mice and Men?</text>
<rect x="30" y="146" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="179" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OVERVIEW</text><text x="50" y="209.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Loneliness is the normal condition of the ranch, created by economic insecurity and</text><text x="50" y="231.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">prejudice; George and Lennie’s friendship shows the hope and the fragility of escaping it.</text><text x="260" y="288" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Claim and moment (AO1)</text><text x="700" y="288" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Context (AO4)</text><rect x="80" y="300" width="470" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="94" y="327.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Opening</text><text x="94" y="354" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">George’s speech about ranch workers with no family or</text><text x="94" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">place: loneliness is typical, the friendship unusual.</text><rect x="590" y="300" width="280" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="604" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Itinerant labourers moved from</text><text x="604" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ranch to ranch with no security</text><text x="604" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">during the Depression.</text><line x1="552" y1="346" x2="586" y2="346" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="48" cy="346" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="48" y="352.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="80" y="404" width="470" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="94" y="431.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Isolation by prejudice</text><text x="94" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Crooks is kept apart because of his race; his talk with</text><text x="94" y="478" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Lennie shows how isolation damages a person.</text><rect x="590" y="404" width="280" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="604" y="444" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Racial segregation and</text><text x="604" y="464" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">discrimination in 1930s America.</text><line x1="552" y1="450" x2="586" y2="450" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="48" cy="450" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="48" y="456.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="80" y="508" width="470" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="94" y="535.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Isolation by gender and age</text><text x="94" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Candy’s fear of being discarded; Curley’s wife has no</text><text x="94" y="582" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">name and no one to talk to.</text><rect x="590" y="508" width="280" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="604" y="538" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Limited roles for women; no</text><text x="604" y="558" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">support for workers who could no</text><text x="604" y="578" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">longer work.</text><line x1="552" y1="554" x2="586" y2="554" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="48" cy="554" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="48" y="560.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="80" y="612" width="470" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="94" y="639.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ending</text><text x="94" y="666" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The dream dies and George is left alone, like the</text><text x="94" y="686" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ranch-hands he described at the start.</text><rect x="590" y="612" width="280" height="92" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="604" y="652" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Circular structure: the hope of</text><text x="604" y="672" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">companionship is defeated.</text><line x1="552" y1="658" x2="586" y2="658" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="48" cy="658" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="48" y="664.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><path d="M30,678 C6,678 6,326 30,326" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#ahO)"/>
</svg>