<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Context that explains, not decorates</text>

<rect x="30" y="116" width="840" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="150" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TIME OF WRITING</text><text x="54" y="176" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">To Kill a Mockingbird</text><line x1="120" y1="234" x2="800" y2="234" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="250" cy="234" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><circle cx="640" cy="234" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="250" y="214" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Set</text><text x="250" y="268" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">1930s Alabama, under segregation</text><text x="640" y="214" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Published</text><text x="640" y="268" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">1960, during the civil rights movement</text><rect x="30" y="302" width="410" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HISTORICAL SETTING</text><text x="50" y="361.2" font-size="19" font-weight="700" font-style="italic" fill="#1e2a44" text-anchor="start">Of Mice and Men</text><text x="50" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Migrant ranch workers in 1930s California</text><text x="50" y="410.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">during the Great Depression: why the dream</text><text x="50" y="431.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of owning land matters so much.</text><rect x="460" y="302" width="410" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CULTURE AND TRADITION</text><text x="480" y="361.2" font-size="19" font-weight="700" font-style="italic" fill="#1e2a44" text-anchor="start">Things Fall Apart</text><text x="480" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Igbo society before and during the arrival</text><text x="480" y="410.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of British colonial rule and Christian</text><text x="480" y="431.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">missionaries.</text><rect x="30" y="472" width="410" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="505" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IDENTITY AND MIGRATION</text><text x="50" y="531.2" font-size="19" font-weight="700" font-style="italic" fill="#1e2a44" text-anchor="start">The Joy Luck Club</text><text x="50" y="559.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Chinese American mothers and their</text><text x="50" y="580.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">American-born daughters.</text><rect x="460" y="472" width="410" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="505" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IDEAS AND DEBATES</text><text x="480" y="531.2" font-size="19" font-weight="700" font-style="italic" fill="#1e2a44" text-anchor="start">Klara and the Sun</text><text x="480" y="559.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Narrated by an artificial “friend”:</text><text x="480" y="580.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">technology, love and what makes a person.</text><rect x="30" y="623" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="656.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ask: why might the writer show this, given when and where the text was written or set?</text>
</svg>