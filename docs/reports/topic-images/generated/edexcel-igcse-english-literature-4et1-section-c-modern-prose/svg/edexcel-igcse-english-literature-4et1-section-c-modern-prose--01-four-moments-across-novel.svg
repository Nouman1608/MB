<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="616" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An argument across the whole novel</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Track a character, theme, relationship or setting</text>
<path d="M60,400 C200,400 230,250 340,250 S480,310 560,300 S700,190 840,196" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><line x1="60" y1="430" x2="840" y2="430" stroke="#1e2a44" stroke-width="3"/><text x="60" y="456" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">start of the novel</text><text x="840" y="456" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">end</text><circle cx="120" cy="398" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="120" y="405.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="120" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Opening position</text><text x="120" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">how it is first established</text><circle cx="340" cy="250" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="340" y="257.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="340" y="300" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Turning point</text><text x="340" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">an event that changes or tests it</text><circle cx="560" cy="302" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="560" y="309.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="560" y="352" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Development</text><text x="560" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">how the change plays out</text><circle cx="780" cy="199" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="780" y="206.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="780" y="249" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ending</text><text x="780" y="271" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">where the novel leaves it</text><rect x="30" y="482" width="408" height="110" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="526" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKER</text><text x="50" y="556.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Opens each paragraph with a plot event.</text><rect x="462" y="482" width="408" height="110" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="515" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRONGER</text><text x="482" y="545.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Opens each paragraph with a claim that</text><text x="482" y="567.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">answers the question.</text>
