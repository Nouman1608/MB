<!-- place after: ## Summary versus synthesis -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-6-1-synthesising-sources-study-guide--02-who-is-the-subject.webp" width="900" height="891" alt="Three summary sentences each begin “Source A says”, “Source B says”, “Source C says”. The synthesis sentence begins with the issue, whether a car park should become green space, and brings in the survey, the shopkeeper and the planner as evidence. A table compares organising principle, relationship, commentary and selection." loading="lazy">
  <figcaption>In synthesis the claim is the subject of the sentence; the sources are the evidence.</figcaption>
</figure>

<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-6-1-synthesising-sources-study-guide--03-quote-paraphrase-summarise.webp" width="900" height="551" alt="Quotation, paraphrase and summary, each with when to use it and an example from the fictional sources: the shopkeeper’s “trees don’t buy bread”, his point about customers spending about £40, and the planner’s account of a northern town. Below, signal verbs and a warning about dropped quotes." loading="lazy">

<!-- place after: ## Combining sources: four moves -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-6-1-synthesising-sources-study-guide--04-four-combining-moves.webp" width="900" height="562" alt="Four cards with small diagrams: agreement (two sources point to one idea), extension (one source adds to another), qualification (one source limits another) and conflict (two sources disagree), each with example phrasing." loading="lazy">
  <figcaption>Agree, extend, qualify or conflict: say how the sources relate.</figcaption>
</figure>
