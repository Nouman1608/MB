<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 551" width="900" height="551" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="551" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bringing source material in</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Using the fictional shopkeeper and planner</text>
<rect x="30" y="122" width="200" height="76" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="42" y="148.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Quotation</text><text x="42" y="174.08499999999998" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">when the exact words</text><text x="42" y="193.22499999999997" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">matter or add force</text><rect x="250" y="122" width="620" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="264" y="165.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A shopkeeper warns that “trees don’t buy bread”</text><rect x="30" y="208" width="200" height="76" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="42" y="234.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Paraphrase</text><text x="42" y="260.085" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">to restate a specific</text><text x="42" y="279.22499999999997" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">point in your own words</text><rect x="250" y="208" width="620" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="264" y="240.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The shopkeeper argues that the car park brings in customers who spend</text><text x="264" y="261.59999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">about £40 each</text><rect x="30" y="294" width="200" height="76" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="42" y="320.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Summary</text><text x="42" y="346.085" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">to compress a long</text><text x="42" y="365.22499999999997" font-size="14.5" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">passage</text><rect x="250" y="294" width="620" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="264" y="326.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The planner’s article describes a northern town’s conversion and its uneven</text><text x="264" y="347.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">results</text><text x="30" y="396" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Always attribute and comment. Signal verbs say how you use the source:</text><rect x="30" y="412" width="66.03379" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="63.016895" y="435.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">notes</text><rect x="110.03379" y="412" width="70.34125" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="145.20441499999998" y="435.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">warns</text><rect x="194.37504" y="412" width="101.22889" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="244.989485" y="435.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">concedes</text><rect x="309.60393" y="412" width="76.96003" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="348.08394499999997" y="435.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">argues</text><rect x="400.56396" y="412" width="96.55372" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="448.84082" y="435.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">observes</text><rect x="511.11768" y="412" width="95.48561000000001" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="558.860485" y="435.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">suggests</text><rect x="30" y="465" width="840" height="74.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="496.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Dropped</tspan> <tspan font-weight="700" fill="#b5602e">quote:</tspan> a quotation with no introduction or explanation is weaker than one that is introduced</text><text x="450" y="517.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and explained.</text>
</svg>