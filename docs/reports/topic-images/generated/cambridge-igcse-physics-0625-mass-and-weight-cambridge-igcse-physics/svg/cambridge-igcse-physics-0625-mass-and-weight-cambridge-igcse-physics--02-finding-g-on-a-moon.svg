<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Finding g from a force and a mass</text>

<rect x="30" y="110" width="350" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="80" y1="140" x2="330" y2="140" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><rect x="183" y="175" width="44" height="150" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="183" y1="205" x2="195" y2="205" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="183" y1="235" x2="195" y2="235" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="183" y1="265" x2="195" y2="265" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="183" y1="295" x2="195" y2="295" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="205" y1="145" x2="205" y2="175" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="205" y1="325" x2="205" y2="355" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="199" y1="235" x2="223" y2="235" stroke="#b5602e" stroke-width="4" stroke-linecap="round"/><text x="240" y="238" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">4.0 N</text><rect x="170" y="355" width="70" height="60" rx="4" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><text x="205" y="392" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2.5 kg</text><text x="205" y="450" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">newton meter on the moon</text><rect x="400" y="130" width="470" height="194" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="420" y="166" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 2</text><text x="420" y="200" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">g = W / m = 4.0 / 2.5</text><text x="450" y="234" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">= 1.6 N/kg</text><text x="420" y="268" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">astronaut: W = 70 × 1.6</text><text x="450" y="302" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">= 112 N  ≈ 110 N</text><rect x="400" y="344" width="470" height="126" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="635" y="386.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">g = 9.8 N/kg near the Earth is the same</text><text x="635" y="412.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">as the free-fall acceleration 9.8 m/s²:</text><text x="635" y="438.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">1 N/kg = 1 m/s².</text>
</svg>