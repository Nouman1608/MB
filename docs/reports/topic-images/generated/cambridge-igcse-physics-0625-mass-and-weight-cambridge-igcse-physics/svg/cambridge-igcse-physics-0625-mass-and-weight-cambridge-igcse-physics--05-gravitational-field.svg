<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="840" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="530" y1="370" x2="416" y2="370" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M452.0,370.0 L468.0,376.0 L468.0,364.0 Z" fill="#2e6b62"/><line x1="512.4922924775959" y1="458.01718944397066" x2="407.17002577130927" y2="414.3912781543504" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M440.4,428.2 L452.9,439.8 L457.5,428.7 Z" fill="#2e6b62"/><line x1="462.63455967290594" y1="532.6345596729059" x2="382.0243866176395" y2="452.0243866176395" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M407.5,477.5 L414.6,493.0 L423.0,484.6 Z" fill="#2e6b62"/><line x1="388.01718944397066" y1="582.4922924775959" x2="344.3912781543504" y2="477.17002577130927" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M358.2,510.4 L358.7,527.5 L369.8,522.9 Z" fill="#2e6b62"/><line x1="300" y1="600" x2="300" y2="486" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M300.0,522.0 L294.0,538.0 L306.0,538.0 Z" fill="#2e6b62"/><line x1="211.98281055602936" y1="582.4922924775959" x2="255.6087218456496" y2="477.17002577130927" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M241.8,510.4 L230.2,522.9 L241.3,527.5 Z" fill="#2e6b62"/><line x1="137.3654403270941" y1="532.6345596729059" x2="217.9756133823605" y2="452.0243866176395" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M192.5,477.5 L177.0,484.6 L185.4,493.0 Z" fill="#2e6b62"/><line x1="87.50770752240405" y1="458.01718944397066" x2="192.82997422869073" y2="414.3912781543504" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M159.6,428.2 L142.5,428.7 L147.1,439.8 Z" fill="#2e6b62"/><line x1="70" y1="370" x2="184" y2="370" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M148.0,370.0 L132.0,364.0 L132.0,376.0 Z" fill="#2e6b62"/><line x1="87.50770752240402" y1="281.9828105560294" x2="192.82997422869073" y2="325.6087218456496" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M159.6,311.8 L147.1,300.2 L142.5,311.3 Z" fill="#2e6b62"/><line x1="137.36544032709403" y1="207.3654403270941" x2="217.97561338236045" y2="287.9756133823605" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M192.5,262.5 L185.4,247.0 L177.0,255.4 Z" fill="#2e6b62"/><line x1="211.98281055602922" y1="157.5077075224041" x2="255.6087218456495" y2="262.82997422869073" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M241.8,229.6 L241.3,212.5 L230.2,217.1 Z" fill="#2e6b62"/><line x1="299.99999999999994" y1="140" x2="300" y2="254" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M300.0,218.0 L306.0,202.0 L294.0,202.0 Z" fill="#2e6b62"/><line x1="388.0171894439707" y1="157.50770752240408" x2="344.39127815435046" y2="262.82997422869073" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M358.2,229.6 L369.8,217.1 L358.7,212.5 Z" fill="#2e6b62"/><line x1="462.6345596729059" y1="207.36544032709403" x2="382.0243866176395" y2="287.97561338236045" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M407.5,262.5 L423.0,255.4 L414.6,247.0 Z" fill="#2e6b62"/><line x1="512.4922924775959" y1="281.9828105560292" x2="407.17002577130927" y2="325.6087218456495" stroke="#2e6b62" stroke-width="2" stroke-linecap="round"/><path d="M440.4,311.8 L457.5,311.3 L452.9,300.2 Z" fill="#2e6b62"/><circle cx="300" cy="370" r="110" fill="#a9c48f" stroke="#1e2a44" stroke-width="3"/><text x="300" y="377" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">planet</text><rect x="288" y="234" width="24" height="24" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="300" y1="258" x2="300" y2="298" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><rect x="288" y="482" width="24" height="24" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="300" y1="482" x2="300" y2="442" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><circle cx="450" cy="170" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><line x1="450" y1="170" x2="434" y2="191" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text paint-order="stroke" stroke="#ffffff" stroke-width="5" x="436" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">satellite: smaller</text><text paint-order="stroke" stroke="#ffffff" stroke-width="5" x="436" y="174" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">weight, not zero</text><rect x="580" y="130" width="275" height="480" rx="12" fill="#f2e7b8"/><text x="600" y="170" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A field is a region where a</text><text x="600" y="193" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mass feels a force.</text><text x="600" y="234" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weight W = m g points along</text><text x="600" y="257" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the field, towards the centre.</text><text x="600" y="298" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Every kilogram at one place</text><text x="600" y="321" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">feels the same force: 1 kg and</text><text x="600" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">10 kg balls have weights in</text><text x="600" y="367" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the ratio 1 : 10 and fall with</text><text x="600" y="390" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the same acceleration.</text><text x="600" y="431" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The field weakens with</text><text x="600" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">distance from the body.</text>
</svg>