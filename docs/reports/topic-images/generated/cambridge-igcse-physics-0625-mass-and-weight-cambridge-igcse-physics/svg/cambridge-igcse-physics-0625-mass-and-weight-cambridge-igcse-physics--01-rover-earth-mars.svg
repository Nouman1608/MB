<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same mass, different weight</text>

<rect x="30" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Earth</text><text x="235" y="176" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">g = 9.8 N/kg</text><rect x="50" y="330" width="370" height="16" fill="#cbbf9f"/><rect x="175" y="280" width="120" height="40" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="215" y="250" width="40" height="30" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="195" cy="326" r="13" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><circle cx="235" cy="326" r="13" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><circle cx="275" cy="326" r="13" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="235" y="230" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">mass 900 kg</text><line x1="235" y1="300" x2="235" y2="440" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><text x="252" y="444" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">≈ 8800 N</text><text x="235" y="500" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">W = 900 × 9.8 = 8820 N</text><rect x="460" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Mars</text><text x="665" y="176" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">g = 3.7 N/kg</text><rect x="480" y="330" width="370" height="16" fill="#cbbf9f"/><rect x="605" y="280" width="120" height="40" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="645" y="250" width="40" height="30" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="625" cy="326" r="13" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><circle cx="665" cy="326" r="13" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><circle cx="705" cy="326" r="13" fill="#1e2a44" stroke="#1e2a44" stroke-width="2"/><text x="665" y="230" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">mass 900 kg</text><line x1="665" y1="300" x2="665" y2="352.85714285714283" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><text x="682" y="372" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">≈ 3300 N</text><text x="665" y="500" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">W = 900 × 3.7 = 3330 N</text><rect x="30" y="545" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="586.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Mass (kg) is the same everywhere; weight (N) = m g changes with g.</text>
</svg>