<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing and measuring with balances</text>

<rect x="30" y="110" width="410" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Beam balance</text><path d="M205,450 L235,300 L265,450 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><rect x="75" y="292" width="320" height="12" rx="3" fill="#d9b27a" stroke="#1e2a44" stroke-width="2.5"/><line x1="85" y1="304" x2="85" y2="360" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="385" y1="304" x2="385" y2="360" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><path d="M40,360 Q85,390 130,360 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M340,360 Q385,390 430,360 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="85" cy="345" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="371" y="335" width="28" height="26" rx="3" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><text x="85" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">unknown</text><text x="385" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">standard</text><text x="385" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">masses</text><text x="60" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Level when the two weights are equal;</text><text x="60" y="495" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">same g on both sides, so the masses</text><text x="60" y="520" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">are equal. Same result on the Moon.</text><rect x="460" y="110" width="410" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Spring balance (newton meter)</text><line x1="500" y1="190" x2="830" y2="190" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><rect x="558" y="225" width="44" height="150" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="558" y1="255" x2="570" y2="255" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="558" y1="285" x2="570" y2="285" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="558" y1="315" x2="570" y2="315" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="558" y1="345" x2="570" y2="345" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="580" y1="195" x2="580" y2="225" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="580" y1="375" x2="580" y2="405" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="574" y1="330" x2="598" y2="330" stroke="#b5602e" stroke-width="4" stroke-linecap="round"/><rect x="555" y="405" width="50" height="40" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="580" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Earth</text><rect x="728" y="225" width="44" height="150" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="728" y1="255" x2="740" y2="255" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="728" y1="285" x2="740" y2="285" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="728" y1="315" x2="740" y2="315" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="728" y1="345" x2="740" y2="345" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="750" y1="195" x2="750" y2="225" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="750" y1="375" x2="750" y2="405" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="744" y1="243" x2="768" y2="243" stroke="#b5602e" stroke-width="4" stroke-linecap="round"/><rect x="725" y="405" width="50" height="40" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Moon</text><text x="490" y="525" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reads weight in newtons directly;</text><text x="490" y="550" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the same object gives a smaller</text><text x="490" y="575" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reading on the Moon.</text>
</svg>