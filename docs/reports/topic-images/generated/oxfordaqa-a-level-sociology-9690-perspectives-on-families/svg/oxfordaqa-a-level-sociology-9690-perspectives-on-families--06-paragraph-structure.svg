<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building each 8-mark point</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">“Explain two ways in which Marxists see the family as serving capitalism”</text>
<rect x="30" y="110" width="253.33333333333334" height="108" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="156.66666666666669" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mechanism</text><text x="156.66666666666669" y="172.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">name how the family</text><text x="156.66666666666669" y="194.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">serves capitalism</text><line x1="287.33333333333337" y1="164" x2="319.33333333333337" y2="164" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="110" width="253.33333333333334" height="108" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450.00000000000006" y="153.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sociologist</text><text x="450.00000000000006" y="183.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">who argued it</text><line x1="580.6666666666667" y1="164" x2="612.6666666666667" y2="164" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="110" width="253.33333333333334" height="108" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="153.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Consequence</text><text x="743.3333333333334" y="183.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the effect for capitalism</text><rect x="30" y="242" width="412" height="205" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,292 L31.25,256.25 Q31.25,243.25 44.25,243.25 L427.75,243.25 Q440.75,243.25 440.75,256.25 L440.75,292 Z" fill="#ffffff"/><line x1="31.25" y1="292" x2="440.75" y2="292" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="272.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Way 1</text><circle cx="49" cy="317.92" r="4.5" fill="#2e6b62"/><text x="62" y="323.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Mechanism:</tspan> inheritance of property</text><circle cx="49" cy="346.92" r="4.5" fill="#2e6b62"/><text x="62" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Sociologist:</tspan> Engels, monogamy so men pass</text><text x="62" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">property to their own sons</text><circle cx="49" cy="396.92" r="4.5" fill="#2e6b62"/><text x="62" y="402.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Consequence:</tspan> class inequality reproduced</text><text x="62" y="423.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">across generations</text><rect x="458" y="242" width="412" height="205" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,292 L459.25,256.25 Q459.25,243.25 472.25,243.25 L855.75,243.25 Q868.75,243.25 868.75,256.25 L868.75,292 Z" fill="#ffffff"/><line x1="459.25" y1="292" x2="868.75" y2="292" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="272.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Way 2</text><circle cx="477" cy="317.92" r="4.5" fill="#2e6b62"/><text x="490" y="323.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Mechanism:</tspan> ideological apparatus</text><circle cx="477" cy="346.92" r="4.5" fill="#2e6b62"/><text x="490" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Sociologist:</tspan> Althusser, children taught to</text><text x="490" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">obey authority</text><circle cx="477" cy="396.92" r="4.5" fill="#2e6b62"/><text x="490" y="402.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Consequence:</tspan> workers less likely to</text><text x="490" y="423.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">question employers; capitalism legitimised</text>
