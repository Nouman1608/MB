<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 703" width="900" height="703" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="703" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four feminisms on the family</text>

<rect x="198" y="104" width="332" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="364" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Key argument</text><rect x="538" y="104" width="332" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="704" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sociologist</text><rect x="30" y="156" width="160" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="207.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Liberal</text><rect x="198" y="156" width="332" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inequality comes from socialisation</text><text x="212" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and outdated attitudes; gradual</text><text x="212" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reform is reducing it</text><rect x="538" y="156" width="332" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Oakley: housework unpaid and</text><text x="552" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">isolating; the housewife role</text><text x="552" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">socially constructed</text><rect x="30" y="257" width="160" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="297.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Marxist</text><text x="42" y="319.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">feminist</text><rect x="198" y="257" width="332" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unpaid domestic labour reproduces</text><text x="212" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the workforce cheaply for capitalism</text><rect x="538" y="257" width="332" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Benston (1969): the next generation</text><text x="552" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of workers at little cost to</text><text x="552" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">employers</text><rect x="30" y="358" width="160" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="409.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Radical</text><rect x="198" y="358" width="332" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Patriarchy is the root; the family</text><text x="212" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is a key site of male power,</text><text x="212" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">including violence</text><rect x="538" y="358" width="332" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Delphy and Leonard (1992): men</text><text x="552" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exploit women’s work</text><rect x="30" y="459" width="160" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="499.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Black and</text><text x="42" y="521.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">intersectional</text><rect x="198" y="459" width="332" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families experienced differently by</text><text x="212" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">class and ethnicity; can be support</text><text x="212" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">against racism</text><rect x="538" y="459" width="332" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bell hooks: the home as a site of</text><text x="552" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">resistance</text><rect x="30" y="568" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="604" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="56" y="633" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Expose hidden inequality and link private family to public power; but may underplay</text><text x="56" y="655" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">change, treat women as passive and, in radical versions, see all families as oppressive.</text>
</svg>