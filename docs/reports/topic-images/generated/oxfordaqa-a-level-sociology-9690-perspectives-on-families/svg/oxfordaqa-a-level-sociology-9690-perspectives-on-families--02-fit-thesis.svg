<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 626" width="900" height="626" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="626" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Parsons: the “fit” thesis</text>

<rect x="300" y="110" width="300" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Isolated nuclear family</text><text x="450" y="166" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">"fits" industrial society</text><line x1="366" y1="184" x2="170" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="184" x2="450" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="534" y1="184" x2="730" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="236" width="269.3333333333333" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,306 L31.25,250.25 Q31.25,237.25 44.25,237.25 L285.0833333333333,237.25 Q298.0833333333333,237.25 298.0833333333333,250.25 L298.0833333333333,306 Z" fill="#b5d3cf"/><line x1="31.25" y1="306" x2="298.0833333333333" y2="306" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="276.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Geographically mobile</text><text x="44" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a small unit can move to</text><text x="44" y="358.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">where jobs are</text><rect x="315.3333333333333" y="236" width="269.3333333333333" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,306 L316.5833333333333,250.25 Q316.5833333333333,237.25 329.5833333333333,237.25 L570.4166666666666,237.25 Q583.4166666666666,237.25 583.4166666666666,250.25 L583.4166666666666,306 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="306" x2="583.4166666666666" y2="306" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="276.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Socially mobile</text><text x="329.3333333333333" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a son’s achieved status does</text><text x="329.3333333333333" y="358.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not clash with his father’s</text><text x="329.3333333333333" y="379.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in one household</text><rect x="600.6666666666666" y="236" width="269.3333333333333" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,306 L601.9166666666666,250.25 Q601.9166666666666,237.25 614.9166666666666,237.25 L855.75,237.25 Q868.75,237.25 868.75,250.25 L868.75,306 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="306" x2="868.75" y2="306" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="264.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Clear division of</text><text x="735.3333333333333" y="288.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">labour</text><text x="614.6666666666666" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">instrumental husband,</text><text x="614.6666666666666" y="358.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expressive wife</text><rect x="30" y="421" width="840" height="179" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="457" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="480.39" r="4.5" fill="#8a6d0d"/><text x="74" y="486" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Laslett:</tspan> nuclear households common before industrialisation</text><circle cx="61" cy="510.39" r="4.5" fill="#8a6d0d"/><text x="74" y="516" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Anderson:</tspan> extended households common in 1851 Preston; kin helped find work and housing</text><circle cx="61" cy="540.39" r="4.5" fill="#8a6d0d"/><text x="74" y="546" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Rosy picture:</tspan> ignores conflict, violence, inequality</text><circle cx="61" cy="570.39" r="4.5" fill="#8a6d0d"/><text x="74" y="576" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Diversity and determinism:</tspan> one middle-class Western type; members passive</text>
</svg>