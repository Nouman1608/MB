<rect width="900" height="682" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What does the family do?</text>

<text x="30" y="116" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Murdock (1949): four universal functions</text><rect x="30" y="132" width="201" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,182 L31.25,146.25 Q31.25,133.25 44.25,133.25 L216.75,133.25 Q229.75,133.25 229.75,146.25 L229.75,182 Z" fill="#f2e7b8"/><line x1="31.25" y1="182" x2="229.75" y2="182" stroke="#c9d6d4" stroke-width="2"/><text x="130.5" y="162.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sexual</text><text x="44" y="213.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regulates sexual</text><text x="44" y="234.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relations, reducing</text><text x="44" y="255.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conflict</text><rect x="243" y="132" width="201" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M244.25,182 L244.25,146.25 Q244.25,133.25 257.25,133.25 L429.75,133.25 Q442.75,133.25 442.75,146.25 L442.75,182 Z" fill="#f2e7b8"/><line x1="244.25" y1="182" x2="442.75" y2="182" stroke="#c9d6d4" stroke-width="2"/><text x="343.5" y="162.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reproductive</text><text x="257" y="213.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">produces the next</text><text x="257" y="234.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">generation</text><rect x="456" y="132" width="201" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M457.25,182 L457.25,146.25 Q457.25,133.25 470.25,133.25 L642.75,133.25 Q655.75,133.25 655.75,146.25 L655.75,182 Z" fill="#f2e7b8"/><line x1="457.25" y1="182" x2="655.75" y2="182" stroke="#c9d6d4" stroke-width="2"/><text x="556.5" y="162.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic</text><text x="470" y="213.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shares food and</text><text x="470" y="234.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shelter among</text><text x="470" y="255.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">members</text><rect x="669" y="132" width="201" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M670.25,182 L670.25,146.25 Q670.25,133.25 683.25,133.25 L855.75,133.25 Q868.75,133.25 868.75,146.25 L868.75,182 Z" fill="#f2e7b8"/><line x1="670.25" y1="182" x2="868.75" y2="182" stroke="#c9d6d4" stroke-width="2"/><text x="769.5" y="162.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Educational</text><text x="683" y="213.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">socialises children</text><text x="683" y="234.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">into norms and</text><text x="683" y="255.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">values</text><line x1="450" y1="295" x2="450" y2="335" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="470" y="321" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">structural differentiation in industrial society</text><rect x="30" y="345" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,417 L31.25,359.25 Q31.25,346.25 44.25,346.25 L427.75,346.25 Q440.75,346.25 440.75,359.25 L440.75,417 Z" fill="#b5d3cf"/><line x1="31.25" y1="417" x2="440.75" y2="417" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="386.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary socialisation of children</text><text x="44" y="449.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">children internalise shared values</text><rect x="458" y="345" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,417 L459.25,359.25 Q459.25,346.25 472.25,346.25 L855.75,346.25 Q868.75,346.25 868.75,359.25 L868.75,417 Z" fill="#b5d3cf"/><line x1="459.25" y1="417" x2="868.75" y2="417" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="374.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Stabilisation of adult</text><text x="664" y="399.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">personalities</text><text x="472" y="449.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">emotional support relieves the stress of</text><text x="472" y="471.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">work</text><text x="450" y="525" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Parsons: two "basic and irreducible" functions remain</text><rect x="30" y="545" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="581" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Functional loss?</text><text x="56" y="610" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Production, education and health care passed to specialised institutions, but Parsons</text><text x="56" y="632" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stressed the remaining functions became more important, not less.</text>
</svg>