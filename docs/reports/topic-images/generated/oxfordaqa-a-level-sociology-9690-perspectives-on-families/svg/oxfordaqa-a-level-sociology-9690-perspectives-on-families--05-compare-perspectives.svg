<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Whose needs does the family meet?</text>

<rect x="178" y="104" width="225.33333333333334" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="290.6666666666667" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism</text><rect x="411.33333333333337" y="104" width="225.33333333333334" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="524" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism</text><rect x="644.6666666666667" y="104" width="225.33333333333334" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="757.3333333333334" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminisms</text><rect x="30" y="156" width="140" height="74" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="187.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Who</text><text x="42" y="209.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">benefits?</text><rect x="178" y="156" width="225.33333333333334" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Society and all members</text><rect x="411.33333333333337" y="156" width="225.33333333333334" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="425.33333333333337" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The capitalist class</text><rect x="644.6666666666667" y="156" width="225.33333333333334" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="658.6666666666667" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Men (and capitalism,</text><text x="658.6666666666667" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for Marxist feminists)</text><rect x="30" y="238" width="140" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="279.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Socialisation</text><rect x="178" y="238" width="225.33333333333334" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Teaches shared values</text><rect x="411.33333333333337" y="238" width="225.33333333333334" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="425.33333333333337" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Teaches acceptance of</text><text x="425.33333333333337" y="289.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hierarchy</text><rect x="644.6666666666667" y="238" width="225.33333333333334" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="658.6666666666667" y="268.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Teaches gender roles</text><rect x="30" y="318" width="140" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="349.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Domestic</text><text x="42" y="371.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">roles</text><rect x="178" y="318" width="225.33333333333334" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="348.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Natural complementary</text><text x="192" y="369.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">roles</text><rect x="411.33333333333337" y="318" width="225.33333333333334" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="425.33333333333337" y="348.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unpaid reproduction of</text><text x="425.33333333333337" y="369.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labour</text><rect x="644.6666666666667" y="318" width="225.33333333333334" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="658.6666666666667" y="348.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exploitation of women</text><rect x="30" y="400" width="140" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="431.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">View of</text><text x="42" y="453.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">change</text><rect x="178" y="400" width="225.33333333333334" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families adapt to fit</text><text x="192" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">society</text><rect x="411.33333333333337" y="400" width="225.33333333333334" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="425.33333333333337" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Change follows the</text><text x="425.33333333333337" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">economy</text><rect x="644.6666666666667" y="400" width="225.33333333333334" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="658.6666666666667" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Change depends on</text><text x="658.6666666666667" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">struggle</text><rect x="30" y="482" width="140" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="513.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Main</text><text x="42" y="535.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">weakness</text><rect x="178" y="482" width="225.33333333333334" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="192" y="512.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores conflict</text><rect x="411.33333333333337" y="482" width="225.33333333333334" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="425.33333333333337" y="512.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores gender and</text><text x="425.33333333333337" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">diversity</text><rect x="644.6666666666667" y="482" width="225.33333333333334" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="658.6666666666667" y="512.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May ignore choice and</text><text x="658.6666666666667" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">progress</text>
</svg>