<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="668" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Breach: weighing the risk against the precaution</text>

<line x1="250" y1="168" x2="650" y2="152" stroke="#1e2a44" stroke-width="6" stroke-linecap="round"/><path d="M450,160 L425,360 L475,360 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><rect x="380" y="360" width="140" height="14" rx="4" fill="#1e2a44"/><circle cx="450" cy="160" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M100,288 Q250,338 400,288 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="288" x2="250" y2="168" stroke="#1e2a44" stroke-width="2"/><line x1="390" y1="288" x2="250" y2="168" stroke="#1e2a44" stroke-width="2"/><path d="M500,272 Q650,322 800,272 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><line x1="510" y1="272" x2="650" y2="152" stroke="#1e2a44" stroke-width="2"/><line x1="790" y1="272" x2="650" y2="152" stroke="#1e2a44" stroke-width="2"/><text x="250" y="350" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">RISK</text><text x="250" y="374" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">how serious; who is vulnerable</text><text x="650" y="334" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">PRECAUTION</text><text x="650" y="358" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">its cost; the activity’s social utility</text><text x="450" y="116" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Weighed together, as a question of proportion</text><rect x="30" y="410" width="410" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="440" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FORESEEABLE VULNERABILITY</text><text x="48" y="471.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Haley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">London</tspan> <tspan font-style="italic">Electricity</tspan> <tspan font-style="italic">Board</tspan> (1964): hole</text><text x="48" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">guarded only by a hammer; a blind man tripped.</text><text x="48" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Blind pedestrians were foreseeable.</text><rect x="460" y="410" width="410" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="440" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SOCIAL UTILITY</text><text x="478" y="471.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Daborn</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bath</tspan> <tspan font-style="italic">Tramways</tspan> (1946): a</text><text x="478" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">left-hand-drive ambulance in wartime was</text><text x="478" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">justified by its purpose.</text><rect x="30" y="556" width="410" height="80" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="586.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cheap precaution, serious risk</text><text x="235" y="615.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Expected</text><rect x="460" y="556" width="410" height="80" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="586.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Extravagant precaution, small risk</text><text x="665" y="615.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Not expected</text>
</svg>