<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 808" width="900" height="808" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="808" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Damage: three hurdles after breach</text>

<rect x="30" y="100" width="840" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1  FACTUAL CAUSATION</text><text x="46" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">But for the breach, would the harm have occurred?</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">✗ <tspan font-style="italic">McWilliams</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Sir</tspan> <tspan font-style="italic">William</tspan> <tspan font-style="italic">Arrol</tspan> (1962): no harness provided, but he would not have worn one</text><line x1="450" y1="206" x2="450" y2="226" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="244" width="840" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="272" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2  NO BREAK IN THE CHAIN</text><text x="46" y="298.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Was there a new intervening act?</text><text x="46" y="327.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">✗ <tspan font-style="italic">Knightley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Johns</tspan> (1982): the inspector’s negligent order to ride the wrong way through the tunnel broke</text><text x="46" y="348.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the chain</text><line x1="450" y1="371" x2="450" y2="391" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="409" width="840" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="437" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">3  REMOTENESS: THE WAGON MOUND (No 1) (1961)</text><text x="46" y="463.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Was the TYPE of damage reasonably foreseeable?</text><text x="46" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Oil on water ignited and damaged a wharf: fire damage not foreseeable</text><rect x="30" y="533" width="272" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="559" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ TYPE, NOT MANNER</text><text x="44" y="590" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hughes</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lord</tspan> <tspan font-style="italic">Advocate</tspan> (1963):</text><text x="44" y="610" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">burns from an unforeseeable</text><text x="44" y="630" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">explosion. <tspan font-style="italic">Jolley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Sutton</tspan> <tspan font-style="italic">LBC</tspan></text><text x="44" y="650" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(2000): boy jacking up a boat</text><rect x="314" y="533" width="272" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="328" y="559" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ FORESEEABLE CATEGORY</text><text x="328" y="590" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Bradford</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Robinson</tspan> <tspan font-style="italic">Rentals</tspan></text><text x="328" y="610" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1967): cold injury foreseeable, so</text><text x="328" y="630" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">frostbite recoverable</text><rect x="598" y="533" width="272" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="612" y="559" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">✗ DIFFERENT TYPE</text><text x="612" y="590" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Doughty</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Turner</tspan> (1964): splash</text><text x="612" y="610" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">foreseeable, chemical eruption</text><text x="612" y="630" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">was not</text><rect x="30" y="688" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="722.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Thin skull rule</text><text x="50" y="751.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Once some harm is foreseeable, take the claimant as you find them (<tspan font-style="italic">Smith</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Leech</tspan> <tspan font-style="italic">Brain</tspan>, 1962).</text>
</svg>