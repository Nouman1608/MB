<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 734" width="900" height="734" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="734" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked problem: Sana’s exposed cable</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Theo gets a shock and, with a heart condition, a cardiac arrest; the fridge is scorched</text>
<line x1="60" y1="144" x2="60" y2="551" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DUTY</text><text x="118" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Established: electrician to people on premises and the property owner</text><text x="118" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Donoghue</tspan>. No need for <tspan font-style="italic">Caparo</tspan> (<tspan font-style="italic">Robinson</tspan>).</text><circle cx="60" cy="173.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="182.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="233" width="766" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="259" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BREACH</text><text x="118" y="285.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Standard of a competent electrician, despite inexperience</text><text x="118" y="313.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Nettleship</tspan>; <tspan font-style="italic">Bolam</tspan>. Departing from the approved code is strong evidence. Serious risk, cheap</text><text x="118" y="334.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">precaution.</text><circle cx="60" cy="293" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="301.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="363" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="389" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAUSATION</text><text x="118" y="415.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">But for the exposed cable, no shock</text><text x="118" y="443.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No intervening act.</text><circle cx="60" cy="412.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="421.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="472" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="498" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REMOTENESS</text><text x="118" y="524.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shock injury foreseeable; heat damage to the fridge foreseeable</text><text x="118" y="552.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cardiac arrest: thin skull rule (<tspan font-style="italic">Smith</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Leech</tspan> <tspan font-style="italic">Brain</tspan>), full extent. Fridge: <tspan font-style="italic">Wagon</tspan> <tspan font-style="italic">Mound</tspan>.</text><circle cx="60" cy="521.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="530.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="591" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="625.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="655.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sana is likely liable for Theo’s injuries and the fridge. Inexperience is dealt with at breach and does</text><text x="50" y="677.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">not lower the standard.</text>
</svg>