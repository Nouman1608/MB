<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" width="900" height="648" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="648" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Caparo questions in the cases</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Caparo Industries v Dickman (1990), as clarified in Robinson (2018)</text>
<rect x="30" y="124" width="411" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ESTABLISHED CATEGORY</text><text x="48" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">State it, cite an authority</text><text x="48" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Road users, doctor and patient, employer and</text><text x="48" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">employee, manufacturer and consumer</text><text x="48" y="251.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Donoghue</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Stevenson</tspan>)</text><rect x="459" y="124" width="411" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="154" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">NOVEL SITUATION</text><text x="477" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Decide incrementally</text><text x="477" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">By analogy with existing cases, using the three</text><text x="477" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">questions as a guide</text><clipPath id="tc296"><rect x="30" y="296" width="840" height="320" rx="14"/></clipPath><g clip-path="url(#tc296)"><rect x="30" y="296" width="228" height="48" fill="#b5d3cf"/><text x="44" y="323.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Question</text><rect x="258" y="296" width="204" height="48" fill="#b5d3cf"/><text x="272" y="323.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Case</text><rect x="462" y="296" width="408" height="48" fill="#b5d3cf"/><text x="476" y="323.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Point</text><rect x="30" y="344" width="228" height="68" fill="#dce9e7"/><text x="44" y="370.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Foreseeability of the</text><text x="44" y="391.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">claimant</text><rect x="258" y="344" width="204" height="68" fill="#ffffff"/><text x="272" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Bourhill</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Young</tspan></text><text x="272" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1943)</text><rect x="462" y="344" width="408" height="68" fill="#ffffff"/><text x="476" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Woman who heard a crash from a distance: not</text><text x="476" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foreseeably affected</text><line x1="30" y1="412" x2="870" y2="412" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="412" width="228" height="68" fill="#dce9e7"/><text x="44" y="438.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Proximity</text><rect x="258" y="412" width="204" height="68" fill="#f8faf9"/><text x="272" y="438.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Kent</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Griffiths</tspan> (2000)</text><rect x="462" y="412" width="408" height="68" fill="#f8faf9"/><text x="476" y="438.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ambulance service accepted the 999 call: duty to</text><text x="476" y="459.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the named patient</text><line x1="30" y1="480" x2="870" y2="480" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="480" width="228" height="68" fill="#dce9e7"/><text x="44" y="506.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Fair, just and reasonable</text><rect x="258" y="480" width="204" height="68" fill="#ffffff"/><text x="272" y="506.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hill</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">CC</tspan> <tspan font-style="italic">West</tspan></text><text x="272" y="527.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Yorkshire</tspan> (1989)</text><rect x="462" y="480" width="408" height="68" fill="#ffffff"/><text x="476" y="506.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No police duty to an unidentified future victim</text><line x1="30" y1="548" x2="870" y2="548" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="548" width="228" height="68" fill="#dce9e7"/><text x="44" y="574.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Positive act, not</text><text x="44" y="595.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">omission</text><rect x="258" y="548" width="204" height="68" fill="#f8faf9"/><text x="272" y="574.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Robinson</tspan> (2018)</text><rect x="462" y="548" width="408" height="68" fill="#f8faf9"/><text x="476" y="574.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Officers who knocked over a pedestrian during an</text><text x="476" y="595.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">arrest owed a duty</text></g><line x1="258" y1="296" x2="258" y2="616" stroke="#c9d6d4" stroke-width="1.5"/><line x1="462" y1="296" x2="462" y2="616" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="296" width="840" height="320" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>