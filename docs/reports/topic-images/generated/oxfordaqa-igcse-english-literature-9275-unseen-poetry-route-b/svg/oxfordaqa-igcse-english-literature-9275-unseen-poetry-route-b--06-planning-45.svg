<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning your 45 minutes</text><rect x="30" y="130" width="56" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="58" y="170" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="86" y="130" width="112" height="64" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="142" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Four lenses</text><text x="142" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">6 min</text><rect x="198" y="130" width="37.333333333333336" height="64" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="216.66666666666666" y="170" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="235.33333333333334" y="130" width="37.333333333333336" height="64" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="254" y="170" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="272.6666666666667" y="130" width="597.3333333333334" height="64" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="571.3333333333334" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Write</text><text x="571.3333333333334" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">about 30 min, then check</text><text x="30" y="118" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">Section B: 45 minutes</text>

<rect x="30" y="214" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="262" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="269.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="253.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read for sense (3 minutes)</text><text x="104" y="283.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Write a one-sentence summary.</text><line x1="450" y1="314" x2="450" y2="350" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="356" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="404" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="411.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="395.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Four lenses (6 minutes)</text><text x="104" y="425.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One or two notes under content, theme, structure and language.</text><line x1="450" y1="456" x2="450" y2="492" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="498" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="546" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="553.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="537.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Argument (2 minutes)</text><text x="104" y="567.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One sentence that answers the question directly.</text><line x1="450" y1="598" x2="450" y2="634" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="640" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="688" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="695.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="679.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Order (2 minutes)</text><text x="104" y="709.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Three or four points that move through the poem, ending with the ending.</text><line x1="450" y1="740" x2="450" y2="776" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="782" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="830" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="837.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="821.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Write (about 30 minutes)</text><text x="104" y="851.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Then check the final paragraph returns to your argument.</text>
