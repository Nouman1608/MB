<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Night Shift: evening, night, morning</text>

<rect x="30" y="110" width="190" height="114" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="163" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Evening</text><text x="125" y="189" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Stanza 1</text><rect x="232" y="110" width="638" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="252" y="144.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The bus "takes" her; slippers "pointing in, as if her feet / might</text><text x="252" y="166.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">change their mind"</text><text x="252" y="206" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">→ leaving against her wishes</text><line x1="125" y1="228" x2="125" y2="254" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="258" width="190" height="114" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="311" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Night</text><text x="125" y="337" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Stanza 2</text><rect x="232" y="258" width="638" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="252" y="292.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"All night the hospital keeps her. / All night I keep the house";</text><text x="252" y="314.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the dog "who listens for the gate"</text><text x="252" y="354" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">→ the speaker on duty, waiting</text><line x1="125" y1="376" x2="125" y2="402" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="406" width="190" height="92" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="448" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Morning</text><text x="125" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Stanza 3</text><rect x="232" y="406" width="638" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="252" y="440.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"grey with work"; "and the house, at last, lets go"</text><text x="252" y="480" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">→ release of tension</text><text x="450" y="524" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">"Night Shift" is an original poem written for the guide</text><rect x="30" y="538" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="574" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Structure carries the feeling</text><text x="56" y="603" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The speaker’s feelings are never named: they are carried by the house. Commas in the</text><text x="56" y="625" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">final line slow the reading, so the release feels like a long breath out.</text>
</svg>