<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where Section B sits on Route B</text>

<rect x="30" y="130" width="420" height="96" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="170" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: People and Places</text><text x="240" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">30 marks · about 45 minutes</text><rect x="450" y="130" width="420" height="96" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="660" y="170" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: Unseen poem</text><text x="660" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">30 marks · a full 45 minutes</text><text x="30" y="116" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">Paper 2b: 1 hour 30 minutes, open book, 60 marks</text><rect x="30" y="246" width="412" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,296 L31.25,260.25 Q31.25,247.25 44.25,247.25 L427.75,247.25 Q440.75,247.25 440.75,260.25 L440.75,296 Z" fill="#f2e7b8"/><line x1="31.25" y1="296" x2="440.75" y2="296" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="276.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">It comes second</text><text x="44" y="327.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">You arrive after 45 minutes of anthology</text><text x="44" y="348.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">writing. Leaving a full 45 minutes is the</text><text x="44" y="369.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">most important piece of exam management on</text><text x="44" y="390.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">this paper.</text><rect x="458" y="246" width="412" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,296 L459.25,260.25 Q459.25,247.25 472.25,247.25 L855.75,247.25 Q868.75,247.25 868.75,260.25 L868.75,296 Z" fill="#b5d3cf"/><line x1="459.25" y1="296" x2="868.75" y2="296" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="276.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The skills transfer</text><text x="472" y="327.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Comparison from Section A helps: compare the</text><text x="472" y="348.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">start of the unseen poem with its end, or one</text><text x="472" y="369.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">image with another.</text><rect x="30" y="432" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="468" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Route B only</text><text x="56" y="497" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The non-exam assessment replaces Route A’s unseen prose, so this is the only "unseen"</text><text x="56" y="519" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">task you face.</text>
</svg>