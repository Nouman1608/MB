<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 637" width="900" height="637" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="637" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four lenses from the specification</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">read the poem once through each lens; note one or two points under each</text>
<rect x="198" y="120" width="332" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="364" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Question to ask</text><rect x="538" y="120" width="332" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="704" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What it gives you</text><rect x="30" y="172" width="160" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="213.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Content</text><rect x="198" y="172" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="202.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What literally happens, who speaks,</text><text x="212" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to whom, where?</text><rect x="538" y="172" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="202.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A secure surface reading, so</text><text x="552" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interpretation rests on fact</text><rect x="30" y="252" width="160" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="293.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Theme</text><rect x="198" y="252" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="282.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What larger idea: love, loss, work,</text><text x="212" y="303.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">belonging?</text><rect x="538" y="252" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="282.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Your argument (AO1)</text><rect x="30" y="332" width="160" height="72" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="373.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><rect x="198" y="332" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="362.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How is it organised: stanzas, line</text><text x="212" y="383.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lengths, a turn, the ending?</text><rect x="538" y="332" width="332" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="362.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Analysis of shape and development</text><text x="552" y="383.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(AO2)</text><rect x="30" y="412" width="160" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="443.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Use of</text><text x="42" y="465.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">language</text><rect x="198" y="412" width="332" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="442.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Which words, images, sounds and</text><text x="212" y="463.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tones stand out?</text><rect x="538" y="412" width="332" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="442.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Close analysis of detail (AO2)</text><rect x="30" y="502" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="538" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The lens most often left out: structure</text><text x="56" y="567" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Always ask what changes between the first stanza and the last, and where exactly it</text><text x="56" y="589" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">changes.</text>
</svg>