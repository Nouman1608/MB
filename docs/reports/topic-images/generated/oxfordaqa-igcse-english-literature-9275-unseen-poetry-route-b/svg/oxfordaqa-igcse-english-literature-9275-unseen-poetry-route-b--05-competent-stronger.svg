<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 581" width="900" height="581" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="581" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From competent to stronger</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">“How does the poet present the speaker’s feelings about her mother’s work?”</text>
<rect x="168" y="120" width="347" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="341.5" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Competent paragraph</text><rect x="523" y="120" width="347" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="696.5" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Stronger version</text><rect x="30" y="172" width="130" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="203.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Point</text><text x="42" y="225.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(AO1)</text><rect x="168" y="172" width="347" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="202.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"The poet shows that the speaker</text><text x="182" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">misses her mother."</text><rect x="523" y="172" width="347" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="202.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Opens with an argument: work takes</text><text x="537" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the mother away against her wishes.</text><rect x="30" y="254" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="294.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><text x="42" y="316.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(AO2)</text><rect x="168" y="254" width="347" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="284.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Names a technique loosely: "pointing</text><text x="182" y="305.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in" called personification.</text><rect x="523" y="254" width="347" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="284.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Analyses the verb "takes", the</text><text x="537" y="305.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">slippers image and the line break</text><text x="537" y="326.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">after "feet".</text><rect x="30" y="355" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="406.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Effect</text><rect x="168" y="355" width="347" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="385.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">General: the speaker is "sad".</text><rect x="523" y="355" width="347" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="385.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The pause holds the hope she might</text><text x="537" y="406.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">turn back before "change their mind"</text><text x="537" y="427.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">admits she will not.</text><rect x="30" y="456" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="496.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Response</text><text x="42" y="518.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(AO3)</text><rect x="168" y="456" width="347" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="486.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Detail not connected to the rest of</text><text x="182" y="507.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the poem.</text><rect x="523" y="456" width="347" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="486.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tentative and precise: the speaker</text><text x="537" y="507.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">watches "closely, and perhaps</text><text x="537" y="528.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anxiously".</text>
</svg>