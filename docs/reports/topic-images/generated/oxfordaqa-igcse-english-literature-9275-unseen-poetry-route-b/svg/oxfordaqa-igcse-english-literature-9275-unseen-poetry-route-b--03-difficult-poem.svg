<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 687" width="900" height="687" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Coping with a difficult poem</text>

<rect x="238" y="104" width="632" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="554" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Strategy</text><rect x="30" y="156" width="200" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="187.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Work from what is</text><text x="42" y="209.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">clear</text><rect x="238" y="156" width="632" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Anchor your reading in lines you understand, then return to the</text><text x="252" y="209.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">difficult ones.</text><rect x="30" y="238" width="200" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="280.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Unfamiliar word</text><rect x="238" y="238" width="632" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Guess from what surrounds it; if not, write about the effect of the</text><text x="252" y="291.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sound or image.</text><rect x="30" y="320" width="200" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="362.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Older poems</text><rect x="238" y="320" width="632" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rearrange unusual word order into normal order, then ask what the</text><text x="252" y="373.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">poet gained by changing it.</text><rect x="30" y="402" width="200" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="444.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Unclear speaker</text><rect x="238" y="402" width="632" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="433.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Say so and offer two possibilities: a thoughtful, exploratory</text><text x="252" y="455.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">response.</text><rect x="30" y="484" width="200" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="515.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ambiguous ending</text><rect x="238" y="484" width="632" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="515.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Offer two readings and say which is more convincing, and why.</text><rect x="30" y="552" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="588" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Tentative language is a strength</text><text x="56" y="617" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"perhaps", "this could suggest", "the reader might feel", as long as each suggestion is</text><text x="56" y="639" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">supported by a quotation.</text>
</svg>