fill="#1e2a44" text-anchor="start">Each pass of the loop</text><rect x="494" y="168" width="352" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="512" y="202" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">MOD 10</text><text x="600" y="201" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">peels off the last digit</text><rect x="494" y="234" width="352" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="512" y="268" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">DIV 10</text><text x="600" y="267" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">removes it</text><text x="494" y="304" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The loop stops when number reaches 0.</text><rect x="30" y="351" width="840" height="50" rx="10" fill="#1e2a44"/><text x="44" y="382" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">number (start of pass)</text><text x="294" y="382" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">number MOD 10</text><text x="494" y="382" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">digitSum</text><text x="674" y="382" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">number DIV 10</text><rect x="30" y="401" width="840" height="51" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="431.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">4827</text><text x="294" y="431.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">7</text><line x1="280" y1="401" x2="280" y2="452" stroke="#c9d6d4" stroke-width="2"/><text x="494" y="431.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">7</text><line x1="480" y1="401" x2="480" y2="452" stroke="#c9d6d4" stroke-width="2"/><text x="674" y="431.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">482</text><line x1="660" y1="401" x2="660" y2="452" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="452" width="840" height="51" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="482.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">482</text><text x="294" y="482.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">2</text><line x1="280" y1="452" x2="280" y2="503" stroke="#c9d6d4" stroke-width="2"/><text x="494" y="482.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">9</text><line x1="480" y1="452" x2="480" y2="503" stroke="#c9d6d4" stroke-width="2"/><text x="674" y="482.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">48</text><line x1="660" y1="452" x2="660" y2="503" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="503" width="840" height="51" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="533.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">48</text><text x="294" y="533.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">8</text><line x1="280" y1="503" x2="280" y2="554" stroke="#c9d6d4" stroke-width="2"/><text x="494" y="533.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">17</text><line x1="480" y1="503" x2="480" y2="554" stroke="#c9d6d4" stroke-width="2"/><text x="674" y="533.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">4</text><line x1="660" y1="503" x2="660" y2="554" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="554" width="840" height="51" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="584.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">4</text><text x="294" y="584.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">4</text><line x1="280" y1="554" x2="280" y2="605" stroke="#c9d6d4" stroke-width="2"/><text x="494" y="584.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">21</text><line x1="480" y1="554" x2="480" y2="605" stroke="#c9d6d4" stroke-width="2"/><text x="674" y="584.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">0</text><line x1="660" y1="554" x2="660" y2="605" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="625" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="663" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Output:</text><text x="140" y="664" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">21</text><text x="190" y="663" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">(7 + 2 + 8 + 4)</text>
