"13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="568" cy="189" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="612" cy="189" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><rect x="660" y="120" width="210" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="694" cy="147" r="13" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="738" cy="147" r="13" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="694" cy="189" r="13" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="338" y="248" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">23 counters: 5 full groups of 4</text><text x="765" y="248" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">3 left</text><rect x="30" y="280" width="408" height="84" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="312" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Stage 1</text><text x="54" y="344" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">23 DIV 4 → 5</text><rect x="462" y="280" width="408" height="84" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="486" y="312" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Stage 2</text><text x="486" y="344" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">23 MOD 4 → 3</text><rect x="30" y="388" width="840" height="92" rx="14" fill="#1e2a44"/><text x="54" y="422" font-size="15" font-weight="700" fill="#d4b02e" text-anchor="start">CHECK ANY PAIR</text><text x="54" y="458" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">(23 DIV 4) * 4 + (23 MOD 4) = 5 * 4 + 3 = 23</text><rect x="30" y="504" width="411" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="537" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FIRST NUMBER SMALLER</text><text x="50" y="565" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">3 DIV 8 = 0, 3 MOD 8 = 3</text><text x="50" y="594.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">DIV is 0 and MOD is the first number.</text><rect x="459" y="504" width="411" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="537" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXACT DIVISION</text><text x="479" y="565" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">24 MOD 6 = 0</text><text x="479" y="594.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Nothing is left over, so the remainder is 0.</text>
