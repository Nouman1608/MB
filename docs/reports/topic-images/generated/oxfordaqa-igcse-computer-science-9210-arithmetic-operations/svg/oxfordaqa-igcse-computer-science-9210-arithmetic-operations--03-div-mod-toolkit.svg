<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 686" width="900" height="686" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="686" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">DIV and MOD as tools in algorithms</text>

<rect x="30" y="112" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Last digit and the rest of a number</text><rect x="70" y="174" width="54" height="66" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="97" y="219" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="132" y="174" width="54" height="66" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="159" y="219" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="194" y="174" width="54" height="66" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="221" y="219" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="275" y1="194" x2="420" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="275" y1="230" x2="420" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="436" y="202" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">472 MOD 10 = 2</text><text x="660" y="201" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the last digit</text><text x="436" y="238" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">472 DIV 10 = 47</text><text x="660" y="237" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the last digit removed</text><rect x="30" y="304" width="411" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="342" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Convert units: 200 minutes</text><text x="54" y="388" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">200 DIV 60 = 3</text><text x="54" y="414" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">DIV gives the large unit: 3 hours</text><text x="54" y="452" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">200 MOD 60 = 20</text><text x="54" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">MOD gives the rest: 20 minutes</text><rect x="459" y="304" width="411" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="483" y="342" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Share into groups: 50 eggs</text><text x="483" y="388" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">50 DIV 6 = 8</text><text x="483" y="414" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">DIV gives full boxes of 6: 8 boxes</text><text x="483" y="452" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">50 MOD 6 = 2</text><text x="483" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">MOD gives the leftovers: 2 eggs</text><rect x="30" y="522" width="268" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="555" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVEN?</text><text x="50" y="582.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">n MOD 2 = 0</text><text x="50" y="610.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">14 MOD 2 = 0, so 14 is even</text><rect x="316" y="522" width="268" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="555" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A FACTOR?</text><text x="336" y="582.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">a MOD b = 0</text><text x="336" y="610.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">35 MOD 7 = 0, so 7 is a factor</text><text x="336" y="631.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of 35</text><rect x="602" y="522" width="268" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="555" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REPEAT A PATTERN</text><text x="622" y="582.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">day MOD 7</text><text x="622" y="610.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cycles through 0 to 6: a</text><text x="622" y="631.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">weekday number</text>
</svg>