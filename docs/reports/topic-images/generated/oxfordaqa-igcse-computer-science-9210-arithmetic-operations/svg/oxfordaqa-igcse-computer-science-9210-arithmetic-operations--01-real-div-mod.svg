<text x="450" y="132" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Share 8 into groups of 5</text><rect x="232" y="150" width="270" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="262" cy="181" r="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="314" cy="181" r="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="366" cy="181" r="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="418" cy="181" r="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="470" cy="181" r="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><rect x="532" y="150" width="166" height="62" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="563" cy="181" r="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="615" cy="181" r="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="667" cy="181" r="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="367" y="238" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">1 full group</text><text x="615" y="238" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">3 left over</text><rect x="30" y="268" width="264" height="184" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="162" y="310" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">8 / 5</text><line x1="162" y1="326" x2="162" y2="360" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="162" y="402" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="38" font-weight="700" fill="#1e2a44" text-anchor="middle">1.6</text><text x="162" y="436" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Real</text><rect x="318" y="268" width="264" height="184" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="310" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">8 DIV 5</text><line x1="450" y1="326" x2="450" y2="360" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="402" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="38" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="450" y="436" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Integer: whole groups</text><rect x="606" y="268" width="264" height="184" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="738" y="310" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">8 MOD 5</text><line x1="738" y1="326" x2="738" y2="360" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="738" y="402" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="38" font-weight="700" fill="#8a6d0d" text-anchor="middle">3</text><text x="738" y="436" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Integer: remainder</text><rect x="30" y="478" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="516" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">In the exam pseudocode, / is always real division:</text><text x="560" y="516" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">7 / 2 = 3.5</text><text x="54" y="550" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Python writes DIV as // and MOD as %. In C#, int / int gives a whole number.</text>
