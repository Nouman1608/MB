<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Constructing symbols to scale</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Circle area, not radius, is proportional to the value</text>
<rect x="30" y="124" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="280" r="44" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><line x1="150" y1="280" x2="194" y2="280" stroke="#1e2a44" stroke-width="2"/><text x="150" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2,500 visitors</text><text x="150" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">radius 8 mm</text><circle cx="390" cy="253.6" r="70.4" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><line x1="390" y1="253.6" x2="460.4" y2="253.6" stroke="#1e2a44" stroke-width="2"/><text x="390" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6,400 visitors</text><text x="390" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">8 x √(6,400/2,500) = 12.8 mm</text><circle cx="700" cy="236" r="88" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><line x1="700" y1="236" x2="788" y2="236" stroke="#1e2a44" stroke-width="2"/><text x="700" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">10,000 visitors</text><text x="700" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">8 x √4 = 16 mm</text><line x1="50" y1="324" x2="850" y2="324" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="424" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Four times the value gives twice the radius (four times the area)</text><text x="860" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Drawn to scale</text><rect x="30" y="470" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="504" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Flow line: 1 mm = 500 vehicles a day</text><rect x="50" y="530" width="560" height="37.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><path d="M610,530 l40,18.75 l-40,18.75 z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="670" y="548" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">3,750 / 500 =</text><text x="670" y="570" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">7.5 mm wide</text>
</svg>