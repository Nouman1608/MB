<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Interpolating an isoline</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Where does the 160 line cross between A and B?</text>
<rect x="30" y="124" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="150" y1="214" x2="700" y2="214" stroke="#1e2a44" stroke-width="3"/><line x1="150" y1="224" x2="150" y2="236" stroke="#4a5568" stroke-width="2"/><text x="150" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><line x1="260" y1="224" x2="260" y2="236" stroke="#4a5568" stroke-width="2"/><text x="260" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">5</text><line x1="370" y1="224" x2="370" y2="236" stroke="#4a5568" stroke-width="2"/><line x1="480" y1="224" x2="480" y2="236" stroke="#4a5568" stroke-width="2"/><text x="480" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">15</text><line x1="590" y1="224" x2="590" y2="236" stroke="#4a5568" stroke-width="2"/><text x="590" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">20</text><line x1="700" y1="224" x2="700" y2="236" stroke="#4a5568" stroke-width="2"/><text x="700" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">25</text><text x="716" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mm</text><circle cx="150" cy="214" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="150" y="190" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A = 140</text><circle cx="700" cy="214" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="700" y="190" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">B = 190</text><path d="M340,144 C360,184 380,244 350,354" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="370" cy="214" r="7" fill="#b5602e"/><text x="384" y="164" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">160 isoline</text><path d="M150,278 L150,288 L370,288 L370,278" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="260" y="312" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">10 mm</text><text x="860" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Drawn to scale (enlarged)</text><line x1="60" y1="410" x2="60" y2="643" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="390" width="766" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="422.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fraction of the way from A</text><text x="122" y="450.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(160 - 140) / (190 - 140) = 20 / 50 = 0.4</text><circle cx="60" cy="431.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="440.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="485" width="766" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="517.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Convert to distance</text><text x="122" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">0.4 x 25 mm = <tspan font-weight="700" fill="#1e2a44">10</tspan> <tspan font-weight="700" fill="#1e2a44">mm</tspan> <tspan font-weight="700" fill="#1e2a44">from</tspan> <tspan font-weight="700" fill="#1e2a44">A</tspan></text><circle cx="60" cy="526.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="535.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="580" width="766" height="83" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="612.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Know the assumption</text><text x="122" y="640.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The value changes evenly between points, so isoline maps need dense data.</text><circle cx="60" cy="621.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="630.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
</svg>