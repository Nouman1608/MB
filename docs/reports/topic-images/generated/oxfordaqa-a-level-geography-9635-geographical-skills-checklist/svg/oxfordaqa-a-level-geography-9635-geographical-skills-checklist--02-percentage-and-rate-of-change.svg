<rect width="900" height="533" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Percentage change and rate of change</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">An invented town growing over 12 years</text>
<rect x="230" y="124" width="456" height="56" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="214" y="159" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Old population</text><text x="698" y="159" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">48,000</text><rect x="230" y="200" width="581.4" height="56" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="214" y="235" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">New population</text><text x="823.4" y="235" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">61,200</text><rect x="686" y="200" width="125.39999999999999" height="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="748.7" y="235" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+13,200</text><line x1="230" y1="116" x2="230" y2="264" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Bars to scale, starting from zero</text><rect x="30" y="312" width="411" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="344" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PERCENTAGE CHANGE</text><text x="50" y="371.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">(new - old) / old x 100</text><text x="50" y="402.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">13,200 / 48,000 x 100 = <tspan font-weight="700" fill="#1e2a44">27.5%</tspan></text><rect x="459" y="312" width="411" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="344" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MEAN RATE OF CHANGE</text><text x="479" y="371.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">change / time</text><text x="479" y="402.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">13,200 / 12 = <tspan font-weight="700" fill="#1e2a44">1,100</tspan> <tspan font-weight="700" fill="#1e2a44">people</tspan> <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">year</tspan></text><rect x="30" y="444" width="840" height="57" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Give units, and round to the precision of the original data.</text>
</svg>