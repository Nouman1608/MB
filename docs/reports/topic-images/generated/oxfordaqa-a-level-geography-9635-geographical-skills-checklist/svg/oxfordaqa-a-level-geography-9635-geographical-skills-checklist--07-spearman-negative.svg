<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A negative Spearman's rank</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Distance from the town centre and recorded crimes (invented)</text>
<rect x="30" y="124" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="424" x2="470" y2="424" stroke="#1e2a44" stroke-width="2.5"/><line x1="110" y1="424" x2="110" y2="154" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><text x="200" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1</text><text x="290" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2</text><text x="380" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">3</text><text x="470" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">4</text><text x="100" y="429" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">10</text><text x="100" y="351.8571428571429" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">20</text><text x="100" y="274.7142857142857" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">30</text><text x="100" y="197.57142857142858" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">40</text><text x="290" y="470" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Distance from centre (km)</text><text transform="translate(58,289) rotate(-90)" text-anchor="middle" font-size="16" font-weight="600" fill="#1e2a44">Recorded crimes</text><circle cx="128" cy="177.14285714285714" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="140" y="169.14285714285714" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">A</text><circle cx="155" cy="208" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="167" y="200" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">B</text><circle cx="191" cy="192.57142857142858" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="203" y="184.57142857142858" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">C</text><circle cx="227" cy="277.42857142857144" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="239" y="269.42857142857144" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">D</text><circle cx="272" cy="308.2857142857143" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="284" y="300.2857142857143" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">E</text><circle cx="326" cy="292.8571428571429" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="338" y="284.8571428571429" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">F</text><circle cx="380" cy="362.2857142857143" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="392" y="354.2857142857143" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">G</text><circle cx="443" cy="385.42857142857144" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="455" y="377.42857142857144" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">H</text><text x="510" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Σd² = 164, n = 8</text><text x="510" y="208" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rs = 1 - (6 x 164) / (8³ - 8)</text><text x="510" y="234" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">    = 1 - 984 / 504 = -0.952</text><text x="510" y="274" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Sign: direction (negative)</text><text x="510" y="298" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Size: strength (ignore the sign</text><text x="510" y="320" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">when comparing)</text><line x1="510" y1="394" x2="840" y2="394" stroke="#1e2a44" stroke-width="3"/><text x="510" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><text x="840" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1</text><line x1="753.54" y1="380" x2="753.54" y2="408" stroke="#8a6d0d" stroke-width="3"/><text x="757.54" y="374" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="end">0.738 (0.05)</text><line x1="800.73" y1="380" x2="800.73" y2="408" stroke="#8a6d0d" stroke-width="3"/><text x="804.73" y="352" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="end">0.881 (0.01)</text><circle cx="824.16" cy="394" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="836.16" y="442" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">|rs| = 0.952</text><text x="510" y="468" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Critical values, n = 8, two-tailed</text><rect x="30" y="500" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="534.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reject the null hypothesis at the 0.01 level</text><text x="50" y="563.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crime falls significantly with distance from the centre, but correlation does not show why: land use,</text><text x="50" y="584.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">footfall and reporting rates could all be involved.</text>
</svg>