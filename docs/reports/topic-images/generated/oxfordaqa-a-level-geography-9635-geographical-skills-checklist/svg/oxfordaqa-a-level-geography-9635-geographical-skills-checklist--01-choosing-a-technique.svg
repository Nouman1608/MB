<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Start from the type of data</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Matching presentation and statistics to data (from the lesson's table)</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="502" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="269.2307692307692" height="42" fill="#b5d3cf"/><text x="41" y="148.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Data</text><rect x="299.2307692307692" y="124" width="344.6153846153846" height="42" fill="#b5d3cf"/><text x="310.2307692307692" y="148.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Presentation</text><rect x="643.8461538461538" y="124" width="226.15384615384613" height="42" fill="#f2e7b8"/><text x="654.8461538461538" y="148.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Statistic</text><rect x="30" y="166" width="269.2307692307692" height="40" fill="#dce9e7"/><text x="41" y="189" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Values at named points</text><rect x="299.2307692307692" y="166" width="344.6153846153846" height="40" fill="#ffffff"/><text x="310.2307692307692" y="189" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Located proportional symbols or bar graphs</text><rect x="643.8461538461538" y="166" width="226.15384615384613" height="40" fill="#ffffff"/><text x="654.8461538461538" y="189" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mean, median, dispersion</text><line x1="30" y1="206" x2="870" y2="206" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="206" width="269.2307692307692" height="60" fill="#dce9e7"/><text x="41" y="229" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Values for areas</text><rect x="299.2307692307692" y="206" width="344.6153846153846" height="60" fill="#f8faf9"/><text x="310.2307692307692" y="229" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Choropleth (rates or densities only)</text><rect x="643.8461538461538" y="206" width="226.15384615384613" height="60" fill="#f8faf9"/><text x="654.8461538461538" y="229" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Median and IQR across</text><text x="654.8461538461538" y="249" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">areas</text><line x1="30" y1="266" x2="870" y2="266" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="266" width="269.2307692307692" height="40" fill="#dce9e7"/><text x="41" y="289" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Continuous surfaces</text><rect x="299.2307692307692" y="266" width="344.6153846153846" height="40" fill="#ffffff"/><text x="310.2307692307692" y="289" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Isoline map</text><rect x="643.8461538461538" y="266" width="226.15384615384613" height="40" fill="#ffffff"/><line x1="30" y1="306" x2="870" y2="306" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="306" width="269.2307692307692" height="40" fill="#dce9e7"/><text x="41" y="329" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Movements between places</text><rect x="299.2307692307692" y="306" width="344.6153846153846" height="40" fill="#f8faf9"/><text x="310.2307692307692" y="329" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Flow, desire or trip lines</text><rect x="643.8461538461538" y="306" width="226.15384615384613" height="40" fill="#f8faf9"/><line x1="30" y1="346" x2="870" y2="346" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="346" width="269.2307692307692" height="60" fill="#dce9e7"/><text x="41" y="369" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Change over time</text><rect x="299.2307692307692" y="346" width="344.6153846153846" height="60" fill="#ffffff"/><text x="310.2307692307692" y="369" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Line graph</text><rect x="643.8461538461538" y="346" width="226.15384615384613" height="60" fill="#ffffff"/><text x="654.8461538461538" y="369" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Percentage change, rate of</text><text x="654.8461538461538" y="389" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">change</text><line x1="30" y1="406" x2="870" y2="406" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="406" width="269.2307692307692" height="40" fill="#dce9e7"/><text x="41" y="429" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Two continuous variables</text><rect x="299.2307692307692" y="406" width="344.6153846153846" height="40" fill="#f8faf9"/><text x="310.2307692307692" y="429" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Scatter graph with best fit line</text><rect x="643.8461538461538" y="406" width="226.15384615384613" height="40" fill="#f8faf9"/><text x="654.8461538461538" y="429" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Spearman's rank</text><line x1="30" y1="446" x2="870" y2="446" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="446" width="269.2307692307692" height="40" fill="#dce9e7"/><text x="41" y="469" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Counts in categories</text><rect x="299.2307692307692" y="446" width="344.6153846153846" height="40" fill="#ffffff"/><text x="310.2307692307692" y="469" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Bar graph, pie chart, divided circle</text><rect x="643.8461538461538" y="446" width="226.15384615384613" height="40" fill="#ffffff"/><text x="654.8461538461538" y="469" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Chi-square</text><line x1="30" y1="486" x2="870" y2="486" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="486" width="269.2307692307692" height="40" fill="#dce9e7"/><text x="41" y="509" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Three parts summing to 100%</text><rect x="299.2307692307692" y="486" width="344.6153846153846" height="40" fill="#f8faf9"/><text x="310.2307692307692" y="509" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Triangular graph</text><rect x="643.8461538461538" y="486" width="226.15384615384613" height="40" fill="#f8faf9"/><line x1="30" y1="526" x2="870" y2="526" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="526" width="269.2307692307692" height="40" fill="#dce9e7"/><text x="41" y="549" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Several orders of magnitude</text><rect x="299.2307692307692" y="526" width="344.6153846153846" height="40" fill="#ffffff"/><text x="310.2307692307692" y="549" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Logarithmic scale</text><rect x="643.8461538461538" y="526" width="226.15384615384613" height="40" fill="#ffffff"/><line x1="30" y1="566" x2="870" y2="566" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="566" width="269.2307692307692" height="60" fill="#dce9e7"/><text x="41" y="589" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Spread of one data set</text><rect x="299.2307692307692" y="566" width="344.6153846153846" height="60" fill="#f8faf9"/><text x="310.2307692307692" y="589" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Dispersion diagram</text><rect x="643.8461538461538" y="566" width="226.15384615384613" height="60" fill="#f8faf9"/><text x="654.8461538461538" y="589" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Range, IQR, standard</text><text x="654.8461538461538" y="609" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">deviation</text></g><line x1="299.2307692307692" y1="124" x2="299.2307692307692" y2="626" stroke="#c9d6d4" stroke-width="1.5"/><line x1="643.8461538461538" y1="124" x2="643.8461538461538" y2="626" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="502" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="642" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="676.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A justification has two parts</text><text x="50" y="705.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What the technique shows, and why that suits these data: "a scatter graph, because it shows whether</text><text x="50" y="726.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">two continuous variables are related and reveals anomalies".</text>
</svg>