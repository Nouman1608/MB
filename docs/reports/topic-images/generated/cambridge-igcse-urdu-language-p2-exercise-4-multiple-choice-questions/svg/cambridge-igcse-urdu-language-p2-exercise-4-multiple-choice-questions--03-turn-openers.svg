<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 958" width="900" height="958" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="958" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The first words of a reply show the reaction</text>

<rect x="30" y="110" width="840" height="688" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reaction</text><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Urdu turn-openers</text><line x1="250" y1="110" x2="250" y2="798" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="206.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">full agreement</text><text x="854" y="218.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بالکل ٹھیک، میں آپ سے متفق ہوں، چلو یہی ٹھیک ہے&#x200F;</text><rect x="32" y="244" width="836" height="134" fill="#f2e7b8"/><line x1="30" y1="244" x2="870" y2="244" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="315.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">partial agreement</text><text x="854" y="302.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ خیال برا نہیں، مگر ... /&#x200F;</text><text x="854" y="352.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ کی بات اپنی جگہ درست ہے، لیکن ...&#x200F;</text><line x1="30" y1="378" x2="870" y2="378" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="424.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">disagreement</text><text x="854" y="436.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں ایسا نہیں سمجھتا، یہ ضروری تو نہیں&#x200F;</text><line x1="30" y1="462" x2="870" y2="462" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="508.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">hesitation</text><text x="854" y="520.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہمم ... / پتا نہیں ... / دیکھو ...&#x200F;</text><line x1="30" y1="546" x2="870" y2="546" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="592.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">surprise</text><text x="854" y="604.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ارے! / واقعی؟&#x200F;</text><line x1="30" y1="630" x2="870" y2="630" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="676.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">admiration</text><text x="854" y="688.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;واہ! / بہت خوب&#x200F;</text><line x1="30" y1="714" x2="870" y2="714" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="760.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">annoyance</text><text x="854" y="772.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اُف! / پھر وہی بات&#x200F;</text><rect x="30" y="820" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="860" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A reservation, not agreement:</text><text x="846" y="872" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ خیال برا نہیں، مگر&#x200F;</text><text x="54" y="908" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The option saying they "agree with the idea" is a trap; the one about their reservation is likely right.</text>
</svg>