<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1170" width="900" height="1170" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1170" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Nadia and Bilal</text>

<rect x="30" y="110" width="840" height="78" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="846" y="164" font-size="22" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نادیہ:&#x200F;</text><text x="770" y="164" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سنا ہے تم نے گٹار سیکھنا چھوڑ دیا؟&#x200F;</text><rect x="30" y="198" width="840" height="78" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="846" y="252" font-size="22" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بلال:&#x200F;</text><text x="770" y="252" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چھوڑا نہیں، بس کچھ دن کا وقفہ لیا ہے۔ استاد صاحب دوسرے شہر چلے گئے ہیں۔&#x200F;</text><rect x="30" y="286" width="840" height="78" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="846" y="340" font-size="22" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نادیہ:&#x200F;</text><text x="770" y="340" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آن لائن کلاسیں کیوں نہیں لیتے؟&#x200F;</text><rect x="30" y="374" width="840" height="78" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="846" y="428" font-size="22" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بلال:&#x200F;</text><text x="770" y="428" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کوشش کی تھی، مگر انٹرنیٹ اتنا سست ہے کہ آدھی بات سمجھ ہی نہیں آتی تھی۔&#x200F;</text><rect x="30" y="474" width="840" height="326" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="518" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(a)</text><text x="846" y="530" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بلال نے گٹار کی کلاسیں کیوں روکی ہیں؟&#x200F;</text><text x="54" y="554" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Why has Bilal stopped his guitar lessons?</text><rect x="46" y="574" width="808" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="70" y="615" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="96" y="613" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">A  reported view: Bilal corrects it</text><text x="838" y="620" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وہ گٹار سیکھنا نہیں چاہتا۔&#x200F;</text><rect x="46" y="646" width="808" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="70" y="687" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="96" y="685" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">B  stated reason (L1, L2)</text><text x="838" y="692" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس کے استاد دوسرے شہر چلے گئے ہیں۔&#x200F;</text><rect x="46" y="718" width="808" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="70" y="759" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="96" y="757" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">C  never mentioned</text><text x="838" y="764" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس کے پاس وقت نہیں۔&#x200F;</text><rect x="30" y="814" width="840" height="326" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="858" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(b)</text><text x="846" y="870" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آن لائن کلاسوں کے بارے میں بلال کی کیا رائے ہے؟&#x200F;</text><text x="54" y="894" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">What is Bilal's view of online classes?</text><rect x="46" y="914" width="808" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="70" y="955" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="96" y="953" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">A  ruled out: he says he tried</text><text x="838" y="960" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس نے کبھی آن لائن کلاس لینے کی کوشش نہیں کی۔&#x200F;</text><rect x="46" y="986" width="808" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="70" y="1027" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="96" y="1025" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">B  contradicted by the "but" after his attempt</text><text x="838" y="1032" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وہ آن لائن کلاسیں پسند کرتا ہے۔&#x200F;</text><rect x="46" y="1058" width="808" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="70" y="1099" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="96" y="1097" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">C  implied, never stated (L4)</text><text x="838" y="1104" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سست انٹرنیٹ کی وجہ سے آن لائن کلاسیں کارآمد نہیں رہیں۔&#x200F;</text>
</svg>