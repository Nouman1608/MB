ext x="557.5" y="286.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">L3</text><text x="557.5" y="315.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">connections between</text><text x="557.5" y="335.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">them</text><rect x="675" y="254" width="195" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="772.5" y="286.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">L4</text><text x="772.5" y="315.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">implied: gist,</text><text x="772.5" y="335.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">purpose, intention,</text><text x="772.5" y="355.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">feelings</text><rect x="30" y="396" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Number of questions and options: not stated in the syllabus</text><text x="54" y="462" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Practise with different numbers and check the specimen paper for your series.</text>
