<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of wrong option</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="156" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="164.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Right words, wrong speaker</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The option describes what the other person said or wanted.</text><rect x="30" y="214" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="260" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="268.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="252" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Suggested, then rejected</text><text x="122" y="280" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">An idea raised and dropped is wrong when the question asks what was decided.</text><rect x="30" y="318" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="364" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="372.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="356" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">True, but not the answer</text><text x="122" y="384" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Something said in the discussion, but it answers a different question.</text><rect x="30" y="422" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="468" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="476.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="460" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The reported view</text><text x="122" y="488" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What "people say" or what one speaker thinks the other thinks, then corrected.</text><rect x="30" y="536" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="579" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">If you can say which type every other option is, your choice is safe.</text>
</svg>