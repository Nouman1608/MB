<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 868" width="900" height="868" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="868" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Feelings the speaker shows but never names</text>

<rect x="30" y="110" width="840" height="638" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="184" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Option word</text><text x="216" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Meaning</text><line x1="200" y1="110" x2="200" y2="748" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Evidence you might hear</text><line x1="420" y1="110" x2="420" y2="748" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="184" y="218.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پُرجوش&#x200F;</text><text x="216" y="206.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">excited</text><text x="854" y="218.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اب تو میں واقعی بے تاب ہوں&#x200F;</text><line x1="30" y1="244" x2="870" y2="244" stroke="#c9d6d4" stroke-width="2"/><text x="184" y="302.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مایوس&#x200F;</text><text x="216" y="290.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">disappointed</text><text x="854" y="302.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں نے اتنی امید لگائی تھی ...&#x200F;</text><line x1="30" y1="328" x2="870" y2="328" stroke="#c9d6d4" stroke-width="2"/><text x="184" y="386.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پریشان&#x200F;</text><text x="216" y="374.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">worried</text><text x="854" y="386.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اگر وقت پر نہ ہوا تو ...؟&#x200F;</text><line x1="30" y1="412" x2="870" y2="412" stroke="#c9d6d4" stroke-width="2"/><text x="184" y="470.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;حیران&#x200F;</text><text x="216" y="458.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">surprised</text><text x="854" y="470.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ارے، مجھے تو پتا ہی نہیں تھا!&#x200F;</text><line x1="30" y1="496" x2="870" y2="496" stroke="#c9d6d4" stroke-width="2"/><text x="184" y="554.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;متاثر&#x200F;</text><text x="216" y="542.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">impressed</text><text x="854" y="554.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;واہ، تم نے تو سب سوچ رکھا ہے!&#x200F;</text><line x1="30" y1="580" x2="870" y2="580" stroke="#c9d6d4" stroke-width="2"/><text x="184" y="638.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مطمئن&#x200F;</text><text x="216" y="615.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">satisfied,</text><text x="216" y="638.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">reassured</text><text x="854" y="638.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چلو، اب کوئی فکر نہیں&#x200F;</text><line x1="30" y1="664" x2="870" y2="664" stroke="#c9d6d4" stroke-width="2"/><text x="184" y="722.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ناراض&#x200F;</text><text x="216" y="710.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">annoyed, angry</text><text x="854" y="722.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تم نے مجھ سے پوچھا تک نہیں!&#x200F;</text><rect x="30" y="770" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="813" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tone matters too: warm "wah" is admiration; flat "wah" after bad news may be sarcasm.</text>
</svg>