<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The stem tells you what kind of question it is</text>

<rect x="30" y="110" width="840" height="665" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Objective</text><text x="604" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Typical stem</text><line x1="200" y1="110" x2="200" y2="775" stroke="#c9d6d4" stroke-width="2"/><text x="636" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What you need</text><line x1="620" y1="110" x2="620" y2="775" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="205.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">L1 detail</text><text x="604" y="216.6" font-size="23" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سارہ کس دن ... ؟ / ... کہاں ہوگا؟&#x200F;</text><text x="636" y="205.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">one stated fact</text><line x1="30" y1="241" x2="870" y2="241" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="286.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">L2 opinion</text><text x="604" y="297.6" font-size="23" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;... کے بارے میں حمزہ کی کیا رائے ہے؟&#x200F;</text><text x="636" y="286.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">one speaker's view</text><line x1="30" y1="322" x2="870" y2="322" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="367.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">L2 objection</text><text x="604" y="378.6" font-size="23" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;... کو کس بات پر اعتراض ہے؟&#x200F;</text><text x="636" y="367.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the reason for a view</text><line x1="30" y1="403" x2="870" y2="403" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="472.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">L3 connection</text><text x="604" y="459.6" font-size="23" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دونوں کس بات پر متفق ہوتے ہیں؟ /&#x200F;</text><text x="604" y="507.6" font-size="23" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آخر میں کیا طے پاتا ہے؟&#x200F;</text><text x="636" y="460.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">how the two views relate</text><text x="636" y="483.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">or end up</text><line x1="30" y1="532" x2="870" y2="532" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="577.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">L4 meaning</text><text x="604" y="588.6" font-size="23" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جب وہ کہتی ہے "..." تو اس کا کیا مطلب ہے؟&#x200F;</text><text x="636" y="577.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">what a remark implies</text><line x1="30" y1="613" x2="870" y2="613" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="658.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">L4 feeling</text><text x="604" y="669.6" font-size="23" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;گفتگو کے آخر میں ... کیسا محسوس کرتا ہے؟&#x200F;</text><text x="636" y="646.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">an emotion not named</text><text x="636" y="669.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">directly</text><line x1="30" y1="694" x2="870" y2="694" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="727.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">L4 gist or</text><text x="46" y="750.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">purpose</text><text x="604" y="750.6" font-size="23" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس گفتگو کا مقصد کیا ہے؟&#x200F;</text><text x="636" y="727.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the point of the whole</text><text x="636" y="750.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">exchange</text><rect x="30" y="797" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="840" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Questions follow the discussion in order; a gist or purpose question comes at the end.</text>
</svg>