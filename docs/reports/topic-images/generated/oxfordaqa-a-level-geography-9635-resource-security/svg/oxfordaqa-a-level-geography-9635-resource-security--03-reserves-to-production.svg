<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 832" width="900" height="832" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="832" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reserves-to-production: a snapshot, not a countdown</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Invented figures from the lesson</text>
<rect x="30" y="124" width="253.33333333333334" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="156.66666666666669" y="168" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PROVEN RESERVES</text><text x="156.66666666666669" y="194.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2,400 million barrels</text><line x1="289.33333333333337" y1="178" x2="317.33333333333337" y2="178" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="124" width="253.33333333333334" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450.00000000000006" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PRODUCTION</text><text x="450.00000000000006" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">120 million barrels a</text><text x="450.00000000000006" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">year</text><line x1="582.6666666666667" y1="178" x2="610.6666666666667" y2="178" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="124" width="253.33333333333334" height="108" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="168" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">R/P RATIO</text><text x="743.3333333333334" y="194.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2,400 / 120 = 20 years</text><rect x="30" y="248" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="303.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reserves are revised</text><text x="50" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">As exploration continues and</text><text x="50" y="352.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prices change.</text><rect x="316" y="248" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="313.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Production changes</text><text x="336" y="342.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Output rates rise and fall.</text><rect x="602" y="248" width="268" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="282.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">So it is a snapshot</text><text x="622" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Of the present balance</text><text x="622" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between known supply and</text><text x="622" y="352.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">output: the oil does not run</text><text x="622" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">out in 20 years.</text><text x="30" y="428" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">DEVELOPMENT OVER TIME: EXPLORATION → EXPLOITATION → DEVELOPMENT</text><rect x="30" y="446" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="480.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The resource frontier moves into harder places</text><text x="50" y="509.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deep-water fields off Brazil, the Arctic, Canada's oil sands: as technology and prices allow.</text><rect x="30" y="550" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="80" y1="750" x2="840" y2="750" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="80" y1="750" x2="80" y2="580" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="840" y="776" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time</text><text transform="translate(60,670) rotate(-90)" text-anchor="middle" font-size="15" fill="#4a5568">output</text><path d="M90,744 C280,740 340,600 460,600 C580,600 640,710 820,690" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><line x1="460" y1="600" x2="460" y2="750" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="470" y="594" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">resource peak</text><text x="830" y="576" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Illustrative shape only</text><text x="450" y="790" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">The peak date depends as much on economics and demand as on geology</text>
</svg>