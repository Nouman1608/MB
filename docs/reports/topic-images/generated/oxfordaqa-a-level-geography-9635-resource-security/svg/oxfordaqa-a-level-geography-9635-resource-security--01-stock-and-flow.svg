<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stock and flow resources</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"Resources are not, they become" (Zimmermann)</text>
<rect x="30" y="124" width="410" height="300" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="162" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">STOCK</text><text x="50" y="188" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Finite on human timescales</text><rect x="130" y="224" width="200" height="130" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="133" y="294" width="194" height="57" fill="#9c8f6e"/><line x1="330" y1="334" x2="400" y2="334" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="366" y="320" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">use</text><text x="230" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">no refill</text><text x="50" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fossil fuels, uranium, fossil groundwater</text><rect x="460" y="124" width="410" height="300" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="162" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FLOW</text><text x="480" y="188" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Renewed continuously</text><path d="M520,244 C580,214 620,274 680,244 C740,214 780,274 830,244" fill="none" stroke="#2b5a9a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><line x1="500" y1="294" x2="840" y2="294" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="670" y="324" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">always arriving, always passing</text><text x="480" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sunlight, wind, river flow</text><rect x="30" y="440" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="474.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Flow can become stock-like</text><text x="50" y="504.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An aquifer pumped faster than it recharges behaves as a finite store.</text><rect x="30" y="545" width="840" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="579.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why "they become" matters</text><text x="50" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Oil was not a resource until technology and demand gave it value. So reserves grow, frontiers move, and</text><text x="50" y="628.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a resource can lose value when a substitute appears.</text>
</svg>