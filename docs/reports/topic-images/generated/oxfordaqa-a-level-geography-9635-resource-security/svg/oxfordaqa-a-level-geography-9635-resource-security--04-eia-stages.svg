<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 791" width="900" height="791" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="791" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Environmental impact assessment</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A process, not a single report</text>
<line x1="60" y1="144" x2="60" y2="614" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="115" y="148.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Screening</text><text x="115" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Does the project need a full assessment?</text><circle cx="60" cy="157" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="165.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="198" width="766" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="115" y="222.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Scoping</text><text x="115" y="249" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Which impacts matter most, e.g. on water, ecosystems or communities?</text><circle cx="60" cy="231" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="239.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="272" width="766" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="115" y="296.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Baseline study</text><text x="115" y="323" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Record conditions before the project.</text><circle cx="60" cy="305" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="313.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="346" width="766" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="115" y="370.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Prediction</text><text x="115" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Estimate the size and duration of impacts.</text><circle cx="60" cy="379" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="387.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="420" width="766" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="115" y="444.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mitigation</text><text x="115" y="471" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Propose ways to avoid or reduce harm.</text><circle cx="60" cy="453" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="461.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="494" width="766" height="66" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="115" y="518.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Consultation and decision</text><text x="115" y="545" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Involve the public and authorities before approval.</text><circle cx="60" cy="527" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="535.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="104" y="568" width="766" height="66" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="115" y="592.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Monitoring</text><text x="115" y="619" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Check impacts once the project runs.</text><circle cx="60" cy="601" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="609.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="30" y="650" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="684.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate it as a tool</text><text x="50" y="713.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">EIA improves decisions only if it is independent, if consultation genuinely includes affected groups, and if</text><text x="50" y="734.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">monitoring is enforced.</text>
</svg>