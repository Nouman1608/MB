<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How physical geography controls supply</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Climate, geology and drainage, for water and energy</text>
<rect x="30" y="124" width="840" height="410" rx="14" fill="#eef3f7" stroke="#c9d6d4" stroke-width="2.5"/><path d="M32,214 L90,174 L150,224 L210,294 L330,334 L560,334 L660,304 L720,224 L745,219 L770,229 L868,314 L868,532 L32,532 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M230,364 L600,364 L600,404 L230,404 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><path d="M230,404 L600,404 L600,424 L230,424 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="415" y="390" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">permeable rock: aquifer</text><path d="M250,442 Q415,564 580,442 Q415,484 250,442 Z" fill="#1e2a44" opacity="0.85"/><text x="240" y="484" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">sedimentary basin:</text><text x="240" y="502" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">oil, gas, coal</text><path d="M120,202 L170,249 L205,288 L250,320" fill="none" stroke="#2b5a9a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><rect x="186" y="256" width="12" height="30" fill="#1e2a44"/><path d="M745,222 L745,464" stroke="#b5602e" stroke-width="10" opacity="0.75"/><ellipse cx="745" cy="484" rx="60" ry="26" fill="#b5602e" opacity="0.75"/><text x="745" y="490" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">heat</text><path d="M70,154 q20,-14 40,0 q20,-14 40,0 q0,16 -40,16 q-40,0 -40,-16 z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="80" y1="180" x2="74" y2="196" stroke="#2b5a9a" stroke-width="2.5"/><line x1="100" y1="180" x2="94" y2="196" stroke="#2b5a9a" stroke-width="2.5"/><line x1="120" y1="180" x2="114" y2="196" stroke="#2b5a9a" stroke-width="2.5"/><line x1="140" y1="180" x2="134" y2="196" stroke="#2b5a9a" stroke-width="2.5"/><circle cx="480" cy="174" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="172" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Climate: rainfall amount,</text><text x="170" y="190" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reliability, evaporation</text><text x="510" y="170" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Sunshine and wind:</text><text x="510" y="188" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">renewable potential</text><text x="230" y="230" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Steep, high-discharge</text><text x="230" y="248" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">river: hydro-electric potential</text><text x="860" y="184" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">Heat close to the surface:</text><text x="860" y="202" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">geothermal (e.g. Iceland)</text><text x="60" y="524" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Schematic, not to scale</text><clipPath id="tc550"><rect x="30" y="550" width="840" height="230" rx="14"/></clipPath><g clip-path="url(#tc550)"><rect x="30" y="550" width="157.5" height="44" fill="#b5d3cf"/><text x="42" y="575.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Control</text><rect x="187.5" y="550" width="341.25" height="44" fill="#b5d3cf"/><text x="199.5" y="575.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Water supply</text><rect x="528.75" y="550" width="341.25" height="44" fill="#f2e7b8"/><text x="540.75" y="575.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Energy supply</text><rect x="30" y="594" width="157.5" height="62" fill="#dce9e7"/><text x="42" y="618" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Climate</text><rect x="187.5" y="594" width="341.25" height="62" fill="#ffffff"/><text x="199.5" y="618" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Rainfall amount, reliability and evaporation</text><rect x="528.75" y="594" width="341.25" height="62" fill="#ffffff"/><text x="540.75" y="618" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sunshine, wind and river regimes;</text><text x="540.75" y="638" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">temperature shapes demand</text><line x1="30" y1="656" x2="870" y2="656" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="656" width="157.5" height="62" fill="#dce9e7"/><text x="42" y="680" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Geology</text><rect x="187.5" y="656" width="341.25" height="62" fill="#f8faf9"/><text x="199.5" y="680" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Permeable rocks form aquifers;</text><text x="199.5" y="700" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">impermeable rocks favour reservoirs</text><rect x="528.75" y="656" width="341.25" height="62" fill="#f8faf9"/><text x="540.75" y="680" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sedimentary basins hold oil, gas and coal;</text><text x="540.75" y="700" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">geothermal needs heat near the surface</text><line x1="30" y1="718" x2="870" y2="718" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="718" width="157.5" height="62" fill="#dce9e7"/><text x="42" y="742" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Drainage</text><rect x="187.5" y="718" width="341.25" height="62" fill="#ffffff"/><text x="199.5" y="742" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">River basins collect water; define where</text><text x="199.5" y="762" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">transfers are needed</text><rect x="528.75" y="718" width="341.25" height="62" fill="#ffffff"/><text x="540.75" y="742" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Steep, high-discharge rivers give</text><text x="540.75" y="762" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hydro-electric potential</text></g><line x1="187.5" y1="550" x2="187.5" y2="780" stroke="#c9d6d4" stroke-width="1.5"/><line x1="528.75" y1="550" x2="528.75" y2="780" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="550" width="840" height="230" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>