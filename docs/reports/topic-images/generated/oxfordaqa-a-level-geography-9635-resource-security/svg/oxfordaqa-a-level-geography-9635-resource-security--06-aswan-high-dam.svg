<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 526" width="900" height="526" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="526" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Aswan High Dam, Egypt (completed 1970)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Benefits and costs of a major water scheme</text>
<rect x="30" y="124" width="840" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M60,224 L380,224" fill="none" stroke="#2b5a9a" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" /><text x="220" y="194" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lake Nasser (reservoir)</text><rect x="382" y="184" width="26" height="80" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><text x="395" y="282" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">dam</text><path d="M410,224 L620,224" fill="none" stroke="#2b5a9a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" /><text x="515" y="210" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="middle">Nile below the dam</text><path d="M620,224 L710,184 L710,264 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="230" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">delta</text><text x="724" y="216" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">less sediment:</text><text x="724" y="234" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">coast erodes</text><circle cx="320" cy="236" r="3.5" fill="#8a6d0d"/><circle cx="332" cy="236" r="3.5" fill="#8a6d0d"/><circle cx="344" cy="236" r="3.5" fill="#8a6d0d"/><circle cx="356" cy="236" r="3.5" fill="#8a6d0d"/><circle cx="368" cy="236" r="3.5" fill="#8a6d0d"/><circle cx="320" cy="244" r="3.5" fill="#8a6d0d"/><circle cx="332" cy="244" r="3.5" fill="#8a6d0d"/><circle cx="344" cy="244" r="3.5" fill="#8a6d0d"/><circle cx="356" cy="244" r="3.5" fill="#8a6d0d"/><circle cx="368" cy="244" r="3.5" fill="#8a6d0d"/><text x="370" y="272" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="end">sediment trapped</text><line x1="80" y1="154" x2="360" y2="154" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="80" y="146" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">Nile flow</text><text x="50" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Schematic, not to scale</text><rect x="30" y="310" width="328.8" height="184" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="342" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BENEFITS</text><text x="50" y="368.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stored water and power</text><text x="50" y="396.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stores water across years</text><text x="50" y="422.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Irrigates farmland</text><text x="50" y="448.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Generates hydro-electricity</text><rect x="376.8" y="310" width="493.2" height="184" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="396.8" y="342" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">COSTS</text><text x="396.8" y="368.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sediment and people</text><text x="396.8" y="396.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="412" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Traps the Nile's sediment: the delta loses its natural</text><text x="412" y="417.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">supply and parts of the coast erode</text><text x="396.8" y="443.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="412" y="443.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Farmers rely more on artificial fertiliser</text><text x="396.8" y="469.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="412" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nubian communities displaced as the reservoir filled</text>
</svg>