<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The McKelvey box</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Classifying stock resources</text>
<text x="307.5" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Measured</text><text x="462.5" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Indicated</text><text x="617.5" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Inferred</text><text x="772.5" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Possible</text><line x1="230" y1="134" x2="850" y2="134" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="230" y="126" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">high</text><text x="828" y="126" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">low</text><text x="540" y="126" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">GEOLOGICAL CERTAINTY</text><rect x="230" y="174" width="310" height="105" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="540" y="174" width="310" height="105" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="230" y="279" width="620" height="105" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="385" y1="168" x2="385" y2="184" stroke="#1e2a44" stroke-width="2"/><line x1="695" y1="168" x2="695" y2="184" stroke="#1e2a44" stroke-width="2"/><text x="385" y="224.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">RESERVES</text><text x="385" y="248.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">well known and economic</text><text x="695" y="224.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Economic but less certain</text><text x="695" y="246.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(inferred and possible resources)</text><text x="602" y="337.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Not economic at current prices and technology</text><text x="210" y="218.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end"><tspan font-weight="700">Economic</tspan></text><text x="210" y="323.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end"><tspan font-weight="700">Not</tspan> <tspan font-weight="700">yet</tspan> <tspan font-weight="700">economic</tspan></text><line x1="224" y1="279" x2="856" y2="279" stroke="#b5602e" stroke-width="5" stroke-dasharray="12 7"/><line x1="323" y1="357.75" x2="323" y2="258" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="337" y="372.25" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="406" width="411" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="440.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Moving the boundary</text><text x="50" y="468.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">When prices rise or technology improves,</text><text x="50" y="489.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">material crosses the economic boundary</text><text x="50" y="510.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(dashed) and becomes a reserve, without any</text><text x="50" y="531.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">new discovery.</text><rect x="459" y="406" width="411" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="461.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Moving right to left</text><text x="479" y="489.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Exploration raises geological certainty: possible</text><text x="479" y="510.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">→ inferred → indicated → measured.</text>
</svg>