<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 828" width="900" height="828" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="828" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Does water scarcity inevitably lead to conflict?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Structure of the annotated 9-mark answer</text>
<line x1="60" y1="144" x2="60" y2="651" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence for</text><text x="122" y="184.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Grand Ethiopian Renaissance Dam on the Blue Nile: disputes with Egypt and Sudan over how</text><text x="122" y="205.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fast the reservoir fills.</text><circle cx="60" cy="176" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="184.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="240" width="766" height="104" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="272.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Counter-evidence</text><text x="122" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Indus Waters Treaty (1960, brokered by the World Bank) has survived despite wider</text><text x="122" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">India-Pakistan hostility.</text><circle cx="60" cy="292" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="300.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="356" width="766" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="388.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Scale</text><text x="122" y="416.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Within countries, conflict is often local (farmers and growing cities), usually resolved by pricing</text><text x="122" y="437.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or allocation rules.</text><circle cx="60" cy="408" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="416.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="472" width="766" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="504.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Alternative outcome</text><text x="122" y="532.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Desalination and virtual water trade can reduce pressure.</text><circle cx="60" cy="513.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="522.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="567" width="766" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="599.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="122" y="627.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Scarcity raises the risk of conflict, but institutions and technology decide whether that risk</text><text x="122" y="648.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">becomes conflict.</text><circle cx="60" cy="619" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="627.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="687" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="721.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Remember the energy link</text><text x="50" y="750.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Desalination needs large amounts of energy, so its price and carbon footprint depend on how that energy</text><text x="50" y="771.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is produced.</text>
</svg>