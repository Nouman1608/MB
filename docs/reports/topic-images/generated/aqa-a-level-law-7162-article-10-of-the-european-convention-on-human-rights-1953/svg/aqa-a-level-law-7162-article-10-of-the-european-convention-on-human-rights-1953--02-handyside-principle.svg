<rect width="900" height="546" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Expression is wide, and protects the unpopular</text>

<rect x="117.52449999999999" y="100" width="182.457" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="208.753" y="121.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">speech and writing</text><rect x="309.9815" y="100" width="47.018" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="333.4905" y="121.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">art</text><rect x="366.9995" y="100" width="134.19400000000002" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="434.0965" y="121.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">broadcasting</text><rect x="511.19350000000003" y="100" width="143.15300000000002" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="582.77" y="121.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">online content</text><rect x="664.3465000000001" y="100" width="118.129" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="723.4110000000001" y="121.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">advertising</text><rect x="345.91949999999997" y="141" width="208.161" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="162.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">some forms of protest</text><rect x="30" y="194" width="840" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="226" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HANDYSIDE v UNITED KINGDOM (1976)</text><text x="50" y="253.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A book for schoolchildren with frank sexual content</text><text x="50" y="284.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Article 10 applies not only to ideas “favourably received or regarded as inoffensive or as a</text><text x="50" y="308.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">matter of indifference, but also to those that <tspan font-weight="700" fill="#1e2a44">offend,</tspan> <tspan font-weight="700" fill="#1e2a44">shock</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">disturb</tspan> the State or any sector</text><text x="50" y="332.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">of the population”.</text><rect x="30" y="380" width="413" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="412" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE PRINCIPLE</text><text x="50" y="438.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Offensive ideas are still protected</text><text x="50" y="461.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">expression</text><text x="50" y="489.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The starting point for any expression question</text><rect x="457" y="380" width="413" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="413" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">THE RESULT</text><text x="477" y="439.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No breach: the seizure was justified</text><text x="477" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A common mistake is to say Handyside found a</text><text x="477" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breach</text>
</svg>