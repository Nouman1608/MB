<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Inside Article 10.1</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Everyone has the right to freedom of expression, which includes:</text>
<rect x="30" y="124" width="270.6666666666667" height="157" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FREEDOM 1</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To hold opinions</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The starting point of</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expression</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="157" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FREEDOM 2</text><text x="334.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To receive information</text><text x="334.6666666666667" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">and ideas</text><text x="334.6666666666667" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The audience’s side: spec</text><text x="334.6666666666667" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">element “receive”</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="157" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FREEDOM 3</text><text x="619.3333333333334" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To impart information</text><text x="619.3333333333334" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">and ideas</text><text x="619.3333333333334" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The speaker’s side: spec</text><text x="619.3333333333334" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">element “communicate”</text><rect x="30" y="303" width="413" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="337.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Without interference by public authority</text><text x="50" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The right is held against the state</text><rect x="457" y="303" width="413" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="337.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Regardless of frontiers</text><text x="477" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Information can cross borders</text><rect x="30" y="412" width="458.8888888888889" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="446.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FINAL SENTENCE</text><text x="50" y="472.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">States may license broadcasting, television or</text><text x="50" y="495.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">cinema enterprises</text><rect x="502.8888888888889" y="412" width="367.1111111111111" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="522.8888888888889" y="444" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TYPE OF RIGHT</text><text x="522.8888888888889" y="470.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Qualified</text><text x="522.8888888888889" y="498.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limits are set out separately in Article 10.2</text>
</svg>