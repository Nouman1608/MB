<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 539" width="900" height="539" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="539" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The press as “public watchdog”</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four cases where the UK or Denmark breached Article 10</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="383" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="227.29411764705878" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Case</text><rect x="257.2941176470588" y="124" width="296.47058823529414" height="48" fill="#b5d3cf"/><text x="271.2941176470588" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interference</text><rect x="553.7647058823529" y="124" width="316.2352941176471" height="48" fill="#b5d3cf"/><text x="567.7647058823529" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Why it breached Article 10</text><rect x="30" y="172" width="227.29411764705878" height="89" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sunday Times v UK</text><text x="44" y="219.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(1979)</text><rect x="257.2941176470588" y="172" width="296.47058823529414" height="89" fill="#ffffff"/><text x="271.2941176470588" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Injunction on an article about the</text><text x="271.2941176470588" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">thalidomide litigation (contempt of</text><text x="271.2941176470588" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">court)</text><rect x="553.7647058823529" y="172" width="316.2352941176471" height="89" fill="#ffffff"/><text x="567.7647058823529" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The public had a right to receive the</text><text x="567.7647058823529" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">information; the injunction was not</text><text x="567.7647058823529" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">necessary</text><line x1="30" y1="261" x2="870" y2="261" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="261" width="227.29411764705878" height="89" fill="#dce9e7"/><text x="44" y="287.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Observer and Guardian v</text><text x="44" y="308.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">UK (1991)</text><rect x="257.2941176470588" y="261" width="296.47058823529414" height="89" fill="#f8faf9"/><text x="271.2941176470588" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Injunctions on extracts from</text><text x="271.2941176470588" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Spycatcher</tspan></text><rect x="553.7647058823529" y="261" width="316.2352941176471" height="89" fill="#f8faf9"/><text x="567.7647058823529" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The book was already published in</text><text x="567.7647058823529" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the United States; no longer</text><text x="567.7647058823529" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">confidential</text><line x1="30" y1="350" x2="870" y2="350" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="350" width="227.29411764705878" height="68" fill="#dce9e7"/><text x="44" y="376.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Goodwin v UK (1996)</text><rect x="257.2941176470588" y="350" width="296.47058823529414" height="68" fill="#ffffff"/><text x="271.2941176470588" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Order for a trainee journalist to</text><text x="271.2941176470588" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reveal his source</text><rect x="553.7647058823529" y="350" width="316.2352941176471" height="68" fill="#ffffff"/><text x="567.7647058823529" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protection of sources is a basic</text><text x="567.7647058823529" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">condition for press freedom</text><line x1="30" y1="418" x2="870" y2="418" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="418" width="227.29411764705878" height="89" fill="#dce9e7"/><text x="44" y="444.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Jersild v Denmark (1994)</text><rect x="257.2941176470588" y="418" width="296.47058823529414" height="89" fill="#f8faf9"/><text x="271.2941176470588" y="444.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Journalist convicted for</text><text x="271.2941176470588" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">broadcasting racist remarks made</text><text x="271.2941176470588" y="486.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by interviewees</text><rect x="553.7647058823529" y="418" width="316.2352941176471" height="89" fill="#f8faf9"/><text x="567.7647058823529" y="444.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A serious report on racism; punishing</text><text x="567.7647058823529" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">him would seriously hamper the press</text></g><line x1="257.2941176470588" y1="124" x2="257.2941176470588" y2="507" stroke="#c9d6d4" stroke-width="1.5"/><line x1="553.7647058823529" y1="124" x2="553.7647058823529" y2="507" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="383" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>