<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 671" width="900" height="671" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="671" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Not all speech is protected equally</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Bar length shows how strongly the Court protects each kind</text>
<text x="30" y="140" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH OF PROTECTION</text><rect x="30" y="154" width="840" height="16" rx="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="180" width="840" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="215.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Political speech</text><text x="50" y="244.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Highest</tspan> <tspan font-weight="700" fill="#1e2a44">protection</tspan></text><text x="50" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lingens v Austria (1986): wider limits of criticism for a politician than a private individual; breach found</text><rect x="30" y="316" width="600" height="16" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="342" width="840" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="377.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Artistic expression</text><text x="50" y="406.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">More</tspan> <tspan font-weight="700" fill="#1e2a44">room</tspan> <tspan font-weight="700" fill="#1e2a44">for</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">state</tspan> <tspan font-weight="700" fill="#1e2a44">on</tspan> <tspan font-weight="700" fill="#1e2a44">morals</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">religion</tspan></text><text x="50" y="431.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Müller v Switzerland (1988): obscene paintings, no breach. Otto-Preminger-Institut v Austria (1994): film</text><text x="50" y="452.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seizure within the margin</text><rect x="30" y="499" width="380" height="16" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="525" width="840" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="560.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Commercial and broadcast advertising</text><text x="50" y="589.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Restricted</tspan> <tspan font-weight="700" fill="#1e2a44">more</tspan> <tspan font-weight="700" fill="#1e2a44">readily</tspan></text><text x="50" y="614.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Animal Defenders International v UK (2013): ban on paid political advertising on TV and radio upheld</text>
</svg>