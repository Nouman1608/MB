<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 789" width="900" height="789" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="789" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section 12 HRA 1998: restraining publication</text>

<rect x="30" y="100" width="413" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON LAW BEFORE 1998</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Derbyshire CC v Times Newspapers</text><text x="50" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">(1993)</text><text x="50" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A local authority cannot sue for defamation: it</text><text x="50" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">would chill criticism of government</text><rect x="457" y="100" width="413" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON LAW BEFORE 1998</text><text x="477" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">R v Home Secretary, ex parte Simms</text><text x="477" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">(2000)</text><text x="477" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Policy stopping prisoners giving oral interviews</text><text x="477" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to journalists was unlawful</text><rect x="30" y="277" width="840" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="309" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TRIGGER</text><text x="450" y="335.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A court is considering relief that might affect freedom of expression</text><line x1="450" y1="366" x2="450" y2="396" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="401" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="433" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SECTION 12</text><text x="450" y="459.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">It must have particular regard to the importance of the right</text><line x1="450" y1="490" x2="450" y2="520" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="525" width="840" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="557" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SECTION 12(3)</text><text x="450" y="583.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">No restraint before trial unless the applicant is likely to establish that publication</text><text x="450" y="607.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">should not be allowed</text><line x1="450" y1="638" x2="450" y2="668" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="673" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="705" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CREAM HOLDINGS v BANERJEE (2004)</text><text x="450" y="731.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“Likely” normally means more likely than not</text>
</svg>