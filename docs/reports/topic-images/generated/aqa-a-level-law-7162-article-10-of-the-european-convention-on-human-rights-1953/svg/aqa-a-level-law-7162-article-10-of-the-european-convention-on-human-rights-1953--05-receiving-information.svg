<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="502" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How far does the right to receive go?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Mainly: the state must not block information others are willing to give</text>
<rect x="30" y="194" width="270" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="228.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Leander v Sweden (1987)</text><text x="50" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">No</tspan> <tspan font-weight="700" fill="#1e2a44">right</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">access</tspan> to a secret</text><text x="50" y="277.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">police register about himself</text><rect x="315" y="194" width="270" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="228.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kennedy v Charity</text><text x="335" y="251.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Commission (2014)</text><text x="335" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">No</tspan> <tspan font-weight="700" fill="#1e2a44">general</tspan> <tspan font-weight="700" fill="#1e2a44">right</tspan> to receive</text><text x="335" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">information from a public</text><text x="335" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">body; use statute (Freedom of</text><text x="335" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Information Act 2000) and the</text><text x="335" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">common law</text><rect x="600" y="194" width="270" height="194" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="228.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Magyar Helsinki Bizottság</text><text x="620" y="251.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">v Hungary (2016)</text><text x="620" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">A</tspan> <tspan font-weight="700" fill="#1e2a44">right</tspan> <tspan font-weight="700" fill="#1e2a44">can</tspan> <tspan font-weight="700" fill="#1e2a44">arise</tspan> <tspan font-weight="700" fill="#1e2a44">in</tspan> <tspan font-weight="700" fill="#1e2a44">some</tspan></text><text x="620" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">circumstances</tspan>, especially</text><text x="620" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">where access is instrumental</text><text x="620" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to a watchdog: the press or</text><text x="620" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">an NGO</text><line x1="40" y1="164" x2="860" y2="164" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="40" y="148" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">no access</text><text x="860" y="148" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">limited access</text><rect x="30" y="410" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="444.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Article 10 does <tspan font-weight="700" fill="#1e2a44">not</tspan> give a general right to demand information from the state.</text>
</svg>