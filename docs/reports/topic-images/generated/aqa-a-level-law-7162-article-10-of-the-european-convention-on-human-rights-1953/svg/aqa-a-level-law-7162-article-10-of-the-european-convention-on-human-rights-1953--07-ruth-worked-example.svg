<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 831" width="900" height="831" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="831" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Ruth’s blog</text>

<rect x="30" y="100" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ruth posts a leaked council report showing a playground was built on contaminated land. The</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">council gets an interim injunction to remove the post and asks for an order that she name the</text><text x="50" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">officer who leaked it.</text><line x1="60" y1="275" x2="60" y2="779" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="255" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="288.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Right engaged</text><text x="122" y="318.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Article 10.1, communicating information; the public also has a right to receive it (<tspan font-style="italic">Sunday</tspan></text><text x="122" y="340.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Times</tspan>).</text><circle cx="60" cy="309" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="317.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="375" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="408.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Type of speech</text><text x="122" y="438.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Public-interest speech about local government: strong protection (<tspan font-style="italic">Lingens</tspan>; <tspan font-style="italic">Derbyshire</tspan>).</text><circle cx="60" cy="418" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="426.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="473" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="506.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Interim order</text><text x="122" y="536.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">HRA s12 applies. Under s12(3) and <tspan font-style="italic">Cream</tspan> <tspan font-style="italic">Holdings</tspan>, the council must show it is more likely</text><text x="122" y="558.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">than not to win at trial.</text><circle cx="60" cy="527" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="535.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="593" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="626.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Source order</text><text x="122" y="656.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Goodwin</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan>: compelling disclosure of a source needs an overriding requirement in the</text><text x="122" y="678.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">public interest.</text><circle cx="60" cy="647" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="655.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="713" width="766" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="746.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Next stage</text><text x="122" y="776.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Apply Article 10.2 to see whether either order is justified.</text><circle cx="60" cy="756" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="764.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>