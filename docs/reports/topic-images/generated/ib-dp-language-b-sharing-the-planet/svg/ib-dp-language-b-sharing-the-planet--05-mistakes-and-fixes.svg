<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Common mistakes and their fixes</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="350" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="401.7391304347827" height="48" fill="#b5d3cf"/><text x="44" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mistake</text><rect x="431.7391304347827" y="100" width="438.26086956521743" height="48" fill="#f2e7b8"/><text x="445.7391304347827" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fix</text><rect x="30" y="148" width="401.7391304347827" height="70" fill="#dce9e7"/><text x="44" y="175.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Revising only one or two of the seven topics</text><rect x="431.7391304347827" y="148" width="438.26086956521743" height="70" fill="#ffffff"/><text x="445.7391304347827" y="175.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Build vocabulary and structures across all seven:</text><text x="445.7391304347827" y="197.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Paper 2 can draw on any</text><line x1="30" y1="218" x2="870" y2="218" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="218" width="401.7391304347827" height="70" fill="#dce9e7"/><text x="44" y="245.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Under-preparing listening and reading</text><rect x="431.7391304347827" y="218" width="438.26086956521743" height="70" fill="#f8faf9"/><text x="445.7391304347827" y="245.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Give comprehension real time: it carries 50% on</text><text x="445.7391304347827" y="267.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Paper 2</text><line x1="30" y1="288" x2="870" y2="288" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="288" width="401.7391304347827" height="70" fill="#dce9e7"/><text x="44" y="315.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Descriptive or personal-experience</text><text x="44" y="337.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">language</text><rect x="431.7391304347827" y="288" width="438.26086956521743" height="70" fill="#ffffff"/><text x="445.7391304347827" y="315.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use opinion, comparison and cause-and-effect</text><text x="445.7391304347827" y="337.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">structures</text><line x1="30" y1="358" x2="870" y2="358" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="358" width="401.7391304347827" height="92" fill="#dce9e7"/><text x="44" y="385.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Preparing only formal writing register</text><rect x="431.7391304347827" y="358" width="438.26086956521743" height="92" fill="#f8faf9"/><text x="445.7391304347827" y="385.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Also build comprehension of authentic,</text><text x="445.7391304347827" y="407.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">issue-driven texts: news reports, opinion pieces,</text><text x="445.7391304347827" y="429.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">documentary-style audio</text></g><line x1="431.7391304347827" y1="100" x2="431.7391304347827" y2="450" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="350" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>