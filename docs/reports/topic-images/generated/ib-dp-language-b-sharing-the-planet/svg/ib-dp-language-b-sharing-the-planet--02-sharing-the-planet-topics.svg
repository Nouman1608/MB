<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sharing the planet: seven recommended topics</text>

<rect x="30" y="100" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="134.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">The</tspan> <tspan font-weight="700" fill="#1e2a44">theme:</tspan> Explores the challenges and opportunities faced by individuals and communities</text><text x="450" y="158.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">in the modern world.</text><text x="450" y="220" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">7 RECOMMENDED TOPICS AND THE LANGUAGE EACH NEEDS: revise all seven</text><line x1="315" y1="286" x2="409" y2="398.35" stroke="#1e2a44" stroke-width="2.5"/><line x1="315" y1="400" x2="409" y2="432.55" stroke="#1e2a44" stroke-width="2.5"/><line x1="315" y1="514" x2="409" y2="466.75" stroke="#1e2a44" stroke-width="2.5"/><line x1="315" y1="617.5" x2="409" y2="497.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="585" y1="321" x2="491" y2="408.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="585" y1="424.5" x2="491" y2="439.9" stroke="#1e2a44" stroke-width="2.5"/><line x1="585" y1="550" x2="491" y2="477.55" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="446.5" r="82" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="441.04" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sharing</text><text x="450" y="466.66" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">the planet</text><rect x="30" y="236" width="285" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="172.5" y="266.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The environment</text><text x="172.5" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Opinion language for</text><text x="172.5" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">environmental policy</text><rect x="30" y="350" width="285" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="172.5" y="380.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Human rights</text><text x="172.5" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The more formal register it often</text><text x="172.5" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">calls for</text><rect x="30" y="464" width="285" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="172.5" y="494.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Peace and conflict</text><text x="172.5" y="522.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Cooperation, negotiation,</text><text x="172.5" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">tension, resolution</text><rect x="30" y="578" width="285" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="172.5" y="608.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Equality</text><text x="172.5" y="636.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Comparison and contrast</text><rect x="585" y="281.5" width="285" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="727.5" y="311.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalization</text><text x="727.5" y="340.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Cause and effect across borders</text><rect x="585" y="374.5" width="285" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="727.5" y="404.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethics</text><text x="727.5" y="433.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Expressing and justifying a moral</text><text x="727.5" y="454.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">position</text><rect x="585" y="488.5" width="285" height="123" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="727.5" y="518.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Urban and rural</text><text x="727.5" y="541.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">environments</text><text x="727.5" y="570.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Comparing settings, change over</text><text x="727.5" y="591.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">time</text><text x="450" y="693" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">WHAT THE THEME ASKS</text><rect x="30" y="709" width="411" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="743.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">What environmental and social challenges</text><text x="50" y="767.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">does the world face, and how might they</text><text x="50" y="791.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">be overcome?</text><rect x="459" y="709" width="411" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="755.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">What challenges and benefits does</text><text x="479" y="779.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">globalization bring?</text>
</svg>