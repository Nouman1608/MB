<rect width="900" height="515" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 1 on Sharing the planet</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The text type is set by that session's instructions</text>
<rect x="30" y="124" width="270.6666666666667" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="182" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PERSONAL</text><text x="50" y="208.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">e.g. a blog post</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PROFESSIONAL</text><text x="334.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">e.g. a formal letter, a</text><text x="334.6666666666667" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">report</text><text x="334.6666666666667" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Often suits this theme</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="168" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MASS MEDIA</text><text x="619.3333333333334" y="194.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">e.g. an article</text><text x="619.3333333333334" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Often suits this theme</text><rect x="30" y="282" width="393" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="350.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reviewing topic vocabulary only</text><text x="50" y="380.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">On-topic content alone is not enough.</text><line x1="429" y1="360.5" x2="471" y2="360.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="477" y="282" width="393" height="157" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="497" y="316.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Practising an opinion article or formal</text><text x="497" y="340.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">letter</text><text x="497" y="370.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Argue a specific environmental or social</text><text x="497" y="392.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">position in the real conventions of the text</text><text x="497" y="414.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">type.</text><text x="450" y="474.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Examiners assess whether register and structure match the specified text type.</text>
</svg>