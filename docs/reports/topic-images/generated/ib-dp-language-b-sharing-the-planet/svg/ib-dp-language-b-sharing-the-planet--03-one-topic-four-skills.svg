<line x1="330" y1="197.5" x2="410" y2="247.2" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="351" x2="410" y2="293.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="197.5" x2="490" y2="247.2" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="339.5" x2="490" y2="289.8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="268.5" r="80" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="275.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalization</text><rect x="30" y="124" width="300" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VOCABULARY</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cause-and-effect</text><text x="46" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">connectives</text><text x="46" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">because of, as a result, this leads</text><text x="46" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to, consequently</text><rect x="30" y="289" width="300" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="317" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">READING AND LISTENING</text><text x="46" y="343.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unseen news-style texts</text><text x="46" y="371.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A chain of consequence across</text><text x="46" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">borders</text><rect x="570" y="135.5" width="300" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="163.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WRITING (PAPER 1)</text><text x="586" y="189.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A formal article or report</text><text x="586" y="218.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Argue a position, in the real</text><text x="586" y="239.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conventions of the text type set</text><rect x="570" y="277.5" width="300" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="305.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPEAKING (ORAL)</text><text x="586" y="331.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A globalization image</text><text x="586" y="360.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">HL: connect a studied literary work</text><text x="586" y="381.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to the theme</text><rect x="30" y="435" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="468.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Practising vocabulary and all four skills together on one topic transfers directly to whichever paper</text><text x="450" y="490.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">uses it.</text>
