<rect x="30" y="100" width="390" height="137" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">IDENTITIES</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Built around personal or cultural</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">experience</text><text x="50" y="212.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Descriptive, personal-experience language</text><line x1="426" y1="168.5" x2="474" y2="168.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="100" width="390" height="137" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="500" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SHARING THE PLANET</text><text x="500" y="159.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Issues and debate</text><text x="500" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Environmental and social challenges, how</text><text x="500" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">they might be overcome, globalization</text><text x="450" y="273" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">SO THESE STRUCTURES MATTER MORE</text><rect x="30" y="289" width="270.6666666666667" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="321" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OPINION</text><text x="50" y="347.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Express and justify a</text><text x="50" y="370.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">position</text><text x="50" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Environmental policy, ethics, a</text><text x="50" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">moral position</text><rect x="314.6666666666667" y="289" width="270.6666666666667" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="321" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CAUSE AND EFFECT</text><text x="334.6666666666667" y="347.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Trace chains of</text><text x="334.6666666666667" y="370.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">consequence</text><text x="334.6666666666667" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">because</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">·</tspan> <tspan font-style="italic">as</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">result</tspan> <tspan font-style="italic">·</tspan> <tspan font-style="italic">this</tspan></text><text x="334.6666666666667" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">leads</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">·</tspan> <tspan font-style="italic">consequently</tspan></text><rect x="599.3333333333334" y="289" width="270.6666666666667" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="321" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">COMPARISON</text><text x="619.3333333333334" y="347.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Compare groups, regions,</text><text x="619.3333333333334" y="370.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">outcomes</text><text x="619.3333333333334" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">more/less</tspan> <tspan font-style="italic">·</tspan></text><text x="619.3333333333334" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">similarity/difference</tspan></text><rect x="30" y="466" width="299.39393939393943" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="179.69696969696972" y="500.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A change in one country's</text><text x="179.69696969696972" y="523.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">economy</text><line x1="335.39393939393943" y1="507" x2="363.39393939393943" y2="507" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="369.39393939393943" y="466" width="184.24242424242425" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="461.51515151515156" y="511.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">as a result…</text><line x1="559.6363636363637" y1="507" x2="587.6363636363637" y2="507" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="593.6363636363637" y="466" width="276.3636363636364" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="731.818181818182" y="511.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">it affects another country</text><text x="450" y="583.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Make this toolkit fluent for producing language, not just recognised when reading.</text>
