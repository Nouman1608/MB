<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 992" width="900" height="992" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="992" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Small words that carry the opinion</text>

<rect x="30" y="110" width="840" height="722" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Signal</text><text x="544" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Urdu</text><line x1="220" y1="110" x2="220" y2="832" stroke="#c9d6d4" stroke-width="2"/><text x="576" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What usually follows</text><line x1="560" y1="110" x2="560" y2="832" stroke="#c9d6d4" stroke-width="2"/><rect x="32" y="160" width="836" height="84" fill="#f2e7b8"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="206.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">contrast</text><text x="544" y="218.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لیکن، مگر، پر، البتہ&#x200F;</text><text x="576" y="195.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the speaker's real point or</text><text x="576" y="218.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reservation</text><line x1="30" y1="244" x2="870" y2="244" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="290.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">concession</text><text x="544" y="302.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ ٹھیک ہے کہ ... لیکن&#x200F;</text><text x="576" y="279.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">partial agreement, then</text><text x="576" y="302.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">disagreement</text><line x1="30" y1="328" x2="870" y2="328" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="374.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">change of mind</text><text x="544" y="386.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پہلے میں سمجھتا تھا ... اب&#x200F;</text><text x="576" y="363.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the current view: the one to</text><text x="576" y="386.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">match</text><line x1="30" y1="412" x2="870" y2="412" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="458.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">reported view</text><text x="544" y="470.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لوگ کہتے ہیں ... / سنا ہے ...&#x200F;</text><text x="576" y="447.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">often a view the speaker then</text><text x="576" y="470.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rejects</text><line x1="30" y1="496" x2="870" y2="496" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="542.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">doubt</text><text x="544" y="554.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شاید، پتا نہیں، مجھے نہیں لگتا&#x200F;</text><text x="576" y="542.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">uncertainty, not a firm opinion</text><line x1="30" y1="580" x2="870" y2="580" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="626.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">regret or wish</text><text x="544" y="638.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کاش ...&#x200F;</text><text x="576" y="615.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">something missed or wanted</text><text x="576" y="638.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">changed</text><line x1="30" y1="664" x2="870" y2="664" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="699.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">rhetorical</text><text x="46" y="722.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">question</text><text x="544" y="722.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیا فائدہ اگر ...؟&#x200F;</text><text x="576" y="710.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">an implied negative judgement</text><line x1="30" y1="748" x2="870" y2="748" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="794.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">emphasis</text><text x="544" y="806.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بالکل، ہرگز، واقعی&#x200F;</text><text x="576" y="794.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a strong, settled view</text><rect x="30" y="854" width="840" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="888" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The word after "but" often decides the match</text><text x="846" y="938" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آن لائن خریداری آسان تو ہے، لیکن ...&#x200F;</text><text x="54" y="932" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not simply "it is easy":</text><text x="54" y="952" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">a reservation is coming</text>
</svg>