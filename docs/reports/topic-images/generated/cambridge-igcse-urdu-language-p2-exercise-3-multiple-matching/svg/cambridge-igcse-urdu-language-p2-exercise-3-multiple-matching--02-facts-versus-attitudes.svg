<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 464" width="900" height="464" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="464" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Not facts, but connections and implications</text>

<rect x="30" y="110" width="410" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHAT IS SAID</text><text x="50" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Exercises 1 and 2</text><text x="50" y="202.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Catch a stated fact: a time, number,</text><text x="50" y="225.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">place or name.</text><text x="50" y="260.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">L1 select information; L2 ideas and</text><text x="50" y="283.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">attitudes.</text><rect x="460" y="110" width="410" height="214" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHAT IS MEANT</text><text x="480" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Exercise 3</text><text x="480" y="202.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">L3 connections: likes one thing but</text><text x="480" y="225.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">worries about another; agrees only up to</text><text x="480" y="248.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a point.</text><text x="480" y="283.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">L4 implied meaning: a rhetorical</text><text x="480" y="306.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">question, a complaint or regret.</text><rect x="30" y="344" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="380" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The right option captures the whole connection</text><text x="54" y="410" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and states plainly what the speaker only implied.</text>
</svg>