<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 878" width="900" height="878" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="878" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: two speakers on online shopping</text>

<rect x="30" y="110" width="840" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Speaker 1</text><text x="54" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">easy, but clothes never match the picture</text><text x="846" y="174" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آن لائن خریداری آسان تو ہے، لیکن کپڑے کبھی ویسے&#x200F;</text><text x="846" y="228" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نہیں نکلتے جیسے تصویر میں دکھائی دیتے ہیں۔&#x200F;</text><rect x="30" y="272" width="840" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Speaker 2</text><text x="54" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">people say it is cheaper; with delivery, the market is</text><text x="846" y="336" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لوگ کہتے ہیں آن لائن چیزیں سستی ملتی ہیں۔ ڈیلیوری کا&#x200F;</text><text x="846" y="390" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;خرچ ملا کر دیکھیں تو بازار ہی سستا پڑتا ہے۔&#x200F;</text><text x="450" y="450" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Options and matches</text><rect x="30" y="470" width="840" height="118" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="514" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="521.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="846" y="522" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سہولت کو مانتا ہے، مگر معیار پر بھروسا نہیں کرتا۔&#x200F;</text><text x="110" y="520" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">accepts convenience, distrusts quality</text><text x="54" y="570" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Speaker 1: L3: both halves of the connection</text><rect x="30" y="600" width="840" height="118" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="644" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="651.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="846" y="652" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آن لائن خریداری کو سستا سمجھنے والوں سے متفق نہیں۔&#x200F;</text><text x="110" y="650" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">disagrees with those who think it cheap</text><text x="54" y="700" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Speaker 2: L4: disagreement implied, never stated</text><rect x="30" y="730" width="840" height="118" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><circle cx="70" cy="774" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="781.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="846" y="782" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آن لائن خریداری سے وقت کی بچت ہوتی ہے۔&#x200F;</text><text x="110" y="780" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">saves time</text><text x="54" y="830" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">No speaker: keyword trap: "easy" suggests it, but speaker 1's point is quality</text>
</svg>