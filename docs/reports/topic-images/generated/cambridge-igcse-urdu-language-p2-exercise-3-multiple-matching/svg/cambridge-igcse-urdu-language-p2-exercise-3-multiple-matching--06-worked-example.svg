<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1008" width="900" height="1008" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1008" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: two speakers on online shopping</text>

<text x="54" y="116" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Speakers</text><rect x="30" y="128" width="840" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="172" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="179.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="54" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Speaker 1: easy, but clothes never look as they do in the picture</text><text x="846" y="188" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آن لائن خریداری آسان تو ہے، لیکن کپڑے کبھی ویسے&#x200F;</text><text x="846" y="244" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نہیں نکلتے جیسے تصویر میں دکھائی دیتے ہیں۔&#x200F;</text><rect x="30" y="322" width="840" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="366" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="373.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="54" y="486" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Speaker 2: people say it is cheaper; add delivery and the market is cheaper</text><text x="846" y="382" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لوگ کہتے ہیں آن لائن چیزیں سستی ملتی ہیں۔ ڈیلیوری کا&#x200F;</text><text x="846" y="438" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;خرچ ملا کر دیکھیں تو بازار ہی سستا پڑتا ہے۔&#x200F;</text><text x="54" y="528" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Options</text><rect x="30" y="534" width="840" height="140" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="578" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="585.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="846" y="592" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سہولت کو مانتا ہے، مگر معیار پر بھروسا نہیں کرتا۔&#x200F;</text><text x="846" y="626" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">accepts convenience, but does not trust quality</text><text x="54" y="658" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Speaker 1 → L3: both halves of the connection</text><rect x="30" y="686" width="840" height="140" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="730" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="737.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="846" y="744" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آن لائن خریداری کو سستا سمجھنے والوں سے متفق نہیں۔&#x200F;</text><text x="846" y="778" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">disagrees with those who think it cheap</text><text x="54" y="810" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Speaker 2 → L4: the disagreement is implied, never stated</text><rect x="30" y="838" width="840" height="140" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><circle cx="70" cy="882" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="889.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="846" y="896" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آن لائن خریداری سے وقت کی بچت ہوتی ہے۔&#x200F;</text><text x="846" y="930" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">online shopping saves time</text><text x="54" y="962" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Not speaker 1 → keyword trap: "easy" suggests it, but the point is quality</text>
</svg>