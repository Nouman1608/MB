<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 2 Exercise 3 at a glance</text>

<rect x="30" y="110" width="268" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">6 speakers</text><text x="164" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">six short extracts, 1 mark</text><text x="164" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">each</text><rect x="316" y="110" width="268" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">L3 and L4</text><text x="450" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">connections and implied</text><text x="450" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">meaning</text><rect x="602" y="110" width="268" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="736" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Heard twice</text><text x="736" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">with pauses to read and</text><text x="736" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">write</text><text x="450" y="278" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Same topic for everyone: attitude tells them apart</text><rect x="30" y="298" width="128" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="94" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Speaker 1</text><circle cx="94" cy="374" r="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="94" y="380" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="172" y="298" width="128" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Speaker 2</text><circle cx="236" cy="374" r="27" fill="#fbf1ea" stroke="#1e2a44" stroke-width="2"/><text x="236" y="380" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">−</text><rect x="314" y="298" width="128" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="378" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Speaker 3</text><circle cx="378" cy="374" r="27" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="378" y="380" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+/−</text><rect x="456" y="298" width="128" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="520" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Speaker 4</text><circle cx="520" cy="374" r="27" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="520" y="380" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">→</text><rect x="598" y="298" width="128" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="662" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Speaker 5</text><circle cx="662" cy="374" r="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="662" y="380" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="740" y="298" width="128" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="804" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Speaker 6</text><circle cx="804" cy="374" r="27" fill="#fbf1ea" stroke="#1e2a44" stroke-width="2"/><text x="804" y="380" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">−</text><rect x="30" y="432" width="840" height="104" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="468" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How many options?</text><text x="54" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The syllabus does not say. Some papers give one per speaker; others add one or two</text><text x="54" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">extra. Practise both, and check the specimen paper for your series.</text>
