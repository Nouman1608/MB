<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 852" width="900" height="852" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="852" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A routine for the two hearings</text>

<rect x="30" y="110" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="165" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="173.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">In the pause</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Read every option; underline the word that makes each one different; notice pairs</text><text x="122" y="199" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">of options close in meaning.</text><rect x="30" y="232" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="280" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="288.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">First hearing</text><text x="122" y="298" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">For each speaker, note a 3-4 word summary plus an attitude sign.</text><rect x="30" y="340" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="388" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="396.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="378" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Second hearing</text><text x="122" y="406" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Confirm the summaries; listen again to any speaker whose match is uncertain.</text><rect x="30" y="448" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="503" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="511.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="486" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">After</text><text x="122" y="514" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Match the confident ones first and cross those options off; decide the rest by</text><text x="122" y="537" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">elimination; fill every answer.</text><rect x="30" y="580" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="616" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Attitude signs for your notes</text><circle cx="70" cy="662" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="669" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="106" y="669" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">for</text><circle cx="270" cy="662" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="270" y="669" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">−</text><text x="306" y="669" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">against</text><circle cx="470" cy="662" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="470" y="669" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">+/−</text><text x="506" y="669" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mixed</text><circle cx="670" cy="662" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="670" y="669" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">→</text><text x="706" y="669" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">changed mind</text><rect x="30" y="720" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="756" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Words that make an option distinct: underline them</text><text x="846" y="802" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;متفق نہیں&#x200F;</text><text x="743.28" y="796" font-size="14" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">disagrees</text><text x="650.68" y="802" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بدل گئی&#x200F;</text><text x="568.1199999999999" y="796" font-size="14" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">changed</text><text x="490.3199999999999" y="802" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شک&#x200F;</text><text x="458.15999999999985" y="796" font-size="14" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">doubt</text><text x="395.15999999999985" y="802" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;افسوس&#x200F;</text><text x="332.7599999999999" y="796" font-size="14" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">regret</text><text x="262.3599999999999" y="802" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سب سے اہم&#x200F;</text><text x="159.6399999999999" y="796" font-size="14" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">most important</text>
</svg>