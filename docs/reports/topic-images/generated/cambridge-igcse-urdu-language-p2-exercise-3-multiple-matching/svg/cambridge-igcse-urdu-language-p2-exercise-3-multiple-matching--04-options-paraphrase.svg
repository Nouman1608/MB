<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 910" width="900" height="910" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="910" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The options summarise; they do not repeat</text>

<rect x="30" y="110" width="840" height="680" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="454" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Speaker says</text><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Option might say</text><line x1="470" y1="110" x2="470" y2="790" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="218.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;روز دو گھنٹے ٹریفک میں پھنسا رہتا ہوں&#x200F;</text><text x="454" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">stuck in traffic two hours a day</text><text x="854" y="218.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سفر میں بہت وقت ضائع ہوتا ہے&#x200F;</text><text x="854" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">a lot of time is wasted travelling</text><line x1="30" y1="266" x2="870" y2="266" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="324.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پیسے تو بہت لگتے ہیں&#x200F;</text><text x="454" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">it costs a lot</text><text x="854" y="324.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ مہنگا ہے&#x200F;</text><text x="854" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">it is expensive</text><line x1="30" y1="372" x2="870" y2="372" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="430.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پہلے مجھے اچھا نہیں لگتا تھا،&#x200F;</text><text x="454" y="480.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اب عادت ہو گئی ہے&#x200F;</text><text x="454" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">disliked it at first, used to it now</text><text x="854" y="455.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;رائے وقت کے ساتھ بدل گئی&#x200F;</text><text x="854" y="489" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">opinion changed over time</text><line x1="30" y1="528" x2="870" y2="528" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="586.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لوگ کہتے ہیں یہ خطرناک ہے،&#x200F;</text><text x="454" y="636.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مجھے تو کبھی کچھ نہیں ہوا&#x200F;</text><text x="454" y="670" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">people say it is dangerous; nothing happened to me</text><text x="854" y="611.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ایک عام خیال سے متفق نہیں&#x200F;</text><text x="854" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">disagrees with a common view</text><line x1="30" y1="684" x2="870" y2="684" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="742.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کاش بچپن میں کسی نے سکھایا ہوتا&#x200F;</text><text x="454" y="776" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">if only someone had taught me as a child</text><text x="854" y="742.8" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;افسوس ہے کہ یہ پہلے نہیں سیکھا&#x200F;</text><text x="854" y="776" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">regrets not learning it earlier</text><rect x="30" y="812" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="855" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Summarise each speaker in 3-4 of your own words, then match the summary.</text>
</svg>