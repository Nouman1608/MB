<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="482" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the media influence politics</text>

<text x="30" y="128" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Agenda setting: McCombs and Shaw, 1968 US election (1972)</text><rect x="30" y="140" width="390" height="88" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="184.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Media emphasise some issues</text><line x1="424" y1="184" x2="476" y2="184" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="140" width="390" height="88" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="172.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Voters rate those issues most</text><text x="675" y="196.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">important</text><text x="450" y="260" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">The media tell people what to think about</text><rect x="30" y="288" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,338 L31.25,302.25 Q31.25,289.25 44.25,289.25 L285.0833333333333,289.25 Q298.0833333333333,289.25 298.0833333333333,302.25 L298.0833333333333,338 Z" fill="#b5d3cf"/><line x1="31.25" y1="338" x2="298.0833333333333" y2="338" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="318.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Opinion polls</text><text x="44" y="369.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Published polls can create</text><text x="44" y="390.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bandwagon or underdog effects</text><text x="44" y="411.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and shape coverage.</text><rect x="315.3333333333333" y="288" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,338 L316.5833333333333,302.25 Q316.5833333333333,289.25 329.5833333333333,289.25 L570.4166666666666,289.25 Q583.4166666666666,289.25 583.4166666666666,302.25 L583.4166666666666,338 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="338" x2="583.4166666666666" y2="338" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="318.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">News reporting</text><text x="329.3333333333333" y="369.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Framing, bias and the</text><text x="329.3333333333333" y="390.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personalisation of politics.</text><rect x="600.6666666666666" y="288" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,338 L601.9166666666666,302.25 Q601.9166666666666,289.25 614.9166666666666,289.25 L855.75,289.25 Q868.75,289.25 868.75,302.25 L868.75,338 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="338" x2="868.75" y2="338" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="318.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social media</text><text x="614.6666666666666" y="369.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Targeted political</text><text x="614.6666666666666" y="390.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advertising; Cambridge</text><text x="614.6666666666666" y="411.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Analytica (2018) raised</text><text x="614.6666666666666" y="432.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">concern about personal data.</text>
</svg>