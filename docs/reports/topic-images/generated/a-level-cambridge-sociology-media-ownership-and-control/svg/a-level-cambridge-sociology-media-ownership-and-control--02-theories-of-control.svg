<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 902" width="900" height="902" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="902" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who controls the media?</text>

<rect x="198" y="104" width="218.66666666666666" height="66" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="307.3333333333333" y="129.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who or what</text><text x="307.3333333333333" y="154.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">controls?</text><rect x="424.66666666666663" y="104" width="218.66666666666666" height="66" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="534" y="142.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">How it works</text><rect x="651.3333333333333" y="104" width="218.66666666666666" height="66" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="760.6666666666666" y="142.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Key names or ideas</text><rect x="30" y="178" width="160" height="156" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="261.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pluralism</text><rect x="198" y="178" width="218.66666666666666" height="156" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Audiences, through a</text><text x="212" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">market of many</text><text x="212" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">competing groups</text><rect x="424.66666666666663" y="178" width="218.66666666666666" height="156" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="438.66666666666663" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Owners must give</text><text x="438.66666666666663" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">audiences what they</text><text x="438.66666666666663" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">want; journalists value</text><text x="438.66666666666663" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">independence;</text><text x="438.66666666666663" y="292.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regulation protects</text><text x="438.66666666666663" y="313.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">balance</text><rect x="651.3333333333333" y="178" width="218.66666666666666" height="156" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="665.3333333333333" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Public-service</text><text x="665.3333333333333" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">broadcasting as a</text><text x="665.3333333333333" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safeguard</text><rect x="30" y="342" width="160" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="393.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Instrumental</text><text x="42" y="415.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Marxism</text><rect x="198" y="342" width="218.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Owners</text><rect x="424.66666666666663" y="342" width="218.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="438.66666666666663" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Media deliberately</text><text x="438.66666666666663" y="393.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">spread ruling-class</text><text x="438.66666666666663" y="414.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ideology: <tspan font-weight="700">mass</tspan></text><text x="438.66666666666663" y="435.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">manipulation</tspan></text><rect x="651.3333333333333" y="342" width="218.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="665.3333333333333" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Miliband (1969); Herman</text><text x="665.3333333333333" y="393.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and Chomsky (1988)</text><rect x="30" y="464" width="160" height="135" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="536.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Neo-Marxism</text><rect x="198" y="464" width="218.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="494.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ruling-class ideas</text><text x="212" y="515.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-weight="700">hegemony</tspan>)</text><rect x="424.66666666666663" y="464" width="218.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="438.66666666666663" y="494.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Middle-class</text><text x="438.66666666666663" y="515.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">journalists share a</text><text x="438.66666666666663" y="536.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">common-sense view of</text><text x="438.66666666666663" y="557.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the world; no orders</text><text x="438.66666666666663" y="578.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">needed</text><rect x="651.3333333333333" y="464" width="218.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="665.3333333333333" y="494.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gramsci; Glasgow</text><text x="665.3333333333333" y="515.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">University Media Group</text><text x="665.3333333333333" y="536.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1976); Hall</text><rect x="30" y="607" width="160" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="669.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Post-modernism</text><rect x="198" y="607" width="218.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="637.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No single source</text><rect x="424.66666666666663" y="607" width="218.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="438.66666666666663" y="637.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Images become</text><text x="438.66666666666663" y="658.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">hyperreal</tspan>; fragmented</text><text x="438.66666666666663" y="679.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">audiences create their</text><text x="438.66666666666663" y="700.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">own meanings</text><rect x="651.3333333333333" y="607" width="218.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="665.3333333333333" y="637.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Baudrillard (1981)</text><rect x="30" y="737" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="773" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criticisms</text><circle cx="61" cy="796.39" r="4.5" fill="#8a6d0d"/><text x="74" y="802" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Pluralism:</tspan> ownership is highly concentrated, and audiences can only choose from what is</text><text x="74" y="824" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">offered</text><circle cx="61" cy="848.39" r="4.5" fill="#8a6d0d"/><text x="74" y="854" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Postmodernism:</tspan> underplays the economic power of media corporations</text>
</svg>