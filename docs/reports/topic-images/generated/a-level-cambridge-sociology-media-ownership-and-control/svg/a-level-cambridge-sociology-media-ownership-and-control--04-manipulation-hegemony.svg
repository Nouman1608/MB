<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Manipulation or hegemony?</text>

<text x="30" y="140" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Instrumental Marxism: mass manipulation (Miliband)</text><rect x="30" y="160" width="184.5" height="88" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="122.25" y="204.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Owners</text><line x1="218.5" y1="204" x2="244.5" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="160" width="184.5" height="88" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="340.75" y="193.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Give orders</text><text x="340.75" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">direct control</text><line x1="437" y1="204" x2="463" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="160" width="184.5" height="88" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="559.25" y="192.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Journalists</text><text x="559.25" y="216.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">comply</text><line x1="655.5" y1="204" x2="681.5" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="160" width="184.5" height="88" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="777.75" y="192.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ruling-class</text><text x="777.75" y="216.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">ideology</text><text x="30" y="318" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Neo-Marxism: hegemony (Gramsci; Glasgow University Media Group)</text><rect x="30" y="338" width="257.3333333333333" height="106" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="158.66666666666666" y="370.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Journalists</text><text x="158.66666666666666" y="400.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">mostly middle-class</text><text x="158.66666666666666" y="421.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">backgrounds</text><line x1="291.3333333333333" y1="391" x2="317.3333333333333" y2="391" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="338" width="257.3333333333333" height="106" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="380.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shared common sense</text><text x="450" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">no orders needed</text><line x1="582.6666666666666" y1="391" x2="608.6666666666666" y2="391" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="338" width="257.3333333333333" height="106" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="741.3333333333333" y="379.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ruling-class ideas</text><text x="741.3333333333333" y="403.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">dominate</text>
