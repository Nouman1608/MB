<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What shapes the news?</text>

<line x1="377.86282591229514" y1="361.52063856788124" x2="178.52299155033853" y2="206.53094858663968" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="108" width="250" height="117" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="138" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">News values</text><text x="44" y="162" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">negativity, elite persons,</text><text x="44" y="183" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unexpectedness, proximity</text><text x="44" y="204" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Galtung and Ruge, 1965)</text><line x1="450" y1="338" x2="450" y2="189" stroke="#1e2a44" stroke-width="2.5"/><rect x="325" y="108" width="250" height="75" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="339" y="138" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gatekeeping</text><text x="339" y="162" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">editors set the agenda</text><line x1="520.8925557728847" y1="360.4840610268165" x2="721.8828622479724" y2="190.417108137934" stroke="#1e2a44" stroke-width="2.5"/><rect x="620" y="108" width="250" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="634" y="138" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Commercial pressures</text><text x="634" y="162" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">advertising, audiences,</text><text x="634" y="183" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">clicks</text><line x1="540.6031776239785" y1="389.237116998537" x2="616.9737707487261" y2="357.37412390450004" stroke="#1e2a44" stroke-width="2.5"/><rect x="620" y="300" width="250" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="634" y="330" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Owners</text><text x="634" y="354" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">direct or indirect</text><text x="634" y="375" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">influence</text><line x1="533.115174542053" y1="426.5821560436632" x2="627.5546446688383" y2="516.847799574874" stroke="#1e2a44" stroke-width="2.5"/><rect x="620" y="492" width="250" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="634" y="522" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sources</text><text x="634" y="546" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">official spokespeople and</text><text x="634" y="567" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">PR material</text><line x1="366.8848254579471" y1="426.5821560436632" x2="272.4453553311617" y2="516.847799574874" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="492" width="250" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="522" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Practical constraints</text><text x="44" y="546" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">deadlines, budgets,</text><text x="44" y="567" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">location of journalists</text><line x1="359.39682237602153" y1="389.237116998537" x2="283.0262292512739" y2="357.37412390450004" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="300" width="250" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="330" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Censorship</text><text x="44" y="354" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">state, legal limits,</text><text x="44" y="375" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">regulation, self-censorship</text><ellipse cx="450" cy="400" rx="110" ry="70" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="396" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What becomes</text><text x="450" y="420" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">news?</text>
</svg>