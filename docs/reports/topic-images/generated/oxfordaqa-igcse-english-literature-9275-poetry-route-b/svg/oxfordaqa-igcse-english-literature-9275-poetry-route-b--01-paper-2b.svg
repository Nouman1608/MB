<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 2b at a glance</text>

<text x="450" y="120" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Paper 2b: Poetry (Route B), 1 hour 30 minutes, open book, 60 marks = 40% of the qualification</text><rect x="60" y="140" width="390" height="90" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="255" y="178" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: Poetry</text><text x="255" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">People and Places, 1 of 2 questions</text><rect x="450" y="140" width="390" height="90" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="645" y="178" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: Unseen poetry</text><text x="645" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">one previously unseen poem</text><text x="255" y="260" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">30 marks · about 45 minutes</text><text x="645" y="260" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">30 marks · about 45 minutes</text><text x="30" y="294" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What the marks reward on Paper 2b</text><rect x="30" y="308" width="336" height="150" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="198" y="340" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1: about 40%</text><text x="198" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">themes, ideas and contexts</text><rect x="366" y="308" width="336" height="150" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="534" y="340" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2: about 40%</text><text x="534" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">how writers create meanings and</text><text x="534" y="391" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">effects</text><rect x="702" y="308" width="168" height="150" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="786" y="340" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3: about 20%</text><text x="786" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">personal</text><text x="786" y="391" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">response,</text><text x="786" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">terminology,</text><text x="786" y="433" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">accurate writing</text><rect x="30" y="476" width="840" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="512" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two consequences</text><circle cx="61" cy="535.39" r="4.5" fill="#8a6d0d"/><text x="74" y="541" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ideas and methods are equally weighted: a paragraph on only technique, or only theme,</text><text x="74" y="563" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">does half the job</text><circle cx="61" cy="587.39" r="4.5" fill="#8a6d0d"/><text x="74" y="593" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Context sits inside AO1, so it earns credit only when it deepens what you say about</text><text x="74" y="615" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the poem’s ideas</text>
</svg>