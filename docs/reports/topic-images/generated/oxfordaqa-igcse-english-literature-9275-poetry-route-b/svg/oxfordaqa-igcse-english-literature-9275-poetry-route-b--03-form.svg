<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 714" width="900" height="714" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Writing precisely about form</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">link the shape of the poem to its meaning</text>
<rect x="30" y="120" width="416" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="238" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Recognise</text><rect x="454" y="120" width="416" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="662" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Then ask</text><rect x="30" y="172" width="416" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="202.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Sonnet:</tspan> fourteen lines, often with a turn</text><text x="44" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(volta)</text><rect x="454" y="172" width="416" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="202.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What changes at the turn, and why compress the</text><text x="468" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">idea into such a tight space?</text><rect x="30" y="252" width="416" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="282.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Dramatic monologue:</tspan> a single speaker, not the</text><text x="44" y="303.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">poet, addressing a listener</text><rect x="454" y="252" width="416" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="282.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What does the speaker reveal without meaning</text><text x="468" y="303.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to?</text><rect x="30" y="332" width="416" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="362.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Free verse:</tspan> no regular metre or rhyme</text><rect x="454" y="332" width="416" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="362.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Does the freedom suit a speech-like voice, a</text><text x="468" y="383.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">restless mind or a break from tradition?</text><rect x="30" y="412" width="416" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="442.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Regular stanzas and rhyme</tspan></text><rect x="454" y="412" width="416" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="442.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Does the order support the meaning (stability,</text><text x="468" y="463.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ritual) or work against it (a cheerful</text><text x="468" y="484.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pattern, a painful subject)?</text><rect x="30" y="513" width="416" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="543.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Line length and enjambment</tspan></text><rect x="454" y="513" width="416" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="543.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Where does the poem speed up, slow down or</text><text x="468" y="564.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pause, and what does the reader feel there?</text><rect x="30" y="601" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="637" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Too general</text><text x="56" y="666" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"The poem has four stanzas" earns nothing until it is linked to meaning.</text>
</svg>