<rect width="900" height="926" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning your 45 minutes</text><rect x="30" y="130" width="37.333333333333336" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="48.66666666666667" y="170" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="67.33333333333334" y="130" width="93.33333333333334" height="64" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="114.00000000000001" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Annotate</text><text x="114.00000000000001" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">5 min</text><rect x="160.66666666666669" y="130" width="56" height="64" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="188.66666666666669" y="170" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="216.66666666666669" y="130" width="560" height="64" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="496.6666666666667" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Write</text><text x="496.6666666666667" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">30 min</text><rect x="776.6666666666667" y="130" width="93.33333333333334" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="823.3333333333334" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Check</text><text x="823.3333333333334" y="182" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">5 min</text><text x="30" y="118" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">Section A: about 45 minutes</text>

<rect x="30" y="214" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="262" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="269.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="253.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Choose (2 minutes)</text><text x="104" y="283.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Read both questions; pick the one where your grid gives a strong contrasting pair.</text><line x1="450" y1="314" x2="450" y2="350" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="356" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="415" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="422.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="395.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Annotate (5 minutes)</text><text x="104" y="425.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mark four or five short quotations in each poem, including one about form or</text><text x="104" y="447.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">structure.</text><line x1="450" y1="478" x2="450" y2="514" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="520" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="568" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="575.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="559.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Argue (3 minutes)</text><text x="104" y="589.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Write a one-sentence argument covering both poems.</text><line x1="450" y1="620" x2="450" y2="656" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="662" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="710" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="717.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="701.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Write (30 minutes)</text><text x="104" y="731.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Three or four comparative paragraphs.</text><line x1="450" y1="762" x2="450" y2="798" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="804" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="852" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="859.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="843.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Check (5 minutes)</text><text x="104" y="873.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Make sure every paragraph mentions both poems.</text>
</svg>