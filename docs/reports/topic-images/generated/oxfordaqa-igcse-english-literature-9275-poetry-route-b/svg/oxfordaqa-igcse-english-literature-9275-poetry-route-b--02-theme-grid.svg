<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 687" width="900" height="687" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a theme grid</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">themes down the side, poems across the top, a method in each cell</text>
<rect x="208" y="110" width="215.33333333333334" height="46" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="315.6666666666667" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Poem 1</text><rect x="431.33333333333337" y="110" width="215.33333333333334" height="46" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="539" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Poem 2</text><rect x="654.6666666666667" y="110" width="215.33333333333334" height="46" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="762.3333333333334" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Poem 3</text><rect x="30" y="164" width="170" height="86" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="115" y="213" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Belonging</text><rect x="208" y="164" width="215.33333333333334" height="86" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="315.6666666666667" y="190.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Speaker feels outside;</text><text x="315.6666666666667" y="211.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">first-person, hesitant</text><text x="315.6666666666667" y="232.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">tone</text><rect x="431.33333333333337" y="164" width="215.33333333333334" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="539" y="211.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">—</text><rect x="654.6666666666667" y="164" width="215.33333333333334" height="86" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="762.3333333333334" y="201.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Collective "we";</text><text x="762.3333333333334" y="222.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">celebratory</text><rect x="30" y="258" width="170" height="86" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="115" y="307" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Memory</text><rect x="208" y="258" width="215.33333333333334" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="315.6666666666667" y="295.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Present tense makes</text><text x="315.6666666666667" y="316.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the past vivid</text><rect x="431.33333333333337" y="258" width="215.33333333333334" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="539" y="295.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Fragmented stanzas</text><text x="539" y="316.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">mirror forgetting</text><rect x="654.6666666666667" y="258" width="215.33333333333334" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="762.3333333333334" y="305.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">—</text><rect x="30" y="352" width="170" height="86" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="115" y="401" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Power of a</text><text x="115" y="425" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">place</text><rect x="208" y="352" width="215.33333333333334" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="315.6666666666667" y="399.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">—</text><rect x="431.33333333333337" y="352" width="215.33333333333334" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="539" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Landscape personified</text><text x="539" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">as a threat</text><rect x="654.6666666666667" y="352" width="215.33333333333334" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="762.3333333333334" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Place as refuge;</text><text x="762.3333333333334" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">gentle imagery</text><text x="450" y="462" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle" font-style="italic">highlighted: a contrasting pair within one theme (outside vs collective "we")</text><rect x="30" y="482" width="840" height="179" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="518" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Three habits</text><circle cx="61" cy="541.39" r="4.5" fill="#8a6d0d"/><text x="74" y="547" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Every poem appears under at least two themes</text><circle cx="61" cy="571.39" r="4.5" fill="#8a6d0d"/><text x="74" y="577" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each cell names a <tspan font-weight="700">method</tspan>, not just a feeling</text><circle cx="61" cy="601.39" r="4.5" fill="#8a6d0d"/><text x="74" y="607" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mark the pairs that <tspan font-weight="700">contrast</tspan> within a theme</text><circle cx="61" cy="631.39" r="4.5" fill="#8a6d0d"/><text x="74" y="637" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use real anthology titles in your own grid</text>
</svg>