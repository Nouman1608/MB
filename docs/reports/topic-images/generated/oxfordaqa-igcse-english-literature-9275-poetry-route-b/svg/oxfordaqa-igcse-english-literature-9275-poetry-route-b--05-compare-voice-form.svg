<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 839" width="900" height="839" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="839" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing voice and form</text>

<rect x="30" y="110" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124.25 Q31.25,111.25 44.25,111.25 L427.75,111.25 Q440.75,111.25 440.75,124.25 L440.75,160 Z" fill="#b5d3cf"/><line x1="31.25" y1="160" x2="440.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Extract X</text><text x="44" y="192.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"You think this hill is nothing. Walk it,</text><text x="44" y="214.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">then, / at five, with forty kilos on your</text><text x="44" y="236.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">back."</text><rect x="458" y="110" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,160 L459.25,124.25 Q459.25,111.25 472.25,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,160 Z" fill="#f2e7b8"/><line x1="459.25" y1="160" x2="868.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Extract Y</text><text x="472" y="192.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"The surveyor looks at the hill / through a</text><text x="472" y="214.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lens, and writes it down as a number."</text><text x="450" y="282" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">original lines written for the guide, not anthology poems</text><rect x="30" y="296" width="840" height="74" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Shared idea (AO1): a gap between how outsiders and insiders understand a</text><text x="450" y="348" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">landscape</text><rect x="30" y="382" width="120" height="91" rx="10" fill="#dce9e7" stroke="#8a6d0d" stroke-width="2"/><text x="90" y="433.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Voice</text><rect x="158" y="382" width="352" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="172" y="411.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dramatic monologue addressing "you":</text><text x="172" y="432.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the reader becomes the outsider being</text><text x="172" y="453.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">challenged</text><rect x="518" y="382" width="352" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="532" y="411.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Detached third-person observer</text><rect x="30" y="481" width="120" height="70" rx="10" fill="#dce9e7" stroke="#8a6d0d" stroke-width="2"/><text x="90" y="522" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Method</text><rect x="158" y="481" width="352" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="172" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Imperative "Walk it, then"; blunt time</text><text x="172" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"at five"; "forty kilos"</text><rect x="518" y="481" width="352" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="532" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The lens and the "number"; plain,</text><text x="532" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unemotional syntax</text><rect x="30" y="559" width="120" height="70" rx="10" fill="#dce9e7" stroke="#8a6d0d" stroke-width="2"/><text x="90" y="600" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Effect</text><rect x="158" y="559" width="352" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="172" y="588.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The hill is a daily burden, known</text><text x="172" y="609.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through labour and the body’s effort</text><rect x="518" y="559" width="352" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="532" y="588.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The hill becomes data, mirroring the</text><text x="532" y="609.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surveyor’s distance</text><rect x="30" y="637" width="120" height="49" rx="10" fill="#dce9e7" stroke="#8a6d0d" stroke-width="2"/><text x="90" y="667.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Tone</text><rect x="158" y="637" width="352" height="49" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="172" y="666.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Anger</text><rect x="518" y="637" width="352" height="49" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="532" y="666.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Irony</text><rect x="30" y="702" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="738" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement (AO3)</text><text x="56" y="767" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both poems criticise the outsider’s view, one with anger and one with irony. Comparative</text><text x="56" y="789" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">connectives such as "by contrast" and "whereas" build the personal argument.</text>
</svg>