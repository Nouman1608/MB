<clipPath id="tc100"><rect x="30" y="100" width="840" height="561" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="210" height="48" fill="#b5d3cf"/><text x="44" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Case</text><rect x="240" y="100" width="367.5" height="48" fill="#b5d3cf"/><text x="254" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What happened</text><rect x="607.5" y="100" width="262.5" height="48" fill="#b5d3cf"/><text x="621.5" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Outcome</text><rect x="30" y="148" width="210" height="89" fill="#dce9e7"/><text x="44" y="174.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Young, James and</text><text x="44" y="195.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Webster v UK (1981)</text><rect x="240" y="148" width="367.5" height="89" fill="#ffffff"/><text x="254" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Railway workers dismissed for refusing to</text><text x="254" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">join a union under a closed shop</text><rect x="607.5" y="148" width="262.5" height="89" fill="#ffffff"/><text x="621.5" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Compulsion struck at the</text><text x="621.5" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">substance: a <tspan font-weight="700">negative</tspan></text><text x="621.5" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">freedom not to join</text><line x1="30" y1="237" x2="870" y2="237" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="237" width="210" height="68" fill="#dce9e7"/><text x="44" y="263.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">ASLEF v UK (2007)</text><rect x="240" y="237" width="367.5" height="68" fill="#f8faf9"/><text x="254" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UK law stopped a union expelling a British</text><text x="254" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">National Party member</text><rect x="607.5" y="237" width="262.5" height="68" fill="#f8faf9"/><text x="621.5" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Breach</tspan>: a union must be free</text><text x="621.5" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to choose its members</text><line x1="30" y1="305" x2="870" y2="305" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="305" width="210" height="110" fill="#dce9e7"/><text x="44" y="331.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">National Union of Rail,</text><text x="44" y="352.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Maritime and</text><text x="44" y="373.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Transport Workers v</text><text x="44" y="394.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">UK (2014)</text><rect x="240" y="305" width="367.5" height="110" fill="#ffffff"/><text x="254" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UK ban on secondary industrial action</text><rect x="607.5" y="305" width="262.5" height="110" fill="#ffffff"/><text x="621.5" y="331.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">No</tspan> <tspan font-weight="700">breach</tspan>: wide margin on</text><text x="621.5" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">economic and social policy</text><line x1="30" y1="415" x2="870" y2="415" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="415" width="210" height="89" fill="#f2e7b8"/><text x="44" y="441.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Redfearn v UK (2012)</text><rect x="240" y="415" width="367.5" height="89" fill="#f8faf9"/><text x="254" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bus driver dismissed for being a BNP</text><text x="254" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">councillor; no unfair dismissal claim</text><rect x="607.5" y="415" width="262.5" height="89" fill="#f8faf9"/><text x="621.5" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">UK</tspan> <tspan font-weight="700">failed</tspan> its positive</text><text x="621.5" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">obligation to protect against</text><text x="621.5" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dismissal</text><line x1="30" y1="504" x2="870" y2="504" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="504" width="210" height="89" fill="#f2e7b8"/><text x="44" y="530.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">United Communist</text><text x="44" y="551.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Party of Turkey v</text><text x="44" y="572.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Turkey (1998)</text><rect x="240" y="504" width="367.5" height="89" fill="#ffffff"/><text x="254" y="530.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Political party dissolved</text><rect x="607.5" y="504" width="262.5" height="89" fill="#ffffff"/><text x="621.5" y="530.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Breach</tspan></text><line x1="30" y1="593" x2="870" y2="593" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="593" width="210" height="68" fill="#f2e7b8"/><text x="44" y="619.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Refah Partisi v Turkey</text><text x="44" y="640.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(2003)</text><rect x="240" y="593" width="367.5" height="68" fill="#f8faf9"/><text x="254" y="619.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Political party dissolved</text><rect x="607.5" y="593" width="262.5" height="68" fill="#f8faf9"/><text x="621.5" y="619.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Justified</tspan>: aims incompatible</text><text x="621.5" y="640.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with democracy</text></g><line x1="240" y1="100" x2="240" y2="661" stroke="#c9d6d4" stroke-width="1.5"/><line x1="607.5" y1="100" x2="607.5" y2="661" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="561" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="683" width="151.725" height="29" rx="14.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="105.8625" y="702.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">teal: trade unions</text><rect x="191.725" y="683" width="224.73" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="304.09" y="702.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">cream: political association</text>
