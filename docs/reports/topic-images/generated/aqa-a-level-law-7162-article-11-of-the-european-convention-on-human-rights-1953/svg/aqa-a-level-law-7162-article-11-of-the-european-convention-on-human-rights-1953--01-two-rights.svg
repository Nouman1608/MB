<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 607" width="900" height="607" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="607" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two rights in one Article</text>

<rect x="250" y="100" width="400" height="93" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="137.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 11.1</text><text x="450" y="168.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A qualified right</text><rect x="30" y="253" width="405" height="189" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="285" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FREEDOM 1</text><text x="50" y="313.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Peaceful assembly</text><text x="50" y="343.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="343.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Meeting with others in public or private</text><text x="50" y="369.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Marches, static protests, rallies, sit-ins</text><rect x="465" y="253" width="405" height="189" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="285" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FREEDOM 2</text><text x="485" y="313.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Association with others</text><text x="485" y="343.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="343.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Joining a formal or lasting group</text><text x="485" y="369.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“The right to form and to join trade unions</text><text x="501.15" y="391.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">for the protection of his interests”</text><text x="485" y="417.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="417.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Political parties and campaign groups</text><line x1="380" y1="197" x2="232" y2="247" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="520" y1="197" x2="668" y2="247" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="464" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="498.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Closely linked to Article 10</text><text x="50" y="528.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A protest is usually a way of expressing an opinion. Where the complaint is about a gathering, the</text><text x="50" y="550.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Court often treats Article 11 as the main right and reads it in the light of Article 10.</text>
</svg>