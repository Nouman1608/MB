<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="534" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The state, the police and protest</text>

<line x1="60" y1="120" x2="60" y2="482" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="100" width="766" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="132.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Protect the assembly: a positive duty</text><text x="122" y="161.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Plattform</tspan> <tspan font-style="italic">“Ärzte</tspan> <tspan font-style="italic">für</tspan> <tspan font-style="italic">das</tspan> <tspan font-style="italic">Leben”</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Austria</tspan> (1988): take <tspan font-weight="700" fill="#1e2a44">reasonable</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">appropriate</tspan> <tspan font-weight="700" fill="#1e2a44">measures</tspan> so</text><text x="122" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lawful demonstrations proceed peacefully, including protection from counter-demonstrators. A</text><text x="122" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">duty of means, not results.</text><circle cx="60" cy="163" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="171.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="238" width="766" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="270.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Preventive action needs a legal basis</text><text x="122" y="299.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">(Laporte)</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Chief</tspan> <tspan font-style="italic">Constable</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Gloucestershire</tspan> (2006): coaches turned back to London.</text><text x="122" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unlawful: a breach of the peace was not <tspan font-weight="700" fill="#1e2a44">imminent</tspan>, and turning back everyone was</text><text x="122" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">disproportionate.</text><circle cx="60" cy="301" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="309.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="376" width="766" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="408.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Notice may be required, but read narrowly</text><text x="122" y="437.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Public Order Act 1986 s11: notice of public processions, except those “commonly or customarily</text><text x="122" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">held”. <tspan font-style="italic">Kay</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Commissioner</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Police</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">Metropolis</tspan> (2008): the monthly Critical Mass ride,</text><text x="122" y="479.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with no fixed route, needed no notice.</text><circle cx="60" cy="439" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="447.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
</svg>