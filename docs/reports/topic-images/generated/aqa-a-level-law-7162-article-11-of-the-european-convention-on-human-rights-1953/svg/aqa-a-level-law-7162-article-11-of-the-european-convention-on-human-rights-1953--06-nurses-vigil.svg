<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 809" width="900" height="809" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="809" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: the nurses’ vigil</text>

<rect x="30" y="100" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Nurses hold a silent vigil outside a hospital about staff shortages. A separate group throws objects</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">at them. Police tell the nurses to leave because “there might be trouble” and arrest Kim when she</text><text x="50" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stays standing silently on the pavement.</text><line x1="60" y1="275" x2="60" y2="757" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="255" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="288.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Right</text><text x="122" y="318.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Article 11.1, peaceful assembly, read with Article 10.</text><circle cx="60" cy="298" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="306.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="353" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="386.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Peaceful?</text><text x="122" y="416.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Yes. Violence by others does not remove their protection (<tspan font-style="italic">Ezelin</tspan>).</text><circle cx="60" cy="396" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="404.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="451" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="484.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Location</text><text x="122" y="514.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A pavement is public highway; peaceful use can be lawful (<tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Jones</tspan>).</text><circle cx="60" cy="494" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="502.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="549" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="582.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Positive duty</text><text x="122" y="612.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Police should take reasonable steps to protect the vigil from the counter-group (<tspan font-style="italic">Plattform</tspan></text><text x="122" y="634.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Ärzte</tspan> <tspan font-style="italic">für</tspan> <tspan font-style="italic">das</tspan> <tspan font-style="italic">Leben</tspan>).</text><circle cx="60" cy="603" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="611.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="669" width="766" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="702.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Kim’s arrest</text><text x="122" y="732.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Acting against the peaceful group, not the aggressors, needs justification: compare</text><text x="122" y="754.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Laporte</tspan> on imminence and proportionality. Article 11.2 decides.</text><circle cx="60" cy="723" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="731.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>