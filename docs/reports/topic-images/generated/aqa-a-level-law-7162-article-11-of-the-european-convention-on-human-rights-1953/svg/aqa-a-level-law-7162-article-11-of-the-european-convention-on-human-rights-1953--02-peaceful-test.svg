<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is the assembly “peaceful”?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Only peaceful assemblies are protected by Article 11</text>
<rect x="30" y="124" width="270.6666666666667" height="260" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OUTSIDE ARTICLE 11</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Organisers or participants</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">intend violence</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The assembly is not protected</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="260" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STILL PROTECTED</text><text x="334.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Others turn violent, but</text><text x="334.6666666666667" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">you stay peaceful</text><text x="334.6666666666667" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ezelin</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">France</tspan> (1991): a</text><text x="334.6666666666667" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lawyer disciplined for joining a</text><text x="334.6666666666667" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">demonstration where others</text><text x="334.6666666666667" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">committed offences. Breach:</text><text x="334.6666666666667" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no punishment without a</text><text x="334.6666666666667" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reprehensible act of his own.</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="260" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STILL PEACEFUL</text><text x="619.3333333333334" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The protest causes</text><text x="619.3333333333334" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">disruption</text><text x="619.3333333333334" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Kudrevičius</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lithuania</tspan></text><text x="619.3333333333334" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2015): farmers blocked major</text><text x="619.3333333333334" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">roads for about two days. A</text><text x="619.3333333333334" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">peaceful assembly, but</text><text x="619.3333333333334" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serious deliberate disruption</text><text x="619.3333333333334" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was not at the core of the</text><text x="619.3333333333334" y="359.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">freedom; convictions justified.</text><rect x="30" y="406" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="440.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Disruption alone does not remove protection; <tspan font-weight="700" fill="#1e2a44">violent</tspan> <tspan font-weight="700" fill="#1e2a44">intention</tspan> does.</text>
</svg>