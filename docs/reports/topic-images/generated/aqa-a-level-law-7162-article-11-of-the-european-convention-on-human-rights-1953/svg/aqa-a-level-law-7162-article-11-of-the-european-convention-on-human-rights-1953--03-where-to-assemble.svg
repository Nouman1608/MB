<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 399" width="900" height="399" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="399" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where may people assemble?</text>

<rect x="30" y="100" width="412" height="267" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRIVATE LAND</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">No right to protest on any land</text><text x="50" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Appleby</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (2003): campaigners stopped</text><text x="65.2" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collecting signatures in a privately owned</text><text x="65.2" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shopping centre</text><text x="50" y="258.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="258.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No breach of Articles 10 or 11: they had other</text><text x="65.2" y="279.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">effective ways to reach the public</text><rect x="458" y="100" width="412" height="267" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PUBLIC HIGHWAY</text><text x="478" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assembly can be a lawful use</text><text x="478" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Jones</tspan> (1999): a peaceful,</text><text x="493.2" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">non-obstructive assembly can be a reasonable</text><text x="493.2" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">use of the highway, not automatically a</text><text x="493.2" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trespass</text><text x="478" y="279.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="279.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ziegler</tspan> (2021): “lawful excuse” for</text><text x="493.2" y="300.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">obstructing a road needs a proportionality</text><text x="493.2" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assessment under Articles 10 and 11; acquittals</text><text x="493.2" y="342.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">restored</text>
</svg>