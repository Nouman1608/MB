<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Responses to informal settlements</text>

<rect x="30" y="120" width="410" height="155" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="157" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Clearance and relocation</text><text x="48" y="184.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">housing removed; residents moved, often to the</text><text x="48" y="205.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">city edge, far from work</text><rect x="460" y="120" width="410" height="155" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="478" y="157" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Site-and-service schemes</text><text x="478" y="184.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the authority provides plots with basic</text><text x="478" y="205.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">services; families build their own homes</text><rect x="30" y="295" width="410" height="155" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="332" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Self-help schemes</text><text x="48" y="359.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">residents build with technical support, e.g.</text><text x="48" y="380.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Orangi Pilot Project, Karachi (from 1980)</text><rect x="460" y="295" width="410" height="155" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="332" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Upgrading in place</text><text x="478" y="359.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">water, drains, paved lanes and legal title</text><text x="478" y="380.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">while residents stay, e.g. Favela-Bairro, Rio</text><text x="478" y="401.36" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1990s)</text><rect x="30" y="480" width="840" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="450" y="518.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Not only problems</text><text x="450" y="545.67" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">busy workshops and markets, strong community networks, homes improved step by step; Dharavi, Mumbai,</text><text x="450" y="566.79" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">has a large informal economy</text>
</svg>