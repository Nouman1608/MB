<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 785" width="900" height="785" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="785" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Settlement hierarchy</text>

<path d="M185,187 L215,125 L365,125 L395,187 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="290" y="162" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">megacity (10 million+)</text><path d="M158,249 L188,187 L392,187 L422,249 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="290" y="224" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">conurbation</text><path d="M131,311 L161,249 L419,249 L449,311 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="290" y="286" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">city</text><path d="M104,373 L134,311 L446,311 L476,373 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="290" y="348" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">town</text><path d="M77,435 L107,373 L473,373 L503,435 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="290" y="410" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">village</text><path d="M50,497 L80,435 L500,435 L530,497 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="290" y="472" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">hamlet</text><path d="M23,559 L53,497 L527,497 L557,559 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="290" y="534" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">isolated dwelling</text><line x1="600" y1="559" x2="600" y2="131" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="620" y="185" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• fewer settlements</text><text x="620" y="215" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• further apart</text><text x="620" y="245" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• more high-order services</text><text x="620" y="275" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• larger sphere of influence</text><text x="620" y="151" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Going up the hierarchy:</text><rect x="30" y="580" width="270" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="616.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Threshold</text><text x="48" y="641.8499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">minimum people needed to keep a</text><text x="48" y="661.6499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">service running</text><text x="48" y="681.4499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">post office: small; university</text><text x="48" y="701.2499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hospital: large</text><rect x="315" y="580" width="270" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="333" y="616.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Range</text><text x="333" y="641.8499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">furthest people will travel to</text><text x="333" y="661.6499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">use a service</text><text x="333" y="681.4499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bread: short; specialist</text><text x="333" y="701.2499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">doctor: long</text><rect x="600" y="580" width="270" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="618" y="616.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sphere of influence</text><text x="618" y="641.8499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the area a settlement serves</text><text x="618" y="661.6499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bigger for higher-ranked</text><text x="618" y="681.4499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">settlements</text><text x="450" y="760" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Central place theory: Walter Christaller, 1933</text>
</svg>