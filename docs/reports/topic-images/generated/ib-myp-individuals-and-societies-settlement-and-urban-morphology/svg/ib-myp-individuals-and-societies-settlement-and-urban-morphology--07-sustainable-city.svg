<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 751" width="900" height="751" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="751" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes a city sustainable?</text>

<circle cx="330" cy="270" r="120" fill="#b5d3cf" fill-opacity="0.55" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="276" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><circle cx="470" cy="270" r="120" fill="#f2e7b8" fill-opacity="0.55" stroke="#1e2a44" stroke-width="2.5"/><text x="470" y="276" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><circle cx="400" cy="385" r="120" fill="#dce9e7" fill-opacity="0.55" stroke="#1e2a44" stroke-width="2.5"/><text x="400" y="391" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="290" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Environment</text><text x="512" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Economy</text><text x="400" y="450" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social fairness</text><text x="400" y="318" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">balance</text><rect x="620" y="175" width="250" height="260" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="638" y="210.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Features to look for</text><text x="638" y="237.22" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">efficient public transport</text><text x="638" y="258.34" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cycling and walking routes</text><text x="638" y="279.46" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">green space</text><text x="638" y="300.58" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">waste reduction, recycling</text><text x="638" y="321.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">energy-efficient buildings</text><text x="638" y="342.82" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">affordable housing</text><text x="638" y="363.94" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">brownfield, not greenfield</text><rect x="30" y="540" width="840" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="589.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Curitiba, Brazil (from the 1970s)</text><text x="450" y="616.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">bus rapid transit on dedicated lanes; parks on flood-prone land; recyclable waste exchanged for food</text><rect x="30" y="668" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="699.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ask who benefits, who pays and whether the gains last. One green feature is not enough.</text>
</svg>