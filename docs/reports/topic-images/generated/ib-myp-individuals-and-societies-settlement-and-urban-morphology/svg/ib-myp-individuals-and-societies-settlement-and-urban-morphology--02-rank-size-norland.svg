<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The rank-size rule and a primate city</text>

<rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="520" x2="840" y2="520" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="148" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Norland (fictional): five largest cities, millions</text><rect x="140" y="190" width="56" height="330" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="200" y="190" width="56" height="330" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="168" y="182" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3.6</text><text x="228" y="182" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">3.6</text><text x="198" y="548" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">rank 1</text><rect x="280" y="410" width="56" height="110" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="340" y="355" width="56" height="165" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="308" y="402" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1.2</text><text x="368" y="347" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">1.8</text><text x="338" y="548" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">rank 2</text><rect x="420" y="428.3333333333333" width="56" height="91.66666666666667" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="480" y="410" width="56" height="110" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="448" y="420.3333333333333" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="508" y="402" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">1.2</text><text x="478" y="548" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">rank 3</text><rect x="560" y="465" width="56" height="55" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="620" y="437.5" width="56" height="82.5" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="588" y="457" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">0.6</text><text x="648" y="429.5" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">0.9</text><text x="618" y="548" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">rank 4</text><rect x="700" y="474.1666666666667" width="56" height="45.833333333333336" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="760" y="454" width="56" height="66" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="728" y="466.1666666666667" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">0.5</text><text x="788" y="446" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">0.72</text><text x="758" y="548" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">rank 5</text><rect x="560" y="200" width="24" height="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="594" y="215" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">actual</text><rect x="560" y="232" width="24" height="18" fill="#fff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 4"/><text x="594" y="247" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">predicted = 3.6 ÷ rank</text><text x="450" y="585" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Every lower-ranked city is smaller than the rule predicts</text><rect x="30" y="630" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="662.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Primacy index P₁ ÷ P₂ = 3.6 ÷ 1.2 = 3.0 (the rule gives 2.0): a primate city.</text>
