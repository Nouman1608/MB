<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who lives where? Two models compared</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Burgess (Chicago, 1925)</text><text x="52" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">land values fall outwards (bid rent); newer, larger homes further out</text><rect x="52" y="196" width="153.2" height="92" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="128.6" y="236" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">CBD</text><rect x="211.2" y="196" width="153.2" height="92" rx="8" fill="#efcdb8" stroke="#1e2a44" stroke-width="2"/><text x="287.79999999999995" y="236" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">zone in transition</text><rect x="370.4" y="196" width="153.2" height="92" rx="8" fill="#f6e3d6" stroke="#1e2a44" stroke-width="2"/><text x="447" y="236" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">working-class</text><text x="447" y="255" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">homes</text><rect x="529.5999999999999" y="196" width="153.2" height="92" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="606.1999999999999" y="236" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">residential zone</text><rect x="688.8" y="196" width="153.2" height="92" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="765.4" y="236" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">commuter zone</text><line x1="52" y1="320" x2="842" y2="320" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="52" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">centre</text><text x="842" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">edge</text><rect x="30" y="380" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="416" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Griffin and Ford (Latin America, 1980)</text><text x="52" y="442" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">elite sector along a commercial spine; housing quality declines outwards</text><rect x="52" y="466" width="193" height="92" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="148.5" y="506" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">CBD and spine</text><rect x="251" y="466" width="193" height="92" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="347.5" y="506" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">elite residential</text><rect x="450" y="466" width="193" height="92" rx="8" fill="#f6e3d6" stroke="#1e2a44" stroke-width="2"/><text x="546.5" y="506" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">housing declining</text><text x="546.5" y="525" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">outwards</text><rect x="649" y="466" width="193" height="92" rx="8" fill="#efcdb8" stroke="#1e2a44" stroke-width="2"/><text x="745.5" y="506" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">peripheral squatter</text><text x="745.5" y="525" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">settlements</text><line x1="52" y1="590" x2="842" y2="590" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="52" y="616" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">centre</text><text x="842" y="616" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">edge</text><rect x="30" y="650" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="681.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Key contrast: in Griffin and Ford the richest live near the centre and the poorest at the</text><text x="450" y="703.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">edge.</text>
</svg>