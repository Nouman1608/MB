<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Urbanisation is not urban growth</text>

<rect x="30" y="110" width="840" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Norland (fictional), total population in millions</text><text x="115" y="215" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="end">2000</text><rect x="140" y="175" width="161.53846153846155" height="64" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="220.76923076923077" y="215" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">urban 4.2m</text><rect x="301.53846153846155" y="175" width="300" height="64" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="451.53846153846155" y="215" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">rural 7.8m</text><text x="115" y="310" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="end">2020</text><rect x="140" y="270" width="349.99999999999994" height="64" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="315" y="310" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">urban 9.1m</text><rect x="489.99999999999994" y="270" width="250" height="64" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="615" y="310" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">rural 6.5m</text><text x="220.76923076923077" y="262" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">35.0% urban</text><text x="315" y="360" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">58.3% urban</text><text x="450" y="410" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Rural population fell (7.8m → 6.5m) while the total rose: migration from rural areas is likely</text><rect x="30" y="470" width="410" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="524" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Urbanisation</text><text x="48" y="551.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rise in the PROPORTION urban</text><text x="48" y="572.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">35.0% → 58.3% = +23.3 percentage points</text><rect x="460" y="470" width="410" height="140" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="524" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Urban growth</text><text x="478" y="551.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rise in the NUMBER of urban dwellers</text><text x="478" y="572.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">4.2m → 9.1m = +116.7%</text>
</svg>