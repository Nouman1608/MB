<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Affluence and its limits</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">What drove the boom, and who it left out</text>
<rect x="30" y="124" width="155.2" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="107.6" y="165.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Wartime</text><text x="107.6" y="185.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">savings</text><rect x="201.2" y="124" width="155.2" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="278.79999999999995" y="175.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">GI Bill</text><rect x="372.4" y="124" width="155.2" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="152.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Easy credit</text><text x="450" y="179" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Diners Club</text><text x="450" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(1950)</text><rect x="543.5999999999999" y="124" width="155.2" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="621.1999999999999" y="165.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Defence</text><text x="621.1999999999999" y="185.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">spending</text><rect x="714.8" y="124" width="155.2" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="792.4" y="165.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">New</text><text x="792.4" y="185.98" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">technology</text><rect x="150" y="283" width="600" height="113" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="319.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cars, televisions, appliances; suburbs</text><text x="450" y="349.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Levittown grows with highways and federal mortgages; inner cities</text><text x="450" y="371.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">decline</text><line x1="107.6" y1="225" x2="300" y2="277" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="278.79999999999995" y1="225" x2="375" y2="277" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="225" x2="450" y2="277" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="621.1999999999999" y1="225" x2="525" y2="277" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="792.4" y1="225" x2="600" y2="277" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="418" width="840" height="138" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="450" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LEFT OUT</text><text x="50" y="481.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="481.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rural poor in the South and Appalachia</text><text x="50" y="506.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="506.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Black and Hispanic workers facing discrimination in pay and housing</text><text x="50" y="531.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="531.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unskilled workers outside unionised industries; women paid less than men</text>
</svg>