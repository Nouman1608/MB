<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Truman's surprise win, 1948</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Polls expected Dewey; the Democrats had split three ways</text>
<text x="40" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">LEFT</text><text x="860" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">RIGHT</text><defs><linearGradient id="sg124" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="169" width="780" height="26" rx="13" fill="url(#sg124)" stroke="#1e2a44" stroke-width="2.5"/><path d="M138,195 L138,218 L129.75,232 L129.75,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="138" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M372,195 L372,218 L343.25,232 L343.25,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="372" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M590.4000000000001,195 L590.4000000000001,218 L556.75,232 L556.75,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="590.4000000000001" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M777.6,195 L777.6,218 L770.25,232 L770.25,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="777.6" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="252" width="199.5" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="129.75" y="280.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Wallace</text><text x="129.75" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Progressives</text><rect x="243.5" y="252" width="199.5" height="75" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="343.25" y="280.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Truman</text><text x="343.25" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Democrat: the winner</text><rect x="457" y="252" width="199.5" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.75" y="280.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Dewey</text><text x="556.75" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Republican</text><rect x="670.5" y="252" width="199.5" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="770.25" y="280.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Thurmond</text><text x="770.25" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Dixiecrats</text><rect x="30" y="349" width="517.3170731707318" height="66" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="288.6585365853659" y="378" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Truman</text><text x="288.6585365853659" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">303 electoral votes</text><rect x="547.3170731707318" y="349" width="322.6829268292683" height="66" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="708.6585365853659" y="378" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Dewey</text><text x="708.6585365853659" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">189</text><rect x="30" y="437" width="201" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130.5" y="462.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Whistle-stop</text><text x="130.5" y="482.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">campaign</text><text x="130.5" y="509" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Against the</text><text x="130.5" y="529" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">"do-nothing" Congress</text><rect x="243" y="437" width="201" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.5" y="472.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Coalition</text><text x="343.5" y="499" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Farmers, labour, Black</text><text x="343.5" y="519" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">voters in northern cities</text><rect x="456" y="437" width="201" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.5" y="462.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Anti-communist</text><text x="556.5" y="482.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">record</text><text x="556.5" y="509" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Truman Doctrine; Berlin</text><text x="556.5" y="529" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">airlift</text><rect x="669" y="437" width="201" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="769.5" y="472.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Dewey</text><text x="769.5" y="499" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Cautious and</text><text x="769.5" y="519" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">complacent</text>
</svg>