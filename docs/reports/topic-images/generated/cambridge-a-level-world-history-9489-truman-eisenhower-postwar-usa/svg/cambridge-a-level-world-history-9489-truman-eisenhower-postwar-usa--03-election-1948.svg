<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 475" width="900" height="475" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="475" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Truman's surprise win, 1948</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Polls expected Dewey; the Democrats had split three ways</text>
<rect x="30" y="124" width="201" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130.5" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DEMOCRAT SPLIT: LEFT</text><text x="130.5" y="176.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Wallace</text><text x="130.5" y="205.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Progressives</text><rect x="243" y="124" width="201" height="100" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="343.5" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DEMOCRAT</text><text x="343.5" y="176.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Truman</text><text x="343.5" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The winner</text><rect x="456" y="124" width="201" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.5" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DEMOCRAT SPLIT: RIGHT</text><text x="556.5" y="176.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Thurmond</text><text x="556.5" y="205.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Dixiecrats</text><rect x="669" y="124" width="201" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769.5" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">REPUBLICAN</text><text x="769.5" y="176.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dewey</text><text x="769.5" y="205.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Expected to win</text><rect x="30" y="246" width="517.3170731707318" height="66" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="288.6585365853659" y="275" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Truman</text><text x="288.6585365853659" y="299" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">303 electoral votes</text><rect x="547.3170731707318" y="246" width="322.6829268292683" height="66" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="708.6585365853659" y="275" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Dewey</text><text x="708.6585365853659" y="299" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">189</text><rect x="30" y="334" width="201" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130.5" y="359.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Whistle-stop</text><text x="130.5" y="379.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">campaign</text><text x="130.5" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Against the</text><text x="130.5" y="426" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">"do-nothing" Congress</text><rect x="243" y="334" width="201" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.5" y="369.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Coalition</text><text x="343.5" y="396" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Farmers, labour, Black</text><text x="343.5" y="416" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">voters in northern cities</text><rect x="456" y="334" width="201" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.5" y="359.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Anti-communist</text><text x="556.5" y="379.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">record</text><text x="556.5" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Truman Doctrine; Berlin</text><text x="556.5" y="426" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">airlift</text><rect x="669" y="334" width="201" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="769.5" y="369.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Dewey</text><text x="769.5" y="396" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Cautious and</text><text x="769.5" y="416" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">complacent</text>
</svg>