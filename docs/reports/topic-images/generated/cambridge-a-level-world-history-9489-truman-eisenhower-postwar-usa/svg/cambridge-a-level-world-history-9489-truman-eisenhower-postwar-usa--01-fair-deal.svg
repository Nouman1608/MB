<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Fair Deal: passed and blocked</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Truman's ambition met a conservative coalition</text>
<rect x="30" y="124" width="410" height="232" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PASSED</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Extending the New Deal</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Employment Act (1946): "maximum</text><text x="65.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">employment"</text><text x="50" y="258.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Housing Act (1949): public housing, slum</text><text x="65.2" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">clearance</text><text x="50" y="305.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="305.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Minimum wage 40 to 75 cents (1949)</text><text x="50" y="331.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Social Security extended (1950)</text><rect x="460" y="124" width="410" height="232" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BLOCKED</text><text x="480" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Defeated or reversed</text><text x="480" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">National health insurance</text><text x="480" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Federal aid to education</text><text x="480" y="263.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Brannan Plan for farm incomes</text><text x="480" y="289.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="289.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Taft-Hartley (1947) passed over his veto</text><text x="450" y="394" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Who blocked it?</text><rect x="154.688" y="418" width="261.79200000000003" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="285.584" y="438.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">American Medical Association</text><rect x="426.48" y="418" width="318.832" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="585.896" y="438.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Republicans and Southern Democrats</text><rect x="201.824" y="458" width="245.344" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="324.496" y="478.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Republican Congress (1946)</text><rect x="457.168" y="458" width="241.008" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="577.672" y="478.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Cost during the Korean War</text>
</svg>