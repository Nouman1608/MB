<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Containment: same aim, new methods?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Truman and Eisenhower compared</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="312" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="157.5" height="48" fill="#b5d3cf"/><rect x="187.5" y="124" width="341.25" height="48" fill="#dce9e7"/><text x="201.5" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Truman, 1945-53</text><rect x="528.75" y="124" width="341.25" height="48" fill="#f2e7b8"/><text x="542.75" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Eisenhower, 1953-61</text><rect x="30" y="172" width="157.5" height="46" fill="#dce9e7"/><text x="44" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Aim</text><rect x="187.5" y="172" width="341.25" height="46" fill="#d4b02e"/><text x="201.5" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Containment</text><rect x="528.75" y="172" width="341.25" height="46" fill="#d4b02e"/><text x="542.75" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Containment</text><line x1="30" y1="218" x2="870" y2="218" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="218" width="157.5" height="86" fill="#dce9e7"/><text x="44" y="244" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Methods</text><rect x="187.5" y="218" width="341.25" height="86" fill="#f8faf9"/><text x="201.5" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Truman Doctrine (1947); Marshall Aid;</text><text x="201.5" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">NATO (1949); NSC-68 (1950): rearmament</text><rect x="528.75" y="218" width="341.25" height="86" fill="#f8faf9"/><text x="542.75" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">New Look: nuclear deterrence, "massive</text><text x="542.75" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">retaliation"; CIA coups in Iran (1953),</text><text x="542.75" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Guatemala (1954)</text><line x1="30" y1="304" x2="870" y2="304" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="304" width="157.5" height="66" fill="#dce9e7"/><text x="44" y="330" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Asia</text><rect x="187.5" y="304" width="341.25" height="66" fill="#ffffff"/><text x="201.5" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Korea through the UN; crossed into the</text><text x="201.5" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">North; dismissed MacArthur (1951)</text><rect x="528.75" y="304" width="341.25" height="66" fill="#ffffff"/><text x="542.75" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Refused to rescue the French at Dien Bien</text><text x="542.75" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Phu; backed Diem (domino theory)</text><line x1="30" y1="370" x2="870" y2="370" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="370" width="157.5" height="66" fill="#dce9e7"/><text x="44" y="396" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">USSR</text><rect x="187.5" y="370" width="341.25" height="66" fill="#f8faf9"/><text x="201.5" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Berlin airlift (1948-49)</text><rect x="528.75" y="370" width="341.25" height="66" fill="#f8faf9"/><text x="542.75" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"Peaceful coexistence": Geneva (1955),</text><text x="542.75" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Khrushchev's visit (1959); U-2 (1960)</text></g><line x1="187.5" y1="124" x2="187.5" y2="436" stroke="#c9d6d4" stroke-width="1.5"/><line x1="528.75" y1="124" x2="528.75" y2="436" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" wid