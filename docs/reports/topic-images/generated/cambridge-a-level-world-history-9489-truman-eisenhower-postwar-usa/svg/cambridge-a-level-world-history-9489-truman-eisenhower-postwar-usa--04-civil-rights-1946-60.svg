<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Civil rights, 1946-60: who drove change?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Campaigners and courts led; presidents followed</text>
<line x1="96" y1="168" x2="870" y2="168" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="174" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1946</text><line x1="96" y1="268" x2="870" y2="268" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="274" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1948</text><line x1="96" y1="368" x2="870" y2="368" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="374" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1950</text><line x1="96" y1="468" x2="870" y2="468" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="474" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1952</text><line x1="96" y1="568" x2="870" y2="568" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="574" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1954</text><line x1="96" y1="668" x2="870" y2="668" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="674" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1956</text><line x1="96" y1="768" x2="870" y2="768" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="774" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1958</text><line x1="96" y1="868" x2="870" y2="868" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="874" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1960</text><line x1="470" y1="168" x2="470" y2="893" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="430" y="138" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">PRESIDENTS AND CONGRESS</text><text x="510" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAMPAIGNERS AND COURTS</text><path d="M470,218 L454,218 L436,218" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="176.42399999999998" y="203.4" width="258.576" height="67" fill="#f4f6f6"/><text x="430" y="222.20000000000002" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1947</text><text x="430" y="243.20000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">To Secure These Rights; Truman</text><text x="430" y="264.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">addresses the NAACP</text><path d="M470,293 L454,293 L436,293" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="134.79200000000003" y="278.4" width="300.20799999999997" height="67" fill="#f4f6f6"/><text x="430" y="297.2" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">July 1948</text><text x="430" y="318.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Executive Order 9981: equal treatment</text><text x="430" y="339.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">in the forces</text><path d="M470,588.0000000000045 L486,588.0000000000045 L504,588.0000000000045" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="573.4000000000045" width="225.744" height="46" fill="#f4f6f6"/><text x="510" y="592.2000000000045" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">1954</text><text x="510" y="613.2000000000045" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Brown v. Board of Education</text><path d="M470,663.0000000000045 L486,663.0000000000045 L504,663.0000000000045" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="648.4000000000045" width="322.784" height="67" fill="#f4f6f6"/><text x="510" y="667.2000000000045" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1955-56</text><text x="510" y="688.2000000000045" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Montgomery Bus Boycott; King a national</text><text x="510" y="709.2000000000045" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leader</text><path d="M470,718 L486,718 L504,736.0000000000045" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="721.4000000000045" width="120.51199999999999" height="46" fill="#f4f6f6"/><text x="510" y="740.2000000000045" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1957</text><text x="510" y="761.2000000000045" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">SCLC founded</text><path d="M470,747.9999999999955 L454,747.9999999999955 L436,747.9999999999955" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="193.62399999999997" y="733.3999999999954" width="241.37600000000003" height="46" fill="#f4f6f6"/><text x="430" y="752.1999999999954" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">1957</text><text x="430" y="773.1999999999954" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Little Rock: 101st Airborne sent</text><path d="M470,763.0000000000045 L454,763.0000000000045 L436,799.9999999999955" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="165.23999999999995" y="785.3999999999954" width="269.76000000000005" height="46" fill="#f4f6f6"/><text x="430" y="804.1999999999954" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1957</text><text x="430" y="825.1999999999954" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Civil Rights Act: did little for voting</text><path d="M470,872.1666666666629 L486,872.1666666666629 L504,872.1666666666629" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="857.5666666666629" width="254.17600000000002" height="46" fill="#f4f6f6"/><text x="510" y="876.3666666666628" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">February 1960</text><text x="510" y="897.3666666666628" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Greensboro sit-in; SNCC in April</text><circle cx="470" cy="218" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="293" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="588.0000000000045" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="663.0000000000045" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="718" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="747.9999999999955" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="763.0000000000045" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="872.1666666666629" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="931.5666666666629" width="840" height="111.00000000000011" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="966.3866666666629" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Executive, not legislative</text><text x="50" y="996.1666666666629" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Southern Democrats blocked Truman's bills; Eisenhower acted at Little Rock but disliked forcing</text><text x="50" y="1018.1666666666629" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">integration.</text>
