<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which type of commerce?</text>

<text x="250" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">What does the evidence say?</text><text x="700" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Use this term</text><rect x="30" y="145" width="440" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="199" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">At a physical location?</text><line x1="478" y1="192" x2="528" y2="192" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="538" y="145" width="332" height="94" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="704" y="185" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Traditional commerce</text><text x="704" y="213" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. shoes from a market stall</text><rect x="30" y="255" width="440" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="295" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Bought through social media posts or</text><text x="52" y="319" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">messages?</text><line x1="478" y1="302" x2="528" y2="302" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="538" y="255" width="332" height="94" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="704" y="295" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Scommerce</text><text x="704" y="323" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. cake orders via a social media page</text><rect x="30" y="365" width="440" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="405" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Through a mobile device, e.g. the store’s</text><text x="52" y="429" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">own app?</text><line x1="478" y1="412" x2="528" y2="412" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="538" y="365" width="332" height="94" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="704" y="405" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Mcommerce</text><text x="704" y="433" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. cinema ticket in a smartphone app</text><rect x="30" y="475" width="440" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="529" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Only “placed online”?</text><line x1="478" y1="522" x2="528" y2="522" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="538" y="475" width="332" height="94" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="704" y="515" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ecommerce</text><text x="704" y="543" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. laptop from a retailer’s website</text><rect x="30" y="595" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="637" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Mcommerce and scommerce are forms of ecommerce: choose the most specific term.</text>
</svg>