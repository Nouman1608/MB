<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Logistics: three elements</text>

<rect x="30" y="110" width="270" height="180" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="146" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="152.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="153" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Transport</text><text x="50" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Moves goods between stages</text><text x="50" y="217" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by road, rail, sea, air or</text><text x="50" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pipeline</text><rect x="315" y="110" width="270" height="180" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="347" cy="146" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="347" y="152.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="375" y="153" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Freight forwarders</text><text x="335" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Organise the movement of</text><text x="335" y="217" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">goods for a business,</text><text x="335" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">especially across borders</text><rect x="600" y="110" width="270" height="180" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="632" cy="146" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="632" y="152.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="660" y="153" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Warehousing</text><text x="620" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stores goods safely; often</text><text x="620" y="217" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sorts, packs and dispatches</text><text x="620" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">them</text><rect x="30" y="310" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="346" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What a freight forwarder does for an exporter</text><rect x="54" y="370" width="186" height="66" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="147" y="398.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Books space with</text><text x="147" y="419.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">carriers</text><rect x="254" y="370" width="186" height="66" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="347" y="408.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Combines small loads</text><rect x="454" y="370" width="186" height="66" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="547" y="398.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Prepares shipping</text><text x="547" y="419.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">documents</text><rect x="654" y="370" width="186" height="66" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="747" y="398.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Arranges customs</text><text x="747" y="419.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">clearance</text><text x="450" y="470" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">It arranges carriage and documents, often using other firms’ vehicles, ships and</text><text x="450" y="491" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">aircraft: it is not just a transport company.</text><rect x="30" y="550" width="840" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="592" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Logistics is the joined-up management of these, not a seventh aid to trade.</text>
</svg>