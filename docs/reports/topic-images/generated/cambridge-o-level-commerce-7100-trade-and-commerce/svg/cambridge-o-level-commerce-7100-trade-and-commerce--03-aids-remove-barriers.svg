<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Each aid to trade removes a barrier</text>

<rect x="30" y="280" width="130" height="90" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="331.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Producer</text><rect x="740" y="280" width="130" height="90" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="805" y="331.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumer</text><text x="450" y="128" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Barrier</text><text x="450" y="148" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">removed by the aid to trade</text><rect x="180" y="162" width="540" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="190" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Buyer and seller cannot make contact</text><text x="200" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. retailer emails an order to a supplier</text><rect x="555" y="172" width="152" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="631" y="200.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Communications</text><rect x="180" y="238" width="540" height="66" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="266" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Made in one place, wanted in another</text><text x="200" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. lorry carries cement to building sites</text><rect x="555" y="248" width="152" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="631" y="276.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Transport</text><rect x="180" y="314" width="540" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="342" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Produced at one time, wanted at another</text><text x="200" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. rice released through the year</text><rect x="555" y="324" width="152" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="631" y="352.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Warehousing</text><rect x="180" y="390" width="540" height="66" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="418" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Customers do not know it exists</text><text x="200" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. new juice brand’s social media adverts</text><rect x="555" y="400" width="152" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="631" y="428.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Advertising</text><rect x="180" y="466" width="540" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="494" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">No safe way to pay, or no finance</text><text x="200" y="518" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. loan pays for new stock</text><rect x="555" y="476" width="152" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="631" y="504.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Banking</text><rect x="180" y="542" width="540" height="66" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="570" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Fear of loss from fire, theft or accident</text><text x="200" y="594" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. shop insures its stock</text><rect x="555" y="552" width="152" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="631" y="580.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Insurance</text><line x1="164" y1="325" x2="176" y2="325" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="724" y1="325" x2="736" y2="325" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>