<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exports and imports: follow the money</text>

<rect x="30" y="110" width="360" height="250" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="10 7"/><text x="50" y="142" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Pakistan</text><rect x="80" y="190" width="260" height="64" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="216.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Textile firm</text><text x="210" y="238.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">sells towels</text><rect x="510" y="110" width="360" height="250" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="10 7"/><text x="530" y="142" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Germany</text><rect x="560" y="190" width="260" height="64" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="690" y="216.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Buyer</text><text x="690" y="238.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">pays for towels</text><line x1="346" y1="206" x2="554" y2="206" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="196" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">towels</text><line x1="554" y1="240" x2="346" y2="240" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="266" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">money</text><rect x="80" y="290" width="260" height="46" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="318.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">EXPORT for Pakistan</text><rect x="560" y="290" width="260" height="46" rx="14" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="690" y="318.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">IMPORT for Germany</text><rect x="30" y="385" width="840" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="420" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rule of thumb</text><text x="54" y="452" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Export: money flows INTO the exporting country (it earns foreign currency).</text><text x="54" y="480" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Import: money flows OUT of the importing country.</text><text x="54" y="516" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Services count too: a foreign tourist paying for a hotel stay is buying</text><text x="54" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an exported service, even though nothing is shipped.</text>
</svg>