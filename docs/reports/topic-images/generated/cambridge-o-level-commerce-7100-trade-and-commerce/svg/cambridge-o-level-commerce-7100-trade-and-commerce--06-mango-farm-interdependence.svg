<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A mango farm: production, trade and commerce</text>

<rect x="30" y="110" width="220" height="100" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="167" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Production</text><rect x="270" y="110" width="520" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="166" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The farm grows mangoes (primary production)</text><rect x="805" y="140" width="65" height="40" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="837.5" y="165.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(1)</text><line x1="140" y1="212" x2="140" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="230" width="220" height="100" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="287" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Trade</text><rect x="270" y="230" width="520" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="272" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It cannot use thousands of mangoes, so sells to a</text><text x="290" y="294" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wholesaler, then retailers and consumers</text><rect x="805" y="260" width="65" height="40" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="837.5" y="285.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(1)</text><line x1="140" y1="332" x2="140" y2="346" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="350" width="220" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="407" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Aids to trade</text><rect x="270" y="350" width="520" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="392" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Refrigerated transport before the fruit spoils;</text><text x="290" y="414" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">insurance against loss in transit</text><rect x="805" y="380" width="65" height="40" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="837.5" y="405.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(1)</text><line x1="140" y1="452" x2="140" y2="466" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="470" width="220" height="100" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="527" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Back to production</text><rect x="270" y="470" width="520" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="512" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Wholesalers and retailers depend on the farm: if the</text><text x="290" y="534" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">harvest fails, trade and services fall too</text><rect x="805" y="500" width="65" height="40" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="837.5" y="525.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(1)</text><path d="M30,470 C0,470 0,160 26,160" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" stroke-dasharray="7 5"/>
</svg>