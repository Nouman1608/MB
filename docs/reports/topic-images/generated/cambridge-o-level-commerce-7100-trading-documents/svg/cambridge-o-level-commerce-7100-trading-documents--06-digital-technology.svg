<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Digital technology in trading documents</text>

<rect x="30" y="110" width="220" height="80" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="155.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Digital signatures</text><rect x="262" y="110" width="608" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="282" y="142" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Confirm who approved a document and that it is unaltered</text><circle cx="294" cy="166" r="10" fill="#2e6b62"/><path d="M289.5,166.2 L293,169.8 L299,162.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="312" y="172" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Sign at a distance, immediately</text><rect x="30" y="202" width="220" height="80" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="247.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Secure access</text><rect x="262" y="202" width="608" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="282" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Passwords, two-step verification, encryption</text><circle cx="294" cy="258" r="10" fill="#2e6b62"/><path d="M289.5,258.2 L293,261.8 L299,254.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="312" y="264" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Protects prices, customer and payment data</text><rect x="30" y="294" width="220" height="80" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="339.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cloud-based storage</text><rect x="262" y="294" width="608" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="282" y="326" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Documents on remote servers</text><circle cx="294" cy="350" r="10" fill="#2e6b62"/><path d="M289.5,350.2 L293,353.8 L299,346.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="312" y="356" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Access anywhere; backed up; no filing cabinets</text><rect x="30" y="386" width="220" height="80" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="431.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Electronic receipts</text><rect x="262" y="386" width="608" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="282" y="418" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sent by email or app</text><circle cx="294" cy="442" r="10" fill="#2e6b62"/><path d="M289.5,442.2 L293,445.8 L299,438.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="312" y="448" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">No paper; harder to lose</text><rect x="30" y="478" width="220" height="80" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="523.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Etickets</text><rect x="262" y="478" width="608" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="282" y="510" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Held on a phone or printed from an email</text><circle cx="294" cy="534" r="10" fill="#2e6b62"/><path d="M289.5,534.2 L293,537.8 L299,530.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="312" y="540" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Instant; cannot be lost in the post</text><rect x="30" y="580" width="840" height="100" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="612" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Drawbacks to weigh</text><text x="54" y="640" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hacking and data theft · dependence on internet access and power</text><text x="54" y="664" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cost of secure systems and staff training · difficulty for customers without smartphones</text>
</svg>