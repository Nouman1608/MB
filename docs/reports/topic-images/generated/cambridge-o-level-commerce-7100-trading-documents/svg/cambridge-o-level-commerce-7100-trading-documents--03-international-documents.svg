<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four documents of international trade</text>

<rect x="30" y="110" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="410" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Certificate of origin</text><text x="50" y="190" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Issued by</text><text x="50" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An authorised body in the exporting country</text><text x="50" y="256" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Purpose</text><text x="50" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">States where the goods were made, so</text><text x="50" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">customs apply the correct duties and trade</text><text x="50" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">agreement terms</text><rect x="460" y="110" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="143" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Bill of lading</text><rect x="665" y="119" width="190" height="32" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="760" y="140.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Document of title: YES</text><text x="480" y="190" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Issued by</text><text x="480" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The shipping company</text><text x="480" y="256" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Purpose</text><text x="480" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sea freight: receipt, evidence of contract</text><text x="480" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of carriage; holder claims the goods at</text><text x="480" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">port</text><rect x="30" y="375" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="375" width="410" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="408" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Air waybill</text><rect x="235" y="384" width="190" height="32" rx="14" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="330" y="405.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Document of title: NO</text><text x="50" y="455" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Issued by</text><text x="50" y="479" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The airline or its agent</text><text x="50" y="521" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Purpose</text><text x="50" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Air freight: receipt and evidence of</text><text x="50" y="566" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contract of carriage; goods go to the named</text><text x="50" y="587" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consignee</text><rect x="460" y="375" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="375" width="410" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="408" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Documentary credit</text><text x="480" y="455" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Issued by</text><text x="480" y="479" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The importer’s bank</text><text x="480" y="521" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Purpose</text><text x="480" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Promise to pay the exporter once the agreed</text><text x="480" y="566" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">documents, such as the bill of lading, are</text><text x="480" y="587" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">presented</text>
</svg>