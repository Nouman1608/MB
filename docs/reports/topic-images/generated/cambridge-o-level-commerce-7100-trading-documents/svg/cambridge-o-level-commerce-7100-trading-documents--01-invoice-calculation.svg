<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The invoice: two kinds of discount</text>

<rect x="30" y="110" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Invoice: Delta Garments to Lakeview Fashions</text><text x="54" y="184" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Line</text><text x="420" y="184" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Working</text><text x="846" y="184" font-size="15" font-weight="700" fill="#4a5568" text-anchor="end">Amount</text><line x1="54" y1="194" x2="846" y2="194" stroke="#c9d6d4" stroke-width="1.5"/><text x="54" y="222" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">40 shirts at $15</text><text x="420" y="222" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">40 × 15</text><text x="846" y="222" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">$600</text><line x1="54" y1="238" x2="846" y2="238" stroke="#c9d6d4" stroke-width="1.5"/><text x="54" y="266" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Less trade discount 20%</text><text x="420" y="266" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">20% × 600</text><text x="846" y="266" font-size="18" font-weight="600" fill="#b5602e" text-anchor="end">− $120</text><rect x="46" y="290" width="808" height="46" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="66" y="320" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Amount due</text><text x="420" y="320" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">600 − 120</text><text x="838" y="320" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="end">$480</text><text x="54" y="372" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Terms: 5% cash discount if paid within 14 days</text><text x="450" y="440" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Does Lakeview pay within 14 days?</text><path d="M330,452 C300,470 240,470 235,488" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M570,452 C600,470 660,470 665,488" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="495" width="410" height="140" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="530" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Yes</text><text x="235" y="562" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">5% × 480 = $24</text><text x="235" y="600" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Pays 480 − 24 = $456</text><rect x="460" y="495" width="410" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="530" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">No</text><text x="665" y="562" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">No cash discount</text><text x="665" y="600" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Pays $480</text><text x="450" y="668" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Trade discount is always on the invoice; cash discount only rewards prompt payment.</text>
</svg>