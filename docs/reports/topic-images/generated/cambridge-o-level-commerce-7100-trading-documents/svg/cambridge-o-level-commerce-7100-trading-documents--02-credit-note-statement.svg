<rect width="900" height="765" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Credit note and statement of account</text>

<rect x="30" y="110" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Credit note for 4 damaged shirts</text><text x="54" y="182" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">4 × $15 = $60, less 20% trade discount ($12)</text><rect x="640" y="150" width="210" height="54" rx="14" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="745" y="184.35" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">= $48</text><text x="54" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">valued at the price Lakeview was actually charged</text><text x="450" y="268" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Statement of account: the running balance</text><rect x="50" y="516" width="120" height="84" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="504" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$200</text><text x="110" y="626" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Balance brought</text><text x="110" y="646" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">forward</text><rect x="218" y="314.40000000000003" width="120" height="201.6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="278" y="302.40000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">+ $480</text><line x1="170" y1="516" x2="218" y2="516" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 5"/><text x="278" y="626" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Add invoice</text><rect x="386" y="314.40000000000003" width="120" height="20.16" fill="#f3d9c8" stroke="#1e2a44" stroke-width="2.5"/><text x="446" y="302.40000000000003" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">− $48</text><line x1="338" y1="314.40000000000003" x2="386" y2="314.40000000000003" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 5"/><text x="446" y="626" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Less credit note</text><rect x="554" y="334.56" width="120" height="84" fill="#f3d9c8" stroke="#1e2a44" stroke-width="2.5"/><text x="614" y="322.56" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">− $200</text><line x1="506" y1="334.56" x2="554" y2="334.56" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 5"/><text x="614" y="626" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Less payment</text><text x="614" y="646" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">received</text><line x1="50" y1="600" x2="870" y2="600" stroke="#1e2a44" stroke-width="2.5"/><line x1="674" y1="418.56" x2="722" y2="418.56" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 5"/><rect x="722" y="418.56" width="120" height="181.44" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="782" y="406.56" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$432</text><text x="782" y="626" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Balance due</text><rect x="30" y="665" width="840" height="75" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="698" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Balance due: 200 + 480 − 48 − 200 = $432</text><text x="450" y="725" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Invoices increase the amount owed; credit notes and payments reduce it.</text>
