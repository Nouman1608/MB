nd" /><rect x="197.664" y="150" width="84.672" height="64" fill="#f4f6f6"/><text x="240" y="165" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Jan 1935</text><text x="240" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Saar</text><text x="240" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">plebiscite</text><path d="M380.0000000000091,264 L380.0000000000091,248 L380.0000000000091,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="336.7360000000091" y="170" width="86.528" height="44" fill="#f4f6f6"/><text x="380.0000000000091" y="185" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Mar 1936</text><text x="380.0000000000091" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Rhineland</text><path d="M620.0000000000091,264 L620.0000000000091,248 L620.0000000000091,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="575.1200000000091" y="170" width="89.76" height="44" fill="#f4f6f6"/><text x="620.0000000000091" y="185" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Mar 1938</text><text x="620.0000000000091" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Anschluss</text><path d="M740.0000000000091,264 L740.0000000000091,248 L725.168,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="682.912" y="150" width="84.512" height="64" fill="#f4f6f6"/><text x="725.168" y="165" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Mar 1939</text><text x="725.168" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Czech</text><text x="725.168" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">lands</text><path d="M800.0000000000091,264 L800.0000000000091,248 L822.712,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="775.424" y="150" width="94.576" height="64" fill="#f4f6f6"/><text x="822.712" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">1 Sep 1939</text><text x="822.712" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Poland</text><text x="822.712" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">invaded</text><path d="M260.0000000000091,264 L260.0000000000091,280 L260.0000000000091,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="206.1600000000091" y="314" width="107.68" height="44" fill="#f4f6f6"/><text x="260.0000000000091" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Mar 1935</text><text x="260.0000000000091" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Rearmament</text><path d="M689.1803278688622,264 L689.1803278688622,280 L689.1803278688622,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="647.2203278688621" y="314" width="83.92" height="44" fill="#f4f6f6"/><text x="689.1803278688622" y="329" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Sep 1938</text><text x="689.1803278688622" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Munich</text><path d="M797.2131147540858,264 L797.2131147540858,280 L797.2131147540858,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="742.1971147540859" y="314" width="110.032" height="64" fill="#f4f6f6"/><text x="797.2131147540858" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">23 Aug 1939</text><text x="797.2131147540858" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Nazi-Soviet</text><text x="797.2131147540858" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Pact</text><circle cx="90" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="240" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="260.0000000000091" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="380.0000000000091" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="620.0000000000091" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="689.1803278688622" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="740.0000000000091" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="797.2131147540858" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="800.0000000000091" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><clipPath id="tc404"><rect x="30" y="404" width="840" height="252" rx="14"/></clipPath><g clip-path="url(#tc404)"><rect x="30" y="404" width="217.77777777777777" height="48" fill="#b5d3cf"/><text x="44" y="431.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Phase</text><rect x="247.77777777777777" y="404" width="622.2222222222222" height="48" fill="#b5d3cf"/><text x="261.77777777777777" y="431.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How Britain and France responded</text><rect x="30" y="452" width="217.77777777777777" height="68" fill="#dce9e7"/><text x="44" y="478.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1933-35</text><rect x="247.77777777777777" y="452" width="622.2222222222222" height="68" fill="#ffffff"/><text x="261.77777777777777" y="478.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protest at most: Stresa Front (April 1935), then the Anglo-German Naval</text><text x="261.77777777777777" y="499.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Agreement (June 1935) undermined it</text><line x1="30" y1="520" x2="870" y2="520" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="520" width="217.77777777777777" height="68" fill="#dce9e7"/><text x="44" y="546.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1936-38</text><rect x="247.77777777777777" y="520" width="622.2222222222222" height="68" fill="#f8faf9"/><text x="261.77777777777777" y="546.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protest but no action over the Rhineland; Anschluss accepted; Munich gave</text><text x="261.77777777777777" y="567.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Sudetenland</text><line x1="30" y1="588" x2="870" y2="588" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="588" width="217.77777777777777" height="68" fill="#dce9e7"/><text x="44" y="614.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1939</text><rect x="247.77777777777777" y="588" width="622.2222222222222" height="68" fill="#ffffff"/><text x="261.77777777777777" y="614.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prague ends appeasement: Poland guaranteed (31 March); war declared on 3</text><text x="261.77777777777777" y="635.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">September</text></g><line x1="247.77777777777777" y1="404" x2="247.77777777777777" y2="656" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="404" width="840" height="252" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
