<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 549" width="900" height="549" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="549" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Nazi-Soviet Pact, 23 August 1939</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Why both dictators signed</text>
<rect x="30" y="124" width="411" height="154" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOR HITLER</text><text x="50" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">No two-front war</text><text x="50" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Could invade Poland without fighting Britain,</text><text x="50" y="243.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">France and the USSR at once</text><rect x="459" y="124" width="411" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOR STALIN</text><text x="479" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Time and territory</text><text x="479" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Distrusted Britain and France after Munich; their</text><text x="479" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">August 1939 mission lacked urgency and</text><text x="479" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">authority</text><rect x="150" y="300" width="600" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="332" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SECRET PROTOCOL</text><text x="450" y="358.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Poland and Eastern Europe divided into spheres</text><rect x="30" y="406" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="440.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How important?</text><text x="50" y="470.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The final step that made an attack on Poland possible, but a <tspan font-weight="700" fill="#1e2a44">response</tspan> to earlier events, not their</text><text x="50" y="492.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cause.</text>
</svg>