<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 477" width="900" height="477" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="477" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Was appeasement the main reason?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Agree, disagree, then judge</text>
<rect x="130" y="124" width="740" height="99" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="145" y="153.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Agree</text><text x="145" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No action over the Rhineland (1936); the Sudetenland given at Munich: Hitler concluded they</text><text x="145" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">would not fight for Poland</text><circle cx="62" cy="173.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="182.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="736.665" y="136" width="118.335" height="29" rx="14.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="795.8325" y="155.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">stated factor</text><rect x="130" y="235" width="740" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="264.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Disagree</text><text x="145" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Appeasement responded to Hitler's demands; his aims required eastward expansion; the</text><text x="145" y="314.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nazi-Soviet Pact gave him security</text><circle cx="62" cy="284.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="293.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="739.215" y="247" width="115.785" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="797.1075000000001" y="266.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Hitler's aims</text><rect x="130" y="346" width="740" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="375.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="145" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Appeasement made war more likely, but war came because Hitler chose aims that could not</text><text x="145" y="425.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">be achieved peacefully</text><circle cx="62" cy="395.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="404.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="752.25" y="358" width="102.75" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="803.625" y="377.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">judgement</text>
</svg>