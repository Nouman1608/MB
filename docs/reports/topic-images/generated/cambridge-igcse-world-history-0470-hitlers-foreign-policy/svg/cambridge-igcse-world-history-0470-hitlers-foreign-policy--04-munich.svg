<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="424" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Munich, September 1938</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Czechoslovakia was not invited</text>
<rect x="30" y="124" width="187.5" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="173.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sudetenland</text><text x="44" y="200.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">About three million</text><text x="44" y="220.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">German speakers;</text><text x="44" y="240.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Henlein stirs unrest</text><line x1="223.5" y1="202.5" x2="241.5" y2="202.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247.5" y="124" width="187.5" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="261.5" y="160" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEPTEMBER 1938</text><text x="261.5" y="185.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Berchtesgaden,</text><text x="261.5" y="206.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Bad Godesberg</text><text x="261.5" y="233" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Chamberlain flies to</text><text x="261.5" y="253" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hitler twice</text><line x1="441" y1="202.5" x2="459" y2="202.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="124" width="187.5" height="157" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="479" y="150.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">29-30 SEPTEMBER</text><text x="479" y="175.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Munich Agreement</text><text x="479" y="202.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Britain, France,</text><text x="479" y="222.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Germany, Italy:</text><text x="479" y="242.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sudetenland to</text><text x="479" y="262.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Germany</text><line x1="658.5" y1="202.5" x2="676.5" y2="202.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="682.5" y="124" width="187.5" height="157" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="696.5" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARCH 1939</text><text x="696.5" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rest of the Czech</text><text x="696.5" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">lands</text><text x="696.5" y="223" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">No German majority:</text><text x="696.5" y="243" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">appeasement</text><text x="696.5" y="263" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">collapses</text><rect x="30" y="303" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="337.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">"Peace for our time"</text><text x="450" y="367.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">In March 1939 Prague showed Hitler's aims were not limited to German speakers.</text>
</svg>