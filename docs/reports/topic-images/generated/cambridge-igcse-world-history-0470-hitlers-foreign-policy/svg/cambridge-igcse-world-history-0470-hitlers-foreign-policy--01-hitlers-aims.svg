<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 528" width="900" height="528" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="528" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hitler's four aims</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Set out in Mein Kampf, written in the mid-1920s</text>
<rect x="30" y="124" width="412" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AIM 1</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Overturn Versailles</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Regarded as unjust by most Germans</text><rect x="458" y="124" width="412" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AIM 2</text><text x="478" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unite German speakers</text><text x="478" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Austria, the Sudetenland, Poland</text><rect x="30" y="252" width="412" height="133" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="284" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AIM 3</text><text x="50" y="310.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lebensraum</text><text x="50" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"Living space" in Eastern Europe for settlement</text><text x="50" y="360.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and resources</text><rect x="458" y="252" width="412" height="133" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="294.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AIM 4</text><text x="478" y="321.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Destroy communism</text><text x="478" y="350.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Linked with his racial hatred of Jews and Slavs</text><rect x="30" y="407" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="441.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Plan or opportunism?</text><text x="450" y="471.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A strong answer can argue his <tspan font-weight="700" fill="#1e2a44">aims</tspan> were consistent while his <tspan font-weight="700" fill="#1e2a44">timing</tspan> was opportunistic.</text>
</svg>