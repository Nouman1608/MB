<rect width="900" height="598" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the Essay fits in 9239</text>

<rect x="30" y="110" width="620" height="330" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="340" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">AS Level: all three compulsory</text><rect x="55" y="170" width="180" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="145" y="239.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Component 1</text><text x="145" y="266.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Written Exam</text><rect x="250" y="170" width="180" height="150" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="340" y="218.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Component 2</text><text x="340" y="245.17000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Essay</text><text x="340" y="266.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">40 marks,</text><text x="340" y="287.41" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">externally marked</text><rect x="445" y="170" width="180" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="535" y="239.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Component 3</text><text x="535" y="266.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Team Project</text><text x="340" y="370" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">the Essay: independent research and argument</text><text x="340" y="392" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">on a self-chosen global issue</text><rect x="670" y="110" width="200" height="330" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="770" y="190.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Component 4</text><text x="770" y="216.35000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Cambridge Research</text><text x="770" y="236.15000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Report (up to 5000</text><text x="770" y="255.95000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">words)</text><text x="770" y="275.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle"></text><text x="770" y="295.55" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">75 + 10 for the</text><text x="770" y="315.35" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">research log = 85</text><text x="770" y="335.15000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">marks</text><text x="770" y="354.95000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle"></text><text x="770" y="374.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">half the full A Level</text><text x="770" y="470" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">full A Level only</text><rect x="30" y="495" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="525.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Built around the “Critical Path” of research, reasoning and communication skills, not a numbered</text><text x="450" y="546.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">content list.</text>
</svg>