<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" width="900" height="586" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="586" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Turning a topic into an essay question</text>

<rect x="30" y="115" width="840" height="90" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="450" y="154.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">✗ “Plastic pollution is a global problem.”</text><text x="450" y="181.17000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a claim, not a question; opens no contrasting perspectives</text><line x1="450" y1="209" x2="450" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="250" width="840" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="287.1" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">✓ “Should developing economies bear the same responsibility as developed economies</text><text x="450" y="310.86" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">for reducing single-use plastic?”</text><text x="450" y="337.98" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a single question that structurally needs contrasting perspectives</text><line x1="330" y1="364" x2="235" y2="402" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="364" x2="665" y2="402" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="406" width="410" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="442.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Perspective 1</text><text x="48" y="469.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">historical responsibility and differences in</text><text x="48" y="490.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">manufacturing capacity between developed and</text><text x="48" y="511.41" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">developing economies</text><rect x="460" y="406" width="410" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="478" y="442.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Perspective 2</text><text x="478" y="469.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">present-day consumption volumes and the</text><text x="478" y="490.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">urgency of environmental harm, whatever a</text><text x="478" y="511.41" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">country’s development status</text>
</svg>