<rect x="30" y="110" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="88" cy="168.3" r="32" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="88" y="174.70000000000002" font-size="18.56" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><text x="144" y="149.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Question, perspectives and sources</text><text x="144" y="175.57" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">analyse the question; synthesise arguments into contrasting perspectives; select</text><text x="144" y="198.01" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and justify sources; compare and evaluate perspectives</text><rect x="30" y="240.6" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="88" cy="298.9" r="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="88" y="305.29999999999995" font-size="18.56" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><text x="144" y="280.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Reflection</text><text x="144" y="306.17" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reflect on how alternative perspectives affect your own view; suggest further</text><text x="144" y="328.61" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">relevant research</text><rect x="30" y="371.2" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="88" cy="426.2" r="32" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="88" y="432.59999999999997" font-size="18.56" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><text x="144" y="418.97" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Communication</text><text x="144" y="444.69000000000005" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a clear, structured essay with effective referencing</text>
