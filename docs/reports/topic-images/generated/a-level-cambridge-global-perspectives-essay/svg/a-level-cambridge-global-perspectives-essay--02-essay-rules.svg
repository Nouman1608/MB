<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Essay requirements at a glance</text>

<rect x="30" y="115" width="410" height="135" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">1750–2000 words</text><text x="48" y="178.46" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">continuous prose; state an accurate word count</text><text x="48" y="198.92000000000002" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">(excluding title, references, citations); beyond</text><text x="48" y="219.38" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">2000 is not marked</text><rect x="460" y="115" width="410" height="135" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A single question</text><text x="478" y="178.46" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">not a statement or a generic topic area</text><rect x="30" y="265" width="410" height="135" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Global perspectives</text><text x="48" y="328.46" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">must allow globally contrasting perspectives; an</text><text x="48" y="348.91999999999996" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">exclusively local or national issue is unlikely</text><text x="48" y="369.38" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">to work</text><rect x="460" y="265" width="410" height="135" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sources chosen and justified</text><text x="478" y="328.46" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">a range of sources, with reasons for choosing</text><text x="478" y="348.91999999999996" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">them</text><rect x="30" y="415" width="410" height="135" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="452" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Personal conclusion</text><text x="48" y="478.46" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">a supported view of your own on the question</text><rect x="460" y="415" width="410" height="135" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="452" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Referencing</text><text x="478" y="478.46" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">quotations fully referenced; list of sources;</text><text x="478" y="498.91999999999996" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">accuracy assessed in AO3</text>
</svg>