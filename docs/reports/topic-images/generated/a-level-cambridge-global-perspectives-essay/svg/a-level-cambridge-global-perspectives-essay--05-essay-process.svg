<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 759" width="900" height="759" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="759" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From question to conclusion</text>

<rect x="130" y="115" width="640" height="104" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="151.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1 Build the question</text><text x="450" y="177.51000000000002" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">a genuine question, at least two globally contrasting perspectives,</text><text x="450" y="197.97000000000003" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">interesting to you</text><line x1="450" y1="223" x2="450" y2="247" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="253" width="640" height="104" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="289.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2 Research with a source log</text><text x="450" y="315.51" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">note why each source was chosen: authority, standpoint, perspective it</text><text x="450" y="335.96999999999997" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">represents</text><line x1="450" y1="361" x2="450" y2="385" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="391" width="640" height="104" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="427.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3 Develop two or three perspectives</text><text x="450" y="453.51" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">genuinely different standpoints (country, economic interest, culture or</text><text x="450" y="473.96999999999997" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">religion), with real evidence</text><line x1="450" y1="499" x2="450" y2="523" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="529" width="640" height="83" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="565.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">4 Compare and evaluate</text><text x="450" y="591.51" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">weigh the perspectives against each other, not just describe them</text><line x1="450" y1="616" x2="450" y2="640" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="646" width="640" height="83" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="682.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">5 Personal, supported conclusion</text><text x="450" y="708.51" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">your own reasoned judgement, not a summary</text>
</svg>