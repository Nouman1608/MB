<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" width="900" height="375" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="375" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What your teacher can and cannot do</text>

<rect x="30" y="115" width="410" height="230" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="152.95" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Teachers may</text><text x="48" y="181.39" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• lead whole-class background research into</text><text x="48" y="203.82999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a general issue</text><text x="48" y="226.26999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• support planning</text><text x="48" y="248.70999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• support source citation</text><text x="48" y="271.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• support word-count discipline</text><rect x="460" y="115" width="410" height="230" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="478" y="152.95" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">✗ Teachers must not</text><text x="478" y="181.39" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• devise your question: you do that</text><text x="478" y="203.82999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">individually</text><text x="478" y="226.26999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• give detailed advice on how a specific</text><text x="478" y="248.70999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">draft could be improved to meet the mark</text><text x="478" y="271.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">scheme</text><text x="478" y="293.59" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• correct or edit draft coursework directly</text>
</svg>