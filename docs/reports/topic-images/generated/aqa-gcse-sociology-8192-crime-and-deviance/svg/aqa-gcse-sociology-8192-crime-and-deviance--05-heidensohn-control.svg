<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 671" width="900" height="671" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="671" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Heidensohn: why women commit less crime</text>

<rect x="30" y="108" width="840" height="74" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Patriarchal societies control women more effectively than men</text><text x="450" y="166" font-size="17" font-weight="400" fill="#dce9e7" text-anchor="middle">so women commit less crime (control theory)</text><line x1="170" y1="186" x2="170" y2="220" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="186" x2="450" y2="220" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="730" y1="186" x2="730" y2="220" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="226" width="269.3333333333333" height="284" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,276 L31.25,240.25 Q31.25,227.25 44.25,227.25 L285.0833333333333,227.25 Q298.0833333333333,227.25 298.0833333333333,240.25 L298.0833333333333,276 Z" fill="#b5d3cf"/><line x1="31.25" y1="276" x2="298.0833333333333" y2="276" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="256.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">At home</text><circle cx="49" cy="302.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="308.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Expected to do most</text><text x="62" y="330.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">housework and childcare</text><circle cx="49" cy="354.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="360.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Challenging this risks</text><text x="62" y="382.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">male violence</text><circle cx="49" cy="406.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="412.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Men’s financial power as</text><text x="62" y="434.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">breadwinners</text><circle cx="49" cy="458.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="464.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Daughters supervised more</text><text x="62" y="486.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">closely than sons</text><rect x="315.3333333333333" y="226" width="269.3333333333333" height="284" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,276 L316.5833333333333,240.25 Q316.5833333333333,227.25 329.5833333333333,227.25 L570.4166666666666,227.25 Q583.4166666666666,227.25 583.4166666666666,240.25 L583.4166666666666,276 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="276" x2="583.4166666666666" y2="276" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="256.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">In public</text><circle cx="334.3333333333333" cy="302.53999999999996" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="308.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fear of male sexual</text><text x="347.3333333333333" y="330.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">violence</text><circle cx="334.3333333333333" cy="354.53999999999996" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="360.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fear of losing reputation</text><text x="347.3333333333333" y="382.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">keeps women out of public</text><text x="347.3333333333333" y="404.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">spaces at night</text><circle cx="334.3333333333333" cy="428.53999999999996" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="434.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The idea of “separate</text><text x="347.3333333333333" y="456.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">spheres”</text><rect x="600.6666666666666" y="226" width="269.3333333333333" height="284" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,276 L601.9166666666666,240.25 Q601.9166666666666,227.25 614.9166666666666,227.25 L855.75,227.25 Q868.75,227.25 868.75,240.25 L868.75,276 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="276" x2="868.75" y2="276" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="256.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">At work</text><circle cx="619.6666666666666" cy="302.53999999999996" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="308.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Male-dominated hierarchies</text><circle cx="619.6666666666666" cy="332.53999999999996" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="338.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sexual harassment</text><rect x="30" y="528" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="564" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criticisms</text><circle cx="61" cy="587.39" r="4.5" fill="#8a6d0d"/><text x="74" y="593" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Generalises about all women</text><circle cx="61" cy="617.39" r="4.5" fill="#8a6d0d"/><text x="74" y="623" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Claims not always backed by strong research evidence</text>
</svg>