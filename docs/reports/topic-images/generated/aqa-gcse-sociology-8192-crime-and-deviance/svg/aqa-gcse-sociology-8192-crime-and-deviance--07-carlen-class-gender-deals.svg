<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 735" width="900" height="735" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Carlen: the class deal and the gender deal</text>

<rect x="30" y="108" width="840" height="60" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="144" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Unstructured interviews with <tspan font-weight="700">39</tspan> mostly working-class women, aged 15 to 46, convicted of crimes</text><rect x="30" y="192" width="404" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,243 L31.25,206.25 Q31.25,193.25 44.25,193.25 L419.75,193.25 Q432.75,193.25 432.75,206.25 L432.75,243 Z" fill="#b5d3cf"/><line x1="31.25" y1="243" x2="432.75" y2="243" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="223.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">The class deal</text><rect x="50" y="266" width="364" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="290" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Women give</text><text x="66" y="313" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">wage labour</text><line x1="232" y1="328" x2="232" y2="352" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="50" y="356" width="364" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="380" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">and are promised</text><text x="66" y="402" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">consumer goods</text><rect x="466" y="192" width="404" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,243 L467.25,206.25 Q467.25,193.25 480.25,193.25 L855.75,193.25 Q868.75,193.25 868.75,206.25 L868.75,243 Z" fill="#f2e7b8"/><line x1="467.25" y1="243" x2="868.75" y2="243" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="223.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">The gender deal</text><rect x="486" y="266" width="364" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="502" y="290" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Women give</text><text x="502" y="313" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">love and domestic labour</text><line x1="668" y1="328" x2="668" y2="352" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="486" y="356" width="364" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="502" y="380" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">and are promised</text><text x="502" y="402" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">material and emotional rewards from</text><text x="502" y="424" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">a male breadwinner</text><path d="M232,458 L232,488 L668,488 L668,458" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="450" y1="488" x2="450" y2="512" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="250" y="480" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">rewards fail</text><text x="650" y="480" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">rewards fail</text><rect x="200" y="516" width="500" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="556" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Crime becomes a viable alternative</text><rect x="30" y="600" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="636" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criticism</text><text x="56" y="665" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A small sample, although it supports the view that crime rises when social control breaks</text><text x="56" y="687" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">down.</text>
</svg>