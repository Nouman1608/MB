<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Albert Cohen: delinquent subcultures</text>

<rect x="30" y="110" width="184.5" height="151" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="122.25" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shares</text><text x="122.25" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">mainstream goals</text><text x="122.25" y="196.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Working-class boys</text><text x="122.25" y="217.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">want success like</text><text x="122.25" y="238.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">everyone else</text><line x1="218.5" y1="185.5" x2="244.5" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="110" width="184.5" height="151" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="340.75" y="143.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Blocked</text><text x="340.75" y="173.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Educational failure</text><text x="340.75" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(cultural</text><text x="340.75" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">deprivation) and</text><text x="340.75" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">poor job prospects</text><line x1="437" y1="185.5" x2="463" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="110" width="184.5" height="151" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="559.25" y="152.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Status</text><text x="559.25" y="176.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">frustration</text><text x="559.25" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Cannot reach the</text><text x="559.25" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">goals the normal way</text><line x1="655.5" y1="185.5" x2="681.5" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="110" width="184.5" height="151" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="777.75" y="152.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Delinquent</text><text x="777.75" y="176.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">subculture</text><text x="777.75" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Forms with boys in</text><text x="777.75" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the same position</text><path d="M774,265 L774,325 L640,325" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="300" y="295" width="330" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="465" y="329" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The subculture values</text><rect x="316" y="347" width="96" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="364" y="372.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">stealing</text><rect x="420" y="347" width="96" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="468" y="372.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">vandalism</text><rect x="524" y="347" width="96" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="572" y="372.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">truancy</text><text x="465" y="407" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><line x1="296" y1="355" x2="230" y2="355" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="309" width="196" height="92" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="128" y="347" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Prestige</text><text x="128" y="373" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">among peers</text><rect x="30" y="435" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="471" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criticism</text><text x="56" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some argue working-class youths never accept mainstream goals in the first place; they act</text><text x="56" y="522" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">out of resentment towards those whose values they reject.</text>
</svg>