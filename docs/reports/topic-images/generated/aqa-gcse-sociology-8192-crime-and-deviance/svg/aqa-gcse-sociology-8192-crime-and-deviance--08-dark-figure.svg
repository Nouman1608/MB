<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 843" width="900" height="843" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="843" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The dark figure of crime</text>

<rect x="30" y="250" width="840" height="400" fill="#b5d3cf"/><line x1="30" y1="250" x2="870" y2="250" stroke="#2e6b62" stroke-width="3"/><path d="M300,250 L360,150 L420,170 L470,128 L540,250 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M300,250 L230,360 L250,470 L330,600 L470,630 L600,580 L640,450 L600,330 L540,250 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="258" y1="390" x2="615" y2="390" stroke="#1e2a44" stroke-width="2" stroke-dasharray="8 6"/><text x="430" y="214" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Recorded</text><text x="430" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">by police</text><text x="430" y="314" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reported but</text><text x="430" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">not recorded</text><text x="430" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">police discretion</text><text x="430" y="470" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Never reported</text><text x="430" y="540" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">THE DARK FIGURE</text><text x="40" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Police recorded crime</text><text x="40" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(official statistics)</text><line x1="200" y1="184" x2="340" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="660" y="290" width="200" height="148" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="676" y="318" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Victim surveys</text><text x="676" y="342" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">capture unreported</text><text x="676" y="363" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crime, but miss</text><text x="676" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crimes without direct</text><text x="676" y="405" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">victims</text><line x1="656" y1="380" x2="590" y2="420" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="660" y="458" width="200" height="140" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="676" y="486" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Self-report studies</text><text x="676" y="510" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reveal hidden</text><text x="676" y="531" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offending and</text><text x="676" y="552" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offenders never</text><text x="676" y="573" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">caught</text><line x1="656" y1="530" x2="560" y2="540" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="280" width="180" height="78" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="52" y="306" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">dark figure =</text><text x="52" y="327" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">unreported or</text><text x="52" y="348" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">unrecorded</text><rect x="30" y="670" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="706" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Perspectives on the statistics</text><circle cx="61" cy="729.39" r="4.5" fill="#8a6d0d"/><text x="74" y="735" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Functionalists:</tspan> broadly show who commits crime</text><circle cx="61" cy="759.39" r="4.5" fill="#8a6d0d"/><text x="74" y="765" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxists:</tspan> reflect policing of the working class; crimes of the powerful go unrecorded</text><circle cx="61" cy="789.39" r="4.5" fill="#8a6d0d"/><text x="74" y="795" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Feminists:</tspan> domestic and sexual violence against women are heavily under-reported</text>
</svg>