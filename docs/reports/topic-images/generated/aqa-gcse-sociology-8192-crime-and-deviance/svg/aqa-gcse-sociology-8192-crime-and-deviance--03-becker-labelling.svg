<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 838" width="900" height="838" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="838" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Becker: from label to deviant career</text>

<rect x="30" y="104" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="152" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="159.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="143.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">An act happens</text><text x="104" y="173.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It only becomes deviant when others <tspan font-weight="700">label</tspan> it so.</text><line x1="450" y1="204" x2="450" y2="240" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="246" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="305" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="312.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="285.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A label is applied</text><text x="104" y="315.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Depends on who did it, when and where, who sees it and the negotiations involved.</text><text x="104" y="337.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Police and courts have the power to make labels stick.</text><line x1="450" y1="368" x2="450" y2="404" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="410" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="458" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="465.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="449.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Master status</text><text x="104" y="479.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The label overrides everything else about the person; others treat them accordingly.</text><line x1="450" y1="510" x2="450" y2="546" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="552" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="600" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="607.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="591.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Self-fulfilling prophecy</text><text x="104" y="621.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The person comes to see themselves as the label says.</text><line x1="450" y1="652" x2="450" y2="688" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="694" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="753" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="760.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="733.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Deviant career</text><text x="104" y="763.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rejection by others encourages further deviance. The career is complete when the person</text><text x="104" y="785.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">joins an organised deviant group with its own subculture.</text>
</svg>