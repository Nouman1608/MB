<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 946" width="900" height="946" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="946" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Merton: goals, means and anomie</text>

<text x="450" y="136" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">American society, Merton (1938)</text><path d="M424,300 L450,236 L476,300 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><line x1="180" y1="276" x2="720" y2="196" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><line x1="180" y1="276" x2="180" y2="302" stroke="#1e2a44" stroke-width="3"/><line x1="720" y1="196" x2="720" y2="222" stroke="#1e2a44" stroke-width="3"/><rect x="60" y="302" width="240" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="332" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Success goals</text><text x="180" y="358" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">(wealth)</text><rect x="610" y="222" width="220" height="54" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="256" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Legitimate means</text><text x="170" y="234" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">heavily emphasised</text><text x="720" y="300" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">less emphasised</text><rect x="30" y="390" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="420" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">People in lower positions lack the means → <tspan font-weight="700">anomie</tspan>: a state where “anything goes”</text><text x="450" y="446" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Five ways of responding:</text><text x="130" y="506" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Adaptation</text><text x="280" y="506" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Goals</text><text x="380" y="506" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Means</text><text x="445" y="506" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Example</text><rect x="30" y="522" width="190" height="64" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="125" y="561" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conformity</text><rect x="232" y="522" width="196" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="280" cy="554" r="17" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M272,554 l5,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="380" cy="554" r="17" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M372,554 l5,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="440" y="522" width="430" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="456" y="559.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gaining qualifications and a good job</text><rect x="30" y="594" width="190" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="125" y="633" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Innovation</text><rect x="232" y="594" width="196" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="280" cy="626" r="17" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M272,626 l5,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="380" cy="626" r="17" fill="#f3d9c9" stroke="#b5602e" stroke-width="2.5"/><path d="M373,619 l14,14 m0,-14 l-14,14" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="440" y="594" width="430" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="456" y="631.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Theft or fraud to get money</text><rect x="30" y="666" width="190" height="64" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="125" y="705" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ritualism</text><rect x="232" y="666" width="196" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="280" cy="698" r="17" fill="#f3d9c9" stroke="#b5602e" stroke-width="2.5"/><path d="M273,691 l14,14 m0,-14 l-14,14" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="380" cy="698" r="17" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M372,698 l5,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="440" y="666" width="430" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="456" y="692.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A low-level clerk who follows rules but has</text><text x="456" y="714.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">given up ambition</text><rect x="30" y="738" width="190" height="64" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="125" y="777" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Retreatism</text><rect x="232" y="738" width="196" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="280" cy="770" r="17" fill="#f3d9c9" stroke="#b5602e" stroke-width="2.5"/><path d="M273,763 l14,14 m0,-14 l-14,14" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="380" cy="770" r="17" fill="#f3d9c9" stroke="#b5602e" stroke-width="2.5"/><path d="M373,763 l14,14 m0,-14 l-14,14" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="440" y="738" width="430" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="456" y="775.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Dropping out”, e.g. drug addiction</text><rect x="30" y="810" width="190" height="64" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="125" y="849" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rebellion</text><rect x="232" y="810" width="196" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="280" cy="842" r="17" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><path d="M272,838 h14 m-4,-4 l4,4 l-4,4 M288,847 h-14 m4,-4 l-4,4 l4,4" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="380" cy="842" r="17" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><path d="M372,838 h14 m-4,-4 l4,4 l-4,4 M388,847 h-14 m4,-4 l-4,4 l4,4" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="440" y="810" width="430" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="456" y="847.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Revolutionaries seeking a new society</text><circle cx="60" cy="906" r="17" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M52,906 l5,6 l11,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="912" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">accept</text><circle cx="200" cy="906" r="17" fill="#f3d9c9" stroke="#b5602e" stroke-width="2.5"/><path d="M193,899 l14,14 m0,-14 l-14,14" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="226" y="912" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reject</text><circle cx="330" cy="906" r="17" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><path d="M322,902 h14 m-4,-4 l4,4 l-4,4 M338,911 h-14 m4,-4 l-4,4 l4,4" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="356" y="912" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">replace with new goals / means</text>
</svg>