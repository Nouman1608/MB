<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Formal and informal social control</text>

<rect x="188" y="104" width="337" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="356.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal</text><rect x="533" y="104" width="337" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="701.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal</text><rect x="30" y="156" width="150" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="188.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rules</text><rect x="188" y="156" width="337" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="188.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Written rules and laws</text><rect x="533" y="156" width="337" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="188.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Unwritten rules and expectations</text><rect x="30" y="218" width="150" height="78" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="262.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Agents</text><rect x="188" y="218" width="337" height="78" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="250.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Police, courts, prisons,</text><text x="202" y="274.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">government</text><rect x="533" y="218" width="337" height="78" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="250.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Family, peers, school, workplace,</text><text x="547" y="274.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">religion, media</text><rect x="30" y="304" width="150" height="78" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="348.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sanctions</text><rect x="188" y="304" width="337" height="78" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="336.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Arrest, fines, prison</text><rect x="533" y="304" width="337" height="78" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="336.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Praise, disapproval, gossip,</text><text x="547" y="360.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">exclusion</text><rect x="30" y="398" width="840" height="179" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Whose interests does control serve?</text><circle cx="61" cy="457.39" r="4.5" fill="#8a6d0d"/><text x="74" y="463" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Functionalists:</tspan> maintains value consensus</text><circle cx="61" cy="487.39" r="4.5" fill="#8a6d0d"/><text x="74" y="493" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxists:</tspan> protects the ruling class</text><circle cx="61" cy="517.39" r="4.5" fill="#8a6d0d"/><text x="74" y="523" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Feminists:</tspan> maintains patriarchy</text><circle cx="61" cy="547.39" r="4.5" fill="#8a6d0d"/><text x="74" y="553" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Interactionists:</tspan> focus on how agents of control label people</text>
</svg>