<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 833" width="900" height="833" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="833" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Crime, deviance and social construction</text>

<circle cx="345" cy="290" r="165" fill="#b5d3cf" fill-opacity="0.75" stroke="#1e2a44" stroke-width="3"/><circle cx="555" cy="290" r="165" fill="#f2e7b8" fill-opacity="0.75" stroke="#1e2a44" stroke-width="3"/><text x="270" y="268" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">CRIME</text><text x="270" y="296" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">breaks the <tspan font-weight="700">law</tspan></text><text x="630" y="268" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">DEVIANCE</text><text x="630" y="296" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">breaks a society’s</text><text x="630" y="320" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">norms</tspan></text><text x="450" y="282" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">some acts</text><text x="450" y="304" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">are both</text><text x="450" y="486" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Some acts are only one of the two.</text><text x="450" y="534" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">What counts as crime or deviance varies…</text><rect x="30" y="552" width="269.3333333333333" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,602 L31.25,566.25 Q31.25,553.25 44.25,553.25 L285.0833333333333,553.25 Q298.0833333333333,553.25 298.0833333333333,566.25 L298.0833333333333,602 Z" fill="#dce9e7"/><line x1="31.25" y1="602" x2="298.0833333333333" y2="602" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="582.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">between societies</text><text x="44" y="634.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Different societies draw the</text><text x="44" y="656.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">line in different places.</text><rect x="315.3333333333333" y="552" width="269.3333333333333" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,602 L316.5833333333333,566.25 Q316.5833333333333,553.25 329.5833333333333,553.25 L570.4166666666666,553.25 Q583.4166666666666,553.25 583.4166666666666,566.25 L583.4166666666666,602 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="602" x2="583.4166666666666" y2="602" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="582.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">over time</text><text x="329.3333333333333" y="634.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some legal acts have been</text><text x="329.3333333333333" y="656.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">criminalised; others</text><text x="329.3333333333333" y="678.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">decriminalised.</text><rect x="600.6666666666666" y="552" width="269.3333333333333" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,602 L601.9166666666666,566.25 Q601.9166666666666,553.25 614.9166666666666,553.25 L855.75,553.25 Q868.75,553.25 868.75,566.25 L868.75,602 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="602" x2="868.75" y2="602" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="582.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">by situation</text><text x="614.6666666666666" y="634.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Killing is murder in</text><text x="614.6666666666666" y="656.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">peacetime but may be</text><text x="614.6666666666666" y="678.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">honoured in war.</text><rect x="30" y="720" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="756" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Laws are made by people with power.</text><text x="56" y="785" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">So crime is a <tspan font-weight="700">social definition</tspan>, not a fixed quality of an act.</text>
</svg>