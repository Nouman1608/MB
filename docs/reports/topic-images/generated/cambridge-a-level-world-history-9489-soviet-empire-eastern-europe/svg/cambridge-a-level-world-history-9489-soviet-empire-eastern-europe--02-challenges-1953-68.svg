<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five challenges and the responses, 1953-68</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">What decided whether Moscow sent the tanks</text>
<text x="210" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">CHALLENGE</text><text x="690" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">RESPONSE</text><line x1="450" y1="154" x2="450" y2="632" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="154" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="180.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">East Germany</text><text x="43" y="207" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Higher work norms: strikes and</text><text x="43" y="227" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">demonstrations</text><line x1="390" y1="199" x2="388" y2="199" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="154" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="523" y="190.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soviet tanks</text><text x="523" y="217" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Protests crushed</text><line x1="512" y1="199" x2="510" y2="199" stroke="#1e2a44" stroke-width="2"/><rect x="388" y="182" width="124" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="205" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Jun 1953</text><rect x="30" y="256" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="282.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Poland</text><text x="43" y="309" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">After the Secret Speech and Poznań:</text><text x="43" y="329" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gomułka returns</text><line x1="390" y1="301" x2="388" y2="301" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="256" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="292.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Accepted</text><text x="523" y="319" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Poland stayed communist and in the Pact</text><line x1="512" y1="301" x2="510" y2="301" stroke="#1e2a44" stroke-width="2"/><rect x="388" y="284" width="124" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="307" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Oct 1956</text><rect x="30" y="358" width="360" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="384.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hungary</text><text x="43" y="411" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Nagy allows other parties; announces leaving</text><text x="43" y="431" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the Pact</text><line x1="390" y1="403" x2="388" y2="403" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="358" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="523" y="384.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Invasion, 4 November</text><text x="523" y="411" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">About 200,000 flee; Kádár installed; Nagy</text><text x="523" y="431" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">executed (1958)</text><line x1="512" y1="403" x2="510" y2="403" stroke="#1e2a44" stroke-width="2"/><rect x="388" y="386" width="124" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="409" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Oct-Nov 1956</text><rect x="30" y="460" width="360" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="486.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Berlin</text><text x="43" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Millions leave through Berlin in the 1950s</text><line x1="390" y1="495" x2="388" y2="495" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="460" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="486.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The Wall</text><text x="523" y="513" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Border sealed on 13 August</text><line x1="512" y1="495" x2="510" y2="495" stroke="#1e2a44" stroke-width="2"/><rect x="388" y="478" width="124" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="501" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Aug 1961</text><rect x="30" y="542" width="360" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="568.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Czechoslovakia</text><text x="43" y="595" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Dubček: "socialism with a human face";</text><text x="43" y="615" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">censorship ended</text><line x1="390" y1="587" x2="388" y2="587" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="542" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="523" y="568.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Warsaw Pact invasion</text><text x="523" y="595" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">20-21 August (not Romania); Husák; Brezhnev</text><text x="523" y="615" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Doctrine after the event</text><line x1="512" y1="587" x2="510" y2="587" stroke="#1e2a44" stroke-width="2"/><rect x="388" y="570" width="124" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="593" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Aug 1968</text>
</svg>