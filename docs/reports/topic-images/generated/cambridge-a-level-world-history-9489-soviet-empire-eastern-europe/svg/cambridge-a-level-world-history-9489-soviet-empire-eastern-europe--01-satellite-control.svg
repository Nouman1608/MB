<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the satellites were held</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Tools of Soviet control after 1953</text>
<line x1="310" y1="184.5" x2="405" y2="256.95" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="309" x2="405" y2="294.3" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="412.5" x2="405" y2="325.35" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="174" x2="495" y2="253.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="277.5" x2="495" y2="284.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="391.5" x2="495" y2="319.05" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="288" r="90" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="282.8" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">One-party</text><text x="450" y="307.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">states</text><rect x="30" y="124" width="280" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Warsaw Pact (May 1955)</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Soviet troops stationed legally;</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unified command under a Soviet</text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">officer</text><rect x="30" y="259" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="289.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">COMECON (1949)</text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Economic bloc; central planning</text><text x="46" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for heavy industry</text><rect x="30" y="373" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="403.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Moscow's approval</text><text x="46" y="431.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Leaders depended on it</text><rect x="590" y="134.5" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="164.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Censorship</text><text x="606" y="193.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Party control of the media</text><rect x="590" y="227.5" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="257.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Security police</text><text x="606" y="286.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">East Germany's Stasi and its</text><text x="606" y="307.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">informers</text><rect x="590" y="341.5" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="371.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Church and emigration</text><text x="606" y="400.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wyszyński interned (1953-56);</text><text x="606" y="421.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">emigration restricted</text><rect x="30" y="474" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="508.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The rule Moscow enforced</text><text x="50" y="538.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Variation was tolerated (Gomułka, Kádár); leaving the party's monopoly or the Pact was not.</text>
</svg>