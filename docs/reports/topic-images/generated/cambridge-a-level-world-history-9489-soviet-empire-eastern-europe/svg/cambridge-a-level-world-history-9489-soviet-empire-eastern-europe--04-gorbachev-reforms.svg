<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 611" width="900" height="611" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gorbachev's three reforms and their effects</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">He aimed to reform communism, not end it</text>
<rect x="30" y="124" width="270.6666666666667" height="131" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RESTRUCTURING</text><text x="165.33333333333334" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Perestroika</text><text x="165.33333333333334" y="211" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">State Enterprise Law (1987);</text><text x="165.33333333333334" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Cooperatives Law (1988)</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="131" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">OPENNESS</text><text x="450" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Glasnost</text><text x="450" y="211" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Widened after Chernobyl (April</text><text x="450" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1986)</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="131" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DEMOCRATISATION</text><text x="734.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Demokratizatsiya</text><text x="734.6666666666667" y="211" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Contested elections (1989);</text><text x="734.6666666666667" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">party monopoly ends (1990)</text><line x1="165" y1="263" x2="165" y2="297" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="263" x2="450" y2="297" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735" y1="263" x2="735" y2="297" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="321" width="270.6666666666667" height="125" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="165.33333333333334" y="354.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Disrupted the plan, created</text><text x="165.33333333333334" y="375.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">no market</text><text x="165.33333333333334" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Shortages deepened; 12th Five</text><text x="165.33333333333334" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Year Plan failed</text><rect x="314.6666666666667" y="321" width="270.6666666666667" height="125" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="374.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Criticism reached the party</text><text x="450" y="401.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">And the Soviet past</text><rect x="599.3333333333334" y="321" width="270.6666666666667" height="125" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="734.6666666666667" y="374.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Authority shifted</text><text x="734.6666666666667" y="401.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Away from the party</text><rect x="30" y="468" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="500" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ABROAD</text><text x="50" y="526.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Summits end the Second Cold War</text><text x="50" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Geneva (1985), Reykjavik (1986), Washington and the INF Treaty (1987); out of Afghanistan by 1989</text>
</svg>