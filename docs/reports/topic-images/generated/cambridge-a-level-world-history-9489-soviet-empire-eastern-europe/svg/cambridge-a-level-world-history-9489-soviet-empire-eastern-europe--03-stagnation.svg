<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why stagnation, 1964-85?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Political, economic and external causes reinforced each other</text>
<rect x="30" y="124" width="270.6666666666667" height="232" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="45" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POLITICAL</text><text x="45" y="179.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gerontocracy</text><text x="45" y="207" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="59.25" y="207" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"Stability of cadres" (Brezhnev,</text><text x="59.25" y="227" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1964-82)</text><text x="45" y="251" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="59.25" y="251" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Nomenklatura privileges;</text><text x="59.25" y="271" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">corruption</text><text x="45" y="295" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="59.25" y="295" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Andropov (1982-84) and</text><text x="59.25" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Chernenko (1984-85) ill, die</text><text x="59.25" y="335" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">within months</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="232" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="329.6666666666667" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ECONOMIC</text><text x="329.6666666666667" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Slowing growth</text><text x="329.6666666666667" y="205" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.9166666666667" y="205" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Kosygin reforms (1965) diluted</text><text x="329.6666666666667" y="229" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.9166666666667" y="229" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">10th Five Year Plan (1976-80)</text><text x="343.9166666666667" y="249" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">misses targets</text><text x="329.6666666666667" y="273" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.9166666666667" y="273" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Grain imports; lagging</text><text x="343.9166666666667" y="293" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">technology</text><text x="329.6666666666667" y="317" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.9166666666667" y="317" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Oil and gas earnings mask</text><text x="343.9166666666667" y="337" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">problems</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="232" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="614.3333333333334" y="183" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXTERNAL</text><text x="614.3333333333334" y="209.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Costly commitments</text><text x="614.3333333333334" y="237" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5833333333334" y="237" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Defence spending for parity</text><text x="614.3333333333334" y="261" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5833333333334" y="261" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Afghanistan from December</text><text x="628.5833333333334" y="281" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1979</text><text x="614.3333333333334" y="305" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5833333333334" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Second Cold War</text><rect x="30" y="378" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IN THE SATELLITES</text><text x="50" y="436.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Debt and dissent</text><text x="50" y="464.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Heavy Western borrowing in the 1970s; Helsinki Accords (1975) used by dissidents; Charter 77; a Polish</text><text x="50" y="485.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pope (1978) and his 1979 visit</text>
</svg>