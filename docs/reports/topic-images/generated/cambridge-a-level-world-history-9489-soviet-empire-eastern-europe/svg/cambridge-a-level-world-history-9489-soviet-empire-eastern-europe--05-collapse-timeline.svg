<rect width="900" height="1120" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From Solidarity to the end of the USSR</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">1989-91 drawn to scale: satellites left, USSR right</text>
<rect x="30" y="124" width="411" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POLAND, 1980-81</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Solidarity</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gdańsk strikes and 21 Demands (August 1980);</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">martial law (December 1981)</text><rect x="459" y="124" width="411" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">USSR, 1985-86</text><text x="479" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gorbachev</text><text x="479" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chosen March 1985; Chernobyl (April 1986);</text><text x="479" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">riots in Kazakhstan (1986)</text><line x1="116" y1="322" x2="870" y2="322" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="328" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jan 1989</text><line x1="116" y1="422" x2="870" y2="422" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="428" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jul</text><line x1="116" y1="522" x2="870" y2="522" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="528" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jan 1990</text><line x1="116" y1="622" x2="870" y2="622" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="628" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jul</text><line x1="116" y1="722" x2="870" y2="722" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="728" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jan 1991</text><line x1="116" y1="822" x2="870" y2="822" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="828" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jul</text><line x1="116" y1="922" x2="870" y2="922" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="928" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jan 1992</text><line x1="470" y1="322" x2="470" y2="922" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="430" y="292" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">EASTERN EUROPE</text><text x="510" y="292" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INSIDE THE USSR</text><path d="M470,372 L454,372 L436,372" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="127.49600000000004" y="357.4" width="307.50399999999996" height="46" fill="#f4f6f6"/><text x="430" y="376.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">April-June 1989</text><text x="430" y="397.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Solidarity legal; wins semi-free election</text><path d="M470,422 L454,422 L436,424" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="138.488" y="409.4" width="296.512" height="46" fill="#f4f6f6"/><text x="430" y="428.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1989</text><text x="430" y="449.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Hungary opens its border with Austria</text><path d="M470,472 L486,472 L504,472" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="457.4" width="187.6" height="46" fill="#f4f6f6"/><text x="510" y="476.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">October 1989</text><text x="510" y="497.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sinatra Doctrine named</text><path d="M470,493.03825136609885 L454,493.03825136609885 L436,493.03825136609885" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="287.08000000000004" y="478.4382513660988" width="147.92" height="46" fill="#f4f6f6"/><text x="430" y="497.23825136609884" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">9 November 1989</text><text x="430" y="518.2382513660989" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Berlin Wall falls</text><path d="M470,505.3333333333485 L454,505.3333333333485 L436,545.0382513660988" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="162.64799999999997" y="530.4382513660988" width="272.35200000000003" height="46" fill="#f4f6f6"/><text x="430" y="549.2382513660988" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">December 1989</text><text x="430" y="570.2382513660988" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Velvet Revolution; Ceaușescu falls</text><path d="M470,555.3333333333485 L486,555.3333333333485 L504,555.3333333333485" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="540.7333333333485" width="260.336" height="46" fill="#f4f6f6"/><text x="510" y="559.5333333333484" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">March 1990</text><text x="510" y="580.5333333333484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lithuania declares independence</text><path d="M470,728.5573770491937 L486,728.5573770491937 L504,728.5573770491937" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="713.9573770491937" width="136.288" height="46" fill="#f4f6f6"/><text x="510" y="732.7573770491937" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">January 1991</text><text x="510" y="753.7573770491937" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Killings in Vilnius</text><path d="M470,848.5027322404421 L486,848.5027322404421 L504,848.5027322404421" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="833.9027322404421" width="272.96000000000004" height="46" fill="#f4f6f6"/><text x="510" y="852.7027322404421" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">August 1991</text><text x="510" y="873.7027322404421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hardliners' coup fails in three days</text><path d="M470,918.4480874316905 L486,918.4480874316905 L504,918.4480874316905" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="903.8480874316905" width="286.368" height="67" fill="#f4f6f6"/><text x="510" y="922.6480874316904" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">December 1991</text><text x="510" y="943.6480874316904" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">CIS founded; Gorbachev resigns (25</text><text x="510" y="964.6480874316904" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">December)</text><circle cx="470" cy="372" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="422" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="472" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="493.03825136609885" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="505.3333333333485" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="555.3333333333485" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="728.5573770491937" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="848.5027322404421" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="918.4480874316905" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="998.8480874316905" width="840" height="89.00000000000011" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="1033.6680874316905" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Keep them apart</text><text x="450" y="1063.4480874316905" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The satellites fell in <tspan font-weight="700" fill="#1e2a44">1989</tspan>; the USSR itself in <tspan font-weight="700" fill="#1e2a44">1991</tspan>.</text>
</svg>