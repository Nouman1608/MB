<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" width="900" height="535" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="535" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Does social media harm young people?</text>

<rect x="30" y="104" width="404" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Suggested mechanisms</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Twenge (2017): smartphones and teen</text><text x="48" y="211.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">depression in the early 2010s</text><circle cx="53" cy="236.79" r="4.5" fill="#2e6b62"/><text x="66" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Social comparison with idealised images</text><circle cx="53" cy="266.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="272.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cyberbullying that follows young people</text><text x="66" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">home</text><circle cx="53" cy="318.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="324.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Disrupted sleep</text><circle cx="53" cy="348.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="354.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Displacement of in-person activity</text><rect x="466" y="104" width="404" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Methodological problems</text><circle cx="489" cy="184.79" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Most studies are correlational</text><circle cx="489" cy="214.79" r="4.5" fill="#8a6d0d"/><text x="502" y="220.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Self-reported screen time is often</text><text x="502" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">inaccurate</text><circle cx="489" cy="266.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="272.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Causation may run the other way</text><circle cx="489" cy="296.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="302.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"Screen time" lumps together schoolwork</text><text x="502" y="324.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and messaging</text><circle cx="450" cy="242" r="24" fill="#1e2a44"/><text x="450" y="249" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="398" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A strong conclusion</text><text x="56" y="463" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Effects probably differ by user, platform and type of use; evidence for large, universal</text><text x="56" y="485" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">harm is contested.</text>
</svg>