<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who filters information now?</text>

<rect x="30" y="110" width="385" height="108" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="222.5" y="153.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Before</text><text x="222.5" y="183.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">newspaper editors as the main filters</text><line x1="419" y1="164" x2="481" y2="164" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="485" y="110" width="385" height="108" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="677.5" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Now</text><text x="677.5" y="172.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">search engines and recommendation</text><text x="677.5" y="194.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">systems decide what is visible</text><text x="450" y="248" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle" font-style="italic">information is abundant; attention is scarce</text><rect x="30" y="272" width="412" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,322 L31.25,286.25 Q31.25,273.25 44.25,273.25 L427.75,273.25 Q440.75,273.25 440.75,286.25 L440.75,322 Z" fill="#dce9e7"/><line x1="31.25" y1="322" x2="440.75" y2="322" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="302.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Network society</text><text x="44" y="353.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Castells (1996)</text><text x="44" y="380.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Information networks form the basic structure</text><text x="44" y="401.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of society; power depends on position in</text><text x="44" y="422.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">global networks.</text><rect x="458" y="272" width="412" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,322 L459.25,286.25 Q459.25,273.25 472.25,273.25 L855.75,273.25 Q868.75,273.25 868.75,286.25 L868.75,322 Z" fill="#dce9e7"/><line x1="459.25" y1="322" x2="868.75" y2="322" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="302.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Mass self-communication</text><text x="472" y="353.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Castells (2009)</text><text x="472" y="380.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Individuals can now reach mass audiences</text><text x="472" y="401.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">themselves.</text><rect x="30" y="464" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="500" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The opportunity side</text><text x="56" y="529" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Education, health information and news for anyone connected; easier organising across</text><text x="56" y="551" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">borders. The Web: proposed 1989 at CERN, public in 1991.</text>
</svg>