<rect x="30" y="104" width="269.3333333333333" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Prosumers and produsers</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Toffler (1980); Bruns</text><text x="46" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">(2008)</text><text x="46" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Producing and consuming;</text><text x="46" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collaborative creation such</text><text x="46" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as wikis.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Citizen journalists</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Tunisia and Egypt,</text><text x="331.3333333333333" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">2010–11; Minneapolis,</text><text x="331.3333333333333" y="229.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">2020</text><text x="331.3333333333333" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protest videos used by</text><text x="331.3333333333333" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">broadcasters; Darnella</text><text x="331.3333333333333" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Frazier’s video of George</text><text x="331.3333333333333" y="321.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Floyd’s killing (Pulitzer</text><text x="331.3333333333333" y="342.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">citation, 2021).</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Influencers</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Senft (2008); Abidin</text><text x="616.6666666666666" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">(2018)</text><text x="616.6666666666666" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Microcelebrity: ordinary</text><text x="616.6666666666666" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people build audiences; a</text><text x="616.6666666666666" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">commercial industry built on</text><text x="616.6666666666666" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">apparent intimacy and</text><text x="616.6666666666666" y="321.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">authenticity.</text><rect x="30" y="382" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="418" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="441.39" r="4.5" fill="#8a6d0d"/><text x="74" y="447" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Morozov (2011):</tspan> cyber-utopianism; authoritarian states also use the internet</text><circle cx="61" cy="471.39" r="4.5" fill="#8a6d0d"/><text x="74" y="477" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Gladwell (2010):</tspan> weak ties and slacktivism</text><circle cx="61" cy="501.39" r="4.5" fill="#8a6d0d"/><text x="74" y="507" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Platforms profit from user content; few creators earn a living</text>
</svg>