<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How online communication differs</text>

<text x="30" y="116" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">boyd (2014): four features of networked publics</text><rect x="30" y="132" width="201" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,182 L31.25,146.25 Q31.25,133.25 44.25,133.25 L216.75,133.25 Q229.75,133.25 229.75,146.25 L229.75,182 Z" fill="#b5d3cf"/><line x1="31.25" y1="182" x2="229.75" y2="182" stroke="#c9d6d4" stroke-width="2"/><text x="130.5" y="162.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Persistence</text><text x="44" y="213.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">posts last</text><rect x="243" y="132" width="201" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M244.25,182 L244.25,146.25 Q244.25,133.25 257.25,133.25 L429.75,133.25 Q442.75,133.25 442.75,146.25 L442.75,182 Z" fill="#b5d3cf"/><line x1="244.25" y1="182" x2="442.75" y2="182" stroke="#c9d6d4" stroke-width="2"/><text x="343.5" y="162.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Visibility</text><text x="257" y="213.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">large potential</text><text x="257" y="234.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">audiences</text><rect x="456" y="132" width="201" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M457.25,182 L457.25,146.25 Q457.25,133.25 470.25,133.25 L642.75,133.25 Q655.75,133.25 655.75,146.25 L655.75,182 Z" fill="#b5d3cf"/><line x1="457.25" y1="182" x2="655.75" y2="182" stroke="#c9d6d4" stroke-width="2"/><text x="556.5" y="162.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Spreadability</text><text x="470" y="213.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">easily shared</text><rect x="669" y="132" width="201" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M670.25,182 L670.25,146.25 Q670.25,133.25 683.25,133.25 L855.75,133.25 Q868.75,133.25 868.75,146.25 L868.75,182 Z" fill="#b5d3cf"/><line x1="670.25" y1="182" x2="868.75" y2="182" stroke="#c9d6d4" stroke-width="2"/><text x="769.5" y="162.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Searchability</text><text x="683" y="213.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">found later</text><text x="30" y="288" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Context collapse (Marwick and boyd, 2011)</text><rect x="40" y="308" width="200" height="46" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="140" y="338" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Family</text><line x1="244" y1="331" x2="396" y2="420" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="366" width="200" height="46" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="140" y="396" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Friends</text><line x1="244" y1="389" x2="396" y2="420" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="424" width="200" height="46" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="140" y="454" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Teachers</text><line x1="244" y1="447" x2="396" y2="420" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="482" width="200" height="46" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="140" y="512" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Employers</text><line x1="244" y1="505" x2="396" y2="420" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="400" y="378" width="180" height="84" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="490" y="414" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One online</text><text x="490" y="438" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">self</text><text x="610" y="368" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Audiences kept apart offline</text><text x="610" y="390" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">are merged, so users must</text><text x="610" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">manage one self for many</text><text x="610" y="434" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">audiences.</text><rect x="30" y="548" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="584" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Connection or isolation?</text><circle cx="61" cy="607.39" r="4.5" fill="#8a6d0d"/><text x="74" y="613" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Turkle (2011):</tspan> constant connection replaces deep conversation with shallow contact</text><circle cx="61" cy="637.39" r="4.5" fill="#8a6d0d"/><text x="74" y="643" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Reply:</tspan> online communication sustains ties across distance, for diasporas and minority</text><text x="74" y="665" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">young people</text>
</svg>