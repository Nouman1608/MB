<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 799" width="900" height="799" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="799" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who controls new media?</text>

<line x1="280" y1="280" x2="280" y2="165" stroke="#2e6b62" stroke-width="3.5"/><line x1="280" y1="280" x2="105" y2="435" stroke="#2e6b62" stroke-width="3.5"/><line x1="280" y1="280" x2="455" y2="435" stroke="#2e6b62" stroke-width="3.5"/><rect x="200" y="140" width="160" height="50" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="280" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Users</text><rect x="25" y="410" width="160" height="50" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="442" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Advertisers</text><rect x="375" y="410" width="160" height="50" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="455" y="442" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Producers</text><circle cx="280" cy="280" r="62" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="280" y="287" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Platform</text><text x="290" y="502" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Srnicek (2016): platforms profit by sitting between groups;</text><text x="290" y="523" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">network effects push markets towards a few giants</text><text x="725" y="120" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Surveillance capitalism</text><text x="725" y="142" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Zuboff (2019)</text><rect x="580" y="160" width="290" height="50" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="725" y="190.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Users’ behaviour</text><line x1="725" y1="213" x2="725" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="580" y="238" width="290" height="50" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="725" y="268.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">turned into data</text><line x1="725" y1="291" x2="725" y2="313" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="580" y="316" width="290" height="72" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="725" y="346.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">used to predict and</text><text x="725" y="368.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">influence what they do</text><line x1="725" y1="391" x2="725" y2="413" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="580" y="416" width="290" height="50" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="725" y="446.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">sold to advertisers</text><rect x="30" y="572" width="840" height="201" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="608" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Readings and a case</text><circle cx="61" cy="631.39" r="4.5" fill="#8a6d0d"/><text x="74" y="637" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxists:</tspan> platform owners are a new media elite with more reach than newspaper owners</text><circle cx="61" cy="661.39" r="4.5" fill="#8a6d0d"/><text x="74" y="667" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Pluralists:</tspan> anyone can publish; users have abandoned dominant platforms before</text><circle cx="61" cy="691.39" r="4.5" fill="#8a6d0d"/><text x="74" y="697" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Cambridge Analytica (2018):</tspan> data from millions of Facebook users obtained without</text><text x="74" y="719" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">consent</text><circle cx="61" cy="743.39" r="4.5" fill="#8a6d0d"/><text x="74" y="749" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">van Dijck (2013):</tspan> platform design shapes what "sharing" and "friendship" mean</text>
</svg>