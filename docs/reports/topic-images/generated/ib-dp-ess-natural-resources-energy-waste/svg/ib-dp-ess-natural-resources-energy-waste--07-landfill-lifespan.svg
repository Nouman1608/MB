<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: how long will the landfill last?</text>

<text x="30" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Now: 25% recycled or composted</text><rect x="30" y="156" width="196" height="86" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="128" y="195.19000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">30 400 t</text><text x="128" y="215.23000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">SDW per year</text><line x1="228" y1="199" x2="242" y2="199" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="244" y="156" width="196" height="86" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="342" y="185.44000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">22 800 t</text><text x="342" y="205.48000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">landfilled</text><text x="342" y="224.98000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(0.75 × 30 400)</text><line x1="442" y1="199" x2="456" y2="199" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="458" y="156" width="196" height="86" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="556" y="185.44000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">30 400 m³</text><text x="556" y="205.48000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">per year</text><text x="556" y="224.98000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(÷ 0.75 t/m³)</text><line x1="656" y1="199" x2="670" y2="199" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="672" y="156" width="196" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="770" y="195.19000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">12.5 years</text><text x="770" y="215.23000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">380 000 ÷ 30 400</text><text x="30" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">With food-waste collection and better recycling</text><rect x="30" y="316" width="196" height="86" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="128" y="355.18999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">15 000 t</text><text x="128" y="375.22999999999996" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">landfilled per year</text><line x1="228" y1="359" x2="242" y2="359" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="244" y="316" width="196" height="86" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="342" y="345.43999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">20 000 m³</text><text x="342" y="365.47999999999996" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">per year</text><text x="342" y="384.97999999999996" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(÷ 0.75 t/m³)</text><line x1="442" y1="359" x2="456" y2="359" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="458" y="316" width="196" height="86" rx="12" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2.5"/><text x="556" y="355.18999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">19 years</text><text x="556" y="375.22999999999996" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">380 000 ÷ 20 000</text><rect x="672" y="316" width="198" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="771" y="350" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">50.7% diverted</text><text x="771" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(30 400 − 15 000)</text><text x="771" y="393" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">÷ 30 400 × 100</text><rect x="30" y="440" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="478" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Landfill lifespan with 380 000 m³ of space left</text><text x="180" y="524" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">now</text><rect x="195" y="500" width="425" height="36" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="630" y="524" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">12.5 years</text><text x="180" y="580" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">improved</text><rect x="195" y="556" width="646" height="36" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="831" y="580" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">19 years</text><text x="60" y="620" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">80 000 people: 380 kg per person per year (1.04 kg a day)</text>
</svg>