<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What shapes a society’s energy choices</text>

<ellipse cx="450" cy="330" rx="130" ry="62" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="326" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A society’s</text><text x="450" y="350" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">energy mix</text><rect x="30" y="122" width="240" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="156.19000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Availability</text><text x="150" y="176.23000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">local resources, e.g. hydro</text><line x1="202.20133115091673" y1="180.70652802319697" x2="328.1968939811943" y2="297.4611702492619" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/><rect x="330" y="102" width="240" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="136.19" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Technology and cost</text><text x="450" y="156.23" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">capital, running, grid</text><line x1="450" y1="182" x2="450" y2="264" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/><rect x="630" y="122" width="240" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="156.19000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic</text><text x="750" y="176.23000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">existing industry, fuel prices</text><line x1="697.7986688490832" y1="180.70652802319697" x2="571.8031060188057" y2="297.4611702492619" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="292" width="240" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="326.18999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Political</text><text x="150" y="346.22999999999996" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">policy, subsidies, treaties</text><line x1="275" y1="330" x2="310" y2="330" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/><rect x="630" y="292" width="240" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="326.18999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural and social</text><text x="750" y="346.22999999999996" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">opposition to nuclear or wind</text><line x1="625" y1="330" x2="590" y2="330" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/><rect x="130" y="462" width="240" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="496.18999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Environmental</text><text x="250" y="516.23" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">climate change, air quality</text><line x1="295.71635906556753" y1="472.7987663559873" x2="343.3284955136757" y2="372.74479572630565" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/><rect x="530" y="462" width="240" height="76" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="650" y="496.18999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Energy security</text><text x="650" y="516.23" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">reliable, affordable supply</text><line x1="604.2836409344325" y1="472.7987663559873" x2="556.6715044863244" y2="372.74479572630565" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="580" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="618" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Improving energy security</text><rect x="56" y="640" width="186" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="149" y="673.86" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Diversify</text><text x="149" y="693.62" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sources</text><rect x="259" y="640" width="186" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="352" y="673.86" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Develop local</text><text x="352" y="693.62" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">renewables</text><rect x="462" y="640" width="186" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="555" y="673.86" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Store fuel</text><text x="555" y="693.62" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">or electricity</text><rect x="665" y="640" width="186" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="758" y="673.86" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reduce demand</text><text x="758" y="693.62" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">efficiency, conservation</text><text x="450" y="748" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Less secure: imports much fuel, relies on one or two sources, or uses unstable supply routes.</text>
</svg>