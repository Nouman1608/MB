<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sustainable yield: a forest plantation</text>

<rect x="30" y="110" width="530" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Plantation stock (t) over 10 years</text><line x1="120" y1="520" x2="530" y2="520" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">15,000</text><line x1="120" y1="435" x2="530" y2="435" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="441" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">16,000</text><line x1="120" y1="350" x2="530" y2="350" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">17,000</text><line x1="120" y1="265" x2="530" y2="265" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="271" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">18,000</text><line x1="120" y1="180" x2="530" y2="180" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">19,000</text><text x="120" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><text x="202" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2</text><text x="284" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">4</text><text x="366" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">6</text><text x="448" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">8</text><text x="530" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10</text><line x1="120" y1="520" x2="530" y2="520" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="520" x2="120" y2="170" stroke="#1e2a44" stroke-width="3"/><text x="325" y="570" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">years from now</text><line x1="120" y1="231" x2="530" y2="231" stroke="#2e6b62" stroke-width="5"/><text x="530" y="219" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">fell 920 t/yr = SY: stock stays 18 400 t</text><line x1="120" y1="231" x2="530" y2="426.5" stroke="#b5602e" stroke-width="5"/><circle cx="530" cy="426.5" r="7" fill="#b5602e"/><text x="520" y="458.5" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">fell 1150 t/yr: 16 100 t</text><text x="60" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Real decline is probably faster: a smaller stock</text><text x="60" y="631" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">usually grows more slowly.</text><rect x="580" y="110" width="290" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="604" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The calculation</text><text x="604" y="186" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">SY = 19 320 − 18 400</text><text x="604" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">= 920 t per year</text><text x="604" y="250" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">920 ÷ 18 400 × 100</text><text x="604" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">= 5.0% of the stock a year</text><text x="604" y="314" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Harvest − SY</text><text x="604" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1150 − 920 = 230 t above SY</text><text x="604" y="378" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Stock change</text><text x="604" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">920 − 1150 = −230 t per year</text><text x="604" y="442" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">After 10 years</text><text x="604" y="464" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">18 400 − 10 × 230 = 16 100 t</text><rect x="600" y="500" width="250" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="725" y="543.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Natural capital shrinks.</text><text x="725" y="565.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sustainable felling is</text><text x="725" y="587.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">at most 920 t a year.</text>
</svg>