<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The waste hierarchy</text>

<path d="M50,130 L610,130 L560,222 L100,222 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="330" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Reduce</text><text x="330" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">less packaging, durable goods</text><path d="M100,228 L560,228 L510,320 L150,320 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="330" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Reuse</text><text x="330" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">repair, keep products in use</text><path d="M150,326 L510,326 L460,418 L200,418 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="330" y="366" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Recycle / compost</text><text x="330" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">save materials; cut methane</text><path d="M200,424 L460,424 L410,516 L250,516 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="330" y="464" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Recover energy</text><text x="330" y="488" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">incineration</text><path d="M250,522 L410,522 L360,614 L300,614 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="330" y="562" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Dispose</text><text x="330" y="586" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">landfill</text><line x1="40" y1="140" x2="40" y2="600" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="26" y="370" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 26 370)">less preferred ↓</text><line x1="650" y1="134" x2="650" y2="322" stroke="#2e6b62" stroke-width="4"/><rect x="668" y="182" width="200" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="692" cy="210" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="692" y="215.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="714" y="216" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Alter activity</text><text x="684" y="240" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">prevention: tackles</text><text x="684" y="260" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the cause</text><line x1="650" y1="330" x2="650" y2="610" stroke="#8a6d0d" stroke-width="4"/><rect x="668" y="424" width="200" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="692" cy="452" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="692" y="457.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="714" y="458" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Control release</text><text x="684" y="482" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">recycling, compost,</text><text x="684" y="502" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">incineration, landfill tax</text><rect x="30" y="640" width="840" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="678" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="62" y="683.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="88" y="672" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Clean-up and restoration</text><text x="88" y="696" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">collecting litter, reclaiming old landfill sites, beach clean-ups</text><text x="450" y="745" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Strategies higher up the hierarchy tackle causes rather than outcomes.</text>
</svg>