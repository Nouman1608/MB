<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The tragedy of the commons</text>

<rect x="30" y="110" width="840" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><ellipse cx="450" cy="300" rx="210" ry="120" fill="#cfe0c0" stroke="#6f9a52" stroke-width="3"/><text x="450" y="210" font-size="16" font-weight="700" fill="#3d5f2a" text-anchor="middle">shared pasture (common-pool resource)</text><ellipse cx="350" cy="270" rx="18" ry="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="368" cy="263" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="340" y1="280" x2="340" y2="288" stroke="#1e2a44" stroke-width="2"/><line x1="360" y1="280" x2="360" y2="288" stroke="#1e2a44" stroke-width="2"/><ellipse cx="410" cy="250" rx="18" ry="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="428" cy="243" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="400" y1="260" x2="400" y2="268" stroke="#1e2a44" stroke-width="2"/><line x1="420" y1="260" x2="420" y2="268" stroke="#1e2a44" stroke-width="2"/><ellipse cx="480" cy="260" rx="18" ry="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="498" cy="253" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="470" y1="270" x2="470" y2="278" stroke="#1e2a44" stroke-width="2"/><line x1="490" y1="270" x2="490" y2="278" stroke="#1e2a44" stroke-width="2"/><ellipse cx="540" cy="285" rx="18" ry="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="558" cy="278" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="530" y1="295" x2="530" y2="303" stroke="#1e2a44" stroke-width="2"/><line x1="550" y1="295" x2="550" y2="303" stroke="#1e2a44" stroke-width="2"/><ellipse cx="370" cy="330" rx="18" ry="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="388" cy="323" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="360" y1="340" x2="360" y2="348" stroke="#1e2a44" stroke-width="2"/><line x1="380" y1="340" x2="380" y2="348" stroke="#1e2a44" stroke-width="2"/><ellipse cx="440" cy="310" rx="18" ry="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="458" cy="303" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="430" y1="320" x2="430" y2="328" stroke="#1e2a44" stroke-width="2"/><line x1="450" y1="320" x2="450" y2="328" stroke="#1e2a44" stroke-width="2"/><ellipse cx="510" cy="335" rx="18" ry="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="528" cy="328" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="500" y1="345" x2="500" y2="353" stroke="#1e2a44" stroke-width="2"/><line x1="520" y1="345" x2="520" y2="353" stroke="#1e2a44" stroke-width="2"/><ellipse cx="420" cy="370" rx="18" ry="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="438" cy="363" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="410" y1="380" x2="410" y2="388" stroke="#1e2a44" stroke-width="2"/><line x1="430" y1="380" x2="430" y2="388" stroke="#1e2a44" stroke-width="2"/><ellipse cx="490" cy="380" rx="18" ry="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="508" cy="373" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="480" y1="390" x2="480" y2="398" stroke="#1e2a44" stroke-width="2"/><line x1="500" y1="390" x2="500" y2="398" stroke="#1e2a44" stroke-width="2"/><ellipse cx="580" cy="345" rx="18" ry="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="598" cy="338" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="570" y1="355" x2="570" y2="363" stroke="#1e2a44" stroke-width="2"/><line x1="590" y1="355" x2="590" y2="363" stroke="#1e2a44" stroke-width="2"/><circle cx="195" cy="280" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M179,314 Q195,286 211,314 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="705" cy="200" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M689,234 Q705,206 721,234 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="720" cy="350" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M704,384 Q720,356 736,384 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="440" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M434,474 Q450,446 466,474 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M215,300 C300,330 470,350 556,345" fill="none" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahO)" stroke-dasharray="8 6"/><text x="60" y="180" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One user adds an animal</text><text x="60" y="204" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and gains the full benefit</text><text x="860" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">The cost of depletion</text><text x="860" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">is shared by everyone</text><rect x="30" y="512" width="260" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="549.61" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Each user acts rationally</text><line x1="292" y1="544" x2="316" y2="544" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="512" width="260" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="549.61" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Everyone takes a little more</text><line x1="582" y1="544" x2="606" y2="544" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="512" width="260" height="64" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="740" y="549.61" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Resource overexploited</text><rect x="30" y="596" width="840" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="60" y="632" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Not inevitable:</text><text x="210" y="632" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">communities with clear boundaries, agreed rules and</text><text x="60" y="660" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">penalties for cheating have managed commons sustainably.</text>
</svg>