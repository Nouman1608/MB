<text x="30" y="118" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Paper 4 · 50 marks</text><rect x="30" y="130" width="420" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: Pre-1900</text><text x="240" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks · one essay</text><rect x="450" y="130" width="420" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: Post-1900</text><text x="660" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><rect x="30" y="130" width="840" height="74" fill="none" stroke="#1e2a44" stroke-width="3"/><text x="30" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assessed on AO1 to AO5, each 20%</text><rect x="30" y="256" width="168" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="114" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><text x="114" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">20%</text><rect x="198" y="256" width="168" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="282" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><text x="282" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">20%</text><rect x="366" y="256" width="168" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><text x="450" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">20%</text><rect x="534" y="256" width="168" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="618" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4</text><text x="618" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">20%</text><rect x="702" y="256" width="168" height="66" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="786" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO5</text><text x="786" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">20%</text><text x="870" y="348" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="end">AO5 draws on the long critical conversation around older texts</text><rect x="30" y="374" width="380" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="407" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION (a)</text><text x="50" y="434" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Essay on the whole text</text><rect x="490" y="374" width="380" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="510" y="407" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUESTION (b)</text><text x="510" y="434" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A passage or poem from the</text><text x="510" y="460" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">text, printed on the paper</text><circle cx="450" cy="430" r="30" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="437" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">or</text><rect x="30" y="504" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="537.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Texts are not allowed in the exam room.</text>
