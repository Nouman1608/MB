<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 756" width="900" height="756" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="756" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One poetry text and one prose text</text>

<rect x="30" y="136" width="400" height="318" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="172" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Pre-1900 prose</text><text x="50" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Austen</text><text x="50" y="237" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Pride and Prejudice</text><text x="50" y="278" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Eliot</text><text x="50" y="301" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Middlemarch</text><text x="50" y="342" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hardy</text><text x="50" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Jude the Obscure</text><rect x="50" y="392" width="360" height="48" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="230" y="423" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">so Section B must be poetry</text><rect x="470" y="136" width="400" height="318" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="172" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Pre-1900 poetry</text><text x="490" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Chaucer</text><text x="490" y="237" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The Wife of Bath’s Prologue and Tale</text><text x="490" y="278" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Shakespeare</text><text x="490" y="301" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Selected Sonnets</text><text x="490" y="342" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Whitman</text><text x="490" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">selected poems from</text><text x="669.1" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Leaves of Grass</text><rect x="490" y="392" width="360" height="48" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="7 5"/><text x="670" y="423" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">so Section B must be prose</text><text x="450" y="124" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">2026 Section A texts</text><rect x="30" y="474" width="840" height="162" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="507" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE FORM RULE</text><text x="50" y="534" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Across Paper 4: one essay on a poetry text and one on a prose text,</text><text x="50" y="560" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">one from each section</text><text x="50" y="589.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Your choice of pre-1900 text decides the form of your post-1900 text. Two prose or two</text><text x="50" y="611.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">poetry texts breaks the rule.</text><rect x="30" y="652" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="685.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">For 2027, Austen’s Mansfield Park replaces Pride and Prejudice and a selection of Byron’s</text><text x="50" y="707.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">poetry replaces Whitman. Check the list for your examination year.</text>
</svg>