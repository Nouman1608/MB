<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The (b) answer on a passage or poem</text>

<line x1="62" y1="140" x2="62" y2="590" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="120" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Locate</text><text x="128" y="185.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Place the passage or poem in the text or sequence.</text><circle cx="62" cy="165" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="173.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="220" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="256" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Thesis</text><text x="128" y="285.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">State it in the question’s terms.</text><circle cx="62" cy="265" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="273.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="320" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="356" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Analyse closely</text><text x="128" y="385.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Voice, syntax, form, imagery; for poetry, metre and rhyme.</text><circle cx="62" cy="365" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="373.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="420" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Link outward</text><text x="128" y="485.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">To the whole novel, or to other poems in the selection.</text><circle cx="62" cy="465" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="473.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="520" width="762" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="556" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">AO5</text><text x="128" y="585.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One or two evaluated alternative readings.</text><circle cx="62" cy="565" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="573.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>