<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Read older texts in their own terms</text>

<rect x="30" y="120" width="330" height="300" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="195" y="156" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Looks like a fault?</text><rect x="50" y="182" width="290" height="33" rx="16.5" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="195" y="204.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a long narrative digression</text><rect x="79.5" y="238" width="231" height="33" rx="16.5" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="195" y="260.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a moralising narrator</text><rect x="79.5" y="294" width="231" height="33" rx="16.5" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="195" y="316.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a strict rhyme scheme</text><rect x="108.5" y="350" width="173" height="33" rx="16.5" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="195" y="372.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">an archaic word</text><line x1="368" y1="270" x2="432" y2="270" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="400" y="252" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><line x1="472" y1="140" x2="472" y2="451" stroke="#c9d6d4" stroke-width="4"/><rect x="518" y="120" width="352" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="538" y="155.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A deliberate choice</text><text x="538" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Usually chosen within the conventions</text><text x="538" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of its time.</text><circle cx="472" cy="174.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="472" y="183.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="518" y="239" width="352" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="538" y="274.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recognise the convention</text><text x="538" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">See it as part of the period’s</text><text x="538" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conventions, not an oddity.</text><circle cx="472" cy="293.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="472" y="302.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="518" y="358" width="352" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="538" y="393.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Analyse how it is used or</text><text x="538" y="418.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">bent</text><text x="538" y="446.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What does the writer do with it here?</text><circle cx="472" cy="414.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="472" y="423.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="493" width="410" height="84" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="526.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Criticising a moralising narrator</text><text x="48" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">treats a convention as a weakness</text><rect x="460" y="493" width="410" height="84" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="526.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Analysing what the narrator does</text><text x="478" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reads the text in its own terms first</text><circle cx="430" cy="501" r="15" fill="#b5602e"/><path d="M424,495 l12,12 m0,-12 l-12,12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="862" cy="501" r="15" fill="#2e6b62"/><path d="M855.25,501.3 l4.8,5.1000000000000005 l9,-9.9" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
</svg>