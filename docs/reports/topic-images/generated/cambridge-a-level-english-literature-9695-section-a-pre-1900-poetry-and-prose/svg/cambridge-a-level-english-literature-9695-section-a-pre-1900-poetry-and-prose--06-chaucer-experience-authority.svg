t-anchor="start">The Prologue</text><text x="50" y="525.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">An extended self-presentation,</text><text x="50" y="547.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">setting experience against written</text><text x="50" y="569.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">authority.</text><rect x="512" y="436" width="358" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="532" y="480" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TALE</text><text x="532" y="507" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">An Arthurian romance</text><text x="532" y="536.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A knight must discover what women</text><text x="532" y="558.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">most desire.</text><path d="M406,501 L494,501" stroke="#1e2a44" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="450" y="529" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">supports</text><text x="450" y="547" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and</text><text x="450" y="565" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">complicates</text><rect x="30" y="612" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="645.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ask how the relationship between teller and tale shapes meaning.</text>
