<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 673" width="900" height="673" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="673" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">AO5: older texts have been read differently</text>

<rect x="30" y="118" width="250" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="166.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Wife of Bath</text><rect x="330" y="126" width="252" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="456" y="155.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a satire of a talkative</text><text x="456" y="176.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">woman</text><text x="600" y="168" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">or</text><rect x="618" y="126" width="252" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="744" y="155.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a voice challenging the</text><text x="744" y="176.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">male authorities</text><line x1="284" y1="162" x2="322" y2="162" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="610" y="168" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="222" width="250" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="270.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The marriage plot</text><rect x="330" y="230" width="252" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="456" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">conservative, rewarding</text><text x="456" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">conformity</text><text x="600" y="272" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">or</text><rect x="618" y="230" width="252" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="744" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">ironic about economic</text><text x="744" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">pressures</text><line x1="284" y1="266" x2="322" y2="266" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="610" y="272" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="326" width="250" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="362.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A tragic narrator</text><text x="46" y="386.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">blames…</text><rect x="330" y="334" width="156" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="408" y="374.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">individuals</text><text x="504" y="376" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">or</text><rect x="522" y="334" width="156" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="600" y="374.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">society</text><text x="696" y="376" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">or</text><rect x="714" y="334" width="156" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="792" y="374.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">fate</text><line x1="284" y1="370" x2="322" y2="370" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="514" y="376" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="30" y="452" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The model paragraph’s method</text><rect x="30" y="466" width="253.33333333333334" height="183" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="494.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Set out two readings</text><text x="44" y="522.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Anti-feminist caricature,</text><text x="44" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or setting “experience”</text><text x="44" y="564.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">against “auctoritee” to</text><text x="44" y="585.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expose the stereotypes.</text><line x1="289.33333333333337" y1="557.5" x2="317.33333333333337" y2="557.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="466" width="253.33333333333334" height="183" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="337.33333333333337" y="494.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Test them against the</text><text x="337.33333333333337" y="518.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">method</text><text x="337.33333333333337" y="546.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">She argues from scripture</text><text x="337.33333333333337" y="567.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and turns the authorities’</text><text x="337.33333333333337" y="588.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">examples against them, yet</text><text x="337.33333333333337" y="609.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">depends on the texts she</text><text x="337.33333333333337" y="630.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resists.</text><line x1="582.6666666666667" y1="557.5" x2="610.6666666666667" y2="557.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="466" width="253.33333333333334" height="183" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="630.6666666666667" y="494.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reach a qualified</text><text x="630.6666666666667" y="518.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">judgement</text><text x="630.6666666666667" y="546.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The poem stages an argument</text><text x="630.6666666666667" y="567.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about who has the right to</text><text x="630.6666666666667" y="588.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">speak about women, rather</text><text x="630.6666666666667" y="609.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">than settling it.</text>
</svg>