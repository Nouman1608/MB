<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 756" width="900" height="756" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="756" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pre-1900 prose: the narrator is the method</text>

<rect x="30" y="116" width="840" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="128" width="250" height="172" rx="10" fill="#f2e7b8"/><rect x="62" y="162" width="120" height="104" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="122" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">story</text><path d="M90.65,256 L93.4,227.4 Q100,221.9 106.6,227.4 L109.35,256 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="100" cy="216.4" r="7.15" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M135.65,256 L138.4,227.4 Q145,221.9 151.6,227.4 L154.35,256 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="145" cy="216.4" r="7.15" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M208.4,264 L212.4,222.4 Q222,214.4 231.6,222.4 L235.6,264 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="222" cy="206.4" r="10.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M238,140 L268,140 Q280,140 280,152 L280,158 Q280,170 268,170 L260,170 L242,186 L246,170 L238,170 Q226,170 226,158 L226,152 Q226,140 238,140 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="253" y="161" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">…</text><text x="316" y="158" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Eliot</text><text x="316" y="186" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Authorial commentary</text><text x="316" y="218" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The narrator steps out of the story to reflect, generalise</text><text x="316" y="240" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and address the reader. These passages widen one character’s</text><text x="316" y="262" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">experience into a claim about human nature or society.</text><rect x="30" y="326" width="840" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="338" width="250" height="172" rx="10" fill="#dce9e7"/><circle cx="137" cy="410" r="50" fill="#b5d3cf" fill-opacity="0.8" stroke="#2e6b62" stroke-width="2.5"/><circle cx="197" cy="410" r="50" fill="#f2e7b8" fill-opacity="0.8" stroke="#8a6d0d" stroke-width="2.5"/><text x="109" y="482" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">character’s</text><text x="109" y="500" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">thoughts</text><text x="225" y="482" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">narrator’s</text><text x="225" y="500" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">voice</text><text x="316" y="368" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Austen</text><text x="316" y="396" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Irony and free indirect style</text><text x="316" y="428" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A character’s thoughts appear in the narrator’s voice, so</text><text x="316" y="450" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the reader shares a view and judges it at once. Ask whose</text><text x="316" y="472" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">opinion a sentence really carries.</text><rect x="30" y="536" width="840" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="548" width="250" height="172" rx="10" fill="#f6e3d6"/><path d="M155.1,674 L158.6,637.6 Q167,630.6 175.4,637.6 L178.9,674 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="167" cy="623.6" r="9.1" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="167" y="576" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">social institutions</text><text x="89" y="700" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">chance</text><text x="235" y="700" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">coincidence</text><line x1="167" y1="584" x2="167" y2="608" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="97" y1="680" x2="137" y2="656" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="237" y1="680" x2="197" y2="656" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="316" y="578" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Hardy</text><text x="316" y="606" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Tragic narration</text><text x="316" y="638" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Characters are placed against forces larger than themselves:</text><text x="316" y="660" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">social institutions, chance and coincidence. Look for</text><text x="316" y="682" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">narration widening from the individual to the system.</text>
</svg>