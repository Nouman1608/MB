<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the family serves capitalism</text>

<line x1="310" y1="175" x2="377.75" y2="249.1" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="299.5" x2="377.75" y2="292.675" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="413.5" x2="377.75" y2="332.575" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="164.5" x2="522.25" y2="245.425" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="299.5" x2="522.25" y2="292.675" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="424" x2="522.25" y2="336.25" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="289" r="85" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="296" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Capitalism</text><g transform="translate(0,10.5)"><rect x="30" y="104" width="280" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reproduces class</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Engels (1884): monogamy so</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">property passes to legitimate</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heirs; inheritance today</text><rect x="30" y="239" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="269.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unit of consumption</text><text x="46" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Buying the latest goods;</text><text x="46" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">children’s “pester power”</text><rect x="30" y="353" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="383.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ideological control</text><text x="46" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Children learn to accept</text><text x="46" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hierarchy and authority</text></g><g transform="translate(0,0)"><rect x="590" y="104" width="280" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Refuge</text><text x="606" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Zaretsky: escape from</text><text x="606" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">alienation makes capitalism</text><text x="606" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bearable</text><rect x="590" y="239" width="280" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="269.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Exploitation</text><text x="606" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Women’s unpaid labour cares</text><text x="606" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for workers at no cost to</text><text x="606" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">employers</text><rect x="590" y="374" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="404.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Frustration absorbed</text><text x="606" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Workers take it out on the</text><text x="606" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">family, not the system</text></g><rect x="30" y="492" width="410" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="525" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="554.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Links family life to economic inequality;</text><text x="50" y="575.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">explains lasting class advantage</text><rect x="460" y="492" width="410" height="108" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="525" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATIONS</text><text x="480" y="554.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores diversity; people seem passive;</text><text x="480" y="575.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plays down love and support; neglects gender</text>
</svg>