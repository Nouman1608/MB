<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 583" width="900" height="583" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="583" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The loss of functions debate</text>

<text x="170" y="130" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Before industrialisation</text><text x="730" y="130" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Taken over by</text><rect x="30" y="150" width="280" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="186.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Family did: Production</text><rect x="590" y="150" width="280" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="186.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Factories</text><line x1="316" y1="182" x2="584" y2="182" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="230" width="280" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="255.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Family did: Formal</text><text x="170" y="277.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">education</text><rect x="590" y="230" width="280" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="266.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Schools</text><line x1="316" y1="262" x2="584" y2="262" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="310" width="280" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="335.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Family did: Health care</text><text x="170" y="357.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">and welfare</text><rect x="590" y="310" width="280" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="346.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The state</text><line x1="316" y1="342" x2="584" y2="342" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="370" y="226" width="160" height="34" rx="17" fill="#f4f6f6"/><text x="450" y="250" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">industrialisation</text><rect x="30" y="400" width="410" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="433" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARSONS</text><text x="50" y="460" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">More specialised</text><text x="50" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The family lost functions but is not less</text><text x="50" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">important: it focuses on socialisation and</text><text x="50" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the warm bath.</text><rect x="460" y="400" width="410" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="433" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FLETCHER (1966)</text><text x="480" y="460" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Functions have grown</text><text x="480" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Families now take a closer interest in</text><text x="480" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">children’s health and education, using state</text><text x="480" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">services.</text>
</svg>