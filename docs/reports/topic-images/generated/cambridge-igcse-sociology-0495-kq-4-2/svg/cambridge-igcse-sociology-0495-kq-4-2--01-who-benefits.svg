1.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">class</text><text x="335.3333333333333" y="278.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="278.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unit of consumption</text><text x="335.3333333333333" y="305.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="305.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ideological control</text><text x="335.3333333333333" y="332.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Key names: Engels,</text><text x="350.5333333333333" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Zaretsky</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="274" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="620.6666666666666" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FEMINISTS</text><text x="620.6666666666666" y="167.2" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Men (patriarchy)</text><text x="620.6666666666666" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Domestic division of</text><text x="635.8666666666667" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labour</text><text x="620.6666666666666" y="246.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dual burden, triple shift</text><text x="620.6666666666666" y="273.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Decision-making, violence</text><text x="620.6666666666666" y="300.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="300.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Key names: Oakley, Bott,</text><text x="635.8666666666667" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Edgell, Dobash</text>
