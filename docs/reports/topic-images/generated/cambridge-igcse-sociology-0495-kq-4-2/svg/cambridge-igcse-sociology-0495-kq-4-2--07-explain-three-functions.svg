<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" width="900" height="511" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="511" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An “explain three” answer</text>

<rect x="30" y="104" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUESTION</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain three functions the family performs for society.</text><text x="154.66666666666669" y="227" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Identify</text><text x="450.00000000000006" y="227" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Develop</text><text x="745.3333333333334" y="227" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Link to society</text><rect x="30" y="243" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Primary socialisation</text><line x1="285.33333333333337" y1="278" x2="319.33333333333337" y2="278" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="243" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341.33333333333337" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parents teach language,</text><text x="341.33333333333337" y="292.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">norms and values (Parsons)</text><line x1="580.6666666666667" y1="278" x2="614.6666666666667" y2="278" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="243" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children grow up able to</text><text x="636.6666666666667" y="292.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fit into society</text><rect x="30" y="327" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economic function</text><line x1="285.33333333333337" y1="362" x2="319.33333333333337" y2="362" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="327" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341.33333333333337" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families pool income; food</text><text x="341.33333333333337" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and shelter; spending</text><line x1="580.6666666666667" y1="362" x2="614.6666666666667" y2="362" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="327" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Keeps the economy going</text><rect x="30" y="411" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="439.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stabilising adults</text><line x1="285.33333333333337" y1="446" x2="319.33333333333337" y2="446" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="411" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341.33333333333337" y="439.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The “warm bath” relaxes</text><text x="341.33333333333337" y="460.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stressed workers</text><line x1="580.6666666666667" y1="446" x2="614.6666666666667" y2="446" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="411" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="439.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tensions do not spill into</text><text x="636.6666666666667" y="460.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wider society</text>
</svg>