<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 533" width="900" height="533" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="533" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Strengths and limitations of the three views</text>

<rect x="30" y="104" width="180" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">View</text><rect x="210" y="104" width="310" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="222" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="520" y="104" width="350" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="532" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="30" y="150" width="180" height="106" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalism</text><rect x="210" y="150" width="310" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explains why some kind of family</text><text x="222" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">exists almost everywhere;</text><text x="222" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recognises its emotional</text><text x="222" y="238.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">importance</text><rect x="520" y="150" width="350" height="106" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="532" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Assumes all benefit equally; ignores</text><text x="532" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conflict, abuse and diversity; warm</text><text x="532" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bath assumes a male breadwinner</text><rect x="30" y="256" width="180" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="281.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Marxism</text><rect x="210" y="256" width="310" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="222" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Links family life to wider</text><text x="222" y="302.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">economic inequality</text><rect x="520" y="256" width="350" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="532" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ignores diversity; people seem passive;</text><text x="532" y="302.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">plays down love; neglects gender</text><rect x="30" y="320" width="180" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="345.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Feminism</text><rect x="210" y="320" width="310" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Exposes inequality and abuse;</text><text x="222" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">influenced laws on domestic</text><text x="222" y="387.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">violence</text><rect x="520" y="320" width="350" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="532" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May generalise about all women;</text><text x="532" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">overlooks shared roles; underplays</text><text x="532" y="387.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">women’s changing choices</text><rect x="30" y="423" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="456.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Include at least one internal limitation for each view, not just another perspective’s</text><text x="50" y="478.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">criticism.</text>
</svg>