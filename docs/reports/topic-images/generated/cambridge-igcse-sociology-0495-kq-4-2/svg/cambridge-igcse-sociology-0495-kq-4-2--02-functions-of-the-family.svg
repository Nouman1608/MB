<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the family does: functionalist views</text>

<text x="450" y="130" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Murdock (1949): four functions of the universal nuclear family</text><rect x="30" y="146" width="201" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130.5" y="181.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sexual</text><text x="130.5" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">regulating sexual</text><text x="130.5" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">behaviour in a</text><text x="130.5" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">stable relationship</text><rect x="243" y="146" width="201" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.5" y="181.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reproductive</text><text x="343.5" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">producing the next</text><text x="343.5" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">generation</text><rect x="456" y="146" width="201" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.5" y="181.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic</text><text x="556.5" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">pooling resources;</text><text x="556.5" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">food and shelter</text><rect x="669" y="146" width="201" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769.5" y="181.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Educational</text><text x="769.5" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">socialising</text><text x="769.5" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">children into norms</text><text x="769.5" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and values</text><text x="450" y="326" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">Parsons: two basic and irreducible functions</text><rect x="30" y="342" width="410" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="378" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary socialisation</text><text x="235" y="407.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">of children</text><rect x="460" y="342" width="410" height="116" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="378" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Stabilisation of adult</text><text x="665" y="404" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">personalities</text><text x="665" y="433.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the “warm bath”</text><rect x="30" y="476" width="249.33333333333334" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="154.66666666666669" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Stressed worker comes</text><text x="154.66666666666669" y="529.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">home</text><line x1="285.33333333333337" y1="525.5" x2="319.33333333333337" y2="525.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="476" width="249.33333333333334" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Family helps them relax</text><text x="450.00000000000006" y="529.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and recover</text><line x1="580.6666666666667" y1="525.5" x2="614.6666666666667" y2="525.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="476" width="249.33333333333334" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745.3333333333334" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Tension released</text><text x="745.3333333333334" y="529.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">harmlessly, not</text><text x="745.3333333333334" y="550.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">disrupting society</text>
</svg>