<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" width="900" height="643" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Feminist views: inequality inside the family</text>

<text x="30" y="130" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Dual burden</text><rect x="230" y="110" width="300" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="380" y="145" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paid work</text><rect x="530" y="110" width="300" height="56" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="680" y="145" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Most of the housework</text><text x="30" y="206" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Triple shift</text><text x="30" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Duncombe and</text><text x="30" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Marsden (1995)</text><rect x="230" y="186" width="200" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="221" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paid work</text><rect x="430" y="186" width="200" height="56" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="530" y="221" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Housework</text><rect x="630" y="186" width="200" height="56" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="221" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Emotion work</text><text x="730" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">keeping relationships happy</text><text x="450" y="320" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Bott (1957): conjugal roles</text><rect x="30" y="336" width="410" height="131" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="372" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Segregated</text><text x="50" y="400.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Husband and wife have separate tasks and</text><text x="50" y="421.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">leisure</text><rect x="460" y="336" width="410" height="131" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="372" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Joint</text><text x="480" y="400.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tasks and leisure are shared; feminists</text><text x="480" y="421.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">argue apparently joint roles often hide</text><text x="480" y="442.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">continuing inequality</text><rect x="30" y="485" width="270.6666666666667" height="130" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="520.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Oakley</text><text x="50" y="548.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Housewives did most</text><text x="50" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">domestic work; husbands’</text><text x="50" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">help limited</text><rect x="314.6666666666667" y="485" width="270.6666666666667" height="130" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="334.6666666666667" y="520.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Edgell (1980)</text><text x="334.6666666666667" y="548.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Most important decisions</text><text x="334.6666666666667" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">usually made or dominated</text><text x="334.6666666666667" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by husbands</text><rect x="599.3333333333334" y="485" width="270.6666666666667" height="130" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="619.3333333333334" y="520.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Dobash (1979)</text><text x="619.3333333333334" y="548.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Violence linked to men</text><text x="619.3333333333334" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">asserting authority</text>
</svg>