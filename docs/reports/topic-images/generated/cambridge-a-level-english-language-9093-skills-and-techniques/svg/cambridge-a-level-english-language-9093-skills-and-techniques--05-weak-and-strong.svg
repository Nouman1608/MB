<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two treatments of the same evidence</text>

<rect x="40" y="115" width="820" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="64" y="150" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Weak</text><text x="64" y="182" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The writer says "the council has once again failed residents".</text><text x="64" y="208" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">This shows the writer is angry.</text><rect x="40" y="265" width="820" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="300" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Strong</text><rect x="64" y="318" width="110" height="41" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="119" y="344.5" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">NAMES</text><text x="190" y="344.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The adverbial "once again"</text><rect x="64" y="369" width="110" height="64" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="119" y="407" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">EFFECT</text><text x="190" y="395.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">turns a single decision into a pattern, so the council's "failure"</text><text x="190" y="418.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">reads as characteristic rather than accidental;</text><rect x="64" y="443" width="110" height="64" rx="8" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="119" y="481" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">ARGUMENT</text><text x="190" y="469.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">this supports the article's wider strategy of presenting residents</text><text x="190" y="492.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">as long-suffering and officials as indifferent.</text>
</svg>