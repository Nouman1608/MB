<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the skills are tested: Paper 1</text>

<rect x="40" y="115" width="400" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: Question 1</text><text x="240" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">25 marks, one unseen text</text><rect x="64" y="195" width="352" height="120" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="80" y="225" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1(a)  10 marks</text><text x="80" y="252" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">directed response, 150-200 words, for a</text><text x="80" y="272" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">set form, purpose and audience</text><text x="80" y="300" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AO1, AO2</text><line x1="240" y1="317" x2="240" y2="345" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="254" y="337" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">compare with the source</text><rect x="64" y="350" width="352" height="125" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="380" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1(b)  15 marks</text><text x="80" y="407" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">compare form, structure and language of</text><text x="80" y="427" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">your 1(a) response with the original</text><text x="80" y="458" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AO1, AO3</text><rect x="460" y="115" width="400" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="660" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: Question 2</text><text x="660" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">25 marks, a second unseen text</text><rect x="484" y="195" width="352" height="280" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="500" y="225" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Question 2  25 marks</text><text x="500" y="252" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">comment on the form, structure and</text><text x="500" y="272" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">language of the text</text><text x="500" y="300" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AO1, AO3</text><text x="450" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Each unseen text is about 550-750 words.</text><rect x="40" y="540" width="260" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="555" width="64" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="84" y="584" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><text x="128" y="573" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reading and</text><text x="128" y="592" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">understanding a wide</text><text x="128" y="611" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">variety of texts</text><rect x="320" y="540" width="260" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="332" y="555" width="64" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="364" y="584" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><text x="408" y="573" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">writing effectively</text><text x="408" y="592" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">for audiences and</text><text x="408" y="611" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">purposes</text><rect x="600" y="540" width="260" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="612" y="555" width="64" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="644" y="584" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><text x="688" y="573" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">analysing how choices</text><text x="688" y="592" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">produce meaning and</text><text x="688" y="611" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">style</text>
</svg>