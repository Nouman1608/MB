<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the unseen text in two passes</text>

<rect x="40" y="120" width="380" height="230" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><circle cx="80" cy="160" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="167.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="115" y="168" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">First pass</text><text x="64" y="210" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">read for gist and situation</text><text x="64" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• what form is this?</text><text x="64" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• who wrote it, for whom?</text><text x="64" y="297" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• and why?</text><line x1="422" y1="235" x2="476" y2="235" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="480" y="120" width="380" height="230" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><circle cx="520" cy="160" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="520" y="167.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="555" y="168" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Second pass</text><text x="504" y="210" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="start">read with a pen, marking shifts</text><text x="504" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• in tone</text><text x="504" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• in time or focus</text><text x="504" y="297" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• in sentence pattern</text><rect x="40" y="375" width="820" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Before annotating, write one sentence:</text><text x="64" y="446" font-size="19" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">This [form] for [audience] aims to [purpose].</text><text x="64" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Everything you later say about language must connect to that sentence.</text>
</svg>