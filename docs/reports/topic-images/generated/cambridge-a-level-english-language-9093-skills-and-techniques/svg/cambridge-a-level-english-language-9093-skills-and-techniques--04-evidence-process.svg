<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From quotation to argument</text>

<rect x="40" y="120" width="152" height="190" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="116" cy="152" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="116" y="158.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="116" y="198" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Select</text><text x="116" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the smallest</text><text x="116" y="245" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">piece of text</text><text x="116" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">that carries the</text><text x="116" y="283" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">effect</text><line x1="193" y1="205" x2="205" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="206" y="120" width="152" height="190" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="282" cy="152" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="282" y="158.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="282" y="198" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Embed</text><text x="282" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">in your own</text><text x="282" y="245" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">grammatical</text><text x="282" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">sentence</text><line x1="359" y1="205" x2="371" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="372" y="120" width="152" height="190" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="448" cy="152" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="448" y="158.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="448" y="198" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Link</text><text x="448" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">with a precise</text><text x="448" y="245" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">analytical verb</text><line x1="525" y1="205" x2="537" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="538" y="120" width="152" height="190" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="614" cy="152" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="614" y="158.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="614" y="198" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interpret</text><text x="614" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">what it does for</text><text x="614" y="245" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">this reader in</text><text x="614" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">this context</text><line x1="691" y1="205" x2="703" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="704" y="120" width="152" height="190" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="780" cy="152" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="780" y="158.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="780" y="198" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Integrate</text><text x="780" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">back to your</text><text x="780" y="245" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">overall reading</text><text x="780" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">of the text</text><rect x="40" y="335" width="820" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="370" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Linking verbs that name the type of effect</text><rect x="64" y="390" width="180" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="154" y="417" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">suggests</text><rect x="260" y="390" width="180" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="350" y="417" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">implies</text><rect x="456" y="390" width="180" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="546" y="417" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">foregrounds</text><rect x="652" y="390" width="180" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="742" y="417" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">undercuts</text><rect x="64" y="440" width="180" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="154" y="467" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">positions</text><rect x="260" y="440" width="180" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="350" y="467" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">intensifies</text><rect x="456" y="440" width="180" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="546" y="467" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">softens</text><rect x="652" y="440" width="180" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="742" y="467" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">distances</text><text x="450" y="525" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Avoid "shows" every time: it tells the examiner nothing about the type of effect.</text>
</svg>