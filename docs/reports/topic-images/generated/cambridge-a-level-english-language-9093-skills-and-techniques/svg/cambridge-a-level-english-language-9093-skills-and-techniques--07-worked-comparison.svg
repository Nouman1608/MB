<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 677" width="900" height="677" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="677" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same content, different style: comparing</text>

<rect x="220" y="112" width="310" height="52" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="375" y="136" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Source</text><text x="375" y="156" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">reflective magazine column</text><rect x="550" y="112" width="310" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="136" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">My response</text><text x="705" y="156" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">library website notice</text><text x="40" y="205.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><rect x="220" y="176" width="310" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236" y="205.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">evoke a mood</text><rect x="550" y="176" width="310" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="566" y="205.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">inform users of new hours</text><text x="40" y="273" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><rect x="220" y="233" width="310" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236" y="273" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">builds a scene</text><rect x="550" y="233" width="310" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="566" y="262.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">headline, then dates and times</text><text x="566" y="283.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">first</text><text x="40" y="361.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sentences</text><rect x="220" y="311" width="310" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236" y="340.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lengthen into a cumulative final</text><text x="236" y="361.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">clause: "as though reluctant to</text><text x="236" y="382.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">let the day end"</text><rect x="550" y="311" width="310" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="566" y="340.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">short declaratives and one</text><text x="566" y="361.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">polite imperative: "Please</text><text x="566" y="382.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">return"</text><text x="40" y="460.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Devices</text><rect x="220" y="410" width="310" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236" y="439.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sensory detail ("the radiators</text><text x="236" y="460.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">tick"); personified silence that</text><text x="236" y="481.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"settles"</text><rect x="550" y="410" width="310" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="566" y="460.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">plain, practical lexis</text><text x="40" y="549" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Attitude to quiet</text><rect x="220" y="509" width="310" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236" y="549" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">an experience to feel</text><rect x="550" y="509" width="310" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="566" y="538.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a practical benefit: "ideal for</text><text x="566" y="559.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">focused study"</text><rect x="40" y="591" width="820" height="64" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="630" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Compare point by point, quote both texts, and tie each difference to audience and purpose.</text>
</svg>