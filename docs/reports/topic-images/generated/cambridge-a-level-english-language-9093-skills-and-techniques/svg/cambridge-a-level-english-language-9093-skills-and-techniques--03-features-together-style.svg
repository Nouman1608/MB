<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Features work together</text>

<rect x="40" y="125" width="280" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="162" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">second-person address</text><path d="M320,155 C380,155 390,235 440,235" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="40" y="205" width="280" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="242" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">present tense</text><path d="M320,235 C380,235 390,235 440,235" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="40" y="285" width="280" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="322" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">short imperatives</text><path d="M320,315 C380,315 390,235 440,235" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="440" y1="235" x2="480" y2="235" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="486" y="175" width="374" height="120" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="673" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">one effect:</text><text x="673" y="258" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">urgency directed at the reader</text><text x="450" y="395" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Overall style: a summary judgement you can defend</text><rect x="40" y="415" width="260" height="54" rx="27" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="170" y="448" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"conversational but authoritative"</text><rect x="320" y="415" width="260" height="54" rx="27" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="450" y="448" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"detached and clinical"</text><rect x="600" y="415" width="260" height="54" rx="27" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="730" y="448" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"warm, nostalgic and gently comic"</text><rect x="40" y="490" width="400" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="525" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Judgement without examples</text><text x="64" y="555" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is assertion</text><rect x="460" y="490" width="400" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="525" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Examples without a judgement</text><text x="484" y="555" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">are a list</text>
