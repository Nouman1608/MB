<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same style or different style?</text>

<rect x="40" y="115" width="400" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="54" y="129" width="372" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="240" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Writing in the same style</text><rect x="64" y="200" width="170" height="76" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="149" y="230" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">KEEP</text><text x="149" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">features</text><rect x="246" y="200" width="170" height="76" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="331" y="230" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">CHANGE</text><text x="331" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">the words</text><text x="64" y="316" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">List the source's fingerprints first:</text><text x="64" y="338" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">• sentence length and type</text><text x="64" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">• register, person, tense</text><text x="64" y="382" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">• characteristic devices</text><text x="64" y="404" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">then write new sentences that share them.</text><rect x="460" y="115" width="400" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="474" y="129" width="372" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="660" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Writing in a different style</text><rect x="484" y="200" width="170" height="76" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="569" y="230" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">KEEP</text><text x="569" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">content</text><rect x="666" y="200" width="170" height="76" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="751" y="230" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">CHANGE</text><text x="751" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">the style</text><text x="484" y="316" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Fit a new form, purpose and audience.</text><text x="484" y="338" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The test is transformation: readers get</text><text x="484" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the relevant information in a form that</text><text x="484" y="382" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">suits them, not a paraphrase of the</text><text x="484" y="404" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">original.</text><rect x="40" y="515" width="820" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="556" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Plan 1(b) while writing 1(a): each deliberate choice becomes a point of comparison.</text>
</svg>