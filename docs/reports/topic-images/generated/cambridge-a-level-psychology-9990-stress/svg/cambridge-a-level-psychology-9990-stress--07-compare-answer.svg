<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="486" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A 4-mark comparison</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Biofeedback v stress inoculation training</text>
<rect x="30" y="124" width="840" height="83" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SIMILARITY (1)</text><text x="450" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Both teach a skill the person can use without a therapist after training</text><rect x="30" y="223" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="236.5" y="265.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BIOFEEDBACK (1)</text><text x="236.5" y="291.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Targets the body’s response</text><text x="236.5" y="320.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a device shows muscle tension or heart rate</text><rect x="457" y="223" width="413" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="663.5" y="255" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">SIT (1)</text><text x="663.5" y="281.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Targets thinking</text><text x="663.5" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">coping self-talk and problem-solving in three</text><text x="663.5" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">phases</text><rect x="30" y="371" width="840" height="83" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="403" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">CONSEQUENCE (1)</text><text x="450" y="429.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">SIT may deal with the source of stress; biofeedback mainly reduces physical symptoms</text>
</svg>