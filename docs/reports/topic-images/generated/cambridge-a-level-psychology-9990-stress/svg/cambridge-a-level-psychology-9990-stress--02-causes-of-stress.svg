<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 749" width="900" height="749" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="749" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Causes of stress</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Life events, work and Type A personality</text>
<rect x="30" y="124" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="160" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">HOLMES AND RAHE: SOCIAL READJUSTMENT RATING SCALE (43 LIFE EVENTS)</text><line x1="80" y1="224" x2="820" y2="224" stroke="#1e2a44" stroke-width="4"/><line x1="80" y1="214" x2="80" y2="234" stroke="#1e2a44" stroke-width="3"/><text x="80" y="258" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><line x1="450" y1="214" x2="450" y2="234" stroke="#1e2a44" stroke-width="3"/><text x="450" y="258" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">50</text><line x1="820" y1="214" x2="820" y2="234" stroke="#1e2a44" stroke-width="3"/><text x="820" y="258" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">100</text><rect x="387.672" y="174" width="124.656" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="450" y="194.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Marriage: 50</text><rect x="614.032" y="174" width="201.968" height="30" rx="15" fill="#f6e3d8" stroke="#b5602e" stroke-width="2"/><text x="715.0160000000001" y="194.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Death of a spouse: 100</text><text x="80" y="258" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="450" y="294" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">life change units (LCUs): how much readjustment an event demands</text><rect x="30" y="346" width="397" height="59" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="228.5" y="380.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sum LCUs over the past year</text><line x1="433" y1="375.5" x2="467" y2="375.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="346" width="397" height="59" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="671.5" y="380.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Higher total → greater risk of illness</text><rect x="30" y="427" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="460.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Positive events count too: the scale measures <tspan font-weight="700" fill="#1e2a44">change</tspan>, not unpleasantness.</text><rect x="30" y="507" width="413" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="539" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WORK: CHANDOLA ET AL. (2008)</text><text x="50" y="565.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Whitehall II civil servants</text><text x="50" y="593.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="593.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Work stress linked to coronary heart disease</text><text x="50" y="619.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="619.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stronger in younger workers</text><text x="50" y="645.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="645.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Via health behaviours and biological changes</text><text x="50" y="671.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="671.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Large</tspan> <tspan font-style="italic">longitudinal</tspan> <tspan font-style="italic">sample;</tspan> <tspan font-style="italic">one</tspan> <tspan font-style="italic">occupational</tspan></text><text x="65.2" y="692.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">group</tspan></text><rect x="457" y="507" width="413" height="210" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="539" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TYPE A: FRIEDMAN AND ROSENMAN</text><text x="477" y="565.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Competitive, time-urgent, hostile</text><text x="477" y="593.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="593.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Type B: more relaxed</text><text x="477" y="619.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="619.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Western Collaborative Group Study: Type A</text><text x="492.2" y="640.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">men about <tspan font-weight="700" fill="#1e2a44">twice</tspan> as likely to develop coronary</text><text x="492.2" y="661.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heart disease</text><text x="477" y="687.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="687.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hostility may be the most harmful part</text>
</svg>