<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 522" width="900" height="522" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="522" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stress inoculation training</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Meichenbaum: prepare to cope before stress becomes a problem</text>
<line x1="60" y1="144" x2="60" y2="390" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conceptualisation</text><text x="122" y="187.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Client and therapist explore the client’s stressors and how they think about them.</text><circle cx="60" cy="167" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="175.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="224" width="766" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="257.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Skill acquisition and rehearsal</text><text x="122" y="287.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Learn and practise coping skills: relaxation, positive self-talk, problem-solving.</text><circle cx="60" cy="267" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="275.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="324" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="357.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Application and follow-through</text><text x="122" y="387.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Use the skills in increasingly stressful real situations, with follow-up sessions.</text><circle cx="60" cy="367" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="375.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="432" width="840" height="58" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="465.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Like a vaccine preparing the body for infection, SIT prepares the person before stress strikes.</text>
</svg>