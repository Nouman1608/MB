<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 904" width="900" height="904" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="904" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Bridge et al. (1988)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Relaxation and imagery during radiotherapy for early breast cancer</text>
<rect x="30" y="124" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,124 H200 V194 H44 A14,14 0 0 1 30,180 V138 A14,14 0 0 1 44,124 Z" fill="#f2e7b8"/><rect x="30" y="124" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="162.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Aim</text><text x="216" y="152.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">To test whether relaxation and imagery reduce stress in women receiving</text><text x="216" y="173.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">radiotherapy for early breast cancer</text><rect x="30" y="204" width="840" height="56" rx="14" fill="#ffffff"/><path d="M44,204 H200 V260 H44 A14,14 0 0 1 30,246 V218 A14,14 0 0 1 44,204 Z" fill="#b5d3cf"/><rect x="30" y="204" width="840" height="56" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="235.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Design</text><text x="216" y="236.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Randomised controlled trial lasting six weeks; <tspan font-weight="700" fill="#1e2a44">154</tspan> <tspan font-weight="700" fill="#1e2a44">women</tspan>, 15 dropped out</text><rect x="30" y="282" width="272" height="155" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="166" y="314" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CONTROL</text><text x="166" y="340.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Talk about themselves</text><text x="166" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">mood worsened</text><rect x="314" y="282" width="272" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="314" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RELAXATION</text><text x="450" y="340.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Concentrate on muscle</text><text x="450" y="363.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">groups</text><text x="450" y="391.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">mood disturbance lower</text><rect x="598" y="282" width="272" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="734" y="314" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RELAXATION + IMAGERY</text><text x="734" y="340.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Also imagine a peaceful</text><text x="734" y="363.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">scene</text><text x="734" y="391.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">lower, and more relaxed than</text><text x="734" y="412.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">relaxation only</text><rect x="30" y="459" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,459 H200 V529 H44 A14,14 0 0 1 30,515 V473 A14,14 0 0 1 44,459 Z" fill="#b5d3cf"/><rect x="30" y="459" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="497.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Procedure</text><text x="216" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intervention groups had tapes; practise at least 15 minutes a day. Standardised</text><text x="216" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mood questionnaires at the start and after six weeks</text><rect x="30" y="539" width="840" height="99" rx="14" fill="#fbf7e6"/><path d="M44,539 H200 V638 H44 A14,14 0 0 1 30,624 V553 A14,14 0 0 1 44,539 Z" fill="#d4b02e"/><rect x="30" y="539" width="840" height="99" rx="14" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="591.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Results</text><text x="216" y="567.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="567.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Total mood disturbance significantly lower in both intervention groups</text><text x="216" y="592.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="592.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women aged 55 and over benefited most</text><text x="216" y="617.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="617.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">No</tspan> difference on separate depression and anxiety scales</text><rect x="30" y="648" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,648 H200 V718 H44 A14,14 0 0 1 30,704 V662 A14,14 0 0 1 44,648 Z" fill="#2e6b62"/><rect x="30" y="648" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="686.44" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Conclusion</text><text x="216" y="676.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Brief relaxation and imagery training can reduce mood disturbance during cancer</text><text x="216" y="697.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treatment</text><rect x="30" y="740" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="772" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="798.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Causal conclusions</text><text x="50" y="826.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Random allocation and a control group.</text><rect x="457" y="740" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="772" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="798.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Specific sample; ethics</text><text x="477" y="826.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Women with early breast cancer only; control</text><text x="477" y="847.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">had less support, though some attention.</text>
</svg>