<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" width="900" height="684" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="684" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Biofeedback</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Budzynski et al. (1969): forehead (frontalis) muscle tension measured by EMG</text>
<rect x="300" y="124" width="300" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Device measures a body</text><text x="450" y="175.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">process</text><text x="450" y="203" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">muscle tension, heart rate or skin</text><text x="450" y="223" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">temperature</text><rect x="600" y="274" width="270" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="309.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shown as a sound or visual</text><text x="735" y="332.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">signal</text><rect x="300" y="414" width="300" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="449.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Person relaxes to change the</text><text x="450" y="472.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">signal</text><rect x="30" y="274" width="270" height="84" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="307.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Signal falls: rewarding</text><text x="165" y="335" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">learning is reinforced</text><path d="M600,184 Q720,194 735,268" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M735,364 Q720,444 606,454" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M300,454 Q180,444 165,364" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M165,268 Q180,194 294,184" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="450" y="324" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">with practice:</text><text x="450" y="346" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">control without</text><text x="450" y="368" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">the device</text><rect x="30" y="520" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="552" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="578.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No side effects</text><text x="50" y="606.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A skill the person can use alone.</text><rect x="457" y="520" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="552" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="578.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Equipment; symptoms only</text><text x="477" y="606.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Needs equipment and practice; treats symptoms,</text><text x="477" y="627.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not the source of stress.</text>
</svg>