<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="572" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two stress pathways</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Both start when the hypothalamus responds to a perceived stressor</text>
<rect x="250" y="124" width="400" height="60" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Stressor perceived → hypothalamus</text><text x="230" y="252" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">FAST: SYMPATHOMEDULLARY PATHWAY</text><text x="670" y="252" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SLOWER: HPA AXIS</text><line x1="330" y1="188" x2="250" y2="226" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="188" x2="650" y2="226" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="268" width="400" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="296.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Adrenal medulla</text><line x1="230" y1="320" x2="230" y2="350" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="355" width="400" height="47" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="383.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Adrenaline and noradrenaline</text><line x1="230" y1="407" x2="230" y2="437" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="442" width="400" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="470.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Heart rate, blood pressure and breathing</text><text x="230" y="493.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">rate rise</text><text x="230" y="521.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">fight or flight</text><rect x="470" y="268" width="400" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="670" y="296.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pituitary gland releases ACTH</text><line x1="670" y1="320" x2="670" y2="350" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="355" width="400" height="47" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="383.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Adrenal cortex releases cortisol</text><line x1="670" y1="407" x2="670" y2="437" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="442" width="400" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="470.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Glucose released for energy</text><text x="670" y="498.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">long-term: immune system suppressed</text>
</svg>