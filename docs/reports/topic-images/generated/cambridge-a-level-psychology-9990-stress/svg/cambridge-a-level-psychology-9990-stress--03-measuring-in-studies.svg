<rect width="900" height="886" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring stress in two studies</text>

<rect x="30" y="100" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="136" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">WANG ET AL. (2005): STRESSFUL MENTAL ARITHMETIC</text><rect x="54" y="160" width="220" height="107" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="184" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BIOLOGICAL</text><text x="164" y="209.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">fMRI: more blood flow</text><text x="164" y="230.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">in right prefrontal</text><text x="164" y="251.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">cortex</text><rect x="626" y="160" width="220" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="736" y="191.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BIOLOGICAL</text><text x="736" y="216.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Salivary cortisol</text><rect x="340" y="296" width="220" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="327.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PSYCHOLOGICAL</text><text x="450" y="352.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-reported stress</text><line x1="276" y1="205" x2="304" y2="220" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="624" y1="205" x2="596" y2="220" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="292" x2="450" y2="262" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="310" y="196" width="280" height="61" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="231.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Stress response</text><rect x="30" y="422" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="455.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The three measures related to each other: combining them strengthens validity.</text><rect x="30" y="502" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="538" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">EVANS AND WENER (2007): TRAIN COMMUTERS AND SALIVARY CORTISOL</text><rect x="60" y="562" width="360" height="110" rx="12" fill="#eef1f0" stroke="#1e2a44" stroke-width="2.5"/><circle cx="100" cy="592" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="100" cy="642" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="156" cy="592" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="156" cy="642" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="212" cy="592" r="16" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="212" cy="642" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="268" cy="592" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="268" cy="642" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="324" cy="592" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="324" cy="642" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="380" cy="592" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="380" cy="642" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="240" y="702" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Many people close to the seat</text><text x="240" y="726" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">higher cortisol</text><rect x="480" y="562" width="360" height="110" rx="12" fill="#eef1f0" stroke="#1e2a44" stroke-width="2.5"/><circle cx="520" cy="592" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="520" cy="642" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="576" cy="592" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="576" cy="642" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="632" cy="592" r="16" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="632" cy="642" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="688" cy="592" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="688" cy="642" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="744" cy="592" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="744" cy="642" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="800" cy="592" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="800" cy="642" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="660" y="702" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Few people close to the seat</text><text x="660" y="726" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">lower cortisol</text><rect x="30" y="774" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="807.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Rust seat = the commuter; gold = other passengers. Density <tspan font-weight="700" fill="#1e2a44">near</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">seat</tspan> mattered more than</text><text x="450" y="829.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">overall crowding.</text>
</svg>