<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" width="900" height="574" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="574" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a data type decides</text>

<rect x="330" y="110" width="240" height="70" rx="35" fill="#1e2a44"/><text x="450" y="153" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Data type</text><path d="M450,180 C450,205 164,200 164,224" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="230" width="268" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="270" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="277.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="98" y="266" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Which values are</text><text x="98" y="290" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">allowed</text><text x="52" y="338" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An integer variable cannot</text><text x="52" y="359" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hold 2.5 or "hello".</text><path d="M450,180 C450,205 450,200 450,224" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="316" y="230" width="268" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="352" cy="270" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="352" y="277.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="384" y="266" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Which operations</text><text x="384" y="290" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">make sense</text><text x="338" y="338" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Multiply two integers, join</text><text x="338" y="359" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">two strings; multiplying two</text><text x="338" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">names has no meaning.</text><path d="M450,180 C450,205 736,200 736,224" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="602" y="230" width="268" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="638" cy="270" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="638" y="277.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="670" y="266" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How the value is</text><text x="670" y="290" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">stored</text><text x="624" y="338" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Everything is binary; the type</text><text x="624" y="359" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">says how to read the pattern:</text><text x="624" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a number or a character?</text><rect x="624" y="404" width="24" height="34" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><text x="636" y="428" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">1</text><rect x="652" y="404" width="24" height="34" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><text x="664" y="428" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">0</text><rect x="680" y="404" width="24" height="34" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><text x="692" y="428" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">0</text><rect x="708" y="404" width="24" height="34" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><text x="720" y="428" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">1</text><rect x="736" y="404" width="24" height="34" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><text x="748" y="428" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">0</text><rect x="764" y="404" width="24" height="34" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><text x="776" y="428" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">0</text><rect x="792" y="404" width="24" height="34" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><text x="804" y="428" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">1</text><rect x="820" y="404" width="24" height="34" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><text x="832" y="428" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">0</text><rect x="30" y="480" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="520" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">"Why do programs need data types?" Link the type to its operations and its storage.</text>
</svg>