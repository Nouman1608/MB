<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing a data type</text>

<rect x="100" y="110" width="400" height="60" rx="30" fill="#1e2a44"/><text x="300" y="146" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Only two possible states?</text><line x1="500" y1="140" x2="640" y2="140" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="570" y="128" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">yes</text><rect x="650" y="118" width="180" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="740" y="146" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Boolean</text><line x1="300" y1="170" x2="300" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="324" y="202" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><rect x="100" y="222" width="400" height="60" rx="30" fill="#1e2a44"/><text x="300" y="258" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Will you ever do arithmetic on it?</text><line x1="500" y1="252" x2="622" y2="252" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="562" y="240" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">yes</text><rect x="633" y="222" width="230" height="60" rx="30" fill="#1e2a44"/><text x="748" y="258" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Fractional part?</text><line x1="710" y1="282" x2="650" y2="344" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="660" y="314" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><line x1="785" y1="282" x2="830" y2="344" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="842" y="304" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">yes</text><rect x="560" y="350" width="150" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="635" y="378" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Integer</text><rect x="760" y="350" width="120" height="44" rx="22" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2.5"/><text x="820" y="378" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="middle">Real</text><text x="635" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">you count it</text><text x="820" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">you measure it</text><line x1="300" y1="282" x2="300" y2="334" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="324" y="314" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><rect x="100" y="334" width="400" height="60" rx="30" fill="#1e2a44"/><text x="300" y="370" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Exactly one symbol?</text><line x1="200" y1="394" x2="160" y2="450" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="150" y="418" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">yes</text><line x1="400" y1="394" x2="440" y2="450" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="444" y="426" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><rect x="80" y="456" width="160" height="44" rx="22" fill="#f4e1d4" stroke="#b5602e" stroke-width="2.5"/><text x="160" y="484" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Character</text><rect x="370" y="456" width="140" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="440" y="484" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">String</text><text x="160" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">'G', 'Q'</text><text x="440" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">IDs, phone numbers, names</text><rect x="30" y="556" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="596" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Watch for traps: leading zeros, single-letter codes, yes/no fields and money.</text>
</svg>