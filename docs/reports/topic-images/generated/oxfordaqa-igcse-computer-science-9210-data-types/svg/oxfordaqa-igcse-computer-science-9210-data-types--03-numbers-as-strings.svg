<rect width="900" height="683" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Numbers that should be strings</text>

<rect x="30" y="110" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Telephone number</text><rect x="54" y="168" width="110" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="109" y="191" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">String</text><text x="180" y="194" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">07700900123</text><rect x="480" y="168" width="110" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="535" y="191" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Integer</text><text x="606" y="194" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#b5602e" text-anchor="start">7700900123</text><text x="606" y="226" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">leading zero lost</text><text x="450" y="194" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">vs</text><rect x="30" y="258" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="294" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Student ID</text><rect x="54" y="316" width="110" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="109" y="339" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">String</text><text x="180" y="342" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">00452</text><rect x="480" y="316" width="110" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="535" y="339" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Integer</text><text x="606" y="342" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="24" font-weight="700" fill="#b5602e" text-anchor="start">452</text><text x="606" y="374" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">leading zero lost</text><text x="450" y="342" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">vs</text><rect x="30" y="410" width="840" height="88" rx="14" fill="#1e2a44"/><text x="54" y="446" font-size="15" font-weight="700" fill="#d4b02e" text-anchor="start">THE TEST</text><text x="54" y="478" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start">Will you ever do arithmetic on it? If not, it is an identifier: use a string.</text><rect x="30" y="518" width="268" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="551" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POSTCODE</text><text x="50" y="579" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">SW1A 1AA</text><text x="50" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">contains letters and a space</text><rect x="316" y="518" width="268" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="551" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CARD SECURITY CODE</text><text x="336" y="579" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">045</text><text x="336" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">leading zero; never added or</text><text x="336" y="628.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">averaged</text><rect x="602" y="518" width="268" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="551" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TELEPHONE NUMBER</text><text x="622" y="579" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">+ and spaces</text><text x="622" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may contain symbols; no</text><text x="622" y="628.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">arithmetic is done on it</text>
</svg>