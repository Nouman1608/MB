<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 768" width="900" height="768" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="768" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: types for a gym record</text>

<rect x="30" y="110" width="840" height="536" rx="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="110" width="840" height="58" rx="16" fill="#1e2a44"/><rect x="30" y="150" width="840" height="18" fill="#1e2a44"/><text x="54" y="147" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">Gym member</text><text x="846" y="147" font-size="16" font-weight="400" fill="#b5d3cf" text-anchor="end">type and the reason tied to the data</text><rect x="46" y="184" width="808" height="64" rx="10" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="212" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Membership number</text><text x="66" y="236" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"000731"</text><rect x="330" y="198" width="140" height="36" rx="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="400" y="222" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">String</text><text x="492" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">leading zeros kept; no arithmetic</text><rect x="46" y="260" width="808" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="288" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Surname</text><text x="66" y="312" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"Okafor"</text><rect x="330" y="274" width="140" height="36" rx="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="400" y="298" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">String</text><text x="492" y="298" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">text of varying length</text><rect x="46" y="336" width="808" height="64" rx="10" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="364" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Age in years</text><text x="66" y="388" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">34</text><rect x="330" y="350" width="140" height="36" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="400" y="374" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Integer</text><text x="492" y="374" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">always a whole number of years</text><rect x="46" y="412" width="808" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="440" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Monthly fee</text><text x="66" y="464" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">27.50</text><rect x="330" y="426" width="140" height="36" rx="18" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2.5"/><text x="400" y="450" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">Real</text><text x="492" y="450" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">money has a fractional part</text><rect x="46" y="488" width="808" height="64" rx="10" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="516" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Membership level</text><text x="66" y="540" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">'G'</text><rect x="330" y="502" width="140" height="36" rx="18" fill="#f4e1d4" stroke="#b5602e" stroke-width="2.5"/><text x="400" y="526" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Character</text><text x="492" y="526" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">exactly one symbol from a small set</text><rect x="46" y="564" width="808" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="592" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Has paid this month</text><text x="66" y="616" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">True</text><rect x="330" y="578" width="140" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="400" y="602" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Boolean</text><text x="492" y="602" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">only two possible states</text><rect x="30" y="674" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="714" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">"Because it is a number" is not a justification; "always a whole number of years" is.</text>
</svg>