<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The five data types</text>

<rect x="30" y="110" width="840" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="137" width="150" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="125" y="163" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Integer</text><text x="226" y="164" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">-12   0   365</text><text x="470" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Whole numbers: things you count</text><text x="470" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">students, lives left, loop counter, array index</text><rect x="30" y="216" width="840" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="243" width="150" height="40" rx="20" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2.5"/><text x="125" y="269" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="middle">Real</text><text x="226" y="270" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#2b5a9a" text-anchor="start">3.75   -0.5   98.6</text><text x="470" y="256" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A fractional part: things you measure</text><text x="470" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">price, height, temperature, average mark</text><rect x="30" y="322" width="840" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="349" width="150" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="125" y="375" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Boolean</text><text x="226" y="376" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">True   False</text><text x="470" y="362" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Only two values</text><text x="470" y="390" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">GameOver, IsMember, DoorLocked; Score > 50</text><rect x="30" y="428" width="840" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="455" width="150" height="40" rx="20" fill="#f4e1d4" stroke="#b5602e" stroke-width="2.5"/><text x="125" y="481" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Character</text><text x="226" y="482" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">'A'   '7'   '?'</text><text x="470" y="468" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Exactly one symbol</text><text x="470" y="496" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">grade, menu option 'Q'; '7' is not the number 7</text><rect x="30" y="534" width="840" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="561" width="150" height="40" rx="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="587" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">String</text><text x="226" y="588" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">"Karachi"   ""</text><text x="470" y="574" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A sequence of characters, even empty</text><text x="470" y="602" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">names, addresses, postcodes, passwords</text><text x="450" y="664" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="middle">Python and C# say float or double; in the exam always write real.</text>
</svg>