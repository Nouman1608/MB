<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Attraction is not proof of a magnet</text>

<rect x="30" y="110" width="410" height="190" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Magnet and magnet</text><rect x="60" y="170" width="75" height="36" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="135" y="170" width="75" height="36" rx="0" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="97.5" y="195" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><text x="172.5" y="195" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><rect x="260" y="170" width="75" height="36" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="335" y="170" width="75" height="36" rx="0" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="297.5" y="195" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><text x="372.5" y="195" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><text x="235" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">unlike poles attract,</text><text x="235" y="270" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">like poles REPEL</text><rect x="460" y="110" width="410" height="190" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Magnet and unmagnetised iron</text><rect x="490" y="170" width="75" height="36" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="565" y="170" width="75" height="36" rx="0" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="527.5" y="195" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><text x="602.5" y="195" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><rect x="690" y="170" width="150" height="36" rx="0" fill="#aab2bb" stroke="#1e2a44" stroke-width="2.5"/><text x="765" y="194" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">iron</text><text x="665" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">attracted at EITHER pole,</text><text x="665" y="270" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">never repelled</text><rect x="30" y="315" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="352" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Attraction happens in both cases, so it is not proof.</text><text x="450" y="384" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Only repulsion proves that both objects are magnets.</text><rect x="30" y="420" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="454" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">End of X to the middle of Y (brass already ruled out: attracted by neither)</text><rect x="205" y="470" width="36" height="55" rx="0" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><rect x="205" y="525" width="36" height="55" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="223" y="504.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><text x="223" y="559.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><rect x="110" y="580" width="226" height="30" rx="0" fill="#aab2bb" stroke="#1e2a44" stroke-width="2.5"/><text x="223" y="601" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">iron</text><text x="223" y="640" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">strong attraction:</text><text x="223" y="662" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">X is the magnet</text><text x="170" y="500" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">X</text><text x="100" y="600" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">Y</text><rect x="645" y="470" width="36" height="110" rx="0" fill="#aab2bb" stroke="#1e2a44" stroke-width="2.5"/><text transform="rotate(-90 663 525)" x="663" y="531" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">iron</text><rect x="540" y="582" width="123" height="30" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="663" y="582" width="123" height="30" rx="0" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="601.5" y="604" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><text x="724.5" y="604" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><text x="663" y="640" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">little or no attraction:</text><text x="663" y="662" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Y is the magnet (weak middle)</text><text x="610" y="500" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">X</text><text x="530" y="602" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">Y</text>
</svg>