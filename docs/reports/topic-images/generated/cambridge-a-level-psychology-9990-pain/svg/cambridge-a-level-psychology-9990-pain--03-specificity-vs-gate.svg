<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1015" width="900" height="1015" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1015" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two theories of pain</text>

<rect x="30" y="100" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="138" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIFICITY THEORY (DESCARTES)</text><rect x="60" y="162" width="240" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="198.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pain receptors</text><line x1="306" y1="194" x2="324" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="162" width="240" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="198.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Dedicated pathway</text><line x1="576" y1="194" x2="594" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="600" y="162" width="240" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="720" y="198.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pain centre in brain</text><rect x="60" y="250" width="780" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="289.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Prediction: <tspan font-weight="700" fill="#1e2a44">pain</tspan> <tspan font-weight="700" fill="#1e2a44">is</tspan> <tspan font-weight="700" fill="#1e2a44">directly</tspan> <tspan font-weight="700" fill="#1e2a44">proportional</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">tissue</tspan> <tspan font-weight="700" fill="#1e2a44">damage</tspan></text><text x="450" y="388" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">IT CANNOT EXPLAIN</text><rect x="30" y="410" width="270.6666666666667" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="454.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Phantom limb pain</text><text x="50" y="483.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">no limb to send signals</text><rect x="314.6666666666667" y="410" width="270.6666666666667" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="334.6666666666667" y="444.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Injuries not felt at the time</text><text x="334.6666666666667" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">soldiers or athletes who</text><text x="334.6666666666667" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">notice a wound only later</text><rect x="599.3333333333334" y="410" width="270.6666666666667" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="619.3333333333334" y="444.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Psychological effects</text><text x="619.3333333333334" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">attention, mood and</text><text x="619.3333333333334" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expectation change pain</text><rect x="30" y="550" width="840" height="258" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="588" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">GATE CONTROL THEORY (MELZACK AND WALL, 1965)</text><text x="54" y="618" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A neural “gate” in the dorsal horn of the spinal cord controls whether pain signals reach the brain.</text><rect x="54" y="658" width="389" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="686" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OPEN THE GATE</text><text x="70" y="717.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="85.2" y="717.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Small-diameter fibres (pain signals)</text><text x="70" y="742.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="85.2" y="742.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Anxiety, focusing on pain</text><rect x="457" y="658" width="389" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="686" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLOSE THE GATE</text><text x="473" y="717.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="488.2" y="717.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Large-diameter fibres (touch, pressure):</text><text x="488.2" y="738.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rubbing helps</text><text x="473" y="763.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="488.2" y="763.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Distraction, relaxation, positive mood</text><rect x="30" y="830" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="862" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="888.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Holistic</text><text x="50" y="916.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Combines physiological and psychological</text><text x="50" y="937.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">factors; explains why psychological treatments</text><text x="50" y="958.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">work.</text><rect x="457" y="830" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="862" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="888.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hard to test directly</text><text x="477" y="916.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The gate is a functional idea, not a single</text><text x="477" y="937.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">structure that has been located.</text>
</svg>