<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a 4-mark compare answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">McGill pain questionnaire v UAB pain behaviour scale</text>
<line x1="60" y1="144" x2="60" y2="502" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A similarity</text><text x="122" y="186.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Both give quantified data that can be compared over time.</text><circle cx="60" cy="166.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="175.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="221" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="253.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Difference: what the McGill involves</text><text x="122" y="283.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Self-report: the patient chooses words for sensory, affective and evaluative qualities.</text><circle cx="60" cy="263.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="272.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="318" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="350.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Difference: what the UAB involves</text><text x="122" y="380.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Observation: a trained observer rates behaviours such as grimacing and mobility.</text><circle cx="60" cy="360.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="369.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="415" width="766" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="447.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The consequence</text><text x="122" y="477.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">McGill depends on language and honesty; UAB depends on observer reliability and works</text><text x="122" y="499.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">for patients who cannot describe pain.</text><circle cx="60" cy="468.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="477.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="544" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="577.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">One mark each: a similarity, two differences tied to what each measure involves, and a</text><text x="450" y="599.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">consequence.</text>
</svg>