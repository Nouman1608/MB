<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What pain is for, and two types</text>

<text x="450" y="116" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">PAIN IS PROTECTIVE: THREE FUNCTIONS</text><rect x="30" y="138" width="270.6666666666667" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="170" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="165.33333333333334" y="197.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Warns</text><text x="165.33333333333334" y="226.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of tissue damage</text><rect x="314.6666666666667" y="138" width="270.6666666666667" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="170" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="450" y="197.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Withdraw</text><text x="450" y="226.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">from the cause</text><rect x="599.3333333333334" y="138" width="270.6666666666667" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="170" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="734.6666666666667" y="197.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Rest</text><text x="734.6666666666667" y="226.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">so that healing can happen</text><rect x="30" y="273" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="306.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">People born unable to feel pain often injure themselves badly without noticing.</text><rect x="60" y="393" width="360" height="40" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="420" y="393" width="420" height="40" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">ACUTE</text><text x="630" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">CHRONIC</text><line x1="420" y1="377" x2="420" y2="449" stroke="#b5602e" stroke-width="3.5"/><text x="420" y="373" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">about three months</text><text x="60" y="463" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">injury</text><text x="840" y="463" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time →</text><rect x="30" y="489" width="412" height="185" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="521" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACUTE PAIN</text><text x="50" y="547.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Short-term</text><text x="50" y="576.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="576.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Usually less than three months</text><text x="50" y="602.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="602.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Identifiable cause, e.g. a cut or a broken bone</text><text x="50" y="628.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="628.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fades as the injury heals</text><rect x="458" y="489" width="412" height="185" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="521" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CHRONIC PAIN</text><text x="478" y="547.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Persists beyond normal healing</text><text x="478" y="576.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="576.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Usually more than three months</text><text x="478" y="602.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="602.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May have no clear ongoing damage</text><text x="478" y="628.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="628.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Linked to low mood, poor sleep, reduced</text><text x="493.2" y="649.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">activity: psychological treatments matter</text>
</svg>