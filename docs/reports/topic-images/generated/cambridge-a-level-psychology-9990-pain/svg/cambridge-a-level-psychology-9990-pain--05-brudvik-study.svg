<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 917" width="900" height="917" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="917" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Brudvik et al. (2016)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Who rates a child’s pain most accurately?</text>
<rect x="30" y="124" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,124 H200 V194 H44 A14,14 0 0 1 30,180 V138 A14,14 0 0 1 44,124 Z" fill="#f2e7b8"/><rect x="30" y="124" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="162.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Aim</text><text x="216" y="152.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">To compare pain assessment by physicians, parents and children in an outpatient</text><text x="216" y="173.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">emergency setting</text><rect x="30" y="204" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,204 H200 V274 H44 A14,14 0 0 1 30,260 V218 A14,14 0 0 1 44,204 Z" fill="#b5d3cf"/><rect x="30" y="204" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="231.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Setting and</text><text x="46" y="252.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">sample</text><text x="216" y="243.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Accident and emergency department in Bergen, Norway; <tspan font-weight="700" fill="#1e2a44">243</tspan> <tspan font-weight="700" fill="#1e2a44">children</tspan> <tspan font-weight="700" fill="#1e2a44">aged</tspan> <tspan font-weight="700" fill="#1e2a44">3</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">15</tspan></text><rect x="30" y="284" width="840" height="95" rx="14" fill="#ffffff"/><path d="M44,284 H200 V379 H44 A14,14 0 0 1 30,365 V298 A14,14 0 0 1 44,284 Z" fill="#b5d3cf"/><rect x="30" y="284" width="840" height="95" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="334.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Procedure</text><text x="216" y="312.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children rated their own pain on scales adapted to their age</text><text x="216" y="337.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parents and physicians independently rated the child’s pain on a numeric rating</text><text x="231.2" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scale</text><rect x="30" y="389" width="840" height="99" rx="14" fill="#fbf7e6"/><path d="M44,389 H200 V488 H44 A14,14 0 0 1 30,474 V403 A14,14 0 0 1 44,389 Z" fill="#d4b02e"/><rect x="30" y="389" width="840" height="99" rx="14" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="441.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Results</text><text x="216" y="417.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="417.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mean ratings: <tspan font-weight="700" fill="#1e2a44">children</tspan> <tspan font-weight="700" fill="#1e2a44">5.5,</tspan> <tspan font-weight="700" fill="#1e2a44">parents</tspan> <tspan font-weight="700" fill="#1e2a44">4.8,</tspan> <tspan font-weight="700" fill="#1e2a44">physicians</tspan> <tspan font-weight="700" fill="#1e2a44">3.2</tspan></text><text x="216" y="442.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Child-parent agreement moderate; agreement with physicians low</text><text x="216" y="467.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only about <tspan font-weight="700" fill="#1e2a44">42%</tspan> of children with severe pain received pain relief</text><rect x="30" y="498" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,498 H200 V568 H44 A14,14 0 0 1 30,554 V512 A14,14 0 0 1 44,498 Z" fill="#2e6b62"/><rect x="30" y="498" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="536.44" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Conclusion</text><text x="216" y="526.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Physicians should take children’s and parents’ ratings seriously; parents’ ratings</text><text x="216" y="547.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">help when a child cannot self-report</text><text x="450" y="606" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">EVALUATION</text><rect x="30" y="628" width="413" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="660" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="686.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">High ecological validity</text><text x="50" y="714.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Real clinical setting; independent ratings.</text><rect x="457" y="628" width="413" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="660" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="686.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Generalisation</text><text x="477" y="714.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One emergency department in one country.</text><rect x="30" y="753" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="785" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">IDIOGRAPHIC V NOMOTHETIC</text><text x="50" y="811.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Numbers allow comparison</text><text x="50" y="839.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">But a child’s number may not mean the same as</text><text x="50" y="860.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">an adult’s.</text><rect x="457" y="753" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="785" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ETHICS</text><text x="477" y="811.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Children in research</text><text x="477" y="839.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parental consent; care must not be delayed by</text><text x="477" y="860.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the research.</text>
</svg>