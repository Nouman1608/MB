<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 771" width="900" height="771" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="771" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Phantom limb pain and mirror treatment</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Ramachandran’s mirror box, seen from above. Schematic</text>
<rect x="30" y="124" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="260" y="164" width="380" height="200" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="154" x2="450" y2="374" stroke="#2b5a9a" stroke-width="9"/><text x="450" y="146" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">mirror</text><rect x="520" y="224" width="60" height="140" rx="26" fill="#efdfa8" stroke="#1e2a44" stroke-width="3"/><text x="550" y="412" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">intact limb moves</text><rect x="320" y="224" width="60" height="140" rx="26" fill="none" stroke="#2e6b62" stroke-width="3" stroke-dasharray="9 7"/><text x="350" y="412" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">seen where the</text><text x="350" y="432" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">missing limb would be</text><text x="56" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Missing limb’s side,</text><text x="56" y="255" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hidden behind the</text><text x="56" y="276" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mirror</text><line x1="206" y1="289" x2="312" y2="289" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="668" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Patient watches the</text><text x="668" y="255" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reflection in the mirror</text><path d="M690,309 Q600,194 462,204" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="476" width="397" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="228.5" y="521.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Visual feedback</text><text x="228.5" y="550.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The brain sees the missing limb moving</text><line x1="433" y1="530.5" x2="467" y2="530.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="476" width="397" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="671.5" y="510.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Pain can reduce</text><text x="671.5" y="539.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Phantom pain cannot come from the limb itself:</text><text x="671.5" y="560.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">it is not there</text><rect x="30" y="607" width="413" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="639" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MACLACHLAN ET AL. (2004)</text><text x="50" y="665.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Case study, lower limb</text><text x="50" y="693.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mirror exercises practised over weeks; the</text><text x="50" y="714.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">patient reported reduced pain.</text><rect x="457" y="607" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="639" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="665.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One case, no control</text><text x="477" y="693.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Detailed evidence, but cannot show the</text><text x="477" y="714.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">treatment works for everyone.</text>
</svg>