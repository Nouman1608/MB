<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 778" width="900" height="778" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="778" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four ways to measure pain</text>

<rect x="30" y="100" width="840" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="134" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">VISUAL ANALOGUE SCALE: a straight line, typically 10 cm</text><line x1="140" y1="206" x2="760" y2="206" stroke="#1e2a44" stroke-width="4"/><line x1="140" y1="192" x2="140" y2="220" stroke="#1e2a44" stroke-width="4"/><line x1="760" y1="192" x2="760" y2="220" stroke="#1e2a44" stroke-width="4"/><text x="140" y="244" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">no pain</text><text x="760" y="244" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">worst possible pain</text><line x1="520" y1="186" x2="520" y2="226" stroke="#b5602e" stroke-width="5"/><line x1="140" y1="176" x2="520" y2="176" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="330" y="168" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">patient’s mark: distance measured</text><clipPath id="tc282"><rect x="30" y="282" width="840" height="412" rx="14"/></clipPath><g clip-path="url(#tc282)"><rect x="30" y="282" width="164.85981308411215" height="44" fill="#b5d3cf"/><text x="42" y="307.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Measure</text><rect x="194.85981308411215" y="282" width="251.21495327102807" height="44" fill="#b5d3cf"/><text x="206.85981308411215" y="307.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it involves</text><rect x="446.07476635514024" y="282" width="204.1121495327103" height="44" fill="#b5d3cf"/><text x="458.07476635514024" y="307.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="650.1869158878505" y="282" width="219.81308411214954" height="44" fill="#b5d3cf"/><text x="662.1869158878505" y="307.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Weakness</text><rect x="30" y="326" width="164.85981308411215" height="82" fill="#dce9e7"/><text x="42" y="350" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Clinical interview</text><rect x="194.85981308411215" y="326" width="251.21495327102807" height="82" fill="#ffffff"/><text x="206.85981308411215" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Practitioner asks about</text><text x="206.85981308411215" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">location, intensity, duration,</text><text x="206.85981308411215" y="390" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">quality and effect on daily life</text><rect x="446.07476635514024" y="326" width="204.1121495327103" height="82" fill="#ffffff"/><text x="458.07476635514024" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Rich, individual</text><text x="458.07476635514024" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">information</text><rect x="650.1869158878505" y="326" width="219.81308411214954" height="82" fill="#ffffff"/><text x="662.1869158878505" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Relies on the patient’s</text><text x="662.1869158878505" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">description and the</text><text x="662.1869158878505" y="390" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">practitioner’s interpretation</text><line x1="30" y1="408" x2="870" y2="408" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="408" width="164.85981308411215" height="102" fill="#dce9e7"/><text x="42" y="432" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">McGill pain</text><text x="42" y="452" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">questionnaire</text><rect x="194.85981308411215" y="408" width="251.21495327102807" height="102" fill="#f8faf9"/><text x="206.85981308411215" y="432" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Patient chooses words:</text><text x="206.85981308411215" y="452" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">sensory</tspan>, <tspan font-weight="700">affective</tspan>, <tspan font-weight="700">evaluative</tspan>;</text><text x="206.85981308411215" y="472" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">body diagram; present intensity</text><rect x="446.07476635514024" y="408" width="204.1121495327103" height="102" fill="#f8faf9"/><text x="458.07476635514024" y="432" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Detailed; distinguishes</text><text x="458.07476635514024" y="452" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">types of pain</text><rect x="650.1869158878505" y="408" width="219.81308411214954" height="102" fill="#f8faf9"/><text x="662.1869158878505" y="432" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Takes time; needs good</text><text x="662.1869158878505" y="452" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">language skills, so</text><text x="662.1869158878505" y="472" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">unsuitable for young</text><text x="662.1869158878505" y="492" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">children</text><line x1="30" y1="510" x2="870" y2="510" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="510" width="164.85981308411215" height="82" fill="#dce9e7"/><text x="42" y="534" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Visual analogue</text><text x="42" y="554" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">scale</text><rect x="194.85981308411215" y="510" width="251.21495327102807" height="82" fill="#ffffff"/><text x="206.85981308411215" y="534" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Patient marks a line from “no</text><text x="206.85981308411215" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pain” to “worst possible pain”</text><rect x="446.07476635514024" y="510" width="204.1121495327103" height="82" fill="#ffffff"/><text x="458.07476635514024" y="534" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Quick; quantitative;</text><text x="458.07476635514024" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">tracks change over time</text><rect x="650.1869158878505" y="510" width="219.81308411214954" height="82" fill="#ffffff"/><text x="662.1869158878505" y="534" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Reduces pain to one</text><text x="662.1869158878505" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">number; people use the</text><text x="662.1869158878505" y="574" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">scale differently</text><line x1="30" y1="592" x2="870" y2="592" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="592" width="164.85981308411215" height="102" fill="#dce9e7"/><text x="42" y="616" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">UAB pain</text><text x="42" y="636" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">behaviour scale</text><rect x="194.85981308411215" y="592" width="251.21495327102807" height="102" fill="#f8faf9"/><text x="206.85981308411215" y="616" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Trained observer rates</text><text x="206.85981308411215" y="636" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">behaviours: complaints,</text><text x="206.85981308411215" y="656" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">grimaces, posture, mobility,</text><text x="206.85981308411215" y="676" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">supportive equipment</text><rect x="446.07476635514024" y="592" width="204.1121495327103" height="102" fill="#f8faf9"/><text x="458.07476635514024" y="616" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">No self-report needed</text><rect x="650.1869158878505" y="592" width="219.81308411214954" height="102" fill="#f8faf9"/><text x="662.1869158878505" y="616" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Observers need training for</text><text x="662.1869158878505" y="636" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">inter-rater reliability;</text><text x="662.1869158878505" y="656" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">behaviour can be</text><text x="662.1869158878505" y="676" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exaggerated or suppressed</text></g><line x1="194.85981308411215" y1="282" x2="194.85981308411215" y2="694" stroke="#c9d6d4" stroke-width="1.5"/><line x1="446.07476635514024" y1="282" x2="446.07476635514024" y2="694" stroke="#c9d6d4" stroke-width="1.5"/><line x1="650.1869158878505" y1="282" x2="650.1869158878505" y2="694" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="282" width="840" height="412" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="193.04000000000002" y="716" width="294.912" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="340.496" y="736.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-report: interview, McGill, VAS</text><rect x="497.952" y="716" width="209.008" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="602.456" y="736.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Observation: UAB scale</text>
</svg>