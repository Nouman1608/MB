<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Managing pain: three groups of methods</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Gate control theory links them</text>
<rect x="30" y="124" width="270.6666666666667" height="248" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BIOLOGICAL</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Biochemical</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Opiates such as morphine</text><text x="65.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mimic endorphins at opioid</text><text x="65.2" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">receptors</text><text x="50" y="279.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Non-opioid painkillers</text><text x="65.2" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reduce inflammation</text><text x="50" y="326.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="326.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Fast,</tspan> <tspan font-style="italic">effective;</tspan> <tspan font-style="italic">side</tspan> <tspan font-style="italic">effects;</tspan></text><text x="65.2" y="347.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">opiate</tspan> <tspan font-style="italic">dependence</tspan></text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="248" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PSYCHOLOGICAL</text><text x="334.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Thinking strategies</text><text x="334.6666666666667" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Attention diversion</text><text x="334.6666666666667" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Non-pain imagery</text><text x="334.6666666666667" y="263.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cognitive redefinition</text><text x="334.6666666666667" y="289.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="349.8666666666667" y="289.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Cheap;</tspan> <tspan font-style="italic">need</tspan> <tspan font-style="italic">practice</tspan> <tspan font-style="italic">and</tspan></text><text x="349.8666666666667" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">effort</tspan></text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="248" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ALTERNATIVE</text><text x="619.3333333333334" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Acupuncture, TENS</text><text x="619.3333333333334" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="634.5333333333334" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Acupuncture: fine needles</text><text x="634.5333333333334" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">at specific points; may</text><text x="634.5333333333334" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">partly be placebo</text><text x="619.3333333333334" y="279.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="634.5333333333334" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">TENS: mild current through</text><text x="634.5333333333334" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">skin electrodes</text><rect x="95.6" y="398" width="138.8" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="165" y="418.76" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">reduce signals</text><line x1="165" y1="434" x2="330" y2="508" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="340.96" y="398" width="218.08" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="418.76" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">send descending signals</text><line x1="450" y1="434" x2="450" y2="508" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="640.04" y="398" width="189.92" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="735" y="418.76" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">stimulate large fibres</text><line x1="735" y1="434" x2="570" y2="508" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="250" y="514" width="400" height="64" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="551.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The pain gate closes</text>
</svg>