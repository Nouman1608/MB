<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criterion D: two registers, side by side</text>

<text x="450" y="132" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Same topic, two audiences</text><rect x="70" y="150" width="250" height="400" rx="30" fill="#fff" stroke="#1e2a44" stroke-width="3"/><rect x="160" y="166" width="70" height="10" rx="5" fill="#c9d6d4"/><rect x="90" y="200" width="200" height="56" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="110" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hey! r u free?</text><rect x="110" y="270" width="190" height="56" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="130" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">yes!! c u at 4</text><text x="195" y="400" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Text message</text><text x="195" y="428" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">to a friend</text><text x="95" y="470" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• informal</text><text x="95" y="494" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• abbreviated language</text><rect x="400" y="150" width="440" height="400" rx="10" fill="#fff" stroke="#1e2a44" stroke-width="3"/><rect x="400" y="150" width="440" height="40" rx="10" fill="#b5d3cf"/><text x="420" y="176" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Formal email to a school administrator</text><text x="425" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Dear …,</text><text x="425" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic"></text><text x="425" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">I am writing to ask whether …</text><text x="425" y="291" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Would it be possible to …?</text><text x="425" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic"></text><text x="425" y="337" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Thank you for your help.</text><text x="425" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Yours sincerely, …</text><text x="425" y="430" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• formal greeting and sign-off</text><text x="425" y="454" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• complete sentences</text><text x="425" y="478" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• polite requests</text><text x="425" y="502" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• different vocabulary and structure</text><rect x="30" y="570" width="840" height="92" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="606" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Not top band</text><text x="52" y="636" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the same content with only the greeting or sign-off changed</text>
</svg>