<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four Language Acquisition criteria</text>

<rect x="30" y="110" width="840" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="88" cy="163" r="32" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="88" y="174.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="145" y="148" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Listening</text><text x="145" y="174" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">top-band evidence:</text><text x="145" y="198" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">interpret spoken multimodal text: what the images add, not just the words heard</text><rect x="30" y="230" width="840" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="88" cy="283" r="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="88" y="294.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="145" y="268" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Reading</text><text x="145" y="294" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">top-band evidence:</text><text x="145" y="318" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">read layout, images and formatting as meaning, not decoration</text><rect x="30" y="350" width="840" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="88" cy="403" r="32" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="88" y="414.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="145" y="388" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Speaking</text><text x="145" y="414" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">top-band evidence:</text><text x="145" y="438" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">interact spontaneously; answer what was actually asked</text><rect x="30" y="470" width="840" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="88" cy="523" r="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="88" y="534.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="145" y="508" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Writing</text><text x="145" y="534" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">top-band evidence:</text><text x="145" y="558" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">match register, vocabulary and structure to audience and purpose</text><rect x="30" y="600" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="642" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">All four are judged against your own proficiency level.</text>
</svg>