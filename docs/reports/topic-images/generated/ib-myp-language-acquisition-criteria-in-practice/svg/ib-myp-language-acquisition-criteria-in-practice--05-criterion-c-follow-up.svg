<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criterion C: answer what was actually asked</text>

<rect x="250" y="110" width="400" height="70" rx="30" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Examiner</text><text x="450" y="164" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">an unexpected follow-up question</text><line x1="380" y1="184" x2="240" y2="228" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="520" y1="184" x2="660" y2="228" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="236" width="410" height="230" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="272" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Rehearsed recitation</text><text x="52" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">falls back to a memorised,</text><text x="52" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prepared answer that does not</text><text x="52" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fit what was asked</text><rect x="60" y="370" width="350" height="70" rx="30" fill="#fff" stroke="#b5602e" stroke-width="2"/><text x="235" y="412" font-size="17" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">“As I prepared earlier …”</text><rect x="460" y="236" width="410" height="230" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="272" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Real interaction</text><text x="482" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">responds directly and coherently</text><text x="482" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to the actual question, with a</text><text x="482" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">genuine range of vocabulary and</text><text x="482" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">structures for the level</text><rect x="30" y="490" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="526" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Practise with genuinely unexpected follow-up questions,</text><text x="450" y="554" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">not only prepared answers.</text>
</svg>