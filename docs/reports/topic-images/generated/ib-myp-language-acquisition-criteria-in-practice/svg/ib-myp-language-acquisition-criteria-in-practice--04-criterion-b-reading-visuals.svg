#1e2a44" text-anchor="start">a red icon signals urgency or warning</text><rect x="475" y="236" width="395" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="495" y="272" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Written text</text><text x="495" y="298" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">comprehended correctly</text><rect x="475" y="340" width="395" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="495" y="376" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Icons and colour coding</text><text x="495" y="402" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">what each one communicates in its own right</text><rect x="475" y="452" width="395" height="128" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="497" y="488" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Not top band</text><text x="497" y="518" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reads the words but treats the</text><text x="497" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">visuals as irrelevant decoration</text>
