<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Top band means different things at each level</text>

<text x="450" y="130" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">What top-band evidence looks like at each level</text><rect x="60" y="330" width="240" height="170" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="366" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Emergent</text><text x="180" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">short, simple but</text><text x="180" y="421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">accurate response</text><text x="180" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">basic vocabulary and</text><text x="180" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">structures</text><rect x="330" y="260" width="240" height="240" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="296" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Capable</text><text x="450" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">judged against the</text><text x="450" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">capable-level</text><text x="450" y="372" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">descriptors</text><rect x="600" y="190" width="240" height="310" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="226" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Proficient</text><text x="720" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">nuanced, extended,</text><text x="720" y="281" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">spontaneous</text><text x="720" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">language use</text><line x1="40" y1="502" x2="860" y2="502" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="530" width="410" height="120" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="566" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Common mistake</text><text x="52" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">comparing your work with a more</text><text x="52" y="618" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advanced level’s standard</text><rect x="460" y="530" width="410" height="120" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="566" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Instead</text><text x="482" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identify your level first, then use</text><text x="482" y="618" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">your own level’s descriptors</text>
</svg>