<rect x="30" y="110" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M70,190 L100,190 L130,160 L130,260 L100,230 L70,230 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M150,180 Q170,210 150,240" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M168,172 Q192,210 168,248" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M186,164 Q214,210 186,256" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="230" y="150" width="300" height="120" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="380" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Spoken announcement</text><text x="380" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">temporary closure</text><text x="380" y="244" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">time · place</text><text x="560" y="218" font-size="30" font-weight="700" fill="#4a5568" text-anchor="middle">+</text><rect x="600" y="150" width="240" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><path d="M690,175 L720,160 L750,175" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="660" y="178" width="120" height="50" rx="6" fill="#fbeee6" stroke="#b5602e" stroke-width="3"/><text x="720" y="211" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">CLOSED</text><text x="720" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">image shown with it</text><rect x="30" y="350" width="410" height="190" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="386" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Audio only</text><text x="52" y="416" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identifies facts stated aloud,</text><text x="52" y="438" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such as the time or place;</text><text x="52" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transcribes words heard</text><rect x="460" y="350" width="410" height="190" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="386" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Multimodal</text><text x="482" y="416" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">facts heard, PLUS how the image</text><text x="482" y="438" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of a closed sign reinforces the</text><text x="482" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">message about a temporary</text><text x="482" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">closure</text>
