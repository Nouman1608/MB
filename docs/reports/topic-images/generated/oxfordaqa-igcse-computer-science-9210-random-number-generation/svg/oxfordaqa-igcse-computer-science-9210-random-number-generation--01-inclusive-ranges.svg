 y="584.2" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">7</text><text x="54" y="634" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Upper value excluded, so 7 gives a maximum of 6.</text><text x="607" y="632" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">excluded</text><rect x="30" y="672" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="710" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Each call gives a new, independent value. Check each language’s range rule.</text>
