<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a guessing game</text>

<rect x="30" y="110" width="560" height="364" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#d4b02e" text-anchor="start">target ← RANDOM_INT(1, 50)</text><text x="48" y="166" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">guesses ← 0</text><text x="48" y="192" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">REPEAT</text><text x="66" y="218" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT "Guess a number from 1 to 50"</text><text x="66" y="244" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">guess ← STRING_TO_INT(USERINPUT)</text><text x="66" y="270" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">guesses ← guesses + 1</text><text x="66" y="296" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">IF guess > target THEN</text><text x="84" y="322" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT "Too high"</text><text x="66" y="348" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">ELSE IF guess &lt; target THEN</text><text x="84" y="374" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT "Too low"</text><text x="66" y="400" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">ENDIF</text><text x="48" y="426" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">UNTIL guess = target</text><text x="48" y="452" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT "Correct in " + INT_TO_STRING(guesses) + " guesses"</text><rect x="606" y="110" width="264" height="364" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="146" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Generated once,</text><text x="626" y="168" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">before the loop</text><text x="626" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Inside the loop the target would</text><text x="626" y="216" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">change after every guess and</text><text x="626" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the hints would be</text><text x="626" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">meaningless.</text><text x="626" y="316" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">REPEAT … UNTIL</text><text x="626" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The user must guess at least</text><text x="626" y="362" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">once, so the test goes at the</text><text x="626" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">end.</text><line x1="70" y1="544" x2="830" y2="544" stroke="#1e2a44" stroke-width="3"/><line x1="70" y1="534" x2="70" y2="554" stroke="#1e2a44" stroke-width="3"/><text x="70" y="578" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="830" y1="534" x2="830" y2="554" stroke="#1e2a44" stroke-width="3"/><text x="830" y="578" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">50</text><line x1="504.2857142857143" y1="508" x2="504.2857142857143" y2="558" stroke="#8a6d0d" stroke-width="4"/><text x="504.2857142857143" y="500" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">target 29</text><circle cx="674.8979591836735" cy="544" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="674.8979591836735" y="548.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="70" cy="604" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="609.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="98" y="610" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">guess 40</text><text x="240" y="610" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Too high</text><circle cx="364.6938775510204" cy="544" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="364.6938775510204" y="548.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="70" cy="656" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="661.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="98" y="662" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">guess 20</text><text x="240" y="662" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="start">Too low</text><circle cx="504.2857142857143" cy="544" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="504.2857142857143" y="548.68" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="70" cy="708" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="713.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="98" y="714" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">guess 29</text><text x="240" y="714" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Correct in 3 guesses</text>
</svg>