<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Turning a random number into a choice</text>

<rect x="30" y="110" width="840" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">30% chance</text><text x="200" y="148" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">IF RANDOM_INT(1, 10) ≤ 3 THEN</text><rect x="54" y="174" width="70" height="64" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="89" y="213.2" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="134" y="174" width="70" height="64" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="169" y="213.2" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="214" y="174" width="70" height="64" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="249" y="213.2" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="294" y="174" width="70" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="329" y="213.2" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="374" y="174" width="70" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="409" y="213.2" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="454" y="174" width="70" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="489" y="213.2" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="534" y="174" width="70" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="569" y="213.2" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="614" y="174" width="70" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="649" y="213.2" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><rect x="694" y="174" width="70" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="729" y="213.2" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text><rect x="774" y="174" width="70" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="809" y="213.2" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">10</text><text x="169" y="270" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">3 of 10 equally likely values</text><text x="54" y="300" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">make the condition True: "A storm hits your ship"</text><rect x="30" y="340" width="840" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="378" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Several outcomes from one stored value</text><rect x="54" y="396" width="400" height="234" rx="12" fill="#1e2a44"/><text x="72" y="426" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">r ← RANDOM_INT(1, 4)</text><text x="72" y="452" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">IF r = 1 THEN</text><text x="90" y="478" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">weather ← "Sun"</text><text x="72" y="504" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">ELSE IF r = 2 THEN</text><text x="90" y="530" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">weather ← "Rain"</text><text x="72" y="556" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">ELSE</text><text x="90" y="582" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">weather ← "Cloud"</text><text x="72" y="608" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="400" fill="#e8eef0" text-anchor="start">ENDIF</text><rect x="480" y="404" width="56" height="44" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="508" y="432.48" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="540" y1="426" x2="580" y2="426" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="586" y="404" width="130" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="651" y="432" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Sun</text><rect x="480" y="456" width="56" height="44" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="508" y="484.48" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="540" y1="478" x2="580" y2="478" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="586" y="456" width="130" height="44" rx="10" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2.5"/><text x="651" y="484" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="middle">Rain</text><rect x="480" y="508" width="56" height="44" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="508" y="536.48" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="540" y1="530" x2="580" y2="530" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="586" y="508" width="130" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="651" y="536" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Cloud</text><rect x="480" y="560" width="56" height="44" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="508" y="588.48" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="540" y1="582" x2="580" y2="582" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="586" y="560" width="130" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="651" y="588" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Cloud</text><text x="730" y="432" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1 in 4</text><text x="730" y="484" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1 in 4</text><text x="730" y="560" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">2 in 4</text><text x="480" y="622" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">Calling RANDOM_INT again in each test would</text><text x="480" y="642" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">change the chances.</text>
</svg>