<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 899" width="900" height="899" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="899" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Giacalone and Rosenfeld (1987)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How do employees justify sabotage?</text>
<rect x="30" y="124" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,124 H200 V194 H44 A14,14 0 0 1 30,180 V138 A14,14 0 0 1 44,124 Z" fill="#f2e7b8"/><rect x="30" y="124" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="162.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Aim</text><text x="216" y="152.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">To investigate which reasons employees see as justifying sabotage, and which</text><text x="216" y="173.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">methods they see as justifiable</text><rect x="30" y="204" width="840" height="56" rx="14" fill="#ffffff"/><path d="M44,204 H200 V260 H44 A14,14 0 0 1 30,246 V218 A14,14 0 0 1 44,204 Z" fill="#b5d3cf"/><rect x="30" y="204" width="840" height="56" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="235.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sample</text><text x="216" y="236.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unionised factory workers</text><rect x="30" y="270" width="840" height="74" rx="14" fill="#ffffff"/><path d="M44,270 H200 V344 H44 A14,14 0 0 1 30,330 V284 A14,14 0 0 1 44,270 Z" fill="#b5d3cf"/><rect x="30" y="270" width="840" height="74" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="310.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><text x="216" y="298.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Questionnaire: rate how far a range of reasons would justify sabotage</text><text x="216" y="323.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="323.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rate four methods: <tspan font-weight="700" fill="#1e2a44">slowdowns,</tspan> <tspan font-weight="700" fill="#1e2a44">destructiveness,</tspan> <tspan font-weight="700" fill="#1e2a44">dishonesty,</tspan> <tspan font-weight="700" fill="#1e2a44">causing</tspan> <tspan font-weight="700" fill="#1e2a44">chaos</tspan></text><rect x="30" y="354" width="840" height="95" rx="14" fill="#fbf7e6"/><path d="M44,354 H200 V449 H44 A14,14 0 0 1 30,435 V368 A14,14 0 0 1 44,354 Z" fill="#d4b02e"/><rect x="30" y="354" width="840" height="95" rx="14" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="404.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Results</text><text x="216" y="382.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Accepting a wider range of reasons → more ready to justify every form of</text><text x="231.2" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sabotage</text><text x="216" y="428.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Except <tspan font-weight="700" fill="#1e2a44">dishonesty</tspan>, which received little justification from anyone</text><rect x="30" y="459" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,459 H200 V529 H44 A14,14 0 0 1 30,515 V473 A14,14 0 0 1 44,459 Z" fill="#2e6b62"/><rect x="30" y="459" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="497.44" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Conclusion</text><text x="216" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sabotage is often explained as a reasoned response to the situation: a sign of</text><text x="216" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grievances management should address</text><text x="450" y="567" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">EVALUATION</text><rect x="30" y="589" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="621" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="50" y="647.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Attitudes, not behaviour</text><text x="50" y="675.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Self-report about sabotage may not predict</text><text x="50" y="696.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">actual sabotage.</text><rect x="457" y="589" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="621" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="647.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One workplace</text><text x="477" y="675.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One unionised workplace limits generalisation.</text><rect x="30" y="735" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="767" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="793.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Less social desirability</text><text x="50" y="821.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Asking about justification, not personal</text><text x="50" y="842.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sabotage.</text><rect x="457" y="735" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="767" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SITUATIONAL</text><text x="477" y="793.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Links to situational explanations</text><text x="477" y="821.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sabotage as a response to the work situation.</text>
</svg>