<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 866" width="900" height="866" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="866" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Herzberg’s two-factor theory</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Satisfaction and dissatisfaction are not opposite ends of one scale</text>
<rect x="30" y="124" width="840" height="224" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="160" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">HYGIENE FACTORS: CONTEXT OF THE JOB</text><text x="54" y="188" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Poor → dissatisfaction; good → only prevents it</text><rect x="54" y="204" width="53.007999999999996" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="80.50399999999999" y="224.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">pay</text><rect x="117.008" y="204" width="148.192" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="191.10399999999998" y="224.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">company policy</text><rect x="275.2" y="204" width="116.064" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="333.23199999999997" y="224.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">supervision</text><rect x="401.264" y="204" width="173.936" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="488.232" y="224.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">working conditions</text><rect x="585.2" y="204" width="252.592" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="711.4960000000001" y="224.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">relationships with colleagues</text><rect x="54" y="244" width="116.224" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="112.112" y="264.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">job security</text><line x1="200" y1="314" x2="700" y2="314" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="73.424" y="299" width="116.576" height="30" rx="15" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2"/><text x="131.712" y="319.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Dissatisfied</text><rect x="712" y="299" width="146.752" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="785.376" y="319.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Not dissatisfied</text><rect x="30" y="364" width="840" height="184" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="400" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">MOTIVATORS: CONTENT OF THE JOB</text><text x="54" y="428" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Produce satisfaction and motivation</text><rect x="54" y="444" width="125.648" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="116.824" y="464.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">achievement</text><rect x="189.648" y="444" width="113.648" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="246.47199999999998" y="464.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">recognition</text><rect x="313.296" y="444" width="135.536" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="381.06399999999996" y="464.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the work itself</text><rect x="458.832" y="444" width="130.736" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="524.2" y="464.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">responsibility</text><rect x="599.568" y="444" width="131.152" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="665.144" y="464.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">advancement</text><line x1="200" y1="514" x2="700" y2="514" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="66.624" y="499" width="123.376" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="128.312" y="519.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Not satisfied</text><rect x="712" y="499" width="93.248" height="30" rx="15" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="758.624" y="519.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Satisfied</text><rect x="30" y="570" width="840" height="89" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="604.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Application</text><text x="50" y="634.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A pay rise may stop complaints but will not make a dull job satisfying; adding responsibility might.</text><rect x="30" y="681" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="713" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="50" y="739.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Biased method</text><text x="50" y="767.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">People credit themselves for good events and</text><text x="50" y="788.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">blame others for bad ones, which alone gives the</text><text x="50" y="809.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pattern.</text><rect x="457" y="681" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="713" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="739.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Narrow sample</text><text x="477" y="767.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Professional men in one region; pay can</text><text x="477" y="788.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">motivate some workers.</text>
</svg>