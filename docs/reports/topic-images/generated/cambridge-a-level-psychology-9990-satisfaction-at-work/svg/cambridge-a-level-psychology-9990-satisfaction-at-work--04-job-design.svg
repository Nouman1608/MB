<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 735" width="900" height="735" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three techniques of job design</text>

<rect x="30" y="100" width="268" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="134" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">ENRICHMENT</text><text x="164" y="160" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">vertical loading</text><rect x="84" y="280" width="160" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="306" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">current job</text><rect x="84" y="230" width="160" height="40" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="256" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">plan</text><rect x="84" y="180" width="160" height="40" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="206" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">decide</text><line x1="264" y1="310" x2="264" y2="192" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="316" y="100" width="268" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="134" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">ENLARGEMENT</text><text x="450" y="160" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">horizontal loading</text><rect x="334" y="230" width="74" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="371" y="256" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">task</text><rect x="412" y="230" width="74" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="449" y="256" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">task</text><rect x="490" y="230" width="74" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="527" y="256" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">task</text><line x1="340" y1="305" x2="560" y2="305" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="450" y="336" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">more tasks, same level</text><rect x="602" y="100" width="268" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="134" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">ROTATION</text><text x="736" y="160" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">moving at intervals</text><circle cx="736" cy="265" r="52" fill="none" stroke="#2b5a9a" stroke-width="3" stroke-dasharray="6 6"/><rect x="705.265" y="198" width="61.47" height="29" rx="14.5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><text x="736" y="217.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">job A</text><rect x="750.9358209967909" y="276" width="60.195" height="29" rx="14.5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><text x="781.0333209967908" y="295.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">job B</text><rect x="660.2841790032091" y="276" width="61.365" height="29" rx="14.5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><text x="690.9666790032092" y="295.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">job C</text><clipPath id="tc372"><rect x="30" y="372" width="840" height="231" rx="14"/></clipPath><g clip-path="url(#tc372)"><rect x="30" y="372" width="204.87804878048783" height="48" fill="#b5d3cf"/><text x="44" y="399.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Technique</text><rect x="234.87804878048783" y="372" width="266.3414634146342" height="48" fill="#b5d3cf"/><text x="248.87804878048783" y="399.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What changes</text><rect x="501.219512195122" y="372" width="368.7804878048781" height="48" fill="#b5d3cf"/><text x="515.219512195122" y="399.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Example</text><rect x="30" y="420" width="204.87804878048783" height="68" fill="#dce9e7"/><text x="44" y="446.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Enrichment</text><rect x="234.87804878048783" y="420" width="266.3414634146342" height="68" fill="#ffffff"/><text x="248.87804878048783" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More responsibility, control</text><text x="248.87804878048783" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and decision-making</text><rect x="501.219512195122" y="420" width="368.7804878048781" height="68" fill="#ffffff"/><text x="515.219512195122" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A cleaner plans their own rota and orders</text><text x="515.219512195122" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supplies</text><line x1="30" y1="488" x2="870" y2="488" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="488" width="204.87804878048783" height="47" fill="#dce9e7"/><text x="44" y="514.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Enlargement</text><rect x="234.87804878048783" y="488" width="266.3414634146342" height="47" fill="#f8faf9"/><text x="248.87804878048783" y="514.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More tasks at the same level</text><rect x="501.219512195122" y="488" width="368.7804878048781" height="47" fill="#f8faf9"/><text x="515.219512195122" y="514.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A packer also labels and checks boxes</text><line x1="30" y1="535" x2="870" y2="535" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="535" width="204.87804878048783" height="68" fill="#dce9e7"/><text x="44" y="561.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rotation</text><rect x="234.87804878048783" y="535" width="266.3414634146342" height="68" fill="#ffffff"/><text x="248.87804878048783" y="561.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Moving between jobs at</text><text x="248.87804878048783" y="582.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intervals</text><rect x="501.219512195122" y="535" width="368.7804878048781" height="68" fill="#ffffff"/><text x="515.219512195122" y="561.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A shop assistant moves between till,</text><text x="515.219512195122" y="582.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stockroom and customer service</text></g><line x1="234.87804878048783" y1="372" x2="234.87804878048783" y2="603" stroke="#c9d6d4" stroke-width="1.5"/><line x1="501.219512195122" y1="372" x2="501.219512195122" y2="603" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="372" width="840" height="231" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="625" width="413" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="657.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Enrichment links to Herzberg’s <tspan font-weight="700" fill="#1e2a44">motivators</tspan> and</text><text x="50" y="678.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to <tspan font-weight="700" fill="#1e2a44">autonomy</tspan> in Hackman and Oldham.</text><rect x="457" y="625" width="413" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="657.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Enlargement and rotation add variety; critics call</text><text x="477" y="678.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enlargement “<tspan font-weight="700" fill="#1e2a44">more</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">same</tspan>”.</text>
</svg>