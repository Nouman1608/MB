<rect x="30" y="124" width="397" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGE 1 (1 MARK)</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Handle each customer’s problem start</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">to finish</text><line x1="433" y1="177" x2="467" y2="177" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="124" width="397" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="493" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LINK TO THEORY (1 MARK)</text><text x="493" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More task identity → experienced</text><text x="493" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">meaningfulness</text><rect x="30" y="246" width="397" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="278" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGE 2 (1 MARK)</text><text x="50" y="304.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Weekly reports of customers helped</text><text x="50" y="327.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and satisfaction ratings</text><line x1="433" y1="299" x2="467" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="246" width="397" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="493" y="278" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LINK TO THEORY (1 MARK)</text><text x="493" y="304.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Feedback → knowledge of results →</text><text x="493" y="327.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">satisfaction and motivation</text><rect x="30" y="374" width="840" height="58" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="407.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Each change earns a mark; naming the characteristic and its psychological state earns the second.</text>
