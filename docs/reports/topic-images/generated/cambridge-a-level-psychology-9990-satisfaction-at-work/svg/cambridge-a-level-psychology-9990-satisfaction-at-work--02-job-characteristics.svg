<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 809" width="900" height="809" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="809" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hackman and Oldham’s job characteristics theory</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Five core characteristics, three critical psychological states</text>
<rect x="30" y="154" width="270" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="185.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Skill variety</text><text x="42" y="213" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">range of skills</text><rect x="30" y="246" width="270" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="277.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Task identity</text><text x="42" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a whole piece of work</text><rect x="30" y="338" width="270" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="369.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Task significance</text><text x="42" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">affects other people</text><rect x="30" y="430" width="270" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="42" y="461.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Autonomy</text><text x="42" y="489" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">freedom to plan and decide</text><rect x="30" y="522" width="270" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="42" y="553.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Feedback</text><text x="42" y="581" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">clear information on performance</text><rect x="360" y="154" width="260" height="264" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="280.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Experienced</text><text x="490" y="301.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">meaningfulness</text><rect x="360" y="430" width="260" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="464.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Experienced responsibility</text><text x="490" y="485.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">for outcomes</text><rect x="360" y="522" width="260" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="566.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Knowledge of results</text><line x1="304" y1="194" x2="354" y2="236" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="304" y1="286" x2="354" y2="286" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="304" y1="378" x2="354" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="304" y1="470" x2="354" y2="470" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="304" y1="562" x2="354" y2="562" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="680" y="154" width="190" height="448" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="332.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Outcomes</text><text x="700" y="361.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="715.2" y="361.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High internal</text><text x="715.2" y="382.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">motivation</text><text x="700" y="408.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="715.2" y="408.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Satisfaction</text><text x="700" y="434.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="715.2" y="434.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quality of work</text><line x1="624" y1="286" x2="674" y2="286" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="624" y1="470" x2="674" y2="470" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="624" y1="562" x2="674" y2="562" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="155" y="140" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CORE CHARACTERISTICS</text><text x="490" y="140" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PSYCHOLOGICAL STATES</text><text x="775" y="140" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">OUTCOMES</text><rect x="30" y="624" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="656" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="682.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Specific and testable</text><text x="50" y="710.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Guides practical redesign of jobs.</text><rect x="457" y="624" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="656" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="682.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Self-rated characteristics</text><text x="477" y="710.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Satisfied workers may rate their jobs more</text><text x="477" y="731.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">positively; people differ in how much growth</text><text x="477" y="752.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">they want.</text>
</svg>