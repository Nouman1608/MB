<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 753" width="900" height="753" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="753" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Blau and Boal: absence and commitment</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Job involvement × organisational commitment</text>
<rect x="250" y="158" width="305" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="402.5" y="208.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Institutionalised stars</text><text x="402.5" y="237.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">absent least, mainly involuntary</text><text x="402.5" y="258.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(illness)</text><rect x="565" y="158" width="305" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="717.5" y="208.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Lone wolves</text><text x="717.5" y="237.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">identify with the job, not the</text><text x="717.5" y="258.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">organisation</text><rect x="250" y="308" width="305" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="402.5" y="358.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Corporate citizens</text><text x="402.5" y="387.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">identify with the organisation, not</text><text x="402.5" y="408.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the job</text><rect x="565" y="308" width="305" height="140" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="717.5" y="358.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Apathetic employees</text><text x="717.5" y="387.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">absent most, often voluntary (by</text><text x="717.5" y="408.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">choice)</text><text x="402.5" y="142" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">High commitment</text><text x="717.5" y="142" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Low commitment</text><text x="230" y="234" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">High involvement</text><text x="230" y="384" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">Low involvement</text><rect x="30" y="470" width="413" height="66" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Job</tspan> <tspan font-weight="700" fill="#1e2a44">involvement</tspan>: how much a person identifies</text><text x="44" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with their job</text><rect x="457" y="470" width="413" height="66" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="471" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Organisational</tspan> <tspan font-weight="700" fill="#1e2a44">commitment</tspan>: how much they</text><text x="471" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identify with the organisation</text><rect x="30" y="558" width="413" height="83" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="236.5" y="590" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">INVOLUNTARY ABSENCE</text><text x="236.5" y="616.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">e.g. genuine illness</text><rect x="457" y="558" width="413" height="83" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="663.5" y="590" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">VOLUNTARY ABSENCE</text><text x="663.5" y="616.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Choosing not to attend</text><rect x="30" y="663" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="696.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The category predicts <tspan font-weight="700" fill="#1e2a44">how</tspan> <tspan font-weight="700" fill="#1e2a44">much</tspan> absence occurs and <tspan font-weight="700" fill="#1e2a44">why</tspan>.</text>
</svg>