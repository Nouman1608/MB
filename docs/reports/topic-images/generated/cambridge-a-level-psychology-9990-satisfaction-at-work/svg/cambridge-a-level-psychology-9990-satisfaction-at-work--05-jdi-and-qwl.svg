<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring job satisfaction</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The job descriptive index and quality of working life</text>
<rect x="30" y="124" width="840" height="200" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="160" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">JOB DESCRIPTIVE INDEX (JDI): FIVE FACETS</text><rect x="54" y="176" width="106.384" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="107.19200000000001" y="196.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">work itself</text><rect x="170.38400000000001" y="176" width="53.007999999999996" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="196.888" y="196.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">pay</text><rect x="233.392" y="176" width="240.16" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="353.472" y="196.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">opportunities for promotion</text><rect x="483.552" y="176" width="116.064" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="541.5840000000001" y="196.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">supervision</text><rect x="609.616" y="176" width="114.912" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="667.072" y="196.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">co-workers</text><text x="54" y="248" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Work itself:</text><text x="170" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“routine”</text><text x="270" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“fascinating”</text><rect x="420" y="227" width="52.128" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="446.064" y="247.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">yes</text><rect x="500" y="227" width="43.775999999999996" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="521.888" y="247.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">no</text><rect x="580" y="227" width="32.96" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="596.48" y="247.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">?</text><text x="660" y="248" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">? = cannot decide</text><text x="54" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quick, standardised, gives a <tspan font-weight="700">profile</tspan> <tspan font-weight="700">across</tspan> <tspan font-weight="700">facets</tspan>; self-report, so anonymity improves validity.</text><text x="450" y="362" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">WALTON’S QUALITY OF WORKING LIFE: EIGHT CONDITIONS</text><rect x="30" y="384" width="201" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130.5" y="420.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="130.5" y="445.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Fair compensation</text><rect x="243" y="384" width="201" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.5" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="343.5" y="435.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Safe, healthy</text><text x="343.5" y="456.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">conditions</text><rect x="456" y="384" width="201" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.5" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="556.5" y="435.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Use and develop</text><text x="556.5" y="456.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">capacities</text><rect x="669" y="384" width="201" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="769.5" y="420.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">4</text><text x="769.5" y="445.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Growth and security</text><rect x="30" y="486" width="201" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130.5" y="522.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">5</text><text x="130.5" y="547.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Social integration</text><rect x="243" y="486" width="201" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.5" y="512" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">6</text><text x="343.5" y="537.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Constitutionalism:</text><text x="343.5" y="558.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">rights</text><rect x="456" y="486" width="201" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="556.5" y="512" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">7</text><text x="556.5" y="537.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Work and total life</text><text x="556.5" y="558.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">space</text><rect x="669" y="486" width="201" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="769.5" y="522.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">8</text><text x="769.5" y="547.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Social relevance</text><rect x="30" y="598" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="631.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A <tspan font-weight="700" fill="#1e2a44">QWL</tspan> <tspan font-weight="700" fill="#1e2a44">evaluation</tspan> <tspan font-weight="700" fill="#1e2a44">scale</tspan> rates how far each condition is met. QWL is broader than the JDI: it</text><text x="450" y="653.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">includes work–life balance (7) and social responsibility (8).</text>
</svg>