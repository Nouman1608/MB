<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Aspects to build your essay around</text>

<rect x="30" y="110" width="180" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Play</text><rect x="210" y="110" width="200" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="222" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Opponent</text><rect x="410" y="110" width="270" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="422" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Setting</text><rect x="680" y="110" width="190" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="692" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><rect x="30" y="156" width="180" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="181.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Death of a</text><text x="42" y="202.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Salesman</text><rect x="210" y="156" width="200" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="181.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">—</text><rect x="410" y="156" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="422" y="181.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Brooklyn house hemmed in</text><text x="422" y="202.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by apartment blocks</text><rect x="680" y="156" width="190" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="692" y="181.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Memory scenes</text><rect x="30" y="220" width="180" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="245.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">A Streetcar</text><text x="42" y="266.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Named Desire</text><rect x="210" y="220" width="200" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="245.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stanley against</text><text x="222" y="266.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Blanche</text><rect x="410" y="220" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="422" y="245.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The cramped New Orleans flat</text><text x="422" y="266.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in Elysian Fields</text><rect x="680" y="220" width="190" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="692" y="245.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Eleven scenes</text><rect x="30" y="284" width="180" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="309.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Hedda Gabler</text><rect x="210" y="284" width="200" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="309.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Brack’s hold over</text><text x="222" y="330.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hedda</text><rect x="410" y="284" width="270" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="422" y="309.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">—</text><rect x="680" y="284" width="190" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="692" y="309.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Four acts compressed</text><text x="692" y="330.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">into a short span of</text><text x="692" y="351.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time</text><rect x="30" y="369" width="180" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="394.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Waiting for</text><text x="42" y="415.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Godot</text><rect x="210" y="369" width="200" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="394.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">—</text><rect x="410" y="369" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="422" y="394.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The country road and tree</text><rect x="680" y="369" width="190" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="692" y="394.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two parallel acts</text><rect x="30" y="433" width="180" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="458.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Translations</text><rect x="210" y="433" width="200" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="458.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Captain Lancey and</text><text x="222" y="479.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the military survey</text><rect x="410" y="433" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="422" y="458.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A Donegal hedge school, 1833</text><rect x="680" y="433" width="190" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="692" y="458.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">—</text><rect x="30" y="515" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="548.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Choose the aspects your play makes most interesting. Dashes mark aspects this guide does</text><text x="50" y="570.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">not name for that play.</text>
