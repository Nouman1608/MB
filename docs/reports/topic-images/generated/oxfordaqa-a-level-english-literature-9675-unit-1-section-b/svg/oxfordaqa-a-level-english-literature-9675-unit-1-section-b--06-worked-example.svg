<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing the view</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">“Willy Loman is a victim of his society rather than a tragic hero.”</text>
<line x1="215" y1="160" x2="685" y2="160" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,160 L420,252 L480,252 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="160" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="160" x2="160" y2="215" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="160" x2="270" y2="215" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,215 L290,215 Q275,242 215,242 Q155,242 140,215 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="160" x2="630" y2="215" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="160" x2="740" y2="215" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,215 L760,215 Q745,242 685,242 Q625,242 610,215 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="236" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">victim</text><text x="685" y="236" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">tragic hero</text><rect x="30" y="275" width="405" height="161" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="311" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Victim of his society</text><text x="50" y="340.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="340.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fired by Howard, son of the boss Willy</text><text x="66.15" y="362.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">worked for</text><text x="50" y="389.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="389.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The hollow promise of the salesman’s</text><text x="66.15" y="411.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">dream</text><rect x="465" y="275" width="405" height="161" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="319.5" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Tragic hero with a flaw</text><text x="485" y="349.1" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="349.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pride and self-deception</text><text x="485" y="376.1" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="376.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Refuses Charley’s job offer</text><text x="485" y="403.1" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="403.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Lies to the family</text><rect x="30" y="454" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="490" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement: partly agree</text><text x="50" y="519.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Willy is both: his flaw is shaped by the society he believes in. Test it with recognition</text><text x="50" y="541.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(does he ever see the truth Biff tells him?) and with the memory scenes, the past invading</text><text x="50" y="563.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the present.</text>
</svg>