<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 754" width="900" height="754" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="754" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What “later” tragedy changes</text>

<text x="150" y="120" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Older tragedy</text><text x="600" y="120" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Later tragedy</text><rect x="30" y="136" width="240" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="150" y="198" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Public figures</text><line x1="276" y1="191" x2="310" y2="191" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="316" y="136" width="554" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="170" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Ordinary people</text><text x="336" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Willy a travelling salesman; Hedda in a suburban marriage; Blanche</text><text x="336" y="217" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a schoolteacher. Miller: “Tragedy and the Common Man” (1949).</text><rect x="30" y="258" width="240" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="150" y="320" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Fate or the gods</text><line x1="276" y1="313" x2="310" y2="313" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="316" y="258" width="554" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="292" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Society and psychology</text><text x="336" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Social pressure, money, class, gender and the mind: Hedda trapped</text><text x="336" y="339" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by marriage and Brack; Willy’s belief in being well liked.</text><rect x="30" y="380" width="240" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="150" y="442" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Catastrophe</text><line x1="276" y1="435" x2="310" y2="435" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="316" y="380" width="554" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="414" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Absence</text><text x="336" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Godot never comes; the second act echoes the first: the missing</text><text x="336" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">catastrophe is the point.</text><rect x="30" y="502" width="240" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="150" y="564" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">The individual</text><line x1="276" y1="557" x2="310" y2="557" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="316" y="502" width="554" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="536" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">The community</text><text x="336" y="562" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Translations: suffering extends to a language and a community; the</text><text x="336" y="583" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protagonist may be collective.</text><rect x="30" y="628" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="661.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The specification: every set text has “a tragic hero or heroine who is flawed in some way,</text><text x="50" y="683.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">who suffers and causes suffering to others”. The later plays test how far that model still</text><text x="50" y="705.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">holds.</text>
</svg>