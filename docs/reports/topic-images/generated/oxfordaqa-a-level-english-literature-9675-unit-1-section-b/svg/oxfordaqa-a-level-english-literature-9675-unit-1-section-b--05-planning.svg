<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 752" width="900" height="752" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="752" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a Section B essay</text>

<line x1="62" y1="130" x2="62" y2="610" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="110" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Decide your answer</text><text x="128" y="175.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One sentence, before you write.</text><circle cx="62" cy="155" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="163.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="212" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="248" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Choose three or four aspects</text><text x="128" y="277.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">That test the view, including at least one that complicates it.</text><circle cx="62" cy="257" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="265.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="314" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Select evidence from across the play</text><text x="128" y="379.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The opening, a turning point and the ending at least: short quotations or precise</text><text x="128" y="401.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">references.</text><circle cx="62" cy="370" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="378.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="438" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="474" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Place one alternative reading</text><text x="128" y="503.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Where it fits, then weigh it.</text><circle cx="62" cy="483" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="491.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="540" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="576" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">End on the audience</text><text x="128" y="605.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What kind of pity, fear or understanding the play leaves.</text><circle cx="62" cy="585" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="593.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="648" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="681.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Whether the question offers a view to debate or asks about the significance of an aspect,</text><text x="50" y="703.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the plan is the same. Allow about an hour.</text>
</svg>