<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 733" width="900" height="733" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="733" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Removing school fees: effect, limits, judgement</text>

<rect x="250" y="104" width="400" height="89" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">ACTION</text><text x="450" y="165.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Remove school fees</text><line x1="450" y1="199" x2="450" y2="233" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="200" y="251" width="500" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="284" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">EFFECT</text><text x="450" y="309.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tackles the cost barrier: enrolment likely</text><text x="450" y="333.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">rises among the poorest families</text><line x1="450" y1="365" x2="250" y2="399" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="365" x2="650" y2="399" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="417" width="408" height="156" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="450" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMIT</text><text x="50" y="475.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Without more teachers and</text><text x="50" y="499.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">classrooms</text><text x="50" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Class sizes rise and quality may fall: more</text><text x="50" y="548.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">children attend without learning more.</text><rect x="462" y="417" width="408" height="156" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="450" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMIT</text><text x="482" y="475.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fees are only one cost</text><text x="482" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Uniforms, transport and lost family income</text><text x="482" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">remain.</text><rect x="30" y="591" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="627" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="656.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Works best as part of a package with funding for teachers. Judge success by learning</text><text x="50" y="678.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">results as well as enrolment.</text>
</svg>