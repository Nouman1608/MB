<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why some children are out of school</text>

<line x1="300" y1="164.5" x2="369.25" y2="224.95" stroke="#1e2a44" stroke-width="2.5"/><line x1="300" y1="268" x2="369.25" y2="261.175" stroke="#1e2a44" stroke-width="2.5"/><line x1="300" y1="361" x2="369.25" y2="293.725" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="143.5" x2="530.75" y2="217.6" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="247" x2="530.75" y2="253.825" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="361" x2="530.75" y2="293.725" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="257.5" r="95" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="252" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A child out</text><text x="450" y="277" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">of school</text><g transform="translate(0,10.5)"><rect x="30" y="104" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cost</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fees, uniforms, books,</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">transport, lost income</text><rect x="30" y="218" width="270" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Distance and safety</text><text x="46" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a long or unsafe journey</text><rect x="30" y="311" width="270" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="341.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Supply</text><text x="46" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">too few schools or teachers</text></g><g transform="translate(0,0)"><rect x="600" y="104" width="270" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conflict or disaster</text><text x="616" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">schools closed or destroyed</text><rect x="600" y="197" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="227.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Social expectations</text><text x="616" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who needs education; early</text><text x="616" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">marriage</text><rect x="600" y="311" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="341.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Disability</text><text x="616" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">buildings or teaching not</text><text x="616" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">meeting needs</text></g><text x="450" y="449" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Turn causes into a chain</text><rect x="30" y="475" width="180" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="499.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Nearest</text><text x="120" y="520.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">secondary school</text><text x="120" y="541.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">is far away</text><line x1="216" y1="516.5" x2="244" y2="516.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="475" width="180" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="510.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Transport costs</text><text x="340" y="531.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">money</text><line x1="436" y1="516.5" x2="464" y2="516.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="475" width="180" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="499.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Families with</text><text x="560" y="520.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">less money keep</text><text x="560" y="541.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">children home</text><line x1="656" y1="516.5" x2="684" y2="516.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="475" width="180" height="83" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="780" y="499.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Children leave</text><text x="780" y="520.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">with fewer</text><text x="780" y="541.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">qualifications</text><rect x="30" y="576" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="609.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each arrow is a claim you should support with evidence.</text>
</svg>