<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Consequences reach every level</text>

<circle cx="205" cy="306" r="180" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="306" r="135" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="306" r="90" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="306" r="45" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="205" y="312" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal</text><text x="205" y="379.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Local</text><text x="205" y="424.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">National</text><text x="205" y="469.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Global</text><path d="M249.8,307 C334.9,307 334.9,144.5 416,144.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="249.8" cy="307" r="4" fill="#1e2a44"/><path d="M236,374.5 C328,374.5 328,248.5 416,248.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="236" cy="374.5" r="4" fill="#1e2a44"/><path d="M249.8,419.5 C334.9,419.5 334.9,363.5 416,363.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="249.8" cy="419.5" r="4" fill="#1e2a44"/><path d="M240.6,464.5 C330.3,464.5 330.3,467.5 416,467.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="240.6" cy="464.5" r="4" fill="#1e2a44"/><rect x="420" y="104" width="450" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="135.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Personal</text><text x="436" y="164.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fewer choices of work and further study.</text><rect x="420" y="197" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="228.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Local</text><text x="436" y="257.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fewer trained people, such as teachers and</text><text x="436" y="279.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">nurses, in the community.</text><rect x="420" y="312" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="343.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">National</text><text x="436" y="372.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Effects on the economy and on how informed</text><text x="436" y="394.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">citizens are.</text><rect x="420" y="427" width="450" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="458.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Global</text><text x="436" y="487.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Slower progress on shared goals such as SDG 4.</text>
</svg>