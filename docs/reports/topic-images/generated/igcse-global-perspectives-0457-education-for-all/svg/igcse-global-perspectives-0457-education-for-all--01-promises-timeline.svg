<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Education for all: promises on paper</text>

<line x1="60" y1="240" x2="850" y2="240" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="120" cy="240" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="214" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1948</text><line x1="120" y1="253" x2="120" y2="270" stroke="#1e2a44" stroke-width="2.5"/><rect x="18" y="270" width="204" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="294.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Universal</text><text x="120" y="315.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Declaration of</text><text x="120" y="336.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Human Rights,</text><text x="120" y="357.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 26</text><text x="120" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Right to education;</text><text x="120" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">free and compulsory at</text><text x="120" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">elementary stage</text><circle cx="340" cy="240" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="340" y="214" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1990</text><line x1="340" y1="253" x2="340" y2="270" stroke="#1e2a44" stroke-width="2.5"/><rect x="238" y="270" width="204" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="294.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">World Conference on</text><text x="340" y="315.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Education for All</text><text x="340" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Jomtien, Thailand</text><circle cx="560" cy="240" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="560" y="214" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2010</text><line x1="560" y1="253" x2="560" y2="270" stroke="#1e2a44" stroke-width="2.5"/><rect x="458" y="270" width="204" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="294.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan, Article</text><text x="560" y="315.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">25-A</text><text x="560" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Free, compulsory</text><text x="560" y="362" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">education for ages five</text><text x="560" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to sixteen</text><circle cx="780" cy="240" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="780" y="214" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2015</text><line x1="780" y1="253" x2="780" y2="270" stroke="#1e2a44" stroke-width="2.5"/><rect x="678" y="270" width="204" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="780" y="294.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sustainable</text><text x="780" y="315.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Development Goal 4</text><text x="780" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Inclusive, equitable</text><text x="780" y="362" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">quality education for</text><text x="780" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">all</text><text x="450" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">What governments have agreed or promised</text><rect x="30" y="464" width="408" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="509.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRONG EVIDENCE OF</text><text x="50" y="535.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What was agreed or promised</text><rect x="462" y="464" width="408" height="110" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="497" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAK EVIDENCE OF</text><text x="482" y="523.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What actually happens in</text><text x="482" y="548.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">classrooms</text><rect x="30" y="592" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="625.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">To judge progress, use data such as enrolment and completion figures, and check how recent</text><text x="50" y="647.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and reliable it is.</text>
</svg>