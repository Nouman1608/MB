<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From one market to “the whole country”?</text>

<rect x="30" y="114" width="840" height="132" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="147" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FICTIONAL SOURCE: CAMPAIGN GROUP FOR FREE SCHOOLING</text><text x="50" y="172.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">300 parents at a market in Marrowby were asked why a child left school. 45%</text><text x="50" y="196.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">said fees. “Fees are the main reason children leave school across the</text><text x="50" y="220.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">country.”</text><rect x="30" y="260" width="378" height="70" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="408" y="260" width="462" height="70" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="219" y="292" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">45% named fees</text><text x="219" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">135 parents</text><text x="639" y="292" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">55% gave other reasons</text><text x="639" y="316" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">which weakens the word “main”</text><rect x="30" y="352" width="170" height="49" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="383.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Claim</text><rect x="214" y="352" width="656" height="49" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="380.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fees are the main reason children leave school nationally.</text><rect x="30" y="413" width="170" height="49" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="444.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Supports</text><rect x="214" y="413" width="656" height="49" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fees matter in Marrowby: one important local barrier.</text><rect x="30" y="474" width="170" height="91" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="526.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Weaknesses</text><rect x="214" y="474" width="656" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One market in one town; “across the country” is a generalisation; less than</text><text x="230" y="523.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">half named fees; the group has a vested interest that may have shaped the</text><text x="230" y="544.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">question.</text><rect x="30" y="577" width="170" height="49" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="608.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement</text><rect x="214" y="577" width="656" height="49" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="605.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Useful locally, not reliable enough to support a national claim.</text>
</svg>