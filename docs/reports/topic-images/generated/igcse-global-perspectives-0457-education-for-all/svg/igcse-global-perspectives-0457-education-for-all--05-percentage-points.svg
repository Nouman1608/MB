<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 614" width="900" height="614" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="614" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Percentage points or per cent?</text>

<line x1="80" y1="450" x2="520" y2="450" stroke="#1e2a44" stroke-width="3"/><rect x="150" y="245.99999999999997" width="120" height="204.00000000000003" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="233.99999999999997" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">68%</text><text x="210" y="478" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Before</text><rect x="350" y="201" width="120" height="249" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="410" y="189" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">83%</text><text x="410" y="478" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">After</text><line x1="270" y1="245.99999999999997" x2="470" y2="245.99999999999997" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 6"/><line x1="490" y1="201" x2="490" y2="245.99999999999997" stroke="#b5602e" stroke-width="4" marker-start="url(#ahR)" marker-end="url(#ahR)"/><rect x="560" y="160" width="310" height="117" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="580" y="193" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ABSOLUTE CHANGE</text><text x="580" y="221.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">+15 percentage points</text><text x="580" y="252.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">83 − 68 = 15</text><rect x="560" y="310" width="310" height="117" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="580" y="343" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELATIVE CHANGE</text><text x="580" y="371.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">about a 22% rise</text><text x="580" y="402.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">15 ÷ 68 ≈ 0.22</text><rect x="30" y="506" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="539.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A source that mixes these up may be careless, or may be exaggerating. Watch for loaded</text><text x="50" y="561.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">words such as “disastrous” or “miracle” too.</text>
</svg>