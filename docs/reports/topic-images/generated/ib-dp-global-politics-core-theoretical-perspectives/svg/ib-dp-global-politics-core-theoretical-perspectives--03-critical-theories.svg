<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three critical perspectives</text>

<rect x="30" y="115" width="840" height="125" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="153.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Social constructivism</text><text x="48" y="181.02" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ideas, identities and norms shape what states want</text><text x="48" y="202.14000000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wendt (1992): “Anarchy is what states make of it”; norm entrepreneurs, e.g. landmine campaign →</text><text x="48" y="223.26000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ottawa Treaty (1997)</text><rect x="30" y="255" width="840" height="125" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="301.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Feminism</text><text x="48" y="329.02" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gender as a category of analysis; security of people, not only states</text><text x="48" y="350.14" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Enloe, Bananas, Beaches and Bases; UNSC Resolution 1325 (2000); several strands</text><rect x="30" y="395" width="840" height="125" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="441.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Postcolonialism</text><text x="48" y="469.02" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">colonialism still shapes borders, economies, institutions and thought</text><text x="48" y="490.14" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Said, Orientalism (1978); Mignolo; agency of the Global South</text>
</svg>