<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five lenses on the four key concepts</text>

<rect x="30" y="110" width="840" height="51.760000000000005" rx="12" fill="#2e6b62"/><text x="42" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start"></text><text x="192" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Power</text><text x="357" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Sovereignty</text><text x="522" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Legitimacy</text><text x="687" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Interdependence</text><rect x="30" y="157.76" width="840" height="59.6" fill="#ffffff"/><text x="42" y="182.51" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Realism</text><text x="192" y="182.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">material, mainly</text><text x="192" y="202.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">military; relative</text><text x="357" y="182.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">central basis of</text><text x="357" y="202.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the state system</text><text x="522" y="182.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">follows effective</text><text x="522" y="202.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">control</text><text x="687" y="182.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">creates vulnerability</text><rect x="30" y="217.35999999999999" width="840" height="59.6" fill="#f7f9f9"/><text x="42" y="242.10999999999999" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Liberalism</text><text x="192" y="242.10999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">spread across</text><text x="192" y="261.90999999999997" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">actors; soft power</text><text x="357" y="242.10999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">can be pooled</text><text x="357" y="261.90999999999997" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(e.g. EU)</text><text x="522" y="242.10999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">consent, law,</text><text x="522" y="261.90999999999997" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">democratic process</text><text x="687" y="242.10999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">raises cost of war;</text><text x="687" y="261.90999999999997" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cooperation</text><line x1="30" y1="217.35999999999999" x2="870" y2="217.35999999999999" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="276.96" width="840" height="79.4" fill="#ffffff"/><text x="42" y="301.71" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Constructivism</text><text x="192" y="301.71" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">includes power</text><text x="192" y="321.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">over ideas</text><text x="357" y="301.71" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a social</text><text x="357" y="321.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">institution that</text><text x="357" y="341.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">changes</text><text x="522" y="301.71" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">shared norms and</text><text x="522" y="321.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">recognition</text><text x="687" y="301.71" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">shapes identities;</text><text x="687" y="321.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">builds trust</text><line x1="30" y1="276.96" x2="870" y2="276.96" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="356.36" width="840" height="79.4" fill="#f7f9f9"/><text x="42" y="381.11" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Feminism</text><text x="192" y="381.11" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">often “power</text><text x="192" y="400.91" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">over”; asks about</text><text x="192" y="420.71000000000004" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">“power with”</text><text x="357" y="381.11" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">can hide harm in</text><text x="357" y="400.91" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">private life</text><text x="522" y="381.11" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">questioned where</text><text x="522" y="400.91" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">women excluded</text><text x="687" y="381.11" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">gendered supply and</text><text x="687" y="400.91" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">care chains</text><line x1="30" y1="356.36" x2="870" y2="356.36" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="435.76" width="840" height="79.4" fill="#ffffff"/><text x="42" y="460.51" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Postcolonialism</text><text x="192" y="460.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">built on</text><text x="192" y="480.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">historical</text><text x="192" y="500.11" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hierarchy</text><text x="357" y="460.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">often limited for</text><text x="357" y="480.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">former colonies</text><text x="522" y="460.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">who holds seats</text><text x="522" y="480.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and vetoes</text><text x="687" y="460.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">can mean dependency</text><line x1="30" y1="435.76" x2="870" y2="435.76" stroke="#c9d6d4" stroke-width="1.5"/><line x1="180" y1="157.76" x2="180" y2="515.16" stroke="#c9d6d4" stroke-width="1.5"/><line x1="345" y1="157.76" x2="345" y2="515.16" stroke="#c9d6d4" stroke-width="1.5"/><line x1="510" y1="157.76" x2="510" y2="515.16" stroke="#c9d6d4" stroke-width="1.5"/><line x1="675" y1="157.76" x2="675" y2="515.16" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="110" width="840" height="405.15999999999997" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/><rect x="30" y="535.16" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="565.36" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">R2P (2005): for a constructivist, a norm changing what sovereignty means; for a realist, selective</text><text x="450" y="586.48" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">use shows power still decides.</text>
</svg>