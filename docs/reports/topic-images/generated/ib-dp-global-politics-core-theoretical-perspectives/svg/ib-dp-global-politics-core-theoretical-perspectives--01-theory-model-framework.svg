<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 533" width="900" height="533" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="533" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Theories, models and frameworks</text>

<rect x="30" y="115" width="270" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Theory</text><text x="48" y="179.41" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">linked assumptions that claim</text><text x="48" y="199.87" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">to explain how politics works</text><text x="48" y="220.32999999999998" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">e.g. realism</text><rect x="315" y="115" width="270" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="333" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Model</text><text x="333" y="179.41" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">a simplified picture of one</text><text x="333" y="199.87" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">part, often a set of</text><text x="333" y="220.32999999999998" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">categories</text><text x="333" y="240.79" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">e.g. hard, soft and smart</text><text x="333" y="261.25" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">power</text><rect x="600" y="115" width="270" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="618" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Analytical framework</text><text x="618" y="179.41" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">a structured way of asking</text><text x="618" y="199.87" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">questions of a case</text><text x="618" y="220.32999999999998" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">e.g. looking at scales: global</text><text x="618" y="240.79" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">to local</text><text x="30" y="325" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">What these tools do</text><rect x="30" y="340" width="123.33333333333333" height="64" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="91.66666666666666" y="379.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Organise</text><line x1="156.33333333333331" y1="372" x2="168.33333333333331" y2="372" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="173.33333333333331" y="340" width="123.33333333333333" height="64" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="234.99999999999997" y="379.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Simplify</text><line x1="299.66666666666663" y1="372" x2="311.66666666666663" y2="372" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="316.66666666666663" y="340" width="123.33333333333333" height="64" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="378.3333333333333" y="379.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain</text><line x1="442.99999999999994" y1="372" x2="454.99999999999994" y2="372" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="459.99999999999994" y="340" width="123.33333333333333" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="521.6666666666666" y="379.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Predict</text><line x1="586.3333333333333" y1="372" x2="598.3333333333333" y2="372" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="603.3333333333333" y="340" width="123.33333333333333" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="664.9999999999999" y="379.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Prescribe</text><line x1="729.6666666666666" y1="372" x2="741.6666666666666" y2="372" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="746.6666666666665" y="340" width="123.33333333333333" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="808.3333333333331" y="379.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluate</text><rect x="30" y="430" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="460.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Realism and liberalism mainly explain; the critical theories also ask whose interests a way of</text><text x="450" y="481.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">seeing serves.</text>
</svg>