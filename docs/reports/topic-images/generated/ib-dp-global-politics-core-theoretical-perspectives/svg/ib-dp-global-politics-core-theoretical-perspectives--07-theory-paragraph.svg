<rect x="30" y="110" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="168.3" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="178.38000000000002" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="136" y="149.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Claim</text><text x="136" y="175.57" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the perspective’s argument: realists expect states to protect their own</text><text x="136" y="198.01" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">populations first</text><rect x="30" y="240.6" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="287.68" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="297.76" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="136" y="280.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Case</text><text x="136" y="306.17" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">COVID-19: several states restricted exports of vaccines or medical supplies</text><rect x="30" y="348.76" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="395.84" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="405.91999999999996" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="136" y="388.61" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Link to a key concept</text><text x="136" y="414.33000000000004" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sovereignty and national interest override cooperation under pressure</text><rect x="30" y="456.91999999999996" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="515.2199999999999" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="525.3" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="136" y="496.77" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Limit and other lenses</text><text x="136" y="522.49" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">COVAX (2020) pooled funding (liberal); lower-income states waited longest</text><text x="136" y="544.9300000000001" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(postcolonial)</text>
