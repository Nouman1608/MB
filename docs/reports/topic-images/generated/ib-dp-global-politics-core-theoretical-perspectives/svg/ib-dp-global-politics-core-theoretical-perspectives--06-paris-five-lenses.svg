<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One case, five lenses: the Paris Agreement</text>

<rect x="30" y="115" width="840" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="150.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Why did almost every state join an agreement that lets each set its own target?</text><text x="450" y="175.9" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Paris Agreement, 2015: nationally determined contributions</text><rect x="30" y="215" width="840" height="72" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="42" y="245.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Realism</text><text x="42" y="271.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">self-set targets protected sovereignty and economic power against rivals</text><rect x="30" y="299" width="840" height="72" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="42" y="329.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Liberalism</text><text x="42" y="355.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">an institution: reporting and review expose free-riding; all gain from a stable climate</text><rect x="30" y="383" width="840" height="72" rx="12" fill="#f2e7b8" stroke="#2e6b62" stroke-width="2.2"/><text x="42" y="413.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Constructivism</text><text x="42" y="439.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">climate action became a norm of responsible statehood; staying out hurt reputation</text><rect x="30" y="467" width="840" height="72" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="42" y="497.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Feminism</text><text x="42" y="523.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">who decides and who bears the cost: delegations; unpaid care and food work</text><rect x="30" y="551" width="840" height="72" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="42" y="581.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Postcolonialism</text><text x="42" y="607.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">historical emissions; common but differentiated responsibilities (1992); loss and damage fund (COP27, 2022)</text><rect x="30" y="641" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="671.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Evaluate: realism explains voluntary targets, liberalism the reviews, critical theories who is</text><text x="450" y="692.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">missing.</text>
</svg>