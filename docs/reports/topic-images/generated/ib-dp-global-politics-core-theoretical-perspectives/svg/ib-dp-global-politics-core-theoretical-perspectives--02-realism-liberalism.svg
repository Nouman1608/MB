<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 457" width="900" height="457" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="457" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Realism and liberalism compared</text>

<rect x="30" y="110" width="840" height="51.760000000000005" rx="12" fill="#2e6b62"/><text x="42" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start"></text><text x="242" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Realism</text><text x="562" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Liberalism</text><rect x="30" y="157.76" width="840" height="62.24000000000001" fill="#ffffff"/><text x="42" y="183.35999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Starting point</text><text x="242" y="183.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anarchy: no authority above states;</text><text x="242" y="204.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-help</text><text x="562" y="183.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anarchy exists, but cooperation is</text><text x="562" y="204.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">possible and common</text><rect x="30" y="220" width="840" height="41.120000000000005" fill="#f7f9f9"/><text x="42" y="245.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Main actors</text><text x="242" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">states</text><text x="562" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">states plus IGOs, companies, NGOs</text><line x1="30" y1="220" x2="870" y2="220" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="261.12" width="840" height="62.24000000000001" fill="#ffffff"/><text x="42" y="286.72" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Gains</text><text x="242" y="286.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relative gains: compared with rivals</text><text x="562" y="286.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">absolute gains: better off, even if a</text><text x="562" y="307.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">partner gains more</text><line x1="30" y1="261.12" x2="870" y2="261.12" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="323.36" width="840" height="62.24000000000001" fill="#f7f9f9"/><text x="42" y="348.96000000000004" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Key ideas</text><text x="242" y="348.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">national interest as security;</text><text x="242" y="370.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">security dilemma</text><text x="562" y="348.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">institutions reduce cheating; complex</text><text x="562" y="370.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interdependence; democratic peace</text><line x1="30" y1="323.36" x2="870" y2="323.36" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="385.6" width="840" height="41.120000000000005" fill="#ffffff"/><text x="42" y="411.20000000000005" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Thinkers</text><text x="242" y="411.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Morgenthau; Waltz (1979); Mearsheimer</text><text x="562" y="411.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Keohane and Nye (1977)</text><line x1="30" y1="385.6" x2="870" y2="385.6" stroke="#c9d6d4" stroke-width="1.5"/><line x1="230" y1="157.76" x2="230" y2="426.72" stroke="#c9d6d4" stroke-width="1.5"/><line x1="550" y1="157.76" x2="550" y2="426.72" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="110" width="840" height="316.72" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/>
</svg>