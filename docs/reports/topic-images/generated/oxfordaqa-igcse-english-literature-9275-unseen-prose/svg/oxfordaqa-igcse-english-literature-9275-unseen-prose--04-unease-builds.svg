<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the unease builds</text>

<rect x="30" y="120" width="260" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="154" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Paragraph 1</text><text x="50" y="184" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Routine</text><text x="50" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Days pass; the letter</text><text x="50" y="237" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stays, face down.</text><rect x="50" y="280" width="28" height="18" rx="4" fill="#b5602e" stroke="#b5602e" stroke-width="2"/><rect x="84" y="280" width="28" height="18" rx="4" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><rect x="118" y="280" width="28" height="18" rx="4" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="162" y="295" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">unease</text><line x1="294" y1="220" x2="316" y2="220" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="120" width="260" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="154" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Paragraph 2</text><text x="340" y="184" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Avoidance</text><text x="340" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The mother handles it but</text><text x="340" y="237" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">does not open it.</text><rect x="340" y="280" width="28" height="18" rx="4" fill="#b5602e" stroke="#b5602e" stroke-width="2"/><rect x="374" y="280" width="28" height="18" rx="4" fill="#b5602e" stroke="#b5602e" stroke-width="2"/><rect x="408" y="280" width="28" height="18" rx="4" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="452" y="295" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">unease</text><line x1="584" y1="220" x2="606" y2="220" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="120" width="260" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="154" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Paragraph 3</text><text x="630" y="184" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Silence</text><text x="630" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">It is gone; nobody</text><text x="630" y="237" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mentions it; dinner is</text><text x="630" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suddenly generous.</text><rect x="630" y="280" width="28" height="18" rx="4" fill="#b5602e" stroke="#b5602e" stroke-width="2"/><rect x="664" y="280" width="28" height="18" rx="4" fill="#b5602e" stroke="#b5602e" stroke-width="2"/><rect x="698" y="280" width="28" height="18" rx="4" fill="#b5602e" stroke="#b5602e" stroke-width="2"/><text x="742" y="295" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">unease</text><rect x="30" y="342" width="397" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="375" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LEFT UNRESOLVED</text><text x="50" y="401.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What the letter said is never</text><text x="50" y="426.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">revealed</text><line x1="433" y1="397" x2="467" y2="397" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="342" width="397" height="110" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="493" y="387.5" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">SO THE READER</text><text x="493" y="413.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Shares Anil’s uncertainty</text><rect x="30" y="468" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="501.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Do not guess what the letter contains: analyse how the uncertainty is created.</text>
</svg>