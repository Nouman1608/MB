<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 846" width="900" height="846" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="846" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four points through one extract</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How does the writer create a sense of unease?</text>
<rect x="30" y="126" width="474" height="548" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="162" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan>The letter had been on the hall table for </tspan><tspan fill="#b5602e" font-weight="700">three days</tspan><tspan>.</tspan></text><text x="50" y="191" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan>Anil walked past it in the mornings with his</tspan></text><text x="50" y="220" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan>school bag </tspan><tspan fill="#b5602e" font-weight="700">over one shoulder</tspan><tspan>, and in the</tspan></text><text x="50" y="249" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan>evenings with his school bag </tspan><tspan fill="#b5602e" font-weight="700">over the other</tspan><tspan>,</tspan></text><text x="50" y="278" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan>and each time it was still there, face down,</tspan></text><text x="50" y="307" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">as if it were sulking</tspan><tspan>.</tspan></text><text x="50" y="348" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan>His mother had not opened it either. She</tspan></text><text x="50" y="377" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">dusted around it</tspan><tspan>. Once, he saw her pick it up,</tspan></text><text x="50" y="406" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan>weigh it in her palm </tspan><tspan fill="#b5602e" font-weight="700">the way she weighed</tspan></text><text x="50" y="435" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">onions at the market</tspan><tspan>, and put it back </tspan><tspan fill="#b5602e" font-weight="700">exactly</tspan></text><text x="50" y="464" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan>where it had been, lining its edge up with</tspan></text><text x="50" y="493" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan>the edge of the table.</tspan></text><text x="50" y="534" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">On the fourth evening the letter was gone.</tspan></text><text x="50" y="563" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">Nobody mentioned it.</tspan><tspan> At dinner his mother</tspan></text><text x="50" y="592" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan>served him </tspan><tspan fill="#b5602e" font-weight="700">twice as much rice</tspan><tspan> as usual and</tspan></text><text x="50" y="621" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan>asked him about his day, and listened to</tspan></text><text x="50" y="650" font-size="16" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">every word</tspan><tspan> of his answer.</tspan></text><line x1="456" y1="146" x2="456" y2="311" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><circle cx="480" cy="228.5" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="480" y="233.54" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="456" y1="361" x2="456" y2="439" stroke="#2e6b62" stroke-width="4" stroke-linecap="round"/><circle cx="480" cy="400" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="480" y="405.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="456" y1="518" x2="456" y2="567" stroke="#b5602e" stroke-width="4" stroke-linecap="round"/><circle cx="480" cy="542.5" r="14" fill="#f6e3d6" stroke="#1e2a44" stroke-width="3"/><text x="480" y="547.54" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="456" y1="576" x2="456" y2="654" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><circle cx="480" cy="615" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="480" y="620.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="516" y="126" width="354" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="528" y="151" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">POINT 1 · THE LETTER AS A PRESENCE</text><text x="528" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">“Three days” counts the time;</text><text x="528" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">personification gives it a mood; the</text><text x="528" y="220" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">balanced school-bag sentence shows routine</text><text x="528" y="240" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">while the letter stays.</text><rect x="516" y="266" width="354" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="528" y="291" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POINT 2 · AVOIDANCE THROUGH ACTION</text><text x="528" y="320" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">No access to the mother’s thoughts:</text><text x="528" y="340" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cleaning becomes avoidance; the onion</text><text x="528" y="360" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">simile shows her measuring it; “exactly”</text><text x="528" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">suggests control.</text><rect x="516" y="406" width="354" height="110" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="528" y="431" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">POINT 3 · STRUCTURE AND SILENCE</text><text x="528" y="460" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A short sentence breaks the pattern of</text><text x="528" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">three days; the even shorter “Nobody</text><text x="528" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">mentioned it” makes the silence heavy.</text><rect x="516" y="526" width="354" height="110" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="528" y="551" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">POINT 4 · THE ENDING</text><text x="528" y="580" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Warmth reads as over-compensation; what</text><text x="528" y="600" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the letter said is never revealed, so the</text><text x="528" y="620" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">unease stays unresolved.</text><rect x="30" y="690" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="723" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INTERPRETATION</text><text x="50" y="753.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unease is built through what the characters avoid: the letter becomes more threatening the</text><text x="50" y="775.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">less it is discussed.</text><text x="30" y="826" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Original extract written for the guide. The answer never guesses what the letter contains.</text>
</svg>