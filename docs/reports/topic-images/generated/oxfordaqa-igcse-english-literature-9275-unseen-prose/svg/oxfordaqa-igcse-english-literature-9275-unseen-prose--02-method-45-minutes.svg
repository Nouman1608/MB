<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A method for the 45 minutes</text>

<text x="30" y="138" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Minutes (45)</text><rect x="30" y="150" width="18.666666666666668" height="56" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="30" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1 minute: the question</text><rect x="48.66666666666667" y="150" width="74.66666666666667" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="86" y="175" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Sense</text><text x="86" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">4</text><rect x="123.33333333333334" y="150" width="93.33333333333333" height="56" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="175" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Method</text><text x="170" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">5</text><rect x="216.66666666666669" y="150" width="93.33333333333333" height="56" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="263.33333333333337" y="175" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Plan</text><text x="263.33333333333337" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">5</text><rect x="310" y="150" width="560" height="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="590" y="175" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Write</text><text x="590" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">about 30</text><line x1="62" y1="266" x2="62" y2="714" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="246" width="762" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="280.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Read the question first</text><text x="128" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Underline the focus: a character, a relationship, an atmosphere, a moment of change.</text><circle cx="62" cy="289.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="298.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="341" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="375.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Read the extract for sense</text><text x="128" y="403.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who, where, what happens, and how does it end?</text><circle cx="62" cy="384.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="393.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="436" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="470.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Read again for method</text><text x="128" y="498.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Annotate only details that relate to the question. Mark where the extract shifts.</text><circle cx="62" cy="479.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="488.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="531" width="762" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="565.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Plan</text><text x="128" y="593.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A one-sentence interpretation and three or four points following the extract from</text><text x="128" y="614.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">opening to ending.</text><circle cx="62" cy="585" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="593.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="647" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="681.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Write</text><text x="128" y="709.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Introduction, developed paragraphs, and a conclusion on how the extract ends.</text><circle cx="62" cy="690.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="699.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>