<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CAROLINGIANS: A SUCCESSION CRISIS</text><rect x="30" y="162" width="183" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="190.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Charlemagne</text><text x="44" y="218.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Empire built by</text><text x="44" y="239.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">annual campaigns</text><line x1="219" y1="210" x2="243" y2="210" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="249" y="162" width="183" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="263" y="190.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Louis the Pious</text><text x="263" y="218.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inherits the empire</text><text x="263" y="239.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">intact</text><line x1="438" y1="210" x2="462" y2="210" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="468" y="162" width="183" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="200.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Louis's sons</text><text x="482" y="229.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fight each other</text><line x1="657" y1="210" x2="681" y2="210" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="687" y="162" width="183" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="701" y="200.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Treaty of Verdun</text><text x="701" y="229.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">843: empire divided</text><text x="30" y="304" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">ABBASIDS: MILITARY DEPENDENCE</text><rect x="30" y="328" width="183" height="119" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="356.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Turkish slave</text><text x="44" y="379.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">soldiers</text><text x="44" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Caliphs depend on</text><text x="44" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">them</text><line x1="219" y1="387.5" x2="243" y2="387.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="249" y="328" width="183" height="119" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="263" y="356.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Commanders</text><text x="263" y="379.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">dominate</text><text x="263" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Military leaders</text><text x="263" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">control the caliphs</text><line x1="438" y1="387.5" x2="462" y2="387.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="468" y="328" width="183" height="119" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="366.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Buyids take</text><text x="482" y="389.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Baghdad</text><text x="482" y="418.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">945</text><line x1="657" y1="387.5" x2="681" y2="387.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="687" y="328" width="183" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="701" y="366.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Caliph a</text><text x="701" y="389.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">figurehead</text><text x="701" y="418.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Religious role only</text><rect x="80.88" y="469" width="143.216" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="152.488" y="489.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Overexpansion</text><rect x="234.096" y="469" width="118.448" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="293.32" y="489.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Fiscal strain</text><rect x="362.544" y="469" width="96.448" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="410.768" y="489.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Rebellion</text><rect x="468.99199999999996" y="469" width="153.728" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="545.856" y="489.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Foreign invasion</text><rect x="632.72" y="469" width="186.4" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="725.9200000000001" y="489.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Succession disputes</text><text x="450" y="534.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Recurring causes of decline: explain which mattered most in each case.</text>
