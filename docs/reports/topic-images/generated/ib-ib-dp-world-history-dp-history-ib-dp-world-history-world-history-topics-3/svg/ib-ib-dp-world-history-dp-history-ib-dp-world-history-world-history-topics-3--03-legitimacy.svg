<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 623" width="900" height="623" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="623" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four sources of legitimacy</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Rulers often drew on several at once</text>
<rect x="30" y="124" width="412" height="175" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELIGIOUS SANCTION</text><text x="46" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">God or Heaven approves</text><text x="46" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mandate of Heaven in China</text><text x="46" y="232.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Charlemagne crowned by Pope Leo III, 800</text><text x="46" y="257.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Abbasid descent from al-Abbas, the Prophet's</text><text x="61.2" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">uncle</text><rect x="458" y="124" width="412" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INHERITANCE</text><text x="474" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Born to rule</text><text x="474" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="489.2" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hereditary succession was the norm</text><text x="474" y="232.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="489.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Frankish custom divided lands among sons;</text><text x="489.2" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">other systems favoured one heir</text><rect x="30" y="315" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="343" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONQUEST</text><text x="46" y="369.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Won by force</text><text x="46" y="398.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">William I claimed by promise and kinship</text><text x="46" y="423.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="423.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He secured the throne by victory at Hastings</text><text x="61.2" y="444.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1066)</text><rect x="458" y="315" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="343" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ELECTION OR ACCLAMATION</text><text x="474" y="369.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Chosen by others</text><text x="474" y="398.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="489.2" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Steppe rulers confirmed by an assembly</text><text x="474" y="423.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="489.2" y="423.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Holy Roman emperors elected by princes</text><text x="30" y="501" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">THE MANDATE OF HEAVEN COULD BE LOST</text><rect x="30" y="525" width="180" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="562.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Misrule</text><line x1="216" y1="558" x2="244" y2="558" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="525" width="180" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="562.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Mandate lost</text><line x1="436" y1="558" x2="464" y2="558" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="525" width="180" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="552.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Rebellion</text><text x="560" y="573.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">succeeds</text><line x1="656" y1="558" x2="684" y2="558" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="525" width="180" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="780" y="552.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Justified</text><text x="780" y="573.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">afterwards</text>
</svg>