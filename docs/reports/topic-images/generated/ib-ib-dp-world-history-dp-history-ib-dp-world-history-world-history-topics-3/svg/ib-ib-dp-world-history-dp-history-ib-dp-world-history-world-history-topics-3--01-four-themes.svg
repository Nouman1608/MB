<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four themes: the life of a ruler's power</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How rulers gained power, justified it, used it and lost it</text>
<rect x="70" y="124" width="340" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="114" y="178.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Legitimacy</text><text x="114" y="208.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Inheritance, religious sanction,</text><text x="114" y="230.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">election, conquest</text><circle cx="70" cy="199" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="208.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="530" y="124" width="340" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="574" y="178.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gaining and consolidating</text><text x="574" y="208.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Force, administration, law,</text><text x="574" y="230.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">patronage</text><circle cx="530" cy="199" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="530" y="208.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="530" y="344" width="340" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="574" y="398.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Rulers and religion</text><text x="574" y="428.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Religion used to support or to limit</text><text x="574" y="450.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">power</text><circle cx="530" cy="419" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="530" y="428.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="70" y="344" width="340" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="114" y="386.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Expansion, succession,</text><text x="114" y="411.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">decline</text><text x="114" y="441.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Conquest, passing power on,</text><text x="114" y="463.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">weakening</text><circle cx="70" cy="419" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="428.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="418" y1="199" x2="496" y2="199" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="700" y1="282" x2="700" y2="336" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="484" y1="419" x2="418" y2="419" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="240" y1="336" x2="240" y2="282" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)" stroke-dasharray="8 7"/><text x="450" y="529.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Succession was the most dangerous moment for any dynasty.</text>
</svg>