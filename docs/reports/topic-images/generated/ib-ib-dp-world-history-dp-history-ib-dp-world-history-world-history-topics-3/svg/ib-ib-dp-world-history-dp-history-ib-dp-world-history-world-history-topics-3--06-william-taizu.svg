<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Consolidating power: two methods</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">William I (Europe) and Song Taizu (Asia and Oceania)</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="363" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="193.84615384615384" height="49" fill="#b5d3cf"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Theme</text><rect x="223.84615384615384" y="124" width="323.0769230769231" height="49" fill="#b5d3cf"/><text x="237.84615384615384" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">William I (r. 1066-1087)</text><rect x="546.9230769230769" y="124" width="323.0769230769231" height="49" fill="#f2e7b8"/><text x="560.9230769230769" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Song Taizu (r. 960-976)</text><rect x="30" y="173" width="193.84615384615384" height="89" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rivals</text><rect x="223.84615384615384" y="173" width="323.0769230769231" height="89" fill="#ffffff"/><text x="237.84615384615384" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dispossessed English nobles; crushed</text><text x="237.84615384615384" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">revolts (Harrying of the North,</text><text x="237.84615384615384" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1069-1070)</text><rect x="546.9230769230769" y="173" width="323.0769230769231" height="89" fill="#ffffff"/><text x="560.9230769230769" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Persuaded leading generals to retire</text><text x="560.9230769230769" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with rewards</text><line x1="30" y1="262" x2="870" y2="262" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="262" width="193.84615384615384" height="89" fill="#dce9e7"/><text x="44" y="288.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Military control</text><rect x="223.84615384615384" y="262" width="323.0769230769231" height="89" fill="#ffffff"/><text x="237.84615384615384" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Castles and Norman garrisons; a new</text><text x="237.84615384615384" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aristocracy holding land directly from</text><text x="237.84615384615384" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">him</text><rect x="546.9230769230769" y="262" width="323.0769230769231" height="89" fill="#ffffff"/><text x="560.9230769230769" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Armies under civilian command;</text><text x="560.9230769230769" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rotation of commanders</text><line x1="30" y1="351" x2="870" y2="351" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="351" width="193.84615384615384" height="68" fill="#dce9e7"/><text x="44" y="377.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Administration</text><rect x="223.84615384615384" y="351" width="323.0769230769231" height="68" fill="#ffffff"/><text x="237.84615384615384" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Domesday survey (1086); royal</text><text x="237.84615384615384" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sheriffs</text><rect x="546.9230769230769" y="351" width="323.0769230769231" height="68" fill="#ffffff"/><text x="560.9230769230769" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Civil service examinations; salaried</text><text x="560.9230769230769" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bureaucracy of scholar-officials</text><line x1="30" y1="419" x2="870" y2="419" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="419" width="193.84615384615384" height="68" fill="#dce9e7"/><text x="44" y="445.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Legitimacy</text><rect x="223.84615384615384" y="419" width="323.0769230769231" height="68" fill="#ffffff"/><text x="237.84615384615384" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Claim to be Edward the Confessor's</text><text x="237.84615384615384" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heir; coronation</text><rect x="546.9230769230769" y="419" width="323.0769230769231" height="68" fill="#ffffff"/><text x="560.9230769230769" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Appeal to the Mandate of Heaven</text></g><line x1="223.84615384615384" y1="124" x2="223.84615384615384" y2="487" stroke="#c9d6d4" stroke-width="1.5"/><line x1="546.9230769230769" y1="124" x2="546.9230769230769" y2="487" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="363" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="509" width="410" height="105" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="541.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">William feared English rebellion</text><text x="48" y="570.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">So he relied on a new military aristocracy bound</text><text x="48" y="591.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to him.</text><rect x="460" y="509" width="410" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="541.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Taizu feared his own generals</text><text x="478" y="570.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">So he reduced the power of the military in favour</text><text x="478" y="591.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of civilian officials.</text>
</svg>