<rect width="900" height="429" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Religion: support or limit?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Where each example sits between the two</text>
<defs><linearGradient id="spg124" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="158" width="780" height="26" rx="13" fill="url(#spg124)" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="144" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Religion strengthens the ruler</text><text x="840" y="144" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">Religion limits the ruler</text><path d="M106.8,184 L106.8,208 L129,216 L129,238" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="106.8" cy="171" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="238" width="198" height="159" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="266.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mansa Musa</text><text x="44" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pilgrimage to Mecca</text><text x="44" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1324-1325); mosques</text><text x="44" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and scholars in</text><text x="44" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Timbuktu. Prestige at</text><text x="44" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">home and abroad.</text><path d="M231.6,184 L231.6,208 L343,216 L343,238" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="231.6" cy="171" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="244" y="238" width="198" height="159" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="258" y="266.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Charlemagne</text><text x="258" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Protected the papacy</text><text x="258" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and promoted church</text><text x="258" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reform; religious</text><text x="258" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">uniformity supported</text><text x="258" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">his rule.</text><path d="M528,184 L528,208 L557,216 L557,238" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="528" cy="171" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="458" y="238" width="198" height="159" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="266.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Abbasid caliphs</text><text x="472" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Religious authority</text><text x="472" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">survived long after</text><text x="472" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">their political power</text><text x="472" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">was taken by military</text><text x="472" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dynasties.</text><path d="M793.1999999999999,184 L793.1999999999999,208 L771,216 L771,238" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="793.1999999999999" cy="171" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="672" y="238" width="198" height="159" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="686" y="266.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Henry IV</text><text x="686" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pope Gregory VII</text><text x="686" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">challenged his right to</text><text x="686" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">appoint bishops;</text><text x="686" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">penance at Canossa</text><text x="686" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1077).</text>
</svg>