<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four criteria for judging a ruler</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Decide them before you write, apply them to every ruler</text>
<rect x="30" y="124" width="201" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECURITY</text><text x="44" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Were rivals removed</text><text x="44" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">and rebellions</text><text x="44" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">stopped?</text><rect x="243" y="124" width="201" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="257" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REACH</text><text x="257" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Did orders, taxes</text><text x="257" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">and justice reach</text><text x="257" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">the localities?</text><rect x="456" y="124" width="201" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACCEPTANCE</text><text x="470" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Did elites and</text><text x="470" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">religious authorities</text><text x="470" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">accept the claim?</text><rect x="669" y="124" width="201" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="683" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURABILITY</text><text x="683" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Did the system pass</text><text x="683" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">to an heir intact?</text><rect x="30" y="257" width="410" height="202" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRITERIA APPLIED</text><text x="48" y="313.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Charlemagne</text><text x="48" y="342.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="63.2" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">High on acceptance and reach in his lifetime</text><text x="48" y="368.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="63.2" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lower on durability: the empire was divided in</text><text x="63.2" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">843</text><rect x="460" y="257" width="410" height="202" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRITERIA APPLIED</text><text x="478" y="313.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hongwu Emperor</text><text x="478" y="342.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">His institutions outlasted him</text><text x="478" y="368.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="368.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">But his heir, a grandson, was overthrown by an</text><text x="493.2" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">uncle within four years</text><text x="478" y="415.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="415.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Terror left officials fearful and the throne</text><text x="493.2" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">isolated</text><rect x="30" y="481" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="515.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">An organising idea for a conclusion</text><text x="50" y="545.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Personal</tspan> <tspan font-weight="700" fill="#1e2a44">rule</tspan> depended on the ruler's energy and presence; <tspan font-weight="700" fill="#1e2a44">institutional</tspan> <tspan font-weight="700" fill="#1e2a44">rule</tspan> could survive a</text><text x="50" y="567.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weak successor.</text>
</svg>