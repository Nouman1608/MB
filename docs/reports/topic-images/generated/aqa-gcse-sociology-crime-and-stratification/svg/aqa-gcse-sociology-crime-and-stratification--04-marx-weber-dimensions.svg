<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621" width="900" height="621" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="621" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Marx and Weber: one dimension or three?</text>

<rect x="30" y="108" width="404" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,159 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,159 Z" fill="#b5d3cf"/><line x1="31.25" y1="159" x2="432.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Marx</text><rect x="466" y="108" width="404" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,159 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,159 Z" fill="#f2e7b8"/><line x1="467.25" y1="159" x2="868.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Weber</text><text x="232" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Class centres on <tspan font-weight="700">ownership of the means</tspan></text><text x="232" y="214" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">of production</tspan></text><rect x="142" y="260" width="180" height="190" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="232" y="340" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><text x="232" y="368" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(ownership)</text><text x="668" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Adds <tspan font-weight="700">status</tspan> and <tspan font-weight="700">party</tspan> as separate</text><text x="668" y="214" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">dimensions</text><rect x="494" y="260" width="108" height="190" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="548" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><rect x="614" y="260" width="108" height="190" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="668" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Status</text><rect x="734" y="260" width="108" height="190" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="788" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Party</text><rect x="30" y="508" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="544" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do not mix them up</text><text x="56" y="573" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marx: one dimension, based on ownership. Weber: class plus status and party.</text>
</svg>