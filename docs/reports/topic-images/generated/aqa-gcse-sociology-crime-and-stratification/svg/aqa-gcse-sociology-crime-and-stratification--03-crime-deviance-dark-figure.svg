<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 733" width="900" height="733" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="733" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Crime, deviance and the dark figure</text>

<circle cx="230" cy="330" r="190" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><circle cx="230" cy="390" r="110" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="230" y="196" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">DEVIANCE</text><text x="230" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">breaks social norms</text><text x="230" y="246" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(need not be illegal)</text><text x="230" y="384" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">CRIME</text><text x="230" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">breaks the law</text><text x="230" y="552" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Deviance is broader than crime</text><text x="640" y="130" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">All crime</text><rect x="520" y="150" width="120" height="235.6" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><rect x="520" y="385.6" width="120" height="144.4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="656" y="257.8" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Dark figure</text><text x="656" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unreported or</text><text x="656" y="301.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unrecorded</text><text x="656" y="447.8" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Official</text><text x="656" y="471.8" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">statistics</text><text x="640" y="560" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">not to scale</text><rect x="30" y="590" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="626" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two common mix-ups</text><circle cx="61" cy="649.39" r="4.5" fill="#8a6d0d"/><text x="74" y="655" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Treating crime and deviance as identical: a deviant act need not be illegal</text><circle cx="61" cy="679.39" r="4.5" fill="#8a6d0d"/><text x="74" y="685" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Confusing the dark figure with the crime rate: it is the crime missing from the statistics</text>
</svg>