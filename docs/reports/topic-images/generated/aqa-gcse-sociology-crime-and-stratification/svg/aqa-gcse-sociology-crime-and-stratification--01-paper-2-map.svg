<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 2 at a glance</text>

<rect x="30" y="108" width="412" height="58" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="236" y="145" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3.5 Crime and deviance</text><rect x="30" y="178" width="412" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="208" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">3.5.1</text><text x="106" y="208" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Social construction of crime and</text><text x="106" y="230" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">deviance</text><text x="106" y="250" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Merton, Becker</text><rect x="30" y="270" width="412" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="300" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">3.5.2</text><text x="106" y="300" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Social control</text><text x="106" y="342" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Heidensohn</text><rect x="30" y="362" width="412" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="392" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">3.5.3</text><text x="106" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Criminal and deviant behaviour</text><text x="106" y="434" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Albert Cohen, Carlen</text><rect x="30" y="454" width="412" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="484" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">3.5.4</text><text x="106" y="484" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Data on crime</text><text x="106" y="526" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">the dark figure</text><rect x="458" y="108" width="412" height="58" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="664" y="145" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3.6 Social stratification</text><rect x="458" y="178" width="412" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="208" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">3.6.1</text><text x="534" y="208" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalist theory of</text><text x="534" y="230" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">stratification</text><text x="534" y="250" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Davis and Moore</text><rect x="458" y="270" width="412" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="300" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">3.6.2</text><text x="534" y="300" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Socio-economic class</text><text x="534" y="342" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Marx, Weber</text><rect x="458" y="362" width="412" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="392" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">3.6.3</text><text x="534" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Life chances</text><text x="534" y="434" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Devine</text><rect x="458" y="454" width="412" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="484" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">3.6.4</text><text x="534" y="484" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Poverty as a social issue</text><text x="534" y="526" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Townsend, Murray</text><rect x="458" y="546" width="412" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="576" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">3.6.5</text><text x="534" y="576" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Power and authority</text><text x="534" y="618" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Weber</text><rect x="458" y="638" width="412" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="668" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">3.6.6</text><text x="534" y="668" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Power relationships</text><text x="534" y="710" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Walby</text><rect x="30" y="738" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="774" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One toolkit for both sections</text><text x="56" y="803" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Functionalism, Marxism, feminism and interactionism (interactionism in 3.5). Research methods</text><text x="56" y="825" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(3.7) is examined across both papers.</text>
</svg>