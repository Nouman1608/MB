<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One problem statement, several angles</text>

<rect x="120" y="115" width="660" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="159.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Problem statement</text><text x="450" y="187.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a local problem with global relevance, broad enough for distinct angles</text><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#f2e7b8"/><stop offset="1" stop-color="#dce9e7"/></linearGradient></defs><rect x="30" y="260" width="840" height="40" rx="20" fill="url(#lg)" stroke="#1e2a44" stroke-width="2"/><text x="40" y="250" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">more local</text><text x="860" y="250" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">more global</text><line x1="450" y1="219" x2="160" y2="266" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><circle cx="160" cy="280" r="13" fill="#1e2a44"/><text x="160" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Member 1</text><line x1="450" y1="219" x2="353" y2="266" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><circle cx="353" cy="280" r="13" fill="#1e2a44"/><text x="353" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Member 2</text><line x1="450" y1="219" x2="547" y2="266" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><circle cx="547" cy="280" r="13" fill="#1e2a44"/><text x="547" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Member 3</text><line x1="450" y1="219" x2="740" y2="266" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><circle cx="740" cy="280" r="13" fill="#1e2a44"/><text x="740" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Member 4</text><text x="450" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">each argues a distinct, contrasting perspective towards a workable solution</text><rect x="30" y="390" width="410" height="110" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="426.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Too vague</text><text x="48" y="453.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a general global issue with “local relevance”</text><text x="48" y="474.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">only asserted</text><rect x="460" y="390" width="410" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="426.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Strong</text><text x="478" y="453.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">names a real place, group or situation</text>
</svg>