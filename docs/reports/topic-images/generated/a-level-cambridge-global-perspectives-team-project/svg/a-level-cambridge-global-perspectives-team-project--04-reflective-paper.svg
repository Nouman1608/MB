<rect x="30" y="115" width="840" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="158.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Max 800 words · assessed entirely against AO2 (Reflection)</text><rect x="30" y="210" width="410" height="200" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="246.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Reflect on</text><text x="48" y="273.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• how effectively the team worked together,</text><text x="48" y="294.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and what could have been improved</text><text x="48" y="315.41" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• your own learning: the problem, research</text><text x="48" y="336.53000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">skills, presentation skills, or how</text><text x="48" y="357.65000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collaboration shaped your views</text><rect x="460" y="210" width="410" height="200" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="478" y="246.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Not</text><text x="478" y="273.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• a second presentation of research findings</text><text x="478" y="294.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• a restatement of the problem or the solution</text><rect x="30" y="430" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="461.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Draft it after the presentation is finished, when the whole process, difficulties included,</text><text x="450" 