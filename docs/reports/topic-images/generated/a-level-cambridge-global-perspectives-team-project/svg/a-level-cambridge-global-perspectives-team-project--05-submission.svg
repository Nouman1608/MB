<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What each candidate submits</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="140" width="40" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="80" y="170" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="120" y="168" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">1  the recording (live or with recorded voiceover)</text><rect x="60" y="206" width="40" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="80" y="236" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="120" y="234" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">2  the audio and/or visual materials supporting it</text><rect x="60" y="272" width="40" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="80" y="302" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="120" y="300" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">3  a verbatim transcript of the presentation</text><rect x="60" y="338" width="40" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="80" y="368" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="120" y="366" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">4  the reflective paper</text><rect x="30" y="430" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="460.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Plus a statement of originality for each candidate; everything submitted electronically by the</text><text x="450" y="481.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Administrative Guide deadlines.</text>
