<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="395" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The teacher’s role and its limits</text>

<rect x="30" y="115" width="410" height="250" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="152.95" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Teachers may</text><text x="48" y="180.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• form the teams</text><text x="48" y="201.19" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• help you understand the task</text><text x="48" y="222.31" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• help formulate the topic and problem</text><text x="48" y="243.43" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">statement</text><text x="48" y="264.55" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• develop ways to explore perspectives</text><text x="48" y="285.67" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• build organisational and referencing skills</text><text x="48" y="306.78999999999996" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• develop clear oral arguments</text><rect x="460" y="115" width="410" height="250" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="478" y="152.95" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">✗ Once research begins, must not</text><text x="478" y="180.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• give detailed subject guidance</text><text x="478" y="201.19" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• research for you</text><text x="478" y="222.31" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• write or correct your notes</text><text x="478" y="243.43" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• prepare any part of the presentation or</text><text x="478" y="264.55" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transcript</text><text x="478" y="285.67" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• suggest amendments to the presentation or</text><text x="478" y="306.78999999999996" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reflective paper</text>
</svg>