<rect x="30" y="110" width="840" height="250" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Shared: team of two to five (teachers help form teams)</text><rect x="230" y="165" width="440" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="201.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">One agreed problem statement</text><text x="450" y="226.85000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a local problem with global relevance</text><line x1="450" y1="239" x2="150" y2="268" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="100" y="272" width="100" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="150" y="300.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Member 1</text><text x="150" y="326.55" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">own angle</text><line x1="450" y1="239" x2="350" y2="268" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="300" y="272" width="100" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="350" y="300.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Member 2</text><text x="350" y="326.55" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">own angle</text><line x1="450" y1="239" x2="550" y2="268" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="500" y="272" width="100" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="550" y="300.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Member 3</text><text x="550" y="326.55" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">own angle</text><line x1="450" y1="239" x2="750" y2="268" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="700" y="272" width="100" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="750" y="300.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Member 4</text><text x="750" y="326.55" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">own angle</text><text x="450" y="400" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Individual: each member submits and is marked alone</text><line x1="450" y1="366" x2="450" y2="380" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="420" width="560" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="474.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Presentation: 30 marks</text><text x="48" y="502.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">own research and preferred solution; max 10 minutes; AO1 + AO3</text><rect x="610" y="420" width="260" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="628" y="461.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reflective paper: 10</text><text x="628" y="486.63" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">marks</text><text x="628" y="513.75" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">max 800 words; AO2</text><rect x="30" y="560" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="591.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Team presentations are not accepted: only individual work is marked. 40 marks in total.</text>
