<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The presentation: 30 marks</text>

<rect x="30" y="115" width="410" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="151.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Live recording</text><text x="48" y="176.85000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">audience of at least three, including the class</text><text x="48" y="196.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">teacher; one session, quiet setting</text><rect x="460" y="115" width="410" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="478" y="151.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recorded voiceover</text><text x="478" y="176.85000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">presentation software with your own narration; no</text><text x="478" y="196.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">live audience; quiet setting</text><text x="450" y="265" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Either format: maximum 10 minutes; anything beyond is not assessed</text><rect x="30" y="285" width="410" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="322" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">AO1 Research, analysis, evaluation</text><text x="60" y="362" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">•</text><text x="80" y="362" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">individual analysis of the problem</text><text x="60" y="412" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">•</text><text x="80" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">range of research</text><text x="60" y="462" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">•</text><text x="80" y="462" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evaluation of sources</text><text x="60" y="512" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">•</text><text x="80" y="512" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">justification of your solution</text><rect x="460" y="285" width="410" height="250" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="322" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">AO3 Communication</text><text x="490" y="362" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">•</text><text x="510" y="362" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">well-argued, well-organised</text><text x="490" y="412" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">•</text><text x="510" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">effective use of visual information</text><text x="490" y="462" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">•</text><text x="510" y="462" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">language pitched for the audience</text><rect x="30" y="555" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="585.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Engage a non-specialist audience; use audio and visuals purposefully, not extensively; cite</text><text x="450" y="606.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">references clearly.</text>
</svg>