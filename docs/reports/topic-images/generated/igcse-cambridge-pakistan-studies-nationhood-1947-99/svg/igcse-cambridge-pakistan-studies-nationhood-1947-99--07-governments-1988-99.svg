<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four governments in eleven years, 1988–99</text>

<rect x="30" y="112" width="192" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="126" y="152" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1988–90</text><text x="126" y="184" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Benazir Bhutto</text><line x1="126" y1="210" x2="126" y2="228" stroke="#b5602e" stroke-width="3"/><rect x="30" y="228" width="192" height="91" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="256.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Dismissed in 1990</text><text x="48" y="276.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">under the Eighth</text><text x="48" y="296.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Amendment</text><line x1="224" y1="160" x2="244" y2="160" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="246" y="112" width="192" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="342" y="152" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1990–93</text><text x="342" y="184" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Nawaz Sharif</text><line x1="440" y1="160" x2="460" y2="160" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="462" y="112" width="192" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="558" y="152" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1993–96</text><text x="558" y="184" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Benazir Bhutto</text><line x1="558" y1="210" x2="558" y2="228" stroke="#b5602e" stroke-width="3"/><rect x="462" y="228" width="192" height="91" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="256.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Dismissed in 1996</text><text x="480" y="276.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">under the Eighth</text><text x="480" y="296.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Amendment</text><line x1="656" y1="160" x2="676" y2="160" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="678" y="112" width="192" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="774" y="152" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1997–99</text><text x="774" y="184" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Nawaz Sharif</text><line x1="774" y1="210" x2="774" y2="228" stroke="#b5602e" stroke-width="3"/><rect x="678" y="228" width="192" height="91" rx="12" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><text x="696" y="256.75" font-size="15" font-weight="400" fill="#ffffff" text-anchor="start">General Pervez</text><text x="696" y="276.75" font-size="15" font-weight="400" fill="#ffffff" text-anchor="start">Musharraf takes</text><text x="696" y="296.75" font-size="15" font-weight="400" fill="#ffffff" text-anchor="start">power, October 1999</text><rect x="30" y="349" width="410" height="222" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="382" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Benazir Bhutto faced</text><text x="48" y="410.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="410.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Opposition from Nawaz Sharif’s government in</text><text x="64" y="431.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Punjab</text><text x="48" y="455.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="455.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A failed no-confidence motion (1989)</text><text x="48" y="479.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="479.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Disputes with President Ghulam Ishaq Khan</text><text x="64" y="500.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">over appointments</text><text x="48" y="524.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="524.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inflation and unemployment</text><text x="48" y="548.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="548.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tension in Kashmir</text><rect x="460" y="349" width="410" height="222" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="382" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Nawaz Sharif</text><text x="478" y="410.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="410.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Privatisation and deregulation</text><text x="478" y="434.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="434.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Loss of US aid and economic difficulties</text><text x="478" y="458.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="458.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Removed the president’s power of dismissal</text><text x="494" y="479.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1997)</text><text x="478" y="503.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="503.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ordered nuclear tests (May 1998)</text><text x="478" y="527.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="527.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tension with the army after the Kargil conflict</text><text x="494" y="548.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1999)</text>
</svg>