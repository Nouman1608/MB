<rect width="900" height="684" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pakistan in world affairs since 1947</text>

<line x1="350" y1="174.5" x2="450" y2="383" stroke="#c9d6d4" stroke-width="3"/><rect x="30" y="112" width="320" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="144.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">India</text><text x="48" y="172.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wars and tension over Kashmir and</text><text x="48" y="193.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bangladesh; Lahore Declaration 1999</text><line x1="350" y1="313.5" x2="450" y2="383" stroke="#c9d6d4" stroke-width="3"/><rect x="30" y="251" width="320" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="283.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Afghanistan</text><text x="48" y="311.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pakhtoonistan dispute; Soviet</text><text x="48" y="332.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">invasion and refugee crisis</text><line x1="350" y1="452.5" x2="450" y2="383" stroke="#c9d6d4" stroke-width="3"/><rect x="30" y="390" width="320" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="422.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Iran</text><text x="48" y="450.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Close ties; Regional Cooperation for</text><text x="48" y="471.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Development 1964; changes after</text><text x="48" y="492.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1979</text><line x1="350" y1="591.5" x2="450" y2="383" stroke="#c9d6d4" stroke-width="3"/><rect x="30" y="529" width="320" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="561.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bangladesh</text><text x="48" y="589.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Recognised 1974; repatriation and</text><text x="48" y="610.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assets issues remained</text><line x1="550" y1="174.5" x2="450" y2="383" stroke="#c9d6d4" stroke-width="3"/><rect x="550" y="112" width="320" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="568" y="144.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">China</text><text x="568" y="172.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Close partner since the 1960s;</text><text x="568" y="193.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Karakoram Highway</text><line x1="550" y1="313.5" x2="450" y2="383" stroke="#c9d6d4" stroke-width="3"/><rect x="550" y="251" width="320" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="568" y="283.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">USA and UK</text><text x="568" y="311.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">SEATO and CENTO; left SEATO 1972</text><text x="568" y="332.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and CENTO 1979</text><line x1="550" y1="452.5" x2="450" y2="383" stroke="#c9d6d4" stroke-width="3"/><rect x="550" y="390" width="320" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="568" y="422.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Commonwealth</text><text x="568" y="450.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Left 1972; rejoined 1989</text><line x1="550" y1="591.5" x2="450" y2="383" stroke="#c9d6d4" stroke-width="3"/><rect x="550" y="529" width="320" height="125" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="568" y="561.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nuclear status</text><text x="568" y="589.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Programme from 1972; tests at</text><text x="568" y="610.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Chagai May 1998 after India’s; has</text><text x="568" y="631.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not signed the NPT</text><circle cx="450" cy="383" r="68" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="391" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan</text>
</svg>