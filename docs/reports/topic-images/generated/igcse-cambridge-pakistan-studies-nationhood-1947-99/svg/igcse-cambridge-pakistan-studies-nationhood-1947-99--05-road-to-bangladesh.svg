<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 816" width="900" height="816" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="816" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why East Pakistan became Bangladesh</text>

<text x="30" y="132" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">LONG-TERM CAUSES</text><rect x="30" y="146" width="840" height="103" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="177.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Political domination</text><text x="48" y="205.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">East Pakistan had the majority of the population but felt dominated by the West in government, the army</text><text x="48" y="226.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and the civil service.</text><rect x="30" y="261" width="270" height="50" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="165" y="292" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Language protests, 1952</text><rect x="315" y="261" width="270" height="50" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="292" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic disparity</text><rect x="600" y="261" width="270" height="50" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="735" y="292" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Neglect after the 1970 cyclone</text><line x1="450" y1="329" x2="450" y2="355" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="95" y1="375" x2="95" y2="776" stroke="#1e2a44" stroke-width="4"/><rect x="182" y="365" width="688" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="396.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Six Points (Awami League, Sheikh Mujib)</text><text x="200" y="424.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Federation with only defence and foreign affairs at the centre; separate currencies or</text><text x="200" y="445.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">accounts; provincial control of taxation and foreign exchange. Rejected as a threat to</text><text x="200" y="466.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unity.</text><rect x="182" y="499" width="688" height="103" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="200" y="530.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">General election</text><text x="200" y="558.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Awami League wins almost every East Pakistan seat and an overall majority; Bhutto’s</text><text x="200" y="579.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">PPP wins most seats in the West. Talks fail.</text><rect x="182" y="612" width="688" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="643.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Army operations begin</text><text x="200" y="671.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Civil war follows.</text><rect x="182" y="704" width="688" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="200" y="735.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">India intervenes militarily</text><text x="200" y="763.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pakistani forces in the East surrender on 16 December 1971.</text><rect x="30" y="379" width="130" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="406" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1966</text><line x1="160" y1="399" x2="182" y2="399" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="513" width="130" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="540" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1970</text><line x1="160" y1="533" x2="182" y2="533" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="626" width="130" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="653" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Mar 1971</text><line x1="160" y1="646" x2="182" y2="646" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="718" width="130" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="745" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dec 1971</text><line x1="160" y1="738" x2="182" y2="738" stroke="#1e2a44" stroke-width="2.5"/>
</svg>