<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The canal water dispute and its settlement</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">schematic, not to scale</text>
<rect x="30" y="112" width="840" height="300" rx="14" fill="#e6eef0"/><path d="M110,172 C80,232 140,282 110,342" fill="none" stroke="#2b5a9a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><text x="110" y="374" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Indus</text><path d="M225,172 C195,232 255,282 225,342" fill="none" stroke="#2b5a9a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><text x="225" y="374" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Jhelum</text><path d="M340,172 C310,232 370,282 340,342" fill="none" stroke="#2b5a9a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><text x="340" y="374" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Chenab</text><path d="M560,172 C530,232 590,282 560,342" fill="none" stroke="#8a6d0d" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><text x="560" y="374" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ravi</text><path d="M675,172 C645,232 705,282 675,342" fill="none" stroke="#8a6d0d" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><text x="675" y="374" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Beas</text><path d="M790,172 C760,232 820,282 790,342" fill="none" stroke="#8a6d0d" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><text x="790" y="374" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sutlej</text><text x="225" y="152" font-size="20" font-weight="700" fill="#2b5a9a" text-anchor="middle">Western rivers → Pakistan</text><text x="675" y="152" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">Eastern rivers → India</text><line x1="450" y1="142" x2="450" y2="380" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 6"/><text x="450" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">allocation under the treaty, not a border</text><rect x="30" y="432" width="260" height="126" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="465" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">1947</text><text x="48" y="493.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Key headworks are left in</text><text x="48" y="514.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">India.</text><line x1="294" y1="495" x2="316" y2="495" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="432" width="260" height="126" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="338" y="465" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">1948</text><text x="338" y="493.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">India cuts off water to</text><text x="338" y="514.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pakistani canals.</text><line x1="584" y1="495" x2="606" y2="495" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="432" width="260" height="126" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="628" y="465" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">1960</text><text x="628" y="493.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Indus Waters Treaty,</text><text x="628" y="514.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mediated by the World Bank,</text><text x="628" y="535.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">divides the rivers.</text>
</svg>