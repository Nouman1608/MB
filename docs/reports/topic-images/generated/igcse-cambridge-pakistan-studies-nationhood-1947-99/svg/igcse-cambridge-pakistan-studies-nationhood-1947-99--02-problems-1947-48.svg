<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven problems facing the new state, 1947–48</text>

<rect x="30" y="112" width="410" height="105" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Radcliffe Award</text><text x="48" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Announced 17 August 1947; most of Gurdaspur</text><text x="48" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">went to India, giving it a land route into Kashmir.</text><circle cx="414" cy="138" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="414" y="143.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="460" y="112" width="410" height="105" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Canal waters</text><text x="478" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Headworks left in India; water to Pakistani canals</text><text x="478" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cut off in 1948.</text><circle cx="844" cy="138" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="844" y="143.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="30" y="231" width="410" height="126" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="264" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Division of assets</text><text x="48" y="292.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less than the agreed share of cash and military</text><text x="48" y="313.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stores; payments delayed.</text><circle cx="414" cy="257" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="414" y="262.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="460" y="231" width="410" height="126" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="264" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Princely states</text><text x="478" y="292.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Junagadh occupied 1947; Hyderabad taken</text><text x="478" y="313.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">September 1948; Kashmir fighting until the UN</text><text x="478" y="334.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ceasefire of 1 January 1949.</text><circle cx="844" cy="257" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="844" y="262.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="371" width="410" height="126" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="404" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Refugees</text><text x="48" y="432.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Millions crossed amid massacres; Pakistan had to</text><text x="48" y="453.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">house and feed them in Lahore, Karachi and</text><text x="48" y="474.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">elsewhere.</text><circle cx="414" cy="397" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="414" y="402.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="460" y="371" width="410" height="126" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="404" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Administration and economy</text><text x="478" y="432.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A capital at Karachi, a civil service and a central</text><text x="478" y="453.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bank built almost from nothing; most industry left</text><text x="478" y="474.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in India.</text><circle cx="844" cy="397" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="844" y="402.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="30" y="511" width="410" height="105" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="544" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">National language</text><text x="48" y="572.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Urdu declared the state language in 1948,</text><text x="48" y="593.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">angering Bengali speakers in East Pakistan.</text><circle cx="414" cy="537" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="414" y="542.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="460" y="511" width="410" height="126" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="544" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Jinnah as Governor-General</text><text x="478" y="572.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Set up the government, organised refugee relief</text><text x="478" y="593.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and founded the State Bank (opened July 1948).</text><text x="478" y="614.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Died 11 September 1948.</text>
</svg>