<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 517" width="900" height="517" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="517" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Constitutional milestones, 1949–97</text>

<rect x="30" y="112" width="840" height="375" rx="12" fill="#ffffff"/><path d="M30,156 L30,124 Q30,112 42,112 L858,112 Q870,112 870,124 L870,156 Z" fill="#b5d3cf"/><rect x="30" y="156" width="840" height="83" fill="#ffffff"/><text x="42" y="181.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Objectives</text><text x="42" y="202.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Resolution 1949</text><text x="232" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Liaquat Ali Khan</text><text x="402" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">—</text><text x="582" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sovereignty belongs to Allah; a</text><text x="582" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">democratic state guided by Islamic</text><text x="582" y="223.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">principles; minorities protected</text><line x1="30" y1="156" x2="870" y2="156" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="239" width="840" height="62" fill="#dce9e7"/><text x="42" y="264.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1956 Constitution</text><text x="232" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Iskander Mirza</text><text x="402" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">—</text><text x="582" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pakistan an Islamic Republic with a</text><text x="582" y="285.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muslim head of state</text><line x1="30" y1="239" x2="870" y2="239" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="301" width="840" height="62" fill="#ffffff"/><text x="42" y="326.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1962 Constitution</text><text x="232" y="326.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ayub Khan</text><text x="402" y="326.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Presidential</text><text x="582" y="326.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Islamic” restored to the country’s</text><text x="582" y="347.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">name by amendment in 1963</text><line x1="30" y1="301" x2="870" y2="301" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="363" width="840" height="41" fill="#dce9e7"/><text x="42" y="388.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1973 Constitution</text><text x="232" y="388.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Zulfikar Ali Bhutto</text><text x="402" y="388.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parliamentary</text><text x="582" y="388.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Islam declared the state religion</text><line x1="30" y1="363" x2="870" y2="363" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="404" width="840" height="83" fill="#ffffff"/><text x="42" y="429.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Eighth Amendment</text><text x="232" y="429.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Zia-ul-Haq</text><text x="402" y="429.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">President can</text><text x="402" y="450.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dismiss the national</text><text x="402" y="471.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assembly</text><text x="582" y="429.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Used to dismiss Benazir Bhutto in</text><text x="582" y="450.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1990 and 1996; removed in 1997 by</text><text x="582" y="471.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nawaz Sharif</text><line x1="30" y1="404" x2="870" y2="404" stroke="#c9d6d4" stroke-width="1.5"/><line x1="220" y1="112" x2="220" y2="487" stroke="#c9d6d4" stroke-width="1.5"/><line x1="390" y1="112" x2="390" y2="487" stroke="#c9d6d4" stroke-width="1.5"/><line x1="570" y1="112" x2="570" y2="487" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Document</text><text x="232" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Under</text><text x="402" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">System</text><text x="582" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key provisions</text><rect x="30" y="112" width="840" height="375" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>