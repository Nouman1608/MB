<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bhutto and Zia compared, 1971–88</text>

<rect x="30" y="112" width="410" height="313" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Zulfikar Ali Bhutto</text><text x="48" y="171.75" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">1971–77 · civilian</text><text x="48" y="198.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="198.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Simla Agreement 1972: captured territory</text><text x="64" y="219.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">returned; prisoners of war after a further</text><text x="64" y="240.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">agreement in 1973</text><text x="48" y="264.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1973 Constitution: parliamentary; Islam the</text><text x="64" y="285.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">state religion</text><text x="48" y="309.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="309.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nationalised major industries, banks and</text><text x="64" y="330.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schools</text><text x="48" y="354.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="354.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Land and labour reforms</text><text x="48" y="378.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="378.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Launched the nuclear programme</text><text x="48" y="402.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="402.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Created the Federal Security Force</text><rect x="460" y="112" width="410" height="313" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Zia-ul-Haq</text><text x="478" y="171.75" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">1977–88 · military</text><text x="478" y="198.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="198.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Islamisation: Hudood Ordinances, zakat and</text><text x="494" y="219.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ushr, Federal Shariat Court</text><text x="478" y="243.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="243.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics: some laws disadvantaged women and</text><text x="494" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">religious minorities</text><text x="478" y="288.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="288.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Martial law; referendum 1984; non-party</text><text x="494" y="309.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">elections 1985</text><text x="478" y="333.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="333.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Eighth Amendment: president can dismiss the</text><text x="494" y="354.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">national assembly</text><text x="478" y="378.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="378.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Soviet invasion of Afghanistan 1979: millions of</text><text x="494" y="399.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">refugees but large US aid</text><rect x="30" y="441" width="410" height="105" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="474" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">How it ended</text><text x="48" y="502.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Disputed 1977 election and mass protests; Zia</text><text x="48" y="523.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seized power in July 1977.</text><rect x="460" y="441" width="410" height="105" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="474" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">How it ended</text><text x="478" y="502.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Zia died in an air crash in August 1988.</text>
</svg>