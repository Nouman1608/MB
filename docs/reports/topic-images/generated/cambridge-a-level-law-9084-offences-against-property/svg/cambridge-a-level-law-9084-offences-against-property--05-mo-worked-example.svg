<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 463" width="900" height="463" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="463" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Mo in the jewellery shop</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three offences along one timeline</text>
<line x1="60" y1="194" x2="840" y2="194" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="165.33333333333334" cy="194" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="165.33333333333334" y="201.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="165.33333333333334" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Enters with intent to steal</text><circle cx="450" cy="194" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="201.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="450" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pockets the ring</text><circle cx="734.6666666666667" cy="194" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="734.6666666666667" y="201.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="734.6666666666667" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pushes the assistant, runs out</text><rect x="30" y="244" width="270.6666666666667" height="187" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="272" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BURGLARY s9(1)(a)</text><text x="46" y="298.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Complete on entry</text><text x="46" y="326.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Permission as a customer is</text><text x="46" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exceeded by entering with</text><text x="46" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intent to steal (<tspan font-style="italic">Jones</tspan> <tspan font-style="italic">and</tspan></text><text x="46" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Smith</tspan>), so he enters as a</text><text x="46" y="410.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trespasser</text><rect x="314.6666666666667" y="244" width="270.6666666666667" height="187" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="272" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEFT s1</text><text x="330.6666666666667" y="298.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Appropriation of the ring</text><text x="330.6666666666667" y="326.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Appropriates (s3) property (s4)</text><text x="330.6666666666667" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">belonging to the shop (s5),</text><text x="330.6666666666667" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intending to keep it (s6),</text><text x="330.6666666666667" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dishonestly (<tspan font-style="italic">Ivey</tspan>)</text><rect x="599.3333333333334" y="244" width="270.6666666666667" height="187" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="272" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROBBERY s8</text><text x="615.3333333333334" y="298.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Force “at the time”</text><text x="615.3333333333334" y="326.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Appropriation continues while</text><text x="615.3333333333334" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">he makes off (<tspan font-style="italic">Hale</tspan>), so the</text><text x="615.3333333333334" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">push is force at the time of the</text><text x="615.3333333333334" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">theft: robbery likely</text><line x1="165.33333333333334" y1="218" x2="165.33333333333334" y2="244" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="450" y1="218" x2="450" y2="244" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="734.6666666666667" y1="218" x2="734.6666666666667" y2="244" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 4"/>
</svg>