<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" width="900" height="716" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="716" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criminal Damage Act 1971: offences and lawful excuse</text>

<rect x="30" y="100" width="413" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s1(1) DAMAGE</text><text x="46" y="159.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Destroying or damaging property of another;</text><text x="46" y="180.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intention or recklessness (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">G</tspan>). Temporary</text><text x="46" y="201.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">impairment counts (<tspan font-style="italic">Hardman</tspan>); spit easily wiped</text><text x="46" y="222.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">off does not (<tspan font-style="italic">A</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">R</tspan>). Belief it is one’s own negates</text><text x="46" y="243.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mens rea (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Smith</tspan>)</text><rect x="457" y="100" width="413" height="164" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="473" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s1(2) AND s1(3)</text><text x="473" y="159.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s1(2):</tspan> intends or is reckless as to endangering</text><text x="473" y="180.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">life. <tspan font-weight="700" fill="#1e2a44">s1(3):</tspan> damage by fire (arson). Maximum life</text><text x="473" y="201.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(s4)</text><rect x="30" y="278" width="413" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="306" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s2 THREATS</text><text x="46" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Threat to destroy or damage property, intending</text><text x="46" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the other to fear it would be carried out</text><rect x="457" y="278" width="413" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="306" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s3 POSSESSION</text><text x="473" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Anything in custody or control, intending it to be</text><text x="473" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">used to destroy or damage property</text><text x="450" y="413" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">s5 “WITHOUT LAWFUL EXCUSE”: the defendant believed…</text><rect x="30" y="435" width="413" height="147" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="463" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s5(2)(a) CONSENT</text><text x="46" y="489.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The owner had or would have consented</text><text x="46" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Even a drunken belief: <tspan font-style="italic">Jaggard</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Dickinson</tspan> (1981)</text><rect x="457" y="435" width="413" height="147" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="463" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s5(2)(b) PROTECTING PROPERTY</text><text x="473" y="489.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Property in immediate need of protection,</text><text x="473" y="512.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">by reasonable means</text><text x="473" y="540.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Whether the act was done to protect property is</text><text x="473" y="561.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">judged objectively: <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hill</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Hall</tspan> (1989)</text><rect x="30" y="604" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="637.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The belief need only be honest, not justified (s5(3)). The s5 defence does <tspan font-weight="700" fill="#1e2a44">not</tspan> apply to offences</text><text x="50" y="659.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">involving danger to life.</text>
</svg>