<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is it robbery? s8 Theft Act 1968</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Stealing + force, immediately before or at the time, in order to steal</text>
<line x1="60" y1="144" x2="60" y2="522" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A completed theft?</text><text x="122" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No theft, no robbery: <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Robinson</tspan> (1977), belief in a legal right.</text><circle cx="60" cy="166.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="175.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="221" width="766" height="127" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="254.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Force on any person, or fear of force then and there?</text><text x="122" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A matter for the jury: a nudge can suffice (<tspan font-style="italic">Dawson</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">James</tspan>, 1976); wrenching a bag from a</text><text x="122" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hand is force (<tspan font-style="italic">Clouden</tspan>, 1987); snatching a cigarette without touching the victim was not (<tspan font-style="italic">P</tspan> <tspan font-style="italic">v</tspan></text><text x="122" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">DPP</tspan>, 2012).</text><circle cx="60" cy="284.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="293.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="360" width="766" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="393.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Immediately before or at the time of stealing?</text><text x="122" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Appropriation is a continuing act, so force while making off can be “at the time” (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hale</tspan>, 1979).</text><circle cx="60" cy="402.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="411.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="457" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="490.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">In order to steal, with the mens rea of theft?</text><text x="122" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Plus intention to use force or put in fear in order to steal.</text><circle cx="60" cy="499.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="508.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="564" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="597.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">All four “yes”: robbery, maximum <tspan font-weight="700" fill="#1e2a44">life</tspan> (s8(2)). <tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> finding robbery where force came</text><text x="50" y="619.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">after the theft was over, or there was no theft.</text>
</svg>