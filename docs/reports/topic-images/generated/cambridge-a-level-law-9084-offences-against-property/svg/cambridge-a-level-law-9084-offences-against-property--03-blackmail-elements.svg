<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Blackmail: s21 Theft Act 1968</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Maximum 14 years</text>
<rect x="30" y="124" width="270.6666666666667" height="166" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACTUS REUS</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A demand</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A posted demand is made on</text><text x="46" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">posting: <tspan font-style="italic">Treacy</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">DPP</tspan> (1971)</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="166" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACTUS REUS</text><text x="330.6666666666667" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">With menaces</text><text x="330.6666666666667" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Would influence an ordinary</text><text x="330.6666666666667" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">person of normal stability (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan></text><text x="330.6666666666667" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Clear</tspan>), or known to affect a</text><text x="330.6666666666667" y="269.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">timid victim (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Garwood</tspan>)</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="166" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MENS REA</text><text x="615.3333333333334" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">View to gain, or intent to</text><text x="615.3333333333334" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">cause loss</text><text x="615.3333333333334" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">In money or other property</text><text x="450" y="326" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">IS THE DEMAND UNWARRANTED?</text><rect x="30" y="340" width="395" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="227.5" y="370.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Believes there are reasonable grounds</text><text x="227.5" y="393.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">for making it?</text><rect x="475" y="340" width="395" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="672.5" y="370.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Believes the menaces are a proper way</text><text x="672.5" y="393.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">of reinforcing it?</text><text x="450" y="387" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="30" y="436" width="413" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="464" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BOTH BELIEFS</text><text x="46" y="495.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Demand is warranted: not blackmail</text><rect x="457" y="436" width="413" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="473" y="464" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EITHER MISSING</text><text x="473" y="495.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Demand is unwarranted. A threat to commit a</text><text x="473" y="516.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serious crime cannot be believed proper: <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan></text><text x="473" y="537.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Harvey</tspan> (1981)</text>
</svg>