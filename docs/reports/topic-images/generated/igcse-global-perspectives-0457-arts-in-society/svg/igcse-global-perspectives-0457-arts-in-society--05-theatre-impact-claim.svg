<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 639" width="900" height="639" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="639" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing a “£4 back for every £1” claim</text>

<rect x="30" y="104" width="840" height="88" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEAFLET FROM AN IMAGINARY THEATRE COMPANY</text><text x="50" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">“Every pound spent on theatre returns four to the local economy.”</text><rect x="40" y="228" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,239 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="210" width="776" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="239.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Who produced it?</text><text x="108" y="267.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The company itself: it has a vested interest in continued funding.</text><rect x="40" y="314" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,325 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="296" width="776" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="325.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How was the figure calculated?</text><text x="108" y="353.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The leaflet does not say who calculated it or how.</text><rect x="40" y="410.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,421.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="382" width="776" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="411.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Does it count spending that would happen anyway?</text><text x="108" y="439.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">People eating out in town on another night may be included, so the real gain could be</text><text x="108" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">smaller.</text><rect x="30" y="497" width="397" height="112" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="228.5" y="533" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">On its own</text><text x="228.5" y="562.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">a weak claim</text><line x1="433" y1="553" x2="467" y2="553" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="497" width="397" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="671.5" y="533" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Stronger if…</text><text x="671.5" y="562.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">an independent researcher produced it</text><text x="671.5" y="584.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">and explained the method</text>
</svg>