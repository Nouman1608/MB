<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 910" width="900" height="910" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="910" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who wants what, and why: returning cultural objects</text>

<circle cx="320" cy="310" r="190" fill="#b5d3cf" fill-opacity="0.75" stroke="#1e2a44" stroke-width="3"/><circle cx="580" cy="310" r="190" fill="#f2e7b8" fill-opacity="0.75" stroke="#1e2a44" stroke-width="3"/><text x="245" y="182" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Community or</text><text x="245" y="205" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">government</text><text x="245" y="228" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">of origin</text><text x="250" y="270" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle">Objects should</text><text x="250" y="292" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle">come home</text><text x="250" y="332" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Identity, history,</text><text x="250" y="353" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">justice; objects may</text><text x="250" y="374" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">have religious meaning</text><text x="650" y="200" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Museum</text><text x="650" y="224" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">director</text><text x="650" y="270" font-size="18" font-weight="600" fill="#8a6d0d" text-anchor="middle">Keep them, or</text><text x="650" y="292" font-size="18" font-weight="600" fill="#8a6d0d" text-anchor="middle">share by loan</text><text x="650" y="332" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Public access,</text><text x="650" y="353" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">conservation, legal</text><text x="650" y="374" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">duties; vested interest</text><text x="650" y="395" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in visitors</text><text x="450" y="302" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Both</text><text x="450" y="324" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">might</text><text x="450" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">accept</text><text x="450" y="368" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">a loan</text><rect x="30" y="530" width="840" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="563" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A THIRD VOICE</text><text x="50" y="589.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A young person from the community of origin</text><text x="50" y="618.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Wants to see the objects without travelling abroad: a connection to their own history, and</text><text x="50" y="640.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the cost of travel.</text><text x="450" y="695" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Judge each statement differently</text><rect x="30" y="715" width="268" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="744" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HISTORICAL CLAIM</text><text x="46" y="768.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“The objects were taken</text><text x="46" y="790.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">by force.”</text><text x="46" y="817.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Can be checked.</text><rect x="316" y="715" width="268" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="332" y="744" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">NEEDS EVIDENCE</text><text x="332" y="768.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Museums keep objects</text><text x="332" y="790.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">safer.”</text><text x="332" y="817.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Needs evidence about</text><text x="332" y="838.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conditions in each place.</text><rect x="602" y="715" width="268" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="744" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">VALUE</text><text x="618" y="768.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Objects belong where</text><text x="618" y="790.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">they were made.”</text><text x="618" y="817.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cannot be proved; judge</text><text x="618" y="838.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">whether the reasoning is</text><text x="618" y="859.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">consistent.</text>
</svg>