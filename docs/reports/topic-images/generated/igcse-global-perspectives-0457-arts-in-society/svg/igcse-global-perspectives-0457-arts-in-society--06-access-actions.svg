<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judging actions to widen access to the arts</text>

<rect x="51.200000000000045" y="104" width="161.075" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="131.73750000000004" y="131.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Effectiveness</text><rect x="224.27500000000003" y="104" width="200.17499999999998" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="324.3625" y="131.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Cost and who pays</text><rect x="436.45000000000005" y="104" width="141.52499999999998" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="507.21250000000003" y="131.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Feasibility</text><rect x="589.975" y="104" width="258.82499999999993" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="719.3875" y="131.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Who benefits, who loses</text><rect x="253.60000000000002" y="156" width="170.84999999999997" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="339.025" y="183.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Sustainability</text><rect x="436.45" y="156" width="209.95" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="541.425" y="183.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Unintended effects</text><rect x="30" y="216" width="250" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="246" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Action</text><rect x="280" y="216" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="292" y="246" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="570" y="216" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="582" y="246" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="30" y="262" width="250" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="288.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Free museum days</text><rect x="280" y="262" width="290" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="288.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Cheap</text><rect x="570" y="262" width="300" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="288.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">May mostly attract people who</text><text x="582" y="310.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">would have come anyway</text><rect x="30" y="328" width="250" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="354.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Discounted youth arts</text><text x="42" y="376.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">pass</text><rect x="280" y="328" width="290" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="354.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Targets cost</text><rect x="570" y="328" width="300" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="354.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Only works if cost is the real</text><text x="582" y="376.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">barrier</text><rect x="30" y="394" width="250" height="88" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="420.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Artists’ workshops in</text><text x="42" y="442.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">every secondary school</text><rect x="280" y="394" width="290" height="88" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="420.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Reaches students who would</text><text x="292" y="442.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">never visit; builds skills</text><text x="292" y="464.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">over time</text><rect x="570" y="394" width="300" height="88" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="582" y="420.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Needs timetable time; stops if</text><text x="582" y="442.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">funding ends</text><rect x="30" y="500" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="536" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="565.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Workshops are the stronger option only if funded for several years and measured, for</text><text x="50" y="587.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">example by how many students join arts clubs afterwards.</text>
</svg>