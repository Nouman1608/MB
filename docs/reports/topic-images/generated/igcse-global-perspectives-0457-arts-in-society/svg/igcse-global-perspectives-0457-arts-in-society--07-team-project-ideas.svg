<rect width="900" height="578" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Team Project: issue, action, measure</text>

<text x="154.66666666666669" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Local issue</text><text x="450.00000000000006" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Possible action</text><text x="745.3333333333334" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">How to measure success</text><rect x="30" y="140" width="249.33333333333334" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="169.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Few arts activities for</text><text x="46" y="191.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">older residents</text><line x1="285.33333333333337" y1="187" x2="319.33333333333337" y2="187" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="140" width="249.33333333333334" height="94" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="169.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Art or music sessions at</text><text x="341.33333333333337" y="191.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a community centre</text><line x1="580.6666666666667" y1="187" x2="614.6666666666667" y2="187" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="140" width="249.33333333333334" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="169.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Attendance; a</text><text x="636.6666666666667" y="191.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">before-and-after survey</text><text x="636.6666666666667" y="213.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">on enjoyment</text><rect x="30" y="248" width="249.33333333333334" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="277.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Graffiti on a school</text><text x="46" y="299.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wall</text><line x1="285.33333333333337" y1="306" x2="319.33333333333337" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="248" width="249.33333333333334" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="277.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Design and paint a mural</text><text x="341.33333333333337" y="299.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">with students and</text><text x="341.33333333333337" y="321.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">neighbours, with</text><text x="341.33333333333337" y="343.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">permission</text><line x1="580.6666666666667" y1="306" x2="614.6666666666667" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="248" width="249.33333333333334" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="277.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Number involved; whether</text><text x="636.6666666666667" y="299.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">new graffiti appears</text><rect x="30" y="378" width="249.33333333333334" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="407.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A traditional craft</text><text x="46" y="429.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fading locally</text><line x1="285.33333333333337" y1="425" x2="319.33333333333337" y2="425" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="378" width="249.33333333333334" height="94" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="407.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An older craftsperson</text><text x="341.33333333333337" y="429.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">teaches students in a</text><text x="341.33333333333337" y="451.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">workshop</text><line x1="580.6666666666667" y1="425" x2="614.6666666666667" y2="425" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="378" width="249.33333333333334" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="407.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Students who complete an</text><text x="636.6666666666667" y="429.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">item and want to</text><text x="636.6666666666667" y="451.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">continue</text><rect x="30" y="490" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="523.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Start from a local issue and choose an action whose success you can actually measure.</text>
</svg>