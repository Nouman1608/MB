<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From a grant cut to unequal access</text>

<rect x="30" y="104" width="520" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAUSE</text><text x="46" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Council cuts its grant to an arts centre</text><line x1="290" y1="184" x2="290" y2="210" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="214" width="520" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="250.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The centre raises prices to cover its costs</text><line x1="290" y1="282" x2="290" y2="308" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="312" width="520" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="341" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSEQUENCE</text><text x="46" y="366.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Young people from lower-income families take</text><text x="46" y="390.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">part less</text><line x1="290" y1="416" x2="290" y2="442" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="446" width="520" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="482.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Access to the arts becomes more unequal</text><line x1="290" y1="514" x2="290" y2="540" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="544" width="520" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="573" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PREDICTION</text><text x="46" y="598.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fewer may choose creative careers later</text><rect x="580" y="144" width="290" height="245" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="600" y="177" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVALUATE</text><text x="600" y="202.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Is price really the main</text><text x="600" y="226.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">barrier?</text><text x="600" y="254.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="615.2" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lack of time, transport or</text><text x="615.2" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">confidence may matter as</text><text x="615.2" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">much.</text><text x="600" y="322.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="615.2" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Survey non-attenders about</text><text x="615.2" y="343.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">why they stay away before</text><text x="615.2" y="364.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">deciding.</text>
</svg>