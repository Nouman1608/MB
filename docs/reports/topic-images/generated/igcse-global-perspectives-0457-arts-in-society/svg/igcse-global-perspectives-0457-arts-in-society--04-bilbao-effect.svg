<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The “Bilbao effect”: correlation or causation?</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="330" y="340" width="240" height="74" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="385" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The city changes</text><rect x="60" y="140" width="240" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="180" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">New cultural building</text><text x="180" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Guggenheim Museum Bilbao,</text><text x="180" y="216" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">opened 1997</text><line x1="180" y1="238" x2="380" y2="332" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)" stroke-dasharray="9 7"/><rect x="330" y="140" width="240" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">New transport</text><line x1="450" y1="216" x2="450" y2="332" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="600" y="140" width="240" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="720" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Other investment</text><line x1="720" y1="216" x2="520" y2="332" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="250" cy="290" r="18" fill="#ffffff" stroke="#8a6d0d" stroke-width="3"/><text x="250" y="297" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">?</text><rect x="30" y="460" width="408" height="135" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="493" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CORRELATION</text><text x="50" y="519.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two things happening together</text><text x="50" y="548.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A city built a gallery, and the city grew.</text><rect x="462" y="460" width="408" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="493" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CAUSATION</text><text x="482" y="519.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One thing causing the other</text><text x="482" y="548.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Needs evidence that rules out the other</text><text x="482" y="570.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">changes.</text>
</svg>