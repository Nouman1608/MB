<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 521" width="900" height="521" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="521" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One issue, three levels: public funding for the arts</text>

<circle cx="205" cy="248.5" r="150" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="248.5" r="100" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="248.5" r="50" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="205" y="254.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Local</text><text x="205" y="329.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">National</text><text x="205" y="379.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Global</text><path d="M236,249.5 C328,249.5 328,155.5 416,155.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="236" cy="249.5" r="4" fill="#1e2a44"/><path d="M249.8,324.5 C334.9,324.5 334.9,259.5 416,259.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="249.8" cy="324.5" r="4" fill="#1e2a44"/><path d="M240.6,374.5 C330.3,374.5 330.3,352.5 416,352.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="240.6" cy="374.5" r="4" fill="#1e2a44"/><rect x="420" y="104" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="135.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Local</text><text x="436" y="164.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A council deciding whether to keep a community</text><text x="436" y="186.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">arts centre.</text><rect x="420" y="219" width="450" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="250.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">National</text><text x="436" y="279.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Government budgets for theatres and galleries.</text><rect x="420" y="312" width="450" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="343.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Global</text><text x="436" y="372.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Countries fund culture in very different ways.</text><rect x="30" y="411" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="444.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“The arts” is too broad to argue about. An issue like this one divides opinion at every</text><text x="50" y="466.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">level.</text>
</svg>