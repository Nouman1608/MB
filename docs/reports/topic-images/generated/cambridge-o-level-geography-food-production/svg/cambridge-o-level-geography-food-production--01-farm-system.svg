<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The farm as a system</text>

<rect x="30" y="115" width="270" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="149.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Physical inputs</text><text x="48" y="178" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="178" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Relief: gradient, altitude</text><text x="48" y="204" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="204" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Climate: temperature,</text><text x="64" y="224" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">rainfall, growing season</text><text x="48" y="250" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="250" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Soil: fertility, depth,</text><text x="64" y="270" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">drainage</text><rect x="30" y="318" width="270" height="232" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="352.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Human inputs</text><text x="48" y="378" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="378" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Labour, capital, machinery</text><text x="48" y="404" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="404" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Seeds, fertiliser,</text><text x="64" y="424" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">pesticides</text><text x="48" y="450" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="450" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Irrigation</text><text x="48" y="476" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="476" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Markets and transport</text><text x="48" y="502" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="502" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Government policy</text><text x="48" y="528" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="528" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Land ownership, tradition</text><rect x="335" y="115" width="230" height="435" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="353" y="149.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Processes</text><text x="353" y="178" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="369" y="178" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Ploughing</text><text x="353" y="206" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="369" y="206" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Sowing</text><text x="353" y="234" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="369" y="234" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Transplanting</text><text x="353" y="262" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="369" y="262" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Weeding</text><text x="353" y="290" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="369" y="290" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Spraying</text><text x="353" y="318" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="369" y="318" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Irrigating</text><text x="353" y="346" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="369" y="346" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Harvesting</text><text x="353" y="374" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="369" y="374" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Milking</text><text x="353" y="402" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="369" y="402" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Rearing animals</text><rect x="600" y="115" width="270" height="435" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="149.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Outputs</text><text x="618" y="178" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="178" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Crops, meat, milk, wool,</text><text x="634" y="198" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">eggs</text><text x="618" y="228" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="228" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Income, or food for the</text><text x="634" y="248" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">family</text><text x="618" y="278" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634" y="278" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">By-products: straw, manure</text><line x1="303" y1="210" x2="331" y2="280" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="303" y1="430" x2="331" y2="340" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="568" y1="330" x2="596" y2="330" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M735,552 L735,585 L165,585 L165,556" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 7" marker-end="url(#ahT)"/><rect x="192.89999999999998" y="576.275" width="514.2" height="20.925" rx="5" fill="#f4f6f6" opacity="1"/><text x="450" y="591" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="middle">feedback: profit reinvested, manure returned to fields</text><rect x="30" y="618" width="840" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="650" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Physical inputs set the limits of what can be farmed;</text><text x="450" y="676" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="middle">human inputs decide how intensively, and for whom.</text>
</svg>