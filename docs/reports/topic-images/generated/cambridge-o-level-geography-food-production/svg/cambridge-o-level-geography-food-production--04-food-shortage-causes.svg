<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why food runs short</text>

<rect x="30" y="115" width="410" height="380" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="150.85" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Natural</text><rect x="50" y="170" width="370" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="68" y="202.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Drought</text><text x="68" y="226.9" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">crops fail; animals die</text><rect x="50" y="274" width="370" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="68" y="306.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Floods and tropical storms</text><text x="68" y="330.9" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">crops destroyed, soil washed away</text><rect x="50" y="378" width="370" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="68" y="410.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Pests and diseases</text><text x="68" y="434.9" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">e.g. desert locusts strip crops</text><rect x="460" y="115" width="410" height="380" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="150.85" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Economic and political</text><rect x="480" y="165" width="370" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="494" y="193.025" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Low capital investment</text><text x="494" y="216.275" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">no fertiliser, seed, irrigation, storage</text><rect x="480" y="245" width="370" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="494" y="273.025" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Poor transport, distribution</text><text x="494" y="296.275" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">food cannot reach areas of need</text><rect x="480" y="325" width="370" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="494" y="353.025" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Conflict</text><text x="494" y="376.275" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">farmers flee; markets close; aid blocked</text><rect x="480" y="405" width="370" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="494" y="433.025" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Other human factors</text><text x="494" y="456.275" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rising population, degraded land, cash</text><text x="494" y="476.075" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">crops</text><line x1="235" y1="500" x2="360" y2="540" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="665" y1="500" x2="540" y2="540" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="250" y="545" width="400" height="60" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="584" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">FOOD SHORTAGE</text><text x="450" y="640" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">“Lack of food” is the result, not a cause.</text>
</svg>