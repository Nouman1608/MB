<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Solving food shortages</text>

<rect x="30" y="115" width="410" height="280" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="150.85" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Short term: relief</text><text x="55" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="186" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Emergency food aid</text><text x="55" y="224" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="224" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Therapeutic feeding for malnourished</text><text x="71" y="246" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">children</text><text x="55" y="284" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="284" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cash transfers so families can buy food</text><text x="55" y="322" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="71" y="322" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Early-warning systems for drought</text><rect x="460" y="115" width="410" height="280" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="150.85" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Long term: more output</text><text x="485" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="186" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Irrigation schemes and small dams</text><text x="485" y="224" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="224" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">High-yielding, drought-resistant seed</text><text x="501" y="246" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">with fertiliser (Green Revolution)</text><text x="485" y="284" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="284" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Appropriate technology: hand pumps,</text><text x="501" y="306" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">terracing, better grain stores</text><text x="485" y="344" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="501" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Roads, markets, pest control, peace</text><text x="450" y="442" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluate each one</text><rect x="30" y="462" width="268" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Food aid</text><text x="48" y="528" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ saves lives</text><text x="48" y="558" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">– does not raise output;</text><text x="48" y="579" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">can undercut local farmers</text><rect x="316" y="462" width="268" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Green Revolution seeds</text><text x="334" y="528" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ raise yields</text><text x="334" y="558" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">– need costly fertiliser</text><text x="334" y="579" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">and water</text><rect x="602" y="462" width="268" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Appropriate technology</text><text x="620" y="528" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ cheap, locally maintained</text><text x="620" y="558" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">– works on a small scale</text>
</svg>