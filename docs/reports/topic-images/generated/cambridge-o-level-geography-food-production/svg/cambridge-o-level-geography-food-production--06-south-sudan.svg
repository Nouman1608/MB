<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Case study: food shortage in South Sudan</text>

<line x1="80" y1="160" x2="820" y2="160" stroke="#1e2a44" stroke-width="4"/><circle cx="100" cy="160" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="132" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2011</text><text x="100" y="196" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">independence</text><circle cx="430" cy="160" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="430" y="132" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">late 2013</text><text x="430" y="196" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">civil war begins</text><circle cx="790" cy="160" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="790" y="132" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">February 2017</text><text x="790" y="196" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="end">famine declared, Unity State</text><rect x="30" y="230" width="201" height="158" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="263.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conflict</text><text x="48" y="287.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">farmers driven off</text><text x="48" y="307.78499999999997" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">land; harvests</text><text x="48" y="328.245" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">disrupted; markets</text><text x="48" y="348.705" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">closed; aid unsafe</text><line x1="130" y1="392" x2="370" y2="424" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="243" y="230" width="201" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="261" y="263.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economic</text><text x="261" y="285.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">collapse</text><text x="261" y="309.82500000000005" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">rising food prices;</text><text x="261" y="330.285" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">families cannot buy</text><text x="261" y="350.74500000000006" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">food</text><line x1="343" y1="392" x2="423.25" y2="424" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="456" y="230" width="201" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="263.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Poor</text><text x="474" y="285.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">infrastructure</text><text x="474" y="309.82500000000005" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">few all-weather</text><text x="474" y="330.285" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">roads; areas cut off</text><text x="474" y="350.74500000000006" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">in the rainy season</text><line x1="556" y1="392" x2="476.5" y2="424" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="669" y="230" width="201" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="687" y="263.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Climatic shocks</text><text x="687" y="287.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">drought and floods</text><text x="687" y="307.78499999999997" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">add pressure</text><line x1="769" y1="392" x2="529.75" y2="424" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="260" y="428" width="380" height="56" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="464" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Causes combine → famine</text><line x1="450" y1="488" x2="450" y2="516" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="520" width="268" height="82" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="562" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Severe malnutrition</text><rect x="316" y="520" width="268" height="82" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="552" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Very many displaced</text><text x="450" y="574" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">within the country and abroad</text><rect x="602" y="520" width="268" height="82" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="736" y="552" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Heavy reliance on</text><text x="736" y="574" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">international food aid</text>
</svg>