<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Effects of food shortage</text>

<rect x="30" y="110" width="840" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="300" cy="370" r="165" fill="none" stroke="#b5602e" stroke-width="3" stroke-dasharray="10 8"/><line x1="416.6726188957804" y1="253.32738110421968" x2="431.77485915780335" y2="270.700521179912" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="416.6726188957804" y1="486.6726188957803" x2="399.299478820088" y2="501.77485915780335" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="183.32738110421968" y1="486.6726188957804" x2="168.22514084219665" y2="469.2994788200879" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="183.32738110421963" y1="253.32738110421968" x2="200.70052117991202" y2="238.22514084219668" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="200" y="182.5" width="200" height="45" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="300" y="210.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Food shortage</text><rect x="365" y="337" width="200" height="66" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="465" y="365" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Undernutrition and</text><text x="465" y="386" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">malnutrition</text><rect x="200" y="491.5" width="200" height="87" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="300" y="519.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower resistance</text><text x="300" y="540.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">to disease; less</text><text x="300" y="561.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">energy to work</text><rect x="35" y="337" width="200" height="66" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="135" y="365" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Output falls</text><text x="135" y="386" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">further</text><text x="300" y="364" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">a downward</text><text x="300" y="386" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">spiral</text><text x="600" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Wider effects</text><text x="600" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">from individuals to whole countries</text><rect x="600" y="196" width="250" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="725" y="237" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Stunted growth in children</text><rect x="600" y="282" width="250" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="725" y="323" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Children leave school</text><rect x="600" y="368" width="250" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="725" y="409" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Migration to towns or camps</text><rect x="600" y="454" width="250" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="725" y="495" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Dependence on food aid</text><rect x="600" y="540" width="250" height="70" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="725" y="581" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Famine: widespread deaths</text>
</svg>