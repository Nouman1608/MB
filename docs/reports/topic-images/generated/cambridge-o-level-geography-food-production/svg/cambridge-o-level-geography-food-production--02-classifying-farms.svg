<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Classifying a farm: three questions</text>

<text x="395" y="128" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Intensive or</text><text x="395" y="148" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">extensive?</text><text x="395" y="170" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">inputs and output per hectare</text><text x="577" y="128" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Commercial or</text><text x="577" y="148" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">subsistence?</text><text x="577" y="170" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">sold, or feeds the family</text><text x="759" y="128" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Arable, pastoral or</text><text x="759" y="148" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">mixed?</text><text x="759" y="170" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">crops, animals or both</text><rect x="30" y="190" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="226" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Wet rice, family plots,</text><text x="52" y="248" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">river delta</text><rect x="315" y="210" width="160" height="44" rx="22" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="395" y="238" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Intensive</text><rect x="497" y="210" width="160" height="44" rx="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="577" y="238" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Subsistence</text><rect x="679" y="210" width="160" height="44" rx="22" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><text x="759" y="238" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Arable</text><rect x="30" y="288" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="324" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cattle station, dry</text><text x="52" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">grassland</text><rect x="315" y="308" width="160" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="395" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Extensive</text><rect x="497" y="308" width="160" height="44" rx="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="577" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Commercial</text><rect x="679" y="308" width="160" height="44" rx="22" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="759" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pastoral</text><rect x="30" y="386" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="422" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Glasshouse tomatoes near a</text><text x="52" y="444" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">city</text><rect x="315" y="406" width="160" height="44" rx="22" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="395" y="434" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Intensive</text><rect x="497" y="406" width="160" height="44" rx="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="577" y="434" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Commercial</text><rect x="679" y="406" width="160" height="44" rx="22" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><text x="759" y="434" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Arable</text><rect x="30" y="484" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="520" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nomadic herding, semi-arid</text><text x="52" y="542" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">region</text><rect x="315" y="504" width="160" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="395" y="532" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Extensive</text><rect x="497" y="504" width="160" height="44" rx="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="577" y="532" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Subsistence</text><rect x="679" y="504" width="160" height="44" rx="22" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="759" y="532" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pastoral</text><rect x="30" y="590" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="632" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Always classify on all three scales, never just “arable”.</text>
</svg>