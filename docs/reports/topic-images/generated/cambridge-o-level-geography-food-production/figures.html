<!-- place after: ## Case study 1: wet rice in the Ganges–Brahmaputra delta, Bangladesh -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-geography-food-production--03-wet-rice-bangladesh.webp" width="900" height="776" alt="A cross-section of flat delta land: monsoon rain about June to September floods paddy fields held in by low earth bunds over fertile alluvium with clay that holds water. Below, the system: inputs of family labour, draught animals or power tillers, seed, fertiliser and irrigation water; processes from nursery bed to hand transplanting, weeding and harvesting; outputs of rice, straw and sometimes a second crop." loading="lazy">

<!-- place after: ## Food shortages: causes -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-geography-food-production--04-food-shortage-causes.webp" width="900" height="665" alt="Two groups of causes lead to food shortage. Natural: drought, floods and tropical storms, and pests and diseases such as desert locusts. Economic and political: low capital investment, poor transport and distribution, conflict, and other human factors such as population growth, land degradation and land used for cash crops." loading="lazy">
  <figcaption>Natural shocks and human failures combine; “lack of food” is never a cause.</figcaption>
</figure>

<!-- place after: ## Food shortages: effects -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-geography-food-production--05-food-shortage-effects.webp" width="900" height="670" alt="A loop: food shortage leads to undernutrition and malnutrition, which lower resistance to disease and leave less energy to work, so output falls further and the shortage deepens. Beside it, wider effects from individual to country: stunted growth in children, children leaving school, migration to towns or camps, dependence on food aid and, in extreme cases, famine." loading="lazy">
  <figcaption>Hunger lowers the output that would end the hunger.</figcaption>
</figure>

<!-- place after: ## Case study 2: South Sudan -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-geography-food-production--06-south-sudan.webp" width="900" height="625" alt="A timeline: independence in 2011, civil war from late 2013 and famine declared in parts of Unity State in February 2017. Four causes combine: conflict, economic collapse with rising prices, poor infrastructure with few all-weather roads, and climatic shocks. Effects: severe malnutrition, very large numbers displaced, and heavy reliance on international food aid." loading="lazy">
  <figcaption>Conflict was the trigger, but four causes combined to cause famine.</figcaption>
</figure>

<!-- place after: ## Solutions -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-geography-food-production--07-food-solutions.webp" width="900" height="625" alt="Short-term relief: emergency food aid, therapeutic feeding, cash transfers and early-warning systems. Long-term ways to raise output: irrigation and small dams, high-yielding drought-resistant seed with fertiliser, appropriate technology such as hand pumps, terracing and grain stores, and better roads, markets, pest control and peace. Evaluation: food aid saves lives but does not raise output; Green Revolution seeds raise yields but need fertiliser and water; appropriate technology is cheap but small in scale." loading="lazy">
  <figcaption>Relief saves lives now; only long-term change raises output.</figcaption>
</figure>
