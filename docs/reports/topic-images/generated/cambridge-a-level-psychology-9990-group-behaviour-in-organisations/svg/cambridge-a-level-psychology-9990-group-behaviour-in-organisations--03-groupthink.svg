<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Groupthink and how to avoid it</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Janis: in a cohesive group, the desire for agreement overrides realistic appraisal</text>
<rect x="30" y="124" width="201" height="113" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="161.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Illusion of</text><text x="44" y="182.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">invulnerability</text><text x="44" y="209" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"Our product can't fail."</text><rect x="243" y="124" width="201" height="113" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="257" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Collective</text><text x="257" y="172.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">rationalisation</text><text x="257" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">customer warning signs</text><text x="257" y="219" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">explained away</text><rect x="456" y="124" width="201" height="113" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="470" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Belief in the group's</text><text x="470" y="172.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">morality</text><text x="470" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"We're the good guys,</text><text x="470" y="219" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">so this is right."</text><rect x="669" y="124" width="201" height="113" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="683" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Stereotyping</text><text x="683" y="172.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">outsiders</text><text x="683" y="199" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">competitors dismissed</text><text x="683" y="219" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">as incompetent</text><rect x="30" y="249" width="201" height="113" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="276.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pressure on</text><text x="44" y="297.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">dissenters</text><text x="44" y="324" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a doubter told to be a</text><text x="44" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">team player</text><rect x="243" y="249" width="201" height="113" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="257" y="286.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Self-censorship</text><text x="257" y="313.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">members keep doubts</text><text x="257" y="333.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">to themselves</text><rect x="456" y="249" width="201" height="113" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="470" y="286.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Illusion of unanimity</text><text x="470" y="313.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">silence taken as</text><text x="470" y="333.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">agreement</text><rect x="669" y="249" width="201" height="113" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="683" y="286.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mindguards</text><text x="683" y="313.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shield the leader from</text><text x="683" y="333.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bad news</text><line x1="450" y1="368" x2="450" y2="424" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="432" width="840" height="188" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="464" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRATEGIES TO AVOID IT</text><text x="50" y="495.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="495.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the leader stays impartial and <tspan font-weight="700" fill="#1e2a44">speaks</tspan> <tspan font-weight="700" fill="#1e2a44">last</tspan></text><text x="50" y="520.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="520.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">appoint a <tspan font-weight="700" fill="#1e2a44">devil's</tspan> <tspan font-weight="700" fill="#1e2a44">advocate</tspan></text><text x="50" y="545.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">invite <tspan font-weight="700" fill="#1e2a44">outside</tspan> <tspan font-weight="700" fill="#1e2a44">experts</tspan></text><text x="50" y="570.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="570.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">split the group into <tspan font-weight="700" fill="#1e2a44">subgroups</tspan></text><text x="50" y="595.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="595.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hold a <tspan font-weight="700" fill="#1e2a44">"second-chance"</tspan> <tspan font-weight="700" fill="#1e2a44">meeting</tspan> before the final decision</text>
</svg>