<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" width="900" height="504" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="504" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Belbin's nine team roles</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Balanced teams outperformed teams of similarly able individuals</text>
<rect x="30" y="124" width="270.6666666666667" height="217" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THINKING ROLES</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Plant</tspan>: creative ideas</text><text x="50" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Monitor</tspan> <tspan font-weight="700" fill="#1e2a44">evaluator</tspan>: judges</text><text x="50" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">options logically</text><text x="50" y="274.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Specialist</tspan>: expert knowledge</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="217" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PEOPLE ROLES</text><text x="334.6666666666667" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Co-ordinator</tspan>: clarifies goals,</text><text x="334.6666666666667" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">delegates</text><text x="334.6666666666667" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Teamworker</tspan>: supports,</text><text x="334.6666666666667" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">resolves friction</text><text x="334.6666666666667" y="295.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Resource</tspan> <tspan font-weight="700" fill="#1e2a44">investigator</tspan>:</text><text x="334.6666666666667" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">explores outside contacts</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="217" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACTION ROLES</text><text x="619.3333333333334" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Shaper</tspan>: drives the team</text><text x="619.3333333333334" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">forward</text><text x="619.3333333333334" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Implementer</tspan>: turns ideas into</text><text x="619.3333333333334" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">practical plans</text><text x="619.3333333333334" y="295.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Completer</tspan> <tspan font-weight="700" fill="#1e2a44">finisher</tspan>: checks</text><text x="619.3333333333334" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">details and deadlines</text><rect x="30" y="363" width="275.3333333333333" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="395" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTH</text><text x="50" y="426.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Widely used in team building.</text><rect x="319.3333333333333" y="363" width="550.6666666666666" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="339.3333333333333" y="395" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="339.3333333333333" y="426.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Roles are measured by self-report; people may play different roles</text><text x="339.3333333333333" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in different teams.</text>
</svg>