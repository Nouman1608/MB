<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 763" width="900" height="763" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="763" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Social facilitation: drive theory</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Zajonc</text>
<rect x="250" y="124" width="400" height="61" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Presence of others</text><line x1="450" y1="191" x2="450" y2="243" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="251" width="400" height="61" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="286.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Arousal rises</text><line x1="450" y1="318" x2="450" y2="370" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="378" width="400" height="61" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="413.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Dominant response more likely</text><line x1="370" y1="445" x2="240" y2="487" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="530" y1="445" x2="660" y2="487" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="507" width="400" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="539" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SIMPLE OR WELL-LEARNED TASK</text><text x="230" y="565.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dominant response is correct</text><text x="230" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">→ performance improves</text><rect x="470" y="507" width="400" height="113" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="670" y="539" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">COMPLEX OR NEW TASK</text><text x="670" y="565.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dominant response is often wrong</text><text x="670" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">→ performance gets worse</text><rect x="30" y="642" width="840" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="676.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation apprehension (Cottrell)</text><text x="450" y="706.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">It is concern about <tspan font-weight="700" fill="#1e2a44">being</tspan> <tspan font-weight="700" fill="#1e2a44">judged</tspan>, not mere presence, that raises arousal.</text>
</svg>