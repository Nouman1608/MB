<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" width="900" height="712" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="712" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Thomas–Kilmann conflict-handling modes</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Five modes on two dimensions</text>
<rect x="175" y="134" width="660" height="420" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><line x1="175" y1="554" x2="855" y2="554" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="175" y1="554" x2="175" y2="118" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="505" y="590" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cooperativeness: meeting others' concerns →</text><text x="149" y="344" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 149 344)">Assertiveness: meeting own concerns →</text><rect x="192" y="155.2" width="230" height="92" rx="14" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2.5"/><text x="307" y="182.51999999999998" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Competing</text><text x="307" y="210.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">emergencies; unpopular but</text><text x="307" y="230.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">necessary decisions</text><rect x="588" y="155.2" width="230" height="92" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="703" y="182.51999999999998" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Collaborating</text><text x="703" y="210.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">important issues needing a</text><text x="703" y="230.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">solution both accept</text><rect x="390" y="298" width="230" height="92" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="505" y="335.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Compromising</text><text x="505" y="363.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">time pressure; equal power</text><rect x="192" y="440.8" width="230" height="92" rx="14" fill="#f4f6f6" stroke="#1e2a44" stroke-width="2.5"/><text x="307" y="478.12" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Avoiding</text><text x="307" y="506.3" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">trivial issues; cooling-off</text><rect x="588" y="440.8" width="230" height="92" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="703" y="478.12" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Accommodating</text><text x="703" y="506.3" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">preserving a relationship</text><rect x="30" y="622" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="655.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Collaborating</tspan>: both win. <tspan font-weight="700" fill="#1e2a44">Compromising</tspan>: both give up something.</text>
</svg>