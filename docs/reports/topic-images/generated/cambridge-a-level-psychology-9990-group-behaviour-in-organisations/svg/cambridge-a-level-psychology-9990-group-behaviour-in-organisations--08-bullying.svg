<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bullying at work</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Einarsen (1999)</text>
<text x="450" y="138.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Repeated negative acts over time against someone who finds it hard to defend themselves.</text><rect x="30" y="170" width="201" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="198" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WORK-RELATED</text><text x="46" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unreasonable</text><text x="46" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deadlines,</text><text x="46" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">withholding</text><text x="46" y="292.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">information</text><rect x="243" y="170" width="201" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="259" y="198" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PERSON-RELATED</text><text x="259" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">insults, spreading</text><text x="259" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rumours</text><rect x="456" y="170" width="201" height="143" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="198" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PREDATORY</text><text x="472" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">target singled out</text><text x="472" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">without provoking it</text><rect x="669" y="170" width="201" height="143" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="685" y="198" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DISPUTE-RELATED</text><text x="685" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">arises from an</text><text x="685" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">escalating conflict</text><text x="450" y="349" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">PHASES</text><rect x="30" y="375" width="184.5" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122.25" y="403.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Aggressive</text><text x="122.25" y="426.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">behaviour</text><line x1="220.5" y1="410" x2="242.5" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="375" width="184.5" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340.75" y="414.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Bullying</text><line x1="439" y1="410" x2="461" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="375" width="184.5" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="559.25" y="403.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Stigmatisation of</text><text x="559.25" y="426.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">the target</text><line x1="657.5" y1="410" x2="679.5" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="375" width="184.5" height="70" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="777.75" y="414.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Severe trauma</text><rect x="30" y="467" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="501.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Causes</text><text x="450" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the bully's personality · the target's position · organisational factors such as poor leadership and</text><text x="450" y="553.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">high stress</text>
</svg>