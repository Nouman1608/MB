<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 537" width="900" height="537" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="537" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stages of group development</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Tuckman; adjourning added later with Jensen</text>
<rect x="30" y="124" width="150" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 1</text><text x="44" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Forming</text><text x="44" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">polite, uncertain,</text><text x="44" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">dependent on</text><text x="44" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the leader</text><line x1="182" y1="209" x2="200.5" y2="209" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="202.5" y="124" width="150" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="216.5" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 2</text><text x="216.5" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Storming</text><text x="216.5" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conflict over</text><text x="216.5" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">roles, goals and</text><text x="216.5" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">leadership</text><line x1="354.5" y1="209" x2="373" y2="209" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="375" y="124" width="150" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="389" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 3</text><text x="389" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Norming</text><text x="389" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">agreed rules and</text><text x="389" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">roles; cohesion</text><text x="389" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">grows</text><line x1="527" y1="209" x2="545.5" y2="209" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="547.5" y="124" width="150" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="561.5" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 4</text><text x="561.5" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Performing</text><text x="561.5" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">works</text><text x="561.5" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">effectively</text><text x="561.5" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">towards its goal</text><line x1="699.5" y1="209" x2="718" y2="209" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="720" y="124" width="150" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 5</text><text x="734" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Adjourning</text><text x="734" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">task ends; the</text><text x="734" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">group disbands</text><path d="M622.5,296 L622.5,340 L277.5,340 L277.5,304" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#ahR)"/><text x="450" y="366" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">groups may return to storming, e.g. when membership changes</text><rect x="30" y="396" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="428" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE: A NEW PROJECT TEAM</text><text x="50" y="459.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">first meeting, roles unclear → disagreement about who leads the design → weekly meeting routine</text><text x="50" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">agreed → product delivered on time → team celebrates and members move on</text>
</svg>