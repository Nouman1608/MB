<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 763" width="900" height="763" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="763" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Claypoole and Szalma (2019)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Experiment 1: does social facilitation apply to being monitored?</text>
<rect x="30" y="124" width="840" height="52" rx="14" fill="#2e6b62"/><rect x="30" y="154" width="840" height="22" fill="#2e6b62"/><text x="50" y="158" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">Electronic performance monitoring and vigilance</text><text x="850" y="158" font-size="16" font-weight="600" fill="#ffffff" text-anchor="end">laboratory experiment</text><rect x="30" y="176" width="280" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AIM</text><text x="46" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">To investigate how different</text><text x="46" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">forms of monitoring affect</text><text x="46" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sustained attention (vigilance).</text><rect x="310" y="176" width="280" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="326" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TASK</text><text x="326" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Detect infrequent critical signals</text><text x="326" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">over a long period.</text><rect x="590" y="176" width="280" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEASURE</text><text x="606" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Vigilance performance, such as</text><text x="606" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">correct detections of critical</text><text x="606" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">signals.</text><text x="450" y="334" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">MONITORING CONDITIONS, SUCH AS</text><rect x="30" y="360" width="270.6666666666667" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="394.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Working alone</text><text x="165.33333333333334" y="423.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">unmonitored</text><rect x="314.6666666666667" y="360" width="270.6666666666667" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="394.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Observer present</text><text x="450" y="423.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">physical presence</text><rect x="599.3333333333334" y="360" width="270.6666666666667" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="394.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Electronic monitoring</text><text x="734.6666666666667" y="423.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">software records activity</text><rect x="30" y="470" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="504.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Findings</text><text x="50" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Being monitored, including electronically, affected vigilance compared with working unmonitored: social</text><text x="50" y="554.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">facilitation through monitoring as well as physical presence.</text><rect x="30" y="601" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="633" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="664.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Laboratory control allows causal conclusions;</text><text x="50" y="685.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the task resembles some monitoring jobs, such</text><text x="50" y="706.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as security screening.</text><rect x="457" y="601" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="633" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="664.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One session is not a working day; participants</text><text x="477" y="685.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">were not employees whose jobs depended on</text><text x="477" y="706.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the data; ethics of monitoring workers.</text>
</svg>