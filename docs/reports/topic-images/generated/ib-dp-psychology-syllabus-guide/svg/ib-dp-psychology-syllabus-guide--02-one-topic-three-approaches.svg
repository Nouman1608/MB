<ellipse cx="450" cy="190" rx="130" ry="56" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="184" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">memory</text><text x="450" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one topic</text><line x1="330" y1="248" x2="163" y2="300" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="306" width="266" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="163" y="342" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Biological</text><text x="163" y="366" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">approach</text><text x="163" y="400" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">through brain structures</text><line x1="450" y1="248" x2="450" y2="300" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="317" y="306" width="266" height="160" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="342" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cognitive</text><text x="450" y="366" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">approach</text><text x="450" y="400" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">through</text><text x="450" y="422" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">information-processing</text><text x="450" y="444" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">models</text><line x1="570" y1="248" x2="737" y2="300" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="604" y="306" width="266" height="160" rx="14" fill="#efdfa8" stroke="#2e6b62" stroke-width="2.5"/><text x="737" y="342" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sociocultural</text><text x="737" y="366" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">approach</text><text x="737" y="400" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">through the influence of</text><text x="737" y="422" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">schema and culture on</text><text x="737" y="444" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">recall</text><rect x="30" y="488" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="522" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">All three approaches are compulsory, not alternatives.</text><text x="450" y="550" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">For each study: recall the finding, the method and one evaluative point.</text>
