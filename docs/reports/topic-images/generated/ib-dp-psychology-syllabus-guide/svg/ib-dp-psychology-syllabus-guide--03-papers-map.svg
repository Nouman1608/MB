<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 682" width="900" height="682" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="682" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which paper examines what</text>

<text x="220" y="126" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">What you study</text><text x="695" y="126" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Where it is assessed</text><rect x="30" y="144" width="380" height="95" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="520" y="144" width="350" height="95" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="188.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Core: three approaches</text><text x="48" y="211.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">biological, cognitive, sociocultural</text><text x="538" y="178" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 1</text><text x="538" y="201" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">short-answer questions plus one</text><text x="538" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">essay</text><line x1="416" y1="191.5" x2="512" y2="191.5" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="255" width="380" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="520" y="255" width="350" height="116" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="289" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Options</text><text x="48" y="312" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one at SL, two at HL, from abnormal,</text><text x="48" y="333" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">developmental, health and human</text><text x="48" y="354" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">relationships</text><text x="538" y="299.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 2</text><text x="538" y="322.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">option-specific; at HL one essay on</text><text x="538" y="343.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">each of the two options</text><line x1="416" y1="313" x2="512" y2="313" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="387" width="380" height="118" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="520" y="387" width="350" height="118" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="421" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Approaches to researching</text><text x="48" y="444" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">behaviour</text><text x="48" y="467" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">qualitative and quantitative methods;</text><text x="48" y="488" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">20 h SL, 60 h HL</text><text x="538" y="432.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 3 (HL only)</text><text x="538" y="455.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">short-answer questions on research</text><text x="538" y="476.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">methodology</text><line x1="416" y1="446" x2="512" y2="446" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="521" width="380" height="95" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="520" y="521" width="350" height="95" rx="12" fill="#dce9e7" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="555" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Experimental study</text><text x="48" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">designed and run, usually in a small</text><text x="48" y="599" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">group; written up individually</text><text x="538" y="565.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Internal assessment</text><text x="538" y="588.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">externally moderated by IB examiners</text><line x1="416" y1="568.5" x2="512" y2="568.5" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><text x="450" y="654" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Confirm early which option (SL) or two options (HL) your class studied.</text>
</svg>