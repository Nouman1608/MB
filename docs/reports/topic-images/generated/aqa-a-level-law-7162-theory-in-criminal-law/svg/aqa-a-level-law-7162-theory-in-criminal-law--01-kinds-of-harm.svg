<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="628" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What counts as harm?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Mill, On Liberty (1859): power may be used only to prevent harm to others</text>
<text x="195" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">KIND OF HARM</text><text x="645" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">OFFENCES THAT PROTECT AGAINST IT</text><rect x="30" y="136" width="330" height="62" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Physical injury and death</text><line x1="366" y1="167" x2="412" y2="167" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="420" y="136" width="450" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="440" y="174" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Murder, manslaughter, s18, s20, s47, battery</text><rect x="30" y="208" width="330" height="62" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="246" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Psychiatric injury</text><line x1="366" y1="239" x2="412" y2="239" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="420" y="208" width="450" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="440" y="246" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">s47 (<tspan font-style="italic">Chan-Fook</tspan>, 1994); s20 (<tspan font-style="italic">Burstow</tspan>, 1997)</text><rect x="30" y="280" width="330" height="62" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="318" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fear of violence, without injury</text><line x1="366" y1="311" x2="412" y2="311" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="420" y="280" width="450" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="440" y="318" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Assault (<tspan font-style="italic">Ireland</tspan>, 1997)</text><rect x="30" y="352" width="330" height="62" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="390" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Loss of property</text><line x1="366" y1="383" x2="412" y2="383" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="420" y="352" width="450" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="440" y="390" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Theft; robbery</text><rect x="30" y="424" width="330" height="62" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="462" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Risk of harm not yet caused</text><line x1="366" y1="455" x2="412" y2="455" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="420" y="424" width="450" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="440" y="462" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Attempt</text><rect x="30" y="508" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="542.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Attempt tests the principle</text><text x="450" y="571.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">No harm has happened, yet the law punishes a dangerous intention that came close to causing harm.</text>
</svg>