<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 631" width="900" height="631" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="631" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Autonomy: free to choose, responsible for choices</text>

<rect x="30" y="100" width="412" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="236" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FREE</text><text x="236" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Choices affecting only oneself</text><rect x="458" y="100" width="412" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RESPONSIBLE</text><text x="664" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Answer for the choices you make</text><rect x="30" y="202" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="232" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VOLUNTARINESS</text><text x="48" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only voluntary conduct attracts liability;</text><text x="48" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">automatism is a complete defence because no</text><text x="48" y="305.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">choice was made</text><rect x="458" y="202" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="232" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OMISSIONS</text><text x="476" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No general duty to act: a choice not to intervene</text><text x="476" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is respected unless a recognised duty exists</text><rect x="30" y="342" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="372" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FREE CHOICES OF OTHERS</text><text x="48" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Kennedy</tspan> <tspan font-style="italic">(No</tspan> <tspan font-style="italic">2)</tspan> (2007): the victim’s free,</text><text x="48" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deliberate, informed injection broke the chain of</text><text x="48" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">causation</text><rect x="458" y="342" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="372" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURESS</text><text x="476" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Threats can overbear choice, but not for one who</text><text x="476" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chose to join a violent gang (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hasan</tspan>, 2005)</text><rect x="30" y="490" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="524.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual responsibility</text><text x="450" y="553.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">People answer for their own conduct, not others’ free choices (<tspan font-style="italic">Kennedy</tspan>). Transferred malice is a limited</text><text x="450" y="574.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">exception: the defendant still chose the same kind of harm.</text>
</svg>