<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The fault principle</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The more serious the offence, the more fault it requires</text>
<rect x="30" y="124" width="840" height="72" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intention</text><text x="52" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Murder; s18</text><rect x="30" y="208" width="840" height="72" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="238" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Subjective recklessness</text><text x="52" y="264" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s20; assault</text><rect x="30" y="292" width="840" height="72" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Strict liability: no fault for an element</text><text x="52" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Harrow</tspan> <tspan font-style="italic">LBC</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Shah</tspan> (1999): newsagent convicted despite precautions</text><text x="850" y="154" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">most fault</text><text x="850" y="322" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">the main exception</text><rect x="30" y="386" width="412" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R v G (2003)</text><text x="48" y="442.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Caldwell overruled</text><text x="48" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The objective test had convicted a 14-year-old</text><text x="48" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with learning difficulties who could not foresee</text><text x="48" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the risk (<tspan font-style="italic">Elliott</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">C</tspan>, 1983). Now: what D actually</text><text x="48" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foresaw.</text><rect x="458" y="386" width="412" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SWEET v PARSLEY (1970)</text><text x="476" y="442.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Presumption of mens rea</text><text x="476" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parliament presumed to intend mens rea; applied</text><text x="476" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in <tspan font-style="italic">B</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">DPP</tspan> (2000).</text>
</svg>