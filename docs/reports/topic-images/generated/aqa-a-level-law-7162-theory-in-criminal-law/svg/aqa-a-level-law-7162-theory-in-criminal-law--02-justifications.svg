<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 435" width="900" height="435" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="435" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why criminalise conduct?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four competing justifications</text>
<line x1="330" y1="195.5" x2="410" y2="243.1" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="331.5" x2="410" y2="283.9" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="195.5" x2="490" y2="243.1" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="342" x2="490" y2="287.05" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="263.5" r="80" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="258.56" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Criminalise</text><text x="450" y="281.73999999999995" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">conduct?</text><rect x="30" y="134.5" width="300" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="162.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HARM PRINCIPLE</text><text x="46" y="187.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Prevent harm to others</text><text x="46" y="215.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mill: not conduct harming only the</text><text x="46" y="236.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">actor, or merely disliked</text><rect x="30" y="270.5" width="300" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="298.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEGAL PATERNALISM</text><text x="46" y="323.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Protect people from themselves</text><text x="46" y="351.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Compulsory seatbelts; drug</text><text x="46" y="372.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offences</text><rect x="570" y="124" width="300" height="143" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="586" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEGAL MORALISM</text><text x="586" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Enforce shared morality</text><text x="586" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Devlin: society may protect its</text><text x="586" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">moral fabric. Hart: immorality alone</text><text x="586" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is not enough</text><rect x="570" y="281" width="300" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="309" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OFFENCE TO OTHERS</text><text x="586" y="334.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Serious offence, not harm</text><text x="586" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conduct that causes serious</text><text x="586" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offence rather than harm</text>
</svg>