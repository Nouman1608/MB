<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" width="900" height="648" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="648" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four principles for formulating criminal law</text>

<rect x="30" y="100" width="412" height="180" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FAIR LABELLING (ASHWORTH)</text><text x="48" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The name should describe the wrong</text><text x="48" y="184.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Murder: contract killing and mercy killing alike,</text><text x="63.2" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mandatory life</text><text x="48" y="231.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Manslaughter: near-murder to a single punch</text><text x="48" y="257.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="257.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s47 and s20 share a maximum</text><rect x="458" y="100" width="412" height="180" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CORRESPONDENCE</text><text x="476" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mens rea should match actus reus</text><text x="476" y="184.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Broken by s47, s20, murder (GBH intent),</text><text x="491.2" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unlawful act manslaughter</text><text x="476" y="231.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Broadly met by s18 and theft</text><rect x="30" y="294" width="412" height="222" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MAXIMUM CERTAINTY (ARTICLE 7)</text><text x="48" y="350.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Know in advance what is forbidden</text><text x="48" y="378.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gross negligence: “so bad” is circular</text><text x="63.2" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Adomako</tspan>), but compatible (<tspan font-style="italic">Misra</tspan> <tspan font-style="italic">and</tspan></text><text x="63.2" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Srivastava</tspan>, 2004)</text><text x="48" y="446.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dishonesty: <tspan font-style="italic">Ivey</tspan>; <tspan font-style="italic">Barton</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Booth</tspan> (2020)</text><text x="48" y="472.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="472.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“More than merely preparatory”: <tspan font-style="italic">Campbell</tspan>;</text><text x="63.2" y="493.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Tosti</tspan></text><rect x="458" y="294" width="412" height="222" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NO RETROSPECTIVE LIABILITY (ARTICLE 7)</text><text x="476" y="350.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No punishment for conduct lawful when</text><text x="476" y="373.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">done</text><text x="476" y="401.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">R</tspan> (1991); no breach in <tspan font-style="italic">SW</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (1995): a</text><text x="491.2" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foreseeable development</text><text x="476" y="448.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="448.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">War Crimes Act 1991: retrospective statute</text><rect x="30" y="538" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="570.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> confusing correspondence (mens rea matching actus reus) with fair labelling (name</text><text x="450" y="591.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">matching wrong).</text>
</svg>