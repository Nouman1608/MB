<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" width="900" height="465" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="465" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Harm and consent: the hard case</text>

<rect x="30" y="100" width="412" height="223" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">R v BROWN (1993)</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Convicted under s47 and s20</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consensual sado-masochistic injuries in</text><text x="63.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">private</text><text x="48" y="232.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lord Templeman: society may protect itself</text><text x="63.2" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">against “a cult of violence”</text><text x="48" y="279.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="279.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No breach of Article 8: <tspan font-style="italic">Laskey,</tspan> <tspan font-style="italic">Jaggard</tspan> <tspan font-style="italic">and</tspan></text><text x="63.2" y="300.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Brown</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (1997)</text><rect x="458" y="100" width="412" height="223" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R v WILSON (1996)</text><text x="476" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not guilty</text><text x="476" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Husband branded his initials on his wife’s</text><text x="491.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">buttocks at her request</text><text x="476" y="232.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Treated as akin to tattooing between spouses</text><rect x="30" y="345" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="379.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Critics of Brown</text><text x="450" y="408.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">No harm to anyone who had not consented: the decision reflects moralism or paternalism rather than Mill.</text>
</svg>