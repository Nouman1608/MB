<rect width="900" height="653" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Correspondence: does the mens rea match the harm?</text>

<text x="362" y="116" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">MENS REA REQUIRED</text><text x="700" y="116" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">ACTUS REUS (HARM)</text><rect x="30" y="130" width="150" height="64" rx="10" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="167" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">s18</text><rect x="195" y="130" width="335" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="210" y="168" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intention to cause GBH</text><rect x="590" y="130" width="220" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="700" y="169" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">GBH</text><text x="560" y="172" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">=</text><text x="842" y="172" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="204" width="150" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="241" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">s20</text><rect x="195" y="204" width="335" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="210" y="242" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Foresee some harm (<tspan font-style="italic">Mowatt</tspan>)</text><rect x="590" y="204" width="220" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="700" y="243" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Wound or GBH</text><text x="560" y="246" font-size="30" font-weight="700" fill="#b5602e" text-anchor="middle">&lt;</text><text x="842" y="246" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><rect x="30" y="278" width="150" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="315" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">s47</text><rect x="195" y="278" width="335" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="210" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mens rea of assault or battery (<tspan font-style="italic">Savage</tspan>;</text><text x="210" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Roberts</tspan>)</text><rect x="590" y="278" width="220" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="700" y="317" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">ABH</text><text x="560" y="320" font-size="30" font-weight="700" fill="#b5602e" text-anchor="middle">&lt;</text><text x="842" y="320" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><rect x="30" y="352" width="150" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="389" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Murder</text><rect x="195" y="352" width="335" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="210" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intent to cause GBH is enough (<tspan font-style="italic">Vickers</tspan>)</text><rect x="590" y="352" width="220" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="700" y="391" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Death</text><text x="560" y="394" font-size="30" font-weight="700" fill="#b5602e" text-anchor="middle">&lt;</text><text x="842" y="394" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><rect x="30" y="426" width="150" height="64" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="453" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Unlawful act</text><text x="105" y="473" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">manslaughter</text><rect x="195" y="426" width="335" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="210" y="452" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mens rea of the unlawful act (<tspan font-style="italic">Newbury</tspan></text><text x="210" y="472" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">and</tspan> <tspan font-style="italic">Jones</tspan>)</text><rect x="590" y="426" width="220" height="64" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="700" y="465" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Death</text><text x="560" y="468" font-size="30" font-weight="700" fill="#b5602e" text-anchor="middle">&lt;</text><text x="842" y="468" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><rect x="30" y="512" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="546.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Constructive liability</text><text x="450" y="575.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Supporters: choosing unlawful violence means taking the risk of worse consequences. Critics: it breaks</text><text x="450" y="596.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the fault principle and fair labelling.</text>
</svg>