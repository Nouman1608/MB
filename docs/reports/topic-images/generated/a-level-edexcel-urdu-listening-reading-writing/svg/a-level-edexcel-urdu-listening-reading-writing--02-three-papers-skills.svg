<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the three papers divide the skills</text>

<rect x="30" y="110" width="266" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="163" y="148" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1</text><rect x="46" y="172" width="234" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="163" y="200" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Translation into English</text><rect x="46" y="226" width="234" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="163" y="254" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Reading comprehension</text><rect x="46" y="280" width="234" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="163" y="308" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Writing: research question</text><rect x="317" y="110" width="266" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2</text><text x="450" y="300" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">literary texts and films</text><rect x="333" y="172" width="234" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="200" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Translation into Urdu</text><rect x="333" y="226" width="234" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="254" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Written response to works</text><rect x="604" y="110" width="266" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="737" y="148" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 3</text><rect x="620" y="172" width="234" height="44" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="737" y="200" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Listening</text><rect x="620" y="226" width="234" height="44" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="737" y="254" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Reading</text><rect x="620" y="280" width="234" height="44" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="737" y="308" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Writing</text><text x="450" y="384" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Paper 3 has no translation; it integrates listening with reading and writing</text><rect x="30" y="410" width="410" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="446" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Strong at translation</text><text x="52" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in Papers 1 and 2 ...</text><rect x="460" y="410" width="410" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="446" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">... is not automatically strong</text><text x="482" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">at understanding spoken Urdu,</text><text x="482" y="499" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">which needs a different</text><text x="482" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">processing speed and skill</text><line x1="440" y1="470" x2="458" y2="470" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>