<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 3 at a glance</text>

<rect x="30" y="110" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="154" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 3 (9UR0/03)</text><text x="846" y="154" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="end">2 hours 15 minutes  ·  60 marks</text><text x="54" y="222" font-size="17" font-weight="600" fill="#4a5568" text-anchor="start">Recommended time</text><rect x="30" y="236" width="280" height="64" rx="10" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="170" y="276" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">45 min</text><rect x="316" y="236" width="554" height="64" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="593" y="276" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1 hour 30 minutes</text><text x="54" y="340" font-size="17" font-weight="600" fill="#4a5568" text-anchor="start">Marks</text><rect x="30" y="354" width="417" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="238" y="389" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">30 marks</text><rect x="453" y="354" width="417" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="661" y="389" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">30 marks</text><rect x="30" y="430" width="410" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="466" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Section A</text><text x="50" y="492" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Listening Comprehension</text><text x="50" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">understand spoken Urdu and answer</text><text x="50" y="550" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">questions on what was heard</text><text x="50" y="572" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">no translation or extended writing</text><text x="50" y="594" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">students may stop and replay</text><rect x="460" y="430" width="410" height="210" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="466" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Section B</text><text x="480" y="492" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Listening, Reading and Writing</text><text x="480" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">three skills combined in</text><text x="480" y="550" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one section</text><text x="480" y="572" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the longer, more demanding</text><text x="480" y="594" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">section: give it matching practice</text><text x="450" y="680" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Equal marks, unequal time: plan practice to match</text>
</svg>