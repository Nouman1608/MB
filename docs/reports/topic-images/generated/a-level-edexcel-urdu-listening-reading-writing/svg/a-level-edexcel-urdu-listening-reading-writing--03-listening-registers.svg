<defs><linearGradient id="reg" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="176" width="780" height="40" rx="20" fill="url(#reg)" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Formal, news-style Urdu</text><text x="840" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">Conversational spoken Urdu</text><text x="450" y="122" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Practise across speed and register, not one course voice</text><circle cx="150" cy="196" r="9" fill="#1e2a44"/><rect x="30" y="270" width="240" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="150" y="304" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">News broadcasts</text><path d="M150,206 V266" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5"/><circle cx="450" cy="196" r="9" fill="#1e2a44"/><rect x="330" y="270" width="240" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="304" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Interviews</text><path d="M450,206 V266" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5"/><circle cx="750" cy="196" r="9" fill="#1e2a44"/><rect x="630" y="270" width="240" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="750" y="304" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Spoken narrative</text><path d="M750,206 V266" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5"/><rect x="30" y="350" width="840" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="54" y="386" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Read the question before the audio plays</text><text x="54" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wherever the format allows: you then know what specific information to listen for</text>
