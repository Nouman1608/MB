<rect width="900" height="516" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Replaying without losing time</text>

<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Section A: students "may stop, revisit and replay sections of the recording"</text><rect x="30" y="150" width="260" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="198" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Missed a detail?</text><text x="160" y="228" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">note roughly where it fell</text><line x1="292" y1="210" x2="318" y2="210" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="150" width="260" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="198" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Keep going</text><text x="450" y="228" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">finish the passage</text><line x1="582" y1="210" x2="608" y2="210" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="150" width="260" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="198" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Go back</text><text x="740" y="228" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">replay just that section</text><rect x="30" y="290" width="840" height="70" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><circle cx="66" cy="325" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,319 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="96" y="332" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Replaying whole passages from the start: every replay uses time</text><rect x="30" y="380" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="422" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Rehearse with audio you can pause and replay, inside a 45-minute limit</text><text x="450" y="490" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Then practise full timed sittings: 2 hours 15 minutes across both sections</text>
</svg>