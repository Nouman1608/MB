<rect width="900" height="494" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section B: from source to answer</text>

<rect x="30" y="130" width="192" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="160" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="166.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="126" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Listen or read</text><text x="126" y="234" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">the source</text><line x1="224" y1="195" x2="244" y2="195" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="246" y="130" width="192" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="276" cy="160" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="276" y="166.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="342" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Take accurate</text><text x="342" y="234" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">notes</text><line x1="440" y1="195" x2="460" y2="195" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="462" y="130" width="192" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="492" cy="160" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="166.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="558" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Use the notes</text><text x="558" y="234" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">to build the answer</text><line x1="656" y1="195" x2="676" y2="195" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="678" y="130" width="192" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="708" cy="160" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="708" y="166.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="774" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Write the</text><text x="774" y="234" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">response</text><path d="M222,278 V300 H654 V278" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="438" y="326" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">one connected skill, not two disconnected stages</text><rect x="30" y="356" width="840" height="110" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="392" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Common trap</text><text x="54" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">spending most revision on Section A and treating Section B as an afterthought</text><text x="54" y="446" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">leaves half the marks under-practised in the longest section</text>
</svg>