<rect x="30" y="112" width="840" height="74" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Global political challenges: 80 hours, HL only</text><text x="450" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">independent research into cases the student selects</text><text x="450" y="226" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Eight topic areas set by the syllabus</text><rect x="50" y="246" width="185" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="142.5" y="274.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">borders</text><rect x="255" y="246" width="185" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="347.5" y="274.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">environment</text><rect x="460" y="246" width="185" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="552.5" y="274.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">equality</text><rect x="665" y="246" width="185" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="757.5" y="274.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">health</text><rect x="50" y="302" width="185" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="142.5" y="330.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">identity</text><rect x="255" y="302" width="185" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="347.5" y="330.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">poverty</text><rect x="460" y="302" width="185" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="552.5" y="330.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">security</text><rect x="665" y="302" width="185" height="44" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="757.5" y="330.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">technology</text><rect x="30" y="376" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="412" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Minimum requirement</text><text x="52" y="444" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">at least 2 case studies, across at least 2 different topic areas</text><line x1="450" y1="472" x2="450" y2="524" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="230" y="530" width="440" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="566" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 3 (HL only)</text><text x="450" y="594" font-size="18" font-weight="600" fill="#8a6d0d" text-anchor="middle">30% of the HL grade</text><text x="450" y="648" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Organised by topic area and your own cases, not by the three thematic studies.</text>
