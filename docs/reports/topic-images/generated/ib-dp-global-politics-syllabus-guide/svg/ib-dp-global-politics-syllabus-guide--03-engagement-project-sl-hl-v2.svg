32" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Task</text><text x="504" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the same written report</text><rect x="488" y="286" width="364" height="70" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="504" y="314" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Word limit</text><text x="504" y="340" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2,000 + 400 (recommendation)</text><rect x="488" y="368" width="364" height="70" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="6 4"/><text x="504" y="396" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Criteria</text><text x="504" y="422" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A to E, plus F: Recommendation (6)</text><rect x="488" y="450" width="364" height="70" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" stroke-dasharray="6 4"/><text x="504" y="478" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Extra task</text><text x="504" y="504" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">further research + a recommendation</text><rect x="30" y="566" width="840" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="595" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Only the first 2,000 words of the report are assessed if it runs over.</text><text x="450" y="619" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Choose a specific, well-scoped issue early that you can engage with directly.</text>
