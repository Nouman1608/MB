<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One toolkit, three compulsory studies</text>

<rect x="30" y="112" width="840" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="144" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Understanding power and global politics: a toolkit of four concepts</text><rect x="50" y="166" width="188" height="48" rx="9" fill="#fff" stroke="#2e6b62" stroke-width="2"/><text x="144" y="196.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">power</text><rect x="254" y="166" width="188" height="48" rx="9" fill="#fff" stroke="#2e6b62" stroke-width="2"/><text x="348" y="196.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">sovereignty</text><rect x="458" y="166" width="188" height="48" rx="9" fill="#fff" stroke="#2e6b62" stroke-width="2"/><text x="552" y="196.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">legitimacy</text><rect x="662" y="166" width="188" height="48" rx="9" fill="#fff" stroke="#2e6b62" stroke-width="2"/><text x="756" y="196.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">interdependence</text><line x1="163" y1="244" x2="163" y2="296" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="30" y="302" width="266" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="163" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Rights and justice</text><text x="163" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">how rights are claimed,</text><text x="163" y="402" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">contested and enforced</text><text x="163" y="424" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(or denied)</text><rect x="80" y="466" width="166" height="32" rx="9" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="163" y="487.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">compulsory</text><line x1="450" y1="244" x2="450" y2="296" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="317" y="302" width="266" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Development and</text><text x="450" y="364" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">sustainability</text><text x="450" y="400" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">how development is pursued</text><text x="450" y="422" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and measured, and its tensions</text><text x="450" y="444" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">with sustainability</text><rect x="367" y="466" width="166" height="32" rx="9" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="450" y="487.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">compulsory</text><line x1="737" y1="244" x2="737" y2="296" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="604" y="302" width="266" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="737" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Peace and conflict</text><text x="737" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the causes, dynamics and</text><text x="737" y="402" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">resolution of political</text><text x="737" y="424" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">conflict</text><rect x="654" y="466" width="166" height="32" rx="9" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="737" y="487.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">compulsory</text><text x="450" y="548" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Name which concept a real case illustrates inside every thematic-study answer.</text><text x="450" y="574" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Keep a running case-study log for each theme through the course.</text>
</svg>