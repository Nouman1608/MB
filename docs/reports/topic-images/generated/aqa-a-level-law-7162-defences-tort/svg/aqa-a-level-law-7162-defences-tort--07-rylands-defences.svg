<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Defences to Rylands v Fletcher</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="409" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="204.87804878048783" height="48" fill="#b5d3cf"/><text x="44" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Defence</text><rect x="234.87804878048783" y="100" width="286.82926829268297" height="48" fill="#b5d3cf"/><text x="248.87804878048783" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rule</text><rect x="521.7073170731708" y="100" width="348.2926829268293" height="48" fill="#b5d3cf"/><text x="535.7073170731708" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Authority</text><rect x="30" y="148" width="204.87804878048783" height="89" fill="#dce9e7"/><text x="44" y="174.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Act of God</text><rect x="234.87804878048783" y="148" width="286.82926829268297" height="89" fill="#ffffff"/><text x="248.87804878048783" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Natural forces no human could</text><text x="248.87804878048783" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foresee or guard against</text><rect x="521.7073170731708" y="148" width="348.2926829268293" height="89" fill="#ffffff"/><text x="535.7073170731708" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Nichols</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Marsland</tspan> (1876): extraordinary</text><text x="535.7073170731708" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rainfall. Contrast <tspan font-style="italic">Greenock</tspan> <tspan font-style="italic">Corporation</tspan></text><text x="535.7073170731708" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1917): heavy rain not enough</text><line x1="30" y1="237" x2="870" y2="237" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="237" width="204.87804878048783" height="89" fill="#dce9e7"/><text x="44" y="263.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Act of a stranger</text><rect x="234.87804878048783" y="237" width="286.82926829268297" height="89" fill="#f8faf9"/><text x="248.87804878048783" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unforeseeable act of a third party</text><text x="248.87804878048783" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outside the defendant’s control</text><rect x="521.7073170731708" y="237" width="348.2926829268293" height="89" fill="#f8faf9"/><text x="535.7073170731708" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Rickards</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lothian</tspan> (1913): tap turned on;</text><text x="535.7073170731708" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Perry</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Kendricks</tspan> <tspan font-style="italic">Transport</tspan> (1956): lit</text><text x="535.7073170731708" y="305.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">match in a petrol tank</text><line x1="30" y1="326" x2="870" y2="326" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="326" width="204.87804878048783" height="68" fill="#dce9e7"/><text x="44" y="352.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Consent / common</text><text x="44" y="373.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">benefit</text><rect x="234.87804878048783" y="326" width="286.82926829268297" height="68" fill="#ffffff"/><text x="248.87804878048783" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The claimant agreed to the</text><text x="248.87804878048783" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accumulation</text><rect x="521.7073170731708" y="326" width="348.2926829268293" height="68" fill="#ffffff"/><text x="535.7073170731708" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Peters</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Prince</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Wales</tspan> <tspan font-style="italic">Theatre</tspan> (1943):</text><text x="535.7073170731708" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sprinkler system</text><line x1="30" y1="394" x2="870" y2="394" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="394" width="204.87804878048783" height="47" fill="#dce9e7"/><text x="44" y="420.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Statutory authority</text><rect x="234.87804878048783" y="394" width="286.82926829268297" height="47" fill="#f8faf9"/><text x="248.87804878048783" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Accumulation required by statute</text><rect x="521.7073170731708" y="394" width="348.2926829268293" height="47" fill="#f8faf9"/><text x="535.7073170731708" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Green</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Chelsea</tspan> <tspan font-style="italic">Waterworks</tspan> (1894)</text><line x1="30" y1="441" x2="870" y2="441" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="441" width="204.87804878048783" height="68" fill="#dce9e7"/><text x="44" y="467.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Default of the</text><text x="44" y="488.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">claimant</text><rect x="234.87804878048783" y="441" width="286.82926829268297" height="68" fill="#ffffff"/><text x="248.87804878048783" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Damage caused by the claimant’s</text><text x="248.87804878048783" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">own act</text><rect x="521.7073170731708" y="441" width="348.2926829268293" height="68" fill="#ffffff"/><text x="535.7073170731708" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ponting</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Noakes</tspan> (1894)</text></g><line x1="234.87804878048783" y1="100" x2="234.87804878048783" y2="509" stroke="#c9d6d4" stroke-width="1.5"/><line x1="521.7073170731708" y1="100" x2="521.7073170731708" y2="509" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="409" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="531" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="564.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A contractor is under the defendant’s control, so a contractor’s act is <tspan font-weight="700" fill="#1e2a44">not</tspan> an act of a stranger.</text>
</svg>