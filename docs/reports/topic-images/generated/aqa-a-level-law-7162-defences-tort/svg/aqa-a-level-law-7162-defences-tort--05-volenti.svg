<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Consent (volenti): why it usually fails</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Needs full knowledge of the risk and a voluntary agreement to it</text>
<rect x="30" y="124" width="272" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">KNOWLEDGE IS NOT CONSENT</text><text x="44" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Smith v Baker (1891)</text><text x="44" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Quarry worker knew of the crane</text><text x="44" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">but had no real choice</text><rect x="314" y="124" width="272" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="328" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PASSENGERS</text><text x="328" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dann v Hamilton (1939)</text><text x="328" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Not volenti; s149 Road Traffic Act</text><text x="328" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1988 now bars the defence where</text><text x="328" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">insurance is compulsory</text><rect x="598" y="124" width="272" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INSTRUCTORS</text><text x="612" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nettleship v Weston (1971)</text><text x="612" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Asked about insurance: no waiver</text><text x="612" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of his claim</text><rect x="30" y="278" width="272" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="304" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESCUERS</text><text x="44" y="329.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Haynes v Harwood; Baker v</text><text x="44" y="350.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">TE Hopkins</text><text x="44" y="377" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Acting under a moral or legal</text><text x="44" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">duty: no consent</text><rect x="314" y="278" width="272" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="328" y="304" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CUSTODY</text><text x="328" y="329.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reeves v Commissioner of</text><text x="328" y="350.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Police (2000)</text><text x="328" y="377" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Duty to prevent the very act that</text><text x="328" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">occurred</text><rect x="598" y="278" width="272" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="304" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOTICES</text><text x="612" y="329.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">UCTA 1977 s2(3)</text><text x="612" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Awareness of a notice is not of</text><text x="612" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">itself acceptance of the risk</text><rect x="30" y="437" width="272" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="463" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUCCEEDS</text><text x="44" y="488.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ICI v Shatwell (1965)</text><text x="44" y="515" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Experienced shotfirers broke</text><text x="44" y="535" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">safety rules to save time</text><rect x="314" y="437" width="272" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="328" y="463" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUCCEEDS</text><text x="328" y="488.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Morris v Murray (1991)</text><text x="328" y="515" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Flight with a pilot who had drunk</text><text x="328" y="535" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">about 17 whiskies</text><rect x="598" y="437" width="272" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="612" y="463" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPORT</text><text x="612" y="488.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Condon v Basi (1985)</text><text x="612" y="515" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Inherent risks only; a reckless</text><text x="612" y="535" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sliding tackle was not consented</text><text x="612" y="555" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">to</text>
</svg>