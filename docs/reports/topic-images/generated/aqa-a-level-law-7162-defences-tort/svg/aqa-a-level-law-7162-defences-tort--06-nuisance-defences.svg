<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="482" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Private nuisance: defences and non-defences</text>

<rect x="30" y="100" width="412" height="175" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFENCE</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Prescription</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">20 years of actionable nuisance without</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">objection. <tspan font-style="italic">Sturges</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bridgman</tspan> (1879): time ran</text><text x="50" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">only from when the consulting room was built, so</text><text x="50" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it failed</text><rect x="458" y="100" width="412" height="175" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFENCE</text><text x="478" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Statutory authority</text><text x="478" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The nuisance is the inevitable result of what a</text><text x="478" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">statute authorised. <tspan font-style="italic">Allen</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Gulf</tspan> <tspan font-style="italic">Oil</tspan> <tspan font-style="italic">Refining</tspan></text><text x="478" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1981)</text><rect x="30" y="297" width="272" height="153" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="329" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT A DEFENCE</text><text x="50" y="355.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Coming to the nuisance</text><text x="50" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Bliss</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hall</tspan> (1838); <tspan font-style="italic">Miller</tspan> <tspan font-style="italic">v</tspan></text><text x="50" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Jackson</tspan> (1977); <tspan font-style="italic">Coventry</tspan> <tspan font-style="italic">v</tspan></text><text x="50" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Lawrence</tspan> (2014)</text><rect x="314" y="297" width="272" height="153" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="334" y="329" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT A DEFENCE</text><text x="334" y="355.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Public benefit</text><text x="334" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Adams</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ursell</tspan> (1913): fish</text><text x="334" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and chip shop; may affect the</text><text x="334" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">remedy, not liability</text><rect x="598" y="297" width="272" height="153" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="329" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT A DEFENCE</text><text x="618" y="355.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Planning permission</text><text x="618" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Wheeler</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">JJ</tspan> <tspan font-style="italic">Saunders</tspan></text><text x="618" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1996), though it may change</text><text x="618" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the locality</text>
</svg>