<rect width="900" height="408" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked apportionment: Naz</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Hit by a speeding driver while cycling without lights at dusk</text>
<text x="40" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Full damages assessed: £40,000 (invented figure)</text><rect x="40" y="154" width="820" height="60" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="696" y="154" width="164" height="60" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="368" y="191" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Damages awarded: £32,000</text><text x="778" y="182" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Naz’s 20%</text><text x="778" y="202" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">£8,000</text><rect x="30" y="242" width="253.33333333333334" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="285" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 1</text><text x="50" y="311.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Full damages</text><text x="50" y="340.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">£40,000</text><line x1="289.33333333333337" y1="309" x2="317.33333333333337" y2="309" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="242" width="253.33333333333334" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.33333333333337" y="285" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 2</text><text x="343.33333333333337" y="311.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Claimant’s share</text><text x="343.33333333333337" y="340.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">20% of £40,000 = £8,000</text><line x1="582.6666666666667" y1="309" x2="610.6666666666667" y2="309" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="242" width="253.33333333333334" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="274" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 3</text><text x="636.6666666666667" y="300.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Damages awarded</text><text x="636.6666666666667" y="329.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">£40,000 − £8,000 =</text><text x="636.6666666666667" y="351.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">£32,000</text>
</svg>