<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How much are damages reduced?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Reductions in decided cases, by the claimant’s share of responsibility</text>
<text x="40" y="142" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Froom v Butcher: belt would have prevented injury</text><rect x="40" y="152" width="820" height="26" rx="6" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="40" y="152" width="683.3333333333333" height="26" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="733.3333333333333" y="171" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">25%</text><text x="40" y="208" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Froom v Butcher: belt would have made it less severe</text><rect x="40" y="218" width="820" height="26" rx="6" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="40" y="218" width="410" height="26" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="460" y="237" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">15%</text><text x="40" y="274" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">O’Connell v Jackson: no crash helmet</text><rect x="40" y="284" width="820" height="26" rx="6" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="40" y="284" width="410" height="26" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="460" y="303" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">15%</text><text x="40" y="340" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Owens v Brimmell: knew the driver had been drinking</text><rect x="40" y="350" width="820" height="26" rx="6" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="40" y="350" width="546.6666666666666" height="26" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="596.6666666666666" y="369" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">20%</text><text x="40" y="406" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Sayers v Harlow UDC: climbed out of a locked cubicle</text><rect x="40" y="416" width="820" height="26" rx="6" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="40" y="416" width="683.3333333333333" height="26" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="733.3333333333333" y="435" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">25%</text><text x="40" y="472" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Jones v Livox Quarries: rode on the vehicle against instructions</text><rect x="40" y="482" width="820" height="26" rx="6" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="40" y="482" width="546.6666666666666" height="26" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="596.6666666666666" y="501" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">one fifth</text><line x1="40" y1="516" x2="40" y2="524" stroke="#1e2a44" stroke-width="2"/><text x="40" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">0%</text><line x1="313.3333333333333" y1="516" x2="313.3333333333333" y2="524" stroke="#1e2a44" stroke-width="2"/><text x="313.3333333333333" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10%</text><line x1="586.6666666666666" y1="516" x2="586.6666666666666" y2="524" stroke="#1e2a44" stroke-width="2"/><text x="586.6666666666666" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">20%</text><line x1="860" y1="516" x2="860" y2="524" stroke="#1e2a44" stroke-width="2"/><text x="860" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">30%</text><line x1="40" y1="520" x2="860" y2="520" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="570" width="840" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="602.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Froom guidance: no reduction if a seat belt would have made no difference. A <tspan font-weight="700" fill="#1e2a44">100%</tspan> reduction is</text><text x="50" y="623.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">impossible: both parties share responsibility (<tspan font-style="italic">Pitts</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hunt</tspan>, 1990).</text>
</svg>