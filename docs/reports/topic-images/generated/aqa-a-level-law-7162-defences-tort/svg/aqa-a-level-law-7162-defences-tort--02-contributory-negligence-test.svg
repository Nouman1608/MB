<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554" width="900" height="554" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="554" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Contributory negligence: what must be shown</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">1945 Act, s1(1): damages reduced, claim not defeated</text>
<rect x="30" y="124" width="412" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Claimant failed to take reasonable care</text><text x="50" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">for their own safety</text><text x="50" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An objective standard</text><rect x="458" y="124" width="412" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="478" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The failure contributed to the damage</text><text x="478" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not necessarily to the accident. <tspan font-style="italic">Froom</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Butcher</tspan></text><text x="478" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1976): no seat belt did not cause the crash but</text><text x="478" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">made the injuries worse</text><text x="450" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The standard is adjusted for</text><rect x="30" y="342" width="412" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="374" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHILDREN</text><text x="50" y="400.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A reasonable child of the same age</text><text x="50" y="428.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Gough</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Thorne</tspan> (1966): 13-year-old waved</text><text x="65.2" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">across by a lorry driver, not at fault</text><text x="50" y="476.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="476.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Yachuk</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Oliver</tspan> <tspan font-style="italic">Blais</tspan> (1949): nine-year-old</text><text x="65.2" y="497.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">could not appreciate petrol’s danger</text><rect x="458" y="342" width="412" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="374" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EMERGENCIES</text><text x="478" y="400.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A reasonable choice in the agony of the</text><text x="478" y="423.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">moment</text><text x="478" y="451.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Jones</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Boyce</tspan> (1816): passenger jumped from</text><text x="493.2" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a coach he feared would overturn; it stayed</text><text x="493.2" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">upright, but he was not at fault</text>
</svg>