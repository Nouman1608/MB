<rect width="900" height="589" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where defences fit in an answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The defendant proves it, on the balance of probabilities</text>
<rect x="30" y="124" width="250.66666666666666" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155.33333333333331" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FIRST</text><text x="155.33333333333331" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Claimant establishes</text><text x="155.33333333333331" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">the tort</text><line x1="286.66666666666663" y1="178" x2="318.66666666666663" y2="178" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="124" width="250.66666666666666" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="449.99999999999994" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THEN</text><text x="449.99999999999994" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Defendant proves a</text><text x="449.99999999999994" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">defence</text><line x1="581.3333333333333" y1="178" x2="613.3333333333333" y2="178" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="124" width="250.66666666666666" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="744.6666666666666" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RESULT</text><text x="744.6666666666666" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Damages: full,</text><text x="744.6666666666666" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">reduced or none</text><clipPath id="tc254"><rect x="30" y="254" width="840" height="192" rx="14"/></clipPath><g clip-path="url(#tc254)"><rect x="30" y="254" width="303.3333333333333" height="48" fill="#b5d3cf"/><text x="44" y="281.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Defence</text><rect x="333.3333333333333" y="254" width="303.3333333333333" height="48" fill="#b5d3cf"/><text x="347.3333333333333" y="281.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Effect</text><rect x="636.6666666666666" y="254" width="233.33333333333331" height="48" fill="#b5d3cf"/><text x="650.6666666666666" y="281.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Usual outcome</text><rect x="30" y="302" width="303.3333333333333" height="48" fill="#dce9e7"/><text x="44" y="329.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Contributory negligence</text><rect x="333.3333333333333" y="302" width="303.3333333333333" height="48" fill="#ffffff"/><text x="347.3333333333333" y="329.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Partial: damages reduced</text><rect x="636.6666666666666" y="302" width="233.33333333333331" height="48" fill="#ffffff"/><text x="650.6666666666666" y="329.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Common</text><line x1="30" y1="350" x2="870" y2="350" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="350" width="303.3333333333333" height="48" fill="#dce9e7"/><text x="44" y="377.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Consent (volenti)</text><rect x="333.3333333333333" y="350" width="303.3333333333333" height="48" fill="#f8faf9"/><text x="347.3333333333333" y="377.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Complete: no damages</text><rect x="636.6666666666666" y="350" width="233.33333333333331" height="48" fill="#f8faf9"/><text x="650.6666666666666" y="377.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rare</text><line x1="30" y1="398" x2="870" y2="398" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="398" width="303.3333333333333" height="48" fill="#dce9e7"/><text x="44" y="425.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nuisance and <tspan font-style="italic">Rylands</tspan> defences</text><rect x="333.3333333333333" y="398" width="303.3333333333333" height="48" fill="#ffffff"/><text x="347.3333333333333" y="425.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Complete</text><rect x="636.6666666666666" y="398" width="233.33333333333331" height="48" fill="#ffffff"/><text x="650.6666666666666" y="425.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Depend on facts</text></g><line x1="333.3333333333333" y1="254" x2="333.3333333333333" y2="446" stroke="#c9d6d4" stroke-width="1.5"/><line x1="636.6666666666666" y1="254" x2="636.6666666666666" y2="446" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="254" width="840" height="192" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="468" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="502.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">If both are arguable</text><text x="50" y="532.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Discuss <tspan font-weight="700" fill="#1e2a44">consent</tspan> <tspan font-weight="700" fill="#1e2a44">first</tspan> and explain why it is likely to fail, then apply <tspan font-weight="700" fill="#1e2a44">contributory</tspan> <tspan font-weight="700" fill="#1e2a44">negligence</tspan>.</text>
</svg>