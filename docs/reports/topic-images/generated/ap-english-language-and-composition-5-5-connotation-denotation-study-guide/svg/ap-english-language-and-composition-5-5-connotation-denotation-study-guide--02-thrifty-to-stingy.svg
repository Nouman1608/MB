<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same meaning, different attitude</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Denotation: careful with money</text>
<rect x="30" y="132" width="160" height="60" rx="30" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="110" y="169" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">thrifty</text><text x="110" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">admiring: wise,</text><text x="110" y="237.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">responsible</text><rect x="200" y="132" width="160" height="60" rx="30" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="280" y="169" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">frugal</text><text x="280" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">neutral to admiring:</text><text x="280" y="237.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">disciplined</text><rect x="370" y="132" width="160" height="60" rx="30" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="169" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">economical</text><text x="450" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">neutral: practical</text><rect x="540" y="132" width="160" height="60" rx="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="620" y="169" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">cheap</text><text x="620" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">critical: unwilling to</text><text x="620" y="237.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">pay fairly</text><rect x="710" y="132" width="160" height="60" rx="30" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2.5" /><text x="790" y="169" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">stingy</text><text x="790" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">strongly critical:</text><text x="790" y="237.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">mean</text><line x1="40" y1="272" x2="860" y2="272" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="860" y1="272" x2="40" y2="272" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="40" y="300" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">invites the reader to admire</text><text x="860" y="300" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end" xml:space="preserve">invites the reader to disapprove</text><rect x="30" y="332" width="840" height="43.120000000000005" fill="#dce9e7"/><text x="42" y="357.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Neutral</text><text x="322" y="357.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Positive</text><text x="602" y="357.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Negative</text><rect x="30" y="375.12" width="840" height="43.120000000000005" fill="#ffffff"/><text x="42" y="400.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">walk</text><rect x="310" y="375.12" width="280" height="43.120000000000005" fill="#dce9e7"/><text x="322" y="400.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">stroll</text><rect x="590" y="375.12" width="280" height="43.120000000000005" fill="#fbf3ee"/><text x="602" y="400.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">trudge</text><line x1="30" y1="375.12" x2="870" y2="375.12" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="418.24" width="840" height="43.120000000000005" fill="#ffffff"/><text x="42" y="443.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">determined</text><rect x="310" y="418.24" width="280" height="43.120000000000005" fill="#dce9e7"/><text x="322" y="443.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">resolute</text><rect x="590" y="418.24" width="280" height="43.120000000000005" fill="#fbf3ee"/><text x="602" y="443.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">stubborn</text><line x1="30" y1="418.24" x2="870" y2="418.24" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="461.36" width="840" height="43.120000000000005" fill="#ffffff"/><text x="42" y="486.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">unusual</text><rect x="310" y="461.36" width="280" height="43.120000000000005" fill="#dce9e7"/><text x="322" y="486.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">distinctive</text><rect x="590" y="461.36" width="280" height="43.120000000000005" fill="#fbf3ee"/><text x="602" y="486.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">peculiar</text><line x1="30" y1="461.36" x2="870" y2="461.36" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="504.48" width="840" height="43.120000000000005" fill="#ffffff"/><text x="42" y="529.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">crowd</text><rect x="310" y="504.48" width="280" height="43.120000000000005" fill="#dce9e7"/><text x="322" y="529.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">gathering</text><rect x="590" y="504.48" width="280" height="43.120000000000005" fill="#fbf3ee"/><text x="602" y="529.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">mob</text><line x1="30" y1="504.48" x2="870" y2="504.48" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="547.6" width="840" height="43.120000000000005" fill="#ffffff"/><text x="42" y="572.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">old</text><rect x="310" y="547.6" width="280" height="43.120000000000005" fill="#dce9e7"/><text x="322" y="572.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">seasoned</text><rect x="590" y="547.6" width="280" height="43.120000000000005" fill="#fbf3ee"/><text x="602" y="572.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">outdated</text><line x1="30" y1="547.6" x2="870" y2="547.6" stroke="#c9d6d4" stroke-width="1.5"/><line x1="310" y1="332" x2="310" y2="590.72" stroke="#c9d6d4" stroke-width="1.5"/><line x1="590" y1="332" x2="590" y2="590.72" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="332" width="840" height="258.72" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="620.72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Connotation also depends on context, audience and culture: “ambitious” praises in a job reference, criticises a</text><text x="450" y="640.52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">friend who steps on others.</text>
</svg>