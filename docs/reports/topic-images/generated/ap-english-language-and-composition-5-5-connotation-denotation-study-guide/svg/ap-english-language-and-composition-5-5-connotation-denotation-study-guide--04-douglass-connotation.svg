<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" width="900" height="558" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="558" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Turning flattering words against themselves</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Douglass, Rochester, 1852</text>
<rect x="30" y="122" width="840" height="82.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="156.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“To him, your celebration is a sham; your boasted liberty, an unholy license; your</text><text x="450" y="181.23000000000002" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">national greatness, swelling vanity.”</text><text x="200" y="232" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">FLATTERING (to his audience)</text><text x="500" y="232" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">HARSH</text><rect x="70" y="246" width="260" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="200" y="282.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">your celebration</text><line x1="334" y1="277" x2="380" y2="277" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="384" y="246" width="230" height="62" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="499" y="282.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">a</tspan> <tspan font-weight="700">sham</tspan></text><text x="634" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">a pretence</text><rect x="70" y="320" width="260" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="200" y="356.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">your boasted liberty</text><line x1="334" y1="351" x2="380" y2="351" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="384" y="320" width="230" height="62" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="499" y="356.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">an</tspan> <tspan font-weight="700">unholy</tspan> <tspan font-weight="700">license</tspan></text><text x="634" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">“boasted”: empty bragging;</text><text x="634" y="363.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">“unholy license”: excess and</text><text x="634" y="383.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">abuse of freedom</text><rect x="70" y="394" width="260" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="200" y="430.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">your national greatness</text><line x1="334" y1="425" x2="380" y2="425" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="384" y="394" width="230" height="62" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="499" y="430.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">swelling</tspan> <tspan font-weight="700">vanity</tspan></text><text x="634" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">“swelling”: inflation and rot, not</text><text x="634" y="437.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">strength</text><rect x="30" y="474" width="840" height="74.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="505.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Every key word’s connotation says the same thing: from the enslaved person’s view, the celebration is</text><text x="450" y="526.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">false.</text>
</svg>