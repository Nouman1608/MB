<text x="30" y="134" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Draft: suggests escape from a prison</text><rect x="30" y="150" width="102.21356999999999" height="37" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="81.106785" y="175.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Students</text><rect x="140.21357" y="150" width="90" height="37" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="185.21357" y="175.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">want</text><text x="185.21357" y="208.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">mere</text><text x="185.21357" y="226.8" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">desire</text><rect x="238.21357" y="150" width="38.14139" height="37" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="257.284265" y="175.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">to</text><rect x="284.35496" y="150" width="109.49361" height="37" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="339.101765" y="175.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">get out of</text><text x="339.101765" y="208.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">escape</text><rect x="401.84857" y="150" width="165.93349" height="37" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="484.815315" y="175.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">school at lunch.</text><text x="30" y="263.6" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Revision: students as responsible</text><rect x="30" y="279.6" width="102.21356999999999" height="37" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="81.106785" y="304.75" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Students</text><rect x="140.21357" y="279.6" width="100" height="37" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="190.21357" y="304.75" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">ask for</text><text x="190.21357" y="338.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">polite,</text><text x="190.21357" y="356.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">mature</text><rect x="248.21357" y="279.6" width="49.37457" height="37" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="272.900855" y="304.75" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the</text><rect x="305.58814" y="279.6" width="143.03659" height="37" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="377.10643500000003" y="304.75" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">responsibility</text><text x="377.10643500000003" y="338.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">privilege as</text><text x="377.10643500000003" y="356.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">obligation</text><rect x="456.62473" y="279.6" width="38.9829" height="37" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="476.11618" y="304.75" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">of</text><rect x="503.60763" y="279.6" width="203.35133" height="37" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="605.283295" y="304.75" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">leaving the grounds</text><text x="605.283295" y="338.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">neutral, exact</text><rect x="714.9589599999999" y="279.6" width="138.82904" height="37" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="784.37348" y="304.75" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">at lunchtime.</text><rect x="30" y="389.20000000000005" width="410" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="423.20000000000005" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Audience</text><text x="48" y="450.35" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">parents and teachers who may fear misbehaviour</text><rect x="460" y="389.20000000000005" width="410" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="478" y="423.20000000000005" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Earned?</text><text x="478" y="450.35" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“responsibility” needs evidence that older students</text><text x="478" y="470.15000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">already manage their time well</text>
