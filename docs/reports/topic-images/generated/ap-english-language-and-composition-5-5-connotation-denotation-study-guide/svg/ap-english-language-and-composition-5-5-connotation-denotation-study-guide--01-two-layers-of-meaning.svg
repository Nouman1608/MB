<rect width="900" height="462" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two layers of meaning</text>

<rect x="60" y="246" width="340" height="70" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="230" y="279" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">DENOTATION</text><text x="230" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">a place where a person lives</text><path d="M60,246 L90,156 L370,156 L400,246 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="230" y="188" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">CONNOTATION</text><text x="230" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">warmth, safety, belonging</text><text x="230" y="136" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">home</text><rect x="500" y="246" width="340" height="70" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="670" y="279" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">DENOTATION</text><text x="670" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">a place where a person lives</text><path d="M500,246 L530,156 L810,156 L840,246 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="670" y="188" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">CONNOTATION</text><text x="670" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">little of that feeling</text><text x="670" y="136" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">house</text><rect x="30" y="346" width="840" height="74.24000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="377.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Denotation:</tspan> the literal, dictionary meaning. <tspan font-weight="700">Connotation:</tspan> the feelings, associations and judgements a</text><text x="450" y="398.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">word carries beyond it. Choosing between words with the same denotation is choosing an attitude.</text>
</svg>