<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="448" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing word choice in four steps</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From connotation to tone and style</text>
<rect x="30" y="122" width="195" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="127.5" y="174.72" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Pick out</text><text x="127.5" y="200.82999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">significant words and</text><text x="127.5" y="220.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">phrases</text><circle cx="127" cy="122" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="127" y="127.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="227" y1="192" x2="243" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="245" y="122" width="195" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="342.5" y="154.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Name the</text><text x="342.5" y="178.16" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">connotation</text><text x="342.5" y="204.27" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">positive, negative or</text><text x="342.5" y="224.07000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">neutral, and what</text><text x="342.5" y="243.87" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">kind</text><circle cx="342" cy="122" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="342" y="127.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="442" y1="192" x2="458" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="122" width="195" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="557.5" y="174.72" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Compare</text><text x="557.5" y="200.82999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">with what the writer</text><text x="557.5" y="220.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">might have said</text><circle cx="557" cy="122" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="557" y="127.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="657" y1="192" x2="673" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="675" y="122" width="195" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="772.5" y="174.72" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Link</text><text x="772.5" y="200.82999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the choice to tone</text><text x="772.5" y="220.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and to purpose</text><circle cx="772" cy="122" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="772" y="127.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="292" width="408" height="125.75999999999999" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="48" y="326" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Tone</text><text x="48" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the writer’s attitude: “a gathering of residents”</text><text x="48" y="375.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">vs “a mob of agitators” for the same event</text><rect x="462" y="292" width="408" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="480" y="326" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Style</text><text x="480" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the overall pattern: formal “endeavour,</text><text x="480" y="375.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">commence” vs plain “try, start”, same</text><text x="480" y="396.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">denotations</text>
</svg>