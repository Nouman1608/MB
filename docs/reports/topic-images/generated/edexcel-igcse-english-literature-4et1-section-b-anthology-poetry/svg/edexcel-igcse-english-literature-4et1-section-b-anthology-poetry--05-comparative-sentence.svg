<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="516" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Inside a comparative sentence</text>

<rect x="240" y="120" width="630" height="52" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="256" y="150.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Where</text><text x="220" y="152" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">connective</text><rect x="240" y="182" width="630" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="256" y="212.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Shakespeare’s couplet stakes his whole credibility on love’s</text><text x="256" y="236.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">permanence,</text><text x="220" y="226" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">method in poem 1</text><rect x="240" y="268" width="630" height="52" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="256" y="298.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Rossetti’s sestet quietly reverses her own request,</text><text x="220" y="300" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">method in poem 2</text><rect x="240" y="330" width="630" height="76" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="256" y="360.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">so lasting love becomes not being remembered but wanting the</text><text x="256" y="384.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">beloved to be happy.</text><text x="220" y="374" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">difference in effect</text><line x1="232" y1="126" x2="232" y2="400" stroke="#c9d6d4" stroke-width="3"/><text x="30" y="438" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">More comparative connectives</text><rect x="30" y="450" width="131.66666666666666" height="42" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="95.83333333333333" y="475.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">whereas</text><rect x="171.66666666666666" y="450" width="131.66666666666666" height="42" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="237.5" y="475.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">similarly</text><rect x="313.3333333333333" y="450" width="131.66666666666666" height="42" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="379.16666666666663" y="475.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">in contrast</text><rect x="455" y="450" width="131.66666666666666" height="42" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="520.8333333333334" y="475.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">both</text><rect x="596.6666666666666" y="450" width="131.66666666666666" height="42" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="662.5" y="475.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">however</text><rect x="738.3333333333333" y="450" width="131.66666666666666" height="42" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="804.1666666666666" y="475.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">unlike</text>
</svg>