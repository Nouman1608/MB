<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing your own second poem</text>

<rect x="330" y="120" width="240" height="117" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">NAMED IN THE QUESTION</text><text x="450" y="181.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Piano</text><text x="450" y="212.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">memory</text><rect x="30" y="290" width="400" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="323" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OPTION</text><text x="50" y="350" font-size="20" font-weight="700" font-style="italic" fill="#1e2a44" text-anchor="start">Poem at Thirty-Nine</text><text x="50" y="379.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two adult speakers remembering a parent</text><rect x="470" y="290" width="400" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="323" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OPTION</text><text x="490" y="350" font-size="20" font-weight="700" font-style="italic" fill="#1e2a44" text-anchor="start">Half-past Two</text><text x="490" y="379.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Memories of childhood told through very</text><text x="490" y="401.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">different tones</text><path d="M400,248 C400,270 230,260 230,286" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M500,248 C500,270 670,260 670,286" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="30" y="460" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ask before you choose</text><rect x="40" y="480" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,501 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="476" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="504.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">At least three comparable points?</text><rect x="40" y="538" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,559 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="534" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="562.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Different enough in method (form, tone, voice)?</text><rect x="40" y="596" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,617 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="592" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="620.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Known well enough to find short quotations quickly?</text><rect x="30" y="656" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="689.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Choose in the first two minutes and do not change your mind.</text>
