 Tongue: layout,</text><text x="683" y="684" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">spelling or language</text><text x="683" y="704" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">as meaning</text><rect x="30" y="738" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="771.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Both are sonnets” is a start. How each poet uses the sonnet’s turn differently is</text><text x="50" y="793.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">comparison.</text>
