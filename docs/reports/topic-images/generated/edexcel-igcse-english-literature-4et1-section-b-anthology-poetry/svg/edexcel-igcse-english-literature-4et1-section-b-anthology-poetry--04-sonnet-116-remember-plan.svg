<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 798" width="900" height="798" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="798" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A plan built point by point</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Compare how the poets present lasting love in Sonnet 116 and Remember</text>
<rect x="30" y="140" width="840" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="173" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OVERVIEW</text><text x="50" y="203.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both poems imagine love tested by time and death, but Shakespeare defines love as</text><text x="50" y="225.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unchanging, while Rossetti’s speaker shows her love by letting go of the wish to be</text><text x="50" y="247.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">remembered.</text><text x="230" y="306" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">Sonnet 116</text><text x="670" y="306" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle" font-style="italic">Remember</text><circle cx="44" cy="330" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="44" y="335.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="68" y="336" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Constancy versus release</text><rect x="30" y="352" width="400" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="389.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Love as “an ever-fixed mark”: immovable</text><rect x="470" y="352" width="400" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pleads to be remembered, then gives that plea</text><text x="484" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">up</text><line x1="433" y1="385" x2="467" y2="385" stroke="#1e2a44" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/><circle cx="44" cy="448" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="44" y="453.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="68" y="454" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How each sonnet turns</text><rect x="30" y="470" width="400" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An argument ending in the couplet’s confident</text><text x="44" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">challenge</text><rect x="470" y="470" width="400" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The volta after line 8: from request to</text><text x="484" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">permission</text><line x1="433" y1="503" x2="467" y2="503" stroke="#1e2a44" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/><circle cx="44" cy="566" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="44" y="571.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="68" y="572" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Time and death</text><rect x="30" y="588" width="400" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="625.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Love outlasts time</text><rect x="470" y="588" width="400" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="614.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Accepts memory may fade; puts the beloved’s</text><text x="484" y="635.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">happiness first</text><line x1="433" y1="621" x2="467" y2="621" stroke="#1e2a44" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/><circle cx="44" cy="684" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="44" y="689.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="68" y="690" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Voice and the reader</text><rect x="30" y="706" width="400" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="743.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Addresses the world with certainty</text><rect x="470" y="706" width="400" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="732.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Addresses one person directly: intimate</text><text x="484" y="753.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">selflessness</text><line x1="433" y1="739" x2="467" y2="739" stroke="#1e2a44" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
</svg>