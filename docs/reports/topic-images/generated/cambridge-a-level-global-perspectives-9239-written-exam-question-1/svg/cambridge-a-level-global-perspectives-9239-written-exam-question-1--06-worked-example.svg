<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 736" width="900" height="736" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="736" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the worked example sources</text>

<rect x="30" y="110" width="840" height="44" rx="12" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.2"/><text x="52" y="139" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Source A (city council press release)</text><rect x="30" y="160" width="520" height="72.88" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Last summer, surface temperatures on our tree-lined</text><text x="48" y="210.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">avenues were up to 8 °C lower than on unshaded roads.</text><line x1="554" y1="196.44" x2="586" y2="196.44" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="590" y="164" width="280" height="64.88" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="730" y="202.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Claim of fact (evidence)</text><rect x="30" y="242.88" width="520" height="72.88" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="270.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">We will therefore plant 20,000 street trees by 2030.</text><line x1="554" y1="279.32" x2="586" y2="279.32" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="590" y="246.88" width="280" height="64.88" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="730" y="274.09999999999997" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Main conclusion; also a</text><text x="730" y="296.53999999999996" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">prediction / commitment</text><rect x="30" y="325.76" width="520" height="72.88" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="353.76" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Trees are the cheapest way to keep residents safe in</text><text x="48" y="376.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">heatwaves.</text><line x1="554" y1="362.2" x2="586" y2="362.2" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="590" y="329.76" width="280" height="64.88" rx="10" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="730" y="356.97999999999996" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Assertion: no evidence</text><text x="730" y="379.41999999999996" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">given</text><rect x="30" y="422.64" width="840" height="44" rx="12" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="2.2"/><text x="52" y="451.64" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Source B (letter from a residents’ group), in brief</text><rect x="30" y="472.64" width="840" height="93.32000000000001" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="499.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Trees planned mainly in the city centre; our district has the fewest trees and oldest</text><text x="48" y="522.08" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">housing but is not on the list; residents need cooling centres this summer, not promises for</text><text x="48" y="544.52" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">2030.</text><rect x="30" y="587.96" width="840" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="630.51" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Difference in perspective (Question c)</text><text x="48" y="658.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A judges the policy by its overall cooling effect across the city; B judges it by who benefits</text><text x="48" y="681.3900000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">first, shaped by fairness between districts and the urgency of this summer’s heat.</text>
</svg>