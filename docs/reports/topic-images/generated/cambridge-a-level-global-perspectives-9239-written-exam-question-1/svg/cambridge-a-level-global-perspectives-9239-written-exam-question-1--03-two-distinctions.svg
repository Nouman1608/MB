<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The two distinctions behind most errors</text>

<text x="30" y="132" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Argument or explanation? Both use “because”.</text><rect x="30" y="150" width="410" height="172" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="187" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Argument</text><text x="48" y="215.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">persuades you to accept a conclusion</text><text x="48" y="237.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="48" y="260.32" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Cities should plant more trees because</text><text x="48" y="282.76" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shade cools streets.”</text><rect x="460" y="150" width="410" height="172" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="187" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Explanation</text><text x="478" y="215.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">accounts for something already accepted as</text><text x="478" y="237.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">true</text><text x="478" y="260.32" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="478" y="282.76" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“The street is cooler because the trees</text><text x="478" y="305.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shade it.”</text><text x="450" y="352" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle" font-style="italic">Ask: is the writer trying to make me believe the final claim, or telling me why it is so?</text><text x="30" y="404" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Fact or claim of fact?</text><rect x="30" y="422" width="840" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="464" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“Air temperature in the park was 3 °C lower than on the main road.”</text><line x1="250" y1="496" x2="250" y2="528" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="650" y1="496" x2="650" y2="528" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="30" y="534" width="410" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="582.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Identify a fact?</text><text x="235" y="610.99" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">choose a checkable statement like this one</text><rect x="460" y="534" width="410" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="665" y="571.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Should you accept it?</text><text x="665" y="599.99" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">calling it a fact does not make it true:</text><text x="665" y="622.4300000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">that is evaluation</text>
</svg>