<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ten kinds of statement</text>

<rect x="30" y="110" width="410" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Fact</text><text x="48" y="165" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can be checked; true or false</text><rect x="48" y="178" width="374" height="32" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="60" y="200" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">dates, measured figures, named events</text><rect x="460" y="110" width="410" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Opinion</text><text x="478" y="165" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a view that cannot simply be checked</text><rect x="478" y="178" width="374" height="32" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="490" y="200" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“best”, “unfair”, “should”</text><rect x="30" y="234" width="410" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="264" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Argument</text><text x="48" y="289" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasons to support a conclusion</text><rect x="48" y="302" width="374" height="32" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="1.5"/><text x="60" y="324" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“because”, “therefore”, “so”</text><rect x="460" y="234" width="410" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="264" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Rant</text><text x="478" y="289" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">emotional, one-sided, little reasoning</text><rect x="478" y="302" width="374" height="32" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="490" y="324" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">exaggeration, insults, exclamation</text><rect x="30" y="358" width="410" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="388" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Speculation</text><text x="48" y="413" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a guess about something uncertain</text><rect x="48" y="426" width="374" height="32" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="60" y="448" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“perhaps”, “it may be that”</text><rect x="460" y="358" width="410" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="388" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Prediction</text><text x="478" y="413" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a claim about what will happen</text><rect x="478" y="426" width="374" height="32" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="490" y="448" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“will”, “by 2040”</text><rect x="30" y="482" width="410" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="512" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Explanation</text><text x="48" y="537" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">why something is the case</text><rect x="48" y="550" width="374" height="32" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="1.5"/><text x="60" y="572" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“this happened because”</text><rect x="460" y="482" width="410" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="512" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Hypothesis</text><text x="478" y="537" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a proposed explanation that could be tested</text><rect x="478" y="550" width="374" height="32" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="490" y="572" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“one possible reason is …”</text><rect x="30" y="606" width="410" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="636" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Account</text><text x="48" y="661" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a description of events, often first-hand</text><rect x="48" y="674" width="374" height="32" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="60" y="696" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“When I arrived, …”</text><rect x="460" y="606" width="410" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="636" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Belief</text><text x="478" y="661" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a view held as true, from values or faith</text><rect x="478" y="674" width="374" height="32" rx="8" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.5"/><text x="490" y="696" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">“I believe”, “it is wrong to”</text><text x="450" y="744" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Working definitions for study: the syllabus lists the terms without defining each.</text>
</svg>