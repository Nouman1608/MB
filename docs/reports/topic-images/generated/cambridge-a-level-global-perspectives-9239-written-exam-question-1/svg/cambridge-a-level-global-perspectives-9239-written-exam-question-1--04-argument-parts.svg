<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Locating the parts of an argument</text>

<rect x="290" y="110" width="320" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="154.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Main conclusion</text><text x="450" y="182.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the claim everything else supports</text><rect x="290" y="262" width="320" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="298.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Intermediate conclusion</text><text x="450" y="325.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">supported by reasons; often marked</text><text x="450" y="346.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">by “so”</text><line x1="450" y1="260" x2="450" y2="216" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="40" y="420" width="240" height="100" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="160" y="464.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reason</text><text x="160" y="491.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">“because”, “since”, “as”</text><rect x="330" y="420" width="240" height="100" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="456.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reason</text><text x="450" y="483.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a claim offered in</text><text x="450" y="504.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">support</text><rect x="620" y="420" width="240" height="100" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="740" y="456.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Supporting evidence</text><text x="740" y="483.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">figures, examples,</text><text x="740" y="504.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">sources</text><line x1="200" y1="418" x2="360" y2="372" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="418" x2="450" y2="372" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="700" y1="418" x2="540" y2="372" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="640" y="236" width="230" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="755" y="272" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Unstated assumption</text><text x="755" y="300" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a missing step; if false,</text><text x="755" y="321" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the argument breaks</text><line x1="638" y1="290" x2="612" y2="176" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><rect x="30" y="226" width="240" height="140" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="150" y="269.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Counter-assertion</text><text x="150" y="296.22" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">“Some say trees are too</text><text x="150" y="317.34000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">costly, but …”: raised to</text><text x="150" y="338.46000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">be answered</text><line x1="272" y1="290" x2="288" y2="180" stroke="#b5602e" stroke-width="3"/><rect x="30" y="544" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="574.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Find the main conclusion by asking “why should I believe this?” If the rest of the source answers,</text><text x="450" y="595.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">you have it. Identify: quote or closely paraphrase. Explain: add one sentence on how the part works.</text>
</svg>