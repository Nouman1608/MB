<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Match the command word</text>

<rect x="30" y="110" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="48" y="128" width="150" height="48" rx="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="123" y="159" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Identify</text><text x="222" y="146" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">name, select or recognise</text><text x="222" y="174" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">Use the source’s words: quote or closely paraphrase.</text><rect x="30" y="206" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="224" width="150" height="48" rx="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="123" y="255" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain</text><text x="222" y="242" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">set out reasons or make relationships evident</text><text x="222" y="270" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">Use your own words: one sentence on how it works.</text><rect x="30" y="302" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="320" width="150" height="48" rx="24" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="123" y="351" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Compare</text><text x="222" y="338" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">identify/comment on similarities and/or differences</text><text x="222" y="366" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">Both sources in the same sentence.</text><rect x="30" y="398" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="416" width="150" height="48" rx="24" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="123" y="447" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Contrast</text><text x="222" y="434" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">identify/comment on differences</text><text x="222" y="462" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">Both sources in the same sentence.</text><rect x="30" y="500" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="531.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Label every answer A or B when both sources are in play. Move on once each part has a precise</text><text x="450" y="553.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">answer.</text>
