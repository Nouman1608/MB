<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 659" width="900" height="659" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="659" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Relating the two sources precisely</text>

<rect x="270" y="115" width="360" height="76" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Point of comparison</text><text x="450" y="179.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">what both sources address</text><line x1="360" y1="193" x2="230" y2="236" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="540" y1="193" x2="670" y2="236" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="242" width="400" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="230" y="288.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Source A’s position</text><rect x="470" y="242" width="400" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="670" y="288.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Source B’s position</text><rect x="30" y="344" width="840" height="103.32000000000001" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="52" y="374" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Both sources accept that streets are hotter than parks (point of agreement), but Source A</text><text x="52" y="396.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">treats tree planting as the solution, while Source B argues that the cost falls unfairly on</text><text x="52" y="418.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">poorer districts (point of difference).”</text><rect x="30" y="467.32" width="410" height="129" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="503.37" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weaker</text><text x="48" y="531.8100000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Both are about cities.” (topic level)</text><rect x="460" y="467.32" width="410" height="129" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="503.37" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Stronger</text><text x="478" y="531.8100000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A specific, sourced similarity or</text><text x="478" y="554.2500000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">difference, with both sources in the same</text><text x="478" y="576.69" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sentence.</text><text x="450" y="630.3199999999999" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Compare: similarities and/or differences.   Contrast: differences.</text>
</svg>