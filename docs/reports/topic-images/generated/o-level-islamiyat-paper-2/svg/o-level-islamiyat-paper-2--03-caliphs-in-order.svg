<rect width="900" height="460" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four Rightly Guided Caliphs in order</text>

<rect x="30" y="120" width="190" height="250" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="125" cy="164" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="125" y="172.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="125" y="226" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Abu Bakr</text><text x="125" y="279.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Consolidating the</text><text x="125" y="301.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">community after the</text><text x="125" y="323.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Prophet's death</text><line x1="222" y1="245" x2="244" y2="245" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="246" y="120" width="190" height="250" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="341" cy="164" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="341" y="172.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="341" y="226" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Umar</text><text x="341" y="268.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Territorial</text><text x="341" y="290.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">expansion and</text><text x="341" y="312.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">administrative</text><text x="341" y="334.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">organisation</text><line x1="438" y1="245" x2="460" y2="245" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="462" y="120" width="190" height="250" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="557" cy="164" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="557" y="172.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="557" y="226" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Uthman</text><text x="557" y="279.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Standardising the</text><text x="557" y="301.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">compilation of the</text><text x="557" y="323.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Qur'an</text><line x1="654" y1="245" x2="676" y2="245" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="678" y="120" width="190" height="250" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="773" cy="164" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="773" y="172.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="773" y="226" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Ali</text><text x="773" y="279.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Leadership during a</text><text x="773" y="301.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">period of internal</text><text x="773" y="323.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">division</text><path d="M125,376 L125,404 L773,404 L773,376" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round"/><text x="450" y="436" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Compare leadership across the period, not one Caliph in isolation.</text>
</svg>