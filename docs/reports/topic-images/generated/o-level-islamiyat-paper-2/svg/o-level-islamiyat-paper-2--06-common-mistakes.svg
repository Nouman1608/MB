<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="542" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Common mistakes and their fixes</text>

<text x="245" y="132" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Avoid</text><text x="670" y="132" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Instead</text><rect x="30" y="148" width="400" height="82" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="230" y="183.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Listing the Articles or Pillars by</text><text x="230" y="206.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">name</text><line x1="434" y1="189" x2="464" y2="189" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="148" width="400" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="183.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Explain the meaning and</text><text x="670" y="206.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">significance of each</text><rect x="30" y="244" width="400" height="82" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="230" y="291.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Describing each Caliph in isolation</text><line x1="434" y1="285" x2="464" y2="285" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="244" width="400" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="279.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Compare their leadership across the</text><text x="670" y="302.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">period</text><rect x="30" y="340" width="400" height="82" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="230" y="375.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Treating Hadiths as equal in status</text><text x="230" y="398.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">to the Qur'an</text><line x1="434" y1="381" x2="464" y2="381" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="340" width="400" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="375.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Explain their distinct but</text><text x="670" y="398.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">complementary role</text><rect x="30" y="436" width="400" height="82" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="230" y="471.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Under-revising 2.4 because it feels</text><text x="230" y="494.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">familiar</text><line x1="434" y1="477" x2="464" y2="477" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="436" width="400" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="471.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Give it the same factual rigour as</text><text x="670" y="494.8" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">the rest</text>
</svg>