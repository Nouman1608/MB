<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="448" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Qur'an and the Hadiths</text>

<rect x="30" y="120" width="380" height="170" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><text x="220" y="162" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">The Qur'an</text><text x="220" y="194" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">first source</text><rect x="70" y="214" width="300" height="52" rx="12" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="220" y="247" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">sets out core principles</text><rect x="490" y="120" width="380" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="680" y="162" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">The Hadiths</text><text x="680" y="194" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">second source of guidance</text><rect x="510" y="214" width="340" height="52" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="680" y="247" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">give the practical detail</text><line x1="414" y1="205" x2="484" y2="205" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="190" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">lived out</text><rect x="30" y="314" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="350" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sayings, actions and approvals of the Prophet (pbuh)</text><text x="56" y="384" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Preserved through the isnad and checked by scholars for reliability:</text><text x="56" y="408" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">distinct from the Qur'an in status, but complementary.</text>
</svg>