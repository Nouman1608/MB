<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Belief and practice</text>

<rect x="30" y="110" width="840" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="148" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Six Articles of Faith</text><text x="844" y="148" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">core BELIEFS</text><rect x="56" y="168" width="250" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="181" y="204" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Allah</text><rect x="322" y="168" width="250" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="447" y="204" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">His angels</text><rect x="588" y="168" width="250" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="713" y="204" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">His revealed books</text><rect x="56" y="238" width="250" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="181" y="274" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">His prophets</text><rect x="322" y="238" width="250" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="447" y="274" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The Day of Judgement</text><rect x="588" y="238" width="250" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="713" y="274" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Divine decree (qadar)</text><line x1="450" y1="322" x2="450" y2="372" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="470" y="354" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start" font-style="italic">the framework of practice built on that belief</text><rect x="30" y="380" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="