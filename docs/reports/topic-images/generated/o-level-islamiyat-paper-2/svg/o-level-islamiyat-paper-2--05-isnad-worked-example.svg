<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the isnad matters</text>

<text x="56" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The isnad names every person in the chain</text><rect x="40" y="160" width="186" height="60" rx="30" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="133" y="185.07" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the Prophet</text><text x="133" y="206.82999999999998" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">(pbuh)</text><line x1="228" y1="190" x2="248" y2="190" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="252" y="160" width="186" height="60" rx="30" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="345" y="195.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">narrator</text><line x1="440" y1="190" x2="460" y2="190" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="464" y="160" width="186" height="60" rx="30" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="557" y="195.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">narrator</text><line x1="652" y1="190" x2="672" y2="190" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="676" y="160" width="186" height="60" rx="30" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="769" y="195.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">person recording</text><rect x="30" y="250" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="298" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Mechanism</text><text x="250" y="298" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Scholars checked each narrator's character and memory.</text><rect x="30" y="346" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="394" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Result</text><text x="250" y="394" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Some Hadiths are classified as more reliable than others.</text><rect x="30" y="442" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="56" y="490" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Why it matters</text><text x="250" y="490" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">This scrutiny is why the Hadiths are treated as a trustworthy record.</text><text x="450" y="560" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Linking the mechanism to why it matters is what makes an answer strong.</text>
</svg>