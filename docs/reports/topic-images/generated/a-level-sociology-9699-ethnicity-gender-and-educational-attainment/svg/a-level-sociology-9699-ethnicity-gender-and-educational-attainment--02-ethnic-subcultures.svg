<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ethnicity and school subcultures</text>

<text x="30" y="132" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Sewell (1997): African-Caribbean boys’ responses to school</text><rect x="30" y="150" width="201" height="64" rx="32" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="189" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conformists</text><rect x="243" y="150" width="201" height="64" rx="32" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="343" y="189" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Innovators</text><rect x="456" y="150" width="201" height="64" rx="32" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="556" y="189" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Retreators</text><rect x="669" y="150" width="201" height="64" rx="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="769" y="189" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rebels</text><circle cx="45" cy="244.39" r="4.5" fill="#2e6b62"/><text x="58" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Same ethnicity, different responses: challenges simple labelling theory</text><circle cx="45" cy="274.39" r="4.5" fill="#2e6b62"/><text x="58" y="280" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Black boys received a disproportionate amount of punishment; teachers could not escape wider</text><text x="58" y="302" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">perceptions of young Black men</text><circle cx="45" cy="326.39" r="4.5" fill="#2e6b62"/><text x="58" y="332" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The pull of a street-fashion peer culture</text><text x="30" y="390" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Mirza (1992): culture is not enough</text><rect x="30" y="408" width="250.66666666666666" height="133" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="155.33333333333331" y="440.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">62 young</text><text x="155.33333333333331" y="464.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">African-Caribbean</text><text x="155.33333333333331" y="488.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">women</text><text x="155.33333333333331" y="518.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">working-class, south London</text><line x1="284.66666666666663" y1="474.5" x2="320.66666666666663" y2="474.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="408" width="250.66666666666666" height="133" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="464.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Did well at school</text><text x="449.99999999999994" y="494.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a pro-education outlook</text><line x1="579.3333333333333" y1="474.5" x2="615.3333333333333" y2="474.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="408" width="250.66666666666666" height="133" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="744.6666666666666" y="453.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Jobs limited</text><text x="744.6666666666666" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">labour market segregated by</text><text x="744.6666666666666" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">race and gender</text>
