<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Educational triage</text>

<rect x="250" y="108" width="400" height="70" rx="14" fill="#1e2a44"/><text x="450" y="140" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">League-table pressure</text><text x="450" y="164" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">the “A-to-C economy”</text><line x1="336" y1="182" x2="165" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="182" x2="450" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="564" y1="182" x2="735" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="228" width="268" height="150" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="164" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Will pass anyway</text><text x="164" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">little extra help</text><rect x="109" y="398" width="110" height="22" rx="11" fill="#2e6b62"/><rect x="316" y="228" width="268" height="150" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3.5"/><text x="450" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Can be helped to pass</text><text x="450" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">teaching rationed towards</text><text x="450" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">them</text><rect x="325" y="398" width="250" height="22" rx="11" fill="#2e6b62"/><rect x="602" y="228" width="268" height="150" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="736" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Seen as hopeless</text><text x="736" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">lower sets, foundation tiers</text><rect x="681" y="398" width="110" height="22" rx="11" fill="#2e6b62"/><text x="450" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">share of teaching effort (illustrative)</text><rect x="30" y="466" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="502" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Result</text><text x="56" y="531" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sets, exam tiers and triage cap the grades some pupils can reach and reproduce inequalities</text><text x="56" y="553" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of class, ethnicity and gender. Limitation: only two schools were studied.</text>
</svg>