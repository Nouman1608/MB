<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 751" width="900" height="751" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="751" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gender and wider social change</text>

<text x="30" y="132" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Girls: rising expectations</text><rect x="30" y="148" width="253.33333333333334" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="156.66666666666669" y="180.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminism and equal</text><text x="156.66666666666669" y="204.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">opportunities laws</text><text x="156.66666666666669" y="234.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Equal Pay Act 1970; Sex</text><text x="156.66666666666669" y="255.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Discrimination Act 1975</text><line x1="287.33333333333337" y1="213" x2="319.33333333333337" y2="213" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="148" width="253.33333333333334" height="130" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450.00000000000006" y="201.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Girls’ sense of what</text><text x="450.00000000000006" y="225.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">is possible rises</text><line x1="580.6666666666667" y1="213" x2="612.6666666666667" y2="213" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="148" width="253.33333333333334" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="192.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More ambitious careers</text><text x="743.3333333333334" y="222.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Francis (2002), though still</text><text x="743.3333333333334" y="243.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a gender divide</text><text x="30" y="318" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Girls: changing employment</text><rect x="30" y="334" width="253.33333333333334" height="88" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="156.66666666666669" y="366.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Growth in service jobs</text><text x="156.66666666666669" y="390.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">and women’s paid work</text><line x1="287.33333333333337" y1="378" x2="319.33333333333337" y2="378" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="334" width="253.33333333333334" height="88" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450.00000000000006" y="378.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Role models</text><line x1="580.6666666666667" y1="378" x2="612.6666666666667" y2="378" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="334" width="253.33333333333334" height="88" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="366.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A reason to gain</text><text x="743.3333333333334" y="390.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">qualifications</text><text x="30" y="462" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Boys: the crisis of masculinity (a debated argument)</text><rect x="30" y="478" width="253.33333333333334" height="112" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="156.66666666666669" y="510.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Decline of manual jobs</text><text x="156.66666666666669" y="534.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">and the breadwinner</text><text x="156.66666666666669" y="558.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">role</text><line x1="287.33333333333337" y1="534" x2="319.33333333333337" y2="534" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="478" width="253.33333333333334" height="112" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450.00000000000006" y="534.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Uncertain identity</text><line x1="580.6666666666667" y1="534" x2="612.6666666666667" y2="534" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="478" width="253.33333333333334" height="112" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="534.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Less point in school</text><rect x="30" y="616" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="652" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“Which boys?”</text><text x="56" y="681" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Epstein et al. (1998) call the reaction to boys’ underachievement simplistic; Francis</text><text x="56" y="703" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(2006) describes a moral panic. Class and ethnicity differences within each sex matter.</text>
</svg>