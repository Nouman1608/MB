<rect width="900" height="776" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Laddishness as self-worth protection</text>

<path d="M541.4702650628653,190.8082086395865 A175,175 0 0 1 612.5163112258892,275.08891785272806" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M612.5163112258892,404.91108214727194 A175,175 0 0 1 541.4702650628653,489.1917913604135" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M358.52973493713466,489.1917913604135 A175,175 0 0 1 287.4836887741107,404.91108214727194" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M287.48368877411065,275.08891785272806 A175,175 0 0 1 358.52973493713466,190.8082086395865" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="129" width="240" height="72" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Avoid visible effort</text><rect x="548.75" y="304" width="240" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="668.75" y="347" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fail or do badly</text><rect x="330" y="479" width="240" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="511" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Blame not trying,</text><text x="450" y="535" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">not lack of ability</text><rect x="111.25" y="304" width="240" height="72" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="231.25" y="336" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-worth protected</text><text x="231.25" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">status in laddish culture</text><text x="450" y="336" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Jackson (2002)</text><text x="450" y="360" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="middle">laddishness</text><rect x="30" y="584" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,634 L31.25,598.25 Q31.25,585.25 44.25,585.25 L285.0833333333333,585.25 Q298.0833333333333,585.25 298.0833333333333,598.25 L298.0833333333333,634 Z" fill="#f2e7b8"/><line x1="31.25" y1="634" x2="298.0833333333333" y2="634" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="614.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ladettes</text><text x="44" y="665.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jackson (2006); Archer et al.</text><text x="44" y="686.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2007): some working-class</text><text x="44" y="707.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">girls also disengage.</text><rect x="315.3333333333333" y="584" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,634 L316.5833333333333,598.25 Q316.5833333333333,585.25 329.5833333333333,585.25 L570.4166666666666,585.25 Q583.4166666666666,585.25 583.4166666666666,598.25 L583.4166666666666,634 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="634" x2="583.4166666666666" y2="634" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="614.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Teacher attention</text><text x="329.3333333333333" y="665.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">French (1984): boys got more,</text><text x="329.3333333333333" y="686.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">partly by attention-seeking.</text><text x="329.3333333333333" y="707.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Spender (1978): girls kept</text><text x="329.3333333333333" y="728.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quiet.</text><rect x="600.6666666666666" y="584" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,634 L601.9166666666666,598.25 Q601.9166666666666,585.25 614.9166666666666,585.25 L855.75,585.25 Q868.75,585.25 868.75,598.25 L868.75,634 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="634" x2="868.75" y2="634" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="614.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hegemonic masculinity</text><text x="614.6666666666666" y="665.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Connell: the dominant, most</text><text x="614.6666666666666" y="686.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">valued form of masculinity;</text><text x="614.6666666666666" y="707.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">visible effort seen as</text><text x="614.6666666666666" y="728.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">feminine.</text>
</svg>