<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 931" width="900" height="931" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="931" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ethnicity, class and gender combined</text>

<circle cx="360" cy="270" r="150" fill="#b5d3cf" fill-opacity="0.6" stroke="#1e2a44" stroke-width="3"/><circle cx="540" cy="270" r="150" fill="#f2e7b8" fill-opacity="0.6" stroke="#1e2a44" stroke-width="3"/><circle cx="450" cy="425" r="150" fill="#dce9e7" fill-opacity="0.6" stroke="#1e2a44" stroke-width="3"/><text x="290" y="220" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnicity</text><text x="610" y="220" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><text x="450" y="520" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><circle cx="450" cy="205" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="210.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="450" cy="330" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="335.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="385" cy="395" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="385" y="400.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="515" cy="395" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="515" y="400.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="52" cy="604" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="52" y="609.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="80" y="610" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Vincent et al. (2012–13): race changes how class works for Black Caribbean middle-class</text><text x="80" y="632" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">parents</text><circle cx="52" cy="660" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="52" y="665.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="80" y="666" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gillborn and Mirza (2000): class and gender cannot account for persistent ethnic</text><text x="80" y="688" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">inequalities</text><circle cx="52" cy="716" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="52" y="721.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="80" y="722" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Connolly (2006): young boys’ masculinities in a multi-ethnic school</text><circle cx="52" cy="750" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="52" y="755.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="80" y="756" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Willis (1977): working-class boys’ counter-school culture</text><rect x="30" y="796" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="832" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intersectionality</text><text x="56" y="861" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Class, ethnicity and gender combine, so they cannot be studied one at a time. Hill, who</text><text x="56" y="883" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stresses class, offers a counter-view.</text>
</svg>