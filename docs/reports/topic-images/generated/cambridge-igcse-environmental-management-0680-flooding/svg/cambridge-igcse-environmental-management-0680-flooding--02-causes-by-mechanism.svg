<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" width="900" height="558" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="558" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Causes of flooding: how each one works</text>

<rect x="30" y="110" width="405" height="342" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="50" y="146" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">More run-off, faster</text><rect x="50" y="171" width="217.2" height="30" rx="15" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="158.6" y="191.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Steep slopes (relief)</text><rect x="50" y="211" width="152.79999999999998" height="30" rx="15" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="126.39999999999999" y="231.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Saturated soil</text><rect x="50" y="251" width="152.79999999999998" height="30" rx="15" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="126.39999999999999" y="271.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Compacted soil</text><rect x="50" y="291" width="143.6" height="30" rx="15" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="121.8" y="311.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Deforestation</text><rect x="50" y="331" width="355.2" height="30" rx="15" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="227.6" y="351.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Ploughing, overgrazing, field drains</text><rect x="50" y="371" width="364.4" height="30" rx="15" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="232.2" y="391.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Urbanisation: concrete, roofs, drains</text><rect x="50" y="411" width="235.6" height="30" rx="15" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="167.8" y="431.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">More intense rainstorms</text><rect x="465" y="110" width="405" height="102" rx="14" fill="#ffffff" stroke="#2b5a9a" stroke-width="3"/><text x="485" y="146" font-size="20" font-weight="700" fill="#2b5a9a" text-anchor="start">Less space in the channel</text><rect x="485" y="171" width="364.4" height="30" rx="15" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><text x="667.2" y="191.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Soil erosion: silt makes it shallower</text><rect x="465" y="228" width="405" height="102" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="3"/><text x="485" y="264" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Water collects</text><rect x="485" y="289" width="336.79999999999995" height="30" rx="15" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="653.4" y="309.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Low-lying, flat land drains slowly</text><rect x="465" y="346" width="405" height="182" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="3"/><text x="485" y="382" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Sea water floods the coast</text><rect x="485" y="407" width="152.79999999999998" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="561.4" y="427.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sea-level rise</text><rect x="485" y="447" width="134.39999999999998" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="552.2" y="467.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Storm surges</text><rect x="485" y="487" width="97.6" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="533.8" y="507.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Tsunamis</text>
</svg>