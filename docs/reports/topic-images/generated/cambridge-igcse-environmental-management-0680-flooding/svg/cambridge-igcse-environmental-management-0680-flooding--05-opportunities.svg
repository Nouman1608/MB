<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Floods bring benefits too</text>

<rect x="30" y="110" width="840" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M32,260 L180,300 L400,312 L430,350 L490,350 L520,312 L740,300 L868,260 L868,528 L32,528 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="150" y="288" width="620" height="24" rx="0" fill="#b5d3cf" opacity="0.75"/><text x="250" y="280" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">floodwater spreads and slows</text><path d="M180,300 L400,312 L400,322 L180,310 Z" fill="#8a6d0d"/><path d="M520,312 L740,300 L740,310 L520,322 Z" fill="#8a6d0d"/><path d="M430,350 L490,350 L520,312 L400,312 Z" fill="#b5d3cf"/><line x1="640" y1="316" x2="700" y2="352" stroke="#1e2a44" stroke-width="2"/><text x="858" y="372" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">layer of nutrient-rich silt</text><text x="858" y="392" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">on farmland</text><rect x="32" y="430" width="836" height="60" rx="0" fill="#dce9e7" opacity="0.9"/><text x="450" y="466" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">aquifer: ground water store refilled</text><line x1="220" y1="330" x2="220" y2="424" stroke="#2b5a9a" stroke-width="3.5" marker-end="url(#ah)" stroke-dasharray="7 5"/><line x1="300" y1="330" x2="300" y2="424" stroke="#2b5a9a" stroke-width="3.5" marker-end="url(#ah)" stroke-dasharray="7 5"/><line x1="600" y1="330" x2="600" y2="424" stroke="#2b5a9a" stroke-width="3.5" marker-end="url(#ah)" stroke-dasharray="7 5"/><line x1="680" y1="330" x2="680" y2="424" stroke="#2b5a9a" stroke-width="3.5" marker-end="url(#ah)" stroke-dasharray="7 5"/><text x="80" y="375" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="start">water soaks down</text><text x="858" y="520" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text><rect x="30" y="550" width="410" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="579.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Silt deposition</text><text x="48" y="610.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adds nutrients and new soil, raising crop</text><text x="48" y="631.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">yields</text><rect x="460" y="550" width="410" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="579.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Recharge</text><text x="478" y="610.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fills lakes, wetlands, reservoirs and</text><text x="478" y="631.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aquifers for the dry season</text>
</svg>