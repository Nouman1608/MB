<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="628" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Managing flood impacts by stage</text>

<rect x="30" y="120" width="840" height="40" rx="20" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="147" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Before</text><text x="450" y="147" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">During</text><text x="735" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">After</text><rect x="315" y="287" width="555" height="95" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="8 6"/><text x="329" y="315.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shelters (during and after)</text><text x="329" y="346.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">safe buildings above flood level with food, water and medical</text><text x="329" y="366.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">care</text><rect x="30" y="180" width="270" height="115" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="208.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Monitoring and warning</text><text x="44" y="239.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">gauges, radar, forecasts;</text><text x="44" y="259.03999999999996" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">little warning for flash</text><text x="44" y="279.03999999999996" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">floods</text><rect x="30" y="307" width="270" height="95" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="335.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Land use zoning</text><text x="44" y="366.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">keep homes and hospitals off</text><text x="44" y="386.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the floodplain</text><rect x="30" y="414" width="270" height="95" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="442.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Structure of buildings</text><text x="44" y="473.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">raised floors, stilts, high</text><text x="44" y="493.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sockets, door barriers</text><rect x="30" y="521" width="270" height="75" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="549.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Disaster preparation</text><text x="44" y="580.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">plans, drills, sandbags, boats</text><rect x="315" y="180" width="270" height="95" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="329" y="208.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Evacuation</text><text x="329" y="239.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">people and livestock to higher</text><text x="329" y="259.03999999999996" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ground</text><rect x="600" y="394" width="270" height="95" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="614" y="422.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rebuilding</text><text x="614" y="453.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ideally to flood-resistant</text><text x="614" y="473.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">standards</text><rect x="600" y="501" width="270" height="95" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="614" y="529.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">International aid</text><text x="614" y="560.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">money, food, clean water,</text><text x="614" y="580.04" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">medical teams</text>
</svg>