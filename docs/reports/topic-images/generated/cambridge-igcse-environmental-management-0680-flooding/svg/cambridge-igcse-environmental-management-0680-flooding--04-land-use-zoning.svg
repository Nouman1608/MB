00.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crowded cities may have no other land;</text><text x="478" y="621.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">existing buildings are hard to move</text>
