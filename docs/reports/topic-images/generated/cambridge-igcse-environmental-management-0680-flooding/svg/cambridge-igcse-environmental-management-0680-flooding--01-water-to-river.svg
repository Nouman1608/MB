ight="700" fill="#2b5a9a" text-anchor="start">rain</text><text x="140" y="234.2" font-size="16" font-weight="700" fill="#6f9a52" text-anchor="middle">interception</text><path d="M350,364.4 Q520,377.8 690,439.2" fill="none" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="520" y="367.8" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">surface run-off: fast</text><line x1="300" y1="363.4" x2="300" y2="419.4" stroke="#2b5a9a" stroke-width="4" marker-end="url(#ah)"/><text x="312" y="409.4" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="start">infiltration</text><polyline points="340,449.4 722,487.4" fill="none" stroke="#2b5a9a" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)" stroke-dasharray="8 6"/><text x="520" y="517.8" font-size="16" font-weight="400" fill="#2b5a9a" text-anchor="middle">water in the soil moves slowly</text><text x="858" y="568" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text><rect x="30" y="600" width="840" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="631.26" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Most causes of flooding work by increasing run-off or by reducing the space for</text><text x="450" y="653.26" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">water in the channel.</text>
