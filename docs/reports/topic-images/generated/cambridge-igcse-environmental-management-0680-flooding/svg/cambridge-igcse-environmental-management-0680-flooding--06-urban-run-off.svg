<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why building over land raises flood risk</text>

<rect x="170" y="150" width="400" height="350" fill="#ffffff"/><line x1="170" y1="500" x2="570" y2="500" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="500" x2="170" y2="500" stroke="#1e2a44" stroke-width="2"/><text x="158" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="170" y1="383.33333333333337" x2="570" y2="383.33333333333337" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="383.33333333333337" x2="170" y2="383.33333333333337" stroke="#1e2a44" stroke-width="2"/><text x="158" y="389.33333333333337" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">15,000</text><line x1="170" y1="266.6666666666667" x2="570" y2="266.6666666666667" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="266.6666666666667" x2="170" y2="266.6666666666667" stroke="#1e2a44" stroke-width="2"/><text x="158" y="272.6666666666667" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">30,000</text><line x1="170" y1="150" x2="570" y2="150" stroke="#c9d6d4" stroke-width="1.5"/><line x1="163" y1="150" x2="170" y2="150" stroke="#1e2a44" stroke-width="2"/><text x="158" y="156" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">45,000</text><path d="M170,150 L170,500 L570,500" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="0" y="0" transform="translate(108,325) rotate(-90)" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Run-off (m³)</text><line x1="170" y1="150" x2="570" y2="150" stroke="#1e2a44" stroke-width="2" stroke-dasharray="8 6"/><text x="570" y="140" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="end">all the rain: 45,000 m³</text><rect x="215" y="430" width="120" height="70" rx="0" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><rect x="405" y="202.5" width="120" height="297.5" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><text x="275" y="418" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">9,000</text><text x="465" y="190.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">38,250</text><text x="275" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Woodland</text><text x="275" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">20% runs off</text><text x="465" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Built over</text><text x="465" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">85% runs off</text><rect x="600" y="150" width="270" height="350" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Working</text><text x="620" y="218" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Units</text><text x="620" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">30 mm = 0.030 m</text><text x="620" y="264" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start"></text><text x="620" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1.5 km² = 1,500,000 m²</text><text x="620" y="310" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Rain</text><text x="620" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">0.030 × 1,500,000 = 45,000 m³</text><text x="620" y="356" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Woodland</text><text x="620" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">45,000 × 0.20 = 9,000 m³</text><text x="620" y="402" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Urban</text><text x="620" y="422" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">45,000 × 0.85 = 38,250 m³</text><text x="620" y="448" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Extra</text><text x="620" y="468" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">38,250 − 9,000 = 29,250 m³</text><text x="450" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Invented figures: 30 mm of rain on 1.5 km².</text>
</svg>