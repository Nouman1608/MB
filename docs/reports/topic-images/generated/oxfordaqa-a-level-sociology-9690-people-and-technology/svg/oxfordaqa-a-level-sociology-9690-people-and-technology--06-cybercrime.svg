mages, hate</text><text x="616.6666666666666" y="210.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">speech.</text><rect x="30" y="250" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="286" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Responses and divides</text><circle cx="61" cy="309.39" r="4.5" fill="#8a6d0d"/><text x="74" y="315" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Cyber security:</tspan> passwords, encryption, laws</text><circle cx="61" cy="339.39" r="4.5" fill="#8a6d0d"/><text x="74" y="345" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Digital divides (Norris, 2001):</tspan> global, social (within countries) and democratic</text><text x="74" y="367" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(civic use); by income, age, location, gender and disability</text>
