<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four media-audience models</text>

<rect x="228" y="104" width="317" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="386.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Main idea</text><rect x="553" y="104" width="317" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="711.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Key evaluation</text><rect x="30" y="156" width="190" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="196.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hypodermic</text><text x="42" y="218.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">syringe</text><rect x="228" y="156" width="317" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Messages are "injected" into a</text><text x="242" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passive mass audience.</text><rect x="553" y="156" width="317" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores interpretation; the 1938</text><text x="567" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">War of the Worlds "panic" was</text><text x="567" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">later shown to be exaggerated.</text><rect x="30" y="257" width="190" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="308.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Two step flow</text><rect x="228" y="257" width="317" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Katz and Lazarsfeld (1955):</tspan></text><text x="242" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">messages pass through opinion</text><text x="242" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leaders.</text><rect x="553" y="257" width="317" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Still fairly passive; social media</text><text x="567" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">blurs who leads.</text><rect x="30" y="358" width="190" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="399.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural effects</text><rect x="228" y="358" width="317" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repeated messages over time shape</text><text x="242" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what is seen as normal.</text><rect x="553" y="358" width="317" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Long-term effects are hard to</text><text x="567" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">measure.</text><rect x="30" y="438" width="190" height="114" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="489.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Uses and</text><text x="42" y="511.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">gratifications</text><rect x="228" y="438" width="317" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="242" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Active use for diversion,</text><text x="242" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relationships, identity,</text><text x="242" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surveillance (McQuail, Blumler and</text><text x="242" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Brown, 1972).</text><rect x="553" y="438" width="317" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="567" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May overstate freedom; needs are</text><text x="567" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shaped by media.</text>
</svg>