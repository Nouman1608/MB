<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 449" width="900" height="449" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="449" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three kinds of misleading content</text>

<rect x="30" y="104" width="269.3333333333333" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#dce9e7"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Misinformation</text><text x="46" y="188.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">no intent to deceive</text><text x="46" y="218.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">False content shared</text><text x="46" y="240.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">without meaning to</text><text x="46" y="262.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mislead.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Disinformation</text><text x="331.3333333333333" y="188.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">deliberate</text><text x="331.3333333333333" y="218.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">False content spread on</text><text x="331.3333333333333" y="240.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">purpose.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#d4b02e"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Propaganda</text><text x="616.6666666666666" y="188.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">organised persuasion</text><text x="616.6666666666666" y="218.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Often by states, as in</text><text x="616.6666666666666" y="240.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wartime posters and radio.</text><rect x="30" y="302" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="338" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conspiracy theories (Uscinski and Parent, 2014)</text><text x="56" y="367" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"Conspiracy theories are for losers": groups out of power use them. Letters to the New</text><text x="56" y="389" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">York Times, 1890 to 2010, showed no long-term rise, which questions the claim that the</text><text x="56" y="411" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">internet caused one.</text>
</svg>