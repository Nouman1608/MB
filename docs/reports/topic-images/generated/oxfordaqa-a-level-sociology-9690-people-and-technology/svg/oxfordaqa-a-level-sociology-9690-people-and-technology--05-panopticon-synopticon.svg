<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Surveillance: who watches whom?</text>

<rect x="30" y="104" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="104" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="142" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Panopticon</text><text x="235" y="166" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the few watch the many</text><circle cx="235" cy="285" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="335" cy="285" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="265" y1="285" x2="317" y2="285" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="305.71067811865476" cy="340.1543289325507" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="256.2132034355964" y1="306.2132034355964" x2="292.9827560572969" y2="327.42640687119285" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="235" cy="363" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="235" y1="315" x2="235" y2="345" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="164.28932188134524" cy="340.1543289325507" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="213.78679656440357" y1="306.2132034355964" x2="177.0172439427031" y2="327.42640687119285" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="135" cy="285" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="205" y1="285" x2="153" y2="285" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="164.28932188134524" cy="229.8456710674493" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="213.78679656440357" y1="263.7867965644036" x2="177.0172439427031" y2="242.57359312880715" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="234.99999999999997" cy="207" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="235" y1="255" x2="234.99999999999997" y2="225" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="305.71067811865476" cy="229.84567106744927" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="256.2132034355964" y1="263.7867965644036" x2="292.9827560572969" y2="242.57359312880715" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="235" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Foucault (1975), from Bentham: people</text><text x="235" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">discipline themselves when they might be watched</text><text x="665" y="142" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Synopticon</text><text x="665" y="166" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the many watch the few</text><circle cx="665" cy="285" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="765" cy="285" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="747" y1="285" x2="695" y2="285" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><circle cx="735.7106781186548" cy="340.1543289325507" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="722.9827560572969" y1="327.42640687119285" x2="686.2132034355964" y2="306.2132034355964" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><circle cx="665" cy="363" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="665" y1="345" x2="665" y2="315" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><circle cx="594.2893218813452" cy="340.1543289325507" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="607.0172439427031" y1="327.42640687119285" x2="643.7867965644036" y2="306.2132034355964" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><circle cx="565" cy="285" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="583" y1="285" x2="635" y2="285" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><circle cx="594.2893218813452" cy="229.8456710674493" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="607.0172439427031" y1="242.57359312880715" x2="643.7867965644035" y2="263.7867965644036" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><circle cx="665" cy="207" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="665" y1="225" x2="665" y2="255" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><circle cx="735.7106781186548" cy="229.84567106744927" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="722.9827560572969" y1="242.57359312880715" x2="686.2132034355964" y2="263.7867965644036" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="665" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Mathiesen (1997): the many watching</text><text x="665" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the few, as in celebrity culture</text><rect x="30" y="484" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="520" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Digital surveillance</text><text x="56" y="549" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">CCTV, facial recognition and data tracking extend both.</text>
