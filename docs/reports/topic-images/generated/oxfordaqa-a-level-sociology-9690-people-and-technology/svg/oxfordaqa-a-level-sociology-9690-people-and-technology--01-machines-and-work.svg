<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="460" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Machines, industrialisation and work</text>

<rect x="30" y="104" width="240" height="108" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="147.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Extraction</text><text x="150" y="177.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">mining, oil</text><line x1="274" y1="158" x2="326" y2="158" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="104" width="240" height="108" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="136.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Manufacturing</text><text x="450" y="166.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">factories powered by</text><text x="450" y="188.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">machines</text><line x1="574" y1="158" x2="626" y2="158" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="630" y="104" width="240" height="108" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="147.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Service industries</text><text x="750" y="177.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">retail, finance, care</text><text x="450" y="240" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">kinds of work have grown and shrunk in turn</text><rect x="30" y="260" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,310 L31.25,274.25 Q31.25,261.25 44.25,261.25 L285.0833333333333,261.25 Q298.0833333333333,261.25 298.0833333333333,274.25 L298.0833333333333,310 Z" fill="#b5d3cf"/><line x1="31.25" y1="310" x2="298.0833333333333" y2="310" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="290.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Bell (1973)</text><text x="44" y="341.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">post-industrial society</text><text x="44" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Service and knowledge work</text><text x="44" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">will come to dominate rich</text><text x="44" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">economies.</text><rect x="315.3333333333333" y="260" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,310 L316.5833333333333,274.25 Q316.5833333333333,261.25 329.5833333333333,261.25 L570.4166666666666,261.25 Q583.4166666666666,261.25 583.4166666666666,274.25 L583.4166666666666,310 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="310" x2="583.4166666666666" y2="310" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="290.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Braverman (1974)</text><text x="329.3333333333333" y="341.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Marxist</text><text x="329.3333333333333" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Machines deskill workers and</text><text x="329.3333333333333" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">give managers more control.</text><rect x="600.6666666666666" y="260" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,310 L601.9166666666666,274.25 Q601.9166666666666,261.25 614.9166666666666,261.25 L855.75,261.25 Q868.75,261.25 868.75,274.25 L868.75,310 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="310" x2="868.75" y2="310" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="290.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Blauner (1964)</text><text x="614.6666666666666" y="341.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">technology matters</text><text x="614.6666666666666" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Alienation highest on the</text><text x="614.6666666666666" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assembly line, lower in</text><text x="614.6666666666666" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">automated process work.</text>
</svg>