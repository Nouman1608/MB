<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Algorithms, power and inequality</text>

<text x="30" y="116" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Gender Shades (Buolamwini and Gebru, 2018): error rates of commercial facial analysis</text><text x="30" y="182" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Darker-skinned women</text><rect x="250" y="156" width="399.05" height="40" rx="4" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="661.05" y="183" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">as high as 34.7%</text><text x="30" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lighter-skinned men</text><rect x="250" y="236" width="11.5" height="40" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="273.5" y="263" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">under 1%</text><rect x="30" y="316" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,366 L31.25,330.25 Q31.25,317.25 44.25,317.25 L427.75,317.25 Q440.75,317.25 440.75,330.25 L440.75,366 Z" fill="#f2e7b8"/><line x1="31.25" y1="366" x2="440.75" y2="366" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="346.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Noble (2018)</text><text x="44" y="397.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Search results reproduce racist and sexist</text><text x="44" y="418.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stereotypes.</text><rect x="458" y="316" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,366 L459.25,330.25 Q459.25,317.25 472.25,317.25 L855.75,317.25 Q868.75,317.25 868.75,330.25 L868.75,366 Z" fill="#f2e7b8"/><line x1="459.25" y1="366" x2="868.75" y2="366" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="346.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">O’Neil (2016); Eubanks (2018)</text><text x="472" y="397.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Automated decisions hit poorer people</text><text x="472" y="418.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hardest.</text><rect x="30" y="458" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="494" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="56" y="523" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Developers improved some systems after the findings, so bias can be reduced; critics say</text><text x="56" y="545" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the deeper issue is who controls deployment.</text>
</svg>