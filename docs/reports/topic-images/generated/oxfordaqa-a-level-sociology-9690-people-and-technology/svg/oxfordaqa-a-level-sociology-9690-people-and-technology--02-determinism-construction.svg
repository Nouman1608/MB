<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 617" width="900" height="617" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="617" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Does technology shape society?</text>

<rect x="30" y="110" width="320" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="190" y="153" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Technology</text><rect x="550" y="110" width="320" height="70" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="710" y="153" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Social change</text><line x1="358" y1="134" x2="542" y2="134" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="542" y1="160" x2="358" y2="160" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="124" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">determinism</text><text x="450" y="182" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">construction</text><rect x="30" y="210" width="412" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,260 L31.25,224.25 Q31.25,211.25 44.25,211.25 L427.75,211.25 Q440.75,211.25 440.75,224.25 L440.75,260 Z" fill="#f2e7b8"/><line x1="31.25" y1="260" x2="440.75" y2="260" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="240.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Technological determinism</text><circle cx="49" cy="285.92" r="4.5" fill="#2e6b62"/><text x="62" y="291.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Technology drives social change</text><circle cx="49" cy="314.92" r="4.5" fill="#2e6b62"/><text x="62" y="320.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marx (1847):</tspan> "the hand-mill gives you</text><text x="62" y="341.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">society with the feudal lord; the</text><text x="62" y="362.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">steam-mill society with the industrial</text><text x="62" y="383.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">capitalist"</text><circle cx="49" cy="406.92" r="4.5" fill="#2e6b62"/><text x="62" y="412.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">McLuhan:</tspan> "the medium is the message"</text><circle cx="49" cy="435.92" r="4.5" fill="#2e6b62"/><text x="62" y="441.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explains big shifts but ignores choice and</text><text x="62" y="462.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">power</text><rect x="458" y="210" width="412" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,260 L459.25,224.25 Q459.25,211.25 472.25,211.25 L855.75,211.25 Q868.75,211.25 868.75,224.25 L868.75,260 Z" fill="#b5d3cf"/><line x1="459.25" y1="260" x2="868.75" y2="260" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="240.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social constructionism</text><circle cx="477" cy="285.92" r="4.5" fill="#2e6b62"/><text x="490" y="291.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Social groups shape technology</text><circle cx="477" cy="314.92" r="4.5" fill="#2e6b62"/><text x="490" y="320.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Pinch and Bijker (1984):</tspan> the safety bicycle</text><text x="490" y="341.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">beat the penny-farthing through</text><text x="490" y="362.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interpretive flexibility</text><circle cx="477" cy="385.92" r="4.5" fill="#2e6b62"/><text x="490" y="391.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explains design but may understate how</text><text x="490" y="412.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">built technology constrains people</text><rect x="30" y="502" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="538" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A middle way: Latour’s actor-network theory</text><text x="56" y="567" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Humans and non-humans (machines, roads, speed bumps) are all actants in a network.</text>
</svg>