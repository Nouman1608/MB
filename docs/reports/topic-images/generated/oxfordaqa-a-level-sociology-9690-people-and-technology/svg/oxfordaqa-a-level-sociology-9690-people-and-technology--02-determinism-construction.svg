<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 611" width="900" height="611" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Does technology shape society?</text>

<text x="450" y="106" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="108" width="840" height="68" rx="14" fill="none"/><rect x="30" y="110" width="350" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="205" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Technology</text><rect x="520" y="110" width="350" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="695" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social change</text><line x1="386" y1="130" x2="514" y2="130" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="514" y1="156" x2="386" y2="156" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="120" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">determinism</text><text x="450" y="182" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">construction</text><rect x="30" y="204" width="412" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,254 L31.25,218.25 Q31.25,205.25 44.25,205.25 L427.75,205.25 Q440.75,205.25 440.75,218.25 L440.75,254 Z" fill="#f2e7b8"/><line x1="31.25" y1="254" x2="440.75" y2="254" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="234.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Technological determinism</text><circle cx="49" cy="279.92" r="4.5" fill="#2e6b62"/><text x="62" y="285.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Technology drives social change</text><circle cx="49" cy="308.92" r="4.5" fill="#2e6b62"/><text x="62" y="314.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marx (1847):</tspan> "the hand-mill gives you</text><text x="62" y="335.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">society with the feudal lord; the</text><text x="62" y="356.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">steam-mill society with the industrial</text><text x="62" y="377.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">capitalist"</text><circle cx="49" cy="400.92" r="4.5" fill="#2e6b62"/><text x="62" y="406.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">McLuhan:</tspan> "the medium is the message"</text><circle cx="49" cy="429.92" r="4.5" fill="#2e6b62"/><text x="62" y="435.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explains big shifts but ignores choice and</text><text x="62" y="456.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">power</text><rect x="458" y="204" width="412" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,254 L459.25,218.25 Q459.25,205.25 472.25,205.25 L855.75,205.25 Q868.75,205.25 868.75,218.25 L868.75,254 Z" fill="#b5d3cf"/><line x1="459.25" y1="254" x2="868.75" y2="254" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="234.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social constructionism</text><circle cx="477" cy="279.92" r="4.5" fill="#2e6b62"/><text x="490" y="285.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Social groups shape technology</text><circle cx="477" cy="308.92" r="4.5" fill="#2e6b62"/><text x="490" y="314.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Pinch and Bijker (1984):</tspan> the safety bicycle</text><text x="490" y="335.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">beat the penny-farthing through</text><text x="490" y="356.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interpretive flexibility</text><circle cx="477" cy="379.92" r="4.5" fill="#2e6b62"/><text x="490" y="385.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explains design but may understate how</text><text x="490" y="406.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">built technology constrains people</text><rect x="30" y="496" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="532" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A middle way: Latour’s actor-network theory</text><text x="56" y="561" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Humans and non-humans (machines, roads, speed bumps) are all actants in a network.</text>
</svg>