<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gaps at home, breaches in Strasbourg</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">English courts (left); European Court of Human Rights (right)</text>
<text x="450" y="140" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">The weakness of judicial review</text><rect x="30" y="152" width="380" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="184" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EX PARTE SMITH (1996)</text><text x="50" y="210.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Armed forces ban not irrational</text><text x="50" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Judges had doubts, but Wednesbury</text><text x="50" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">irrationality was not met</text><rect x="490" y="152" width="380" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="510" y="184" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SMITH AND GRADY v UK (1999)</text><text x="510" y="210.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Breach of Articles 8 and 13</text><text x="510" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The high irrationality threshold left no</text><text x="510" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">effective remedy</text><line x1="416" y1="218" x2="484" y2="218" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="322" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Residual liberties, not rights</text><rect x="30" y="334" width="380" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="366" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MALONE (1979); R v KHAN (1997)</text><text x="50" y="392.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lawful because nothing prohibited it</text><text x="50" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Phone tapping; listening-device evidence</text><text x="50" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">admissible without a statutory scheme</text><rect x="490" y="334" width="380" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="510" y="366" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MALONE v UK (1984); KHAN v UK (2000)</text><text x="510" y="392.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Breach of Article 8</text><text x="510" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not “in accordance with the law”</text><line x1="416" y1="400" x2="484" y2="400" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/>
</svg>