<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="372" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The road to the Human Rights Act 1998</text>

<rect x="30" y="100" width="144" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="102" y="134.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1951</text><text x="102" y="159.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">UK ratifies the</text><text x="102" y="180.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Convention</text><line x1="180" y1="153.5" x2="198" y2="153.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="204" y="100" width="144" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="124" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1966</text><text x="276" y="149.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual</text><text x="276" y="170.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">petition</text><text x="276" y="191.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">accepted</text><line x1="354" y1="153.5" x2="372" y2="153.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="378" y="100" width="144" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="124" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1990s</text><text x="450" y="149.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Wide support</text><text x="450" y="170.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">for</text><text x="450" y="191.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">incorporation</text><line x1="528" y1="153.5" x2="546" y2="153.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="552" y="100" width="144" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="624" y="124" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1997</text><text x="624" y="149.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">White paper:</text><text x="624" y="170.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Rights</text><text x="624" y="191.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Brought Home</text><line x1="702" y1="153.5" x2="720" y2="153.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="726" y="100" width="144" height="107" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="798" y="134.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2 OCT 2000</text><text x="798" y="159.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">HRA 1998 in</text><text x="798" y="180.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">force</text><rect x="30" y="229" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="263.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rights Brought Home: the argument</text><text x="50" y="293.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">People should enforce Convention rights in UK courts without the delay and cost of Strasbourg,</text><text x="50" y="315.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and British judges should contribute to Convention law.</text>
</svg>