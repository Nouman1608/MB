<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 351" width="900" height="351" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="351" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The pre-1998 system: strengths and weaknesses</text>

<rect x="30" y="100" width="412" height="219" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTHS</text><text x="50" y="164.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An external check on the UK</text><text x="50" y="196.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="196.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rulings led to real reform: privacy,</text><text x="66.15" y="218.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">expression, prisoners’ rights, education</text><rect x="458" y="100" width="412" height="219" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESSES</text><text x="478" y="164.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.15" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Slow and expensive: domestic remedies</text><text x="494.15" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">first</text><text x="478" y="218.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.15" y="218.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">UK judges could not apply the Convention,</text><text x="494.15" y="240.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">so British cases were decided abroad</text><text x="478" y="272.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.15" y="272.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Governments could respond minimally</text><text x="494.15" y="294.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(derogation after <tspan font-style="italic">Brogan</tspan>)</text>
</svg>