<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" width="900" height="644" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="644" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ratified but not incorporated: dualism</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Ratified 1951; individual petition and the Court accepted from 1966</text>
<rect x="30" y="124" width="300" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="163" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE GOVERNMENT</text><text x="50" y="189.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Makes the treaty under the</text><text x="50" y="213.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">royal prerogative</text><text x="50" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Without Parliament</text><rect x="570" y="124" width="300" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="590" y="175" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERNATIONAL LAW</text><text x="590" y="201.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The treaty binds the UK</text><text x="590" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Article 46: abide by judgments</text><line x1="336" y1="199" x2="564" y2="199" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="188" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">binding</text><rect x="570" y="334" width="300" height="150" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="590" y="374.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ENGLISH COURTS</text><text x="590" y="401.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">No rights created</text><text x="590" y="430.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unless Parliament incorporates</text><text x="590" y="451.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the treaty by statute</text><line x1="336" y1="244" x2="564" y2="394" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)" stroke-dasharray="10 7"/><text x="470" y="296" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">not by itself</text><text x="30" y="404" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Why? If a treaty changed domestic law by itself, the</text><text x="30" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">executive</tspan> <tspan font-weight="700">could</tspan> <tspan font-weight="700">make</tspan> <tspan font-weight="700">law</tspan> <tspan font-weight="700">without</tspan> <tspan font-weight="700">Parliament</tspan>.</text><rect x="30" y="506" width="412" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="538" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSEQUENCE 1</text><text x="50" y="564.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No claim in an English court for breach of</text><text x="50" y="587.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">a Convention right</text><rect x="458" y="506" width="412" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="538" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSEQUENCE 2</text><text x="478" y="564.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A clearly conflicting statute was applied:</text><text x="478" y="587.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">parliamentary sovereignty</text>
</svg>