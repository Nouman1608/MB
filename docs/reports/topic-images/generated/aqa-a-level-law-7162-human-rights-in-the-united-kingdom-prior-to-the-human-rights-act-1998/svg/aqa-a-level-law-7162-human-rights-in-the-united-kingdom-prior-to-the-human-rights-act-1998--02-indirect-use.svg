<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="395" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How courts could still use the Convention</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Limited, indirect uses before 1998</text>
<rect x="30" y="124" width="270.6666666666667" height="239" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ALLOWED</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Resolving ambiguity in a</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">statute</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parliament presumed not to</text><text x="50" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intend to breach international</text><text x="50" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">obligations, so a genuinely</text><text x="50" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ambiguous statute could be</text><text x="50" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">read to comply</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="239" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT ALLOWED</text><text x="334.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Controlling ministerial</text><text x="334.6666666666667" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">discretion</text><text x="334.6666666666667" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ex</tspan> <tspan font-style="italic">parte</tspan> <tspan font-style="italic">Brind</tspan> (1991):</text><text x="334.6666666666667" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">broadcasting ban; the minister</text><text x="334.6666666666667" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">need not follow Article 10, or</text><text x="334.6666666666667" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Convention would be</text><text x="334.6666666666667" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">incorporated “by the back</text><text x="334.6666666666667" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">door”</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="239" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON LAW</text><text x="619.3333333333334" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Same values, common</text><text x="619.3333333333334" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">law grounds</text><text x="619.3333333333334" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Derbyshire</tspan> <tspan font-style="italic">CC</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Times</tspan></text><text x="619.3333333333334" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Newspapers</tspan> (1993): Court of</text><text x="619.3333333333334" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Appeal referred to Article 10;</text><text x="619.3333333333334" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">House of Lords decided on</text><text x="619.3333333333334" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">common law alone</text>
</svg>