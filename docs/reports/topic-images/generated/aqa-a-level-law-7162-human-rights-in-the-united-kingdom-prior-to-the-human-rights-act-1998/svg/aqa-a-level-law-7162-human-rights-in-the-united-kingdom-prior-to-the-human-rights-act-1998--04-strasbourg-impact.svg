<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Strasbourg judgments and UK responses</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Article 46: the UK must abide by judgments against it</text>
<text x="90" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUDGMENT (ARTICLE)</text><text x="480" y="138" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">UK RESPONSE</text><text x="30" y="178" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1975</text><rect x="90" y="150" width="346" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="102" y="178" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">Golder v UK (6, 8)</text><line x1="438" y1="172" x2="462" y2="172" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="468" y="150" width="402" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="478" y="178" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Prison rules: access to legal advice</text><text x="30" y="232" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1978</text><rect x="90" y="204" width="346" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="102" y="232" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">Tyrer v UK (3)</text><line x1="438" y1="226" x2="462" y2="226" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="468" y="204" width="402" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="478" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Birching ended in practice</text><text x="30" y="286" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1979</text><rect x="90" y="258" width="346" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="102" y="286" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">Sunday Times v UK (10)</text><line x1="438" y1="280" x2="462" y2="280" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="468" y="258" width="402" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="478" y="286" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Contempt of Court Act 1981</text><text x="30" y="340" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1981</text><rect x="90" y="312" width="346" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="102" y="340" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">Dudgeon v UK (8)</text><line x1="438" y1="334" x2="462" y2="334" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="468" y="312" width="402" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="478" y="340" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Homosexual Offences (Northern Ireland) Order 1982</text><text x="30" y="394" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1982</text><rect x="90" y="366" width="346" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="102" y="394" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">Campbell and Cosans v UK (Prot 1 Art 2)</text><line x1="438" y1="388" x2="462" y2="388" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="468" y="366" width="402" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="478" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Education (No 2) Act 1986</text><text x="30" y="448" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1984</text><rect x="90" y="420" width="346" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="102" y="448" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">Malone v UK (8)</text><line x1="438" y1="442" x2="462" y2="442" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="468" y="420" width="402" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="478" y="448" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Interception of Communications Act 1985</text><text x="30" y="502" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1988</text><rect x="90" y="474" width="346" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="102" y="502" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">Brogan v UK (5)</text><line x1="438" y1="496" x2="462" y2="496" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="468" y="474" width="402" height="44" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="478" y="502" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Derogation under Article 15 instead</text><text x="30" y="556" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1997</text><rect x="90" y="528" width="346" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="102" y="556" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="start">Halford v UK (8)</text><line x1="438" y1="550" x2="462" y2="550" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="468" y="528" width="402" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="478" y="556" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Regulation of Investigatory Powers Act 2000</text>
