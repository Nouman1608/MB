<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 451" width="900" height="451" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="451" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning "describe and evaluate"</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Bartlett's Theory of Reconstructive Memory</text>
<rect x="30" y="124" width="357.4468085106383" height="70" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="208.72340425531914" y="155" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Describe</text><text x="208.72340425531914" y="179" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">about half</text><rect x="387.4468085106383" y="124" width="357.4468085106383" height="70" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="566.1702127659574" y="155" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluate</text><text x="566.1702127659574" y="179" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">about half</text><rect x="744.8936170212766" y="124" width="125.1063829787234" height="70" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="807.4468085106382" y="155" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclude</text><text x="807.4468085106382" y="179" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">one sentence</text><rect x="30" y="216" width="312.8" height="203" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="244" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DESCRIBE</text><text x="46" y="275.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Memory is rebuilt at recall</text><text x="46" y="302.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Schemas fill gaps; effort after</text><text x="61.2" y="323.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meaning</text><text x="46" y="350.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">War of the Ghosts procedure</text><text x="46" y="377.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shortening, omission,</text><text x="61.2" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transformation to familiar</text><rect x="354.8" y="216" width="312.8" height="203" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="370.8" y="244" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EVALUATE</text><text x="370.8" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ Explains why eyewitness accounts</text><text x="370.8" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">differ; false memory research</text><text x="370.8" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supports it</text><text x="370.8" y="344.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Lack of control and standardised</text><text x="370.8" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">instructions</text><text x="370.8" y="392.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Qualitative data, subjective scoring</text><rect x="679.6" y="216" width="190.39999999999998" height="203" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="695.6" y="244" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUDE</text><text x="695.6" y="275.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Influential, but the</text><text x="695.6" y="296.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">original evidence is</text><text x="695.6" y="317.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not tightly</text><text x="695.6" y="338.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controlled.</text>
</svg>