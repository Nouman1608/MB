<rect width="900" height="521" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three marks for a scenario answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Jamal keeps typing his old locker code, 4729, instead of 8153</text>
<line x1="60" y1="144" x2="60" y2="389" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Name the concept [1]</text><text x="120" y="184.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"This is <tspan font-weight="700" fill="#1e2a44">proactive</tspan> <tspan font-weight="700" fill="#1e2a44">interference</tspan>…"</text><circle cx="60" cy="164.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="173.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="215" width="766" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="245.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain it [1]</text><text x="120" y="275.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"…where information learned earlier disrupts the recall of newer, similar information."</text><circle cx="60" cy="255.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="264.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="306" width="766" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="336.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Link it to the scenario [1]</text><text x="120" y="366.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"Jamal's old code is interfering with retrieval of his new code because both are four-digit</text><text x="120" y="388.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">numbers used for the same purpose."</text><circle cx="60" cy="357.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="366.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="431" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="464.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Without "Jamal" or the codes, the answer is only a definition: it loses the application mark.</text>
</svg>