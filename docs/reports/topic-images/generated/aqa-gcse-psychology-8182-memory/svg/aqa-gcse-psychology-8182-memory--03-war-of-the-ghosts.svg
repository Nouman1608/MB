<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 872" width="900" height="872" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="872" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bartlett: memory is rebuilt, not replayed</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The War of the Ghosts: repeated reproductions of an unfamiliar folk tale</text>
<rect x="60" y="134" width="200" height="230" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="80" y1="160" x2="240" y2="160" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="182" x2="203" y2="182" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="204" x2="216" y2="204" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="226" x2="229" y2="226" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="248" x2="192" y2="248" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="270" x2="205" y2="270" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="292" x2="218" y2="292" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="314" x2="231" y2="314" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="80" y1="336" x2="194" y2="336" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><text x="160" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Original tale</text><text x="160" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">strange to English readers</text><line x1="268" y1="304" x2="320" y2="304" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="184" width="200" height="180" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="350" y1="210" x2="510" y2="210" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="350" y1="232" x2="473" y2="232" stroke="#d4b02e" stroke-width="7" stroke-linecap="round"/><line x1="350" y1="254" x2="486" y2="254" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="350" y1="276" x2="499" y2="276" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="350" y1="298" x2="462" y2="298" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="350" y1="320" x2="475" y2="320" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><text x="430" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reproduction</text><text x="430" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">details left out</text><line x1="538" y1="304" x2="570" y2="304" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="580" y="234" width="200" height="130" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="260" x2="760" y2="260" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="600" y1="282" x2="723" y2="282" stroke="#d4b02e" stroke-width="7" stroke-linecap="round"/><line x1="600" y1="304" x2="736" y2="304" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><line x1="600" y1="326" x2="749" y2="326" stroke="#c9d6d4" stroke-width="7" stroke-linecap="round"/><text x="680" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Later reproduction</text><text x="680" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">shorter, more familiar</text><text x="840" y="244" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="446" width="270.6666666666667" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="490" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CHANGE 1</text><text x="165.33333333333334" y="516.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Shortened</text><rect x="314.6666666666667" y="446" width="270.6666666666667" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="478" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CHANGE 2</text><text x="450" y="504.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Unfamiliar details</text><text x="450" y="528.8199999999999" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">omitted</text><rect x="599.3333333333334" y="446" width="270.6666666666667" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="734.6666666666667" y="478" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CHANGE 3</text><text x="734.6666666666667" y="504.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Transformed into</text><text x="734.6666666666667" y="528.8199999999999" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">familiar forms</text><rect x="30" y="576" width="413" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="608" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SCHEMAS</text><text x="50" y="634.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fill the gaps</text><text x="50" y="663.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">We store fragments and rebuild the memory at</text><text x="50" y="684.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">each recall using mental frameworks.</text><rect x="457" y="576" width="413" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="608" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EFFORT AFTER MEANING</text><text x="477" y="634.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Make it make sense</text><text x="477" y="663.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unfamiliar information is changed to fit what we</text><text x="477" y="684.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">already know.</text><rect x="30" y="731" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="765.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="50" y="794.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Supports the role of culture and expectation (eyewitness testimony). But no standardised instructions or</text><text x="50" y="815.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">request to be accurate, and qualitative data were open to interpretation.</text>
</svg>