<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 757" width="900" height="757" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="757" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Encoding and types of memory</text>

<text x="30" y="114" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">THREE PROCESSES</text><rect x="30" y="126" width="246.66666666666666" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="153.33333333333331" y="160.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Encoding</text><text x="153.33333333333331" y="189.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">input</text><line x1="282.66666666666663" y1="170" x2="320.66666666666663" y2="170" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="126" width="246.66666666666666" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="449.99999999999994" y="174.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Storage</text><line x1="579.3333333333333" y1="170" x2="617.3333333333333" y2="170" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="126" width="246.66666666666666" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="746.6666666666666" y="160.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Retrieval</text><text x="746.6666666666666" y="189.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">output</text><text x="30" y="250" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">ENCODING CAN BE</text><rect x="30" y="262" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="307.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Acoustic</text><text x="50" y="336.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by sound: repeating a phone</text><text x="50" y="357.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">number aloud</text><rect x="314.6666666666667" y="262" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="317.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Visual</text><text x="334.6666666666667" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by image</text><rect x="599.3333333333334" y="262" width="270.6666666666667" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="296.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Semantic</text><text x="619.3333333333334" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by meaning: the gist of a</text><text x="619.3333333333334" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conversation, not the exact</text><text x="619.3333333333334" y="367.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">words</text><text x="30" y="428" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">THREE TYPES OF LONG-TERM MEMORY</text><rect x="30" y="440" width="270.6666666666667" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="472" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EPISODIC</text><text x="50" y="498.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Personal experiences</text><text x="50" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tied to a time and place: your</text><text x="50" y="548.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">last birthday party. Conscious,</text><text x="50" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feels personal.</text><rect x="314.6666666666667" y="440" width="270.6666666666667" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="472" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEMANTIC</text><text x="334.6666666666667" y="498.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Facts and meanings</text><text x="334.6666666666667" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">without a personal context: a</text><text x="334.6666666666667" y="548.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">triangle has three sides.</text><text x="334.6666666666667" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Conscious.</text><rect x="599.3333333333334" y="440" width="270.6666666666667" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="472" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROCEDURAL</text><text x="619.3333333333334" y="498.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Skills and actions</text><text x="619.3333333333334" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tying a shoelace. Hard to</text><text x="619.3333333333334" y="548.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">explain in words.</text><rect x="30" y="616" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="650.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Clive Wearing: evidence the types are separate</text><text x="50" y="679.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">After brain damage he lost most of his <tspan font-weight="700" fill="#1e2a44">episodic</tspan> memory but could still play the piano, a <tspan font-weight="700" fill="#1e2a44">procedural</tspan> skill.</text><text x="50" y="700.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Case studies are rich in detail but hard to generalise.</text>
</svg>