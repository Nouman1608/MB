<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why memories can be inaccurate</text>

<text x="30" y="116" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">INTERFERENCE: SIMILAR MEMORIES COMPETE</text><rect x="30" y="128" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="164" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Proactive</text><text x="50" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">old learning disrupts new: an old PIN keeps coming to mind</text><rect x="560" y="152" width="90" height="44" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="605" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">old</text><rect x="760" y="152" width="90" height="44" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="805" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">new</text><line x1="656" y1="174" x2="752" y2="174" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="30" y="232" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="268" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Retroactive</text><text x="50" y="296" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">new learning disrupts old: last term's timetable is lost</text><rect x="560" y="256" width="90" height="44" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="605" y="284" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">old</text><rect x="760" y="256" width="90" height="44" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="805" y="284" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">new</text><line x1="754" y1="278" x2="658" y2="278" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="30" y="346" width="412" height="174" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="378" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTEXT</text><text x="50" y="404.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Matching settings act as a cue</text><text x="50" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Godden and Baddeley: divers recalled words</text><text x="50" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">better when tested in the same environment,</text><text x="50" y="474.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">underwater or on land, as where they learned</text><text x="50" y="495.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">them.</text><rect x="458" y="346" width="412" height="174" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="388.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FALSE MEMORIES</text><text x="478" y="414.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sincere recall of what never happened</text><text x="478" y="443.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Loftus: suggestion led people to "remember"</text><text x="478" y="464.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">invented childhood events. Fits reconstructive</text><text x="478" y="485.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">theory.</text>
</svg>