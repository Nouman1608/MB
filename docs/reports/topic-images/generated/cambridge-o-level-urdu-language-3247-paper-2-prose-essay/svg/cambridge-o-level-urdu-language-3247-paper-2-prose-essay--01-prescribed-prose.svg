<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The prescribed prose for 2027</text>

<rect x="30" y="110" width="410" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="141" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Rishta Nata</text><text x="50" y="166" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Muhammad Hussain Azad</text><rect x="460" y="110" width="410" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="141" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Imtahaan</text><text x="480" y="166" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mirza Farhatullah Baig</text><rect x="30" y="194" width="410" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="225" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Overcoat</text><text x="50" y="250" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ghulam Abbas</text><rect x="460" y="194" width="410" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="225" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Shafarish</text><text x="480" y="250" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ahmad Nadeem Qasmi</text><rect x="30" y="278" width="410" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="309" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Umeed kee Khushi</text><text x="50" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sir Syed Ahmed Khan</text><rect x="460" y="278" width="410" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="309" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Ur ahna ghar mai murgiyoon kaa</text><text x="480" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mushtaq Ahmed Yousafi</text><rect x="30" y="362" width="410" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="393" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Ahraam o Sakoon</text><text x="50" y="418" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Syed Imtiaz Ali Taj</text><rect x="460" y="362" width="410" height="72" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="393" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Khatoot e Ghalib: two letters</text><text x="480" y="418" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="start">to Tafta (3 Nov 1858), to Majrooh (2 Dec 1859)</text><text x="450" y="482" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Four forms on one list</text><rect x="30" y="502" width="201" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130.5" y="560" font-size="28" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;افسانہ&#x200F;</text><text x="130.5" y="596" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">short story</text><rect x="243" y="502" width="201" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.5" y="560" font-size="28" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;مضمون&#x200F;</text><text x="343.5" y="596" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">essay</text><rect x="456" y="502" width="201" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.5" y="560" font-size="28" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;مزاح&#x200F;</text><text x="556.5" y="596" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">humorous writing</text><rect x="669" y="502" width="201" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769.5" y="560" font-size="28" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;خط&#x200F;</text><text x="769.5" y="596" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">personal letter</text><text x="450" y="652" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Note what kind of writing each text is, and what that form lets the writer do.</text><rect x="30" y="676" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="715" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Study the entire work; set texts may not be taken into the exam.</text>
