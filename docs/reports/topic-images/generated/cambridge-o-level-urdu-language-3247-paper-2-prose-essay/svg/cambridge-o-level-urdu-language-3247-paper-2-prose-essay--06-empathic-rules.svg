<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" width="900" height="592" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="592" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An empathic answer is still literature</text>

<rect x="30" y="110" width="410" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="146.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Faithful to the text</text><text x="50" y="174.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What the character knows, remembers and</text><text x="50" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feels fits the work up to that moment.</text><text x="50" y="218.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inventing events loses relevance.</text><rect x="460" y="110" width="410" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="146.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Close reference, no quotation</text><text x="480" y="171.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">marks</text><text x="480" y="199.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Weave details and phrases from the text into</text><text x="480" y="221.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the character's thoughts.</text><rect x="30" y="266" width="410" height="142" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="302.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The right voice</text><text x="50" y="330.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Vocabulary, tone and formality suit the</text><text x="50" y="352.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">character: an educated narrator, a poor</text><text x="50" y="374.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">clerk and a child do not sound alike.</text><rect x="460" y="266" width="410" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="302.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Thoughts and feelings, not a</text><text x="480" y="327.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">summary</text><text x="480" y="355.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The character reflects, regrets, hopes or</text><text x="480" y="377.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">justifies.</text><text x="450" y="446" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Before writing, fix the moment</text><rect x="30" y="466" width="268" height="62" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="164" y="504" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">What has just happened?</text><rect x="316" y="466" width="268" height="62" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="504" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">What does the character know?</text><rect x="602" y="466" width="268" height="62" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="736" y="504" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">What do they fear or want?</text><text x="450" y="566" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle">Avoid: drifting from the text, added events, slipping into the third person, a modern casual voice.</text>
</svg>