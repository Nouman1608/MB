<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 898" width="900" height="898" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="898" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: the gardener's thoughts</text>

<rect x="30" y="110" width="840" height="168" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="144" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Task (an original situation, not a set text)</text><text x="846" y="208" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ مالی ہیں۔ آخری دن گھر لوٹتے ہوئے اپنے خیالات لکھیے۔&#x200F;</text><text x="846" y="256" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">A gardener of thirty years; on his last day the garden is to be paved for parking.</text><rect x="30" y="298" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="334" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="340.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="98" y="341" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Memory</text><text x="846" y="356" font-size="25" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تیس برس...&#x200F;</text><text x="846" y="394" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">thirty years: the opening lingers on what is lost</text><rect x="30" y="422" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="458" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="464.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="98" y="465" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Specific detail</text><text x="846" y="480" font-size="25" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وہ گلاب کی کیاری ... کل سیمنٹ کے نیچے دب جائے گی۔&#x200F;</text><text x="846" y="518" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the rose bed he planted will be buried under cement</text><rect x="30" y="546" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="582" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="588.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="98" y="589" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Humble, tired voice</text><text x="846" y="604" font-size="25" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہم جیسوں کا کہنا ہی کیا۔&#x200F;</text><text x="846" y="642" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the plain voice suits the character</text><rect x="30" y="670" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="706" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="712.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="98" y="713" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feeling through gesture</text><text x="846" y="728" font-size="25" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;امرود کے پیڑ کے تنے پر ہاتھ رکھا&#x200F;</text><text x="846" y="766" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">a hand on the guava tree: shown, not announced</text><rect x="30" y="798" width="840" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="842" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">In the exam the details come from the set text, and the voice echoes the writer's.</text>
</svg>