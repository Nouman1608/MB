<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Prose methods to discuss</text>

<rect x="30" y="110" width="410" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Narrator</text><text x="420" y="162" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;راوی&#x200F;</text><text x="50" y="202" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">First or third person? A first-person</text><text x="50" y="223" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">narrator in a humorous essay can make</text><text x="50" y="244" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">himself the joke.</text><rect x="460" y="110" width="410" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><text x="850" y="162" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;عروج&#x200F;</text><text x="740" y="150" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">rising tension</text><text x="480" y="202" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Opening, rising tension, ending. A surprise</text><text x="480" y="223" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ending can change how the reader sees</text><text x="480" y="244" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">everything before it.</text><rect x="30" y="286" width="410" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="326" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Characterisation</text><text x="420" y="338" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کردار نگاری&#x200F;</text><text x="50" y="378" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What a character does and says, and what the</text><text x="50" y="399" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">narrator reveals that the character does not</text><text x="50" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">know.</text><rect x="460" y="286" width="410" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="326" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Irony and satire</text><text x="850" y="338" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;طنز&#x200F;</text><text x="480" y="378" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The gap between appearance and reality, or</text><text x="480" y="399" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between what is said and what is meant.</text><rect x="30" y="462" width="410" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="502" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Humour</text><text x="420" y="514" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مزاح&#x200F;</text><text x="50" y="554" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Exaggeration, unexpected comparisons, comic</text><text x="50" y="575" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">situations, and their purpose.</text><rect x="460" y="462" width="410" height="162" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="502" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Style in letters</text><text x="850" y="514" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;خط&#x200F;</text><text x="480" y="554" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Direct, informal, talking to the reader as</text><text x="480" y="575" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">if in conversation.</text><rect x="30" y="642" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="680" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Surprise ending</text><text x="410" y="740" font-size="26" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چونکا دینے والا انجام&#x200F;</text><line x1="430" y1="658" x2="430" y2="766" stroke="#c9d6d4" stroke-width="2"/><text x="454" y="680" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A letter that opens with questions</text><text x="846" y="740" font-size="26" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بھائی! کیا پوچھتے ہو؟ کیا لکھوں؟&#x200F;</text>
</svg>