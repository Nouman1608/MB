<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analyse key moments, do not retell</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Each body paragraph is built on one key moment</text><rect x="30" y="144" width="195" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="127" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">What happens</text><text x="127" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">briefly</text><line x1="227" y1="192" x2="241" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="243" y="144" width="195" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="340" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Quotation</text><text x="340" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">short, memorised</text><line x1="440" y1="192" x2="454" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="456" y="144" width="195" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="553" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">What it reveals</text><text x="553" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">about the focus</text><line x1="653" y1="192" x2="667" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="669" y="144" width="195" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="766" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Method</text><text x="766" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">how the effect is made</text><text x="450" y="286" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The retelling test</text><rect x="200" y="304" width="500" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="342" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Delete your analysis from the paragraph.</text><text x="450" y="372" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Would only plot remain?</text><path d="M330,398 L200,440" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="196,428 190,446 208,442" fill="#1e2a44"/><path d="M570,398 L700,440" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="692,442 710,446 704,428" fill="#1e2a44"/><rect x="30" y="450" width="400" height="132" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="487" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Yes</text><text x="50" y="516.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Mostly narrative: the paragraph sits at</text><text x="50" y="539.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Level 2 or 3. Add the quotation, the</text><text x="50" y="562.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">meaning and the method.</text><rect x="470" y="450" width="400" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="487" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">No</text><text x="490" y="516.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The analysis carries the paragraph: the</text><text x="490" y="539.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">moment is evidence for your answer to</text><text x="490" y="562.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the focus.</text>
</svg>