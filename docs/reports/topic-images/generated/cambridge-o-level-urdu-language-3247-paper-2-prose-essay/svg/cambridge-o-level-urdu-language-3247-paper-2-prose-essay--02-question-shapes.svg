<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four shapes of prose question</text>

<rect x="30" y="110" width="840" height="497.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Shape</text><text x="584" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Typical wording</text><line x1="180" y1="110" x2="180" y2="607.6" stroke="#c9d6d4" stroke-width="2"/><text x="616" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it needs</text><line x1="600" y1="110" x2="600" y2="607.6" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="226.85" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Character</text><text x="584" y="210.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;... کے کردار کے بارے میں&#x200F;</text><text x="584" y="260.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ کیا محسوس کرتے ہیں؟&#x200F;</text><text x="616" y="203.85" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">traits, shown through</text><text x="616" y="226.85" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">action, speech and the</text><text x="616" y="249.85" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">writer's description</text><line x1="30" y1="284.4" x2="870" y2="284.4" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="314.74999999999994" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Theme or</text><text x="46" y="337.74999999999994" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">idea</text><text x="584" y="334.79999999999995" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مصنف نے ... کو کس طرح پیش کیا ہے؟&#x200F;</text><text x="616" y="314.74999999999994" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the idea traced through</text><text x="616" y="337.74999999999994" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">key moments, with method</text><line x1="30" y1="358.79999999999995" x2="870" y2="358.79999999999995" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="414.1499999999999" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Writer's</text><text x="46" y="437.1499999999999" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">methods</text><text x="584" y="409.19999999999993" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مصنف نے مزاح / طنز / منظر نگاری&#x200F;</text><text x="584" y="459.19999999999993" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کس طرح پیدا کی ہے؟&#x200F;</text><text x="616" y="414.1499999999999" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">technique at the centre,</text><text x="616" y="437.1499999999999" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">with effects</text><rect x="32" y="483.19999999999993" width="836" height="124.4" fill="#f2e7b8"/><line x1="30" y1="483.19999999999993" x2="870" y2="483.19999999999993" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="550.05" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Empathic</text><text x="584" y="533.5999999999999" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ ... ہیں۔&#x200F;</text><text x="584" y="583.5999999999999" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;... کے بعد اپنے خیالات لکھیے۔&#x200F;</text><text x="616" y="538.55" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a character's voice,</text><text x="616" y="561.55" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">faithful to the text</text>
</svg>