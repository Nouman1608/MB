<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The empathic task: how voice is rewarded</text>

<rect x="240" y="110" width="630" height="72" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="262" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Top level</text><text x="400" y="154" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">"sustaining an appropriate voice"</text><rect x="170" y="194" width="700" height="72" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="192" y="238" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Level 4</text><text x="330" y="238" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">"suitable features of expression"</text><rect x="100" y="278" width="770" height="72" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="122" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Level 3</text><text x="260" y="322" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">"beginning to assume a voice"</text><rect x="30" y="362" width="840" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="406" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Levels 1-2</text><text x="190" y="406" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">a basic understanding "of character"</text><rect x="30" y="460" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="500" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The task</text><text x="54" y="530" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Become a character at a particular moment and write their thoughts.</text>
