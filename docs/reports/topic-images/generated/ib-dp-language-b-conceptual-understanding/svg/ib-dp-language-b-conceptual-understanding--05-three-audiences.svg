<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" width="900" height="648" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="648" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One message, three audiences</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Class 12B has built a solar-powered phone-charging bench</text>
<rect x="30" y="124" width="269.3333333333333" height="381" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="48" y1="453" x2="281.3333333333333" y2="453" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="485" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Formality</text><rect x="142" y="470" width="24" height="18" rx="4" fill="#2e6b62" stroke="#2e6b62" stroke-width="2"/><rect x="172" y="470" width="24" height="18" rx="4" fill="#2e6b62" stroke="#2e6b62" stroke-width="2"/><rect x="202" y="470" width="24" height="18" rx="4" fill="#2e6b62" stroke="#2e6b62" stroke-width="2"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FORMAL EMAIL</text><text x="48" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To the head of school</text><text x="48" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">"I</tspan> <tspan font-style="italic">am</tspan> <tspan font-style="italic">writing</tspan> <tspan font-style="italic">on</tspan> <tspan font-style="italic">behalf</tspan> <tspan font-style="italic">of</tspan></text><text x="48" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Class</tspan> <tspan font-style="italic">12B</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">ask</tspan> <tspan font-style="italic">whether</tspan> <tspan font-style="italic">we</tspan></text><text x="48" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">may</tspan> <tspan font-style="italic">install…"</tspan></text><text x="48" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Purpose:</tspan> request</text><text x="48" y="311.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Opening:</tspan> formal greeting and</text><text x="48" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">title</text><text x="48" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Sentences:</tspan> complete, polite</text><text x="48" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conditionals</text><text x="48" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Relationship:</tspan> pupil to</text><text x="48" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">authority</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="381" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="333.3333333333333" y1="453" x2="566.6666666666666" y2="453" stroke="#c9d6d4" stroke-width="2"/><text x="333.3333333333333" y="485" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Formality</text><rect x="427.3333333333333" y="470" width="24" height="18" rx="4" fill="#2e6b62" stroke="#2e6b62" stroke-width="2"/><rect x="457.3333333333333" y="470" width="24" height="18" rx="4" fill="#2e6b62" stroke="#2e6b62" stroke-width="2"/><rect x="487.3333333333333" y="470" width="24" height="18" rx="4" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="333.3333333333333" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEMI-FORMAL ARTICLE</text><text x="333.3333333333333" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To the school magazine</text><text x="333.3333333333333" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">"Ever</tspan> <tspan font-style="italic">run</tspan> <tspan font-style="italic">out</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">battery</tspan> <tspan font-style="italic">before</tspan></text><text x="333.3333333333333" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">the</tspan> <tspan font-style="italic">bus</tspan> <tspan font-style="italic">home?"</tspan></text><text x="333.3333333333333" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Purpose:</tspan> inform and interest</text><text x="333.3333333333333" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Opening:</tspan> question to hook</text><text x="333.3333333333333" y="311.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">readers</text><text x="333.3333333333333" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Sentences:</tspan> mix of question</text><text x="333.3333333333333" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and statement</text><text x="333.3333333333333" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Relationship:</tspan> writer to peers</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="381" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="618.6666666666666" y1="453" x2="852" y2="453" stroke="#c9d6d4" stroke-width="2"/><text x="618.6666666666666" y="485" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Formality</text><rect x="712.6666666666666" y="470" width="24" height="18" rx="4" fill="#2e6b62" stroke="#2e6b62" stroke-width="2"/><rect x="742.6666666666666" y="470" width="24" height="18" rx="4" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><rect x="772.6666666666666" y="470" width="24" height="18" rx="4" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="618.6666666666666" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TEXT MESSAGE</text><text x="618.6666666666666" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To a friend</text><text x="618.6666666666666" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">"Bench</tspan> <tspan font-style="italic">is</tspan> <tspan font-style="italic">DONE!!</tspan> <tspan font-style="italic">…</tspan> <tspan font-style="italic">Come</tspan> <tspan font-style="italic">see</tspan></text><text x="618.6666666666666" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">it</tspan> <tspan font-style="italic">tomorrow?"</tspan></text><text x="618.6666666666666" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Purpose:</tspan> share news</text><text x="618.6666666666666" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Opening:</tspan> none</text><text x="618.6666666666666" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Sentences:</tspan> fragments,</text><text x="618.6666666666666" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">exclamations</text><text x="618.6666666666666" y="371.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Relationship:</tspan> friend to friend</text><rect x="30" y="527" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="561.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The content barely changes; register, tone and structure all move.</text><text x="450" y="591.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">That is variation: language appropriate to contexts and audiences.</text>
</svg>