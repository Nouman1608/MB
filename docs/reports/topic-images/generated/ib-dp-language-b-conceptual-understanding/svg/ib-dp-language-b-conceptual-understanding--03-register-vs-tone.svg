<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 737" width="900" height="737" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="737" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Register and tone are not the same thing</text>

<rect x="30" y="100" width="400" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="142" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">REGISTER = how formal</text><line x1="80" y1="184" x2="80" y2="430" stroke="#1e2a44" stroke-width="4"/><circle cx="80" cy="206" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="108" y="176" width="300" height="68" rx="10" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2"/><text x="124" y="204" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Formal</text><text x="124" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Officials, strangers, the public</text><circle cx="80" cy="306" r="13" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><rect x="108" y="276" width="300" height="68" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="124" y="304" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Semi-formal</text><text x="124" y="330" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Teachers, a school magazine, a club</text><circle cx="80" cy="406" r="13" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="108" y="376" width="300" height="68" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="124" y="404" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Informal</text><text x="124" y="430" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Friends, family, peers online</text><text x="80" y="460" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">more formal at the top</text><rect x="450" y="100" width="420" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="475" y="142" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">TONE = what attitude</text><rect x="475" y="170" width="78.22999999999999" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="514.115" y="191.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">urgent</text><rect x="565.23" y="170" width="111.856" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="621.158" y="191.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">reassuring</text><rect x="689.086" y="170" width="124.504" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="751.338" y="191.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">enthusiastic</text><rect x="475" y="220" width="79.69200000000001" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="514.846" y="241.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">critical</text><rect x="566.692" y="220" width="125.813" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="629.5985000000001" y="241.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">sympathetic</text><rect x="704.505" y="220" width="107.3" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="758.155" y="241.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">humorous</text><rect x="475" y="270" width="70.325" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="510.1625" y="291.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">ironic</text><rect x="557.325" y="270" width="81.81700000000001" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="598.2335" y="291.62" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">neutral</text><text x="475" y="354" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tone comes from choices you can point to:</text><text x="475" y="386" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">• intensifiers ("absolutely")</text><text x="475" y="411" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">• modal verbs ("must" vs "could")</text><text x="475" y="436" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">• punctuation</text><text x="475" y="461" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">• the balance of facts and feelings</text><rect x="30" y="502" width="410" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="537.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal letter</text><text x="235" y="568.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">can be angry, grateful or cold</text><rect x="460" y="502" width="410" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="537.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Text message</text><text x="665" y="568.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">can be cheerful or annoyed</text><rect x="30" y="616" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="650.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Common error: calling an angry formal complaint "informal".</text><text x="450" y="680.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Anger is the tone; the register is still formal.</text>
</svg>