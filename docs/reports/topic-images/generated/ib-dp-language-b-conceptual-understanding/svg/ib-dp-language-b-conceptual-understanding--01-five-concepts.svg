<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five concepts behind every text</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Ask these questions of anything you read or write</text>
<line x1="450" y1="329" x2="350" y2="216.5" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="450" y1="329" x2="550" y2="216.5" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="450" y1="329" x2="350" y2="441.5" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="450" y1="329" x2="550" y2="441.5" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="30" y="124" width="315" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTEXT</text><text x="50" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Where, when, in what</text><text x="50" y="210.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">medium?</text><text x="50" y="240.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A printed leaflet, a post or a</text><text x="50" y="262.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">speech; the culture it comes</text><text x="50" y="284.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">from.</text><rect x="555" y="124" width="315" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="575" y="169" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AUDIENCE</text><text x="575" y="197.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Who is it for?</text><text x="575" y="227.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Friend, stranger, official or a</text><text x="575" y="249.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">whole community: the</text><text x="575" y="271.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">writer–reader relationship.</text><rect x="30" y="349" width="315" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="394" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PURPOSE</text><text x="50" y="422.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Why does it exist?</text><text x="50" y="452.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What should the reader know,</text><text x="50" y="474.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">feel or do? Look for a second</text><text x="50" y="496.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">purpose.</text><rect x="555" y="349" width="315" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="575" y="381" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEANING</text><text x="575" y="409.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">What is said, and what is</text><text x="575" y="435.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">suggested?</text><text x="575" y="465.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Explicit: stated in words. Implicit:</text><text x="575" y="487.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">word choice, tone, what is left</text><text x="575" y="509.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">out.</text><circle cx="450" cy="329" r="88" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="325" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Your</text><text x="450" y="351" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">text</text><line x1="450" y1="540" x2="450" y2="580" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="586" width="840" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="618" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">VARIATION</text><text x="50" y="646.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Language changes with the other four</text><text x="50" y="676.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Register</tspan> (how formal) · <tspan font-weight="700" fill="#1e2a44">tone</tspan> (what attitude) · <tspan font-weight="700" fill="#1e2a44">medium</tspan> (spoken, written, text message) · <tspan font-weight="700" fill="#1e2a44">regional</tspan></text><text x="50" y="698.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">variety</tspan> (vocabulary, pronunciation, some grammar)</text>
</svg>