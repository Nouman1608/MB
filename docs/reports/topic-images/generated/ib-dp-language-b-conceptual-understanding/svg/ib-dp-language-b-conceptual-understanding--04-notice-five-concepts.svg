<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 818" width="900" height="818" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="818" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a notice through the five concepts</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Notice to residents: Riverside Road</text>
<rect x="30" y="124" width="411" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTEXT</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Printed notice from a local authority</text><text x="50" y="212.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Before a change to a road</text><rect x="459" y="124" width="411" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AUDIENCE</text><text x="479" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">People who live on or use the road</text><text x="479" y="212.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No personal link to the writer</text><text x="30" y="275" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">WORDS IN THE NOTICE</text><text x="500" y="275" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">WHAT THEY DO</text><rect x="30" y="289" width="410" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="334.1" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">"will be closed to motor vehicles"</text><rect x="500" y="289" width="370" height="81" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="516" y="317" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PURPOSE</text><text x="516" y="349.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Inform</text><line x1="446" y1="329.5" x2="494" y2="329.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="382" width="410" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="427.1" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">"Its aim is to reduce air pollution"</text><rect x="500" y="382" width="370" height="81" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="516" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PURPOSE</text><text x="516" y="442.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Justify: a second purpose</text><line x1="446" y1="422.5" x2="494" y2="422.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="475" width="410" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="520.1" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">"Your views are welcome"</text><rect x="500" y="475" width="370" height="81" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="516" y="503" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PURPOSE</text><text x="516" y="535.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reassure</text><line x1="446" y1="515.5" x2="494" y2="515.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="568" width="410" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="624.1" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">"trial" … "before any permanent decision"</text><rect x="500" y="568" width="370" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="516" y="596" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">IMPLICIT MEANING</text><text x="516" y="628.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The closure may become permanent; the</text><text x="516" y="650.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">authority expects objections</text><line x1="446" y1="619.5" x2="494" y2="619.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="683" width="410" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="728.1" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">"will be considered", "Residents who</text><text x="46" y="750.1" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">require"</text><rect x="500" y="683" width="370" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="516" y="711" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">VARIATION</text><text x="516" y="743.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Formal register: passive forms,</text><text x="516" y="765.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">impersonal phrasing; neutral tone</text><line x1="446" y1="734.5" x2="494" y2="734.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>