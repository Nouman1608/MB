<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 481" width="900" height="481" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="481" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What is said, and what is suggested</text>

<rect x="30" y="100" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="276.552" y="132" width="123.984" height="40" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="121.24799999999999" y="161" font-size="24" fill="#1e2a44">Residents are <tspan font-weight="700">reminded</tspan> that bins must be inside by 8 p.m.</text><path d="M278.54400000000004,204 C278.54400000000004,230 250,230 250,252" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M358.54400000000004,204 C358.54400000000004,230 660,230 660,252" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="30" y="260" width="400" height="141" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="304" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPLICIT: STATED IN WORDS</text><text x="50" y="332.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">States a rule</text><text x="50" y="363.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Bins must be inside by 8 p.m.</text><rect x="470" y="260" width="400" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="292" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">IMPLICIT: SUGGESTED</text><text x="490" y="320.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Some people have been breaking it</text><text x="490" y="351.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">The word <tspan font-weight="700" fill="#1e2a44">reminded</tspan> carries the</text><text x="490" y="375.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">suggestion.</text><text x="450" y="439.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Write <tspan font-weight="700">this</tspan> <tspan font-weight="700">suggests</tspan> or <tspan font-weight="700">this</tspan> <tspan font-weight="700">implies</tspan> for anything not stated.</text>
</svg>