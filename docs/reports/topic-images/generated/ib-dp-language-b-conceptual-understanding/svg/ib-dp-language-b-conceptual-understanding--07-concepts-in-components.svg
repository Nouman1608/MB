<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 398" width="900" height="398" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="398" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Using the concepts in each component</text>

<rect x="30" y="100" width="269.3333333333333" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PAPER 1 · WRITING</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Match register to</text><text x="48" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">audience</text><text x="48" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">SL:</tspan> aim first for accuracy and</text><text x="48" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a clear register–audience</text><text x="48" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">match.</text><text x="48" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">HL:</tspan> more complex language</text><text x="48" y="301.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and structures, higher-order</text><text x="48" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">thinking, a higher word range.</text><rect x="315.3333333333333" y="100" width="269.3333333333333" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="333.3333333333333" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PAPER 2 · RECEPTIVE</text><text x="333.3333333333333" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fix text type, audience</text><text x="333.3333333333333" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">and purpose first</text><text x="333.3333333333333" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reading 40 marks, listening</text><text x="333.3333333333333" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">25 marks; each 25% of the</text><text x="333.3333333333333" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">course.</text><text x="333.3333333333333" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In listening, register is often</text><text x="333.3333333333333" y="301.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">audible; tone words such as</text><text x="333.3333333333333" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"surprised" or "relieved" often</text><text x="333.3333333333333" y="343.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decide an answer.</text><rect x="600.6666666666666" y="100" width="269.3333333333333" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618.6666666666666" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDIVIDUAL ORAL · 25%</text><text x="618.6666666666666" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Treat the stimulus as a</text><text x="618.6666666666666" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">text</text><text x="618.6666666666666" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">SL:</tspan> a visual image. <tspan font-weight="700" fill="#1e2a44">HL:</tspan> an</text><text x="618.6666666666666" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">excerpt from a literary work.</text><text x="618.6666666666666" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who made it, for whom, and</text><text x="618.6666666666666" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">why? Saying so moves you</text><text x="618.6666666666666" y="301.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from describing to</text><text x="618.6666666666666" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interpreting.</text>
</svg>