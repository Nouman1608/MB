<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 857" width="900" height="857" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="857" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Decode the task before you plan</text>

<rect x="30" y="100" width="840" height="86" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="135.2" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">"Your</tspan> <tspan font-style="italic">town</tspan> <tspan font-style="italic">plans</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">replace</tspan> <tspan font-style="italic">its</tspan> <tspan font-style="italic">weekly</tspan> <tspan font-style="italic">street</tspan> <tspan font-style="italic">market</tspan> <tspan font-style="italic">with</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">large</tspan> <tspan font-style="italic">supermarket.</tspan> <tspan font-style="italic">Write</tspan> <tspan font-style="italic">a</tspan></text><text x="50" y="160.2" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">text</tspan> <tspan font-style="italic">for</tspan> <tspan font-style="italic">your</tspan> <tspan font-style="italic">local</tspan> <tspan font-style="italic">newspaper's</tspan> <tspan font-style="italic">letters</tspan> <tspan font-style="italic">page</tspan> <tspan font-style="italic">giving</tspan> <tspan font-style="italic">your</tspan> <tspan font-style="italic">view."</tspan></text><line x1="60" y1="228" x2="60" y2="635" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="208" width="766" height="77" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="236.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><text x="118" y="266.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A letters page in a local newspaper; a public debate about community life.</text><circle cx="60" cy="246.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="255.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="295" width="766" height="77" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="323.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Audience</text><text x="118" y="353.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The newspaper's readers (adults, local, many undecided) and, indirectly, the town council.</text><circle cx="60" cy="333.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="342.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="382" width="766" height="77" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="410.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><text x="118" y="440.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">To persuade, and to show you understand the other side.</text><circle cx="60" cy="420.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="429.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="469" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="497.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Text type</text><text x="118" y="527.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Letter to the editor: formal opening and closing, a clear position early, reasons with</text><text x="118" y="549.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">examples.</text><circle cx="60" cy="518.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="527.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="578" width="766" height="77" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="606.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Register and tone</text><text x="118" y="636.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Formal; firm but polite. Sarcasm would weaken your case with undecided readers.</text><circle cx="60" cy="616.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="625.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="450" y1="669" x2="450" y2="703" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="709" width="840" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="743.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Only then write the points</text><text x="50" y="773.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="773.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Small traders and local jobs · the market as a meeting place for older residents</text><text x="50" y="800.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="800.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Counterpoint: a supermarket offers longer opening hours and lower prices</text>
</svg>