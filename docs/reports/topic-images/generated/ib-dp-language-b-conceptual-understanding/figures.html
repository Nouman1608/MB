<!-- place after: ## Register and tone -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ib-dp-language-b-conceptual-understanding--03-register-vs-tone.webp" width="900" height="737" alt="Two panels. Register, how formal a text is, runs from formal (officials, strangers, the public) through semi-formal (teachers, a school magazine, a club) to informal (friends, family, peers online). Tone, the attitude a text shows, includes urgent, reassuring, enthusiastic, critical, sympathetic, humorous, ironic and neutral, and comes from intensifiers, modal verbs, punctuation and the balance of facts and feelings." loading="lazy">
  <figcaption>Register is how formal; tone is what attitude. Any register can carry many tones.</figcaption>
