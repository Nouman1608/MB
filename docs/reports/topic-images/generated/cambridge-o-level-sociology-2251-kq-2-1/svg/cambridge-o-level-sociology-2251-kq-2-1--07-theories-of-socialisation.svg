<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 599" width="900" height="599" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="599" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three theories of socialisation</text>

<rect x="250" y="110" width="400" height="56" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="143" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">What is socialisation for?</text><path d="M164,226 L164,190 L736,190 L736,226 M450,166 L450,226" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="228" width="268" height="341" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="261" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSENSUS</text><text x="50" y="288" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Functionalism</text><text x="50" y="316.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Passes on shared values:</text><text x="65.2" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">value consensus and</text><text x="65.2" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">social cohesion</text><text x="50" y="385.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="385.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parsons: family gives</text><text x="65.2" y="406.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">primary socialisation and</text><text x="65.2" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stabilises adult</text><text x="65.2" y="448.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personalities</text><text x="50" y="475.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crime = inadequate</text><text x="65.2" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">socialisation</text><text x="50" y="523.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="523.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics: ignores whose</text><text x="65.2" y="544.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">values are taught</text><rect x="316" y="228" width="268" height="341" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="261" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CONFLICT</text><text x="336" y="288" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Marxism</text><text x="336" y="316.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Teaches capitalist</text><text x="351.2" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ideology: inequality</text><text x="351.2" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">seems fair</text><text x="336" y="385.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="385.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Althusser: education is</text><text x="351.2" y="406.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an ideological state</text><text x="351.2" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">apparatus</text><text x="336" y="454.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reproduces social class</text><text x="336" y="481.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics: people are not</text><text x="351.2" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passive</text><rect x="602" y="228" width="268" height="341" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="261" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CONFLICT</text><text x="622" y="288" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Feminism</text><text x="622" y="316.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gender role socialisation</text><text x="637.2" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">into masculinity and</text><text x="637.2" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">femininity</text><text x="622" y="385.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="385.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Girls prepared for caring</text><text x="637.2" y="406.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">roles; boys for dominance</text><text x="637.2" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and paid work</text><text x="622" y="454.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="454.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Evidence: Oakley;</text><text x="637.2" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">McRobbie</text><text x="622" y="502.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics: gender roles</text><text x="637.2" y="523.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">have changed</text>
</svg>