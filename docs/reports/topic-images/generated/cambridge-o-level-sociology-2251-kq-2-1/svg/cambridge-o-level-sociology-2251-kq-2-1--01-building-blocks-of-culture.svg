<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The building blocks of culture</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">CULTURE: the whole way of life of a group</text><rect x="54" y="168" width="240" height="120" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="74" y="204" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Values</text><text x="74" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">General beliefs: respect</text><text x="74" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for elders</text><line x1="296" y1="228" x2="326" y2="228" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="168" width="240" height="131" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="350" y="204" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Norms</text><text x="350" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Specific rules: give up</text><text x="350" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a seat to an older</text><text x="350" y="274.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">person</text><line x1="572" y1="228" x2="602" y2="228" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="606" y="168" width="240" height="120" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="626" y="204" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Customs</text><text x="626" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Norms lasting</text><text x="626" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">generations: tradition</text><rect x="54" y="338" width="380" height="110" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="74" y="374" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Roles</text><text x="74" y="402.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bundles of norms expected of a position:</text><text x="74" y="423.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a teacher, a daughter, a team captain</text><rect x="466" y="338" width="380" height="131" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="486" y="374" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Status</text><text x="486" y="402.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The position and its respect. Ascribed:</text><text x="486" y="423.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fixed at birth (sex, birth order).</text><text x="486" y="444.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Achieved: earned (becoming a nurse)</text><line x1="434" y1="393" x2="466" y2="393" stroke="#1e2a44" stroke-width="3"/><rect x="54" y="485" width="792" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="74" y="521" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Stereotypes</text><text x="74" y="549.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fixed, oversimplified beliefs about whole groups</text>
</svg>