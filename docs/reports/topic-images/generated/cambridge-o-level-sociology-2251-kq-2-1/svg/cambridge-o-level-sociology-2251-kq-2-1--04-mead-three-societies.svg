<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mead: one sex, three temperaments</text>

<rect x="30" y="104" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="141.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Arapesh</text><text x="164" y="172.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Men: gentle, cooperative</text><text x="164" y="202.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Women: gentle, cooperative</text><rect x="316" y="104" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="141.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Mundugumor</text><text x="450" y="172.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Men: aggressive</text><text x="450" y="202.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Women: aggressive</text><rect x="602" y="104" width="268" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="141.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Tchambuli</text><text x="736" y="172.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Women: the more dominant</text><text x="736" y="194.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and practical sex</text><rect x="30" y="272" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="305.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sex and Temperament in Three Primitive Societies (1935): Mead concluded that masculine and</text><text x="50" y="327.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">feminine temperaments are largely cultural. Present it as influential evidence, not proof.</text>
