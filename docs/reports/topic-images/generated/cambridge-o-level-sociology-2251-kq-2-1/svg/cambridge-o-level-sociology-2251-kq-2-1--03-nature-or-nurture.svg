<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 718" width="900" height="718" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="718" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nature or nurture?</text>

<line x1="215" y1="167.2" x2="685" y2="140.8" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,154 L420,246 L480,246 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="154" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="167.2" x2="160" y2="222.2" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="167.2" x2="270" y2="222.2" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,222.2 L290,222.2 Q275,249.2 215,249.2 Q155,249.2 140,222.2 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="140.8" x2="630" y2="195.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="140.8" x2="740" y2="195.8" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,195.8 L760,195.8 Q745,222.8 685,222.8 Q625,222.8 610,195.8 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="271.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">NURTURE</text><text x="685" y="244.8" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">NATURE</text><rect x="30" y="282" width="405" height="254" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="318" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Nurture: mainly learned</text><text x="50" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Genie: isolated until found at 13 in</text><text x="66.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">1970; never fully acquired the grammar</text><text x="66.15" y="391.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">of a first language</text><text x="50" y="418.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="418.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Relativity of culture: what counts as</text><text x="66.15" y="440.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">polite, modest or adult varies between</text><text x="66.15" y="462.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">societies and over time</text><text x="50" y="489.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="489.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Mead (1935): temperaments differed</text><text x="66.15" y="511.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">across three New Guinea peoples</text><rect x="465" y="282" width="405" height="254" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="318" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Nature: largely inborn</text><text x="485" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Behaviour shaped by genes and biology</text><text x="485" y="374.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="374.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Biology sets some limits, such as</text><text x="501.15" y="396.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">physical development</text><rect x="30" y="554" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="590" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Use the evidence carefully</text><text x="50" y="619.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Isolation cases are rare, often involve abuse, and the child may have had other</text><text x="50" y="641.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">difficulties. Some of Mead’s findings were later questioned. A balanced answer: biology</text><text x="50" y="663.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sets limits, but how a society responds is cultural.</text>
</svg>