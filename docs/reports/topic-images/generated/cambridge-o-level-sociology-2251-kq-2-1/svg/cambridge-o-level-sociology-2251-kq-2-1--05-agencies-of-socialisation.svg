<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six agencies: process and effectiveness</text>

<rect x="30" y="104" width="140" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Agency</text><rect x="170" y="104" width="230" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="182" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Process</text><rect x="400" y="104" width="230" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="412" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Effective because…</text><rect x="630" y="104" width="240" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="642" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limited because…</text><rect x="30" y="150" width="140" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="174.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><rect x="170" y="150" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="182" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Role modelling;</text><text x="182" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">canalisation</text><rect x="400" y="150" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="412" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Earliest, most emotionally</text><text x="412" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">intense</text><rect x="630" y="150" width="240" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="642" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Weakens in adolescence;</text><text x="642" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">families differ</text><rect x="30" y="212" width="140" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="236.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><rect x="170" y="212" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="182" y="236.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hidden curriculum; formal</text><text x="182" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">teaching</text><rect x="400" y="212" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="412" y="236.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Compulsory, daily, for</text><text x="412" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">years</text><rect x="630" y="212" width="240" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="642" y="236.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Pupils may form anti-school</text><text x="642" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">groups</text><rect x="30" y="274" width="140" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="298.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Peer group</text><rect x="170" y="274" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="182" y="298.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Peer pressure; acceptance</text><text x="182" y="318.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and rejection</text><rect x="400" y="274" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="412" y="298.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Strongest in teenage years</text><rect x="630" y="274" width="240" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="642" y="298.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Groups change; people</text><text x="642" y="318.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">belong to several</text><rect x="30" y="336" width="140" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="360.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Media</text><rect x="170" y="336" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="182" y="360.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Representations; role</text><text x="182" y="380.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">models</text><rect x="400" y="336" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="412" y="360.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Constant exposure at all</text><text x="412" y="380.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ages</text><rect x="630" y="336" width="240" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="642" y="360.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Audiences interpret and</text><text x="642" y="380.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">resist</text><rect x="30" y="398" width="140" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="422.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Religion</text><rect x="170" y="398" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="182" y="422.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Religious teachings;</text><text x="182" y="442.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rituals</text><rect x="400" y="398" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="412" y="422.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Moral rules backed by</text><text x="412" y="442.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">belief and community</text><rect x="630" y="398" width="240" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="642" y="422.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Varies with how religious</text><text x="642" y="442.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">people are</text><rect x="30" y="460" width="140" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="484.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Workplace</text><rect x="170" y="460" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="182" y="484.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Training; induction; dress</text><text x="182" y="504.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">codes</text><rect x="400" y="460" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="412" y="484.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Shapes adult routines and</text><text x="412" y="504.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">identity</text><rect x="630" y="460" width="240" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="642" y="484.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Starts late; many work</text><text x="642" y="504.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">informally or not at all</text><rect x="30" y="540" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="573.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Primary socialisation: early childhood, mainly the family. Secondary socialisation:</text><text x="50" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">throughout life, through the other agencies.</text>
</svg>