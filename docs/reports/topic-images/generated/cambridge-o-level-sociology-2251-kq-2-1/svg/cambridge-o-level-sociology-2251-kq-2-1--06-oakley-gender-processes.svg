<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Oakley: four ways families teach gender</text>

<rect x="30" y="104" width="410" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="140.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Manipulation</text><text x="50" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Encouraging or discouraging behaviour by</text><text x="50" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sex: fussing over a girl’s appearance</text><rect x="460" y="104" width="410" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="140.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Canalisation</text><text x="480" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Channelling children to “appropriate”</text><text x="480" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">toys: dolls for girls, construction sets</text><text x="480" y="215.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">for boys</text><rect x="30" y="256" width="410" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="292.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Verbal appellations</text><text x="50" y="323.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gendered labels: “good girl”, “brave boy”</text><rect x="460" y="256" width="410" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="292.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Different activities</text><text x="480" y="323.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Boys and girls given different tasks and</text><text x="480" y="345.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">activities</text><rect x="30" y="388" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="421.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Media representations work in a similar way: McRobbie (1978) argued that Jackie magazine</text><text x="50" y="443.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">taught girls that romance and finding a boyfriend were their central concerns.</text>
</svg>