<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 419" width="900" height="419" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="419" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How expectations become identity</text>

<rect x="30" y="104" width="249.33333333333334" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 1</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">People know what is</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">expected</text><text x="50" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of their roles and</text><text x="50" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">statuses</text><line x1="285.33333333333337" y1="183" x2="319.33333333333337" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="104" width="249.33333333333334" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="345.33333333333337" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 2</text><text x="345.33333333333337" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Others judge them</text><text x="345.33333333333337" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">against those</text><text x="345.33333333333337" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expectations</text><line x1="580.6666666666667" y1="183" x2="614.6666666666667" y2="183" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="104" width="249.33333333333334" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="640.6666666666667" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">STEP 3</text><text x="640.6666666666667" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">They see themselves</text><text x="640.6666666666667" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">that way</text><text x="640.6666666666667" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expectation becomes</text><text x="640.6666666666667" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identity</text><rect x="30" y="280" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="315.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">"The responsible one"</text><text x="50" y="343.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A girl repeatedly told this may come to</text><text x="50" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">define herself that way.</text><rect x="459" y="280" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="315.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">"Boys are poor readers"</text><text x="479" y="343.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">This stereotype may lead some boys to stop</text><text x="479" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trying.</text>
</svg>