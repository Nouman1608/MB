<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing the explanations</text>

<rect x="30" y="104" width="260" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Explanation</text><rect x="290" y="104" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="302" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="580" y="104" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="592" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="30" y="150" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Material</text><rect x="290" y="150" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Clear link between poverty and</text><text x="302" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resources</text><rect x="580" y="150" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does not explain why some poor</text><text x="592" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pupils succeed</text><rect x="30" y="214" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural (Sugarman,</text><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Bernstein)</text><rect x="290" y="214" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explains attitudes and language</text><rect x="580" y="214" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Can blame working-class culture</text><rect x="30" y="278" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="303.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural capital</text><rect x="290" y="278" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Links home culture to school</text><text x="302" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rewards</text><rect x="580" y="278" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hard to measure</text><rect x="30" y="342" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">In-school and labelling</text><rect x="290" y="342" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shows schools themselves create</text><text x="302" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inequality</text><rect x="580" y="342" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Deterministic; pupils may reject</text><text x="592" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">labels (Fuller)</text><rect x="30" y="406" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="431.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Institutional racism</text><rect x="290" y="406" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="431.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explains patterns no single</text><text x="302" y="452.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">teacher intends</text><rect x="580" y="406" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="431.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does not explain differences</text><text x="592" y="452.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between minority groups</text><rect x="30" y="470" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="495.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist</text><rect x="290" y="470" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="495.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explains subject choice and</text><text x="302" y="516.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">careers</text><rect x="580" y="470" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="495.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Less able to explain boys’ lower</text><text x="592" y="516.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">attainment</text><rect x="30" y="534" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="559.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Global</text><rect x="290" y="534" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="559.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shows structural barriers</text><rect x="580" y="534" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="559.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Varies greatly within countries</text><text x="592" y="580.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">too</text><rect x="30" y="616" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="652" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Interaction</text><text x="50" y="681.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Class, ethnicity and gender combine: a working-class boy from a minority group may face</text><text x="50" y="703.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">several factors at once.</text>
</svg>