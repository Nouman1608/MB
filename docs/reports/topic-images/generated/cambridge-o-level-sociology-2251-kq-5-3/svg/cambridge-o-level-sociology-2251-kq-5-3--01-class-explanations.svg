<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 509" width="900" height="509" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="509" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Social class: where do the explanations operate?</text>

<rect x="30" y="104" width="408" height="277" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="140" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Outside school: home and society</text><text x="50" y="168.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Material: devices, internet, books, space,</text><text x="65.2" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tuition, diet, housing</text><text x="50" y="215.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cultural: Sugarman (1970), immediate</text><text x="65.2" y="236.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gratification and fatalism</text><text x="50" y="262.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cultural capital: Bourdieu, knowledge and</text><text x="65.2" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">confidence schools reward</text><text x="50" y="309.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Home: Douglas (1964), parental interest</text><text x="50" y="335.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Linguistic: Bernstein, restricted and</text><text x="65.2" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">elaborated codes</text><rect x="462" y="104" width="408" height="277" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="140" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Inside school</text><text x="482" y="168.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Subcultures: Hargreaves (1967),</text><text x="497.2" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anti-school lower streams, pro-school</text><text x="497.2" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">higher streams</text><text x="482" y="236.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="236.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Selective and private education: buying</text><text x="497.2" y="257.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">places, tuition for entry tests</text><text x="482" y="283.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Labelling: Becker’s ideal pupil; Rist</text><text x="497.2" y="304.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1970); Rosenthal and Jacobson (1968)</text><text x="482" y="330.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Marxist: myth of meritocracy; Bowles and</text><text x="497.2" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gintis; Willis</text><rect x="30" y="399" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="432.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Compensatory education, such as Operation Head Start (USA, from 1965) and Sure Start (UK),</text><text x="50" y="454.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shows governments accept that home disadvantage matters.</text>
</svg>