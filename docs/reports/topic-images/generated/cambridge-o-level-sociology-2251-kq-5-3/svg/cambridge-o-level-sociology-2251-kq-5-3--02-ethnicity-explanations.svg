<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" width="900" height="578" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="578" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ethnicity: explanations and evidence</text>

<rect x="30" y="104" width="408" height="272" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="140" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Inside school</text><text x="50" y="168.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Institutional racism: routine policies,</text><text x="65.2" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not individual prejudice; Gillborn and</text><text x="65.2" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Youdell (2000), educational triage</text><text x="50" y="236.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="236.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ethnocentric curriculum reflects the</text><text x="65.2" y="257.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">majority culture</text><text x="50" y="283.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Few minority teachers and leaders as role</text><text x="65.2" y="304.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">models</text><text x="50" y="330.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Labelling: Coard (1971), West Indian</text><text x="65.2" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children wrongly labelled less able</text><rect x="462" y="104" width="408" height="272" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="140" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Outside school</text><text x="482" y="168.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Language: pupils learning in a second</text><text x="497.2" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">language underestimated</text><text x="482" y="215.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Poverty higher in some minority groups</text><text x="482" y="241.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Strong aspirations in some families and</text><text x="497.2" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">communities</text><text x="482" y="288.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family support and supplementary schools</text><rect x="30" y="394" width="411" height="154" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="427" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ETHNIC SUBCULTURE</text><text x="50" y="453.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fuller (1984)</text><text x="50" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Black girls in a London comprehensive worked</text><text x="50" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hard for qualifications while refusing to</text><text x="50" y="523.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">seek teachers’ approval.</text><rect x="459" y="394" width="411" height="154" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="479" y="427" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ETHNIC SUBCULTURE</text><text x="479" y="453.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sewell (1997)</text><text x="479" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Black boys’ responses: rebels, conformists,</text><text x="479" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">retreatists and innovators.</text>
</svg>