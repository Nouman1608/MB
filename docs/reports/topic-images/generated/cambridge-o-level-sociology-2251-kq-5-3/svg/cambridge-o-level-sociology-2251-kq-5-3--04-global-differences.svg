<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" width="900" height="504" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="504" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why achievement differs between societies</text>

<line x1="320" y1="154" x2="365" y2="241.75" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="278.5" x2="365" y2="285.325" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="413.5" x2="365" y2="332.575" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="175" x2="535" y2="249.1" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="289" x2="535" y2="289" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="403" x2="535" y2="328.9" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="289" r="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="273.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Achievement</text><text x="450" y="296" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">between</text><text x="450" y="318.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">societies</text><g transform="translate(0,0)"><rect x="30" y="104" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Availability of schools</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Few schools in rural areas,</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">especially secondary</text><rect x="30" y="218" width="290" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Poverty</text><text x="46" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Families need children’s labour</text><text x="46" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or cannot pay fees, uniforms or</text><text x="46" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">books</text><rect x="30" y="353" width="290" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="383.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Access for girls</text><text x="46" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Early marriage, safety,</text><text x="46" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expectations; Afghanistan since</text><text x="46" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2021</text></g><g transform="translate(0,21)"><rect x="580" y="104" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Class sizes</text><text x="596" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Very large classes limit</text><text x="596" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">individual attention</text><rect x="580" y="218" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Norms and values</text><text x="596" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The value placed on education,</text><text x="596" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and on educating girls, varies</text><rect x="580" y="332" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="362.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Internet and digital</text><text x="596" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Online learning unequal between</text><text x="596" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and within countries</text></g>
</svg>