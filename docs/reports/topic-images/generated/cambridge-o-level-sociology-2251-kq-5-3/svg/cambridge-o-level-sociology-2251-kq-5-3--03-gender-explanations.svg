<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" width="900" height="511" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="511" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gender: explaining the patterns</text>

<rect x="30" y="104" width="408" height="225" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="140" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Why girls now often do better</text><text x="50" y="168.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Closer supervision; habits such as</text><text x="65.2" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">neatness and persistence suit study</text><text x="50" y="215.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Teachers may expect girls to be</text><text x="65.2" y="236.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hard-working</text><text x="50" y="262.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sharpe: priorities shifted from love and</text><text x="65.2" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marriage (1970s) to jobs and careers</text><text x="65.2" y="304.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1990s)</text><rect x="462" y="104" width="408" height="225" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="140" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">What can hold some boys back</text><text x="482" y="168.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Laddish” cultures: working hard seen as</text><text x="497.2" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unmasculine</text><text x="482" y="215.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mac an Ghaill (1994): “macho lads”</text><text x="497.2" y="236.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rejected school values</text><text x="482" y="262.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Boys labelled troublemakers may be</text><text x="497.2" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">excluded or put in lower sets</text><rect x="30" y="347" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="383" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">But</text><text x="50" y="412.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists: patriarchy still shapes subject choice, expectations and careers. Girls’ higher</text><text x="50" y="434.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">grades have not removed male dominance in high-status careers, and in some societies girls</text><text x="50" y="456.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">still lack access to education.</text>
</svg>