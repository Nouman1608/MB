<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which kind of migrant?</text>

<rect x="300" y="115" width="300" height="60" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="152" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Why did they move?</text><line x1="370" y1="178" x2="220" y2="228" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="530" y1="178" x2="680" y2="228" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="223.5" y="190.75" width="93" height="20.25" rx="5" fill="#f4f6f6" opacity="1"/><text x="270" y="205" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">by choice</text><rect x="597" y="190.75" width="66" height="20.25" rx="5" fill="#f4f6f6" opacity="1"/><text x="630" y="205" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">forced</text><rect x="60" y="232" width="320" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="220" y="271" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Voluntary</text><rect x="520" y="232" width="320" height="64" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="680" y="271" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Involuntary (forced)</text><line x1="220" y1="300" x2="220" y2="340" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="60" y="344" width="320" height="112" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="220" y="407" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic migrant</text><text x="220" y="430" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">mainly for work or higher income</text><line x1="680" y1="300" x2="680" y2="330" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="560" y="334" width="240" height="54" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="680" y="368" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Crossed a border?</text><line x1="610" y1="392" x2="540" y2="432" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="750" y1="392" x2="800" y2="432" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="545" y="397.75" width="30" height="20.25" rx="5" fill="#f4f6f6" opacity="1"/><text x="560" y="412" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">no</text><rect x="775.5" y="390.75" width="39" height="20.25" rx="5" fill="#f4f6f6" opacity="1"/><text x="795" y="405" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">yes</text><rect x="420" y="436" width="230" height="112" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="535" y="488" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Internally displaced</text><text x="535" y="510" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">person (IDP)</text><text x="535" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stays in own country</text><rect x="670" y="436" width="200" height="112" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="770" y="475" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Refugee</text><text x="770" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fled persecution,</text><text x="770" y="534" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">conflict or violence</text><line x1="770" y1="552" x2="770" y2="584" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="7 5"/><rect x="640" y="588" width="230" height="100" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="755" y="645" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Asylum seeker</text><text x="755" y="670" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">applied; awaiting decision</text><rect x="30" y="486" width="360" height="202" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="520" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Also classify by</text><text x="50" y="552" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="552" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Distance: internal or international</text><text x="50" y="583" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="583" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Time: temporary, seasonal or</text><text x="66" y="604" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">permanent</text><text x="50" y="635" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="635" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Direction: rural–urban,</text><text x="66" y="656" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">urban–rural, urban–urban</text>
</svg>