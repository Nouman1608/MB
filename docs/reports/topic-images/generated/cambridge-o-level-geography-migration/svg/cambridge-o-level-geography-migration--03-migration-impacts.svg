<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Migration changes both places</text>

<rect x="30" y="115" width="250" height="100" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="155" y="158" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">SOURCE AREA</text><text x="155" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">where migrants leave</text><rect x="620" y="115" width="250" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="158" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">RECEIVING AREA</text><text x="745" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">where they arrive</text><line x1="290" y1="140" x2="610" y2="140" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="130" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">young adults, often men</text><line x1="610" y1="172" x2="290" y2="172" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="194" font-size="15.5" font-weight="700" fill="#8a6d0d" text-anchor="middle">remittances</text><line x1="610" y1="208" x2="290" y2="208" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)" stroke-dasharray="8 6"/><text x="450" y="232" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">return migration: skills, savings, ideas</text><rect x="30" y="262" width="840" height="92" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="286" font-size="15.5" font-weight="700" fill="#4a5568" text-anchor="middle">Economic +</text><text x="48" y="312" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Remittances support families and spending;</text><text x="48" y="332" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">less unemployment</text><text x="470" y="312" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Fills labour shortages, often in jobs locals</text><text x="470" y="332" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">avoid; migrants pay taxes</text><line x1="450" y1="296" x2="450" y2="346" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="366" width="840" height="92" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="390" font-size="15.5" font-weight="700" fill="#4a5568" text-anchor="middle">Economic −</text><text x="48" y="416" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Brain drain: doctors, engineers and other</text><text x="48" y="436" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">skilled workers leave</text><text x="470" y="416" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Pressure on housing, school places, health</text><text x="470" y="436" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">care; some wage competition</text><line x1="450" y1="400" x2="450" y2="450" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="470" width="840" height="92" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="494" font-size="15.5" font-weight="700" fill="#4a5568" text-anchor="middle">Demographic</text><text x="48" y="520" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Loses young adults: birth rate falls,</text><text x="48" y="540" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">population ages; gender imbalance</text><text x="470" y="520" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Gains young adults: can raise the birth rate</text><text x="470" y="540" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">and slow ageing</text><line x1="450" y1="504" x2="450" y2="554" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="574" width="840" height="92" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="598" font-size="15.5" font-weight="700" fill="#4a5568" text-anchor="middle">Social and cultural</text><text x="48" y="624" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Families separated; women take on more farm</text><text x="48" y="644" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">and household work</text><text x="470" y="624" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Cultural diversity; possible tension,</text><text x="470" y="644" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">discrimination, language barriers</text><line x1="450" y1="608" x2="450" y2="658" stroke="#c9d6d4" stroke-width="2"/>
</svg>