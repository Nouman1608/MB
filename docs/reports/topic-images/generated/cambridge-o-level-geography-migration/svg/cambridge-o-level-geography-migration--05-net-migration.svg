<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: net migration</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Illustrative data for one town in one year</text>
<rect x="30" y="110" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Arrivals</text><rect x="190" y="138" width="367.05882352941177" height="36" rx="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="567.0588235294117" y="163" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">3,600</text><text x="55" y="218" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Departures</text><rect x="190" y="196" width="520" height="36" rx="5" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="720" y="221" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">5,100</text><rect x="557.0588235294117" y="136" width="152.94117647058823" height="98" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><rect x="55" y="268" width="380" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="75" y="302" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Net migration</text><text x="75" y="336" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">3,600 − 5,100 = −1,500</text><rect x="460" y="268" width="390" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="302" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Rate (population 150,000)</text><text x="480" y="336" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">−1,500 ÷ 150,000 × 1,000 = −10 per 1,000</text><text x="450" y="425" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">If most leavers are aged 18–35, suggest …</text><rect x="30" y="445" width="201" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="470" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Falling birth rate</text><text x="48" y="491.78" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">in a few years</text><rect x="243" y="445" width="201" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="261" y="470" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">An ageing</text><text x="261" y="491.78" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">population</text><rect x="456" y="445" width="201" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="470" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Labour shortages</text><text x="474" y="491.78" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">on farms</text><rect x="669" y="445" width="201" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="687" y="470" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Less demand for</text><text x="687" y="491.78" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">local services</text>
</svg>