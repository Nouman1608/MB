<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two international migrations</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Voluntary, international: Pakistan → Gulf states</text><rect x="60" y="180" width="200" height="70" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="160" y="213" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan</text><text x="160" y="235" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">source</text><rect x="620" y="180" width="220" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="213" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Saudi Arabia, UAE</text><text x="730" y="235" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">receiving</text><line x1="266" y1="202" x2="612" y2="202" stroke="#1e2a44" stroke-width="8" marker-end="url(#ah)"/><text x="440" y="192" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">workers on temporary contracts</text><line x1="612" y1="236" x2="266" y2="236" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="440" y="260" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">remittances</text><text x="60" y="290" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Push: few well-paid jobs, fast-growing workforce</text><text x="60" y="311" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Pull: higher wages, oil-funded building</text><text x="500" y="290" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Construction, transport, services</text><text x="500" y="311" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Limited rights; separate labour camps</text><rect x="30" y="356" width="840" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="392" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Forced, international: Syrian refugees (from 2011)</text><rect x="330" y="520" width="180" height="76" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="420" y="556" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Syria</text><text x="420" y="578" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">civil war</text><rect x="320" y="410" width="200" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="420" y="437" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Turkey</text><text x="420" y="459" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">largest number</text><line x1="420" y1="516" x2="420" y2="474" stroke="#2e6b62" stroke-width="14" marker-end="url(#ahT)"/><rect x="80" y="520" width="170" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="555" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lebanon</text><line x1="326" y1="552" x2="256" y2="552" stroke="#2e6b62" stroke-width="7" marker-end="url(#ahT)"/><rect x="330" y="650" width="180" height="58" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="420" y="685" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Jordan</text><line x1="420" y1="600" x2="420" y2="644" stroke="#2e6b62" stroke-width="7" marker-end="url(#ahT)"/><rect x="60" y="412" width="200" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="160" y="448" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Europe</text><text x="160" y="470" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">notably Germany, 2015</text><path d="M330,530 Q270,520 230,494" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="570" y="570" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Push: conflict, bombing,</text><text x="570" y="590" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">collapse of services, persecution</text><text x="570" y="610" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Source: loses working-age and</text><text x="570" y="630" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">skilled people</text><text x="570" y="650" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Receiving: pressure on housing,</text><text x="570" y="670" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">schools, health care in border areas</text><text x="450" y="760" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic: arrow width shows relative size, not exact numbers</text>
</svg>