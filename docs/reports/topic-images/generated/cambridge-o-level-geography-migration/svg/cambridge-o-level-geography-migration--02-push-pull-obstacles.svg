<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Push, pull and the obstacles in between</text>

<rect x="30" y="115" width="290" height="310" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="150.85" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Source area</text><text x="50" y="175" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">PUSH factors</text><text x="50" y="205" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="205" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Economic: unemployment, low</text><text x="66" y="225" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">farm incomes, land shortage</text><text x="50" y="255" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="255" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Social: poor schools and</text><text x="66" y="275" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">health care</text><text x="50" y="305" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="305" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Political: conflict,</text><text x="66" y="325" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">persecution</text><text x="50" y="355" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66" y="355" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Environmental: drought,</text><text x="66" y="375" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">flooding, desertification</text><rect x="580" y="115" width="290" height="310" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="598" y="150.85" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Destination</text><text x="600" y="175" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">PULL factors (perceived)</text><text x="600" y="205" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="616" y="205" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Economic: jobs, higher</text><text x="616" y="225" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">wages, remittance potential</text><text x="600" y="255" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="616" y="255" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Social: better services,</text><text x="616" y="275" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">family already there</text><text x="600" y="305" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="616" y="305" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Political: safety, freedom</text><text x="600" y="335" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="616" y="335" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Environmental: reliable</text><text x="616" y="355" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">water, fewer hazards</text><line x1="330" y1="200" x2="570" y2="200" stroke="#1e2a44" stroke-width="6" marker-end="url(#ah)"/><circle cx="395" cy="152.6" r="7.700000000000001" fill="#2e6b62"/><path d="M385.1,190 L385.1,172.4 Q385.1,162.5 395,162.5 Q404.9,162.5 404.9,172.4 L404.9,190 Z" fill="#2e6b62"/><circle cx="420" cy="156" r="7" fill="#8a6d0d"/><path d="M411,190 L411,174 Q411,165 420,165 Q429,165 429,174 L429,190 Z" fill="#8a6d0d"/><text x="450" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">migrants: often young adults</text><rect x="400" y="255" width="50" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(0,0)"/><rect x="425" y="255" width="50" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(0,0)"/><rect x="400" y="255" width="25" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(0,0)"/><rect x="400" y="283" width="50" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(-12,0)"/><rect x="425" y="283" width="50" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(-12,0)"/><rect x="400" y="283" width="25" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(-12,0)"/><rect x="400" y="311" width="50" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(0,0)"/><rect x="425" y="311" width="50" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(0,0)"/><rect x="400" y="311" width="25" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(0,0)"/><rect x="400" y="339" width="50" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(-12,0)"/><rect x="425" y="339" width="50" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(-12,0)"/><rect x="400" y="339" width="25" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(-12,0)"/><rect x="400" y="367" width="50" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(0,0)"/><rect x="425" y="367" width="50" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(0,0)"/><rect x="400" y="367" width="25" height="28" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" transform="translate(0,0)"/><text x="450" y="410" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Intervening</text><text x="450" y="430" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">obstacles</text><rect x="30" y="450" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="485" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Obstacles stop many people moving:</text><text x="55" y="511" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">cost of travel, distance, immigration laws, language, lack of information.</text><text x="55" y="547" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Pull factors are perceived: the city job hoped for can turn out</text><text x="55" y="571" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">to be work in the informal sector.</text>
</svg>