t="34" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="64" y="465" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">one work studied in translation</text><rect x="460" y="297" width="410" height="196" rx="14" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="480" y="333" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">HL essay</text><rect x="782.67" y="315" width="73.33" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="819.3349999999999" y="331" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">HL only</text><text x="480" y="359" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">Higher Level only</text><rect x="480" y="379" width="370" height="34" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="494" y="401" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">literary works</text><rect x="50" y="512" width="24" height="18" rx="3" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="82" y="527" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">literary works</text><rect x="241.04" y="512" width="24" height="18" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="273.03999999999996" y="527" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">work in the original language</text><text x="450" y="559" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Practise unseen poems, prose and drama beyond your set texts all course.</text>
