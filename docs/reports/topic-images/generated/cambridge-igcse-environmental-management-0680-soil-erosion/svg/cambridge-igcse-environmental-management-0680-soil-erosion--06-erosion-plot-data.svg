<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: soil lost from four plots</text>

<rect x="30" y="110" width="560" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="500" x2="570" y2="500" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="500" x2="120" y2="136" stroke="#1e2a44" stroke-width="3"/><line x1="112" y1="500" x2="120" y2="500" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="506" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="112" y1="444" x2="120" y2="444" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="450" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">2</text><line x1="122" y1="444" x2="570" y2="444" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="388" x2="120" y2="388" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="394" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">4</text><line x1="122" y1="388" x2="570" y2="388" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="332" x2="120" y2="332" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="338" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">6</text><line x1="122" y1="332" x2="570" y2="332" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="276" x2="120" y2="276" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="282" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">8</text><line x1="122" y1="276" x2="570" y2="276" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="220" x2="120" y2="220" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="226" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">10</text><line x1="122" y1="220" x2="570" y2="220" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="164" x2="120" y2="164" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="170" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">12</text><line x1="122" y1="164" x2="570" y2="164" stroke="#e3e9e8" stroke-width="1.5"/><text x="58" y="330" font-size="16" fill="#4a5568" text-anchor="middle" transform="rotate(-90 58 330)">soil lost (kg per m²)</text><rect x="150" y="164" width="72" height="336" fill="#a77b52" stroke="#1e2a44" stroke-width="2.5"/><text x="186" y="154" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">12.0</text><text x="186" y="526" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">Bare,</text><text x="186" y="545" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">up-down</text><rect x="255" y="348.79999999999995" width="72" height="151.20000000000002" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="291" y="338.79999999999995" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5.4</text><text x="291" y="526" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">Contour</text><text x="291" y="545" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">ploughed</text><rect x="360" y="449.6" width="72" height="50.4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="396" y="439.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1.8</text><text x="396" y="526" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">Terraced</text><rect x="465" y="483.2" width="72" height="16.8" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><text x="501" y="473.2" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">0.6</text><text x="501" y="526" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">Grass</text><text x="501" y="545" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">cover</text><text x="580" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented data, same slope</text><rect x="610" y="110" width="260" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="632" y="148" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Contour vs bare</text><text x="632" y="174" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(12.0 − 5.4) ÷ 12.0</text><text x="632" y="195" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">× 100 = 55% less</text><text x="632" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Grass vs bare</text><text x="632" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(12.0 − 0.6) ÷ 12.0</text><text x="632" y="283" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">× 100 = 95% less</text><text x="632" y="324" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ratio</text><text x="632" y="350" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">12.0 ÷ 0.6 = 20 times</text><text x="632" y="371" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as much from bare soil</text><text x="632" y="416" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Grass protects best:</text><text x="632" y="437" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">roots bind, leaves</text><text x="632" y="458" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">intercept rain. Terracing</text><text x="632" y="479" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">is next and still lets</text><text x="632" y="500" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">crops grow.</text><text x="632" y="560" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Repeat over several years:</text><text x="632" y="580" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">one wet year may skew</text><text x="632" y="600" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">results.</text>
</svg>