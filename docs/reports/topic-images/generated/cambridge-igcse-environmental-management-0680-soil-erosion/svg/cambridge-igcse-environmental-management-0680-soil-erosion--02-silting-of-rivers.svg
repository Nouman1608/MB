<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Silting of rivers</text>

<rect x="30" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Before</text><path d="M50,200 L120,200 Q150,360 235,360 Q320,360 350,200 L420,200 L420,410 L50,410 Z" fill="#a77b52" stroke="#1e2a44" stroke-width="2.5"/><clipPath id="ch30"><path d="M126,220 Q155,356 235,356 Q315,356 344,220 Z"/></clipPath><path d="M126,220 Q155,356 235,356 Q315,356 344,220 Z" fill="#b5d3cf"/><line x1="126" y1="220" x2="344" y2="220" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="190" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">deep channel, clear water</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">After eroded soil arrives</text><path d="M480,200 L550,200 Q580,360 665,360 Q750,360 780,200 L850,200 L850,410 L480,410 Z" fill="#a77b52" stroke="#1e2a44" stroke-width="2.5"/><clipPath id="ch460"><path d="M556,220 Q585,356 665,356 Q745,356 774,220 Z"/></clipPath><path d="M556,220 Q585,356 665,356 Q745,356 774,220 Z" fill="#9fb7a9"/><rect x="550" y="300" width="230" height="70" fill="#efdfa8" clip-path="url(#ch460)"/><line x1="580" y1="300" x2="750" y2="300" stroke="#1e2a44" stroke-width="2"/><circle cx="590" cy="234" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="613" cy="245" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="636" cy="256" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="659" cy="267" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="682" cy="278" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="705" cy="239" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="728" cy="250" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="601" cy="261" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="624" cy="272" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="647" cy="283" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="670" cy="244" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="693" cy="255" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="716" cy="266" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="739" cy="277" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="612" cy="238" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="635" cy="249" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="658" cy="260" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="681" cy="271" r="2" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><rect x="561.35" y="321.275" width="207.29999999999998" height="20.925" rx="5" fill="#efdfa8" opacity="1"/><text x="665" y="336" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">silt on the river bed</text><line x1="556" y1="220" x2="774" y2="220" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="190" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">shallower channel, cloudy water</text><text x="450" y="476" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Effects of silting</text><rect x="30" y="494" width="270" height="100" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="527.725" font-size="18.5" font-weight="700" fill="#b5602e" text-anchor="start">Holds less water</text><text x="48" y="552.525" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so flooding is more likely</text><rect x="315" y="494" width="270" height="100" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="333" y="527.725" font-size="18.5" font-weight="700" fill="#b5602e" text-anchor="start">Reservoirs silt up</text><text x="333" y="552.525" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so they store less water</text><rect x="600" y="494" width="270" height="100" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="527.725" font-size="18.5" font-weight="700" fill="#b5602e" text-anchor="start">Cloudy water</text><text x="618" y="552.525" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">blocks light, harming</text><text x="618" y="573.645" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aquatic plants and animals</text>
