<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing up five strategies</text>

<text x="330" y="136" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Benefit</text><text x="670" y="136" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Limitation</text><rect x="30" y="152" width="170" height="84" rx="12" fill="#1e2a44"/><text x="115" y="200" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Terracing</text><rect x="210" y="152" width="240" height="84" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">works well on steep</text><text x="230" y="209" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">slopes</text><rect x="460" y="152" width="410" height="84" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">much labour to build and maintain; walls can</text><text x="480" y="209" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collapse if neglected</text><rect x="30" y="248" width="170" height="84" rx="12" fill="#1e2a44"/><text x="115" y="285" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Contour</text><text x="115" y="306" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">ploughing</text><rect x="210" y="248" width="240" height="84" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="296" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cheap</text><rect x="460" y="248" width="410" height="84" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less effective on very steep slopes or in</text><text x="480" y="305" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">very heavy rain</text><rect x="30" y="344" width="170" height="84" rx="12" fill="#1e2a44"/><text x="115" y="392" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Wind breaks</text><rect x="210" y="344" width="240" height="84" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">also provide wood and</text><text x="230" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">habitat</text><rect x="460" y="344" width="410" height="84" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">use land that could grow crops; take years</text><text x="480" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to grow</text><rect x="30" y="440" width="170" height="84" rx="12" fill="#1e2a44"/><text x="115" y="477" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Vegetation</text><text x="115" y="498" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">cover</text><rect x="210" y="440" width="240" height="84" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="488" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cheap and effective</text><rect x="460" y="440" width="410" height="84" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="476" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cover crops may compete with the main crop</text><text x="480" y="497" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for water</text><rect x="30" y="536" width="170" height="84" rx="12" fill="#1e2a44"/><text x="115" y="573" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Organic</text><text x="115" y="594" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">matter</text><rect x="210" y="536" width="240" height="84" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">improves fertility as</text><text x="230" y="593" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">well as structure</text><rect x="460" y="536" width="410" height="84" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="584" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bulky; needs a supply of manure or residue</text>
</svg>