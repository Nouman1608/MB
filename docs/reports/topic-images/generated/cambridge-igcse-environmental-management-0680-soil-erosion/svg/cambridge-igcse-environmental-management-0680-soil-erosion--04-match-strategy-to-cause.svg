<text x="180" y="136" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Problem</text><text x="610" y="136" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Strategies that fit</text><rect x="30" y="154" width="300" height="86" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="180" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Steep slopes and water</text><text x="180" y="213" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">erosion</text><line x1="334" y1="197" x2="364" y2="197" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="372" y="175" width="109.2" height="44" rx="22" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="426.6" y="202.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">terracing</text><rect x="491.2" y="175" width="179.60000000000002" height="44" rx="22" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="581" y="202.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">contour ploughing</text><rect x="680.8" y="175" width="74" height="44" rx="22" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="717.8" y="202.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">bunds</text><rect x="30" y="260" width="300" height="86" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="180" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Flat, dry, windy land</text><line x1="334" y1="303" x2="364" y2="303" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="372" y="281" width="126.80000000000001" height="44" rx="22" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="435.4" y="308.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">wind breaks</text><rect x="508.8" y="281" width="74" height="44" rx="22" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="545.8" y="308.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">bunds</text><rect x="592.8" y="281" width="170.8" height="44" rx="22" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="678.1999999999999" y="308.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">vegetation cover</text><rect x="30" y="366" width="300" height="86" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="180" y="416" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Bare soil after harvest</text><line x1="334" y1="409" x2="364" y2="409" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="372" y="387" width="250.00000000000003" height="44" rx="22" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="497" y="414.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">maintain vegetation cover</text><rect x="632" y="387" width="214.8" height="44" rx="22" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="739.4" y="414.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">mulch or crop residue</text><rect x="30" y="472" width="300" height="86" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="180" y="508" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Weak structure after years</text><text x="180" y="531" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">of monoculture</text><line x1="334" y1="515" x2="364" y2="515" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="372" y="493" width="188.4" height="44" rx="22" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="466.2" y="520.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">add organic matter</text><rect x="30" y="590" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="632" font-size="18" font-weight="700" fill="#1