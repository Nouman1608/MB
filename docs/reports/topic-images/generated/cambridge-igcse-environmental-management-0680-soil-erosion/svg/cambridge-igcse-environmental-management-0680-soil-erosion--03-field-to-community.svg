<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From the field to the community</text>

<rect x="150" y="110" width="600" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="196" cy="158" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="196" y="165.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="236" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Soil erosion</text><text x="236" y="182" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">fertile topsoil removed</text><line x1="450" y1="209" x2="450" y2="226" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="230" width="600" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="196" cy="278" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="196" y="285.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="236" y="272" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Lower crop yield</text><text x="236" y="302" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">soil holds fewer nutrients and less water</text><line x1="450" y1="329" x2="450" y2="346" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="350" width="600" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="196" cy="398" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="196" y="405.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="236" y="392" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Malnutrition and famine</text><text x="236" y="422" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">too little food where people rely on local harvests</text><line x1="450" y1="449" x2="450" y2="466" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="470" width="600" height="96" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><circle cx="196" cy="518" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="196" y="525.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="236" y="512" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Displacement of people</text><text x="236" y="542" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">they move to towns or other farmland, spreading the pressure</text><text x="450" y="620" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Show the links between impacts to strengthen an extended answer.</text>
</svg>