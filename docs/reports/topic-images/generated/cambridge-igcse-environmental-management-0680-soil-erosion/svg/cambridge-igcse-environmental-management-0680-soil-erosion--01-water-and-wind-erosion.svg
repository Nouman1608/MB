<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How water and wind remove soil</text>

<rect x="30" y="110" width="410" height="510" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="22" font-weight="700" fill="#2b5a9a" text-anchor="middle">Water erosion</text><rect x="50" y="165" width="370" height="250" fill="#e9eef6"/><path d="M50,240 L420,370 L420,415 L50,415 Z" fill="#a77b52" stroke="#1e2a44" stroke-width="2.5"/><path d="M102,206 Q86,206 87.6,190 Q89.19999999999999,172.4 110,175.6 Q118,151.6 146,156.4 Q170,142 186,170 Q214,170 212.4,191.6 Q214,206 198,206 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="110" y1="215" x2="105" y2="231" stroke="#2b5a9a" stroke-width="2.5"/><line x1="128" y1="223" x2="123" y2="239" stroke="#2b5a9a" stroke-width="2.5"/><line x1="146" y1="215" x2="141" y2="231" stroke="#2b5a9a" stroke-width="2.5"/><line x1="164" y1="223" x2="159" y2="239" stroke="#2b5a9a" stroke-width="2.5"/><line x1="182" y1="215" x2="177" y2="231" stroke="#2b5a9a" stroke-width="2.5"/><path d="M150,262 l-8,-12 M150,262 l0,-14 M150,262 l8,-12" fill="none" stroke="#2b5a9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="138" cy="252" r="3" fill="#a77b52" stroke="#a77b52" stroke-width="1"/><circle cx="162" cy="250" r="3" fill="#a77b52" stroke="#a77b52" stroke-width="1"/><path d="M190,284 Q280,318 360,346" fill="none" stroke="#2b5a9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="215" cy="292" r="4" fill="#a77b52" stroke="#1e2a44" stroke-width="1"/><circle cx="247" cy="303" r="4" fill="#a77b52" stroke="#1e2a44" stroke-width="1"/><circle cx="279" cy="314" r="4" fill="#a77b52" stroke="#1e2a44" stroke-width="1"/><circle cx="311" cy="325" r="4" fill="#a77b52" stroke="#1e2a44" stroke-width="1"/><circle cx="343" cy="336" r="4" fill="#a77b52" stroke="#1e2a44" stroke-width="1"/><path d="M300,340 l12,24 l12,-20" fill="#e9eef6" stroke="#1e2a44" stroke-width="2"/><circle cx="175" cy="238" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="175" y="243.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="280" cy="300" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="280" y="305.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="338" cy="378" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="338" y="383.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="50" y="448" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"> </text><text x="66" y="448" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1 Raindrop impact knocks particles loose</text><text x="66" y="469" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on bare ground</text><text x="50" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"> </text><text x="66" y="498" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2 Surface run-off: rain falls faster than</text><text x="66" y="519" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it soaks in, carrying particles; faster</text><text x="66" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on slopes</text><text x="50" y="569" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"> </text><text x="66" y="569" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">3 Run-off cuts channels that deepen into</text><text x="66" y="590" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gullies</text><rect x="460" y="110" width="410" height="510" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">Wind erosion</text><rect x="480" y="165" width="370" height="250" fill="#f6efd8"/><rect x="480" y="345" width="370" height="70" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><line x1="500" y1="230" x2="640" y2="230" stroke="#8a6d0d" stroke-width="7" marker-end="url(#ahO)"/><line x1="500" y1="270" x2="600" y2="270" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><circle cx="640" cy="250" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="669" cy="267" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="698" cy="284" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="727" cy="301" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="756" cy="318" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="785" cy="255" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="814" cy="272" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="653" cy="289" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="682" cy="306" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="711" cy="323" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="740" cy="260" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="769" cy="277" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="798" cy="294" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="827" cy="311" r="2.5" fill="#a77b52" stroke="#a77b52" stroke-width="0.5"/><circle cx="500" cy="360" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.2"/><circle cx="544" cy="360" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.2"/><circle cx="588" cy="360" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.2"/><circle cx="632" cy="360" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.2"/><circle cx="676" cy="360" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.2"/><circle cx="720" cy="360" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.2"/><circle cx="764" cy="360" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.2"/><circle cx="808" cy="360" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.2"/><rect x="656.35" y="185.275" width="207.29999999999998" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="760" y="200" font-size="15.5" font-weight="700" fill="#8a6d0d" text-anchor="middle">fine particles lifted</text><rect x="514.85" y="377.275" width="300.3" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="665" y="392" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">coarser, less fertile soil left</text><text x="490" y="456" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Happens where soil is</text><rect x="490" y="470" width="108" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="544" y="495.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">dry</text><rect x="610" y="470" width="108" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="495.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">loose</text><rect x="730" y="470" width="108" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="784" y="495.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">fine</text><text x="490" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and the land is flat and open with</text><text x="490" y="561" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strong winds. The lightest particles</text><text x="490" y="582" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">carried away include much of the</text><text x="490" y="603" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">organic matter.</text><rect x="30" y="640" width="840" height="70" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="682" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Both depend on unprotected soil: plants shield the surface and roots hold it together.</text>
</svg>