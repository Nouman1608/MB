<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 691" width="900" height="691" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="691" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From the failed plan to stalemate</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">1914</text>
<rect x="30" y="124" width="196.5" height="163" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="185.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Belgian resistance</text><text x="45" y="214.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">At Liège and</text><text x="45" y="235.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">elsewhere: delay.</text><rect x="244.5" y="124" width="196.5" height="163" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="259.5" y="164.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The BEF at Mons</text><text x="259.5" y="193.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">23 August 1914.</text><text x="259.5" y="214.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain had</text><text x="259.5" y="235.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">guaranteed Belgian</text><text x="259.5" y="256.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">neutrality in 1839.</text><rect x="459" y="124" width="196.5" height="163" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="153.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Russia mobilised</text><text x="474" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">faster</text><text x="474" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Troops moved east</text><text x="474" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Tannenberg); the</text><text x="474" y="246.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">western sweep</text><text x="474" y="267.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">weakened.</text><rect x="673.5" y="124" width="196.5" height="163" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="688.5" y="175.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Moltke's changes</text><text x="688.5" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Left wing</text><text x="688.5" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">strengthened at the</text><text x="688.5" y="245.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expense of the right.</text><line x1="450" y1="295" x2="450" y2="331" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="60" y1="361" x2="60" y2="639" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="341" width="766" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="373.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Battle of the Marne, September 1914</text><text x="122" y="402.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Germans swing east of Paris; French and British counter-attack into the gap between two</text><text x="122" y="423.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">German armies. Germans retreat to the River Aisne and dig in.</text><circle cx="60" cy="393.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="402.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="458" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="490.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The race to the sea</text><text x="122" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each side tries to outflank the other to the north; First Battle of Ypres.</text><circle cx="60" cy="500" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="508.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="554" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="586.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">End of 1914: a line of trenches</text><text x="122" y="615.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From the Channel coast to the Swiss border. Neither side could go round, only try to break</text><text x="122" y="636.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">through.</text><circle cx="60" cy="606.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="615.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
</svg>