<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Verdun, the Somme and Passchendaele</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="452" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="136.74418604651163" height="49" fill="#b5d3cf"/><rect x="166.74418604651163" y="100" width="234.4186046511628" height="49" fill="#f2e7b8"/><text x="180.74418604651163" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Verdun, 1916</text><rect x="401.16279069767444" y="100" width="234.4186046511628" height="49" fill="#b5d3cf"/><text x="415.16279069767444" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Somme, 1916</text><rect x="635.5813953488373" y="100" width="234.4186046511628" height="49" fill="#b5d3cf"/><text x="649.5813953488373" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Passchendaele, 1917</text><rect x="30" y="149" width="136.74418604651163" height="68" fill="#dce9e7"/><text x="44" y="175.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Commander</text><rect x="166.74418604651163" y="149" width="234.4186046511628" height="68" fill="#ffffff"/><text x="180.74418604651163" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Falkenhayn (attack); Pétain</text><text x="180.74418604651163" y="196.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(French defence)</text><rect x="401.16279069767444" y="149" width="234.4186046511628" height="68" fill="#ffffff"/><text x="415.16279069767444" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Haig</text><rect x="635.5813953488373" y="149" width="234.4186046511628" height="68" fill="#ffffff"/><text x="649.5813953488373" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Haig</text><line x1="30" y1="217" x2="870" y2="217" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="217" width="136.74418604651163" height="110" fill="#dce9e7"/><text x="44" y="243.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Aim</text><rect x="166.74418604651163" y="217" width="234.4186046511628" height="110" fill="#f8faf9"/><text x="180.74418604651163" y="243.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Bleed France white" at a</text><text x="180.74418604651163" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">symbolic fortress</text><rect x="401.16279069767444" y="217" width="234.4186046511628" height="110" fill="#f8faf9"/><text x="415.16279069767444" y="243.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Relieve Verdun; break</text><text x="415.16279069767444" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through; wear down the</text><text x="415.16279069767444" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Germans</text><rect x="635.5813953488373" y="217" width="234.4186046511628" height="110" fill="#f8faf9"/><text x="649.5813953488373" y="243.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Break out of the Ypres</text><text x="649.5813953488373" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">salient; reach U-boat</text><text x="649.5813953488373" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bases; relieve the French</text><text x="649.5813953488373" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">army</text><line x1="30" y1="327" x2="870" y2="327" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="327" width="136.74418604651163" height="89" fill="#dce9e7"/><text x="44" y="353.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Key events</text><rect x="166.74418604651163" y="327" width="234.4186046511628" height="89" fill="#ffffff"/><text x="180.74418604651163" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Voie Sacrée supply road;</text><text x="180.74418604651163" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"They shall not pass"</text><rect x="401.16279069767444" y="327" width="234.4186046511628" height="89" fill="#ffffff"/><text x="415.16279069767444" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Week-long bombardment;</text><text x="415.16279069767444" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1 July; tanks on 15</text><text x="415.16279069767444" y="395.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">September</text><rect x="635.5813953488373" y="327" width="234.4186046511628" height="89" fill="#ffffff"/><text x="649.5813953488373" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Messines mines (June);</text><text x="649.5813953488373" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rain and deep mud;</text><text x="649.5813953488373" y="395.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Canadians take the village</text><line x1="30" y1="416" x2="870" y2="416" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="416" width="136.74418604651163" height="68" fill="#dce9e7"/><text x="44" y="442.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Result</text><rect x="166.74418604651163" y="416" width="234.4186046511628" height="68" fill="#f8faf9"/><text x="180.74418604651163" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">France held Verdun; army</text><text x="180.74418604651163" y="463.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">badly weakened</text><rect x="401.16279069767444" y="416" width="234.4186046511628" height="68" fill="#f8faf9"/><text x="415.16279069767444" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A few miles gained</text><rect x="635.5813953488373" y="416" width="234.4186046511628" height="68" fill="#f8faf9"/><text x="649.5813953488373" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A few miles gained</text><line x1="30" y1="484" x2="870" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="484" width="136.74418604651163" height="68" fill="#dce9e7"/><text x="44" y="510.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Cost</text><rect x="166.74418604651163" y="484" width="234.4186046511628" height="68" fill="#ffffff"/><text x="180.74418604651163" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hundreds of thousands on</text><text x="180.74418604651163" y="531.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">both sides</text><rect x="401.16279069767444" y="484" width="234.4186046511628" height="68" fill="#ffffff"/><text x="415.16279069767444" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">About 57,000 British</text><text x="415.16279069767444" y="531.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">casualties on day one</text><rect x="635.5813953488373" y="484" width="234.4186046511628" height="68" fill="#ffffff"/><text x="649.5813953488373" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hundreds of thousands</text></g><line x1="166.74418604651163" y1="100" x2="166.74418604651163" y2="552" stroke="#c9d6d4" stroke-width="1.5"/><line x1="401.16279069767444" y1="100" x2="401.16279069767444" y2="552" stroke="#c9d6d4" stroke-width="1.5"/><line x1="635.5813953488373" y1="100" x2="635.5813953488373" y2="552" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="452" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>