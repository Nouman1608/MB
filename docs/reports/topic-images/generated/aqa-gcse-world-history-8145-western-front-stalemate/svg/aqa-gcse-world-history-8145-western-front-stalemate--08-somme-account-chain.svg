<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 714" width="900" height="714" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 3: an account that links</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How the Battle of the Somme developed in 1916</text>
<rect x="30" y="124" width="840" height="47" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">French under extreme pressure at Verdun</text><line x1="160" y1="169" x2="160" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="185" y="173" width="42.768" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="206.38400000000001" y="193.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">so</text><rect x="30" y="211" width="840" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="239.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Haig agrees to an offensive on the Somme</text><line x1="160" y1="256" x2="160" y2="292" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="185" y="260" width="100.32" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="235.16" y="280.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">this led to</text><rect x="30" y="298" width="840" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="326.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Week-long bombardment; defences survive</text><line x1="160" y1="343" x2="160" y2="379" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="185" y="347" width="104.304" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="237.152" y="367.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">as a result</text><rect x="30" y="385" width="840" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="413.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1 July: about 57,000 casualties</text><line x1="160" y1="430" x2="160" y2="466" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="185" y="434" width="240.896" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="305.448" y="454.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">instead of breaking through</text><rect x="30" y="472" width="840" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="500.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Attrition through summer and autumn; tanks on 15 September</text><line x1="160" y1="517" x2="160" y2="553" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="185" y="521" width="124.336" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="247.168" y="541.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">which meant</text><rect x="30" y="559" width="840" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="587.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">November: a few miles gained, German army weakened</text><rect x="30" y="624" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="657.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Each step is joined by a cause or consequence: that is what a narrative account rewards.</text>
</svg>