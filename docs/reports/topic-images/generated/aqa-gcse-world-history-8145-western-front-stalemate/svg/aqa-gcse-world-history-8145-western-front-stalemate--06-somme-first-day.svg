<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">1 July 1916: why the first day failed</text>

<rect x="30" y="100" width="249.33333333333334" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="141" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PLAN</text><text x="50" y="167.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Week-long</text><text x="50" y="191.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">bombardment</text><text x="50" y="220.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Meant to destroy the</text><text x="50" y="241.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">German defences.</text><line x1="285.33333333333337" y1="187.5" x2="319.33333333333337" y2="187.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="100" width="249.33333333333334" height="175" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="345.33333333333337" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BUT</text><text x="345.33333333333337" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Defences survived</text><text x="345.33333333333337" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many shells failed to</text><text x="345.33333333333337" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">explode; wire often left</text><text x="345.33333333333337" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">uncut; Germans sheltered</text><text x="345.33333333333337" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in deep dugouts.</text><line x1="580.6666666666667" y1="187.5" x2="614.6666666666667" y2="187.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="100" width="249.33333333333334" height="175" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="640.6666666666667" y="151.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">1 JULY</text><text x="640.6666666666667" y="178.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Advance at walking</text><text x="640.6666666666667" y="202.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">pace</text><text x="640.6666666666667" y="231.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Into machine-gun fire.</text><text x="30" y="309" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">BRITISH CASUALTIES ON THE FIRST DAY (bar to scale)</text><rect x="30" y="323" width="840" height="64" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="323" width="294.7368421052632" height="64" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="177.3684210526316" y="363" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">nearly 20,000 killed</text><text x="597.3684210526317" y="363" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">about 57,000 casualties in all</text><text x="450" y="417" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The worst day in the history of the British army</text><rect x="30" y="443" width="411" height="109" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="477.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Critics</text><text x="50" y="506.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Allies advanced only a few miles; Haig called a</text><text x="50" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"butcher".</text><rect x="459" y="443" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="477.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Defenders</text><text x="479" y="506.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Relieved Verdun; taught lessons used in 1918;</text><text x="479" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heavy losses for a stretched German army.</text>
</svg>