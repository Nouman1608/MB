<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Schlieffen Plan</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Avoiding a war on two fronts</text>
<rect x="30" y="124" width="840" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="254" width="480" height="270" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="300" y="154" width="240" height="82" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="570" y="154" width="170" height="370" rx="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><rect x="770" y="154" width="80" height="370" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">FRANCE</text><text x="320" y="186" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">BELGIUM</text><text x="320" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">neutral</text><text x="655" y="188" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">GERMANY</text><text transform="translate(817,339) rotate(-90)" text-anchor="middle" font-size="20" font-weight="700" fill="#1e2a44">RUSSIA</text><circle cx="250" cy="399" r="11" fill="#1e2a44"/><text x="250" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paris</text><rect x="512" y="299" width="14" height="14" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="512" y="344" width="14" height="14" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="512" y="389" width="14" height="14" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="512" y="434" width="14" height="14" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="500" y="509" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">border forts (avoided)</text><path d="M660,224 L470,224 C250,224 120,304 130,404 C140,494 290,494 360,424" fill="none" stroke="#b5602e" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><line x1="700" y1="424" x2="795" y2="424" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)" stroke-dasharray="9 7"/><text x="655" y="474" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">then turn</text><text x="655" y="494" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">east</text><line x1="40" y1="572" x2="100" y2="572" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><text x="112" y="578" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">main German force: through Belgium, round Paris</text><text x="870" y="578" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Schematic, not to scale</text><text x="30" y="616" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">THE TWO ASSUMPTIONS (1905)</text><rect x="230" y="634" width="560" height="40" rx="8" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="30" y="661" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Russia</text><text x="510" y="661" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">mobilises: about six weeks (vast size, poor railways)</text><rect x="230" y="686" width="560" height="40" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="30" y="713" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">France</text><text x="510" y="713" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">defeated in that time</text>
</svg>