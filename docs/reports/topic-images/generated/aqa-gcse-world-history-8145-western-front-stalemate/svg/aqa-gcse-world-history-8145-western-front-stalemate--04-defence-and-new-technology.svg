<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 848" width="900" height="848" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="848" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why defence was stronger than attack</text>

<rect x="30" y="100" width="411" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="127" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MACHINE GUNS</text><text x="45" y="153.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cut down infantry</text><text x="45" y="181.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Advancing troops fell in large numbers.</text><rect x="459" y="100" width="411" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="127" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BARBED WIRE</text><text x="474" y="153.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Slowed attackers</text><text x="474" y="181.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Held them in the open.</text><rect x="30" y="219" width="411" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="246" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ARTILLERY</text><text x="45" y="272.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Most casualties</text><text x="45" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">But long bombardments warned the enemy and</text><text x="45" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">churned the ground into craters.</text><rect x="459" y="219" width="411" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="246" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RAILWAYS</text><text x="474" y="272.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reserves rushed in</text><text x="474" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Faster than attackers could advance on foot.</text><text x="30" y="371" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">ATTEMPTS TO BREAK THE DEADLOCK</text><clipPath id="tc389"><rect x="30" y="389" width="840" height="300" rx="14"/></clipPath><g clip-path="url(#tc389)"><rect x="30" y="389" width="243.8709677419355" height="49" fill="#b5d3cf"/><text x="44" y="417.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Development</text><rect x="273.8709677419355" y="389" width="596.1290322580646" height="49" fill="#b5d3cf"/><text x="287.8709677419355" y="417.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Details</text><rect x="30" y="438" width="243.8709677419355" height="68" fill="#dce9e7"/><text x="44" y="464.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Gas</text><rect x="273.8709677419355" y="438" width="596.1290322580646" height="68" fill="#ffffff"/><text x="287.8709677419355" y="464.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">German chlorine at the Second Battle of Ypres, April 1915; then phosgene</text><text x="287.8709677419355" y="485.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and mustard gas; gas masks issued. Could blow back on attackers.</text><line x1="30" y1="506" x2="870" y2="506" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="506" width="243.8709677419355" height="68" fill="#dce9e7"/><text x="44" y="532.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Tanks</text><rect x="273.8709677419355" y="506" width="596.1290322580646" height="68" fill="#f8faf9"/><text x="287.8709677419355" y="532.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First used by the British on the Somme, September 1916; early models slow</text><text x="287.8709677419355" y="553.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and unreliable.</text><line x1="30" y1="574" x2="870" y2="574" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="574" width="243.8709677419355" height="47" fill="#dce9e7"/><text x="44" y="600.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Aircraft</text><rect x="273.8709677419355" y="574" width="596.1290322580646" height="47" fill="#ffffff"/><text x="287.8709677419355" y="600.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reconnaissance and artillery spotting, then fighting.</text><line x1="30" y1="621" x2="870" y2="621" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="621" width="243.8709677419355" height="68" fill="#dce9e7"/><text x="44" y="647.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Tactics</text><rect x="273.8709677419355" y="621" width="596.1290322580646" height="68" fill="#f8faf9"/><text x="287.8709677419355" y="647.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Creeping barrage: infantry advanced close behind a line of shellfire; later</text><text x="287.8709677419355" y="668.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">combined artillery, infantry, tanks and aircraft.</text></g><line x1="273.8709677419355" y1="389" x2="273.8709677419355" y2="689" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="389" width="840" height="300" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="705" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="739.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Attrition</text><text x="50" y="769.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">When breakthroughs failed, commanders tried to wear down the enemy's manpower and</text><text x="50" y="791.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">resources: enormous casualties for small gains.</text>
</svg>