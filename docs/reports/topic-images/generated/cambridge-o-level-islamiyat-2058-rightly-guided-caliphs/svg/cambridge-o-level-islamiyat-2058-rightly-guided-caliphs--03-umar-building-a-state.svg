<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 581" width="900" height="581" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="581" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Umar: building a state</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Amir al-Mu'minin, "Commander of the Faithful", 634–644</text>
<line x1="350" y1="214" x2="412" y2="253.9" stroke="#1e2a44" stroke-width="2.5"/><line x1="350" y1="358.5" x2="412" y2="297.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="550" y1="194" x2="488" y2="247.9" stroke="#1e2a44" stroke-width="2.5"/><line x1="550" y1="348" x2="488" y2="294.1" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="271" r="76" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="265.54" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Umar</text><text x="450" y="291.16" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">634–644</text><rect x="30" y="133.5" width="320" height="161" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="161.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPANSION</text><text x="46" y="186.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Syria, Iraq, Jerusalem, Egypt,</text><text x="46" y="207.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Persia</text><text x="46" y="234.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Yarmuk (636), Qadisiyya and Ctesiphon,</text><text x="46" y="254.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Jerusalem by treaty, Egypt under Amr</text><text x="46" y="274.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ibn al-As, Nahawand (642)</text><rect x="30" y="308.5" width="320" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="336.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELIGION</text><text x="46" y="361.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tarawih in congregation</text><text x="46" y="388.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gathered Muslims in Ramadan</text><rect x="550" y="124" width="320" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="566" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADMINISTRATION</text><text x="566" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Institutions</text><text x="566" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Governors; qadis separate from</text><text x="566" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">governors; bayt al-mal; diwan; Kufa,</text><text x="566" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Basra, Fustat; Hijri calendar</text><rect x="550" y="278" width="320" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="566" y="306" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACCOUNTABILITY</text><text x="566" y="331.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Checks on the powerful</text><text x="566" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Recorded governors' wealth; heard</text><text x="566" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">complaints in public; dismissed Khalid</text><text x="566" y="398" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">from overall command</text><rect x="30" y="440" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="474.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Leadership lesson</text><text x="50" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Justice applied to the powerful as strictly as to the weak. He lived simply and patrolled Madinah at night</text><text x="50" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to learn people's needs.</text>
</svg>