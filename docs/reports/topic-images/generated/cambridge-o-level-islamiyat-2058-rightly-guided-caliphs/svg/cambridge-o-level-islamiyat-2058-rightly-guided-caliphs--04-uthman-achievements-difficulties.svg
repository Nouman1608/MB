<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 571" width="900" height="571" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="571" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Uthman: achievements and difficulties</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Give both sides, 644–656</text>
<rect x="30" y="124" width="412" height="284" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACHIEVEMENTS</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Growth</text><text x="50" y="212.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chosen by the council of six through Abd</text><text x="65.2" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">al-Rahman ibn Awf</text><text x="50" y="260.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Expansion into North Africa, Armenia and the</text><text x="65.2" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rest of Persia</text><text x="50" y="308.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">First navy under Mu'awiya; Cyprus taken</text><text x="50" y="335.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Standard copies of the Qur'an from Hafsa's</text><text x="65.2" y="356.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">copy</text><text x="50" y="383.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Enlarged the Prophet's Mosque in Madinah</text><rect x="458" y="124" width="412" height="284" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DIFFICULTIES</text><text x="478" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Division</text><text x="478" y="212.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Relatives from the Umayyad clan made</text><text x="493.2" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">governors, such as Mu'awiya in Syria</text><text x="478" y="260.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Critics accused them of injustice</text><text x="478" y="287.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="287.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Complaints from Egypt, Kufa and Basra</text><text x="478" y="314.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="314.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rebels besieged his house</text><text x="478" y="341.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Killed in 656 while reading the Qur'an</text><rect x="30" y="430" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="464.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Leadership lesson</text><text x="50" y="493.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Generosity and restraint: he refused to let Companions fight for him. But appointing relatives fuelled</text><text x="50" y="514.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">distrust, even where they were capable.</text>
</svg>