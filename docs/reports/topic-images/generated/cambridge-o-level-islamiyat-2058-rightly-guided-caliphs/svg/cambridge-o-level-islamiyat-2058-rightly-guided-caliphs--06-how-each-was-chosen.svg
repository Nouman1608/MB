<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 567" width="900" height="567" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="567" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How each caliph was chosen</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Different methods, all with consultation or public consent</text>
<rect x="30" y="124" width="201" height="189" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ABU BAKR</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Discussion and</text><text x="46" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">pledge</text><text x="46" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Debate at the Saqifa;</text><text x="46" y="250.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Umar pledged first,</text><text x="46" y="271.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">then the people in the</text><text x="46" y="292.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mosque</text><rect x="243" y="124" width="201" height="189" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="259" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UMAR</text><text x="259" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nomination</text><text x="259" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Abu Bakr nominated</text><text x="259" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">him after consulting</text><text x="259" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">senior Companions</text><rect x="456" y="124" width="201" height="189" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UTHMAN</text><text x="472" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A council of six</text><text x="472" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Abd al-Rahman ibn</text><text x="472" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Awf consulted widely</text><text x="472" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in Madinah</text><rect x="669" y="124" width="201" height="189" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="685" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ALI</text><text x="685" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Chosen in Madinah</text><text x="685" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">After Uthman's death,</text><text x="685" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">at a time of great</text><text x="685" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">confusion</text><rect x="30" y="335" width="840" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="367" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THE COUNCIL OF SIX (appointed by Umar)</text><text x="450" y="399.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Uthman · Ali · Abd al-Rahman ibn Awf · Sa'd ibn Abi Waqqas · al-Zubayr · Talha</text><rect x="30" y="446" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="480.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Model for government today</text><text x="450" y="510.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Leaders chosen with consultation and public consent.</text>
</svg>