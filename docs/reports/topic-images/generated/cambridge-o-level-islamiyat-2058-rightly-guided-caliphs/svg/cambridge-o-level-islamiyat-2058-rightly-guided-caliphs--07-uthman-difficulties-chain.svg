<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 792" width="900" height="792" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="792" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Answer plan: Uthman's difficulties</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A chain of cause and effect [10]</text>
<rect x="130" y="124" width="640" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="151.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A large empire with new Muslims and growing wealth</text><line x1="450" y1="173" x2="450" y2="195" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="198" width="640" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="225.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Disputes over recitation: resolved by standardisation, though some</text><text x="450" y="247.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">objected to burning other copies</text><line x1="450" y1="269" x2="450" y2="291" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="294" width="640" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="321.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Criticism of relatives such as Mu'awiya appointed as governors</text><line x1="450" y1="343" x2="450" y2="365" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="368" width="640" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="395.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Complaints from Egypt, Kufa and Basra; delegations heard, changes</text><text x="450" y="417.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">promised</text><line x1="450" y1="439" x2="450" y2="461" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="464" width="640" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="491.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A letter alleged to order punishment of the Egyptian delegation turned them</text><text x="450" y="513.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">back</text><line x1="450" y1="535" x2="450" y2="557" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="560" width="640" height="46" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="587.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Siege of his house; he refused to allow fighting on his behalf</text><line x1="450" y1="609" x2="450" y2="631" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="634" width="640" height="46" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="661.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Killed in 656 while reading the Qur'an</text><rect x="30" y="702" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="735.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Explain each difficulty as a cause of the next, and include his response.</text>
</svg>