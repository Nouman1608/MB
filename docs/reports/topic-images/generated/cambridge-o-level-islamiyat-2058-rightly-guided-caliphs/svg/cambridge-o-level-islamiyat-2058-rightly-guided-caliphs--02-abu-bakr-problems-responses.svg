<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 729" width="900" height="729" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="729" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Abu Bakr: problem and response</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Holding the community together, 632–634</text>
<text x="195" y="138" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">PROBLEM</text><text x="645" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RESPONSE</text><rect x="30" y="152" width="330" height="78" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Prophet (pbuh) dies; a leader is</text><text x="50" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">needed</text><rect x="410" y="152" width="460" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Discussion at the Saqifa of Banu Sa'ida; Umar pledges</text><text x="430" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">allegiance, then the people in the mosque</text><line x1="366" y1="191" x2="402" y2="191" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="242" width="330" height="78" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="274.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Danger at home; Usama's army</text><text x="50" y="295.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prepared</text><rect x="410" y="242" width="460" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="274.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sends it anyway: he would not undo what the Prophet</text><text x="430" y="295.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">had decided</text><line x1="366" y1="281" x2="402" y2="281" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="332" width="330" height="78" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tribes refuse zakat; false prophets</text><text x="50" y="385.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Musaylima, Tulayha, Sajah)</text><rect x="410" y="332" width="460" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ridda wars: fights anyone separating prayer from</text><text x="430" y="385.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">zakat; Khalid wins at Yamama</text><line x1="366" y1="371" x2="402" y2="371" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="422" width="330" height="76" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="464.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many huffaz die at Yamama</text><rect x="410" y="422" width="460" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="464.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Zayd ibn Thabit collects the Qur'an into one copy</text><line x1="366" y1="460" x2="402" y2="460" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="510" width="330" height="76" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="552.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Succession before his death in 634</text><rect x="410" y="510" width="460" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="552.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consults senior Companions and nominates Umar</text><line x1="366" y1="548" x2="402" y2="548" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="608" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="642.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Leadership lesson</text><text x="50" y="672.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Firmness on principle combined with humility and accountability.</text>
</svg>