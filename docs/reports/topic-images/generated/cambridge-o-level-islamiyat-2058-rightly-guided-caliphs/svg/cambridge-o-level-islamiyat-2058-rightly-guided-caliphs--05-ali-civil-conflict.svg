<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 719" width="900" height="719" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="719" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ali: leading through civil conflict</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Camel 656, Siffin 657, Nahrawan 658</text>
<line x1="60" y1="144" x2="60" y2="556" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="150.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">656: Chosen in Madinah</text><text x="116" y="178.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">At a time of great confusion after Uthman's death</text><circle cx="60" cy="159.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="168.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="203" width="766" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="229.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">656: Battle of the Camel, near Basra</text><text x="116" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aisha, Talha and al-Zubayr demanded immediate punishment of Uthman's killers; Ali wanted</text><text x="116" y="278.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">order first. Aisha sent back to Madinah with respect</text><circle cx="60" cy="249" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="257.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="303" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="329.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Capital moved to Kufa</text><circle cx="60" cy="324.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="333.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="354" width="766" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="380.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">657: Siffin and arbitration</text><text x="116" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mu'awiya's soldiers raised copies of the Qur'an on spears; Abu Musa al-Ash'ari and Amr ibn al-As</text><text x="116" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">as arbiters</text><circle cx="60" cy="400" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="408.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="454" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="480.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">658: Nahrawan</text><text x="116" y="508.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Kharijites rejected arbitration ("judgement belongs to God alone") and were defeated</text><circle cx="60" cy="489.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="498.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="533" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="559.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">661: Struck by Ibn Muljam in the mosque at Kufa</text><circle cx="60" cy="554.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="563.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="30" y="598" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="632.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Leadership lesson</text><text x="50" y="662.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Keeping to principle in a crisis, and preferring negotiation to further bloodshed.</text>
</svg>