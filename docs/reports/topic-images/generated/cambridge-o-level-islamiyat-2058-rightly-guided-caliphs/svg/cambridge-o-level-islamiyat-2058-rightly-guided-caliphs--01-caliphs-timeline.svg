<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Rightly Guided Caliphs, 632–661</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Bar lengths show years of rule, to scale</text>
<rect x="50" y="154" width="55.172413793103445" height="44" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="105.17241379310344" y="154" width="275.86206896551727" height="44" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="243.10344827586206" y="183" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Umar</text><rect x="381.0344827586207" y="154" width="331.0344827586207" height="44" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="546.551724137931" y="183" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Uthman</text><rect x="712.0689655172414" y="154" width="137.9310344827586" height="44" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="781.0344827586207" y="183" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ali</text><text x="50" y="142" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">632</text><line x1="50" y1="148" x2="50" y2="204" stroke="#1e2a44" stroke-width="2.5"/><text x="111.17241379310344" y="142" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">634</text><line x1="105.17241379310344" y1="148" x2="105.17241379310344" y2="204" stroke="#1e2a44" stroke-width="2.5"/><text x="381.0344827586207" y="142" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">644</text><line x1="381.0344827586207" y1="148" x2="381.0344827586207" y2="204" stroke="#1e2a44" stroke-width="2.5"/><text x="712.0689655172414" y="142" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">656</text><line x1="712.0689655172414" y1="148" x2="712.0689655172414" y2="204" stroke="#1e2a44" stroke-width="2.5"/><text x="850" y="142" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">661</text><line x1="850" y1="148" x2="850" y2="204" stroke="#1e2a44" stroke-width="2.5"/><text x="77.58620689655172" y="224" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Abu Bakr</text><rect x="30" y="250" width="201" height="235" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="276" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">632–634</text><text x="44" y="303.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Abu Bakr</text><text x="44" y="332" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="58.25" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Usama's army sent</text><text x="44" y="357" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="58.25" y="357" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ridda wars; Yamama</text><text x="44" y="382" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="58.25" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Qur'an collected into</text><text x="58.25" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">one copy</text><text x="44" y="427" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="58.25" y="427" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Campaigns into Iraq</text><text x="58.25" y="447" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and Syria</text><rect x="243" y="250" width="201" height="235" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="257" y="276" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">634–644</text><text x="257" y="303.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Umar</text><text x="257" y="332" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="271.25" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Yarmuk (636),</text><text x="271.25" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Qadisiyya, Jerusalem,</text><text x="271.25" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Egypt, Nahawand</text><text x="271.25" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(642)</text><text x="257" y="417" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="271.25" y="417" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Bayt al-mal, diwan,</text><text x="271.25" y="437" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">qadis</text><text x="257" y="462" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="271.25" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hijri calendar</text><rect x="456" y="250" width="201" height="235" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="470" y="276" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">644–656</text><text x="470" y="303.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Uthman</text><text x="470" y="332" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="484.25" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">North Africa, Armenia,</text><text x="484.25" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Persia</text><text x="470" y="377" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="484.25" y="377" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">First navy; Cyprus</text><text x="470" y="402" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="484.25" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Standard copies of</text><text x="484.25" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the Qur'an</text><text x="470" y="447" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="484.25" y="447" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Rebels besiege his</text><text x="484.25" y="467" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">house</text><rect x="669" y="250" width="201" height="235" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="683" y="276" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">656–661</text><text x="683" y="303.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ali</text><text x="683" y="332" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="697.25" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Camel (656)</text><text x="683" y="357" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="697.25" y="357" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Capital moved to Kufa</text><text x="683" y="382" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="697.25" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Siffin (657)</text><text x="683" y="407" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="697.25" y="407" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Nahrawan (658)</text>
