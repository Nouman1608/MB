<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One hidden curriculum, two readings</text>

<rect x="260" y="110" width="380" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The hidden curriculum</text><text x="450" y="175.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Bells, uniforms, rules, working for</text><text x="450" y="197.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">rewards</text><rect x="30" y="292" width="400" height="184" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="325" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTIONALISTS</text><text x="50" y="352" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Socialises pupils into shared</text><text x="50" y="378" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">values</text><text x="50" y="407.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pupils learn the norms and values that</text><text x="50" y="429.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">society shares.</text><rect x="470" y="292" width="400" height="184" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="490" y="325" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MARXISTS: BOWLES AND GINTIS (1976)</text><text x="490" y="352" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Prepares obedient workers for</text><text x="490" y="378" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">capitalism</text><text x="490" y="407.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Schooling in Capitalist America: school</text><text x="490" y="429.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">trains pupils to accept the discipline of</text><text x="490" y="451.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">work.</text><line x1="380" y1="228" x2="250" y2="284" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="520" y1="228" x2="650" y2="284" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="30" y="496" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="529.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Is it deliberate? Not usually: it is learned from routines and organisation, though some</text><text x="50" y="551.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rules are designed to teach discipline.</text>
</svg>