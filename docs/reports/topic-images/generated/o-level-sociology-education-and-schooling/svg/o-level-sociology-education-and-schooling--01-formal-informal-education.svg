<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Formal and informal education</text>

<text x="195" y="126" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Formal</text><text x="705" y="126" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Informal</text><rect x="30" y="144" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="182.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Schools, colleges and universities</text><rect x="540" y="144" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Anywhere: home, community, media,</text><text x="705" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">workplace</text><rect x="378" y="159" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Where?</text><line x1="360" y1="178" x2="378" y2="178" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="178" x2="540" y2="178" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="224" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="251.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Planned, structured curriculum</text><rect x="540" y="224" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="251.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Unplanned, everyday learning</text><rect x="378" y="228" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="253" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Planned?</text><line x1="360" y1="247" x2="378" y2="247" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="247" x2="540" y2="247" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="282" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="309.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Trained teachers</text><rect x="540" y="282" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="309.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Parents, elders, peers, media</text><rect x="378" y="286" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="311" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Who teaches?</text><line x1="360" y1="305" x2="378" y2="305" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="305" x2="540" y2="305" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="340" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="367.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Tests and certificates</text><rect x="540" y="340" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="367.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Not formally assessed</text><rect x="378" y="344" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="369" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Assessed?</text><line x1="360" y1="363" x2="378" y2="363" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="363" x2="540" y2="363" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="398" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="436.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Studying for O Level examinations</text><rect x="540" y="398" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="425.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Learning to cook, pray or bargain</text><text x="705" y="447.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">in a market from family</text><rect x="378" y="413" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="438" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Example</text><line x1="360" y1="432" x2="378" y2="432" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="432" x2="540" y2="432" stroke="#1e2a44" stroke-width="2.5"/>
</svg>