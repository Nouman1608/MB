<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 637" width="900" height="637" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="637" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who decides what is learned?</text>

<text x="30" y="124" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">◀ Adults decide</text><text x="870" y="124" font-size="19" font-weight="700" fill="#b5602e" text-anchor="end">Child decides ▶</text><line x1="70" y1="280" x2="830" y2="280" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="60" y="322" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start"></text><text x="840" y="322" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end"></text><circle cx="100" cy="280" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="100" y1="269" x2="100" y2="256" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,168)"><rect x="30" y="0" width="230" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Conventional school</text><text x="145" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Set curriculum, trained</text><text x="145" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">teachers</text></g><circle cx="331" cy="280" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="331" y1="291" x2="331" y2="350" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,350)"><rect x="216" y="0" width="230" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="331" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Homeschooling</text><text x="331" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Usually a curriculum,</text><text x="331" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">taught by parents at home</text></g><circle cx="562" cy="280" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="562" y1="269" x2="562" y2="256" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,148)"><rect x="447" y="0" width="230" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="562" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Progressive schooling</text><text x="562" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Child-centred; Summerhill</text><text x="562" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(1921) pupils choose</text><text x="562" y="92" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">whether to attend lessons</text></g><circle cx="800" cy="280" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="800" y1="291" x2="800" y2="350" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,350)"><rect x="640" y="0" width="230" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="755" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Unschooling</text><text x="755" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">No set curriculum; child</text><text x="755" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">follows interests</text></g><rect x="30" y="456" width="410" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="491.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Online learning</text><text x="50" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Courses over the internet. Flexible, but</text><text x="50" y="540.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">needs devices and reliable internet;</text><text x="50" y="561.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">COVID-19 closures (2020–2021) exposed the</text><text x="50" y="582.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">digital divide.</text><rect x="460" y="456" width="410" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="491.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Vocational learning</text><text x="480" y="519.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Training for specific jobs. Practical and</text><text x="480" y="540.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">employable, but often lower status; may</text><text x="480" y="561.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">channel working-class pupils into lower-paid</text><text x="480" y="582.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">work.</text>
</svg>