<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The official and the hidden curriculum</text>

<rect x="30" y="300" width="840" height="470" fill="#b5d3cf"/><line x1="30" y1="300" x2="870" y2="300" stroke="#2e6b62" stroke-width="3"/><path d="M290,300 L330,160 L420,122 L520,150 L580,300 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M290,300 L210,440 L250,630 L420,740 L640,680 L700,480 L580,300 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="440" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Official</text><text x="440" y="214" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">curriculum</text><text x="440" y="260" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">subjects · syllabus · testing</text><text x="60" y="150" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What schools</text><text x="60" y="172" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">openly teach</text><text x="850" y="720" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="end">What pupils learn from the</text><text x="850" y="742" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="end">way school is organised</text><text x="455" y="360" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Hidden curriculum</text><text x="455" y="400" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Norms and values</text><text x="455" y="424" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">respect for authority, competition</text><text x="455" y="472" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Punctuality</text><text x="455" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">bells, registers, late detentions</text><text x="455" y="544" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Conformity</text><text x="455" y="568" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">uniforms, rules, assemblies</text><text x="455" y="616" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Gender roles</text><text x="455" y="640" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">subject choices, sports, expectations</text>
</svg>