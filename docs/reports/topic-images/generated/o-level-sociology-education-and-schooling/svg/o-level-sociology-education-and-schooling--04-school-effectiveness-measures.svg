<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is a school effective? It depends on the measure</text>

<rect x="30" y="104" width="199.5" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="129.75" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Examination</text><text x="129.75" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">results</text><rect x="243.5" y="104" width="199.5" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.25" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social mobility</text><rect x="457" y="104" width="199.5" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.75" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Values</text><rect x="670.5" y="104" width="199.5" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="770.25" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Equality of</text><text x="770.25" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">opportunity</text><text x="30" y="226" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Worked example: private schools</text><rect x="30" y="252" width="410" height="158" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="285" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BY EXAM RESULTS</text><text x="50" y="312" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Often higher results</text><text x="50" y="341.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">But their pupils usually start with more</text><text x="50" y="363.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">advantages, so the school may not be the</text><text x="50" y="385.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">only reason.</text><rect x="460" y="252" width="410" height="158" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="285" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BY EQUALITY OF OPPORTUNITY</text><text x="480" y="312" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Fees exclude poorer families</text><text x="480" y="341.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">So private schools may widen inequality.</text><rect x="30" y="428" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="461.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The same school can look effective on one measure and ineffective on another. Say which</text><text x="50" y="483.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">measure you are using.</text>
</svg>