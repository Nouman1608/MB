<!-- place after: ## Ways a thesis can change -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-6-4-revising-thesis-study-guide--01-six-ways-to-revise.webp" width="900" height="768" alt="The thesis “Schools should end homework” sits in the centre with six revisions around it: narrow (for children under eleven), qualify (probably limit), add a condition (unless short, regular practice), broaden (all out-of-school work), reverse (keep but cap) and refocus (how much, not whether)." loading="lazy">
  <figcaption>Narrow, qualify, add a condition, broaden, reverse or refocus, but keep a claim.</figcaption>
</figure>

<!-- place after: ## A method for revising -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-6-4-revising-thesis-study-guide--02-revision-method.webp" width="900" height="646" alt="Seven numbered steps: state the current thesis, list the evidence, test the thesis, choose a revision, write the new thesis, revise the line of reasoning, and check commentary, with a loop back to the start as new evidence arrives. A warning against keeping only the evidence that suits the first idea." loading="lazy">
  <figcaption>Test the thesis against all the evidence, then revise the claim and the paragraphs.</figcaption>
</figure>

<!-- place after: ## Weak and strong responses to new evidence -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-6-4-revising-thesis-study-guide--03-three-responses.webp" width="900" height="433" alt="New evidence that homework helps in maths leads three ways: ignoring it and keeping the thesis (weak), abandoning the argument with “Homework is neither good nor bad” (weak), or revising to end homework for young children and limit it to short practice for older students (strong)." loading="lazy">
  <figcaption>Use contrary evidence to make the claim more precise, not to drop it.</figcaption>
</figure>

<!-- place after: ## Worked example 1: revising a thesis -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-6-4-revising-thesis-study-guide--04-homework-revision.webp" width="900" height="678" alt="Three pieces of invented evidence tested against “Schools should end homework”: E1 (maths practice helps) contradicts it, E2 (long homework costs sleep) supports a claim about excess, E3 (no fall in results under eleven) supports ending it for young children. The revised thesis narrows and adds a condition, and the new paragraphs follow E2, E3, E1." loading="lazy">

<!-- place after: ## Worked example 2: noticing a revision in a text -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-6-4-revising-thesis-study-guide--05-car-park-revision.webp" width="900" height="445" alt="A three-step flow: the original thesis that the town should simply close its car park, new evidence from a planner that shops at the edge of a new square lost trade, and the revised thesis that it should close only if the square is designed around the shops. Notes name the revision as an added condition and its effect on the reasoning." loading="lazy">
