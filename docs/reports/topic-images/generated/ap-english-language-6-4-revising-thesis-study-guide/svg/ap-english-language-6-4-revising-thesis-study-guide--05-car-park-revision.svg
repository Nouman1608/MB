<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 445" width="900" height="445" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="445" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Noticing a revision in a text</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: the central car park</text>
<rect x="30" y="122" width="250" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="155" y="164.58" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Original thesis</text><text x="155" y="190.17000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“a town should simply close</text><text x="155" y="209.97000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">its central car park”</text><rect x="325" y="122" width="250" height="120" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="450" y="154.67999999999998" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">New evidence</text><text x="450" y="180.26999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">a planner’s account: shops at</text><text x="450" y="200.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the edge of the new square</text><text x="450" y="219.86999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">lost trade</text><rect x="620" y="122" width="250" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="745" y="154.67999999999998" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Revised thesis</text><text x="745" y="180.26999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“close, <tspan font-weight="700">but</tspan> <tspan font-weight="700">only</tspan> <tspan font-weight="700">if</tspan> the square</text><text x="745" y="200.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">is designed around the</text><text x="745" y="219.86999999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">shops”</text><line x1="284" y1="182" x2="319" y2="182" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="579" y1="182" x2="614" y2="182" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="268" width="408" height="104.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Type of revision</text><text x="48" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">adds a condition while keeping the original</text><text x="48" y="351.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">direction</text><rect x="462" y="268" width="408" height="104.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="480" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Effect on the reasoning</text><text x="480" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">must now show how the square can protect the</text><text x="480" y="351.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">shops, not only that residents want it</text><text x="450" y="402.64" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Responding to a counter-example makes the final position more credible.</text>
</svg>