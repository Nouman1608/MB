<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 433" width="900" height="433" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="433" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three responses to contrary evidence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">New evidence: a study shows homework helps in maths</text>
<rect x="300" y="122" width="300" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="154.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">new</tspan> <tspan font-weight="700">evidence</tspan></text><line x1="450" y1="174" x2="165" y2="206" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)" stroke-dasharray="7 5"/><rect x="30" y="212" width="270" height="190.36" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="44" y="240.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Ignore it</text><text x="44" y="266.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">keeps “Schools should end</text><text x="44" y="286.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">homework.”</text><text x="44" y="306.11" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">Weak:</tspan> <tspan font-style="italic">blind</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">evidence</tspan></text><line x1="450" y1="174" x2="450" y2="206" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)" stroke-dasharray="7 5"/><rect x="315" y="212" width="270" height="190.36" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="329" y="240.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Abandon the argument</text><text x="329" y="266.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Homework is neither good nor</text><text x="329" y="286.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">bad.”</text><text x="329" y="306.11" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">Weak:</tspan> <tspan font-style="italic">no</tspan> <tspan font-style="italic">claim</tspan> <tspan font-style="italic">left</tspan></text><line x1="450" y1="174" x2="735" y2="206" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="600" y="212" width="270" height="190.36" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3" /><text x="614" y="240.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Revise the claim</text><text x="614" y="266.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Schools should end homework</text><text x="614" y="286.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">for young children and limit it for</text><text x="614" y="306.11" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">older students to short, regular</text><text x="614" y="325.90999999999997" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">practice in subjects like maths,</text><text x="614" y="345.71" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">where it appears to help.”</text><text x="614" y="365.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">Strong:</tspan> <tspan font-style="italic">clearer,</tspan> <tspan font-style="italic">more</tspan> <tspan font-style="italic">precise,</tspan></text><text x="614" y="385.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">more</tspan> <tspan font-style="italic">convincing</tspan></text>
</svg>