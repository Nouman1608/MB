<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mobilities and mass transport</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Sheller and Urry (2006): movement, not fixed places, should be central</text>
<rect x="30" y="120" width="269.3333333333333" height="299" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L285.0833333333333,121.25 Q298.0833333333333,121.25 298.0833333333333,134.25 L298.0833333333333,170 Z" fill="#b5d3cf"/><line x1="31.25" y1="170" x2="298.0833333333333" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="150.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Railways</text><text x="46" y="203.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Schivelbusch (1977)</text><circle cx="51" cy="226.92" r="4.5" fill="#2e6b62"/><text x="64" y="232.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Landscapes a blur through</text><text x="64" y="253.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the window: the</text><text x="64" y="274.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"annihilation of space and</text><text x="64" y="295.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">time"</text><circle cx="51" cy="318.92" r="4.5" fill="#2e6b62"/><text x="64" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Timetables pushed Britain</text><text x="64" y="345.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to a single standard time</text><circle cx="51" cy="368.92" r="4.5" fill="#2e6b62"/><text x="64" y="374.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seaside day-trips; suburbs</text><text x="64" y="395.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">along lines</text><rect x="315.3333333333333" y="120" width="269.3333333333333" height="299" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,170 L316.5833333333333,134.25 Q316.5833333333333,121.25 329.5833333333333,121.25 L570.4166666666666,121.25 Q583.4166666666666,121.25 583.4166666666666,134.25 L583.4166666666666,170 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="170" x2="583.4166666666666" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="150.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Cars and roads</text><text x="331.3333333333333" y="203.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Model T (1908)</text><circle cx="336.3333333333333" cy="226.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="232.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Car ownership for many US</text><text x="349.3333333333333" y="253.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">families; freedom; suburbs</text><circle cx="336.3333333333333" cy="276.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="282.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Traffic deaths, pollution,</text><text x="349.3333333333333" y="303.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">noise</text><circle cx="336.3333333333333" cy="326.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="332.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Road-built cities</text><text x="349.3333333333333" y="353.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disadvantage the young,</text><text x="349.3333333333333" y="374.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">elderly, disabled and</text><text x="349.3333333333333" y="395.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">poorer households</text><rect x="600.6666666666666" y="120" width="269.3333333333333" height="299" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,170 L601.9166666666666,134.25 Q601.9166666666666,121.25 614.9166666666666,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="150.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Air travel</text><text x="616.6666666666666" y="203.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">jets from the 1950s</text><circle cx="621.6666666666666" cy="226.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="232.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheaper flights: mass</text><text x="634.6666666666666" y="253.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">activity in richer</text><text x="634.6666666666666" y="274.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">countries</text><circle cx="621.6666666666666" cy="297.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="303.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tourism, migration,</text><text x="634.6666666666666" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">diaspora visits, business</text><circle cx="621.6666666666666" cy="347.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="353.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Benefits very uneven;</text><text x="634.6666666666666" y="374.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">emissions affect everyone</text><rect x="30" y="435" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="471" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Environment</text><text x="56" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Transport is a major source of greenhouse gases and urban air pollution; roads and</text><text x="56" y="522" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">airports take land and split habitats.</text>
</svg>