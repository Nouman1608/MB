<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 623" width="900" height="623" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="623" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Organising work with machines</text>

<rect x="158" y="104" width="232" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="274" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Taylorism</text><rect x="398" y="104" width="232" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="514" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fordism</text><rect x="638" y="104" width="232" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="754" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Post-Fordism</text><rect x="30" y="156" width="120" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="197.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Source</text><rect x="158" y="156" width="232" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Taylor (1911),</text><text x="172" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scientific management</text><rect x="398" y="156" width="232" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="412" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ford’s moving assembly</text><text x="412" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">line (1913)</text><rect x="638" y="156" width="232" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="652" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Piore and Sabel (1984)</text><rect x="30" y="236" width="120" height="135" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="297.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key</text><text x="42" y="319.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">features</text><rect x="158" y="236" width="232" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Time-and-motion study;</text><text x="172" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">simple steps; managers</text><text x="172" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plan, workers do</text><rect x="398" y="236" width="232" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="412" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Standardised mass</text><text x="412" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">products; fixed tasks;</text><text x="412" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relatively high wages</text><rect x="638" y="236" width="232" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="652" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Flexible specialisation;</text><text x="652" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">niche runs;</text><text x="652" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">multi-skilled teams;</text><text x="652" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">computer-controlled</text><text x="652" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">machines</text><rect x="30" y="379" width="120" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="430.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reading</text><rect x="158" y="379" width="232" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Braverman: basis of</text><text x="172" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deskilling and</text><text x="172" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">managerial control</text><rect x="398" y="379" width="232" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="412" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Blauner: high</text><text x="412" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alienation; Gramsci: a</text><text x="412" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">whole way of life</text><rect x="638" y="379" width="232" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="652" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Optimists: reskilling.</text><text x="652" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics: insecure</text><text x="652" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contracts</text><rect x="30" y="488" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="524" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Luddites (1811–1816)</text><text x="56" y="553" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Protested against machines being used to cut wages and replace skilled workers, not</text><text x="56" y="575" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">technology itself: the machine versus how it is used.</text>
</svg>