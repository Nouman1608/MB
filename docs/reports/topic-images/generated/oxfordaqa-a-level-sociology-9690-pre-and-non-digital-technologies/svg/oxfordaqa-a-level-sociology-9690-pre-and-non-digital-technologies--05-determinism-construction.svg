<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 689" width="900" height="689" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="689" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Does technology determine society?</text>

<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d0d" stroke-width="4" marker-start="url(#ahO)" marker-end="url(#ahO)"/><text x="60" y="106" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">technology shapes society</text><text x="840" y="106" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="end">society shapes technology</text><rect x="30" y="144" width="269.3333333333333" height="289" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,194 L31.25,158.25 Q31.25,145.25 44.25,145.25 L285.0833333333333,145.25 Q298.0833333333333,145.25 298.0833333333333,158.25 L298.0833333333333,194 Z" fill="#f2e7b8"/><line x1="31.25" y1="194" x2="298.0833333333333" y2="194" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="174.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Determinist</text><circle cx="49" cy="219.92" r="4.5" fill="#2e6b62"/><text x="62" y="225.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">White (1962):</tspan> the stirrup</text><text x="62" y="246.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">made shock combat and</text><text x="62" y="267.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">armoured knights possible,</text><text x="62" y="288.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">helping produce feudalism</text><text x="62" y="309.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(heavily criticised)</text><circle cx="49" cy="332.92" r="4.5" fill="#2e6b62"/><text x="62" y="338.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marx:</tspan> the hand-mill</text><circle cx="49" cy="361.92" r="4.5" fill="#2e6b62"/><text x="62" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">McLuhan:</tspan> "the medium is</text><text x="62" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the message"</text><rect x="315.3333333333333" y="144" width="269.3333333333333" height="289" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,194 L316.5833333333333,158.25 Q316.5833333333333,145.25 329.5833333333333,145.25 L570.4166666666666,145.25 Q583.4166666666666,145.25 583.4166666666666,158.25 L583.4166666666666,194 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="194" x2="583.4166666666666" y2="194" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="174.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Middle positions</text><circle cx="334.3333333333333" cy="219.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="225.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Latour:</tspan> actor-network</text><text x="347.3333333333333" y="246.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">theory; technologies and</text><text x="347.3333333333333" y="267.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people act together</text><circle cx="334.3333333333333" cy="290.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="296.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Soft determinism:</tspan></text><text x="347.3333333333333" y="317.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">technology makes outcomes</text><text x="347.3333333333333" y="338.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">easier or harder, but</text><text x="347.3333333333333" y="359.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people decide how to use</text><text x="347.3333333333333" y="380.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it</text><rect x="600.6666666666666" y="144" width="269.3333333333333" height="289" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,194 L601.9166666666666,158.25 Q601.9166666666666,145.25 614.9166666666666,145.25 L855.75,145.25 Q868.75,145.25 868.75,158.25 L868.75,194 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="194" x2="868.75" y2="194" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="174.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Constructionist</text><circle cx="619.6666666666666" cy="219.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="225.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Winner (1980):</tspan> Long Island</text><text x="632.6666666666666" y="246.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bridges built low to keep</text><text x="632.6666666666666" y="267.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">buses out (evidence</text><text x="632.6666666666666" y="288.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disputed)</text><circle cx="619.6666666666666" cy="311.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="317.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Cowan (1983):</tspan> household</text><text x="632.6666666666666" y="338.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">machines did not cut</text><text x="632.6666666666666" y="359.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housework time</text><circle cx="619.6666666666666" cy="382.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Wajcman (1991):</tspan> technology</text><text x="632.6666666666666" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shaped by gender relations</text><text x="30" y="463" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cowan: why “labour-saving” machines did not save time</text><rect x="30" y="528" width="220" height="90" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="567.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Washing machines,</text><text x="140" y="589.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">vacuum cleaners</text><rect x="330" y="483" width="250" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="455" y="512.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Standards of</text><text x="455" y="534.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">cleanliness rose</text><rect x="330" y="593" width="250" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="455" y="622.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Servants and helpers</text><text x="455" y="644.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">disappeared</text><rect x="660" y="528" width="210" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="765" y="567.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Women’s housework</text><text x="765" y="589.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">time not reduced</text><line x1="254" y1="573" x2="654" y2="573" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="584" y1="521" x2="654" y2="555" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="584" y1="625" x2="654" y2="591" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="600" y="507" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="start" font-style="italic">because</text><text x="600" y="651" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="start" font-style="italic">because</text>
</svg>