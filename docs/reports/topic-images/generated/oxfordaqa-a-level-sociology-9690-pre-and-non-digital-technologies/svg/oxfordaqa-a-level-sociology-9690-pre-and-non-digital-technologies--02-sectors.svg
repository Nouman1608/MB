<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Extraction, manufacturing and services</text>

<rect x="30" y="104" width="269.3333333333333" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Extraction</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Coal Is Our Life (1956)</text><text x="46" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dangerous shared work in a</text><text x="46" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Yorkshire mining town:</text><text x="46" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strong male solidarity,</text><text x="46" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sharply divided gender</text><text x="46" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">roles. Mechanisation and pit</text><text x="46" y="321.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">closures broke these</text><text x="46" y="342.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">communities up.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Manufacturing</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">factory discipline</text><text x="331.3333333333333" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Clock time, shifts and</text><text x="331.3333333333333" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supervision. Export</text><text x="331.3333333333333" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">manufacturing now plays this</text><text x="331.3333333333333" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">role in many newly</text><text x="331.3333333333333" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">industrialising economies.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Services</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Hochschild (1983), flight</text><text x="616.6666666666666" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">attendants</text><text x="616.6666666666666" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Emotional labour: managing</text><text x="616.6666666666666" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">your own feelings to produce</text><text x="616.6666666666666" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the right emotion in</text><text x="616.6666666666666" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">customers. Scripts and call</text><text x="616.6666666666666" y="321.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">monitoring control it.</text><rect x="30" y="382" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="418" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The deskilling debate</text><text x="56" y="447" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Braverman explains routine factory and office work; Bell and post-Fordists explain</text><text x="56" y="469" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">skilled technical work. Say which workers each describes.</text>
</svg>