<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 513" width="900" height="513" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="513" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who shapes rural and urban space?</text>

<rect x="30" y="110" width="184.5" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="122.25" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Middle-class</text><text x="122.25" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">newcomers</text><text x="122.25" y="196.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">move into a</text><text x="122.25" y="217.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">working-class area</text><line x1="218.5" y1="175" x2="244.5" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="110" width="184.5" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="340.75" y="164.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Renovation</text><text x="340.75" y="194.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">housing is done up</text><line x1="437" y1="175" x2="463" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="110" width="184.5" height="130" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="559.25" y="175.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rising rents</text><line x1="655.5" y1="175" x2="681.5" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="110" width="184.5" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="777.75" y="154.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Displacement</text><text x="777.75" y="184.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">original residents</text><text x="777.75" y="205.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">pushed out</text><text x="450" y="270" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">gentrification: term coined by Ruth Glass (1964)</text><rect x="30" y="292" width="412" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,342 L31.25,306.25 Q31.25,293.25 44.25,293.25 L427.75,293.25 Q440.75,293.25 440.75,306.25 L440.75,342 Z" fill="#dce9e7"/><line x1="31.25" y1="342" x2="440.75" y2="342" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="322.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rural power</text><circle cx="49" cy="367.92" r="4.5" fill="#2e6b62"/><text x="62" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Landownership</text><circle cx="49" cy="396.92" r="4.5" fill="#2e6b62"/><text x="62" y="402.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Caste or lineage</text><circle cx="49" cy="425.92" r="4.5" fill="#2e6b62"/><text x="62" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Access to credit and irrigation</text><circle cx="49" cy="454.92" r="4.5" fill="#2e6b62"/><text x="62" y="460.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gender norms about inheritance</text><rect x="458" y="292" width="412" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,342 L459.25,306.25 Q459.25,293.25 472.25,293.25 L855.75,293.25 Q868.75,293.25 868.75,306.25 L868.75,342 Z" fill="#dce9e7"/><line x1="459.25" y1="342" x2="868.75" y2="342" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="322.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">"Right to the city"</text><text x="472" y="373.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Lefebvre (1968)</text><text x="472" y="400.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">All residents, not only property owners,</text><text x="472" y="421.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">should shape urban space. Evictions for</text><text x="472" y="442.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">infrastructure or "beautification" show who</text><text x="472" y="463.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">holds this power.</text>
</svg>