<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ibn Khaldun’s cycle of solidarity</text>

<path d="M555,175 Q700,175.00000000000003 700,276.5" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><path d="M700,423.5 Q700,525 555,525" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><path d="M345,525 Q200.00000000000006,525 200.00000000000003,423.5" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><path d="M200,276.5 Q199.99999999999997,175.00000000000003 345,175" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="325" y="127" width="250" height="96" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="155.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Desert nomads</text><text x="450" y="183.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">strong ’asabiyyah (group</text><text x="450" y="204.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">solidarity)</text><rect x="575" y="302" width="250" height="96" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="330.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conquest</text><text x="700" y="358.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">solidarity lets them</text><text x="700" y="379.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">conquer settled peoples</text><rect x="325" y="477" width="250" height="96" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="505.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Settled in cities</text><text x="450" y="533.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">comfort and luxury weaken</text><text x="450" y="554.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">solidarity</text><rect x="75" y="302" width="250" height="96" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="200" y="330.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Replaced</text><text x="200" y="358.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a new group with stronger</text><text x="200" y="379.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">solidarity takes over</text><text x="450" y="341" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Ibn Khaldun,</text><text x="450" y="365" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Muqaddimah (1377)</text><rect x="30" y="580" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="616" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it matters</text><text x="56" y="645" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An early idea that the built environment changes social bonds.</text>
</svg>