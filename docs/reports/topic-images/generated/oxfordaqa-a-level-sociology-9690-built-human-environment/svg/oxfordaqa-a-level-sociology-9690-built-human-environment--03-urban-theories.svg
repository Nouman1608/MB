<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 607" width="900" height="607" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="607" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What does city life do to people?</text>

<rect x="248" y="104" width="307" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="401.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Argument</text><rect x="563" y="104" width="307" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="716.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Limitation</text><rect x="30" y="156" width="210" height="114" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="218.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tönnies (1887)</text><rect x="248" y="156" width="307" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="262" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">From <tspan font-weight="700">Gemeinschaft</tspan> (community:</text><text x="262" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kinship and place) to</text><text x="262" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Gesellschaft</tspan> (association:</text><text x="262" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contract and self-interest).</text><rect x="563" y="156" width="307" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="577" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Idealises village life.</text><rect x="30" y="278" width="210" height="96" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="309.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Simmel (1903) "The</text><text x="42" y="331.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Metropolis and</text><text x="42" y="353.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mental Life"</text><rect x="248" y="278" width="307" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="262" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Constant stimulation produces a</text><text x="262" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">blasé attitude</tspan>: reserved and</text><text x="262" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">calculating.</text><rect x="563" y="278" width="307" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="577" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Based on one kind of European</text><text x="577" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">city.</text><rect x="30" y="382" width="210" height="96" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="413.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Wirth (1938)</text><text x="42" y="435.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">"Urbanism as a Way</text><text x="42" y="457.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">of Life"</text><rect x="248" y="382" width="307" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="262" y="412.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Size, density and heterogeneity</tspan></text><text x="262" y="433.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">produce impersonal, segmented</text><text x="262" y="454.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ties and weaker social control.</text><rect x="563" y="382" width="307" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="577" y="412.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores close communities within</text><text x="577" y="433.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cities.</text><rect x="30" y="494" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="530" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Challenge: Gans (1962), The Urban Villagers</text><text x="56" y="559" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Close-knit Italian American neighbourhoods in Boston: cities contain villages.</text>
</svg>