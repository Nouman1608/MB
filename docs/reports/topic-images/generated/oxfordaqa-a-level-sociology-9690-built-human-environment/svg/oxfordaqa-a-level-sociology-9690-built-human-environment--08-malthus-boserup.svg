<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 527" width="900" height="527" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="527" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Population and food: two views</text>

<rect x="30" y="104" width="404" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Malthus (1798)</text><circle cx="53" cy="184.79" r="4.5" fill="#2e6b62"/><text x="66" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Population grows faster than food</text><circle cx="53" cy="214.79" r="4.5" fill="#2e6b62"/><text x="66" y="220.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Famine and disease check growth</text><rect x="466" y="104" width="404" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Boserup (1965)</text><circle cx="489" cy="184.79" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Population pressure drives farming</text><text x="502" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">innovation</text><circle cx="489" cy="236.79" r="4.5" fill="#8a6d0d"/><text x="502" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reverses Malthus’s argument</text><circle cx="450" cy="186" r="24" fill="#1e2a44"/><text x="450" y="193" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="286" width="840" height="215" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluating demographic transition theory</text><circle cx="61" cy="345.39" r="4.5" fill="#8a6d0d"/><text x="74" y="351" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Urbanisation:</tspan> children cost more and contribute less labour; women gain education and</text><text x="74" y="373" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">paid work, which helps explain stage 3</text><circle cx="61" cy="397.39" r="4.5" fill="#8a6d0d"/><text x="74" y="403" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">A fifth stage?</tspan> Japan and South Korea: fertility well below replacement, shrinking</text><text x="74" y="425" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">populations</text><circle cx="61" cy="449.39" r="4.5" fill="#8a6d0d"/><text x="74" y="455" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Limits:</tspan> based on European history; timing differs; state policy and religion shape</text><text x="74" y="477" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fertility; migration left out</text>
</svg>