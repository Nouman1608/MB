<rect width="900" height="509" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Augé: place and non-place</text>

<rect x="188" y="104" width="337" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="356.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Anthropological place</text><rect x="533" y="104" width="337" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="701.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-place</text><rect x="30" y="156" width="150" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="187.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Relational</text><rect x="188" y="156" width="337" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">People know each other</text><rect x="533" y="156" width="337" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">People do not know each other</text><rect x="30" y="216" width="150" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="247.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Historical</text><rect x="188" y="216" width="337" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="247.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Carries memory</text><rect x="533" y="216" width="337" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="247.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Carries no memory</text><rect x="30" y="276" width="150" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="307.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Identity</text><rect x="188" y="276" width="337" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="307.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Concerned with identity</text><rect x="533" y="276" width="337" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="307.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not concerned with identity</text><rect x="30" y="344" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="380" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="403.39" r="4.5" fill="#8a6d0d"/><text x="74" y="409" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Digital life may turn even homes into points of transit</text><circle cx="61" cy="433.39" r="4.5" fill="#8a6d0d"/><text x="74" y="439" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Non-places can offer anonymity and freedom, e.g. to people escaping village</text><text x="74" y="461" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">surveillance</text>
</svg>