<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 617" width="900" height="617" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="617" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four views of informal housing</text>

<rect x="30" y="104" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Integrated and exploited</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Perlman (1976), Rio de Janeiro favelas</text><text x="46" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not marginal: residents are workers, voters</text><text x="46" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and consumers, but exploited and stigmatised.</text><rect x="458" y="104" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-help</text><text x="474" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Turner (1972)</text><text x="474" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Residents build and improve better than state</text><text x="474" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">projects; support settlements, do not</text><text x="474" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">demolish.</text><rect x="30" y="298" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,348 L31.25,312.25 Q31.25,299.25 44.25,299.25 L427.75,299.25 Q440.75,299.25 440.75,312.25 L440.75,348 Z" fill="#f2e7b8"/><line x1="31.25" y1="348" x2="440.75" y2="348" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="329" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Property titles</text><text x="46" y="381.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">de Soto (2000)</text><text x="46" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Legal titles turn homes into capital for</text><text x="46" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">loans. Critics: titles can raise land values</text><text x="46" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and push the poorest out.</text><rect x="458" y="298" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,348 L459.25,312.25 Q459.25,299.25 472.25,299.25 L855.75,299.25 Q868.75,299.25 868.75,312.25 L868.75,348 Z" fill="#f2e7b8"/><line x1="459.25" y1="348" x2="868.75" y2="348" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="329" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Community action</text><text x="474" y="381.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Orangi Pilot Project, Karachi (1980)</text><text x="474" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Started by Akhtar Hameed Khan: residents</text><text x="474" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">built their own low-cost sewers lane by lane.</text><rect x="30" y="492" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="528" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Balance against Davis, Planet of Slums</text><text x="56" y="557" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">His bleaker account set against these views gives a balanced evaluation. Keep the</text><text x="56" y="579" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">inverted commas: "slum" can stigmatise.</text>
</svg>