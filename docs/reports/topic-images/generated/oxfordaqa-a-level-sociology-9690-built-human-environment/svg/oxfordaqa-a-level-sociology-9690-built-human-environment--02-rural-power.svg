<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 523" width="900" height="523" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="523" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rural poverty is about power</text>

<rect x="30" y="104" width="269.3333333333333" height="278" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Peasants</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Wolf (1966)</text><circle cx="51" cy="210.92" r="4.5" fill="#2e6b62"/><text x="64" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Farm small plots with</text><text x="64" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">household labour</text><circle cx="51" cy="260.92" r="4.5" fill="#2e6b62"/><text x="64" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Produce partly for own</text><text x="64" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">use, partly for sale</text><circle cx="51" cy="310.92" r="4.5" fill="#2e6b62"/><text x="64" y="316.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">States and markets take a</text><text x="64" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">share through rent, taxes</text><text x="64" y="358.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or prices</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="278" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Landless labourers</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">wages or a share of the</text><text x="331.3333333333333" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">crop</text><circle cx="336.3333333333333" cy="231.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Sharecropping:</tspan> rent paid</text><text x="349.3333333333333" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as a share of the harvest</text><circle cx="336.3333333333333" cy="281.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Debt bondage:</tspan> working off</text><text x="349.3333333333333" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a loan that never ends</text><text x="349.3333333333333" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(some South Asian brick</text><text x="349.3333333333333" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kilns and farms)</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="278" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Resistance</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Scott (1985), Malaysian</text><text x="616.6666666666666" y="208.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">village</text><circle cx="621.6666666666666" cy="231.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Everyday" tactics:</text><text x="634.6666666666666" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foot-dragging, gossip,</text><text x="634.6666666666666" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pilfering, false</text><text x="634.6666666666666" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compliance</text><circle cx="621.6666666666666" cy="323.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Organised: Brazil’s</text><text x="634.6666666666666" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Landless Workers’ Movement</text><rect x="30" y="398" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rural depopulation</text><text x="56" y="463" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Young adults leave: ageing villages, abandoned farmland, closing schools, "left-behind</text><text x="56" y="485" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">children" in China. Since 2008, "land grabs" add pressure on smallholders.</text>
</svg>