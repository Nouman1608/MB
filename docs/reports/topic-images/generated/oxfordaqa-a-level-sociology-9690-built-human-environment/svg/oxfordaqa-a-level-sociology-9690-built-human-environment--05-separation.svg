<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 478" width="900" height="478" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="478" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ways of separating city space</text>

<rect x="30" y="104" width="274.6666666666667" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="167.33333333333334" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Suburbia</text><rect x="312.6666666666667" y="104" width="274.6666666666667" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="450" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Segregation</text><rect x="595.3333333333334" y="104" width="274.6666666666667" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="732.6666666666667" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Gated communities</text><rect x="30" y="156" width="274.6666666666667" height="193" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="49" cy="180.92" r="4.5" fill="#2e6b62"/><text x="62" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">After 1945, mass-built</text><text x="62" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suburbs such as Levittown</text><circle cx="49" cy="230.92" r="4.5" fill="#2e6b62"/><text x="62" y="236.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Car-based, low-density</text><text x="62" y="257.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">family housing</text><circle cx="49" cy="280.92" r="4.5" fill="#2e6b62"/><text x="62" y="286.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics: conformity,</text><text x="62" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">isolated housewives, racial</text><text x="62" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exclusion</text><rect x="312.6666666666667" y="156" width="274.6666666666667" height="193" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="331.6666666666667" cy="180.92" r="4.5" fill="#2e6b62"/><text x="344.6666666666667" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Legal:</tspan> South Africa’s Group</text><text x="344.6666666666667" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Areas Act (1950)</text><circle cx="331.6666666666667" cy="230.92" r="4.5" fill="#2e6b62"/><text x="344.6666666666667" y="236.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Or</tspan> markets, prejudice and</text><text x="344.6666666666667" y="257.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing policy</text><circle cx="331.6666666666667" cy="280.92" r="4.5" fill="#2e6b62"/><text x="344.6666666666667" y="286.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Wacquant (2008):</tspan> "advanced</text><text x="344.6666666666667" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marginality" in Chicago and</text><text x="344.6666666666667" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Paris</text><rect x="595.3333333333334" y="156" width="274.6666666666667" height="193" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="614.3333333333334" cy="180.92" r="4.5" fill="#2e6b62"/><text x="627.3333333333334" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Caldeira (2000):</tspan> "fortified</text><text x="627.3333333333334" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enclaves" in São Paulo,</text><text x="627.3333333333334" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">driven by fear of crime</text><circle cx="614.3333333333334" cy="251.92" r="4.5" fill="#2e6b62"/><text x="627.3333333333334" y="257.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Low (2003):</tspan> residents cite</text><text x="627.3333333333334" y="278.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safety but also "niceness"</text><text x="627.3333333333334" y="299.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and homogeneity</text><rect x="30" y="365" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="401" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do not confuse</text><text x="56" y="430" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gated communities are about controlled access, not just suburban location.</text>
</svg>