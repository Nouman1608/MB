<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 852" width="900" height="852" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="852" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key words from the original</text>

<rect x="30" y="110" width="840" height="624" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Passage</text><text x="186" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key word</text><line x1="170" y1="110" x2="170" y2="734" stroke="#c9d6d4" stroke-width="2"/><text x="436" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it adds</text><line x1="420" y1="110" x2="420" y2="734" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="197.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 2.255</text><text x="186" y="197.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">al-Hayy al-Qayyum</text><text x="436" y="186.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the Living, the Self-Subsisting: God depends on</text><text x="436" y="208.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nothing</text><line x1="30" y1="226" x2="870" y2="226" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="263.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 112</text><text x="186" y="263.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Ahad, al-Samad</text><text x="436" y="252.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One and unique; the Eternal on whom all creation</text><text x="436" y="274.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">depends</text><line x1="30" y1="292" x2="870" y2="292" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="329.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 1</text><text x="186" y="329.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Rabb al-'alamin</text><text x="436" y="318.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lord of the worlds: creates, cares for and</text><text x="436" y="340.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sustains all</text><line x1="30" y1="358" x2="870" y2="358" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="390.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 1</text><text x="186" y="390.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">al-sirat al-mustaqim</text><text x="436" y="390.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the straight path asked for in every prayer</text><line x1="30" y1="414" x2="870" y2="414" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="451.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 96.1-5</text><text x="186" y="451.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Iqra', al-qalam</text><text x="436" y="440.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"Read" and "the pen": revelation linked to</text><text x="436" y="462.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">knowledge</text><line x1="30" y1="480" x2="870" y2="480" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="517.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 99</text><text x="186" y="517.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">mithqal dharra</text><text x="436" y="506.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">an atom's weight: no deed too small for the Day of</text><text x="436" y="528.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Judgement</text><line x1="30" y1="546" x2="870" y2="546" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="578.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 114</text><text x="186" y="578.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">al-waswas al-khannas</text><text x="436" y="578.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the whisperer who withdraws: hidden temptation</text><line x1="30" y1="602" x2="870" y2="602" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="639.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 2.30</text><text x="186" y="639.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">khalifa</text><text x="436" y="628.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">vicegerent: humans trusted with responsibility on</text><text x="436" y="650.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">earth</text><line x1="30" y1="668" x2="870" y2="668" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="705.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 108</text><text x="186" y="705.2" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">al-Kawthar, al-abtar</text><text x="436" y="694.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">abundance given to the Prophet (pbuh); his enemy</text><text x="436" y="716.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is "cut off"</text><rect x="30" y="754" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="796" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">One accurate key word per passage, explained, shows knowledge of the original.</text>
</svg>