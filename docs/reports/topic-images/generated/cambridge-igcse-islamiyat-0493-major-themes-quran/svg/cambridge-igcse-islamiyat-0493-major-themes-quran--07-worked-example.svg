<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 696" width="900" height="696" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="696" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: two passages</text>

<rect x="30" y="110" width="410" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 2.21-22</text><rect x="50" y="162" width="370" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="235" y="187" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">God's relationship with the created world</text><rect x="44" y="218" width="382" height="206" rx="10" fill="#f2e7b8"/><text x="60" y="248" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">(a) Theme</text><circle cx="64" cy="277" r="4" fill="#1e2a44"/><text x="76" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Worship the Guardian-Lord who created</text><text x="76" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">you and those before you</text><circle cx="64" cy="331" r="4" fill="#1e2a44"/><text x="76" y="336" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">He made the earth a resting place, the</text><text x="76" y="357" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sky a canopy, and sent rain for fruits</text><circle cx="64" cy="385" r="4" fill="#1e2a44"/><text x="76" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">So do not "set up rivals" to Him</text><rect x="44" y="436" width="382" height="180" rx="10" fill="#dce9e7"/><text x="60" y="466" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">(b) Importance today</text><circle cx="64" cy="495" r="4" fill="#1e2a44"/><text x="76" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Everything is a gift: thank God and</text><text x="76" y="521" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">avoid waste</text><circle cx="64" cy="549" r="4" fill="#1e2a44"/><text x="76" y="554" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Do not treat wealth, status or people as</text><text x="76" y="575" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">provider</text><rect x="460" y="110" width="410" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 6.75-79</text><rect x="480" y="162" width="370" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="665" y="187" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">God's Messengers</text><rect x="474" y="218" width="382" height="206" rx="10" fill="#f2e7b8"/><text x="490" y="248" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">(a) Theme</text><circle cx="494" cy="277" r="4" fill="#1e2a44"/><text x="506" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">God showed Ibrahim the heavens and the</text><text x="506" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">earth for certainty</text><circle cx="494" cy="331" r="4" fill="#1e2a44"/><text x="506" y="336" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Star, moon and sun each set and were</text><text x="506" y="357" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rejected</text><circle cx="494" cy="385" r="4" fill="#1e2a44"/><text x="506" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">He turned to the Creator and refused to</text><text x="506" y="411" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">give God partners</text><rect x="474" y="436" width="382" height="180" rx="10" fill="#dce9e7"/><text x="490" y="466" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">(b) Importance today</text><circle cx="494" cy="495" r="4" fill="#1e2a44"/><text x="506" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Faith reached by reflecting on the</text><text x="506" y="521" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">universe: nature's laws as signs</text><circle cx="494" cy="549" r="4" fill="#1e2a44"/><text x="506" y="554" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explain belief calmly to others, as</text><text x="506" y="575" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ibrahim did</text><text x="450" y="668" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(a): name the group, give the teaching, point to the wording. (b): say what a Muslim actually does.</text>
</svg>