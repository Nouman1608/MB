<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 782" width="900" height="782" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="782" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From theme to importance today</text>

<rect x="30" y="110" width="260" height="60" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="160" y="147" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Theme</text><line x1="292" y1="140" x2="318" y2="140" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="110" width="260" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="147" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Specific action or attitude</text><line x1="582" y1="140" x2="608" y2="140" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="110" width="260" height="60" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="147" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reason the passage gives</text><rect x="30" y="190" width="840" height="62" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="228" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 2.255</text><text x="180" y="228" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Recite it before sleeping and after prayers</text><text x="852" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">a Protector who "feels no fatigue in guarding"</text><rect x="30" y="260" width="840" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="298" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 6.103</text><text x="180" y="298" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No pictures or statues of God</text><text x="852" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">"no vision can grasp Him"</text><rect x="30" y="330" width="840" height="62" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="368" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 2.21-22</text><text x="180" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Thank God at meals; care for the earth</text><text x="852" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">He sends rain and food; the earth a "couch"</text><rect x="30" y="400" width="840" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="438" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 96.1-5</text><text x="180" y="438" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seek knowledge in God's name</text><text x="852" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">He "taught by the pen"</text><rect x="30" y="470" width="840" height="62" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="508" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 114</text><text x="180" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seek refuge in God when tempted</text><text x="852" y="508" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">protection from the whisperer</text><rect x="30" y="540" width="840" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="578" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 6.75-79</text><text x="180" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Use reason and reflection</text><text x="852" y="578" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">as Ibrahim did</text><rect x="30" y="610" width="840" height="62" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="648" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 93.9-10</text><text x="180" y="648" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Care for orphans; do not turn away a beggar</text><text x="852" y="648" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">God's care for the Prophet (pbuh)</text><rect x="30" y="688" width="840" height="66" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="728" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Weak: "Muslims should believe in God" for every passage.</text>
</svg>