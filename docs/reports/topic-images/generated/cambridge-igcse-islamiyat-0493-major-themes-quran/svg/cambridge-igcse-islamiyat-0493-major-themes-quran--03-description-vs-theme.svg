<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="546" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Description or theme?</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="146" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Description</text><text x="846" y="146" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="54" y="184" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Sura 41.37 mentions the night, the day, the sun and the moon."</text><text x="54" y="236" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">repeats the words: no teaching stated</text><line x1="450" y1="262" x2="450" y2="296" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="300" width="840" height="176" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="336" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Theme</text><text x="846" y="336" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="54" y="374" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Sura 41.37 teaches that the wonders of nature are signs pointing to their Creator,</text><text x="54" y="398" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">so worship belongs to God alone and never to what He has made."</text><text x="450" y="516" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A theme is the teaching about God, His creation or His Messengers.</text>
</svg>