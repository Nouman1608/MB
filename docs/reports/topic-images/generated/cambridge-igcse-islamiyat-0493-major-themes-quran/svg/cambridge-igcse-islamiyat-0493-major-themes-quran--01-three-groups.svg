<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Fifteen passages in three groups</text>

<rect x="30" y="110" width="840" height="180" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="70" cy="150" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="157.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="106" y="157" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">God in Himself</text><text x="54" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what God is like in His own nature: one, eternal, all-knowing, all-powerful, beyond</text><text x="54" y="213" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">comparison, merciful</text><rect x="54" y="236" width="148" height="38" rx="19" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="128" y="261" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 2.255</text><rect x="214" y="236" width="148" height="38" rx="19" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="288" y="261" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 6.101-103</text><rect x="374" y="236" width="148" height="38" rx="19" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="448" y="261" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 41.37</text><rect x="534" y="236" width="148" height="38" rx="19" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="608" y="261" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 42.4-5</text><rect x="694" y="236" width="148" height="38" rx="19" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="768" y="261" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 112</text><rect x="30" y="304" width="840" height="180" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="344" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="351.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="106" y="351" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">God's relationship with the created world</text><text x="54" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what God does for and with creation: creating, sustaining, teaching, guiding, protecting,</text><text x="54" y="407" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">judging</text><rect x="54" y="430" width="148" height="38" rx="19" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="128" y="455" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 1</text><rect x="214" y="430" width="148" height="38" rx="19" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="288" y="455" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 2.21-22</text><rect x="374" y="430" width="148" height="38" rx="19" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="448" y="455" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 96.1-5</text><rect x="534" y="430" width="148" height="38" rx="19" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="608" y="455" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 99</text><rect x="694" y="430" width="148" height="38" rx="19" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="768" y="455" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 114</text><rect x="30" y="498" width="840" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="538" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="545.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="106" y="545" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">God's Messengers</text><text x="54" y="580" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how God chose, taught, supported and protected His prophets, from Adam to the Prophet Muhammad</text><text x="54" y="601" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(pbuh)</text><rect x="54" y="624" width="148" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="128" y="649" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 2.30-37</text><rect x="214" y="624" width="148" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="288" y="649" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 6.75-79</text><rect x="374" y="624" width="148" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="448" y="649" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 5.110</text><rect x="534" y="624" width="148" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="608" y="649" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 93</text><rect x="694" y="624" width="148" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="768" y="649" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sura 108</text><text x="450" y="710" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Fifteen passages: check the syllabus appendix for your exam year.</text>
</svg>