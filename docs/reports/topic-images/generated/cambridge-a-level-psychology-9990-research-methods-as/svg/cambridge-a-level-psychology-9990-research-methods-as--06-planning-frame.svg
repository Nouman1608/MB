<rect width="900" height="684" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a field experiment</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Does background music in a school library affect how long students stay?</text>
<rect x="30" y="124" width="840" height="50" rx="14" fill="#ffffff"/><path d="M44,124 H190 V174 H44 A14,14 0 0 1 30,160 V138 A14,14 0 0 1 44,124 Z" fill="#d4b02e"/><rect x="30" y="124" width="840" height="50" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">IV</text><text x="206" y="153.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quiet background music v no music, alternating by day across two weeks</text><rect x="30" y="182" width="840" height="50" rx="14" fill="#ffffff"/><path d="M44,182 H190 V232 H44 A14,14 0 0 1 30,218 V196 A14,14 0 0 1 44,182 Z" fill="#d4b02e"/><rect x="30" y="182" width="840" height="50" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="210.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">DV</text><text x="206" y="211.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Minutes per visit, from sign-in and sign-out times on the library’s existing log</text><rect x="30" y="240" width="840" height="50" rx="14" fill="#ffffff"/><path d="M44,240 H190 V290 H44 A14,14 0 0 1 30,276 V254 A14,14 0 0 1 44,240 Z" fill="#d4b02e"/><rect x="30" y="240" width="840" height="50" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="268.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Location</text><text x="206" y="269.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The school library during normal opening hours</text><rect x="30" y="298" width="840" height="50" rx="14" fill="#ffffff"/><path d="M44,298 H190 V348 H44 A14,14 0 0 1 30,334 V312 A14,14 0 0 1 44,298 Z" fill="#d4b02e"/><rect x="30" y="298" width="840" height="50" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="326.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Design</text><text x="206" y="327.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Independent measures; days allocated to conditions at random</text><rect x="30" y="356" width="840" height="50" rx="14" fill="#ffffff"/><path d="M44,356 H190 V406 H44 A14,14 0 0 1 30,392 V370 A14,14 0 0 1 44,356 Z" fill="#d4b02e"/><rect x="30" y="356" width="840" height="50" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="384.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Controls</text><text x="206" y="385.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Same volume, playlist, opening hours and staffing; exam weeks excluded</text><rect x="30" y="414" width="840" height="50" rx="14" fill="#ffffff"/><path d="M44,414 H190 V464 H44 A14,14 0 0 1 30,450 V428 A14,14 0 0 1 44,414 Z" fill="#b5d3cf"/><rect x="30" y="414" width="840" height="50" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="442.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><text x="206" y="443.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Standardised playlist and timing records can be repeated exactly</text><rect x="30" y="472" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,472 H190 V542 H44 A14,14 0 0 1 30,528 V486 A14,14 0 0 1 44,472 Z" fill="#b5d3cf"/><rect x="30" y="472" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="510.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Validity</text><text x="206" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Normal setting; students do not know music is the IV, reducing demand</text><text x="206" y="521.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">characteristics</text><rect x="30" y="550" width="840" height="50" rx="14" fill="#ffffff"/><path d="M44,550 H190 V600 H44 A14,14 0 0 1 30,586 V564 A14,14 0 0 1 44,550 Z" fill="#b5d3cf"/><rect x="30" y="550" width="840" height="50" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="578.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Data</text><text x="206" y="579.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quantitative (minutes per visit)</text><rect x="30" y="622" width="228.24" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="144.12" y="642.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Field-experiment features</text><rect x="270.24" y="622" width="155.008" height="30" rx="15" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="347.744" y="642.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">General features</text><text x="870" y="643" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">Not required in Paper 2: aims, hypotheses, sampling, ethics</text>
</svg>