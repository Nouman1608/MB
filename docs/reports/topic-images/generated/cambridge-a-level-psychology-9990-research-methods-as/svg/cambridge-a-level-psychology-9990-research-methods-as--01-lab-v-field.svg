<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two types of experiment</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Both manipulate an IV and measure a DV; the setting decides the type</text>
<rect x="30" y="124" width="412" height="244" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LABORATORY EXPERIMENT</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Controlled setting set up by the</text><text x="50" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">researcher</text><text x="50" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">Andrade’s</tspan> <tspan font-style="italic">doodling</tspan> <tspan font-style="italic">study</tspan></text><text x="50" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ Strong control: cause and effect more secure</text><text x="50" y="289.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ Easy to replicate (reliability)</text><text x="50" y="316.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− Artificial setting: lower ecological validity</text><text x="50" y="343.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− More demand characteristics</text><rect x="458" y="124" width="412" height="244" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FIELD EXPERIMENT</text><text x="478" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">IV manipulated in the participants’</text><text x="478" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">normal environment</text><text x="478" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">Piliavin</tspan> <tspan font-style="italic">et</tspan> <tspan font-style="italic">al.</tspan> <tspan font-style="italic">on</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">subway</tspan></text><text x="478" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ Higher ecological validity</text><text x="478" y="289.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ Participants may not know they are studied</text><text x="478" y="316.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− Weaker control</text><text x="478" y="343.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− Ethical problems: no consent, no debrief</text><text x="450" y="406" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">EXPERIMENTAL AND CONTROL CONDITIONS</text><rect x="30" y="428" width="360" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="460" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">EXPERIMENTAL GROUP</text><text x="210" y="486.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Aggressive model</text><text x="210" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Bandura et al.</text><rect x="510" y="428" width="360" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690" y="460" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CONTROL GROUP</text><text x="690" y="486.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">No model</text><text x="690" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the baseline: aggression without a model</text><text x="450" y="480" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">compare</text><line x1="400" y1="492" x2="500" y2="492" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" marker-start="url(#ahO)"/><rect x="30" y="562" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A control group does not make a study a laboratory experiment: <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">setting</tspan> <tspan font-weight="700" fill="#1e2a44">decides</tspan>.</text>
</svg>