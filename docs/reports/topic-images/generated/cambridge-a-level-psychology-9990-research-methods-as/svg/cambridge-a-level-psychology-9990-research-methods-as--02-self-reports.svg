<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 875" width="900" height="875" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="875" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Self-reports: questionnaires and interviews</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Participants report their own thoughts, feelings or behaviour</text>
<text x="450" y="140" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">QUESTIONNAIRES</text><rect x="30" y="162" width="270.6666666666667" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="194" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MODE</text><text x="50" y="220.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Paper and pencil or online</text><text x="50" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Online reaches large,</text><text x="50" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scattered samples cheaply,</text><text x="50" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">but the researcher cannot</text><text x="50" y="311.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">check who completed it.</text><rect x="314.6666666666667" y="162" width="270.6666666666667" height="174" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="194" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OPEN QUESTIONS</text><text x="334.6666666666667" y="220.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Own words</text><text x="334.6666666666667" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">→ qualitative data; detailed,</text><text x="334.6666666666667" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">more valid for complex</text><text x="334.6666666666667" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">experiences</text><rect x="599.3333333333334" y="162" width="270.6666666666667" height="174" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="194" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLOSED QUESTIONS</text><text x="619.3333333333334" y="220.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fixed set of answers</text><text x="619.3333333333334" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">→ quantitative data; easy to</text><text x="619.3333333333334" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">compare, reliable</text><text x="450" y="384" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">INTERVIEWS VARY IN TWO WAYS</text><rect x="30" y="406" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="442" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">FORMAT</text><line x1="100" y1="482" x2="800" y2="482" stroke="#c9d6d4" stroke-width="5"/><rect x="133.2815" y="466" width="113.437" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="190" y="487.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Structured</text><text x="190" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">same questions, same order</text><rect x="369.4135" y="466" width="161.173" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="450" y="487.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Semi-structured</text><text x="450" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">set questions + follow-up</text><rect x="642.5715" y="466" width="134.857" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="710" y="487.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Unstructured</text><text x="710" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">follows the conversation</text><rect x="30" y="578" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="610" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TECHNIQUE</text><text x="50" y="636.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Face-to-face</text><text x="50" y="664.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Builds rapport; interviewer can read body</text><text x="50" y="685.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">language</text><rect x="457" y="578" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="610" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TECHNIQUE</text><text x="477" y="636.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Telephone</text><text x="477" y="664.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cheaper; may feel less intimidating for sensitive</text><text x="477" y="685.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">topics</text><rect x="30" y="732" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="766.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate with</text><text x="50" y="796.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Social desirability bias · whether people can report accurately on themselves · closed versus open</text><text x="50" y="818.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">trade-off</text>
</svg>