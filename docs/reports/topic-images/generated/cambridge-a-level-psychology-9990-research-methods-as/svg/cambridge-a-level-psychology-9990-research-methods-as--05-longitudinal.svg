<rect width="900" height="531" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Longitudinal studies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The same participants measured more than once over time</text>
<text x="40" y="162" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mindfulness</text><rect x="210" y="124" width="130" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="275" y="149.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Brain scan</text><text x="275" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">before</text><line x1="346" y1="156" x2="396" y2="156" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="402" y="136" width="250" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="527" y="162" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">eight-week programme</text><line x1="658" y1="156" x2="708" y2="156" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="714" y="124" width="130" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="779" y="149.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Brain scan</text><text x="779" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after</text><text x="40" y="252" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Control group</text><rect x="210" y="214" width="130" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="275" y="239.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Brain scan</text><text x="275" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">before</text><line x1="346" y1="246" x2="396" y2="246" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="402" y="226" width="250" height="40" rx="20" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="527" y="252" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">no programme</text><line x1="658" y1="246" x2="708" y2="246" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="714" y="214" width="130" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="779" y="239.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Brain scan</text><text x="779" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after</text><text x="527" y="310" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Hölzel et al.: an experiment with a longitudinal design</text><rect x="30" y="338" width="413" height="161" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="370" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="396.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Change tracked within the same people</text><text x="50" y="424.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Participant variables are controlled.</text><rect x="457" y="338" width="413" height="161" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="370" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESSES</text><text x="477" y="396.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Time, attrition, practice</text><text x="477" y="424.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="424.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">They take a long time</text><text x="477" y="449.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Attrition (drop-out) may leave a biased sample</text><text x="477" y="474.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="474.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Repeated testing may cause practice effects</text>
</svg>