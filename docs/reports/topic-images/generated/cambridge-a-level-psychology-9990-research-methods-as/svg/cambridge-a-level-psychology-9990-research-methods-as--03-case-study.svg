<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 711" width="900" height="711" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="711" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Case studies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A detailed investigation of a single participant or unit</text>
<line x1="290" y1="192.5" x2="402" y2="215.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="290" y1="257.5" x2="402" y2="234.75" stroke="#1e2a44" stroke-width="2.5"/><line x1="610" y1="225" x2="498" y2="225" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="225" r="96" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="208.47" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">One person,</text><text x="450" y="231.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">family or</text><text x="450" y="254.83" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">organisation</text><rect x="30" y="167" width="260" height="51" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="197.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Interviews</text><rect x="30" y="232" width="260" height="51" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="262.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Observation</text><rect x="610" y="199.5" width="260" height="51" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="229.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Questionnaires</text><rect x="30" y="348" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="381.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Techniques are combined so the findings can be <tspan font-weight="700" fill="#1e2a44">checked</tspan> <tspan font-weight="700" fill="#1e2a44">against</tspan> <tspan font-weight="700" fill="#1e2a44">each</tspan> <tspan font-weight="700" fill="#1e2a44">other</tspan>.</text><rect x="30" y="428" width="840" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="462.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Core example</text><text x="50" y="492.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Saavedra and Silverman: a boy with button phobia.</text><rect x="30" y="539" width="413" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="571" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTHS</text><text x="50" y="602.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="602.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rich, detailed, often qualitative data</text><text x="50" y="628.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="628.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Can study rare cases that could not be created</text><text x="65.2" y="649.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">experimentally</text><rect x="457" y="539" width="413" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="571" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKNESSES</text><text x="477" y="602.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="602.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May not generalise from one case</text><text x="477" y="628.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="628.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Researcher may become subjective</text><text x="477" y="654.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="654.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Retrospective information depends on memory</text>
</svg>