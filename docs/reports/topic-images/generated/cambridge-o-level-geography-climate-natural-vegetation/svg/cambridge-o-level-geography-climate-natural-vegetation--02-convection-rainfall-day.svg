<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Convection rainfall: an equatorial day</text>

<rect x="30" y="110" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="144" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="150.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="94" y="151" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Morning</text><rect x="50" y="170" width="370" height="150" rx="10" fill="#dce9e7"/><rect x="50" y="300" width="370" height="20" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><line x1="136" y1="270" x2="145" y2="270" stroke="#8a6d0d" stroke-width="3"/><line x1="128.38477631085024" y1="288.3847763108502" x2="134.74873734152916" y2="294.74873734152914" stroke="#8a6d0d" stroke-width="3"/><line x1="110" y1="296" x2="110" y2="305" stroke="#8a6d0d" stroke-width="3"/><line x1="91.61522368914976" y1="288.3847763108502" x2="85.25126265847084" y2="294.74873734152914" stroke="#8a6d0d" stroke-width="3"/><line x1="84" y1="270" x2="75" y2="270" stroke="#8a6d0d" stroke-width="3"/><line x1="91.61522368914976" y1="251.61522368914976" x2="85.25126265847084" y2="245.25126265847084" stroke="#8a6d0d" stroke-width="3"/><line x1="110" y1="244" x2="110" y2="235" stroke="#8a6d0d" stroke-width="3"/><line x1="128.38477631085024" y1="251.61522368914976" x2="134.74873734152916" y2="245.25126265847084" stroke="#8a6d0d" stroke-width="3"/><circle cx="110" cy="270" r="20" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="290" y="240" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">clear sky</text><text x="54" y="350" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Skies are often clear in the early part</text><text x="54" y="372" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">of the day.</text><rect x="460" y="110" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="494" cy="144" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="494" y="150.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="524" y="151" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">The ground heats up</text><rect x="480" y="170" width="370" height="150" rx="10" fill="#dce9e7"/><rect x="480" y="300" width="370" height="20" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><line x1="695" y1="210" x2="704" y2="210" stroke="#8a6d0d" stroke-width="3"/><line x1="686.2132034355964" y1="231.21320343559643" x2="692.5771644662753" y2="237.57716446627535" stroke="#8a6d0d" stroke-width="3"/><line x1="665" y1="240" x2="665" y2="249" stroke="#8a6d0d" stroke-width="3"/><line x1="643.7867965644036" y1="231.21320343559643" x2="637.4228355337247" y2="237.57716446627535" stroke="#8a6d0d" stroke-width="3"/><line x1="635" y1="210" x2="626" y2="210" stroke="#8a6d0d" stroke-width="3"/><line x1="643.7867965644035" y1="188.78679656440357" x2="637.4228355337247" y2="182.42283553372465" stroke="#8a6d0d" stroke-width="3"/><line x1="665" y1="180" x2="665" y2="171" stroke="#8a6d0d" stroke-width="3"/><line x1="686.2132034355964" y1="188.78679656440357" x2="692.5771644662753" y2="182.42283553372465" stroke="#8a6d0d" stroke-width="3"/><circle cx="665" cy="210" r="24" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><path d="M610,295 q6,-10 0,-20 q-6,-10 0,-20" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M665,295 q6,-10 0,-20 q-6,-10 0,-20" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M720,295 q6,-10 0,-20 q-6,-10 0,-20" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="484" y="350" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">The high midday Sun heats the ground and</text><text x="484" y="372" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">the air above it.</text><rect x="30" y="430" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="464" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="470.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="94" y="471" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Warm air rises</text><rect x="50" y="490" width="370" height="150" rx="10" fill="#dce9e7"/><rect x="50" y="620" width="370" height="20" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><line x1="180" y1="615" x2="180" y2="550" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="235" y1="615" x2="235" y2="550" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="290" y1="615" x2="290" y2="550" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><path d="M193,542 Q179,542 180.4,528 Q181.8,512.6 200,515.4 Q207,494.4 231.5,498.6 Q252.5,486 266.5,510.5 Q291,510.5 289.6,529.4 Q291,542 277,542 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="394" y1="525" x2="403" y2="525" stroke="#8a6d0d" stroke-width="3"/><line x1="386.97056274847716" y1="541.9705627484772" x2="393.3345237791561" y2="548.334523779156" stroke="#8a6d0d" stroke-width="3"/><line x1="370" y1="549" x2="370" y2="558" stroke="#8a6d0d" stroke-width="3"/><line x1="353.02943725152284" y1="541.9705627484772" x2="346.6654762208439" y2="548.334523779156" stroke="#8a6d0d" stroke-width="3"/><line x1="346" y1="525" x2="337" y2="525" stroke="#8a6d0d" stroke-width="3"/><line x1="353.02943725152284" y1="508.02943725152284" x2="346.6654762208439" y2="501.6654762208439" stroke="#8a6d0d" stroke-width="3"/><line x1="370" y1="501" x2="370" y2="492" stroke="#8a6d0d" stroke-width="3"/><line x1="386.97056274847716" y1="508.02943725152284" x2="393.3345237791561" y2="501.6654762208439" stroke="#8a6d0d" stroke-width="3"/><circle cx="370" cy="525" r="18" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="670" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Rising air cools, water vapour condenses</text><text x="54" y="692" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">and towering clouds build.</text><rect x="460" y="430" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="494" cy="464" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="494" y="470.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="524" y="471" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Afternoon storm</text><rect x="480" y="490" width="370" height="150" rx="10" fill="#d7dde0"/><rect x="480" y="620" width="370" height="20" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><path d="M602,556 Q581,556 583.1,535 Q585.2,511.9 612.5,516.1 Q623,484.6 659.75,490.9 Q691.25,472 712.25,508.75 Q749,508.75 746.9,537.1 Q749,556 728,556 Z" fill="#9aa6b2" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="600" y1="565" x2="595" y2="595" stroke="#2b5a9a" stroke-width="2.5"/><line x1="618" y1="573" x2="613" y2="603" stroke="#2b5a9a" stroke-width="2.5"/><line x1="636" y1="565" x2="631" y2="595" stroke="#2b5a9a" stroke-width="2.5"/><line x1="654" y1="573" x2="649" y2="603" stroke="#2b5a9a" stroke-width="2.5"/><line x1="672" y1="565" x2="667" y2="595" stroke="#2b5a9a" stroke-width="2.5"/><line x1="690" y1="573" x2="685" y2="603" stroke="#2b5a9a" stroke-width="2.5"/><line x1="708" y1="565" x2="703" y2="595" stroke="#2b5a9a" stroke-width="2.5"/><line x1="726" y1="573" x2="721" y2="603" stroke="#2b5a9a" stroke-width="2.5"/><path d="M790,555 l-14,26 l12,0 l-12,26" fill="none" stroke="#d4b02e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="484" y="670" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Cumulonimbus clouds give heavy</text><text x="484" y="692" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">thunderstorms, almost every day.</text>
</svg>