<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Deforestation: from causes to consequences</text>

<text x="30" y="138" font-size="19" font-weight="700" fill="#4a5568" text-anchor="start">Causes (Amazon)</text><rect x="30" y="152" width="272" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="183" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cattle ranching</text><text x="48" y="208" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">largest single cause</text><rect x="313" y="152" width="272" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="331" y="183" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Commercial farming</text><text x="331" y="208" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">especially soya</text><rect x="596" y="152" width="272" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="183" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Logging</text><text x="614" y="208" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">valuable hardwoods</text><rect x="30" y="236" width="272" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="267" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mining</text><text x="48" y="292" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">e.g. Carajás iron ore</text><rect x="313" y="236" width="272" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="331" y="267" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Road building</text><text x="331" y="292" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Trans-Amazonian Highway</text><rect x="596" y="236" width="272" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="267" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hydroelectric dams</text><text x="614" y="292" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Belo Monte, Xingu River</text><line x1="450" y1="322" x2="450" y2="352" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="356" width="840" height="56" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="392" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Forest cleared: the canopy is removed</text><line x1="165" y1="414" x2="165" y2="438" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="165" y="462" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">The soil chain</text><line x1="450" y1="414" x2="450" y2="438" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="462" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Environment</text><line x1="735" y1="414" x2="735" y2="438" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="735" y="462" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Climate and people</text><rect x="30" y="478" width="270" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="511.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Soil exposed</text><text x="48" y="536.525" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to heavy rain with no</text><text x="48" y="557.645" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">canopy</text><line x1="165" y1="573" x2="165" y2="590" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="594" width="270" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="627.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Eroded and leached</text><text x="48" y="652.525" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">nutrient store already gone</text><line x1="165" y1="689" x2="165" y2="706" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="710" width="270" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="743.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Infertile</text><text x="48" y="768.525" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">within a few years</text><rect x="315" y="478" width="270" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="333" y="511.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Rivers silted</text><text x="333" y="536.525" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">eroded soil washes in;</text><text x="333" y="557.645" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">flood risk rises</text><rect x="315" y="594" width="270" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="333" y="627.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Habitats lost</text><text x="333" y="652.525" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">species lost too</text><rect x="315" y="710" width="270" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="333" y="743.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Less transpiration</text><text x="333" y="768.525" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">can reduce local rainfall</text><rect x="600" y="478" width="270" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="511.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">CO₂ released</text><text x="618" y="536.525" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from burning and decay:</text><text x="618" y="557.645" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">enhanced greenhouse effect</text><rect x="600" y="594" width="270" height="92" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="627.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Indigenous peoples</text><text x="618" y="652.525" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lose land and ways of life</text><rect x="600" y="710" width="270" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="743.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">But also</text><text x="618" y="768.525" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">jobs, export income and</text><text x="618" y="789.645" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">roads: weigh the effects</text>
</svg>