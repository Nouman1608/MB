<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the rainforest keeps its nutrients</text>

<rect x="30" y="110" width="410" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Intact forest</text><circle cx="235" cy="250" r="80" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="256" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Biomass</text><circle cx="125" cy="430" r="34" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="436" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Litter</text><circle cx="345" cy="430" r="38" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="436" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Soil</text><line x1="190.15529918695816" y1="323.38223769406846" x2="146.90090039706695" y2="394.1621629866177" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="165" y1="430" x2="299" y2="430" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="322.0561995840251" y1="392.4555993193138" x2="280.8876008319498" y2="325.08880136137236" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="80" y="330" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">leaf fall</text><text x="205" y="470" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">decays in weeks</text><text x="330" y="320" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">shallow</text><text x="330" y="340" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">roots take</text><text x="330" y="360" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">it back up</text><line x1="345" y1="470" x2="345" y2="530" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="362" y="520" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">leaching</text><text x="55" y="580" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Most nutrients are stored in the trees.</text><text x="55" y="602" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">The cycle is fast, so the soil itself</text><text x="55" y="624" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">stays poor.</text><rect x="460" y="110" width="410" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="150" font-size="23" font-weight="700" fill="#b5602e" text-anchor="middle">After clearance</text><circle cx="665" cy="250" r="80" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="665" y="256" font-size="19" font-weight="700" fill="#4a5568" text-anchor="middle">removed</text><circle cx="555" cy="430" r="20" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="555" y="436" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><circle cx="775" cy="430" r="30" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="775" y="436" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Soil</text><path d="M784.8,223.4 Q776.4,223.4 777.24,215 Q778.08,205.76 789,207.44 Q793.2,194.84 807.9,197.36 Q820.5,189.8 828.9,204.5 Q843.6,204.5 842.76,215.84 Q843.6,223.4 835.2,223.4 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="785" y1="233" x2="780" y2="259" stroke="#2b5a9a" stroke-width="2.5"/><line x1="799" y1="241" x2="794" y2="267" stroke="#2b5a9a" stroke-width="2.5"/><line x1="813" y1="233" x2="808" y2="259" stroke="#2b5a9a" stroke-width="2.5"/><line x1="827" y1="241" x2="822" y2="267" stroke="#2b5a9a" stroke-width="2.5"/><text x="800" y="300" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="middle">heavy rain</text><line x1="785" y1="466" x2="785" y2="545" stroke="#b5602e" stroke-width="9" marker-end="url(#ahR)"/><text x="805" y="520" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">leached</text><line x1="735" y1="440" x2="655" y2="520" stroke="#8a6d0d" stroke-width="6" marker-end="url(#ahO)"/><text x="650" y="545" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">eroded</text><text x="555" y="475" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">little litter</text><text x="485" y="580" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">With the nutrient store gone, soils</text><text x="485" y="602" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">become infertile within a few years.</text><text x="450" y="700" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Circle size shows the size of each store (illustrative)</text>
</svg>