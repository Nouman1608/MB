<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why it rains at the Equator and not in the deserts</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic side view, not to scale</text>
<rect x="30" y="115" width="840" height="355" rx="14" fill="#dce9e7"/><rect x="30" y="470" width="230" height="46" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><rect x="260" y="470" width="380" height="46" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.5"/><rect x="640" y="470" width="230" height="46" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><path d="M375,230 Q350,230 352.5,205 Q355,177.5 387.5,182.5 Q400,145 443.75,152.5 Q481.25,130 506.25,173.75 Q550,173.75 547.5,207.5 Q550,230 525,230 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="355" y1="250" x2="350" y2="272" stroke="#2b5a9a" stroke-width="2.5"/><line x1="371" y1="258" x2="366" y2="280" stroke="#2b5a9a" stroke-width="2.5"/><line x1="387" y1="250" x2="382" y2="272" stroke="#2b5a9a" stroke-width="2.5"/><line x1="515" y1="250" x2="510" y2="272" stroke="#2b5a9a" stroke-width="2.5"/><line x1="531" y1="258" x2="526" y2="280" stroke="#2b5a9a" stroke-width="2.5"/><line x1="547" y1="250" x2="542" y2="272" stroke="#2b5a9a" stroke-width="2.5"/><line x1="405" y1="458" x2="405" y2="250" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><line x1="450" y1="458" x2="450" y2="250" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><line x1="495" y1="458" x2="495" y2="250" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><line x1="135" y1="175" x2="135" y2="456" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><line x1="765" y1="175" x2="765" y2="456" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><line x1="350" y1="150" x2="175" y2="150" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="550" y1="150" x2="725" y2="150" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="175" y1="448" x2="360" y2="448" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><line x1="725" y1="448" x2="540" y2="448" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="268" y="434" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">trade winds</text><text x="632" y="434" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">trade winds</text><text x="525" y="318" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Heated air rises, cools;</text><text x="525" y="341" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">water vapour condenses</text><text x="525" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">into cumulonimbus cloud</text><text x="525" y="387" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and heavy rain falls</text><text x="165" y="205" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Air sinks, warms and</text><text x="165" y="228" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">holds its moisture:</text><text x="165" y="251" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">clouds rarely form</text><text x="735" y="205" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">Air sinks</text><text x="735" y="228" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">and warms:</text><text x="735" y="251" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">clear skies</text><text x="450" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">LOW PRESSURE</text><text x="145" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">HIGH PRESSURE</text><text x="755" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">HIGH PRESSURE</text><line x1="450" y1="516" x2="450" y2="532" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="556" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Equator</text><text x="450" y="580" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Equatorial climate</text><text x="450" y="602" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">within about 5–10° of the Equator</text><text x="145" y="556" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Near the Tropic</text><text x="145" y="580" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">Hot desert climate</text><text x="145" y="602" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">about 15–30° from it</text><text x="755" y="556" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Near the Tropic</text><text x="755" y="580" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">Hot desert climate</text><text x="755" y="602" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">about 15–30° from it</text>
</svg>