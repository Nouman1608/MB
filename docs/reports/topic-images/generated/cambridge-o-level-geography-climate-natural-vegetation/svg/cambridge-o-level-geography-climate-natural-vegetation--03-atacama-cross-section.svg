<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Atacama gets almost no rain</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic west–east cross-section, not to scale</text>
<rect x="30" y="115" width="840" height="385" rx="14" fill="#dce9e7"/><rect x="30" y="460" width="222" height="40" fill="#b5d3cf"/><line x1="30" y1="460" x2="252" y2="460" stroke="#2e6b62" stroke-width="2.5"/><path d="M250,460 L460,450 L560,350 L640,200 L700,320 L790,410 L870,430 L870,500 L250,500 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M700,320 L790,410 L870,430 L870,500 L700,500 Z" fill="#a9c48f" opacity="0.9"/><path d="M640,200 L700,320 L790,410 L870,430" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="40" y="418" width="400" height="34" rx="17" fill="#ffffff" opacity="0.75"/><text x="240" y="440" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">fog, not rain</text><text x="140" y="492" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="middle">cold current</text><text x="355" y="492" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Atacama desert</text><text x="630" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Andes</text><path d="M860,390 Q760,360 700,260 Q670,200 640,170" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M709,262 Q697,262 698.2,250 Q699.4,236.8 715,239.2 Q721,221.2 742,224.8 Q760,214 772,235 Q793,235 791.8,251.2 Q793,262 781,262 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="718" y1="272" x2="713" y2="292" stroke="#2b5a9a" stroke-width="2.5"/><line x1="734" y1="280" x2="729" y2="300" stroke="#2b5a9a" stroke-width="2.5"/><line x1="750" y1="272" x2="745" y2="292" stroke="#2b5a9a" stroke-width="2.5"/><line x1="766" y1="280" x2="761" y2="300" stroke="#2b5a9a" stroke-width="2.5"/><path d="M620,170 Q570,220 520,320" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="760" y="165" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">moist air</text><text x="760" y="185" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">from the east</text><text x="805" y="462" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">windward</text><text x="805" y="481" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">side: rain</text><text x="500" y="262" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">rain shadow:</text><text x="500" y="282" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">air arrives dry</text><line x1="150" y1="135" x2="150" y2="215" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="230" y1="135" x2="230" y2="215" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="310" y1="135" x2="310" y2="215" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="230" y="245" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">high pressure:</text><text x="230" y="265" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">air sinks and warms</text><text x="140" y="330" font-size="16" font-weight="400" fill="#2b5a9a" text-anchor="middle">cold ocean water</text><text x="140" y="350" font-size="16" font-weight="400" fill="#2b5a9a" text-anchor="middle">cools the air: stable,</text><text x="140" y="370" font-size="16" font-weight="400" fill="#2b5a9a" text-anchor="middle">little water vapour</text><text x="48" y="145" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">W</text><text x="852" y="145" font-size="18" font-weight="700" fill="#4a5568" text-anchor="end">E</text><text x="450" y="555" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Five reasons hot deserts are dry</text><rect x="30" y="575" width="158" height="76" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="109" y="606" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Sinking air</text><text x="109" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">high pressure</text><rect x="200" y="575" width="158" height="76" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="279" y="606" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Dry trade winds</text><text x="279" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">crossed land first</text><rect x="370" y="575" width="158" height="76" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="449" y="606" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Far from the sea</text><text x="449" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">continental interior</text><rect x="540" y="575" width="158" height="76" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619" y="606" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Cold current</text><text x="619" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fog, not rain</text><rect x="710" y="575" width="158" height="76" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="789" y="606" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Rain shadow</text><text x="789" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mountains block air</text>
</svg>