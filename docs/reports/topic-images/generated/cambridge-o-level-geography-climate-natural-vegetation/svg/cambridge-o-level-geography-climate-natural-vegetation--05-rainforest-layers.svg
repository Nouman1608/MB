<rect width="900" height="870" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Layers of the tropical rainforest</text>

<rect x="30" y="110" width="840" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="125" width="490" height="405" rx="10" fill="#dce9e7"/><rect x="50" y="460" width="490" height="70" fill="#c9d3c4"/><rect x="143" y="170" width="14" height="360" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="413" y="185" width="14" height="345" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="95.5" y="290" width="9" height="240" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="245.5" y="290" width="9" height="240" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="325.5" y="290" width="9" height="240" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="485.5" y="290" width="9" height="240" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="186.5" y="440" width="7" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="296.5" y="440" width="7" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="451.5" y="440" width="7" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><ellipse cx="80" cy="268" rx="40" ry="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="135" cy="278" rx="40" ry="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="190" cy="268" rx="40" ry="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="245" cy="278" rx="40" ry="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="300" cy="268" rx="40" ry="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="355" cy="278" rx="40" ry="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="410" cy="268" rx="40" ry="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="465" cy="278" rx="40" ry="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="515" cy="268" rx="40" ry="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="150" cy="160" rx="62" ry="30" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="420" cy="175" rx="55" ry="27" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="190" cy="432" rx="26" ry="18" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="300" cy="432" rx="26" ry="18" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.2"/><ellipse cx="455" cy="432" rx="26" ry="18" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.2"/><path d="M120,530 L144,475 L144,530 Z M180,530 L156,475 L156,530 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round"/><path d="M250,530 q10,-20 0,-40 q-10,-20 0,-40 q10,-20 0,-40 q-10,-20 0,-40 q10,-20 0,-40 q-10,-20 0,-40" fill="none" stroke="#8a6d0d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M414,372 q-16,-14 -20,-2 q8,6 20,2 z M426,372 q16,-14 20,-2 q-8,6 -20,2 z M420,372 q-4,-18 0,-22 q4,4 0,22 z" fill="#6f9a52" stroke="#1e2a44" stroke-width="1.6"/><rect x="50" y="530" width="490" height="12" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="186" y="501.75" width="138" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="192" y="516" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">buttress roots</text><rect x="258" y="461.75" width="57" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="264" y="476" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">liana</text><rect x="444" y="363.75" width="84" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="450" y="378" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">epiphyte</text><line x1="545" y1="158" x2="575" y2="158" stroke="#4a5568" stroke-width="2.5" stroke-dasharray="5 5"/><text x="585" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Emergents</text><text x="585" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rise above the rest, up to</text><text x="585" y="195" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about 50 m</text><line x1="545" y1="268" x2="575" y2="268" stroke="#4a5568" stroke-width="2.5" stroke-dasharray="5 5"/><text x="585" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Canopy</text><text x="585" y="282" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dense, almost continuous roof;</text><text x="585" y="303" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">intercepts most light and rain</text><line x1="545" y1="432" x2="575" y2="432" stroke="#4a5568" stroke-width="2.5" stroke-dasharray="5 5"/><text x="585" y="410" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Understorey</text><text x="585" y="434" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">younger trees and shrubs</text><text x="585" y="455" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">adapted to shade</text><line x1="545" y1="505" x2="575" y2="505" stroke="#4a5568" stroke-width="2.5" stroke-dasharray="5 5"/><text x="585" y="498" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Forest floor</text><text x="585" y="522" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dark, with little undergrowth</text><text x="450" y="600" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Plant adaptations</text><rect x="30" y="620" width="410" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="654.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Drip tips</text><text x="48" y="679.725" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Leaves shed water quickly, so fungi and</text><text x="48" y="701.505" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">algae cannot grow.</text><rect x="460" y="620" width="410" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="654.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Buttress roots</text><text x="478" y="679.725" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Support very tall trees in shallow soil.</text><rect x="30" y="738" width="410" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="772.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lianas and epiphytes</text><text x="48" y="797.725" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Reach the light without growing a trunk of</text><text x="48" y="819.505" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">their own.</text><rect x="460" y="738" width="410" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="772.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Thin, smooth bark</text><text x="478" y="797.725" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">Enough, because there is no cold season.</text>
</svg>