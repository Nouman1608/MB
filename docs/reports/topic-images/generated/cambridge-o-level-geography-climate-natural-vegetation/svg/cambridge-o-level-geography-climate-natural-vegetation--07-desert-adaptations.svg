<rect width="900" height="870" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Surviving in the hot desert</text>

<rect x="30" y="110" width="470" height="590" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="265" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">A desert succulent</text><rect x="50" y="165" width="430" height="165" rx="8" fill="#f2e7b8"/><line x1="121" y1="205" x2="130" y2="205" stroke="#8a6d0d" stroke-width="3"/><line x1="113.38477631085024" y1="223.38477631085024" x2="119.74873734152916" y2="229.74873734152916" stroke="#8a6d0d" stroke-width="3"/><line x1="95" y1="231" x2="95" y2="240" stroke="#8a6d0d" stroke-width="3"/><line x1="76.61522368914976" y1="223.38477631085024" x2="70.25126265847084" y2="229.74873734152916" stroke="#8a6d0d" stroke-width="3"/><line x1="69" y1="205" x2="60" y2="205" stroke="#8a6d0d" stroke-width="3"/><line x1="76.61522368914976" y1="186.61522368914976" x2="70.25126265847084" y2="180.25126265847084" stroke="#8a6d0d" stroke-width="3"/><line x1="95" y1="179" x2="95" y2="170" stroke="#8a6d0d" stroke-width="3"/><line x1="113.38477631085023" y1="186.61522368914976" x2="119.74873734152916" y2="180.25126265847084" stroke="#8a6d0d" stroke-width="3"/><circle cx="95" cy="205" r="20" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><rect x="50" y="330" width="430" height="300" fill="#efdfa8"/><line x1="50" y1="330" x2="480" y2="330" stroke="#1e2a44" stroke-width="3"/><rect x="50" y="590" width="430" height="40" fill="#b5d3cf"/><text x="265" y="616" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">groundwater</text><path d="M265,330 L265,592" fill="none" stroke="#9c8f6e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M265,336 Q190,350 80,348 M265,336 Q340,354 450,350 M265,336 Q200,366 120,374 M265,336 Q330,370 410,378" fill="none" stroke="#9c8f6e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="240" y="190" width="50" height="140" rx="25" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><path d="M240,270 L215,270 Q205,270 205,258 L205,225 Q205,212 217,212 Q229,212 229,225 L229,250 L240,250 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><path d="M290,285 L312,285 Q322,285 322,273 L322,245 Q322,232 310,232 Q298,232 298,245 L298,265 L290,265 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><line x1="240" y1="205" x2="230" y2="200" stroke="#1e2a44" stroke-width="1.6"/><line x1="290" y1="215" x2="300" y2="210" stroke="#1e2a44" stroke-width="1.6"/><line x1="240" y1="227" x2="230" y2="222" stroke="#1e2a44" stroke-width="1.6"/><line x1="290" y1="237" x2="300" y2="232" stroke="#1e2a44" stroke-width="1.6"/><line x1="240" y1="249" x2="230" y2="244" stroke="#1e2a44" stroke-width="1.6"/><line x1="290" y1="259" x2="300" y2="254" stroke="#1e2a44" stroke-width="1.6"/><line x1="240" y1="271" x2="230" y2="266" stroke="#1e2a44" stroke-width="1.6"/><line x1="290" y1="281" x2="300" y2="276" stroke="#1e2a44" stroke-width="1.6"/><line x1="240" y1="293" x2="230" y2="288" stroke="#1e2a44" stroke-width="1.6"/><line x1="290" y1="303" x2="300" y2="298" stroke="#1e2a44" stroke-width="1.6"/><line x1="240" y1="315" x2="230" y2="310" stroke="#1e2a44" stroke-width="1.6"/><line x1="290" y1="325" x2="300" y2="320" stroke="#1e2a44" stroke-width="1.6"/><text x="340" y="200" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">spines or small,</text><text x="340" y="220" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">waxy leaves:</text><text x="340" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less transpiration</text><text x="122" y="270" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">succulent</text><text x="122" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">stem stores</text><text x="122" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">water</text><rect x="139" y="386.8" width="252" height="21.6" rx="5" fill="#efdfa8" opacity="1"/><text x="265" y="402" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">wide, shallow roots catch</text><rect x="122.6" y="407.8" width="284.8" height="21.6" rx="5" fill="#efdfa8" opacity="1"/><text x="265" y="423" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">brief rain before it evaporates</text><text x="285" y="520" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">long tap root</text><text x="285" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reaches groundwater</text><text x="265" y="675" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Every feature gets or saves water.</text><rect x="520" y="110" width="350" height="590" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="695" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Ephemerals</text><text x="695" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">wait as seeds for rain</text><rect x="560" y="200" width="270" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="695" y="242" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Seeds lie in the soil</text><line x1="695" y1="272" x2="695" y2="314" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="560" y="318" width="270" height="70" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="695" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rain falls</text><line x1="695" y1="390" x2="695" y2="432" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="560" y="436" width="270" height="70" rx="12" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2.5"/><text x="695" y="478" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Germinate and flower</text><line x1="695" y1="508" x2="695" y2="550" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="560" y="554" width="270" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="695" y="596" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Set seed within weeks</text><path d="M832,589 Q858,589 858,560 L858,265 Q858,235 836,235" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#ahT)"/><text x="695" y="680" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">then wait for the next rain</text><rect x="30" y="720" width="840" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="756" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Animals avoid the heat and save water</text><text x="60" y="788" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many are nocturnal or live in burrows · the fennec fox loses heat through its large ears</text><text x="60" y="816" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The camel can go long periods without drinking and has wide feet for soft sand</text>
</svg>