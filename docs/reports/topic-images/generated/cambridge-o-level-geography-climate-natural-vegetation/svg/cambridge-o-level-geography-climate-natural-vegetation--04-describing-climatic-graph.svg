<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 799" width="900" height="799" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="799" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Describing a climatic graph in four moves</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Example: the illustrative equatorial station in the worked example</text>
<rect x="30" y="115" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="171" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="72" y="178.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="112" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Overall statement</text><text x="112" y="179" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Temperatures are high all year. Rainfall is heavy, with every month getting at</text><text x="112" y="201" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">least 100 mm.</text><line x1="72" y1="195" x2="72" y2="237" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="241" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="297" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="304.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="112" y="277" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Maximum and minimum, with months</text><text x="112" y="305" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">28 °C in March, April and October; 26 °C in June and July. Rain peaks at 300 mm</text><text x="112" y="327" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in April, lowest 100 mm in August.</text><line x1="72" y1="321" x2="72" y2="363" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="367" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="423" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="430.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="112" y="403" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Range or total</text><text x="112" y="431" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Annual temperature range 2 °C. Total rainfall 2,520 mm.</text><line x1="72" y1="447" x2="72" y2="489" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="493" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="549" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="556.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="112" y="529" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Seasonal pattern</text><text x="112" y="557" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A wetter period around April and a less wet one around August, but no dry season.</text><rect x="30" y="627" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="665" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Asked to explain? Attach a factor to each feature</text><text x="60" y="701" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">High temperatures</text><line x1="240" y1="695" x2="300" y2="695" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="312" y="701" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">high Sun angle all year</text><text x="60" y="739" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rain in every month</text><line x1="240" y1="733" x2="300" y2="733" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="312" y="739" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">low pressure and convection</text>
</svg>