<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The life of a star like the Sun</text>

<rect x="30" y="110" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="120" cy="167" r="26" fill="#c9d3e3" stroke="#4a5568" stroke-width="2" opacity="0.9"/><circle cx="150" cy="153" r="28" fill="#c9d3e3" stroke="#4a5568" stroke-width="2" opacity="0.9"/><circle cx="178" cy="169" r="26" fill="#c9d3e3" stroke="#4a5568" stroke-width="2" opacity="0.9"/><circle cx="138" cy="191" r="24" fill="#c9d3e3" stroke="#4a5568" stroke-width="2" opacity="0.9"/><circle cx="168" cy="193" r="22" fill="#c9d3e3" stroke="#4a5568" stroke-width="2" opacity="0.9"/><circle cx="130" cy="165" r="2.5" fill="#1e2a44"/><circle cx="160" cy="180" r="2.5" fill="#1e2a44"/><circle cx="175" cy="157" r="2.5" fill="#1e2a44"/><circle cx="145" cy="197" r="2.5" fill="#1e2a44"/><circle cx="270" cy="158" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="270" y="165.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="305" y="166" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Nebula</text><text x="305" y="200" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">cloud of gas (mostly hydrogen) and dust</text><line x1="150" y1="242" x2="150" y2="288" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="180" y="272" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">gravity pulls material together; it heats up</text><rect x="30" y="290" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="355" r="30" fill="#e8c547" stroke="#1e2a44" stroke-width="2.5"/><circle cx="270" cy="338" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="270" y="345.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="305" y="346" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Main sequence star</text><text x="305" y="380" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">hydrogen fuses to helium; stable (the Sun now)</text><line x1="150" y1="422" x2="150" y2="468" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="180" y="452" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">hydrogen in the core runs out</text><rect x="30" y="470" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="535" r="50" fill="#c8553d" stroke="#1e2a44" stroke-width="2.5"/><circle cx="270" cy="518" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="270" y="525.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="305" y="526" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Red giant</text><text x="305" y="560" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">outer layers expand and cool</text><line x1="150" y1="602" x2="150" y2="648" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="180" y="632" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">outer layers drift away into space</text><rect x="30" y="650" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="715" r="12" fill="#f4f1e6" stroke="#1e2a44" stroke-width="2.5"/><circle cx="270" cy="698" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="270" y="705.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="305" y="706" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">White dwarf</text><text x="305" y="740" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">hot, dense core; slowly cools and fades</text>
</svg>