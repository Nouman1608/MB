<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Absolute magnitude (Physics only)</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Apparent brightness depends on light given out and distance</text><circle cx="90" cy="280" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="90" y="320" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Earth</text><circle cx="300" cy="240" r="12" fill="#e8c547" stroke="#1e2a44" stroke-width="2.5"/><text x="300" y="210" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">dim star, nearby</text><circle cx="760" cy="300" r="28" fill="#6f9bd6" stroke="#1e2a44" stroke-width="2.5"/><text x="760" y="252" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">powerful star, far away</text><line x1="118" y1="274" x2="285" y2="244" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><line x1="118" y1="284" x2="730" y2="300" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><text x="60" y="380" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">From Earth the dim star can look brighter. To compare fairly, imagine every star</text><text x="60" y="405" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">at the same standard distance, 10 parsecs (about 32.6 light-years).</text><rect x="30" y="460" width="840" height="300" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Absolute magnitude: brightness at the standard distance</text><line x1="90" y1="600" x2="810" y2="600" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="590" x2="110" y2="610" stroke="#1e2a44" stroke-width="3"/><text x="110" y="640" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">−5</text><line x1="336.66666666666663" y1="590" x2="336.66666666666663" y2="610" stroke="#1e2a44" stroke-width="3"/><text x="336.66666666666663" y="640" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><line x1="563.3333333333333" y1="590" x2="563.3333333333333" y2="610" stroke="#1e2a44" stroke-width="3"/><text x="563.3333333333333" y="640" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">+5</text><line x1="790" y1="590" x2="790" y2="610" stroke="#1e2a44" stroke-width="3"/><text x="790" y="640" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">+10</text><circle cx="110" cy="556" r="22" fill="#f4f1e6" stroke="#1e2a44" stroke-width="2.5"/><circle cx="563.3333333333333" cy="562" r="12" fill="#e8c547" stroke="#1e2a44" stroke-width="2.5"/><text x="563.3333333333333" y="534" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the Sun ≈ +5</text><circle cx="790" cy="566" r="6" fill="#c8553d" stroke="#1e2a44" stroke-width="2.5"/><line x1="790" y1="680" x2="110" y2="680" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="706" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">smaller (more negative) number = brighter star</text><text x="450" y="738" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The very brightest stars have negative absolute magnitudes.</text>
</svg>