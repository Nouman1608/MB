<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Star colour shows surface temperature</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="120" cy="250" r="46" fill="#c8553d" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">red</text><circle cx="285" cy="250" r="46" fill="#e08a3c" stroke="#1e2a44" stroke-width="2.5"/><text x="285" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">orange</text><circle cx="450" cy="250" r="46" fill="#e8c547" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">yellow</text><circle cx="615" cy="250" r="46" fill="#f4f1e6" stroke="#1e2a44" stroke-width="2.5"/><text x="615" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">white</text><circle cx="780" cy="250" r="46" fill="#6f9bd6" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">blue</text><text x="120" y="370" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">about 3000 K</text><text x="120" y="392" font-size="16" font-weight="700" fill="#c8553d" text-anchor="middle">coolest</text><text x="450" y="370" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the Sun:</text><text x="450" y="392" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">about 5800 K</text><text x="780" y="370" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">above 10 000 K</text><text x="780" y="392" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">hottest</text><line x1="120" y1="440" x2="780" y2="440" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="475" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">surface temperature increases</text><text x="450" y="160" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Temperatures approximate: they show the trend</text><rect x="30" y="530" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="568" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Like heated metal: dull red → orange → yellow → white as it gets hotter.</text><text x="60" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A hotter object emits more of its radiation at shorter wavelengths, so its light</text><text x="60" y="624" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shifts from the red end of the spectrum towards the blue end. Colour shows the</text><text x="60" y="648" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surface temperature, not the distance or size of the star.</text>
</svg>