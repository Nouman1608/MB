934977427" x2="251.01652065726844" y2="221.74341983855533" stroke="#2b5a9a" stroke-width="5" marker-end="url(#ah)"/><line x1="273.2121597344437" y1="275.32843272420996" x2="257.1394555751099" y2="236.5254923587359" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="376.536686473018" y1="155.22409349774267" x2="348.9834793427315" y2="221.74341983855533" stroke="#2b5a9a" stroke-width="5" marker-end="url(#ah)"/><line x1="326.7878402655563" y1="275.32843272420996" x2="342.86054442489007" y2="236.5254923587359" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="484.77590650225727" y1="263.4633135269819" x2="418.2565801614447" y2="291.0165206572684" stroke="#2b5a9a" stroke-width="5" marker-end="url(#ah)"/><line x1="364.67156727579004" y1="313.2121597344437" x2="403.4745076412641" y2="297.1394555751099" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><rect x="560" y="160" width="280" height="120" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="580" y="196" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="start">Gravity</text><text x="580" y="226" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pulls the star's material</text><text x="580" y="249" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">inwards</text><rect x="560" y="300" width="280" height="120" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="580" y="336" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Pressure</text><text x="580" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">from energy released by</text><text x="580" y="389" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fusion pushes outwards</text><rect x="560" y="440" width="280" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="580" y="476" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Balanced: the star is</text><text x="580" y="499" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">stable for a very long</text><text x="580" y="522" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">time.</text><text x="300" y="560" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">When core hydrogen runs out, the balance is lost.</text>
