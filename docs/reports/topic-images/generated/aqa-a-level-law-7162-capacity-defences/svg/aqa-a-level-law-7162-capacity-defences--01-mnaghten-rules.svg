<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Insanity: the M’Naghten Rules (1843)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Presumed sane: the defendant must prove all three, on the balance of probabilities</text>
<line x1="60" y1="144" x2="60" y2="443" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A defect of reason</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reasoning impaired, not merely unused. <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Clarke</tspan> (1972): absent-mindedness from depression</text><text x="122" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">was not enough.</text><circle cx="60" cy="176.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="185.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="241" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="273.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">From a disease of the mind</text><text x="122" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A legal concept: an <tspan font-weight="700" fill="#1e2a44">internal</tspan> cause. Arteriosclerosis (<tspan font-style="italic">Kemp</tspan>), epilepsy (<tspan font-style="italic">Sullivan</tspan>), hyperglycaemia</text><text x="122" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Hennessy</tspan>), sleepwalking (<tspan font-style="italic">Burgess</tspan>). <tspan font-style="italic">Bratty</tspan>: disorder manifested in violence and prone to recur.</text><circle cx="60" cy="293.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="302.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="358" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="390.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">So that he did not know…</text><text x="122" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the <tspan font-weight="700" fill="#1e2a44">nature</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">quality</tspan> of the act (what he was physically doing), <tspan font-weight="700" fill="#1e2a44">or</tspan> that it was <tspan font-weight="700" fill="#1e2a44">legally</tspan> wrong. <tspan font-style="italic">R</tspan></text><text x="122" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Windle</tspan> (1952): “I suppose they will hang me for this” showed he knew; insanity failed.</text><circle cx="60" cy="410.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="419.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="485" width="265.3333333333333" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="541.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIAL VERDICT</text><text x="50" y="567.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Not guilty by reason of</text><text x="50" y="590.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">insanity</text><line x1="301.3333333333333" y1="562.5" x2="333.3333333333333" y2="562.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="339.3333333333333" y="485" width="530.6666666666666" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="359.3333333333333" y="517" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DISPOSAL: CRIMINAL PROCEDURE (INSANITY) ACT 1964</text><text x="359.3333333333333" y="543.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hospital order (with or without restrictions),</text><text x="359.3333333333333" y="566.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">supervision order or absolute discharge</text><text x="359.3333333333333" y="594.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Murder: a hospital order with restrictions must be made where</text><text x="359.3333333333333" y="615.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the conditions are met</text>
</svg>