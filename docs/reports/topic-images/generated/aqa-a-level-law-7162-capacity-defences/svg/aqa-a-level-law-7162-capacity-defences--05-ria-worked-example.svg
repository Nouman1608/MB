<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 809" width="900" height="809" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="809" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Ria and the insulin</text>

<rect x="30" y="100" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ria, a diabetic, injects insulin and skips breakfast. At work she becomes confused and pushes a</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">colleague down stairs, breaking his arm. She knew skipping meals after insulin could make her</text><text x="50" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unpredictable.</text><line x1="60" y1="275" x2="60" y2="757" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="255" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="288.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Charge</text><text x="122" y="318.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">s20 GBH (broken arm): a basic intent offence.</text><circle cx="60" cy="298" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="306.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="353" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="386.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cause</text><text x="122" y="416.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Hypoglycaemia from insulin is external (<tspan font-style="italic">Quick</tspan>): automatism, not insanity (contrast</text><text x="122" y="438.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Hennessy</tspan>).</text><circle cx="60" cy="407" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="415.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="473" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="506.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Control</text><text x="122" y="536.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Confused: was it a total loss of control (<tspan font-style="italic">A-G’s</tspan> <tspan font-style="italic">Ref</tspan> <tspan font-style="italic">No</tspan> <tspan font-style="italic">2</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">1992</tspan>)? If only reduced, the</text><text x="122" y="558.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">defence fails anyway.</text><circle cx="60" cy="527" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="535.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="593" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="626.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Self-induced</text><text x="122" y="656.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">She knew the risk, so she was reckless (<tspan font-style="italic">Bailey</tspan>): no defence to basic intent.</text><circle cx="60" cy="636" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="644.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="691" width="766" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="724.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="122" y="754.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Automatism is unlikely to succeed; she may be guilty of s20.</text><circle cx="60" cy="734" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="742.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>