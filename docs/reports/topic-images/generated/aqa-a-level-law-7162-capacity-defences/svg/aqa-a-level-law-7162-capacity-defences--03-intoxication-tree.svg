<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Intoxication: evidence of no mens rea</text>

<rect x="300" y="100" width="300" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="131.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Was the intoxication</text><text x="450" y="156.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">voluntary?</text><line x1="380" y1="182" x2="232" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="520" y1="182" x2="668" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="262" y="196" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">yes</text><text x="640" y="196" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">no: spiked drink, sedative</text><rect x="30" y="230" width="405" height="145" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="258" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIFIC INTENT</text><text x="46" y="284.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Defence if no intent formed</text><text x="46" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Murder, s18, theft, robbery, attempt (<tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan></text><text x="46" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Beard</tspan>). Often convicted of a basic intent</text><text x="46" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alternative</text><rect x="30" y="387" width="405" height="124" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="415" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BASIC INTENT</text><text x="46" y="441.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No defence</text><text x="46" y="469.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Manslaughter, s20, s47, assault, battery: getting</text><text x="46" y="490.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intoxicated is itself reckless (<tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Majewski</tspan>)</text><rect x="30" y="523" width="405" height="103" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="551" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DUTCH COURAGE</text><text x="46" y="577.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Intent formed, then drinks</text><text x="46" y="605.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Guilty even of specific intent (<tspan font-style="italic">Gallagher</tspan>)</text><rect x="465" y="230" width="405" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="481" y="258" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NO MENS REA FORMED</text><text x="481" y="284.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A defence to specific and basic intent</text><rect x="465" y="317" width="405" height="124" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="481" y="345" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MENS REA FORMED</text><text x="481" y="371.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No defence</text><text x="481" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“A drugged intent is still an intent” (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Kingston</tspan>,</text><text x="481" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1994)</text><rect x="465" y="453" width="405" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="481" y="481" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEDATIVES TAKEN NORMALLY</text><text x="481" y="507.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Treated as involuntary</text><text x="481" y="535.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unless he knew of the risk of unpredictable</text><text x="481" y="556.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">behaviour (<tspan font-style="italic">Hardie</tspan>)</text><rect x="30" y="648" width="840" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="680.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Underestimating a drink’s strength is still voluntary (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Allen</tspan>). Intoxicated mistakes cannot support</text><text x="50" y="701.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-defence (<tspan font-style="italic">O’Grady</tspan>; <tspan font-style="italic">Hatton</tspan>; s76(5) Criminal Justice and Immigration Act 2008).</text>
</svg>