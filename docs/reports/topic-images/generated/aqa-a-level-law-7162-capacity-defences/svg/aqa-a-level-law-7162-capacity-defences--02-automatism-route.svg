<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Automatism: requirements and self-induced cases</text>

<rect x="30" y="100" width="412" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REQUIREMENT 1</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">An external cause</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A blow to the head; a reflex after a swarm of</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bees (<tspan font-style="italic">Hill</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Baxter</tspan>); hypoglycaemia from insulin</text><text x="50" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Quick</tspan>); PTSD after a rape (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">T</tspan>)</text><rect x="458" y="100" width="412" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REQUIREMENT 2</text><text x="478" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A total loss of voluntary control</text><text x="478" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Driving without awareness” with some control is</text><text x="478" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not enough (<tspan font-style="italic">A-G’s</tspan> <tspan font-style="italic">Ref</tspan> <tspan font-style="italic">(No</tspan> <tspan font-style="italic">2</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">1992)</tspan>; <tspan font-style="italic">Broome</tspan> <tspan font-style="italic">v</tspan></text><text x="478" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Perkins</tspan>)</text><text x="450" y="296" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">If the defendant caused his own automatic state:</text><rect x="30" y="322" width="413" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="354" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ALCOHOL OR ILLEGAL DRUGS</text><text x="50" y="380.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Intoxication rules apply instead</text><text x="50" y="408.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lipman</tspan> (1970)</text><rect x="457" y="322" width="413" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="354" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIFIC INTENT OFFENCE</text><text x="477" y="380.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Can be a defence</text><text x="477" y="408.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">He lacks the intent</text><rect x="30" y="451" width="413" height="132" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="483" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BASIC INTENT, KNEW THE RISK</text><text x="50" y="509.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No defence: reckless</text><text x="50" y="537.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Knew skipping food after insulin could make him</text><text x="50" y="558.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aggressive or unpredictable (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bailey</tspan>, 1983)</text><rect x="457" y="451" width="413" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="483" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BASIC INTENT, DID NOT KNOW</text><text x="477" y="509.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">May succeed</text><text x="477" y="537.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Bailey</tspan>; <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hardie</tspan> (1984): Valium, not known to</text><text x="477" y="558.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cause unpredictability</text>
</svg>