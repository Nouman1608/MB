<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="482" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two diabetics, two different defences</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The cause of the blood-sugar problem decides the label</text>
<rect x="30" y="124" width="412" height="193" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HIGH BLOOD SUGAR</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hyperglycaemia: failing to take insulin</text><text x="50" y="212.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="212.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The diabetes itself: an <tspan font-weight="700" fill="#1e2a44">internal</tspan> cause</text><text x="50" y="240.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="240.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hennessy</tspan> (1989)</text><text x="50" y="268.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="268.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Insanity</tspan>: special verdict and disposal</text><rect x="458" y="124" width="412" height="193" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LOW BLOOD SUGAR</text><text x="478" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hypoglycaemia: insulin without enough</text><text x="478" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">food</text><text x="478" y="236.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.15" y="236.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The insulin: an <tspan font-weight="700" fill="#1e2a44">external</tspan> cause</text><text x="478" y="264.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.15" y="264.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Quick</tspan> (1973)</text><text x="478" y="292.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.15" y="292.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Automatism</tspan>: acquittal</text><rect x="30" y="339" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="373.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criticism</text><text x="50" y="403.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The legal definition labels diabetics and epileptics “insane”, stigmatises them and may discourage</text><text x="50" y="425.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">them from raising the defence.</text>
</svg>