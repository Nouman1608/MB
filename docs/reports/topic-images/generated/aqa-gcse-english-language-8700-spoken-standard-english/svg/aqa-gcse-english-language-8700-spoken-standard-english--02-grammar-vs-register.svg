<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Standard English is grammar and vocabulary</text>

<text x="530" y="122" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Grammar</text><text x="370" y="152" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Standard</text><text x="690" y="152" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Non-standard</text><text x="194" y="247" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">Formal</text><text x="194" y="397" font-size="17" font-weight="700" fill="#4a5568" text-anchor="end">Informal</text><text x="70" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 70 316)">Register</text><rect x="210" y="166" width="310" height="140" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="365" y="206" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What a formal presentation</text><text x="365" y="231" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">needs</text><text x="365" y="262" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Standard grammar and a suitably</text><text x="365" y="283" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">formal register</text><rect x="530" y="166" width="310" height="140" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="685" y="206" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“We was invited”</text><text x="685" y="262" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">non-standard, however formally it</text><text x="685" y="283" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">is delivered</text><rect x="210" y="316" width="310" height="140" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="365" y="356" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“I’m knackered”</text><text x="365" y="412" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">grammatically standard, but</text><text x="365" y="433" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">informal</text><rect x="530" y="316" width="310" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="685" y="356" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dialect with friends</text><text x="685" y="412" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">regional dialects have their own</text><text x="685" y="433" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">consistent grammar</text><rect x="30" y="478" width="411" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="514" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Not an accent</text><text x="50" y="543.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Standard English can be spoken in any</text><text x="50" y="565.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">accent, from Glasgow to Cornwall to Lagos.</text><rect x="459" y="478" width="411" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="514" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Not “better” English</text><text x="479" y="543.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Code-switching: choosing the variety the</text><text x="479" y="565.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">situation calls for.</text>
</svg>