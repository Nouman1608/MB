<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="564" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Spoken Standard English is still speech</text>

<rect x="30" y="100" width="408" height="244" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACCEPTABLE IN FORMAL SPEECH</text><text x="50" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Natural features</text><text x="50" y="189.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Contractions in moderation: “it’s”,</text><text x="66.15" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“we’ll”</text><text x="50" y="243.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="243.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Discourse markers: “Right, let’s begin”,</text><text x="66.15" y="265.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Now, the second point”</text><text x="50" y="297.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="297.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Occasional self-correction: “the first,</text><text x="66.15" y="319.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sorry, the second chart”</text><rect x="462" y="100" width="408" height="244" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="133" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">UNDERMINES AO9</text><text x="482" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Persistent problems</text><text x="482" y="189.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="498.15" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Persistent non-standard grammar</text><text x="482" y="221.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="498.15" y="221.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Heavy fillers that crowd the content:</text><text x="498.15" y="243.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“like”, “basically”, “you know”</text><text x="482" y="275.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="498.15" y="275.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Slang that the formal setting does not</text><text x="498.15" y="297.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">suit</text><text x="450" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Keeping control under pressure, especially in the questions afterwards</text><rect x="30" y="402" width="199.5" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="129.75" y="436.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rehearse aloud</text><text x="129.75" y="464.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and record yourself</text><rect x="243.5" y="402" width="199.5" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.25" y="436.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Know your</text><text x="343.25" y="460.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">habits</text><text x="343.25" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">practise “we were”</text><rect x="457" y="402" width="199.5" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.75" y="436.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pause, don’t</text><text x="556.75" y="460.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">fill</text><text x="556.75" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">silence sounds</text><text x="556.75" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">confident</text><rect x="670.5" y="402" width="199.5" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="770.25" y="436.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Slow down</text><text x="770.25" y="464.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">when nervous</text>
</svg>