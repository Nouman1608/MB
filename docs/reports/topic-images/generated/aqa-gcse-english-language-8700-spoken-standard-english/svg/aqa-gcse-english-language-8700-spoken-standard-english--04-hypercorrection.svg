<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 659" width="900" height="659" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="659" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hypercorrection: trying too hard</text>

<text x="195" y="120" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Overcorrected</text><text x="620" y="120" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Standard English</text><rect x="30" y="136" width="330" height="92" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="195" y="186.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“between you and I”</text><line x1="366" y1="182" x2="404" y2="182" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="410" y="136" width="460" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="171.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“between you and me”</text><text x="430" y="199.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">after a preposition, use the object form</text><rect x="30" y="242" width="330" height="109" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="195" y="301.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“please send it to myself”</text><line x1="366" y1="296.5" x2="404" y2="296.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="410" y="242" width="460" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="277.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“please send it to me”</text><text x="430" y="305.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“myself” is reflexive or emphatic: “I did it</text><text x="430" y="326.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">myself”</text><rect x="30" y="365" width="330" height="92" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="195" y="415.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“whom is responsible?”</text><line x1="366" y1="411" x2="404" y2="411" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="410" y="365" width="460" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="400.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“who is responsible?”</text><text x="430" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“whom” is not used as a subject</text><rect x="30" y="479" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="517" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Quick test: remove the other person</text><text x="54" y="559" font-size="19" fill="#1e2a44" xml:space="preserve">between <tspan fill="#b5602e" text-decoration="line-through">you and</tspan> me</text><line x1="250" y1="553" x2="300" y2="553" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="316" y="559" font-size="19" font-weight="600" fill="#2e6b62" text-anchor="start">“between… me” sounds natural</text><text x="54" y="603" font-size="19" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" text-decoration="line-through">he and</tspan> I went</text><line x1="250" y1="597" x2="300" y2="597" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="316" y="603" font-size="19" font-weight="600" fill="#2e6b62" text-anchor="start">“I went” sounds natural</text>
</svg>