<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Non-standard forms and Standard English</text>

<rect x="30" y="100" width="230" height="47" fill="#1e2a44"/><text x="145" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Area</text><rect x="260" y="100" width="305" height="47" fill="#b5602e"/><text x="412.5" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Non-standard</text><rect x="565" y="100" width="305" height="47" fill="#2e6b62"/><text x="717.5" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Standard English</text><rect x="30" y="147" width="230" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="173.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Past tense and</text><text x="44" y="194.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">participle</text><rect x="260" y="147" width="305" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="183.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“I seen it”, “we done the survey”</text><rect x="565" y="147" width="305" height="68" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="579" y="183.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“I saw it”, “we did the survey”</text><rect x="30" y="215" width="230" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="251.62" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Subject-verb agreement</text><rect x="260" y="215" width="305" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="251.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“we was”, “he don’t”, “they was”</text><rect x="565" y="215" width="305" height="68" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="579" y="241.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“we were”, “he doesn’t”, “they</text><text x="579" y="262.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">were”</text><rect x="30" y="283" width="230" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="319.62" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Progressive forms</text><rect x="260" y="283" width="305" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="309.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“I was sat at the back”, “she was</text><text x="274" y="330.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stood there”</text><rect x="565" y="283" width="305" height="68" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="579" y="309.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“I was sitting at the back”, “she</text><text x="579" y="330.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was standing there”</text><rect x="30" y="351" width="230" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="387.62" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Negatives</text><rect x="260" y="351" width="305" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="377.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“it don’t make no difference”,</text><text x="274" y="398.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“ain’t”</text><rect x="565" y="351" width="305" height="68" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="579" y="377.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“it doesn’t make any difference”,</text><text x="579" y="398.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“isn’t”, “hasn’t”</text><rect x="30" y="419" width="230" height="47" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="445.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Demonstratives</text><rect x="260" y="419" width="305" height="47" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="445.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“them results”</text><rect x="565" y="419" width="305" height="47" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="579" y="445.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“those results”</text><rect x="30" y="466" width="230" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="502.62" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Pronouns</text><rect x="260" y="466" width="305" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="492.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“me and him went”, “hisself”,</text><text x="274" y="513.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“theirselves”</text><rect x="565" y="466" width="305" height="68" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="579" y="492.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“he and I went”, “himself”,</text><text x="579" y="513.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“themselves”</text><rect x="30" y="534" width="230" height="47" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="560.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Adverbs</text><rect x="260" y="534" width="305" height="47" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="560.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“it went real quick”</text><rect x="565" y="534" width="305" height="47" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="579" y="560.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“it went really quickly”</text><rect x="30" y="581" width="230" height="47" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="607.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Relative pronouns</text><rect x="260" y="581" width="305" height="47" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="607.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“the man what helped us”</text><rect x="565" y="581" width="305" height="47" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="579" y="607.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“the man who helped us”</text><rect x="30" y="628" width="230" height="47" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="654.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Tag questions</text><rect x="260" y="628" width="305" height="47" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="274" y="654.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“It’s important, innit?”</text><rect x="565" y="628" width="305" height="47" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="579" y="654.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“It’s important, isn’t it?”</text><rect x="30" y="100" width="840" height="575" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>