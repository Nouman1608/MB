<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Revising a spoken passage</text>

<rect x="30" y="100" width="300" height="47" fill="#b5602e"/><text x="180" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Original</text><rect x="330" y="100" width="300" height="47" fill="#2e6b62"/><text x="480" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Revised</text><rect x="630" y="100" width="240" height="47" fill="#1e2a44"/><text x="750" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">What changed</text><rect x="30" y="147" width="300" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="184.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“me and Leah done”</text><rect x="330" y="147" width="300" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="184.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Leah and I carried out”</text><rect x="630" y="147" width="240" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="644" y="173.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pronoun order and form;</text><text x="644" y="195.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">standard past tense</text><rect x="30" y="217" width="300" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="243.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“we was”</text><rect x="330" y="217" width="300" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="243.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“we were”</text><rect x="630" y="217" width="240" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="644" y="243.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Agreement</text><rect x="30" y="265" width="300" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="291.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“don’t never… no more”</text><rect x="330" y="265" width="300" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="291.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“no longer… at all”</text><rect x="630" y="265" width="240" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="644" y="291.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Double negatives removed</text><rect x="30" y="313" width="300" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="361.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Them benches is all broke”</text><rect x="330" y="313" width="300" height="92" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="361.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“the benches are broken”</text><rect x="630" y="313" width="240" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="644" y="339.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Demonstrative,</text><text x="644" y="361.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">agreement, past</text><text x="644" y="383.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">participle</text><rect x="30" y="405" width="300" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="431.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“basically”, “yeah”, “well”,</text><text x="44" y="453.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“loads”, “innit”</text><rect x="330" y="405" width="300" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="344" y="442.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">removed or replaced</text><rect x="630" y="405" width="240" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="644" y="431.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fillers, slang and a tag</text><text x="644" y="453.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">question</text><rect x="30" y="100" width="840" height="375" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="497" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="530.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The speaker’s accent stays exactly as it was.</text><text x="450" y="559.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">The transcript cannot show it, and nothing in the revision changes it.</text>
</svg>