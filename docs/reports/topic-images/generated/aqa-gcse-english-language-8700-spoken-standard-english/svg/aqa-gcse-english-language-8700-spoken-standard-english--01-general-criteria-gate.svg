<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 669" width="900" height="669" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="669" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Spoken Standard English: the gate to every grade</text>

<rect x="30" y="100" width="411" height="188" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GENERAL CRITERION 1</text><text x="50" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Be intelligible</text><text x="50" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The audience can understand you: pace,</text><text x="50" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">clarity and audibility matter as well as</text><text x="50" y="233.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">grammar.</text><rect x="459" y="100" width="411" height="188" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GENERAL CRITERION 2</text><text x="479" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Generally use language</text><text x="479" y="186" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">appropriate to the formal</text><text x="479" y="212" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">setting</text><text x="479" y="241.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Generally”: overall control across the</text><text x="479" y="263.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">presentation, not a single slip.</text><line x1="232" y1="310" x2="232" y2="350" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="668" y1="310" x2="668" y2="350" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="356" width="600" height="58" rx="12" fill="#1e2a44"/><text x="450" y="392" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Both met: the competency gate opens</text><line x1="450" y1="418" x2="450" y2="456" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="464" width="200" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="230" y="492.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Pass</text><rect x="350" y="464" width="200" height="44" rx="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="450" y="492.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Merit</text><rect x="570" y="464" width="200" height="44" rx="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="670" y="492.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Distinction</text><rect x="30" y="532" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="565.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Assessed by AO9</text><text x="450" y="594.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Use spoken Standard English effectively in speeches and presentations, “whenever and</text><text x="450" y="616.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">wherever appropriate”.</text>
</svg>