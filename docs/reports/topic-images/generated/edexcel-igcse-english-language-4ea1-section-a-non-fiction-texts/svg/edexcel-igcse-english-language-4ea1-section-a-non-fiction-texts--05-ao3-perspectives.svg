<rect width="900" height="816" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">AO3: ideas and perspectives, and how they are conveyed</text>

<rect x="30" y="100" width="840" height="96" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="140" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Ideas and perspectives</text><text x="240" y="170" font-size="16" font-weight="400" fill="#b5d3cf" text-anchor="middle">what each writer thinks</text><text x="450" y="158" font-size="34" font-weight="700" fill="#d4b02e" text-anchor="middle">+</text><text x="660" y="140" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">How these are conveyed</text><text x="660" y="170" font-size="16" font-weight="400" fill="#b5d3cf" text-anchor="middle">the methods each writer uses</text><text x="450" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A perspective is the writer’s position</text><rect x="160" y="256" width="170" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="245" y="278.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">insider</text><rect x="570" y="256" width="170" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="655" y="278.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">outsider</text><line x1="340" y1="272" x2="560" y2="272" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="160" y="302" width="170" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="245" y="324.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">participant</text><rect x="570" y="302" width="170" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="655" y="324.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">observer</text><line x1="340" y1="318" x2="560" y2="318" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="160" y="348" width="170" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="245" y="370.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">approving</text><rect x="570" y="348" width="170" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="655" y="370.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">critical</text><line x1="340" y1="364" x2="560" y2="364" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="160" y="394" width="170" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="245" y="416.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">certain</text><rect x="570" y="394" width="170" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="655" y="416.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">uncertain</text><line x1="340" y1="410" x2="560" y2="410" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="30" y="450" width="200" height="47" fill="#1e2a44"/><text x="130" y="479.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Compared</text><rect x="230" y="450" width="320" height="47" fill="#8a6d0d"/><text x="390" y="479.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Morris’s article</text><rect x="550" y="450" width="320" height="47" fill="#2e6b62"/><text x="710" y="479.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">The rescuer’s account</text><rect x="30" y="497" width="200" height="68" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="533.62" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Perspective</text><rect x="230" y="497" width="320" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="523.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A journalist reporting on a rescue</text><text x="244" y="544.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">at public cost</text><rect x="550" y="497" width="320" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="564" y="533.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Writes from inside the event</text><rect x="30" y="565" width="200" height="89" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="612.12" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><rect x="230" y="565" width="320" height="89" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="591.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Headline choice between “explorers”</text><text x="244" y="612.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and “boys messing about”; detached</text><text x="244" y="633.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">news report</text><rect x="550" y="565" width="320" height="89" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="564" y="591.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First-person honesty about her</text><text x="564" y="612.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“small anger”; a comic,</text><text x="564" y="633.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">affectionate detail</text><rect x="30" y="654" width="200" height="68" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="690.62" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Effect on reader</text><rect x="230" y="654" width="320" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="690.62" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Invited to judge</text><rect x="550" y="654" width="320" height="68" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="564" y="680.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ends with sympathy rather than</text><text x="564" y="701.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">judgement</text><rect x="30" y="450" width="840" height="272" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="768" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Connectives:</text><rect x="176" y="748" width="98" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="225" y="770.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">whereas</text><rect x="286" y="748" width="117" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="344.5" y="770.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">similarly</text><rect x="415" y="748" width="137" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="483.5" y="770.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">by contrast</text><rect x="564" y="748" width="146" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="637" y="770.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">both writers</text>
</svg>