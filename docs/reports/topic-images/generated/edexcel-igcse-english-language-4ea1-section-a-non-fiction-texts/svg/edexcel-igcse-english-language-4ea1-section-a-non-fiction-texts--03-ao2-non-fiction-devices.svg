<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 756" width="900" height="756" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="756" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Non-fiction devices and their effects</text>

<rect x="30" y="100" width="270" height="47" fill="#1e2a44"/><text x="165" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Device</text><rect x="300" y="100" width="570" height="47" fill="#1e2a44"/><text x="585" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Typical effect in non-fiction</text><rect x="30" y="147" width="270" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="173.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Anecdote</text><rect x="300" y="147" width="570" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="173.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Makes an argument personal and believable</text><rect x="30" y="195" width="270" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="221.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Direct address (“you”)</text><rect x="300" y="195" width="570" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="221.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Draws the reader in and makes them share responsibility</text><rect x="30" y="243" width="270" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="269.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rhetorical question</text><rect x="300" y="243" width="570" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="269.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Prompts the reader to reach the writer’s conclusion</text><rect x="30" y="291" width="270" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="317.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Contrast or juxtaposition</text><rect x="300" y="291" width="570" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="317.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sharpens a judgement by placing two ideas side by side</text><rect x="30" y="339" width="270" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="376.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Shift in register</text><rect x="300" y="339" width="570" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="365.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Personal to formal, or humour to seriousness, to change the</text><text x="314" y="387.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reader’s response</text><rect x="30" y="409" width="270" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="435.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sentence length</text><rect x="300" y="409" width="570" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="435.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Short: emphasis or shock. Long: detail or momentum</text><rect x="30" y="457" width="270" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="494.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Structural shift</text><rect x="300" y="457" width="570" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="483.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A change of time, place or focus that changes how the reader</text><text x="314" y="505.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sees what came before</text><rect x="30" y="527" width="270" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="564.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ending that circles back</text><rect x="300" y="527" width="570" height="70" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="314" y="553.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Returns to an opening image so the reader measures how far</text><text x="314" y="575.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the writer has travelled</text><rect x="30" y="100" width="840" height="497" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="619" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="652.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Structure is the device most often left out.</text><text x="48" y="681.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How does it open? Where does the focus change? Chronological, or past and present? How does</text><text x="48" y="703.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">it end, and why there?</text>
</svg>