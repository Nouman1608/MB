<rect x="30" y="100" width="405" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M54,124 h76 l24,24 v96 h-100 z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="70" y1="160" x2="134" y2="160" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="70" y1="176" x2="134" y2="176" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="70" y1="192" x2="134" y2="192" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="70" y1="208" x2="134" y2="208" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><text x="176" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Non-fiction text from</text><text x="176" y="171" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Anthology Part 1</text><text x="176" y="216" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">printed in the exam; know it</text><text x="176" y="237" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">beforehand</text><rect x="465" y="100" width="405" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><path d="M489,124 h76 l24,24 v96 h-100 z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="505" y1="160" x2="569" y2="160" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="505" y1="176" x2="569" y2="176" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="505" y1="192" x2="569" y2="192" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><line x1="505" y1="208" x2="569" y2="208" stroke="#1e2a44" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/><text x="539" y="208" font-size="40" font-weight="700" fill="#8a6d0d" text-anchor="middle">?</text><text x="611" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One previously unseen</text><text x="611" y="171" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">extract</text><text x="611" y="216" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="start">a sustained piece of writing</text><text x="450" y="334" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">45 marks · about 1 hour 30 minutes, including reading time</text><text x="450" y="362" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">A mixture of short- and long-answer questions; answer them all</text><rect x="30" y="392" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="428" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Read widely</text><rect x="54" y="444" width="103" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="105.5" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">articles</text><rect x="167" y="444" width="94" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="214" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">reviews</text><rect x="271" y="444" width="103" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="322.5" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">speeches</text><rect x="384" y="444" width="103" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="435.5" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">journals</text><rect x="497" y="444" width="167" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="580.5" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">reference books</text><rect x="674" y="444" width="149" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="748.5" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">autobiography</text><rect x="54" y="486" width="94" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="101" y="507.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">letters</text><rect x="158" y="486" width="121" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="218.5" y="507.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">obituaries</text><rect x="289" y="486" width="158" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="368" y="507.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">travel writing</text><text x="54" y="564" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Not assessed:</text><rect x="200" y="542" width="194" height="32" rx="16" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="297" y="563.76" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">instant news feeds</text><rect x="404" y="542" width="158" height="32" rx="16" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="483" y="563.76" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">advertisements</text>
