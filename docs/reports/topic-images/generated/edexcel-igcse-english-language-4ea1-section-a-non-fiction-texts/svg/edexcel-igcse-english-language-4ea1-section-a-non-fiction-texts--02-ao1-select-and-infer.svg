<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" width="900" height="596" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="596" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">AO1: selecting and inferring</text>

<rect x="30" y="100" width="411" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPLICIT: THE WRITER TELLS YOU</text><text x="50" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“The village had no road”</text><text x="50" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">gives you a fact</text><rect x="459" y="100" width="411" height="162" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMPLICIT: YOU WORK IT OUT</text><text x="479" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">She “rationed the last of the</text><text x="479" y="186" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">batteries”</text><text x="479" y="215.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The journey had gone on longer than</text><text x="479" y="237.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">planned, and she felt anxious about it.</text><line x1="62" y1="304" x2="62" y2="546" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="284" width="762" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="318" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Stay inside the line range</text><text x="126" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">If a question names lines, evidence from elsewhere earns nothing.</text><circle cx="62" cy="327" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="335.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="382" width="762" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="416" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">One point per piece of evidence</text><text x="126" y="445.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two separate, precise points are worth more than one long sentence.</text><circle cx="62" cy="425" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="433.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="480" width="762" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="514" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Use your own words when told to</text><text x="126" y="543.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Copying a phrase shows you found it, not that you understood it.</text><circle cx="62" cy="523" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="531.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
</svg>