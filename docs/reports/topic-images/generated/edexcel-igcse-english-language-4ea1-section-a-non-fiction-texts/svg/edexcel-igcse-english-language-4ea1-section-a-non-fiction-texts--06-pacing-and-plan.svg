<rect width="900" height="686" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pacing Section A</text>

<text x="450" y="120" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Time roughly in proportion to marks, after reading both texts with care</text><rect x="70" y="140" width="185.77777777777777" height="54" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="162.88888888888889" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1: 11</text><text x="162.88888888888889" y="220" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">keep short answers brief</text><rect x="255.77777777777777" y="140" width="202.66666666666669" height="54" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="357.1111111111111" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2: 12</text><rect x="458.44444444444446" y="140" width="371.55555555555554" height="54" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="644.2222222222222" y="174" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3 comparison: 22</text><text x="644.2222222222222" y="220" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">protect the largest block of time</text><text x="450" y="270" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Plan the comparison in a three-row grid</text><rect x="30" y="286" width="300" height="47" fill="#1e2a44"/><rect x="330" y="286" width="540" height="47" fill="#1e2a44"/><text x="600" y="315.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Notes</text><rect x="30" y="333" width="300" height="54" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="362.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Shared idea</text><rect x="330" y="333" width="540" height="54" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="387" width="300" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="413.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Text 1: perspective and</text><text x="44" y="435.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">method</text><rect x="330" y="387" width="540" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="457" width="300" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="483.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Text 2: perspective and</text><text x="44" y="505.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">method</text><rect x="330" y="457" width="540" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="286" width="840" height="241" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="549" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="582.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Anthology preparation</text><text x="48" y="611.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">For each Part 1 text, know the writer’s perspective, the form (speech, article, memoir,</text><text x="48" y="633.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">travel writing) and two or three methods worth analysing.</text>
</svg>