<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 587" width="900" height="587" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="587" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">AO2: method, evidence, effect, reason</text>

<rect x="30" y="100" width="187.5" height="177" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1 METHOD</text><text x="50" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Name the</text><text x="50" y="182.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">choice</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A short, flat</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">opening sentence</text><line x1="223.5" y1="188.5" x2="241.5" y2="188.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247.5" y="100" width="187.5" height="177" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="267.5" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2 EVIDENCE</text><text x="267.5" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Quote a few</text><text x="267.5" y="182.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">words</text><text x="267.5" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“The call came at</text><text x="267.5" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2 a.m., as they</text><text x="267.5" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">always do”</text><line x1="441" y1="188.5" x2="459" y2="188.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="100" width="187.5" height="177" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="485" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3 EFFECT</text><text x="485" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">On the reader</text><text x="485" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The emergency</text><text x="485" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feels routine to</text><text x="485" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">her, not dramatic</text><line x1="658.5" y1="188.5" x2="676.5" y2="188.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="682.5" y="100" width="187.5" height="177" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="702.5" y="133" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">4 REASON</text><text x="702.5" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why the writer</text><text x="702.5" y="182.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">wants it</text><text x="702.5" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The reader senses</text><text x="702.5" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">her long</text><text x="702.5" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">experience</text><rect x="30" y="299" width="260" height="70" fill="#1e2a44"/><text x="160" y="328.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">More methods in the</text><text x="160" y="351.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">passage</text><rect x="290" y="299" width="580" height="70" fill="#1e2a44"/><text x="580" y="328.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Effect and purpose</text><rect x="30" y="369" width="260" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="406.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Structure: omission</text><rect x="290" y="369" width="580" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="395.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Jumps from the call to the dawn discovery, leaving out the</text><text x="304" y="417.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">search: focus on the walkers and her feelings, not heroism</text><rect x="30" y="439" width="260" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="465.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Precise detail</text><rect x="290" y="439" width="580" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="465.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“eleven times”: dry humour</text><rect x="30" y="487" width="260" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="524.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Blunt short sentence</text><rect x="290" y="487" width="580" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="513.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“I counted”: anger turned into amused sympathy, persuading the</text><text x="304" y="535.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reader to share her tolerant view</text><rect x="30" y="299" width="840" height="258" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>