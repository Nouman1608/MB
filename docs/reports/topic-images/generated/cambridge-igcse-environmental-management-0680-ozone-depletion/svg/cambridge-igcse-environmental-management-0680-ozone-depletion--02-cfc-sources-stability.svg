<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">CFCs: useful, stable and harmful</text>

<rect x="30" y="110" width="410" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Aerosols</text><text x="48" y="170.575" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">CFCs were the propellant gas in spray</text><text x="48" y="192.355" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">cans: deodorants, paints, polishes</text><rect x="460" y="110" width="410" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Refrigerants</text><text x="478" y="170.575" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">coolant gas in fridges, freezers and air-</text><text x="478" y="192.355" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">conditioning; escapes when equipment</text><text x="478" y="214.135" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">leaks or is scrapped without care</text><rect x="370" y="195" width="36" height="70" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="378" y="182" width="20" height="13" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="330" cy="205" r="3" fill="#4a5568" stroke="#4a5568" stroke-width="1"/><circle cx="339" cy="201" r="3" fill="#4a5568" stroke="#4a5568" stroke-width="1"/><circle cx="348" cy="197" r="3" fill="#4a5568" stroke="#4a5568" stroke-width="1"/><circle cx="357" cy="193" r="3" fill="#4a5568" stroke="#4a5568" stroke-width="1"/><circle cx="366" cy="189" r="3" fill="#4a5568" stroke="#4a5568" stroke-width="1"/><rect x="800" y="190" width="50" height="78" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="800" y1="220" x2="850" y2="220" stroke="#1e2a44" stroke-width="2.5"/><line x1="842" y1="198" x2="842" y2="213" stroke="#1e2a44" stroke-width="3"/><line x1="842" y1="230" x2="842" y2="250" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="300" width="840" height="290" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="338" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The property that made CFCs useful is the problem</text><rect x="50" y="360" width="190" height="130" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="145" y="396" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">unreactive,</text><text x="145" y="418" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">non-flammable,</text><text x="145" y="440" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">non-toxic near</text><text x="145" y="462" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">the ground</text><line x1="242" y1="425" x2="253" y2="425" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="255" y="360" width="190" height="130" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="350" y="396" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">last a long time</text><text x="350" y="418" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">in the air</text><line x1="447" y1="425" x2="458" y2="425" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="360" width="190" height="130" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="555" y="396" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">drift up into the</text><text x="555" y="418" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">stratosphere</text><line x1="652" y1="425" x2="663" y2="425" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="665" y="360" width="190" height="130" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="760" y="396" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">UV breaks them</text><text x="760" y="418" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">apart, releasing</text><text x="760" y="440" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">chlorine, which</text><text x="760" y="462" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">destroys ozone</text><text x="60" y="530" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">One chlorine atom can break down a very large number of ozone molecules, so</text><text x="60" y="556" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">small amounts cause great damage and CFCs released decades ago still act today.</text>
</svg>