<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: reading ozone data</text>

<rect x="30" y="110" width="560" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="540" x2="560" y2="540" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="540" x2="120" y2="160" stroke="#1e2a44" stroke-width="3"/><line x1="112" y1="540" x2="120" y2="540" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="546" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="112" y1="485.7142857142857" x2="120" y2="485.7142857142857" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="491.7142857142857" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">50</text><line x1="122" y1="485.7142857142857" x2="560" y2="485.7142857142857" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="431.42857142857144" x2="120" y2="431.42857142857144" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="437.42857142857144" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">100</text><line x1="122" y1="431.42857142857144" x2="560" y2="431.42857142857144" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="377.1428571428571" x2="120" y2="377.1428571428571" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="383.1428571428571" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">150</text><line x1="122" y1="377.1428571428571" x2="560" y2="377.1428571428571" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="322.8571428571429" x2="120" y2="322.8571428571429" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="328.8571428571429" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">200</text><line x1="122" y1="322.8571428571429" x2="560" y2="322.8571428571429" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="268.57142857142856" x2="120" y2="268.57142857142856" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="274.57142857142856" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">250</text><line x1="122" y1="268.57142857142856" x2="560" y2="268.57142857142856" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="214.28571428571428" x2="120" y2="214.28571428571428" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="220.28571428571428" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">300</text><line x1="122" y1="214.28571428571428" x2="560" y2="214.28571428571428" stroke="#e3e9e8" stroke-width="1.5"/><line x1="112" y1="160" x2="120" y2="160" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="166" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="end">350</text><line x1="122" y1="160" x2="560" y2="160" stroke="#e3e9e8" stroke-width="1.5"/><line x1="120" y1="540" x2="120" y2="548" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">1970</text><line x1="260" y1="540" x2="260" y2="548" stroke="#1e2a44" stroke-width="2.5"/><text x="260" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">1990</text><line x1="400" y1="540" x2="400" y2="548" stroke="#1e2a44" stroke-width="2.5"/><text x="400" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">2010</text><line x1="540" y1="540" x2="540" y2="548" stroke="#1e2a44" stroke-width="2.5"/><text x="540" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">2030</text><text x="58" y="350" font-size="16" fill="#4a5568" text-anchor="middle" transform="rotate(-90 58 350)">October ozone (units)</text><line x1="239" y1="170.85714285714283" x2="239" y2="540" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="6 5"/><text x="247" y="181.71428571428572" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">Montreal</text><text x="247" y="201.71428571428572" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">Protocol, 1987</text><path d="M120,214.28571428571428 L260,366.2857142857143 L400,377.1428571428571" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M400,377.1428571428571 L540,312" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 7"/><circle cx="120" cy="214.28571428571428" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="134" y="198.28571428571428" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">300</text><circle cx="260" cy="366.2857142857143" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="274" y="350.2857142857143" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">160</text><circle cx="400" cy="377.1428571428571" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="400" y="361.1428571428571" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">150</text><circle cx="540" cy="312" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="540" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">210</text><text x="540" y="346" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">forecast</text><text x="570" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented data: one station</text><rect x="610" y="110" width="260" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="632" y="148" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1970 to 1990</text><text x="632" y="176" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(300 − 160) ÷ 300</text><text x="632" y="199" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">× 100 = 46.7% fall</text><text x="632" y="248" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Describe</text><text x="632" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">steep fall, then level</text><text x="632" y="295" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1990 to 2010, forecast</text><text x="632" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recovery to 210 by 2030</text><text x="632" y="380" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Explain</text><text x="632" y="406" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">CFC emissions fell after</text><text x="632" y="427" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1987, but CFCs already in</text><text x="632" y="448" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the stratosphere kept</text><text x="632" y="469" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">destroying ozone</text><text x="632" y="532" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Limitation</text><text x="632" y="558" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one station and one</text><text x="632" y="579" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">month; forecasts are</text><text x="632" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">uncertain</text>
</svg>