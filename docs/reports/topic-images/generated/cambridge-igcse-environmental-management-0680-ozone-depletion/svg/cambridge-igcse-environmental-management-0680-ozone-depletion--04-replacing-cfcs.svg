<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Replacing CFCs, step by step</text>

<rect x="30" y="120" width="260" height="120" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="3"/><text x="160" y="168" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">CFCs</text><text x="160" y="200" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">deplete ozone</text><line x1="293" y1="180" x2="316" y2="180" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="120" width="260" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="168" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">HCFCs</text><text x="450" y="200" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">much less damage; a</text><text x="450" y="221" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">temporary step</text><line x1="583" y1="180" x2="606" y2="180" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="120" width="260" height="120" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="3"/><text x="740" y="168" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">HFCs and hydrocarbons</text><text x="740" y="200" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">do not deplete ozone</text><text x="450" y="270" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">in refrigeration</text><rect x="30" y="290" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="326" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">In aerosols</text><rect x="60" y="344" width="210" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="372.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">pump-action sprays</text><rect x="290" y="344" width="200" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="390" y="372.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">roll-on products</text><rect x="510" y="344" width="300" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="660" y="372.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">propellants without chlorine</text><rect x="30" y="430" width="840" height="210" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="468" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">New problems from substitutes</text><text x="60" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="76" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">HCFCs still deplete ozone a little</text><text x="60" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="76" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">HFCs are powerful greenhouse gases: solving one problem created another</text><text x="60" y="560" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="76" y="560" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hydrocarbons are flammable</text><rect x="60" y="590" width="780" height="36" rx="8" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="450" y="614" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Kigali amendment to the Montreal Protocol (2016): now phases down HFCs</text>
</svg>