<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three linked impacts of ozone depletion</text>

<rect x="300" y="110" width="300" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="151" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Less ozone</text><line x1="450" y1="184" x2="450" y2="214" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="225" y="220" width="450" height="80" rx="12" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="255" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1. Higher levels of solar (UV) radiation</text><text x="450" y="277" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">reach the surface</text><path d="M330,304 Q260,340 200,360" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M570,304 Q640,340 700,360" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="366" width="400" height="290" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="230" y="400" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">2. People</text><rect x="55" y="420" width="160" height="110" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="135" y="470" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">skin cells</text><text x="135" y="492" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">damaged</text><rect x="245" y="420" width="160" height="110" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="325" y="470" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">eye lens</text><text x="325" y="492" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">damaged</text><line x1="135" y1="534" x2="135" y2="560" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="325" y1="534" x2="325" y2="560" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="55" y="566" width="160" height="70" rx="12" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><text x="135" y="607" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">skin cancer</text><rect x="245" y="566" width="160" height="70" rx="12" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><text x="325" y="607" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">cataracts</text><rect x="470" y="366" width="400" height="290" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="400" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">3. Vegetation</text><rect x="495" y="420" width="350" height="64" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="458" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">leaves and plant cells damaged</text><line x1="670" y1="488" x2="670" y2="508" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="495" y="512" width="350" height="56" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="546" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">less photosynthesis and growth</text><line x1="670" y1="572" x2="670" y2="590" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="495" y="594" width="350" height="46" rx="12" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="623" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">reduced crop yields</text><text x="450" y="690" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Cataract: a clouding of the eye lens that impairs sight. Crop losses link ozone to food supply.</text>
</svg>