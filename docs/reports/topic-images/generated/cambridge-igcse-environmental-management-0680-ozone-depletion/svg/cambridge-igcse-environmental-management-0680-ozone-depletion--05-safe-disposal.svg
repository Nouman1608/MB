<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" width="900" height="485" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="485" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Safe disposal of CFCs</text>

<rect x="30" y="120" width="195" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="127" cy="158" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="127" y="165.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="127" y="212" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Collect</text><text x="127" y="244" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">old fridges,</text><text x="127" y="265" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">freezers and</text><text x="127" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">air-conditioners</text><line x1="227" y1="220" x2="240" y2="220" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="243" y="120" width="195" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="340" cy="158" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="340" y="165.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="340" y="212" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Remove</text><text x="340" y="244" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the refrigerant and</text><text x="340" y="265" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the CFC-containing</text><text x="340" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">insulation foam</text><line x1="440" y1="220" x2="453" y2="220" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="456" y="120" width="195" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="553" cy="158" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="553" y="165.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="553" y="212" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Scrap</text><text x="553" y="244" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the metal only</text><text x="553" y="265" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">after the CFCs are</text><text x="553" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">out</text><line x1="653" y1="220" x2="666" y2="220" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="669" y="120" width="195" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="766" cy="158" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="766" y="165.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="766" y="212" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Destroy or store</text><text x="766" y="244" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">CFCs destroyed at</text><text x="766" y="265" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">high temperature or</text><text x="766" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">stored securely</text><rect x="30" y="340" width="410" height="120" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="376" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Benefit</text><text x="54" y="406" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">stops CFCs already “banked” in old</text><text x="54" y="428" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">equipment leaking to the air</text><rect x="460" y="340" width="410" height="120" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="484" y="376" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Limitations</text><text x="484" y="406" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">needs collection systems, specialist</text><text x="484" y="428" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">plants and funding; illegal dumping</text><text x="484" y="450" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">still happens in some places</text>
</svg>