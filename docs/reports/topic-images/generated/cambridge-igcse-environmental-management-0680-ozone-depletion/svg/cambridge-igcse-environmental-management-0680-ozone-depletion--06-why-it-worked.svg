<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" width="900" height="565" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the ozone strategies worked</text>

<text x="450" y="128" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Three reasons the ozone strategies succeeded</text><rect x="30" y="146" width="270" height="110" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="180.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Practical substitutes</text><text x="165" y="205.725" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">existed for aerosols and</text><text x="165" y="227.505" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">fridges</text><rect x="315" y="146" width="270" height="110" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="180.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Few producers</text><text x="450" y="205.725" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">a small number to regulate</text><rect x="600" y="146" width="270" height="110" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="180.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Clear evidence</text><text x="735" y="205.725" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">of harm</text><rect x="30" y="276" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="314" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">But recovery is slow</text><text x="60" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">CFCs already released stay in the atmosphere for decades, so the problem</text><text x="60" y="368" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is not “solved”: monitoring and enforcement must continue.</text><text x="450" y="430" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Compared with climate change</text><rect x="30" y="450" width="410" height="90" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="484.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Ozone: CFCs</text><text x="235" y="510.5" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">cheap substitutes and few producers</text><rect x="460" y="450" width="410" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="484.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Climate: fossil fuels</text><text x="665" y="510.5" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">underpin whole economies</text>
</svg>