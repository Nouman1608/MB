<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 671" width="900" height="671" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="671" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is the class structure changing?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">after deindustrialisation: fewer manual jobs, more service and professional work</text>
<rect x="30" y="120" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L427.75,121.25 Q440.75,121.25 440.75,134.25 L440.75,170 Z" fill="#f2e7b8"/><line x1="31.25" y1="170" x2="440.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="150.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Embourgeoisement</text><text x="46" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Affluent manual workers becoming middle</text><text x="46" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">class? <tspan font-weight="700">Goldthorpe and Lockwood</tspan> (Luton, 1960s)</text><text x="46" y="245.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">found little support.</text><rect x="458" y="120" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,170 L459.25,134.25 Q459.25,121.25 472.25,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#f2e7b8"/><line x1="459.25" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="150.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Proletarianisation</text><text x="474" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Braverman (1974):</tspan> routine white-collar work</text><text x="474" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is deskilled, so many clerical workers are in</text><text x="474" y="245.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">effect working class.</text><rect x="30" y="285" width="412" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,335 L31.25,299.25 Q31.25,286.25 44.25,286.25 L427.75,286.25 Q440.75,286.25 440.75,299.25 L440.75,335 Z" fill="#dce9e7"/><line x1="31.25" y1="335" x2="440.75" y2="335" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="315.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Underclass</text><text x="46" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Murray (New Right):</tspan> welfare creates an</text><text x="46" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">underclass with distinct behaviour. Critics:</text><text x="46" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the poor share mainstream values but lack</text><text x="46" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">opportunities.</text><rect x="458" y="285" width="412" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,335 L459.25,299.25 Q459.25,286.25 472.25,286.25 L855.75,286.25 Q868.75,286.25 868.75,299.25 L868.75,335 Z" fill="#dce9e7"/><line x1="459.25" y1="335" x2="868.75" y2="335" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="315.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The precariat</text><text x="474" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Standing (2011):</tspan> a growing group in insecure,</text><text x="474" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">short-term work with few rights. Savage’s</text><text x="474" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">survey also named one.</text><rect x="30" y="471" width="412" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,521 L31.25,485.25 Q31.25,472.25 44.25,472.25 L427.75,472.25 Q440.75,472.25 440.75,485.25 L440.75,521 Z" fill="#b5d3cf"/><line x1="31.25" y1="521" x2="440.75" y2="521" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="501.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The death of class?</text><text x="46" y="554.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Pakulski and Waters (1996):</tspan> class is</text><text x="46" y="575.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dissolving into status. <tspan font-weight="700">Beck:</tspan></text><text x="46" y="596.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">individualisation. Critics: the social</text><text x="46" y="617.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gradient in health persists.</text><rect x="458" y="471" width="412" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,521 L459.25,485.25 Q459.25,472.25 472.25,472.25 L855.75,472.25 Q868.75,472.25 868.75,485.25 L868.75,521 Z" fill="#b5d3cf"/><line x1="459.25" y1="521" x2="868.75" y2="521" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="501.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Transnational capitalist class</text><text x="474" y="554.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Sklair:</tspan> corporate, state, technical and</text><text x="474" y="575.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consumerist fractions work across borders.</text><text x="474" y="596.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Critics: is it truly unified?</text>
</svg>