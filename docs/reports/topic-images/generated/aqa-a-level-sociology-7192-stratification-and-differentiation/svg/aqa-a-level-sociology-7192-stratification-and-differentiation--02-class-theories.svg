<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three theories of social class</text>

<rect x="198" y="104" width="218.66666666666666" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="307.3333333333333" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism</text><rect x="424.66666666666663" y="104" width="218.66666666666666" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="534" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism</text><rect x="651.3333333333333" y="104" width="218.66666666666666" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="760.6666666666666" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Weberianism</text><rect x="30" y="156" width="160" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="196.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Class is</text><text x="42" y="218.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">based on</text><rect x="198" y="156" width="218.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rewards attached to</text><text x="212" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">functionally important</text><text x="212" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">positions.</text><rect x="424.66666666666663" y="156" width="218.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="438.66666666666663" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Relationship to the</text><text x="438.66666666666663" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">means of production.</text><rect x="651.3333333333333" y="156" width="218.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="665.3333333333333" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Market situation:</text><text x="665.3333333333333" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">skills, qualifications</text><text x="665.3333333333333" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and property.</text><rect x="30" y="257" width="160" height="177" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="350.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key claim</text><rect x="198" y="257" width="218.66666666666666" height="177" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Davis and Moore</tspan></text><text x="212" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">(1945):</tspan> higher rewards</text><text x="212" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">motivate the most able</text><text x="212" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to fill vital roles.</text><rect x="424.66666666666663" y="257" width="218.66666666666666" height="177" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="438.66666666666663" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The bourgeoisie</text><text x="438.66666666666663" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exploit the</text><text x="438.66666666666663" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proletariat;</text><text x="438.66666666666663" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">polarisation is</text><text x="438.66666666666663" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expected; false</text><text x="438.66666666666663" y="392.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consciousness delays</text><text x="438.66666666666663" y="413.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it.</text><rect x="651.3333333333333" y="257" width="218.66666666666666" height="177" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="665.3333333333333" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many classes, not two.</text><text x="665.3333333333333" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Class, status and</text><text x="665.3333333333333" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">party can vary</text><text x="665.3333333333333" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">independently.</text><rect x="30" y="442" width="160" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="493.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Challenge or</text><text x="42" y="515.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">development</text><rect x="198" y="442" width="218.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Tumin (1953):</tspan></text><text x="212" y="493.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">importance is hard to</text><text x="212" y="514.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">show; stratification</text><text x="212" y="535.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can block talent.</text><rect x="424.66666666666663" y="442" width="218.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="438.66666666666663" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The middle class grew;</text><text x="438.66666666666663" y="493.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Wright (1985):</tspan></text><text x="438.66666666666663" y="514.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contradictory class</text><text x="438.66666666666663" y="535.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">locations.</text><rect x="651.3333333333333" y="442" width="218.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="665.3333333333333" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Goldthorpe’s</text><text x="665.3333333333333" y="493.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">multi-class scale</text><text x="665.3333333333333" y="514.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">builds on Weber.</text>
</svg>