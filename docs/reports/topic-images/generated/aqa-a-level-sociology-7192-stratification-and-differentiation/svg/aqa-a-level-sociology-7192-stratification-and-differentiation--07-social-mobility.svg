<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Social mobility</text>

<rect x="30" y="104" width="269.3333333333333" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="138" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Intergenerational</text><text x="48" y="162" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">compared with parents</text><line x1="48" y1="180" x2="281.3333333333333" y2="180" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="210" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Intragenerational</text><text x="48" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">over a person’s own career</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="333.3333333333333" y="138" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Absolute</text><text x="333.3333333333333" y="162" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">total amount of movement</text><line x1="333.3333333333333" y1="180" x2="566.6666666666666" y2="180" stroke="#c9d6d4" stroke-width="2"/><text x="333.3333333333333" y="210" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Relative</text><text x="333.3333333333333" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">chances by background</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618.6666666666666" y="138" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Short-range</text><text x="618.6666666666666" y="162" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to an adjacent class</text><line x1="618.6666666666666" y1="180" x2="852" y2="180" stroke="#c9d6d4" stroke-width="2"/><text x="618.6666666666666" y="210" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Long-range</text><text x="618.6666666666666" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">across several classes</text><text x="450" y="290" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Key studies</text><line x1="60" y1="352" x2="840" y2="352" stroke="#1e2a44" stroke-width="4"/><circle cx="110" cy="352" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1954</text><text x="110" y="390" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Glass</text><text x="110" y="413" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">continuity</text><text x="110" y="433" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">strongest at the</text><text x="110" y="453" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">top</text><circle cx="280" cy="352" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="280" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1972</text><text x="280" y="390" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Oxford Mobility</text><text x="280" y="411" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Study</text><text x="280" y="434" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">absolute upward</text><text x="280" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mobility rose;</text><text x="280" y="474" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">relative chances</text><text x="280" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stayed unequal</text><circle cx="450" cy="352" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1996</text><text x="450" y="390" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Saunders</text><text x="450" y="413" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">largely a</text><text x="450" y="433" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">meritocracy</text><circle cx="620" cy="352" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="620" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1999</text><text x="620" y="390" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Breen and</text><text x="620" y="411" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Goldthorpe</text><text x="620" y="434" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">less advantaged</text><text x="620" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">children needed</text><text x="620" y="474" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">more merit</text><circle cx="790" cy="352" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="790" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2005</text><text x="790" y="390" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Blanden, Gregg</text><text x="790" y="411" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">and Machin</text><text x="790" y="434" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">income mobility</text><text x="790" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fell (1958 vs 1970</text><text x="790" y="474" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">births)</text><rect x="30" y="522" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="558" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Significance</text><text x="56" y="587" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Low relative mobility suggests advantage is passed on through economic, cultural and</text><text x="56" y="609" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">social capital. Studies of men and their fathers missed women’s mobility.</text>
