<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 623" width="900" height="623" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="623" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring social class</text>

<rect x="30" y="104" width="250.66666666666666" height="172" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="155.33333333333331" y="146.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Registrar General’s</text><text x="155.33333333333331" y="170.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">scale</text><text x="155.33333333333331" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">official scale before</text><text x="155.33333333333331" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">NS-SEC; occupations by</text><text x="155.33333333333331" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">social standing</text><line x1="284.66666666666663" y1="190" x2="320.66666666666663" y2="190" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="104" width="250.66666666666666" height="172" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="148.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">NS-SEC</text><text x="449.99999999999994" y="178.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">first major use 2001</text><text x="449.99999999999994" y="199.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Census; Goldthorpe schema;</text><text x="449.99999999999994" y="220.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">employment relations; 8</text><text x="449.99999999999994" y="241.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">classes</text><line x1="579.3333333333333" y1="190" x2="615.3333333333333" y2="190" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="104" width="250.66666666666666" height="172" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="744.6666666666666" y="136.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Great British Class</text><text x="744.6666666666666" y="160.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Survey</text><text x="744.6666666666666" y="190.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Savage et al. (2013);</text><text x="744.6666666666666" y="211.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">economic, cultural and</text><text x="744.6666666666666" y="232.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">social capital; 7 classes,</text><text x="744.6666666666666" y="253.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">elite to precariat</text><text x="450" y="308" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Problems: occupation misses the very wealthy and people outside paid work; objective and</text><text x="450" y="329" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">subjective class may differ; the GBCS web survey was self-selecting.</text><text x="450" y="374" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Occupation, gender and class</text><rect x="30" y="394" width="412" height="203" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,444 L31.25,408.25 Q31.25,395.25 44.25,395.25 L427.75,395.25 Q440.75,395.25 440.75,408.25 L440.75,444 Z" fill="#f2e7b8"/><line x1="31.25" y1="444" x2="440.75" y2="444" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="424.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conventional approach</text><text x="44" y="475.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Goldthorpe (1983)</text><circle cx="49" cy="496.92" r="4.5" fill="#2e6b62"/><text x="62" y="502.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Classify the household by the male "head of</text><text x="62" y="523.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">household"</text><circle cx="49" cy="546.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women’s work often interrupted; the male</text><text x="62" y="573.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wage shaped life chances</text><rect x="458" y="394" width="412" height="203" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,444 L459.25,408.25 Q459.25,395.25 472.25,395.25 L855.75,395.25 Q868.75,395.25 868.75,408.25 L868.75,444 Z" fill="#b5d3cf"/><line x1="459.25" y1="444" x2="868.75" y2="444" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="424.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual approach</text><text x="472" y="475.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Stanworth (1984); Acker (1973)</text><circle cx="477" cy="496.92" r="4.5" fill="#2e6b62"/><text x="490" y="502.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Classify each adult by their own occupation</text><circle cx="477" cy="525.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A couple can be in two classes; shows</text><text x="490" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inequality within the household</text>
</svg>