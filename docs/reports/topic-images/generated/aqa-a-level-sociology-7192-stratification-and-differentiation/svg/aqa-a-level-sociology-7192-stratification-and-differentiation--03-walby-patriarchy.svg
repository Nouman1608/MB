<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Walby (1990): six structures of patriarchy</text>

<rect x="30" y="120" width="269.3333333333333" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="64" cy="152" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="158.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="159" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Paid work</text><rect x="315.3333333333333" y="120" width="269.3333333333333" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="349.3333333333333" cy="152" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="349.3333333333333" y="158.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="381.3333333333333" y="159" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The household</text><rect x="600.6666666666666" y="120" width="269.3333333333333" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="634.6666666666666" cy="152" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="634.6666666666666" y="158.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="666.6666666666666" y="159" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The state</text><rect x="30" y="198" width="269.3333333333333" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="64" cy="230" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="236.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="96" y="237" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Violence</text><rect x="315.3333333333333" y="198" width="269.3333333333333" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="349.3333333333333" cy="230" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="349.3333333333333" y="236.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="381.3333333333333" y="237" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sexuality</text><rect x="600.6666666666666" y="198" width="269.3333333333333" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="634.6666666666666" cy="230" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="634.6666666666666" y="236.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="666.6666666666666" y="237" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Culture</text><rect x="30" y="296" width="365" height="86" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="212.5" y="328.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Private patriarchy</text><text x="212.5" y="358.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">in the home</text><line x1="399" y1="339" x2="501" y2="339" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="505" y="296" width="365" height="86" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="687.5" y="328.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Public patriarchy</text><text x="687.5" y="358.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">in work and the state</text><text x="450" y="327" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">shift</text><rect x="30" y="402" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="438" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A different view: Hakim’s preference theory (2000)</text><text x="56" y="467" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Women choose home-centred, adaptive or work-centred lifestyles. Critics: "choices" are</text><text x="56" y="489" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">limited by childcare costs and employer practices.</text>
