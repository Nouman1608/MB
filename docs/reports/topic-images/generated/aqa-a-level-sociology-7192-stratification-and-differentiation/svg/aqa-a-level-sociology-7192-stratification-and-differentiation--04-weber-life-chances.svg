<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weber: three dimensions of inequality</text>

<rect x="30" y="104" width="269.3333333333333" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><text x="44" y="185.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">economic position</text><text x="44" y="212.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Income, wealth and job</text><text x="44" y="233.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">security.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Status</text><text x="329.3333333333333" y="185.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">social honour</text><text x="329.3333333333333" y="212.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How a group is regarded,</text><text x="329.3333333333333" y="233.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. an ethnic group or</text><text x="329.3333333333333" y="254.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disabled people.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Power (party)</text><text x="614.6666666666666" y="185.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">getting your way</text><text x="614.6666666666666" y="212.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Lukes (1974):</tspan></text><text x="614.6666666666666" y="233.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decision-making,</text><text x="614.6666666666666" y="254.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">agenda-setting, shaping what</text><text x="614.6666666666666" y="275.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people want.</text><line x1="164.66666666666666" y1="305" x2="340" y2="349" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="305" x2="450" y2="349" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735.3333333333333" y1="305" x2="560" y2="349" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="190" y="355" width="520" height="88" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="391" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Life chances</text><text x="450" y="421" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">health, education, housing, income, long life</text><rect x="30" y="463" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="499" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example: disability</text><text x="56" y="528" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Oliver’s social model: people are disabled by social barriers such as inaccessible</text><text x="56" y="550" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">buildings and employer attitudes. Shakespeare: this can underplay the real effects of</text><text x="56" y="572" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">impairment.</text>
</svg>