<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A plan in outline</text>

<rect x="30" y="110" width="840" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="150" width="780" height="200" rx="8" fill="#eef2ea"/><circle cx="120" cy="250" r="56" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="120" y="246" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">town</text><text x="120" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">centre</text><path d="M176,250 L800,250" stroke="#4a5568" stroke-width="16" stroke-linecap="round"/><path d="M176,250 L800,250" stroke="#ffffff" stroke-width="2" stroke-dasharray="12 10"/><rect x="230" y="168" width="350" height="60" rx="6" fill="#cbbf9f" opacity="0.8"/><text x="405" y="204" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">older, denser housing</text><rect x="520" y="168" width="300" height="60" rx="6" fill="#d8e3c6" opacity="0.8"/><text x="670" y="204" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">newer, lower-density housing</text><rect x="560" y="276" width="200" height="56" rx="6" fill="#a9c48f" opacity="0.8"/><text x="660" y="309" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">more open space</text><circle cx="200" cy="250" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="200" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="350" cy="250" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="350" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="500" cy="250" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="650" cy="250" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="650" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="800" cy="250" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="800" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="176" y1="372" x2="800" y2="372" stroke="#1e2a44" stroke-width="2"/><line x1="176" y1="364" x2="176" y2="380" stroke="#1e2a44" stroke-width="2"/><line x1="800" y1="364" x2="800" y2="380" stroke="#1e2a44" stroke-width="2"/><text x="488" y="404" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">main road, 2 km from centre to edge of town</text><text x="830" y="166" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">edge of town →</text><text x="70" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">sites at regular intervals · not to scale</text><rect x="30" y="440" width="840" height="43.120000000000005" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="467.56" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Hypothesis</text><text x="250" y="466" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">environmental quality scores increase with distance from the town centre</text><rect x="30" y="483.12" width="840" height="64.24000000000001" fill="#f7f9f9" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="521.24" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Theory</text><text x="250" y="509.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">urban land-use models: older, denser housing and more traffic near the</text><text x="250" y="530.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">centre; newer housing and more open space further out</text><rect x="30" y="547.36" width="840" height="43.120000000000005" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="574.9200000000001" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Location</text><text x="250" y="573.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one road crossing several housing types, with pavements throughout</text><rect x="30" y="590.48" width="840" height="43.120000000000005" fill="#f7f9f9" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="618.04" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Background research</text><text x="250" y="616.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">town map to plan sites; census data on housing and open space</text><rect x="30" y="633.6" width="840" height="64.24000000000001" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="671.72" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Risks</text><text x="250" y="659.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">traffic at junctions: pavements and crossings. Questionnaires: work in</text><text x="250" y="680.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pairs in daylight</text><rect x="30" y="440" width="840" height="257.84000000000003" rx="10" fill="none" stroke="#1e2a44" stroke-width="2.2"/>
