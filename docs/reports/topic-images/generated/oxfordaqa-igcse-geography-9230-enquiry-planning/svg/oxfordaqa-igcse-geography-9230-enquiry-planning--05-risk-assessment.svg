<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 666" width="900" height="666" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="666" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Risks and how to reduce them</text>

<rect x="30" y="110" width="840" height="46" rx="12" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="140" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Setting</text><text x="150" y="140" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Risk</text><text x="480" y="140" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">How to reduce it</text><rect x="30" y="156" width="840" height="64.24000000000001" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="156" width="110" height="64.24000000000001" fill="#eaf1f8" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="194.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">River</text><text x="150" y="192.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deep or fast water; slippery rocks</text><line x1="448" y1="188.12" x2="470" y2="188.12" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="480" y="182" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Check river levels; shallow sections only;</text><text x="480" y="203.12" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">suitable footwear; never work alone</text><rect x="30" y="220.24" width="840" height="43.120000000000005" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="220.24" width="110" height="43.120000000000005" fill="#eaf1f8" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="247.8" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">River</text><text x="150" y="246.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Water-borne infection</text><line x1="448" y1="241.8" x2="470" y2="241.8" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="480" y="246.24" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Cover cuts; wash hands; do not drink the water</text><rect x="30" y="263.36" width="840" height="43.120000000000005" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="263.36" width="110" height="43.120000000000005" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="290.92" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Coast</text><text x="150" y="289.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Incoming tide cutting off the beach</text><line x1="448" y1="284.92" x2="470" y2="284.92" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="480" y="289.36" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Check tide times; set a turn-back time</text><rect x="30" y="306.48" width="840" height="64.24000000000001" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="306.48" width="110" height="64.24000000000001" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="344.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Coast</text><text x="150" y="343.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Falling rocks at cliff bases</text><line x1="448" y1="338.6" x2="470" y2="338.6" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="480" y="332.48" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Keep away from the cliff foot; helmet if</text><text x="480" y="353.6" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">required</text><rect x="30" y="370.72" width="840" height="64.24000000000001" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="370.72" width="110" height="64.24000000000001" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="408.84000000000003" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Town</text><text x="150" y="407.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Traffic</text><line x1="448" y1="402.84000000000003" x2="470" y2="402.84000000000003" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="480" y="396.72" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Stay on pavements; use crossings;</text><text x="480" y="417.84000000000003" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">high-visibility clothing</text><rect x="30" y="434.96000000000004" width="840" height="64.24000000000001" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="434.96000000000004" width="110" height="64.24000000000001" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="473.08000000000004" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Town</text><text x="150" y="460.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Approaching strangers for</text><text x="150" y="482.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">questionnaires</text><line x1="448" y1="467.08000000000004" x2="470" y2="467.08000000000004" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="480" y="460.96000000000004" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Work in pairs or groups; public places; carry</text><text x="480" y="482.08000000000004" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">ID; leave if uncomfortable</text><rect x="30" y="499.20000000000005" width="840" height="64.24000000000001" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="499.20000000000005" width="110" height="64.24000000000001" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="48" y="537.32" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Any</text><text x="150" y="535.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bad weather, heat or cold</text><line x1="448" y1="531.32" x2="470" y2="531.32" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="480" y="525.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Check the forecast; water, sun protection or</text><text x="480" y="546.32" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">waterproofs; change the date if needed</text><rect x="30" y="110" width="840" height="453.44000000000005" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/><rect x="30" y="583.44" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="615.5400000000001" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A precaution must match the risk. “Be careful” is not a precaution.</text>
</svg>