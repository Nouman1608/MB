<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 714" width="900" height="714" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Background research and evidence</text>

<text x="30" y="128" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Secondary sources, before any data collection</text><rect x="30" y="144" width="380" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="180.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Large-scale maps</text><text x="48" y="207.22" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">locate sites; distances and heights</text><path d="M412,186 C450,186 440,300 476,300" fill="none" stroke="#2e6b62" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="30" y="240" width="380" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="276.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Census and local authority data</text><text x="48" y="303.22" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">population, housing or land use</text><path d="M412,282 C450,282 440,300 476,300" fill="none" stroke="#2e6b62" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="30" y="336" width="380" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="372.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">GIS and satellite imagery</text><text x="48" y="399.22" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">geo-spatial data (in the specification)</text><path d="M412,378 C450,378 440,300 476,300" fill="none" stroke="#2e6b62" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="30" y="432" width="380" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="468.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Previous studies, news, websites</text><text x="48" y="495.22" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. river or park authorities</text><path d="M412,474 C450,474 440,300 476,300" fill="none" stroke="#2e6b62" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="482" y="204" width="388" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="676" y="240" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Background research helps you</text><text x="510" y="280" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• choose sites</text><text x="510" y="316" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• refine your hypothesis</text><text x="510" y="352" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• understand the context</text><rect x="482" y="408" width="388" height="54" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="676" y="442" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Record every source in a bibliography</text><text x="30" y="560" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Plan both kinds of evidence</text><rect x="30" y="576" width="410" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="612.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Primary</text><text x="48" y="639.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collected by you or your group: measurements,</text><text x="48" y="660.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">counts, questionnaires. Gives local detail.</text><rect x="460" y="576" width="410" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="478" y="612.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary</text><text x="478" y="639.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collected by others, such as census data.</text><text x="478" y="660.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gives comparison and context.</text>
</svg>