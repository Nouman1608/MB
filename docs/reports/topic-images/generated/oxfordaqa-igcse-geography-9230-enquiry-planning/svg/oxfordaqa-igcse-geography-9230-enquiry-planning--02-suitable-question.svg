<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 687" width="900" height="687" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes a question suitable</text>

<rect x="30" y="110" width="410" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="144" width="28" height="28" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><path d="M54,158 l6,7 l12,-14" fill="none" stroke="#2e6b62" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" /><text x="90" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Geographical</text><text x="90" y="168" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">places, processes or patterns; linked to</text><text x="90" y="189.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a theory</text><rect x="460" y="110" width="410" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="478" y="144" width="28" height="28" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><path d="M484,158 l6,7 l12,-14" fill="none" stroke="#2e6b62" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" /><text x="520" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Testable</text><text x="520" y="168" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">names variables you can measure</text><rect x="30" y="218" width="410" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="252" width="28" height="28" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><path d="M54,266 l6,7 l12,-14" fill="none" stroke="#2e6b62" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" /><text x="90" y="252" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Specific</text><text x="90" y="276" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">names the place and, if needed, the time</text><rect x="460" y="218" width="410" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="478" y="252" width="28" height="28" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><path d="M484,266 l6,7 l12,-14" fill="none" stroke="#2e6b62" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" /><text x="520" y="252" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Manageable</text><text x="520" y="276" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">data collectable in the time, with the</text><text x="520" y="297.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">equipment and people</text><rect x="30" y="326" width="410" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="360" width="28" height="28" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><path d="M54,374 l6,7 l12,-14" fill="none" stroke="#2e6b62" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" /><text x="90" y="360" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Safe and accessible</text><text x="90" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sites reached legally and safely</text><rect x="460" y="326" width="410" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="478" y="360" width="28" height="28" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><path d="M484,374 l6,7 l12,-14" fill="none" stroke="#2e6b62" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" /><text x="520" y="360" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Likely to show variation</text><text x="520" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">otherwise there is nothing to analyse</text><rect x="30" y="434" width="410" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="468" width="28" height="28" rx="5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><path d="M54,482 l6,7 l12,-14" fill="none" stroke="#2e6b62" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" /><text x="90" y="468" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Supported by secondary data</text><text x="90" y="492" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">background information sets the context</text><rect x="460" y="434" width="410" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="665" y="476.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Check every idea</text><text x="665" y="503.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">against all seven factors</text><rect x="30" y="552" width="410" height="107" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="588.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weaker</text><text x="48" y="616.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“What is the town like?”  Not testable, no</text><text x="48" y="638.9300000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">variable, no theory.</text><rect x="460" y="552" width="410" height="107" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="588.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Stronger</text><text x="478" y="616.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Do pedestrian numbers decrease with</text><text x="478" y="638.9300000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">distance from the centre of (named town)?”</text>
</svg>