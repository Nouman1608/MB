<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Aim, question and hypothesis</text>

<rect x="30" y="110" width="840" height="101.32000000000001" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Aim</text><text x="52" y="170.08" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what the enquiry sets out to</text><text x="52" y="191.20000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">find out, in general terms</text><rect x="470" y="120" width="384" height="81.32000000000001" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="486" y="155.22" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">To investigate how a river changes</text><text x="486" y="177.66" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">downstream</text><line x1="450" y1="213.32" x2="450" y2="227.32" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="229.32" width="840" height="80.2" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="264.32" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Enquiry question</text><text x="52" y="289.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a question the data will answer</text><rect x="470" y="239.32" width="384" height="60.2" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="486" y="263.98" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">How do river width and depth change</text><text x="486" y="286.42" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">downstream along the (named) river?</text><line x1="450" y1="311.52" x2="450" y2="325.52" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="327.52" width="840" height="101.32000000000001" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="362.52" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Hypothesis</text><text x="52" y="387.59999999999997" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a testable statement that</text><text x="52" y="408.71999999999997" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">predicts a result</text><rect x="470" y="337.52" width="384" height="81.32000000000001" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="486" y="372.74" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">River width increases with distance</text><text x="486" y="395.18" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">downstream</text><line x1="450" y1="430.84" x2="450" y2="444.84" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="446.84" width="840" height="101.32000000000001" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="481.84" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sub-questions</text><text x="52" y="506.91999999999996" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">smaller questions that build</text><text x="52" y="528.04" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">towards the main one</text><rect x="470" y="456.84" width="384" height="81.32000000000001" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="486" y="492.06" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Does velocity also change? Does pebble</text><text x="486" y="514.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">size decrease?</text><rect x="30" y="570.16" width="410" height="106" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="606.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Choose a hypothesis…</text><text x="48" y="633.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">because the data can show it to be supported</text><text x="48" y="655" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or not supported</text><rect x="460" y="570.16" width="410" height="106" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="606.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Choose a question…</text><text x="478" y="633.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">when you do not want to predict the answer in</text><text x="478" y="655" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advance</text>
</svg>