<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The theory behind the enquiry</text>

<rect x="30" y="115" width="187.5" height="118" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="123.75" y="146.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Theory or</text><text x="123.75" y="170.35999999999999" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">concept</text><text x="123.75" y="196.16" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a reason to expect a</text><text x="123.75" y="215.96" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">pattern</text><line x1="220.5" y1="174" x2="242.5" y2="174" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247.5" y="115" width="187.5" height="118" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="341.25" y="168.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hypothesis</text><text x="341.25" y="194.4" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">predicts that pattern</text><line x1="438" y1="174" x2="460" y2="174" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="115" width="187.5" height="118" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="558.75" y="168.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Data collected</text><text x="558.75" y="194.4" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">at your sites</text><line x1="655.5" y1="174" x2="677.5" y2="174" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="682.5" y="115" width="187.5" height="118" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="776.25" y="158.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><text x="776.25" y="184.4" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">compares results with</text><text x="776.25" y="204.20000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the prediction</text><text x="40" y="268" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Enquiry focus</text><text x="270" y="268" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Theory or concept</text><text x="570" y="268" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Expected pattern</text><rect x="30" y="280" width="840" height="68.24000000000001" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="40" y="304" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">River channel change</text><text x="270" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more water joins downstream</text><line x1="546" y1="314.12" x2="562" y2="314.12" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="570" y="304" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">width, depth, velocity increase;</text><text x="570" y="325.12" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">sediment smaller and rounder</text><rect x="30" y="348.24" width="840" height="68.24000000000001" fill="#f7f9f9" stroke="#c9d6d4" stroke-width="1.5"/><text x="40" y="372.24" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Land use in a town</text><text x="270" y="372.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">urban land-use models; land most</text><text x="270" y="393.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">valuable near the centre</text><line x1="546" y1="382.36" x2="562" y2="382.36" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="570" y="372.24" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">shops and offices at the centre;</text><text x="570" y="393.36" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">housing density falls outwards</text><rect x="30" y="416.48" width="840" height="68.24000000000001" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="40" y="440.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sand dune ecosystems</text><text x="270" y="440.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">succession</text><line x1="546" y1="450.6" x2="562" y2="450.6" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="570" y="440.48" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">vegetation cover and variety</text><text x="570" y="461.6" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">increase inland</text><rect x="30" y="484.72" width="840" height="68.24000000000001" fill="#f7f9f9" stroke="#c9d6d4" stroke-width="1.5"/><text x="40" y="508.72" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Environmental quality</text><text x="270" y="508.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">differences in housing, open</text><text x="270" y="529.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">space and deprivation</text><line x1="546" y1="518.84" x2="562" y2="518.84" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="570" y="508.72" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">quality varies between inner and</text><text x="570" y="529.84" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">outer areas</text><rect x="30" y="552.96" width="840" height="68.24000000000001" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="40" y="576.96" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Microclimate</text><text x="270" y="576.96" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surfaces and buildings change</text><text x="270" y="598.08" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">temperature and wind</text><line x1="546" y1="587.08" x2="562" y2="587.08" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="570" y="576.96" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">warmer over tarmac and between</text><text x="570" y="598.08" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">buildings than over grass</text>
</svg>