<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading velocity−time graphs</text>

<rect x="30" y="110" width="270" height="275" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="80" y1="295" x2="280" y2="295" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="80" y1="295" x2="80" y2="145" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="276" y="317" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time</text><text x="68" y="220" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 68 220)">velocity</text><line x1="86" y1="225" x2="250" y2="225" stroke="#2b5a9a" stroke-width="4"/><text x="165" y="342" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Horizontal</text><text x="165" y="368" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">constant velocity</text><rect x="315" y="110" width="270" height="275" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="365" y1="295" x2="565" y2="295" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="365" y1="295" x2="365" y2="145" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="561" y="317" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time</text><text x="353" y="220" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 353 220)">velocity</text><line x1="369" y1="291" x2="535" y2="175" stroke="#2b5a9a" stroke-width="4"/><text x="450" y="342" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Straight, sloping up</text><text x="450" y="368" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">constant acceleration</text><rect x="600" y="110" width="270" height="275" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="650" y1="295" x2="850" y2="295" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="650" y1="295" x2="650" y2="145" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="846" y="317" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time</text><text x="638" y="220" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 638 220)">velocity</text><line x1="654" y1="175" x2="820" y2="291" stroke="#2b5a9a" stroke-width="4"/><text x="735" y="342" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Straight, sloping down</text><text x="735" y="368" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">constant deceleration</text><rect x="30" y="400" width="270" height="275" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="80" y1="585" x2="280" y2="585" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="80" y1="585" x2="80" y2="435" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="276" y="607" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time</text><text x="68" y="510" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 68 510)">velocity</text><path d="M84,581 Q130,465 250,460" fill="none" stroke="#2b5a9a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="165" y="632" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Curve getting less steep</text><text x="165" y="658" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">acceleration decreasing</text><rect x="315" y="400" width="270" height="275" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="365" y1="585" x2="565" y2="585" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="365" y1="585" x2="365" y2="435" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="561" y="607" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time</text><text x="353" y="510" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 353 510)">velocity</text><line x1="369" y1="583" x2="540" y2="583" stroke="#2b5a9a" stroke-width="6"/><text x="450" y="632" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Line on the time axis</text><text x="450" y="658" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">stationary</text><rect x="600" y="400" width="270" height="275" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="735" y="440" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Gradient</text><text x="735" y="466" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">= acceleration</text><text x="735" y="512" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Area under line</text><text x="735" y="538" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">= distance travelled</text><line x1="625" y1="562" x2="845" y2="562" stroke="#8a6d0d" stroke-width="1.5"/><text x="735" y="592" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">A horizontal line on a</text><text x="735" y="614" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">v−t graph: moving</text><text x="735" y="636" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">steadily, not stationary.</text>
</svg>