<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Average speed = total distance ÷ total time</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">One journey of 60 km in two parts</text><rect x="70" y="190" width="380" height="60" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><rect x="450" y="190" width="380" height="60" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="260" y="218" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">30 km at 60 km/h</text><text x="260" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">time = 30 ÷ 60 = 0.50 h</text><text x="640" y="218" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">30 km at 30 km/h</text><text x="640" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">time = 30 ÷ 30 = 1.0 h</text><text x="450" y="290" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Same distance, but the slow part takes twice as long</text><rect x="70" y="320" width="253.33333333333334" height="50" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><rect x="323.33333333333337" y="320" width="506.6666666666667" height="50" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="196.66666666666669" y="352" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0.50 h</text><text x="576.6666666666667" y="352" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1.0 h</text><text x="70" y="304" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">time:</text><text x="70" y="182" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">distance:</text><rect x="30" y="430" width="410" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="470" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">✓ Correct</text><text x="235" y="512" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">total distance ÷ total time</text><text x="235" y="550" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle">60 km ÷ 1.5 h</text><text x="235" y="592" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">= 40 km/h</text><rect x="460" y="430" width="410" height="190" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="470" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">✗ Wrong</text><text x="665" y="512" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">average of the two speeds</text><text x="665" y="550" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle">(60 + 30) ÷ 2</text><text x="665" y="592" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">= 45 km/h</text>
</svg>