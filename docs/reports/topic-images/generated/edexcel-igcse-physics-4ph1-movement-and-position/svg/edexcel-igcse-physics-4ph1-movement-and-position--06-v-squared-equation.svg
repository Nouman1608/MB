<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When to use v² = u² + 2as</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="330" y="135" width="240" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="172" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Is time given or asked for?</text><line x1="370" y1="195" x2="230" y2="245" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="530" y1="195" x2="670" y2="245" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="285" y="222" font-size="16" font-weight="700" fill="#4a5568" text-anchor="end">yes</text><text x="615" y="222" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">no, only distance</text><rect x="80" y="250" width="300" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="294" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">a = (v − u) ÷ t</text><rect x="520" y="250" width="300" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="670" y="294" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">v² = u² + 2as</text><text x="450" y="365" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">v² = u² + 2as needs constant acceleration. Write u, v, a and s first, with signs.</text><rect x="30" y="390" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Braking to rest</text><text x="54" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">u = 25 m/s,  v = 0</text><text x="54" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a = −5.0 m/s²  (deceleration)</text><text x="54" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">0² = 25² + 2 × (−5.0) × s</text><text x="54" y="560" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">0 = 625 − 10s</text><text x="54" y="590" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">s = 625 ÷ 10</text><rect x="50" y="622" width="370" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="653" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">s = 62.5 m, about 63 m</text><rect x="460" y="390" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ball dropped from rest</text><text x="484" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">u = 0,  s = 1.8 m</text><text x="484" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a = 10 m/s²  (no air resistance)</text><text x="484" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">v² = 0² + 2 × 10 × 1.8</text><text x="484" y="560" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">v² = 36</text><text x="484" y="590" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">v = √36  (do not forget the root)</text><rect x="480" y="622" width="370" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="653" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">v = 6.0 m/s</text>
</svg>