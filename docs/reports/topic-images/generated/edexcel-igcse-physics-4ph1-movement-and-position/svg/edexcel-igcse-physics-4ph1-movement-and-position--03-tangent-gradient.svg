<rect x="30" y="110" width="840" height="530" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="540" x2="590" y2="540" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="120" y1="540" x2="120" y2="160" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="355" y="576" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">time / s</text><text x="90" y="350" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 90 350)">distance / m</text><path d="M120,540 L130.5,539.79375 L141,539.175 L151.5,538.14375 L162,536.7 L172.5,534.84375 L183,532.575 L193.5,529.89375 L204,526.8 L214.5,523.29375 L225,519.375 L235.5,515.04375 L246,510.3 L256.5,505.14375 L267,499.575 L277.5,493.59375 L288,487.2 L298.5,480.39375 L309,473.175 L319.5,465.54375 L330,457.5 L340.5,449.04375 L351,440.17499999999995 L361.5,430.89375 L372,421.2 L382.5,411.09375 L393,400.575 L403.5,389.64374999999995 L414,378.30000000000007 L424.5,366.54375000000005 L435,354.375 L445.5,341.79375 L456,328.79999999999995 L466.5,315.39375 L477,301.57500000000005 L487.5,287.34375 L498,272.7 L508.5,257.64375 L519,242.175 L529.5,226.29375 L540,210" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="325" y1="484.0178571428571" x2="545" y2="224.73214285714286" stroke="#2e6b62" stroke-width="3.5"/><circle cx="435" cy="354.375" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="335" y1="472.23214285714283" x2="535" y2="472.23214285714283" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="535" y1="472.23214285714283" x2="535" y2="236.51785714285714" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="335" cy="472.23214285714283" r="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="535" cy="236.51785714285714" r="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><text x="435" y="500.23214285714283" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">change in time</text><text x="547" y="364.375" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">change in</text><text x="547" y="384.375" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">distance</text><text x="413" y="340.375" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">point</text><text x="515" y="212.73214285714286" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">tangent</text><rect x="655" y="150" width="195" height="420" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="673" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">1. Draw a tangent</text><text x="673" y="215" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">touching the curve</text><text x="673" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">at the point.</text><text x="673" y="265" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="673" y="290" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">2. Pick two points</text><text x="673" y="315" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">on it, far apart.</text><text x="673" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="673" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">3. speed =</text><text x="673" y="390" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">change in distance</text><text x="673" y="415" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">÷ change in time</text><text x="450" y="622" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A curve getting steeper: the object is speeding up.</text>
