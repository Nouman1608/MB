<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 930" width="900" height="930" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="930" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Practical: a toy car down a ramp</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M70,220 L300,380 L70,380 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="60" y1="380" x2="850" y2="380" stroke="#1e2a44" stroke-width="3"/><g transform="translate(110,248) rotate(34.824489156956794)"><rect x="-22" y="-26" width="48" height="20" rx="5" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="-12" cy="-4" r="6" fill="#1e2a44"/><circle cx="16" cy="-4" r="6" fill="#1e2a44"/></g><text x="70" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">release from rest</text><text x="70" y="200" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(do not push)</text><line x1="320" y1="350" x2="320" y2="390" stroke="#2e6b62" stroke-width="3"/><text x="320" y="414" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">0</text><line x1="440" y1="350" x2="440" y2="390" stroke="#2e6b62" stroke-width="3"/><text x="440" y="414" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">0.50 m</text><line x1="560" y1="350" x2="560" y2="390" stroke="#2e6b62" stroke-width="3"/><text x="560" y="414" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">1.0 m</text><line x1="680" y1="350" x2="680" y2="390" stroke="#2e6b62" stroke-width="3"/><text x="680" y="414" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">1.50 m</text><line x1="800" y1="350" x2="800" y2="390" stroke="#2e6b62" stroke-width="3"/><text x="800" y="414" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">2.0 m</text><text x="560" y="444" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">marks every 0.50 m (metre rule)</text><rect x="552" y="260" width="16" height="70" rx="3" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="560" y1="330" x2="560" y2="350" stroke="#b5602e" stroke-width="2" stroke-dasharray="3 3"/><rect x="792" y="260" width="16" height="70" rx="3" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="800" y1="330" x2="800" y2="350" stroke="#b5602e" stroke-width="2" stroke-dasharray="3 3"/><rect x="640" y="150" width="150" height="52" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="715" y="182" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">data logger</text><path d="M560,260 Q570,180 640,176" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M800,260 Q800,210 790,190" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="530" y="250" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">light gates</text><text x="450" y="490" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Stopwatch method: time to each mark, repeat 3 times, use the mean.</text><rect x="30" y="530" width="410" height="200" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="60" y="568" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Problem: reaction time</text><text x="60" y="602" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Starting and stopping a</text><text x="60" y="627" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stopwatch by hand adds an</text><text x="60" y="652" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">error to every reading. It</text><text x="60" y="677" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">matters most for short times,</text><text x="60" y="702" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">such as a ball falling 1–2 m.</text><rect x="460" y="530" width="410" height="200" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="568" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Better methods</text><text x="490" y="602" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="490" y="627" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="490" y="652" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="490" y="677" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">•</text><text x="508" y="602" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">light gates and a data logger</text><text x="508" y="627" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">film beside a metre rule and</text><text x="508" y="652" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">step through frame by frame</text><text x="508" y="677" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">repeat and average to reduce</text><text x="508" y="702" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">random errors</text><rect x="30" y="750" width="840" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="786" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ramp height investigation</text><text x="60" y="818" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Independent variable: ramp height</text><text x="60" y="846" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Dependent variable: average speed (from distance and time)</text><text x="60" y="874" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Control variables: the car, the ramp surface, the release point</text>
</svg>