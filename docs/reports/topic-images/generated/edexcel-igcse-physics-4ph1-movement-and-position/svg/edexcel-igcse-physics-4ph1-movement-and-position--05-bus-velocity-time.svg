ke="#dce9e7" stroke-width="1"/><line x1="110" y1="182" x2="830" y2="182" stroke="#dce9e7" stroke-width="1"/><line x1="110" y1="134" x2="830" y2="134" stroke="#dce9e7" stroke-width="1"/><path d="M110,470 L270,182 L270,470 Z" fill="#b5d3cf"/><rect x="270" y="182" width="400" height="288" fill="#f2e7b8"/><path d="M670,182 L790,470 L670,470 Z" fill="#b5d3cf"/><path d="M110,470 L270,182 L670,182 L790,470" fill="none" stroke="#2b5a9a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="110" y1="470" x2="840" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="470" x2="110" y2="128" stroke="#1e2a44" stroke-width="3"/><text x="110" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><text x="270" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">8</text><text x="670" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">28</text><text x="790" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">34</text><text x="100" y="475" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">0</text><text x="100" y="379" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">4</text><text x="100" y="283" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">8</text><text x="100" y="187" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">12</text><text x="470" y="520" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">time / s</text><text x="66" y="302" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 66 302)">velocity / (m/s)</text><text x="222" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">48 m</text><text x="470" y="338" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">240 m</text><text x="710" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">36 m</text><text x="150" y="249.20000000000002" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">gradient</text><text x="150" y="267" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">= 1.5 m/s²</text><text x="734" y="158" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="middle">gradient</text><text x="734" y="175.79999999999995" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="middle">= −2.0 m/s²</text><rect x="30" y="580" width="840" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="616" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gradients (acceleration)</text><text x="60" y="648" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(12 − 0) ÷ 8.0 = 1.5 m/s²</text><text x="60" y="675" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(0 − 12) ÷ 6.0 = −2.0 m/s²</text><text x="60" y="702" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">= deceleration of 2.0 m/s²</text><text x="470" y="616" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Areas (distance)</text><text x="470" y="648" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">½ × 8.0 × 12 = 48 m</text><text x="470" y="675" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">20 × 12 = 240 m</text><text x="470" y="702" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">½ × 6.0 × 12 = 36 m</text><text x="470" y="735" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">total = 324 m</text><line x1="60" y1="755" x2="840" y2="755" stroke="#8a6d0d" stroke-width="1.5"/><text x="450" y="790" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">average speed = 324 ÷ 34 = 9.5 m/s (2 s.f.)</text>
