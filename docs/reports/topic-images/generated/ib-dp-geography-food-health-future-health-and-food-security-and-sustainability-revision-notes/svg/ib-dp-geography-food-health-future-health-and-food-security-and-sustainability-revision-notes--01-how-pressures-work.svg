<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the pressures work</text>

<text x="130" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Pressure</text><text x="401" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">How it works</text><text x="721" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Result</text><rect x="30" y="143" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="167" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FOOD</text><text x="46" y="197" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Animal products</text><rect x="262" y="143" width="278" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meat (esp. beef) needs more</text><text x="276" y="199" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">land, water and feed per</text><text x="276" y="220" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">calorie</text><rect x="572" y="143" width="298" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="188.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">rising meat demand multiplies</text><text x="586" y="209.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">pressure on land</text><line x1="232" y1="193" x2="258" y2="193" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="542" y1="193" x2="568" y2="193" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="253" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="277" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FOOD</text><text x="46" y="307" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Climate change</text><rect x="262" y="253" width="278" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="298.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heat stress, changing rainfall,</text><text x="276" y="319.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more frequent extremes</text><rect x="572" y="253" width="298" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="288" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">lower staple yields in many warm</text><text x="586" y="309" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">regions; uneven, widens</text><text x="586" y="330" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">inequality</text><line x1="232" y1="303" x2="258" y2="303" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="542" y1="303" x2="568" y2="303" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="363" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="387" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FOOD</text><text x="46" y="417" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Biofuels</text><rect x="262" y="363" width="278" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="408.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">land and crops (e.g. maize for</text><text x="276" y="429.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ethanol) used for fuel</text><rect x="572" y="363" width="298" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="408.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">competes with food; one factor in</text><text x="586" y="429.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">the 2007–2008 price spikes</text><line x1="232" y1="413" x2="258" y2="413" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="542" y1="413" x2="568" y2="413" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="473" width="200" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="497" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FOOD</text><text x="46" y="527" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conflict</text><rect x="262" y="473" width="278" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2022 invasion of Ukraine</text><text x="276" y="529" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disrupted Black Sea grain and</text><text x="276" y="550" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fertiliser</text><rect x="572" y="473" width="298" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="508" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">world prices rose, hitting</text><text x="586" y="529" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">import-dependent N. Africa,</text><text x="586" y="550" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Middle East</text><line x1="232" y1="523" x2="258" y2="523" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="542" y1="523" x2="568" y2="523" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="583" width="200" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="607" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HEALTH</text><text x="46" y="637" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Antimicrobial</text><text x="46" y="660" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">resistance</text><rect x="262" y="583" width="278" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="628.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">antibiotics overused or misused</text><text x="276" y="649.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in people and livestock</text><rect x="572" y="583" width="298" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="628.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">bacteria evolve resistance;</text><text x="586" y="649.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">common infections harder to treat</text><line x1="232" y1="633" x2="258" y2="633" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="542" y1="633" x2="568" y2="633" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="693" width="200" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="717" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HEALTH</text><text x="46" y="747" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ageing</text><rect x="262" y="693" width="278" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="749" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">longer lives</text><rect x="572" y="693" width="298" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="738.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">more dementia, heart disease and</text><text x="586" y="759.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">diabetes; growing care costs</text><line x1="232" y1="743" x2="258" y2="743" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="542" y1="743" x2="568" y2="743" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>