<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Technology options: benefit and catch</text>

<text x="460" y="140" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">+ Benefit</text><text x="680" y="140" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">− Catch</text><rect x="30" y="160" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="210" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Precision agriculture</text><text x="56" y="242" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">satellite data, sensors,</text><text x="56" y="262" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">targeted fertiliser</text><rect x="445" y="178" width="200" height="96" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="662" y="178" width="192" height="96" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="2"/><text x="545" y="215" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">cuts waste of</text><text x="545" y="237" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">inputs</text><text x="758" y="215" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">costly for small</text><text x="758" y="236" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">farmers</text><rect x="30" y="310" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="370" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Drought- or flood-</text><text x="56" y="396" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">tolerant varieties</text><rect x="445" y="328" width="200" height="96" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="662" y="328" width="192" height="96" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="2"/><text x="545" y="376" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">improve resilience</text><text x="758" y="354" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">must reach farmers</text><text x="758" y="375" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">at affordable</text><text x="758" y="396" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">prices</text><rect x="30" y="460" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="520" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Vertical farming</text><rect x="445" y="478" width="200" height="96" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="662" y="478" width="192" height="96" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="2"/><text x="545" y="515" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">uses little land</text><text x="545" y="537" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">and water</text><text x="758" y="504" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">high energy costs;</text><text x="758" y="525" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">suits high-value</text><text x="758" y="546" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">crops, not staples</text><rect x="30" y="620" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="662" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Do not treat technology as automatically sustainable: ask who can afford it.</text>
</svg>