<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Food loss or food waste?</text>

<rect x="184" y="150" width="334" height="200" rx="16" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="9 6"/><rect x="520" y="150" width="340" height="200" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="9 6"/><text x="352" y="178" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">FOOD LOSS</text><text x="693" y="178" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">FOOD WASTE</text><rect x="30" y="200" width="140" height="80" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="247" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Farm</text><line x1="171" y1="240" x2="194" y2="240" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="196" y="200" width="140" height="80" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="266" y="247" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Harvest</text><line x1="337" y1="240" x2="360" y2="240" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="362" y="200" width="140" height="80" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="432" y="236" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Storage and</text><text x="432" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">transport</text><line x1="503" y1="240" x2="526" y2="240" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="528" y="200" width="140" height="80" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="598" y="247" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Retail</text><line x1="669" y1="240" x2="692" y2="240" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="694" y="200" width="140" height="80" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="764" y="247" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumer</text><text x="352" y="325" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">poor storage, pests</text><text x="693" y="325" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">at retail and consumer level</text><rect x="30" y="380" width="410" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="418" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Lower-income countries</text><text x="54" y="452" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">most is lost after harvest through</text><text x="54" y="475" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">poor storage and transport</text><text x="54" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Response:</text><text x="54" y="556" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">storage and cold chains</text><rect x="460" y="380" width="410" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="418" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Higher-income countries</text><text x="484" y="452" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">more is wasted by retailers</text><text x="484" y="475" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and consumers</text><text x="484" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Response:</text><text x="484" y="556" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">labelling, redistribution and</text><text x="484" y="579" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">behaviour change</text><text x="450" y="650" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">FAO (2011): roughly a third of food produced for people is lost or wasted.</text>
</svg>