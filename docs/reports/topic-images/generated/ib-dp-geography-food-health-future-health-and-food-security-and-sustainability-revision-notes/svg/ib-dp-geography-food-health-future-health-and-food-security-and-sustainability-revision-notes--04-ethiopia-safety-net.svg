<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ethiopia's Productive Safety Net Programme</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">launched 2005</text>
<rect x="30" y="130" width="260" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="160" y="166" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Rural households</text><text x="160" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">chronically</text><text x="160" y="217" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">food-insecure</text><rect x="610" y="130" width="260" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="166" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Community work</text><text x="740" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">soil and water conservation,</text><text x="740" y="217" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">terracing, roads</text><line x1="292" y1="175" x2="606" y2="175" stroke="#1e2a44" stroke-width="4.5" marker-end="url(#ah)"/><text x="450" y="162" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">work on projects</text><line x1="606" y1="240" x2="292" y2="240" stroke="#8a6d0d" stroke-width="4.5" marker-end="url(#ahO)"/><text x="450" y="268" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">food or cash</text><line x1="160" y1="282" x2="160" y2="330" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="335" width="400" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="371" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Predictable support</text><text x="230" y="401" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">replaces repeated emergency appeals;</text><text x="230" y="422" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">protects household assets in drought</text><line x1="432" y1="400" x2="466" y2="400" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="470" y="335" width="400" height="130" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="371" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Builds resilience</text><text x="670" y="401" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">often cited as a large-scale example</text><rect x="30" y="495" width="840" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="55" y="532" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Limits</text><text x="55" y="566" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• depends on donor funding</text><text x="55" y="594" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• cannot by itself overcome conflict or extreme drought</text>
</svg>