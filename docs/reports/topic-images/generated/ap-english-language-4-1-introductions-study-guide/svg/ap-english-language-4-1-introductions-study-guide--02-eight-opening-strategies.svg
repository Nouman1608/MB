<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 559" width="900" height="559" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="559" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eight ways to open</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each has an effect that suits the situation or does not</text>
<rect x="30" y="122" width="412" height="92.68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="151.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Thesis first</text><text x="44" y="177.83" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> immediate clarity for busy or expert readers</text><text x="44" y="197.63000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> abrupt if the audience is hostile</text><rect x="458" y="122" width="412" height="92.68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="472" y="151.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Quotation</text><text x="472" y="177.83" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> borrows authority or voices a view to test</text><text x="472" y="197.63000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> loosely related, never discussed again</text><rect x="30" y="226.68" width="412" height="92.68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="255.88" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Intriguing statement</text><text x="44" y="282.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> short, sharp, creates curiosity</text><text x="44" y="302.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> a gimmick if the argument does not deliver</text><rect x="458" y="226.68" width="412" height="92.68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="472" y="255.88" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Anecdote</text><text x="472" y="282.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> makes an abstract issue human</text><text x="472" y="302.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> too long, or typical of nothing</text><rect x="30" y="331.36" width="412" height="92.68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="360.56" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Question</text><text x="44" y="387.19" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> invites the reader to join the thinking</text><text x="44" y="406.99" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> vague: “Have you ever wondered...?”</text><rect x="458" y="331.36" width="412" height="92.68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="472" y="360.56" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Statistic or data</text><text x="472" y="387.19" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> signals evidence and seriousness</text><text x="472" y="406.99" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> a number with no source, scale or point</text><rect x="30" y="436.04" width="412" height="92.68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="465.24" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Context</text><text x="44" y="491.87" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> orients readers who lack background</text><text x="44" y="511.67" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> turns into a history lecture</text><rect x="458" y="436.04" width="412" height="92.68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="472" y="465.24" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Scenario</text><text x="472" y="491.87" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> lets the reader imagine a situation</text><text x="472" y="511.67" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> unrealistic or unrelated to the claim</text>
</svg>