<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="534" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One sentence, three jobs</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Susan B. Anthony, “On Women’s Right to Vote”, 1873</text>
<rect x="30" y="128" width="259.33286000000004" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="159.66643000000002" y="152.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Friends and fellow citizens:</text><rect x="297.33286000000004" y="128" width="399.29132" height="36" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="496.97852" y="152.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">I stand before you tonight under indictment</text><text x="496.97852" y="185.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">ORIENT: who is speaking, and why</text><rect x="30" y="214.3" width="620.95556" height="36" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="340.47778" y="238.60000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">for the alleged crime of having voted at the last presidential election,</text><text x="340.47778" y="271.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">ENGAGE: a citizen on trial for voting; “alleged” signals a contest</text><rect x="30" y="300.6" width="338.25764" height="36" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="199.12882" y="324.90000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">without having a lawful right to vote.</text><text x="199.12882" y="358.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">FOCUS: sets up the question the speech will</text><text x="199.12882" y="376.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">answer</text><rect x="30" y="413.20000000000005" width="840" height="104.63999999999999" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="48" y="447.20000000000005" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Then the thesis arrives as an answer</text><text x="48" y="475.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Later in the speech she says her work that evening is to prove that in voting she “simply exercised” her</text><text x="48" y="496.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">rights as a citizen.</text>
</svg>