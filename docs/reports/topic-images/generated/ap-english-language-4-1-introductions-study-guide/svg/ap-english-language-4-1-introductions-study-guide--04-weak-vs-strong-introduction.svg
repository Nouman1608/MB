<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="564" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weak and strong introductions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Task: argue whether school should start later</text>
<text x="232" y="138" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Weak</text><text x="668" y="138" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Strong</text><rect x="30" y="152" width="405" height="137.60000000000002" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="48" y="183.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Since the beginning of time, people have</text><text x="48" y="204.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">argued about school start times. In this essay I</text><text x="48" y="225.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">will discuss both sides of this issue. School</text><text x="48" y="246.95999999999998" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">start times are an important topic that affects</text><text x="48" y="268.08" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">many people.”</text><rect x="465" y="152" width="405" height="137.60000000000002" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="483" y="183.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“At 6:40 on a January morning, a bus driver</text><text x="483" y="204.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">switches on her headlights... It is closer to</text><text x="483" y="225.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">biology: adolescents’ body clocks tend to shift</text><text x="483" y="246.95999999999998" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">later at puberty... Districts should therefore</text><text x="483" y="268.08" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">move the first bell later.”</text><rect x="30" y="309.6" width="840" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="340.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Orients</text><text x="50" y="340.6" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start" xml:space="preserve">✗ a sweeping, empty claim</text><text x="850" y="340.6" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" xml:space="preserve">a specific scene and subject ✓</text><rect x="30" y="367.6" width="840" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="398.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Engages</text><text x="50" y="398.6" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start" xml:space="preserve">✗ nothing at stake for the reader</text><text x="850" y="398.6" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" xml:space="preserve">a concrete image, then a surprising reframing ✓</text><rect x="30" y="425.6" width="840" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="456.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Focuses</text><text x="50" y="456.6" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start" xml:space="preserve">✗ announces “both sides”, no position</text><text x="850" y="456.6" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" xml:space="preserve">a clear, defensible claim at the end ✓</text><rect x="30" y="483.6" width="840" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="514.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Wasted words</text><text x="50" y="514.6" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start" xml:space="preserve">✗ “In this essay I will...”</text><text x="850" y="514.6" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" xml:space="preserve">none: each sentence does one job ✓</text>
</svg>