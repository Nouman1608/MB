<rect width="900" height="820" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Managing tourism sustainably</text>

<circle cx="450" cy="420" r="100" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="408" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Keep the</text><text x="450" y="432" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">attraction</text><text x="450" y="456" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">for the future</text><line x1="450" y1="316" x2="450" y2="250" stroke="#4a5568" stroke-width="2.5"/><rect x="330" y="124" width="240" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="344" y="152.875" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Limit numbers</text><text x="344" y="175.35" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">permits, quotas, timed</text><text x="344" y="194.49" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">tickets</text><line x1="531.3104741766751" y1="355.15706060669174" x2="596.2024872215216" y2="314.00673368401533" stroke="#4a5568" stroke-width="2.5"/><rect x="560.6402873280688" y="218.12754953531663" width="240" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="574.6402873280688" y="247.00254953531663" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Zoning</text><text x="574.6402873280688" y="269.47754953531665" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">busy resorts apart from</text><text x="574.6402873280688" y="288.61754953531664" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">protected zones</text><line x1="551.3925028669097" y1="443.1421771314567" x2="632.311519578001" y2="457.82855877257344" stroke="#4a5568" stroke-width="2.5"/><rect x="617.603734093638" y="429.6302334890786" width="240" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="631.603734093638" y="458.5052334890786" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Protected areas</text><text x="631.603734093638" y="480.9802334890786" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">marine and national parks</text><text x="631.603734093638" y="500.1202334890786" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">with rules</text><line x1="495.12390886822607" y1="513.7007622618517" x2="531.1362592149834" y2="573.1647075434113" stroke="#4a5568" stroke-width="2.5"/><rect x="457.9957030396797" y="599.2422169756048" width="240" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="471.9957030396797" y="628.1172169756048" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Ecotourism</text><text x="471.9957030396797" y="650.5922169756049" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">small-scale; funds</text><text x="471.9957030396797" y="669.7322169756048" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conservation, local jobs</text><line x1="404.87609113177393" y1="513.7007622618517" x2="368.8637407850166" y2="573.1647075434113" stroke="#4a5568" stroke-width="2.5"/><rect x="202.0042969603204" y="599.2422169756048" width="240" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="216.0042969603204" y="628.1172169756048" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Local ownership</text><text x="216.0042969603204" y="650.5922169756049" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and training: income stays</text><text x="216.0042969603204" y="669.7322169756048" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">local</text><line x1="348.60749713309036" y1="443.1421771314567" x2="267.688480421999" y2="457.82855877257344" stroke="#4a5568" stroke-width="2.5"/><rect x="42.39626590636203" y="429.63023348907865" width="240" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56.39626590636203" y="458.50523348907865" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Spread demand</text><text x="56.39626590636203" y="480.98023348907867" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">off-season, less-visited</text><text x="56.39626590636203" y="500.12023348907866" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">places</text><line x1="368.68952582332486" y1="355.15706060669174" x2="303.79751277847845" y2="314.00673368401533" stroke="#4a5568" stroke-width="2.5"/><rect x="99.35971267193119" y="218.1275495353167" width="240" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="113.35971267193119" y="247.0025495353167" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Infrastructure</text><text x="113.35971267193119" y="269.4775495353167" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sewage, waste, water sized</text><text x="113.35971267193119" y="288.6175495353167" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for peaks</text><rect x="30" y="735" width="840" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="775" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Always say what the measure protects and how it keeps visitors coming.</text>
</svg>