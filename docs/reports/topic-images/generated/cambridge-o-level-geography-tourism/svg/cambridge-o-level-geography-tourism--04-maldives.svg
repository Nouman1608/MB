e="#1e2a44" stroke-width="1.4"/><ellipse cx="360.99346242532107" cy="460.9022739759581" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="317.66381770117886" cy="422.8371721537113" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="293.1964000831343" cy="363.50419300025806" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="293.1964000831343" cy="296.49580699974194" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="317.6638177011789" cy="237.16282784628868" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="360.99346242532107" cy="199.09772602404195" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="413.25903482808553" cy="191.02075762627246" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="462.4871221404271" cy="214.78225877488808" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="497.4001628218531" cy="264.93875591387246" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="200" cy="500" rx="80" ry="80" fill="#dce9e7" stroke="#b5602e" stroke-width="3" stroke-dasharray="3 5"/><ellipse cx="280" cy="500" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="256.5685424949238" cy="556.5685424949238" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="200" cy="580" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="143.4314575050762" cy="556.5685424949238" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="120" cy="500" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="143.4314575050762" cy="443.4314575050762" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="199.99999999999997" cy="420" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="256.5685424949238" cy="443.4314575050762" rx="9" ry="6" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.4"/><ellipse cx="400" cy="200" rx="22" ry="14" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><rect x="388" y="196" width="18" height="14.399999999999999" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M386.2,196 L397,188.2 L407.8,196 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="402" y="200" width="18" height="14.399999999999999" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M400.2,200 L411,192.2 L421.8,200 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="430" y="210" width="50" height="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.6"/><ellipse cx="335" cy="168" rx="16" ry="10" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="422" y="181.75" width="138" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="428" y="196" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Malé (capital)</text><rect x="480" y="221.75" width="75" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="486" y="236" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">airport</text><rect x="202.5" y="131.75" width="255" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="330" y="146" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">Thilafushi: landfill island</text><ellipse cx="510" cy="330" rx="12" ry="8" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.6"/><rect x="503" y="318" width="14" height="10" fill="#ffffff" stroke="#1e2a44" stroke-width="1.4"/><rect x="359.5" y="385.75" width="111" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="415" y="400" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">one island,</text><rect x="364" y="404.75" width="102" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="415" y="419" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">one resort</text><line x1="450" y1="395" x2="500" y2="335" stroke="#2e6b62" stroke-width="1.8"/><rect x="106.25" y="253.75" width="127.50000000000001" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="170" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">atoll: ring of</text><rect x="110.375" y="271.75" width="119.25000000000001" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="170" y="286" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">coral islands</text><text x="300" y="600" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle" font-style="italic">Schematic, not a map: about 1,200 islands in atolls</text><rect x="590" y="110" width="280" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="608" y="143.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Attractions</text><text x="608" y="166.55" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Coral-sand beaches, clear warm</text><text x="608" y="186.35000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">water, reefs for diving,</text><text x="608" y="206.15" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">tropical climate; luxury</text><text x="608" y="225.95000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">resorts.</text><rect x="590" y="285" width="280" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="318.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Growth</text><text x="608" y="341.55" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">First resorts early 1970s;</text><text x="608" y="361.35" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">airport near Malé and</text><text x="608" y="381.15000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">long-haul flights.</text><rect x="590" y="420" width="280" height="210" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="608" y="453.3" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Problems</text><text x="608" y="476.55" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Foreign ownership and imports</text><text x="608" y="496.35" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cause leakage; resort rubbish</text><text x="608" y="516.15" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">to Thilafushi; reefs damaged</text><text x="608" y="535.95" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">by anchors, divers, building</text><text x="608" y="555.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and bleaching.</text><rect x="30" y="650" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="684" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Longer-term risk</text><rect x="400" y="700" width="450" height="60" fill="#b5d3cf"/><path d="M470,730 Q560,712 640,712 Q720,712 790,730 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><line x1="400" y1="716" x2="850" y2="716" stroke="#2b5a9a" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="695" y="693.75" width="156" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="845" y="708" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="end">higher sea level</text><text x="55" y="712" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Most land is only 1–2 m above sea level:</text><text x="55" y="732" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">sea-level rise threatens the beaches</text><text x="55" y="752" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">the industry depends on.</text>
