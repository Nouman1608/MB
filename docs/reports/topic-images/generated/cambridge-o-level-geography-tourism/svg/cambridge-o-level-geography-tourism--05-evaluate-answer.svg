<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building an “evaluate” answer</text>

<rect x="30" y="115" width="840" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="115" width="190" height="70" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="157" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Named area</text><text x="240" y="156" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">the Maldives</text><line x1="125" y1="187" x2="125" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="207" width="840" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="207" width="190" height="78" rx="12" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="125" y="253" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Benefit</text><text x="240" y="241" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">largest industry: jobs in resorts, boats and the airport; income for</text><text x="240" y="263" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">public services</text><line x1="125" y1="287" x2="125" y2="305" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="307" width="840" height="78" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><rect x="30" y="307" width="190" height="78" rx="12" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><text x="125" y="353" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Disadvantage</text><text x="240" y="341" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">foreign-owned resorts and imported supplies, so money leaks out;</text><text x="240" y="363" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">resort waste created a landfill island near Malé</text><line x1="125" y1="387" x2="125" y2="405" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="407" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="30" y="407" width="190" height="100" rx="12" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="2.5"/><text x="125" y="464" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Judgement</text><text x="240" y="441" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">real gains, but local people gain less than spending suggests, and</text><text x="240" y="463" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">reefs and beaches are at risk: benefits last only if waste and reef</text><text x="240" y="485" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">damage are managed</text><text x="450" y="545" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">The top marks come from the final line: a judgement that rests on evidence.</text>
</svg>