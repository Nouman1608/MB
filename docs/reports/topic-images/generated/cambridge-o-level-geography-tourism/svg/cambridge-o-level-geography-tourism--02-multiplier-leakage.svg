<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who keeps the money?</text>

<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Local control</text><text x="235" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">hotels locally owned, buying local food</text><rect x="135" y="192" width="200" height="56" rx="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="226" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Tourist spending</text><rect x="135" y="290" width="200" height="56" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="324" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Locally owned hotel</text><line x1="235" y1="252" x2="235" y2="284" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="400" width="110" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="115" y="431" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Local farms</text><line x1="235" y1="350" x2="115" y2="396" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="180" y="400" width="110" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="235" y="431" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Builders</text><line x1="235" y1="350" x2="235" y2="396" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="300" y="400" width="110" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="355" y="431" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Shops</text><line x1="235" y1="350" x2="355" y2="396" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><path d="M115,455 Q115,500 235,500 Q355,500 355,455" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><text x="235" y="525" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">wages and spending circulate again</text><text x="235" y="556" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Multiplier effect: more money stays</text><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Foreign control</text><text x="665" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">resorts owned abroad, supplies imported</text><rect x="565" y="192" width="200" height="56" rx="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="226" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Tourist spending</text><rect x="565" y="290" width="200" height="56" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="324" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Foreign-owned resort</text><line x1="665" y1="252" x2="665" y2="284" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="665" y1="350" x2="665" y2="396" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="610" y="400" width="110" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="665" y="431" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Local wages</text><line x1="760" y1="318" x2="840" y2="318" stroke="#b5602e" stroke-width="8" marker-end="url(#ahR)"/><text x="855" y="282" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">profits</text><text x="855" y="300" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">abroad</text><line x1="760" y1="340" x2="830" y2="400" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="790" y="430" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">imported</text><text x="790" y="448" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">food and</text><text x="790" y="466" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">supplies</text><text x="665" y="556" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Leakage: much of the money leaves</text><rect x="30" y="600" width="840" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="646" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The balance of benefits depends on who controls tourism.</text>
</svg>