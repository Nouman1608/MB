<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 765" width="900" height="765" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="765" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why tourism has grown</text>

<rect x="30" y="115" width="410" height="260" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="149.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Attractions (pull factors)</text><text x="50" y="178" font-size="15.5" font-weight="700" fill="#8a6d0d" text-anchor="start">Physical landscape</text><text x="50" y="202" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">beaches and sunny climates; coral reefs;</text><text x="50" y="222" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">mountains and snow; volcanoes, waterfalls;</text><text x="50" y="242" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">national parks and wildlife</text><text x="50" y="292" font-size="15.5" font-weight="700" fill="#8a6d0d" text-anchor="start">Human landscape</text><text x="50" y="316" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">historic buildings, religious sites, museums;</text><text x="50" y="336" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">shopping and nightlife; festivals, theme</text><text x="50" y="356" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">parks; local culture and food</text><rect x="460" y="115" width="410" height="260" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="149.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Enabling factors</text><text x="480" y="180" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496" y="180" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Rising incomes, more paid holiday; a</text><text x="496" y="200" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">growing middle class</text><text x="480" y="230" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496" y="230" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Cheaper, faster air travel: budget</text><text x="496" y="250" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">airlines, long-haul jets</text><text x="480" y="280" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496" y="280" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Internet booking, price comparison, social</text><text x="496" y="300" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">media</text><text x="480" y="330" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496" y="330" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Governments build airports and resorts,</text><text x="496" y="350" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">ease visas</text><line x1="235" y1="380" x2="380" y2="462" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="665" y1="380" x2="520" y2="462" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="300" y="466" width="300" height="56" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="502" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Tourism grows</text><rect x="30" y="545" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="580" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Link the two in an “explain” answer</text><rect x="55" y="610" width="790" height="70" rx="6" fill="#dce9e7"/><rect x="55" y="666" width="790" height="40" fill="#efdfa8"/><rect x="55" y="706" width="790" height="12" fill="#b5d3cf"/><rect x="64" y="677.75" width="354" height="20.25" rx="5" fill="#efdfa8" opacity="1"/><text x="70" y="692" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">the beach: here for thousands of years</text><rect x="470" y="620" width="70" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="550" y="632" width="60" height="34" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="540" y="614" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">hotels</text><path d="M700,640 l40,-8 l10,-14 l6,0 l-4,14 l30,-6 l6,4 l-30,10 l-6,16 l-6,0 l2,-14 l-40,6 z" fill="#1e2a44"/><text x="760" y="614" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">airport, cheap flights</text><text x="450" y="735" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">… it became a major destination only once hotels, an airport and affordable flights arrived.</text>
</svg>