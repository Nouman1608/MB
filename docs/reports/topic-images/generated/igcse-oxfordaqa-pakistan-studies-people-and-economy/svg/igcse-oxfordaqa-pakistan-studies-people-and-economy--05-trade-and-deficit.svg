<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 726" width="900" height="726" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="726" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What Pakistan trades, and how the gap is filled</text>

<rect x="30" y="112" width="410" height="180" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Exports</text><text x="48" y="173.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Textiles and clothing (largest)</text><text x="48" y="197.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="197.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rice</text><text x="48" y="221.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="221.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Leather goods</text><text x="48" y="245.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sports goods, surgical instruments</text><text x="48" y="269.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="269.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fruit and fish</text><rect x="460" y="112" width="410" height="180" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Imports</text><text x="478" y="173.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Petroleum and LNG</text><text x="478" y="197.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="197.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Machinery</text><text x="478" y="221.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="221.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Chemicals</text><text x="478" y="245.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="245.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Palm oil</text><text x="478" y="269.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="269.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Iron and steel; vehicles</text><text x="30" y="320" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">THE BALANCE (bar lengths schematic)</text><rect x="30" y="332" width="420" height="44" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="42" y="361" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">export earnings</text><rect x="450" y="332" width="180" height="44" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="7 5"/><text x="540" y="361" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">remittances</text><rect x="30" y="388" width="640" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="42" y="417" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">import bill</text><text x="690" y="362" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">trade deficit, which</text><text x="690" y="383" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">remittances help</text><text x="690" y="404" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">to cover</text><text x="30" y="470" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">KEY PARTNERS</text><rect x="30" y="482" width="197" height="119" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="512.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">China</text><text x="48" y="538.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Largest source of</text><text x="48" y="558.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">imports</text><rect x="244.3" y="482" width="197" height="119" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262.3" y="512.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">USA</text><text x="262.3" y="538.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Major export market</text><rect x="458.6" y="482" width="197" height="119" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476.6" y="512.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">UAE and Saudi</text><text x="476.6" y="534.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Arabia</text><text x="476.6" y="560.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Oil and jobs</text><rect x="672.9000000000001" y="482" width="197" height="119" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="690.9000000000001" y="512.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">UK and EU</text><text x="690.9000000000001" y="538.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">EU GSP+ gives many</text><text x="690.9000000000001" y="558.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">goods tariff-free</text><text x="690.9000000000001" y="578.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">access</text><rect x="30" y="621" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="651.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Also: a free-trade agreement with China; membership of ECO, SAARC and the WTO. Trade is</text><text x="48" y="673.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">affected by world prices, energy costs, exchange rates, quality standards and political relations.</text>
</svg>