<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 731" width="900" height="731" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="731" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Migration within and from Pakistan</text>

<rect x="30" y="112" width="250" height="250" rx="12" fill="#e3ecd6" stroke="#6f9a52" stroke-width="2.5"/><rect x="620" y="112" width="250" height="250" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="155" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Village</text><text x="745" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">City</text><text x="46" y="184" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">PUSH</text><text x="46" y="212" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Low farm incomes</text><text x="46" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Small holdings</text><text x="46" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Mechanisation</text><text x="46" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Floods</text><text x="46" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Poor services</text><text x="636" y="184" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">PULL</text><text x="636" y="212" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Jobs in factories,</text><text x="636" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">   construction, services</text><text x="636" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Better schools and</text><text x="636" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">   hospitals</text><line x1="290" y1="222" x2="610" y2="222" stroke="#8a6d0d" stroke-width="9" marker-end="url(#ahO)"/><text x="450" y="206" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">rural to urban</text><text x="450" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">villages lose young workers;</text><text x="450" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">cities grow informal settlements</text><text x="30" y="392" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="start">INTERNATIONAL MIGRATION</text><rect x="30" y="406" width="410" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="439" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Out of Pakistan</text><text x="48" y="467.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="467.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Millions working in the Gulf states, especially</text><text x="64" y="488.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Saudi Arabia and the UAE</text><text x="48" y="512.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="512.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Communities in the UK, Europe and North</text><text x="64" y="533.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">America</text><rect x="460" y="406" width="410" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="439" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Into Pakistan</text><text x="478" y="467.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="467.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large numbers of Afghan refugees since 1979</text><rect x="30" y="572" width="410" height="129" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="605" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gains</text><text x="48" y="633.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="633.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Remittances support families and the balance</text><text x="64" y="654.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of payments</text><text x="48" y="678.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="678.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diaspora spreads Pakistani culture abroad</text><rect x="460" y="572" width="410" height="129" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="605" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Losses</text><text x="478" y="633.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="633.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Brain drain: skilled workers such as doctors and</text><text x="494" y="654.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">engineers leave</text>
</svg>