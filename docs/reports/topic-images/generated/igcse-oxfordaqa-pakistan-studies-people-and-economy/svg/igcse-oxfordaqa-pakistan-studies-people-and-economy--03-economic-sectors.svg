<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 532" width="900" height="532" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="532" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Pakistan’s economy has changed</text>

<rect x="30" y="112" width="840" height="50" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="144" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">At independence: overwhelmingly agricultural, with little industry</text><line x1="450" y1="166" x2="450" y2="196" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="204" width="197" height="225" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="236.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Primary</text><text x="48" y="263.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Share of GDP has</text><text x="48" y="283.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">fallen steadily, but still</text><text x="48" y="303.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">employs more than a</text><text x="48" y="323.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">third of workers</text><text x="48" y="346.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Where: Irrigated plains</text><text x="48" y="366.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of Punjab and Sindh:</text><text x="48" y="386.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">wheat, cotton, rice,</text><text x="48" y="406.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sugar cane</text><rect x="244.3" y="204" width="197" height="225" rx="12" fill="#efdfa8" stroke="#8a6d0d" stroke-width="2.5"/><text x="262.3" y="236.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary</text><text x="262.3" y="263.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Grew from the 1950s,</text><text x="262.3" y="283.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">led by cotton textiles,</text><text x="262.3" y="303.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">then cement, fertiliser,</text><text x="262.3" y="323.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sugar, steel, cars and</text><text x="262.3" y="343.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pharmaceuticals</text><text x="262.3" y="366.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Where: Karachi,</text><text x="262.3" y="386.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Lahore, Faisalabad,</text><text x="262.3" y="406.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sialkot</text><rect x="458.6" y="204" width="197" height="225" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476.6" y="236.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Tertiary</text><text x="476.6" y="263.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Now produces the</text><text x="476.6" y="283.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">largest share of GDP:</text><text x="476.6" y="303.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">retail, transport,</text><text x="476.6" y="323.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">banking, telecoms,</text><text x="476.6" y="343.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">health, education,</text><text x="476.6" y="363.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">government</text><text x="476.6" y="386.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Where: Throughout,</text><text x="476.6" y="406.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">especially cities</text><rect x="672.9000000000001" y="204" width="197" height="225" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="690.9000000000001" y="236.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Quaternary</text><text x="690.9000000000001" y="263.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Software, IT</text><text x="690.9000000000001" y="283.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">outsourcing and</text><text x="690.9000000000001" y="303.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">research: growing</text><text x="690.9000000000001" y="326.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Where: Lahore,</text><text x="690.9000000000001" y="346.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Karachi, Islamabad:</text><text x="690.9000000000001" y="366.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">skilled graduates, fast</text><text x="690.9000000000001" y="386.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">internet, investment</text><rect x="30" y="449" width="840" height="53" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="479.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Textiles remain the largest manufacturing employer and exporter.</text>
</svg>