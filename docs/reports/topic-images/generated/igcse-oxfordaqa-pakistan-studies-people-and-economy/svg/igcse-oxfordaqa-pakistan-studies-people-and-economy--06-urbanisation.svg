<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 571" width="900" height="571" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="571" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Urbanisation: opportunities, challenges, strategies</text>

<rect x="30" y="112" width="840" height="334" rx="12" fill="#ffffff"/><path d="M30,156 L30,124 Q30,112 42,112 L858,112 Q870,112 870,124 L870,156 Z" fill="#b5d3cf"/><rect x="30" y="156" width="840" height="62" fill="#ffffff"/><text x="42" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jobs in industry and services</text><text x="322" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not enough formal jobs, so many</text><text x="322" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work informally</text><text x="602" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low-cost housing schemes</text><line x1="30" y1="156" x2="870" y2="156" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="218" width="840" height="83" fill="#dce9e7"/><text x="42" y="243.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Universities and schools</text><text x="322" y="243.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shortage of affordable housing;</text><text x="322" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">growth of katchi abadis</text><text x="602" y="243.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Upgrading informal settlements</text><text x="602" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with water and sanitation, e.g. the</text><text x="602" y="285.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Orangi Pilot Project, Karachi</text><line x1="30" y1="218" x2="870" y2="218" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="301" width="840" height="62" fill="#ffffff"/><text x="42" y="326.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Innovation hubs and start-ups</text><text x="322" y="326.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Traffic congestion</text><text x="602" y="326.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mass transit such as bus rapid</text><text x="602" y="347.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transit</text><line x1="30" y1="301" x2="870" y2="301" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="363" width="840" height="83" fill="#dce9e7"/><text x="42" y="388.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Investment and infrastructure,</text><text x="42" y="409.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. Lahore’s Orange Line metro</text><text x="322" y="388.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Air pollution and winter smog;</text><text x="322" y="409.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">untreated sewage and waste</text><text x="602" y="388.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tree planting; controls on brick</text><text x="602" y="409.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kilns and crop burning to reduce</text><text x="602" y="430.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">smog</text><line x1="30" y1="363" x2="870" y2="363" stroke="#c9d6d4" stroke-width="1.5"/><line x1="310" y1="112" x2="310" y2="446" stroke="#c9d6d4" stroke-width="1.5"/><line x1="590" y1="112" x2="590" y2="446" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Opportunities</text><text x="322" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Challenges</text><text x="602" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strategies</text><rect x="30" y="112" width="840" height="334" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="466" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="496.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Around two-fifths of Pakistanis live in urban areas, and the share is rising. Karachi and Lahore are</text><text x="48" y="518.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">megacities, growing by rural–urban migration and natural increase.</text>
</svg>