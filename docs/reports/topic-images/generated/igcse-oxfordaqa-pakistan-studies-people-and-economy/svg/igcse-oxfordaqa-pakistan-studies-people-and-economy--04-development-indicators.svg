<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring development: what each indicator misses</text>

<rect x="30" y="112" width="840" height="333" rx="12" fill="#ffffff"/><path d="M30,156 L30,124 Q30,112 42,112 L858,112 Q870,112 870,124 L870,156 Z" fill="#b5d3cf"/><rect x="30" y="156" width="840" height="62" fill="#ffffff"/><text x="42" y="181.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">GDP</text><text x="202" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Total value of goods and services</text><text x="202" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">produced in a year</text><text x="542" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores inequality and the informal</text><text x="542" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">economy</text><line x1="30" y1="156" x2="870" y2="156" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="218" width="840" height="62" fill="#dce9e7"/><text x="42" y="243.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">GDP per capita</text><text x="202" y="243.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Average output per person</text><text x="542" y="243.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hides gaps between rich and poor, urban</text><text x="542" y="264.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and rural</text><line x1="30" y1="218" x2="870" y2="218" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="280" width="840" height="62" fill="#f2e7b8"/><text x="42" y="305.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">HDI</text><text x="202" y="305.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Combines life expectancy, education and</text><text x="202" y="326.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">income</text><text x="542" y="305.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Does not show regional differences</text><line x1="30" y1="280" x2="870" y2="280" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="342" width="840" height="62" fill="#dce9e7"/><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">FDI</text><text x="202" y="367.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Investment by foreign companies, e.g.</text><text x="202" y="388.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through CPEC</text><text x="542" y="367.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can create debt or send profits abroad</text><line x1="30" y1="342" x2="870" y2="342" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="404" width="840" height="41" fill="#ffffff"/><text x="42" y="429.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Trade</text><text x="202" y="429.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Value of exports and imports</text><text x="542" y="429.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Swings with global prices</text><line x1="30" y1="404" x2="870" y2="404" stroke="#c9d6d4" stroke-width="1.5"/><line x1="190" y1="112" x2="190" y2="445" stroke="#c9d6d4" stroke-width="1.5"/><line x1="530" y1="112" x2="530" y2="445" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Indicator</text><text x="202" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it shows</text><text x="542" y="141.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="30" y="112" width="840" height="333" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="465" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="495.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The UN Development Programme places Pakistan among countries with lower human development,</text><text x="48" y="517.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reflecting low adult literacy and high child mortality as well as income.</text>
</svg>