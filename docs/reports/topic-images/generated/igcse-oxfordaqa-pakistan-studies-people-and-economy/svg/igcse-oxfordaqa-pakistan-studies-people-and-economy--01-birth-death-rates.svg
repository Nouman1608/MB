<rect width="900" height="738" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Pakistan’s population grew so fast</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">shape of the trend only, not real data</text>
<rect x="30" y="112" width="840" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="470" x2="830" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="140" x2="110" y2="470" stroke="#1e2a44" stroke-width="3"/><text transform="translate(88,310) rotate(-90)" font-size="16" fill="#4a5568" text-anchor="middle">rate (schematic)</text><text x="110" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">independence</text><text x="830" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">today</text><path d="M110,175 C350,175 520,200 830,365 L830,440 C320,430 220,400 110,300 Z" fill="#f2e7b8" opacity="0.9"/><path d="M110,175 C350,175 520,200 830,365" fill="none" stroke="#8a6d0d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M110,300 C220,400 320,430 830,440" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="130" y="160" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">birth rate: fell much more slowly</text><text x="180" y="318" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">death rate: fell sharply</text><text x="580" y="330" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">natural increase</text><text x="580" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">(the gap): narrowing but still high</text><rect x="30" y="552" width="410" height="156" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="585" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why deaths fell</text><text x="48" y="613.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="613.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Vaccination</text><text x="48" y="637.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="637.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Antibiotics</text><text x="48" y="661.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="661.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cleaner water</text><text x="48" y="685.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="685.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Better food supply</text><rect x="460" y="552" width="410" height="156" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="585" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why the gap is narrowing</text><text x="478" y="613.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="613.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More girls stay in school</text><text x="478" y="637.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="637.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Marriage age rises</text><text x="478" y="661.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="661.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family planning spreads</text>
</svg>