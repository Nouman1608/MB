<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Did the revolutions have anything in common?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Five shared features, two key differences</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="325" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="323.07692307692304" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Common feature</text><rect x="353.07692307692304" y="124" width="516.9230769230769" height="48" fill="#b5d3cf"/><text x="367.07692307692304" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Example</text><rect x="30" y="172" width="323.07692307692304" height="68" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Liberal demands</text><rect x="353.07692307692304" y="172" width="516.9230769230769" height="68" fill="#ffffff"/><text x="367.07692307692304" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Piedmont's Statuto; Frankfurt's Basic Rights; Vienna's promised</text><text x="367.07692307692304" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">constitution</text><line x1="30" y1="240" x2="870" y2="240" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="240" width="323.07692307692304" height="47" fill="#dce9e7"/><text x="44" y="266.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Nationalist aims</text><rect x="353.07692307692304" y="240" width="516.9230769230769" height="47" fill="#f8faf9"/><text x="367.07692307692304" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Italian war on Austria; German unification; Hungarian self-rule</text><line x1="30" y1="287" x2="870" y2="287" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="287" width="323.07692307692304" height="47" fill="#dce9e7"/><text x="44" y="313.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Economic trigger</text><rect x="353.07692307692304" y="287" width="516.9230769230769" height="47" fill="#ffffff"/><text x="367.07692307692304" y="313.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unemployed workers in Paris, Vienna and Berlin</text><line x1="30" y1="334" x2="870" y2="334" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="334" width="323.07692307692304" height="47" fill="#dce9e7"/><text x="44" y="360.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Urban, middle-class leaders</text><rect x="353.07692307692304" y="334" width="516.9230769230769" height="47" fill="#f8faf9"/><text x="367.07692307692304" y="360.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lawyers, students and journalists in every capital</text><line x1="30" y1="381" x2="870" y2="381" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="381" width="323.07692307692304" height="68" fill="#dce9e7"/><text x="44" y="407.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Success, then collapse</text><rect x="353.07692307692304" y="381" width="516.9230769230769" height="68" fill="#ffffff"/><text x="367.07692307692304" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Within about 18 months: every case except Piedmont's</text><text x="367.07692307692304" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">constitution</text></g><line x1="353.07692307692304" y1="124" x2="353.07692307692304" y2="449" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="325" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="471" width="411" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="503" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DIFFERENCE</text><text x="50" y="529.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">France</text><text x="50" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Already a nation: about who governed, not</text><text x="50" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">borders</text><rect x="459" y="471" width="411" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="503" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DIFFERENCE</text><text x="479" y="529.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Austrian Empire</text><text x="479" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nationalism split the revolution: Hungarians,</text><text x="479" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Czechs, Croats, Germans</text>
</svg>