<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" width="900" height="505" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="505" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why did most of the revolutions fail?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Six reasons; the armies were decisive</text>
<line x1="320" y1="174" x2="410" y2="261.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="298.5" x2="410" y2="298.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="423" x2="410" y2="335.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="184.5" x2="490" y2="264.3" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="298.5" x2="490" y2="298.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="412.5" x2="490" y2="332.7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="298.5" r="80" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="282.84000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Most</text><text x="450" y="304.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">revolutions</text><text x="450" y="326.76000000000005" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">fail</text><rect x="30" y="124" width="290" height="100" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rulers kept their armies</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Radetzky, Windischgrätz, the</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prussian army</text><rect x="30" y="238" width="290" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="268.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Revolutionaries divided</text><text x="46" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Liberals against radicals; after the</text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">June Days the middle class</text><text x="46" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feared workers</text><rect x="30" y="373" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="403.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nationalities clashed</text><text x="46" y="431.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Croats fought Hungary; Czechs</text><text x="46" y="452.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">refused Frankfurt</text><rect x="580" y="134.5" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="164.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peasants lost interest</text><text x="596" y="193.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Once labour services were</text><text x="596" y="214.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">abolished</text><rect x="580" y="248.5" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="278.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Foreign intervention</text><text x="596" y="307.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Russia crushed Hungary; France</text><text x="596" y="328.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">restored the Pope</text><rect x="580" y="362.5" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="392.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Weak leadership</text><text x="596" y="421.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Frankfurt debated with no means</text><text x="596" y="442.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of enforcement</text>
</svg>