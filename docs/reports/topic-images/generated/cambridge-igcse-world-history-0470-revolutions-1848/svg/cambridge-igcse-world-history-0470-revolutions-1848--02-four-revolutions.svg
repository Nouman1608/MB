<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four revolutions, January 1848 to August 1849</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale by month: rising and defeat in each case study</text>
<line x1="190" y1="148" x2="190" y2="586" stroke="#c9d6d4" stroke-width="1.5"/><text x="190" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Jan 1848</text><line x1="288.9999999999955" y1="148" x2="288.9999999999955" y2="586" stroke="#c9d6d4" stroke-width="1.5"/><text x="288.9999999999955" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Apr</text><line x1="387.999999999991" y1="148" x2="387.999999999991" y2="586" stroke="#c9d6d4" stroke-width="1.5"/><text x="387.999999999991" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Jul</text><line x1="486.99999999998647" y1="148" x2="486.99999999998647" y2="586" stroke="#c9d6d4" stroke-width="1.5"/><text x="486.99999999998647" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Oct</text><line x1="585.999999999982" y1="148" x2="585.999999999982" y2="586" stroke="#c9d6d4" stroke-width="1.5"/><text x="585.999999999982" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Jan 1849</text><line x1="684.9999999999775" y1="148" x2="684.9999999999775" y2="586" stroke="#c9d6d4" stroke-width="1.5"/><text x="684.9999999999775" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Apr</text><line x1="783.9999999999729" y1="148" x2="783.9999999999729" y2="586" stroke="#c9d6d4" stroke-width="1.5"/><text x="783.9999999999729" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">Jul</text><rect x="30" y="158" width="840" height="98" rx="12" fill="#ffffff" fill-opacity="0.6" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">France</text><line x1="247.88524590167265" y1="208" x2="568.1475409836203" y2="208" stroke="#1e2a44" stroke-width="3"/><text x="239.88524590167265" y="192" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Feb: king abdicates</text><circle cx="247.88524590167265" cy="208" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="370.14754098362937" y="238" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">June Days</text><circle cx="370.14754098362937" cy="208" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="568.1475409836203" y="192" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Dec: Louis Napoleon elected</text><circle cx="568.1475409836203" cy="208" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="266" width="840" height="98" rx="12" fill="#ffffff" fill-opacity="0.6" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="322" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Italy</text><line x1="205.14754098360686" y1="316" x2="832.1475409835483" y2="316" stroke="#1e2a44" stroke-width="3"/><text x="197.14754098360686" y="300" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Palermo</text><circle cx="205.14754098360686" cy="316" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="271.14754098363386" y="346" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Milan's Five Days</text><circle cx="271.14754098363386" cy="316" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="403.1475409835979" y="300" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Custoza</text><circle cx="403.1475409835979" cy="316" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="667.1475409836158" y="346" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Novara</text><circle cx="667.1475409836158" cy="316" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="864" y="300" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">Venice surrenders</text><circle cx="832.1475409835483" cy="316" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="374" width="840" height="98" rx="12" fill="#ffffff" fill-opacity="0.6" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="430" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Germany</text><line x1="271.14754098363386" y1="424" x2="700.1475409835843" y2="424" stroke="#1e2a44" stroke-width="3"/><text x="271.14754098363386" y="408" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Berlin rising</text><circle cx="271.14754098363386" cy="424" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="337.1475409835708" y="454" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Frankfurt meets</text><circle cx="337.1475409835708" cy="424" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="700.1475409835843" y="408" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">Crown refused</text><circle cx="700.1475409835843" cy="424" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="482" width="840" height="98" rx="12" fill="#ffffff" fill-opacity="0.6" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="538" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Austrian Empire</text><line x1="271.14754098363386" y1="532" x2="832.1475409835483" y2="532" stroke="#1e2a44" stroke-width="3"/><text x="271.14754098363386" y="516" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Metternich falls</text><circle cx="271.14754098363386" cy="532" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="370.14754098362937" y="562" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Prague bombarded</text><circle cx="370.14754098362937" cy="532" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="502.14754098359333" y="516" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Vienna retaken</text><circle cx="502.14754098359333" cy="532" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="864" y="562" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">Hungary crushed</text><circle cx="832.1475409835483" cy="532" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="612" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="646.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Palermo first</text><text x="450" y="676.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The first rising was in Sicily in January 1848, before Paris. Red dots mark defeat: Italy, Germany</text><text x="450" y="698.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and Hungary.</text>
