<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" width="900" height="643" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why 1848? Ideas met an economic crisis</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Long-term ideas plus a short-term trigger</text>
<rect x="30" y="124" width="411" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIBERALISM</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Constitutions and parliaments</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Press freedom, equality before the law; the</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">educated middle class</text><rect x="459" y="124" width="411" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONALISM</text><text x="479" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Self-government by nation</text><text x="479" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unification for Germans and Italians; self-rule for</text><text x="479" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hungarians, Czechs</text><rect x="30" y="278" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="310" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HELD DOWN BY METTERNICH'S SYSTEM</text><text x="50" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Congress of Vienna (1815); Carlsbad Decrees (1819); Austrian troops in Italy (1821, 1831)</text><text x="450" y="404" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">The economic trigger</text><rect x="30" y="428" width="187.5" height="183" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="123.75" y="509" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FROM 1845</text><text x="123.75" y="536.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Potato blight</text><line x1="223.5" y1="519.5" x2="241.5" y2="519.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247.5" y="428" width="187.5" height="183" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341.25" y="496.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1846</text><text x="341.25" y="524.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Poor grain</text><text x="341.25" y="549.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">harvests</text><line x1="441" y1="519.5" x2="459" y2="519.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="428" width="187.5" height="183" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="558.75" y="496.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1847</text><text x="558.75" y="524.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Commercial</text><text x="558.75" y="549.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">slump</text><line x1="658.5" y1="519.5" x2="676.5" y2="519.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="682.5" y="428" width="187.5" height="183" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="776.25" y="460" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1848</text><text x="776.25" y="487.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Dear bread,</text><text x="776.25" y="512.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">unemployment</text><text x="776.25" y="542.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Towns crowded</text><text x="776.25" y="564.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">with threatened</text><text x="776.25" y="586.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">artisans</text>
</svg>