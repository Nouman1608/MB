<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Failed because they were divided?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A judgement that links two factors</text>
<rect x="30" y="124" width="390" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATED FACTOR</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Division</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">National Workshops closed; June Days; the</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">middle class backed the army; the republic</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">turned to Louis Napoleon</text><rect x="480" y="124" width="390" height="154" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="500" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OTHER FACTOR</text><text x="500" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Force</text><text x="500" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Windischgrätz retook Vienna (October 1848);</text><text x="500" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Russia crushed Hungary (1849); no</text><text x="500" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">revolutionary army to match</text><line x1="235" y1="286" x2="380" y2="322" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="665" y1="286" x2="520" y2="322" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="120" y="346" width="660" height="106" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="378" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">JUDGEMENT</text><text x="450" y="404.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Armies decided; division explains why there was little resistance</text><text x="450" y="427.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">when the troops returned</text><rect x="30" y="474" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="508.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why it scores well</text><text x="450" y="538.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">It does more than say "both mattered": it explains how one factor made the other effective.</text>
</svg>