<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a scene as performance</text>

<rect x="30" y="98" width="480" height="542" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><g transform="translate(0,70)"><text x="54" y="138" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan font-style="italic" fill="#4a5568">A kitchen. Evening. MARA sets three </tspan><tspan font-style="italic" fill="#b5602e" font-weight="700">plates</tspan></text><text x="54" y="178" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan font-style="italic" fill="#4a5568">on the table. DANIEL enters, still wearing his coat.</tspan></text><text x="54" y="236" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan font-weight="700">DANIEL: </tspan><tspan>You’ve laid a place for him.</tspan></text><text x="54" y="276" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan font-weight="700">MARA: </tspan><tspan>He might come.</tspan></text><text x="54" y="316" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan font-weight="700">DANIEL: </tspan><tspan font-style="italic" fill="#4a5568">(He takes off his coat </tspan><tspan font-style="italic" fill="#b5602e" font-weight="700">slowly</tspan><tspan font-style="italic" fill="#4a5568">,</tspan></text><text x="54" y="356" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan font-style="italic" fill="#4a5568">but does not hang it up.) </tspan><tspan>He won’t.</tspan></text><text x="54" y="414" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan font-style="italic" fill="#b5602e" font-weight="700">Pause</tspan><tspan font-style="italic" fill="#4a5568">. MARA </tspan><tspan font-style="italic" fill="#b5602e" font-weight="700">straightens the third fork</tspan><tspan font-style="italic" fill="#4a5568">.</tspan></text><text x="54" y="472" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan font-weight="700">MARA: </tspan><tspan fill="#b5602e" font-weight="700">Then it costs nothing to be ready.</tspan></text><circle cx="490" cy="132" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="137" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="490" cy="310" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="315" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="462" cy="408" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="462" y="413" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="490" cy="408" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="413" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="490" cy="466" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="471" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text></g><rect x="530" y="98" width="340" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="542" y="123" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">1 · PROP</text><text x="542" y="152" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The third plate: the absent person</text><text x="542" y="172" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dominates the stage before anyone</text><text x="542" y="192" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">speaks.</text><rect x="530" y="216" width="340" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="542" y="241" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">2 · STAGE DIRECTION</text><text x="542" y="270" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The coat, removed “slowly” but not hung</text><text x="542" y="290" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">up: arrived, but not prepared to stay in</text><text x="542" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">this conversation.</text><rect x="530" y="334" width="340" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="542" y="359" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">3 · PAUSE</text><text x="542" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Gives the audience time to feel the</text><text x="542" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">weight of “He won’t”.</text><rect x="530" y="432" width="340" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="542" y="457" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">4 · ACTION, NOT ARGUMENT</text><text x="542" y="486" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Straightening the fork: her hope</text><text x="542" y="506" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">survives as quiet ritual.</text><rect x="530" y="530" width="340" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="542" y="555" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">5 · FINAL LINE</text><text x="542" y="584" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sounds practical, but the audience hears</text><text x="542" y="604" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a refusal to give up: the tension stays</text><text x="542" y="624" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">unresolved.</text><text x="30" y="666" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Invented practice scene, not from any set text.</text>
</svg>