<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 870" width="900" height="870" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="870" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The playwright’s toolkit</text>

<text x="30" y="132" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">What the audience sees</text><rect x="30" y="146" width="250" height="60" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="42" y="180.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Stage directions</text><rect x="292" y="146" width="320" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="304" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">movement, gesture, tone, lighting,</text><text x="304" y="190" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sound, set</text><rect x="650" y="146" width="220" height="60" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="662" y="170" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">shows what the audience</text><text x="662" y="190" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">should see or feel</text><line x1="614" y1="176" x2="646" y2="176" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="214" width="250" height="60" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="42" y="248.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Props and set</text><rect x="292" y="214" width="320" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="304" y="248" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">objects given repeated attention</text><rect x="650" y="214" width="220" height="60" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="662" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">symbols the audience can</text><text x="662" y="258" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">see</text><line x1="614" y1="244" x2="646" y2="244" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="282" width="250" height="60" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="42" y="316.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Entrances and exits</text><rect x="292" y="282" width="320" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="304" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">who arrives or leaves, and when</text><rect x="650" y="282" width="220" height="60" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="662" y="306" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">interrupts, shifts power,</text><text x="662" y="326" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ends a scene sharply</text><line x1="614" y1="312" x2="646" y2="312" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="30" y="380" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">What the audience hears</text><rect x="30" y="394" width="250" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="42" y="428.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dialogue</text><rect x="292" y="394" width="320" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="304" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">who speaks most, interrupts, is</text><text x="304" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">silenced</text><rect x="650" y="394" width="220" height="60" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="662" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reveals power and</text><text x="662" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">relationships</text><line x1="614" y1="424" x2="646" y2="424" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="462" width="250" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="42" y="496.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soliloquy and aside</text><rect x="292" y="462" width="320" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="304" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">alone, or to the audience only</text><rect x="650" y="462" width="220" height="60" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="662" y="486" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">private thoughts;</text><text x="662" y="506" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">complicity</text><line x1="614" y1="492" x2="646" y2="492" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="530" width="250" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="42" y="564.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Verse and prose</text><rect x="292" y="530" width="320" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="304" y="564" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">changes in form of speech, where used</text><rect x="650" y="530" width="220" height="60" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="662" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">status, emotion, loss of</text><text x="662" y="574" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">control</text><line x1="614" y1="560" x2="646" y2="560" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="30" y="628" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">What the audience knows, and when</text><rect x="30" y="642" width="250" height="60" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="42" y="676.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dramatic irony</text><rect x="292" y="642" width="320" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="304" y="666" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the audience knows what a character</text><text x="304" y="686" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">does not</text><rect x="650" y="642" width="220" height="60" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="662" y="666" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">tension, sympathy or</text><text x="662" y="686" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dread</text><line x1="614" y1="672" x2="646" y2="672" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="710" width="250" height="60" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="42" y="744.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><rect x="292" y="710" width="320" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="304" y="734" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">acts, scenes, climax, resolution, time</text><text x="304" y="754" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">gaps</text><rect x="650" y="710" width="220" height="60" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="662" y="734" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">build-up and release of</text><text x="662" y="754" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">tension</text><line x1="614" y1="740" x2="646" y2="740" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="452" y="110" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">look for</text><text x="760" y="110" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">typical effect</text><rect x="30" y="788" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="821.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not every play uses every method. Choose the ones your set play relies on most.</text>
</svg>