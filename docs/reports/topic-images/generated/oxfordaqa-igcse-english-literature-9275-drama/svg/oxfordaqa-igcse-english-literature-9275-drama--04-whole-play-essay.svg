<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 877" width="900" height="877" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="877" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building an essay on the whole play</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How is a parent–child relationship presented?</text>
<line x1="62" y1="160" x2="62" y2="663" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="140" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="175.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Argument</text><text x="128" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What the play suggests about the relationship, for example that love is real but</text><text x="128" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expressed through control.</text><circle cx="62" cy="194.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="203.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="259" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="294.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">First appearance</text><text x="128" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How it is introduced on stage: who speaks first and who holds the stage.</text><circle cx="62" cy="303" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="311.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="357" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="392.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Turning point or climax</text><text x="128" y="420.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A moment of confrontation, with attention to staging as well as dialogue.</text><circle cx="62" cy="401" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="409.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="455" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="490.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ending</text><text x="128" y="518.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Where the relationship stands in the final scene; how the closing image or exit leaves</text><text x="128" y="539.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the audience feeling.</text><circle cx="62" cy="509.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="518.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="574" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="609.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><text x="128" y="637.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One precise link to the attitudes of the play’s time or setting, used to explain a</text><text x="128" y="658.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">choice the playwright makes.</text><circle cx="62" cy="628.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="637.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="701" width="397" height="152" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="228.5" y="767" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FOR EACH POINT</text><text x="228.5" y="794" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">One quotation</text><line x1="433" y1="777" x2="467" y2="777" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="701" width="397" height="152" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="671.5" y="734" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PLUS</text><text x="671.5" y="761" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A staging note</text><text x="671.5" y="789" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">how it might be delivered, what the other</text><text x="671.5" y="809" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">character is doing, or what the stage</text><text x="671.5" y="829" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">directions require</text>
</svg>