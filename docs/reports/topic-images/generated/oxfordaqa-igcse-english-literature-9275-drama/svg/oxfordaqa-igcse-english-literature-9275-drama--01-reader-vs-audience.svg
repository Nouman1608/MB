<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 742" width="900" height="742" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="742" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Thinking like an audience</text>

<rect x="30" y="112" width="410" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A novel is read</text><text x="235" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">alone, at the reader’s own pace</text><path d="M183,308 L188,256 Q200,246 212,256 L217,308 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="200" cy="236" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M222,252 l40,-10 l0,34 l-40,10 z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M262,242 l40,10 l0,34 l-40,-10 z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="460" y="112" width="410" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A play is watched</text><text x="665" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">by an audience together, in real time</text><path d="M520,262 L810,262 L830,278 L500,278 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><path d="M607.25,264 L611,225 Q620,217.5 629,225 L632.75,264 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="620" cy="210" r="9.75" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M697.25,264 L701,225 Q710,217.5 719,225 L722.75,264 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="710" cy="210" r="9.75" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M505,318 a17,17 0 0 1 34,0 Z" fill="#4a5568"/><path d="M552,318 a17,17 0 0 1 34,0 Z" fill="#4a5568"/><path d="M599,318 a17,17 0 0 1 34,0 Z" fill="#4a5568"/><path d="M646,318 a17,17 0 0 1 34,0 Z" fill="#4a5568"/><path d="M693,318 a17,17 0 0 1 34,0 Z" fill="#4a5568"/><path d="M740,318 a17,17 0 0 1 34,0 Z" fill="#4a5568"/><path d="M787,318 a17,17 0 0 1 34,0 Z" fill="#4a5568"/><rect x="30" y="356" width="150" height="56" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="105" y="390" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Sees</text><rect x="190" y="356" width="680" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="204" y="388.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Characters who are silent, so reactions matter as much as speeches.</text><rect x="30" y="422" width="150" height="56" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="105" y="456" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Knows more</text><rect x="190" y="422" width="680" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="204" y="454.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The audience often knows more than a character: dramatic irony.</text><rect x="30" y="488" width="150" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="105" y="528" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Timing</text><rect x="190" y="488" width="680" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="204" y="515.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pace, pauses and interruptions are controlled by playwright and</text><text x="204" y="537.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">performers, shaping tension.</text><rect x="30" y="566" width="150" height="56" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="105" y="600" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">No narrator</text><rect x="190" y="566" width="680" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="204" y="598.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Motives must be inferred from speech and action.</text><rect x="30" y="638" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="671.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Write “the audience”, not “the reader”, and explain what an audience would experience at</text><text x="50" y="693.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">that moment.</text>
</svg>