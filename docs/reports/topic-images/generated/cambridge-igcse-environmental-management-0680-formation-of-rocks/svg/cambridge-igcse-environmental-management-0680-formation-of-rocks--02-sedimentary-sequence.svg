<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How sedimentary rock forms</text>

<rect x="30" y="110" width="160" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="160" width="120" height="80" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M90,160 l10,30 -8,20 M130,160 l-6,40" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="70" cy="252" r="7" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="150" cy="250" r="5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="56" cy="285" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="56" y="290.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="78" y="291" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Weathering</text><text x="44" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rock broken down</text><text x="44" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">in place</text><line x1="190" y1="200" x2="200.5" y2="200" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="200.5" y="110" width="160" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="210.5" y="190" width="140" height="50" rx="0" fill="#b5d3cf"/><circle cx="230.5" cy="210" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="260.5" cy="222" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="295.5" cy="210" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="325.5" cy="222" r="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><line x1="225.5" y1="174" x2="335.5" y2="174" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><circle cx="226.5" cy="285" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="226.5" y="290.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="248.5" y="291" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Erosion and</text><text x="248.5" y="311" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">transportation</text><text x="214.5" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fragments</text><text x="214.5" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">removed and</text><text x="214.5" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">carried away</text><line x1="360.5" y1="200" x2="371" y2="200" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="371" y="110" width="160" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="381" y="150" width="140" height="60" rx="0" fill="#b5d3cf"/><rect x="381" y="210" width="140" height="16" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.2"/><rect x="381" y="226" width="140" height="16" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.2"/><rect x="381" y="242" width="140" height="16" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.2"/><line x1="451" y1="160" x2="451" y2="202" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="397" cy="285" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="397" y="290.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="419" y="291" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Deposition</text><text x="419" y="311" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">and</text><text x="419" y="331" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">sedimentation</text><text x="385" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">dropped,</text><text x="385" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">building up in</text><text x="385" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">layers</text><line x1="531" y1="200" x2="541.5" y2="200" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="541.5" y="110" width="160" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="551.5" y="180" width="140" height="14" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.2"/><rect x="551.5" y="194" width="140" height="14" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.2"/><rect x="551.5" y="208" width="140" height="14" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.2"/><rect x="551.5" y="222" width="140" height="14" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.2"/><rect x="551.5" y="236" width="140" height="14" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.2"/><line x1="591.5" y1="144" x2="591.5" y2="174" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="651.5" y1="144" x2="651.5" y2="174" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="567.5" cy="285" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="567.5" y="290.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="589.5" y="291" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Compaction</text><text x="555.5" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">weight above</text><text x="555.5" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">squeezes out</text><text x="555.5" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">water</text><line x1="701.5" y1="200" x2="712" y2="200" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="712" y="110" width="160" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><clipPath id="gr15"><rect x="727" y="160" width="130" height="90" rx="10"/></clipPath><g clip-path="url(#gr15)"><rect x="727" y="160" width="130" height="90" fill="#8a6d0d"/><circle cx="727.9" cy="16