<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The rock cycle</text>

<rect x="330" y="110" width="240" height="80" rx="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140.82" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Magma or lava</text><text x="450" y="172.82" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">molten rock</text><rect x="40" y="300" width="220" height="80" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="330.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Igneous rock</text><text x="150" y="362.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">granite, basalt</text><rect x="640" y="300" width="220" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="750" y="330.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Metamorphic rock</text><text x="750" y="362.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">marble, slate</text><rect x="340" y="330" width="220" height="70" rx="12" fill="#efdfa8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="355.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sediment</text><text x="450" y="387.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">particles in layers</text><rect x="330" y="530" width="240" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="550.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sedimentary rock</text><text x="450" y="582.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">limestone, sandstone,</text><text x="450" y="602.82" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">shale</text><path d="M330,150 Q160,160 150,294" fill="none" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="200" y="190" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">crystallisation</text><path d="M750,296 Q740,160 576,150" fill="none" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="712" y="190" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">melting</text><line x1="264" y1="342" x2="334" y2="360" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="636" y1="342" x2="566" y2="360" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="270" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">weathering, erosion,</text><text x="450" y="292" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">transportation</text><line x1="450" y1="404" x2="450" y2="524" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="464" y="440" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">deposition, sedimentation,</text><text x="464" y="462" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">compaction, cementation</text><path d="M574,585 Q860,600 800,388" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="860" y="640" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">heat and pressure</text><text x="40" y="440" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Any rock at the surface can</text><text x="40" y="460" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">be weathered; any rock buried</text><text x="40" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">deeply can be changed by heat</text><text x="40" y="500" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and pressure.</text>
</svg>