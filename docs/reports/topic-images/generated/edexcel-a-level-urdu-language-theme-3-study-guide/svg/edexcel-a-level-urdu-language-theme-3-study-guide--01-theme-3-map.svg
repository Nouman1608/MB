<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Theme 3 at a glance</text>

<rect x="150" y="104" width="600" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="152" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ہجرت ترکِ وطن اور کثیر الثقافتی معاشرہ‏</text><text x="450" y="200" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Theme 3: Immigration and the multicultural society</text><line x1="60" y1="214" x2="60" y2="518" stroke="#1e2a44" stroke-width="3"/><line x1="60" y1="294" x2="92" y2="294" stroke="#1e2a44" stroke-width="3"/><rect x="96" y="246" width="774" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="286" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">3.1</text><text x="166" y="286" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Positive features of a</text><text x="166" y="309" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">diverse society</text><text x="850" y="304" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏ایک متنوع اور گوناگوں معاشرے کے مثبت پہلو‏</text><line x1="60" y1="406" x2="92" y2="406" stroke="#1e2a44" stroke-width="3"/><rect x="96" y="358" width="774" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="398" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">3.2</text><text x="166" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Attitudes towards</text><text x="166" y="421" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">immigration</text><text x="850" y="416" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہجرت کی جانب رجحانات و طرزِ فکر‏</text><line x1="60" y1="518" x2="92" y2="518" stroke="#1e2a44" stroke-width="3"/><rect x="96" y="470" width="774" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="116" y="510" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">3.3</text><text x="166" y="510" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Emigration from Pakistan</text><text x="166" y="552" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">research subject: based on Pakistan</text><text x="850" y="528" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏پاکستان سے ہجرت‏</text><text x="450" y="612" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Practise stating a position and acknowledging a different one</text>
