<rect width="900" height="614" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Discussing attitudes to immigration</text>

<rect x="30" y="110" width="410" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Welcoming and supportive</text><text x="52" y="182" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">migrants seen as contributors</text><text x="52" y="205" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and neighbours</text><rect x="460" y="110" width="410" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Worries and objections</text><text x="482" y="182" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">jobs, housing, public services,</text><text x="482" y="205" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">change in local identity</text><rect x="30" y="258" width="266" height="146" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Prejudice and</text><text x="48" y="311" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">discrimination</text><text x="278" y="358" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏تعصب‏</text><text x="278" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">prejudice</text><text x="48" y="358" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="start">‏امتیازی سلوک‏</text><text x="48" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">discrimination</text><rect x="317" y="258" width="266" height="146" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Integration and identity</text><text x="565" y="358" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏انضمام‏</text><text x="565" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">integration</text><text x="335" y="358" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="start">‏شناخت‏</text><text x="335" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">identity</text><rect x="604" y="258" width="266" height="146" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Role of media and</text><text x="622" y="311" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">politicians</text><text x="852" y="358" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏رجحان‏</text><text x="852" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">attitude, trend</text><rect x="110" y="424" width="760" height="46" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="447" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="453.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="132" y="454" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">State what each side says</text><rect x="110" y="482" width="760" height="46" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="505" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="511.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="132" y="512" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Give the reasons they offer</text><rect x="110" y="540" width="760" height="46" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="62" cy="563" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="569.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="132" y="570" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Say which you find more convincing, and why</text>
</svg>