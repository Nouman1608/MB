<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the model paragraph does</text>

<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Task: respond to the statement that migration makes a society richer</text><rect x="30" y="148" width="840" height="174" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="182" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="188.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="188" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Contribution</text><text x="846" y="188" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">masculine plural verb</text><text x="846" y="240" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہجرت کرنے والے لوگ نئے ملک میں اپنی زبان، کھانے اور تہوار‏</text><text x="846" y="290" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏بھی ساتھ لے جاتے ہیں۔‏</text><rect x="30" y="336" width="840" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="370" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="376.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="376" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Its result</text><text x="846" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">masculine singular verb</text><text x="846" y="428" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اس سے معاشرہ زیادہ رنگا رنگ بن جاتا ہے۔‏</text><rect x="30" y="474" width="840" height="174" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="64" cy="508" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="514.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="514" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Counter-view</text><text x="846" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">however ... because; dative of concern</text><text x="846" y="566" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏تاہم بعض لوگ اس تنوع کو شک کی نظر سے دیکھتے ہیں،‏</text><text x="846" y="616" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏کیونکہ انھیں اپنی نوکریوں اور اپنی شناخت کی فکر ہوتی ہے۔‏</text><rect x="30" y="662" width="840" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="696" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="702.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="96" y="702" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reasoned conclusion</text><text x="846" y="754" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرے خیال میں باہمی احترام اور مکالمے سے یہ خدشات کم ہو سکتے ہیں۔‏</text>
