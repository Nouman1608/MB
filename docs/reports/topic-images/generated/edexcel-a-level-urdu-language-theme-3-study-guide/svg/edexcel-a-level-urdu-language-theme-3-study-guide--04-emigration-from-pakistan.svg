<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 776" width="900" height="776" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="776" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Emigration from Pakistan</text>

<rect x="30" y="200" width="220" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="140" y="244" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan</text><text x="140" y="276" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">push factors</text><text x="140" y="302" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">limited jobs, lower wages,</text><text x="140" y="322" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">insecurity, further study</text><rect x="650" y="130" width="220" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="760" y="192" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Gulf region</text><rect x="650" y="310" width="220" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="760" y="358" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Europe and</text><text x="760" y="384" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">North America</text><text x="760" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">different patterns of</text><text x="760" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">work and settlement</text><line x1="254" y1="250" x2="644" y2="190" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><line x1="254" y1="300" x2="644" y2="360" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="330" y="196" width="240" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="222" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">pull factors</text><text x="450" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">higher pay, family links, services</text><path d="M760,424 C760,530 140,520 140,404" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 8" marker-end="url(#ahO)"/><rect x="330" y="480" width="240" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="520" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ترسیلاتِ زر‏</text><text x="450" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">remittances: money sent home</text><rect x="30" y="590" width="410" height="120" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="624" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Skilled emigration</text><text x="416" y="628" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ذہین افراد کا انخلا‏</text><text x="52" y="664" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">brain drain; can return or contact</text><text x="52" y="684" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">abroad offset it?</text><rect x="460" y="590" width="410" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="624" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Effects on families</text><text x="482" y="656" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">on families left behind and on</text><text x="482" y="676" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">communities abroad</text><text x="450" y="750" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Check each example against your sources; prepare points for and against</text>
</svg>