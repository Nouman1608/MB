<rect width="900" height="666" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Positive features of a diverse society</text>

<line x1="450" y1="300" x2="175" y2="175" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="300" x2="725" y2="175" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="300" x2="175" y2="425" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="300" x2="725" y2="425" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="300" r="92" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="298" font-family="Noto Nastaliq Urdu" font-size="34" font-weight="400" fill="#1e2a44" text-anchor="middle">‏تنوع‏</text><text x="450" y="340" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">diversity</text><rect x="35" y="119" width="280" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="175" y="153" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural variety</text><text x="175" y="183" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">languages, food, dress,</text><text x="175" y="204" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">music and festivals</text><rect x="585" y="119" width="280" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="725" y="153" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic contribution</text><text x="725" y="183" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">skills, enterprise, labour,</text><text x="725" y="204" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">new markets</text><rect x="35" y="369" width="280" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="175" y="403" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Learning and understanding</text><text x="175" y="433" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">contact can reduce prejudice</text><text x="175" y="454" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and widen knowledge</text><rect x="585" y="369" width="280" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="725" y="403" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shared citizenship</text><text x="725" y="433" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">common values with</text><text x="725" y="454" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">respect for difference</text><text x="54" y="524" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Key words</text><rect x="30" y="540" width="140" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="100" y="586" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏کثیر الثقافتی‏</text><text x="100" y="624" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">multicultural</text><rect x="176" y="540" width="110" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="231" y="586" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏رواداری‏</text><text x="231" y="624" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tolerance</text><rect x="292" y="540" width="140" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="362" y="586" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏باہمی احترام‏</text><text x="362" y="624" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mutual respect</text><rect x="438" y="540" width="100" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="488" y="586" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ثقافت‏</text><text x="488" y="624" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">culture</text><rect x="544" y="540" width="100" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="594" y="586" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏زبان‏</text><text x="594" y="624" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">language</text><rect x="650" y="540" width="100" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="700" y="586" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏تہوار‏</text><text x="700" y="624" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">festival</text><rect x="756" y="540" width="110" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="811" y="586" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏شہریت‏</text><text x="811" y="624" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">citizenship</text>
</svg>