<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The current course and its successor</text>

<rect x="30" y="112" width="400" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="141" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Exams up to 2027</text><text x="230" y="165" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">first assessed 2017</text><rect x="470" y="112" width="400" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="670" y="141" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">From May 2028</text><text x="670" y="165" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">first teaching August 2026</text><rect x="30" y="196" width="400" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="226" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prescribed subject</text><text x="50" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1 of 5 · 40 h · Paper 1</text><rect x="470" y="196" width="400" height="70" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="226" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Focused study</text><text x="490" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1 of 5 · 50 h · source-based Paper 1</text><line x1="434" y1="231" x2="464" y2="231" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="30" y="278" width="400" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">World history topics</text><text x="50" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">2 of 12 · 90 h · Paper 2</text><rect x="470" y="278" width="400" height="70" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Thematic study</text><text x="490" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1 of 4 · 80 h · Paper 2</text><line x1="434" y1="313" x2="464" y2="313" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="30" y="360" width="400" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="390" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Regional option (HL)</text><text x="50" y="414" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1 of 4 · 90 h · Paper 3</text><rect x="470" y="360" width="400" height="70" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="390" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Regional study (HL)</text><text x="490" y="414" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">same 4 regions · 90 h · Paper 3</text><line x1="434" y1="395" x2="464" y2="395" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="30" y="442" width="400" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="472" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Historical investigation</text><text x="50" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">20 h · with reflection section</text><rect x="470" y="442" width="400" height="70" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="472" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Historical investigation</text><text x="490" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">20 h · no separate reflection</text><line x1="434" y1="477" x2="464" y2="477" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="30" y="524" width="400" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="554" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Six key concepts</text><rect x="470" y="524" width="400" height="82" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="554" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Four paired concepts</text><text x="490" y="578" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cause and consequence · continuity and</text><text x="490" y="597" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">change · perspectives · significance</text><line x1="434" y1="565" x2="464" y2="565" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="450" y="644" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">The 2028 changes do not apply to exams in 2027 or earlier.</text>
</svg>