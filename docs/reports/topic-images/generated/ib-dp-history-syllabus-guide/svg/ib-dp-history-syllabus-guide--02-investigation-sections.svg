<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The historical investigation: 25 marks</text>

<text x="40" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start"></text><rect x="40" y="120" width="168" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="124" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="208" y="120" width="420" height="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="418" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">15</text><rect x="628" y="120" width="112" height="60" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="684" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="750" y="156" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">25 marks</text><rect x="30" y="212" width="840" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="212" width="14" height="86" rx="4" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="2.5"/><circle cx="84" cy="255" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="262.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="120" y="246" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Identification and evaluation of sources</text><text x="850" y="246" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="end">6 marks</text><text x="120" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the question, two sources chosen for detailed analysis, their value and limitations</text><rect x="30" y="312" width="840" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="312" width="14" height="86" rx="4" fill="#d4b02e" stroke="#d4b02e" stroke-width="2.5"/><circle cx="84" cy="355" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="362.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="120" y="346" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Investigation</text><text x="850" y="346" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="end">15 marks</text><text x="120" y="372" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a focused, evidenced and argued answer to the question</text><rect x="30" y="412" width="840" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="412" width="14" height="86" rx="4" fill="#f2e7b8" stroke="#f2e7b8" stroke-width="2.5"/><circle cx="84" cy="455" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="462.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="120" y="446" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reflection</text><text x="850" y="446" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="end">4 marks</text><text x="120" y="472" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what the investigation showed about the methods and challenges historians face</text><rect x="30" y="520" width="266" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="163" y="552" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">up to 2,200 words</text><text x="163" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">on a topic of your own choice</text><rect x="317" y="520" width="266" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="552" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">marked by the teacher</text><text x="450" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">moderated by the IB</text><rect x="604" y="520" width="266" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="737" y="552" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">25% at SL</text><text x="737" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">20% at HL</text>
