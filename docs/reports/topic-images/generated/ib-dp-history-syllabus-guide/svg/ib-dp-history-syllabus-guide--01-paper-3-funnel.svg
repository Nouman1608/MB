<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 774" width="900" height="774" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="774" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">HL Paper 3: from 36 questions to 3</text>

<text x="450" y="128" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">What you study</text><rect x="40" y="140" width="820" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="178" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1 of 4 regional options</text><text x="450" y="204" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Africa and the Middle East · the Americas · Asia and Oceania · Europe</text><line x1="450" y1="228" x2="450" y2="252" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="170" y="256" width="560" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="294" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3 of its 18 sections</text><text x="450" y="320" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">each covering a defined period</text><text x="450" y="384" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">What Paper 3 sets</text><rect x="40" y="396" width="820" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="434" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">36 questions</text><text x="450" y="460" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2 on each of the region’s 18 sections</text><line x1="450" y1="484" x2="450" y2="508" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="170" y="512" width="560" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="550" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">roughly 6 on your content</text><text x="450" y="576" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2 on each of your 3 sections</text><line x1="450" y1="600" x2="450" y2="624" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="270" y="628" width="360" height="84" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="666" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">you answer 3</text><text x="450" y="692" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">35% of the HL grade</text><text x="450" y="746" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">So revise every section you studied fully: there is little room to leave one out.</text>
</svg>