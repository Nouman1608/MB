<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 738" width="900" height="738" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="738" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Queries 2 to 4 and their results</text>

<text x="30" y="128" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Query 2</text><rect x="30" y="138" width="840" height="87" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="164" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">SELECT FirstName, Surname</text><text x="46" y="185" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">FROM Students</text><text x="46" y="206" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">WHERE Surname LIKE 'M%' OR House = 'Red';</text><rect x="30" y="235" width="250" height="70" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="263" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Result</text><text x="48" y="289" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ben Lee; Dara Mills</text><rect x="294" y="235" width="576" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="312" y="263" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">LIKE 'M%': % matches any sequence of characters → Mills</text><text x="312" y="285" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">OR House = 'Red' → Lee</text><text x="30" y="343" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Query 3</text><rect x="30" y="353" width="840" height="45" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="379" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">SELECT DISTINCT Subject FROM Results ORDER BY Subject ASC;</text><rect x="30" y="408" width="250" height="70" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="436" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Result</text><text x="48" y="462" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Maths; Physics</text><rect x="294" y="408" width="576" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="312" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">DISTINCT removes repeats from six rows</text><text x="312" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ASC sorts A to Z</text><text x="30" y="516" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Query 4</text><rect x="30" y="526" width="840" height="108" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="552" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">SELECT Students.Surname</text><text x="46" y="573" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">FROM Students</text><text x="46" y="594" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">JOIN Results ON Students.StudentID = Results.StudentID</text><text x="46" y="615" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">WHERE Results.Subject = 'Physics' AND NOT Students.House = 'Blue';</text><rect x="30" y="644" width="250" height="70" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="672" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Result</text><text x="48" y="698" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mills</text><rect x="294" y="644" width="576" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="312" y="672" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Physics rows: Khan (Blue), Wu (Blue), Mills (Green)</text><text x="312" y="694" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">NOT Blue leaves Mills</text>
</svg>