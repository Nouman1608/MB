<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why not one flat file?</text>

<text x="52" y="128" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A flat file: one table holds everything</text><rect x="52" y="142" width="150" height="34" fill="#1e2a44" stroke="#ffffff" stroke-width="1.5"/><text x="127" y="164" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Surname</text><rect x="202" y="142" width="130" height="34" fill="#1e2a44" stroke="#ffffff" stroke-width="1.5"/><text x="267" y="164" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">House</text><rect x="332" y="142" width="150" height="34" fill="#1e2a44" stroke="#ffffff" stroke-width="1.5"/><text x="407" y="164" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Subject</text><rect x="482" y="142" width="110" height="34" fill="#1e2a44" stroke="#ffffff" stroke-width="1.5"/><text x="537" y="164" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Score</text><rect x="52" y="176" width="150" height="34" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="127" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Khan</text><rect x="202" y="176" width="130" height="34" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="267" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Blue</text><rect x="332" y="176" width="150" height="34" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="407" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Maths</text><rect x="482" y="176" width="110" height="34" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="537" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">82</text><rect x="52" y="210" width="150" height="34" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="127" y="232" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Khan</text><rect x="202" y="210" width="130" height="34" fill="#f6e3d6" stroke="#c9d6d4" stroke-width="1.5"/><text x="267" y="232" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Red</text><rect x="332" y="210" width="150" height="34" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="407" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Physics</text><rect x="482" y="210" width="110" height="34" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="537" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">74</text><rect x="52" y="244" width="150" height="34" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="127" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Lee</text><rect x="202" y="244" width="130" height="34" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="267" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Red</text><rect x="332" y="244" width="150" height="34" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="407" y="266" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Maths</text><rect x="482" y="244" width="110" height="34" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="537" y="266" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">65</text><rect x="52" y="278" width="150" height="34" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="127" y="300" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Wu</text><rect x="202" y="278" width="130" height="34" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="267" y="300" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Blue</text><rect x="332" y="278" width="150" height="34" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="407" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Maths</text><rect x="482" y="278" width="110" height="34" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="537" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">91</text><rect x="52" y="312" width="150" height="34" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="127" y="334" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Wu</text><rect x="202" y="312" width="130" height="34" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="267" y="334" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Blue</text><rect x="332" y="312" width="150" height="34" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="407" y="334" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Physics</text><rect x="482" y="312" width="110" height="34" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="537" y="334" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">58</text><rect x="52" y="346" width="150" height="34" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="127" y="368" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Mills</text><rect x="202" y="346" width="130" height="34" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="1.5"/><text x="267" y="368" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Green</text><rect x="332" y="346" width="150" height="34" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="407" y="368" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Physics</text><rect x="482" y="346" width="110" height="34" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="1.5"/><text x="537" y="368" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">70</text><text x="52" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Name and house are repeated on every result row (illustrative: Khan’s house updated in one row only).</text><path d="M600,196 L720,196" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="612" y="142" width="258" height="86" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="630" y="170" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Redundancy</text><text x="630" y="192" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the same details stored many</text><text x="630" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">times, wasting space</text><rect x="612" y="236" width="258" height="86" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="630" y="264" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Inconsistency</text><text x="630" y="286" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a change in only some rows:</text><text x="630" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the data contradicts itself</text><rect x="612" y="330" width="258" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Weak control</text><text x="630" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hard to show results without</text><text x="630" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">personal details</text><rect x="30" y="470" width="840" height="118" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="504" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">A relational database stores each fact once and links tables through keys.</text><text x="52" y="534" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The DBMS can then enforce rules (validation, referential integrity)</text><text x="52" y="560" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and give different users different access rights.</text>
</svg>