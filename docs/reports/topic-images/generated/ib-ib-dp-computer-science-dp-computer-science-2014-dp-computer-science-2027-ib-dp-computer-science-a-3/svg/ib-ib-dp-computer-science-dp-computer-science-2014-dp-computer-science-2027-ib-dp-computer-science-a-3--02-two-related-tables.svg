530" y="450" width="340" height="180" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="552" y="482" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Referential integrity</text><text x="552" y="510" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Every StudentID in Results must</text><text x="552" y="530" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">match an existing StudentID in</text><text x="552" y="550" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Students.</text><text x="552" y="590" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">e.g. Result 6 → Student 4 (Mills)</text><text x="552" y="612" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">Normalisation: each fact stored once.</text>
