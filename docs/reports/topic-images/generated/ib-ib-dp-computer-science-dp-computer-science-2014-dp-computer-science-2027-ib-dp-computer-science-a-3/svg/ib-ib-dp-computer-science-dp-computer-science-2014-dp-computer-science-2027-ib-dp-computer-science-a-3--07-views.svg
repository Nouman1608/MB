<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Virtual and materialised views</text>

<rect x="30" y="100" width="70" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="65" y="120.4" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">HL</text><text x="120" y="122" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">A view is a saved query that users can treat like a table.</text><rect x="30" y="150" width="410" height="280" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="184" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Virtual view</text><rect x="60" y="240" width="90" height="60" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="276" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">tables</text><line x1="154" y1="270" x2="200" y2="270" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="206" y="240" width="100" height="60" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="256" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">query</text><text x="256" y="286" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">runs now</text><line x1="310" y1="270" x2="350" y2="270" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="388" y="276" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">user</text><path d="M256,304 C256,336 120,336 110,306" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)" stroke-dasharray="6 5"/><text x="182" y="350" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">rerun on every use</text><text x="52" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recalculated each time it is used</text><text x="52" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ always current</text><rect x="460" y="150" width="410" height="280" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="184" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Materialised (snapshot) view</text><rect x="490" y="240" width="90" height="60" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="535" y="276" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">tables</text><line x1="584" y1="270" x2="620" y2="270" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="626" y="236" width="110" height="68" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="681" y="264" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">stored</text><text x="681" y="284" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">result</text><line x1="740" y1="270" x2="780" y2="270" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="818" y="276" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">user</text><text x="602" y="222" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">refresh</text><text x="482" y="358" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stores the result</text><text x="482" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ faster to read</text><text x="482" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− must be refreshed</text><rect x="30" y="450" width="840" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="482" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Why use views</text><text x="52" y="510" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hide complexity · simplify repeated queries · show users only certain fields (security)</text><text x="52" y="536" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">· keep applications working if the underlying tables change. Some views are read-only.</text>
</svg>