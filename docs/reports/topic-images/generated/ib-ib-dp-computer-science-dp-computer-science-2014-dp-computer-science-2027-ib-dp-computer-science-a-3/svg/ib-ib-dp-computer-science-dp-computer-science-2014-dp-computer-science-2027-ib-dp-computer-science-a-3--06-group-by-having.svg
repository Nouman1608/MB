<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">GROUP BY and HAVING</text>

<rect x="30" y="100" width="70" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="65" y="120.4" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">HL</text><rect x="120" y="96" width="750" height="129" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="136" y="122" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">SELECT Students.House, AVG(Results.Score)</text><text x="136" y="143" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">FROM Students</text><text x="136" y="164" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">JOIN Results ON Students.StudentID = Results.StudentID</text><text x="136" y="185" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">GROUP BY Students.House</text><text x="136" y="206" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="400" fill="#f2f4f4" text-anchor="start" xml:space="preserve">HAVING COUNT(*) &gt;= 2;</text><text x="30" y="276" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">GROUP BY House</text><rect x="30" y="292" width="300" height="160" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="320" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Blue</text><text x="140" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Khan</text><text x="300" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">82</text><text x="140" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Khan</text><text x="300" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">74</text><text x="140" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wu</text><text x="300" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">91</text><text x="140" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wu</text><text x="300" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">58</text><line x1="336" y1="372" x2="370" y2="372" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="378" y="346" width="230" height="52" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="493" y="378" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">COUNT(*) = 4</text><line x1="614" y1="372" x2="648" y2="372" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="656" y="338" width="214" height="68" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="763" y="366" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Blue</text><text x="763" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">AVG = 76.25</text><rect x="30" y="466" width="300" height="70" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="494" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Red</text><text x="140" y="496" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lee</text><text x="300" y="496" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">65</text><line x1="336" y1="501" x2="370" y2="501" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="378" y="475" width="230" height="52" rx="8" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="493" y="507" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">COUNT(*) = 1</text><line x1="614" y1="501" x2="648" y2="501" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="670" y="507" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">removed by HAVING</text><rect x="30" y="550" width="300" height="70" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="578" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Green</text><text x="140" y="580" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mills</text><text x="300" y="580" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">70</text><line x1="336" y1="585" x2="370" y2="585" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="378" y="559" width="230" height="52" rx="8" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="493" y="591" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">COUNT(*) = 1</text><line x1="614" y1="585" x2="648" y2="585" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="670" y="591" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">removed by HAVING</text><text x="493" y="278" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">HAVING ≥ 2?</text><text x="493" y="638" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">(82 + 74 + 91 + 58) ÷ 4 = 305 ÷ 4 = 76.25</text><rect x="30" y="658" width="410" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="688" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">WHERE</text><text x="52" y="714" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">filters individual rows before grouping</text><rect x="460" y="658" width="410" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="688" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">HAVING</text><text x="482" y="714" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">filters groups after aggregation</text>
</svg>