33" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+132,600</text><text x="755" y="668" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Change</text><line x1="656" y1="354.83870967741933" x2="700" y2="354.83870967741933" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5 4"/><text x="310" y="708" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">natural increase: NIR = 0.9%</text><text x="310" y="732" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(15.0 − 6.0) ÷ 10</text><text x="660" y="708" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">total growth rate = 1.07%</text><text x="660" y="732" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">132,600 ÷ 12,400,000 × 100</text><text x="450" y="150" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Norland (fictional data), population 12,400,000, one year</text><rect x="30" y="780" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="811.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Growth (1.07%) is higher than NIR (0.9%) because Norland gains +21,000 by migration.</text>
