<rect x="30" y="110" width="840" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="90" y="160" width="152" height="360" fill="#f3f7f6"/><text x="166" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stage 1</text><rect x="242" y="160" width="152" height="360" fill="#ffffff"/><line x1="242" y1="160" x2="242" y2="520" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="6 5"/><text x="318" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stage 2</text><rect x="394" y="160" width="152" height="360" fill="#f3f7f6"/><line x1="394" y1="160" x2="394" y2="520" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="6 5"/><text x="470" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stage 3</text><rect x="546" y="160" width="152" height="360" fill="#ffffff"/><line x1="546" y1="160" x2="546" y2="520" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="6 5"/><text x="622" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stage 4</text><rect x="698" y="160" width="152" height="360" fill="#f3f7f6"/><line x1="698" y1="160" x2="698" y2="520" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="6 5"/><text x="774" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stage 5</text><line x1="90" y1="520" x2="850" y2="520" stroke="#1e2a44" stroke-width="2.5"/><line x1="90" y1="160" x2="90" y2="520" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="340" font-size="16" fill="#4a5568" text-anchor="middle" transform="rotate(-90 60 340)">rate / population (no scale)</text><path d="M90,490 L242,480 C333.20000000000005,430 394,320 485.2,270 C561.2,235 622,220 698,220 C758.8000000000001,220 804.4,230 850,242 L850,520 L90,520 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3" opacity="0.9"/><path d="M90,200 L394,200 C454.8,210 500.40000000000003,330 546,390 L698,405 C743.6,420 789.1999999999999,445 850,450" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M90,210 q38,-22 76,0 q38,22 76,0 C287.6,230 333.20000000000005,350 394,375 C470,400 546,408 622,410 L698,410 C758.8000000000001,410 804.4,404 850,398" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><line x1="110" y1="568" x2="150" y2="568" stroke="#2e6b62" stroke-width="5"/><text x="160" y="574" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Birth rate</text><line x1="310" y1="568" x2="350" y2="568" stroke="#b5602e" stroke-width="5"/><text x="360" y="574" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Death rate</text><rect x="510" y="558" width="40" height="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="560" y="574" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Total population</text><text x="166" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">High stationary</text><text x="318" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Early expanding</text><text x="470" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Late expanding</text><text x="622" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Low stationary</text><text x="774" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Declining</text><text x="318" y="280" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">natural increase</text>
