<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="572" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four terms to use exactly</text>

<rect x="30" y="110" width="840" height="75.52000000000001" rx="12" fill="#2e6b62"/><text x="42" y="150.07999999999998" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Term</text><text x="272" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Crossed a national</text><text x="272" y="161.95999999999998" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">border?</text><text x="472" y="150.07999999999998" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Defining feature</text><rect x="30" y="181.52" width="840" height="87.32000000000001" fill="#ffffff"/><text x="42" y="207.97" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Refugee</text><text x="272" y="207.97" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Yes</text><text x="472" y="207.97" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fled their country because of a well-founded</text><text x="472" y="230.41" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fear of persecution (1951 UN Refugee</text><text x="472" y="252.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Convention)</text><rect x="30" y="268.84000000000003" width="840" height="64.88" fill="#f7f9f9"/><text x="42" y="295.29" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Asylum seeker</text><text x="272" y="295.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Yes</text><text x="472" y="295.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Has asked for protection as a refugee but has</text><text x="472" y="317.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">not yet had a decision</text><line x1="30" y1="268.84000000000003" x2="870" y2="268.84000000000003" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="333.72" width="840" height="64.88" fill="#ffffff"/><text x="42" y="360.17" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Internally displaced</text><text x="42" y="382.61" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">person</text><text x="272" y="360.17" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No</text><text x="472" y="360.17" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Forced from home but still inside their own</text><text x="472" y="382.61" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">country</text><line x1="30" y1="333.72" x2="870" y2="333.72" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="398.6" width="840" height="64.88" fill="#f7f9f9"/><text x="42" y="425.05" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Economic migrant</text><text x="272" y="425.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not part of the</text><text x="272" y="447.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">definition</text><text x="472" y="425.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Moves mainly for work or higher income</text><line x1="30" y1="398.6" x2="870" y2="398.6" stroke="#c9d6d4" stroke-width="1.5"/><line x1="260" y1="181.52" x2="260" y2="463.48" stroke="#c9d6d4" stroke-width="1.5"/><line x1="460" y1="181.52" x2="460" y2="463.48" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="110" width="840" height="353.48" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/><rect x="30" y="487.48" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="519.58" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Never call every migrant a “refugee”: use the exact term.</text>
</svg>