nt-weight="700" fill="#2e6b62" text-anchor="middle">+</text><circle cx="665" cy="334" r="19" fill="#f3d9c9" stroke="#b5602e" stroke-width="2"/><text x="665" y="341" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">−</text><circle cx="719" cy="334" r="19" fill="#eef0f0" stroke="#c9d6d4" stroke-width="2"/><text x="719" y="341" font-size="21" font-weight="700" fill="#4a5568" text-anchor="middle">0</text><circle cx="773" cy="334" r="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="773" y="341" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">+</text><circle cx="827" cy="334" r="19" fill="#eef0f0" stroke="#c9d6d4" stroke-width="2"/><text x="827" y="341" font-size="21" font-weight="700" fill="#4a5568" text-anchor="middle">0</text><text x="155" y="420" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">push factors (−)</text><text x="745" y="420" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">pull factors (+)</text><rect x="320" y="200" width="60" height="200" rx="6" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="356" y="300" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 356 300)">Distance</text><rect x="400" y="200" width="60" height="200" rx="6" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="436" y="300" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 436 300)">Cost</text><rect x="480" y="200" width="60" height="200" rx="6" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="516" y="300" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 516 300)">Borders</text><path d="M285,300 C330,170 560,170 612,300" fill="none" stroke="#1e2a44" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="450" y="170" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Intervening obstacles</text><text x="430" y="425" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">also: visas, language,</text><text x="430" y="445" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a sea or mountain crossing</text><rect x="30" y="475" width="840" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="513.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal factors</text><text x="450" y="540.67" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">age, family ties, skills and attitude to risk: the same push factor affects different people</text><text x="450" y="561.79" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">differently</text><text x="450" y="140" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">+ attracts   − repels   0 neutral</text><rect x="30" y="605" width="840" height="52.44" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="636.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">So the poorest are not always the ones who migrate: they may not afford the journey.</text>
