<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 708" width="900" height="708" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="708" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A population as a system</text>

<ellipse cx="450" cy="300" rx="150" ry="95" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="295" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Population</text><text x="450" y="325" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">of a place</text><text x="140" y="140" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">INPUTS</text><text x="760" y="140" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">OUTPUTS</text><rect x="40" y="165" width="200" height="80" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="140" y="213.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Births</text><rect x="40" y="355" width="200" height="80" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="140" y="403.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Immigrants</text><rect x="660" y="165" width="200" height="80" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="760" y="213.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Deaths</text><rect x="660" y="355" width="200" height="80" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="760" y="403.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Emigrants</text><line x1="244" y1="215" x2="318" y2="255" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><line x1="244" y1="390" x2="318" y2="345" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><line x1="582" y1="255" x2="656" y2="215" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><line x1="582" y1="345" x2="656" y2="390" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="140" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">natural increase:</text><text x="140" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">births − deaths</text><text x="760" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">net migration:</text><text x="760" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">immigrants − emigrants</text><rect x="40" y="470" width="820" height="130" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="512" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Population change =</text><text x="160" y="562" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">births</text><text x="355" y="562" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">− deaths</text><text x="550" y="562" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">+ immigrants</text><text x="745" y="562" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">− emigrants</text><rect x="40" y="625" width="820" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="656.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Natural increase counts only births and deaths; total growth also includes migration.</text>
</svg>