<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three views of what socialisation does</text>

<rect x="30" y="104" width="269.3333333333333" height="307" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSENSUS</text><text x="50" y="164.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Functionalism</text><text x="50" y="194.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Passes on shared values:</text><text x="65.2" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">social cohesion, value</text><text x="65.2" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">consensus</text><text x="50" y="265.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parsons: family’s primary</text><text x="65.2" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">socialisation</text><text x="50" y="315.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Durkheim: education</text><text x="65.2" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">creates solidarity</text><text x="50" y="365.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Deviance from inadequate</text><text x="65.2" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">socialisation</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="307" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335.3333333333333" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CONFLICT</text><text x="335.3333333333333" y="164.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Marxism</text><text x="335.3333333333333" y="194.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Transmits capitalist</text><text x="350.5333333333333" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ideology; makes</text><text x="350.5333333333333" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inequality seem fair</text><text x="335.3333333333333" y="265.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Althusser: ideological</text><text x="350.5333333333333" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">state apparatuses</text><text x="335.3333333333333" y="315.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bowles and Gintis: hidden</text><text x="350.5333333333333" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">curriculum makes obedient</text><text x="350.5333333333333" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">workers</text><text x="335.3333333333333" y="386.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reproduces social class</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="307" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="620.6666666666666" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CONFLICT</text><text x="620.6666666666666" y="164.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Feminism</text><text x="620.6666666666666" y="194.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gender role socialisation</text><text x="635.8666666666667" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">into femininity and</text><text x="635.8666666666667" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">masculinity</text><text x="620.6666666666666" y="265.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Maintains patriarchy</text><text x="620.6666666666666" y="294.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Oakley: canalisation and</text><text x="635.8666666666667" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">manipulation</text><text x="620.6666666666666" y="344.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sharpe: Just Like a Girl</text><rect x="30" y="429" width="269.3333333333333" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="462" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRITICISM</text><text x="50" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assumes everyone shares the</text><text x="50" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">same values; underplays</text><text x="50" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conflict</text><rect x="315.3333333333333" y="429" width="269.3333333333333" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="462" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRITICISM</text><text x="335.3333333333333" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Makes people seem passive:</text><text x="335.3333333333333" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Willis’s “lads” rejected</text><text x="335.3333333333333" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">school values</text><rect x="600.6666666666666" y="429" width="269.3333333333333" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="462" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRITICISM</text><text x="620.6666666666666" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some say it underplays</text><text x="620.6666666666666" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">individual choice</text>
</svg>