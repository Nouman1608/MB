<rect width="900" height="778" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Matching processes to agencies</text>

<text x="175" y="128" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Agency</text><text x="630" y="128" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Process and how it works</text><rect x="30" y="144" width="290" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="175" y="196.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Family</text><rect x="380" y="144" width="490" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="394" y="172.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Canalisation and manipulation</text><text x="394" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Oakley (1972): toys and activities “suitable” for each</text><text x="394" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sex</text><line x1="326" y1="192" x2="372" y2="192" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="250" width="290" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="175" y="292.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Education</text><rect x="380" y="250" width="490" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="394" y="278.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hidden curriculum</text><text x="394" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">punctuality, obedience, hierarchy, competition</text><line x1="326" y1="287.5" x2="372" y2="287.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="335" width="290" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="175" y="377.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Media</text><rect x="380" y="335" width="490" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="394" y="363.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Media representations</text><text x="394" y="391.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">repeated images, e.g. body types in adverts</text><line x1="326" y1="372.5" x2="372" y2="372.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="420" width="290" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="175" y="462.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Peer group</text><rect x="380" y="420" width="490" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="394" y="448.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peer pressure</text><text x="394" y="476.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conform, or face ridicule</text><line x1="326" y1="457.5" x2="372" y2="457.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="505" width="290" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="175" y="547.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Religion</text><rect x="380" y="505" width="490" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="394" y="533.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Religious teachings</text><text x="394" y="561.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sacred texts, sermons, rituals</text><line x1="326" y1="542.5" x2="372" y2="542.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="590" width="290" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="175" y="632.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Workplace</text><rect x="380" y="590" width="490" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="394" y="618.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Workplace training</text><text x="394" y="646.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">induction, rules, supervision</text><line x1="326" y1="627.5" x2="372" y2="627.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="675" width="290" height="75" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="175" y="717.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">All agencies</text><rect x="380" y="675" width="490" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="394" y="703.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Role modelling</text><text x="394" y="731.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">copying people we admire</text><line x1="326" y1="712.5" x2="372" y2="712.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>