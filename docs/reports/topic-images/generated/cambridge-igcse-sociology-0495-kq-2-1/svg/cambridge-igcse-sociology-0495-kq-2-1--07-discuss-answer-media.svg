<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 539" width="900" height="539" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="539" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a “discuss” answer</text>

<rect x="30" y="104" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUESTION</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Discuss the role of the media as an agency of socialisation.</text><rect x="30" y="207" width="160" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="250" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Process 1</text><rect x="204" y="207" width="666" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="236.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Media representations: adverts repeatedly show slim, young bodies, so</text><text x="220" y="258.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">viewers see this as the norm.</text><rect x="30" y="291" width="160" height="50" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="323" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Process 2</text><rect x="204" y="291" width="666" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="320.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Role models: athletes or influencers whose lifestyles young people copy.</text><rect x="30" y="353" width="160" height="72" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Perspectives</text><rect x="204" y="353" width="666" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="382.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marxists: media spreads capitalist ideology such as consumerism.</text><text x="220" y="404.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists: stereotyped representations of women.</text><rect x="30" y="437" width="160" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="480" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluate</text><rect x="204" y="437" width="666" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="466.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Audiences are not passive: family, religion and peers filter messages,</text><text x="220" y="488.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and young people choose content and challenge stereotypes.</text>
</svg>