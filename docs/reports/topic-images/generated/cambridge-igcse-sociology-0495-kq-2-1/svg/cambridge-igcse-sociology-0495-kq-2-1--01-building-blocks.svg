<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 752" width="900" height="752" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="752" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The building blocks of culture</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="147.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Culture</text><text x="450" y="177.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the whole way of life of a group: language, beliefs, knowledge, customs, food, dress</text><rect x="30" y="230" width="156" height="214" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="108" y="266.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Values</text><text x="108" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">broad beliefs</text><text x="108" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">about what is</text><text x="108" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">good</text><text x="108" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. education</text><text x="108" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">matters</text><line x1="190" y1="290" x2="254" y2="290" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="222" y="322" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">underpin</text><rect x="258" y="230" width="156" height="214" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="336" y="266.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Norms</text><text x="336" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">specific rules</text><text x="336" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">based on</text><text x="336" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">values</text><text x="336" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. queuing;</text><text x="336" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">shoes off at</text><text x="336" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">home</text><line x1="418" y1="290" x2="482" y2="290" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="322" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">define</text><rect x="486" y="230" width="156" height="214" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="564" y="266.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Roles</text><text x="564" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">expected</text><text x="564" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">behaviour for</text><text x="564" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a position</text><text x="564" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. a “good</text><text x="564" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">student” is on</text><text x="564" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">time</text><line x1="646" y1="290" x2="710" y2="290" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="678" y="322" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">attach to</text><rect x="714" y="230" width="156" height="214" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="792" y="266.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Status</text><text x="792" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a position and</text><text x="792" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">its prestige</text><text x="792" y="348.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. ascribed:</text><text x="792" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">royal title;</text><text x="792" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">achieved:</text><text x="792" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">doctor</text><line x1="450" y1="194" x2="450" y2="224" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="474" width="400" height="152" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="510" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Stereotypes</text><text x="50" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fixed, oversimplified generalisations that</text><text x="50" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">can push people into roles regardless of</text><text x="50" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ability, e.g. assuming boys are bad at</text><text x="50" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">caring roles.</text><path d="M230,474 C230,454 500,470 528,450" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#ahR)"/><rect x="470" y="474" width="400" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="490" y="510" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Customs</text><text x="490" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Traditional, long-established practices</text><text x="490" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">passed between generations, e.g. wedding</text><text x="490" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rituals, festival foods.</text><rect x="30" y="644" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="677.6" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Together these shape how people behave and how they see themselves: their social</text><text x="450" y="699.6" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">identity.</text>
</svg>