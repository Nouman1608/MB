<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nature or nurture?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Sociologists emphasise nurture</text>
<line x1="215" y1="161" x2="685" y2="183" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,172 L420,264 L480,264 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="172" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="161" x2="160" y2="216" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="161" x2="270" y2="216" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,216 L290,216 Q275,243 215,243 Q155,243 140,216 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="183" x2="630" y2="238" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="183" x2="740" y2="238" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,238 L760,238 Q745,265 685,265 Q625,265 610,238 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="265" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">NATURE</text><text x="685" y="287" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">NURTURE</text><rect x="30" y="300" width="405" height="232" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="336" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Nature: mainly inborn</text><text x="50" y="365.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="365.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Genes</text><text x="50" y="392.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="392.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Instincts</text><text x="50" y="419.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="419.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Hormones</text><text x="50" y="446.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="446.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Biology sets some limits, e.g. physical</text><text x="66.15" y="468.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">maturation</text><rect x="465" y="300" width="405" height="232" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="336" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Nurture: mainly learned</text><text x="485" y="365.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="365.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Isolated children: Genie (1970) could</text><text x="501.15" y="387.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">not speak at 13</text><text x="485" y="414.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="414.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Relativity of culture: Mead’s three New</text><text x="501.15" y="436.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Guinea groups had different gender</text><text x="501.15" y="458.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">norms</text><text x="485" y="485.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="485.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Change in one society: too fast to be</text><text x="501.15" y="507.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">genetic</text><rect x="30" y="550" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="586" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A balanced answer</text><text x="50" y="615.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Biology sets some limits, but the meaning attached to biology is learned. Treat the</text><text x="50" y="637.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">evidence with care: feral cases are rare, and Mead’s fieldwork has been questioned.</text>
</svg>