<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Socialisation across the life course</text>

<line x1="60" y1="130" x2="850" y2="130" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="60" y="160" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">early childhood</text><text x="840" y="160" font-size="16" font-weight="600" fill="#4a5568" text-anchor="end">later childhood and adult life</text><rect x="30" y="180" width="280" height="330" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="213" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PRIMARY SOCIALISATION</text><text x="50" y="243.2" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><text x="50" y="275.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="275.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Language</text><text x="50" y="302.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="302.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Basic norms</text><text x="50" y="329.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="329.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Emotional ties</text><text x="50" y="356.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="356.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Early gender identity</text><line x1="316" y1="345" x2="352" y2="345" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="360" y="202" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECONDARY SOCIALISATION</text><rect x="360" y="216" width="510" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="380" y="248" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><text x="855" y="248" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">hidden curriculum</text><rect x="360" y="276" width="510" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="380" y="308" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Peer group</text><text x="855" y="308" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">peer pressure</text><rect x="360" y="336" width="510" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="380" y="368" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Media</text><text x="855" y="368" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">representations, role models</text><rect x="360" y="396" width="510" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="380" y="428" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Religion</text><text x="855" y="428" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">religious teachings</text><rect x="360" y="456" width="510" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="380" y="488" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Workplace</text><text x="855" y="488" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">workplace training</text><rect x="30" y="530" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="563.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Effectiveness is relative: an agency may be strong for one group or at one life stage and</text><text x="50" y="585.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weak for another.</text>
</svg>