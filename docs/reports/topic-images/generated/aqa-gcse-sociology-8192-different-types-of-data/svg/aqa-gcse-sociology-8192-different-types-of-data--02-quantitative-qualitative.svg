<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 713" width="900" height="713" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="713" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Numbers or words?</text>

<rect x="30" y="104" width="404" height="454" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Quantitative data</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Percentages, rates, averages, counts</text><circle cx="53" cy="215.79" r="4.5" fill="#2e6b62"/><text x="66" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Show patterns and trends clearly</text><circle cx="53" cy="245.79" r="4.5" fill="#2e6b62"/><text x="66" y="251.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Allow comparison between groups</text><circle cx="53" cy="275.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="281.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Standard collection, so usually</text><text x="66" y="303.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">reliable</tspan></text><circle cx="53" cy="327.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="333.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Large data sets can represent whole</text><text x="66" y="355.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">populations</text><circle cx="53" cy="379.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="385.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Show what and how many, not <tspan font-weight="700">why</tspan></text><circle cx="53" cy="409.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="415.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Turning experience into numbers can</text><text x="66" y="437.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lose meaning, so lower <tspan font-weight="700">validity</tspan></text><circle cx="53" cy="461.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="467.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Depend on the collector’s definitions</text><rect x="466" y="104" width="404" height="454" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Qualitative data</text><text x="484" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Transcripts, field notes, diaries, letters,</text><text x="484" y="211.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">media content</text><circle cx="489" cy="236.79" r="4.5" fill="#8a6d0d"/><text x="502" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Meanings, motives and feelings in</text><text x="502" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">people’s own words</text><circle cx="489" cy="288.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Depth and context, so <tspan font-weight="700">validity</tspan> tends to</text><text x="502" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">be high</text><circle cx="489" cy="340.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="346.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Can uncover unexpected issues</text><circle cx="489" cy="370.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="376.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Hard to compare or count</text><circle cx="489" cy="400.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="406.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Small samples, so may not be</text><text x="502" y="428.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">representative</tspan></text><circle cx="489" cy="452.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="458.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Researcher’s interpretation risks <tspan font-weight="700">bias</tspan></text><text x="502" y="480.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and selective use</text><circle cx="489" cy="504.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="510.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">–</tspan> Documents may be written for an</text><text x="502" y="532.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">audience</text><circle cx="450" cy="331" r="24" fill="#1e2a44"/><text x="450" y="338" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="576" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="612" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example: divorce</text><text x="56" y="641" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A divorce rate shows whether divorce has become more common; it says little about how it</text><text x="56" y="663" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">feels to go through one.</text>
</svg>