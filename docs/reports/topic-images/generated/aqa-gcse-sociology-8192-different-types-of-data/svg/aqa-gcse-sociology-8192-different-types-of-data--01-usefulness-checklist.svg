<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="604" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing any data for usefulness</text>

<rect x="300" y="112" width="300" height="76" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="146" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Useful for what?</text><text x="450" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">start from the research aim</text><rect x="30" y="214" width="410" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="64" cy="256" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="262.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="94" y="244" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><text x="94" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Collected for this aim, or for another one?</text><rect x="30" y="308" width="410" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="64" cy="350" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="356.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="94" y="338" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Validity</text><text x="94" y="362" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A true picture of what it claims to show?</text><rect x="30" y="402" width="410" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="64" cy="444" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="450.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="94" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><text x="94" y="456" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Would the same method give the same figures</text><text x="94" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">again?</text><rect x="30" y="496" width="410" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="64" cy="538" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="544.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="94" y="526" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Representativeness</text><text x="94" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Who is included, and who is missing?</text><rect x="460" y="214" width="410" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="494" cy="256" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="494" y="262.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="524" y="244" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Definitions</text><text x="524" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">How were terms like “poverty” or “crime”</text><text x="524" y="288" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">defined?</text><rect x="460" y="308" width="410" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="494" cy="350" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="494" y="356.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="524" y="338" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Source and bias</text><text x="524" y="362" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Who produced it? Do they have an interest in</text><text x="524" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the result?</text><rect x="460" y="402" width="410" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="494" cy="444" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="494" y="450.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="524" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Date</text><text x="524" y="456" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Are the data still relevant?</text><rect x="460" y="496" width="410" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="476" y="532" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Short answer: use 2 or 3. Extended answer:</text><text x="476" y="553" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">use most of them.</text>
</svg>