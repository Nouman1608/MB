<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How official statistics are produced</text>

<rect x="30" y="108" width="330" height="412" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L345.75,109.25 Q358.75,109.25 358.75,122.25 L358.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="358.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="195" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">By registration</text><circle cx="55" cy="190.06" r="4.5" fill="#2e6b62"/><text x="68" y="196" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Births</text><circle cx="55" cy="222.06" r="4.5" fill="#2e6b62"/><text x="68" y="228" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Marriages</text><circle cx="55" cy="254.06" r="4.5" fill="#2e6b62"/><text x="68" y="260" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Deaths</text><text x="50" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Must be legally recorded</text><rect x="50" y="350" width="290" height="88" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="195" y="388" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Generally seen</text><text x="195" y="414" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">as accurate</text><rect x="390" y="108" width="480" height="412" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M391.25,158 L391.25,122.25 Q391.25,109.25 404.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="391.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="630" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">By decisions of people</text><rect x="408" y="186" width="136" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="476" y="214" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Victim notices</text><text x="476" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a crime</text><line x1="546" y1="221" x2="560" y2="221" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="562" y="186" width="136" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="630" y="214" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Chooses</text><text x="630" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">to report it</text><line x1="700" y1="221" x2="714" y2="221" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="716" y="186" width="136" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="784" y="214" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Police decide</text><text x="784" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">to record it</text><text x="410" y="286" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Recorded crime</text><text x="852" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">missing crimes = the dark figure</text><rect x="408" y="302" width="444" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="426" y="330" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Head teacher decides</text><text x="426" y="352" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to exclude a pupil</text><text x="838" y="342" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">Exclusion figures</text><rect x="408" y="396" width="444" height="104" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="630" y="430" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactionists: social constructs</text><text x="630" y="460" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">They show how producers behave as well as what they</text><text x="630" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">count</text><rect x="30" y="538" width="840" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="574" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Strengths and limitations</text><circle cx="61" cy="597.39" r="4.5" fill="#8a6d0d"/><text x="74" y="603" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Strengths:</tspan> often national; collected regularly, so trends can be tracked; free and quick;</text><text x="74" y="625" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">large scale with standard procedures</text><circle cx="61" cy="649.39" r="4.5" fill="#8a6d0d"/><text x="74" y="655" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Limitations:</tspan> government definitions can change and break trends; some events unrecorded;</text><text x="74" y="677" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">may be presented to suit the government; rarely explain causes</text>
</svg>