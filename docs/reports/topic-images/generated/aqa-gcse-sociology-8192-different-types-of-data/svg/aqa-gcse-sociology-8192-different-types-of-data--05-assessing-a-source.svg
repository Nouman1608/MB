<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 754" width="900" height="754" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="754" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Assessing a source, step by step</text>

<rect x="200" y="112" width="500" height="150" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="220" y="142" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">The source (fictional)</text><text x="220" y="170" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A charity campaigning against youth homelessness</text><text x="220" y="192" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">surveys <tspan font-weight="700">300 young people using its hostels</tspan>. <tspan font-weight="700">70%</tspan> left</text><text x="220" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">home after arguments with a parent or step-parent.</text><rect x="30" y="290" width="200" height="56" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="130" y="324" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Type</text><rect x="240" y="290" width="630" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="256" y="322.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Non-official, quantitative</text><rect x="30" y="354" width="200" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="130" y="388" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Useful for</text><rect x="240" y="354" width="630" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="256" y="386.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Showing a common reason among these hostel users</text><rect x="30" y="418" width="200" height="56" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="130" y="452" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Representativeness</text><rect x="240" y="418" width="630" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="256" y="450.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only hostel users: young people on friends’ sofas are missing</text><rect x="30" y="482" width="200" height="68" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="130" y="522" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Bias</text><rect x="240" y="482" width="630" height="68" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="256" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The charity has an interest in showing family breakdown as a cause; may</text><text x="256" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">affect question wording</text><rect x="30" y="558" width="200" height="56" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="130" y="592" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Validity</text><rect x="240" y="558" width="630" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="256" y="580.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A tick-box reason may simplify complex situations; interviews could add</text><text x="256" y="601.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">depth</text><line x1="450" y1="266" x2="450" y2="286" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="630" width="840" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="660" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="686" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Useful evidence of a pattern among hostel users, but not proof of the main cause of youth</text><text x="50" y="707" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">homelessness in general.</text>
</svg>