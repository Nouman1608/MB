<rect width="900" height="539" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five types of injunction</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">An equitable remedy: not available as of right</text>
<text x="450" y="142" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">WHAT IT ORDERS</text><rect x="30" y="156" width="412" height="85" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="236" y="189.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Prohibitory</text><text x="236" y="218.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Stop doing something; the usual form in nuisance</text><rect x="458" y="156" width="412" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="664" y="189.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Mandatory</text><text x="664" y="218.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Do something, such as remove an obstruction</text><text x="450" y="285" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">WHEN IT IS GRANTED</text><rect x="30" y="299" width="249.33333333333334" height="144" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="154.66666666666669" y="330.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Quia timet</text><text x="154.66666666666669" y="359.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Prevents a threatened</text><text x="154.66666666666669" y="380.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">wrong that has not yet</text><text x="154.66666666666669" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">occurred</text><line x1="285.33333333333337" y1="371" x2="319.33333333333337" y2="371" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="299" width="249.33333333333334" height="144" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="330.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interim</text><text x="450.00000000000006" y="359.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Temporary, before trial:</text><text x="450.00000000000006" y="380.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">balance of convenience</text><text x="450.00000000000006" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">(<tspan font-style="italic">American</tspan> <tspan font-style="italic">Cyanamid</tspan> <tspan font-style="italic">v</tspan></text><text x="450.00000000000006" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Ethicon</tspan>, 1975)</text><line x1="580.6666666666667" y1="371" x2="614.6666666666667" y2="371" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="299" width="249.33333333333334" height="144" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745.3333333333334" y="330.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Final</text><text x="745.3333333333334" y="359.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Granted after trial</text><line x1="40" y1="473" x2="850" y2="473" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><text x="170" y="501" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">before the wrong</text><text x="450" y="501" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">before trial</text><text x="730" y="501" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after trial</text>
</svg>