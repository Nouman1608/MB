<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Personal injury damages: two ways to divide them</text>

<text x="450" y="118" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BY TYPE OF LOSS</text><rect x="30" y="132" width="412" height="159" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="164.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pecuniary (financial)</text><text x="48" y="193.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="193.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Earnings lost before trial</text><text x="48" y="218.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="218.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Future loss of earnings</text><text x="48" y="243.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="243.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Medical and care costs</text><text x="48" y="268.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="268.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Adapting a home or buying equipment</text><rect x="458" y="132" width="412" height="159" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="164.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Non-pecuniary (non-financial)</text><text x="476" y="193.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="193.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pain and suffering</text><text x="476" y="218.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="218.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Loss of amenity: inability to enjoy life as before,</text><text x="491.2" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such as sport or hobbies</text><text x="450" y="331" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BY HOW THEY ARE PROVED</text><rect x="30" y="345" width="412" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="377.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Special damages</text><text x="48" y="406.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="406.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Calculated precisely up to the date of trial:</text><text x="63.2" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wages lost, receipts for treatment</text><text x="48" y="452.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="452.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Must be specifically pleaded and proved</text><rect x="458" y="345" width="412" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="377.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">General damages</text><text x="476" y="406.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="406.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assessed by the court: pain, suffering, loss of</text><text x="491.2" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">amenity, future losses</text><text x="476" y="452.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="452.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Guidelines and previous awards keep amounts</text><text x="491.2" y="473.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consistent (<tspan font-style="italic">Heil</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Rankin</tspan>, 2000)</text><rect x="30" y="518" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="552" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUTURE LOSSES</text><rect x="50" y="570" width="190" height="48" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="600" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Annual loss</text><text x="262" y="602" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">×</text><rect x="285" y="570" width="250" height="48" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="410" y="600" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Years it will continue</text><line x1="545" y1="594" x2="585" y2="594" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="595" y="570" width="255" height="48" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="722.5" y="600" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Adjusted for investment</text>
</svg>