<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Damage to property: the measure</text>

<rect x="250" y="100" width="400" height="53" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="131.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Is repair reasonable?</text><rect x="30" y="207" width="400" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="248.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">YES</text><text x="230" y="276.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cost of repair</text><rect x="470" y="207" width="400" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="670" y="237" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">NO: DESTROYED OR UNECONOMIC</text><text x="670" y="263.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Diminution in value, or market value of</text><text x="670" y="287.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">a replacement</text><line x1="370" y1="157" x2="240" y2="201" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="530" y1="157" x2="660" y2="201" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="345" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="30" y="361" width="840" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="391" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PLUS CONSEQUENTIAL LOSSES</text><text x="48" y="422.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hiring a replacement car while yours is repaired</text><text x="48" y="447.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Profit lost while a damaged machine is out of use</text><text x="48" y="472.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="472.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Lagden</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">O’Connor</tspan> (2003): a claimant who could not afford ordinary hire recovered the higher cost of a</text><text x="63.2" y="493.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">credit hire car; his lack of money was a consequence of the situation the defendant must take as found</text>
</svg>