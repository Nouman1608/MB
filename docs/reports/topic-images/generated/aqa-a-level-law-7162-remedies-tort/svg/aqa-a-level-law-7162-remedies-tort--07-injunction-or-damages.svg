<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Injunction or damages instead?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The court’s discretion once a nuisance is proved</text>
<rect x="30" y="124" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE COURT MAY REFUSE AN INJUNCTION WHERE</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">damages are adequate</text><text x="48" y="209.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the claimant has delayed or acted unfairly</text><text x="48" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it would be oppressive</text><rect x="30" y="280" width="270.6666666666667" height="168" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="308" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIMITED</text><text x="46" y="334.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kennaway v Thompson</text><text x="46" y="357.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">(1981)</text><text x="46" y="385.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Powerboat racing restricted in</text><text x="46" y="406.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">number and noise of events,</text><text x="46" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not stopped</text><rect x="314.6666666666667" y="280" width="270.6666666666667" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="308" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">REFUSED: PUBLIC INTEREST</text><text x="330.6666666666667" y="334.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Miller v Jackson (1977)</text><text x="330.6666666666667" y="362.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cricket continued; damages</text><text x="330.6666666666667" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">instead</text><rect x="599.3333333333334" y="280" width="270.6666666666667" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="308" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DAMAGES INSTEAD</text><text x="615.3333333333334" y="334.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dennis v MoD (2003)</text><text x="615.3333333333334" y="362.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Military jet noise was a</text><text x="615.3333333333334" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nuisance; the public interest in</text><text x="615.3333333333334" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">training pilots meant damages</text><text x="615.3333333333334" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">instead</text><rect x="30" y="472" width="840" height="216" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="502" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DAMAGES IN LIEU: s50 SENIOR COURTS ACT 1981 (ORIGINALLY LORD CAIRNS’ ACT 1858)</text><text x="50" y="532" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Shelfer</tspan> (1895), A.L. Smith LJ: damages should replace an injunction only if</text><rect x="50" y="546" width="191" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145.5" y="580.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Injury is small</text><rect x="253" y="546" width="191" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="348.5" y="570.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Can be estimated in</text><text x="348.5" y="590.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">money</text><rect x="456" y="546" width="191" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="551.5" y="570.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">A small payment</text><text x="551.5" y="590.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">compensates</text><rect x="659" y="546" width="191" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="754.5" y="570.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Injunction would be</text><text x="754.5" y="590.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">oppressive</text><line x1="50" y1="622" x2="850" y2="622" stroke="#8a6d0d" stroke-width="1.5"/><text x="50" y="640" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Coventry</tspan> <tspan font-weight="700">v</tspan> <tspan font-weight="700">Lawrence</tspan> <tspan font-weight="700">(2014):</tspan> this working rule must not be applied mechanically; wide discretion,</text><text x="50" y="661" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">including public benefit and planning permission.</text>
</svg>