<rect width="900" height="681" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mitigation: Ria’s van</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Invented figures from the lesson’s example</text>
<rect x="30" y="124" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="60" y1="424" x2="840" y2="424" stroke="#1e2a44" stroke-width="2.5"/><rect x="90" y="250" width="120" height="174" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="238" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">£3,000</text><text x="150" y="450" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Repairs</text><rect x="300" y="308" width="120" height="116" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="360" y="296" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">£2,000</text><text x="360" y="450" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Lost earnings claimed</text><rect x="480" y="377.6" width="120" height="46.400000000000006" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="540" y="365.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">£800</text><text x="540" y="450" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Hire at £80 × 10 days</text><rect x="680" y="203.6" width="120" height="220.4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="191.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">£3,800</text><text x="740" y="450" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Total recoverable</text><line x1="300" y1="308" x2="420" y2="424" stroke="#b5602e" stroke-width="4"/><line x1="420" y1="308" x2="300" y2="424" stroke="#b5602e" stroke-width="4"/><line x1="680" y1="377.6" x2="800" y2="377.6" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><text x="740" y="406.8" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">£800</text><text x="740" y="290.79999999999995" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">£3,000</text><text x="450" y="158" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Van out of use for 10 days; she hires nothing</text><rect x="30" y="506" width="270.6666666666667" height="143" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="534" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE RULE</text><text x="46" y="565.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Take <tspan font-weight="700" fill="#1e2a44">reasonable</tspan> <tspan font-weight="700" fill="#1e2a44">steps</tspan> to limit</text><text x="46" y="586.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the loss. The avoidable part is</text><text x="46" y="607.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lost, but the reasonable cost of</text><text x="46" y="628.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the steps is recoverable.</text><rect x="314.6666666666667" y="506" width="270.6666666666667" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="535.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Darbishire v Warran (1963)</text><text x="330.6666666666667" y="562.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repairs far above market</text><text x="330.6666666666667" y="583.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">value: only the market value</text><text x="330.6666666666667" y="604.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was recovered.</text><rect x="599.3333333333334" y="506" width="270.6666666666667" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="535.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Geest plc v Lansiquot</text><text x="615.3333333333334" y="556.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(2002)</text><text x="615.3333333333334" y="583.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The <tspan font-weight="700" fill="#1e2a44">defendant</tspan> bears the</text><text x="615.3333333333334" y="604.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">burden of proving a failure to</text><text x="615.3333333333334" y="625.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mitigate.</text>
</svg>