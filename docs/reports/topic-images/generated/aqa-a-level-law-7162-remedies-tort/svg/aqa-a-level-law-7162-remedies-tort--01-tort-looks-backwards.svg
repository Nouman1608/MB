<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 651" width="900" height="651" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="651" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Compensatory damages: which position?</text>

<rect x="30" y="100" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="70" y1="272" x2="830" y2="272" stroke="#1e2a44" stroke-width="3"/><circle cx="170" cy="272" r="13" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="170" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Before the tort</text><text x="170" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">claimant’s position</text><circle cx="450" cy="272" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tort committed</text><text x="450" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">loss suffered</text><circle cx="730" cy="272" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="730" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Contract performed</text><text x="730" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">position if promised</text><path d="M440,250 Q305,172 182,246" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="310" y="182" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">TORT: look backwards</text><path d="M460,250 Q595,172 718,246" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#ahO)"/><text x="590" y="182" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">CONTRACT: look forwards</text><text x="450" y="138" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Damages put the claimant, so far as money can, in a position …</text><rect x="30" y="392" width="412" height="147" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="422" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIVINGSTONE v RAWYARDS COAL CO (1880)</text><text x="48" y="453.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lord Blackburn: the sum that puts the injured</text><text x="48" y="474.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">party in the same position as if they had not</text><text x="48" y="495.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sustained the wrong.</text><rect x="458" y="392" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="422" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ONCE AND FOR ALL</text><text x="476" y="453.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usually a <tspan font-weight="700" fill="#1e2a44">lump</tspan> <tspan font-weight="700" fill="#1e2a44">sum</tspan>: the claimant cannot return</text><text x="476" y="474.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">because their condition turns out worse, except</text><text x="476" y="495.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">under provisional damages or periodical</text><text x="476" y="516.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">payments.</text><rect x="30" y="561" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="594.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> describing contract-style “expectation” damages in a tort answer.</text>
</svg>