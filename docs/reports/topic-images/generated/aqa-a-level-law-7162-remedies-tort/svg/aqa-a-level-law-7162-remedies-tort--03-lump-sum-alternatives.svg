<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 418" width="900" height="418" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="418" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paying for the future: three routes</text>

<rect x="30" y="100" width="270.6666666666667" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="132.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lump sum</text><text x="48" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The usual form. Paid once and</text><text x="48" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for all. Cannot return to court if</text><text x="48" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the condition turns out worse</text><text x="48" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">than expected.</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="168" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="332.6666666666667" y="132.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Provisional damages</text><text x="332.6666666666667" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Under s32A Senior Courts Act</text><text x="332.6666666666667" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1981 the claimant may return</text><text x="332.6666666666667" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to court if a specified serious</text><text x="332.6666666666667" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deterioration, such as</text><text x="332.6666666666667" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">epilepsy, later develops.</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="617.3333333333334" y="132.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Periodical payments</text><text x="617.3333333333334" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Under the Damages Act 1996</text><text x="617.3333333333334" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">future losses are paid</text><text x="617.3333333333334" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regularly over time, reducing</text><text x="617.3333333333334" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the risk that a lump sum runs</text><text x="617.3333333333334" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">out or proves too large.</text><rect x="30" y="294" width="270.6666666666667" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="52" y1="350" x2="278.6666666666667" y2="350" stroke="#1e2a44" stroke-width="2.5"/><text x="278.6666666666667" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time</text><rect x="56" y="310" width="34" height="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="102" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">one payment</text><rect x="314.6666666666667" y="294" width="270.6666666666667" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="336.6666666666667" y1="350" x2="563.3333333333334" y2="350" stroke="#1e2a44" stroke-width="2.5"/><text x="563.3333333333334" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time</text><rect x="340.6666666666667" y="320" width="30" height="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="493.33333333333337" y="320" width="30" height="30" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="481.33333333333337" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">if it worsens</text><rect x="599.3333333333334" y="294" width="270.6666666666667" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="621.3333333333334" y1="350" x2="848" y2="350" stroke="#1e2a44" stroke-width="2.5"/><text x="848" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time</text><rect x="625.3333333333334" y="332" width="18" height="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="653.3333333333334" y="332" width="18" height="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="681.3333333333334" y="332" width="18" height="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="709.3333333333334" y="332" width="18" height="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="737.3333333333334" y="332" width="18" height="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="765.3333333333334" y="332" width="18" height="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="793.3333333333334" y="332" width="18" height="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="821.3333333333334" y="332" width="18" height="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/>
</svg>