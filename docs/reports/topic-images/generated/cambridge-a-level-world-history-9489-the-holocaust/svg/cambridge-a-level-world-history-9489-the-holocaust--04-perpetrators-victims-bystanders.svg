<rect width="900" height="431" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Perpetrators, victims, bystanders</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three further debates an extract may open</text>
<rect x="30" y="124" width="270.6666666666667" height="275" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="45" y="162.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PERPETRATORS</text><text x="45" y="188.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Who killed, and why?</text><text x="45" y="216.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="59.25" y="216.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hilberg (1961): bureaucratic</text><text x="59.25" y="236.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">process</text><text x="45" y="260.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="59.25" y="260.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Arendt: "the banality of evil"</text><text x="45" y="284.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="59.25" y="284.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Browning (1992): conformity;</text><text x="59.25" y="304.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Goldhagen: conviction</text><text x="45" y="328.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="59.25" y="328.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Gross (2001); Paxton and</text><text x="59.25" y="348.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Marrus; Snyder (2010):</text><text x="59.25" y="368.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">non-German participation</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="275" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="329.6666666666667" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VICTIMS</text><text x="329.6666666666667" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What counts as</text><text x="329.6666666666667" y="200.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">resistance?</text><text x="329.6666666666667" y="228" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.9166666666667" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hilberg, Arendt: criticised the</text><text x="343.9166666666667" y="248" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Judenräte</text><text x="329.6666666666667" y="272" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.9166666666667" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Bauer: amidah, "standing up</text><text x="343.9166666666667" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">against"</text><text x="329.6666666666667" y="316" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.9166666666667" y="316" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ringelblum's Oneg Shabbat</text><text x="343.9166666666667" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">archive</text><text x="329.6666666666667" y="360" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.9166666666667" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Warsaw (1943); Treblinka,</text><text x="343.9166666666667" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sobibór; Bielski partisans</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="275" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="614.3333333333334" y="162.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BYSTANDERS</text><text x="614.3333333333334" y="188.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Could more be done?</text><text x="614.3333333333334" y="216.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5833333333334" y="216.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Evian (1938); White Paper</text><text x="628.5833333333334" y="236.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1939)</text><text x="614.3333333333334" y="260.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5833333333334" y="260.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Riegner telegram (August</text><text x="628.5833333333334" y="280.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1942); Bermuda (1943)</text><text x="614.3333333333334" y="304.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5833333333334" y="304.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">No bombing of Auschwitz</text><text x="628.5833333333334" y="324.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1944)</text><text x="614.3333333333334" y="348.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5833333333334" y="348.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Wyman, Wasserstein: yes;</text><text x="628.5833333333334" y="368.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Rubinstein: little more</text>
</svg>