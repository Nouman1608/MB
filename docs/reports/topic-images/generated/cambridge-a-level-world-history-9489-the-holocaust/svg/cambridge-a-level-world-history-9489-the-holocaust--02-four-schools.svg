<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 747" width="900" height="747" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="747" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four ways to explain the Holocaust</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">What each school puts at the centre</text>
<rect x="30" y="124" width="412" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LONG-TERM IDEAS</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Roots before 1933</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mosse (völkisch ideas); Goldhagen (1996):</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"eliminationist antisemitism". Critics: German</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Jews integrated before 1914</text><rect x="458" y="124" width="412" height="154" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTENTIONALISM</text><text x="478" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hitler's plan</text><text x="478" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dawidowicz (1975), Fleming (1982), Jäckel: the</text><text x="478" y="243.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1919 letter, Mein Kampf, the 1939 prophecy</text><rect x="30" y="294" width="412" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="326" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRUCTURALISM</text><text x="50" y="352.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Nazi state</text><text x="50" y="381.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Broszat (1969), Mommsen: polycracy and</text><text x="50" y="402.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cumulative radicalisation; perhaps no single</text><text x="50" y="423.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">written order</text><rect x="458" y="294" width="412" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="336.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTIONALISM</text><text x="478" y="363.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Circumstance and war</text><text x="478" y="392.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Schleunes (1970): "the twisted road"; Aly: failed</text><text x="478" y="413.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resettlement schemes</text><rect x="30" y="470" width="840" height="134" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="502" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SYNTHESIS</text><text x="50" y="529.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ideology set the goal; war set the pace</text><text x="50" y="558.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kershaw: "working towards the Führer"; Browning (2004): decisions in stages in 1941; Gerlach:</text><text x="50" y="579.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">December 1941; Friedländer: "redemptive antisemitism"</text><rect x="30" y="626" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="660.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Not the same thing</text><text x="450" y="690.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Structuralism looks at <tspan font-weight="700" fill="#1e2a44">institutions</tspan>; functionalism at <tspan font-weight="700" fill="#1e2a44">circumstances</tspan>. The syllabus separates them.</text>
</svg>