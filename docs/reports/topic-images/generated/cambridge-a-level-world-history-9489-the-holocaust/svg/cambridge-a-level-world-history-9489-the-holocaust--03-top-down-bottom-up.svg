<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ordered from above, or invented below?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Where historians sit on how decisions were made</text>
<text x="40" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">FROM THE TOP: HITLER</text><text x="860" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">FROM BELOW: OFFICIALS AND CIRCUMSTANCE</text><defs><linearGradient id="sg124" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="169" width="780" height="26" rx="13" fill="url(#sg124)" stroke="#1e2a44" stroke-width="2.5"/><path d="M99,195 L99,218 L110,232 L110,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="99" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M294,195 L294,218 L280,232 L280,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="294" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M450,195 L450,218 L450,232 L450,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="450" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M645,195 L645,218 L620,232 L620,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="645" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M801,195 L801,218 L790,232 L790,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="801" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="252" width="160" height="131" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="110" y="278.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Dawidowicz,</text><text x="110" y="298.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Fleming</text><text x="110" y="325" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">An early decision,</text><text x="110" y="345" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">waiting for the</text><text x="110" y="365" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">moment</text><rect x="200" y="252" width="160" height="131" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="280" y="288.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Gerlach</text><text x="280" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Hitler announces</text><text x="280" y="335" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a decision,</text><text x="280" y="355" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">December 1941</text><rect x="370" y="252" width="160" height="131" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="278.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Kershaw,</text><text x="450" y="298.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Browning</text><text x="450" y="325" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">"Working towards</text><text x="450" y="345" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the Führer";</text><text x="450" y="365" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">stages in 1941</text><rect x="540" y="252" width="160" height="131" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="278.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Schleunes, Aly</text><text x="620" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Improvised</text><text x="620" y="325" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">responses to</text><text x="620" y="345" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">self-made</text><text x="620" y="365" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">problems</text><rect x="710" y="252" width="160" height="131" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="790" y="278.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Broszat,</text><text x="790" y="298.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Mommsen</text><text x="790" y="325" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Regional initiative;</text><text x="790" y="345" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">cumulative</text><text x="790" y="365" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">radicalisation</text>
