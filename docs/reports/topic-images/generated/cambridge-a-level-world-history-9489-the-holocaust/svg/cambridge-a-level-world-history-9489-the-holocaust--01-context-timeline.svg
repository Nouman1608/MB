<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From persecution to murder, 1933-44</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">1938-44 drawn to scale: the dates you test extracts against</text>
<rect x="30" y="124" width="411" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APRIL 1933</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Boycott</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Jews removed from the civil service</text><rect x="459" y="124" width="411" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="170" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEPTEMBER 1935</text><text x="479" y="196.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nuremberg Laws</text><line x1="96" y1="301" x2="870" y2="301" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="307" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1938</text><line x1="96" y1="429" x2="870" y2="429" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="435" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1939</text><line x1="96" y1="557" x2="870" y2="557" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="563" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1940</text><line x1="96" y1="685" x2="870" y2="685" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="691" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1941</text><line x1="96" y1="813" x2="870" y2="813" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="819" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1942</text><line x1="96" y1="941" x2="870" y2="941" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="947" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1943</text><line x1="96" y1="1069" x2="870" y2="1069" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="1075" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1944</text><line x1="470" y1="301" x2="470" y2="1094.6000000000058" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="430" y="271" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">NAZI POLICY</text><text x="510" y="271" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WAR AND THE WORLD</text><path d="M470,365 L486,365 L504,365" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="350.4" width="240.35200000000003" height="46" fill="#f4f6f6"/><text x="510" y="369.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">July 1938</text><text x="510" y="390.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Evian Conference on refugees</text><path d="M470,407.66666666665697 L454,407.66666666665697 L436,407.66666666665697" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="301.304" y="393.06666666665694" width="133.696" height="46" fill="#f4f6f6"/><text x="430" y="411.86666666665695" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">November 1938</text><text x="430" y="432.86666666665695" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Kristallnacht</text><path d="M470,439.14207650272874 L454,439.14207650272874 L436,459.66666666665697" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="200.952" y="445.06666666665694" width="234.048" height="46" fill="#f4f6f6"/><text x="430" y="463.86666666665695" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">30 January 1939</text><text x="430" y="484.86666666665695" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Hitler's Reichstag "prophecy"</text><path d="M470,514.333333333343 L454,514.333333333343 L436,514.333333333343" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="177.89599999999996" y="499.733333333343" width="257.10400000000004" height="67" fill="#f4f6f6"/><text x="430" y="518.533333333343" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">From 1939</text><text x="430" y="539.533333333343" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">T4 murders; ghettos in occupied</text><text x="430" y="560.533333333343" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Poland</text><path d="M470,621 L454,621 L436,621" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="200.90399999999997" y="606.4" width="234.09600000000003" height="67" fill="#f4f6f6"/><text x="430" y="625.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1940</text><text x="430" y="646.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Madagascar plan considered,</text><text x="430" y="667.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">abandoned</text><path d="M470,738.333333333343 L486,738.333333333343 L504,738.333333333343" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="723.733333333343" width="296.31999999999994" height="67" fill="#f4f6f6"/><text x="510" y="742.533333333343" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">June 1941</text><text x="510" y="763.533333333343" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Invasion of the USSR; Einsatzgruppen</text><text x="510" y="784.533333333343" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shootings</text><path d="M470,759.4918032786809 L454,759.4918032786809 L436,759.4918032786809" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="155.01600000000002" y="744.8918032786809" width="279.984" height="67" fill="#f4f6f6"/><text x="430" y="763.6918032786808" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">31 July 1941</text><text x="430" y="784.6918032786808" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Göring authorises Heydrich: a "total</text><text x="430" y="805.6918032786808" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">solution"</text><path d="M470,802.333333333343 L486,802.333333333343 L504,811.333333333343" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="796.733333333343" width="323.264" height="46" fill="#f4f6f6"/><text x="510" y="815.533333333343" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">December 1941</text><text x="510" y="836.533333333343" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gassing at Chełmno; USA enters the war</text><path d="M470,819.6448087431781 L454,819.6448087431781 L436,832.4918032786809" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="260.48799999999994" y="817.8918032786809" width="174.51200000000003" height="46" fill="#f4f6f6"/><text x="430" y="836.6918032786808" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">20 January 1942</text><text x="430" y="857.6918032786808" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Wannsee Conference</text><path d="M470,877 L454,877 L436,884.4918032786809" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="153.52800000000002" y="869.8918032786809" width="281.472" height="67" fill="#f4f6f6"/><text x="430" y="888.6918032786808" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1942-43</text><text x="430" y="909.6918032786808" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Bełżec, Sobibór, Treblinka;</text><text x="430" y="930.6918032786808" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">deportations to Auschwitz-Birkenau</text><path d="M470,973 L486,973 L504,973" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="958.4" width="271.63199999999995" height="67" fill="#f4f6f6"/><text x="510" y="977.1999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">April 1943</text><text x="510" y="998.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Warsaw Ghetto Uprising; Bermuda</text><text x="510" y="1019.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conference</text><path d="M470,1069 L486,1069 L504,1069" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="1054.4" width="184.768" height="46" fill="#f4f6f6"/><text x="510" y="1073.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">January 1944</text><text x="510" y="1094.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">US War Refugee Board</text><circle cx="470" cy="365" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="407.66666666665697" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="439.14207650272874" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="514.333333333343" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="621" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="738.333333333343" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="759.4918032786809" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="802.333333333343" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="819.6448087431781" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="877" r="7" fill="#b5d3