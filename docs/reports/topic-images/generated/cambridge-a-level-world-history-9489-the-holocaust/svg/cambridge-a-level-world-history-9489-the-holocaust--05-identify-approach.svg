<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 651" width="900" height="651" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="651" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Identifying the approach</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A constructed sentence, read for interpretation and approach</text>
<rect x="30" y="124" width="840" height="208" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="159" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">"The killing in the east was </text><rect x="318.635" y="139" width="242.061" height="30" rx="5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="321.635" y="159" font-size="21" font-weight="600" fill="#1e2a44" text-anchor="start">not ordered from Berlin</text><text x="50" y="201" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">so much as </text><rect x="166.49" y="181" width="242.124" height="30" rx="5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="169.49" y="201" font-size="21" font-weight="600" fill="#1e2a44" text-anchor="start">invented on the ground</text><text x="405.61400000000003" y="201" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">, by men</text><rect x="47" y="223" width="114.339" height="30" rx="5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="50" y="243" font-size="21" font-weight="600" fill="#1e2a44" text-anchor="start">competing</text><text x="164.24" y="243" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">to show their superiors how ruthlessly</text><text x="50" y="285" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start">they could solve the 'Jewish problem'."</text><rect x="30" y="354" width="411" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="386" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERPRETATION</text><text x="50" y="412.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Murder emerged from below</text><text x="50" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Through rivalry and initiative</text><rect x="459" y="354" width="411" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="386" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APPROACH</text><text x="479" y="412.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Structuralist / functionalist</text><text x="479" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Regional officials; a competitive state</text><rect x="30" y="487" width="411" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="519" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPPORT</text><text x="50" y="545.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Initiative in the east</text><text x="50" y="573.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Einsatzgruppen escalation, summer 1941;</text><text x="50" y="594.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Warthegau gassings at Chełmno</text><rect x="459" y="487" width="411" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="519" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CHALLENGE</text><text x="479" y="545.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Central direction</text><text x="479" y="573.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The 1939 prophecy; Göring's July 1941</text><text x="479" y="594.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">authorisation; Wannsee</text>
</svg>