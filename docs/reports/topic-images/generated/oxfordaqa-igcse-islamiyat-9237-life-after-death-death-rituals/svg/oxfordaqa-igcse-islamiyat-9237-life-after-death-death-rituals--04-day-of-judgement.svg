<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 429" width="900" height="429" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="429" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Day of Judgement: five features</text>

<rect x="30" y="104" width="270.6666666666667" height="151" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="139.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">The book of deeds</text><text x="50" y="167.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kept by the Kiraman</text><text x="50" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Katibeen; right hand for</text><text x="50" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the righteous, left for the</text><text x="50" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wicked (69:19-25)</text><rect x="314.6666666666667" y="104" width="270.6666666666667" height="151" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="139.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">The scales</text><text x="334.6666666666667" y="167.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“No soul will be treated</text><text x="334.6666666666667" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unjustly at all” (21:47)</text><rect x="599.3333333333334" y="104" width="270.6666666666667" height="151" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="139.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Nothing is too small</text><text x="619.3333333333334" y="167.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Whoever does an atom’s</text><text x="619.3333333333334" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weight of good will see it”</text><text x="619.3333333333334" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(99:7-8)</text><rect x="30" y="269" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="304.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Witnesses</text><text x="50" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The body itself will testify: hands speak,</text><text x="50" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">feet testify (36:65)</text><rect x="457" y="269" width="413" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="304.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Mercy</text><text x="477" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Allah’s mercy is greater than His anger; the</text><text x="477" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prophet (pbuh) permitted to intercede</text><text x="477" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(shafa’ah)</text>
</svg>