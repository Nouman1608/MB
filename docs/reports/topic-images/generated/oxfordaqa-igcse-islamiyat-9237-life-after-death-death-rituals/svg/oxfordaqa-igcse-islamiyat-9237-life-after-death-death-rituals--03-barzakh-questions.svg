<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" width="900" height="505" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="505" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Barzakh: the questioning in the grave</text>

<text x="450" y="124" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Two angels, often named Munkar and Nakir, ask three questions</text><rect x="30" y="150" width="268" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="199.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who is your Lord?</text><rect x="316" y="150" width="268" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="187.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What is your</text><text x="450" y="212.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">religion?</text><rect x="602" y="150" width="268" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="187.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who is this man who</text><text x="736" y="212.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">was sent to you?</text><rect x="30" y="258" width="408" height="119" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="294.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">A believer</text><text x="50" y="325.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="325.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Answers correctly</text><text x="50" y="352.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="352.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The grave becomes a place of peace</text><rect x="462" y="258" width="408" height="119" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="294.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">A disbeliever</text><text x="482" y="325.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="325.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cannot answer</text><rect x="30" y="395" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="428.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Barzakh is a foretaste of reward or punishment, not the final outcome: “behind them is a</text><text x="50" y="450.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">barrier until the Day they are resurrected” (23:100).</text>
</svg>