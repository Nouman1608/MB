<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The stages after death</text>

<line x1="62" y1="124" x2="62" y2="606" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Death (Mawt)</text><text x="128" y="167.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">At the decreed time; the Angel of Death takes the soul. “Indeed we belong to Allah…”</text><text x="128" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(2:156).</text><circle cx="62" cy="158.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="167.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="223" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="258.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Barzakh: the barrier</text><text x="128" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Between death and resurrection (23:100); questioning in the grave; a foretaste, not the</text><text x="128" y="307.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">final outcome.</text><circle cx="62" cy="277.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="286.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="342" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="377.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Resurrection (Qiyamah)</text><text x="128" y="405.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Israfil (AS) blows the trumpet; all raised in body and soul (39:68).</text><circle cx="62" cy="386" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="394.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="440" width="762" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="475.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Day of Judgement (Yaum ad-Din)</text><text x="128" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Book of deeds, scales of justice, witnesses and mercy.</text><circle cx="62" cy="484" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="492.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="538" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="573.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Jannah or Jahannam</text><text x="128" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gardens and nearness to Allah, or fire and regret (80:34-42 contrasts the two groups).</text><circle cx="62" cy="582" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="590.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>