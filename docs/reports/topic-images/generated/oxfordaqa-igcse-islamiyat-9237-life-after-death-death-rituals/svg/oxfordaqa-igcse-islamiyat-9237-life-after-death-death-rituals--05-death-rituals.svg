<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Death rituals, in order</text>

<text x="228.5" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">What is done</text><text x="671.5" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Why it matters</text><rect x="30" y="140" width="397" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="168" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Near death: Qur’an read (often Surah Yasin);</text><text x="46" y="188" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the Shahadah gently encouraged</text><line x1="433" y1="174" x2="467" y2="174" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="140" width="397" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="168" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Last words affirm Tawhid</text><rect x="30" y="222" width="397" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="250" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">At death: eyes closed, body straightened and</text><text x="46" y="270" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">covered</text><line x1="433" y1="256" x2="467" y2="256" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="222" width="397" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="250" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Respect; acceptance of Allah’s will</text><rect x="30" y="304" width="397" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="332" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Ghusl: washed by family of the same sex, an odd</text><text x="46" y="352" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">number of times</text><line x1="433" y1="338" x2="467" y2="338" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="304" width="397" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="332" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Purity; a last service from the family</text><rect x="30" y="386" width="397" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="414" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Kafan: plain white cloth (Sunni: usually three</text><text x="46" y="434" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sheets for a man, five for a woman)</text><line x1="433" y1="420" x2="467" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="386" width="397" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="414" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Equality: rich and poor shrouded alike</text><rect x="30" y="468" width="397" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Salat al-Janazah: standing, no bowing or</text><text x="46" y="516" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">prostration</text><line x1="433" y1="502" x2="467" y2="502" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="468" width="397" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The community asks forgiveness</text><rect x="30" y="550" width="397" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="578" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Burial: soon, on the right side facing the</text><text x="46" y="598" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Qiblah; grave kept simple</text><line x1="433" y1="584" x2="467" y2="584" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="550" width="397" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="578" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A reminder of death; no extravagance</text><rect x="30" y="632" width="397" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="660" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mourning: generally three days; iddah of four</text><text x="46" y="680" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">months and ten days (2:234)</text><line x1="433" y1="666" x2="467" y2="666" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="632" width="397" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="660" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Grief allowed; widow’s rights protected</text>
</svg>