<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" width="900" height="412" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="412" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why belief in Akhirah shapes life</text>

<rect x="30" y="104" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">QUR’AN 3:185</text><text x="450" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“Every soul will taste death, and you will only be given your [full]</text><text x="450" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">compensation on the Day of Resurrection”</text><rect x="30" y="230" width="268" height="152" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="266" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Accountability</text><text x="50" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Every action will be</text><text x="50" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">judged, so Muslims try to</text><text x="50" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">act well when no one is</text><text x="50" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">watching.</text><rect x="316" y="230" width="268" height="152" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="266" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Justice</text><text x="336" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wrongs unpunished in this</text><text x="336" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">life will be put right,</text><text x="336" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">giving hope to the</text><text x="336" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">oppressed.</text><rect x="602" y="230" width="268" height="152" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="266" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Perspective</text><text x="622" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wealth and status end at</text><text x="622" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">death, so Muslims are</text><text x="622" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">encouraged not to be greedy</text><text x="622" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or proud.</text>
</svg>