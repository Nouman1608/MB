<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" width="900" height="548" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="548" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Different Muslim death rituals</text>

<rect x="30" y="104" width="190" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Practice</text><rect x="220" y="104" width="330" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="232" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">One view or custom</text><rect x="550" y="104" width="320" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="562" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Another view or custom</text><rect x="30" y="150" width="190" height="42" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="174.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Janazah takbirs</text><rect x="220" y="150" width="330" height="42" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sunni: four takbirs</text><rect x="550" y="150" width="320" height="42" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="562" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Shi’a: five takbirs</text><rect x="30" y="192" width="190" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="216.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Showing grief</text><rect x="220" y="192" width="330" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="216.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Tears permitted; loud wailing and</text><text x="232" y="236.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">tearing clothes discouraged in Hadith</text><rect x="550" y="192" width="320" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="562" y="216.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">How openly grief is shown varies</text><text x="562" y="236.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">between cultures</text><rect x="30" y="254" width="190" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="278.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Gatherings after</text><text x="42" y="298.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">burial</text><rect x="220" y="254" width="330" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="278.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Some, especially in South Asia, gather</text><text x="232" y="298.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">on set days (third, fortieth) to read</text><text x="232" y="318.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Qur’an</text><rect x="550" y="254" width="320" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="562" y="278.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Others see these as cultural custom,</text><text x="562" y="298.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">not religious requirement</text><rect x="30" y="336" width="190" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="360.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Visiting graves</text><rect x="220" y="336" width="330" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="360.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Encouraged to remember death; some</text><text x="232" y="380.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">visit and pray there regularly</text><rect x="550" y="336" width="320" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="562" y="360.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Some object to building over graves or</text><text x="562" y="380.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">asking anything of the dead</text><rect x="30" y="416" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="449.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Muslims do not cremate; where law delays burial, they still bury as soon as they can. In</text><text x="50" y="471.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sunni practice a martyr (shaheed) is traditionally buried in their clothes, without ghusl,</text><text x="50" y="493.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">as a sign of honour.</text>
</svg>