<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 358" width="900" height="358" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="358" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When deeds end, three continue</text>

<rect x="30" y="104" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">HADITH, SAHIH MUSLIM</text><text x="450" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">When a person dies their deeds end except for three</text><rect x="30" y="208" width="268" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="243.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Ongoing charity</text><text x="164" y="272.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. building wells</text><rect x="316" y="208" width="268" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="243.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Beneficial knowledge</text><text x="450" y="272.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. funding schools</text><rect x="602" y="208" width="268" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="736" y="243.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">A righteous child</text><text x="736" y="268.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">who prays for them</text><text x="736" y="297.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. praying for parents</text>
</svg>