<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 651" width="900" height="651" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="651" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Acknowledge, then account for it</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three ways to handle a limited source</text>
<rect x="30" y="122" width="269.3333333333333" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">1 Qualify the claim</text><text x="48" y="183.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“suggests”, “may indicate”, “in</text><text x="48" y="202.95000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">this case”</text><rect x="315.3333333333333" y="122" width="269.3333333333333" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="333.3333333333333" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">2 Name the limitation</text><text x="333.3333333333333" y="183.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Although the survey was</text><text x="333.3333333333333" y="202.95000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">small...”</text><rect x="600.6666666666666" y="122" width="269.3333333333333" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="618.6666666666666" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">3 Add other evidence</text><text x="618.6666666666666" y="183.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">pair it with a source that covers</text><text x="618.6666666666666" y="202.95000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the gap, and say so</text><rect x="30" y="254" width="840" height="83.51999999999998" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="48" y="288" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Weak</text><text x="48" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“A survey shows that 9 in 10 people prefer filtered water, so filters are better than tap water.”</text><text x="30" y="380" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Strong</text><rect x="30" y="390" width="208.67952" height="34" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="134.33976" y="412.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A filter company reports</text><text x="134.33976" y="445.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">names the interest</text><rect x="244.67952" y="390" width="530.23728" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="509.79816000000005" y="412.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">that 45 of 50 visitors to its own stand preferred the filtered water,</text><rect x="30" y="474.3" width="570.1848" height="34" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="315.0924" y="496.90000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">but a company’s own visitors are a self-selected and interested group;</text><text x="315.0924" y="529.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">names the limitation</text><rect x="30" y="558.6" width="797.62528" height="34" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="428.81264" y="581.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the claim is better tested by the consumer group’s blind taste tests, where the difference was small.</text><text x="428.81264" y="614.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">adds independent evidence</text>
</svg>