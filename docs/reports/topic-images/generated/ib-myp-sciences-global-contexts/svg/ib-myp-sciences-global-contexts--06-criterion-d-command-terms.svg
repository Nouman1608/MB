2a44" text-anchor="start">strand 1</text><text x="60" y="576" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">strand 2</text><text x="60" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Year 5 descriptors</text><text x="60" y="194" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">strand 1:</text><text x="140" y="194" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">explain how science is applied</text><text x="60" y="220" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">strand 2:</text><text x="140" y="220" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">discuss and evaluate implications</text><text x="60" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Strands 3 and 4: scientific language; documenting sources.</text><text x="450" y="668" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">The top band needs reasoning and a judgement, not a list.</text>
