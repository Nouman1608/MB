<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Global context or factor?</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="150" width="780" height="160" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="3" stroke-dasharray="10 7"/><text x="80" y="182" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Global context = the frame for the whole unit</text><circle cx="450" cy="250" r="44" fill="#fff" stroke="#8a6d0d" stroke-width="4"/><circle cx="450" cy="250" r="30" fill="#f2e7b8"/><path d="M481,281 L520,320" fill="none" stroke="#8a6d0d" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><text x="540" y="240" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Factor = the lens you use</text><text x="540" y="264" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inside a criterion D answer</text><text x="80" y="262" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Factors: moral, ethical, social, economic,</text><text x="80" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">political, cultural, environmental</text><rect x="30" y="360" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Factors that often fit (a Marlbridge planning aid, not an IB rule)</text><rect x="60" y="420" width="420" height="44" rx="10" fill="#dce9e7"/><text x="76" y="449" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Identities and relationships</text><line x1="488" y1="442" x2="530" y2="442" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="540" y="420" width="300" height="44" rx="10" fill="#f2e7b8"/><text x="556" y="449" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">social, ethical</text><rect x="60" y="474" width="420" height="44" rx="10" fill="#dce9e7"/><text x="76" y="503" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Orientation in space and time</text><line x1="488" y1="496" x2="530" y2="496" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="540" y="474" width="300" height="44" rx="10" fill="#f2e7b8"/><text x="556" y="503" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">cultural, social</text><rect x="60" y="528" width="420" height="44" rx="10" fill="#dce9e7"/><text x="76" y="557" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Personal and cultural expression</text><line x1="488" y1="550" x2="530" y2="550" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="540" y="528" width="300" height="44" rx="10" fill="#f2e7b8"/><text x="556" y="557" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">cultural, economic</text><rect x="60" y="582" width="420" height="44" rx="10" fill="#dce9e7"/><text x="76" y="611" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Scientific and technical innovation</text><line x1="488" y1="604" x2="530" y2="604" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="540" y="582" width="300" height="44" rx="10" fill="#f2e7b8"/><text x="556" y="611" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">economic, ethical</text><rect x="60" y="636" width="420" height="44" rx="10" fill="#dce9e7"/><text x="76" y="665" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Globalization and sustainability</text><line x1="488" y1="658" x2="530" y2="658" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="540" y="636" width="300" height="44" rx="10" fill="#f2e7b8"/><text x="556" y="665" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">environmental, political</text><rect x="60" y="690" width="420" height="44" rx="10" fill="#dce9e7"/><text x="76" y="719" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Fairness and development</text><line x1="488" y1="712" x2="530" y2="712" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="540" y="690" width="300" height="44" rx="10" fill="#f2e7b8"/><text x="556" y="719" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">economic, moral</text><text x="450" y="780" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">“Globalization and sustainability” is not a factor; “environmental” is.</text>
</svg>