<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="820" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The six global contexts in science</text>

<rect x="30" y="110" width="410" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="152" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="159.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="106" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Identities and</text><text x="106" y="171" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">relationships</text><text x="54" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bodies, health, genes, development and</text><text x="54" y="231" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">well-being</text><text x="54" y="276" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">e.g. exercise and the heart</text><rect x="460" y="110" width="410" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="500" cy="152" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="500" y="159.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="536" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Orientation in space and</text><text x="536" y="171" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">time</text><text x="484" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how understanding develops; scales from</text><text x="484" y="231" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">atoms to the cosmos</text><text x="484" y="276" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">e.g. germ theory of disease</text><rect x="30" y="310" width="410" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="352" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="359.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="106" y="348" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Personal and cultural</text><text x="106" y="371" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">expression</text><text x="54" y="410" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how people create and practise science;</text><text x="54" y="431" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">agreed conventions</text><text x="54" y="476" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">e.g. physics of musical instruments</text><rect x="460" y="310" width="410" height="184" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="500" cy="352" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="500" y="359.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="536" y="348" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Scientific and technical</text><text x="536" y="371" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">innovation</text><text x="484" y="410" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">applying science to products, processes</text><text x="484" y="431" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and solutions</text><text x="484" y="476" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">e.g. rechargeable batteries</text><rect x="30" y="510" width="410" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="552" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="559.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="106" y="548" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Globalization and</text><text x="106" y="571" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">sustainability</text><text x="54" y="610" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">human activity and shared resources: air,</text><text x="54" y="631" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">water, soil, fuels</text><text x="54" y="676" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">e.g. polymers and plastic waste</text><rect x="460" y="510" width="410" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="500" cy="552" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="500" y="559.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="536" y="548" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fairness and development</text><text x="484" y="610" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who benefits from science, who bears the</text><text x="484" y="631" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">costs</text><text x="484" y="676" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">e.g. keeping vaccines cold</text><rect x="30" y="720" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="754" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Every unit has one. Science often uses no. 4, but all six must appear over the course.</text><text x="450" y="780" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Example units are Marlbridge suggestions.</text>
</svg>