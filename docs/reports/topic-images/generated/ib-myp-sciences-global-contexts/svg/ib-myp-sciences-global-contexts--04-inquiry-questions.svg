<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three kinds of inquiry question</text>

<rect x="30" y="110" width="840" height="132" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="54" y="152" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Factual</text><text x="210" y="152" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">answered by recall or measurement</text><text x="54" y="192" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“What gases are produced when fuel burns?”</text><rect x="90" y="260" width="780" height="132" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="114" y="302" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Conceptual</text><text x="270" y="302" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about big ideas that transfer</text><text x="114" y="342" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“How does a change in one part of a system affect the rest?”</text><rect x="150" y="410" width="720" height="132" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="174" y="452" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Debatable</text><text x="330" y="452" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">more than one defensible answer</text><text x="174" y="492" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Should cities ban petrol cars?”</text><rect x="30" y="570" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="618" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Debatable questions are where the global context meets criterion D.</text>
</svg>