<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a statement of inquiry</text>

<rect x="30" y="110" width="260" height="150" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Key concept</text><text x="160" y="192" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">relationships</text><text x="305" y="195" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="320" y="110" width="260" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Related concepts</text><text x="450" y="192" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">conditions,</text><text x="450" y="214" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">interaction</text><text x="595" y="195" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="610" y="110" width="260" height="150" rx="14" fill="#dce9e7" stroke="#8a6d0d" stroke-width="2.5"/><text x="740" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Global context</text><text x="740" y="192" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">identities and</text><text x="740" y="214" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">relationships</text><line x1="450" y1="268" x2="450" y2="318" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="325" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="362" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Statement of inquiry</text><text x="450" y="405" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">“Health is a function of interactions</text><text x="450" y="434" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">between individuals and societies.”</text><rect x="30" y="465" width="410" height="110" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="500" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Transferable</text><text x="55" y="530" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Names no specific topic, so it</text><text x="55" y="552" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">still holds in another case.</text><rect x="460" y="465" width="410" height="110" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="485" y="500" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Too narrow</text><text x="485" y="530" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Batteries store energy.”</text><text x="485" y="552" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">It only names the topic.</text><text x="450" y="600" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Sciences key concepts: change, relationships, systems (units may use others).</text>
</svg>