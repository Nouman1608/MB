<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 807" width="900" height="807" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="807" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing the final stanza</text>

<rect x="30" y="118" width="840" height="220" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="148" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Stanza 3</text><text x="110" y="188" font-size="20" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">They have automated it now.</tspan> A <tspan fill="#8a6d0d" font-weight="700">box</tspan></text><text x="110" y="228" font-size="20" fill="#1e2a44" xml:space="preserve"><tspan fill="#2e6b62" font-weight="700">turns on the light. No one climbs.</tspan></text><text x="110" y="268" font-size="20" fill="#1e2a44" xml:space="preserve">And I, who used to count, lie <tspan fill="#2b5a9a" font-weight="700">wide awake</tspan></text><text x="110" y="308" font-size="20" fill="#1e2a44" xml:space="preserve">to hear <tspan fill="#8a6d0d" font-weight="700">the hundred steps that no one takes</tspan>.</text><circle cx="70" cy="181" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="186.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="70" cy="221" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="226.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="70" cy="261" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="266.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><circle cx="70" cy="301" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="306.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="479.90000000000003" cy="181" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="479.90000000000003" y="186.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="80" y="354" width="790" height="92" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="92" y="380.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Tense and pronoun</text><text x="92" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“They have automated it now”: a flat, impersonal pronoun and the present tense break the</text><text x="92" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">remembered rhythm.</text><circle cx="48" cy="400" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="48" y="405.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="80" y="454" width="790" height="71" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="92" y="480.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Short sentences</text><text x="92" y="508.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“A box / turns on the light. No one climbs.” reduce the father’s labour to a mechanism.</text><circle cx="48" cy="489.5" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="48" y="495.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="80" y="533" width="790" height="71" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="92" y="559.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Enjambment after “box”</text><text x="92" y="587.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Isolates the word, as if the machine were a coffin for the old life (a tentative reading).</text><circle cx="48" cy="568.5" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="48" y="574.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="80" y="612" width="790" height="71" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="92" y="638.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Reversal and paradox</text><text x="92" y="666.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The child who counted real steps now hears steps “that no one takes”: hearing absence.</text><circle cx="48" cy="647.5" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="48" y="653.26" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="80" y="691" width="790" height="92" rx="14" fill="#ffffff" stroke="#2b5a9a" stroke-width="2.5"/><text x="92" y="717.4" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="start">Closing half-rhyme</text><text x="92" y="745.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“wide awake” / “takes”: memory as a kind of sleeplessness, faithful to what no longer</text><text x="92" y="766.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">exists.</text><circle cx="48" cy="737" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="48" y="742.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>