<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 599" width="900" height="599" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="599" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Handling unfamiliar forms and difficulty</text>

<rect x="30" y="104" width="412" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FORMS</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recognise, do not force</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fourteen lines and a turn: discuss its</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">relationship to the sonnet. If it breaks the</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expected pattern, the break is your point.</text><rect x="458" y="104" width="412" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="147.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FREE VERSE</text><text x="478" y="173.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Still shaped</text><text x="478" y="202.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Line breaks, white space and stanza lengths</text><text x="478" y="223.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">are choices.</text><rect x="30" y="276" width="412" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="309" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DIFFICULT LINES</text><text x="50" y="335.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do not avoid them</text><text x="50" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Offer a tentative reading, then show how the</text><text x="50" y="384.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rest of the poem supports it.</text><rect x="458" y="276" width="412" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="309" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AMBIGUITY</text><text x="478" y="335.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Credit-worthy</text><text x="478" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">When you explain how the poem holds two</text><text x="478" y="384.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">meanings at once.</text><text x="30" y="445" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tentative phrasing:</text><rect x="230" y="425" width="223" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="341.5" y="448.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">“this may suggest…”</text><rect x="467" y="425" width="202" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="568" y="448.48" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">“one reading is…”</text><rect x="30" y="479" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="515" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">But</text><text x="50" y="544.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Avoid overreaching: a symbolic reading with no evidence.</text>
</svg>