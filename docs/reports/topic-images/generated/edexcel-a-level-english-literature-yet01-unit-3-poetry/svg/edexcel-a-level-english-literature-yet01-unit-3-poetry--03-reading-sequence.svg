<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A reading sequence for the planning time</text>

<text x="30" y="122" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Roughly ten minutes of reading and planning before you write</text><rect x="88" y="140" width="354" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="102" y="168.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Situation and voice</text><text x="102" y="196.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who speaks, to whom, where, when? A</text><text x="102" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">persona or an addressee?</text><circle cx="56" cy="188" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="195.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="516" y="140" width="354" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="530" y="168.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Language clusters</text><text x="530" y="196.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two or three semantic fields; notice</text><text x="530" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">where they collide.</text><circle cx="484" cy="188" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="484" y="195.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="88" y="246" width="354" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="102" y="274.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First impression</text><text x="102" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One sentence: what it seems to be about</text><text x="102" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and how it feels.</text><circle cx="56" cy="294" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="301.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="516" y="246" width="354" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="530" y="274.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sound and rhythm</text><text x="530" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Read silently “aloud”: where does it</text><text x="530" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">speed up, slow, break?</text><circle cx="484" cy="294" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="484" y="301.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="88" y="352" width="354" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="102" y="380.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shape</text><text x="102" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stanzas, line length, rhyme, regularity</text><text x="102" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or disruption. A recognisable form?</text><circle cx="56" cy="400" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="407.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="516" y="352" width="354" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="530" y="380.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The ending</text><text x="530" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What has changed between first and last</text><text x="530" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lines?</text><circle cx="484" cy="400" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="484" y="407.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="88" y="458" width="354" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="102" y="486.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Movement</text><text x="102" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Where does it turn? Tense, tone,</text><text x="102" y="535.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">addressee, sentence length, a volta.</text><circle cx="56" cy="506" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="513.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="516" y="458" width="354" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="530" y="486.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Thesis</text><text x="530" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One or two sentences answering the</text><text x="530" y="535.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">question, ideally with an ambiguity.</text><circle cx="484" cy="506" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="484" y="513.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><rect x="30" y="570" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="603.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Then plan four or five paragraphs that follow the poem’s movement or its main methods.</text>
</svg>