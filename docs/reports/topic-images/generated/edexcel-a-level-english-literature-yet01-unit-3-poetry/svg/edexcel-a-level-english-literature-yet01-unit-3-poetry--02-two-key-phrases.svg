<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 522" width="900" height="522" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="522" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two phrases in the learning outcomes</text>

<rect x="30" y="120" width="412" height="280" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">“FUNCTION OF KEY FEATURES”</text><text x="50" y="180" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What a feature does in this poem</text><text x="50" y="209.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Not that it exists.</text><rect x="458" y="120" width="412" height="280" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="153" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">“ATTITUDES AND VALUES”</text><text x="478" y="180" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The poem’s stance</text><text x="478" y="209.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What it seems to:</text><rect x="50" y="260" width="372" height="41" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="62" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“There is enjambment in line 6.”</text><circle cx="410" cy="260" r="12" fill="#b5602e"/><path d="M405.2,255.2 l9.600000000000001,9.600000000000001 m0,-9.600000000000001 l-9.600000000000001,9.600000000000001" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="236" y1="316" x2="236" y2="334" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="50" y="340" width="372" height="41" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="62" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What the line break does to meaning here.</text><circle cx="410" cy="340" r="12" fill="#2e6b62"/><path d="M404.6,340.24 l3.84,4.08 l7.199999999999999,-7.92" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="478" y="260" width="88" height="34" rx="17" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="522" y="283.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">admire</text><rect x="578" y="260" width="67" height="34" rx="17" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="611.5" y="283.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">fear</text><rect x="478" y="310" width="78" height="34" rx="17" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="517" y="333.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">mourn</text><rect x="568" y="310" width="109" height="34" rx="17" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="622.5" y="333.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">question</text><rect x="30" y="418" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="451.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Personal and creative” (AO1) does not mean anything goes: it means a reading of your own,</text><text x="50" y="473.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">argued from evidence, that can acknowledge ambiguity.</text>
</svg>