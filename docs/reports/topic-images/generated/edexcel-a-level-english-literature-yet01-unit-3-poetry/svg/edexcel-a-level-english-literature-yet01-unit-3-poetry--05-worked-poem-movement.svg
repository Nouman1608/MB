<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" width="900" height="722" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="722" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the worked poem moves</text>

<text x="30" y="124" font-size="18" font-weight="700" fill="#1e2a44">The Lighthouse Keeper’s Daughter <tspan font-weight="400" font-style="italic" fill="#4a5568" font-size="15">(original poem written for the guide)</tspan></text><rect x="30" y="140" width="560" height="130" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Every night my father climbed</text><text x="48" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the hundred steps to keep a stranger’s ship</text><text x="48" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from breaking. I would count them from my bed,</text><text x="48" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">his boots, then silence, then the lamp.</text><rect x="610" y="140" width="260" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="628" y="170" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Stanza 1</text><text x="628" y="196" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The past</text><text x="628" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Remembered through sounds</text><text x="628" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">she counted as a child</text><line x1="740" y1="272" x2="740" y2="296" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="300" width="560" height="130" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">He never spoke of storms. At breakfast</text><text x="48" y="358" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">he would butter bread with careful hands</text><text x="48" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as if the knife might slip and sink us all.</text><text x="48" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">We ate. The sea kept on rehearsing.</text><rect x="610" y="300" width="260" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="628" y="330" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Stanza 2</text><text x="628" y="356" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">His silent care</text><text x="628" y="384" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Gestures, not words</text><line x1="740" y1="432" x2="740" y2="456" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="460" width="560" height="130" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="492" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">They have automated it now. A box</text><text x="48" y="518" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">turns on the light. No one climbs.</text><text x="48" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">And I, who used to count, lie wide awake</text><text x="48" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to hear the hundred steps that no one takes.</text><rect x="610" y="460" width="260" height="130" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="628" y="490" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Stanza 3</text><text x="628" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The present</text><text x="628" y="544" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The lighthouse works</text><text x="628" y="564" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">without him</text><rect x="30" y="608" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="644" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The overall reading</text><text x="50" y="673.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The loss of the father and the loss of a way of life become the same absence.</text>
</svg>