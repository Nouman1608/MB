<rect width="900" height="631" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Unit 3 Section A at a glance</text>

<text x="30" y="118" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Unit 3 · 2 hours · open book · 50 marks</text><rect x="30" y="130" width="336" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="198" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: Poetry</text><text x="198" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">20 marks</text><rect x="366" y="130" width="504" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="618" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: comparative prose</text><text x="618" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">30 marks</text><rect x="30" y="130" width="840" height="74" fill="none" stroke="#1e2a44" stroke-width="3"/><text x="450" y="236" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Allocate time roughly in proportion to marks: Section B needs the larger share.</text><path d="M70,268 L148,268 L170,290 L170,384 L70,384 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M148,268 L148,290 L170,290" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><line x1="82" y1="298" x2="133.92000000000002" y2="298" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="312" x2="151.92000000000002" y2="312" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="326" x2="139" y2="326" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="340" x2="151.92000000000002" y2="340" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="354" x2="151.92000000000002" y2="354" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="368" x2="139" y2="368" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><text x="120" y="408" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">one unseen poem</text><rect x="220" y="268" width="650" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="320.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="256.15" y="320.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One compulsory essay: no choice of question.</text><text x="240" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="256.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A post-1900 poem printed in a Source Booklet.</text><text x="240" y="374.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="256.15" y="374.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No comparison: every sentence is about this poem, read closely.</text><rect x="30" y="436" width="270.6666666666667" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="468" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">AO1</text><text x="46" y="496.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A personal, informed</text><text x="46" y="517.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reading: clear thesis,</text><text x="46" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sustained argument, accurate</text><text x="46" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">terminology, controlled</text><text x="46" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expression.</text><rect x="314.6666666666667" y="436" width="270.6666666666667" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="489" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">AO2</text><text x="330.6666666666667" y="517.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How meanings are shaped:</text><text x="330.6666666666667" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">form, structure, language,</text><text x="330.6666666666667" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">imagery, sound, voice, tone.</text><rect x="599.3333333333334" y="436" width="270.6666666666667" height="165" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="615.3333333333334" y="499.5" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Not assessed</text><text x="615.3333333333334" y="528.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">AO3 context and AO4</text><text x="615.3333333333334" y="549.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">connections.</text>
</svg>