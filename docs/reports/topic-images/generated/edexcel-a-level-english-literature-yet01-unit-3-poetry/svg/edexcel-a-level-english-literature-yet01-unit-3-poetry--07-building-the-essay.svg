<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 547" width="900" height="547" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building the essay</text>

<rect x="30" y="120" width="253.33333333333334" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="172.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Introduction</text><text x="46" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Situation, overall</text><text x="46" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reading, and how the</text><text x="46" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">structure carries it.</text><line x1="289.33333333333337" y1="202" x2="317.33333333333337" y2="202" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="120" width="253.33333333333334" height="164" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="339.33333333333337" y="151.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Body</text><text x="339.33333333333337" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Four or five paragraphs</text><text x="339.33333333333337" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">following the poem’s</text><text x="339.33333333333337" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">movement or key methods.</text><text x="339.33333333333337" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Group lines by function,</text><text x="339.33333333333337" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not line by line.</text><line x1="582.6666666666667" y1="202" x2="610.6666666666667" y2="202" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="120" width="253.33333333333334" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="632.6666666666667" y="172.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="632.6666666666667" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What the ending leaves the</text><text x="632.6666666666667" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reader with; acknowledge</text><text x="632.6666666666667" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">an alternative reading.</text><text x="30" y="324" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Each paragraph</text><rect x="30" y="340" width="144" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="102" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Point on the</text><text x="102" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">question focus</text><line x1="180" y1="382" x2="198" y2="382" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="204" y="340" width="144" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="386.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Short quotation</text><line x1="354" y1="382" x2="372" y2="382" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="378" y="340" width="144" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="386.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Method</text><line x1="528" y1="382" x2="546" y2="382" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="552" y="340" width="144" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="624" y="386.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Effect</text><line x1="702" y1="382" x2="720" y2="382" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="726" y="340" width="144" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="798" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Link to the</text><text x="798" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">overall reading</text><rect x="30" y="448" width="270.6666666666667" height="75" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="476.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Context or biography</text><text x="44" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Earns nothing in Section A.</text><rect x="314.6666666666667" y="448" width="270.6666666666667" height="75" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="328.6666666666667" y="476.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Comparison with Unit 1</text><text x="328.6666666666667" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not assessed here.</text><rect x="599.3333333333334" y="448" width="270.6666666666667" height="75" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="613.3333333333334" y="476.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Line-by-line commentary</text><text x="613.3333333333334" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Never builds an argument.</text><circle cx="286.6666666666667" cy="462" r="12" fill="#b5602e"/><path d="M281.8666666666667,457.2 l9.600000000000001,9.600000000000001 m0,-9.600000000000001 l-9.600000000000001,9.600000000000001" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="571.3333333333334" cy="462" r="12" fill="#b5602e"/><path d="M566.5333333333334,457.2 l9.600000000000001,9.600000000000001 m0,-9.600000000000001 l-9.600000000000001,9.600000000000001" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="856" cy="462" r="12" fill="#b5602e"/><path d="M851.2,457.2 l9.600000000000001,9.600000000000001 m0,-9.600000000000001 l-9.600000000000001,9.600000000000001" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
</svg>