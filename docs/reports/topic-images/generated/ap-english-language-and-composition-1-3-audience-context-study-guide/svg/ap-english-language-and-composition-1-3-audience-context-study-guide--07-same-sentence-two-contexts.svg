<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="900" height="492" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="492" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same sentence, two contexts</text>

<rect x="150" y="96" width="600" height="95.44" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="135.85" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“We will not be moved from this square until the vote</text><text x="450" y="163.57" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">is taken.”</text><path d="M380,195.44 C330,221.44 240,211.44 232,245.44" fill="none" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><path d="M520,195.44 C570,221.44 660,211.44 668,245.44" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="251.44" width="405" height="210.24" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="285.44" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Protesters outside a town hall</text><text x="48" y="313.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Time:</tspan> evening before a vote</text><text x="48" y="334.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Place:</tspan> the square</text><text x="48" y="355.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Occasion:</tspan> a protest</text><text x="48" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"></text><text x="48" y="397.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A collective pledge of persistence and a</text><text x="48" y="419.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">challenge to officials inside: an act of</text><text x="48" y="440.15999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">resistance.</text><rect x="465" y="251.44" width="405" height="210.24" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="483" y="285.44" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Tourists on a guided walk</text><text x="483" y="313.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">They have been told the market is closed until</text><text x="483" y="334.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the evening.</text><text x="483" y="355.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"></text><text x="483" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The same words would be humorous and</text><text x="483" y="397.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">exaggerated, because nothing is at stake.</text>
</svg>