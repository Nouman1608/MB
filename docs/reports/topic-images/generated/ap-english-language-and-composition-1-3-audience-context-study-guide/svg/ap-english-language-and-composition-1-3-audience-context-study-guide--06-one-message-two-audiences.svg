<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One message, two audiences</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The Year 7 museum trip is cancelled</text>
<text x="232" y="140" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">Version A: to students</text><text x="668" y="140" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Version B: to parents</text><rect x="30" y="156" width="405" height="189.08000000000004" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="48" y="188.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Bad news: the coach has <tspan font-weight="700">fallen</tspan> <tspan font-weight="700">through</tspan>,</text><text x="48" y="210.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">so the museum trip is <tspan font-weight="700">off</tspan> this Friday. We are</text><text x="48" y="233.32999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">sorry. Instead, you will get <tspan font-weight="700">a</tspan> <tspan font-weight="700">science</tspan> <tspan font-weight="700">lab</tspan></text><text x="48" y="255.76999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">afternoon</tspan> and a new date as soon as we</text><text x="48" y="278.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">can book one.”</text><rect x="465" y="156" width="405" height="189.08000000000004" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="483" y="188.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“We <tspan font-weight="700">regret</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">inform</tspan> <tspan font-weight="700">you</tspan> that Friday’s Year</text><text x="483" y="210.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">7 visit to the science museum has been</text><text x="483" y="233.32999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">cancelled <tspan font-weight="700">following</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">coach</tspan> <tspan font-weight="700">operator’s</tspan></text><text x="483" y="255.76999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">withdrawal</tspan> of the booking. <tspan font-weight="700">No</tspan> <tspan font-weight="700">payments</tspan></text><text x="483" y="278.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">will</tspan> <tspan font-weight="700">be</tspan> <tspan font-weight="700">taken.</tspan> We are arranging a laboratory</text><text x="483" y="300.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">session at school and <tspan font-weight="700">will</tspan> <tspan font-weight="700">contact</tspan> <tspan font-weight="700">you</tspan> with</text><text x="483" y="323.09000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a replacement date.”</text><text x="450" y="373.08000000000004" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">1 Diction and tone</text><rect x="30" y="385.08000000000004" width="405" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="412.68000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Plain, friendly words and a direct apology, as to</text><text x="44" y="433.80000000000007" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">young people.</text><rect x="465" y="385.08000000000004" width="405" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="479" y="412.68000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Formal phrasing for adults who expect a</text><text x="479" y="433.80000000000007" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">professional tone.</text><text x="450" y="479.32000000000005" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">2 What they need</text><rect x="30" y="491.32000000000005" width="405" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="518.9200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Students want to know what happens instead:</text><text x="44" y="540.0400000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">lab afternoon first.</text><rect x="465" y="491.32000000000005" width="405" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="479" y="518.9200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Parents need financial and organisational</text><text x="479" y="540.0400000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">consequences.</text>
</svg>