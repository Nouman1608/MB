<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="900" height="422" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="422" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six clues to the audience</text>

<rect x="30" y="96" width="268" height="149.51999999999998" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="88" y="129.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Direct address</text><text x="48" y="156.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Fellow volunteers”,</text><text x="48" y="177.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Councillors”, “Ladies and</text><text x="48" y="198.92000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">gentlemen”</text><rect x="316" y="96" width="268" height="149.51999999999998" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="374" y="129.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Assumed</text><text x="374" y="154.28" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">knowledge</text><text x="334" y="181.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A term left unexplained: the</text><text x="334" y="202.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">audience is expected to</text><text x="334" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">know it.</text><rect x="602" y="96" width="268" height="149.51999999999998" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="660" y="129.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Shared references</text><text x="620" y="156.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Local places, shared history,</text><text x="620" y="177.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">common sayings.</text><rect x="30" y="263.52" width="268" height="128.4" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="88" y="296.71999999999997" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Pronouns</text><text x="48" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“we” and “us” build common</text><text x="48" y="345.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">ground; “you” separates;</text><text x="48" y="366.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“they” sets up a third party.</text><rect x="316" y="263.52" width="268" height="128.4" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="374" y="296.71999999999997" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Anticipated</text><text x="374" y="321.79999999999995" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">objections</text><text x="334" y="349.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“You may say the savings are</text><text x="334" y="370.40000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">needed”</text><rect x="602" y="263.52" width="268" height="128.4" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="660" y="296.71999999999997" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Publication or</text><text x="660" y="321.79999999999995" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">setting</text><text x="620" y="349.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A trade journal, a town-hall</text><text x="620" y="370.40000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">speech, a school newsletter.</text><circle cx="64" cy="126" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="131.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="350" cy="126" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="350" y="131.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="636" cy="126" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="636" y="131.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="64" cy="293.52" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="299.28" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="350" cy="293.52" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="350" y="299.28" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><circle cx="636" cy="293.52" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="636" y="299.28" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>