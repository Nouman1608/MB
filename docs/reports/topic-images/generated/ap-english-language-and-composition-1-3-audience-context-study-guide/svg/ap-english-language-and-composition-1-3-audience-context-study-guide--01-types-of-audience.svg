<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 686" width="900" height="686" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="686" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of audience</text>

<circle cx="250" cy="286" r="185" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="250" cy="286" r="100" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="250" y="274" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Primary</text><text x="250" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">directly addressed;</text><text x="250" y="319.8" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">most wants to affect</text><text x="250" y="151" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Secondary</text><text x="250" y="174" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle" xml:space="preserve">others who will read or hear it</text><text x="250" y="414" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle" font-style="italic" xml:space="preserve">e.g. newspaper readers</text><text x="250" y="434" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle" font-style="italic" xml:space="preserve">who might add pressure</text><text x="250" y="348" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic" xml:space="preserve">e.g. “Councillors”</text><text x="675" y="110" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">How much does the group share?</text><rect x="480" y="132" width="390" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="498" y="166" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Broad or general</text><text x="498" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A wide, mixed group with little in common but</text><text x="498" y="215.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">citizenship or interest. <tspan font-style="italic">Readers</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">national</tspan></text><text x="498" y="236.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">magazine.</tspan></text><rect x="480" y="303.76" width="390" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="498" y="337.76" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Specialised</text><text x="498" y="365.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Expert knowledge or a shared professional</text><text x="498" y="386.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">language. <tspan font-style="italic">Nurses</tspan> <tspan font-style="italic">reading</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">hospital</tspan> <tspan font-style="italic">safety</tspan></text><text x="498" y="408" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">notice.</tspan></text><text x="675" y="287.76" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">little shared ↔ expert, shared language</text><rect x="480" y="449.52" width="390" height="125.75999999999999" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="498" y="483.52" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Divided</text><text x="498" y="511.52" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">People who disagree: choose language that</text><text x="498" y="532.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">does not alienate one group while reaching</text><text x="498" y="553.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">another.</text><rect x="30" y="595.28" width="840" height="54.440000000000055" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="627.73" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">On the exam, avoid “everyone”. Name the group and, where the text supports it, a second group.</text>
</svg>