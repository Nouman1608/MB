<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One speech, a divided audience</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Booker T. Washington, Atlanta, 18 September 1895</text>
<rect x="30" y="212" width="250" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="155" y="253.45999999999998" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Cast down your</text><text x="155" y="278.53999999999996" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">bucket where you</text><text x="155" y="303.62" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">are.”</text><text x="155" y="331.1" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">practical, economic</text><text x="155" y="352.22" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">cooperation</text><rect x="500" y="122" width="370" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="518" y="154.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">White Southern business and</text><text x="518" y="178.16" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">political leaders</text><text x="518" y="205.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">framed in a way they could accept</text><line x1="282" y1="297" x2="494" y2="172" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="500" y="242" width="370" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="518" y="283.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Black Southerners</text><text x="518" y="310.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">heard with different beliefs and needs</text><line x1="282" y1="297" x2="494" y2="292" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="500" y="362" width="370" height="100" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="7 5"/><text x="518" y="403.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Readers across the country</text><text x="518" y="430.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">met it through reports</text><line x1="282" y1="297" x2="494" y2="412" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)" stroke-dasharray="8 6"/><rect x="30" y="502" width="408" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="536" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Context</text><text x="48" y="564" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A major exposition in the American South, three</text><text x="48" y="585.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">decades after the Civil War, in an era of</text><text x="48" y="606.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">increasing segregation; public and commercial.</text><rect x="462" y="502" width="408" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="480" y="536" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Sign of division</text><text x="480" y="564" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Critics, including W. E. B. Du Bois, called it “the</text><text x="480" y="585.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Atlanta Compromise”: the same words were</text><text x="480" y="606.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">heard differently.</text>
</svg>