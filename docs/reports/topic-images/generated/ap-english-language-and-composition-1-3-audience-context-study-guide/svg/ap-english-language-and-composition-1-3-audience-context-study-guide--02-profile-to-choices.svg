<rect width="900" height="649" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the writer perceives, the writer chooses</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four audience features guide five kinds of choice</text>
<rect x="30" y="122" width="230" height="75.52000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="152" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Beliefs</text><text x="44" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">what they hold true</text><rect x="30" y="211.52" width="230" height="96.64000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="241.52" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Values</text><text x="44" y="269.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">what they care about and</text><text x="44" y="290.64000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">consider right</text><rect x="30" y="322.16" width="230" height="75.51999999999998" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="352.16" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Needs</text><text x="44" y="380.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">what they lack or want</text><rect x="30" y="411.68" width="230" height="96.63999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="441.68" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Background</text><text x="44" y="469.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">age, occupation, history,</text><text x="44" y="490.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">education</text><rect x="470" y="122" width="400" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="484" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Diction</text><text x="484" y="177.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">technical for specialists; everyday for a general</text><text x="484" y="198.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">audience</text><rect x="470" y="228" width="400" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="484" y="256.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Evidence</text><text x="484" y="283.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">statistics for sceptical professionals; stories for</text><text x="484" y="304.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">readers who respond to human cases</text><rect x="470" y="334" width="400" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="484" y="362.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Tone</text><text x="484" y="389.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">measured for officials; warm for a community</text><text x="484" y="410.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">meeting; urgent for an emergency</text><rect x="470" y="440" width="400" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="484" y="468.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Structure</text><text x="484" y="495.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">key instruction first for busy readers; a slow</text><text x="484" y="516.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">build for those who need persuading</text><rect x="470" y="546" width="400" height="72.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="484" y="574.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Left unsaid</text><text x="484" y="601.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">omit what the audience already knows</text><line x1="260" y1="159.76" x2="290" y2="370.44" stroke="#2e6b62" stroke-width="2.5"/><line x1="260" y1="259.84000000000003" x2="290" y2="370.44" stroke="#2e6b62" stroke-width="2.5"/><line x1="260" y1="359.92" x2="290" y2="370.44" stroke="#2e6b62" stroke-width="2.5"/><line x1="260" y1="460" x2="290" y2="370.44" stroke="#2e6b62" stroke-width="2.5"/><line x1="390" y1="370.44" x2="466" y2="169" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="390" y1="370.44" x2="466" y2="275" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="390" y1="370.44" x2="466" y2="381" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="390" y1="370.44" x2="466" y2="487" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="390" y1="370.44" x2="466" y2="582.44" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="340" cy="370.44" r="52" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="340" y="364.44" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">writer’s</text><text x="340" y="385.56" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">perception</text>
</svg>