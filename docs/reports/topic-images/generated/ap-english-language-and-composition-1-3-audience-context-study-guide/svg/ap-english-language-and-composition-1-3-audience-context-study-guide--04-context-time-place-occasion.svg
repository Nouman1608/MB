<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Context is wider than exigence</text>

<rect x="30" y="96" width="840" height="330" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="56" y="134" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">CONTEXT: the general setting</text><rect x="56" y="156" width="252" height="96.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="182" y="186" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Time</text><text x="182" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">year, season, stage of</text><text x="182" y="235.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">events</text><rect x="324" y="156" width="252" height="96.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="186" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Place</text><text x="450" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">battlefield, town hall,</text><text x="450" y="235.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">newspaper, website</text><rect x="592" y="156" width="252" height="96.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="718" y="186" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Occasion</text><text x="718" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">funeral, graduation, protest,</text><text x="718" y="235.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">hearing</text><rect x="250" y="278.64" width="400" height="125.36000000000001" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="333.56" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Exigence</text><text x="450" y="361.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the specific trigger that sits inside the setting</text><text x="450" y="456" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Context changes what is possible and appropriate</text><rect x="30" y="476" width="264" height="84.84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="162" y="510" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Solemn occasion</text><text x="162" y="538.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">brief and restrained</text><rect x="318" y="476" width="264" height="84.84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="510" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Rally</text><text x="450" y="538.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">emphatic and rhythmic</text><rect x="606" y="476" width="264" height="84.84" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="738" y="510" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Farewell party joke</text><text x="738" y="538.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">would fail at a memorial</text>
</svg>