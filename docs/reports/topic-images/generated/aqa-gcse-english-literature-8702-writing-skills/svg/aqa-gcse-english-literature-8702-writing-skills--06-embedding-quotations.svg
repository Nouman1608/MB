<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Embedding quotations</text>

<rect x="30" y="110" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="162" r="16" fill="#b5602e"/><path d="M59.6,155.6 l12.8,12.8 m0,-12.8 l-12.8,12.8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="98" y="148" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Dropped in</text><text x="98" y="182" font-size="18" fill="#1e2a44" xml:space="preserve"><tspan>The character is angry. </tspan><tspan font-style="italic" fill="#4a5568">“Get out of my house.”</tspan><tspan> This shows anger.</tspan></text><rect x="30" y="226" width="840" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="66" cy="278" r="16" fill="#2e6b62"/><path d="M58.8,278.32 l5.12,5.44 l9.6,-10.56" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="98" y="264" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Embedded</text><text x="98" y="298" font-size="18" fill="#1e2a44" xml:space="preserve"><tspan>The command to </tspan><tspan fill="#b5602e" font-weight="700">“get out”</tspan><tspan> shows anger turning into control.</tspan></text><text x="450" y="358" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Quotation conventions</text><rect x="30" y="376" width="96" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="78" y="410" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">“ ”</text><rect x="138" y="376" width="732" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156" y="407" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Quotation marks around every quotation; keep it short.</text><rect x="30" y="434" width="96" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="78" y="468" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">…</text><rect x="138" y="434" width="732" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156" y="465" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ellipsis: words have been left out.</text><rect x="30" y="492" width="96" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="78" y="526" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">[ ]</text><rect x="138" y="492" width="732" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156" y="523" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Square brackets: a small change so it fits your grammar.</text><rect x="30" y="550" width="96" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="78" y="584" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">/</text><rect x="138" y="550" width="732" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156" y="581" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Forward slash: a line break in poetry or verse.</text><rect x="30" y="608" width="96" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="78" y="648" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Title</text><line x1="56" y1="654" x2="100" y2="654" stroke="#1e2a44" stroke-width="2"/><rect x="138" y="608" width="732" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156" y="637.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Underline titles of plays and novels (in handwriting); poems and short</text><text x="156" y="660.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">stories go in quotation marks.</text>
</svg>