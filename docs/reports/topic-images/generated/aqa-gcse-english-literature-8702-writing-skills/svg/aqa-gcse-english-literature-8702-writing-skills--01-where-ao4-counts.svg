<rect width="900" height="526" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where accuracy earns its own marks</text>

<rect x="30" y="110" width="411" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 1</text><rect x="54" y="172" width="363" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="72" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shakespeare</text><rect x="287" y="186" width="116" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="345" y="209" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+4 AO4</text><rect x="54" y="248" width="363" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="72" y="286" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">19th-century novel</text><rect x="459" y="110" width="411" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="483" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 2</text><rect x="483" y="172" width="363" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="501" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Modern text</text><rect x="716" y="186" width="116" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="774" y="209" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+4 AO4</text><rect x="483" y="248" width="363" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="501" y="286" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Poetry sections</text><rect x="30" y="348" width="408" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="381" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">AO4 REWARDS</text><text x="50" y="407.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Range and accuracy</text><text x="50" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A range of vocabulary and sentence</text><text x="50" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">structures for clarity, purpose and effect,</text><text x="50" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with accurate spelling and punctuation.</text><rect x="462" y="348" width="408" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="391.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVERYWHERE ELSE</text><text x="482" y="417.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Clarity still counts</text><text x="482" y="446.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An argument the examiner cannot follow</text><text x="482" y="467.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cannot be credited for its ideas.</text>
</svg>