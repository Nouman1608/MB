<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six purposes, each with a job and a limit</text>

<text x="284" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Its job in an essay</text><text x="614" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Its limit</text><rect x="100" y="144" width="162" height="58" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="181" y="180" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluate</text><rect x="270" y="144" width="322" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="284" y="169" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Judge how effective or significant</text><text x="284" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a choice is</text><rect x="600" y="144" width="270" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="614" y="169" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Needs reasons, not opinion</text><text x="614" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alone</text><rect x="100" y="210" width="162" height="58" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="181" y="246" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Analyse</text><rect x="270" y="210" width="322" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="284" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Show how a method creates meaning</text><text x="284" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and effect</text><rect x="600" y="210" width="270" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="614" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Must link to the question</text><rect x="100" y="276" width="162" height="58" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="181" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Argue</text><rect x="270" y="276" width="322" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="284" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Advance and defend your view</text><rect x="600" y="276" width="270" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="614" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Needs evidence every time</text><rect x="100" y="342" width="162" height="58" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="181" y="378" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain</text><rect x="270" y="342" width="322" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="284" y="367" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Say what a quotation or method</text><text x="284" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">means</text><rect x="600" y="342" width="270" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="614" y="367" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Must lead to analysis</text><rect x="100" y="408" width="162" height="58" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="181" y="444" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Summarise</text><rect x="270" y="408" width="322" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="284" y="433" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Give just enough of the situation</text><rect x="600" y="408" width="270" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="614" y="433" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One clause, not a retelling</text><rect x="100" y="474" width="162" height="58" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="181" y="510" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Describe</text><rect x="270" y="474" width="322" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="284" y="499" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Identify a feature or moment</text><text x="284" y="520" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">precisely</text><rect x="600" y="474" width="270" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="614" y="499" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Never the whole paragraph</text><line x1="55" y1="532" x2="55" y2="148" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><g transform="translate(40,338) rotate(-90)"><text x="0" y="0" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">towards the higher levels</text></g><rect x="30" y="550" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="583.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Check: a paragraph that only describes and summarises has not yet started to earn the</text><text x="50" y="605.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">higher levels.</text>
</svg>