<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From weaker to improved</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The quotation is invented for this example</text>
<rect x="30" y="110" width="411" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="144" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Weaker</text><text x="52" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">In the poem it shows that the speaker is</text><text x="52" y="195" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">upset. It says "the house is quiet" this</text><text x="52" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">shows that it’s lonely. Their is alot of</text><text x="52" y="237" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">sadness and the poet uses imagery and</text><text x="52" y="258" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">alliteration to show it.</text><rect x="459" y="110" width="411" height="196" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="481" y="144" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Improved</text><text x="481" y="174" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The speaker presents grief as an absence</text><text x="481" y="195" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">that fills the home. The phrase “the house</text><text x="481" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">is quiet” transfers the speaker’s loneliness</text><text x="481" y="237" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">onto the building itself, as if the walls</text><text x="481" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">are mourning too. Although the line is</text><text x="481" y="279" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">simple, its plainness is effective…</text><text x="450" y="336" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">What changed</text><rect x="40" y="356" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,377 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="352" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="380.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A clear point opens the paragraph</text><rect x="40" y="412" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,433 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="408" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="436.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The quotation is embedded</text><rect x="40" y="481.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,502.5 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="464" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="492.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Spelling and grammar fixed</text><text x="108" y="520.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“it’s” replaced; “their” and “alot” removed; sentence punctuation fixed.</text><rect x="40" y="564.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,585.5 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="547" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="575.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One choice analysed</text><text x="108" y="603.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in place of the vague “imagery and alliteration”</text><rect x="40" y="634" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M49,655 l9,9 l15,-19" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="630" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="658.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The final sentence evaluates the effect</text>
</svg>