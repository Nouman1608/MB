<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Select, then emphasise</text>

<rect x="30" y="110" width="411" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="19" font-weight="700" fill="#4a5568" text-anchor="start">Many points, thinly</text><rect x="54" y="168" width="200" height="12" rx="4" fill="#c9d6d4"/><rect x="54" y="188" width="240" height="12" rx="4" fill="#c9d6d4"/><rect x="54" y="208" width="280" height="12" rx="4" fill="#c9d6d4"/><rect x="54" y="228" width="200" height="12" rx="4" fill="#c9d6d4"/><rect x="54" y="248" width="240" height="12" rx="4" fill="#c9d6d4"/><rect x="54" y="268" width="280" height="12" rx="4" fill="#c9d6d4"/><rect x="54" y="288" width="200" height="12" rx="4" fill="#c9d6d4"/><rect x="54" y="308" width="240" height="12" rx="4" fill="#c9d6d4"/><circle cx="400" cy="148" r="15" fill="#b5602e"/><path d="M394,142 l12,12 m0,-12 l-12,12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="459" y="110" width="411" height="270" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="483" y="148" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Three or four, in depth</text><rect x="483" y="166" width="300" height="50" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="483" y="226" width="300" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="483" y="276" width="300" height="92" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="830" cy="148" r="15" fill="#2e6b62"/><path d="M823.25,148.3 l4.8,5.1000000000000005 l9,-9.9" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="633" y="328" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">key point: longest paragraph</text><text x="450" y="410" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Three ways to emphasise your key point</text><rect x="30" y="428" width="268" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="463.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Order</text><text x="164" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Open with it, or save it</text><text x="164" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">for the final paragraph.</text><rect x="316" y="428" width="268" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="463.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Space</text><text x="450" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Give it the longest</text><text x="450" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">paragraph.</text><rect x="602" y="428" width="268" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="463.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Language</text><text x="736" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">“most strikingly”,</text><text x="736" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">“crucially”</text>
</svg>