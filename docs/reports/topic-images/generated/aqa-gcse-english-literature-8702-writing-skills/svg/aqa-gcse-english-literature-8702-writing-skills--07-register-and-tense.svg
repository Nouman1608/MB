<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Register, tense and variety</text>

<text x="30" y="130" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Register: formal and precise</text><rect x="30" y="146" width="300" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="180" r="14" fill="#b5602e"/><path d="M56.4,174.4 l11.200000000000001,11.200000000000001 m0,-11.200000000000001 l-11.200000000000001,11.200000000000001" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="186" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Avoid</text><text x="54" y="218" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">slang, text-speak,</text><text x="54" y="240" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“stuff”, “things”, “kind of”</text><rect x="346" y="146" width="524" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="378" cy="180" r="14" fill="#2e6b62"/><path d="M371.7,180.28 l4.48,4.760000000000001 l8.4,-9.24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="402" y="186" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Prefer precise verbs</text><rect x="370" y="206" width="100" height="32" rx="16" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="420" y="227.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">suggests</text><rect x="480" y="206" width="90" height="32" rx="16" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="525" y="227.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">implies</text><rect x="580" y="206" width="90" height="32" rx="16" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="625" y="227.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">exposes</text><rect x="680" y="206" width="118" height="32" rx="16" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="739" y="227.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">undermines</text><rect x="370" y="246" width="118" height="32" rx="16" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="429" y="267.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">reinforces</text><rect x="498" y="246" width="90" height="32" rx="16" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="543" y="267.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">conveys</text><text x="30" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Tense</text><rect x="30" y="332" width="408" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="365" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRESENT</text><text x="50" y="391.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">For the text</text><text x="50" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“the writer presents”, “the speaker</text><text x="50" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reveals”: the text exists now each time it</text><text x="50" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is read.</text><rect x="462" y="332" width="408" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="386" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PAST</text><text x="482" y="412.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">For historical context only</text><text x="482" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“the play was first performed”</text><rect x="30" y="502" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="538" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sentence variety</text><text x="50" y="567.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Vary sentences: a complex sentence links ideas (“Although she appears calm, her repeated</text><text x="50" y="589.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">questions suggest panic”); an occasional short one gives emphasis. Not every sentence</text><text x="50" y="611.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">should begin “The writer”.</text>
</svg>