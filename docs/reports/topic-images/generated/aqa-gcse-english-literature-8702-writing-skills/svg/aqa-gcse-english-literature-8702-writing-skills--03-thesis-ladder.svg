<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" width="900" height="511" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="511" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a thesis</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Open with a direct answer you will defend throughout</text>
<rect x="30" y="120" width="840" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="156" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="163.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="163" font-size="19" font-weight="700" fill="#4a5568" text-anchor="start">Weak</text><text x="220" y="163" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Shakespeare presents ambition in many ways.”</text><rect x="90" y="204" width="780" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="124" cy="251" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="124" y="258.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="156" y="258" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Better</text><text x="280" y="245.5" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Shakespeare presents ambition as attractive at first and</text><text x="280" y="270.5" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">destructive by the end.”</text><rect x="150" y="310" width="720" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="184" cy="369.5" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="184" y="376.7" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="216" y="376.5" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Strongest</text><text x="340" y="351.5" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Shakespeare presents ambition as a force that isolates</text><text x="340" y="376.5" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the people who pursue it, so that by the final act</text><text x="340" y="401.5" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">success and loneliness have become the same thing.”</text><text x="30" y="463" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A good thesis is:</text><rect x="200" y="443" width="104" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="252" y="465.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">arguable</text><rect x="316" y="443" width="104" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="368" y="465.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">specific</text><rect x="432" y="443" width="221" height="33" rx="16.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="542.5" y="465.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">about the whole text</text>
</svg>