<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="486" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The reader-reaction test</text>

<text x="230" y="106" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">Claim</text><rect x="30" y="126" width="400" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="230" y="164.54000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Homework in primary schools does</text><text x="230" y="188.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">more harm than good.”</text><line x1="230" y1="220" x2="230" y2="252" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="230" y="278" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">a reader replies:</text><rect x="70" y="296" width="300" height="52" rx="26" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><path d="M120,347 l-8,18 l22,-18 z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round"/><rect x="110" y="344" width="26" height="5" fill="#f2e7b8"/><text x="220" y="329" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Why?”</text><rect x="100" y="376" width="300" height="52" rx="26" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><path d="M150,427 l-8,18 l22,-18 z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round"/><rect x="140" y="424" width="26" height="5" fill="#f2e7b8"/><text x="250" y="409" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“No, I don’t think so.”</text><text x="670" y="106" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Fact</text><rect x="470" y="126" width="400" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="670" y="164.54000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“The school day currently ends at 3.30</text><text x="670" y="188.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">p.m.”</text><line x1="670" y1="220" x2="670" y2="252" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="670" y="278" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">a reader replies:</text><rect x="510" y="296" width="300" height="52" rx="26" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><path d="M560,347 l-8,18 l22,-18 z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round"/><rect x="550" y="344" width="26" height="5" fill="#dce9e7"/><text x="660" y="329" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Is that so?”</text><rect x="540" y="376" width="300" height="52" rx="26" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><path d="M590,427 l-8,18 l22,-18 z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round"/><rect x="580" y="424" width="26" height="5" fill="#dce9e7"/><text x="690" y="409" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“OK.”</text><line x1="450" y1="96" x2="450" y2="456" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 6"/>
</svg>