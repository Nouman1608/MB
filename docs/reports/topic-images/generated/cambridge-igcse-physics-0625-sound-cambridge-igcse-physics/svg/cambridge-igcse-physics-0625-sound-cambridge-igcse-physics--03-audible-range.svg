<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The audible range and ultrasound</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Ultrasound is still sound: a longitudinal mechanical wave above 20 kHz</text><rect x="131.1750992628768" y="220" width="509.99999999999994" height="60" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="641.1750992628768" y="220" width="199.93551403946594" height="60" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="386.17509926287676" y="257" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">audible to humans</text><text x="741.1428562826097" y="257" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">ultrasound</text><line x1="80" y1="300" x2="861.1106133023427" y2="300" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="131.1750992628768" y1="290" x2="131.1750992628768" y2="310" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><text x="131.1750992628768" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">20 Hz</text><line x1="641.1750992628768" y1="290" x2="641.1750992628768" y2="310" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><text x="641.1750992628768" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">20 000 Hz (20 kHz)</text><text x="841.1106133023427" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">frequency</text><text x="450" y="190" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">frequency scale not linear</text><rect x="30" y="380" width="840" height="122" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="416" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Wavelength with v = 340 m/s (λ = v / f)</text><text x="50" y="450" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">20 Hz:  λ = 340 / 20 = 17 m</text><text x="50" y="482" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">20 000 Hz:  λ = 340 / 20 000 = 0.017 m (1.7 cm)</text>
