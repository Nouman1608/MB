<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring the speed of sound with echoes</text>

<rect x="30" y="110" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="760" y="150" width="40" height="210" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><text x="780" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">wall</text><circle cx="110" cy="250" r="18" fill="#e8c9a8" stroke="#1e2a44" stroke-width="2.5"/><rect x="96" y="268" width="28" height="70" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">clapper</text><line x1="140" y1="230" x2="750" y2="230" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="750" y1="280" x2="140" y2="280" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="445" y="220" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">to the wall: 85 m</text><text x="445" y="306" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">echo back: 85 m</text><rect x="30" y="400" width="840" height="186" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="436" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 1: clap in time with the echoes, 20 intervals in 10.2 s</text><text x="50" y="470" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">one interval = 10.2 / 20 = 0.51 s</text><text x="50" y="502" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">distance = 2 × 85 = 170 m</text><text x="50" y="534" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">speed = 170 / 0.51 = 333 m/s  (330 m/s to 2 s.f.)</text><text x="50" y="566" font-size="19" font-weight="600" fill="#4a5568" text-anchor="start">forgetting the 2 gives 167 m/s: clearly wrong</text><rect x="30" y="601" width="840" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="636.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Other method: two observers at least 100 m apart; start on seeing the action, stop on hearing it.</text>
</svg>