<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Justifying a change in four parts</text>

<rect x="30" y="110" width="840" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="163" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="172.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="128" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">What changed</text><text x="128" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">finger joints → glued butt joints with 19 mm panel pins; scroll saw, not</text><text x="128" y="197" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">laser cutter</text><rect x="30" y="230" width="840" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="283" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="292.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="128" y="268" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Why</text><text x="128" y="296" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">laser cutter out of action (technician’s notice); finger joints not</text><text x="128" y="317" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">accurate to ±1 mm on a scroll saw</text><rect x="30" y="350" width="840" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="403" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="412.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="128" y="388" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Effect on the solution</text><text x="128" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">butt joints are weaker: test the strength point (ten full paint pots) in</text><text x="128" y="437" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Criterion D; client agreed the look</text><rect x="30" y="470" width="840" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="523" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="532.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="128" y="508" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Effect on the plan</text><text x="128" y="536" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cutting +25 min, sanding +10 min, taken from contingency; panel pins and</text><text x="128" y="557" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pin hammer added</text><rect x="30" y="600" width="840" height="100" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="636" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Partial: cause only</text><text x="52" y="666" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“I changed to butt joints because the laser cutter was broken.”</text>
</svg>