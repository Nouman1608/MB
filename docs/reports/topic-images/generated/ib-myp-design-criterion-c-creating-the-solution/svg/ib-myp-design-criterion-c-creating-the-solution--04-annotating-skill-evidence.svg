<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Showing technical skill in the folder</text>

<rect x="30" y="110" width="840" height="100" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Not evidence</text><text x="52" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Photo 4: drilling”</text><rect x="30" y="230" width="840" height="330" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="266" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Evidence: every image is annotated</text><rect x="55" y="290" width="240" height="180" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="105" y="400" width="140" height="40" rx="3" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="105" y="360" width="140" height="40" rx="3" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><rect x="160" y="300" width="30" height="48" rx="3" fill="#7d8592" stroke="#1e2a44" stroke-width="2"/><path d="M175,348 L175,392" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="80" y="368" width="25" height="64" rx="3" fill="#7d8592" stroke="#1e2a44" stroke-width="2"/><rect x="245" y="368" width="25" height="64" rx="3" fill="#7d8592" stroke="#1e2a44" stroke-width="2"/><text x="175" y="495" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Photo 4</text><line x1="298" y1="380" x2="330" y2="316" stroke="#2e6b62" stroke-width="2" marker-end="url(#ahT)"/><rect x="336" y="290" width="510" height="56" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="356" y="325" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">What it shows</text><text x="530" y="325" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drilling the 12 mm handle holes</text><line x1="298" y1="380" x2="330" y2="382" stroke="#2e6b62" stroke-width="2" marker-end="url(#ahT)"/><rect x="336" y="356" width="510" height="56" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="356" y="391" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Skill involved</text><text x="530" y="391" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">both ends clamped together</text><line x1="298" y1="380" x2="330" y2="448" stroke="#2e6b62" stroke-width="2" marker-end="url(#ahT)"/><rect x="336" y="422" width="510" height="56" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="356" y="457" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">What was checked</text><text x="530" y="457" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so the holes line up</text><text x="55" y="538" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Also show: why this technique, accuracy against tolerance, safe working.</text><rect x="30" y="580" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="616" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Accuracy example</text><text x="55" y="646" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">All nine parts within ±1 mm; the divider was 0.5 mm oversize and was sanded to fit.</text>
</svg>