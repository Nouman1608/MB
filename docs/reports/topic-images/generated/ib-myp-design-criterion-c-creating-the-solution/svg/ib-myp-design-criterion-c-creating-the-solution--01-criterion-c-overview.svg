<rect width="900" height="745" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criterion C between choosing and testing</text>

<rect x="30" y="110" width="170" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><circle cx="66" cy="156" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="163.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="94" y="150" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">chosen</text><text x="94" y="170" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">design</text><rect x="700" y="110" width="170" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><circle cx="736" cy="156" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="736" y="163.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="764" y="150" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">tests and</text><text x="764" y="170" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">evaluation</text><line x1="202" y1="156" x2="240" y2="156" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="660" y1="156" x2="698" y2="156" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="244" y="110" width="412" height="92" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">C: Creating the solution</text><text x="450" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">plan it, then follow the plan</text><rect x="30" y="230" width="840" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="273" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="78" y="280.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="120" y="266" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Logical plan</text><text x="120" y="294" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">steps in a workable order, with time and resources for each</text><rect x="30" y="330" width="840" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="373" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="380.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="120" y="366" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Technical skills</text><text x="120" y="394" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">suitable tools, materials, software and techniques, used accurately and safely, and shown</text><rect x="30" y="430" width="840" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="473" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="78" y="480.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="120" y="466" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Following the plan</text><text x="120" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">make it in the planned order and record what happened</text><rect x="30" y="530" width="840" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="573" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="580.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="120" y="566" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Justifying changes</text><text x="120" y="594" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">explain any change to the design or the plan, with reasons and effects</text><rect x="30" y="640" width="840" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="676" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Outcome: a prototype sufficient for testing and evaluation</text><text x="450" y="700" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a model, prototype, product or system</text>
</svg>