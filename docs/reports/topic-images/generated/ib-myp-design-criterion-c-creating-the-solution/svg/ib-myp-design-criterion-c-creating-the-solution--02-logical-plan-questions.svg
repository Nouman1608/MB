<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes a plan logical</text>

<rect x="30" y="110" width="200" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What?</text><rect x="30" y="184" width="200" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="130" y="214" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">one clear action</text><text x="130" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">“drill two 12 mm</text><text x="130" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">holes in the end</text><text x="130" y="284" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">pieces”</text><rect x="243" y="110" width="200" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="343" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">In what order?</text><rect x="243" y="184" width="200" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="343" y="214" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">depends on earlier steps</text><text x="343" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">cut before sand;</text><text x="343" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">dry-fit before glue</text><rect x="456" y="110" width="200" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="556" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">How long?</text><rect x="456" y="184" width="200" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="556" y="214" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">a time for each step</text><text x="556" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">total checked against</text><text x="556" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lessons</text><rect x="669" y="110" width="200" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="769" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">With what?</text><rect x="669" y="184" width="200" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="769" y="214" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">resources</text><text x="769" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">materials, tools,</text><text x="769" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">software, people,</text><text x="769" y="284" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">cost</text><text x="450" y="352" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Strong plans add two more columns</text><rect x="140" y="368" width="290" height="52" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="285" y="399.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Safety: risk and control</text><rect x="470" y="368" width="290" height="52" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="615" y="399.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Quality check: e.g. ±1 mm</text><rect x="30" y="444" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="480" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Flowchart: a check can send you back a step</text><rect x="70" y="540" width="170" height="60" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="155" y="575.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cut parts</text><path d="M420,510 L520,570 L420,630 L320,570 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="420" y="562" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">within</text><text x="420" y="582" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">±1 mm?</text><line x1="242" y1="570" x2="316" y2="570" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="524" y1="570" x2="640" y2="570" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="582" y="558" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">yes</text><rect x="646" y="540" width="190" height="60" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="741" y="575.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Next step</text><path d="M420,632 L420,655 L155,655 L155,606" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="300" y="648" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no: re-cut</text>
</svg>