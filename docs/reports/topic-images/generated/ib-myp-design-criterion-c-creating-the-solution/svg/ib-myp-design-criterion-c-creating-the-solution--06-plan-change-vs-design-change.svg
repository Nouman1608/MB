<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One event, two kinds of change</text>

<rect x="250" y="110" width="400" height="70" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="140" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Event</text><text x="450" y="166" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">laser cutter out of action in week 2</text><line x1="370" y1="182" x2="240" y2="232" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="530" y1="182" x2="660" y2="232" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="240" width="410" height="250" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="278" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Change to the PLAN</text><text x="55" y="304" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how or when you make it</text><text x="55" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">order of steps, time,</text><text x="55" y="368" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">tool or machine</text><rect x="55" y="404" width="360" height="66" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="432" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">parts cut on a scroll saw</text><text x="235" y="453" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">instead of the laser cutter</text><rect x="460" y="240" width="410" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="278" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Change to the DESIGN</text><text x="485" y="304" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">alters the product itself</text><text x="485" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">material, joint, size,</text><text x="485" y="368" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">feature</text><rect x="485" y="404" width="360" height="66" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.2"/><text x="665" y="432" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">finger joints → glued butt</text><text x="665" y="453" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">joints with panel pins</text><line x1="442" y1="437" x2="482" y2="437" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="450" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Finger joints cannot be cut accurately enough on a scroll saw (±1 mm),</text><text x="450" y="552" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">so the plan change forced a design change.</text><rect x="30" y="575" width="840" height="70" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="617" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Mark up the original plan (a “revised” column); keep both versions visible.</text>
</svg>