or="end">1  Mark out parts</text><rect x="250" y="166" width="54.54545454545455" height="26" rx="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="310.54545454545456" y="185" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">30</text><text x="240" y="223" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">2  Laser-cut parts</text><rect x="304.54545454545456" y="204" width="72.72727272727272" height="26" rx="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="383.27272727272725" y="223" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">40</text><text x="240" y="261" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">3  Sand and check</text><rect x="377.27272727272725" y="242" width="63.63636363636363" height="26" rx="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="446.9090909090909" y="261" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">35</text><text x="240" y="299" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">4  Drill handle holes</text><rect x="440.9090909090909" y="280" width="36.36363636363636" height="26" rx="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="483.27272727272725" y="299" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">20</text><text x="240" y="337" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">5  Dry-fit</text><rect x="477.27272727272725" y="318" width="36.36363636363636" height="26" rx="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.8"/><text x="519.6363636363636" y="337" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">20</text><text x="240" y="375" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">6  Glue and clamp</text><rect x="513.6363636363636" y="356" width="54.54545454545455" height="26" rx="5" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.8"/><text x="574.1818181818182" y="375" font-size="15" fon