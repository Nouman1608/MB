<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Demographic change as cause and effect</text>

<text x="154.66666666666669" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Cause</text><text x="450.00000000000006" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Change</text><text x="745.3333333333334" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Effect on family life</text><rect x="30" y="140" width="249.33333333333334" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contraception, lower</text><text x="46" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">infant mortality, women’s</text><text x="46" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">careers, cost of children</text><line x1="285.33333333333337" y1="185.5" x2="319.33333333333337" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="140" width="249.33333333333334" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Falling birth rate</text><line x1="580.6666666666667" y1="185.5" x2="614.6666666666667" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="140" width="249.33333333333334" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Smaller families; more</text><text x="636.6666666666667" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">resources per child; fewer</text><text x="636.6666666666667" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">siblings and cousins</text><rect x="30" y="245" width="249.33333333333334" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Better diet, sanitation</text><text x="46" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and medicine</text><line x1="285.33333333333337" y1="290.5" x2="319.33333333333337" y2="290.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="245" width="249.33333333333334" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rising life expectancy</text><line x1="580.6666666666667" y1="290.5" x2="614.6666666666667" y2="290.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="245" width="249.33333333333334" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Beanpole families; longer</text><text x="636.6666666666667" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marriages; longer</text><text x="636.6666666666667" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">widowhood</text><rect x="30" y="350" width="249.33333333333334" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower birth rates plus</text><text x="46" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">longer lives</text><line x1="285.33333333333337" y1="395.5" x2="319.33333333333337" y2="395.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="350" width="249.33333333333334" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ageing population</text><line x1="580.6666666666667" y1="395.5" x2="614.6666666666667" y2="395.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="350" width="249.33333333333334" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More older people alone;</text><text x="636.6666666666667" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adult children caring for</text><text x="636.6666666666667" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parents</text><rect x="30" y="455" width="249.33333333333334" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Longer education, careers,</text><text x="46" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing costs</text><line x1="285.33333333333337" y1="511" x2="319.33333333333337" y2="511" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="455" width="249.33333333333334" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children later in life</text><line x1="580.6666666666667" y1="511" x2="614.6666666666667" y2="511" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="455" width="249.33333333333334" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer, older and</text><text x="636.6666666666667" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">better-off parents; middle</text><text x="636.6666666666667" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">generation caring both</text><text x="636.6666666666667" y="546.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ways</text>
</svg>