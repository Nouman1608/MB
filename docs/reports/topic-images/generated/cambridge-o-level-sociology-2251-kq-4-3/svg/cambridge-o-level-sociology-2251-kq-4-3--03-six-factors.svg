<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 483" width="900" height="483" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="483" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why marriage, divorce and cohabitation are changing</text>

<line x1="320" y1="164.5" x2="365" y2="238.6" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="289" x2="365" y2="282.175" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="403" x2="365" y2="322.075" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="154" x2="535" y2="234.925" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="278.5" x2="535" y2="278.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="403" x2="535" y2="322.075" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="278.5" r="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="263" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Marriage,</text><text x="450" y="285.5" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">divorce and</text><text x="450" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">cohabitation</text><g transform="translate(0,0)"><rect x="30" y="104" width="290" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Legislation</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Easier, cheaper divorce;</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">minimum marriage ages delay</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">marriage</text><rect x="30" y="239" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="269.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Attitudes and values</text><text x="46" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Less stigma: people feel freer</text><text x="46" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to cohabit or leave</text><rect x="30" y="353" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="383.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The internet</text><text x="46" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wider pool of partners; new</text><text x="46" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sources of jealousy</text></g><g transform="translate(0,0)"><rect x="580" y="104" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Secularisation</text><text x="596" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Weaker religious pressure to</text><text x="596" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">marry or stay married</text><rect x="580" y="218" width="290" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural expectations</text><text x="596" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Marriage stays near-universal</text><text x="596" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in some groups: change is</text><text x="596" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">uneven</text><rect x="580" y="353" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="383.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Female empowerment</text><text x="596" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Education and income let women</text><text x="596" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">delay, avoid or leave marriage</text></g>
</svg>