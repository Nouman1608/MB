<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 559" width="900" height="559" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="559" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Changing roles of children and grandparents</text>

<rect x="30" y="104" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONJUGAL ROLES</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">From segregated to joint?</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Symmetrical family (similar, not identical roles) and the dual worker family. Feminists: women</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">often keep the main responsibility for the home.</text><rect x="30" y="255" width="408" height="274" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="291.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Children</text><text x="50" y="321.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economic burden: child labour laws,</text><text x="65.2" y="342.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schooling, long dependence</text><text x="50" y="368.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Child-centred families: leisure, spending,</text><text x="65.2" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">where to live</text><text x="50" y="415.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Boomerang children: adults return home</text><text x="65.2" y="436.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">because of housing costs, low pay, debt or</text><text x="65.2" y="457.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unemployment</text><text x="50" y="483.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ariès: childhood as a protected stage is</text><text x="65.2" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">modern</text><rect x="462" y="255" width="408" height="274" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="291.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Grandparents</text><text x="482" y="321.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Childcare that lets parents work</text><text x="482" y="347.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economic support, e.g. help with housing</text><text x="482" y="373.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wisdom and advice</text><text x="482" y="399.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="497.2" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Later may become dependent, cared for by</text><text x="497.2" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the middle generation</text>
</svg>