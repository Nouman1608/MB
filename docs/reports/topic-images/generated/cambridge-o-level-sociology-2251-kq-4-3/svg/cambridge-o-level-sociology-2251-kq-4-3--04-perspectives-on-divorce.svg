<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 437" width="900" height="437" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="437" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What does rising divorce mean?</text>

<rect x="30" y="104" width="411" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTIONALIST</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Marriage is valued highly</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fletcher: people expect more, end marriages</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">that fail, and many remarry.</text><rect x="459" y="104" width="411" height="133" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NEW RIGHT</text><text x="479" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Family breakdown</text><text x="479" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rising divorce and cohabitation harm</text><text x="479" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children.</text><rect x="30" y="253" width="411" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="286" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FEMINIST</text><text x="50" y="312.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Women’s independence</text><text x="50" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Much divorce is initiated by women unwilling</text><text x="50" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to accept inequality.</text><rect x="459" y="253" width="411" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LATE MODERN / POSTMODERN</text><text x="479" y="312.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Individual choice</text><text x="479" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Giddens (1992): the pure relationship lasts</text><text x="479" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">while both are satisfied. Beck and</text><text x="479" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Beck-Gernsheim: individualisation.</text>
</svg>