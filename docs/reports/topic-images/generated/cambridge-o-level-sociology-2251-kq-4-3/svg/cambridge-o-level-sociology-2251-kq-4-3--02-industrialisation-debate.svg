<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="616" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Did industrialisation change the family?</text>

<text x="450" y="124" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Young and Willmott: three stages</text><rect x="30" y="150" width="249.33333333333334" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="183" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRE-INDUSTRIAL</text><text x="50" y="209.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unit of production</text><text x="50" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The family works together</text><line x1="285.33333333333337" y1="229" x2="319.33333333333337" y2="229" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="150" width="249.33333333333334" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="345.33333333333337" y="183" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EARLY INDUSTRIAL</text><text x="345.33333333333337" y="209.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Extended kin</text><text x="345.33333333333337" y="234.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">networks</text><text x="345.33333333333337" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kin help families cope</text><text x="345.33333333333337" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with poverty</text><line x1="580.6666666666667" y1="229" x2="614.6666666666667" y2="229" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="150" width="249.33333333333334" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="640.6666666666667" y="183" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LATER</text><text x="640.6666666666667" y="209.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Symmetrical family</text><text x="640.6666666666667" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Home-centred nuclear</text><text x="640.6666666666667" y="258.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">families; Bethnal Green</text><text x="640.6666666666667" y="279.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to Greenleigh</text><rect x="30" y="326" width="411" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="361.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Parsons: functional fit</text><text x="50" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Industry needed a mobile workforce, so the</text><text x="50" y="410.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">smaller nuclear family became dominant.</text><rect x="459" y="326" width="411" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="361.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Critics: not so simple</text><text x="479" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Historians found nuclear households common</text><text x="479" y="410.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">before industrialisation and extended</text><text x="479" y="431.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">households common during it.</text><rect x="30" y="474" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="510" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Urbanisation today</text><text x="50" y="539.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Young adults move to cities for work but keep rural ties through visits, phones and money</text><text x="50" y="561.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sent home: often a modified extended family, not the end of kinship.</text>
</svg>