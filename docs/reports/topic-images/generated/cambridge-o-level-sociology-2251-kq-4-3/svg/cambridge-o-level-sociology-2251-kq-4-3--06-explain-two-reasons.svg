<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 464" width="900" height="464" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="464" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explain two reasons divorce has risen</text>

<text x="154.66666666666669" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Point</text><text x="450.00000000000006" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Mechanism</text><text x="745.3333333333334" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Link</text><rect x="30" y="140" width="249.33333333333334" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Legislation made divorce</text><text x="46" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">easier, cheaper and</text><text x="46" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quicker</text><line x1="285.33333333333337" y1="185.5" x2="319.33333333333337" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="140" width="249.33333333333334" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Couples in unhappy</text><text x="341.33333333333337" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marriages can end them</text><text x="341.33333333333337" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">legally</text><line x1="580.6666666666667" y1="185.5" x2="614.6666666666667" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="140" width="249.33333333333334" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer empty shell</text><text x="636.6666666666667" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marriages (4.1 concept)</text><rect x="30" y="245" width="249.33333333333334" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Female empowerment:</text><text x="46" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">education and own income</text><line x1="285.33333333333337" y1="290.5" x2="319.33333333333337" y2="290.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="245" width="249.33333333333334" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women no longer depend on</text><text x="341.33333333333337" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a husband financially, so</text><text x="341.33333333333337" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they can leave</text><line x1="580.6666666666667" y1="290.5" x2="614.6666666666667" y2="290.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="245" width="249.33333333333334" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists: progress, not</text><text x="636.6666666666667" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breakdown</text><rect x="30" y="354" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="387.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each reason is separate, explains how it raises divorce, and connects to a concept or</text><text x="50" y="409.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">perspective.</text>
</svg>