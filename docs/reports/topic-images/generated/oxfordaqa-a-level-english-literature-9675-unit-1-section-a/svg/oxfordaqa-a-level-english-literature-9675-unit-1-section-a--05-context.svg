<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 619" width="900" height="619" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="619" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Context the passage can carry</text>

<rect x="30" y="110" width="230" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><rect x="260" y="110" width="230" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="272" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Most relevant to</text><rect x="490" y="110" width="380" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="502" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What it brings</text><rect x="30" y="156" width="230" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="181.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Revenge tragedy</text><text x="42" y="202.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">conventions</text><rect x="260" y="156" width="230" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="272" y="181.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hamlet; The Duchess of</text><text x="272" y="202.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Malfi</text><rect x="490" y="156" width="380" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="502" y="181.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Delay, feigned madness, the ghost or</text><text x="502" y="202.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">haunting past, a violent final act.</text><rect x="30" y="220" width="230" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="245.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Morality-play</text><text x="42" y="266.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">tradition</text><rect x="260" y="220" width="230" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="272" y="245.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Doctor Faustus</text><rect x="490" y="220" width="380" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="502" y="245.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Good and Evil Angels, the Seven Deadly</text><text x="502" y="266.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sins: salvation or damnation.</text><rect x="30" y="284" width="230" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="309.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The fall of the great</text><rect x="260" y="284" width="230" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="272" y="309.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">King Lear; Othello</text><rect x="490" y="284" width="380" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="502" y="309.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A person of high rank falls from</text><text x="502" y="330.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prosperity.</text><rect x="30" y="348" width="230" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="373.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ideas of order</text><rect x="260" y="348" width="230" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="272" y="373.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Duchess of Malfi;</text><text x="272" y="394.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">King Lear</text><rect x="490" y="348" width="380" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="502" y="373.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kingship, inheritance, family and gender</text><text x="502" y="394.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hierarchies disturbed.</text><rect x="30" y="412" width="230" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="437.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Performance conditions</text><rect x="260" y="412" width="230" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="272" y="437.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The stage itself</text><rect x="490" y="412" width="380" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="502" y="437.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Daylight and candlelit theatres, boy</text><text x="502" y="458.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">actors, a bare stage where language creates</text><text x="502" y="479.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">place.</text><rect x="30" y="515" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="548.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">All three assessment objectives are weighted equally, so weave context in: use it only when</text><text x="50" y="570.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">it explains the effect of a specific line or stage moment.</text>
</svg>