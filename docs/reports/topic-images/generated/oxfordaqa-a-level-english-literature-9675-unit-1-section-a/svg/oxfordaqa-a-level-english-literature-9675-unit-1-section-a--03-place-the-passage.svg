<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Step 1: place the passage</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From order to disorder, through complication to catastrophe</text>
<rect x="30" y="120" width="840" height="338" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M70,180 L89,180.2003733073467 L108,180.80025786131606 L127,181.79595517415103 L146,183.181326440815 L165,184.94783038676636 L184,187.08457592775608 L203,189.578389316984 L222,192.4138953656284 L241,195.57361223599798 L260,199.0380592228744 L279,202.78587685853807 L298,206.79395860098924 L317,211.03759329346332 L336,215.49061751692946 L355,220.12557689626917 L374,224.9138953656284 L393,229.82605134936614 L412,234.831759772385 L431,239.90015877769008 L450,245 L469,250.09984122230992 L488.00000000000006,255.168240227615 L506.99999999999994,260.17394865063386 L526,265.08610463437157 L545,269.8744231037308 L564,274.50938248307057 L583,278.9624067065367 L602,283.20604139901076 L621,287.2141231414619 L640,290.9619407771256 L659,294.426387764002 L678,297.58610463437157 L697,300.42161068301596 L716,302.9154240722439 L735,305.0521696132337 L754,306.81867355918496 L773,308.204044825849 L792,309.199742138684 L811,309.7996266926533 L830,310" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="70" y="164" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">order</text><text x="470" y="223" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">complication</text><text x="830" y="292" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">catastrophe</text><line x1="184" y1="200.08457592775608" x2="184" y2="340" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="678" y1="310.58610463437157" x2="678" y2="340" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="184" cy="187.08457592775608" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="184" y="193.08457592775608" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">E</text><circle cx="678" cy="297.58610463437157" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="678" y="303.58610463437157" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">L</text><rect x="54" y="340" width="330" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="68" y="368.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Early passage</text><text x="68" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Usually sets up the flaw or the</text><text x="68" y="417.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">contest of power.</text><rect x="516" y="340" width="330" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="530" y="368.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Late passage</text><text x="530" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Usually shows recognition, suffering</text><text x="530" y="417.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or catastrophe.</text><rect x="30" y="476" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="509.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Also ask what the audience knows that the characters do not, before analysing a single</text><text x="50" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">word.</text>
</svg>