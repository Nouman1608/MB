<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the passage in four steps</text>

<line x1="62" y1="130" x2="62" y2="530" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="110" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Place it</text><text x="128" y="175.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Where in the tragic arc? What does the audience know that the characters do not?</text><circle cx="62" cy="155" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="163.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="212" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="248" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the dramatic method closely</text><text x="128" y="277.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Verse and shifts into prose, broken or shared lines, soliloquy and aside, imagery</text><text x="128" y="299.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">clusters, rhetorical questions, embedded stage directions.</text><circle cx="62" cy="268" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="276.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="336" width="762" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="372" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Name the aspect at stake</text><text x="128" y="401.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Tie each point to an aspect of tragedy, not just a feature.</text><circle cx="62" cy="381" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="389.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="438" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="474" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reach outward</text><text x="128" y="503.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">At least two other moments from memory: one it anticipates, one it echoes or</text><text x="128" y="525.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reverses.</text><circle cx="62" cy="494" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="502.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="572" width="397" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="637" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OBSERVATION</text><text x="50" y="662.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Iago speaks in prose here.”</text><line x1="433" y1="646" x2="467" y2="646" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="572" width="397" height="148" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="493" y="605" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ANALYSIS OF A TRAGIC ASPECT</text><text x="493" y="629.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">His slide into plain prose makes</text><text x="493" y="651.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">manipulation sound like friendly</text><text x="493" y="673.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">common sense: how the villain wins</text><text x="493" y="695.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">the contest of power.</text>
</svg>