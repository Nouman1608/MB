<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 701" width="900" height="701" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="701" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the model paragraph works</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Original passage: the Count looks at his hand</text>
<rect x="30" y="120" width="330" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="172.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Bring me a candle. No, take</text><text x="46" y="195.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">it away”</text><line x1="364" y1="177" x2="386" y2="177" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="390" y="120" width="480" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="406" y="148" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contradictory orders: a mind that wants and refuses</text><text x="406" y="169" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">illumination; light symbolises knowledge he cannot</text><text x="406" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bear.</text><text x="406" y="215" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">insight · method: contradictory commands</text><rect x="30" y="246" width="330" height="95" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="277.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">the hand that “once held / My</text><text x="46" y="300.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">father’s sword in honour” vs</text><text x="46" y="323.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“has learned the trick”</text><line x1="364" y1="293.5" x2="386" y2="293.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="390" y="246" width="480" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="406" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The fall from former prosperity to corruption; “trick”</text><text x="406" y="295" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">makes murder a learned craft.</text><text x="406" y="320" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">the fall · method: imagery</text><rect x="30" y="353" width="330" height="93" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="395" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(He looks at his hand.) “It</text><text x="46" y="418" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">does not shake.”</text><line x1="364" y1="399.5" x2="386" y2="399.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="390" y="353" width="480" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="406" y="381" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">He becomes a spectator of himself; horrified less by</text><text x="406" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the crime than by his calm.</text><text x="406" y="427" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">method: embedded stage direction</text><rect x="30" y="458" width="330" height="93" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Let them wait.” / “one who is</text><text x="46" y="523" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">not here”</text><line x1="364" y1="504.5" x2="386" y2="504.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="390" y="458" width="480" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="406" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A shared line: the household’s order slipping; the man</text><text x="406" y="507" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the feast honoured has, in effect, died.</text><text x="406" y="532" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">method: shared line</text><rect x="30" y="569" width="410" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="603.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ends on the audience</text><text x="50" y="631.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pity comes from insight arriving too late to</text><text x="50" y="652.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">change anything.</text><rect x="460" y="569" width="410" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="603.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">With a real set play</text><text x="480" y="631.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Also connect the passage to earlier and</text><text x="480" y="652.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">later moments.</text>
</svg>