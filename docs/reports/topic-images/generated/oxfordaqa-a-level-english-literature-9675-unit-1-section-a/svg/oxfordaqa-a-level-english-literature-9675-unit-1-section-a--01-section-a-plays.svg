<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What Section A covers</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">25 of Unit 1’s 50 marks, on one Elizabethan or Jacobean tragedy</text>
<text x="30" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Study one of five plays (specification version 5.3)</text><rect x="30" y="160" width="260" height="56" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="195" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">William Shakespeare</text><g font-style="italic"><rect x="306" y="170" width="94" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="353" y="194.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Othello</text></g><g font-style="italic"><rect x="412" y="170" width="114" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="469" y="194.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">King Lear</text></g><g font-style="italic"><rect x="538" y="170" width="85" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="580.5" y="194.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Hamlet</text></g><rect x="30" y="228" width="260" height="56" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="263" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Christopher Marlowe</text><g font-style="italic"><rect x="306" y="238" width="251" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="431.5" y="262.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Doctor Faustus (B text)</text></g><rect x="30" y="296" width="260" height="56" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="331" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">John Webster</text><g font-style="italic"><rect x="306" y="306" width="221" height="36" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="416.5" y="330.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The Duchess of Malfi</text></g><rect x="30" y="380" width="411" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><path d="M54,406 L102,406 L124,428 L124,502 L54,502 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M102,406 L102,428 L124,428" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><line x1="66" y1="436" x2="90.32" y2="436" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="66" y1="450" x2="108.32" y2="450" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="66" y1="464" x2="100.5" y2="464" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="66" y1="478" x2="108.32" y2="478" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="66" y1="492" x2="108.32" y2="492" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><text x="144" y="432" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The passage</text><text x="144" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">printed on the paper: the</text><text x="144" y="481" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">starting point</text><rect x="459" y="380" width="411" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="520" cy="454" r="34" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="520" y="464" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">?</text><text x="574" y="432" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The rest of the play</text><text x="574" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from memory: Unit 1 is closed</text><text x="574" y="481" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">book</text><text x="30" y="570" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Doctor Faustus survives in two early versions</text><line x1="60" y1="622" x2="840" y2="622" stroke="#1e2a44" stroke-width="3"/><rect x="120" y="598" width="260" height="48" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="629" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A text · printed 1604</text><rect x="500" y="592" width="320" height="60" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="618" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">B text · printed 1616</text><text x="660" y="640" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">longer; adds and alters scenes</text><text x="660" y="680" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">the version the specification names</text><rect x="30" y="700" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="733.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Set texts can change between specification versions (a revised 9675 is published for</text><text x="50" y="755.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">teaching from 2027), so confirm your list with your teacher.</text>
