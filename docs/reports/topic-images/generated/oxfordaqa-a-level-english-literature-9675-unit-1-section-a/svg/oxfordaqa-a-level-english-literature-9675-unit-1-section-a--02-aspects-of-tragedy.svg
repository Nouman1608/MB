<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 729" width="900" height="729" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="729" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Aspects a passage can open up</text>

<line x1="330" y1="170.5" x2="382" y2="281.65" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="295" x2="382" y2="325.225" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="398.5" x2="382" y2="361.45" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="512.5" x2="382" y2="401.35" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="227.5" x2="518" y2="301.6" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="331" x2="518" y2="337.825" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="445" x2="518" y2="377.725" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="341.5" r="80" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="348.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The passage</text><g transform="translate(0,0)"><rect x="30" y="110" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="140.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The protagonist’s journey</text><text x="46" y="168.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Flaws, pride and folly,</text><text x="46" y="189.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">blindness and insight,</text><text x="46" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">discovery, moral values.</text><rect x="30" y="245" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="275.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The villain or opponent</text><text x="46" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“A contest of power”; partly</text><text x="46" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">responsible for the fall.</text><rect x="30" y="359" width="300" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="389.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fate</text><text x="46" y="417.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Is the end inevitable?</text><rect x="30" y="452" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="482.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><text x="46" y="510.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“From order to disorder”,</text><text x="46" y="531.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“through complication to</text><text x="46" y="552.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">catastrophe”.</text></g><g transform="translate(0,67.5)"><rect x="570" y="110" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="140.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Plots and sub-plots</text><text x="586" y="168.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A scene that mirrors or</text><text x="586" y="189.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">contrasts another strand.</text><rect x="570" y="224" width="300" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="254.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dramatic language</text><text x="586" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Used to heighten the tragedy.</text><rect x="570" y="317" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="347.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The audience</text><text x="586" y="375.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Through pity and fear to an</text><text x="586" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">understanding of the human</text><text x="586" y="417.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">condition”.</text></g><rect x="30" y="593" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="629" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">No fixed checklist</text><text x="50" y="658.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“The absence of an ‘aspect’ can be as significant as its presence”: a hero with no insight,</text><text x="50" y="680.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or a villain without motive, can carry as much tragic weight.</text>
</svg>