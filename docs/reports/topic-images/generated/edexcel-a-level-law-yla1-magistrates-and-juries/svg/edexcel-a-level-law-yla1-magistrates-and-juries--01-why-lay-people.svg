<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why use lay people?</text>

<rect x="30" y="110" width="411" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MAGISTRATES</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Decide the great majority of criminal</text><text x="50" y="195.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">cases</text><rect x="459" y="110" width="411" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JURIES</text><text x="479" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Decide guilt in the most serious cases</text><line x1="450" y1="291" x2="450" y2="481" stroke="#1e2a44" stroke-width="5"/><path d="M390,501 L510,501 L480,481 L420,481 Z" fill="#1e2a44"/><line x1="190" y1="321" x2="710" y2="321" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><circle cx="450" cy="321" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="190" y1="321" x2="100" y2="381" stroke="#1e2a44" stroke-width="2"/><line x1="190" y1="321" x2="280" y2="381" stroke="#1e2a44" stroke-width="2"/><rect x="40" y="381" width="300" height="150" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="190" y="415" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Justification</text><text x="190" y="449" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">democratic participation:</text><text x="190" y="477" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">justice by the community,</text><text x="190" y="505" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">not only professionals</text><line x1="710" y1="321" x2="620" y2="381" stroke="#1e2a44" stroke-width="2"/><line x1="710" y1="321" x2="800" y2="381" stroke="#1e2a44" stroke-width="2"/><rect x="560" y="381" width="300" height="150" rx="16" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="710" y="415" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Criticisms</text><text x="710" y="449" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">competence</text><text x="710" y="477" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">consistency</text><text x="710" y="505" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">representativeness</text><text x="450" y="261" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">A lay person has no legal qualification</text>
