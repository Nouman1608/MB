<rect width="900" height="631" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What magistrates do</text>

<rect x="30" y="110" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="110" cy="188" r="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M84,236 Q84,210 110,210 Q136,210 136,236 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="260" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">JP</text><circle cx="190" cy="188" r="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M164,236 Q164,210 190,210 Q216,210 216,236 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="190" y="260" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">JP</text><circle cx="270" cy="188" r="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M244,236 Q244,210 270,210 Q296,210 296,236 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="270" y="260" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">JP</text><text x="190" y="146" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">three lay magistrates: the bench</text><circle cx="420" cy="188" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M394,236 Q394,210 420,210 Q446,210 446,236 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="420" y="260" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">legal adviser</text><text x="470" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">advises on law and</text><text x="470" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">procedure; must not</text><text x="470" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">take part in the decision</text><circle cx="720" cy="188" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M694,236 Q694,210 720,210 Q746,210 746,236 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="260" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">District Judge</text><text x="760" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">professional;</text><text x="760" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sits alone in</text><text x="760" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">busier courts</text><rect x="30" y="300" width="268" height="221" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="333" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRIMINAL</text><text x="50" y="359.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Trials and first hearings</text><text x="50" y="387" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="387" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">all summary offences</text><text x="50" y="412" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">most either way offences, if D</text><text x="64.25" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">agrees</text><text x="50" y="457" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="457" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">first hearings for indictable</text><text x="64.25" y="477" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">offences, then sent to the</text><text x="64.25" y="497" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Crown Court</text><rect x="316" y="300" width="268" height="221" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="333" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRE-TRIAL</text><text x="336" y="359.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bail and warrants</text><text x="336" y="387" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.25" y="387" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">decide bail</text><text x="336" y="412" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.25" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">issue search and arrest</text><text x="350.25" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">warrants</text><rect x="602" y="300" width="268" height="221" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="333" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OTHER COURTS</text><text x="622" y="359.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Youth and family</text><text x="622" y="387" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="636.25" y="387" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">youth court: ages 10 to 17</text><text x="622" y="412" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="636.25" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">family court</text><rect x="30" y="537" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="575" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Custodial powers are limited and the single-offence limit has changed often: check the current figure.</text>
</svg>