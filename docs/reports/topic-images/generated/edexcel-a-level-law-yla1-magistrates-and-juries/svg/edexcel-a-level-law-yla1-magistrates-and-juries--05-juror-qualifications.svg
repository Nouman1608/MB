<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" width="900" height="582" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="582" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who can be a juror?</text>

<text x="450" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Juries Act 1974, s 1, as amended</text><rect x="30" y="146" width="192" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="126" y="182" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Electoral register</text><text x="126" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">registered</text><text x="233" y="202" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="244" y="146" width="192" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="340" y="182" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Age 18 to 75</text><text x="340" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">raised from 70 by the</text><text x="340" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">CJCA 2015</text><text x="447" y="202" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="458" y="146" width="192" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="554" y="182" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Resident 5 years</text><text x="554" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">in the UK since the age</text><text x="554" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">of 13</text><text x="661" y="202" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="672" y="146" width="192" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="768" y="182" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Not disqualified</text><text x="768" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and not mentally</text><text x="768" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">disordered</text><rect x="30" y="270" width="411" height="202" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="303" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DISQUALIFIED</text><text x="50" y="330.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criminal history</text><text x="50" y="358" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ever sentenced to life, or to custody of five years</text><text x="64.25" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">or more</text><text x="50" y="403" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="403" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">in the last ten years: served any custody, or a</text><text x="64.25" y="423" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">suspended sentence or community order</text><text x="50" y="448" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="448" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">currently on bail in criminal proceedings</text><rect x="459" y="270" width="411" height="202" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRIMINAL JUSTICE ACT 2003</text><text x="479" y="330.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judges, lawyers and police can now</text><text x="479" y="355.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">serve</text><text x="479" y="383" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R v Abdroikov</tspan> [2007]: in two of three appeals a</text><text x="479" y="403" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fair-minded observer would see a real possibility of</text><text x="479" y="423" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bias with a police officer or CPS lawyer on the jury;</text><text x="479" y="443" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">those convictions were quashed.</text><rect x="30" y="488" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="526" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Anyone may ask to be excused for a good reason, or to defer service to another time.</text>
</svg>