<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 717" width="900" height="717" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="717" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Magistrates: for and against</text>

<rect x="30" y="110" width="411" height="44" rx="12" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="139" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Advantages</text><rect x="459" y="110" width="411" height="44" rx="12" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><text x="483" y="139" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Disadvantages</text><rect x="30" y="166" width="411" height="57" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Local knowledge of the area</text><rect x="459" y="166" width="411" height="57" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Local knowledge may be limited or out of date</text><rect x="30" y="233" width="411" height="57" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="265.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheap: unpaid</text><rect x="459" y="233" width="411" height="57" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="265.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can rely heavily on the legal adviser</text><rect x="30" y="300" width="411" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="343.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lay involvement: justice by the community</text><rect x="459" y="300" width="411" height="78" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Profile tends to be older and from professional</text><text x="479" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">backgrounds</text><rect x="30" y="388" width="411" height="57" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A bench of three balances individual views</text><rect x="459" y="388" width="411" height="57" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sentencing can be inconsistent between areas</text><rect x="30" y="455" width="411" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Few successful appeals, suggesting sound</text><text x="50" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decisions</text><rect x="459" y="455" width="411" height="78" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Risk of becoming "case-hardened" and</text><text x="479" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prosecution-minded (<tspan font-style="italic">Jowitt</tspan>)</text><rect x="30" y="553" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="586" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">A CASE ON BIAS</text><text x="50" y="613.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v Bingham Justices, ex parte Jowitt</tspan> (1974)</text><text x="50" y="641.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The chairman said his principle was always to believe the police officer’s evidence; the conviction was</text><text x="50" y="662.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quashed because the defendant had not had a fair hearing.</text>
</svg>