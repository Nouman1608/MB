<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 591" width="900" height="591" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: an evaluation plan</text>

<text x="450" y="128" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Question: <tspan font-style="italic">Evaluate the use of juries in criminal trials.</tspan></text><circle cx="54" cy="193.5" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="199.98" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="86" y="150" width="784" height="87" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="184.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">AO1: knowledge</text><text x="106" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">qualifications under the Juries Act 1974, selection, role in the Crown Court, majority verdicts</text><line x1="54" y1="211.5" x2="54" y2="261" stroke="#c9d6d4" stroke-width="3"/><circle cx="54" cy="294.5" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="300.98" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="86" y="251" width="784" height="87" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="106" y="285.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">For</text><text x="106" y="313.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">participation; independence (<tspan font-style="italic">Bushell</tspan>, <tspan font-style="italic">Ponting</tspan>); a cross-section; secrecy reduces pressure</text><line x1="54" y1="312.5" x2="54" y2="362" stroke="#c9d6d4" stroke-width="3"/><circle cx="54" cy="395.5" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="401.98" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="86" y="352" width="784" height="87" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="106" y="386.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Against</text><text x="106" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no reasons; misconduct (<tspan font-style="italic">Young</tspan>, <tspan font-style="italic">Fraill</tspan>); possible bias (<tspan font-style="italic">Sander</tspan>, <tspan font-style="italic">Abdroikov</tspan>); cost and time</text><line x1="54" y1="413.5" x2="54" y2="463" stroke="#c9d6d4" stroke-width="3"/><circle cx="54" cy="507" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="513.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="86" y="453" width="784" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="106" y="487.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Conclude</text><text x="106" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. justified for serious offences for their democratic value, with reforms such as the 2015</text><text x="106" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">research offence to protect fair trials</text>
</svg>