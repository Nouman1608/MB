<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 799" width="900" height="799" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="799" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Becoming a magistrate</text>

<rect x="30" y="110" width="268" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGE</text><text x="50" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">From 18; retire at 75</text><text x="50" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">raised from 70 in 2022</text><rect x="316" y="110" width="268" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUALIFICATIONS</text><text x="336" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">None in law</text><rect x="602" y="110" width="268" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMITMENT</text><text x="622" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">13 full days a year</text><text x="622" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(26 half-days); unpaid,</text><text x="622" y="217" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">expenses and lost earnings</text><text x="622" y="237" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">claimable</text><text x="450" y="283" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">SIX KEY QUALITIES</text><rect x="30" y="297" width="268" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="325" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Good character</text><rect x="316" y="297" width="268" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="325" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Understanding and communication</text><rect x="602" y="297" width="268" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="325" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Social awareness</text><rect x="30" y="353" width="268" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="381" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Maturity and sound temperament</text><rect x="316" y="353" width="268" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="381" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Sound judgement</text><rect x="602" y="353" width="268" height="44" rx="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="381" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Commitment and reliability</text><circle cx="54" cy="443" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="449.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="86" y="419" width="784" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="100" y="447.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vacancies advertised</text><circle cx="54" cy="514" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="520.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="86" y="477" width="784" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="100" y="505.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Local Advisory Committee interviews</text><text x="100" y="533" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">usually twice, and recommends appointments</text><circle cx="54" cy="598" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="604.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="86" y="561" width="784" height="74" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="100" y="589.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Appointed by the Lord Chief Justice</text><text x="100" y="617" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">historically the Lord Chancellor</text><circle cx="54" cy="682" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="688.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="86" y="645" width="784" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="100" y="673.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Training through the Judicial College</text><text x="100" y="701" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mentoring, observation visits, regular appraisal; it does not make them lawyers</text><text x="450" y="747" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Cannot serve: e.g. certain criminal convictions, undischarged bankrupts, conflicting jobs such as police officers.</text><text x="450" y="771" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">The specification names the Justices of the Peace Act 1979; much of it is now in the Courts Act 2003.</text>
</svg>