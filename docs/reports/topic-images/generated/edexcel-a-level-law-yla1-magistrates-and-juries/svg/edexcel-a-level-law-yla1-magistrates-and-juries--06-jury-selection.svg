<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 861" width="900" height="861" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="861" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a jury is selected</text>

<rect x="70" y="110" width="760" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="144.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Electoral register</text><text x="450" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">names selected at random by computer: Jury Central Summoning Bureau</text><line x1="450" y1="200" x2="450" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="140" y="226" width="620" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="260.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Panel at the Crown Court</text><text x="450" y="288" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">those summoned</text><line x1="450" y1="316" x2="450" y2="338" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="210" y="342" width="480" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="376.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Twelve by ballot</text><text x="450" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">in court, for each trial</text><line x1="450" y1="432" x2="450" y2="454" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="424" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="70" y="458" width="760" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="492.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Vetting</text><text x="450" y="520" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">routine police checks for disqualification; wider checks only in exceptional cases such as national</text><text x="450" y="540" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">security</text><line x1="450" y1="568" x2="450" y2="590" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="70" y="594" width="760" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="628.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Challenges</text><text x="450" y="656" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">for cause by either side; the prosecution may stand by a juror; no peremptory challenge since the</text><text x="450" y="676" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Criminal Justice Act 1988</text><rect x="30" y="720" width="411" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="753" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NO RIGHT TO A RACIALLY MIXED JURY</text><text x="50" y="779.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v Ford</tspan> [1989]</text><rect x="459" y="720" width="411" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="753" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FAIR TRIAL BREACHED</text><text x="479" y="779.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Sander v UK</tspan> (2000)</text><text x="479" y="807" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a juror’s racist jokes were not dealt with adequately</text>
</svg>