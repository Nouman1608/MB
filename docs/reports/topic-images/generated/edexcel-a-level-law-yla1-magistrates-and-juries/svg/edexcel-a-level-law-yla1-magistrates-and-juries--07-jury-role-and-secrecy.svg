<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 806" width="900" height="806" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="806" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The jury’s role and its limits</text>

<rect x="30" y="110" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JURY</text><text x="50" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Decides the facts and returns the verdict</text><rect x="459" y="110" width="411" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUDGE</text><text x="479" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Decides questions of law and passes</text><text x="479" y="193.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">sentence</text><rect x="30" y="235" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="265" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Majority verdicts, Juries Act 1974, s 17</text><text x="54" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">after at least two hours: 11–1 or 10–2</text><text x="846" y="279" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">Civil: rare (fraud, malicious prosecution, false imprisonment)</text><text x="450" y="325" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">SECRECY: INSIDE AND OUTSIDE THE JURY ROOM</text><rect x="250" y="339" width="400" height="120" rx="16" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="375" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Jury room</text><text x="450" y="405" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle"><tspan font-style="italic">R v Mirza</tspan> [2004]: the Lords refused to look into</text><text x="450" y="425" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">what was said</text><rect x="30" y="479" width="268" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="511.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v Young (Stephen)</tspan> [1995]</text><text x="50" y="538" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ouija board in the hotel:</text><text x="50" y="558" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conviction quashed</text><rect x="316" y="479" width="268" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="511.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v Fraill</tspan> [2011]</text><text x="336" y="538" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">contacted a defendant on</text><text x="336" y="558" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Facebook: jailed</text><rect x="602" y="479" width="268" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="622" y="511.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Attorney General v Dallas</tspan></text><text x="622" y="532.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">[2012]</text><text x="622" y="559" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">researched the defendant</text><text x="622" y="579" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">online: jailed</text><rect x="30" y="627" width="411" height="149" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="660" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JURY EQUITY</text><text x="50" y="684.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Bushell’s Case</tspan> (1670); <tspan font-style="italic">R v Ponting</tspan> (1985); <tspan font-style="italic">R v</tspan></text><text x="50" y="705.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Kronlid</tspan> (1996)</text><text x="50" y="732" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">verdict according to conscience: acquittals with no</text><text x="50" y="752" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">apparent legal defence</text><rect x="459" y="627" width="411" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="660" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRIAL WITHOUT A JURY</text><text x="479" y="684.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">CJA 2003, s 44</text><text x="479" y="711" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">real danger of jury tampering: <tspan font-style="italic">R v Twomey</tspan> [2009]</text><text x="479" y="731" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">was the first</text>
</svg>