<!-- place after: ## What has actually been proposed -->
<figure class="topic-figure">

<!-- place after: ## Constraints on reform -->
<figure class="topic-figure">

  <figcaption>Devolution, Northern Ireland and Article 46 limit what Westminster can do alone.</figcaption>

<!-- place after: ## Reform at Strasbourg -->
