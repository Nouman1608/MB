<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five reform options, from weaker to stronger protection</text>

<defs><linearGradient id="rog" x1="0" x2="1"><stop offset="0" stop-color="#f3d9c9"/><stop offset="1" stop-color="#dce9e7"/></linearGradient></defs><path d="M30,100 L830,100 L830,90 L870,120 L830,150 L830,140 L30,140 Z" fill="url(#rog)" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="50" y="127" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LESS EXTERNAL CHECK</text><text x="810" y="127" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">STRONGER PROTECTION</text><clipPath id="tc156"><rect x="30" y="156" width="840" height="454" rx="14"/></clipPath><g clip-path="url(#tc156)"><rect x="30" y="156" width="221.66666666666666" height="44" fill="#b5d3cf"/><text x="42" y="181.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Option</text><rect x="251.66666666666666" y="156" width="303.3333333333333" height="44" fill="#dce9e7"/><text x="263.66666666666663" y="181.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Supporters’ case</text><rect x="555" y="156" width="315" height="44" fill="#f2e7b8"/><text x="567" y="181.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Objections</text><rect x="30" y="200" width="221.66666666666666" height="82" fill="#dce9e7"/><text x="42" y="224" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Withdraw from the</text><text x="42" y="244" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Convention</text><rect x="251.66666666666666" y="200" width="303.3333333333333" height="82" fill="#ffffff"/><text x="263.66666666666663" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Full national control over rights</text><rect x="555" y="200" width="315" height="82" fill="#ffffff"/><text x="567" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Article 58: six months’ notice, but</text><text x="567" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">devolution and the Belfast Agreement</text><text x="567" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">problems; no external check</text><line x1="30" y1="282" x2="870" y2="282" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="282" width="221.66666666666666" height="82" fill="#dce9e7"/><text x="42" y="306" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Replace with a UK Bill of</text><text x="42" y="326" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Rights, stay in the</text><text x="42" y="346" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Convention</text><rect x="251.66666666666666" y="282" width="303.3333333333333" height="82" fill="#f8faf9"/><text x="263.66666666666663" y="306" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Greater “ownership”; could add rights</text><text x="263.66666666666663" y="326" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">such as jury trial</text><rect x="555" y="282" width="315" height="82" fill="#f8faf9"/><text x="567" y="306" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Still bound by Strasbourg judgments, so</text><text x="567" y="326" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">gaps mean more adverse rulings</text><line x1="30" y1="364" x2="870" y2="364" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="364" width="221.66666666666666" height="82" fill="#dce9e7"/><text x="42" y="388" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Amend the HRA (e.g. s2,</text><text x="42" y="408" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">s3)</text><rect x="251.66666666666666" y="364" width="303.3333333333333" height="82" fill="#ffffff"/><text x="263.66666666666663" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Targets specific complaints; rights still</text><text x="263.66666666666663" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">enforceable at home</text><rect x="555" y="364" width="315" height="82" fill="#ffffff"/><text x="567" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Weaker s3 could mean more</text><text x="567" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">declarations and more cases at</text><text x="567" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Strasbourg</text><line x1="30" y1="446" x2="870" y2="446" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="446" width="221.66666666666666" height="82" fill="#dce9e7"/><text x="42" y="470" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Keep the HRA unchanged</text><rect x="251.66666666666666" y="446" width="303.3333333333333" height="82" fill="#f8faf9"/><text x="263.66666666666663" y="470" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">s4 respects sovereignty; most</text><text x="263.66666666666663" y="490" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">declarations acted on; dialogue with</text><text x="263.66666666666663" y="510" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Strasbourg</text><rect x="555" y="446" width="315" height="82" fill="#f8faf9"/><text x="567" y="470" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Leaves the criticisms unanswered</text><line x1="30" y1="528" x2="870" y2="528" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="528" width="221.66666666666666" height="82" fill="#dce9e7"/><text x="42" y="552" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Strengthen: entrench,</text><text x="42" y="572" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">written constitution, social</text><text x="42" y="592" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">rights</text><rect x="251.66666666666666" y="528" width="303.3333333333333" height="82" fill="#ffffff"/><text x="263.66666666666663" y="552" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Harder to remove, wider in scope</text><rect x="555" y="528" width="315" height="82" fill="#ffffff"/><text x="567" y="552" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Conflicts with sovereignty; judges</text><text x="567" y="572" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">deciding spending</text></g><line x1="251.66666666666666" y1="156" x2="251.66666666666666" y2="610" stroke="#c9d6d4" stroke-width="1.5"/><line x1="555" y1="156" x2="555" y2="610" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="156" width="840" height="454" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>