<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 517" width="900" height="517" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="517" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes the HRA hard to change?</text>

<circle cx="450" cy="290" r="84" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Changing</text><text x="450" y="310" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">the HRA</text><line x1="360" y1="177.5" x2="387" y2="239.6" stroke="#1e2a44" stroke-width="2.5"/><line x1="540" y1="157.5" x2="513" y2="239.6" stroke="#1e2a44" stroke-width="2.5"/><line x1="360" y1="417.5" x2="387" y2="340.4" stroke="#1e2a44" stroke-width="2.5"/><line x1="540" y1="407.5" x2="513" y2="340.4" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="100" width="330" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEVOLUTION</text><text x="44" y="157" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Scotland Act 1998, Government of Wales</text><text x="44" y="177" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Act 2006, Northern Ireland Act 1998:</text><text x="44" y="197" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">incompatible devolved acts are outside</text><text x="44" y="217" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">competence. The HRA is <tspan font-weight="700" fill="#1e2a44">entrenched</tspan> in</text><text x="44" y="237" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the settlement</text><rect x="540" y="100" width="330" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="554" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEWEL CONVENTION</text><text x="554" y="157" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Westminster does not normally legislate</text><text x="554" y="177" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">on devolved matters without consent; <tspan font-weight="700" fill="#1e2a44">not</tspan></text><text x="554" y="197" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">legally</tspan> <tspan font-weight="700" fill="#1e2a44">enforceable</tspan></text><rect x="30" y="350" width="330" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="376" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BELFAST AGREEMENT 1998</text><text x="44" y="407" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The Good Friday Agreement: commitment</text><text x="44" y="427" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to incorporate the Convention in Northern</text><text x="44" y="447" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Ireland, with direct access to courts and</text><text x="44" y="467" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">remedies</text><rect x="540" y="350" width="330" height="115" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="554" y="376" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ARTICLE 46</text><text x="554" y="407" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">While a party, the UK must abide by final</text><text x="554" y="427" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Strasbourg judgments, whatever domestic</text><text x="554" y="447" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">law says</text>
</svg>