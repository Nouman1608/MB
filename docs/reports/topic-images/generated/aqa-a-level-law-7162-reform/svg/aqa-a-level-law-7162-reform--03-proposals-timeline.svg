<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 748" width="900" height="748" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="748" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What has actually been proposed, and what happened</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Present proposals as proposals, not as law</text>
<line x1="103" y1="159" x2="103" y2="574" stroke="#c9d6d4" stroke-width="4"/><rect x="196" y="124" width="674" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="208" y="150.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Commission on a Bill of Rights</text><text x="208" y="178" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Majority for a UK Bill of Rights in principle; no agreement on content (Dec 2012)</text><rect x="30" y="139" width="146" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="103" y="165" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2011–12</text><rect x="196" y="203" width="674" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="208" y="229.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conservative manifesto</text><text x="208" y="257" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Pledged to scrap the HRA for a British Bill of Rights</text><rect x="30" y="218" width="146" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="103" y="244" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2015</text><rect x="196" y="282" width="674" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="208" y="308.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Independent Human Rights Act Review</text><text x="208" y="336" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sir Peter Gross: Act working broadly well; limited changes, not repeal</text><rect x="30" y="297" width="146" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="103" y="323" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2020–21</text><rect x="196" y="361" width="674" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="208" y="387.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bill of Rights Bill introduced</text><text x="208" y="415" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Would repeal the HRA: no s3 duty, Strasbourg not binding, permission stage, limits on</text><text x="208" y="435" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">positive obligations</text><rect x="30" y="386" width="146" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="103" y="412" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">June 2022</text><rect x="196" y="460" width="674" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="208" y="486.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bill dropped</text><text x="208" y="514" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Government announced it would not proceed</text><rect x="30" y="475" width="146" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="103" y="501" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">June 2023</text><rect x="196" y="539" width="674" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="208" y="565.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Safety of Rwanda Act</text><text x="208" y="593" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Disapplied key HRA sections for that Act; policy abandoned after the 2024 election</text><rect x="30" y="554" width="146" height="40" rx="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="103" y="580" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2024</text><rect x="30" y="627" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="661.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common mistake</text><text x="50" y="691.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Writing that the Bill of Rights Bill became law. <tspan font-weight="700" fill="#1e2a44">It</tspan> <tspan font-weight="700" fill="#1e2a44">did</tspan> <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">proceed.</tspan></text>
</svg>