<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 697" width="900" height="697" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="697" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plan: should the HRA be replaced by a UK Bill of Rights?</text>

<line x1="60" y1="120" x2="60" y2="645" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="100" width="766" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="124" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTRODUCTION</text><text x="116" y="149.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">State the HRA model (s3, s4, s6) and the option</text><text x="116" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Signal a line of argument</text><circle cx="60" cy="146" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="154.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="200" width="766" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="224" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOR REPLACEMENT</text><text x="116" y="249.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">s3 overreach (<tspan font-style="italic">Ghaidan</tspan>); Strasbourg influence (<tspan font-style="italic">Ullah</tspan>, <tspan font-style="italic">Hirst</tspan>)</text><text x="116" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Evaluate: <tspan font-style="italic">Horncastle</tspan> shows UK courts can push back without new legislation</text><circle cx="60" cy="246" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="254.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="300" width="766" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGAINST</text><text x="116" y="349.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Still bound by Article 46; IHRAR found the Act working well</text><text x="116" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A weaker Bill means more Strasbourg defeats</text><circle cx="60" cy="346" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="354.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="400" width="766" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="424" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSTRAINTS</text><text x="116" y="449.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Devolution and the Belfast Agreement</text><text x="116" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Complicate replacement</text><circle cx="60" cy="446" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="454.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="500" width="766" height="65" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="524" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ALTERNATIVES</text><text x="116" y="549.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Targeted amendment, or strengthening rights</text><circle cx="60" cy="532.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="541.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="573" width="766" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="597" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUSION</text><text x="116" y="622.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reach a judgement</text><text x="116" y="649" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">e.g. targeted amendment answers the criticisms with fewer risks than replacement</text><circle cx="60" cy="619" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="627.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>