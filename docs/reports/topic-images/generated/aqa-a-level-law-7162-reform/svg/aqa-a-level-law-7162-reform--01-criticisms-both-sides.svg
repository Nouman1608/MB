<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criticised from both directions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The Human Rights Act 1998 is attacked for doing too much and too little</text>
<rect x="390" y="144" width="120" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="174" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">HRA</text><text x="450" y="196" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">1998</text><line x1="386" y1="176" x2="250" y2="176" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="514" y1="176" x2="650" y2="176" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="220" y="170" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">LESS judicial or</text><text x="220" y="192" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">European influence</text><text x="680" y="170" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">STRONGER</text><text x="680" y="192" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">protection</text><rect x="30" y="244" width="410" height="93" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="269" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">SECTION 3 REWRITES STATUTES</text><text x="43" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ghaidan</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Godin-Mendoza</tspan> (2004): words read into</text><text x="43" y="320" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the Rent Act 1977</text><rect x="30" y="347" width="410" height="93" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="372" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">SECTION 2 TIES COURTS TO STRASBOURG</text><text x="43" y="403" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ullah</tspan> (2004) “mirror principle”, though s2 only</text><text x="43" y="423" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">requires taking account</text><rect x="30" y="450" width="410" height="73" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="475" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NATIONAL SOVEREIGNTY</text><text x="43" y="506" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Prisoner voting after <tspan font-style="italic">Hirst</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> <tspan font-style="italic">(No</tspan> <tspan font-style="italic">2)</tspan> (2005)</text><rect x="30" y="533" width="410" height="93" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="558" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EXPANDING OBLIGATIONS</text><text x="43" y="589" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Positive obligations and broad Article 8 readings</text><text x="43" y="609" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reach policy, e.g. deportation</text><rect x="460" y="244" width="410" height="93" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="269" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NO ENTRENCHMENT</text><text x="473" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">An ordinary Act: amended or repealed by simple</text><text x="473" y="320" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">majority</text><rect x="460" y="347" width="410" height="73" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="372" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DECLARATIONS DO NOT BIND</text><text x="473" y="403" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Under s4 an incompatible Act stays in force</text><rect x="460" y="430" width="410" height="93" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="455" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIMITED RIGHTS</text><text x="473" y="486" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Civil and political only: no housing or health care</text><text x="473" y="506" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rights</text><rect x="460" y="533" width="410" height="93" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="558" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PUBLIC AUTHORITY GAPS</text><text x="473" y="589" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">YL</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Birmingham</tspan> <tspan font-style="italic">CC</tspan> (2007): private providers outside</text><text x="473" y="609" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">s6 (later closed for publicly arranged care)</text>
</svg>