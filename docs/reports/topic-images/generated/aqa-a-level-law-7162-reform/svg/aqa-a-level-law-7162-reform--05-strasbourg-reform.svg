<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reform at Strasbourg</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Council of Europe level: the Court’s backlog and its balance with national authorities</text>
<line x1="60" y1="154" x2="860" y2="154" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="194" width="195" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="43" y="220.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Protocol 14 in force</text><text x="43" y="247" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Single-judge decisions;</text><text x="43" y="267" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the significant</text><text x="43" y="287" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">disadvantage criterion</text><rect x="87.5" y="136" width="80" height="36" rx="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="127.5" y="161" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2010</text><line x1="127.5" y1="172" x2="127.5" y2="194" stroke="#1e2a44" stroke-width="2"/><rect x="245" y="194" width="195" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="258" y="220.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interlaken</text><text x="258" y="241.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">conference</text><text x="258" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Backlog; balance</text><text x="258" y="288" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">between the Court and</text><text x="258" y="308" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">national authorities</text><rect x="302.5" y="136" width="80" height="36" rx="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="342.5" y="161" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2010</text><line x1="342.5" y1="172" x2="342.5" y2="194" stroke="#1e2a44" stroke-width="2"/><rect x="460" y="194" width="195" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="220.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Brighton</text><text x="473" y="241.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">conference</text><text x="473" y="268" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Brighton Declaration</text><text x="473" y="288" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">led to Protocol 15</text><rect x="517.5" y="136" width="80" height="36" rx="18" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="557.5" y="161" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2012</text><line x1="557.5" y1="172" x2="557.5" y2="194" stroke="#1e2a44" stroke-width="2"/><rect x="675" y="194" width="195" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="688" y="220.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Protocol 15 in force</text><text x="688" y="247" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Subsidiarity</tspan> and</text><text x="688" y="267" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">margin</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">appreciation</tspan></text><text x="688" y="287" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">added to the preamble;</text><text x="688" y="307" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">time limit cut from six</text><text x="688" y="327" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">months to four</text><rect x="732.5" y="136" width="80" height="36" rx="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="772.5" y="161" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2021</text><line x1="772.5" y1="172" x2="772.5" y2="194" stroke="#1e2a44" stroke-width="2"/>
</svg>