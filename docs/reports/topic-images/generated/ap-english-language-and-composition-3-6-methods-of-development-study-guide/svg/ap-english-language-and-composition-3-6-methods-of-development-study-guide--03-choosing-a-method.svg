<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 694" width="900" height="694" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="694" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing a method</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">What does the argument need at this point?</text>
<rect x="30" y="122" width="410" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="152.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Make an abstract point human and</text><text x="46" y="174.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">memorable</text><line x1="446" y1="153" x2="490" y2="153" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="496" y="122" width="374" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><line x1="510" y1="153" x2="600" y2="153" stroke="#1e2a44" stroke-width="3"/><circle cx="520" cy="153" r="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="555" cy="153" r="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="590" cy="153" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="600" y1="153" x2="614" y2="153" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="652" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Narration</text><rect x="30" y="196" width="410" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="232.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Show why something matters or will matter</text><line x1="446" y1="227" x2="490" y2="227" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="496" y="196" width="374" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><rect x="510" y="213" width="28" height="28" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><line x1="540" y1="227" x2="556" y2="227" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="558" y="213" width="28" height="28" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><line x1="588" y1="227" x2="604" y2="227" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="606" y="213" width="28" height="28" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="652" y="234" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Cause-effect</text><rect x="30" y="270" width="410" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="300.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Show one option is better or worse than</text><text x="46" y="322.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">another</text><line x1="446" y1="301" x2="490" y2="301" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="496" y="270" width="374" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><rect x="520" y="281" width="44" height="40" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><rect x="576" y="281" width="44" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="570" y="308" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">⟷</text><text x="652" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Comparison-contrast</text><rect x="30" y="344" width="410" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="380.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Fix the meaning of a key term before arguing</text><line x1="446" y1="375" x2="490" y2="375" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="496" y="344" width="374" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><circle cx="570" cy="375" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 3"/><circle cx="570" cy="375" r="6" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><circle cx="610" cy="369" r="5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="652" y="382" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Definition</text><rect x="30" y="418" width="410" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="454.22999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Help the audience see or feel a situation</text><line x1="446" y1="449" x2="490" y2="449" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="496" y="418" width="374" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><path d="M530,449 Q570,423 610,449 Q570,475 530,449 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="570" cy="449" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="652" y="456" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Description</text><text x="450" y="506" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Also weigh</text><rect x="30" y="522" width="269.3333333333333" height="141.60000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="556" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Audience</text><text x="48" y="583.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">sceptical readers may need</text><text x="48" y="602.9499999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">cause-effect; a general</text><text x="48" y="622.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">audience may be moved by</text><text x="48" y="642.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">narration</text><rect x="315.3333333333333" y="522" width="269.3333333333333" height="141.60000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="333.3333333333333" y="556" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Purpose</text><text x="333.3333333333333" y="583.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">to honour, to inform, to</text><text x="333.3333333333333" y="602.9499999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">persuade</text><rect x="600.6666666666666" y="522" width="269.3333333333333" height="141.60000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="618.6666666666666" y="556" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Length</text><text x="618.6666666666666" y="583.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a short speech may rest on one</text><text x="618.6666666666666" y="602.9499999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">method; an essay combines</text><text x="618.6666666666666" y="622.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">several</text>
</svg>