<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five methods of development</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Ways of developing and organising an idea, not types of essay</text>
<rect x="30" y="122" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><line x1="50" y1="168" x2="140" y2="168" stroke="#1e2a44" stroke-width="3"/><circle cx="60" cy="168" r="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="95" cy="168" r="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="130" cy="168" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="140" y1="168" x2="154" y2="168" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="200" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Narration</text><text x="200" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">tells a story or sequence</text><text x="470" y="154" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Signals:</tspan> “when”, “after”, “then”</text><text x="470" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">“What</tspan> <tspan font-weight="700" fill="#2e6b62">happened,</tspan> <tspan font-weight="700" fill="#2e6b62">and</tspan> <tspan font-weight="700" fill="#2e6b62">what</tspan> <tspan font-weight="700" fill="#2e6b62">does</tspan> <tspan font-weight="700" fill="#2e6b62">it</tspan> <tspan font-weight="700" fill="#2e6b62">show?”</tspan></text><rect x="30" y="224" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="50" y="256" width="28" height="28" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><line x1="80" y1="270" x2="96" y2="270" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="98" y="256" width="28" height="28" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><line x1="128" y1="270" x2="144" y2="270" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="146" y="256" width="28" height="28" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="200" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Cause-effect</text><text x="200" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">what produces what</text><text x="470" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Signals:</tspan> “because”, “as a result”, “led to”</text><text x="470" y="286" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">“Why</tspan> <tspan font-weight="700" fill="#2e6b62">did</tspan> <tspan font-weight="700" fill="#2e6b62">it</tspan> <tspan font-weight="700" fill="#2e6b62">happen,</tspan> <tspan font-weight="700" fill="#2e6b62">and</tspan> <tspan font-weight="700" fill="#2e6b62">what</tspan> <tspan font-weight="700" fill="#2e6b62">follows?”</tspan></text><rect x="30" y="326" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="60" y="352" width="44" height="40" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><rect x="116" y="352" width="44" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="110" y="379" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">⟷</text><text x="200" y="360" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Comparison-contrast</text><text x="200" y="388" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">similarities and differences</text><text x="470" y="358" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Signals:</tspan> “whereas”, “unlike”, “similarly”</text><text x="470" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">“How</tspan> <tspan font-weight="700" fill="#2e6b62">are</tspan> <tspan font-weight="700" fill="#2e6b62">these</tspan> <tspan font-weight="700" fill="#2e6b62">alike</tspan> <tspan font-weight="700" fill="#2e6b62">and</tspan> <tspan font-weight="700" fill="#2e6b62">different?”</tspan></text><rect x="30" y="428" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><circle cx="110" cy="474" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 3"/><circle cx="110" cy="474" r="6" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="468" r="5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="200" y="462" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Definition</text><text x="200" y="490" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">what a term means, its boundaries</text><text x="470" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Signals:</tspan> “is defined as”, “means”</text><text x="470" y="490" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">“What</tspan> <tspan font-weight="700" fill="#2e6b62">exactly</tspan> <tspan font-weight="700" fill="#2e6b62">is</tspan> <tspan font-weight="700" fill="#2e6b62">this?”</tspan></text><rect x="30" y="530" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><path d="M70,576 Q110,550 150,576 Q110,602 70,576 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="110" cy="576" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="200" y="564" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Description</text><text x="200" y="592" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">sensory, concrete detail</text><text x="470" y="562" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Signals:</tspan> vivid detail, spatial order</text><text x="470" y="592" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">“What</tspan> <tspan font-weight="700" fill="#2e6b62">is</tspan> <tspan font-weight="700" fill="#2e6b62">it</tspan> <tspan font-weight="700" fill="#2e6b62">like?”</tspan></text><text x="450" y="648" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Other approaches (examples, process, breaking into parts) often work inside these five.</text>
</svg>