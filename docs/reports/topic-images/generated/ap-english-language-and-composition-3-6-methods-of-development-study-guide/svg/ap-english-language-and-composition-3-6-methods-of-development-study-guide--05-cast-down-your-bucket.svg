<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 513" width="900" height="513" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="513" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A story that works as an analogy</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Booker T. Washington, Atlanta, 18 September 1895</text>
<rect x="30" y="122" width="195" height="128.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="147.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">A ship lost at sea</text><text x="42" y="170.04" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">signals</text><text x="42" y="195.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Water, water; we die</text><text x="42" y="215.43" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">of thirst!”</text><line x1="227" y1="186.14" x2="243" y2="186.14" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="245" y="122" width="195" height="128.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="257" y="147.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">The reply</text><text x="257" y="173.19" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Cast down your</text><text x="257" y="192.99" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">bucket where you are.”</text><line x1="442" y1="186.14" x2="458" y2="186.14" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="122" width="195" height="128.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="472" y="147.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Puzzled, they ask</text><text x="472" y="170.04" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">again</text><text x="472" y="195.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and get the same</text><text x="472" y="215.43" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">answer</text><line x1="657" y1="186.14" x2="673" y2="186.14" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="675" y="122" width="195" height="128.28" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="687" y="147.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">They lower the</text><text x="687" y="170.04" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">bucket</text><text x="687" y="195.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">fresh water: they were</text><text x="687" y="215.43" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">at the mouth of a great</text><text x="687" y="235.23" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">river</text><text x="450" y="290.28" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The analogy</text><rect x="60" y="310.28" width="320" height="54" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="220" y="342.72999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the ship</text><line x1="386" y1="337.28" x2="444" y2="337.28" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="7 5"/><rect x="450" y="310.28" width="390" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="645" y="342.72999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the Southern community</text><rect x="60" y="376.28" width="320" height="54" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="220" y="408.72999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the fresh water close at hand</text><line x1="386" y1="403.28" x2="444" y2="403.28" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="7 5"/><rect x="450" y="376.28" width="390" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="645" y="408.72999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">opportunity and cooperation close at hand</text><text x="450" y="458.28" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">The audience reaches the conclusion itself; contemporaries also criticised the speech, so note how</text><text x="450" y="479.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">different listeners heard it.</text>
</svg>