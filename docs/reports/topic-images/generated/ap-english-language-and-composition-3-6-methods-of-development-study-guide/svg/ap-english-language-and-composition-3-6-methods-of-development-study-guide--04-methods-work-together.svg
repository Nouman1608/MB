<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Methods work together</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Identify the dominant method, then what it does</text>
<rect x="30" y="122" width="840" height="130" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="56" y="158" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Dominant: Narration</text><rect x="56" y="174" width="380" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="70" y="209.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">description</tspan> of the scene</text><rect x="456" y="174" width="380" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="470" y="209.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">cause-effect</tspan> reflection on its meaning</text><rect x="30" y="266" width="840" height="130" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="56" y="302" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Dominant: Definition</text><rect x="56" y="318" width="380" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="70" y="345.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">comparison</tspan> “A library is unlike a shop</text><text x="70" y="366.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">because...”</text><rect x="30" y="410" width="840" height="130" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="56" y="446" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Dominant: Cause-effect</text><rect x="56" y="462" width="380" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="70" y="497.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">narrative</tspan> <tspan font-weight="700">example</tspan> shows the chain at work</text><text x="450" y="568" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Do not label every sentence; name the dominant method and say what it does for the argument.</text>
</svg>