<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Name the method, cite the signal</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1</text>
<rect x="30" y="122" width="440" height="111.16" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="161.49999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“When the bridge closed, the bus route to the</text><text x="44" y="182.61999999999998" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">hospital doubled in length, so patients... now needed</text><text x="44" y="203.73999999999998" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">forty.”</text><rect x="500" y="122" width="370" height="111.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="644" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Cause-effect</text><text x="644" y="176.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“so”, “with them”: closure →</text><text x="644" y="196.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">longer journeys → missed</text><text x="644" y="216.10999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">appointments → costs</text><rect x="512" y="163.57999999999998" width="28" height="28" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><line x1="542" y1="177.57999999999998" x2="558" y2="177.57999999999998" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="560" y="163.57999999999998" width="28" height="28" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><line x1="590" y1="177.57999999999998" x2="606" y2="177.57999999999998" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="608" y="163.57999999999998" width="28" height="28" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><line x1="474" y1="177.57999999999998" x2="496" y2="177.57999999999998" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="245.16" width="440" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="287.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Imagine the two schools side by side. St Anne’s has</text><text x="44" y="308.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a garden... Park Road has a car park...”</text><rect x="500" y="245.16" width="370" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="644" y="275.87999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Comparison-contrast</text><text x="644" y="301.98999999999995" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“side by side”; a parallel list</text><text x="644" y="321.78999999999996" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">for each school</text><rect x="522" y="273.15999999999997" width="44" height="40" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><rect x="578" y="273.15999999999997" width="44" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="572" y="300.15999999999997" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">⟷</text><line x1="474" y1="293.15999999999997" x2="496" y2="293.15999999999997" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="353.15999999999997" width="440" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="395.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“By ‘fairness’ I do not mean that everyone receives</text><text x="44" y="416.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the same. I mean...”</text><rect x="500" y="353.15999999999997" width="370" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="644" y="383.87999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Definition</text><text x="644" y="409.98999999999995" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“I do not mean... I mean...”</text><text x="644" y="429.78999999999996" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">sets a boundary</text><circle cx="572" cy="401.15999999999997" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="5 3"/><circle cx="572" cy="401.15999999999997" r="6" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><circle cx="612" cy="395.15999999999997" r="5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><line x1="474" y1="401.15999999999997" x2="496" y2="401.15999999999997" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="461.15999999999997" width="440" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="503.64" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“In June my grandfather took me fishing for the first</text><text x="44" y="524.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">time...”</text><rect x="500" y="461.15999999999997" width="370" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="644" y="491.87999999999994" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Narration</text><text x="644" y="517.99" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“In June”; an event and a</text><text x="644" y="537.79" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">reflection</text><line x1="512" y1="509.15999999999997" x2="602" y2="509.15999999999997" stroke="#1e2a44" stroke-width="3"/><circle cx="522" cy="509.15999999999997" r="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="557" cy="509.15999999999997" r="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="592" cy="509.15999999999997" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="602" y1="509.15999999999997" x2="616" y2="509.15999999999997" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="474" y1="509.15999999999997" x2="496" y2="509.15999999999997" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>