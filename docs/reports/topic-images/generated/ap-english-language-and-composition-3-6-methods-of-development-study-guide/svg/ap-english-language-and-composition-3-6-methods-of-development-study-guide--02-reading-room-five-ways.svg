<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One subject, five developments</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The old reading room of a closing library</text>
<circle cx="450" cy="372" r="82" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">the</tspan> <tspan font-weight="700">old</tspan> <tspan font-weight="700">reading</tspan></text><text x="450" y="386.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">room</tspan></text><path d="M364.5,319.5 L244.8,246" fill="none" stroke="#c9d6d4" stroke-width="4"/><rect x="30" y="122" width="270" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="169.82000000000002" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Narration</text><text x="44" y="195.93" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Zainab walks in with a cracked</text><text x="44" y="215.73000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">textbook and leaves with a</text><text x="44" y="235.53" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">library card and a plan.</text><path d="M535.5,319.5 L655.2,246" fill="none" stroke="#c9d6d4" stroke-width="4"/><rect x="600" y="122" width="270" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="614" y="169.82000000000002" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Cause-effect</text><text x="614" y="195.93" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Evening hours cut → homework</text><text x="614" y="215.73000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">club halves → coursework</text><text x="614" y="235.53" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">unfinished.</text><path d="M364.5,376.5 L244.8,382.8" fill="none" stroke="#c9d6d4" stroke-width="4"/><rect x="30" y="312" width="270" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="359.82" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Comparison-contrast</text><text x="44" y="385.93" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Harbourside open until nine and</text><text x="44" y="405.73" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">£11 per resident; ours closes at</text><text x="44" y="425.53000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">five, £6.</text><path d="M535.5,376.5 L655.2,382.8" fill="none" stroke="#c9d6d4" stroke-width="4"/><rect x="600" y="312" width="270" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="614" y="369.71999999999997" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Definition</text><text x="614" y="395.83" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A public place to sit, learn and be</text><text x="614" y="415.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">warm “without paying”.</text><path d="M450,433.5 L450,519.6" fill="none" stroke="#c9d6d4" stroke-width="4"/><rect x="315" y="502" width="270" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="329" y="549.82" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Description</text><text x="329" y="575.9300000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Paper and radiator dust; eleven</text><text x="329" y="595.73" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">tables, green lamps, every seat</text><text x="329" y="615.5300000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">taken.</text><circle cx="450" cy="372" r="82" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">the</tspan> <tspan font-weight="700">old</tspan> <tspan font-weight="700">reading</tspan></text><text x="450" y="386.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">room</tspan></text><rect x="30" y="672" width="840" height="74.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="703.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Same thesis (the library is worth keeping), five methods: each shapes what the reader feels and</text><text x="450" y="724.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">understands.</text>
</svg>