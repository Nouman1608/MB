<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Longer: more resistance. Thicker: less.</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="179" width="200" height="12" rx="6" fill="#d9a37a" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="167" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">2.0 m, 0.50 mm²</text><text x="820" y="193" font-size="24" font-weight="700" fill="#b5602e" text-anchor="end">3.4 Ω</text><line x1="170" y1="210" x2="170" y2="280" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="190" y="252" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="start">length × 5.0/2.0 = × 2.5, so R × 2.5:  3.4 × 2.5</text><rect x="70" y="324" width="500" height="12" rx="6" fill="#d9a37a" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="312" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">5.0 m, 0.50 mm²</text><text x="820" y="338" font-size="24" font-weight="700" fill="#b5602e" text-anchor="end">8.5 Ω</text><line x1="170" y1="355" x2="170" y2="425" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="190" y="397" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="start">area × 1.0/0.50 = × 2, so R ÷ 2:  8.5 ÷ 2</text><rect x="70" y="468" width="500" height="24" rx="12" fill="#d9a37a" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="456" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">5.0 m, 1.0 mm²</text><text x="820" y="488" font-size="24" font-weight="700" fill="#b5602e" text-anchor="end">4.25 → 4.3 Ω</text><rect x="70" y="535" width="750" height="52" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="445" y="568" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">R ∝ length;  R ∝ 1 / cross-sectional area</text>
</svg>