<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 514" width="900" height="514" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="514" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A 2.2 kW kettle for 3.0 minutes on 230 V</text>

<rect x="30" y="110" width="840" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="155.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Current:  I = P / V = 2200 / 230 = 9.6 A</text><rect x="30" y="210" width="410" height="194" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="246" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Energy in joules: W and s</text><text x="50" y="280" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">E = P t</text><text x="50" y="314" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 2200 × (3.0 × 60)</text><text x="50" y="348" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 2200 × 180</text><text x="50" y="382" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">= 396 000 J  (4.0 × 10⁵ J)</text><rect x="460" y="210" width="410" height="194" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="246" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Energy in kW h: kW and h</text><text x="480" y="280" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">E = 2.2 kW × (3.0 / 60) h</text><text x="480" y="314" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 2.2 × 0.050 = 0.11 kW h</text><text x="480" y="348" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">cost = 0.11 × 28</text><text x="480" y="382" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">= 3.1 cents</text><rect x="30" y="424" width="840" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="462.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">Never mix the routes: kW × seconds gives a meaningless number.</text>
</svg>