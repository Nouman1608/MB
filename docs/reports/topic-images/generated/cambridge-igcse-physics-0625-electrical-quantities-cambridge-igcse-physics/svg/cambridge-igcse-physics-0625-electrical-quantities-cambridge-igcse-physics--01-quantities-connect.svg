<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Current × p.d. = power</text>

<rect x="30" y="150" width="240" height="170" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="192" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Current I</text><text x="150" y="230" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">charge passing</text><text x="150" y="256" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">each second</text><text x="150" y="298" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">A = C/s</text><text x="300" y="248" font-size="44" font-weight="700" fill="#1e2a44" text-anchor="middle">×</text><rect x="330" y="150" width="240" height="170" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="192" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">p.d. V</text><text x="450" y="230" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">energy transferred</text><text x="450" y="256" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">by each coulomb</text><text x="450" y="298" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">V = J/C</text><text x="600" y="248" font-size="44" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="630" y="150" width="240" height="170" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="192" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Power P</text><text x="750" y="230" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">energy transferred</text><text x="750" y="256" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">each second</text><text x="750" y="298" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">W = J/s</text><line x1="750" y1="330" x2="750" y2="380" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="560" y="385" width="310" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="715" y="427.35" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">× time t:  E = IVt  (J)</text><text x="60" y="420" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">P = IV</text><text x="60" y="455" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">E = IVt</text><rect x="30" y="480" width="840" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="494" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="62" y="515" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><text x="60" y="556" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="start">I = Q/t  (Q = It)</text><text x="330" y="556" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="start">V = W/Q and E = W/Q</text><text x="660" y="556" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="start">1 V = 1 J/C</text>
</svg>