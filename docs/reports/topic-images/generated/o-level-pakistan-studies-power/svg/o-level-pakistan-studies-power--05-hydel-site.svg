<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing a site for a multi-purpose dam</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Simplified long profile, not to scale</text>
<rect x="30" y="110" width="840" height="330" fill="#e4eef0"/><path d="M30,440 L30,210 Q120,250 200,320 L420,330 L440,230 L470,230 L470,360 Q600,370 870,380 L870,440 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M120,262 L440,262 L440,330 L200,320 Q160,290 120,262 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M440,230 L470,230 L490,360 L440,360 Z" fill="#cfcfcf" stroke="#1e2a44" stroke-width="3"/><path d="M490,352 Q600,362 860,372" fill="none" stroke="#2b5a9a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><rect x="500" y="320" width="40" height="30" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="506" y="312" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">power station</text><path d="M60,150 q12,-16 24,0 q12,-16 24,0" fill="none" stroke="#2b5a9a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="130" y="150" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="start">snowmelt and monsoon rain: large reliable flow</text><line x1="100" y1="170" x2="160" y2="250" stroke="#2b5a9a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="280" y1="290" x2="280" y2="218" stroke="#1e2a44" stroke-width="1.8"/><circle cx="280" cy="290" r="3.5" fill="#1e2a44"/><text x="280" y="210" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">wide valley upstream stores water</text><line x1="458" y1="238" x2="600" y2="196" stroke="#1e2a44" stroke-width="1.8"/><circle cx="458" cy="238" r="3.5" fill="#1e2a44"/><text x="606" y="192" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">narrow gorge in strong,</text><text x="606" y="212" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">impermeable rock</text><text x="860" y="418" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">downstream: power, irrigation water, flood control</text><rect x="30" y="460" width="410" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="46" y="488" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Physical factors</text><text x="46" y="514" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Narrow gorge in strong, impermeable rock;</text><text x="46" y="536.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">large reliable flow; wide valley upstream;</text><text x="46" y="558.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">low risk of earthquakes and landslides.</text><rect x="460" y="460" width="410" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="476" y="488" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Human factors</text><text x="476" y="514" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Capital (often loans), engineering skill,</text><text x="476" y="536.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">demand for power and irrigation water</text><text x="476" y="558.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">downstream, few people to resettle.</text><text x="450" y="644" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Multi-purpose = stores irrigation water + generates power + helps control floods</text><text x="450" y="670" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Diamer–Bhasha and Dasu (upper Indus) show the cost and silting problems such schemes face.</text>
</svg>