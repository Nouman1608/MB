<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 626" width="900" height="626" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="626" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why electricity supply falls short</text>

<text x="60" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Installed capacity</text><rect x="260" y="118" width="560" height="36" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="60" y="196" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Actual supply</text><rect x="260" y="174" width="360" height="36" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><rect x="620" y="174" width="200" height="36" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><text x="720" y="198" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">shortfall</text><text x="450" y="238" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic: when supply falls short of demand, load-shedding follows</text><rect x="30" y="262" width="268" height="90" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="46" y="294" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rising demand</text><text x="46" y="320" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">population, cities and industry</text><rect x="313" y="262" width="268" height="90" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="329" y="294" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Costly imported fuel</text><text x="329" y="320" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">some stations left idle</text><rect x="596" y="262" width="268" height="90" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="612" y="294" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Low winter rivers</text><text x="612" y="320" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hydel output drops</text><rect x="30" y="366" width="268" height="90" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="46" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Losses and unpaid bills</text><text x="46" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">transmission losses; “circular</text><text x="46" y="443" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">debt”</text><rect x="313" y="366" width="268" height="90" rx="12" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5" /><text x="329" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Distance from the grid</text><text x="329" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">remote Balochistan, Thar,</text><text x="329" y="443" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">northern mountains</text><rect x="596" y="366" width="274" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="612" y="398" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Result</text><text x="612" y="424" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">load-shedding; many areas</text><text x="612" y="443" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cannot develop</text><text x="450" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Small-scale solutions for remote places</text><rect x="30" y="506" width="410" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="46" y="534" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Micro-hydel</text><text x="46" y="560" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fast mountain streams in Chitral and</text><text x="46" y="582.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Gilgit-Baltistan.</text><rect x="460" y="506" width="410" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="476" y="534" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Solar home systems</text><text x="476" y="560" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sunny, scattered settlements in Balochistan</text><text x="476" y="582.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and Thar.</text>
</svg>