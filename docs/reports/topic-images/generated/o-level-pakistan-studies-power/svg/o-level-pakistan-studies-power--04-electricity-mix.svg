<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where Pakistan’s electricity comes from</text>

<rect x="230" y="112" width="440" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" /><text x="450" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Installed capacity about 42,000 MW</text><text x="450" y="168" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">March 2024 (Pakistan Economic Survey 2023–24)</text><rect x="30" y="206" width="410" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="206" width="410" height="10" rx="5" fill="#b5602e"/><text x="52" y="252" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">Thermal</text><rect x="290" y="232" width="130" height="28" rx="14" fill="#f6e4d8" stroke="none" stroke-width="0" /><text x="355" y="251" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">non-renewable</text><text x="52" y="286" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Furnace oil, gas, LNG, imported or Thar coal</text><text x="52" y="316" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sahiwal, Port Qasim, Thar coal plants</text><rect x="460" y="206" width="410" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="206" width="410" height="10" rx="5" fill="#2b5a9a"/><text x="482" y="252" font-size="22" font-weight="700" fill="#2b5a9a" text-anchor="start">Nuclear</text><rect x="720" y="232" width="130" height="28" rx="14" fill="#f6e4d8" stroke="none" stroke-width="0" /><text x="785" y="251" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">non-renewable</text><text x="482" y="286" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Nuclear power stations</text><text x="482" y="316" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chashma near Mianwali; K-2 and K-3 at Karachi</text><text x="482" y="337" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(2021, 2022)</text><rect x="30" y="386" width="410" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="386" width="410" height="10" rx="5" fill="#2e6b62"/><text x="52" y="432" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">Hydel</text><rect x="290" y="412" width="130" height="28" rx="14" fill="#dce9e7" stroke="none" stroke-width="0" /><text x="355" y="431" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">renewable</text><text x="52" y="466" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Falling water</text><text x="52" y="496" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tarbela, Mangla, Warsak; Ghazi–Barotha,</text><text x="52" y="517" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Neelum–Jhelum</text><rect x="460" y="386" width="410" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="386" width="410" height="10" rx="5" fill="#8a6d0d"/><text x="482" y="432" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">Wind and solar</text><rect x="720" y="412" width="130" height="28" rx="14" fill="#dce9e7" stroke="none" stroke-width="0" /><text x="785" y="431" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">renewable</text><text x="482" y="466" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Wind and sunlight</text><text x="482" y="496" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Jhimpir–Gharo wind corridor; solar parks;</text><text x="482" y="517" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rooftop panels since about 2022</text><rect x="30" y="576" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="610" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Non-renewable fuels are running out and world prices rise and swing,</text><text x="450" y="636" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">so a high share of imported fuel makes electricity expensive.</text>
</svg>