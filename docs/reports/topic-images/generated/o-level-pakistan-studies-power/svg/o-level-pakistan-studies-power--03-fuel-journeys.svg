<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 836" width="900" height="836" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="836" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How each fuel reaches its users</text>

<rect x="30" y="116" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="116" width="110" height="214" rx="14" fill="#1e2a44"/><text x="85" y="230" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Coal</text><rect x="160" y="128" width="215" height="86" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="267.5" y="165.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Thar lignite</text><text x="267.5" y="184.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">high moisture</text><line x1="377" y1="171" x2="406" y2="171" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="410" y="128" width="215" height="86" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="517.5" y="165.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Mine-mouth power station</text><text x="517.5" y="184.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">too costly to haul</text><rect x="160" y="230" width="205" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="262.5" y="258.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Imported coal</text><text x="262.5" y="277.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">South Africa, Indonesia,</text><text x="262.5" y="295.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Australia</text><line x1="367" y1="273" x2="391" y2="273" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="395" y="230" width="205" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="497.5" y="276.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Port Qasim, Karachi</text><line x1="602" y1="273" x2="626" y2="273" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="630" y="230" width="205" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="732.5" y="267.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Rail and lorries</text><text x="732.5" y="286.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to steel and cement</text><rect x="30" y="346" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="346" width="110" height="214" rx="14" fill="#2e6b62"/><text x="85" y="460" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Gas</text><rect x="160" y="358" width="215" height="86" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="267.5" y="395.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Fields</text><text x="267.5" y="414.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Sui, Mari, Qadirpur…</text><line x1="377" y1="401" x2="406" y2="401" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="410" y="358" width="215" height="86" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="517.5" y="395.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pipelines</text><text x="517.5" y="414.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Sui Southern; Sui Northern</text><rect x="160" y="460" width="205" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="262.5" y="488.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Off the network</text><text x="262.5" y="507.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">many villages, much of</text><text x="262.5" y="525.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Balochistan</text><line x1="367" y1="503" x2="391" y2="503" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="395" y="460" width="205" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="497.5" y="497.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">LPG cylinders by road</text><text x="497.5" y="516.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">costlier, short in winter</text><rect x="30" y="576" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="576" width="110" height="214" rx="14" fill="#b5602e"/><text x="85" y="690" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Oil</text><rect x="160" y="588" width="215" height="86" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="267.5" y="616" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Imported crude and</text><text x="267.5" y="635" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">products</text><text x="267.5" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Saudi Arabia, UAE, Kuwait</text><line x1="377" y1="631" x2="406" y2="631" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="410" y="588" width="215" height="86" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="517.5" y="634.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Tankers to Port Qasim</text><rect x="160" y="690" width="205" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="262.5" y="718.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">White Oil Pipeline</text><text x="262.5" y="737.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to Mahmood Kot near</text><text x="262.5" y="755.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Multan</text><line x1="367" y1="733" x2="391" y2="733" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="395" y="690" width="205" height="86" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="497.5" y="727" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Rail tank wagons and</text><text x="497.5" y="746" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">road tankers</text><text x="450" y="814" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Since 2015, imported LNG has also been regasified at Port Qasim and fed into the gas network.</text>
</svg>