<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 948" width="900" height="948" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="948" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways to mine coal</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Simplified cross-sections, not to scale</text>
<rect x="30" y="110" width="840" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="190" width="520" height="170" fill="#d9cdae"/><rect x="50" y="190" width="520" height="60" fill="#b89a6a"/><rect x="50" y="250" width="520" height="44" fill="#2b2b2b"/><path d="M190,190 L210,190 L210,210 L230,210 L230,230 L250,230 L250,250 L270,250 L270,274 L430,274 L430,250 L450,250 L450,230 L470,230 L470,210 L490,210 L490,190 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="50" y1="190" x2="570" y2="190" stroke="#1e2a44" stroke-width="2.5"/><path d="M70,190 Q110,140 160,190" fill="#b89a6a" stroke="#1e2a44" stroke-width="2.5"/><line x1="110" y1="164" x2="110" y2="146" stroke="#1e2a44" stroke-width="1.8"/><circle cx="110" cy="164" r="3.5" fill="#1e2a44"/><text x="110" y="138" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">spoil heap</text><line x1="232" y1="218" x2="300" y2="146" stroke="#1e2a44" stroke-width="1.8"/><circle cx="232" cy="218" r="3.5" fill="#1e2a44"/><text x="306" y="151" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">benches</text><line x1="530" y1="220" x2="530" y2="150" stroke="#1e2a44" stroke-width="1.8"/><circle cx="530" cy="220" r="3.5" fill="#1e2a44"/><text x="530" y="142" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">overburden</text><text x="110" y="278" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">seam</text><text x="600" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Open cast</text><text x="600" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Overburden is removed and coal</text><text x="600" y="203" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is dug from an open pit. Suits</text><text x="600" y="224" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">thick seams near the surface.</text><text x="600" y="350" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" font-style="italic">e.g. Thar Block II, Sindh</text><rect x="30" y="388" width="840" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M50,638 L50,588 L250,588 Q330,578 400,508 Q450,458 570,438 L570,638 Z" fill="#d9cdae" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M362,538 L570,538 L570,568 L330,568 Z" fill="#2b2b2b"/><path d="M360,548 L570,544 L570,560 L345,564 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="520" y1="554" x2="380" y2="556" stroke="#2b5a9a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="345" y1="558" x2="220" y2="518" stroke="#1e2a44" stroke-width="1.8"/><circle cx="345" cy="558" r="3.5" fill="#1e2a44"/><text x="214" y="523" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">adit entrance</text><line x1="470" y1="474" x2="470" y2="434" stroke="#1e2a44" stroke-width="1.8"/><circle cx="470" cy="474" r="3.5" fill="#1e2a44"/><text x="470" y="426" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">hillside</text><line x1="550" y1="540" x2="550" y2="506" stroke="#1e2a44" stroke-width="1.8"/><circle cx="550" cy="540" r="3.5" fill="#1e2a44"/><text x="550" y="498" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">seam</text><line x1="440" y1="556" x2="400" y2="610" stroke="#1e2a44" stroke-width="1.8"/><circle cx="440" cy="556" r="3.5" fill="#1e2a44"/><text x="400" y="628" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">drainage slope</text><text x="600" y="428" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Adit</text><text x="600" y="460" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A near-horizontal tunnel is</text><text x="600" y="481" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">driven into a hillside where a</text><text x="600" y="502" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seam outcrops.</text><text x="600" y="628" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start" font-style="italic">e.g. Duki and Sor Range, Balochistan</text><rect x="30" y="666" width="840" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="736" width="520" height="180" fill="#d9cdae"/><line x1="50" y1="736" x2="570" y2="736" stroke="#1e2a44" stroke-width="2.5"/><rect x="50" y="866" width="520" height="34" fill="#2b2b2b"/><rect x="200" y="736" width="24" height="150" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="440" y="736" width="18" height="150" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="90" y="872" width="420" height="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M190,736 L212,686 L234,736 M198,718 L226,718" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="212" cy="686" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="449" y1="856" x2="449" y2="706" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><line x1="228" y1="706" x2="290" y2="696" stroke="#1e2a44" stroke-width="1.8"/><circle cx="228" cy="706" r="3.5" fill="#1e2a44"/><text x="296" y="701" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">headgear</text><line x1="224" y1="806" x2="300" y2="806" stroke="#1e2a44" stroke-width="1.8"/><circle cx="224" cy="806" r="3.5" fill="#1e2a44"/><text x="306" y="811" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">shaft</text><text x="330" y="888" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">galleries</text><text x="540" y="889" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">seam</text><text x="470" y="694" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">ventilation</text><text x="600" y="706" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Shaft</text><text x="600" y="738" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A vertical shaft reaches deeper</text><text x="600" y="759" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seams, with horizontal</text><text x="600" y="780" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">galleries along the coal.</text>
</svg>