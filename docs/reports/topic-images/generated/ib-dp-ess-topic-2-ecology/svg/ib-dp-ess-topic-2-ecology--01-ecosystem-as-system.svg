<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An ecosystem in systems language</text>

<rect x="130" y="560" width="380" height="80" rx="12" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><text x="320" y="596" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Producers</text><text x="320" y="620" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">storage</text><line x1="320" y1="558" x2="320" y2="527" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="334" y="548" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">transfer: feeding</text><path d="M516,600 Q520.6,612.0 525.2,600.0 Q529.8,588.0 534.4,600.0 Q539.0,612.0 543.6,600.0 Q548.2,588.0 552.8,600.0 Q557.4,612.0 562.0,600.0 L584,600" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="165" y="445" width="310" height="80" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="320" y="481" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary consumers</text><text x="320" y="505" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">storage</text><line x1="320" y1="443" x2="320" y2="412" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="334" y="433" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">transfer: feeding</text><path d="M481,485 Q485.6,497.0 490.2,485.0 Q494.8,473.0 499.4,485.0 Q504.0,497.0 508.6,485.0 Q513.2,473.0 517.8,485.0 Q522.4,497.0 527.0,485.0 L549,485" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="195" y="330" width="250" height="80" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="320" y="366" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary consumers</text><text x="320" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">storage</text><line x1="320" y1="328" x2="320" y2="297" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="334" y="318" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">transfer: feeding</text><path d="M451,370 Q455.6,382.0 460.2,370.0 Q464.8,358.0 469.4,370.0 Q474.0,382.0 478.6,370.0 Q483.2,358.0 487.8,370.0 Q492.4,382.0 497.0,370.0 L519,370" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="215" y="215" width="210" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="320" y="251" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tertiary consumers</text><text x="320" y="275" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">storage</text><path d="M431,255 Q435.6,267.0 440.2,255.0 Q444.8,243.0 449.4,255.0 Q454.0,267.0 458.6,255.0 Q463.2,243.0 467.8,255.0 Q472.4,267.0 477.0,255.0 L499,255" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)"/><text x="505" y="257" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">heat</text><circle cx="95" cy="200" r="38" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="95" y="206" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sun</text><path d="M92,242 C80,420 90,560 124,600" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round" marker-end="url(#ahO)"/><text x="100" y="330" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">input:</text><text x="100" y="350" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">sunlight</text><rect x="620" y="110" width="250" height="530" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="642" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Systems vocabulary</text><text x="642" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Storages: trophic</text><text x="642" y="208" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">levels</text><text x="642" y="230" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="642" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Transfers: energy</text><text x="642" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passed by feeding</text><text x="642" y="296" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="642" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Outputs: heat lost</text><text x="642" y="340" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">at every level</text><text x="642" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="642" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Feedback: a change</text><text x="642" y="406" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in one level spreads</text><text x="642" y="428" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through the whole</text><rect x="642" y="490" width="206" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="530.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Transfer is inefficient,</text><text x="745" y="550.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">so chains rarely go</text><text x="745" y="570.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">beyond four or five</text><text x="745" y="590.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">trophic levels.</text>
</svg>