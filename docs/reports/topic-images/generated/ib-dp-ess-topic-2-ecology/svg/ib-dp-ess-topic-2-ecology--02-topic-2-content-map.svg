<rect x="330" y="115" width="240" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="143.85" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Topic 2: Ecology</text><text x="450" y="164.45" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">22 h SL, 35 h HL</text><line x1="450" y1="181" x2="128" y2="225" stroke="#4a5568" stroke-width="2"/><rect x="30" y="228" width="196" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="128" y="269.44" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ecosystem structure</text><text x="128" y="289.48" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">trophic levels, food</text><text x="128" y="308.98" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">chains, food webs</text><line x1="128" y1="340" x2="128" y2="384" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="388" width="196" height="80" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="128" y="423.86" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Systems</text><text x="128" y="443.62" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">storages and transfers</text><line x1="450" y1="181" x2="341" y2="225" stroke="#4a5568" stroke-width="2"/><rect x="243" y="228" width="196" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="341" y="269.44" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Energy flow</text><text x="341" y="289.48" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">inefficient transfer,</text><text x="341" y="308.98" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">heat loss</text><line x1="341" y1="340" x2="341" y2="384" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="243" y="388" width="196" height="80" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="341" y="423.86" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Systems</text><text x="341" y="443.62" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">inputs and outputs</text><line x1="450" y1="181" x2="554" y2="225" stroke="#4a5568" stroke-width="2"/><rect x="456" y="228" width="196" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="554" y="269.44" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Nutrient cycling</text><text x="554" y="289.48" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">matter cycles: carbon,</text><text x="554" y="308.98" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">nitrogen</text><line x1="554" y1="340" x2="554" y2="384" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="456" y="388" width="196" height="80" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="554" y="423.86" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sustainability</text><text x="554" y="443.62" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">disrupted cycles</text><line x1="450" y1="181" x2="767" y2="225" stroke="#4a5568" stroke-width="2"/><rect x="669" y="228" width="196" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="767" y="269.44" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ecosystem change</text><text x="767" y="289.48" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">succession, response</text><text x="767" y="308.98" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to disturbance</text><line x1="767" y1="340" x2="767" y2="384" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="669" y="388" width="196" height="80" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="767" y="423.86" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Resilience</text><text x="767" y="443.62" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">recovery after disturbance</text><text x="450" y="498" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Topic 1 ideas each strand applies</text><rect x="30" y="520" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="562" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">HL: practise ecological efficiency calculations, not only description.</text>
