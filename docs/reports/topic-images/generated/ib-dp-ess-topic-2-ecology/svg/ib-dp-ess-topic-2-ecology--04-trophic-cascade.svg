<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tracing a trophic cascade</text>

<rect x="230" y="130" width="300" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="380" y="176.20000000000002" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Top predator</text><text x="380" y="197.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">removed</text><text x="262" y="192" font-size="34" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><line x1="380" y1="232" x2="380" y2="276" stroke="#1e2a44" stroke-width="4.5" marker-end="url(#ah)"/><rect x="230" y="280" width="300" height="100" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="380" y="326.19999999999993" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Prey population</text><text x="380" y="347.79999999999995" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">increases: no longer controlled</text><line x1="380" y1="382" x2="380" y2="426" stroke="#1e2a44" stroke-width="4.5" marker-end="url(#ah)"/><rect x="230" y="430" width="300" height="100" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="380" y="476.19999999999993" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Prey’s food source</text><text x="380" y="497.79999999999995" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">over-consumed and depleted</text><rect x="560" y="255" width="300" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="580" y="290" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Direct effect</text><text x="580" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prey numbers rise</text><rect x="560" y="405" width="300" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="580" y="440" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Indirect effect</text><text x="580" y="466" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a resource further down</text><text x="580" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the chain is depleted</text><line x1="532" y1="305" x2="556" y2="305" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="532" y1="455" x2="556" y2="455" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="5 4"/><text x="40" y="190" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">The</text><text x="40" y="210" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">disturbance</text><path d="M200,170 C130,250 130,420 200,480" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" stroke-dasharray="7 5"/><text x="40" y="330" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cascade</text><text x="40" y="350" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">spreads</text><text x="40" y="370" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">down the</text><text x="40" y="390" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">food chain</text><rect x="30" y="560" width="840" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="596" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Conclusion: the ecosystem is a system of connected parts, so a change at one level</text><text x="450" y="624" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">affects levels that were not the direct target of the disturbance.</text>
</svg>