<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Step 4: suggest other evidence</text>

<rect x="30" y="110" width="840" height="76.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="148.44" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="155.64" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="106" y="155.44" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What</text><text x="240" y="143" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">dental or hospital records for children from before and after the tax,</text><text x="240" y="165.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ideally compared with a similar country without one</text><rect x="30" y="198.88" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="236.88" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="244.07999999999998" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="106" y="243.88" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why</text><text x="240" y="242.66" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">it would test whether the fall in sales led to a change in health</text><rect x="30" y="286.88" width="840" height="99.32000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="70" cy="336.54" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="343.74" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="106" y="343.54" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What result</text><text x="240" y="319.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">decay falls faster than in the comparison country: claim</text><text x="240" y="342.32" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">substantiated. Falls at the same rate: something other than the tax is</text><text x="240" y="364.76" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the likelier explanation</text><text x="450" y="416.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Example from the sugar-tax worked example</text><rect x="30" y="438.2" width="410" height="107" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="474.25" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weaker</text><text x="48" y="502.69" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“More evidence is needed.” / “More</text><text x="48" y="525.13" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">research.”</text><rect x="460" y="438.2" width="410" height="107" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="474.25" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Stronger</text><text x="478" y="502.69" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One precise suggestion, tied to a gap you</text><text x="478" y="525.13" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">identified.</text>
