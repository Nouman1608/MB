<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Step 3: test the link to the claim</text>

<rect x="30" y="120" width="230" height="120" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="145" y="174.4" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence</text><text x="145" y="202.84" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">may be accurate…</text><rect x="640" y="120" width="230" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="755" y="163.4" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Claim</text><text x="755" y="191.84" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">…and still get weak</text><text x="755" y="214.28" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">support</text><path d="M262,180 L410,180" fill="none" stroke="#1e2a44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M490,180 L638,180" fill="none" stroke="#1e2a44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M410,180 l12,-14 l6,22 l10,-16" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M490,180 l-12,14 l-6,-22 l-10,16" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="222" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle" font-style="italic">is the step safe?</text><rect x="30" y="270" width="840" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="300" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="305.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="307" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Scope gap</text><text x="260" y="307" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">one city, year or group → a country, the future or everyone</text><rect x="30" y="340" width="840" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="370" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="375.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="377" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Measure gap</text><text x="260" y="377" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">something nearby (sugary drink sales) → something else (obesity rates)</text><rect x="30" y="410" width="840" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="440" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="445.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="447" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cause gap</text><text x="260" y="447" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">two things happened together → one caused the other</text><rect x="30" y="480" width="840" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="510" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="515.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="96" y="517" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Selection gap</text><text x="260" y="517" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">examples that fit, silence about any that do not</text><rect x="30" y="550" width="840" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="580" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="585.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="96" y="587" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Strength gap</text><text x="260" y="587" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a small or uncertain effect → “clearly” or “proves”</text><rect x="30" y="624" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="655.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Name the gap, quote the evidence and the claim, and explain why the step from one to the other</text><text x="450" y="677.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">is unsafe.</text>
</svg>