<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Step 2: test each piece by its type</text>

<rect x="30" y="110" width="410" height="127" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Statistics</text><text x="48" y="174.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Who collected them and why? Is it measuring</text><text x="48" y="195.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the thing the claim is about? A fair baseline?</text><text x="48" y="216.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Averages hiding variation?</text><rect x="460" y="110" width="410" height="127" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Survey or poll</text><text x="478" y="174.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How many people, chosen how? Who was left out?</text><text x="478" y="195.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Question wording? Does saying predict doing?</text><rect x="30" y="251" width="410" height="127" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Expert testimony</text><text x="48" y="315.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Within their field? Named, with a role? Do</text><text x="48" y="336.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they gain from the outcome? One view or a</text><text x="48" y="357.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consensus?</text><rect x="460" y="251" width="410" height="127" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Personal account</text><text x="478" y="315.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Vivid but untypical? First-hand? One case</text><text x="478" y="336.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">standing for many?</text><rect x="30" y="392" width="410" height="127" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="429" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Case study or example</text><text x="48" y="456.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Similar enough to the situation in the claim?</text><text x="48" y="477.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Chosen because it fits?</text><rect x="460" y="392" width="410" height="127" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="429" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Research study</text><text x="478" y="456.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Method described? A comparison group?</text><text x="478" y="477.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repeated? How old?</text><rect x="30" y="537" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="567.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Strengths are evaluation too: say why a named, well-matched, multi-year statistic is strong support.</text><text x="450" y="588.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">You will not need every question for every piece.</text>
</svg>