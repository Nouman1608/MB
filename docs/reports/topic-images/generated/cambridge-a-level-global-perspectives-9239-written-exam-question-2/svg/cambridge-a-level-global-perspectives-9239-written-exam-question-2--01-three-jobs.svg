<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="502" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three jobs for every piece of evidence</text>

<text x="450" y="112" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">“How strong is the evidence?”</text><rect x="30" y="140" width="257.3333333333333" height="168" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="158.66666666666666" y="207.4" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Reliability</text><text x="158.66666666666666" y="235.84" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Can this piece of evidence</text><text x="158.66666666666666" y="258.28000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">be trusted?</text><line x1="290.3333333333333" y1="224" x2="316.3333333333333" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="140" width="257.3333333333333" height="168" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="196.4" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Support</text><text x="450" y="224.84" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Even if it is trustworthy,</text><text x="450" y="247.28" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">does it back the claim it</text><text x="450" y="269.72" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">is used for?</text><line x1="581.6666666666666" y1="224" x2="607.6666666666666" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="140" width="257.3333333333333" height="168" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="741.3333333333333" y="196.4" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Gaps</text><text x="741.3333333333333" y="224.84" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">What other evidence would</text><text x="741.3333333333333" y="247.28" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">confirm or overturn the</text><text x="741.3333333333333" y="269.72" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">claim?</text><circle cx="158.66666666666666" cy="140" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="158.66666666666666" y="146.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="450" cy="140" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="146.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="741.3333333333333" cy="140" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="741.3333333333333" y="146.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><path d="M30,330 L30,340 L287.3333333333333,340 L287.3333333333333,330" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="158.66666666666666" y="364" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle" font-style="italic">where most weak answers stop</text><path d="M321.3333333333333,330 L321.3333333333333,340 L870,340 L870,330" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="595.6666666666666" y="364" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle" font-style="italic">where many of the marks sit</text><text x="30" y="414" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Question 2: 15 of 45 marks, one document, its evidence</text><rect x="30" y="430" width="840" height="44" rx="8" fill="#eef2f2" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="430" width="280" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="458" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Q2 ≈ 30 minutes</text><text x="330" y="458" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">one-third of the 90-minute paper</text>
</svg>