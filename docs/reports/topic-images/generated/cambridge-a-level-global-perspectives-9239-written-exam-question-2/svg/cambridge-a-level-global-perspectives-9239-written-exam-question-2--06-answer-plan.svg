<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 673" width="900" height="673" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="673" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a 15-mark answer</text>

<rect x="30" y="110" width="840" height="66" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Opening judgement</text><text x="320" y="151" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">two sentences: the main claim and your verdict on its evidence</text><rect x="30" y="186" width="840" height="66" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="227" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence paragraph</text><text x="320" y="227" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one piece or type: a strength, a weakness, and the link to the claim</text><rect x="30" y="262" width="840" height="66" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="303" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence paragraph</text><text x="320" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as above, for the next most important piece</text><rect x="30" y="338" width="840" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="338" width="840" height="66" rx="12" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="379" font-size="20" font-weight="700" fill="#4a5568" text-anchor="start">(Evidence paragraph)</text><text x="320" y="379" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a third if needed; group small pieces of the same type</text><rect x="30" y="414" width="840" height="66" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="455" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gaps paragraph</text><text x="320" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one or two specific missing pieces of evidence, and why they matter</text><rect x="30" y="490" width="840" height="66" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="531" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="320" y="531" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a weighed verdict that follows from your paragraphs</text><rect x="30" y="572" width="840" height="72.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="602.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">“Evaluate”: judge the quality, importance, amount or value of something. One serious scope gap can</text><text x="450" y="623.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">outweigh a reliable data set; one strong study can outweigh several anecdotes.</text>
</svg>