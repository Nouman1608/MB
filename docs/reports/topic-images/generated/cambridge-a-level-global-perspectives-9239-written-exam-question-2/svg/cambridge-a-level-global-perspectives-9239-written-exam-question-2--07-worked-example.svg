<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing the evidence in a source</text>

<rect x="30" y="110" width="840" height="148.48000000000002" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="52" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Source: opinion column (fictional)</text><text x="52" y="168" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The sugar tax is working. In the two years since it was introduced, supermarket sales of sugary</text><text x="52" y="189.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">drinks fell by 12%, according to a report from the drinks retailers’ association. Dr Mensah, a</text><text x="52" y="210.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">dentist in the capital, told me she now sees far fewer children with tooth decay. My neighbour’s</text><text x="52" y="231.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">son has switched to water. Other countries should copy us at once.</text><text x="30" y="288.48" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How well does the evidence support each claim?</text><rect x="30" y="306.48" width="840" height="115.36" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="340.48" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sugary drink sales fell</text><rect x="52" y="354.48" width="28" height="18" rx="3" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><rect x="86" y="354.48" width="28" height="18" rx="3" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><rect x="120" y="354.48" width="28" height="18" rx="3" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><rect x="154" y="354.48" width="28" height="18" rx="3" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><rect x="188" y="354.48" width="28" height="18" rx="3" fill="#eef2f2" stroke="#1e2a44" stroke-width="1.5"/><text x="350" y="347.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some support: a specific figure over a stated period, from a</text><text x="350" y="368.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">body with no obvious reason to exaggerate a fall; but</text><text x="350" y="389.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supermarket sales only.</text><rect x="30" y="431.84000000000003" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="465.84000000000003" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Health has improved</text><rect x="52" y="479.84000000000003" width="28" height="18" rx="3" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="86" y="479.84000000000003" width="28" height="18" rx="3" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="120" y="479.84000000000003" width="28" height="18" rx="3" fill="#eef2f2" stroke="#1e2a44" stroke-width="1.5"/><rect x="154" y="479.84000000000003" width="28" height="18" rx="3" fill="#eef2f2" stroke="#1e2a44" stroke-width="1.5"/><rect x="188" y="479.84000000000003" width="28" height="18" rx="3" fill="#eef2f2" stroke="#1e2a44" stroke-width="1.5"/><text x="350" y="476.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Weak: sales measure purchases, not health (a measure gap).</text><rect x="30" y="521.84" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="555.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Other countries should copy</text><rect x="52" y="569.84" width="28" height="18" rx="3" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><rect x="86" y="569.84" width="28" height="18" rx="3" fill="#eef2f2" stroke="#1e2a44" stroke-width="1.5"/><rect x="120" y="569.84" width="28" height="18" rx="3" fill="#eef2f2" stroke="#1e2a44" stroke-width="1.5"/><rect x="154" y="569.84" width="28" height="18" rx="3" fill="#eef2f2" stroke="#1e2a44" stroke-width="1.5"/><rect x="188" y="569.84" width="28" height="18" rx="3" fill="#eef2f2" stroke="#1e2a44" stroke-width="1.5"/><text x="350" y="566.28" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Very weak: nothing addresses whether it would work elsewhere.</text><text x="450" y="629.84" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle" font-style="italic">Question 2 judges the evidence, not the policy: no generic “biased”, no argument against sugar taxes.</text>
</svg>