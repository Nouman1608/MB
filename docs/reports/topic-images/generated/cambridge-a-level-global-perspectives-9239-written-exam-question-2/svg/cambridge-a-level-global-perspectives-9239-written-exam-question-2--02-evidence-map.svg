<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Step 1: map evidence to claims</text>

<text x="230" y="134" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Evidence in the source</text><text x="670" y="134" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Claim it is used to support</text><rect x="30" y="152" width="400" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="230" y="199.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A percentage from a survey</text><line x1="434" y1="191" x2="466" y2="191" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="152" width="400" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="670" y="199.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“Most people want this policy”</text><rect x="30" y="248" width="400" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="230" y="295.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A quotation from a named doctor</text><line x1="434" y1="287" x2="466" y2="287" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="248" width="400" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="670" y="295.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“The policy improves health”</text><rect x="30" y="344" width="400" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="230" y="391.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">One family’s story</text><line x1="434" y1="383" x2="466" y2="383" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="344" width="400" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="670" y="391.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“Costs fall hardest on the poor”</text><rect x="30" y="446" width="410" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="483.55" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Avoids evaluating</text><text x="48" y="511.99" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the writer’s opinions as if they were</text><text x="48" y="534.4300000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evidence</text><rect x="460" y="446" width="410" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="494.55" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Avoids missing</text><text x="478" y="522.99" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evidence buried in a long sentence</text>
</svg>