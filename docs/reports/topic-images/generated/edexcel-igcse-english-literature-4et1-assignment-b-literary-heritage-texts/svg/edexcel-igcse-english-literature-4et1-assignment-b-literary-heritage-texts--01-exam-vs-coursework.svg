<rect x="30" y="112" width="410" height="360" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMPONENT 2 SECTION B</text><text x="54" y="176" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Exam</text><text x="54" y="218" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Time</text><text x="54" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">About 45 minutes</text><text x="54" y="268" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Question</text><text x="54" y="290" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Chosen from two on the day</text><text x="54" y="318" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Context</text><text x="54" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Recalled from memory</text><rect x="46" y="388" width="378" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="62" y="414" font-size="14" font-weight="700" fill="#2e6b62" text-anchor="start">MAIN RISK</text><text x="62" y="442" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Forgetting context under pressure</text><rect x="460" y="112" width="410" height="360" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="146" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">COMPONENT 3 ASSIGNMENT B</text><text x="484" y="176" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Coursework</text><text x="484" y="218" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Time</text><text x="484" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weeks of preparation and drafting</text><text x="484" y="268" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Question</text><text x="484" y="290" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A set task known in advance</text><text x="484" y="318" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Context</text><text x="484" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Researched, selected, acknowledged</text><rect x="476" y="388" width="378" height="70" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="492" y="414" font-size="14" font-weight="700" fill="#8a6d0d" text-anchor="start">MAIN RISK</text><text x="492" y="442" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Too much context of the wrong kind</text><text x="30" y="512" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inside an essay of about 800 words</text><rect x="30" y="530" width="372" height="46" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="402" y="530" width="228" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="216" y="559" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">context</text><text x="516" y="559" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">analysis</text><circle cx="668" cy="553" r="15" fill="#b5602e"/><path d="M662,547 l12,12 m0,-12 l-12,12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="694" y="559" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">analysis squeezed out</text><rect x="30" y="590" width="144" height="46" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="174" y="590" width="456" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="102" y="619" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">context</text><text x="402" y="619" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">analysis</text><circle cx="668" cy="613" r="15" fill="#2e6b62"/><path d="M66