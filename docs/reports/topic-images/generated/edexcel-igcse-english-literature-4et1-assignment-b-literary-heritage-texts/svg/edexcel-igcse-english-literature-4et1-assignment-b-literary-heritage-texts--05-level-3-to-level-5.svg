<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 788" width="900" height="788" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From Level 3 to Level 5</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How does Shakespeare present Shylock in The Merchant of Venice?</text>
<rect x="30" y="112" width="840" height="230" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><circle cx="64" cy="146" r="15" fill="#b5602e"/><path d="M58,140 l12,12 m0,-12 l-12,12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="92" y="153" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Level 3: context placed next to the point</text><rect x="50" y="182" width="252" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="215" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">POINT</text><text x="70" y="244.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shylock is treated badly</text><text x="70" y="265.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by Antonio, who has</text><text x="70" y="286.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">insulted him in public.</text><rect x="324" y="182" width="252" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="344" y="215" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CONTEXT</text><text x="344" y="244.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">In Shakespeare’s time</text><text x="344" y="265.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jewish people faced</text><text x="344" y="286.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prejudice.</text><rect x="598" y="182" width="252" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="215" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">EFFECT</text><text x="618" y="244.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">This makes the audience</text><text x="618" y="265.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">feel sorry for him.</text><line x1="304" y1="252" x2="322" y2="252" stroke="#b5602e" stroke-width="3" stroke-dasharray="4 4"/><line x1="578" y1="252" x2="596" y2="252" stroke="#b5602e" stroke-width="3" stroke-dasharray="4 4"/><rect x="30" y="364" width="840" height="400" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><circle cx="64" cy="398" r="15" fill="#2e6b62"/><path d="M57.25,398.3 l4.8,5.1000000000000005 l9,-9.9" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="92" y="405" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Level 5: language, two contexts, one argument</text><rect x="50" y="434" width="250" height="300" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="70" y="532" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LANGUAGE (AO2)</text><text x="70" y="556.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Forceful prose;</text><text x="70" y="578.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">repeated questions</text><text x="70" y="605" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The audience sees him as a</text><text x="70" y="625" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">person, not a stage</text><text x="70" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">villain.</text><rect x="330" y="434" width="260" height="146" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="350" y="467" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SOCIAL ATTITUDE (AO4)</text><text x="350" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Many in an Elizabethan</text><text x="350" y="516" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">audience may have expected</text><text x="350" y="536" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">only a comic figure of</text><text x="350" y="556" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">greed.</text><rect x="330" y="592" width="260" height="146" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="350" y="625" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RECEPTION (AO4)</text><text x="350" y="654" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A modern audience is more</text><text x="350" y="674" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">likely to hear an accusation</text><text x="350" y="694" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">against the Christians on</text><text x="350" y="714" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">stage.</text><rect x="620" y="434" width="230" height="300" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="640" y="543" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARGUMENT (AO1)</text><text x="640" y="567.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The speech ends in</text><text x="640" y="589.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">a demand for</text><text x="640" y="611.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">revenge, so both</text><text x="640" y="633.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">readings stay open</text><line x1="302" y1="534" x2="326" y2="505" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="302" y1="634" x2="326" y2="663" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="592" y1="505" x2="616" y2="564" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="592" y1="663" x2="616" y2="604" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>