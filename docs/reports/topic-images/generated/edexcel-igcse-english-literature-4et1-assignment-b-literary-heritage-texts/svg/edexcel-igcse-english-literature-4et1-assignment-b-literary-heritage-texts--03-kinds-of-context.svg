<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five kinds of context for AO4</text>

<line x1="310" y1="151.5" x2="371.8" y2="233.4" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="255" x2="371.8" y2="269.625" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="381" x2="371.8" y2="313.725" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="220.5" x2="528.2" y2="257.55" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="345" x2="528.2" y2="301.125" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="277.5" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="272" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Your text</text><text x="450" y="297" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">and task</text><g transform="translate(0,0)"><rect x="30" y="112" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="142.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Writer’s situation</text><text x="46" y="170.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">where relevant</text><rect x="30" y="205" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="235.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Historical setting</text><text x="46" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for example,</text><text x="46" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seventeenth-century Boston</text><rect x="30" y="319" width="280" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="349.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Social and cultural</text><text x="46" y="373.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">attitudes</text><text x="46" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for example, public shame as</text><text x="46" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">community control</text></g><g transform="translate(0,48)"><rect x="590" y="112" width="280" height="121" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="606" y="142.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Literary context</text><text x="606" y="170.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">genre and tradition: often</text><text x="606" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">forgotten, the quickest link</text><text x="606" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between AO2 and AO4</text><rect x="590" y="247" width="280" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="606" y="277.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reception</text><text x="606" y="305.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how different audiences</text><text x="606" y="326.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">respond, with the reason why</text></g><rect x="30" y="465" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="498.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Top answers often combine two kinds in one argument, for example a social attitude and how</text><text x="50" y="520.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a modern audience responds to it.</text>
</svg>