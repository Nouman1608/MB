<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choose context that fits the task</text>

<rect x="30" y="112" width="840" height="117" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="145" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">START WITH THE TASK</text><text x="450" y="173.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">City life in Great Expectations</text><text x="450" y="204.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">The specification’s own model task.</text><text x="450" y="267" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Which contexts would change how a reader understands your chosen moments?</text><rect x="30" y="295" width="400" height="50" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="62" cy="320" r="15" fill="#2e6b62"/><path d="M55.25,320.3 l4.8,5.1000000000000005 l9,-9.9" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="92" y="326" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the growing Victorian city</text><path d="M430,320 C500,320 520,382 590,382" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="357" width="400" height="50" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="62" cy="382" r="15" fill="#2e6b62"/><path d="M55.25,382.3 l4.8,5.1000000000000005 l9,-9.9" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="92" y="388" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">crime and the law</text><path d="M430,382 C500,382 520,382 590,382" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="419" width="400" height="50" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="62" cy="444" r="15" fill="#2e6b62"/><path d="M55.25,444.3 l4.8,5.1000000000000005 l9,-9.9" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="92" y="450" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">money and class</text><path d="M430,444 C500,444 520,382 590,382" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="495" width="400" height="50" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><circle cx="62" cy="520" r="15" fill="#b5602e"/><path d="M56,514 l12,12 m0,-12 l-12,12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="92" y="526" font-size="18" font-weight="600" fill="#4a5568" text-anchor="start">the history of the railway</text><rect x="30" y="557" width="400" height="50" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><circle cx="62" cy="582" r="15" fill="#b5602e"/><path d="M56,576 l12,12 m0,-12 l-12,12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="92" y="588" font-size="18" font-weight="600" fill="#4a5568" text-anchor="start">“the Victorians” in general</text><line x1="590" y1="382" x2="604" y2="382" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="610" y="317" width="260" height="138" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="353" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Two or three</text><text x="740" y="379" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">contexts</text><text x="740" y="408.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">chosen for the task, used</text><text x="740" y="430.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">in the argument</text><rect x="470" y="495" width="400" height="112" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="490" y="544.6" font-size="17" font-weight="400" fill="#b5602e" text-anchor="start">Does not change how these moments read:</text><text x="490" y="566.6" font-size="17" font-weight="400" fill="#b5602e" text-anchor="start">leave it out.</text>
</svg>