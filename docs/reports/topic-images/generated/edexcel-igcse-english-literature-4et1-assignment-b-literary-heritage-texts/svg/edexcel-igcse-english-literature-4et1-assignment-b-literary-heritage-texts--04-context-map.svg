<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" width="900" height="586" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="586" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A context map for one task</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How does Hawthorne present the Puritan community in The Scarlet Letter?</text>
<text x="160" y="150" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">MOMENT</text><text x="410" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">METHOD (AO2)</text><text x="680" y="150" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">CONTEXT (AO4)</text><rect x="74" y="166" width="196" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="88" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The crowd at</text><text x="88" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hester’s first</text><text x="88" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public punishment</text><rect x="300" y="166" width="220" height="87" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="314" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The narrator’s ironic</text><text x="314" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">description of the</text><text x="314" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stern spectators</text><rect x="550" y="166" width="320" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="564" y="203.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seventeenth-century Boston, where</text><text x="564" y="224.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">religious and civil law overlapped</text><line x1="272" y1="209.5" x2="296" y2="209.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="522" y1="209.5" x2="546" y2="209.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><g transform="translate(46,209.5) rotate(-90)"><text x="0" y="6" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Beginning</text></g><rect x="74" y="267" width="196" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="88" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The town’s changing</text><text x="88" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reading of the</text><text x="88" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">letter as Hester</text><text x="88" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serves the poor</text><rect x="300" y="267" width="220" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="314" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The symbol’s shifting</text><text x="314" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meaning</text><rect x="550" y="267" width="320" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="564" y="304.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hawthorne, writing in 1850, looking</text><text x="564" y="325.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">back critically on his ancestors’</text><text x="564" y="346.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">society</text><line x1="272" y1="321" x2="296" y2="321" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="522" y1="321" x2="546" y2="321" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><g transform="translate(46,321) rotate(-90)"><text x="0" y="6" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Middle</text></g><rect x="74" y="389" width="196" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="88" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dimmesdale’s</text><text x="88" y="436.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">confession on the</text><text x="88" y="457.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scaffold</text><rect x="300" y="389" width="220" height="87" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="314" y="426.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The scaffold scenes as</text><text x="314" y="447.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a structural frame</text><rect x="550" y="389" width="320" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="564" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Public shame as community control;</text><text x="564" y="436.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">modern readings as a critique of</text><text x="564" y="457.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">moral hypocrisy</text><line x1="272" y1="432.5" x2="296" y2="432.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="522" y1="432.5" x2="546" y2="432.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><g transform="translate(46,432.5) rotate(-90)"><text x="0" y="6" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">End</text></g><line x1="26" y1="166" x2="26" y2="470" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="30" y="496" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="529.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Three rows give three paragraphs, each with a moment, a method and a context, covering</text><text x="50" y="551.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">beginning, middle and end and three kinds of context.</text>
</svg>