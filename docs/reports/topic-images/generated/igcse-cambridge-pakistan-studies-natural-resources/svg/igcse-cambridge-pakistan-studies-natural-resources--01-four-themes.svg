<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four themes that start in Section 2</text>

<line x1="360" y1="164.5" x2="450" y2="330" stroke="#c9d6d4" stroke-width="4"/><rect x="30" y="112" width="330" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Developing country</text><text x="48" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Problems and opportunities of being a</text><text x="48" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">developing country</text><line x1="540" y1="164.5" x2="450" y2="330" stroke="#c9d6d4" stroke-width="4"/><rect x="540" y="112" width="330" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="558" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Environment</text><text x="558" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Effects on, and conservation of, the</text><text x="558" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">environment</text><line x1="360" y1="495.5" x2="450" y2="330" stroke="#c9d6d4" stroke-width="4"/><rect x="30" y="443" width="330" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="476" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sustainable development</text><text x="48" y="504.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Using a resource without running it</text><text x="48" y="525.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">down</text><line x1="540" y1="495.5" x2="450" y2="330" stroke="#c9d6d4" stroke-width="4"/><rect x="540" y="443" width="330" height="105" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="558" y="476" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Feasibility studies</text><text x="558" y="504.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Their importance in judging a plan</text><circle cx="450" cy="330" r="96" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Section 2</text><text x="450" y="342" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Natural</text><text x="450" y="368" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">resources</text><rect x="30" y="570" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="600.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">These four themes run through every Paper 2 section, but Section 2 introduces them most explicitly:</text><text x="48" y="622.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“sustainability” is in its title.</text>
</svg>