<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 484" width="900" height="484" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="484" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two command words, two kinds of answer</text>

<rect x="30" y="112" width="410" height="210" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="148.4" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">“Identify”</text><text x="48" y="174.75" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">wants a named location or fact</text><text x="48" y="202.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="202.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Short and precise</text><text x="48" y="227.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="227.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Example: name a dam or a fishing port</text><rect x="460" y="112" width="410" height="210" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="148.4" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">“Evaluate”</text><text x="478" y="174.75" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">wants the cost weighed against the benefit</text><text x="478" y="202.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="202.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Example: mineral extraction</text><text x="478" y="227.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="227.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Set the environmental cost against the</text><text x="494" y="249.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">development benefit</text><text x="478" y="274.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="274.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Do not simply list them side by side</text><text x="478" y="299.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="299.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">End with a judgement</text><line x1="200" y1="388" x2="700" y2="388" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><path d="M450,392 L432,428 L468,428 Z" fill="#1e2a44"/><rect x="140" y="338" width="160" height="44" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="220" y="367" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">cost</text><rect x="600" y="338" width="160" height="44" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="680" y="367" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">benefit</text><text x="450" y="460" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Vague answers without named places lose marks, even when the explanation is sound.</text>
</svg>