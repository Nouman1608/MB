<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One section, four connected resources</text>

<rect x="325" y="318" width="250" height="104" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="343" y="351.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">(a) Water</text><text x="343" y="382.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Dams, barrages, supply</text><text x="343" y="404.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and quality</text><rect x="30" y="130" width="250" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="163.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">(b) Forests</text><text x="48" y="194.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Deforestation</text><rect x="30" y="470" width="250" height="104" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="503.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">(c) Minerals</text><text x="48" y="534.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Extraction needs water</text><rect x="620" y="470" width="250" height="104" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="638" y="503.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">(d) Fish</text><text x="638" y="534.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Inland fish farming needs</text><text x="638" y="556.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">water</text><path d="M155,238 L155,370 L317,370" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="170" y="266" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">speeds up silting of dams</text><text x="170" y="287" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">and barrages, so their</text><text x="170" y="308" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">storage capacity falls</text><line x1="340" y1="424" x2="290" y2="466" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="560" y1="424" x2="610" y2="466" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="474" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">water supply and quality</text><rect x="620" y="130" width="250" height="140" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="638" y="162.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Deforestation effects</text><text x="638" y="191.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="654" y="191.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Soil erosion</text><text x="638" y="216.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="654" y="216.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Silting</text><text x="638" y="241.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="654" y="241.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Flooding</text><line x1="284" y1="182" x2="612" y2="182" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="448" y="170" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">causes</text><rect x="30" y="600" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="630.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Every part feeds the “developing country” theme: each resource is an opportunity for development</text><text x="48" y="652.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and a risk of environmental damage if managed poorly.</text>
</svg>