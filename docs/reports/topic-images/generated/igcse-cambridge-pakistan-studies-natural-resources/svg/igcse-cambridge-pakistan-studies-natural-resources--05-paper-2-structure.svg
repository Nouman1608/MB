<rect width="900" height="551" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Paper 2 is examined</text>

<rect x="30" y="112" width="270" height="86" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="152" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1 h 30 min</text><text x="165" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">time</text><rect x="315" y="112" width="270" height="86" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="152" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">75 marks</text><text x="450" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">total</text><rect x="600" y="112" width="270" height="86" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="152" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">50%</text><text x="735" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of the qualification</text><text x="30" y="230" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Answer three questions from a choice of five</text><rect x="30" y="246" width="156" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="108" y="284" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Q1 ✓</text><rect x="202" y="246" width="156" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="280" y="284" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Q2 ✓</text><rect x="374" y="246" width="156" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="452" y="284" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Q3 ✓</text><rect x="546" y="246" width="156" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><text x="624" y="284" font-size="19" font-weight="700" fill="#4a5568" text-anchor="middle">Q4</text><rect x="718" y="246" width="156" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><text x="796" y="284" font-size="19" font-weight="700" fill="#4a5568" text-anchor="middle">Q5</text><text x="30" y="346" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Each question: 25 marks in four parts, built around maps, graphs, tables and photographs</text><rect x="30" y="362" width="198" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="129" y="402" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">(a)</text><line x1="230" y1="394" x2="242" y2="394" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="244" y="362" width="198" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343" y="402" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">(b)</text><line x1="444" y1="394" x2="456" y2="394" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="458" y="362" width="198" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="557" y="402" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">(c)</text><line x1="658" y1="394" x2="670" y2="394" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="672" y="362" width="198" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="771" y="402" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">(d)</text><rect x="30" y="446" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="476.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Part (d) tests analysis and evaluation: finish every topic by practising a judgement, such as how</text><text x="48" y="498.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sustainable a resource or policy is, with evidence for and against.</text>
</svg>