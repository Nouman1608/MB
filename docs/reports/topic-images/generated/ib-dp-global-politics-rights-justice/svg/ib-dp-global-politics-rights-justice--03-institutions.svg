<rect x="30" y="115" width="840" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Universal Declaration of Human Rights (1948)</text><text x="450" y="179.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and the wider UN human rights system</text><text x="30" y="230" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">International bodies</text><rect x="30" y="245" width="200" height="96" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="130" y="278.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">ICJ</text><text x="130" y="304.09" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">International Court of</text><text x="130" y="323.22999999999996" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">Justice</text><rect x="243" y="245" width="200" height="96" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="343" y="288.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">UNHRC</text><text x="343" y="313.59" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">UN Human Rights Council</text><rect x="456" y="245" width="200" height="96" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="556" y="278.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">UNHCR</text><text x="556" y="304.09" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">UN High Commissioner for</text><text x="556" y="323.22999999999996" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">Refugees</text><rect x="669" y="245" width="200" height="96" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="769" y="278.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">ICC</text><text x="769" y="304.09" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">International Criminal</text><text x="769" y="323.22999999999996" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">Court</text><text x="30" y="380" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Regional human rights courts</text><rect x="30" y="395" width="270" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="165" y="431.175" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">European Court of Human</text><text x="165" y="452.95500000000004" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Rights</text><rect x="315" y="395" width="270" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="431.175" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Inter-American Court of</text><text x="450" y="452.95500000000004" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Human Rights</text><rect x="600" y="395" width="270" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="735" y="431.175" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">African Court on Human and</text><text x="735" y="452.95500000000004" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Peoples’ Rights</text><text x="30" y="515" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Norm</text><rect x="30" y="530" width="410" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="572.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Responsibility to protect (R2P)</text><text x="460" y="515" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Civil society</text><rect x="460" y="530" width="410" height="70" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="665" y="564.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Human Rights Watch; Amnesty</text><text x="665" y="586.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">International</text><rect x="30" y="625" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="656.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Name the specific treaty, institution or case a claim rests on, not “an international body”.</text>
