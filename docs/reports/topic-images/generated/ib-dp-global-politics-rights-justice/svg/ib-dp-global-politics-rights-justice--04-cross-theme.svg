<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Linking the three thematic studies</text>

<line x1="450" y1="190" x2="230" y2="520" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="190" x2="670" y2="520" stroke="#1e2a44" stroke-width="3"/><rect x="300" y="140" width="300" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="198.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Rights and Justice</text><rect x="80" y="470" width="300" height="100" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="230" y="528.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Peace and Conflict</text><rect x="520" y="470" width="300" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="670" y="515.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Development and</text><text x="670" y="541.9" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sustainability</text><rect x="30" y="290" width="270" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="165" y="323.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">conflict raises rights</text><text x="165" y="344.32" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">violations</text><text x="165" y="370.12" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">affecting the same population</text><rect x="600" y="290" width="270" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="735" y="324.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">unequal development outcomes</text><text x="735" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">raise questions of distributive</text><text x="735" y="369.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">justice</text><rect x="30" y="600" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="630.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Use the same four core concepts throughout. Paper 2 may combine or contrast thematic studies, so</text><text x="450" y="651.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">practise comparing across themes.</text>
</svg>