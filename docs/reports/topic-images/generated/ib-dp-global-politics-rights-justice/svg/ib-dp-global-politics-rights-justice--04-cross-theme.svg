<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Linking the three thematic studies</text>

<line x1="450" y1="210" x2="190" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="210" x2="710" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="190" y1="470" x2="710" y2="470" stroke="#4a5568" stroke-width="2" stroke-dasharray="7 6"/><rect x="300" y="160" width="300" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="218.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Rights and Justice</text><rect x="40" y="420" width="300" height="100" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="190" y="478.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Peace and Conflict</text><rect x="560" y="420" width="300" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="710" y="465.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Development and</text><text x="710" y="491.9" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sustainability</text><rect x="30" y="290" width="290" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="175" y="323.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">conflict raises rights</text><text x="175" y="344.32" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">violations</text><text x="175" y="370.12" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">affecting the same population</text><rect x="580" y="290" width="290" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="725" y="324.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">unequal development outcomes</text><text x="725" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">raise questions of distributive</text><text x="725" y="369.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">justice</text><text x="450" y="590" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Same four core concepts throughout</text><rect x="30" y="615" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="645.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Paper 2 may combine or contrast thematic studies: practise comparing a rights example with one from</text><text x="450" y="666.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">another theme.</text>
