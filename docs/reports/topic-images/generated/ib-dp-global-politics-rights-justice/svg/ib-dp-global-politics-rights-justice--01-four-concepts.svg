<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 673" width="900" height="673" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="673" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rights and justice through the four core concepts</text>

<line x1="450" y1="340" x2="180" y2="185" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="340" x2="720" y2="185" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="340" x2="180" y2="495" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="340" x2="720" y2="495" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="115" width="300" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="180" y="169.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Power</text><text x="180" y="195.96" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">which actors hold the authority to</text><text x="180" y="216.42000000000002" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">define or enforce a right</text><rect x="570" y="115" width="300" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="720" y="159.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sovereignty</text><text x="720" y="185.96" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">a state’s claim to decide rights</text><text x="720" y="206.42000000000002" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">inside its borders vs universal</text><text x="720" y="226.88" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">rights claims</text><rect x="30" y="425" width="300" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="180" y="469.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Legitimacy</text><text x="180" y="495.96" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">whether a rights claim, or its</text><text x="180" y="516.42" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">denial, is accepted as valid by</text><text x="180" y="536.88" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">others</text><rect x="570" y="425" width="300" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="720" y="469.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interdependence</text><text x="720" y="495.96" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">how a rights issue in one place</text><text x="720" y="516.42" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">creates pressure or obligations</text><text x="720" y="536.88" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">elsewhere</text><circle cx="450" cy="340" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="333.8" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Rights and</text><text x="450" y="360.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">justice</text><rect x="30" y="590" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="621.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Name the concept you are applying at each stage; do not leave the link implicit.</text>
</svg>