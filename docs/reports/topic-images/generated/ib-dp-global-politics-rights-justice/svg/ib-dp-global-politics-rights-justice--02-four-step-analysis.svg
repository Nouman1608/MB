<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 701" width="900" height="701" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="701" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing a rights issue, concept by concept</text>

<rect x="30" y="110" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="168.3" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="178.38000000000002" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="136" y="149.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Power</text><text x="136" y="175.57" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Which actors (a state, an international body, a civil society movement) define or</text><text x="136" y="198.01" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">enforce the right?</text><rect x="30" y="240.6" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="298.9" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="308.97999999999996" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="136" y="280.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Sovereignty</text><text x="136" y="306.17" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Does the state claim exclusive authority to handle it internally? How does that</text><text x="136" y="328.61" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">meet international human rights frameworks?</text><rect x="30" y="371.2" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="429.5" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="439.58" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="136" y="411.05" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Legitimacy</text><text x="136" y="436.77000000000004" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Is the state’s position, or the claim against it, widely accepted by other states</text><text x="136" y="459.21000000000004" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and institutions?</text><rect x="30" y="501.79999999999995" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="549.8" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="559.88" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="136" y="542.5699999999999" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Interdependence</text><text x="136" y="568.29" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What pressure, obligations or consequences reach actors beyond the state?</text><rect x="30" y="617.8" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="648.9499999999999" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The same structure works for Peace and Conflict and for Development and Sustainability.</text>
</svg>