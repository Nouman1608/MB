<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two kinds of data</text>

<rect x="30" y="108" width="380" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,159 L31.25,122.25 Q31.25,109.25 44.25,109.25 L395.75,109.25 Q408.75,109.25 408.75,122.25 L408.75,159 Z" fill="#b5d3cf"/><line x1="31.25" y1="159" x2="408.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Quantitative data</text><text x="50" y="196" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Numerical</text><text x="50" y="236" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Statistical analysis and easy comparison</text><text x="50" y="258" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">across a large sample</text><text x="50" y="310" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Typically gathered by</text><circle cx="55" cy="332.39" r="4.5" fill="#2e6b62"/><text x="68" y="338" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Structured questionnaires</text><circle cx="55" cy="362.39" r="4.5" fill="#2e6b62"/><text x="68" y="368" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Official statistics</text><circle cx="55" cy="392.39" r="4.5" fill="#2e6b62"/><text x="68" y="398" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Structured observation with tally</text><text x="68" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">counts</text><rect x="490" y="108" width="380" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M491.25,159 L491.25,122.25 Q491.25,109.25 504.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,159 Z" fill="#f2e7b8"/><line x1="491.25" y1="159" x2="868.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="680" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Qualitative data</text><text x="510" y="196" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Descriptive</text><text x="510" y="236" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Depth, meaning and context that numbers</text><text x="510" y="258" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">alone cannot capture</text><text x="510" y="310" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Typically gathered by</text><circle cx="515" cy="332.39" r="4.5" fill="#2e6b62"/><text x="528" y="338" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unstructured interviews</text><circle cx="515" cy="362.39" r="4.5" fill="#2e6b62"/><text x="528" y="368" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Open-ended questionnaire answers</text><circle cx="515" cy="392.39" r="4.5" fill="#2e6b62"/><text x="528" y="398" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Participant observation</text><path d="M220,472 L220,500 L450,500 L450,520" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M680,472 L680,500 L450,500" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="450" y1="500" x2="450" y2="528" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="534" width="560" height="84" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="566" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Mixed methods</text><text x="450" y="596" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">generalisability of numbers + depth and validity of words</text><text x="450" y="650" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Neither is automatically “more scientific”: it depends on the research aim.</text>
</svg>