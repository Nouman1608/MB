<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 736" width="900" height="736" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="736" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pilot first, then choose a sample</text>

<rect x="30" y="108" width="840" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="142" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">First: a pilot study</text><text x="54" y="172" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A small trial run to fix question wording, timing or procedure while it is still cheap and easy</text><rect x="30" y="212" width="196" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,262 L31.25,226.25 Q31.25,213.25 44.25,213.25 L211.75,213.25 Q224.75,213.25 224.75,226.25 L224.75,262 Z" fill="#b5d3cf"/><line x1="31.25" y1="262" x2="224.75" y2="262" stroke="#c9d6d4" stroke-width="2"/><text x="128" y="243" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Random</text><circle cx="64" cy="300" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="96" cy="300" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="128" cy="300" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="160" cy="300" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="192" cy="300" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="64" cy="340" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="96" cy="340" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="128" cy="340" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="160" cy="340" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="192" cy="340" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="64" cy="380" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="96" cy="380" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="128" cy="380" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="160" cy="380" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="192" cy="380" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="64" cy="420" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="96" cy="420" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="128" cy="420" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="160" cy="420" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="192" cy="420" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="44" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Every member of the</text><text x="44" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">target population has</text><text x="44" y="516" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an equal chance of</text><text x="44" y="537" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">selection.</text><rect x="244" y="212" width="196" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M245.25,262 L245.25,226.25 Q245.25,213.25 258.25,213.25 L425.75,213.25 Q438.75,213.25 438.75,226.25 L438.75,262 Z" fill="#b5d3cf"/><line x1="245.25" y1="262" x2="438.75" y2="262" stroke="#c9d6d4" stroke-width="2"/><text x="342" y="243" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Systematic</text><circle cx="278" cy="300" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="310" cy="300" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="342" cy="300" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="374" cy="300" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="406" cy="300" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="278" cy="340" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="310" cy="340" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="342" cy="340" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="374" cy="340" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="406" cy="340" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="278" cy="380" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="310" cy="380" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="342" cy="380" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="374" cy="380" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="406" cy="380" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="278" cy="420" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="310" cy="420" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="342" cy="420" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="374" cy="420" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="406" cy="420" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="342" y="444" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">every 4th name</text><text x="258" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Take every nth name</text><text x="258" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from a list (sampling</text><text x="258" y="516" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">frame). A patterned</text><text x="258" y="537" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">list can bias it.</text><rect x="458" y="212" width="196" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,262 L459.25,226.25 Q459.25,213.25 472.25,213.25 L639.75,213.25 Q652.75,213.25 652.75,226.25 L652.75,262 Z" fill="#b5d3cf"/><line x1="459.25" y1="262" x2="652.75" y2="262" stroke="#c9d6d4" stroke-width="2"/><text x="556" y="243" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Quota</text><rect x="470" y="286" width="172" height="66" rx="8" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="482" y="310" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">women: quota 4</text><circle cx="492" cy="334" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="522" cy="334" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="552" cy="334" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="582" cy="334" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="470" y="368" width="172" height="66" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="482" y="392" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">men: quota 3</text><circle cx="492" cy="416" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="522" cy="416" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="552" cy="416" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="472" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fill set numbers for</text><text x="472" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each group to match</text><text x="472" y="516" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the population. No</text><text x="472" y="537" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sampling frame</text><text x="472" y="558" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">needed.</text><rect x="672" y="212" width="196" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M673.25,262 L673.25,226.25 Q673.25,213.25 686.25,213.25 L853.75,213.25 Q866.75,213.25 866.75,226.25 L866.75,262 Z" fill="#b5d3cf"/><line x1="673.25" y1="262" x2="866.75" y2="262" stroke="#c9d6d4" stroke-width="2"/><text x="770" y="243" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Snowball</text><line x1="723.928223129029" y1="295.1688966892459" x2="758.2366656203511" y2="310.0358884354855" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="783.7803808199385" y1="310.5024889506954" x2="818.4072529000711" y2="294.34328197996683" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="767" y1="328" x2="747.7692307692307" y2="374.15384615384613" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="830.4632324327936" y1="300.90884756453426" x2="823.7731933467767" y2="357.10517588707586" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="826.34732798722" y1="384.2515606912562" x2="838.9838523224386" y2="419.8635838177813" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="712" cy="290" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="772" cy="316" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="832" cy="288" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="822" cy="372" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="742" cy="388" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="844" cy="434" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="686" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Participants recruit</text><text x="686" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">others from their own</text><text x="686" y="516" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">networks: useful for</text><text x="686" y="537" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hard-to-reach groups.</text><rect x="30" y="630" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="666" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The sampling method decides how representative the sample is, and so how confidently findings</text><text x="56" y="688" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">can be generalised.</text>
</svg>