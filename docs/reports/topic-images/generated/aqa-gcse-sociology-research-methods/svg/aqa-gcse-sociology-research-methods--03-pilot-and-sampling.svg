<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 736" width="900" height="736" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="736" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pilot first, then choose a sample</text>

<rect x="30" y="108" width="840" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="142" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">First: a pilot study</text><text x="54" y="172" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A small trial run to fix question wording, timing or procedure while it is still cheap and easy</text><rect x="30" y="212" width="268" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,262 L31.25,226.25 Q31.25,213.25 44.25,213.25 L283.75,213.25 Q296.75,213.25 296.75,226.25 L296.75,262 Z" fill="#b5d3cf"/><line x1="31.25" y1="262" x2="296.75" y2="262" stroke="#c9d6d4" stroke-width="2"/><text x="164" y="242.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Random</text><circle cx="64" cy="302" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="104" cy="302" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="144" cy="302" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="184" cy="302" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="224" cy="302" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="264" cy="302" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="64" cy="344" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="104" cy="344" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="144" cy="344" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="184" cy="344" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="224" cy="344" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="264" cy="344" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="64" cy="386" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="104" cy="386" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="144" cy="386" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="184" cy="386" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="224" cy="386" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="264" cy="386" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="64" cy="428" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="104" cy="428" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="144" cy="428" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="184" cy="428" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="224" cy="428" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="264" cy="428" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="46" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Every member of the target</text><text x="46" y="503" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">population has an equal</text><text x="46" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chance of selection.</text><rect x="316" y="212" width="268" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M317.25,262 L317.25,226.25 Q317.25,213.25 330.25,213.25 L569.75,213.25 Q582.75,213.25 582.75,226.25 L582.75,262 Z" fill="#b5d3cf"/><line x1="317.25" y1="262" x2="582.75" y2="262" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="242.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Stratified</text><rect x="330" y="282" width="240" height="48" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><circle cx="352" cy="306" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="384" cy="306" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="416" cy="306" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="448" cy="306" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="560" y="312" font-size="15" font-weight="700" fill="#4a5568" text-anchor="end">under 30</text><rect x="330" y="340" width="240" height="48" rx="8" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><circle cx="352" cy="364" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="384" cy="364" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="416" cy="364" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="448" cy="364" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="560" y="370" font-size="15" font-weight="700" fill="#4a5568" text-anchor="end">30 to 60</text><rect x="330" y="398" width="240" height="48" rx="8" fill="#efdfa8" stroke="#c9d6d4" stroke-width="2"/><circle cx="352" cy="422" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="384" cy="422" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="416" cy="422" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><circle cx="448" cy="422" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="1.8"/><text x="560" y="428" font-size="15" font-weight="700" fill="#4a5568" text-anchor="end">over 60</text><text x="332" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Divide the population into</text><text x="332" y="503" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">subgroups (such as age or</text><text x="332" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gender) and sample</text><text x="332" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proportionally from each.</text><rect x="602" y="212" width="268" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M603.25,262 L603.25,226.25 Q603.25,213.25 616.25,213.25 L855.75,213.25 Q868.75,213.25 868.75,226.25 L868.75,262 Z" fill="#b5d3cf"/><line x1="603.25" y1="262" x2="868.75" y2="262" stroke="#c9d6d4" stroke-width="2"/><text x="736" y="242.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Snowball</text><line x1="663.9488853902348" y1="297.12095088152915" x2="708.2128245497291" y2="316.09121052131246" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="734.1722793083976" y1="317.4353952593509" x2="787.9550623364644" y2="297.26685162382586" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="717.4353952593509" y1="334.1722793083976" x2="697.2668516238259" y2="387.9550623364643" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="807.1209508815292" y1="303.94888539023475" x2="826.0912105213125" y2="348.21282454972913" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="819.9298030184916" y1="366.8280787926033" x2="795.9271503632789" y2="376.42913985468846" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="652" cy="292" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="722" cy="322" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="802" cy="292" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="782" cy="382" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="692" cy="402" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="832" cy="362" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="618" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Participants recruit others</text><text x="618" y="503" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from their own networks:</text><text x="618" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">useful for hard-to-reach</text><text x="618" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">groups.</text><rect x="30" y="630" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="666" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The sampling method decides how representative the sample is, and so how confidently findings</text><text x="56" y="688" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">can be generalised.</text>
</svg>