<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 641" width="900" height="641" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="641" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two separate tests for any method</text>

<rect x="30" y="108" width="412" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L427.75,109.25 Q440.75,109.25 440.75,122.25 L440.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="440.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Practical issues</text><circle cx="49" cy="185.16" r="4.5" fill="#2e6b62"/><text x="62" y="191.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Time</text><circle cx="49" cy="217.16" r="4.5" fill="#2e6b62"/><text x="62" y="223.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Cost</text><circle cx="49" cy="249.16" r="4.5" fill="#2e6b62"/><text x="62" y="255.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Access to research subjects</text><rect x="458" y="108" width="412" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,158 L459.25,122.25 Q459.25,109.25 472.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="459.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethical issues</text><circle cx="477" cy="185.16" r="4.5" fill="#2e6b62"/><text x="490" y="191.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Informed consent</text><circle cx="477" cy="217.16" r="4.5" fill="#2e6b62"/><text x="490" y="223.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Confidentiality</text><circle cx="477" cy="249.16" r="4.5" fill="#2e6b62"/><text x="490" y="255.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Protection from harm</text><text x="450" y="316" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Test case: covert observation</text><rect x="30" y="336" width="404" height="150" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="372" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Practical test: passes</text><text x="52" y="402" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Solves the observer effect: people do not</text><text x="52" y="424" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">change their behaviour because they know</text><text x="52" y="446" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">they are watched</text><rect x="466" y="336" width="404" height="150" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="488" y="372" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Ethical test: problem</text><text x="488" y="402" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Raises serious concerns about informed</text><text x="488" y="424" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">consent</text><circle cx="450" cy="411" r="22" fill="#1e2a44"/><text x="450" y="418" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="506" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="542" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A full evaluation addresses both</text><text x="56" y="571" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Practically convenient is not automatically ethical, and ethically sound is not automatically</text><text x="56" y="593" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">practical. The researcher must weigh one against the other.</text>
</svg>