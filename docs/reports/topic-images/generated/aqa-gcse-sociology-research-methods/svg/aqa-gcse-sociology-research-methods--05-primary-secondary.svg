<rect width="900" height="504" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Primary or secondary?</text>

<rect x="30" y="108" width="404" height="230" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="232" y="150" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary data</text><text x="232" y="186" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Collected <tspan font-weight="700">first-hand</tspan> by the researcher</text><circle cx="232" cy="270" r="40" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><circle cx="232" cy="258" r="12" fill="#1e2a44"/><path d="M210,292 Q232,268 254,292" fill="#1e2a44"/><rect x="466" y="108" width="404" height="230" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="668" y="150" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary data</text><text x="668" y="186" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Already exists, <tspan font-weight="700">collected by someone</tspan></text><text x="668" y="210" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">else</tspan></text><rect x="628" y="236" width="80" height="70" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="642" y1="252" x2="694" y2="252" stroke="#1e2a44" stroke-width="2.5"/><line x1="642" y1="268" x2="694" y2="268" stroke="#1e2a44" stroke-width="2.5"/><line x1="642" y1="284" x2="694" y2="284" stroke="#1e2a44" stroke-width="2.5"/><rect x="466" y="360" width="404" height="120" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="668" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Statistics: official or non-official</text><rect x="486" y="414" width="172" height="48" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="572" y="444" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Official</text><rect x="678" y="414" width="172" height="48" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="764" y="444" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-official</text><rect x="30" y="360" width="404" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="52" y="446" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">first-hand = primary</text><text x="52" y="396" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Common mistake: confusing the two. Ask</text><text x="52" y="418" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">first: who collected the data?</text>
</svg>