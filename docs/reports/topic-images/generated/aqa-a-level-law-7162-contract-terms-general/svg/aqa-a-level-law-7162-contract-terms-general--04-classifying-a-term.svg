<rect width="900" height="591" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How is a term classified?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Work down the list</text>
<line x1="60" y1="144" x2="60" y2="539" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Statute</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Statute may classify the term.</text><circle cx="60" cy="166" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="174.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="220" width="766" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="252.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The parties</text><text x="122" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Their label is not conclusive. <tspan font-style="italic">Schuler</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Wickman</tspan> (1974): weekly visits called a “condition” were</text><text x="122" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not one. <tspan font-style="italic">Lombard</tspan> <tspan font-style="italic">North</tspan> <tspan font-style="italic">Central</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Butterworth</tspan> (1987): punctual payment “of the essence” was</text><text x="122" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">effective.</text><circle cx="60" cy="283" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="291.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="358" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="390.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Precedent</text><text x="122" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">The</tspan> <tspan font-style="italic">Mihalis</tspan> <tspan font-style="italic">Angelos</tspan> (1971): “expected ready to load” is a condition. <tspan font-style="italic">Bunge</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Tradax</tspan> (1981): time</text><text x="122" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">clauses in mercantile contracts generally conditions.</text><circle cx="60" cy="410.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="419.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="475" width="766" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="507.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Otherwise: innominate</text><text x="122" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The court looks at the effect of the breach.</text><circle cx="60" cy="517" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="525.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>