<rect width="900" height="430" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The innominate term test: Hong Kong Fir (1962)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Did the breach deprive the charterers of substantially the whole benefit?</text>
<text x="60" y="142" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">24-month charter (bar to scale)</text><rect x="60" y="156" width="780" height="56" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="60" y="156" width="150" height="56" rx="8" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="135" y="190" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">~20 weeks</text><text x="525" y="190" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">much of the charter remained</text><text x="60" y="238" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">out of action: incompetent engine crew</text><rect x="30" y="266" width="413" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="308.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULT</text><text x="50" y="334.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Not substantially the whole benefit lost</text><text x="50" y="363.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No right to terminate: damages only</text><rect x="457" y="266" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="298" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APPLIED</text><text x="477" y="324.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cehave v Bremer (The Hansa Nord, 1976)</text><text x="477" y="352.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Partly damaged citrus pulp pellets still used for</text><text x="477" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">their purpose: buyers could not reject</text>
</svg>