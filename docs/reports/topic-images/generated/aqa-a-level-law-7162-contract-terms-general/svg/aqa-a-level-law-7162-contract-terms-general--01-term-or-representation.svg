<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Term or representation?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The parties’ intention, judged objectively</text>
<path d="M450,244 L420,299 L480,299 Z" fill="#1e2a44" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><line x1="120" y1="235" x2="780" y2="235" stroke="#1e2a44" stroke-width="6" stroke-linecap="round"/><circle cx="450" cy="235" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="124" width="360" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="155.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">TERM</text><text x="210" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Part of the contract: claim for breach</text><rect x="510" y="124" width="360" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="690" y="155.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">REPRESENTATION</text><text x="690" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Induces it only: at most misrepresentation</text><rect x="30" y="326" width="412" height="280" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="358" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POINTS TO A TERM</text><text x="50" y="389.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Statement vital to the claimant: <tspan font-style="italic">Bannerman</tspan> <tspan font-style="italic">v</tspan></text><text x="65.2" y="410.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">White</tspan> (1861), hops and sulphur</text><text x="50" y="439.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="439.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Firm assurance to a direct question:</text><text x="65.2" y="460.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Couchman</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hill</tspan> (1947), heifer “unserved”</text><text x="50" y="489.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="489.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Discourages checks: <tspan font-style="italic">Schawel</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Reade</tspan> (1913),</text><text x="65.2" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“you need not look for anything”</text><text x="50" y="539.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="539.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Maker has special knowledge: <tspan font-style="italic">Dick</tspan> <tspan font-style="italic">Bentley</tspan> <tspan font-style="italic">v</tspan></text><text x="65.2" y="560.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Harold</tspan> <tspan font-style="italic">Smith</tspan> <tspan font-style="italic">Motors</tspan> (1965), dealer and</text><text x="65.2" y="581.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mileage</text><rect x="458" y="326" width="412" height="280" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="358" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">POINTS TO A REPRESENTATION</text><text x="478" y="389.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Maker lacks special knowledge: <tspan font-style="italic">Oscar</tspan> <tspan font-style="italic">Chess</tspan> <tspan font-style="italic">v</tspan></text><text x="493.2" y="410.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Williams</tspan> (1957), private seller relying on</text><text x="493.2" y="431.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">documents</text><text x="478" y="460.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="460.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Long gap before the contract: <tspan font-style="italic">Routledge</tspan> <tspan font-style="italic">v</tspan></text><text x="493.2" y="481.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">McKay</tspan> (1954), a week earlier</text><text x="478" y="510.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Written contract leaves it out: <tspan font-style="italic">Routledge</tspan> <tspan font-style="italic">v</tspan></text><text x="493.2" y="531.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">McKay</tspan></text>
</svg>