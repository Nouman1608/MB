<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked problem: Kofi’s T-shirts</text>

<rect x="30" y="100" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kofi must supply 1,000 printed T-shirts to Ink Ltd for a festival on 1 July, “delivery by 20 June”,</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“colours to match sample”. He delivers on 24 June; the blue is slightly lighter than the sample but</text><text x="50" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">usable. Ink wants to terminate.</text><rect x="30" y="255" width="413" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DELIVERY DATE</text><text x="50" y="313.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Probably a condition</text><text x="50" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Commercial time clauses are usually conditions</text><text x="50" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Bunge</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Tradax</tspan>). Four days late but before the</text><text x="50" y="384.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">festival: if a condition, Ink may terminate even</text><text x="50" y="405.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">though little harm was caused.</text><rect x="457" y="255" width="413" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COLOUR CLAUSE</text><text x="477" y="313.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Probably innominate</text><text x="477" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not labelled a condition. A slight difference does</text><text x="477" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not deprive Ink of substantially the whole benefit</text><text x="477" y="384.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Hong</tspan> <tspan font-style="italic">Kong</tspan> <tspan font-style="italic">Fir</tspan>; <tspan font-style="italic">Hansa</tspan> <tspan font-style="italic">Nord</tspan>): damages only, if</text><text x="477" y="405.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">any loss.</text><rect x="30" y="452" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="486.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Advice</text><text x="50" y="516.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ink’s strongest ground is late delivery, if it is a condition; otherwise it must accept the goods and</text><text x="50" y="538.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">claim damages.</text>
</svg>