<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 517" width="900" height="517" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="517" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How terms are implied</text>

<rect x="30" y="100" width="840" height="187" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMPLIED IN FACT: into this particular contract</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The parties must have intended it</text><text x="50" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Business</tspan> <tspan font-weight="700" fill="#1e2a44">efficacy:</tspan> <tspan font-style="italic">The</tspan> <tspan font-style="italic">Moorcock</tspan> (1889), the jetty owner took reasonable care that the river bed was</text><text x="65.2" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safe at low tide</text><text x="50" y="235.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Officious</tspan> <tspan font-weight="700" fill="#1e2a44">bystander:</tspan> <tspan font-style="italic">Shirlaw</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Southern</tspan> <tspan font-style="italic">Foundries</tspan> (1939), “oh, of course”</text><text x="50" y="262.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Necessity,</tspan> <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">reasonableness:</tspan> <tspan font-style="italic">Marks</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Spencer</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">BNP</tspan> <tspan font-style="italic">Paribas</tspan> (2015)</text><rect x="30" y="309" width="270.6666666666667" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="341" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMPLIED IN LAW</text><text x="50" y="367.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">All contracts of a type</text><text x="50" y="395.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Liverpool</tspan> <tspan font-style="italic">CC</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Irwin</tspan> (1977):</text><text x="50" y="416.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reasonable care of common</text><text x="50" y="437.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">parts such as lifts and stairs in</text><text x="50" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">council flats</text><rect x="314.6666666666667" y="309" width="270.6666666666667" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="341" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BY CUSTOM</text><text x="334.6666666666667" y="367.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Trade or locality</text><text x="334.6666666666667" y="395.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Hutton</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Warren</tspan> (1836):</text><text x="334.6666666666667" y="416.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">outgoing farm tenant’s</text><text x="334.6666666666667" y="437.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">allowance for seed and labour</text><rect x="599.3333333333334" y="309" width="270.6666666666667" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="341" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BY STATUTE</text><text x="619.3333333333334" y="367.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Consumer Rights Act</text><text x="619.3333333333334" y="390.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2015</text><text x="619.3333333333334" y="418.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Satisfactory quality,</text><text x="619.3333333333334" y="439.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reasonable care and skill (own</text><text x="619.3333333333334" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">row)</text>
</svg>