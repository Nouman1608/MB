<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 494" width="900" height="494" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="494" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Conditions or innominate terms?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The courts balance certainty against fairness</text>
<rect x="30" y="124" width="412" height="205" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CERTAINTY: CONDITIONS</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Parties know in advance they can</text><text x="50" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">terminate</text><text x="50" y="235.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Risk: escape a bad bargain on a technicality</text><text x="50" y="262.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Arcos</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ronaasen</tspan> (1933): staves slightly</text><text x="65.2" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">thicker than half an inch, fit for purpose,</text><text x="65.2" y="304.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rejected; real reason a fall in market price</text><rect x="458" y="124" width="412" height="205" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FAIRNESS: INNOMINATE TERMS</text><text x="478" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Remedy matches the seriousness of the</text><text x="478" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">breach</text><text x="478" y="235.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reluctance to allow rejection for trivial</text><text x="493.2" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breaches</text><text x="478" y="283.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hong</tspan> <tspan font-style="italic">Kong</tspan> <tspan font-style="italic">Fir</tspan>; <tspan font-style="italic">Reardon</tspan> <tspan font-style="italic">Smith</tspan> <tspan font-style="italic">Line</tspan> <tspan font-style="italic">v</tspan></text><text x="493.2" y="304.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hansen-Tangen</tspan> (1976)</text><rect x="30" y="351" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="385.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The balance</text><text x="50" y="415.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Commercially important time clauses are treated as conditions (<tspan font-style="italic">Bunge</tspan>); most other terms as</text><text x="50" y="437.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">innominate.</text>
</svg>