<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 475" width="900" height="475" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="475" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The parol evidence rule and collateral contracts</text>

<rect x="30" y="100" width="840" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="134.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">General rule</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Where a contract is in writing, evidence of other oral terms cannot be added to it.</text><rect x="30" y="211" width="360" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="254" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MAIN CONTRACT (WRITTEN)</text><text x="50" y="280.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lease restricting use to business</text><text x="50" y="304.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">purposes</text><rect x="510" y="211" width="360" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="530" y="254" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COLLATERAL CONTRACT (ORAL)</text><text x="530" y="280.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assurance: the tenant may</text><text x="530" y="304.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">continue sleeping at the premises</text><line x1="504" y1="276" x2="396" y2="276" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="450" y="261" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">in return</text><text x="450" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">for signing</text><rect x="30" y="363" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="396.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">City</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Westminster</tspan> <tspan font-style="italic">Properties</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Mudd</tspan> (1959): the oral assurance was <tspan font-weight="700" fill="#1e2a44">enforced</tspan> as a separate</text><text x="450" y="418.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">contract.</text>
</svg>