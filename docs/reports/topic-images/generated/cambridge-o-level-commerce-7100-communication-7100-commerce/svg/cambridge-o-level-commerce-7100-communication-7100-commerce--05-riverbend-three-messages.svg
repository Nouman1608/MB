<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Riverbend Foods: three messages, three methods</text>

<text x="160" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Message</text><text x="445" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Factors named</text><text x="700" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Method chosen</text><rect x="30" y="145" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="213" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="220.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="189" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Weekend price promotion to</text><text x="96" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2,000 retailers, starting</text><text x="96" y="231" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tomorrow</text><rect x="350" y="159" width="190" height="32" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="180.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Urgency</text><rect x="350" y="197" width="190" height="32" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="218.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Cost</text><rect x="350" y="235" width="190" height="32" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="256.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Security</text><line x1="548" y1="213" x2="578" y2="213" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="588" y="159" width="266" height="108" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="721" y="219" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Social media plus email</text><rect x="30" y="295" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="363" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="370.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Agree prices and terms with</text><text x="96" y="372" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the main overseas supplier</text><rect x="350" y="309" width="190" height="32" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="330.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Distance</text><rect x="350" y="347" width="190" height="32" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="368.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Importance</text><rect x="350" y="385" width="190" height="32" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="406.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Security</text><line x1="548" y1="363" x2="578" y2="363" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="588" y="309" width="266" height="108" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="721" y="347" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Videoconference, then a</text><text x="721" y="369" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">signed letter or digitally</text><text x="721" y="391" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">signed document</text><rect x="30" y="445" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="513" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="520.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="489" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tell a rural delivery</text><text x="96" y="510" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">driver, on the road, of a</text><text x="96" y="531" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">changed address</text><rect x="350" y="459" width="190" height="32" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="480.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Urgency</text><rect x="350" y="497" width="190" height="32" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="518.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Networks</text><line x1="548" y1="513" x2="578" y2="513" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="588" y="459" width="266" height="108" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="721" y="519" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Telephone call</text><rect x="30" y="600" width="840" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="637" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Pattern: method → factor named → reason linked to the situation</text>
</svg>