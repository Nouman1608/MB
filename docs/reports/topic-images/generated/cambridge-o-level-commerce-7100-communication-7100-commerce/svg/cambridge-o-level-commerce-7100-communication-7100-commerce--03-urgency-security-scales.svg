<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two factors as scales</text>

<rect x="30" y="110" width="840" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Urgency: how fast is the reply?</text><line x1="80" y1="190" x2="830" y2="190" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="80" y="176" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">immediate</text><text x="830" y="176" font-size="15" font-weight="700" fill="#4a5568" text-anchor="end">days</text><rect x="60" y="214" width="300" height="48" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="243.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Telephone, web chat, face to face</text><rect x="420" y="214" width="160" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="243.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Email: hours</text><rect x="680" y="214" width="160" height="48" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="760" y="243.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Letter: days</text><rect x="30" y="325" width="840" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="361" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Security: how easy to intercept or see?</text><line x1="80" y1="405" x2="830" y2="405" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="80" y="391" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">hardest</text><text x="830" y="391" font-size="15" font-weight="700" fill="#4a5568" text-anchor="end">public</text><rect x="60" y="429" width="160" height="48" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="458.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Face to face</text><rect x="240" y="429" width="160" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="320" y="458.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sealed letter</text><rect x="420" y="429" width="230" height="70" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="535" y="459.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Encrypted email (can be</text><text x="535" y="480.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">hacked)</text><rect x="670" y="429" width="180" height="70" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="760" y="459.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Social media,</text><text x="760" y="480.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">posters</text><rect x="30" y="540" width="840" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="575" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Urgent but confidential? A phone call, then an encrypted email</text><text x="450" y="601" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">to confirm the details in writing.</text>
</svg>