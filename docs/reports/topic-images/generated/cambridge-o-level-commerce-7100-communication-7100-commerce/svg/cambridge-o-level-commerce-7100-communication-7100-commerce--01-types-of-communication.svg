<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four types of communication</text>

<rect x="30" y="110" width="195" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="195" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="127" y="143" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Written</text><text x="46" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Words on paper or</text><text x="46" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">screen</text><circle cx="56" cy="250" r="11" fill="#2e6b62"/><path d="M51.05,250.22 L54.9,254.18 L61.5,246.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="74" y="256" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Permanent record</text><circle cx="56" cy="340" r="11" fill="#b5602e"/><path d="M51.82,335.82 L60.18,344.18 M60.18,335.82 L51.82,344.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="74" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Slower; no</text><text x="74" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">instant questions</text><rect x="245" y="110" width="195" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="245" y="110" width="195" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="342" y="143" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Oral</text><text x="261" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Spoken</text><circle cx="271" cy="250" r="11" fill="#2e6b62"/><path d="M266.05,250.22 L269.9,254.18 L276.5,246.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="289" y="256" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Immediate</text><text x="289" y="276" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">feedback; tone</text><text x="289" y="296" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">adds meaning</text><circle cx="271" cy="340" r="11" fill="#b5602e"/><path d="M266.82,335.82 L275.18,344.18 M275.18,335.82 L266.82,344.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="289" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">No record unless</text><text x="289" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">notes are taken</text><rect x="460" y="110" width="195" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="195" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="557" y="143" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Electronic</text><text x="476" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Digital devices and</text><text x="476" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">networks</text><circle cx="486" cy="250" r="11" fill="#2e6b62"/><path d="M481.05,250.22 L484.9,254.18 L491.5,246.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="504" y="256" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Fast; many people</text><text x="504" y="276" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">at low cost</text><circle cx="486" cy="340" r="11" fill="#b5602e"/><path d="M481.82,335.82 L490.18,344.18 M490.18,335.82 L481.82,344.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="504" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Needs devices,</text><text x="504" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">power, network;</text><text x="504" y="386" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">security risks</text><rect x="675" y="110" width="195" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="675" y="110" width="195" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="772" y="143" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Visual</text><text x="691" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Images, signs,</text><text x="691" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">charts, colours,</text><text x="691" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">video</text><circle cx="701" cy="250" r="11" fill="#2e6b62"/><path d="M696.05,250.22 L699.9,254.18 L706.5,246.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="719" y="256" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Quick to grasp,</text><text x="719" y="276" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">even across</text><text x="719" y="296" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">languages</text><circle cx="701" cy="340" r="11" fill="#b5602e"/><path d="M696.82,335.82 L705.18,344.18 M705.18,335.82 L696.82,344.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="719" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Simple messages</text><text x="719" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">only; may be</text><text x="719" y="386" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">misread</text><rect x="30" y="430" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="466" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Type = form of the message.  Method = the way it is sent.</text><text x="54" y="512" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An email</text><text x="250" y="512" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="280" y="486" width="150" height="40" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="355" y="511.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Written</text><text x="454" y="512" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="470" y="486" width="150" height="40" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="545" y="511.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Electronic</text><text x="54" y="568" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A videoconference</text><text x="250" y="568" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="280" y="542" width="150" height="40" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="355" y="567.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Oral</text><text x="454" y="568" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="470" y="542" width="150" height="40" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="545" y="567.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Visual</text><text x="644" y="568" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="660" y="542" width="150" height="40" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="567.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Electronic</text><text x="54" y="624" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A poster</text><text x="250" y="624" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="280" y="598" width="150" height="40" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="355" y="623.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Visual</text><text x="454" y="624" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="470" y="598" width="150" height="40" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="545" y="623.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Written</text><text x="778" y="627" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">(usually)</text>
</svg>