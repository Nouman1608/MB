<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eight methods and where business uses them</text>

<rect x="30" y="110" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Letter</text><text x="50" y="164" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="start" font-style="italic">Use: contract terms, complaints</text><circle cx="62" cy="192" r="11" fill="#2e6b62"/><path d="M57.05,192.22 L60.9,196.18 L67.5,188.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Formal, signed, permanent record</text><circle cx="62" cy="224" r="11" fill="#b5602e"/><path d="M57.82,219.82 L66.18,228.18 M66.18,219.82 L57.82,228.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Slow; postage and printing</text><rect x="460" y="110" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Telephone</text><text x="480" y="164" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="start" font-style="italic">Use: urgent queries, late deliveries</text><circle cx="492" cy="192" r="11" fill="#2e6b62"/><path d="M487.05,192.22 L490.9,196.18 L497.5,188.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Instant two-way conversation</text><circle cx="492" cy="224" r="11" fill="#b5602e"/><path d="M487.82,219.82 L496.18,228.18 M496.18,219.82 L487.82,228.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No written record; time zones</text><rect x="30" y="260" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="290" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Face to face</text><text x="50" y="314" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="start" font-style="italic">Use: large contracts, appraisals</text><circle cx="62" cy="342" r="11" fill="#2e6b62"/><path d="M57.05,342.22 L60.9,346.18 L67.5,338.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Builds trust; the most private</text><circle cx="62" cy="374" r="11" fill="#b5602e"/><path d="M57.82,369.82 L66.18,378.18 M66.18,369.82 L57.82,378.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Travel time and cost</text><rect x="460" y="260" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="290" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Videoconferencing</text><text x="480" y="314" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="start" font-style="italic">Use: overseas suppliers, branches</text><circle cx="492" cy="342" r="11" fill="#2e6b62"/><path d="M487.05,342.22 L490.9,346.18 L497.5,338.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">See people without travel</text><circle cx="492" cy="374" r="11" fill="#b5602e"/><path d="M487.82,369.82 L496.18,378.18 M496.18,369.82 L487.82,378.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Needs good internet and equipment</text><rect x="30" y="410" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="440" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Email</text><text x="50" y="464" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="start" font-style="italic">Use: orders, quotations, invoices</text><circle cx="62" cy="492" r="11" fill="#2e6b62"/><path d="M57.05,492.22 L60.9,496.18 L67.5,488.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="498" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fast, cheap, attachments, record</text><circle cx="62" cy="524" r="11" fill="#b5602e"/><path d="M57.82,519.82 L66.18,528.18 M66.18,519.82 L57.82,528.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="530" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ignored, filtered or hacked</text><rect x="460" y="410" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="440" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Web-based chat</text><text x="480" y="464" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="start" font-style="italic">Use: customer service on retail sites</text><circle cx="492" cy="492" r="11" fill="#2e6b62"/><path d="M487.05,492.22 L490.9,496.18 L497.5,488.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="498" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Routine answers at any hour, no staff</text><circle cx="492" cy="524" r="11" fill="#b5602e"/><path d="M487.82,519.82 L496.18,528.18 M496.18,519.82 L487.82,528.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="530" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Struggle with complex problems</text><rect x="30" y="560" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="590" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Social media</text><text x="50" y="614" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="start" font-style="italic">Use: promotions, launches</text><circle cx="62" cy="642" r="11" fill="#2e6b62"/><path d="M57.05,642.22 L60.9,646.18 L67.5,638.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="648" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reaches very many quickly and cheaply</text><circle cx="62" cy="674" r="11" fill="#b5602e"/><path d="M57.82,669.82 L66.18,678.18 M66.18,669.82 L57.82,678.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="680" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Public; short-lived; not secure</text><rect x="460" y="560" width="410" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="590" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Posters</text><text x="480" y="614" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="start" font-style="italic">Use: safety notices, in-store offers</text><circle cx="492" cy="642" r="11" fill="#2e6b62"/><path d="M487.05,642.22 L490.9,646.18 L497.5,638.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="648" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Visual; cheap for local messages</text><circle cx="492" cy="674" r="11" fill="#b5602e"/><path d="M487.82,669.82 L496.18,678.18 M496.18,669.82 L487.82,678.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="680" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One-way; limited detail</text>
</svg>