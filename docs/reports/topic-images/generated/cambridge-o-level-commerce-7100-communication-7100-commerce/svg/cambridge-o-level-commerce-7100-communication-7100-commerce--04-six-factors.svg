<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six factors in choosing a method</text>

<rect x="30" y="110" width="270" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="126" width="238" height="46" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="154.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Urgency</text><text x="50" y="200" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How quickly must it arrive</text><text x="50" y="221" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and be answered?</text><text x="50" y="268" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Telephone, web chat, face</text><text x="50" y="289" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">to face</text><rect x="315" y="110" width="270" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="331" y="126" width="238" height="46" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="154.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cost</text><text x="335" y="200" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Email and social media cost</text><text x="335" y="221" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">very little per message</text><text x="335" y="268" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Videoconferencing removes</text><text x="335" y="289" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">travel</text><rect x="600" y="110" width="270" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="616" y="126" width="238" height="46" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="154.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Security</text><text x="620" y="200" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How confidential is it?</text><text x="620" y="268" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Not social media or posters</text><rect x="30" y="325" width="270" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="341" width="238" height="46" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="369.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Distance</text><text x="50" y="415" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Electronic methods remove</text><text x="50" y="436" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">travel time</text><text x="50" y="483" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Videoconferencing, email,</text><text x="50" y="504" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">telephone</text><rect x="315" y="325" width="270" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="331" y="341" width="238" height="46" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="369.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Availability of networks</text><text x="335" y="415" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Weak coverage rules out</text><text x="335" y="436" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">electronic methods</text><text x="335" y="483" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Letter, landline, visit</text><rect x="600" y="325" width="270" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="616" y="341" width="238" height="46" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="369.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Importance</text><text x="620" y="415" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Needs a formal record or</text><text x="620" y="436" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">personal attention?</text><text x="620" y="483" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Signed letter; face-to-face</text><text x="620" y="504" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">meeting</text><text x="450" y="568" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Say which factor matters most in the situation, and why.</text>
</svg>