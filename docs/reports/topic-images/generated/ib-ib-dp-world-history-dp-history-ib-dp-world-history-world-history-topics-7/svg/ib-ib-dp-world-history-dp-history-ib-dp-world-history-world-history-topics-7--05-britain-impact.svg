<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 974" width="900" height="974" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="974" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Impact and response in Britain</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Industrial society created new demands; the state took on new roles</text>
<line x1="130" y1="132" x2="130" y2="738" stroke="#1e2a44" stroke-width="4"/><rect x="170" y="124" width="700" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="183" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Combination Acts repealed</text><text x="183" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Workers can organize</text><circle cx="130" cy="158.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="164.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1824</text><rect x="170" y="203" width="700" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="183" y="230.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Factory Act</text><text x="183" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Children under nine banned from textile mills; inspectors created</text><circle cx="130" cy="237.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="243.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1833</text><rect x="170" y="282" width="700" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="183" y="309.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Chartism</text><text x="183" y="333.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Demands for political rights</text><circle cx="130" cy="316.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="322.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1838-48</text><rect x="170" y="361" width="700" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="183" y="388.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Chadwick's sanitary report</text><text x="183" y="412.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">On the labouring population's living conditions</text><circle cx="130" cy="395.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="401.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1842</text><rect x="170" y="440" width="700" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="183" y="467.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ten Hours Act</text><text x="183" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Limits hours of women and young people</text><circle cx="130" cy="474.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="480.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1847</text><rect x="170" y="519" width="700" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="183" y="546.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Public Health Act</text><text x="183" y="570.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Follows Chadwick's report</text><circle cx="130" cy="553.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="559.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1848</text><rect x="170" y="598" width="700" height="69" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="183" y="625.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Alkali Act</text><text x="183" y="649.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Regulates chemical emissions</text><circle cx="130" cy="632.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="638.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1863</text><rect x="170" y="677" width="700" height="69" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="183" y="704.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Clean Air Act</text><text x="183" y="728.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">After London's smog of December 1952</text><circle cx="130" cy="711.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="717.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1956</text><rect x="30" y="768" width="270.6666666666667" height="41" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="793.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Workers organize</text><rect x="314.6666666666667" y="768" width="270.6666666666667" height="41" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="793.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Social reform</text><rect x="599.3333333333334" y="768" width="270.6666666666667" height="41" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="793.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Environment</text><rect x="30" y="831" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="865.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Compare: Germany</text><text x="50" y="895.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Bismarck answered the growth of the SPD with sickness insurance (1883), accident insurance</text><text x="50" y="917.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(1884) and old-age and disability pensions (1889).</text>
</svg>