<rect width="900" height="641" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Resources as the main reason? Britain and Japan</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A comparative plan, one factor per paragraph</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="352" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="152.72727272727272" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Factor</text><rect x="182.72727272727272" y="124" width="248.18181818181816" height="48" fill="#b5d3cf"/><text x="196.72727272727272" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Britain</text><rect x="430.9090909090909" y="124" width="248.18181818181816" height="48" fill="#f2e7b8"/><text x="444.9090909090909" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Japan</text><rect x="679.090909090909" y="124" width="190.9090909090909" height="48" fill="#d4b02e"/><text x="693.090909090909" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mini-judgement</text><rect x="30" y="172" width="152.72727272727272" height="86" fill="#dce9e7"/><text x="44" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Resources</text><rect x="182.72727272727272" y="172" width="248.18181818181816" height="86" fill="#ffffff"/><text x="196.72727272727272" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Coalfields near ports and</text><text x="196.72727272727272" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rivers; iron ore</text><rect x="430.9090909090909" y="172" width="248.18181818181816" height="86" fill="#ffffff"/><text x="444.9090909090909" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Limited coal; imported cotton;</text><text x="444.9090909090909" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">imported iron ore for Yawata</text><text x="444.9090909090909" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1901)</text><rect x="679.090909090909" y="172" width="190.9090909090909" height="86" fill="#ffffff"/><text x="693.090909090909" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Decisive for Britain, a</text><text x="693.090909090909" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">constraint for Japan</text><line x1="30" y1="258" x2="870" y2="258" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="258" width="152.72727272727272" height="86" fill="#dce9e7"/><text x="44" y="284" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Government</text><rect x="182.72727272727272" y="258" width="248.18181818181816" height="86" fill="#ffffff"/><text x="196.72727272727272" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Enabling: patents, property,</text><text x="196.72727272727272" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">navy</text><rect x="430.9090909090909" y="258" width="248.18181818181816" height="86" fill="#ffffff"/><text x="444.9090909090909" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Directing: model factories,</text><text x="444.9090909090909" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">railways, education, Iwakura</text><text x="444.9090909090909" y="324" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mission (1871-73)</text><rect x="679.090909090909" y="258" width="190.9090909090909" height="86" fill="#ffffff"/><text x="693.090909090909" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The key difference</text><line x1="30" y1="344" x2="870" y2="344" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="344" width="152.72727272727272" height="66" fill="#dce9e7"/><text x="44" y="370" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Capital and</text><text x="44" y="390" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">labour</text><rect x="182.72727272727272" y="344" width="248.18181818181816" height="66" fill="#ffffff"/><text x="196.72727272727272" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Banks, merchant wealth, rural</text><text x="196.72727272727272" y="390" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">labour to towns</text><rect x="430.9090909090909" y="344" width="248.18181818181816" height="66" fill="#ffffff"/><text x="444.9090909090909" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Land tax funds investment;</text><text x="444.9090909090909" y="390" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">young rural women in mills</text><rect x="679.090909090909" y="344" width="190.9090909090909" height="66" fill="#ffffff"/><line x1="30" y1="410" x2="870" y2="410" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="410" width="152.72727272727272" height="66" fill="#dce9e7"/><text x="44" y="436" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Technology and</text><text x="44" y="456" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">markets</text><rect x="182.72727272727272" y="410" width="248.18181818181816" height="66" fill="#ffffff"/><text x="196.72727272727272" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Invented</text><rect x="430.9090909090909" y="410" width="248.18181818181816" height="66" fill="#ffffff"/><text x="444.9090909090909" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Borrowed and adapted</text><rect x="679.090909090909" y="410" width="190.9090909090909" height="66" fill="#ffffff"/><text x="693.090909090909" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Both textiles first; later</text><text x="693.090909090909" y="456" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">empire and war</text></g><line x1="182.72727272727272" y1="124" x2="182.72727272727272" y2="476" stroke="#c9d6d4" stroke-width="1.5"/><line x1="430.9090909090909" y1="124" x2="430.9090909090909" y2="476" stroke="#c9d6d4" stroke-width="1.5"/><line x1="679.090909090909" y1="124" x2="679.090909090909" y2="476" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="352" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="498" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="532.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="562.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Resources were necessary for the British model of steam-powered industry, but Japan shows that</text><text x="50" y="584.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">determined</tspan> <tspan font-weight="700" fill="#1e2a44">state</tspan> <tspan font-weight="700" fill="#1e2a44">could</tspan> <tspan font-weight="700" fill="#1e2a44">substitute</tspan> <tspan font-weight="700" fill="#1e2a44">for</tspan> <tspan font-weight="700" fill="#1e2a44">them</tspan>.</text>
</svg>