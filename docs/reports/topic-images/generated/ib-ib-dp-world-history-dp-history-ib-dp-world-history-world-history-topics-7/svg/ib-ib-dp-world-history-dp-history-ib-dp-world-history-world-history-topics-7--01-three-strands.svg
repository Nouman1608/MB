<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 547" width="900" height="547" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three strands: origins, development, impact</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Paper 2 questions are usually built on one of them</text>
<rect x="30" y="124" width="257.3333333333333" height="258" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ORIGINS</text><text x="45" y="177.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it began</text><text x="45" y="206.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Agricultural change</text><text x="45" y="232.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Population growth</text><text x="45" y="258.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Coal and iron</text><text x="45" y="284.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Capital and banking</text><text x="45" y="310.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Technology; labour supply</text><text x="45" y="336.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Markets, incl. colonial trade</text><text x="45" y="362.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Role of government</text><line x1="293.3333333333333" y1="253" x2="315.3333333333333" y2="253" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="124" width="257.3333333333333" height="258" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336.3333333333333" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEVELOPMENT</text><text x="336.3333333333333" y="177.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How it spread</text><text x="336.3333333333333" y="206.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.5333333333333" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Power: water, steam, then</text><text x="351.5333333333333" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">electricity and oil</text><text x="336.3333333333333" y="253.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.5333333333333" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Canals, railways,</text><text x="351.5333333333333" y="274.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">steamships, telegraph</text><text x="336.3333333333333" y="300.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.5333333333333" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Steel and chemicals</text><text x="336.3333333333333" y="326.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.5333333333333" y="326.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Entrepreneurs, inventors,</text><text x="351.5333333333333" y="347.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the state</text><line x1="584.6666666666666" y1="253" x2="606.6666666666666" y2="253" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="124" width="257.3333333333333" height="258" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="627.6666666666666" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMPACT</text><text x="627.6666666666666" y="177.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What it changed</text><text x="627.6666666666666" y="206.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="642.8666666666667" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Social and economic:</text><text x="642.8666666666667" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">towns, work, family,</text><text x="642.8666666666667" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">children, women, unions</text><text x="627.6666666666666" y="274.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="642.8666666666667" y="274.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Political: reform, parties,</text><text x="642.8666666666667" y="295.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ideologies, welfare</text><text x="627.6666666666666" y="321.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="642.8666666666667" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Environmental</text><rect x="30" y="404" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="438.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do not confuse origins with impact</text><text x="50" y="468.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A question on causes does not want a paragraph on child labour unless you show how labour</text><text x="50" y="490.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">supply caused growth.</text>
</svg>