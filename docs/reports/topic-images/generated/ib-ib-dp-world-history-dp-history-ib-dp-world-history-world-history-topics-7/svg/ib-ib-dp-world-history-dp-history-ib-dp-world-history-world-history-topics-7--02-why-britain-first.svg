<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 547" width="900" height="547" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Britain first?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Factors historians weigh: a debate, not a list</text>
<line x1="330" y1="195" x2="407" y2="282.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="319.5" x2="407" y2="319.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="444" x2="407" y2="356.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="184.5" x2="493" y2="279" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="319.5" x2="493" y2="319.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="454.5" x2="493" y2="360" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="319.5" r="86" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="302.96999999999997" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Britain</text><text x="450" y="326.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">industrializes</text><text x="450" y="349.33" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">first</text><rect x="30" y="145" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="175.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Agricultural change</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Raised output and released labour;</text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">now seen as gradual</text><rect x="30" y="259" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="289.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Coal and iron</text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Close together, near water</text><text x="46" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">transport. Allen: high wages plus</text><text x="46" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cheap coal made machines pay</text><rect x="30" y="394" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="424.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Capital and markets</text><text x="46" y="452.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Banking, Atlantic trade, a home</text><text x="46" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">market for cheap textiles</text><rect x="570" y="124" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Technology</text><text x="586" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Spinning jenny (c.1764); water</text><text x="586" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">frame (1769) and Cromford Mill</text><text x="586" y="224.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1771); Watt's engine (1769)</text><rect x="570" y="259" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="289.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The state</text><text x="586" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not a planner: protected property</text><text x="586" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and patents, a navy for trade,</text><text x="586" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">enclosure acts</text><rect x="570" y="394" width="300" height="121" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="586" y="424.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pomeranz (2000)</text><text x="586" y="452.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Against the Yangzi delta:</text><text x="586" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">accessible coal and American</text><text x="586" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resources, not a unique culture</text>
</svg>