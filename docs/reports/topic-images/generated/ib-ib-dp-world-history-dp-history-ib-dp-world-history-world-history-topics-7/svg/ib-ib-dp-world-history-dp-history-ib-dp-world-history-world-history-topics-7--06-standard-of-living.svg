<rect width="900" height="531" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The standard of living debate</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Did early industrialization make workers better or worse off?</text>
<defs><linearGradient id="spg124" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="158" width="780" height="26" rx="13" fill="url(#spg124)" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="144" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Better off</text><text x="840" y="144" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">Worse off</text><path d="M153.6,184 L153.6,208 L236,216 L236,238" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="153.6" cy="171" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="238" width="412" height="138" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="266.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"Optimists"</text><text x="44" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stress rising real wages over the long run.</text><path d="M746.4,184 L746.4,208 L664,216 L664,238" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="746.4" cy="171" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="458" y="238" width="412" height="138" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="266.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"Pessimists"</text><text x="472" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">E. P. Thompson, <tspan font-style="italic">The</tspan> <tspan font-style="italic">Making</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">English</tspan></text><text x="472" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Working</tspan> <tspan font-style="italic">Class</tspan> (1963): loss of independence,</text><text x="472" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">factory discipline, worse urban conditions in the</text><text x="472" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">early decades.</text><rect x="30" y="398" width="270.6666666666667" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="439.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Who?</text><text x="46" y="468.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Which groups were affected?</text><rect x="314.6666666666667" y="398" width="270.6666666666667" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="439.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">When?</text><text x="330.6666666666667" y="468.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Early decades or the long run?</text><rect x="599.3333333333334" y="398" width="270.6666666666667" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="428.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Which measure?</text><text x="615.3333333333334" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wages, or independence and</text><text x="615.3333333333334" y="478.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conditions?</text>
</svg>