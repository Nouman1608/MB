<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An application answer: Jonah and the lift</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Explain with the two-process model; suggest SD [6]</text>
<rect x="30" y="124" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,124 H230 V194 H44 A14,14 0 0 1 30,180 V138 A14,14 0 0 1 44,124 Z" fill="#f2e7b8"/><rect x="30" y="124" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="162.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Acquisition</text><text x="246" y="152.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lift (neutral) paired with being trapped (fear) → the lift becomes a <tspan font-weight="700" fill="#1e2a44">conditioned</tspan></text><text x="246" y="173.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">stimulus</tspan></text><rect x="30" y="202" width="840" height="52" rx="14" fill="#ffffff"/><path d="M44,202 H230 V254 H44 A14,14 0 0 1 30,240 V216 A14,14 0 0 1 44,202 Z" fill="#f2e7b8"/><rect x="30" y="202" width="840" height="52" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="231.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Maintenance</text><text x="246" y="232.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Taking the stairs lowers anxiety → avoidance <tspan font-weight="700" fill="#1e2a44">negatively</tspan> <tspan font-weight="700" fill="#1e2a44">reinforced</tspan></text><rect x="30" y="262" width="840" height="52" rx="14" fill="#ffffff"/><path d="M44,262 H230 V314 H44 A14,14 0 0 1 30,300 V276 A14,14 0 0 1 44,262 Z" fill="#f2e7b8"/><rect x="30" y="262" width="840" height="52" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="291.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Why it continues</text><text x="246" y="292.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Never uses a lift, so never learns it is safe</text><rect x="30" y="322" width="840" height="52" rx="14" fill="#ffffff"/><path d="M44,322 H230 V374 H44 A14,14 0 0 1 30,360 V336 A14,14 0 0 1 44,322 Z" fill="#dce9e7"/><rect x="30" y="322" width="840" height="52" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="351.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">SD step 1</text><text x="246" y="352.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Learn <tspan font-weight="700" fill="#1e2a44">relaxation</tspan> techniques</text><rect x="30" y="382" width="840" height="52" rx="14" fill="#ffffff"/><path d="M44,382 H230 V434 H44 A14,14 0 0 1 30,420 V396 A14,14 0 0 1 44,382 Z" fill="#dce9e7"/><rect x="30" y="382" width="840" height="52" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="411.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">SD step 2</text><text x="246" y="412.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Hierarchy</tspan>: from a photo of a lift to riding alone for several floors</text><rect x="30" y="442" width="840" height="52" rx="14" fill="#ffffff"/><path d="M44,442 H230 V494 H44 A14,14 0 0 1 30,480 V456 A14,14 0 0 1 44,442 Z" fill="#dce9e7"/><rect x="30" y="442" width="840" height="52" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="471.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">SD step 3</text><text x="246" y="472.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Move up only when relaxed: <tspan font-weight="700" fill="#1e2a44">reciprocal</tspan> <tspan font-weight="700" fill="#1e2a44">inhibition</tspan></text><rect x="30" y="516" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="549.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Every point uses Jonah’s details: the lift, being trapped, the stairs at his aunt’s flat.</text>
</svg>