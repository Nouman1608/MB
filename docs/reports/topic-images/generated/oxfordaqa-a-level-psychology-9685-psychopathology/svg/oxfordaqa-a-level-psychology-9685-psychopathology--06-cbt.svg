<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" width="900" height="722" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="722" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cognitive behaviour therapy</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Identify and challenge negative thoughts; replace them with balanced ones</text>
<rect x="30" y="124" width="144" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="102" y="161" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">A</text><text x="102" y="186.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Activating</text><text x="102" y="207.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">event</text><line x1="180" y1="180" x2="198" y2="180" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="204" y="124" width="144" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="171.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">B</text><text x="276" y="196.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Belief</text><line x1="354" y1="180" x2="372" y2="180" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="378" y="124" width="144" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="171.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">C</text><text x="450" y="196.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Consequence</text><line x1="528" y1="180" x2="546" y2="180" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="552" y="124" width="144" height="112" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="624" y="171.5" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="624" y="196.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Dispute</text><line x1="702" y1="180" x2="720" y2="180" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="726" y="124" width="144" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="798" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">E</text><text x="798" y="173.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Effect</text><text x="798" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">new rational</text><text x="798" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">beliefs</text><rect x="30" y="258" width="270.6666666666667" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165.33333333333334" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">EMPIRICAL</text><text x="165.33333333333334" y="316.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Is it true?</text><rect x="314.6666666666667" y="258" width="270.6666666666667" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">LOGICAL</text><text x="450" y="316.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Does it follow?</text><rect x="599.3333333333334" y="258" width="270.6666666666667" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="734.6666666666667" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PRAGMATIC</text><text x="734.6666666666667" y="316.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Does it help?</text><rect x="30" y="364" width="272" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="396" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THOUGHT DIARY</text><text x="50" y="421.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Identify negative automatic</text><text x="50" y="442.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">thoughts</text><rect x="314" y="364" width="272" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="396" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BECK: PATIENT AS SCIENTIST</text><text x="334" y="421.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Test thoughts against</text><text x="334" y="442.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">evidence</text><text x="334" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“What evidence is there that</text><text x="334" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">everyone dislikes you?”</text><rect x="598" y="364" width="272" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="396" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BEHAVIOURAL ACTIVATION</text><text x="618" y="421.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Homework: plan enjoyable</text><text x="618" y="442.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">activities</text><text x="618" y="469.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tests new beliefs in real life</text><rect x="30" y="537" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="569" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="595.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">March et al. (2007)</text><text x="50" y="623.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Adolescents: CBT about as effective as</text><text x="50" y="644.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">antidepressants after 36 weeks; a combination</text><text x="50" y="665.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">worked best.</text><rect x="457" y="537" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="569" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="595.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Needs motivation</text><text x="477" y="623.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hard when depression is severe, so medication</text><text x="477" y="644.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may come first; depends on the therapeutic</text><text x="477" y="665.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">relationship.</text>
</svg>