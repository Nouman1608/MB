<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 849" width="900" height="849" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="849" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The two-process model</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Mowrer (1960): acquired by classical, maintained by operant conditioning</text>
<text x="450" y="140" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">1. ACQUISITION: CLASSICAL CONDITIONING (WATSON AND RAYNER, 1920: LITTLE ALBERT)</text><rect x="30" y="162" width="246.66666666666666" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="153.33333333333331" y="194" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">NEUTRAL STIMULUS</text><text x="153.33333333333331" y="220.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">White rat</text><rect x="326.66666666666663" y="162" width="246.66666666666666" height="84" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="449.99999999999994" y="194" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">UNCONDITIONED STIMULUS</text><text x="449.99999999999994" y="220.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sudden loud noise</text><rect x="623.3333333333333" y="162" width="246.66666666666666" height="84" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="746.6666666666666" y="194" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">UNCONDITIONED RESPONSE</text><text x="746.6666666666666" y="220.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fear</text><text x="301.66666666666663" y="214" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><line x1="579.3333333333333" y1="204" x2="617.3333333333333" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="274" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">after several pairings</text><rect x="30" y="286" width="246.66666666666666" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="153.33333333333331" y="318" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CONDITIONED STIMULUS</text><text x="153.33333333333331" y="344.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rat alone</text><line x1="282.66666666666663" y1="328" x2="320.66666666666663" y2="328" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="286" width="246.66666666666666" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="449.99999999999994" y="318" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CONDITIONED RESPONSE</text><text x="449.99999999999994" y="344.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fear</text><line x1="579.3333333333333" y1="328" x2="617.3333333333333" y2="328" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="286" width="246.66666666666666" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="746.6666666666666" y="318" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">GENERALISATION</text><text x="746.6666666666666" y="344.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Other furry objects</text><text x="450" y="418" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">2. MAINTENANCE: OPERANT CONDITIONING</text><rect x="30" y="440" width="250" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155" y="474.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Avoid the feared</text><text x="155" y="497.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">stimulus</text><rect x="325" y="440" width="250" height="87" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="474.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Anxiety falls</text><text x="450" y="502.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">rewarding</text><rect x="620" y="440" width="250" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="474.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Avoidance negatively</text><text x="745" y="497.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">reinforced</text><text x="745" y="525.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">more likely next time</text><line x1="286" y1="480" x2="319" y2="480" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="581" y1="480" x2="614" y2="480" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M745,554 C745,610 155,610 155,526" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="450" y="634" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">never learns the stimulus is harmless, so the fear does not extinguish</text><rect x="30" y="664" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="696" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="722.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Explains exposure therapies</text><text x="50" y="750.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">They work by preventing avoidance.</text><rect x="457" y="664" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="696" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="722.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Not everyone; preparedness</text><text x="477" y="750.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many with phobias recall no trauma; Seligman</text><text x="477" y="771.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1971): we are prepared to fear snakes and</text><text x="477" y="792.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heights; ignores cognitions.</text>
</svg>