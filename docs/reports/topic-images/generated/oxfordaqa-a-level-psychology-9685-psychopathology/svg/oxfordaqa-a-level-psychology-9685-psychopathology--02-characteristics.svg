<rect width="900" height="469" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Characteristics of phobias and depression</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Organise as behavioural, emotional and cognitive</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="313" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="168" height="55" fill="#b5d3cf"/><rect x="198" y="124" width="336" height="55" fill="#f2e7b8"/><text x="214" y="155.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Phobias</text><rect x="534" y="124" width="336" height="55" fill="#b5d3cf"/><text x="550" y="155.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Depression</text><rect x="30" y="179" width="168" height="93" fill="#dce9e7"/><text x="46" y="207.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Behavioural</text><rect x="198" y="179" width="336" height="93" fill="#ffffff"/><text x="214" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Avoidance; panic such as freezing or</text><text x="214" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">running; enduring the situation with</text><text x="214" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">great distress</text><rect x="534" y="179" width="336" height="93" fill="#ffffff"/><text x="550" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lethargy or agitation; disrupted sleep</text><text x="550" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and appetite; sometimes aggression or</text><text x="550" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-harm</text><line x1="30" y1="272" x2="870" y2="272" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="272" width="168" height="72" fill="#dce9e7"/><text x="46" y="300.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Emotional</text><rect x="198" y="272" width="336" height="72" fill="#f8faf9"/><text x="214" y="300.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Persistent, excessive anxiety and fear,</text><text x="214" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">out of proportion to the actual danger</text><rect x="534" y="272" width="336" height="72" fill="#f8faf9"/><text x="550" y="300.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Persistent low mood; loss of interest or</text><text x="550" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pleasure; worthlessness or anger</text><line x1="30" y1="344" x2="870" y2="344" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="344" width="168" height="93" fill="#dce9e7"/><text x="46" y="372.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Cognitive</text><rect x="198" y="344" width="336" height="93" fill="#ffffff"/><text x="214" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Selective attention to the phobic</text><text x="214" y="393.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stimulus; irrational beliefs; often</text><text x="214" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recognises the fear is excessive</text><rect x="534" y="344" width="336" height="93" fill="#ffffff"/><text x="550" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Poor concentration; dwelling on the</text><text x="550" y="393.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">negative; absolutist “all or nothing”</text><text x="550" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">thinking</text></g><line x1="198" y1="124" x2="198" y2="437" stroke="#c9d6d4" stroke-width="1.5"/><line x1="534" y1="124" x2="534" y2="437" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="313" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>