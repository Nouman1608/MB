<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 678" width="900" height="678" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="678" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Systematic desensitisation v flooding</text>

<rect x="30" y="100" width="405" height="290" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SYSTEMATIC DESENSITISATION (WOLPE, 1958)</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gradual, with relaxation</text><text x="50" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">1</tspan> Relaxation training: deep breathing,</text><text x="65.2" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">progressive muscle relaxation</text><text x="50" y="235.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">2</tspan> Anxiety hierarchy: least to most frightening</text><text x="50" y="262.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">3</tspan> Gradual exposure, imagined or real; next</text><text x="65.2" y="283.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">step only when calm</text><text x="50" y="310.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mechanism: <tspan font-weight="700" fill="#1e2a44">counterconditioning</tspan> by</text><text x="65.2" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">reciprocal</tspan> <tspan font-weight="700" fill="#1e2a44">inhibition</tspan>: relaxation and fear</text><text x="65.2" y="352.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cannot exist together</text><rect x="465" y="100" width="405" height="290" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="485" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FLOODING</text><text x="485" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Immediate, prolonged exposure</text><text x="485" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Straight to the <tspan font-weight="700" fill="#1e2a44">most</tspan> <tspan font-weight="700" fill="#1e2a44">feared</tspan> stimulus</text><text x="485" y="214.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="214.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">No</tspan> <tspan font-weight="700" fill="#1e2a44">hierarchy</tspan>; escape prevented</text><text x="485" y="241.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="241.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Adrenaline cannot sustain a peak response,</text><text x="500.2" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">so anxiety falls</text><text x="485" y="289.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="289.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mechanism: the association is <tspan font-weight="700" fill="#1e2a44">extinguished</tspan></text><rect x="30" y="412" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="445.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Both are behavioural: they treat the behaviour, not underlying cognitions, which for most specific</text><text x="450" y="467.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">phobias is enough.</text><rect x="30" y="514" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="546" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SD</text><text x="50" y="572.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Supported; patient controls the pace</text><text x="50" y="600.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Suits people who may struggle with talking</text><text x="50" y="621.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">therapies.</text><rect x="457" y="514" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="546" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FLOODING</text><text x="477" y="572.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Faster and cheaper, but traumatic</text><text x="477" y="600.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fully informed consent essential; some abandon</text><text x="477" y="621.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">treatment.</text>
</svg>