<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four definitions of abnormality</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each with an example and a limitation</text>
<rect x="30" y="124" width="413" height="182" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATISTICAL INFREQUENCY</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rare in the population</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">an</tspan> <tspan font-style="italic">IQ</tspan> <tspan font-style="italic">below</tspan> <tspan font-style="italic">about</tspan> <tspan font-style="italic">70,</tspan> <tspan font-style="italic">far</tspan> <tspan font-style="italic">from</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">mean</tspan></text><text x="50" y="239.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Limitation:</tspan> very high IQ is rare but desirable;</text><text x="50" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">depression is common, not rare</text><rect x="457" y="124" width="413" height="182" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEVIATION FROM SOCIAL NORMS</text><text x="477" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Breaks a society’s unwritten rules</text><text x="477" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">homosexuality</tspan> <tspan font-style="italic">listed</tspan> <tspan font-style="italic">as</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">disorder</tspan> <tspan font-style="italic">by</tspan> <tspan font-style="italic">the</tspan></text><text x="477" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">APA</tspan> <tspan font-style="italic">until</tspan> <tspan font-style="italic">1973</tspan></text><text x="477" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Limitation:</tspan> norms vary between cultures and</text><text x="477" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">change over time</text><rect x="30" y="320" width="413" height="203" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="352" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FAILURE TO FUNCTION ADEQUATELY</text><text x="50" y="378.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cannot cope with everyday life</text><text x="50" y="406.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">keeping</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">job,</tspan> <tspan font-style="italic">relationships,</tspan> <tspan font-style="italic">self-care;</tspan></text><text x="50" y="427.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">distress</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">self</tspan> <tspan font-style="italic">or</tspan> <tspan font-style="italic">others</tspan></text><text x="50" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Limitation:</tspan> someone must judge “adequate”;</text><text x="50" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">poverty can also cause failure</text><rect x="457" y="320" width="413" height="203" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="352" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEVIATION FROM IDEAL MENTAL HEALTH</text><text x="477" y="378.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Absence of Jahoda’s (1958) criteria</text><text x="477" y="406.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">positive</tspan> <tspan font-style="italic">self-attitude,</tspan> <tspan font-style="italic">self-actualisation,</tspan></text><text x="477" y="427.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">resistance</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">stress,</tspan> <tspan font-style="italic">autonomy,</tspan> <tspan font-style="italic">accurate</tspan></text><text x="477" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">perception,</tspan> <tspan font-style="italic">mastery</tspan></text><text x="477" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Limitation:</tspan> most people fail several; autonomy</text><text x="477" y="498.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reflects individualist cultures</text><rect x="30" y="545" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="578.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Each captures part of abnormality, so in practice clinicians <tspan font-weight="700" fill="#1e2a44">combine</tspan> them.</text>
</svg>