<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 853" width="900" height="853" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="853" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cognitive explanations of depression</text>

<rect x="30" y="100" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="134" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">BECK (1967): THE NEGATIVE TRIAD</text><polygon points="450,170 250,350 650,350" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><rect x="345" y="136" width="210" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="162.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Self</text><text x="450" y="190.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">“I am worthless”</text><rect x="65" y="342" width="210" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="368.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">World</text><text x="170" y="396.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">“everyone is against me”</text><rect x="625" y="342" width="210" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="368.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Future</text><text x="730" y="396.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">“it will never get better”</text><text x="450" y="296" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">negative self-schemas</text><text x="450" y="318" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">from childhood</text><text x="54" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Cognitive errors:</text><text x="54" y="192" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700">overgeneralisation</tspan>, <tspan font-weight="700">magnifying</tspan></text><text x="54" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700">failures</tspan></text><text x="450" y="468" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">ELLIS (1962): THE ABC MODEL</text><rect x="30" y="490" width="213.71428571428572" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="136.85714285714286" y="547.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">A: ACTIVATING EVENT</text><text x="136.85714285714286" y="573.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Failing an exam</text><line x1="249.71428571428572" y1="557" x2="283.7142857142857" y2="557" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="289.7142857142857" y="490" width="320.57142857142856" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="522" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">B: BELIEF</text><text x="450" y="548.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“I must succeed at everything,</text><text x="450" y="571.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">or I am a failure”</text><text x="450" y="599.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">irrational (“musturbation”)</text><line x1="616.2857142857142" y1="557" x2="650.2857142857142" y2="557" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="656.2857142857142" y="490" width="213.71428571428572" height="134" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="763.1428571428571" y="547.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">C: CONSEQUENCE</text><text x="763.1428571428571" y="573.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Depression</text><text x="450" y="658.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A rational belief instead (“I need to revise differently”) would not lead to depression.</text><rect x="30" y="689" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="721" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="747.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Biases found; led to therapy</text><text x="50" y="775.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Negative cognitive biases in depressed people.</text><rect x="457" y="689" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="721" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="747.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cause or result? Blame?</text><text x="477" y="775.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Neglects biology and real circumstances; some</text><text x="477" y="796.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">negative beliefs are realistic.</text>
</svg>