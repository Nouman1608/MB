<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 763" width="900" height="763" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="763" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nutrient cycling in the pond</text>

<path d="M571.3,181.6 A236,236 0 0 1 643.6,249.0" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M685.8,373.6 A236,236 0 0 1 647.7,512.8" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M467.3,619.4 A236,236 0 0 1 432.7,619.4" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M252.3,512.8 A236,236 0 0 1 214.2,373.6" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M256.4,249.0 A236,236 0 0 1 328.7,181.6" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="339" y="96" width="222" height="104" rx="12" fill="#d8e3c6" stroke="#6f9a52" stroke-width="2.2"/><text x="450" y="125.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Producers take up</text><text x="450" y="148.85999999999999" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">nutrients</text><text x="450" y="174.66" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">such as nitrates, from the</text><text x="450" y="194.46" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">water and mud</text><rect x="563.4493378456563" y="259.0719893275124" width="222" height="104" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="674.4493378456563" y="288.17198932751245" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumers eat</text><text x="674.4493378456563" y="313.97198932751246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and gain nutrients from</text><text x="674.4493378456563" y="333.7719893275125" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">producers or other</text><text x="674.4493378456563" y="353.5719893275125" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">consumers</text><rect x="477.7173195410237" y="522.9280106724876" width="222" height="104" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="588.7173195410237" y="569.5280106724877" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Death and waste</text><text x="588.7173195410237" y="595.3280106724876" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">material sinks to the bed</text><rect x="200.28268045897636" y="522.9280106724876" width="222" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="311.28268045897636" y="559.5280106724877" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Decomposers</text><text x="311.28268045897636" y="585.3280106724876" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">bacteria and fungi break</text><text x="311.28268045897636" y="605.1280106724876" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">it down</text><rect x="114.55066215434377" y="259.07198932751237" width="222" height="104" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="225.55066215434377" y="295.6719893275124" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Nutrients released</text><text x="225.55066215434377" y="321.4719893275124" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">back into the water and</text><text x="225.55066215434377" y="341.2719893275124" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mud</text><text x="450" y="378" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">nutrient</text><text x="450" y="404" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">cycling</text><rect x="30" y="660" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="691.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Without decomposers, nutrients would stay locked in dead material and producers would run</text><text x="450" y="713.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">short.</text>
</svg>