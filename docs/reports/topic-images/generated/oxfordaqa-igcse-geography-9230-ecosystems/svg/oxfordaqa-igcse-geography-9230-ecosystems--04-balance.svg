roke-width="2.2"/><text x="48" y="617.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Biotic links</text><text x="48" y="645.99" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Predators help keep consumer numbers in</text><text x="48" y="668.4300000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">check.</text><rect x="460" y="580" width="410" height="110" rx="12" fill="#eaf1f8" stroke="#2b5a9a" stroke-width="2.2"/><text x="478" y="617.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Abiotic conditions</text><text x="478" y="645.99" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Enough light, oxygen and nutrients, and a</text><text x="478" y="668.4300000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">suitable temperature.</text>
