ht="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="250" y="266" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Frog</text><rect x="405" y="238" width="130" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="470" y="266" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Small fish</text><rect x="605" y="238" width="190" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="700" y="266" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Dragonfly larvae</text><rect x="185" y="358" width="130" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="250" y="386" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Water flea</text><rect x="415" y="358" width="110" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="470" y="386" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Snail</text><rect x="610" y="358" width="160" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="690" y="386" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Insect larvae</text><rect x="195" y="478" width="110" height="44" rx="22" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2.2"/><text x="250" y="506" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Algae</text><rect x="415" y="478" width="110" height="44" rx="22" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2.2"/><text x="470" y="506" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pondweed</text><line x1="60" y1="560" x2="110" y2="560" stroke="#b5602e" stroke-width="4.5"/><text x="120" y="566" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">one food chain: algae → water flea → small fish → heron</text><text x="60" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Arrows show the direction energy flows: from the organism eaten to the one that eats it.</text><text x="60" y="624" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Energy is lost at each step, so there are far fewer herons than water fleas.</text>
