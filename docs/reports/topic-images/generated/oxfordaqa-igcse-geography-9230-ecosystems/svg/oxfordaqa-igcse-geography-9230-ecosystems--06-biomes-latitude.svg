<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 637" width="900" height="637" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="637" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Biomes by latitude</text>

<rect x="30" y="110" width="840" height="404" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="150" y="130" width="420" height="34" fill="#e8eef0" stroke="#1e2a44" stroke-width="1.5"/><text x="360" y="153" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Tundra</text><rect x="150" y="164" width="420" height="34" fill="#a9c48f" stroke="#1e2a44" stroke-width="1.5"/><text x="360" y="187" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Boreal (coniferous) forest</text><rect x="150" y="198" width="420" height="44" fill="#d8e3c6" stroke="#1e2a44" stroke-width="1.5"/><text x="360" y="226" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Temperate forest and grassland; Mediterranean</text><rect x="150" y="242" width="420" height="44" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><text x="360" y="270" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Hot desert</text><rect x="150" y="286" width="420" height="30" fill="#e6d58f" stroke="#1e2a44" stroke-width="1.5"/><text x="360" y="307" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Savanna</text><rect x="150" y="316" width="420" height="60" fill="#6f9a52" stroke="#1e2a44" stroke-width="1.5"/><text x="360" y="339" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Tropical rainforest</text><rect x="150" y="376" width="420" height="30" fill="#e6d58f" stroke="#1e2a44" stroke-width="1.5"/><text x="360" y="397" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Savanna</text><rect x="150" y="406" width="420" height="44" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><text x="360" y="434" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Hot desert</text><line x1="150" y1="358" x2="570" y2="358" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 5"/><text x="140" y="363" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">Equator</text><line x1="144" y1="242" x2="150" y2="242" stroke="#1e2a44" stroke-width="2"/><text x="140" y="247" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">30°N</text><line x1="144" y1="286" x2="150" y2="286" stroke="#1e2a44" stroke-width="2"/><text x="140" y="291" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">15°N</text><line x1="144" y1="406" x2="150" y2="406" stroke="#1e2a44" stroke-width="2"/><text x="140" y="411" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">15°S</text><line x1="144" y1="450" x2="150" y2="450" stroke="#1e2a44" stroke-width="2"/><text x="140" y="455" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">30°S</text><text x="140" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">towards</text><text x="140" y="164" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">North Pole</text><text x="360" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">↓ towards the South Pole: belts repeat</text><line x1="620" y1="382" x2="620" y2="328" stroke="#2b5a9a" stroke-width="4" marker-end="url(#ah)"/><text x="640" y="348" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="start">rising air:</text><text x="640" y="368" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="start">heavy rainfall</text><line x1="620" y1="212" x2="620" y2="262" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="640" y="230" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">sinking air around</text><text x="640" y="250" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">30°N: dry conditions</text><line x1="620" y1="400" x2="620" y2="450" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="640" y="420" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">sinking air</text><text x="640" y="440" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">around 30°S</text><text x="860" y="500" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">schematic: belts simplified, not to scale</text><rect x="30" y="534" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="565.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Climate, especially temperature and rainfall, controls where biomes occur; both vary with</text><text x="450" y="587.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">latitude.</text>
</svg>