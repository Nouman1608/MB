<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Changing one component</text>

<text x="30" y="128" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Example 1: extra nutrients (eutrophication)</text><rect x="30" y="146" width="270" height="104" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="165" y="192.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fertiliser washes in</text><text x="165" y="219.22" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">extra nitrates and phosphates</text><circle cx="48" cy="164" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="48" y="169.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="301" y1="198" x2="314" y2="198" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="146" width="270" height="104" rx="12" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="192.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Algal bloom</text><text x="450" y="219.22" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">algae grow rapidly</text><circle cx="333" cy="164" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="333" y="169.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="586" y1="198" x2="599" y2="198" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="146" width="270" height="104" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="735" y="192.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Plants below die</text><text x="735" y="219.22" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">sunlight is blocked</text><circle cx="618" cy="164" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="618" y="169.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="735" y1="252" x2="735" y2="278" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="280" width="270" height="104" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="735" y="315.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Oxygen used up</text><text x="735" y="342.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">decomposers multiply on dead</text><text x="735" y="363.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">algae and plants</text><circle cx="618" cy="298" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="618" y="303.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="599" y1="332" x2="586" y2="332" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="280" width="270" height="104" rx="12" fill="#fbeee6" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="315.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fish die</text><text x="450" y="342.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">low oxygen kills fish and</text><text x="450" y="363.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">other animals</text><circle cx="333" cy="298" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="333" y="303.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="314" y1="332" x2="301" y2="332" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="280" width="270" height="104" rx="12" fill="#fbeee6" stroke="#1e2a44" stroke-width="2.2"/><text x="165" y="326.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Predators leave</text><text x="165" y="353.22" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">herons lose their food supply</text><circle cx="48" cy="298" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="48" y="303.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="30" y="428" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">One change to an abiotic component affects every level of the food web.</text><text x="30" y="462" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Example 2: removing a predator</text><rect x="30" y="480" width="152" height="76" rx="12" fill="#fbeee6" stroke="#1e2a44" stroke-width="2.2"/><text x="106" y="512" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pike removed</text><line x1="183" y1="518" x2="201" y2="518" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="202" y="480" width="152" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="278" y="512" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Small fish</text><text x="278" y="546" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">increase</text><line x1="355" y1="518" x2="373" y2="518" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="374" y="480" width="152" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="512" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Water fleas</text><text x="450" y="546" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">decrease</text><line x1="527" y1="518" x2="545" y2="518" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="546" y="480" width="152" height="76" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><text x="622" y="512" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Algae</text><text x="622" y="546" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">increase</text><line x1="699" y1="518" x2="717" y2="518" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="718" y="480" width="152" height="76" rx="12" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2.2"/><text x="794" y="510" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pond green and</text><text x="794" y="530" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">murky</text>
</svg>