<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 571" width="900" height="571" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="571" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Repairing a flaw in your own draft</text>

<rect x="30" y="96" width="240" height="52" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="127.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Hasty</tspan> <tspan font-weight="700">generalisation</tspan></text><rect x="330" y="96" width="540" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="342" y="127.03999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Narrow the claim or add representative evidence.</text><line x1="276" y1="122" x2="324" y2="122" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="158" width="240" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="194.35" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">False</tspan> <tspan font-weight="700">cause</tspan></text><rect x="330" y="158" width="540" height="62.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="342" y="183.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Show a causal mechanism or rule out other causes; or say “may</text><text x="342" y="204.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">have contributed”.</text><line x1="276" y1="189.12" x2="324" y2="189.12" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="230.24" width="240" height="52" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="261.47" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">False</tspan> <tspan font-weight="700">dilemma</tspan></text><rect x="330" y="230.24" width="540" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="342" y="261.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Acknowledge other options and explain why they fall short.</text><line x1="276" y1="256.24" x2="324" y2="256.24" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="292.24" width="240" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="328.59" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Slippery</tspan> <tspan font-weight="700">slope</tspan></text><rect x="330" y="292.24" width="540" height="62.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="342" y="317.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Show evidence for each step, or limit the claim to the likely next</text><text x="342" y="338.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">step.</text><line x1="276" y1="323.36" x2="324" y2="323.36" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="364.48" width="240" height="52" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="395.71" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Straw</tspan> <tspan font-weight="700">man</tspan></text><rect x="330" y="364.48" width="540" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="342" y="395.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Restate the opposing view fairly, then answer it.</text><line x1="276" y1="390.48" x2="324" y2="390.48" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="426.48" width="240" height="52" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="457.71" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Ad</tspan> <tspan font-weight="700">hominem</tspan></text><rect x="330" y="426.48" width="540" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="342" y="457.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Address the argument, not the person.</text><line x1="276" y1="452.48" x2="324" y2="452.48" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="488.48" width="240" height="52" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="519.71" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Circular</tspan> <tspan font-weight="700">reasoning</tspan></text><rect x="330" y="488.48" width="540" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="342" y="519.52" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Provide independent reasons or evidence.</text><line x1="276" y1="514.48" x2="324" y2="514.48" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/>
</svg>