<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A flaw on purpose</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Swift, “A Modest Proposal”, 1729</text>
<rect x="30" y="152" width="300" height="130" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="180" y="198.68" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The narrator’s plan</text><text x="180" y="226.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the poor of Ireland sell their</text><text x="180" y="247.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">children as food</text><text x="180" y="136" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">presented as the only option</text><rect x="400" y="122" width="470" height="200" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><text x="635" y="152" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Real remedies, listed then dismissed</text><rect x="430" y="172" width="410" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="635" y="202.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">e.g. taxing absentee landlords</text><text x="635" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic" xml:space="preserve">“Therefore I repeat, let no man talk to me of other</text><text x="635" y="283.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic" xml:space="preserve">expedients”</text><line x1="345" y1="217" x2="390" y2="217" stroke="#b5602e" stroke-width="4"/><line x1="360" y1="202" x2="378" y2="232" stroke="#b5602e" stroke-width="4"/><rect x="30" y="352" width="408" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="48" y="386" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">The flaw</text><text x="48" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A false dilemma resting on a monstrous</text><text x="48" y="435.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">premise: that poor people’s children are a</text><text x="48" y="456.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">commodity.</text><rect x="462" y="352" width="408" height="125.75999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="480" y="386" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">The point</text><text x="480" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Visibly specious reasoning invites readers to</text><text x="480" y="435.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">reject the real premises behind policies of the</text><text x="480" y="456.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">day.</text><text x="450" y="507.76" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Ask not only “what is wrong?” but “why has the writer made it wrong?”</text>
</svg>