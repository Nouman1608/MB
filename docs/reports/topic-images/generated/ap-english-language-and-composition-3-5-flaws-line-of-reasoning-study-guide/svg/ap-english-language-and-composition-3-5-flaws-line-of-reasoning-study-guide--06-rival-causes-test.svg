<rect x="330" y="122" width="240" height="100" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="450" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Evidence kept</text><text x="450" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">attendance has fallen</text><text x="450" y="205.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">since September</text><rect x="45" y="292" width="230" height="56" rx="28" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="160" y="327" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">New head’s arrival</text><line x1="160" y1="288" x2="363" y2="226" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><rect x="335" y="292" width="230" height="56" rx="28" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="327" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Flu outbreak</text><line x1="450" y1="288" x2="450" y2="226" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><rect x="625" y="292" width="230" height="56" rx="28" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="740" y="327" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Fewer bus services</text><line x1="740" y1="288" x2="537" y2="226" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="450" y="376" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">possible causes that coincide</text><text x="450" y="420" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Tests before attributing any cause</text><rect x="30" y="438" width="408" height="74.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="469.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Compare attendance on routes that <tspan font-weight="700">kept</tspan> <tspan font-weight="700">their</tspan></text><text x="48" y="490.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">buses</tspan> with those that did not.</text><rect x="462" y="438" width="408" height="74.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="480" y="469.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Check absence reasons against <tspan font-weight="700">the</tspan> <tspan font-weight="700">dates</tspan> <tspan font-weight="700">of</tspan></text><text x="480" y="490.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">the</tspan> <tspan font-weight="700">outbreak</tspan>.</text><text x="450" y="542.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">The revision still addresses the problem, treats the head fairly and strengthens the writer’s ethos.</text>
