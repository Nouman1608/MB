<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two kinds of failure</text>

<rect x="30" y="96" width="405" height="168" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="48" y="130" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Illogical</text><text x="48" y="158" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The conclusion does not follow, even if the</text><text x="48" y="179.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">premises are true.</text><text x="48" y="200.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"></text><text x="48" y="221.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“All the students in the choir are good at music;</text><text x="48" y="242.48000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Ravi is good at music; so Ravi is in the choir.”</text><rect x="465" y="96" width="405" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="483" y="130" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Specious</text><text x="483" y="158" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Looks plausible but depends on a trick, a gap</text><text x="483" y="179.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">or an emotional shortcut.</text><text x="483" y="200.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"></text><text x="483" y="221.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Can you really say no to saving a child’s life?</text><text x="483" y="242.48000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Then you must support the new tax.”</text><rect x="30" y="288" width="405" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><ellipse cx="232" cy="378" rx="170" ry="66" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><ellipse cx="150" cy="378" rx="62" ry="40" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="384" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">choir</text><text x="300" y="338" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">good at music</text><circle cx="320" cy="388" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="320" y="418" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Ravi could be here</text><rect x="465" y="288" width="405" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="485" y="338" width="130" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="550" y="367.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">saving a child’s</text><text x="550" y="387.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">life</text><rect x="720" y="338" width="130" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="785" y="377.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">support the tax</text><line x1="618" y1="373" x2="714" y2="373" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="667" y="328" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">hidden question:</text><text x="667" y="433" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">does the tax achieve it?</text><text x="450" y="488" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Both undermine credibility: a reader who spots one flaw may doubt the rest.</text>
</svg>