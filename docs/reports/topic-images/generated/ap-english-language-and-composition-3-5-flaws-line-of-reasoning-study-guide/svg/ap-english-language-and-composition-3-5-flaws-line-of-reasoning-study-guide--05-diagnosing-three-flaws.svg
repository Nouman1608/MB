<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Diagnosing three flaws</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: the new head</text>
<rect x="30" y="122" width="420" height="111.16" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="160.37" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Since the new head arrived in September,</text><text x="44" y="182.81" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">attendance has fallen. So she is clearly the</text><text x="44" y="205.25" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">cause.</text><rect x="480" y="122" width="390" height="111.16" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="494" y="150.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">False cause</text><text x="494" y="176.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">One event followed another; other explanations</text><text x="494" y="196.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">are possible (a flu outbreak, a bus timetable</text><text x="494" y="216.10999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">change).</text><line x1="452" y1="177.57999999999998" x2="478" y2="177.57999999999998" stroke="#b5602e" stroke-width="3"/><rect x="30" y="247.16" width="420" height="111.15999999999994" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="296.74999999999994" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Either we remove her or attendance will go on</text><text x="44" y="319.18999999999994" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">falling.</text><rect x="480" y="247.16" width="390" height="111.15999999999994" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="494" y="275.55999999999995" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">False dilemma</text><text x="494" y="301.66999999999996" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Only two options; the school could investigate</text><text x="494" y="321.46999999999997" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">causes, change the bus schedule or support</text><text x="494" y="341.27" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">families.</text><line x1="452" y1="302.73999999999995" x2="478" y2="302.73999999999995" stroke="#b5602e" stroke-width="3"/><rect x="30" y="372.31999999999994" width="420" height="91.36000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="44" y="400.7899999999999" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Councillor Hale says the head is doing a good</text><text x="44" y="423.2299999999999" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">job, but he has never taught a day in his life, so</text><text x="44" y="445.6699999999999" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">we can ignore him.</text><rect x="480" y="372.31999999999994" width="390" height="91.36000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="494" y="400.7199999999999" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Ad hominem</text><text x="494" y="426.8299999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Attacks his experience instead of answering his</text><text x="494" y="446.62999999999994" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">claim.</text><line x1="452" y1="417.99999999999994" x2="478" y2="417.99999999999994" stroke="#b5602e" stroke-width="3"/><rect x="30" y="481.67999999999995" width="840" height="54.440000000000055" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="514.13" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Common thread: each treats an <tspan font-weight="700">assumption</tspan> as proven. Name the flaw <tspan font-weight="700">and</tspan> explain why it fails.</text>
</svg>