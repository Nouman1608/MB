<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 934" width="900" height="934" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="934" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What goes wrong: the shape of each flaw</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Explain the flaw; the name is only shorthand</text>
<rect x="30" y="122" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Hasty generalisation</text><circle cx="80" cy="216" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><circle cx="110" cy="216" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="130" y1="216" x2="180" y2="216" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="200" cy="194" r="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="222" cy="194" r="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="244" cy="194" r="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="266" cy="194" r="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="200" cy="216" r="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="222" cy="216" r="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="244" cy="216" r="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="266" cy="216" r="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="200" cy="238" r="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="222" cy="238" r="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="244" cy="238" r="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><circle cx="266" cy="238" r="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="46" y="302" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“My two cousins hate maths, so</text><text x="46" y="321.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">school ruins maths for</text><text x="46" y="341.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">everyone.”</text><rect x="315" y="122" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="331" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">False cause</text><rect x="345" y="196" width="60" height="40" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="375" y="223" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A</text><rect x="495" y="196" width="60" height="40" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="525" y="223" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B</text><text x="450" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">then</text><line x1="410" y1="216" x2="490" y2="216" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 4"/><text x="450" y="258" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">sequence ≠ cause</text><text x="331" y="302" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“Since the new principal arrived,</text><text x="331" y="321.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">test scores have fallen. She</text><text x="331" y="341.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">must be responsible.”</text><rect x="600" y="122" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="616" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">False dilemma</text><rect x="630" y="186" width="44" height="70" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><rect x="686" y="186" width="44" height="70" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><rect x="742" y="186" width="44" height="70" rx="6" fill="none" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 4"/><rect x="798" y="186" width="44" height="70" rx="6" fill="none" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 4"/><text x="764" y="228" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">?</text><text x="616" y="302" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“Either we ban all cars or we</text><text x="616" y="321.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">accept filthy air for ever.”</text><rect x="30" y="388" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="420" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Slippery slope</text><rect x="50" y="438" width="40" height="28" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><line x1="92" y1="454" x2="108" y2="466" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="4 4"/><rect x="110" y="454" width="40" height="28" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><line x1="152" y1="470" x2="168" y2="482" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="4 4"/><rect x="170" y="470" width="40" height="28" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><line x1="212" y1="486" x2="228" y2="498" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="4 4"/><rect x="230" y="486" width="40" height="28" rx="6" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="165" y="544" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">steps asserted, not shown</text><text x="46" y="568" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“If pupils may use phones at</text><text x="46" y="587.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">break, soon they will use them</text><text x="46" y="607.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">in exams.”</text><rect x="315" y="388" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="331" y="420" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Straw man</text><rect x="330" y="454" width="105" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="382.5" y="486.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">actual view</text><rect x="465" y="454" width="105" height="56" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="5 4"/><text x="517.5" y="476.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">distorted</text><text x="517.5" y="496.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">view</text><line x1="437" y1="482" x2="461" y2="482" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="517" y="536" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">← attacked</text><text x="331" y="568" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“...want pupils to wear whatever</text><text x="331" y="587.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">they like and for rules to</text><text x="331" y="607.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">vanish.”</text><rect x="600" y="388" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="616" y="420" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Ad hominem</text><circle cx="670" cy="472" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M645,527 Q670,487 695,527" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="750" y="462" width="100" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="800" y="491.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the plan</text><line x1="740" y1="532" x2="700" y2="502" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="616" y="568" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“She does not even own a bike,</text><text x="616" y="587.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">so ignore her cycle-lane plan.”</text><rect x="30" y="654" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="686" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Circular reasoning</text><ellipse cx="165" cy="756" rx="90" ry="38" fill="none" stroke="#b5602e" stroke-width="3"/><line x1="240" y1="738" x2="252" y2="756" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="165" y="762" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">claim = support</text><text x="46" y="834" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“Uniforms are necessary</text><text x="46" y="853.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">because pupils need to wear</text><text x="46" y="873.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">them.”</text><rect x="315" y="654" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="331" y="686" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Faulty analogy</text><rect x="345" y="728" width="80" height="50" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="385" y="758" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">school</text><rect x="475" y="728" width="80" height="50" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="515" y="758" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">business</text><text x="450" y="760" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">≈ ?</text><text x="450" y="804" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">differ in a relevant way</text><text x="331" y="834" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“Running a school is like running</text><text x="331" y="853.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">a business, so teachers should</text><text x="331" y="873.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">be paid by results.”</text><rect x="600" y="654" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="616" y="686" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Red herring</text><rect x="615" y="728" width="90" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="660" y="757.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">litter</text><path d="M710,753 C750,753 760,793 790,793" fill="none" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="825" y="758" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle" xml:space="preserve">news-</text><text x="825" y="776" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle" xml:space="preserve">letter</text><text x="616" y="834" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">“Why worry about litter when</text><text x="616" y="853.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">the council wastes money on its</text><text x="616" y="873.6" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic" xml:space="preserve">newsletter?”</text>
</svg>