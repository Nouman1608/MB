<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621" width="900" height="621" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="621" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of marriage</text>

<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><line x1="60" y1="120" x2="70" y2="120" stroke="#8a6d0d" stroke-width="4" marker-start="url(#ahO)"/><text x="60" y="106" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">family plays leading role in choice</text><text x="840" y="106" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="end">couple choose each other</text><rect x="30" y="144" width="269.3333333333333" height="188" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,214 L31.25,158.25 Q31.25,145.25 44.25,145.25 L285.0833333333333,145.25 Q298.0833333333333,145.25 298.0833333333333,158.25 L298.0833333333333,214 Z" fill="#f2e7b8"/><line x1="31.25" y1="214" x2="298.0833333333333" y2="214" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="184.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Arranged</text><text x="44" y="245.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families choose or introduce</text><text x="44" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">partners, stressing</text><text x="44" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">background, religion and</text><text x="44" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">status.</text><rect x="315.3333333333333" y="144" width="269.3333333333333" height="188" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,214 L316.5833333333333,158.25 Q316.5833333333333,145.25 329.5833333333333,145.25 L570.4166666666666,145.25 Q583.4166666666666,145.25 583.4166666666666,158.25 L583.4166666666666,214 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="214" x2="583.4166666666666" y2="214" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="172.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">"Assisted" /</text><text x="450" y="196.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">semi-arranged</text><text x="329.3333333333333" y="245.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families introduce; the</text><text x="329.3333333333333" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">couple consent and can veto.</text><rect x="600.6666666666666" y="144" width="269.3333333333333" height="188" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,214 L601.9166666666666,158.25 Q601.9166666666666,145.25 614.9166666666666,145.25 L855.75,145.25 Q868.75,145.25 868.75,158.25 L868.75,214 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="214" x2="868.75" y2="214" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="184.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Love</text><text x="614.6666666666666" y="245.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Partners choose on romantic</text><text x="614.6666666666666" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">attraction; families play a</text><text x="614.6666666666666" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">smaller role.</text><rect x="30" y="350" width="840" height="86" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="3" stroke-dasharray="10 6"/><text x="56" y="386" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Not on this scale: forced marriage</text><text x="56" y="414" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lacks the free consent of one or both partners; a form of abuse.</text><rect x="30" y="454" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Monogamy</text><circle cx="61" cy="513.39" r="4.5" fill="#8a6d0d"/><text x="74" y="519" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marriage to one partner at a time</text><circle cx="61" cy="543.39" r="4.5" fill="#8a6d0d"/><text x="74" y="549" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Serial monogamy:</tspan> a sequence of marriages separated by divorce, common where divorce is</text><text x="74" y="571" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">easy</text>
</svg>