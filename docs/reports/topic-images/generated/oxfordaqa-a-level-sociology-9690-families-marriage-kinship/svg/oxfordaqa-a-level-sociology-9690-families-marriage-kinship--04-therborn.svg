<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 682" width="900" height="682" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="682" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Therborn (2004): family systems</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">three dimensions of comparison</text>
<text x="450" y="106" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="110" width="266.6666666666667" height="106" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="163.33333333333334" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Patriarchy</text><text x="163.33333333333334" y="172.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">power of fathers and</text><text x="163.33333333333334" y="193.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">husbands</text><rect x="316.6666666666667" y="110" width="266.6666666666667" height="106" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Marriage</text><text x="450" y="172.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">who marries, when, and</text><text x="450" y="193.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">whether it can be ended</text><rect x="603.3333333333334" y="110" width="266.6666666666667" height="106" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="736.6666666666667" y="163.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fertility</text><rect x="30" y="238" width="412" height="221" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,288 L31.25,252.25 Q31.25,239.25 44.25,239.25 L427.75,239.25 Q440.75,239.25 440.75,252.25 L440.75,288 Z" fill="#f2e7b8"/><line x1="31.25" y1="288" x2="440.75" y2="288" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="268.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Five major systems</text><circle cx="49" cy="313.92" r="4.5" fill="#2e6b62"/><text x="62" y="319.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">European (and New World offshoots)</text><circle cx="49" cy="342.92" r="4.5" fill="#2e6b62"/><text x="62" y="348.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">East Asian</text><circle cx="49" cy="371.92" r="4.5" fill="#2e6b62"/><text x="62" y="377.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sub-Saharan African</text><circle cx="49" cy="400.92" r="4.5" fill="#2e6b62"/><text x="62" y="406.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">West Asian / North African</text><circle cx="49" cy="429.92" r="4.5" fill="#2e6b62"/><text x="62" y="435.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">South Asian</text><rect x="458" y="238" width="412" height="221" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,288 L459.25,252.25 Q459.25,239.25 472.25,239.25 L855.75,239.25 Q868.75,239.25 868.75,252.25 L868.75,288 Z" fill="#dce9e7"/><line x1="459.25" y1="288" x2="868.75" y2="288" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="268.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Two "interstitial" systems</text><circle cx="477" cy="313.92" r="4.5" fill="#2e6b62"/><text x="490" y="319.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Southeast Asian</text><circle cx="477" cy="342.92" r="4.5" fill="#2e6b62"/><text x="490" y="348.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Creole American</text><circle cx="477" cy="371.92" r="4.5" fill="#2e6b62"/><text x="490" y="377.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mix features of others</text><rect x="30" y="477" width="840" height="179" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="513" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Twentieth-century trends</text><circle cx="61" cy="536.39" r="4.5" fill="#8a6d0d"/><text x="74" y="542" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Patriarchy declined in every system, at very different speeds</text><circle cx="61" cy="566.39" r="4.5" fill="#8a6d0d"/><text x="74" y="572" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marriage patterns diverged</text><circle cx="61" cy="596.39" r="4.5" fill="#8a6d0d"/><text x="74" y="602" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fertility fell almost everywhere</text><circle cx="61" cy="626.39" r="4.5" fill="#8a6d0d"/><text x="74" y="632" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">So the Western nuclear family is not the "normal" end point</text>
</svg>