<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Alternatives to families</text>

<rect x="208" y="104" width="327" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="371.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What it involves</text><rect x="543" y="104" width="327" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="706.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sociological point</text><rect x="30" y="156" width="170" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="207.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Communes</text><rect x="208" y="156" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shared property, work and often</text><text x="222" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">child-rearing, e.g. the Israeli</text><text x="222" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kibbutz children’s houses.</text><rect x="543" y="156" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Challenges Murdock’s (1949) claim</text><text x="557" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">that the nuclear family is</text><text x="557" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">universal and necessary.</text><rect x="30" y="257" width="170" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="308.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Living alone</text><rect x="208" y="257" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One-person households: young</text><text x="222" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">professionals, divorced adults,</text><text x="222" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">widowed older people.</text><rect x="543" y="257" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Klinenberg (2012): can be a chosen,</text><text x="557" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">socially connected lifestyle, not</text><text x="557" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">just isolation.</text><rect x="30" y="358" width="170" height="96" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="389.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Foster care /</text><text x="42" y="411.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">children’s</text><text x="42" y="433.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">homes</text><rect x="208" y="358" width="327" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The state or agencies place</text><text x="222" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children with carers or in</text><text x="222" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">residential institutions.</text><rect x="543" y="358" width="327" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Child-rearing can be organised</text><text x="557" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outside kinship; raises questions</text><text x="557" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about outcomes.</text><rect x="30" y="470" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="506" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="56" y="535" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Alternatives often depend on family-like ties: kibbutz children still visited their</text><text x="56" y="557" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">parents; people living alone keep kin and friendship ties.</text>
</svg>