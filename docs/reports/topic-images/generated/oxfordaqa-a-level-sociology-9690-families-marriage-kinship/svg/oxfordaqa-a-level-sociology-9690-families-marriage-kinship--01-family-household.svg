<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 697" width="900" height="697" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="697" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Family, household and kinship</text>

<rect x="30" y="110" width="840" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Kinship: people recognised as related by blood, marriage or adoption,</text><text x="60" y="170" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">with rights and duties (inheritance, care, who may marry whom)</text><circle cx="330" cy="360" r="170" fill="#b5d3cf" fill-opacity="0.75" stroke="#1e2a44" stroke-width="3"/><circle cx="570" cy="360" r="170" fill="#f2e7b8" fill-opacity="0.8" stroke="#1e2a44" stroke-width="3"/><text x="240" y="300" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Family</text><text x="240" y="324" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">linked by</text><text x="240" y="345" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">kinship</text><text x="640" y="300" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Household</text><text x="640" y="324" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">shares a home</text><text x="640" y="345" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and daily</text><text x="640" y="366" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">activities</text><text x="240" y="410" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">A family split</text><text x="240" y="431" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">across two</text><text x="240" y="452" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">countries</text><text x="450" y="345" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Family</text><text x="450" y="365" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">sharing a</text><text x="450" y="385" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">home</text><text x="630" y="400" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">A student</text><text x="630" y="421" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">flat-share;</text><text x="630" y="442" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">living alone; a</text><text x="630" y="463" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">commune</text><rect x="30" y="560" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="596" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it matters</text><text x="56" y="625" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Living alone and communes are household arrangements outside the family, not family</text><text x="56" y="647" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">types.</text>
</svg>