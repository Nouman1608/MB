<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 737" width="900" height="737" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="737" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two ways a family is extended</text>

<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Vertically extended</text><text x="235" y="176" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">three or more generations</text><text x="665" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Horizontally extended</text><text x="665" y="176" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">extra members of the same generation</text><line x1="235" y1="286" x2="235" y2="302" stroke="#1e2a44" stroke-width="2.5"/><line x1="235" y1="302" x2="145" y2="302" stroke="#1e2a44" stroke-width="2.5"/><line x1="145" y1="302" x2="145" y2="324" stroke="#1e2a44" stroke-width="2.5"/><line x1="171" y1="350" x2="299" y2="350" stroke="#1e2a44" stroke-width="2.5"/><line x1="235" y1="350" x2="235" y2="412" stroke="#1e2a44" stroke-width="2.5"/><line x1="175" y1="412" x2="295" y2="412" stroke="#1e2a44" stroke-width="2.5"/><line x1="175" y1="412" x2="175" y2="444" stroke="#1e2a44" stroke-width="2.5"/><line x1="295" y1="412" x2="295" y2="444" stroke="#1e2a44" stroke-width="2.5"/><circle cx="235" cy="230" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="278" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">grandmother</text><circle cx="145" cy="350" r="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">son</text><circle cx="325" cy="350" r="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="325" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">daughter-in-law</text><circle cx="175" cy="470" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="175" y="518" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">grandchild</text><circle cx="295" cy="470" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="295" y="518" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">grandchild</text><line x1="510" y1="250" x2="820" y2="250" stroke="#8a6d0d" stroke-width="5" opacity="0.6"/><text x="665" y="238" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">one generation</text><circle cx="535" cy="300" r="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="535" y="348" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">brother</text><circle cx="605" cy="300" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="605" y="348" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">his wife</text><circle cx="725" cy="300" r="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="725" y="348" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">brother</text><circle cx="795" cy="300" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="795" y="348" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">his wife</text><line x1="561" y1="300" x2="579" y2="300" stroke="#1e2a44" stroke-width="2.5"/><line x1="751" y1="300" x2="769" y2="300" stroke="#1e2a44" stroke-width="2.5"/><circle cx="570" cy="430" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="570" y="478" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">children</text><circle cx="760" cy="430" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="760" y="478" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">children</text><line x1="570" y1="302" x2="570" y2="404" stroke="#1e2a44" stroke-width="2.5"/><line x1="760" y1="302" x2="760" y2="404" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="530" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. the traditional joint family of parts of</text><text x="665" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">South Asia: one compound</text><text x="235" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. a grandmother living with her son’s</text><text x="235" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">family</text><rect x="30" y="600" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="636" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Modified extended family</text><text x="56" y="665" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kin may live nearby rather than together and keep frequent contact and support. Young</text><text x="56" y="687" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and Willmott (1957): dense mother-daughter networks in Bethnal Green.</text>
</svg>