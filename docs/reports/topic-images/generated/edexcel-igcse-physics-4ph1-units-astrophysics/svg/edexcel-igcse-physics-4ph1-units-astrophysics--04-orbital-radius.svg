<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Orbital radius is from the centre</text>

<rect x="30" y="110" width="840" height="480" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="230" cy="330" r="170" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-dasharray="9 7"/><circle cx="230" cy="330" r="100" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><circle cx="230" cy="330" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><text x="230" y="356" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">centre</text><rect x="388" y="321" width="24" height="18" rx="3" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="376" y1="330" x2="424" y2="330" stroke="#1e2a44" stroke-width="2"/><line x1="230" y1="326" x2="330" y2="326" stroke="#2e6b62" stroke-width="4"/><line x1="330" y1="326" x2="386" y2="326" stroke="#b5602e" stroke-width="4"/><text x="280" y="314" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">planet radius</text><text x="359" y="360" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">height</text><line x1="230" y1="535" x2="400" y2="535" stroke="#1e2a44" stroke-width="2"/><line x1="230" y1="527" x2="230" y2="543" stroke="#1e2a44" stroke-width="2"/><line x1="400" y1="527" x2="400" y2="543" stroke="#1e2a44" stroke-width="2"/><line x1="230" y1="330" x2="230" y2="527" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="400" y1="342" x2="400" y2="527" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="3 4"/><text x="315" y="565" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">orbital radius r</text><rect x="520" y="180" width="320" height="300" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="545" y="225" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">r = planet radius + height</text><text x="545" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">r is measured from the</text><text x="545" y="296" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">centre of the body being</text><text x="545" y="322" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">orbited, not from its</text><text x="545" y="348" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">surface.</text><text x="545" y="374" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="545" y="400" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Given a height above the</text><text x="545" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">surface? Add the radius.</text>
</svg>