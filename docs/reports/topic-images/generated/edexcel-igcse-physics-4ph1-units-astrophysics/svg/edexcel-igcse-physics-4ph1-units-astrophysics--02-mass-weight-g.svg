<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mass stays, weight changes</text>

<rect x="30" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">On Earth</text><rect x="50" y="430" width="370" height="30" rx="6" fill="#a9c48f"/><circle cx="160" cy="306" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="136" y="326" width="48" height="70" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="148" y1="396" x2="148" y2="430" stroke="#1e2a44" stroke-width="4"/><line x1="172" y1="396" x2="172" y2="430" stroke="#1e2a44" stroke-width="4"/><line x1="160" y1="340" x2="160" y2="460" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="190" y="395" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">W = 750 N</text><text x="290" y="230" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">g = 10 N/kg</text><text x="290" y="260" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">m = 75 kg</text><text x="235" y="510" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">75 × 10 = 750 N</text><rect x="460" y="110" width="410" height="420" rx="14" fill="#f1f2f4" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">On the Moon</text><rect x="480" y="430" width="370" height="30" rx="6" fill="#cbbf9f"/><circle cx="590" cy="306" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="566" y="326" width="48" height="70" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="578" y1="396" x2="578" y2="430" stroke="#1e2a44" stroke-width="4"/><line x1="602" y1="396" x2="602" y2="430" stroke="#1e2a44" stroke-width="4"/><line x1="590" y1="340" x2="590" y2="359.2" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="620" y="395" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">W = 120 N</text><text x="720" y="230" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">g = 1.6 N/kg</text><text x="720" y="260" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">m = 75 kg</text><text x="665" y="510" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">75 × 1.6 = 120 N</text><rect x="30" y="550" width="840" height="180" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330" y="592" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">W = m × g</text><text x="590" y="592" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">N = kg × N/kg</text><text x="60" y="632" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mass (kg): the amount of matter, the same everywhere.</text><text x="60" y="664" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weight (N): the gravitational force, which depends on where you are.</text><text x="60" y="696" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">g in N/kg = acceleration of free fall in m/s²: the two units are equivalent.</text>
</svg>