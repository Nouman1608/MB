<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked examples: convert, then substitute</text>

<rect x="30" y="110" width="840" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Satellite: r = 26 600 km, T = 12 h</text><text x="60" y="182" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">r = 26 600 km = 2.66 × 10⁷ m</text><text x="60" y="212" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">T = 12 × 3600 = 43 200 s</text><text x="60" y="242" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">v = 2π × 2.66 × 10⁷ / 43 200</text><rect x="560" y="160" width="290" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="196" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3.9 × 10³ m/s</text><rect x="30" y="300" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="338" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Earth: r = 1.5 × 10¹¹ m, T = 365 days</text><text x="60" y="372" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">T = 365 × 86 400 = 3.15 × 10⁷ s</text><text x="60" y="402" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">v = 2π × 1.5 × 10¹¹ / 3.15 × 10⁷</text><rect x="560" y="350" width="290" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="386" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3.0 × 10⁴ m/s</text><rect x="30" y="460" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="498" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Moon: r = 3.8 × 10⁵ km, v = 1.0 km/s, find T</text><text x="60" y="532" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">r = 3.8 × 10⁸ m,  v = 1000 m/s</text><text x="60" y="562" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">T = 2πr / v = 2π × 3.8 × 10⁸ / 1000</text><text x="60" y="592" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">   = 2.4 × 10⁶ s</text><text x="60" y="622" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">in days: 2.4 × 10⁶ / 86 400</text><rect x="560" y="510" width="290" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="546" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">≈ 28 days</text>
</svg>