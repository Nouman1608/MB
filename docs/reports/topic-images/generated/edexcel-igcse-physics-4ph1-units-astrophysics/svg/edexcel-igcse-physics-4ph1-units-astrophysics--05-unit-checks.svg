<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Check an answer with its units</text>

<rect x="30" y="110" width="840" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="172" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">v = 2πr / T</text><text x="330" y="172" font-size="21" font-weight="600" fill="#2b5a9a" text-anchor="start">m ÷ s</text><text x="620" y="172" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">= m/s</text><text x="840" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">speed</text><rect x="30" y="230" width="840" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="292" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">W = m × g</text><text x="330" y="292" font-size="21" font-weight="600" fill="#2b5a9a" text-anchor="start">kg × N/kg</text><text x="620" y="292" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">= N</text><text x="840" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">weight (kg cancel)</text><rect x="30" y="350" width="840" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="412" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">T = 2πr / v</text><text x="330" y="412" font-size="21" font-weight="600" fill="#2b5a9a" text-anchor="start">m ÷ m/s</text><text x="620" y="412" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">= s</text><text x="840" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time (m cancel)</text><rect x="30" y="470" width="840" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="532" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Δλ / λ₀ = v / c</text><text x="330" y="532" font-size="21" font-weight="600" fill="#2b5a9a" text-anchor="start">nm ÷ nm , (m/s) ÷ (m/s)</text><text x="620" y="532" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">= no unit</text><text x="840" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">a pure ratio</text><rect x="30" y="600" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="640" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Answer in km/h or m/day when m/s was asked for?</text><text x="450" y="668" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">A conversion was missed.</text>
