<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Convert to metres and seconds first</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Distances into metres</text><rect x="70" y="165" width="220" height="64" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="206" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1 km</text><line x1="300" y1="197" x2="560" y2="197" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="430" y="187" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">× 1000 (× 10³)</text><rect x="580" y="165" width="250" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="206" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1000 m</text><text x="60" y="278" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Times into seconds</text><rect x="70" y="295" width="220" height="64" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="180" y="336" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1 h</text><line x1="300" y1="327" x2="560" y2="327" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="430" y="317" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">× 3600</text><rect x="580" y="295" width="250" height="64" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="705" y="336" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3600 s</text><rect x="70" y="379" width="220" height="64" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="180" y="420" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1 day</text><line x1="300" y1="411" x2="560" y2="411" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="430" y="401" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">× 24 × 3600</text><rect x="580" y="379" width="250" height="64" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="705" y="420" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">86 400 s</text><rect x="70" y="463" width="220" height="64" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="180" y="504" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1 year</text><line x1="300" y1="495" x2="560" y2="495" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="430" y="485" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">× 365 × 86 400</text><rect x="580" y="463" width="250" height="64" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="705" y="504" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">≈ 3.15 × 10⁷ s</text><rect x="30" y="600" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="640" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">m ÷ s gives m/s. Convert before you substitute,</text><text x="450" y="672" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">or km and hours give an answer in km/h.</text>
</svg>