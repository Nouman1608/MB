<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" width="900" height="684" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="684" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Compiled, then standardised</text>

<rect x="30" y="108" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">In the Prophet's lifetime (revealed over 23 years from 610 CE; 114 surahs)</text><text x="56" y="172" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Preserved by memorisation (huffaz) and writing, but not yet a single bound volume.</text><rect x="30" y="226" width="410" height="434" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="3"/><rect x="30" y="226" width="410" height="84" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="235" y="262" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Abu Bakr</text><text x="235" y="292" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">COMPILED</text><text x="54" y="340" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Why</text><text x="54" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">At the Battle of Yamama, during the Ridda</text><text x="54" y="389" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wars, many huffaz were killed: the Qur'an</text><text x="54" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">risked being lost if memory alone was</text><text x="54" y="435" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">relied on.</text><line x1="54" y1="474" x2="416" y2="474" stroke="#c9d6d4" stroke-width="2"/><text x="54" y="504" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">What he did</text><circle cx="62" cy="524" r="5" fill="#d4b02e"/><text x="76" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ordered the Qur'an collected into a</text><text x="76" y="553" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">single written text</text><circle cx="62" cy="578" r="5" fill="#d4b02e"/><text x="76" y="584" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Entrusted the task to Zayd ibn Thabit</text><rect x="460" y="226" width="410" height="434" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="3"/><rect x="460" y="226" width="410" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="665" y="262" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Uthman</text><text x="665" y="292" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">STANDARDISED</text><text x="484" y="340" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Why</text><text x="484" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">As Islam spread, regions recited in</text><text x="484" y="389" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">different dialects and disputes arose;</text><text x="484" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hudhayfah warned of the danger to unity.</text><line x1="484" y1="451" x2="846" y2="451" stroke="#c9d6d4" stroke-width="2"/><text x="484" y="481" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">What he did</text><circle cx="492" cy="501" r="5" fill="#2e6b62"/><text x="506" y="507" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Had the sheets held by Hafsah copied by</text><text x="506" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a committee under Zayd ibn Thabit</text><circle cx="492" cy="555" r="5" fill="#2e6b62"/><text x="506" y="561" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Standardised the dialect</text><circle cx="492" cy="586" r="5" fill="#2e6b62"/><text x="506" y="592" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sent official copies to the main centres</text><circle cx="492" cy="617" r="5" fill="#2e6b62"/><text x="506" y="623" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Had variant copies destroyed</text>
</svg>