<rect width="900" height="694" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The life of the Prophet (pbuh), 570–632</text>

<rect x="30" y="108" width="60" height="208" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><rect x="30" y="316" width="60" height="356" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text transform="translate(68,212) rotate(-90)" text-anchor="middle" font-size="18" font-weight="700" fill="#8a6d0d">MAKKAH</text><text transform="translate(68,498) rotate(-90)" text-anchor="middle" font-size="18" font-weight="700" fill="#2e6b62">MADINAH</text><line x1="170" y1="120" x2="170" y2="660" stroke="#1e2a44" stroke-width="4"/><text x="146" y="137" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">570</text><circle cx="170" cy="130" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="196" y="109" width="674" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="137" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Born in Makkah</text><text x="146" y="189" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">610</text><circle cx="170" cy="182" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="196" y="161" width="674" height="42" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="214" y="189" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First revelation in the Cave of Hira</text><text x="146" y="241" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">613</text><circle cx="170" cy="234" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="196" y="213" width="674" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="241" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Begins preaching publicly; persecution by the Quraysh</text><text x="146" y="293" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">619</text><circle cx="170" cy="286" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="196" y="265" width="674" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="293" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Year of Sorrow: deaths of Khadijah and Abu Talib</text><text x="146" y="345" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">622</text><circle cx="170" cy="338" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="196" y="317" width="674" height="42" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="214" y="345" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hijra to Madinah; Constitution of Madinah</text><text x="146" y="397" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">624</text><circle cx="170" cy="390" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="196" y="369" width="674" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="397" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Victory at the Battle of Badr</text><text x="146" y="449" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">625</text><circle cx="170" cy="442" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="196" y="421" width="674" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="449" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Setback at Uhud: archers leave their position</text><text x="146" y="501" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">627</text><circle cx="170" cy="494" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="196" y="473" width="674" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="501" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Successful defence at the Battle of the Trench</text><text x="146" y="553" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">628</text><circle cx="170" cy="546" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="196" y="525" width="674" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="553" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Treaty of Hudaybiyyah eases tensions</text><text x="146" y="605" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">630</text><circle cx="170" cy="598" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="196" y="577" width="674" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="214" y="605" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Largely peaceful Conquest of Makkah; general amnesty</text><text x="146" y="657" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">632</text><circle cx="170" cy="650" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="196" y="629" width="674" height="42" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="214" y="657" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Farewell Sermon, shortly before his death</text>
</svg>