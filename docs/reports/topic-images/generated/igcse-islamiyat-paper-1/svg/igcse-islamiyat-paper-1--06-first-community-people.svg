<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The people of the first community</text>

<rect x="30" y="110" width="410" height="188" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><rect x="30" y="110" width="410" height="52" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="145" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Wives</text><circle cx="58" cy="190" r="5" fill="#d4b02e"/><text x="72" y="196" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Khadijah: first wife and first believer</text><circle cx="58" cy="222" r="5" fill="#d4b02e"/><text x="72" y="228" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Aisha</text><rect x="460" y="110" width="410" height="188" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><rect x="460" y="110" width="410" height="52" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="145" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Descendants</text><circle cx="488" cy="190" r="5" fill="#d4b02e"/><text x="502" y="196" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Children and grandchildren</text><circle cx="488" cy="222" r="5" fill="#d4b02e"/><text x="502" y="228" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The line recognised among Shia Muslims</text><text x="502" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">as Imams</text><rect x="30" y="314" width="410" height="188" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="314" width="410" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="349" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Leading Companions</text><circle cx="58" cy="394" r="5" fill="#2e6b62"/><text x="72" y="400" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ten Blessed Companions: promised</text><text x="72" y="422" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Paradise</text><circle cx="58" cy="448" r="5" fill="#2e6b62"/><text x="72" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Scribes who recorded revelation</text><circle cx="58" cy="480" r="5" fill="#2e6b62"/><text x="72" y="486" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Other major figures of his ministry</text><rect x="460" y="314" width="410" height="188" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="460" y="314" width="410" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="349" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Four Rightly Guided Caliphs</text><circle cx="488" cy="394" r="5" fill="#2e6b62"/><text x="502" y="400" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Abu Bakr, Umar, Uthman and Ali</text><circle cx="488" cy="426" r="5" fill="#2e6b62"/><text x="502" y="432" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Studied here for their lives in his</text><text x="502" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lifetime; their rule is Paper 2</text><rect x="30" y="520" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="56" y="546" width="280" height="76" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="196" y="578" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Emigrants (Muhajirun)</text><text x="196" y="604" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">left Makkah for Madinah</text><rect x="584" y="546" width="280" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="704" y="578" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Helpers (Ansar)</text><text x="704" y="604" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Muslims of Madinah</text><path d="M342,584 L578,584" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M578,584 L342,584" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="450" y="572" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">formally paired</text><text x="450" y="652" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Met the migrants' material needs and became a model of brotherhood.</text>
</svg>