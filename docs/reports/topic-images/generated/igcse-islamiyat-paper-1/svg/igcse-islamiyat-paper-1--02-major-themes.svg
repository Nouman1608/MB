<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="470" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The major themes of the Qur'an</text>

<rect x="150" y="110" width="600" height="84" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><text x="450" y="146" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Tawhid: the absolute oneness of God</text><text x="450" y="176" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">the central theme, underlying every other teaching</text><path d="M450,196 L450,214 L163,214 L163,234" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="240" width="266" height="206" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="272.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Prophethood</text><text x="46" y="301.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Muhammad (pbuh) is the last</text><text x="46" y="324.38" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of a succession of prophets</text><text x="46" y="346.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">with essentially the same</text><text x="46" y="369.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">message; stories of earlier</text><text x="46" y="391.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">prophets serve as lessons</text><text x="46" y="414.14" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and warnings.</text><path d="M450,196 L450,214 L447,214 L447,234" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="314" y="240" width="266" height="206" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330" y="272.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement and</text><text x="330" y="298.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">afterlife</text><text x="330" y="327.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Every person is accountable</text><text x="330" y="350.38" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">for their deeds and will be</text><text x="330" y="372.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rewarded or punished, which</text><text x="330" y="395.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">gives the ethical teaching</text><text x="330" y="417.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">its urgency.</text><path d="M450,196 L450,214 L731,214 L731,234" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="598" y="240" width="266" height="206" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="614" y="272.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Guidance for conduct</text><text x="614" y="301.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Individual and social life:</text><text x="614" y="324.38" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">worship, family law, trade,</text><text x="614" y="346.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">justice and the treatment</text><text x="614" y="369.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of the poor.</text>
</svg>