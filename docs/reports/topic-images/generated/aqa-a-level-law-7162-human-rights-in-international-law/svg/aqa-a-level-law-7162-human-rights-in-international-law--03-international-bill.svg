<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 717" width="900" height="717" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="717" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The International Bill of Human Rights</text>

<rect x="30" y="100" width="270.6666666666667" height="197" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DRAFTED BY</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">UN Commission on</text><text x="50" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Human Rights</text><text x="50" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chaired by Eleanor Roosevelt;</text><text x="50" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with René Cassin, John</text><text x="50" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Humphrey, Peng Chun Chang,</text><text x="50" y="272.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Charles Malik</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="197" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADOPTED</text><text x="334.6666666666667" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Paris, 10 December 1948</text><text x="334.6666666666667" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">48 in favour, none against,</text><text x="334.6666666666667" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">eight abstentions</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="197" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="619.3333333333334" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LEGAL STATUS</text><text x="619.3333333333334" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A General Assembly</text><text x="619.3333333333334" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">resolution, not a treaty</text><text x="619.3333333333334" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not binding as a treaty, but</text><text x="619.3333333333334" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hugely influential</text><rect x="200" y="319" width="500" height="62" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="355.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">International Bill of Human Rights</text><line x1="390" y1="385" x2="165.33333333333334" y2="419" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="385" x2="450" y2="419" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="510" y1="385" x2="734.6666666666667" y2="419" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="425" width="270.6666666666667" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="457" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UDHR 1948</text><text x="50" y="483.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">30 Articles: civil, political,</text><text x="50" y="506.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">economic and social</text><text x="50" y="529.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">rights</text><rect x="314.6666666666667" y="425" width="270.6666666666667" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="468.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ICCPR 1966</text><text x="334.6666666666667" y="494.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Civil and Political Rights:</text><text x="334.6666666666667" y="517.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">binding treaty</text><rect x="599.3333333333334" y="425" width="270.6666666666667" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="457" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ICESCR 1966</text><text x="619.3333333333334" y="483.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economic, Social and</text><text x="619.3333333333334" y="506.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural Rights: binding</text><text x="619.3333333333334" y="529.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">treaty</text><rect x="30" y="576" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="610.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Enforcement</text><text x="50" y="639.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Covenants are monitored mainly by expert committees reviewing state reports: much weaker than a</text><text x="50" y="660.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">court with binding judgments.</text>
</svg>