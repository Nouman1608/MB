<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 791" width="900" height="791" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="791" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plan: how the war led to the Convention</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Five points in time order</text>
<rect x="30" y="124" width="840" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POINT 1</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Atrocities by states under their own laws</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Domestic law alone could not protect rights</text><line x1="450" y1="232" x2="450" y2="252" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="257" width="840" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="285" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POINT 2</text><text x="46" y="311.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nuremberg (1945–46)</text><text x="46" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Individual responsibility for crimes against humanity under international law</text><line x1="450" y1="365" x2="450" y2="385" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="390" width="840" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="418" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POINT 3</text><text x="46" y="444.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">UN Charter 1945 and UDHR 1948</text><text x="46" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Universal standards, but not binding and no enforcement machinery</text><line x1="450" y1="498" x2="450" y2="518" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="523" width="840" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="551" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POINT 4</text><text x="46" y="577.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Council of Europe 1949</text><text x="46" y="605.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Like-minded democracies able to agree a binding treaty</text><line x1="450" y1="631" x2="450" y2="651" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="656" width="840" height="103" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="684" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POINT 5</text><text x="46" y="710.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ECHR signed 1950, in force 1953</text><text x="46" y="738.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Enforceable rights with a Commission and Court; later strengthened by Protocol 11</text>
</svg>