<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Council of Europe is not the European Union</text>

<rect x="30" y="100" width="412" height="283" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COUNCIL OF EUROPE</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Treaty of London, 5 May 1949</text><text x="50" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seat: <tspan font-weight="700" fill="#1e2a44">Strasbourg</tspan></text><text x="50" y="216.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Democracy, rule of law, human rights; a</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safeguard against dictatorship, in the</text><text x="65.2" y="258.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">emerging Cold War</text><text x="50" y="287.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">European Convention on Human Rights;</text><text x="65.2" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">European Court of Human Rights</text><text x="50" y="337.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UK <tspan font-weight="700" fill="#1e2a44">remains</tspan> a member and party to the</text><text x="65.2" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Convention</text><rect x="458" y="100" width="412" height="283" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EUROPEAN UNION</text><text x="478" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A separate organisation</text><text x="478" y="187.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Court of Justice in <tspan font-weight="700" fill="#1e2a44">Luxembourg</tspan></text><text x="478" y="216.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Its own Charter of Fundamental Rights</text><text x="478" y="245.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UK <tspan font-weight="700" fill="#1e2a44">left</tspan> in 2020</text><text x="450" y="419" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">TEN FOUNDING STATES OF THE COUNCIL OF EUROPE</text><rect x="52.80800000000005" y="445" width="87.488" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="96.55200000000005" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Belgium</text><rect x="150.29600000000005" y="445" width="94.752" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="197.67200000000005" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Denmark</text><rect x="255.04800000000006" y="445" width="78.112" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="294.10400000000004" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">France</text><rect x="343.1600000000001" y="445" width="78.22399999999999" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="382.27200000000005" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Ireland</text><rect x="431.38400000000007" y="445" width="57.616" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="460.19200000000006" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Italy</text><rect x="499.00000000000006" y="445" width="122.912" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="560.456" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Luxembourg</text><rect x="631.912" y="445" width="120.24" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="692.032" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Netherlands</text><rect x="762.152" y="445" width="85.03999999999999" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="804.672" y="465.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Norway</text><rect x="326.552" y="485" width="87.2" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="370.15200000000004" y="505.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sweden</text><rect x="423.752" y="485" width="149.696" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="498.6" y="505.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">United Kingdom</text>
</svg>