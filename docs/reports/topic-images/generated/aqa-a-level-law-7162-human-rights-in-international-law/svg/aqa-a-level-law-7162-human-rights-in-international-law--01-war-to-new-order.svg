<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From the Second World War to a new order</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Before 1939, a state’s treatment of its own citizens was largely its own affair</text>
<rect x="30" y="124" width="270.6666666666667" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ATROCITY</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Killings by states under</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">their own laws</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Domestic legality was no</text><text x="50" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">guarantee of justice</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WAR AIMS (1941)</text><text x="334.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Roosevelt’s “four</text><text x="334.6666666666667" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">freedoms”</text><text x="334.6666666666667" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Speech and expression,</text><text x="334.6666666666667" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">worship, from want, from fear</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NUREMBERG (1945–46)</text><text x="619.3333333333334" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Crimes against humanity</text><text x="619.3333333333334" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Individuals responsible under</text><text x="619.3333333333334" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">international law; orders or</text><text x="619.3333333333334" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">domestic law no complete</text><text x="619.3333333333334" y="273.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">defence</text><line x1="450" y1="320" x2="450" y2="356" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="470" y="346" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">institutions to keep the peace and prevent a repeat</text><rect x="30" y="382" width="412" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="236" y="425" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">GLOBAL</text><text x="236" y="452.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">United Nations</text><text x="236" y="482.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Charter 1945; Universal Declaration 1948</text><rect x="458" y="382" width="412" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="414" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">REGIONAL</text><text x="664" y="441.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Council of Europe</text><text x="664" y="471.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Treaty of London 1949; European Convention</text><text x="664" y="493.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">1950, in force 1953</text>
</svg>