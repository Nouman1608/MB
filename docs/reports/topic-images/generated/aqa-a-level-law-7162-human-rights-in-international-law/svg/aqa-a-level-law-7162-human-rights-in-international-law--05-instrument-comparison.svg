<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How strongly is each instrument enforced?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Bar length shows the strength of enforcement</text>
<rect x="30" y="124" width="260" height="24" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="156" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="190.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">UDHR 1948</text><text x="50" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Body:</tspan> UN General Assembly. <tspan font-weight="700" fill="#1e2a44">Form:</tspan> Resolution, not a treaty.</text><text x="50" y="242.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Enforcement:</tspan> None directly</text><rect x="30" y="287" width="520" height="24" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="319" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="353.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">ICCPR and ICESCR 1966</text><text x="50" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Body:</tspan> United Nations. <tspan font-weight="700" fill="#1e2a44">Form:</tspan> Treaties.</text><text x="50" y="405.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Enforcement:</tspan> Reporting to expert committees</text><rect x="30" y="450" width="840" height="24" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="482" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="516.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">ECHR (in force 1953)</text><text x="50" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Body:</tspan> Council of Europe. <tspan font-weight="700" fill="#1e2a44">Form:</tspan> Treaty.</text><text x="50" y="568.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Enforcement:</tspan> Court with binding judgments, supervised by the Committee of Ministers</text>
</svg>