<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 797" width="900" height="797" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="797" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key dates in international human rights</text>

<rect x="30" y="100" width="132.465" height="29" rx="14.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="96.2325" y="119.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">United Nations</text><rect x="172.465" y="100" width="154.35" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="249.64" y="119.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Council of Europe</text><line x1="200" y1="161" x2="200" y2="755" stroke="#1e2a44" stroke-width="4"/><circle cx="200" cy="171" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="177" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1941</text><rect x="222" y="151" width="648" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="238" y="178" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Roosevelt’s “four freedoms”</text><circle cx="200" cy="223" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="229" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1945</text><rect x="222" y="203" width="648" height="42" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="238" y="230" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">UN Charter signed (June); UN exists (October)</text><circle cx="200" cy="275" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="281" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1945–46</text><rect x="222" y="255" width="648" height="42" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="238" y="282" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Nuremberg trials</text><circle cx="200" cy="327" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="333" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">10 Dec 1948</text><rect x="222" y="307" width="648" height="42" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="238" y="334" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Universal Declaration adopted in Paris</text><circle cx="200" cy="379" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="385" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">5 May 1949</text><rect x="222" y="359" width="648" height="42" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="238" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Council of Europe: Treaty of London</text><circle cx="200" cy="431" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="437" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">4 Nov 1950</text><rect x="222" y="411" width="648" height="42" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="238" y="438" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">European Convention signed in Rome</text><circle cx="200" cy="483" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="489" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Mar 1951</text><rect x="222" y="463" width="648" height="42" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="238" y="490" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">UK first state to ratify</text><circle cx="200" cy="535" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="541" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">3 Sep 1953</text><rect x="222" y="515" width="648" height="42" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="238" y="542" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Convention in force after ten ratifications</text><circle cx="200" cy="587" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="593" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1954 / 1959</text><rect x="222" y="567" width="648" height="42" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="238" y="594" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Commission set up / Court set up in Strasbourg</text><circle cx="200" cy="639" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="645" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1966</text><rect x="222" y="619" width="648" height="42" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="238" y="646" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Two Covenants; UK accepts individual petition and the Court</text><circle cx="200" cy="691" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="697" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1998</text><rect x="222" y="671" width="648" height="42" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="238" y="698" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Protocol 11: single full-time Court; petition compulsory</text><circle cx="200" cy="743" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="749" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">2022</text><rect x="222" y="723" width="648" height="42" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="238" y="750" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Russia expelled from the Council of Europe</text>
</svg>