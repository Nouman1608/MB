<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 523" width="900" height="523" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="523" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four traps in crime figures</text>

<rect x="30" y="104" width="410" height="89" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recorded crime is not all crime</text><text x="50" y="168.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Many crimes are never reported.</text><text x="660" y="134" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A rise in recorded crime can mean…</text><rect x="470" y="154" width="125" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="532" y="178" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">more crime</text><rect x="603" y="154" width="125" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="178" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">more</text><text x="665" y="199" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">reporting</text><rect x="736" y="154" width="125" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="798" y="178" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">new</text><text x="798" y="199" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">recording</text><text x="798" y="220" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">rules</text><rect x="30" y="232" width="268" height="153" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="266.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fear of crime is not</text><text x="50" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">crime</text><text x="50" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A survey of how unsafe</text><text x="50" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people feel is evidence</text><text x="50" y="360.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about feelings.</text><rect x="316" y="232" width="268" height="153" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="266.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Correlation is not</text><text x="336" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">causation</text><text x="336" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Crime falling after a</text><text x="336" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">policy may have another</text><text x="336" y="360.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cause.</text><rect x="602" y="232" width="268" height="153" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="622" y="266.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Self-selection</text><text x="622" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Programmes may report only</text><text x="622" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people who chose to join</text><text x="622" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and completed.</text><rect x="30" y="403" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="439" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Component 1, Question 2</text><text x="50" y="468.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Suggest a test: name the method, the sample, the comparison and the measure.</text>
</svg>