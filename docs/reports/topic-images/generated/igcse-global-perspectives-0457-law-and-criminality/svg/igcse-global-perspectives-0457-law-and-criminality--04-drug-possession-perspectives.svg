<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 567" width="900" height="567" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="567" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Drug possession: crime or health problem?</text>

<rect x="30" y="104" width="408" height="177" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PORTUGAL, JULY 2001 (LAW 30/2000)</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Personal possession and use</text><text x="50" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">decriminalised</text><text x="50" y="214.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Small amounts dealt with by panels that can</text><text x="50" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">refer people to treatment or set penalties.</text><text x="50" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Trafficking stayed a crime.</text><rect x="462" y="104" width="408" height="177" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="482" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hard to say which change caused</text><text x="482" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">later trends</text><text x="482" y="214.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Other policies changed at the same time.</text><line x1="310" y1="361" x2="371.8" y2="398.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="463" x2="371.8" y2="433.75" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="361" x2="528.2" y2="398.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="487" x2="528.2" y2="442.15" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="418" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="413.75" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Treat drug use</text><text x="450" y="436.25" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">as a crime?</text><g transform="translate(0,24)"><rect x="30" y="299" width="280" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="328" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POLICE OFFICER</text><text x="46" y="353.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Arrests deter use</text><rect x="30" y="389" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="418" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FINANCE DEPARTMENT</text><text x="46" y="443.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Focuses on the cost of</text><text x="46" y="467.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">prisons</text></g><g transform="translate(0,0)"><rect x="590" y="299" width="280" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="328" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DOCTOR</text><text x="606" y="353.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A criminal record stops</text><text x="606" y="377.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">people seeking</text><text x="606" y="401.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">treatment</text><rect x="590" y="437" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="466" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BEREAVED PARENT</text><text x="606" y="491.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Could hold either view,</text><text x="606" y="515.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">depending on experience</text></g>
</svg>