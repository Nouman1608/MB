<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Shoplifting in a town centre: two actions</text>

<text x="30" y="124" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Time</text><line x1="90" y1="118" x2="870" y2="118" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="90" y="144" width="260" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="220" y="179" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Patrols: quick reassurance</text><rect x="250" y="214" width="620" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="560" y="249" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Mentoring: set up, then lasting reduction</text><rect x="30" y="292" width="408" height="158" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="325" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MORE POLICE PATROLS</text><text x="50" y="350.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Deters while officers are present</text><text x="50" y="378.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does not address why people steal</text><text x="50" y="404.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Crime may move to times or places without</text><text x="65.2" y="425.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">patrols</text><rect x="462" y="292" width="408" height="158" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="325" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MENTORING SCHEME</text><text x="482" y="350.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Targets a cause</text><text x="482" y="378.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">For young people already in trouble</text><text x="482" y="404.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Results take longer; costs more per person</text><rect x="30" y="468" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="504" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="533.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use patrols briefly while the mentoring scheme is set up: quick reassurance now, more</text><text x="50" y="555.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">likely to reduce crime over time.</text>
</svg>