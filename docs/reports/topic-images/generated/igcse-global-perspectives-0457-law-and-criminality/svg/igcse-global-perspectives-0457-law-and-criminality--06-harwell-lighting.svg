<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Did the lights cut crime?</text>

<rect x="30" y="114" width="840" height="88" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="147" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FICTIONAL COUNCIL OF HARWELL</text><text x="50" y="174.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">“New street lighting cut crime by 25%.”</text><line x1="60" y1="410" x2="840" y2="410" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="210.66666666666666" width="110" height="199.33333333333334" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="200.66666666666666" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">52</text><text x="155" y="434" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">before</text><rect x="240" y="260.5" width="110" height="149.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="295" y="250.5" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">39</text><text x="295" y="434" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after</text><text x="225" y="464" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Lit streets</text><text x="225" y="488" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">recorded thefts: −25%</text><rect x="480" y="226" width="110" height="184" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="535" y="216" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">48</text><text x="535" y="434" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">before</text><rect x="620" y="264.33333333333337" width="110" height="145.66666666666663" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="254.33333333333337" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">38</text><text x="675" y="434" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after</text><text x="605" y="464" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Nearby area, no new lights</text><text x="605" y="488" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">recorded thefts: about −21%</text><text x="450" y="224" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">recorded thefts in one year</text><rect x="30" y="510" width="408" height="177" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="543" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ANALYSIS</text><text x="50" y="568.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The arithmetic is right, the cause</text><text x="50" y="592.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">is not shown</text><text x="50" y="620.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Thefts fell almost as much without new</text><text x="50" y="641.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lights, so most of the fall may have</text><text x="50" y="662.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">happened anyway.</text><rect x="462" y="510" width="408" height="177" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="543" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BETTER TEST</text><text x="482" y="568.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Several lit and unlit streets, two</text><text x="482" y="592.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">years before and after</text><text x="482" y="620.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Plus a residents’ survey on crimes they did</text><text x="482" y="641.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not report.</text>
</svg>