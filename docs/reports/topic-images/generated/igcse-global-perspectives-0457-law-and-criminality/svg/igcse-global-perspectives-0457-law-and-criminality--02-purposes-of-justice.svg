<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What is punishment for? Four ideas</text>

<rect x="30" y="104" width="410" height="155" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="141.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Deterrence</text><text x="50" y="172.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fear of the consequences stops people</text><text x="50" y="194.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">offending.</text><rect x="460" y="104" width="410" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="141.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Retribution</text><text x="480" y="172.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Punishment as a deserved response to</text><text x="480" y="194.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">wrongdoing.</text><rect x="30" y="279" width="410" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="316.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Rehabilitation</text><text x="50" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Helping an offender change so they do not</text><text x="50" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">offend again.</text><rect x="460" y="279" width="410" height="155" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="316.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Restorative justice</text><text x="480" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Offender meets victim or community,</text><text x="480" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">understands the harm and repairs it.</text><rect x="30" y="452" width="840" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="485" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HOW IT IS JUDGED</text><text x="50" y="511.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reoffending (recidivism)</text><text x="50" y="540.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Committing another crime after being punished for an earlier one. Some judge a policy by</text><text x="50" y="562.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">whether it reduces harm; others see punishment as deserved in itself.</text><rect x="30" y="605" width="408" height="135" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="638" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DECRIMINALISATION</text><text x="50" y="663.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Still against the rules, no longer</text><text x="50" y="687.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">a criminal offence</text><text x="50" y="715.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May still bring a fine or other penalty.</text><rect x="462" y="605" width="408" height="135" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="638" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEGALISATION</text><text x="482" y="663.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The act becomes lawful</text>
</svg>