<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="450" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From a minor offence to more crime</text>

<rect x="30" y="104" width="180" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="131" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CAUSE</text><text x="44" y="154.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">A young person</text><text x="44" y="175.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">gets a criminal</text><text x="44" y="196.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">record for a</text><text x="44" y="217.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">minor offence</text><line x1="216" y1="170" x2="244" y2="170" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="104" width="180" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="141.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSEQUENCE</text><text x="264" y="165.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Employers may be</text><text x="264" y="186.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">less willing to</text><text x="264" y="207.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">hire them</text><line x1="436" y1="170" x2="464" y2="170" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="104" width="180" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="131" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FURTHER</text><text x="484" y="154.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Without work or</text><text x="484" y="175.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">income, the risk</text><text x="484" y="196.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">of reoffending</text><text x="484" y="217.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">may rise</text><line x1="656" y1="170" x2="684" y2="170" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="104" width="180" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="704" y="131" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">KNOCK-ON</text><text x="704" y="154.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The community</text><text x="704" y="175.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">pays again: more</text><text x="704" y="196.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">crime, more</text><text x="704" y="217.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">court costs</text><rect x="30" y="254" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="287.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Causes of crime are contested: present them as possible factors supported by evidence, not</text><text x="50" y="309.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">certainties.</text><rect x="188.05000000000007" y="352" width="102.42499999999998" height="42" rx="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="239.26250000000005" y="379.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">because</text><rect x="302.475" y="352" width="53.55" height="42" rx="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="329.25" y="379.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">so</text><rect x="368.02500000000003" y="352" width="190.39999999999998" height="42" rx="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="463.225" y="379.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">which means that</text><rect x="570.425" y="352" width="141.52499999999998" height="42" rx="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="641.1875" y="379.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">as a result</text><text x="450" y="416" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Each linking word is reasoning an examiner can credit. Avoid stereotyping whole groups.</text>
</svg>