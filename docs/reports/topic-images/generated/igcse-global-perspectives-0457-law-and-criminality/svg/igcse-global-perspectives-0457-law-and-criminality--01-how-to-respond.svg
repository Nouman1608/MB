<rect width="900" height="684" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Crime is not the issue; the response is</text>

<rect x="30" y="104" width="840" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">ALMOST EVERYONE AGREES</text><text x="50" y="164.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Crime is bad.</text><text x="50" y="195.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No disagreement, so not an issue.</text><line x1="450" y1="226" x2="450" y2="260" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="278" width="268" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="313.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What should be</text><text x="164" y="338.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">illegal?</text><rect x="316" y="278" width="268" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="313.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">How should offenders</text><text x="450" y="338.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">be treated?</text><rect x="602" y="278" width="268" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="313.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who should pay for</text><text x="736" y="338.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">prevention?</text><rect x="30" y="382" width="840" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="415" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GLOBAL</text><text x="50" y="440.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Should drug use be treated as a crime or a health problem?</text><rect x="30" y="476" width="840" height="84" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="509" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL</text><text x="50" y="534.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What should the minimum age of criminal responsibility be?</text><rect x="30" y="570" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="603" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LOCAL</text><text x="50" y="628.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Should a council fund youth clubs or extra patrols?</text>
</svg>