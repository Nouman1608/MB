<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Becker: someone has to make the rule</text>

<rect x="30" y="118" width="246.66666666666666" height="108" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="153.33333333333331" y="150.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Moral entrepreneurs</text><text x="153.33333333333331" y="180.3" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Individuals and groups</text><text x="153.33333333333331" y="202.3" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">campaign for a new rule</text><line x1="280.66666666666663" y1="172" x2="322.66666666666663" y2="172" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="118" width="246.66666666666666" height="108" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="150.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A rule is created</text><text x="449.99999999999994" y="180.3" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Someone has to make it</text><text x="449.99999999999994" y="202.3" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">before anyone can break it</text><line x1="577.3333333333333" y1="172" x2="619.3333333333333" y2="172" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="118" width="246.66666666666666" height="108" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="746.6666666666666" y="150.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rule-breakers labelled</text><text x="746.6666666666666" y="180.3" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Agents of social control</text><text x="746.6666666666666" y="202.3" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">apply the label</text><rect x="30" y="256" width="840" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,306 L31.25,270.25 Q31.25,257.25 44.25,257.25 L855.75,257.25 Q868.75,257.25 868.75,270.25 L868.75,306 Z" fill="#ffffff"/><line x1="31.25" y1="306" x2="868.75" y2="306" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="286.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Criticisms of labelling</text><circle cx="49" cy="332.23" r="4.5" fill="#2e6b62"/><text x="62" y="337.675" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Does not explain the <tspan font-weight="700">first</tspan> deviant act</text><circle cx="49" cy="362.23" r="4.5" fill="#2e6b62"/><text x="62" y="367.675" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Can seem to treat offenders as victims of labels</text><circle cx="49" cy="392.23" r="4.5" fill="#2e6b62"/><text x="62" y="397.675" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Some people <tspan font-weight="700">resist</tspan> labels rather than accept them</text>
