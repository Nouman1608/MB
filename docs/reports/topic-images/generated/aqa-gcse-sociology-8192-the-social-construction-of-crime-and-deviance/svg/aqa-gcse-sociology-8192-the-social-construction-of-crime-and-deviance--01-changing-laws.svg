<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 709" width="900" height="709" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="709" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Crime changes over time</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Examples from England and Wales</text>
<line x1="40" y1="330" x2="868" y2="330" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="182.30769230769232" cy="330" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="182.30769230769232" y1="321" x2="170" y2="262" stroke="#4a5568" stroke-width="2"/><rect x="45" y="112" width="250" height="150" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="61" y="142" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">1967</text><text x="61" y="166" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Criminalised or tightened</text><text x="61" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Breathalyser and fixed</text><text x="61" y="217" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drink-drive limit</text><circle cx="182.30769230769232" cy="330" r="9" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><line x1="182.30769230769232" y1="339" x2="260" y2="382" stroke="#4a5568" stroke-width="2"/><rect x="135" y="382" width="250" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="151" y="412" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">1967</text><text x="151" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Decriminalised</text><text x="151" y="466" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sex between men in private</text><text x="151" y="487" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">partly decriminalised</text><circle cx="416.15384615384613" cy="330" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="416.15384615384613" y1="321" x2="450" y2="262" stroke="#4a5568" stroke-width="2"/><rect x="325" y="112" width="250" height="150" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="341" y="142" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">1983</text><text x="341" y="166" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Criminalised or tightened</text><text x="341" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not wearing a front seat</text><text x="341" y="217" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">belt becomes an offence</text><circle cx="533.0769230769231" cy="330" r="9" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2"/><line x1="533.0769230769231" y1="339" x2="620" y2="382" stroke="#4a5568" stroke-width="2"/><rect x="495" y="382" width="250" height="150" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="511" y="412" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">1991</text><text x="511" y="436" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Redefined</text><text x="511" y="466" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">House of Lords: a husband</text><text x="511" y="487" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can be guilty of raping his</text><text x="511" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wife</text><circle cx="766.9230769230769" cy="330" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="766.9230769230769" y1="321" x2="730" y2="262" stroke="#4a5568" stroke-width="2"/><rect x="605" y="112" width="250" height="150" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="621" y="142" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">2007</text><text x="621" y="166" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Criminalised or tightened</text><text x="621" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Smoking banned in enclosed</text><text x="621" y="217" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public places</text><text x="80" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1960</text><text x="372.3076923076923" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1980</text><text x="664.6153846153846" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2000</text><rect x="30" y="552" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="588" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The point</text><text x="56" y="617" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each change shows that a new definition, not a new kind of act, created or removed the crime.</text><text x="56" y="639" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Definitions also vary between societies (drinking ages, weapons, drugs) and by situation</text><text x="56" y="661" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(killing in peace or war).</text>
</svg>