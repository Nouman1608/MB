<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 957" width="900" height="957" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="957" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Merton: strain, anomie and five responses</text>

<rect x="30" y="108" width="840" height="84" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="140" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Value consensus: everyone shares the <tspan font-weight="700">goal of success</tspan>. But class position means unequal access</text><text x="450" y="162" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">to <tspan font-weight="700">legitimate means</tspan>.</text><line x1="450" y1="196" x2="450" y2="222" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="130" y="226" width="640" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="256" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">American society stressed success more than the means</text><text x="450" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">rules abandoned: ANOMIE, “anything goes”</text><text x="30" y="330" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Response</text><text x="280" y="330" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Goals</text><text x="380" y="330" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Means</text><text x="436" y="330" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Most likely among</text><rect x="30" y="344" width="196" height="62" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="128" y="382" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conformity</text><circle cx="280" cy="375" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M273,375 l5,6 l9,-11" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="380" cy="375" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M373,375 l5,6 l9,-11" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="436" y="344" width="434" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="369.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Success by accepted means: qualifications, well-paid</text><text x="450" y="389.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">work</text><rect x="30" y="418" width="196" height="62" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="128" y="456" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Innovation</text><circle cx="280" cy="449" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M273,449 l5,6 l9,-11" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="380" cy="449" r="15" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><path d="M374,443 l12,12 M386,443 l-12,12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="436" y="418" width="434" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="443.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Lower levels of society, less likely to gain</text><text x="450" y="463.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">qualifications: usually crime</text><rect x="30" y="492" width="196" height="62" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="128" y="530" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ritualism</text><circle cx="280" cy="523" r="15" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><path d="M274,517 l12,12 M286,517 l-12,12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="380" cy="523" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M373,523 l5,6 l9,-11" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="436" y="492" width="434" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="517.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Middle class in low-status “respectable” jobs;</text><text x="450" y="537.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">enthusiasm for petty bureaucracy</text><rect x="30" y="566" width="196" height="62" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="128" y="604" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Retreatism</text><circle cx="280" cy="597" r="15" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><path d="M274,591 l12,12 M286,591 l-12,12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="380" cy="597" r="15" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><path d="M374,591 l12,12 M386,591 l-12,12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="436" y="566" width="434" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="591.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Any class: “drop out”, e.g. vagrants and drug</text><text x="450" y="611.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">addicts</text><rect x="30" y="640" width="196" height="62" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="128" y="678" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rebellion</text><circle cx="280" cy="671" r="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="280" y="677" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">↻</text><circle cx="380" cy="671" r="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="380" y="677" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">↻</text><rect x="436" y="640" width="434" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="665.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">A “rising” class wanting a new society; may attempt</text><text x="450" y="685.725" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">revolution</text><text x="30" y="738" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">✓ accepts   ✗ rejects   ↻ rejects and replaces</text><rect x="30" y="754" width="840" height="179" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="790" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criticisms</text><circle cx="61" cy="813.39" r="4.5" fill="#8a6d0d"/><text x="74" y="819" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ignores power: who makes laws and who benefits</text><circle cx="61" cy="843.39" r="4.5" fill="#8a6d0d"/><text x="74" y="849" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Assumes a value consensus exists</text><circle cx="61" cy="873.39" r="4.5" fill="#8a6d0d"/><text x="74" y="879" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Deterministic: why do only some people facing anomie turn to crime?</text><circle cx="61" cy="903.39" r="4.5" fill="#8a6d0d"/><text x="74" y="909" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Exaggerates working-class crime; underestimates white collar crime</text>
</svg>