<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five explanations, and who owns them</text>

<text x="30" y="112" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Explanation</text><text x="272" y="112" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Core idea</text><text x="870" y="112" font-size="16" font-weight="700" fill="#4a5568" text-anchor="end">Linked to</text><rect x="30" y="126" width="226" height="70" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="143" y="166.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Anomie</text><rect x="268" y="126" width="410" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="155.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usual rules break down in the pursuit of</text><text x="284" y="176.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">success</text><line x1="682" y1="161" x2="702" y2="161" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="706" y="126" width="164" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="788" y="155.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Merton</text><text x="788" y="176.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(functionalist)</text><rect x="30" y="210" width="226" height="70" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="143" y="250.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Structural theories</text><rect x="268" y="210" width="410" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="239.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crime comes from how society is organised:</text><text x="284" y="260.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unequal opportunity, class inequality</text><line x1="682" y1="245" x2="702" y2="245" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="706" y="210" width="164" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="788" y="249.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Merton; Marxists</text><rect x="30" y="294" width="226" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="143" y="334.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Subcultural theories</text><rect x="268" y="294" width="410" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="323.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Groups with values that differ from the</text><text x="284" y="344.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mainstream</text><line x1="682" y1="329" x2="702" y2="329" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="706" y="294" width="164" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="788" y="323.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Albert Cohen</text><text x="788" y="344.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(3.5.3)</text><rect x="30" y="378" width="226" height="70" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="143" y="418.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Labelling</text><rect x="268" y="378" width="410" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="417.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An act becomes deviant when others label it so</text><line x1="682" y1="413" x2="702" y2="413" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="706" y="378" width="164" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="788" y="417.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Becker</text><rect x="30" y="462" width="226" height="70" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="143" y="490.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactionist</text><text x="143" y="514.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">theory</text><rect x="268" y="462" width="410" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="491.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deviance created through interaction between</text><text x="284" y="512.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offenders and those who react</text><line x1="682" y1="497" x2="702" y2="497" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="706" y="462" width="164" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="788" y="501.7" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Becker</text><rect x="30" y="552" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="588" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common mistakes</text><circle cx="61" cy="611.39" r="4.5" fill="#8a6d0d"/><text x="74" y="617" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Merton is a functionalist who assumes value consensus, not a Marxist</text><circle cx="61" cy="641.39" r="4.5" fill="#8a6d0d"/><text x="74" y="647" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Do not confuse Becker’s labelling with Albert Cohen’s subcultures</text>
</svg>