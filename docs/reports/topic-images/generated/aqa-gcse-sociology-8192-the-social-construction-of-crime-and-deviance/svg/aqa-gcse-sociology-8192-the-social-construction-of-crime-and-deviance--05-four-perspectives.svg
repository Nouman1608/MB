<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who defines crime, and why?</text>

<rect x="30" y="104" width="412" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist</text><circle cx="51" cy="181.92" r="4.5" fill="#2e6b62"/><text x="64" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rules reflect a shared value consensus</text><circle cx="51" cy="210.92" r="4.5" fill="#2e6b62"/><text x="64" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Durkheim:</tspan> some crime is normal and useful:</text><text x="64" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">punishing it marks the boundaries</text><circle cx="51" cy="260.92" r="4.5" fill="#2e6b62"/><text x="64" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Merton:</tspan> crime from strain</text><rect x="458" y="104" width="412" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><circle cx="479" cy="181.92" r="4.5" fill="#2e6b62"/><text x="492" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Laws serve the ruling class, e.g. protecting</text><text x="492" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">private property</text><circle cx="479" cy="231.92" r="4.5" fill="#2e6b62"/><text x="492" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Enforced more harshly against the working</text><text x="492" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">class</text><circle cx="479" cy="281.92" r="4.5" fill="#2e6b62"/><text x="492" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Corporate crime less often defined or</text><text x="492" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prosecuted as crime</text><rect x="30" y="348" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,398 L31.25,362.25 Q31.25,349.25 44.25,349.25 L427.75,349.25 Q440.75,349.25 440.75,362.25 L440.75,398 Z" fill="#f2e7b8"/><line x1="31.25" y1="398" x2="440.75" y2="398" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="379" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><circle cx="51" cy="425.92" r="4.5" fill="#2e6b62"/><text x="64" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Definitions of crime have reflected men’s</text><text x="64" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">power</text><circle cx="51" cy="475.92" r="4.5" fill="#2e6b62"/><text x="64" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The 1991 ruling on rape in marriage shows how</text><text x="64" y="502.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">long some harms to women were not crimes</text><rect x="458" y="348" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,398 L459.25,362.25 Q459.25,349.25 472.25,349.25 L855.75,349.25 Q868.75,349.25 868.75,362.25 L868.75,398 Z" fill="#d4b02e"/><line x1="459.25" y1="398" x2="868.75" y2="398" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="379" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactionist</text><circle cx="479" cy="425.92" r="4.5" fill="#2e6b62"/><text x="492" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deviance is created by the <tspan font-weight="700">reaction</tspan> to an</text><text x="492" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">act, not the act itself (Becker)</text>
</svg>