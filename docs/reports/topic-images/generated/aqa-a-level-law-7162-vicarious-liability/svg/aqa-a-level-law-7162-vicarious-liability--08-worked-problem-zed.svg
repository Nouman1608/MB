<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 493" width="900" height="493" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="493" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked problem: Zed the courier</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Called self-employed; FastBox forbids passengers; he crashes</text>
<rect x="30" y="124" width="840" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 1: RELATIONSHIP</text><text x="48" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Likely employee or akin to employment</text><text x="48" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Label not decisive (<tspan font-style="italic">Ferguson</tspan>). Uniform, jobs controlled through the app, work integral to FastBox, no</text><text x="48" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">other clients (<tspan font-style="italic">Ready</tspan> <tspan font-style="italic">Mixed</tspan>; <tspan font-style="italic">Cox</tspan>). Unlike <tspan font-style="italic">Barclays</tspan>, Zed is not running his own business with many clients.</text><text x="450" y="298" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">STAGE 2: DEAL WITH EACH CLAIMANT SEPARATELY</text><rect x="30" y="312" width="412" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="342" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LU, A PEDESTRIAN</text><text x="48" y="368.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">FastBox liable</text><text x="48" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Driving to deliver parcels: an authorised act done</text><text x="48" y="417.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">carelessly (<tspan font-style="italic">Century</tspan> <tspan font-style="italic">Insurance</tspan>)</text><rect x="458" y="312" width="412" height="149" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="476" y="342" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ZED’S FRIEND, A PASSENGER</text><text x="476" y="368.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">FastBox probably not liable</text><text x="476" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unauthorised passenger not benefiting the</text><text x="476" y="417.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">business (<tspan font-style="italic">Twine</tspan>; contrast <tspan font-style="italic">Rose</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Plenty</tspan>). Friend</text><text x="476" y="438.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sues Zed personally.</text>
</svg>