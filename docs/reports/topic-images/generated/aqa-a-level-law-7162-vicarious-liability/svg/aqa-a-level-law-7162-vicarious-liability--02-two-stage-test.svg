<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The two-stage test</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Various Claimants v Barclays Bank (2020)</text>
<rect x="30" y="124" width="241.29032258064518" height="125" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="150.6451612903226" y="165.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">STAGE 1: RELATIONSHIP</text><text x="150.6451612903226" y="191.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Employee, or akin to</text><text x="150.6451612903226" y="214.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">employment?</text><line x1="277.2903225806452" y1="186.5" x2="311.2903225806452" y2="186.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="317.2903225806452" y="124" width="313.6774193548387" height="125" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474.1290322580645" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">STAGE 2: CONNECTION</text><text x="474.1290322580645" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">In the course of employment:</text><text x="474.1290322580645" y="203.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">closely connected with what</text><text x="474.1290322580645" y="226.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">they were authorised to do?</text><line x1="636.9677419354839" y1="186.5" x2="670.9677419354839" y2="186.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="676.9677419354839" y="124" width="193.03225806451616" height="125" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="773.483870967742" y="179.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Employer</text><text x="773.483870967742" y="202.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">vicariously liable</text><line x1="150.6451612903226" y1="253" x2="150.6451612903226" y2="285" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="30" y="289" width="241.29032258064518" height="60" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="150.6451612903226" y="313.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">No: e.g. independent</text><text x="150.6451612903226" y="333.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">contractor</text><line x1="474.1290322580645" y1="253" x2="474.1290322580645" y2="285" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="317.2903225806452" y="289" width="313.6774193548387" height="40" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="474.1290322580645" y="313.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">No: e.g. a frolic or personal vendetta</text><text x="162.6451612903226" y="275" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">no</text><text x="486.1290322580645" y="275" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">no</text>
