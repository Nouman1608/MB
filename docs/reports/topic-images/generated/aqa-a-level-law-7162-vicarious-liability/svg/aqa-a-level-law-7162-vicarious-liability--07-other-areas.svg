<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 529" width="900" height="529" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="529" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Other areas of vicarious liability</text>

<rect x="30" y="100" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LENT EMPLOYEES</text><rect x="60" y="160" width="230" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="175" y="188" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">General employer</text><text x="175" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">usually remains liable</text><circle cx="450" cy="166" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M450,178 L450,210 M435,190 L465,190 M450,210 L438,232 M450,210 L462,232" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">crane driver</text><rect x="610" y="160" width="230" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="725" y="188" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hirer</text><text x="725" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">borrows him</text><line x1="294" y1="192" x2="420" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="480" y1="192" x2="606" y2="192" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="7 6"/><text x="450" y="286" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Mersey</tspan> <tspan font-style="italic">Docks</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Coggins</tspan> <tspan font-style="italic">&amp;</tspan> <tspan font-style="italic">Griffith</tspan> (1947): the board kept the power to control how he operated the crane.</text><text x="450" y="306" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Viasystems</tspan> (2005): two employers can both be liable.</text><rect x="30" y="348" width="412" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="378" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDEPENDENT CONTRACTORS</text><text x="48" y="404.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Generally no vicarious liability</text><text x="48" y="432.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Barclays</tspan> <tspan font-style="italic">Bank</tspan> (2020). But a <tspan font-weight="700" fill="#1e2a44">non-delegable</tspan> <tspan font-weight="700" fill="#1e2a44">duty</tspan></text><text x="48" y="453.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is a personal duty: <tspan font-style="italic">Woodland</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Swimming</tspan></text><text x="48" y="474.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Teachers</tspan> <tspan font-style="italic">Association</tspan> (2013)</text><rect x="458" y="348" width="412" height="149" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="378" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EMPLOYER’S INDEMNITY</text><text x="476" y="404.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Recover from the employee</text><text x="476" y="432.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Lister</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Romford</tspan> <tspan font-style="italic">Ice</tspan> (1957): possible in principle;</text><text x="476" y="453.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">insurers rarely pursue it</text>
</svg>