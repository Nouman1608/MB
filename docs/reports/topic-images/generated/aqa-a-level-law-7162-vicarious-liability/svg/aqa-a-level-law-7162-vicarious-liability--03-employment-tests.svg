<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="568" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing employment status</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">No single test is decisive: courts look at the whole relationship</text>
<rect x="30" y="124" width="840" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="70" y1="184" x2="830" y2="184" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="150" cy="184" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="150" y="164" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1880</text><rect x="58" y="210" width="184" height="168" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="150" y="240" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Control</text><text x="150" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Controls what is</text><text x="150" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">done and how?</text><text x="150" y="344" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle"><tspan font-style="italic">Yewens</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Noakes</tspan></text><circle cx="350" cy="184" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="350" y="164" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1952</text><rect x="258" y="210" width="184" height="168" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="350" y="240" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Integration</text><text x="350" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Integral part of the</text><text x="350" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">business, or</text><text x="350" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">accessory?</text><text x="350" y="344" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle"><tspan font-style="italic">Stevenson</tspan> <tspan font-style="italic">Jordan</tspan>,</text><text x="350" y="363" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">Denning LJ</text><circle cx="550" cy="184" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="550" y="164" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1968</text><rect x="458" y="210" width="184" height="168" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="550" y="240" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic reality</text><text x="550" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Wage for work;</text><text x="550" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">sufficient control;</text><text x="550" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">consistent terms</text><text x="550" y="344" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle"><tspan font-style="italic">Ready</tspan> <tspan font-style="italic">Mixed</tspan></text><text x="550" y="363" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle"><tspan font-style="italic">Concrete</tspan></text><circle cx="750" cy="184" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="750" y="164" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1969</text><rect x="658" y="210" width="184" height="168" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="750" y="240" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Own account?</text><text x="750" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Who takes the</text><text x="750" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">financial risk and</text><text x="750" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">chance of profit?</text><text x="750" y="344" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle"><tspan font-style="italic">Market</tspan> <tspan font-style="italic">Investigations</tspan></text><rect x="30" y="412" width="412" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="440" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LABELS DO NOT DECIDE</text><text x="46" y="466.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ferguson v John Dawson (1976)</text><text x="46" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A labourer called self-employed was an employee</text><text x="46" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in reality</text><rect x="458" y="412" width="412" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="440" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTROL IS ONLY ONE FACTOR</text><text x="474" y="466.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Skilled employees</text><text x="474" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Surgeons are not told how to work, but are still</text><text x="474" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">employees</text>
</svg>