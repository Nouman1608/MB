<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Relationships akin to employment</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Stage 1 extended since 2012, and then limited</text>
<rect x="30" y="124" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><defs><linearGradient id="ak" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="0.65" stop-color="#f2e7b8"/><stop offset="1" stop-color="#f3d9c9"/></linearGradient></defs><rect x="60" y="154" width="780" height="48" rx="24" fill="url(#ak)" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="185" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Employee</text><text x="450" y="185" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Akin to employment</text><text x="820" y="185" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Independent contractor</text><text x="260" y="224" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">vicariously liable</text><text x="740" y="224" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">not liable</text><rect x="30" y="262" width="412" height="101" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">E v ENGLISH PROVINCE (2012)</text><text x="46" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diocese could be liable for a priest with no</text><text x="46" y="342.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contract of employment</text><rect x="458" y="262" width="412" height="101" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CATHOLIC CHILD WELFARE SOCIETY (2012)</text><text x="474" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Religious institute liable for abuse by brothers</text><text x="474" y="342.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">teaching at a school</text><rect x="30" y="375" width="412" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="403" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COX v MINISTRY OF JUSTICE (2016)</text><text x="46" y="434.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prisoner in the kitchen dropped a sack of rice on</text><text x="46" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a catering manager: work integrated and for the</text><text x="46" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prison’s benefit</text><rect x="458" y="375" width="412" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="403" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARMES v NOTTINGHAMSHIRE CC (2017)</text><text x="474" y="434.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Local authority liable for abuse by foster parents</text><text x="474" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it had placed a child with</text><rect x="30" y="519" width="840" height="105" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="549" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">THE LIMIT: VARIOUS CLAIMANTS v BARCLAYS BANK (2020)</text><text x="48" y="580.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A doctor examining job applicants ran his own practice with many clients: an independent contractor, so</text><text x="48" y="601.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the bank was not liable for his assaults.</text>
</svg>