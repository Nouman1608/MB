<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Deliberate wrongdoing: the close connection test</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Is the tort so closely connected with the job that liability is fair and just?</text>
<rect x="30" y="124" width="412" height="205" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLOSE CONNECTION: LIABLE</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Lister</tspan> <tspan font-weight="700" fill="#1e2a44">v</tspan> <tspan font-weight="700" fill="#1e2a44">Hesley</tspan> <tspan font-weight="700" fill="#1e2a44">Hall</tspan> (2001): warden’s duties of</text><text x="63.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">care for boys connected with the abuse</text><text x="48" y="235.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Mattis</tspan> <tspan font-weight="700" fill="#1e2a44">v</tspan> <tspan font-weight="700" fill="#1e2a44">Pollock</tspan> (2003): doorman encouraged</text><text x="63.2" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to be aggressive stabbed a customer</text><text x="48" y="285.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Mohamud</tspan> <tspan font-weight="700" fill="#1e2a44">v</tspan> <tspan font-weight="700" fill="#1e2a44">WM</tspan> <tspan font-weight="700" fill="#1e2a44">Morrison</tspan> (2016): kiosk attack</text><text x="63.2" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an unbroken sequence from serving customers</text><rect x="458" y="124" width="412" height="205" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="476" y="154" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NO CLOSE CONNECTION: NOT LIABLE</text><text x="476" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">WM</tspan> <tspan font-weight="700" fill="#1e2a44">Morrison</tspan> <tspan font-weight="700" fill="#1e2a44">v</tspan> <tspan font-weight="700" fill="#1e2a44">Various</tspan> <tspan font-weight="700" fill="#1e2a44">Claimants</tspan> (2020):</text><text x="491.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">payroll leak was a personal vendetta</text><text x="476" y="235.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Barry</tspan> <tspan font-weight="700" fill="#1e2a44">Congregation</tspan> <tspan font-weight="700" fill="#1e2a44">v</tspan> <tspan font-weight="700" fill="#1e2a44">BXB</tspan> (2023): an elder’s</text><text x="491.2" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rape not closely connected with his role</text><rect x="30" y="351" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> using close connection for every case. For ordinary negligence while working, the</text><text x="450" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">traditional cases are enough.</text>
