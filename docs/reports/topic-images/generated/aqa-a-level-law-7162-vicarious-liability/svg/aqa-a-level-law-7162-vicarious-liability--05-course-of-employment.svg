<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="900" height="492" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="492" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">In the course of employment?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">An authorised act, or an authorised act done in an unauthorised way</text>
<rect x="30" y="124" width="412" height="205" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INSIDE: EMPLOYER LIABLE</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Limpus</tspan> <tspan font-weight="700" fill="#1e2a44">v</tspan> <tspan font-weight="700" fill="#1e2a44">London</tspan> <tspan font-weight="700" fill="#1e2a44">General</tspan> <tspan font-weight="700" fill="#1e2a44">Omnibus</tspan> (1862):</text><text x="63.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">racing a rival bus against instructions</text><text x="48" y="235.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Rose</tspan> <tspan font-weight="700" fill="#1e2a44">v</tspan> <tspan font-weight="700" fill="#1e2a44">Plenty</tspan> (1976): milkman’s boy helper,</text><text x="63.2" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">against orders, helping the business</text><text x="48" y="285.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Century</tspan> <tspan font-weight="700" fill="#1e2a44">Insurance</tspan> (1942): tanker driver’s</text><text x="63.2" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">match while delivering petrol</text><rect x="458" y="124" width="412" height="205" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="476" y="154" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OUTSIDE: NOT LIABLE</text><text x="476" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Twine</tspan> <tspan font-weight="700" fill="#1e2a44">v</tspan> <tspan font-weight="700" fill="#1e2a44">Bean’s</tspan> <tspan font-weight="700" fill="#1e2a44">Express</tspan> (1946): unauthorised</text><text x="491.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lift did nothing for the business</text><text x="476" y="235.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Beard</tspan> <tspan font-weight="700" fill="#1e2a44">v</tspan> <tspan font-weight="700" fill="#1e2a44">London</tspan> <tspan font-weight="700" fill="#1e2a44">General</tspan> <tspan font-weight="700" fill="#1e2a44">Omnibus</tspan> (1900):</text><text x="491.2" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conductor drove the bus himself</text><text x="476" y="285.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Hilton</tspan> <tspan font-weight="700" fill="#1e2a44">v</tspan> <tspan font-weight="700" fill="#1e2a44">Thomas</tspan> <tspan font-weight="700" fill="#1e2a44">Burton</tspan> (1961): drove off for</text><text x="491.2" y="306.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tea, “a frolic of their own”</text><rect x="30" y="351" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="385.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rose v Plenty and Twine compared</text><text x="450" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Both involved forbidden passengers; the difference is whether the passenger was helping the employer’s</text><text x="450" y="435.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">business.</text>
</svg>