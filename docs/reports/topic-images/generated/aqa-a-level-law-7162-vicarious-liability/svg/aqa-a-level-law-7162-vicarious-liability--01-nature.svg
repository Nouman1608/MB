<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Vicarious liability: liable for another’s tort</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Not a separate tort</text>
<rect x="30" y="124" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="164" width="210" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="194" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Employer</text><text x="185" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">not personally at fault</text><circle cx="185" cy="294" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M185,306 L185,338 M170,318 L200,318 M185,338 L173,360 M185,338 L197,360" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="185" y="386" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Employee (wrongdoer)</text><line x1="185" y1="238" x2="185" y2="276" stroke="#1e2a44" stroke-width="3"/><text x="200" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">relationship</text><circle cx="690" cy="294" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M690,306 L690,338 M675,318 L705,318 M690,338 L678,360 M690,338 L702,360" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="690" y="386" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Claimant</text><line x1="215" y1="324" x2="660" y2="324" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="440" y="314" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">commits a tort</text><path d="M660,284 Q500,174 296,196" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#ahT)"/><text x="540" y="204" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">usually sues the employer</text><text x="440" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">wrongdoer remains liable too</text><rect x="30" y="436" width="270.6666666666667" height="121" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="466.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Strict</text><text x="46" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The employer’s own care in</text><text x="46" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recruiting or supervising is</text><text x="46" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">irrelevant</text><rect x="314.6666666666667" y="436" width="270.6666666666667" height="121" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="466.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Needs a tort</text><text x="330.6666666666667" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No tort by the employee,</text><text x="330.6666666666667" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nothing for the employer to be</text><text x="330.6666666666667" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">liable for</text><rect x="599.3333333333334" y="436" width="270.6666666666667" height="121" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="466.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary</text><text x="615.3333333333334" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Depends on the relationship</text><text x="615.3333333333334" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and its link to the tort</text><rect x="30" y="579" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="613.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Purposes</text><text x="450" y="642.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Compensation by a party able to pay and insure; enterprise risk; deterrence through better supervision</text><text x="450" y="663.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">(<tspan font-style="italic">Catholic</tspan> <tspan font-style="italic">Child</tspan> <tspan font-style="italic">Welfare</tspan> <tspan font-style="italic">Society</tspan>, 2012; <tspan font-style="italic">Cox</tspan>, 2016).</text>
</svg>