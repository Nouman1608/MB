<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How ozone forms and how chlorine destroys it</text>

<rect x="30" y="110" width="410" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Natural ozone cycle</text><rect x="70" y="175" width="330" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="200.87" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">O₂ + UV → O + O</text><text x="235" y="222.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">UV splits oxygen</text><line x1="235" y1="238" x2="235" y2="268" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="130" cy="400" r="52" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="409.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">O₃</text><circle cx="340" cy="400" r="52" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="340" y="407.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">O₂ + O</text><path d="M330,346 Q240,290 150,342" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><text x="235" y="300" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">O + O₂ → O₃</text><path d="M150,456 Q240,510 322,458" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><text x="235" y="520" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">O₃ + UV → O₂ + O</text><text x="235" y="544" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">UV absorbed</text><text x="235" y="583.1" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Made and broken down all the time:</text><text x="235" y="604.1" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a steady concentration</text><rect x="460" y="110" width="410" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Chlorine as a catalyst</text><rect x="500" y="175" width="330" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="200.87" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">CFC + UV → Cl</text><text x="665" y="222.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in the stratosphere</text><line x1="560" y1="238" x2="560" y2="342" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="560" cy="400" r="52" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="560" y="409.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Cl</text><circle cx="770" cy="400" r="52" fill="#efdfa8" stroke="#1e2a44" stroke-width="3"/><text x="770" y="409.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">ClO</text><path d="M580,350 Q665,295 750,346" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><text x="665" y="300" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">+ O₃ → ClO + O₂</text><path d="M752,454 Q665,508 580,456" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><text x="665" y="520" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">+ O → Cl + O₂</text><text x="665" y="544" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Cl comes out unchanged</text><text x="665" y="583.1" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">One Cl atom can destroy many</text><text x="665" y="604.1" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">thousands of ozone molecules</text><rect x="30" y="650" width="840" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="688" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ozone column thickness, Dobson units (DU)</text><rect x="90" y="725" width="210" height="34" fill="#b5602e" opacity="0.8"/><rect x="300" y="725" width="390" height="34" fill="#b5d3cf"/><rect x="90" y="725" width="600" height="34" rx="0" fill="none" stroke="#1e2a44" stroke-width="2.5"/><line x1="300" y1="715" x2="300" y2="769" stroke="#1e2a44" stroke-width="3"/><line x1="540" y1="715" x2="540" y2="769" stroke="#1e2a44" stroke-width="3"/><text x="300" y="791" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">220 DU</text><text x="540" y="791" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">300 DU</text><text x="195" y="748" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ozone hole</text><text x="540" y="710" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">typical</text><text x="710" y="748" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">below 220 DU</text><text x="710" y="768" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is a hole</text>
</svg>