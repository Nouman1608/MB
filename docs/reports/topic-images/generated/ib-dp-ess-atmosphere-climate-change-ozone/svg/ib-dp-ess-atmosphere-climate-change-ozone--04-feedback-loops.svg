<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Feedback loops in climate change</text>

<rect x="30" y="110" width="410" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Positive: ice–albedo</text><rect x="135" y="175" width="200" height="72" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="217.27" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Warming</text><rect x="264" y="290" width="166" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="347" y="327.87" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sea ice</text><text x="347" y="349.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">melts</text><rect x="135" y="410" width="200" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="447.87" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Albedo falls</text><text x="235" y="469.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">0.60 → 0.06</text><rect x="40" y="290" width="166" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="123" y="316.28000000000003" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">More energy</text><text x="123" y="339.46000000000004" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">absorbed</text><text x="123" y="360.78000000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">100 → 235 W m⁻²</text><path d="M335,211 Q370,215 360,284" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M360,374 Q365,430 342,440" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M135,452 Q110,452 120,380" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M120,290 Q115,215 128,212" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><circle cx="235" cy="332" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="235" y="339.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="235" y="550.1" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Each turn adds more warming:</text><text x="235" y="571.1" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the change is amplified.</text><rect x="460" y="110" width="410" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="150" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Negative: low clouds</text><rect x="565" y="175" width="200" height="72" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="217.27" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Warming</text><rect x="694" y="290" width="166" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="777" y="327.87" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">More</text><text x="777" y="349.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">evaporation</text><rect x="565" y="410" width="200" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="447.87" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">More low</text><text x="665" y="469.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">clouds</text><rect x="470" y="290" width="166" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="553" y="326.68" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">More sunlight</text><text x="553" y="349.86" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">reflected</text><path d="M765,211 Q800,215 790,284" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M790,374 Q795,430 772,440" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M565,452 Q540,452 550,380" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)"/><path d="M550,290 Q545,215 558,212" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" marker-end="url(#ahT)" stroke-dasharray="9 6"/><text x="498" y="242" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">reduces</text><circle cx="665" cy="332" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="665" y="339.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">−</text><text x="665" y="550.1" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The loop works against the</text><text x="665" y="571.1" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">original change: it is dampened.</text><rect x="30" y="630" width="840" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="668" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Tipping point:</text><text x="212" y="668" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a threshold beyond which positive feedback shifts a system</text><text x="60" y="696" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to a new state that is hard to reverse, e.g. loss of the Greenland ice sheet or Amazon dieback.</text><text x="60" y="722" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Other positive loops: thawing permafrost, more water vapour, drought and forest fire.</text>
</svg>