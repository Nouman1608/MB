<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 930" width="900" height="930" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="930" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Layers and composition of the atmosphere</text>

<rect x="30" y="110" width="840" height="580" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="120" y="544" width="400" height="96" fill="#dce9e7"/><rect x="120" y="240" width="400" height="304" fill="#f2e7b8"/><rect x="120" y="360" width="400" height="136" fill="#d4b02e" opacity="0.35"/><rect x="120" y="195" width="400" height="45" fill="#f4f6f6"/><rect x="120" y="150" width="400" height="45" fill="#ffffff"/><line x1="120" y1="544" x2="520" y2="544" stroke="#4a5568" stroke-width="2" stroke-dasharray="8 6"/><line x1="120" y1="240" x2="520" y2="240" stroke="#4a5568" stroke-width="2" stroke-dasharray="8 6"/><line x1="120" y1="195" x2="520" y2="195" stroke="#4a5568" stroke-width="2" stroke-dasharray="8 6"/><text x="508" y="178" font-size="17" font-weight="600" fill="#4a5568" text-anchor="end">thermosphere</text><text x="508" y="225" font-size="17" font-weight="600" fill="#4a5568" text-anchor="end">mesosphere</text><text x="508" y="438" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">ozone layer</text><path d="M150,618 a16,16 0 0 1 22,-22 a20,20 0 0 1 36,4 a14,14 0 0 1 14,18 z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="120" y1="150" x2="120" y2="640" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="640" x2="520" y2="640" stroke="#1e2a44" stroke-width="3"/><line x1="112" y1="640" x2="120" y2="640" stroke="#1e2a44" stroke-width="3"/><text x="106" y="646" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="112" y1="544" x2="120" y2="544" stroke="#1e2a44" stroke-width="3"/><text x="106" y="550" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">12</text><line x1="112" y1="240" x2="120" y2="240" stroke="#1e2a44" stroke-width="3"/><text x="106" y="246" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">50</text><text x="106" y="175" font-size="17" font-weight="400" fill="#4a5568" text-anchor="end">km</text><text x="44" y="145" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">Altitude</text><text x="120" y="670" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">colder</text><text x="520" y="670" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">warmer</text><text x="320" y="670" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Temperature →</text><path d="M430,640 L240,544 C236,474 330,350 440,240" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="300" y="624" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">falls</text><text x="330" y="448" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">rises</text><text x="545" y="280" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Stratosphere</text><text x="545" y="308" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Up to about 50 km</text><text x="545" y="333" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Temperature rises with</text><text x="545" y="358" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">height because ozone</text><text x="545" y="383" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">absorbs UV radiation</text><text x="545" y="408" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Most ozone lies here</text><text x="545" y="568" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Troposphere</text><text x="545" y="591" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Surface to ~12 km; weather</text><text x="545" y="611" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and almost all water vapour</text><text x="545" y="631" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Falls ~6.5 °C per km</text><rect x="30" y="710" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="750" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Composition of dry air (by volume)</text><rect x="60" y="770" width="608.4" height="50" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="668.4" y="770" width="163.79999999999998" height="50" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="832.1999999999999" y="770" width="7.254" height="50" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><line x1="839" y1="770" x2="839" y2="820" stroke="#1e2a44" stroke-width="2"/><text x="364.2" y="802" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Nitrogen (N₂) 78%</text><text x="750.3" y="802" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Oxygen (O₂) 21%</text><line x1="836" y1="822" x2="836" y2="834" stroke="#1e2a44" stroke-width="2"/><text x="840" y="854" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">Argon 0.93%  ·  CO₂ about 0.04% (above 420 ppm)</text><text x="60" y="888" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Water vapour varies from almost zero to a few per cent, so it is left out.</text>
</svg>