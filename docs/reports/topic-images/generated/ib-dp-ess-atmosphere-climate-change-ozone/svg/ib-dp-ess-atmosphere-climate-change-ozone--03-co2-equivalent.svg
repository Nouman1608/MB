<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">CO₂-equivalent: adding gases by warming</text>

<rect x="30" y="110" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">By mass</text><text x="170" y="150" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tonnes per year</text><rect x="90" y="170" width="291.8524523713012" height="56" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="381.8524523713012" y="170" width="7.004458856911229" height="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="388.8569112282124" y="170" width="1.5" height="56" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="235.9262261856506" y="205" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">CO₂ 500 t</text><line x1="386.8569112282124" y1="228" x2="386.8569112282124" y2="244" stroke="#1e2a44" stroke-width="2"/><text x="378.8569112282124" y="266" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">CH₄ 12 t, N₂O 1.5 t</text><text x="408.8569112282124" y="205" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">total 513.5 t: methane is about 2%</text><text x="450" y="345" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Multiply each mass by its global warming potential (GWP, 100 years)</text><rect x="30" y="365" width="270" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165" y="395" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">CO₂: 500 × 1</text><text x="165" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">= 500 t CO₂e</text><rect x="315" y="365" width="270" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="395" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">CH₄: 12 × 28</text><text x="450" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">= 336 t CO₂e</text><rect x="600" y="365" width="270" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="735" y="395" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">N₂O: 1.5 × 265</text><text x="735" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">= 397.5 t CO₂e</text><line x1="450" y1="440" x2="450" y2="470" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="480" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="520" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">By warming effect</text><text x="280" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">t CO₂e</text><rect x="90" y="540" width="291.8524523713012" height="56" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="381.8524523713012" y="540" width="196.1248479935144" height="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="577.9773003648156" y="540" width="232.02269963518444" height="56" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="235.9262261856506" y="575" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">CO₂ 500</text><text x="479.9148763680584" y="575" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">CH₄ 336</text><text x="693.9886501824078" y="575" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">N₂O 397.5</text><text x="810" y="630" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">total 1233.5 t CO₂e</text><text x="90" y="630" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">methane share = 336 ÷ 1233.5 × 100 = 27.2%</text><text x="90" y="660" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Both bars use the same scale.</text>
</svg>