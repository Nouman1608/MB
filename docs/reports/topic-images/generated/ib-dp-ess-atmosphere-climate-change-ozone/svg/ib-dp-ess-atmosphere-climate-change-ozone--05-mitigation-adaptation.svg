<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mitigation or adaptation?</text>

<rect x="40" y="250" width="190" height="104" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="296.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Greenhouse gas</text><text x="135" y="318.92" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">emissions</text><line x1="232" y1="302" x2="246" y2="302" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="250" y="250" width="190" height="104" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="296.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More GHGs in</text><text x="345" y="318.92" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">the atmosphere</text><line x1="442" y1="302" x2="456" y2="302" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="460" y="250" width="190" height="104" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="286.55999999999995" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Enhanced</text><text x="555" y="308.52" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">greenhouse effect</text><text x="555" y="329.56" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">warming</text><line x1="652" y1="302" x2="666" y2="302" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="670" y="250" width="190" height="104" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="765" y="286.55999999999995" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Impacts and</text><text x="765" y="308.52" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">harm</text><text x="765" y="329.56" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">floods, drought</text><rect x="40" y="112" width="400" height="78" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="240" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">MITIGATION reduces the cause</text><text x="240" y="174" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">cut emissions or remove gases</text><line x1="135" y1="192" x2="135" y2="244" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="345" y1="192" x2="345" y2="244" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="560" y="112" width="300" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="710" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">ADAPTATION reduces</text><text x="710" y="174" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the harm</text><path d="M710,192 Q760,215 765,244" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="30" y="390" width="410" height="252" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Mitigation examples</text><text x="54" y="462" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Renewable energy</text><text x="54" y="492" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Energy efficiency, insulation,</text><text x="70" y="522" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">public transport</text><text x="54" y="552" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Reforestation, protecting peatland</text><text x="54" y="582" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Carbon capture and storage</text><text x="54" y="612" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Carbon taxes, emissions trading</text><rect x="460" y="390" width="410" height="252" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Adaptation examples</text><text x="484" y="462" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Sea walls and flood barriers</text><text x="484" y="492" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Drought-tolerant crops</text><text x="484" y="522" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Water storage, efficient irrigation</text><text x="484" y="552" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Early-warning systems for</text><text x="500" y="582" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">storms and heatwaves</text><text x="484" y="612" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Managed retreat from coasts</text><text x="450" y="676" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">A sea wall is adaptation, not mitigation: it does not cut emissions.</text>
</svg>