<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 836" width="900" height="836" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="836" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two different problems</text>

<text x="220" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Ozone depletion</text><rect x="30" y="172" width="380" height="80" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="220" y="207.54000000000002" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">CFCs, halons, methyl bromide</text><text x="220" y="228.58" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">carry chlorine or bromine upwards</text><line x1="220" y1="254" x2="220" y2="272" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="274" width="380" height="80" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="220" y="309.53999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">UV frees Cl in the stratosphere</text><text x="220" y="330.58" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Cl destroys ozone as a catalyst</text><line x1="220" y1="356" x2="220" y2="374" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="376" width="380" height="80" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="220" y="411.53999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ozone layer thins</text><text x="220" y="432.58" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">below 220 DU = ozone hole</text><line x1="220" y1="458" x2="220" y2="476" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="478" width="380" height="80" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="220" y="513.5400000000001" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More UV-B reaches the surface</text><text x="220" y="534.58" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">skin cancer, cataracts, phytoplankton</text><text x="680" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Climate change</text><rect x="490" y="172" width="380" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="680" y="207.54000000000002" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">CO₂, CH₄, N₂O, halocarbons</text><text x="680" y="228.58" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">added faster than sinks remove them</text><line x1="680" y1="254" x2="680" y2="272" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="490" y="274" width="380" height="80" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="680" y="309.53999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Absorb and re-emit infrared</text><text x="680" y="330.58" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">enhanced greenhouse effect</text><line x1="680" y1="356" x2="680" y2="374" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="490" y="376" width="380" height="80" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="680" y="411.53999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Global warming</text><text x="680" y="432.58" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2011–2020: ~1.1 °C above 1850–1900</text><line x1="680" y1="458" x2="680" y2="476" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="490" y="478" width="380" height="80" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="680" y="513.5400000000001" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sea-level rise, extremes</text><text x="680" y="534.58" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">shifting biomes, coral bleaching</text><line x1="412" y1="416" x2="488" y2="416" stroke="#b5602e" stroke-width="4" stroke-dasharray="8 6"/><text x="450" y="404" font-size="24" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="450" y="440" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">does not</text><text x="450" y="458" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">cause</text><line x1="412" y1="212" x2="486" y2="212" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)" stroke-dasharray="6 5"/><text x="450" y="200" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">CFCs</text><text x="450" y="236" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">warm too</text><rect x="30" y="580" width="840" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="616" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The agreements</text><line x1="80" y1="712" x2="840" y2="712" stroke="#1e2a44" stroke-width="4"/><line x1="80" y1="706" x2="80" y2="718" stroke="#1e2a44" stroke-width="3"/><text x="80" y="738" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1980</text><line x1="270" y1="706" x2="270" y2="718" stroke="#1e2a44" stroke-width="3"/><text x="270" y="738" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1990</text><line x1="460" y1="706" x2="460" y2="718" stroke="#1e2a44" stroke-width="3"/><text x="460" y="738" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2000</text><line x1="650" y1="706" x2="650" y2="718" stroke="#1e2a44" stroke-width="3"/><text x="650" y="738" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2010</text><line x1="840" y1="706" x2="840" y2="718" stroke="#1e2a44" stroke-width="3"/><text x="840" y="738" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2020</text><circle cx="175" cy="712" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="175" y1="702" x2="175" y2="678" stroke="#1e2a44" stroke-width="2"/><text x="135" y="654" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Vienna 1985</text><text x="135" y="674" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">co-operation</text><circle cx="213" cy="712" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="213" y1="702" x2="213" y2="678" stroke="#1e2a44" stroke-width="2"/><text x="288" y="654" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Montreal 1987</text><text x="288" y="674" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">ODS phase-out</text><circle cx="764" cy="712" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="764" y1="702" x2="764" y2="678" stroke="#1e2a44" stroke-width="2"/><text x="758" y="654" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Kigali 2016</text><text x="758" y="674" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">HFC phase-down</text><circle cx="308" cy="712" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="308" y1="742" x2="308" y2="756" stroke="#1e2a44" stroke-width="2"/><text x="308" y="774" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">UNFCCC 1992</text><text x="308" y="794" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">framework</text><circle cx="403" cy="712" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="403" y1="742" x2="403" y2="756" stroke="#1e2a44" stroke-width="2"/><text x="443" y="774" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Kyoto 1997</text><text x="443" y="794" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rich-country targets</text><circle cx="745" cy="712" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="745" y1="742" x2="745" y2="756" stroke="#1e2a44" stroke-width="2"/><text x="725" y="774" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Paris 2015</text><text x="725" y="794" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">NDCs, well below 2 °C</text><circle cx="260" cy="610" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="275" y="616" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ozone</text><circle cx="350" cy="610" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="365" y="616" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">climate</text>
</svg>