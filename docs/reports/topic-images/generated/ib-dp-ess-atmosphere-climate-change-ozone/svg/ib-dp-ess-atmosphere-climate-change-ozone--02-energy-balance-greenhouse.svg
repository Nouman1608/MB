<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Earth’s energy balance and the greenhouse effect</text>

<rect x="30" y="110" width="840" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="300" width="836" height="140" fill="#dce9e7"/><rect x="32" y="560" width="836" height="88" fill="#efdfa8"/><line x1="32" y1="560" x2="868" y2="560" stroke="#1e2a44" stroke-width="3"/><circle cx="70" cy="340" r="7" fill="#2e6b62"/><circle cx="81" cy="335" r="5" fill="#b5602e"/><circle cx="59" cy="335" r="5" fill="#b5602e"/><circle cx="120" cy="410" r="7" fill="#2e6b62"/><circle cx="131" cy="405" r="5" fill="#b5602e"/><circle cx="109" cy="405" r="5" fill="#b5602e"/><circle cx="380" cy="340" r="7" fill="#2e6b62"/><circle cx="391" cy="335" r="5" fill="#b5602e"/><circle cx="369" cy="335" r="5" fill="#b5602e"/><circle cx="400" cy="420" r="7" fill="#2e6b62"/><circle cx="411" cy="415" r="5" fill="#b5602e"/><circle cx="389" cy="415" r="5" fill="#b5602e"/><circle cx="430" cy="322" r="7" fill="#2e6b62"/><circle cx="441" cy="317" r="5" fill="#b5602e"/><circle cx="419" cy="317" r="5" fill="#b5602e"/><circle cx="580" cy="372" r="7" fill="#2e6b62"/><circle cx="591" cy="367" r="5" fill="#b5602e"/><circle cx="569" cy="367" r="5" fill="#b5602e"/><circle cx="520" cy="420" r="7" fill="#2e6b62"/><circle cx="531" cy="415" r="5" fill="#b5602e"/><circle cx="509" cy="415" r="5" fill="#b5602e"/><circle cx="640" cy="425" r="7" fill="#2e6b62"/><circle cx="651" cy="420" r="5" fill="#b5602e"/><circle cx="629" cy="420" r="5" fill="#b5602e"/><circle cx="850" cy="420" r="7" fill="#2e6b62"/><circle cx="861" cy="415" r="5" fill="#b5602e"/><circle cx="839" cy="415" r="5" fill="#b5602e"/><text x="690" y="345" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">greenhouse gases:</text><text x="690" y="366" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">water vapour, CO₂,</text><text x="690" y="387" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">CH₄, N₂O, ozone</text><circle cx="100" cy="185" r="42" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="100" y="191" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sun</text><path d="M170.0,238.0 L170.0,531.0 L156.5,531.0 L185.0,558.0 L213.5,531.0 L200.0,531.0 L200.0,238.0 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="162" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">340 W m⁻² in</text><text x="162" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">short-wave</text><path d="M334.5,556.0 L334.5,156.0 L342.0,156.0 L330.0,140.0 L318.0,156.0 L325.5,156.0 L325.5,556.0 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="348" y="158" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">102 reflected</text><text x="348" y="180" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">albedo 0.30</text><text x="348" y="200" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">clouds, ice,</text><text x="348" y="218" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bright surfaces</text><text x="60" y="594" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">238 W m⁻² absorbed (0.70 × 340)</text><text x="60" y="618" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">warms the surface</text><path d="M490,556 Q504.0,550.5 490.0,545.1 Q476.0,539.6 490.0,534.1 Q504.0,528.6 490.0,523.2 Q476.0,517.7 490.0,512.2 Q504.0,506.8 490.0,501.3 Q476.0,495.8 490.0,490.3 Q504.0,484.9 490.0,479.4 Q476.0,473.9 490.0,468.4 Q504.0,463.0 490.0,457.5 Q476.0,452.0 490.0,446.6 Q504.0,441.1 490.0,435.6 Q476.0,430.1 490.0,424.7 Q504.0,419.2 490.0,413.7 Q476.0,408.3 490.0,402.8 Q504.0,397.3 490.0,391.8 Q476.0,386.4 490.0,380.9 Q504.0,375.4 490.0,369.9 Q476.0,364.5 490.0,359.0 Q504.0,353.5 490.0,348.1 Q476.0,342.6 490.0,337.1 Q504.0,331.6 490.0,326.2 Q476.0,320.7 490.0,315.2 Q504.0,309.8 490.0,304.3 Q476.0,298.8 490.0,293.3 Q504.0,287.9 490.0,282.4 Q476.0,276.9 490.0,271.4 Q504.0,266.0 490.0,260.5 Q476.0,255.0 490.0,249.6 Q504.0,244.1 490.0,238.6 Q476.0,233.1 490.0,227.7 Q504.0,222.2 490.0,216.7 Q476.0,211.3 490.0,205.8 Q504.0,200.3 490.0,194.8 Q476.0,189.4 490.0,183.9 Q504.0,178.4 490.0,172.9 Q476.0,167.5 490.0,162.0 L490,140" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M570,556 Q584.0,550.3 570.0,544.6 Q556.0,538.9 570.0,533.2 Q584.0,527.5 570.0,521.8 Q556.0,516.2 570.0,510.5 Q584.0,504.8 570.0,499.1 Q556.0,493.4 570.0,487.7 Q584.0,482.0 570.0,476.3 Q556.0,470.6 570.0,464.9 Q584.0,459.2 570.0,453.5 Q556.0,447.8 570.0,442.2 Q584.0,436.5 570.0,430.8 Q556.0,425.1 570.0,419.4 Q584.0,413.7 570.0,408.0 L570,386" fill="none" stroke="#b5602e" stroke-width="4" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M595,362 Q610.0,360.6 598.1,351.4 Q586.2,342.2 601.2,340.9 Q616.2,339.5 604.3,330.3 Q592.4,321.1 607.4,319.7 Q622.4,318.4 610.5,309.1 Q598.6,299.9 613.6,298.6 Q628.6,297.2 616.7,288.0 Q604.8,278.8 619.8,277.4 Q634.7,276.1 622.9,266.8 Q611.0,257.6 626.0,256.3 Q640.9,254.9 629.1,245.7 Q617.2,236.5 632.1,235.1 Q647.1,233.8 635.2,224.6 Q623.4,215.3 638.3,214.0 Q653.3,212.6 641.4,203.4 Q629.5,194.2 644.5,192.8 Q659.5,191.5 647.6,182.3 Q635.7,173.0 650.7,171.7 Q665.7,170.3 653.8,161.1 L660,140" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M598,384 Q586.2,393.4 601.3,394.8 Q616.3,396.1 604.5,405.6 Q592.7,415.0 607.8,416.3 Q622.8,417.7 611.0,427.1 Q599.3,436.6 614.3,437.9 Q629.3,439.2 617.6,448.7 Q605.8,458.1 620.8,459.5 Q635.8,460.8 624.1,470.3 Q612.3,479.7 627.3,481.0 Q642.4,482.4 630.6,491.8 Q618.8,501.3 633.9,502.6 Q648.9,503.9 637.1,513.4 Q625.3,522.8 640.4,524.2 Q655.4,525.5 643.6,534.9 L650,556" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ahR)"/><line x1="596" y1="372" x2="640" y2="372" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="508" y="158" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">some escapes</text><text x="508" y="178" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">to space</text><text x="678" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">absorbed, then</text><text x="678" y="182" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">re-emitted in all</text><text x="678" y="204" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">directions</text><text x="668" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">some back towards</text><text x="668" y="522" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">the surface</text><text x="490" y="594" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">surface emits long-wave</text><text x="490" y="618" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(infrared) radiation</text><rect x="30" y="672" width="410" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="712" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">With the natural greenhouse effect</text><text x="235" y="748" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">average about 15 °C</text><rect x="460" y="672" width="410" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="712" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Without it</text><text x="665" y="748" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">about −18 °C (33 °C colder)</text><text x="450" y="808" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">If greenhouse gases slow energy loss to space, Earth warms until output again equals input.</text>
</svg>