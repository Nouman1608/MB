<rect width="900" height="544" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Summary or synthesis?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Who controls the structure: the sources or the writer?</text>
<text x="215" y="132" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Summary (weak)</text><rect x="30" y="148" width="370" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="56" y="168" width="70" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="91" y="204" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A</text><text x="146" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic" xml:space="preserve">“Source A says...”</text><line x1="91" y1="226" x2="91" y2="248" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="56" y="252" width="70" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="91" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B</text><text x="146" y="286" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic" xml:space="preserve">“Source B says...”</text><line x1="91" y1="310" x2="91" y2="332" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="56" y="336" width="70" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="91" y="372" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">C</text><text x="146" y="370" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic" xml:space="preserve">“Source C says...”</text><text x="215" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">in the order given; the writer disappears</text><text x="685" y="132" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Synthesis (strong)</text><rect x="500" y="148" width="370" height="290" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><rect x="530" y="168" width="310" height="56" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="685" y="203" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Writer’s thesis</text><rect x="520" y="268" width="150" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2" /><rect x="700" y="268" width="150" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2" /><text x="595" y="292" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">idea 1</text><text x="775" y="292" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">idea 2</text><rect x="530" y="308" width="70" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="565" y="344" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A</text><rect x="600" y="308" width="70" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="635" y="344" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">C</text><rect x="740" y="308" width="70" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="775" y="344" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B</text><line x1="595" y1="266" x2="640" y2="228" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="775" y1="266" x2="730" y2="228" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="685" y="422" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">grouped by idea; commentary connects</text><rect x="30" y="458" width="840" height="76.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="490.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Test:</tspan> remove the sources. Is the argument still recognisably yours: its position, structure and</text><text x="450" y="512.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">commentary?</text>
</svg>