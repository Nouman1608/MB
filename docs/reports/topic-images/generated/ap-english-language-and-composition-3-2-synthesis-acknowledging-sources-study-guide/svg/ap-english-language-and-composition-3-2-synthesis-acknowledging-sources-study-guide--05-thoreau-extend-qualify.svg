<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" width="900" height="466" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="466" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Doing something with a source</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Thoreau, “Civil Disobedience”, 1849</text>
<rect x="130" y="122" width="640" height="86.16" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="450" y="158.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Under a government which imprisons any unjustly, the true</text><text x="450" y="183.23000000000002" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">place for a just man is also a prison.”</text><path d="M330,212.16 C300,238.15999999999997 230,228.15999999999997 220,262.15999999999997" fill="none" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><path d="M570,212.16 C600,238.15999999999997 670,228.15999999999997 680,262.15999999999997" fill="none" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="268.15999999999997" width="400" height="125.75999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="302.15999999999997" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Extend</text><text x="48" y="330.15999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The objector to an unjust law should accept its</text><text x="48" y="351.28" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">penalty, not escape it: “That is the standard I</text><text x="48" y="372.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">apply to a protester who...”</text><rect x="470" y="268.15999999999997" width="400" height="125.75999999999999" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="488" y="302.15999999999997" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Qualify</text><text x="488" y="330.15999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The rule works where the unjust law punishes</text><text x="488" y="351.28" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">only the objector, but fits poorly where jailing</text><text x="488" y="372.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the objector helps the injustice continue.</text><text x="450" y="423.91999999999996" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Quote briefly, attribute to Thoreau, then do something of your own with the idea.</text>
</svg>