<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="616" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six ways to put sources in conversation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Think of each move as a verb</text>
<rect x="30" y="122" width="200" height="62.24000000000001" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="130" y="161.12" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Support</text><rect x="250" y="122" width="620" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="262" y="147.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">use</tspan> <tspan font-weight="700">as</tspan> <tspan font-weight="700">evidence</tspan> <tspan font-weight="700">for</tspan> <tspan font-weight="700">your</tspan> <tspan font-weight="700">claim</tspan></text><text x="262" y="168.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“This is borne out by the trust’s evaluation...”</text><rect x="30" y="194.24" width="200" height="62.24000000000001" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="130" y="233.36" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Extend</text><rect x="250" y="194.24" width="620" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="262" y="219.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">take</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">idea</tspan> <tspan font-weight="700">further</tspan> <tspan font-weight="700">than</tspan> <tspan font-weight="700">it</tspan> <tspan font-weight="700">went</tspan></text><text x="262" y="240.96" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The survey goes further than the report...”</text><rect x="30" y="266.48" width="200" height="62.24000000000001" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="130" y="305.6" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Qualify</text><rect x="250" y="266.48" width="620" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="262" y="292.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">agree,</tspan> <tspan font-weight="700">but</tspan> <tspan font-weight="700">limit</tspan> <tspan font-weight="700">its</tspan> <tspan font-weight="700">force</tspan></text><text x="262" y="313.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...encouraging, but it covered only ten schools.”</text><rect x="30" y="338.72" width="200" height="62.24000000000001" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="130" y="377.84000000000003" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Complicate</text><rect x="250" y="338.72" width="620" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="262" y="364.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">only</tspan> <tspan font-weight="700">part</tspan> <tspan font-weight="700">of</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">story</tspan></text><text x="262" y="385.44000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Yet the teacher’s account suggests the benefit has a price.”</text><rect x="30" y="410.96000000000004" width="200" height="62.24000000000001" rx="12" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2.5" /><text x="130" y="450.08000000000004" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Rebut</text><rect x="250" y="410.96000000000004" width="620" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="262" y="436.56000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">disagree</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">explain</tspan> <tspan font-weight="700">why</tspan></text><text x="262" y="457.68000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The report overstates the case, because...”</text><rect x="30" y="483.20000000000005" width="200" height="62.24000000000001" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="130" y="522.32" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Compare</text><rect x="250" y="483.20000000000005" width="620" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="262" y="508.80000000000007" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">place</tspan> <tspan font-weight="700">two</tspan> <tspan font-weight="700">sources</tspan> <tspan font-weight="700">side</tspan> <tspan font-weight="700">by</tspan> <tspan font-weight="700">side</tspan></text><text x="262" y="529.9200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Where A measures results, B measures cost.”</text><text x="450" y="573.44" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">A paragraph grouping two sources that agree with one that qualifies them beats three separate</text><text x="450" y="594.5600000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">summaries.</text>
</svg>