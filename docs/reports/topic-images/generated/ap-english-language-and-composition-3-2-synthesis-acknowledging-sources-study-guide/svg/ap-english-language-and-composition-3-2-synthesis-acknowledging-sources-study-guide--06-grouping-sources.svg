<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Grouping sources by idea</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: a four-day school week (fictional sources)</text>
<ellipse cx="320" cy="272" rx="250" ry="130" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><ellipse cx="580" cy="272" rx="250" ry="130" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3" fill-opacity="0.85"/><text x="220" y="172" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">BENEFITS</text><text x="680" y="172" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">COSTS</text><rect x="168" y="236" width="64" height="52" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="200" y="270" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A</text><text x="200" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">results unchanged;</text><text x="200" y="329.8" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">staff retention up</text><rect x="418" y="236" width="64" height="52" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="270" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">C</text><text x="450" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">free day to plan; longer</text><text x="450" y="329.8" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">days tire pupils</text><rect x="668" y="236" width="64" height="52" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="700" y="270" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B</text><text x="700" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">58% of 400</text><text x="700" y="329.8" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">households: higher</text><text x="700" y="349.6" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">childcare costs</text><rect x="30" y="432" width="840" height="107.27999999999997" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="48" y="466" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Thesis (a qualified yes)</text><text x="48" y="494.84999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A four-day school week can protect attainment and help teachers, but it is only justified if</text><text x="48" y="517.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">schools address the extra childcare costs and the fatigue that longer days bring.</text>
