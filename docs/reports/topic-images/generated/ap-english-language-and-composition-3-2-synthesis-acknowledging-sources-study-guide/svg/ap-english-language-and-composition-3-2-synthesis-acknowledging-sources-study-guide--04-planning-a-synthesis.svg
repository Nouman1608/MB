<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" width="900" height="602" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="602" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a synthesis response</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Seven steps, position first</text>
<rect x="30" y="122" width="410" height="95.32000000000001" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="84" y="162.28" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Decide your position first</text><text x="84" y="188.39" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">do not let the sources choose it</text><circle cx="62" cy="169.66" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="175.42" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="442" y1="177.66" x2="452" y2="220.7584" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="460" y="181.0984" width="410" height="95.32000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="514" y="221.3784" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Skim and tag the sources</text><text x="514" y="247.48839999999998" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">supports, qualifies or opposes</text><circle cx="492" cy="228.7584" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="234.51839999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="458" y1="236.7584" x2="448" y2="279.8568" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="240.1968" width="410" height="95.32000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="84" y="280.47679999999997" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Group sources by idea</text><text x="84" y="306.5868" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">not by the order you met them</text><circle cx="62" cy="287.8568" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="293.6168" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="442" y1="295.8568" x2="452" y2="338.95520000000005" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="460" y="299.2952" width="410" height="95.32000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="514" y="339.5752" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Draft a thesis</text><text x="514" y="365.6852" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a position that acknowledges complexity</text><circle cx="492" cy="346.95520000000005" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="352.71520000000004" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="458" y1="354.95520000000005" x2="448" y2="398.0536" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="358.3936" width="410" height="95.32000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="84" y="398.67359999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Build paragraphs around claims</text><text x="84" y="424.7836" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">sources as evidence</text><circle cx="62" cy="406.0536" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="411.8136" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="442" y1="414.0536" x2="452" y2="457.15200000000004" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="460" y="417.492" width="410" height="95.32000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="514" y="457.772" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Write commentary</text><text x="514" y="483.882" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">link each source to your claim</text><circle cx="492" cy="465.15200000000004" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="492" y="470.91200000000003" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><line x1="458" y1="473.15200000000004" x2="448" y2="516.2504" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="476.59040000000005" width="410" height="95.32000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="84" y="504.9904000000001" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Add a counterargument or</text><text x="84" y="528.7504000000001" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">qualification</text><text x="84" y="554.8604000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">from a source that complicates your view</text><circle cx="62" cy="524.2504" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="530.0104" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text>
</svg>