<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 532" width="900" height="532" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="532" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hebb's theory of learning</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">When one neuron repeatedly helps to fire another</text>
<rect x="30" y="124" width="380" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="118" y1="194" x2="322" y2="194" stroke="#c9d6d4" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="194" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><circle cx="350" cy="194" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="220" y="254" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Before</text><text x="220" y="282" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a weak connection</text><rect x="490" y="124" width="380" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="578" y1="194" x2="782" y2="194" stroke="#2e6b62" stroke-width="14" stroke-linecap="round"/><circle cx="550" cy="194" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><circle cx="810" cy="194" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="680" y="254" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">After repeated firing</text><text x="680" y="282" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">stronger and more efficient</text><line x1="418" y1="194" x2="482" y2="194" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="178" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">repeat</text><rect x="30" y="326" width="270.6666666666667" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="358" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CELL ASSEMBLIES</text><text x="50" y="384.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Groups active together</text><text x="50" y="412.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Neurons repeatedly active</text><text x="50" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">together form cell assemblies</text><text x="50" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">that represent a memory or</text><text x="50" y="475.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">skill.</text><rect x="314.6666666666667" y="326" width="270.6666666666667" height="174" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="367.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LEARNING CHANGES THE BRAIN</text><text x="334.6666666666667" y="393.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Practice speeds</text><text x="334.6666666666667" y="416.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">pathways</text><text x="334.6666666666667" y="445.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Practice makes pathways</text><text x="334.6666666666667" y="466.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quicker to activate.</text><rect x="599.3333333333334" y="326" width="270.6666666666667" height="174" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="379" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LINK TO MEMORY</text><text x="619.3333333333334" y="405.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rehearsal</text><text x="619.3333333333334" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rehearsal strengthens</text><text x="619.3333333333334" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">synaptic connections.</text>
</svg>