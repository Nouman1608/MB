<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 764" width="900" height="764" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="764" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two studies of the brain</text>

<rect x="30" y="100" width="410" height="460" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="136" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Penfield: interpretive cortex</text><text x="50" y="172" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARTICIPANTS</text><text x="50" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Patients with epilepsy, <tspan font-weight="700" fill="#1e2a44">awake</tspan> during surgery</text><line x1="50" y1="217" x2="420" y2="217" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="240" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROCEDURE</text><text x="50" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stimulated points on the brain's surface with a</text><text x="50" y="292.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weak electric current; recorded what patients</text><text x="50" y="313.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reported</text><line x1="50" y1="327" x2="420" y2="327" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="350" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FINDING</text><text x="50" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stimulating parts of the <tspan font-weight="700" fill="#1e2a44">temporal</tspan> <tspan font-weight="700" fill="#1e2a44">lobe</tspan></text><text x="50" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sometimes produced vivid experiences, such as</text><text x="50" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hearing music or reliving past events</text><line x1="50" y1="437" x2="420" y2="437" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="460" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVALUATION</text><text x="50" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Direct evidence linking areas to experiences, but</text><text x="50" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">brains not typical (epilepsy) and only a minority</text><text x="50" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reported such experiences</text><rect x="460" y="100" width="410" height="439" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="136" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Tulving: 'gold' memory study</text><text x="480" y="172" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARTICIPANTS</text><text x="480" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A small group, including Tulving</text><line x1="480" y1="217" x2="850" y2="217" stroke="#c9d6d4" stroke-width="1.5"/><text x="480" y="240" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROCEDURE</text><text x="480" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Injected with a small dose of radioactive gold so</text><text x="480" y="292.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">active areas could be detected; thought about</text><text x="480" y="313.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personal experiences or general facts</text><line x1="480" y1="327" x2="850" y2="327" stroke="#c9d6d4" stroke-width="1.5"/><text x="480" y="350" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FINDING</text><text x="480" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Episodic</tspan> thinking: more activity towards the</text><text x="480" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">front</tspan> of the cortex. <tspan font-weight="700" fill="#1e2a44">Semantic</tspan>: towards the <tspan font-weight="700" fill="#1e2a44">back</tspan></text><line x1="480" y1="416" x2="850" y2="416" stroke="#c9d6d4" stroke-width="1.5"/><text x="480" y="439" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVALUATION</text><text x="480" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Supports localisation and separate memory</text><text x="480" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">types, but the sample was tiny and the pattern</text><text x="480" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was not clear for every participant</text><clipPath id="bc150588"><ellipse cx="259.2" cy="657.3" rx="105" ry="69.3"/></clipPath><g clip-path="url(#bc150588)"><polygon points="150,588 271.8,588 260.03999999999996,667.8 179.4,681.24 150,681.24" fill="#d4b02e"/><polygon points="271.8,588 334.79999999999995,588 325.56,663.6 260.03999999999996,667.8" fill="#ffffff"/><polygon points="334.79999999999995,588 368.4,588 368.4,730.8 318,730.8 325.56,663.6" fill="#b5d3cf"/><polygon points="150,681.24 179.4,681.24 260.03999999999996,667.8 325.56,663.6 318,730.8 150,730.8" fill="#ffffff"/><polyline points="271.8,588 260.03999999999996,667.8" fill="none" stroke="#1e2a44" stroke-width="2.5"/><polyline points="334.79999999999995,588 325.56,663.6 318,730.8" fill="none" stroke="#1e2a44" stroke-width="2.5"/><polyline points="150,681.24 179.4,681.24 260.03999999999996,667.8 325.56,663.6" fill="none" stroke="#1e2a44" stroke-width="2.5"/></g><ellipse cx="259.2" cy="657.3" rx="105" ry="69.3" fill="none" stroke="#1e2a44" stroke-width="3"/><text x="140" y="648" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">episodic:</text><text x="140" y="670" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">front</text><text x="380" y="648" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">semantic:</text><text x="380" y="670" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">back</text><rect x="500" y="582" width="370" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="520" y="616.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Scans used in this field</text><text x="520" y="644.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">CT:</tspan> structure only</text><text x="520" y="669.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">PET</tspan> and <tspan font-weight="700" fill="#1e2a44">fMRI:</tspan> activity during a task</text>
</svg>