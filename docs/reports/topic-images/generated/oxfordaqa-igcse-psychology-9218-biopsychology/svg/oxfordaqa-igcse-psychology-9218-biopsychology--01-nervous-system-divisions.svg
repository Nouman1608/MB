<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 711" width="900" height="711" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="711" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Divisions of the nervous system</text>

<path d="M450,148 L450,174 L235,174 L235,200" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M450,148 L450,174 L665,174 L665,200" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M235,350 L235,385 L125,385 L125,420" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M235,350 L235,385 L320,385 L320,420" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M665,350 L665,385 L555,385 L555,420" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M665,350 L665,385 L775,385 L775,420" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="300" y="100" width="300" height="48" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="128.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Nervous system</text><rect x="40" y="200" width="390" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="244.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Central nervous system</text><text x="235" y="273.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Brain and spinal cord. Processes information</text><text x="235" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and makes decisions; the spinal cord relays</text><text x="235" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">messages to and from the brain</text><rect x="470" y="200" width="390" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="244.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Peripheral nervous system</text><text x="665" y="273.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">All nerves outside the brain and spinal cord.</text><text x="665" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Carries messages between the CNS and the</text><text x="665" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">body</text><rect x="40" y="420" width="170" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="125" y="454.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Brain</text><rect x="235" y="420" width="170" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="320" y="454.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Spinal cord</text><rect x="450" y="420" width="210" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="555" y="464.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Somatic</text><text x="555" y="493.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Sensory and motor</text><text x="555" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">nerves to skin and</text><text x="555" y="535.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">skeletal muscles</text><rect x="680" y="420" width="190" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="775" y="475.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Autonomic</text><text x="775" y="504.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Nerves to internal</text><text x="775" y="525.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">organs and glands</text><text x="555" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Voluntary</tspan> movement</text><text x="555" y="643.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and sensation</text><text x="775" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Involuntary:</tspan> heart</text><text x="775" y="643.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">rate, breathing,</text><text x="775" y="664.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">digestion</text>
</svg>