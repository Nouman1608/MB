-anchor="middle">Temporal</text><text x="481" y="466.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Cerebellum</text><path d="M344.5,166 C518.25,166 552,144 604,144" fill="none" stroke="#1e2a44" stroke-width="1.6"/><circle cx="344.5" cy="166" r="4" fill="#1e2a44"/><text x="612" y="148" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Somatosensory area</text><text x="612" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">touch, temperature, body position</text><text x="612" y="188" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(parietal)</text><path d="M318.25,187 C505.125,187 552,228 604,228" fill="none" stroke="#1e2a44" stroke-width="1.6"/><circle cx="318.25" cy="187" r="4" fill="#1e2a44"/><text x="612" y="232" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Motor area</text><text x="612" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">voluntary movement (frontal)</text><path d="M541.9000000000001,281.5 C616.95,281.5 552,312 604,312" fill="none" stroke="#1e2a44" stroke-width="1.6"/><circle cx="541.9000000000001" cy="281.5" r="4" fill="#1e2a44"/><text x="612" y="316" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Visual area</text><text x="612" y="338" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">vision (occipital lobe)</text><path d="M402.25,349.75 C547.125,349.75 552,396 604,396" fill="none" stroke="#1e2a44" stroke-width="1.6"/><circle cx="402.25" cy="349.75" r="4" fill="#1e2a44"/><text x="612" y="400" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Wernicke's area</text><text x="612" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">understanding language (temporal,</text><text x="612" y="440" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">usually left)</text><path d="M223.75,281.5 C223.75,504 80,484 80,522" fill="none" stroke="#1e2a44" stroke-width="1.6"/><circle cx="223.75" cy="281.5" r="4" fill="#1e2a44"/><text x="40" y="540" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Broca's area</text><text x="40" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">speech production (frontal, usually left)</text><path d="M302.5,370.75 C302.5,504 440,484 440,522" fill="none" stroke="#1e2a44" stroke-width="1.6"/><circle cx="302.5" cy="370.75" r="4" fill="#1e2a44"/><text x="400" y="540" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Auditory area</text><text x="400" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hearing (temporal)</text><rect x="30" y="590" width="411" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="624.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Opposite side</text><text x="50" y="652.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each side of the motor area controls movement</text><text x="50" y="673.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on the opposite side of the body.</text><rect x="459" y="590" width="411" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="634.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cerebellum</text><text x="479" y="663.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Balance, posture and coordination of movement.</text>
