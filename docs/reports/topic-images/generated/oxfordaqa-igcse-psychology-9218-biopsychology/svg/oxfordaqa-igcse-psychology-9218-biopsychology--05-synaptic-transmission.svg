<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 866" width="900" height="866" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="866" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Synaptic transmission: electrical to chemical</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic, not to scale</text>
<path d="M30,154 L250,154 C340,154 380,204 380,264 C380,324 340,374 250,374 L30,374" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="50" y1="324" x2="160" y2="324" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="50" y="300" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">electrical impulse</text><circle cx="270" cy="204" r="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="262" cy="198" r="3.5" fill="#8a6d0d"/><circle cx="277" cy="196" r="3.5" fill="#8a6d0d"/><circle cx="270" cy="212" r="3.5" fill="#8a6d0d"/><circle cx="261" cy="213" r="3.5" fill="#8a6d0d"/><circle cx="279" cy="210" r="3.5" fill="#8a6d0d"/><circle cx="320" cy="269" r="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="312" cy="263" r="3.5" fill="#8a6d0d"/><circle cx="327" cy="261" r="3.5" fill="#8a6d0d"/><circle cx="320" cy="277" r="3.5" fill="#8a6d0d"/><circle cx="311" cy="278" r="3.5" fill="#8a6d0d"/><circle cx="329" cy="275" r="3.5" fill="#8a6d0d"/><circle cx="255" cy="329" r="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="247" cy="323" r="3.5" fill="#8a6d0d"/><circle cx="262" cy="321" r="3.5" fill="#8a6d0d"/><circle cx="255" cy="337" r="3.5" fill="#8a6d0d"/><circle cx="246" cy="338" r="3.5" fill="#8a6d0d"/><circle cx="264" cy="335" r="3.5" fill="#8a6d0d"/><circle cx="205" cy="239" r="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="197" cy="233" r="3.5" fill="#8a6d0d"/><circle cx="212" cy="231" r="3.5" fill="#8a6d0d"/><circle cx="205" cy="247" r="3.5" fill="#8a6d0d"/><circle cx="196" cy="248" r="3.5" fill="#8a6d0d"/><circle cx="214" cy="245" r="3.5" fill="#8a6d0d"/><circle cx="410" cy="224" r="4.5" fill="#8a6d0d"/><circle cx="425" cy="254" r="4.5" fill="#8a6d0d"/><circle cx="405" cy="279" r="4.5" fill="#8a6d0d"/><circle cx="432" cy="304" r="4.5" fill="#8a6d0d"/><circle cx="415" cy="329" r="4.5" fill="#8a6d0d"/><circle cx="440" cy="239" r="4.5" fill="#8a6d0d"/><path d="M440,362 C420,386 380,386 362,352" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="420" y="408" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">reuptake</text><rect x="480" y="134" width="390" height="260" fill="#f2e7b8" fill-opacity="0.5"/><path d="M480,134 L480,394" stroke="#1e2a44" stroke-width="3"/><path d="M480,190 l-14,0 l0,6 l8,0 l0,16 l-8,0 l0,6 l14,0 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M480,250 l-14,0 l0,6 l8,0 l0,16 l-8,0 l0,6 l14,0 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M480,310 l-14,0 l0,6 l8,0 l0,16 l-8,0 l0,6 l14,0 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="458" y="126" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">synaptic gap</text><text x="150" y="404" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">sending neuron (axon terminal)</text><text x="675" y="420" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">next neuron</text><line x1="494" y1="250" x2="560" y2="224" stroke="#1e2a44" stroke-width="1.5"/><text x="566" y="228" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">receptors</text><line x1="185" y1="226" x2="140" y2="200" stroke="#1e2a44" stroke-width="1.5"/><text x="70" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vesicles</text><circle cx="190" cy="322" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="190" y="328.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="425" cy="186" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="425" y="192.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="510" cy="364" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="510" y="370.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="330" cy="394" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="330" y="400.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="590" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">4</tspan> Excitatory: next neuron <tspan font-weight="700">more</tspan></text><text x="590" y="305" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">likely to fire. Inhibitory: <tspan font-weight="700">less</tspan> likely.</text><line x1="60" y1="466" x2="60" y2="684" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="446" width="766" height="41" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="471.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The impulse reaches the axon terminal, where vesicles hold neurotransmitters</text><circle cx="60" cy="466.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="475.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="495" width="766" height="41" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="520.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Neurotransmitters are released into the synaptic gap</text><circle cx="60" cy="515.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="524.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="544" width="766" height="41" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="569.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">They bind to receptors on the next neuron</text><circle cx="60" cy="564.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="573.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="593" width="766" height="41" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="618.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The effect is excitatory or inhibitory</text><circle cx="60" cy="613.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="622.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="642" width="766" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="667.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reuptake: leftover neurotransmitter is taken back into the first neuron, or broken down,</text><text x="116" y="688.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">so the signal stops</text><circle cx="60" cy="673" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="681.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="726" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="760.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Whether the next neuron fires</text><text x="50" y="788.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">It receives inputs from many neurons at once. If excitation outweighs inhibition overall, it fires; if not, it</text><text x="50" y="809.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">does not.</text>
</svg>