<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sensory, relay and motor neurons</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Jun touches a hot pan. Schematic, not to scale</text>
<rect x="30" y="164" width="150" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="105" y="197.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Heat</text><text x="105" y="218.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">receptors</text><text x="105" y="245.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in the hand</text><rect x="340" y="124" width="220" height="170" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="8 6"/><text x="450" y="152" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Spinal cord (CNS)</text><rect x="720" y="164" width="150" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="795" y="199.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Arm muscles</text><text x="795" y="227.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">contract</text><line x1="200" y1="209" x2="352" y2="209" stroke="#2b5a9a" stroke-width="5" stroke-linecap="round"/><line x1="200" y1="209" x2="184" y2="195" stroke="#2b5a9a" stroke-width="3" stroke-linecap="round"/><line x1="200" y1="209" x2="184" y2="209" stroke="#2b5a9a" stroke-width="3" stroke-linecap="round"/><line x1="200" y1="209" x2="184" y2="223" stroke="#2b5a9a" stroke-width="3" stroke-linecap="round"/><line x1="352" y1="209" x2="364" y2="199" stroke="#2b5a9a" stroke-width="3" stroke-linecap="round"/><circle cx="365" cy="199" r="4" fill="#2b5a9a"/><line x1="352" y1="209" x2="364" y2="219" stroke="#2b5a9a" stroke-width="3" stroke-linecap="round"/><circle cx="365" cy="219" r="4" fill="#2b5a9a"/><circle cx="320" cy="209" r="15" fill="#ffffff" stroke="#2b5a9a" stroke-width="4"/><line x1="386" y1="209" x2="468" y2="209" stroke="#2e6b62" stroke-width="5" stroke-linecap="round"/><line x1="386" y1="209" x2="370" y2="195" stroke="#2e6b62" stroke-width="3" stroke-linecap="round"/><line x1="386" y1="209" x2="370" y2="209" stroke="#2e6b62" stroke-width="3" stroke-linecap="round"/><line x1="386" y1="209" x2="370" y2="223" stroke="#2e6b62" stroke-width="3" stroke-linecap="round"/><line x1="468" y1="209" x2="480" y2="199" stroke="#2e6b62" stroke-width="3" stroke-linecap="round"/><circle cx="481" cy="199" r="4" fill="#2e6b62"/><line x1="468" y1="209" x2="480" y2="219" stroke="#2e6b62" stroke-width="3" stroke-linecap="round"/><circle cx="481" cy="219" r="4" fill="#2e6b62"/><circle cx="427" cy="209" r="15" fill="#ffffff" stroke="#2e6b62" stroke-width="4"/><line x1="500" y1="209" x2="698" y2="209" stroke="#b5602e" stroke-width="5" stroke-linecap="round"/><line x1="500" y1="209" x2="484" y2="195" stroke="#b5602e" stroke-width="3" stroke-linecap="round"/><line x1="500" y1="209" x2="484" y2="209" stroke="#b5602e" stroke-width="3" stroke-linecap="round"/><line x1="500" y1="209" x2="484" y2="223" stroke="#b5602e" stroke-width="3" stroke-linecap="round"/><line x1="698" y1="209" x2="710" y2="199" stroke="#b5602e" stroke-width="3" stroke-linecap="round"/><circle cx="711" cy="199" r="4" fill="#b5602e"/><line x1="698" y1="209" x2="710" y2="219" stroke="#b5602e" stroke-width="3" stroke-linecap="round"/><circle cx="711" cy="219" r="4" fill="#b5602e"/><circle cx="522" cy="209" r="15" fill="#ffffff" stroke="#b5602e" stroke-width="4"/><text x="262" y="259" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="middle">sensory</text><text x="427" y="259" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">relay</text><text x="628" y="259" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">motor</text><line x1="230" y1="320" x2="680" y2="320" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="455" y="348" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">direction of the message</text><rect x="30" y="378" width="270.6666666666667" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="421.5" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">SENSORY</text><text x="50" y="447.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Receptors to the CNS</text><text x="50" y="476.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Carries messages from the</text><text x="50" y="497.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">senses</text><text x="50" y="526.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Long</tspan> <tspan font-weight="700" fill="#1e2a44">dendrites,</tspan> <tspan font-weight="700" fill="#1e2a44">short</tspan> <tspan font-weight="700" fill="#1e2a44">axon</tspan></text><rect x="314.6666666666667" y="378" width="270.6666666666667" height="184" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="421.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELAY</text><text x="334.6666666666667" y="447.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Within the CNS</text><text x="334.6666666666667" y="476.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Connects sensory and motor</text><text x="334.6666666666667" y="497.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">neurons</text><text x="334.6666666666667" y="526.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Short</tspan> <tspan font-weight="700" fill="#1e2a44">dendrites,</tspan> <tspan font-weight="700" fill="#1e2a44">short</tspan> <tspan font-weight="700" fill="#1e2a44">axon</tspan></text><rect x="599.3333333333334" y="378" width="270.6666666666667" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="410" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MOTOR</text><text x="619.3333333333334" y="436.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">CNS to muscles and</text><text x="619.3333333333334" y="459.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">glands</text><text x="619.3333333333334" y="487.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Carries messages that cause</text><text x="619.3333333333334" y="508.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">action</text><text x="619.3333333333334" y="537.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Short</tspan> <tspan font-weight="700" fill="#1e2a44">dendrites,</tspan> <tspan font-weight="700" fill="#1e2a44">long</tspan> <tspan font-weight="700" fill="#1e2a44">axon</tspan></text>
</svg>