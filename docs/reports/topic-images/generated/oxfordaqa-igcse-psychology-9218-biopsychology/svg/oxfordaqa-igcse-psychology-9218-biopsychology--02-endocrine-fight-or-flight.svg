<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 797" width="900" height="797" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="797" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hormones and the fight-or-flight response</text>

<rect x="30" y="100" width="316.15384615384613" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="142.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NERVOUS SYSTEM</text><text x="50" y="169.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Messages along nerves</text><text x="50" y="198.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Electrical impulses</text><rect x="364.15384615384613" y="100" width="505.84615384615387" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="384.15384615384613" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ENDOCRINE SYSTEM</text><text x="384.15384615384613" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hormones in the bloodstream</text><text x="384.15384615384613" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Glands release hormones that travel to target organs. Slower</text><text x="384.15384615384613" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">than nerves, but the effects last longer.</text><rect x="30" y="255" width="411" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="289.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pituitary gland</text><text x="50" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In the brain; controls many other glands</text><rect x="459" y="255" width="411" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="289.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Adrenal glands</text><text x="479" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Above the kidneys; release <tspan font-weight="700" fill="#1e2a44">adrenaline</tspan></text><text x="30" y="380" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">FIGHT OR FLIGHT</text><rect x="30" y="392" width="250.66666666666666" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155.33333333333331" y="447" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="155.33333333333331" y="473.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Threat perceived</text><line x1="286.66666666666663" y1="456.5" x2="318.66666666666663" y2="456.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="392" width="250.66666666666666" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="449.99999999999994" y="424" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="449.99999999999994" y="450.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Autonomic nervous</text><text x="449.99999999999994" y="473.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">system activates the</text><text x="449.99999999999994" y="496.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">body</text><line x1="581.3333333333333" y1="456.5" x2="613.3333333333333" y2="456.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="392" width="250.66666666666666" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="744.6666666666666" y="435.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="744.6666666666666" y="461.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Adrenal glands release</text><text x="744.6666666666666" y="484.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">adrenaline</text><line x1="726" y1="525" x2="726" y2="549" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="555" width="840" height="117" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="587" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">BODY READY TO FIGHT OR RUN</text><text x="450" y="620.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Heart rate and breathing rate rise · pupils widen · muscles tense</text><text x="450" y="646.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">sweating increases · digestion slows</text><line x1="450" y1="676" x2="450" y2="700" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="706" width="840" height="59" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="740.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Threat passes: the autonomic nervous system returns the body to a resting state</text>
</svg>