<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 518" width="900" height="518" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="518" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the damage is decides the effect</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Stroke cuts off blood to part of the brain; injury damages tissue directly</text>
<text x="195" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">DAMAGED AREA</text><text x="645" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">EFFECT</text><rect x="30" y="140" width="330" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Motor area (one side)</text><rect x="420" y="140" width="450" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="440" y="173.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weakness or paralysis on the <tspan font-weight="700" fill="#1e2a44">opposite</tspan> side of the</text><text x="440" y="195.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">body</text><line x1="366" y1="178" x2="412" y2="178" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="230" width="330" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="272.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Broca's area</text><rect x="420" y="230" width="450" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="440" y="272.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Slow,</tspan> <tspan font-weight="700" fill="#1e2a44">effortful</tspan> speech; understanding remains</text><line x1="366" y1="268" x2="412" y2="268" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="320" width="330" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="362.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Wernicke's area</text><rect x="420" y="320" width="450" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="440" y="353.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Fluent</tspan> <tspan font-weight="700" fill="#1e2a44">but</tspan> <tspan font-weight="700" fill="#1e2a44">meaningless</tspan> speech; poor</text><text x="440" y="375.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">understanding</text><line x1="366" y1="358" x2="412" y2="358" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="410" width="330" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="452.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Frontal lobe</text><rect x="420" y="410" width="450" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="440" y="452.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Changes to <tspan font-weight="700" fill="#1e2a44">personality</tspan> and <tspan font-weight="700" fill="#1e2a44">self-control</tspan></text><line x1="366" y1="448" x2="412" y2="448" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>