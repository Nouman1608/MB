<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The James-Lange theory of emotion</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"We feel afraid because we tremble."</text>
<rect x="30" y="124" width="246.66666666666666" height="139" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="153.33333333333331" y="183" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="153.33333333333331" y="210.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Event</text><line x1="282.66666666666663" y1="193.5" x2="320.66666666666663" y2="193.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="326.66666666666663" y="124" width="246.66666666666666" height="139" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="449.99999999999994" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="449.99999999999994" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Physiological</text><text x="449.99999999999994" y="208.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">arousal</text><text x="449.99999999999994" y="238.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">the body reacts</text><line x1="579.3333333333333" y1="193.5" x2="617.3333333333333" y2="193.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="623.3333333333333" y="124" width="246.66666666666666" height="139" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="746.6666666666666" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="746.6666666666666" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interpretation of the</text><text x="746.6666666666666" y="208.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">arousal</text><text x="746.6666666666666" y="238.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">= the emotion</text><text x="450" y="300.2" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">Arousal comes <tspan font-weight="700">before</tspan> the emotion, not after it.</text><rect x="30" y="332" width="270.6666666666667" height="153" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="364" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPPORTS</text><text x="50" y="390.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Panic after a racing heart</text><text x="50" y="418.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fits cases where people feel</text><text x="50" y="439.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">panic after noticing a racing</text><text x="50" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heart.</text><rect x="314.6666666666667" y="332" width="270.6666666666667" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="364" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CHALLENGES (CANNON)</text><text x="334.6666666666667" y="390.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Too slow</text><text x="334.6666666666667" y="418.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bodily changes are too slow</text><text x="334.6666666666667" y="439.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to explain how quickly</text><text x="334.6666666666667" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">emotions appear.</text><rect x="599.3333333333334" y="332" width="270.6666666666667" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="364" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CHALLENGES (CANNON)</text><text x="619.3333333333334" y="390.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Same arousal</text><text x="619.3333333333334" y="418.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The same arousal occurs in</text><text x="619.3333333333334" y="439.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">different emotions, such as</text><text x="619.3333333333334" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fear and excitement.</text>
