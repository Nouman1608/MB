<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="430" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When is a local custom legally binding?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Every test must be met; successful claims are now rare</text>
<rect x="30" y="124" width="201" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="44" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Since time</text><text x="44" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">immemorial</text><text x="44" y="223" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Fixed by law at 1189</text><rect x="243" y="124" width="201" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="257" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="257" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Peaceably, openly,</text><text x="257" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">as of right</text><text x="257" y="223" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Not by permission</text><rect x="456" y="124" width="201" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="470" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reasonable and</text><text x="470" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">certain</text><text x="470" y="223" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">As to the locality and</text><text x="470" y="243" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">who benefits</text><rect x="669" y="124" width="201" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="683" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4</text><text x="683" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Consistent with</text><text x="683" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">statute</text><rect x="30" y="281" width="272" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="308" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ MERCER v DENNE (1905)</text><text x="45" y="339" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Fishermen’s customary right to</text><text x="45" y="359" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dry nets on private land by the</text><text x="45" y="379" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">beach</text><rect x="314" y="281" width="272" height="117" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="329" y="308" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">✗ SIMPSON v WELLS (1872)</text><text x="329" y="339" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Stall at a fair: traced only to</text><text x="329" y="359" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">14th-century “statute sessions”,</text><text x="329" y="379" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">so <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">time</tspan> <tspan font-weight="700" fill="#1e2a44">immemorial</tspan></text><rect x="598" y="281" width="272" height="117" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="613" y="308" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">✗ WOLSTANTON (1940)</text><text x="613" y="339" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Lord of the manor taking minerals</text><text x="613" y="359" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">without compensation:</text><text x="613" y="379" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">unreasonable</tspan></text>
</svg>