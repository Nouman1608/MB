<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 657" width="900" height="657" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="657" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the sources of law rank</text>

<rect x="170" y="100" width="560" height="102" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="131.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">STATUTE</text><text x="450" y="160.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Acts of Parliament, and delegated legislation within its powers.</text><text x="450" y="181.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Highest, because of parliamentary supremacy</text><line x1="450" y1="208" x2="450" y2="242" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="466" y="232" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">overrides</text><rect x="110" y="248" width="680" height="102" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="279.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">COMMON LAW</text><text x="450" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Judge-made, through cases and precedent. Murder is a common law offence;</text><text x="450" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">negligence from <tspan font-style="italic">Donoghue</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Stevenson</tspan> (1932)</text><line x1="450" y1="356" x2="450" y2="390" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="466" y="380" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">overrides</text><rect x="50" y="396" width="800" height="100" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="437.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">CUSTOM</text><text x="450" y="466.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Only if it passes every test, and only locally</text><rect x="30" y="516" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="550.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example</text><text x="50" y="579.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Law Reform (Year and a Day Rule) Act 1996 abolished the common law rule that a death more than a</text><text x="50" y="600.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">year and a day after the act could not be murder.</text>
</svg>