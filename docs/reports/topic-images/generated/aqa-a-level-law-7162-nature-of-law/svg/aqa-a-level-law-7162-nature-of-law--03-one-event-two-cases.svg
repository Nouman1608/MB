<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 618" width="900" height="618" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="618" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One event, two cases</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A driver carelessly injures a cyclist</text>
<rect x="250" y="124" width="400" height="52" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Careless driving injures a cyclist</text><line x1="360" y1="180" x2="230" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="540" y1="180" x2="670" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="226" width="410" height="258" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="256" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRIMINAL CASE</text><text x="48" y="282.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cited as R v the driver</text><text x="48" y="311.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Brought by the <tspan font-weight="700" fill="#1e2a44">Crown</tspan> <tspan font-weight="700" fill="#1e2a44">Prosecution</tspan> <tspan font-weight="700" fill="#1e2a44">Service</tspan> for</text><text x="63.2" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the state</text><text x="48" y="359.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="359.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Victim does not control the case</text><text x="48" y="386.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="386.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Verdict: <tspan font-weight="700" fill="#1e2a44">guilty</tspan> or <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">guilty</tspan></text><text x="48" y="413.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="413.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Court decides the sentence</text><text x="48" y="440.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protects society as a whole</text><rect x="460" y="226" width="410" height="258" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="256" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CIVIL CLAIM</text><text x="478" y="282.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The cyclist sues the driver</text><text x="478" y="311.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Started by the <tspan font-weight="700" fill="#1e2a44">claimant</tspan>, who may settle at any</text><text x="493.2" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">time</text><text x="478" y="359.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="359.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Claim in negligence for compensation</text><text x="478" y="386.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="386.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Outcome: <tspan font-weight="700" fill="#1e2a44">liable</tspan> or <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">liable</tspan></text><text x="478" y="413.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="413.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Remedy for the claimant: damages or an</text><text x="493.2" y="434.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">injunction</text><text x="478" y="461.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="461.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protects private rights</text><rect x="30" y="506" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="539.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The standards of proof differ, so the driver could be <tspan font-weight="700" fill="#1e2a44">acquitted</tspan> in the criminal court yet found <tspan font-weight="700" fill="#1e2a44">liable</tspan></text><text x="450" y="561.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">in the civil one.</text>
</svg>