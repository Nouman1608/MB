<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" width="900" height="684" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="684" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes a rule a legal rule?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The decisive feature: enforceability by the state</text>
<rect x="30" y="124" width="411" height="234" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEGAL RULES</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Made by a recognised state authority</text><text x="48" y="212.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bind everyone in the jurisdiction</text><text x="48" y="239.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Enforced by the state through the courts:</text><text x="63.2" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">punishment, damages, injunctions</text><text x="48" y="287.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Change at an identifiable moment</text><text x="48" y="314.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Challenged only through legal processes</text><rect x="459" y="124" width="411" height="234" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="154" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OTHER RULES AND NORMS</text><text x="477" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Made by families, clubs, schools, employers,</text><text x="492.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">faiths</text><text x="477" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bind only members, or those who accept them</text><text x="477" y="260.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Enforced by disapproval, conscience,</text><text x="492.2" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exclusion or group penalties</text><text x="477" y="308.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usually change gradually</text><text x="477" y="335.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Challenged by leaving or ignoring them</text><text x="30" y="404" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A golf member cheats</text><rect x="30" y="420" width="411" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="448" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLUB RULE</text><text x="46" y="479.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The club can <tspan font-weight="700" fill="#1e2a44">expel</tspan> the member, but cannot fine</text><text x="46" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or imprison them</text><rect x="459" y="420" width="411" height="101" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="475" y="448" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IF IT AMOUNTS TO FRAUD</text><text x="475" y="479.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The <tspan font-weight="700" fill="#1e2a44">state’s</tspan> <tspan font-weight="700" fill="#1e2a44">law</tspan> allows a prosecution</text><text x="30" y="561" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The line can move</text><rect x="30" y="577" width="390" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="225" y="605.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Norm: manners</text><text x="225" y="633.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Not smoking in enclosed workplaces</text><line x1="426" y1="614.5" x2="474" y2="614.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="577" width="390" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="675" y="605.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Legal rule: offence</text><text x="675" y="633.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Health Act 2006 (England)</text>
</svg>