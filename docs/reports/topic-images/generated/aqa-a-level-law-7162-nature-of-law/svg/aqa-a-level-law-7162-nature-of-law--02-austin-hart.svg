<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" width="900" height="643" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rules, principles and what law is</text>

<rect x="30" y="100" width="328.8" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RULE</text><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Specific</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A speed limit of 30 miles per hour</text><rect x="376.8" y="100" width="493.2" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="392.8" y="128" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PRINCIPLE</text><text x="392.8" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Broad: guides how rules are applied or developed</text><text x="392.8" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“No one may profit from their own wrong”; presumption of</text><text x="392.8" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">innocence. Used when the rules run out.</text><rect x="30" y="244" width="840" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="272" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JOHN AUSTIN</text><text x="46" y="298.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Law is a command of the sovereign, backed by a sanction</text><text x="46" y="326.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Captures enforceability, but struggles with power-granting laws, such as the rules on making a valid will</text><rect x="30" y="367" width="840" height="244" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="399" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">H. L. A. HART, THE CONCEPT OF LAW (1961): A UNION OF TWO KINDS OF RULE</text><rect x="50" y="417" width="250" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="457.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Primary rules</text><text x="64" y="485.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rules of conduct: “do not</text><text x="64" y="506.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">steal”</text><text x="585" y="437" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary rules: rules about rules</text><rect x="336" y="451" width="166.66666666666666" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="419.3333333333333" y="476.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Recognition</text><text x="419.3333333333333" y="503" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">what counts as law</text><rect x="512.6666666666666" y="451" width="166.66666666666666" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="596" y="489.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Change</text><rect x="689.3333333333333" y="451" width="166.66666666666666" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="772.6666666666666" y="489.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Adjudication</text><text x="315" y="485" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="50" y="589" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">A school rule is not law: the rule of recognition does not recognise the school as a law-maker.</text>
</svg>