<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" width="900" height="582" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="582" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A short answer in four moves</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Explain the difference between a legal rule and a moral or social rule</text>
<line x1="60" y1="144" x2="60" y2="530" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOURCE AND SCOPE</text><text x="118" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Made by a state authority; binds everyone</text><text x="118" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. Parliament</text><circle cx="60" cy="173.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="182.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="233" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="259" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ENFORCEABILITY</text><text x="118" y="285.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Enforced by the state through the courts</text><text x="118" y="313.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sanctions such as a fine or imprisonment</text><circle cx="60" cy="282.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="291.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="342" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="368" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTRAST</text><text x="118" y="394.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A club’s dress code binds only members</text><text x="118" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Disapproval or expulsion, not a court-imposed sanction</text><circle cx="60" cy="391.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="400.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="451" width="766" height="99" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="477" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE: THE LINE CAN MOVE</text><text x="118" y="503.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Smoking in enclosed workplaces</text><text x="118" y="531.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Became an offence under the Health Act 2006</text><circle cx="60" cy="500.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="509.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>