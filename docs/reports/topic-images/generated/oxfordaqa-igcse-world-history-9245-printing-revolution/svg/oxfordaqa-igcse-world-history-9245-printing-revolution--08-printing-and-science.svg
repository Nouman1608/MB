<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How printing helped science</text>

<rect x="30" y="100" width="249.33333333333334" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="146.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Identical copies</text><text x="50" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Texts, diagrams and tables</text><text x="50" y="196.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the same in every copy.</text><line x1="285.33333333333337" y1="166.5" x2="319.33333333333337" y2="166.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="100" width="249.33333333333334" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="345.33333333333337" y="146.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Errors spotted</text><text x="345.33333333333337" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">And corrected by readers</text><text x="345.33333333333337" y="196.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in many places.</text><line x1="580.6666666666667" y1="166.5" x2="614.6666666666667" y2="166.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="100" width="249.33333333333334" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="640.6666666666667" y="134.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Building on others'</text><text x="640.6666666666667" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">work</text><text x="640.6666666666667" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Discoveries tested and</text><text x="640.6666666666667" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">developed faster.</text><clipPath id="tc255"><rect x="30" y="255" width="840" height="279" rx="14"/></clipPath><g clip-path="url(#tc255)"><rect x="30" y="255" width="144.82758620689657" height="49" fill="#b5d3cf"/><text x="44" y="283.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Date</text><rect x="174.82758620689657" y="255" width="695.1724137931035" height="49" fill="#b5d3cf"/><text x="188.82758620689657" y="283.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Example from the lesson</text><rect x="30" y="304" width="144.82758620689657" height="68" fill="#dce9e7"/><text x="44" y="330.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1543</text><rect x="174.82758620689657" y="304" width="695.1724137931035" height="68" fill="#ffffff"/><text x="188.82758620689657" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Vesalius</tspan>, <tspan font-style="italic">On</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">Fabric</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">Human</tspan> <tspan font-style="italic">Body</tspan>: detailed printed illustrations every reader</text><text x="188.82758620689657" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">could check against dissections. <tspan font-weight="700">Copernicus</tspan>: the Earth moves around the Sun.</text><line x1="30" y1="372" x2="870" y2="372" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="372" width="144.82758620689657" height="47" fill="#dce9e7"/><text x="44" y="398.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1665</text><rect x="174.82758620689657" y="372" width="695.1724137931035" height="47" fill="#f8faf9"/><text x="188.82758620689657" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Royal Society's <tspan font-style="italic">Philosophical</tspan> <tspan font-style="italic">Transactions</tspan>: among the first scientific journals.</text><line x1="30" y1="419" x2="870" y2="419" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="419" width="144.82758620689657" height="47" fill="#dce9e7"/><text x="44" y="445.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1687</text><rect x="174.82758620689657" y="419" width="695.1724137931035" height="47" fill="#ffffff"/><text x="188.82758620689657" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Newton's <tspan font-style="italic">Principia</tspan>.</text><line x1="30" y1="466" x2="870" y2="466" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="466" width="144.82758620689657" height="68" fill="#dce9e7"/><text x="44" y="492.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1500s-1720s</text><rect x="174.82758620689657" y="466" width="695.1724137931035" height="68" fill="#f8faf9"/><text x="188.82758620689657" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Printing spreads beyond Europe: presses in Mexico City (16th century); Müteferrika's</text><text x="188.82758620689657" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">press in Istanbul (1720s).</text></g><line x1="174.82758620689657" y1="255" x2="174.82758620689657" y2="534" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="255" width="840" height="279" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>