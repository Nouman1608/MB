<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 593" width="900" height="593" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="593" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The economics of printed books</text>

<rect x="30" y="100" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="370" x2="560" y2="370" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="110" y1="370" x2="110" y2="140" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="325" y="406" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Number of copies made</text><text transform="translate(88,265) rotate(-90)" text-anchor="middle" font-size="16" font-weight="600" fill="#1e2a44">Cost per copy</text><path d="M120,220 L540,220" fill="none" stroke="#8a6d0d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M128,165 C170,310 270,340 540,348" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="536" y="210" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">hand-copied manuscript</text><text x="536" y="336" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">printed book</text><text x="260" y="262" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">start-up costs spread</text><text x="260" y="280" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">over more copies</text><text x="610" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Illustrative shape only:</text><text x="610" y="409" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">no figures in the source</text><text x="610" y="150" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">High</tspan> <tspan font-weight="700">start-up</tspan> <tspan font-weight="700">costs:</tspan> type,</text><text x="610" y="171" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">presses, paper and skilled</text><text x="610" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">workers paid for before any</text><text x="610" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">copy was sold.</text><text x="610" y="270" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Low</tspan> <tspan font-weight="700">cost</tspan> <tspan font-weight="700">per</tspan> <tspan font-weight="700">copy:</tspan> once a</text><text x="610" y="291" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">page was set, hundreds of</text><text x="610" y="312" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">copies could be printed.</text><rect x="30" y="452" width="411" height="109" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="486.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Risk</text><text x="50" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Printers had to judge what would sell; many</text><text x="50" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">went bankrupt.</text><rect x="459" y="452" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="486.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Investors and markets</text><text x="479" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Merchants provided finance; fairs such as</text><text x="479" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Frankfurt's sold books across Europe.</text>
</svg>