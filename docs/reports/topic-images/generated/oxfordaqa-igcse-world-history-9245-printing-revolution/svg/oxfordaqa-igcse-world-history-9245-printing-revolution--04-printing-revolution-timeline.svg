<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 876" width="900" height="876" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="876" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Printing Revolution, c1455-1772</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Key dates from the lesson, colour-coded by theme</text>
<line x1="170" y1="130" x2="170" y2="794" stroke="#1e2a44" stroke-width="4"/><text x="150" y="147" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">c1455</text><circle cx="170" cy="141" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="124" width="675" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="210" y="147" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gutenberg Bible completed</text><text x="150" y="187" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1476</text><circle cx="170" cy="181" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="164" width="675" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="210" y="187" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Caxton's press at Westminster, England's first</text><text x="150" y="227" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">By 1500</text><circle cx="170" cy="221" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="204" width="675" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="210" y="227" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Presses in more than 200 European towns</text><text x="150" y="267" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1501</text><circle cx="170" cy="261" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="244" width="675" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="210" y="267" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Aldus Manutius introduces italic type in Venice</text><text x="150" y="307" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1516</text><circle cx="170" cy="301" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="284" width="675" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="210" y="307" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Erasmus's Greek New Testament</text><text x="150" y="347" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1517</text><circle cx="170" cy="341" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="324" width="675" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="210" y="347" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Luther's criticisms printed in huge numbers</text><text x="150" y="387" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1522 · 1526</text><circle cx="170" cy="381" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="364" width="675" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="210" y="387" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Luther's German and Tyndale's English New Testaments</text><text x="150" y="427" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1543</text><circle cx="170" cy="421" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="404" width="675" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="210" y="427" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Copernicus; Vesalius's illustrated anatomy</text><text x="150" y="467" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1557</text><circle cx="170" cy="461" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="444" width="675" height="34" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="210" y="467" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stationers' Company royal charter</text><text x="150" y="507" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1559</text><circle cx="170" cy="501" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="484" width="675" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="210" y="507" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Index of Prohibited Books</text><text x="150" y="547" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1602</text><circle cx="170" cy="541" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="524" width="675" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="210" y="547" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bodleian Library opens in Oxford</text><text x="150" y="587" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Early 1600s</text><circle cx="170" cy="581" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="564" width="675" height="34" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="210" y="587" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First printed newspapers in German cities</text><text x="150" y="627" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1665</text><circle cx="170" cy="621" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="604" width="675" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="210" y="627" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Philosophical Transactions begins</text><text x="150" y="667" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1687</text><circle cx="170" cy="661" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="644" width="675" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="210" y="667" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Newton's Principia</text><text x="150" y="707" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1710</text><circle cx="170" cy="701" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="684" width="675" height="34" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="210" y="707" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Statute of Anne: often seen as the first copyright law</text><text x="150" y="747" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1720s</text><circle cx="170" cy="741" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="724" width="675" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="210" y="747" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Müteferrika's Ottoman Turkish press, Istanbul</text><text x="150" y="787" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1751-72</text><circle cx="170" cy="781" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="195" y="764" width="675" height="34" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="210" y="787" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Encyclopédie spreads Enlightenment ideas</text><rect x="30" y="814" width="170.91" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="115.455" y="833.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">industry and spread</text><rect x="210.91" y="814" width="242.73" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="332.275" y="833.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Renaissance and Reformation</text><rect x="463.64" y="814" width="176.01" height="29" rx="14.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="551.645" y="833.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">science and learning</text><rect x="649.65" y="814" width="185.7" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="742.5" y="833.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">law, news and politics</text>
</svg>