<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Printing before Gutenberg</text>

<line x1="140" y1="108" x2="140" y2="519" stroke="#1e2a44" stroke-width="4"/><rect x="180" y="100" width="690" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="127.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">China: the Diamond Sutra</text><text x="193" y="151.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Earliest surviving dated printed book; woodblock printing (a whole page carved into</text><text x="193" y="172.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one block).</text><circle cx="140" cy="145" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="151" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">868</text><rect x="180" y="200" width="690" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="227.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">China: Bi Sheng's movable type</text><text x="193" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Made from baked clay; but thousands of characters kept woodblocks more practical.</text><circle cx="140" cy="234.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="240.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1040s</text><rect x="180" y="279" width="690" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="306.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Korea: the Jikji</text><text x="193" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Oldest surviving book printed with cast metal movable type.</text><circle cx="140" cy="313.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="319.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1377</text><rect x="180" y="358" width="690" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="385.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Europe: paper replaces parchment</text><text x="193" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Paper had spread from China through the Islamic world. Books still copied by hand:</text><text x="193" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">months per book, errors in each copy.</text><circle cx="140" cy="403" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="409" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">By 1300s</text><rect x="180" y="458" width="690" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="485.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mainz: Gutenberg's press</text><text x="193" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Gutenberg Bible completed around 1455.</text><circle cx="140" cy="492.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="488.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1440s-50s</text><rect x="30" y="543" width="58.544" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="59.272" y="563.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Asia</text><rect x="100.544" y="543" width="79.616" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="140.352" y="563.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Europe</text>
</svg>