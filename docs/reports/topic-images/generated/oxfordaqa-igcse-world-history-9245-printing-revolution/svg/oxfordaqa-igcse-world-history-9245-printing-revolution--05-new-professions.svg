<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="480" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">New jobs in the print trade</text>

<rect x="30" y="100" width="184.5" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122.25" y="134.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Typefounder</text><text x="122.25" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">casts type</text><line x1="220.5" y1="143.5" x2="242.5" y2="143.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="100" width="184.5" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340.75" y="134.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Compositor</text><text x="340.75" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">sets type</text><line x1="439" y1="143.5" x2="461" y2="143.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="100" width="184.5" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="559.25" y="134.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pressman</text><text x="559.25" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">prints</text><line x1="657.5" y1="143.5" x2="679.5" y2="143.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="100" width="184.5" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="777.75" y="134.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Proofreader</text><text x="777.75" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">checks</text><rect x="30" y="209" width="257.3333333333333" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="158.66666666666666" y="243.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Illustrator, engraver</text><text x="158.66666666666666" y="271.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">woodcuts, engravings</text><line x1="293.3333333333333" y1="252.5" x2="315.3333333333333" y2="252.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="209" width="257.3333333333333" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="243.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Bookbinder</text><text x="450" y="271.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">binds</text><line x1="584.6666666666666" y1="252.5" x2="606.6666666666666" y2="252.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="209" width="257.3333333333333" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="741.3333333333333" y="243.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Bookseller, publisher</text><text x="741.3333333333333" y="271.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">sells</text><rect x="30" y="318" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="352.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Opportunities for women</text><text x="50" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Workshops were often family businesses: a printer's widow often took over, as Charlotte Guillard did,</text><text x="50" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">running a leading Paris press for many years in the sixteenth century. Women also worked as</text><text x="50" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compositors, binders and sellers, and some women writers reached a wider audience.</text>
</svg>