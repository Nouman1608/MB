<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 639" width="900" height="639" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="639" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Printing and the Reformation</text>

<line x1="60" y1="120" x2="60" y2="456" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="100" width="766" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="132.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1517: Luther publishes his criticisms of the Church</text><text x="122" y="162.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Printers produce copies of his writings in huge numbers.</text><circle cx="60" cy="142.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="151.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="197" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="229.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pamphlets with woodcut pictures</text><text x="122" y="259.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Carry Protestant ideas to people who could barely read.</text><circle cx="60" cy="239.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="248.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="294" width="766" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="326.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Bible in the vernacular</text><text x="122" y="356.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">People could read scripture for themselves.</text><circle cx="60" cy="336.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="345.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="391" width="766" height="85" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="423.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Catholic response</text><text x="122" y="453.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Its own printing, and censorship: the Index of Prohibited Books (1559).</text><circle cx="60" cy="433.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="442.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="498" width="840" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="532.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Renaissance too</text><text x="50" y="561.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Printing spread accurate classical and humanist texts; Erasmus's Greek New Testament (1516)</text><text x="50" y="582.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">encouraged study of the Bible in its original language.</text>
</svg>