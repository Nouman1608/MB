<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 562" width="900" height="562" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="562" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From privileges to copyright</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Anyone could reprint a successful book, so who owned it?</text>
<rect x="30" y="124" width="249.33333333333334" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PRIVILEGES</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sole right for a period</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Granted to printers by</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rulers; Venice granted</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">many.</text><line x1="285.33333333333337" y1="201" x2="319.33333333333337" y2="201" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="124" width="249.33333333333334" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="345.33333333333337" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">1557</text><text x="345.33333333333337" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Stationers' Company</text><text x="345.33333333333337" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Royal charter in England:</text><text x="345.33333333333337" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">controlled printing and</text><text x="345.33333333333337" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">registered titles.</text><line x1="580.6666666666667" y1="201" x2="614.6666666666667" y2="201" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="124" width="249.33333333333334" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1710</text><text x="640.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Statute of Anne</text><text x="640.6666666666667" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Often seen as the first</text><text x="640.6666666666667" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">copyright law: rights to</text><text x="640.6666666666667" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">authors</tspan> for a fixed term.</text><rect x="30" y="294" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="327.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The beginning of the idea of <tspan font-weight="700" fill="#1e2a44">intellectual</tspan> <tspan font-weight="700" fill="#1e2a44">property</tspan>: from printers' rights to authors' rights.</text><text x="30" y="382" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">VERNACULAR LANGUAGES</text><rect x="30" y="400" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="434.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">From Latin to everyday languages</text><text x="50" y="463.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Large markets for vernacular books, e.g.</text><text x="50" y="484.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Luther's German New Testament (1522) and</text><text x="50" y="505.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tyndale's English New Testament (1526).</text><rect x="459" y="400" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="445.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Standardisation</text><text x="479" y="474.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Printing helped standardise spelling and</text><text x="479" y="495.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">grammar and strengthened national languages.</text>
</svg>