<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="616" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gutenberg combined four technologies</text>

<rect x="30" y="100" width="195" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="129.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Metal type</text><text x="45" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cast in a hand mould</text><text x="45" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from lead, tin and</text><text x="45" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">antimony: thousands</text><text x="45" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of identical letters</text><line x1="127.5" y1="274" x2="337.125" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="245" y="100" width="195" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="260" y="129.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Screw press</text><text x="260" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Adapted from wine</text><text x="260" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and olive-oil presses:</text><text x="260" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">even pressure</text><line x1="342.5" y1="274" x2="412.375" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="100" width="195" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="475" y="129.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Oil-based ink</text><text x="475" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stuck to metal type</text><line x1="557.5" y1="274" x2="487.625" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="675" y="100" width="195" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="690" y="129.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paper</text><text x="690" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Now widely available</text><line x1="772.5" y1="274" x2="562.875" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="250" y="342" width="400" height="111" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="378.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Gutenberg's printing system</text><text x="450" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Mainz, 1440s-1450s · Bible completed around</text><text x="450" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">1455</text><rect x="30" y="475" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="509.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A business as well as an invention</text><text x="50" y="538.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gutenberg borrowed heavily; in 1455 a lawsuit by his backer Johann Fust cost him much of his</text><text x="50" y="559.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">equipment.</text>
</svg>