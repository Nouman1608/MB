<!-- place after: ## Parallel structure -->
<figure class="topic-figure">

<!-- place after: ## Worked example 1: repairing a passage -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-5-3-repetition-synonyms-parallelism-study-guide--05-repairing-the-passage.webp" width="900" height="499" alt="Three repairs to the committee passage. Pronouns: vague “they”, “It”, “which” and “They” become “who”, “The change” and “a speed that”. Repetition: “The new policy is a policy that sets new rules” becomes “The new policy sets limits on phones.” Parallelism: a mixed list becomes three matching infinitives." loading="lazy">
  <figcaption>Give every pronoun a clear antecedent, cut empty repetition, match list forms.</figcaption>
</figure>
