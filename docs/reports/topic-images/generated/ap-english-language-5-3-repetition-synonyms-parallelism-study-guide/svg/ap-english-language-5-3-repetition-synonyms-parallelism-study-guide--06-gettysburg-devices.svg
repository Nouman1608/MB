<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 608" width="900" height="608" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="608" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four devices in two sentences</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lincoln, Gettysburg Address, 1863</text>
<rect x="30" y="128" width="121.86185" height="37" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="90.930925" y="153.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">we can not</text><text x="90.930925" y="186.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">repetition</text><rect x="157.86185" y="128" width="119.65043999999999" height="37" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="217.68707" y="153.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">dedicate—</text><text x="217.68707" y="186.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">synonym 1</text><rect x="283.51229" y="128" width="121.86185" height="37" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="344.443215" y="153.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">we can not</text><text x="344.443215" y="186.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">repetition</text><rect x="411.37414" y="128" width="143.13444" height="37" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="482.94136000000003" y="153.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">consecrate—</text><text x="482.94136000000003" y="186.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">synonym 2</text><rect x="560.50858" y="128" width="121.86185" height="37" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="621.439505" y="153.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">we can not</text><text x="621.439505" y="186.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">repetition</text><rect x="688.37043" y="128" width="99.35634999999999" height="37" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="738.0486050000001" y="153.15" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">hallow—</text><text x="738.0486050000001" y="186.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">synonym 3</text><rect x="30" y="217.3" width="130.3748" height="37" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="95.1874" y="242.45000000000002" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">this ground.</text><text x="95.1874" y="275.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">antecedent</text><rect x="30" y="308.6" width="501.68259" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="280.841295" y="332.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The brave men, living and dead, who struggled here, have</text><rect x="537.68259" y="308.6" width="123.37904" height="35" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="599.37211" y="332.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">consecrated</text><text x="599.37211" y="365.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">returns: what</text><text x="599.37211" y="383.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">the dead</text><text x="599.37211" y="401.70000000000005" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">already did</text><rect x="667.06163" y="308.6" width="100" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="717.06163" y="332.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">it,</text><text x="717.06163" y="365.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">→ this</text><text x="717.06163" y="383.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">ground</text><rect x="30" y="432.5" width="252.93553000000003" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="156.467765" y="455.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">far above our poor power to</text><rect x="288.93553" y="432.5" width="142.04469999999998" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="359.95788000000005" y="455.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">add or detract.</text><text x="359.95788000000005" y="489" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">paired opposites</text><rect x="30" y="521.8" width="840" height="54.440000000000055" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="554.25" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A rhythm of solemn denial, then the turn: what the living <tspan font-weight="700">cannot</tspan> do, the dead <tspan font-weight="700">already</tspan> <tspan font-weight="700">did</tspan>.</text>
</svg>