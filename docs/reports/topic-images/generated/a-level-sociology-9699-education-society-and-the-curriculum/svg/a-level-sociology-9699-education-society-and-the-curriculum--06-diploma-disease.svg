<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 683" width="900" height="683" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="683" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dore: the diploma disease</text>

<text x="450" y="112" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Dore, The Diploma Disease (1976)</text><path d="M559.0622016037335,212.92978098018867 A160,160 0 0 1 596.0942304499694,264.7583275104688" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M596.0942304499694,395.2416724895312 A160,160 0 0 1 559.0622016037335,447.07021901981136" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M340.93779839626654,447.07021901981136 A160,160 0 0 1 303.90576955003064,395.24167248953125" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M303.90576955003064,264.7583275104688 A160,160 0 0 1 340.9377983962665,212.92978098018867" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="340" y="132" width="220" height="76" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="164" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More people gain</text><text x="450" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">a qualification</text><rect x="524" y="292" width="220" height="76" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="634" y="324" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Employers ask for</text><text x="634" y="350" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">a higher one</text><rect x="340" y="452" width="220" height="76" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="484" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Each qualification</text><text x="450" y="510" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">is worth less</text><rect x="156" y="292" width="220" height="76" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="266" y="324" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">People seek</text><text x="266" y="350" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">higher credentials</text><text x="450" y="336" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">qualification</text><text x="450" y="360" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">inflation</text><rect x="30" y="548" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="584" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Consequence</text><text x="56" y="613" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gaining a qualification may improve life chances less than before. Expanding education</text><text x="56" y="635" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">alone does not equalise chances if every group gains more qualifications.</text>
</svg>