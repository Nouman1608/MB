<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Absolute and relative mobility</text>

<text x="275" y="132" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Occupational structure (schematic)</text><rect x="60" y="150" width="160" height="300" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="60" y="150" width="160" height="105" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="208.5" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">middle-class jobs</text><text x="140" y="358.5" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">working-class jobs</text><text x="140" y="480" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Earlier</text><rect x="330" y="150" width="160" height="300" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="330" y="150" width="160" height="180" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="410" y="246" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">middle-class jobs</text><text x="410" y="396" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">working-class jobs</text><text x="410" y="480" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Later</text><line x1="230" y1="300" x2="320" y2="300" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="275" y="290" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">more</text><text x="275" y="322" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">office jobs</text><rect x="540" y="140" width="330" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="540" y="140" width="10" height="140" rx="4" fill="#2e6b62"/><text x="566" y="174" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Absolute mobility rose</text><text x="566" y="202" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The total amount of upward movement</text><text x="566" y="223" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grew as the occupational structure</text><text x="566" y="244" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">changed.</text><rect x="540" y="296" width="330" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="540" y="296" width="10" height="140" rx="4" fill="#b5602e"/><text x="566" y="330" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Relative mobility stable</text><text x="566" y="358" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Middle-class children kept their</text><text x="566" y="379" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">head start: class background still</text><text x="566" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mattered.</text><rect x="30" y="500" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="536" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Goldthorpe et al.: Oxford Mobility Study (1972; reported 1980)</text><circle cx="61" cy="559.39" r="4.5" fill="#8a6d0d"/><text x="74" y="565" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cohorts born in 1958 and 1970: family background did not weaken and may have strengthened</text><circle cx="61" cy="589.39" r="4.5" fill="#8a6d0d"/><text x="74" y="595" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Great Gatsby curve” (Krueger, 2012): more unequal countries tend to have less mobility</text><text x="74" y="617" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">between generations</text>
</svg>