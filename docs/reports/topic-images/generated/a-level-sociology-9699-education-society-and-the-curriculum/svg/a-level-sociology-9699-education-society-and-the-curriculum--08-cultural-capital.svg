<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cultural capital and the curriculum</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Three forms of cultural capital (Bourdieu, 1986)</text><rect x="30" y="140" width="269.3333333333333" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,190 L31.25,154.25 Q31.25,141.25 44.25,141.25 L285.0833333333333,141.25 Q298.0833333333333,141.25 298.0833333333333,154.25 L298.0833333333333,190 Z" fill="#b5d3cf"/><line x1="31.25" y1="190" x2="298.0833333333333" y2="190" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="170.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Embodied</text><text x="44" y="223.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Manner, speech, tastes</text><rect x="315.3333333333333" y="140" width="269.3333333333333" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,190 L316.5833333333333,154.25 Q316.5833333333333,141.25 329.5833333333333,141.25 L570.4166666666666,141.25 Q583.4166666666666,141.25 583.4166666666666,154.25 L583.4166666666666,190 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="190" x2="583.4166666666666" y2="190" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="170.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Objectified</text><text x="329.3333333333333" y="223.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Books, art, instruments</text><rect x="600.6666666666666" y="140" width="269.3333333333333" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,190 L601.9166666666666,154.25 Q601.9166666666666,141.25 614.9166666666666,141.25 L855.75,141.25 Q868.75,141.25 868.75,154.25 L868.75,190 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="190" x2="868.75" y2="190" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="170.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Institutionalised</text><text x="614.6666666666666" y="223.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Qualifications</text><rect x="30" y="278" width="250.66666666666666" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="155.33333333333331" y="322.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Habitus</text><text x="155.33333333333331" y="352.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">tastes and dispositions</text><text x="155.33333333333331" y="373.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">learned early at home</text><line x1="284.66666666666663" y1="343" x2="320.66666666666663" y2="343" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="278" width="250.66666666666666" height="130" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="322.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Curriculum and tests</text><text x="449.99999999999994" y="352.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">reward middle-class cultural</text><text x="449.99999999999994" y="373.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">capital</text><line x1="579.3333333333333" y1="343" x2="615.3333333333333" y2="343" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="278" width="250.66666666666666" height="130" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="744.6666666666666" y="310.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Middle-class pupils</text><text x="744.6666666666666" y="334.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">start ahead</text><text x="744.6666666666666" y="364.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">home advantage becomes</text><text x="744.6666666666666" y="385.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">qualifications</text><rect x="30" y="430" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="466" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Remember</text><text x="56" y="495" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cultural capital is cultural knowledge and dispositions, not money. Pupils can also gain</text><text x="56" y="517" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cultural capital at school.</text>
</svg>