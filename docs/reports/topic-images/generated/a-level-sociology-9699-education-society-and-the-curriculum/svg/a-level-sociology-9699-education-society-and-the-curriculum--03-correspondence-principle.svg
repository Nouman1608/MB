<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bowles and Gintis: the correspondence principle</text>

<rect x="30" y="108" width="370" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="215" y="144" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">School</text><rect x="500" y="108" width="370" height="56" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="685" y="144" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Work</text><rect x="30" y="184" width="370" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="215" y="233" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Pupils accept teachers’ authority</text><rect x="500" y="184" width="370" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="685" y="233" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Workers accept managers’ authority</text><line x1="406" y1="227" x2="494" y2="227" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><line x1="420" y1="227" x2="400" y2="227" stroke="#8a6d0d" stroke-width="3.5"/><text x="450" y="216" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">mirrors</text><rect x="30" y="288" width="370" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="215" y="337" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Pupils work for grades</text><rect x="500" y="288" width="370" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="685" y="337" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Workers work for wages</text><line x1="406" y1="331" x2="494" y2="331" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><line x1="420" y1="331" x2="400" y2="331" stroke="#8a6d0d" stroke-width="3.5"/><text x="450" y="320" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">mirrors</text><rect x="30" y="392" width="370" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="215" y="430" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Higher grades for perseverance,</text><text x="215" y="454" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">consistency, punctuality</text><rect x="500" y="392" width="370" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="685" y="430" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Prepares an obedient, compliant</text><text x="685" y="454" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">workforce</text><line x1="406" y1="435" x2="494" y2="435" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><line x1="420" y1="435" x2="400" y2="435" stroke="#8a6d0d" stroke-width="3.5"/><text x="450" y="424" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">mirrors</text><rect x="30" y="502" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,552 L31.25,516.25 Q31.25,503.25 44.25,503.25 L427.75,503.25 Q440.75,503.25 440.75,516.25 L440.75,552 Z" fill="#f2e7b8"/><line x1="31.25" y1="552" x2="440.75" y2="552" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="532.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Myth of meritocracy</text><text x="44" y="583.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Schools claim to reward ability fairly but</text><text x="44" y="604.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reproduce inequality.</text><rect x="458" y="502" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,552 L459.25,516.25 Q459.25,503.25 472.25,503.25 L855.75,503.25 Q868.75,503.25 868.75,516.25 L868.75,552 Z" fill="#dce9e7"/><line x1="459.25" y1="552" x2="868.75" y2="552" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="532.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Willis (1977)</text><text x="472" y="583.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“The lads” resisted school, challenging passive</text><text x="472" y="604.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pupils, yet still ended up in manual jobs.</text>
</svg>