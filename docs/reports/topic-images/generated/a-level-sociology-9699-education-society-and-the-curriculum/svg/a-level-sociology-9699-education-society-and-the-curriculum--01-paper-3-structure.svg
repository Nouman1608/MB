<rect width="900" height="785" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Paper 3 Education works</text>

<rect x="30" y="108" width="268" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="154" font-size="25" font-weight="700" fill="#2e6b62" text-anchor="middle">1 h 15 min</text><rect x="316" y="108" width="268" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="154" font-size="25" font-weight="700" fill="#2e6b62" text-anchor="middle">50 marks</text><rect x="602" y="108" width="268" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="142" font-size="25" font-weight="700" fill="#2e6b62" text-anchor="middle">21%</text><text x="736" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of the A Level</text><rect x="30" y="450" width="201" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="130.5" y="484" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Q1</text><text x="130.5" y="550" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Short answer</text><text x="130.5" y="624" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">AO1</text><rect x="243" y="420" width="201" height="100" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="343.5" y="454" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Q2</text><text x="343.5" y="550" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Two explanations for an</text><text x="343.5" y="571" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">issue, theory or</text><text x="343.5" y="592" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">viewpoint</text><text x="343.5" y="624" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">AO1, AO2</text><rect x="456" y="390" width="201" height="130" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="556.5" y="424" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Q3</text><text x="556.5" y="550" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Two arguments against a</text><text x="556.5" y="571" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">view in a quotation</text><text x="556.5" y="624" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">AO2, AO3</text><rect x="669" y="280" width="201" height="240" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="769.5" y="314" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Q4</text><text x="769.5" y="550" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Essay: 26 marks</text><text x="769.5" y="624" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">AO1, AO2, AO3</text><text x="30" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Four compulsory questions, increasing in marks</text><line x1="30" y1="520" x2="870" y2="520" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="650" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="686" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assessment objective weightings</text><text x="56" y="715" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">AO1 36%, AO2 28%, AO3 36%. Command words: Describe, Evaluate, Explain, Give. Your teacher</text><text x="56" y="737" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">will confirm how the other 24 marks are split.</text>
</svg>