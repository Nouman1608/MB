<rect width="900" height="619" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Parsons: school as a bridge</text>

<rect x="30" y="160" width="250" height="300" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M31.25,219.25 L31.25,175.25 Q31.25,161.25 45.25,161.25 L264.75,161.25 Q278.75,161.25 278.75,175.25 L278.75,219.25 Z" fill="#f2e7b8"/><text x="155" y="199" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Family</text><text x="155" y="262" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Particularistic</text><text x="155" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">judged as a unique person</text><text x="155" y="366" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Ascribed status</text><text x="155" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">fixed at birth</text><path d="M300,250 L560,250 L560,220 L612,310 L560,400 L560,370 L300,370 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="440" y="300" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">School</text><text x="440" y="328" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the bridge</text><rect x="620" y="160" width="250" height="300" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M621.25,219.25 L621.25,175.25 Q621.25,161.25 635.25,161.25 L854.75,161.25 Q868.75,161.25 868.75,175.25 L868.75,219.25 Z" fill="#b5d3cf"/><text x="745" y="199" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Wider society</text><text x="745" y="262" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Universalistic</text><text x="745" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">everyone judged by the same</text><text x="745" y="309" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">standards</text><text x="745" y="366" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Achieved status</text><text x="745" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">earned through effort and</text><text x="745" y="413" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">ability</text><text x="450" y="132" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Parsons: school teaches the standards of adult society</text><rect x="30" y="484" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="520" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Role allocation (Davis and Moore, 1945)</text><text x="56" y="549" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Exams sift and sort pupils so the most able reach the most important positions. Tumin: higher</text><text x="56" y="571" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pay does not prove a job is more important.</text>
</svg>