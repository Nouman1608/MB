<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 541" width="900" height="541" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="541" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What shapes the curriculum?</text>

<rect x="30" y="108" width="140" height="54" rx="27" fill="#1e2a44"/><text x="100" y="142" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Power</text><line x1="100" y1="166" x2="327.5" y2="214" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="180" y="108" width="140" height="54" rx="27" fill="#1e2a44"/><text x="250" y="142" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Status</text><line x1="250" y1="166" x2="380" y2="214" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="330" y="108" width="150" height="54" rx="27" fill="#1e2a44"/><text x="405" y="142" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Culture</text><line x1="405" y1="166" x2="434.25" y2="214" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="490" y="108" width="220" height="54" rx="27" fill="#1e2a44"/><text x="600" y="142" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Economic demands</text><line x1="600" y1="166" x2="502.5" y2="214" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="720" y="108" width="150" height="54" rx="27" fill="#1e2a44"/><text x="795" y="142" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Gender</text><line x1="795" y1="166" x2="570.75" y2="214" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="230" y="218" width="440" height="66" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="250" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Content of the curriculum</text><text x="450" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">not neutral (Apple, 1979)</text><line x1="336" y1="288" x2="165" y2="324" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="288" x2="450" y2="324" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="564" y1="288" x2="735" y2="324" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="328" width="269.3333333333333" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,378 L31.25,342.25 Q31.25,329.25 44.25,329.25 L285.0833333333333,329.25 Q298.0833333333333,329.25 298.0833333333333,342.25 L298.0833333333333,378 Z" fill="#f2e7b8"/><line x1="31.25" y1="378" x2="298.0833333333333" y2="378" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="358.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnocentric</text><text x="44" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prioritises one ethnic</text><text x="44" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">group’s culture, history and</text><text x="44" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">language. <tspan font-weight="700">Coard (1971):</tspan> West</text><text x="44" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Indian children’s culture</text><text x="44" y="493.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treated as second-rate.</text><rect x="315.3333333333333" y="328" width="269.3333333333333" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,378 L316.5833333333333,342.25 Q316.5833333333333,329.25 329.5833333333333,329.25 L570.4166666666666,329.25 Q583.4166666666666,329.25 583.4166666666666,342.25 L583.4166666666666,378 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="378" x2="583.4166666666666" y2="378" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="358.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Gendered</text><text x="329.3333333333333" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Follows gender stereotypes.</text><text x="329.3333333333333" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Spender (1982):</tspan> women’s</text><text x="329.3333333333333" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contributions left out or</text><text x="329.3333333333333" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">played down.</text><rect x="600.6666666666666" y="328" width="269.3333333333333" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,378 L601.9166666666666,342.25 Q601.9166666666666,329.25 614.9166666666666,329.25 L855.75,329.25 Q868.75,329.25 868.75,342.25 L868.75,378 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="378" x2="868.75" y2="378" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="358.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hidden</text><text x="614.6666666666666" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Learned from how school is</text><text x="614.6666666666666" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">organised: obedience,</text><text x="614.6666666666666" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">punctuality, competition.</text><text x="614.6666666666666" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Jackson (1968)</tspan> coined the</text><text x="614.6666666666666" y="493.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">term.</text>
</svg>