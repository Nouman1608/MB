<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When a business faces little competition</text>

<text x="180" y="128" font-size="19" font-weight="700" fill="#4a5568" text-anchor="middle">Situations</text><rect x="30" y="145" width="300" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="177.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Location</text><text x="48" y="208.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">only shop in a remote village</text><path d="M330,188 C365,188 360,400 390,400" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="247" width="300" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="279.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">New invention</text><text x="48" y="310.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">perhaps protected by a patent</text><path d="M330,290 C365,290 360,400 390,400" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="349" width="300" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="381.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">High start-up costs</text><text x="48" y="412.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. railways, water supply</text><path d="M330,392 C365,392 360,400 390,400" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="451" width="300" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="472.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Government licences</text><text x="48" y="503.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">only licensed firms may</text><text x="48" y="524.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">operate</text><path d="M330,494 C365,494 360,400 390,400" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="553" width="300" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="585.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A dominant business</text><text x="48" y="616.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">strong brand, low costs</text><path d="M330,596 C365,596 360,400 390,400" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="392" y="320" width="166" height="160" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="475" y="375.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Little or</text><text x="475" y="402.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">no</text><text x="475" y="429.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">competition</text><line x1="558" y1="370" x2="592" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="558" y1="430" x2="592" y2="500" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="595" y="145" width="275" height="250" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615" y="180" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Benefits</text><text x="615" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Can usually charge</text><text x="615" y="237" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">higher prices and earn</text><text x="615" y="260" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">higher profits</text><text x="615" y="295" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Less pressure to spend</text><text x="615" y="318" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">on promotion</text><rect x="595" y="410" width="275" height="240" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="615" y="445" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Drawbacks</text><text x="615" y="479" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• May become complacent:</text><text x="615" y="502" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">quality and service slip</text><text x="615" y="539" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">• High profits attract</text><text x="615" y="562" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">new rivals</text><path d="M735,650 L735,690 L475,690 L475,486" fill="none" stroke="#b5602e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahR)" stroke-dasharray="9 6"/><text x="605" y="714" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">competition arrives (as at Hartwell Fitness)</text>
</svg>