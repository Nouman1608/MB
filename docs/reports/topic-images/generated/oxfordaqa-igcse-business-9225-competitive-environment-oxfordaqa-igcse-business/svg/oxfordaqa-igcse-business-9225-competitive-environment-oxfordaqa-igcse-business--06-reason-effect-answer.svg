<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Turning a statement into an explanation</text>

<text x="450" y="128" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Explain two reasons why a new café faces uncertainty.</text><circle cx="62" cy="230" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="238.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="100" y="160" width="340" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="194" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Reason</text><text x="118" y="224" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Customers’ tastes can change, so</text><text x="118" y="247" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a menu that sells well this year</text><text x="118" y="270" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">may not sell next year</text><line x1="444" y1="230" x2="486" y2="230" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="490" y="160" width="380" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="508" y="194" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Effect on the café</text><text x="508" y="224" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sales are difficult to predict</text><circle cx="62" cy="400" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="408.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="100" y="330" width="340" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="364" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Reason</text><text x="118" y="394" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Another café may open on the same</text><text x="118" y="417" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">street</text><line x1="444" y1="400" x2="486" y2="400" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="490" y="330" width="380" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="508" y="364" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Effect on the café</text><text x="508" y="394" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">It takes some customers and forces</text><text x="508" y="417" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">price cuts, so profit is uncertain</text><rect x="100" y="500" width="770" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="543" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">reason  +  its effect on the business  =  an explanation</text><text x="485" y="604" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">A reason on its own is only a statement.</text>
</svg>