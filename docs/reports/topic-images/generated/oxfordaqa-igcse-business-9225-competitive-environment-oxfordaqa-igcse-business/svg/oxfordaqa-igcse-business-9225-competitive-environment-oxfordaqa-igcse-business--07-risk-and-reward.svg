<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 919" width="900" height="919" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="919" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing risk against reward</text>

<path d="M424,250 L450,196 L476,250 Z" fill="#1e2a44"/><line x1="160" y1="186" x2="740" y2="206" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><line x1="220" y1="188" x2="220" y2="240" stroke="#1e2a44" stroke-width="2.5"/><line x1="705" y1="205" x2="705" y2="240" stroke="#1e2a44" stroke-width="2.5"/><text x="220" y="150" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">RISK</text><text x="705" y="150" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">REWARD</text><rect x="30" y="240" width="380" height="96" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="220" y="277.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A chance of a loss</text><text x="220" y="308.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the idea may fail</text><rect x="540" y="240" width="330" height="420" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="560" y="276" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Why entrepreneurs start</text><rect x="560" y="296" width="290" height="58" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="574" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Earn a profit, or more than in a</text><text x="574" y="341" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">job</text><rect x="560" y="366" width="290" height="58" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="574" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Independence: be their own boss</text><rect x="560" y="436" width="290" height="58" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="574" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Turn an idea or passion into a</text><text x="574" y="481" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">product</text><rect x="560" y="506" width="290" height="58" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="574" y="541" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Flexibility in working life</text><rect x="560" y="576" width="290" height="58" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="574" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Help others through a social or</text><text x="574" y="621" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ethical aim</text><line x1="56" y1="392" x2="56" y2="342" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="74" y="376" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start" font-style="italic">made smaller (never removed) by:</text><rect x="30" y="396" width="380" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="424" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Market research</text><text x="396" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">checks demand first</text><rect x="30" y="448" width="380" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="476" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">A business plan</text><text x="396" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">spots problems early</text><rect x="30" y="500" width="380" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="528" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Start small or test</text><text x="396" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">limits losses</text><rect x="30" y="552" width="380" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="580" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Insurance</text><text x="396" y="580" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">covers fire, theft, accidents</text><rect x="30" y="604" width="380" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="632" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Spreading risk</text><text x="396" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">one failure is not fatal</text><rect x="30" y="656" width="380" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="684" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Cash reserves</text><text x="396" y="684" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">survive a bad month</text><rect x="30" y="708" width="380" height="44" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="736" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Supplier agreements</text><text x="396" y="736" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">secure supplies, prices</text><rect x="30" y="780" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="820" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The possible reward is what makes the risk worth taking.</text><text x="56" y="847" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Risk-reducing activities lower the chance or the size of a loss; none removes it</text><text x="56" y="870" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">completely.</text>
</svg>