<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why every business faces uncertainty</text>

<rect x="30" y="110" width="410" height="110" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="141.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Risk</text><text x="48" y="175.8" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the chance that something will go wrong and</text><text x="48" y="198.8" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">cause a loss</text><rect x="460" y="110" width="410" height="110" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="153.3" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Uncertainty</text><text x="478" y="187.3" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the future cannot be known</text><circle cx="450" cy="470" r="98" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="458" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">All businesses</text><text x="450" y="484" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">face uncertainty</text><rect x="30" y="260" width="270" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="294" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Customers</text><text x="48" y="325" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tastes and spending change</text><text x="48" y="346" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with fashion, technology or</text><text x="48" y="367" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">income</text><line x1="300" y1="325" x2="352" y2="430" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="260" width="270" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="294" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Competitors</text><text x="618" y="325" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">actions cannot be predicted:</text><text x="618" y="346" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a new rival or a price cut</text><line x1="600" y1="325" x2="548" y2="430" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="490" width="270" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="524" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The economy</text><text x="48" y="555" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interest rates, employment</text><text x="48" y="576" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or exchange rates change</text><line x1="300" y1="555" x2="352" y2="505" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="490" width="270" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="524" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Laws and regulations</text><text x="618" y="555" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">can change</text><line x1="600" y1="555" x2="548" y2="505" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="300" y="610" width="300" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="644" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Unexpected events</text><text x="450" y="675" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">floods, fires or supply problems</text><line x1="450" y1="610" x2="450" y2="568" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>