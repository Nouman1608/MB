<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 726" width="900" height="726" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="726" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How developing countries compete</text>

<rect x="30" y="120" width="180" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="120" y="162.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower wages,</text><text x="120" y="187.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">cheaper land,</text><text x="120" y="212.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">lower rents</text><line x1="214" y1="185" x2="246" y2="185" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="120" width="180" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="340" y="162.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower</text><text x="340" y="187.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">production</text><text x="340" y="212.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">costs</text><line x1="434" y1="185" x2="466" y2="185" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="120" width="180" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="560" y="187.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower prices</text><line x1="654" y1="185" x2="686" y2="185" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="120" width="180" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="780" y="175.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Win orders on</text><text x="780" y="200.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">price</text><text x="450" y="286" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. clothing, furniture and food products</text><rect x="30" y="316" width="840" height="180" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="352" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Other ways to compete</text><rect x="56" y="370" width="250" height="108" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="74" y="402" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Specialise</text><text x="74" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in products the country is</text><text x="74" y="453" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">well placed to make</text><rect x="326" y="370" width="250" height="108" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="344" y="402" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Improve quality</text><text x="344" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to meet foreign buyers’</text><text x="344" y="453" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">standards</text><rect x="596" y="370" width="250" height="108" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="614" y="402" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Use e-commerce</text><text x="614" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to reach customers abroad</text><text x="614" y="453" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">directly</text><rect x="30" y="516" width="840" height="180" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="56" y="552" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Challenges</text><rect x="56" y="570" width="250" height="108" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="74" y="602" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Transport costs</text><text x="74" y="632" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">higher to distant markets</text><rect x="326" y="570" width="250" height="108" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="344" y="602" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Brands</text><text x="344" y="632" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">less well known</text><rect x="596" y="570" width="250" height="108" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="614" y="602" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Other rivals</text><text x="614" y="632" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">developing countries with</text><text x="614" y="653" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">even lower costs</text>
</svg>