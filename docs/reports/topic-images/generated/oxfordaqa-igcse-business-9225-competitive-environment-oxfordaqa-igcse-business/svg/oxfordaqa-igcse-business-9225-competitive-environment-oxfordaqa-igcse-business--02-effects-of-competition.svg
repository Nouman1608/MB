<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What strong competition does to a business</text>

<rect x="250" y="110" width="400" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="140.3" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Strong competition</text><text x="450" y="174.3" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">customers can switch to a rival</text><line x1="450" y1="194" x2="450" y2="222" stroke="#1e2a44" stroke-width="3"/><line x1="170" y1="222" x2="730" y2="222" stroke="#1e2a44" stroke-width="3"/><line x1="170" y1="222" x2="170" y2="246" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="250" width="260" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Price</text><text x="48" y="321" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Cannot raise prices</text><text x="48" y="344" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">easily; may have to cut</text><text x="48" y="367" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">them</text><line x1="460" y1="222" x2="460" y2="246" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="250" width="260" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="338" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Quality and service</text><text x="338" y="321" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Must keep improving to</text><text x="338" y="344" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">stop customers leaving</text><line x1="750" y1="222" x2="750" y2="246" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="610" y="250" width="260" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="628" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">New products</text><text x="628" y="321" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pressure to innovate and</text><text x="628" y="344" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">offer what rivals do not</text><rect x="30" y="400" width="260" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="438" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Costs</text><text x="48" y="471" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">More spent on promotion;</text><text x="48" y="494" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">cut costs elsewhere</text><rect x="320" y="400" width="260" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="338" y="438" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Profit</text><text x="338" y="471" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Lower margins, because</text><text x="338" y="494" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">prices are held down</text><rect x="610" y="400" width="260" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="628" y="438" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Survival</text><text x="628" y="471" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Weaker businesses may</text><text x="628" y="494" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">close or be forced out</text><rect x="30" y="560" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="598" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Businesses respond by competing on:</text><rect x="56" y="620" width="77" height="44" rx="22" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="94.5" y="648" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">price</text><rect x="145" y="620" width="95.8" height="44" rx="22" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="192.9" y="648" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">quality</text><rect x="252.8" y="620" width="161.6" height="44" rx="22" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="333.6" y="648" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">unique feature</text><rect x="426.4" y="620" width="180.4" height="44" rx="22" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="516.6" y="648" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">customer service</text><rect x="618.8" y="620" width="105.2" height="44" rx="22" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="671.4" y="648" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">location</text><rect x="736" y="620" width="77" height="44" rx="22" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="774.5" y="648" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">brand</text><text x="56" y="692" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Not all bad: rivalry pushes managers to be efficient and improve products.</text>
</svg>