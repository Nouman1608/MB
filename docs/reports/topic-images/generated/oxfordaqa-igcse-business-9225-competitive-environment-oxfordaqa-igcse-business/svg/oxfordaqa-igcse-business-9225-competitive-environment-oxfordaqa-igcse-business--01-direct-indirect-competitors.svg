<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 839" width="900" height="839" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="839" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who competes with a cinema?</text>

<rect x="30" y="110" width="840" height="560" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="148" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="start">Indirect competitors</text><text x="56" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">compete for the same customers’ leisure money</text><rect x="90" y="200" width="720" height="290" rx="16" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="116" y="238" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Direct competitors</text><text x="116" y="266" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sell the same product</text><rect x="130" y="300" width="190" height="150" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="382" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Other cinema</text><rect x="355" y="300" width="190" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="382" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Our cinema</text><rect x="580" y="300" width="190" height="150" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="382" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Other cinema</text><text x="450" y="425" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">the business</text><rect x="60" y="520" width="240" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="587" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Streaming services</text><rect x="330" y="520" width="240" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="587" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Bowling alleys</text><rect x="600" y="520" width="240" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="587" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Restaurants</text><rect x="30" y="700" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="740" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Look beyond the obvious rivals.</text><text x="56" y="767" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Noticing indirect competition, not only businesses selling the same product, often</text><text x="56" y="790" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">strengthens an answer.</text>
</svg>