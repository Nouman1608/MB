<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 879" width="900" height="879" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="879" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hartwell Fitness: a budget gym opens</text>

<rect x="30" y="110" width="500" height="600" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Monthly revenue</text><line x1="110" y1="610" x2="505" y2="610" stroke="#c9d6d4" stroke-width="1.5"/><text x="100" y="616" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="110" y1="470" x2="505" y2="470" stroke="#c9d6d4" stroke-width="1.5"/><text x="100" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$10,000</text><line x1="110" y1="330" x2="505" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><text x="100" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$20,000</text><line x1="110" y1="190" x2="505" y2="190" stroke="#c9d6d4" stroke-width="1.5"/><text x="100" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$30,000</text><line x1="110" y1="610" x2="505" y2="610" stroke="#1e2a44" stroke-width="2.5"/><line x1="110" y1="180" x2="110" y2="610" stroke="#1e2a44" stroke-width="2.5"/><rect x="135" y="218" width="95" height="392" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="182.5" y="208" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$28,000</text><text x="182.5" y="638" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Now</text><text x="182.5" y="660" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">only gym</text><rect x="260" y="344" width="95" height="266" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="307.5" y="334" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$19,000</text><text x="307.5" y="638" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Option 1</text><text x="307.5" y="660" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">match $25</text><rect x="385" y="335.6" width="95" height="274.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="432.5" y="325.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$19,600</text><text x="432.5" y="638" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Option 2</text><text x="432.5" y="660" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">keep $35</text><line x1="110" y1="218" x2="505" y2="218" stroke="#2e6b62" stroke-width="2" stroke-dasharray="7 6"/><rect x="550" y="110" width="320" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="570" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Now: 800 members</text><text x="570" y="174" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">800 × $35 = $28,000</text><rect x="550" y="250" width="320" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="570" y="284" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Option 1: cut to $25</text><text x="570" y="314" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">keep 760 members</text><text x="570" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">760 × $25 = $19,000</text><text x="570" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fall of $9,000</text><rect x="550" y="410" width="320" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="570" y="444" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Option 2: keep $35</text><text x="570" y="474" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lose 30%: 800 × 0.70 = 560</text><text x="570" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">560 × $35 = $19,600</text><text x="570" y="526" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fall of $8,400</text><rect x="550" y="600" width="320" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="570" y="634" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Difference</text><text x="570" y="664" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">$19,600 − $19,000 = $600</text><text x="570" y="690" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">more for option 2</text><rect x="30" y="740" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="780" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Either way, revenue falls by more than $8,000 a month.</text><text x="56" y="807" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Option 2 earns slightly more, but only if the 30% loss forecast is right. A third</text><text x="56" y="830" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">route is to compete on classes or personal training instead of price.</text>
</svg>