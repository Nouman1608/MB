<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" width="900" height="565" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Systems: input, process, output, feedback</text>

<rect x="40" y="160" width="240" height="150" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="205" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Input</text><text x="160" y="245" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">soil moisture</text><text x="160" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">sensor reading</text><line x1="284" y1="235" x2="326" y2="235" stroke="#1e2a44" stroke-width="4.5" marker-end="url(#ah)"/><rect x="330" y="160" width="240" height="150" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="205" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Process</text><text x="450" y="245" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">microcontroller compares</text><text x="450" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">with a set level</text><line x1="574" y1="235" x2="616" y2="235" stroke="#1e2a44" stroke-width="4.5" marker-end="url(#ah)"/><rect x="620" y="160" width="240" height="150" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="740" y="205" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Output</text><text x="740" y="245" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">valve opens,</text><text x="740" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">water flows</text><path d="M740,312 L740,390 L160,390 L160,316" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 8" marker-end="url(#ahO)"/><rect x="260" y="362" width="380" height="56" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="397" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Feedback: reading rises, valve closes</text><text x="450" y="135" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">A plant-watering system for a school garden</text><rect x="30" y="450" width="840" height="90" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="55" y="486" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Systems thinking</text><text x="55" y="516" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">one failed part, such as a flat sensor battery, stops the whole system</text>
</svg>