<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Adaptation, invention and innovation</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Adaptation</text><text x="200" y="148" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">name the original, the new need and the change</text><text x="150" y="184" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Original</text><text x="420" y="184" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">New need or use</text><text x="690" y="184" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Change</text><rect x="50" y="196" width="200" height="38" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="150" y="220.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">plant burrs cling to fur</text><line x1="252" y1="215" x2="316" y2="215" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="320" y="196" width="200" height="38" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="420" y="220.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">a fastening</text><line x1="522" y1="215" x2="586" y2="215" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="590" y="196" width="200" height="38" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="690" y="220.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">hook-and-loop</text><rect x="50" y="242" width="200" height="38" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="150" y="266.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">standard cutlery</text><line x1="252" y1="261" x2="316" y2="261" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="320" y="242" width="200" height="38" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="420" y="266.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">limited grip</text><line x1="522" y1="261" x2="586" y2="261" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="590" y="242" width="200" height="38" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="690" y="266.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">thick, soft handles</text><rect x="50" y="288" width="200" height="38" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="150" y="312.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">desktop website</text><line x1="252" y1="307" x2="316" y2="307" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="320" y="288" width="200" height="38" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="420" y="312.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">small screen</text><line x1="522" y1="307" x2="586" y2="307" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="590" y="288" width="200" height="38" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="690" y="312.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">layout rearranges</text><rect x="30" y="360" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="398" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Invention or innovation?</text><rect x="55" y="420" width="250" height="150" rx="12" fill="#e6e8ea" stroke="#4a5568" stroke-width="2.2"/><text x="180" y="456" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Invention</text><text x="180" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">creating something</text><text x="180" y="507" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">new that may never</text><text x="180" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">be adopted</text><line x1="310" y1="495" x2="350" y2="495" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="355" y="420" width="490" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="600" y="456" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Innovation</text><text x="600" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a new idea, or new combination of</text><text x="600" y="507" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">ideas, put into successful use</text><rect x="55" y="590" width="385" height="84" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="75" y="620" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Incremental</text><text x="75" y="648" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">suitcase gains wheels and a handle</text><rect x="460" y="590" width="385" height="84" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="480" y="620" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Radical</text><text x="480" y="648" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">touchscreens replace phone keypads</text><text x="450" y="716" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">For innovation, say what was new, what it solved and why people adopted it.</text>
</svg>