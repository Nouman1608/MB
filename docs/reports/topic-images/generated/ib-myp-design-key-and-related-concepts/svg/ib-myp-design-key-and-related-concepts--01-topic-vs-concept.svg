t="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="667" y="354.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">door handles</text><line x1="600" y1="262" x2="794" y2="320" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="736" y="326" width="118" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="795" y="354.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">phone apps</text><rect x="30" y="430" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="466" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Concepts let you transfer what you learn in one project to the next,</text><text x="450" y="494" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">which is why the course asks factual, conceptual and debatable questions.</text>
