<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: sizing from percentiles</text>

<rect x="30" y="110" width="520" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="60" y1="520" x2="520" y2="520" stroke="#1e2a44" stroke-width="3"/><rect x="150" y="300" width="200" height="22" rx="4" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="176" y="322" width="18" height="198" rx="2" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="306" y="322" width="18" height="198" rx="2" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="150" y="230" width="200" height="22" rx="4" fill="none" stroke-dasharray="8 6" stroke="#1e2a44" stroke-width="2"/><path d="M380,520 L380,302" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)" marker-start="url(#ahO)"/><text x="392" y="420" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">405 mm</text><text x="392" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">lowest</text><path d="M490,520 L490,232" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)" marker-start="url(#ahR)"/><text x="490" y="220" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">485 mm</text><text x="480" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">highest</text><path d="M125,232 L125,298" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="112" y="262" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">80 mm</text><text x="112" y="282" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">travel</text><text x="55" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Adjustable stool (students 14–16)</text><text x="55" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">drawing not to scale</text><rect x="570" y="110" width="300" height="470" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="590" y="146" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Popliteal height</text><text x="590" y="178" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">5th: 380 mm</text><text x="590" y="203" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">95th: 460 mm</text><text x="590" y="228" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shoes: + 25 mm</text><line x1="590" y1="262" x2="850" y2="262" stroke="#2e6b62" stroke-width="2"/><text x="590" y="292" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">380 + 25 = 405 mm</text><text x="590" y="319" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">460 + 25 = 485 mm</text><text x="590" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">485 − 405 = 80 mm</text><text x="590" y="390" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fits the middle 90%</text><text x="590" y="412" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of that group</text><rect x="590" y="450" width="260" height="112" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.2"/><text x="605" y="478" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Handle (clearance):</text><text x="605" y="504" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">95th hand breadth 88 mm</text><text x="605" y="528" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">+ 10 mm allowance</text><text x="605" y="552" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">= 98 mm grip length</text>
</svg>