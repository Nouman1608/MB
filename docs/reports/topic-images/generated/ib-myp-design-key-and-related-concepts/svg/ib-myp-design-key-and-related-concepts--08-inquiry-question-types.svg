<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Factual, conceptual and debatable questions</text>

<rect x="30" y="110" width="220" height="134" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="168" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Factual</text><text x="140" y="196" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">has a checkable</text><text x="140" y="215" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">answer</text><rect x="265" y="110" width="605" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="287" y="150" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“What is the 95th percentile of hand breadth for my</text><text x="287" y="174" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">users?”</text><text x="287" y="226" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">→ feeds the research plan (criterion A)</text><rect x="30" y="260" width="220" height="134" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="318" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Conceptual</text><text x="140" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">how or why an idea</text><text x="140" y="365" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">works; links</text><text x="140" y="384" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">concepts</text><rect x="265" y="260" width="605" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="287" y="300" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“How does ergonomic data change who can use a product?”</text><text x="287" y="376" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">→ gives analysis depth</text><rect x="30" y="410" width="220" height="134" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="468" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Debatable</text><text x="140" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">reasonable people</text><text x="140" y="515" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">disagree</text><rect x="265" y="410" width="605" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="287" y="450" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Should a public bench be designed for comfort or to stop</text><text x="287" y="474" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">people lying down on it?”</text><text x="287" y="526" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">→ gives evaluation depth</text><rect x="30" y="570" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="606" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Debatable test: could two well-informed people disagree, both with evidence?</text><text x="55" y="640" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">✗ “Is plastic bad?”  too vague</text><text x="55" y="672" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">✓ “Should single-use cutlery be banned from school canteens?”</text>
</svg>