<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four key concepts in design</text>

<rect x="30" y="110" width="415" height="234" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="415" height="70" rx="14" fill="#dce9e7"/><rect x="30" y="160" width="415" height="20" fill="#dce9e7"/><rect x="30" y="110" width="415" height="234" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Communication</text><text x="52" y="168" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exchange of information</text><text x="52" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the product communicates: a kettle light,</text><text x="52" y="233" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a loading bar, airport pictograms</text><text x="52" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the designer communicates: folder,</text><text x="52" y="279" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sketches, specification, client</text><text x="52" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Ask: what must it tell, when, by which sense?</text><rect x="455" y="110" width="415" height="234" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="455" y="110" width="415" height="70" rx="14" fill="#f2e7b8"/><rect x="455" y="160" width="415" height="20" fill="#f2e7b8"/><rect x="455" y="110" width="415" height="234" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Communities</text><text x="477" y="168" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">groups sharing a place, need, interest or identity</text><text x="477" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a park seating area for older visitors,</text><text x="477" y="233" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parents with pushchairs and teenagers</text><text x="477" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a school app for students, staff, parents</text><text x="477" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Ask: who is included and who is left out?</text><rect x="30" y="360" width="415" height="234" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="360" width="415" height="70" rx="14" fill="#dce9e7"/><rect x="30" y="410" width="415" height="20" fill="#dce9e7"/><rect x="30" y="360" width="415" height="234" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="394" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Development</text><text x="52" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">growth, progress or change over time</text><text x="52" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of a product over generations:</text><text x="52" y="483" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">calls-only phone → pocket computer</text><text x="52" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of your own solution: sketch → model</text><text x="52" y="529" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">→ prototype, tested each round</text><text x="52" y="574" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Show what changed and why.</text><rect x="455" y="360" width="415" height="234" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="455" y="360" width="415" height="70" rx="14" fill="#f2e7b8"/><rect x="455" y="410" width="415" height="20" fill="#f2e7b8"/><rect x="455" y="360" width="415" height="234" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="394" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Systems</text><text x="477" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">parts working together for a function</text><text x="477" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">input → process → output,</text><text x="477" y="483" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">often with feedback</text><text x="477" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">websites and bike-sharing schemes</text><text x="477" y="574" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">One failed part can stop the whole thing.</text>
</svg>