<rect width="900" height="745" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a statement of inquiry</text>

<text x="450" y="132" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Unit: redesigning a school’s lunch-queue system</text><rect x="30" y="150" width="270" height="96" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="186" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Key concept</text><text x="165" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">systems</text><text x="307" y="205" font-size="24" font-weight="700" fill="#4a5568" text-anchor="middle">+</text><line x1="165" y1="250" x2="390" y2="290" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="315" y="150" width="270" height="96" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="186" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Related concepts</text><text x="450" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">ergonomics,</text><text x="450" y="235" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">sustainability</text><text x="592" y="205" font-size="24" font-weight="700" fill="#4a5568" text-anchor="middle">+</text><line x1="450" y1="250" x2="450" y2="290" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="150" width="270" height="96" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="186" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Global context</text><text x="735" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">globalization and</text><text x="735" y="235" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">sustainability</text><line x1="735" y1="250" x2="510" y2="290" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="300" width="840" height="92" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="336" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weak</text><text x="52" y="366" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“We will design a better lunch queue.”  No concept; not transferable.</text><rect x="30" y="410" width="840" height="190" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="446" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Stronger</text><text x="52" y="480" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Systems designed around how people actually move and wait</text><text x="52" y="507" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">use space, time and resources more efficiently.”</text><text x="52" y="568" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">systems ✓   ergonomics: how people move and wait ✓   sustainability: resources ✓</text><rect x="30" y="620" width="840" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="656" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Checks</text><text x="55" y="686" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a statement, not a question · transfers (hospital waiting room, train station) ·</text><text x="55" y="708" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">specific enough to guide research · names no product or brand</text>
</svg>