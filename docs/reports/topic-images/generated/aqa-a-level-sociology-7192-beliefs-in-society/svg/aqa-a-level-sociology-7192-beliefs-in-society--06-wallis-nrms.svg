<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 573" width="900" height="573" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="573" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Wallis’s new religious movements (1984)</text>

<line x1="60" y1="116" x2="840" y2="116" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="60" y1="116" x2="80" y2="116" stroke="#1e2a44" stroke-width="3.5" marker-start="url(#ah)"/><text x="60" y="104" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">critical of the world</text><text x="840" y="104" font-size="16" font-weight="600" fill="#4a5568" text-anchor="end">helps success in ordinary life</text><rect x="30" y="138" width="269.3333333333333" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,188 L31.25,152.25 Q31.25,139.25 44.25,139.25 L285.0833333333333,139.25 Q298.0833333333333,139.25 298.0833333333333,152.25 L298.0833333333333,188 Z" fill="#f2e7b8"/><line x1="31.25" y1="188" x2="298.0833333333333" y2="188" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="168.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">World-rejecting</text><text x="44" y="219.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">e.g. the Unification</text><text x="44" y="240.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Church</text><text x="44" y="267.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sect-like, demanding,</text><text x="44" y="288.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">critical of the world.</text><rect x="315.3333333333333" y="138" width="269.3333333333333" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,188 L316.5833333333333,152.25 Q316.5833333333333,139.25 329.5833333333333,139.25 L570.4166666666666,139.25 Q583.4166666666666,139.25 583.4166666666666,152.25 L583.4166666666666,188 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="188" x2="583.4166666666666" y2="188" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="168.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">World-accommodating</text><text x="329.3333333333333" y="219.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">e.g. neo-Pentecostalism</text><text x="329.3333333333333" y="246.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Often breakaways from</text><text x="329.3333333333333" y="267.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mainstream churches, aiming</text><text x="329.3333333333333" y="288.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to restore spiritual purity.</text><rect x="600.6666666666666" y="138" width="269.3333333333333" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,188 L601.9166666666666,152.25 Q601.9166666666666,139.25 614.9166666666666,139.25 L855.75,139.25 Q868.75,139.25 868.75,152.25 L868.75,188 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="188" x2="868.75" y2="188" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="168.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">World-affirming</text><text x="614.6666666666666" y="219.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">e.g. Scientology,</text><text x="614.6666666666666" y="240.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Transcendental Meditation</text><text x="614.6666666666666" y="267.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cult-like, offering spiritual</text><text x="614.6666666666666" y="288.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">powers that help people</text><text x="614.6666666666666" y="309.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">succeed in ordinary life.</text><text x="450" y="363" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Why do sects and NRMs grow?</text><rect x="30" y="379" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,429 L31.25,393.25 Q31.25,380.25 44.25,380.25 L285.0833333333333,380.25 Q298.0833333333333,380.25 298.0833333333333,393.25 L298.0833333333333,429 Z" fill="#ffffff"/><line x1="31.25" y1="429" x2="298.0833333333333" y2="429" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="409.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Weber</text><text x="44" y="460.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Theodicy of disprivilege:</text><text x="44" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sects explain and promise to</text><text x="44" y="502.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reward the suffering of</text><text x="44" y="523.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marginal groups.</text><rect x="315.3333333333333" y="379" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,429 L316.5833333333333,393.25 Q316.5833333333333,380.25 329.5833333333333,380.25 L570.4166666666666,380.25 Q583.4166666666666,380.25 583.4166666666666,393.25 L583.4166666666666,429 Z" fill="#ffffff"/><line x1="316.5833333333333" y1="429" x2="583.4166666666666" y2="429" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="409.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Stark and Bainbridge</text><text x="329.3333333333333" y="460.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Relative deprivation, and the</text><text x="329.3333333333333" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compensators religion offers.</text><rect x="600.6666666666666" y="379" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,429 L601.9166666666666,393.25 Q601.9166666666666,380.25 614.9166666666666,380.25 L855.75,380.25 Q868.75,380.25 868.75,393.25 L868.75,429 Z" fill="#ffffff"/><line x1="601.9166666666666" y1="429" x2="868.75" y2="429" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="409.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Wilson</text><text x="614.6666666666666" y="460.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rapid social change creates</text><text x="614.6666666666666" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anomie; sects offer certainty</text><text x="614.6666666666666" y="502.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and community.</text>
</svg>