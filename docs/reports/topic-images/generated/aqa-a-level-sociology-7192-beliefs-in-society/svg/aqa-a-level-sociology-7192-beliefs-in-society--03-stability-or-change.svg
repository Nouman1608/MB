<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554" width="900" height="554" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="554" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Religion: stability or change?</text>

<rect x="30" y="104" width="404" height="424" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A conservative force</text><circle cx="53" cy="185.12" r="4.5" fill="#2e6b62"/><text x="66" y="190.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Durkheim:</tspan> Arunta totemism; worshipping the</text><text x="66" y="211.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">totem is worshipping society, reinforcing</text><text x="66" y="232.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the collective conscience</text><circle cx="53" cy="256.12" r="4.5" fill="#2e6b62"/><text x="66" y="261.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Malinowski:</tspan> rituals for dangerous ocean</text><text x="66" y="282.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fishing, not safe lagoon fishing; coping</text><text x="66" y="303.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with stress and life crises</text><circle cx="53" cy="327.12" r="4.5" fill="#2e6b62"/><text x="66" y="332.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Parsons:</tspan> legitimates core values; makes</text><text x="66" y="353.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sense of suffering</text><circle cx="53" cy="377.12" r="4.5" fill="#2e6b62"/><text x="66" y="382.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bellah:</tspan> US civil religion integrates many</text><text x="66" y="403.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">faiths</text><circle cx="53" cy="427.12" r="4.5" fill="#2e6b62"/><text x="66" y="432.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marx:</tspan> "opium of the people"; divine right</text><text x="66" y="453.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of kings; karma and caste</text><circle cx="53" cy="477.12" r="4.5" fill="#2e6b62"/><text x="66" y="482.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Feminism:</tspan> male-dominated organisations</text><text x="66" y="503.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Woodhead disagrees)</text><rect x="466" y="104" width="404" height="424" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A force for change</text><circle cx="489" cy="185.12" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Weber:</tspan> the Protestant ethic helped produce</text><text x="502" y="211.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the spirit of capitalism</text><circle cx="489" cy="235.12" r="4.5" fill="#8a6d0d"/><text x="502" y="240.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bruce:</tspan> Black churches in the US civil</text><text x="502" y="261.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rights movement; the New Christian Right</text><text x="502" y="282.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">largely unsuccessful</text><circle cx="489" cy="306.12" r="4.5" fill="#8a6d0d"/><text x="502" y="311.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Maduro:</tspan> religion can be relatively</text><text x="502" y="332.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">autonomous; liberation theology in Latin</text><text x="502" y="353.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">America</text><circle cx="489" cy="377.12" r="4.5" fill="#8a6d0d"/><text x="502" y="382.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bloch:</tspan> religion’s "dual character":</text><text x="502" y="403.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protest as well as acceptance</text><circle cx="489" cy="427.12" r="4.5" fill="#8a6d0d"/><text x="502" y="432.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Worsley:</tspan> cargo cults in Melanesia as early</text><text x="502" y="453.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anti-colonial protest</text><circle cx="450" cy="316" r="24" fill="#1e2a44"/><text x="450" y="323" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text>
</svg>