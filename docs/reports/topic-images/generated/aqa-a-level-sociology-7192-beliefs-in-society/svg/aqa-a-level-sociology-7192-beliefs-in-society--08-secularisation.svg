<rect width="900" height="743" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is Britain secularising?</text>

<text x="30" y="120" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">England and Wales census, % of people</text><text x="30" y="182" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Christian</text><rect x="150" y="150" width="593" height="34" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="753" y="174" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">59.3% (2011)</text><rect x="150" y="192" width="462" height="34" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="622" y="216" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">46.2% (2021)</text><text x="30" y="298" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No</text><text x="30" y="320" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">religion</text><rect x="150" y="266" width="252" height="34" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="412" y="290" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">25.2% (2011)</text><rect x="150" y="308" width="372" height="34" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="532" y="332" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">37.2% (2021)</text><rect x="30" y="376" width="412" height="234" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,426 L31.25,390.25 Q31.25,377.25 44.25,377.25 L427.75,377.25 Q440.75,377.25 440.75,390.25 L440.75,426 Z" fill="#b5d3cf"/><line x1="31.25" y1="426" x2="440.75" y2="426" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="406.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Explaining decline</text><circle cx="49" cy="451.92" r="4.5" fill="#2e6b62"/><text x="62" y="457.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Weber:</tspan> rationalisation, disenchantment</text><circle cx="49" cy="480.92" r="4.5" fill="#2e6b62"/><text x="62" y="486.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Parsons:</tspan> structural differentiation</text><circle cx="49" cy="509.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="515.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Berger:</tspan> diversity undermines the "sacred</text><text x="62" y="536.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">canopy"</text><circle cx="49" cy="559.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="565.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bruce:</tspan> technological worldview; diversity</text><rect x="458" y="376" width="412" height="234" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,426 L459.25,390.25 Q459.25,377.25 472.25,377.25 L855.75,377.25 Q868.75,377.25 868.75,390.25 L868.75,426 Z" fill="#f2e7b8"/><line x1="459.25" y1="426" x2="868.75" y2="426" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="406.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Arguments against</text><circle cx="477" cy="451.92" r="4.5" fill="#2e6b62"/><text x="490" y="457.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Davie:</tspan> believing without belonging</text><circle cx="477" cy="480.92" r="4.5" fill="#2e6b62"/><text x="490" y="486.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Lyon:</tspan> religion relocated into consumption</text><text x="490" y="507.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and media</text><circle cx="477" cy="530.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="536.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Stark and Bainbridge:</tspan> religious market</text><text x="490" y="557.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">theory</text><circle cx="477" cy="580.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="586.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Norris and Inglehart:</tspan> existential security</text><rect x="30" y="628" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="664" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common error</text><text x="56" y="693" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Do not use church attendance as the only measure. Discuss belief, belonging and identity.</text>
</svg>