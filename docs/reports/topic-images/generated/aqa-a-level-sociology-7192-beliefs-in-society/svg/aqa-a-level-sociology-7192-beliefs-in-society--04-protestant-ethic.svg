<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weber: The Protestant Ethic (1905)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">religion as a force for change</text>
<rect x="30" y="120" width="175.5" height="151" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="117.75" y="164.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Predestination</text><text x="117.75" y="194.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Calvinist belief</text><text x="117.75" y="215.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">that only some are</text><text x="117.75" y="236.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">chosen</text><line x1="209.5" y1="195.5" x2="247.5" y2="195.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="251.5" y="120" width="175.5" height="151" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="339.25" y="174.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Anxiety</text><text x="339.25" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">about whether one</text><text x="339.25" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">is saved</text><line x1="431" y1="195.5" x2="469" y2="195.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="120" width="175.5" height="151" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="560.75" y="152.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Signs of being</text><text x="560.75" y="176.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">chosen</text><text x="560.75" y="206.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">hard work in a</text><text x="560.75" y="227.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">calling and</text><text x="560.75" y="248.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">ascetic saving</text><line x1="652.5" y1="195.5" x2="690.5" y2="195.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="694.5" y="120" width="175.5" height="151" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="782.25" y="162.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Spirit of</text><text x="782.25" y="186.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">capitalism</text><text x="782.25" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">this-worldly work</text><text x="782.25" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">plus self-denial</text><rect x="30" y="293" width="412" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,343 L31.25,307.25 Q31.25,294.25 44.25,294.25 L427.75,294.25 Q440.75,294.25 440.75,307.25 L440.75,343 Z" fill="#dce9e7"/><line x1="31.25" y1="343" x2="440.75" y2="343" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="323.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Weber’s comparison</text><text x="44" y="374.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hinduism and Confucianism lacked this</text><text x="44" y="395.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">combination of this-worldly work and</text><text x="44" y="416.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-denial.</text><rect x="458" y="293" width="412" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,343 L459.25,307.25 Q459.25,294.25 472.25,294.25 L855.75,294.25 Q868.75,294.25 868.75,307.25 L868.75,343 Z" fill="#f2e7b8"/><line x1="459.25" y1="343" x2="868.75" y2="343" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="323.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><circle cx="477" cy="368.92" r="4.5" fill="#2e6b62"/><text x="490" y="374.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kautsky (Marxist): capitalism came before</text><text x="490" y="395.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Calvinism</text><circle cx="477" cy="418.92" r="4.5" fill="#2e6b62"/><text x="490" y="424.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some Calvinist societies did not develop</text><text x="490" y="445.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">capitalism quickly</text><rect x="30" y="487" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="523" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common error</text><text x="56" y="552" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weber did not say Calvinism caused capitalism on its own. He called it one cause among</text><text x="56" y="574" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">others.</text>
</svg>